<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala Giochi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #120a1f;
    --bg-deep: #0b0614;
    --surface: #1d1230;
    --surface-2: #28193f;
    --line: #3a2858;
    --text: #f6efe4;
    --muted: #b6a8c8;
    --amber: #ffb000;
    --accent: #ff3d6e;
    --cyan: #3de0ff;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-deep); }
  body {
    margin: 0;
    min-height: 100vh;
    padding-inline: 16px;
    padding-block: 28px 48px;
    font: 16px/1.5 var(--body);
    color: var(--text);
    background:
      radial-gradient(ellipse 900px 420px at 50% -80px, rgba(255, 61, 110, .22), transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.025) 79px 80px),
      var(--bg);
  }
  .page { max-width: 1240px; margin: 0 auto; display: grid; gap: 32px; }

  /* ---------- Insegna luminosa ---------- */
  .marquee {
    position: relative;
    justify-self: center;
    width: min(100%, 760px);
    padding: 26px 28px 22px;
    text-align: center;
    border-radius: 18px;
    background: linear-gradient(180deg, #2a1440, #1a0d2b);
    border: 3px solid var(--amber);
    box-shadow: 0 0 0 6px var(--bg-deep), 0 0 0 8px var(--line), 0 0 40px rgba(255, 176, 0, .25);
  }
  .bulbs {
    position: absolute; inset: 7px; pointer-events: none;
    border-radius: 12px;
    background:
      radial-gradient(circle, #ffe7a3 0 2.5px, transparent 3.5px) 0 0 / 22px 22px repeat-x,
      radial-gradient(circle, #ffe7a3 0 2.5px, transparent 3.5px) 0 100% / 22px 22px repeat-x;
    background-size: 22px 8px, 22px 8px;
    background-position: 11px 0, 0 100%;
    opacity: .9;
    animation: blink 1.4s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .bulbs { animation: none; } }
  .kicker {
    font: 13px/1 var(--mono);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  h1 {
    margin: 10px 0 6px;
    font: clamp(40px, 9vw, 84px)/1 var(--display);
    letter-spacing: .02em;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(255, 176, 0, .55), 0 4px 0 #8a3a00;
    text-wrap: balance;
  }
  .tagline { margin: 0; color: var(--muted); font-size: 17px; }
  .tagline b { color: var(--text); font-weight: 600; }

  /* ---------- Griglia dei cabinati ---------- */
  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
    list-style: none;
    margin: 0; padding: 0;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 640px) {
    .card.featured { grid-column: span 2; }
    .card.featured .cover { aspect-ratio: 32 / 13; }
  }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-within {
    transform: translateY(-3px);
    border-color: var(--hue);
    box-shadow: 0 10px 30px -10px var(--hue);
  }
  @media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
  .cover {
    position: relative;
    display: block;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--bg-deep);
    border-bottom: 3px solid var(--hue);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 10px; right: 10px;
    font: 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    padding: 6px 9px; border-radius: 6px;
    color: #1a0d2b; background: var(--amber);
  }
  .body { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; flex: 1; }
  .genre {
    font: 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
    color: var(--hue);
  }
  h2 { margin: 0; font: 24px/1.1 var(--display); letter-spacing: .01em; text-wrap: balance; }
  .desc { margin: 0; color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chips li {
    font: 12px/1 var(--mono); letter-spacing: .06em;
    padding: 5px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .scores {
    display: grid; grid-template-columns: repeat(3, 1fr);
    margin: 4px 0 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg-deep);
    font-family: var(--mono);
  }
  .scores div { padding: 7px 8px; text-align: center; min-width: 0; }
  .scores div + div { border-left: 1px solid var(--line); }
  .scores dt { font-size: 10px; letter-spacing: .14em; color: var(--muted); }
  .scores dd { margin: 2px 0 0; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--text); }
  .scores dd.none { color: #6d5d85; }
  .scores-label { font: 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .play {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 14px;
    border-radius: 10px;
    font: 17px/1 var(--display); letter-spacing: .06em;
    color: #1a0d2b; background: var(--hue);
    text-decoration: none;
    box-shadow: 0 4px 0 rgba(0,0,0,.45);
  }
  .play:hover { filter: brightness(1.1); }
  .play:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .play:focus-visible, .cover:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

  .game-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 50; background: #000; }
  footer { text-align: center; color: var(--muted); font-size: 14px; }
  footer p { margin: 0; }
  footer .mono { font-family: var(--mono); letter-spacing: .08em; }
</style>
</head>
<body>
<main class="page">
  <header class="marquee">
    <div class="bulbs" aria-hidden="true"></div>
    <div class="kicker">Inserisci gettone · 1 credito</div>
    <h1>Sala Giochi</h1>
    <p class="tagline"><b>14 giochi arcade</b> da giocare nel browser, con tastiera o touch. Scegli un cabinato e premi Gioca.</p>
  </header>

  <ul class="grid" id="grid"></ul>

  <footer>
    <p>I record restano salvati in questo browser. <span class="mono">F · N · D</span> = Facile, Normale, Difficile.</p>
  </footer>
</main>

<script>
(() => {
  const GAMES = [
    { id: "difesa-del-castello", title: "Difesa del Castello", genre: "Tower defense", hue: "#e8a33a", badge: "Nuovo", featured: true,
      desc: "Costruisci e potenzia torri lungo il sentiero per fermare goblin, troll e pipistrelli. Tre mappe, e alla fine di ognuna un drago.",
      chips: ["Mouse", "Touch", "Tastiera", "Anche in verticale"], rec: { key: "castello-best-", kind: "score" } },
    { id: "scie-di-luce", title: "Scie di Luce", genre: "Duello di moto", hue: "#3de0ff", badge: "2 giocatori", featured: true,
      desc: "Moto di luce che lasciano una scia invalicabile: chiudi gli avversari in trappola. Contro il computer o in due sullo stesso dispositivo.",
      chips: ["Tastiera", "Touch", "Versus 1 contro 1"], rec: { key: "scie-best-", kind: "score" } },
    { id: "spara-bolle", title: "Spara Bolle", genre: "Puzzle", hue: "#5fd4ff",
      desc: "Spara bolle colorate: tre dello stesso colore scoppiano e quelle rimaste appese cadono. Libera 12 soffitti prima che scendano.",
      chips: ["Mouse", "Touch", "Tastiera", "Anche in verticale"], rec: { key: "bolle-best-", kind: "score" } },
    { id: "pioggia-di-meteore", title: "Pioggia di Meteore", genre: "Difesa", hue: "#ffb03a",
      desc: "Difendi sei città da una pioggia di meteore lanciando fuochi d'artificio: anticipa le traiettorie e prendine tante in un colpo solo.",
      chips: ["Mouse", "Touch", "Tastiera"], rec: { key: "meteore-best-", kind: "score" } },
    { id: "rana-in-fuga", title: "Rana in Fuga", genre: "Attraversamento", hue: "#6ee06e", pos: "50% 100%",
      desc: "Porta cinque ranocchie a casa: schiva il traffico, salta su tronchi e tartarughe, attento al serpente e al coccodrillo.",
      chips: ["Tastiera", "Touch", "Anche in verticale"], rec: { key: "rana-best-", kind: "score" } },
    { id: "spaccamattoni", title: "Spaccamattoni", genre: "Rompi-mattoni", hue: "#ff7ad9",
      desc: "Rompi 9 muri di mattoni con pallina e racchetta, raccogli laser e multi-palla, poi abbatti il Guardiano.",
      chips: ["Mouse", "Tastiera", "Touch", "Anche in verticale"], rec: { key: "spaccamattoni-best-", kind: "score" } },
    { id: "blocchi-cadenti", title: "Blocchi Cadenti", genre: "Puzzle", hue: "#6f8bff",
      desc: "Incastra i blocchi che cadono e completa le righe. Quadruple, T-spin e combo: ogni 10 righe si accelera.",
      chips: ["Tastiera", "Touch", "Anche in verticale"], rec: { key: "blocchi-best-", kind: "score" } },
    { id: "pugni-di-fuoco", title: "Pugni di Fuoco", genre: "Picchiaduro", hue: "#ff3d6e", badge: "2 giocatori",
      desc: "Cinque lottatori, mosse speciali e super. Scala il torneo fino al Maestro Oscuro o sfida un amico sullo stesso dispositivo.",
      chips: ["Tastiera", "Touch", "Versus 1 contro 1"], rec: { key: "pugni-best-", kind: "score" } },
    { id: "space-defender", title: "Space Defender", genre: "Sparatutto spaziale", hue: "#3de0ff",
      desc: "Respingi le ondate aliene, raccogli i power-up e abbatti il boss ogni cinque ondate.",
      chips: ["Tastiera", "Touch"], rec: { key: "space-defender-hiscore", kind: "score", sd: true } },
    { id: "crystal-wars", title: "Guerra dei Cristalli", genre: "Strategia in tempo reale", hue: "#7dff9a",
      desc: "Raccogli cristalli, costruisci caserme e torri, addestra l'esercito e rade al suolo la base nemica.",
      chips: ["Mouse", "Touch", "Meglio in orizzontale"], rec: { key: "crystal-wars-best-", kind: "time" } },
    { id: "volpe-saltante", title: "Volpe Saltante", genre: "Piattaforme", hue: "#ff9a3d",
      desc: "Quattro livelli di salti e monete, dai prati verdi fino al castello del Lupo Re.",
      chips: ["Tastiera", "Touch"], rec: { key: "volpe-saltante-best-", kind: "score" } },
    { id: "lama-d-oro", title: "Lama d'Oro", genre: "Picchiaduro a scorrimento", hue: "#ffb000",
      desc: "Guerriero, amazzone o nano: magie, cavalcature e un'ultima battaglia contro il Re Oscuro.",
      chips: ["Tastiera", "Touch"], rec: { key: "lama-doro-best-", kind: "score" } },
    { id: "corsa-al-tramonto", title: "Corsa al Tramonto", genre: "Corse", hue: "#ff6a3d",
      desc: "Cinque tappe contro il cronometro, tra traffico e curve, dalla costa al deserto, dalle Alpi alla città di notte.",
      chips: ["Tastiera", "Touch"], rec: { key: "corsa-tramonto-best-", kind: "time", decimals: true } },
    { id: "topo-goloso", title: "Topo Goloso", genre: "Labirinto", hue: "#b98cff",
      desc: "Mangia tutte le briciole senza farti prendere dai gatti. Con le fette grandi sei tu il cacciatore.",
      chips: ["Tastiera", "Touch", "Anche in verticale"], rec: { key: "topo-goloso-best-", kind: "score" } },
  ];
  const DIFFS = [["facile", "F"], ["normale", "N"], ["difficile", "D"]];

  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function keyFor(rec, d) {
    if (rec.sd) return d === "normale" ? rec.key : `${rec.key}-${d}`;
    return rec.key + d;
  }
  function fmt(rec, raw) {
    if (rec.kind === "time") {
      const s = parseFloat(raw);
      if (!(s > 0)) return null;
      const m = Math.floor(s / 60), r = s - m * 60;
      const sec = rec.decimals ? r.toFixed(1).padStart(4, "0") : String(Math.floor(r)).padStart(2, "0");
      return `${m}:${sec}`;
    }
    const n = parseInt(raw, 10);
    return n > 0 ? n.toLocaleString("it-IT") : null;
  }
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  const grid = document.getElementById("grid");
  const render = () => { grid.innerHTML = GAMES.map((g) => {
    const href = `games/${g.id}/index.html`;
    const cells = DIFFS.map(([d, short]) => {
      const v = fmt(g.rec, load(keyFor(g.rec, d)));
      return `<div><dt>${short}</dt><dd class="${v ? "" : "none"}">${v || "—"}</dd></div>`;
    }).join("");
    const recLabel = g.rec.kind === "time" ? "Miglior tempo" : "Record";
    return `<li class="card${g.featured ? " featured" : ""}" style="--hue:${g.hue}">
      <a class="cover" href="${href}" tabindex="-1" aria-hidden="true">
        <img src="games/${g.id}/cover.jpg" alt="" width="640" height="360" loading="lazy"${g.pos ? ` style="object-position:${g.pos}"` : ""}>
        ${g.badge ? `<span class="badge">${esc(g.badge)}</span>` : ""}
      </a>
      <div class="body">
        <span class="genre">${esc(g.genre)}</span>
        <h2>${esc(g.title)}</h2>
        <p class="desc">${esc(g.desc)}</p>
        <ul class="chips">${g.chips.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        <span class="scores-label">${recLabel}</span>
        <dl class="scores">${cells}</dl>
        <a class="play" href="${href}">▶ Gioca</a>
      </div>
    </li>`;
  }).join(""); };
  render();

  // Games open full screen inside this page (loaded with fetch into an iframe), so they also work
  // where leaving the page is not allowed; if loading fails we fall back to a normal link.
  let frame = null;
  function closeGame() {
    if (!frame) return;
    frame.remove(); frame = null;
    document.documentElement.style.overflow = "";
    render();
  }
  async function openGame(href) {
    const res = await fetch(href);
    if (!res.ok) throw new Error(res.status);
    let html = await res.text();
    const base = new URL(href, location.href).href;
    html = html.replace("<head>", `<head><base href="${base}">`)
      .replace('href="../../index.html"', 'href="#" onclick="parent.postMessage(\'sala-giochi:chiudi\', \'*\'); return false;"');
    frame = document.createElement("iframe");
    frame.className = "game-frame";
    frame.title = "Gioco";
    frame.setAttribute("allow", "autoplay; fullscreen");
    frame.srcdoc = html;
    document.body.appendChild(frame);
    document.documentElement.style.overflow = "hidden";
    frame.addEventListener("load", () => { try { frame.contentWindow.focus(); } catch { /* ignore */ } });
  }
  grid.addEventListener("click", (e) => {
    const a = e.target.closest("a.play, a.cover");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    openGame(a.getAttribute("href")).catch(() => { closeGame(); location.href = a.getAttribute("href"); });
  });
  window.addEventListener("message", (e) => { if (e.data === "sala-giochi:chiudi") closeGame(); });
})();
</script>
</body>
</html>

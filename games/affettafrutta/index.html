<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Affettafrutta</title>
<style>
  :root {
    --bg: #1a100a;
    --fg: #f4f6ee;
    --muted: #e8d4c0;
    --pink: #ff8a3a;
    --yellow: #5ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: crosshair; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a3a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 16, 10, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a1a0a, 0 0 22px rgba(255,138,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 13px; padding: 7px 14px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1002; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a84a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the fruit: size, skin, flesh, and how it is drawn
  const FRUITS = {
    mela:     { r: 22, skin: "#d8283a", flesh: "#fff0c8", rim: "#d8283a", juice: "#fff0c8" },
    arancia:  { r: 23, skin: "#ff8a1a", flesh: "#ffb040", rim: "#ff8a1a", juice: "#ffa030" },
    anguria:  { r: 33, skin: "#2a8a3a", flesh: "#ff3a4a", rim: "#e8f8c8", juice: "#ff3a4a" },
    limone:   { r: 20, skin: "#ffe03a", flesh: "#fff7a0", rim: "#ffe03a", juice: "#fff7a0" },
    kiwi:     { r: 20, skin: "#8a6a3a", flesh: "#7ac83a", rim: "#8a6a3a", juice: "#9ae04a" },
    cocco:    { r: 25, skin: "#6a4a2a", flesh: "#ffffff", rim: "#5a3a1a", juice: "#f4f4f0" },
    fragola:  { r: 18, skin: "#e8203a", flesh: "#ff8a9a", rim: "#e8203a", juice: "#ff4a6a" },
    prugna:   { r: 19, skin: "#7a2a8a", flesh: "#f8d040", rim: "#7a2a8a", juice: "#c83aa8" },
    banana:   { r: 24, skin: "#ffd83a", flesh: "#fff4c8", rim: "#ffd83a", juice: "#fff4c8" },
  };
  const KINDS = ["mela", "arancia", "anguria", "limone", "kiwi", "cocco", "fragola", "prugna", "banana"];
  // the special bananas of the Arcade mode
  const SPECIAL = {
    gelo: { col: "#5ac8ff", text: "GELO!", sub: "tutto rallenta per 5 secondi" },
    frenesia: { col: "#ff4a3a", text: "FRENESIA!", sub: "frutta da tutti i lati per 5 secondi" },
    doppio: { col: "#ffd23a", text: "PUNTI DOPPI!", sub: "per 7 secondi" },
  };
  const MODES = { classico: "CLASSICO", arcade: "ARCADE" };
  const MODE_KEY = "affetta-modo";

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "la frutta vola più lenta · meno bombe · ondate più piccole", g: 430, bomb: 0.6, pace: 0.85, grow: 24, most: 5 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "la frutta come al mercato", g: 520, bomb: 1, pace: 1, grow: 15, most: 6 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "la frutta vola più veloce · più bombe · ondate più grandi", g: 610, bomb: 1.35, pace: 1.15, grow: 11, most: 7 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "affetta-difficulty";
  const bestKey = (id) => `affetta-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = false;
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    swish: lim(() => beep(rnd(700, 1000), 0.08, "triangle", 0.02, -500)),
    cut: lim(() => { beep(rnd(160, 220), 0.09, "square", 0.04, -100); beep(rnd(1200, 1600), 0.05, "triangle", 0.02, -600); }),
    boom: () => { beep(70, 0.6, "sawtooth", 0.09, -40); beep(140, 0.3, "square", 0.06, -100); },
    miss: lim(() => beep(120, 0.18, "triangle", 0.06, -60)),
    throw: lim(() => beep(rnd(240, 300), 0.06, "triangle", 0.015, 120)),
    combo: (n) => arp([523, 659, 784, 1047, 1319, 1568].slice(0, Math.min(6, n)), 0.05, 0.1, "square", 0.04),
    special: () => arp([784, 1047, 1319, 1568, 2093], 0.05, 0.12, "triangle", 0.05),
    life: () => arp([659, 880, 1319], 0.08, 0.14, "square", 0.04),
    end: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    hit: lim(() => beep(rnd(400, 700), 0.05, "square", 0.03, 200)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let mode = MODES[load(MODE_KEY)] ? load(MODE_KEY) : "classico";
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, cuts = 0, missed = 0, row = 0, bestCombo = 0, lifeAt = 500, level = 0;
  let fruits = [], halves = [], drops = [], stains = [], popups = [], flashes = [], message = null;
  let timeLeft = 60, waveT = 1, queue = [], slow = 0, frenzy = 0, double = 0, frenzyT = 0, ending = null, endT = 0, bombT = 0;
  // the blade: the points of the stroke, newest last
  let blade = [], bladeDown = false, bladeX = W / 2, bladeY = H / 2, stroke = 0, strokeCut = 0, stillT = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const isPlaying = () => state === "play";

  // ---------- Throwing the fruit ----------
  function launch(kind, opts = {}) {
    const f = FRUITS[kind] || FRUITS.banana;
    const x0 = opts.x ?? rnd(90, W - 90), y0 = opts.y ?? H + 30;
    const peak = rnd(TOP + 40, 170);
    const vy = opts.vy ?? -Math.sqrt(2 * diff.g * (y0 - peak));
    const t = -2 * vy / diff.g;
    const vx = opts.vx ?? (W / 2 - x0) / t * rnd(0.2, 1);
    fruits.push({ kind, r: kind === "bomba" ? 20 : kind === "melagrana" ? 34 : f.r, x: x0, y: y0, vx, vy, a: rnd(0, TAU), va: rnd(-3, 3), special: opts.special || null, seen: false, hits: 0 });
    sfx.throw();
  }
  function pickFruit() { return KINDS[Math.floor(Math.random() * KINDS.length)]; }
  // a wave: several at once, or one after the other; sometimes a bomb among them
  function newWave() {
    const n = clamp(1 + Math.floor(level / 2) + Math.floor(Math.random() * (2 + Math.min(3, level / 3))), 1, diff.most);
    const pBomb = Math.min(0.28, (0.05 + level * 0.018) * diff.bomb);
    const together = Math.random() < 0.55;
    queue = [];
    for (let i = 0; i < n; i++) {
      const bomb = level > 0 && Math.random() < pBomb;
      let special = null;
      if (mode === "arcade" && !bomb && Math.random() < 0.07) special = ["gelo", "frenesia", "doppio"][Math.floor(Math.random() * 3)];
      queue.push({ kind: bomb ? "bomba" : special ? "banana" : pickFruit(), special, t: together ? rnd(0, 0.15) : i * rnd(0.22, 0.38) / diff.pace });
    }
    // never only bombs
    if (queue.every((q) => q.kind === "bomba")) queue[0].kind = pickFruit();
  }

  // ---------- The game ----------
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = 3; cuts = 0; missed = 0; row = 0; bestCombo = 0; lifeAt = 500; level = 0;
    fruits = []; halves = []; drops = []; stains = []; popups = []; flashes = []; queue = [];
    timeLeft = 60; waveT = 1.2; slow = 0; frenzy = 0; double = 0; ending = null; endT = 0;
    blade = []; bladeDown = false; strokeCut = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    message = { text: mode === "arcade" ? "60 SECONDI!" : "VIA!", sub: mode === "arcade" ? "taglia più frutta che puoi · le banane colorate sono speciali" : "non farne cadere neanche una · attenzione alle bombe!", t: 0 };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function gain(n, x, y, col = "#ffffff") {
    const pts = n * (double > 0 ? 2 : 1);
    score += pts;
    popups.push({ text: `+${pts}`, x, y, t: 0, col });
    // the Classic mode gives a life back every 500 points
    if (mode === "classico" && score >= lifeAt) { lifeAt += 500; if (lives < 3) { lives++; sfx.life(); popups.push({ text: "+1 VITA", x: W - 60, y: 46, t: 0, col: "#5aff7a" }); } }
  }
  function cutFruit(f, ang) {
    const k = FRUITS[f.kind] || FRUITS.banana;
    f.dead = true;
    cuts++; row++; strokeCut++;
    if (row >= 100 && mode === "classico") impresa("cento");
    sfx.cut();
    const nx = -Math.sin(ang), ny = Math.cos(ang);
    for (const s of [1, -1]) halves.push({ kind: f.kind, special: f.special, r: f.r, x: f.x + nx * s * 4, y: f.y + ny * s * 4, vx: f.vx * 0.6 + nx * s * 60, vy: Math.min(f.vy, 0) * 0.4 + ny * s * 60 - 40, a: ang + (s < 0 ? Math.PI : 0), va: s * rnd(1.5, 4), t: 0 });
    for (let i = 0; i < 14; i++) { const a = rnd(0, TAU), v = rnd(40, 220); drops.push({ x: f.x, y: f.y, vx: Math.cos(a) * v + f.vx * 0.3, vy: Math.sin(a) * v - 60, t: 0, col: k.juice, r: rnd(1.5, 3.5) }); }
    stains.push({ x: f.x, y: f.y, r: f.r * rnd(1, 1.4), col: k.juice, t: 0, a: rnd(0, TAU) });
    if (stains.length > 30) stains.shift();
    gain(10, f.x, f.y - f.r, f.special ? SPECIAL[f.special].col : "#ffffff");
    if (f.special) {
      const s = SPECIAL[f.special];
      if (f.special === "gelo") slow = 5; else if (f.special === "frenesia") { frenzy = 5; frenzyT = 0; } else double = 7;
      sfx.special();
      message = { text: s.text, sub: s.sub, t: 0, col: s.col };
    }
  }
  function hitBomb(f) {
    f.dead = true;
    sfx.boom();
    flashes.push({ x: f.x, y: f.y, t: 0 });
    for (let i = 0; i < 24; i++) { const a = rnd(0, TAU), v = rnd(60, 320); drops.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, col: i % 2 ? "#ffd23a" : "#ff6a3a", r: rnd(2, 4) }); }
    row = 0;
    if (mode === "classico") {
      // a bomb ends the Classic game
      for (const o of fruits) if (!o.dead && o !== f) o.frozen = true;
      ending = "bomba"; endT = 0; bladeDown = false; blade = [];
      message = { text: "BOOM!", sub: "hai tagliato una bomba", t: 0, col: "#ff5a3a", long: true };
    } else {
      score = Math.max(0, score - 10);
      popups.push({ text: "-10", x: f.x, y: f.y, t: 0, col: "#ff5a3a" });
      for (const o of fruits) if (!o.dead && o.kind !== "bomba") { o.dead = true; }
    }
  }
  // the blade: a new piece of stroke from (x0, y0) to (x1, y1)
  function slice(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 2) return;
    const ang = Math.atan2(dy, dx);
    for (const f of fruits) {
      if (f.dead || f.frozen) continue;
      const t = clamp(((f.x - x0) * dx + (f.y - y0) * dy) / (L * L), 0, 1);
      const d = Math.hypot(x0 + dx * t - f.x, y0 + dy * t - f.y);
      if (d > f.r * (f.kind === "bomba" ? 0.8 : 1)) continue;
      if (f.kind === "bomba") { hitBomb(f); if (ending) return; continue; }
      if (f.kind === "melagrana") {
        // the pomegranate takes a blow at every pass
        if (clock - (f.lastHit || 0) < 0.07) continue;
        f.lastHit = clock; f.hits++; f.shake = 0.15; sfx.hit();
        score += 10 * (double > 0 ? 2 : 1);
        popups.push({ text: "+10", x: f.x + rnd(-20, 20), y: f.y - 30, t: 0, col: "#ff6a8a" });
        for (let i = 0; i < 4; i++) { const a = rnd(0, TAU), v = rnd(60, 180); drops.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, col: "#d8203a", r: rnd(1.5, 3) }); }
        continue;
      }
      cutFruit(f, ang);
    }
  }
  function endStroke() {
    if (strokeCut >= 3) {
      const bonus = strokeCut * 10;
      gain(bonus, W / 2, 120, "#ffd23a");
      sfx.combo(strokeCut);
      message = { text: `COMBO ×${strokeCut}`, sub: `+${bonus * (double > 0 ? 2 : 1)} punti`, t: 0 };
      bestCombo = Math.max(bestCombo, strokeCut);
      if (strokeCut >= 6) impresa("combo");
    }
    strokeCut = 0;
  }
  function bladeTo(x, y) {
    if (!bladeDown) return;
    const p = blade[blade.length - 1];
    if (p && Math.hypot(x - p.x, y - p.y) < 1) return;
    if (p) { if (Math.hypot(x - p.x, y - p.y) > 30 && Math.random() < 0.3) sfx.swish(); slice(p.x, p.y, x, y); stillT = 0; }
    blade.push({ x, y, t: clock });
  }
  function bladeStart(x, y) { if (!isPlaying() || ending) return; endStroke(); bladeDown = true; blade = [{ x, y, t: clock }]; bladeX = x; bladeY = y; }
  function bladeEnd() { bladeDown = false; endStroke(); }

  // ---------- Update ----------
  function update(rdt) {
    clock += rdt; sfxN = 0;
    if (window.__bot) window.__bot(rdt);
    for (const p of popups) { p.t += rdt; p.y -= 30 * rdt; }
    popups = popups.filter((p) => p.t < 1);
    for (const s of stains) s.t += rdt;
    stains = stains.filter((s) => s.t < 6);
    for (const f of flashes) f.t += rdt;
    flashes = flashes.filter((f) => f.t < 0.6);
    if (message) { message.t += rdt; if (message.t > (message.long ? 3 : 2)) message = null; }
    blade = blade.filter((p) => clock - p.t < 0.14);
    if (state !== "play") return;
    // the keyboard blade: arrows move it, SPACE held cuts
    if (keys.left || keys.right || keys.up || keys.down) {
      bladeX = clamp(bladeX + ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 620 * rdt, 0, W);
      bladeY = clamp(bladeY + ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * 620 * rdt, TOP, H);
      bladeTo(bladeX, bladeY);
    }
    // a still blade ends the stroke (for the combos)
    stillT += rdt; if (stillT > 0.15 && strokeCut) endStroke();
    if (ending) { endingStep(rdt); return; }
    slow = Math.max(0, slow - rdt); frenzy = Math.max(0, frenzy - rdt); double = Math.max(0, double - rdt);
    const dt = rdt * (slow > 0 ? 0.45 : 1);
    if (mode === "arcade") {
      timeLeft -= rdt;
      level = Math.min(8, Math.floor((60 - timeLeft) / 9));
      if (timeLeft <= 0) { timeLeft = 0; startPomegranate(); return; }
    } else level = Math.min(10, Math.floor(cuts / diff.grow));
    // waves
    for (const q of queue) { q.t -= dt; if (q.t <= 0 && !q.done) { q.done = true; launch(q.kind, { special: q.special }); } }
    queue = queue.filter((q) => !q.done);
    const live = fruits.some((f) => !f.dead);
    waveT -= dt;
    if (!queue.length && (mode === "arcade" ? waveT <= 0 : (!live && waveT <= 0) || waveT < -3.2)) { newWave(); waveT = (mode === "arcade" ? rnd(1.2, 1.9) : 0.55) / diff.pace; }
    if (frenzy > 0) { frenzyT -= dt; if (frenzyT <= 0) { frenzyT = 0.16; const left = Math.random() < 0.5; launch(pickFruit(), { x: left ? -30 : W + 30, y: rnd(170, 300), vx: (left ? 1 : -1) * rnd(260, 380), vy: -rnd(260, 380) }); } }
    // flight

  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#1a0a04"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(26,16,10,0.92)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e8d4c0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 70, 9);
    ctx.fillStyle = "#ff8a3a"; ctx.font = "900 9px system-ui"; ctx.fillText(`${MODES[mode]} · ${cuts} FRUTTI`, x0 + 70, 20);
    ctx.textAlign = "center";
    const cx = touchMode ? 400 : 330;
    if (mode === "arcade") { ctx.font = "900 18px system-ui"; ctx.fillStyle = timeLeft < 10 && Math.floor(clock * 4) % 2 ? "#ff5a5a" : "#ffffff"; ctx.fillText(`${Math.ceil(timeLeft)}″`, cx, 15); }
    else for (let i = 0; i < 3; i++) { const on = i >= lives; ctx.font = `900 ${on ? 18 : 14}px system-ui`; ctx.fillStyle = on ? "#ff3a3a" : "rgba(255,255,255,0.3)"; ctx.fillText("✕", cx - 26 + i * 26, 15); }
    const bx = touchMode ? 440 : 400;
    let n = 0;
    for (const [v, s, col] of [[slow, "GELO", "#5ac8ff"], [frenzy, "FRENESIA", "#ff4a3a"], [double, "×2", "#ffd23a"]]) if (v > 0) { ctx.fillStyle = col; ctx.font = "900 10px system-ui"; ctx.fillText(`${s} ${Math.ceil(v)}`, bx + 30 + n * 64, 14); n++; }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawBoard();
    if (state === "menu") {
      // fruit thrown in the background of the title
      if (Math.random() < 0.02 && fruits.length < 4) launch(pickFruit());
      for (const f of fruits) { f.vy += diff.g / 60; f.x += f.vx / 60; f.y += f.vy / 60; f.a += f.va / 60; if (f.y > H + 60 && f.vy > 0) f.dead = true; }
      fruits = fruits.filter((f) => !f.dead);
      drawFruit();
      return;
    }
    drawFruit();
    drawBlade();
    drawHud();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); outlined(p.text, p.x, p.y, "900 14px system-ui", p.col, 4); }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2) - message.t) * 2);
      outlined(message.text, W / 2, 80, "italic 900 28px system-ui", message.col || "#ff8a3a", 6);
      if (message.sub) outlined(message.sub, W / 2, 102, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="affetta-best-" data-kind="score"></script>

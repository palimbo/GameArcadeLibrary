<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Set e Match</title>
<style>
  :root {
    --bg: #0c1420;
    --fg: #f6f8ff;
    --muted: #a8b4c8;
    --ball: #e4ff3a;
    --blue: #3a8aff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1c2a40, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(246, 248, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to run (and aim the shot), TIRA to swing, PALLONETTO for a lob */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(58, 138, 255, 0.6); background: radial-gradient(circle, rgba(58,138,255,0.14), rgba(58,138,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(58, 138, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(246,248,255,0.25); pointer-events: none; }
  #touch .btns { display: flex; gap: 10px; align-items: flex-end; }
  #touch .btn { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .hit { width: 92px; height: 92px; border: 2px solid rgba(228, 255, 58, 0.9); background: rgba(228, 255, 58, 0.2); }
  #touch .lob { width: 70px; height: 70px; font-size: 8px; letter-spacing: 0; margin-bottom: 64px; border: 2px solid rgba(58, 200, 255, 0.9); background: rgba(58, 200, 255, 0.2); }
  #touch .btn.on { filter: brightness(1.8); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .hit { width: 78px; height: 78px; }
  #touch.small .lob { width: 60px; height: 60px; margin-bottom: 54px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 20, 32, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 10vw, 60px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--ball);
    text-shadow: 3px 3px 0 #2a4a10, 0 0 22px rgba(228,255,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--ball); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(246,248,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--ball); color: #1a2a0a; background: var(--ball); padding: 11px 30px; box-shadow: 0 4px 0 #7a8a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="btn lob" aria-label="Pallonetto">PALLONETTO</button>
    <button type="button" class="btn hit" aria-label="Tira">TIRA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TAU = Math.PI * 2;
  // the court in metres: x across (singles lines at ±HALF), y from your baseline (0) to the far one (L), z up
  const L = 23.77, HALF = 4.115, DHALF = 5.485, NET_Y = L / 2, NET_H = 0.914, SVC = 6.4, GRAV = 12;
  const GAMES_TO_WIN = 3;
  // perspective: the camera sits behind your baseline
  const K = 30, CX = W / 2, PC = 0.0344, PA = 778, PH = -298;
  const sc = (y) => 1 / (1 + PC * y);
  const PX = (x, y) => CX + x * K * sc(y);
  const PY = (y, z = 0) => PH + PA * sc(y) - z * K * sc(y);

  const SURFACES = [
    { name: "Torneo del Cemento", court: "#2a6ac8", out: "#2a8a5a", stands: "#3a2a4a", bz: 0.62, keep: 0.5 },
    { name: "Torneo della Terra Rossa", court: "#c8643a", out: "#b8583a", stands: "#2a3a2a", bz: 0.7, keep: 0.42 },
    { name: "Torneo dell'Erba", court: "#4aa83a", out: "#3a9030", stands: "#2a2a3a", bz: 0.52, keep: 0.58 },
  ];
  const ROUNDS = ["Primo turno", "Quarti di finale", "Semifinale", "Finale"];
  const OPPONENTS = [
    { name: "PINO", skill: 0.1, shirt: "#ffb03a", hair: "#5a3a1a" },
    { name: "GIGI", skill: 0.3, shirt: "#3ad0ff", hair: "#1a1a1a" },
    { name: "SANDRO", skill: 0.5, shirt: "#c86aff", hair: "#e8c85a" },
    { name: "IL BARONE", skill: 0.7, shirt: "#ff3a5a", hair: "#8a8a8a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "avversari più lenti e fallosi · racchetta più lunga", skill: -0.25, reach: 1.5, speed: 7 },
    normale:   { label: "NORMALE",   color: "#e4ff3a", desc: "avversari equilibrati", skill: 0, reach: 1.3, speed: 6.6 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "avversari veloci e precisi fin dal primo turno", skill: 0.25, reach: 1.2, speed: 6.4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "setmatch-difficulty";
  const bestKey = (id) => `setmatch-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const gauss = () => { let u = 0; for (let k = 0; k < 6; k++) u += Math.random(); return (u - 3) / Math.sqrt(0.5); };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    hit: lim((p) => { noise(0.05, 0.14, 1400 + p * 600); beep(220 + p * 120, 0.05, "triangle", 0.05); }),
    swing: lim(() => noise(0.08, 0.03, 3000)),
    bounce: lim(() => beep(160, 0.04, "sine", 0.05)),
    net: lim(() => noise(0.15, 0.08, 500)),
    toss: lim(() => beep(600, 0.05, "sine", 0.02, 200)),
    won: () => arp([659, 784, 1047], 0.07, 0.12),
    lost: () => arp([330, 262], 0.1, 0.16, "triangle", 0.05),
    fault: () => beep(880, 0.25, "square", 0.03),
    game: () => arp([523, 659, 784, 1047, 1319], 0.08, 0.14),
    match: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.1, 0.2),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, bestCache = 0, tour = 0, roundIdx = 0, opp = OPPONENTS[0], surf = SURFACES[0], skill = 0;
  let pts = { p: 0, c: 0 }, games = { p: 0, c: 0 }, server = "p", faults = 0, serveSub = "ready", cpuServeT = 0, matchWon = false;
  let ball = null, P = null, C = null, message = null, popups = [], parts = [], crowd = [];
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  const other = (w) => (w === "p" ? "c" : "p");
  const sideOf = (y) => (y < NET_Y ? "p" : "c");
  const inCourt = (x, y) => Math.abs(x) <= HALF + 0.05 && y >= -0.05 && y <= L + 0.05;
  const deuceSide = () => (pts.p + pts.c) % 2 === 0;
  // the service box the ball must land in: diagonal from the server's side
  function serveBox() {
    const rightSign = deuceSide() ? 1 : -1; // server's right, from their point of view
    if (server === "p") { const sx = -rightSign; return { x0: sx < 0 ? -HALF : 0, x1: sx < 0 ? 0 : HALF, y0: NET_Y, y1: NET_Y + SVC }; }
    const sx = rightSign; return { x0: sx < 0 ? -HALF : 0, x1: sx < 0 ? 0 : HALF, y0: NET_Y - SVC, y1: NET_Y };
  }
  const inBox = (bx, x, y) => x >= bx.x0 - 0.05 && x <= bx.x1 + 0.05 && y >= bx.y0 - 0.05 && y <= bx.y1 + 0.05;

  // ---------- Ball physics (also used to look ahead) ----------
  function physStep(b, dt, withNet) {
    const py = b.y;
    b.vz -= GRAV * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    let ev = null;
    if (withNet && (py - NET_Y) * (b.y - NET_Y) < 0 && b.z < NET_H + 0.04 && Math.abs(b.x) < DHALF + 0.5) {
      b.y = py; b.vy *= -0.15; b.vx *= 0.3; ev = "net";
    }
    if (b.z < 0 && b.vz < 0) {
      b.z = 0; b.vz = -b.vz * surf.bz; b.vx *= surf.keep; b.vy *= surf.keep;
      if (b.vz < 0.8) b.vz = 0;
      ev = ev || "bounce";
    }
    if (b.z <= 0 && b.vz === 0) { b.vx *= 1 - 1.5 * dt; b.vy *= 1 - 1.5 * dt; }
    return ev;
  }
  // where can `who` hit the ball? (the top of its bounce, or before it flies past)
  function predict(who) {
    const b = { x: ball.x, y: ball.y, z: ball.z, vx: ball.vx, vy: ball.vy, vz: ball.vz };
    // already bounced on this side: it can be hit from here on
    let land = ball.bounces[who] >= 1 ? { x: ball.x, y: ball.y } : null, t = 0;
    const back = who === "p" ? (y) => y < -2 : (y) => y > L + 2;
    for (let i = 0; i < 720; i++) {
      const ev = physStep(b, 1 / 120, false); t += 1 / 120;
      if (ev === "bounce") {
        if (sideOf(b.y) !== who) { if (land) break; continue; }
        if (land) break;
        land = { x: b.x, y: b.y };
      }
      if (land && ((b.vz <= 0 && b.z < 2) || back(b.y))) return { x: b.x, y: b.y, z: b.z, t, land };
    }
    if (!land) return null;
    return { x: b.x, y: b.y, z: b.z, t, land };
  }
  // send the ball to (tx, ty); `margin` is how high over the net it must clear (can be negative = into the net)
  function calcShot(tx, ty, v, arcT, margin) {
    const dx = tx - ball.x, dy = ty - ball.y, D = Math.hypot(dx, dy);
    let T = arcT || D / v, vz = 0;
    for (let it = 0; it < 30; it++) {
      vz = (0.5 * GRAV * T * T - ball.z) / T;
      if ((ball.y - NET_Y) * (ty - NET_Y) < 0) {
        const tn = (NET_Y - ball.y) / (dy / T), zn = ball.z + vz * tn - 0.5 * GRAV * tn * tn;
        if (zn < NET_H + margin) { T *= 1.06; continue; }
      }
      break;
    }
    ball.vx = dx / T; ball.vy = dy / T; ball.vz = vz;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "serve", "rally", "point", "fault", "matchEnd"].includes(state);
  function makePlayer(isCpu) {
    return { x: 0, y: 0, tx: 0, ty: 0, swing: 0, swingCd: 0, face: isCpu ? 1 : -1, run: 0, cpu: isCpu, react: 0, leave: false, lob: false };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; tour = 0; roundIdx = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = makePlayer(false); C = makePlayer(true);
    beginMatch();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMatch() {
    opp = OPPONENTS[roundIdx];
    surf = SURFACES[tour % SURFACES.length];
    skill = clamp(opp.skill + tour * 0.25 + diff.skill, 0, 1.4);
    pts = { p: 0, c: 0 }; games = { p: 0, c: 0 }; server = "p";
    crowd = [];
    for (let i = 0; i < 90; i++) crowd.push({ x: rnd(-13, 13), row: Math.floor(rnd(0, 3)), c: ["#ff6a6a", "#ffe04a", "#6ab0ff", "#f4f4f4", "#6ae86a", "#ff9ad0"][i % 6], ph: rnd(0, TAU) });
    message = { text: ROUNDS[roundIdx].toUpperCase(), sub: `${surf.name} · contro ${opp.name}`, t: 0 };
    ball = { x: 0, y: -1, z: 1, vx: 0, vy: 0, vz: 0, live: false, serve: false, hitter: "p", bounces: { p: 0, c: 0 }, touches: 0 };
    setupPoint();
    state = "intro"; stateT = 2.4;
  }
  function setupPoint() { faults = 0; setupServe(); }
  function setupServe() {
    const right = deuceSide() ? 1 : -1;
    // the server stands behind their baseline on their right, the receiver diagonally opposite
    if (server === "p") { P.x = right * 1.2; P.y = -0.5; C.x = -right * 2.4; C.y = L + 1.2; }
    else { C.x = -right * 1.2; C.y = L + 0.5; P.x = right * 2.4; P.y = -1.2; }
    P.tx = P.x; P.ty = P.y; C.tx = C.x; C.ty = C.y; C.leave = false; P.swing = C.swing = 0;
    const S = server === "p" ? P : C;
    Object.assign(ball, { x: S.x + 0.35 * (server === "p" ? 1 : -1), y: S.y + (server === "p" ? 0.3 : -0.3), z: 1.0, vx: 0, vy: 0, vz: 0, live: false, serve: false, bounces: { p: 0, c: 0 }, touches: 0, held: true });
    serveSub = "ready"; cpuServeT = rnd(0.8, 1.3);
    if (state !== "intro") state = "serve";
  }
  function toss() {
    if (serveSub !== "ready") return;
    serveSub = "toss"; ball.held = false; ball.vz = 6.2; sfx.toss();
  }
  function hitServe(who, q) {
    const S = who === "p" ? P : C, bx = serveBox();
    const cxBox = (bx.x0 + bx.x1) / 2;
    let tx, ty;
    if (who === "p") {
      const aimX = clamp(stick.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), -1, 1);
      tx = cxBox + aimX * 1.35; ty = NET_Y + SVC - 1.4;
    } else {
      tx = cxBox + rnd(-1, 1) * (1.2 + 0.4 * Math.min(1, skill)); ty = NET_Y - SVC + 1.4;
    }
    const bad = 1 - q;
    tx += gauss() * (0.15 + 1.1 * bad); ty += gauss() * (0.3 + 1.3 * bad) * (who === "p" ? 1 : -1);
    const speed = 20 + 8 * q + (who === "c" ? skill * 2 : 0);
    calcShot(tx, ty, speed, 0, 0.12 - bad * 0.45 + gauss() * 0.1);
    Object.assign(ball, { live: true, serve: true, hitter: who, bounces: { p: 0, c: 0 }, touches: 0 });
    S.swing = 0.3; sfx.hit(q);
    serveSub = "done"; state = "rally";
    C.react = who === "p" ? Math.max(0.1, 0.34 - 0.16 * skill) : -1;
    if (who === "c") { C.tx = C.x * 0.3; C.ty = L + 1.2; }
  }
  function addScore(n, x, y, color = "#f6f8ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 10, sp = 80, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  const NAMES = ["0", "15", "30", "40"];
  function scoreText() {
    if (pts.p >= 3 && pts.c >= 3) {
      if (pts.p === pts.c) return "PARITÀ";

    ctx.fillStyle = "rgba(20,20,20,0.55)";
    ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x0, ey); ctx.lineTo(CX, ty); ctx.lineTo(x1, ey); ctx.lineTo(x1, gy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 0.6;
    for (let x = x0; x < x1; x += 4) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, x < CX ? ey + (ty - ey) * (x - x0) / (CX - x0) : ty + (ey - ty) * (x - CX) / (x1 - CX)); ctx.stroke(); }
    ctx.strokeStyle = "#f4f4f4"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x0, ey); ctx.lineTo(CX, ty); ctx.lineTo(x1, ey); ctx.stroke();
    ctx.fillStyle = "#d8d8d8"; ctx.fillRect(x0 - 2, ey, 3, gy - ey); ctx.fillRect(x1 - 1, ey, 3, gy - ey);
  }
  function drawPerson(S, shirt, hair, isCpu) {
    const s = sc(S.y), fx = PX(S.x, S.y), fy = PY(S.y), u = K * s;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(fx, fy, 0.45 * u, 0.14 * u, 0, 0, TAU); ctx.fill();
    const step = Math.sin(S.run * 5) * 0.12 * u;
    // legs
    ctx.fillStyle = "#e8c8a0";
    ctx.fillRect(fx - 0.2 * u, fy - 0.8 * u + Math.max(0, step), 0.13 * u, 0.8 * u - Math.max(0, step));
    ctx.fillRect(fx + 0.07 * u, fy - 0.8 * u + Math.max(0, -step), 0.13 * u, 0.8 * u - Math.max(0, -step));
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(fx - 0.24 * u, fy - 0.12 * u, 0.2 * u, 0.12 * u); ctx.fillRect(fx + 0.04 * u, fy - 0.12 * u, 0.2 * u, 0.12 * u);
    // shorts and shirt
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(fx - 0.26 * u, fy - 1.0 * u, 0.52 * u, 0.3 * u);
    ctx.fillStyle = shirt; ctx.fillRect(fx - 0.3 * u, fy - 1.5 * u, 0.6 * u, 0.55 * u);
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(fx - 0.3 * u, fy - 1.5 * u, 0.6 * u, 0.55 * u);
    // head
    ctx.fillStyle = "#e8c8a0"; ctx.beginPath(); ctx.arc(fx, fy - 1.68 * u, 0.17 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(fx, fy - 1.72 * u, 0.17 * u, isCpu ? Math.PI : 0, isCpu ? TAU : Math.PI, isCpu); ctx.fill();
    if (!isCpu) { ctx.beginPath(); ctx.arc(fx, fy - 1.7 * u, 0.17 * u, 0, TAU); ctx.fill(); }
    // arm and racket: swings across when hitting
    const side = S.x < (ball ? ball.x : 0) ? 1 : -1;
    const sw = S.swing > 0 ? 1 - S.swing / 0.35 : 0;
    const a = (isCpu ? -1 : 1) * side * (-0.9 + sw * 2.2);
    const sx = fx + side * 0.3 * u, sy = fy - 1.35 * u;
    const hx = sx + Math.sin(a) * 0.45 * u * side, hy = sy + 0.25 * u;
    ctx.strokeStyle = "#e8c8a0"; ctx.lineWidth = 0.1 * u; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
    const rx = hx + Math.cos(a) * 0.55 * u * side, ry = hy - Math.abs(Math.sin(a)) * 0.2 * u - 0.1 * u;
    ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 0.06 * u; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.strokeStyle = isCpu ? "#2a2a2a" : "#e84a3a"; ctx.lineWidth = 0.07 * u;
    ctx.beginPath(); ctx.ellipse(rx + Math.cos(a) * 0.18 * u * side, ry, 0.2 * u, 0.26 * u, a * 0.5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  function drawBall() {
    const s = sc(ball.y), u = K * s;
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(PX(ball.x, ball.y), PY(ball.y), Math.max(1.8, 0.12 * u), Math.max(1, 0.06 * u), 0, 0, TAU); ctx.fill();
    const r = Math.max(2.2, 0.13 * u);
    const bx = PX(ball.x, ball.y), by = PY(ball.y, ball.z);
    ctx.fillStyle = "#e4ff3a"; ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(40,60,0,0.8)"; ctx.lineWidth = 1; ctx.stroke();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(8,14,24,0.92)"; ctx.fillRect(0, 0, W, 54);
    ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.font = "900 15px system-ui"; ctx.fillStyle = "#f6f8ff"; ctx.fillText(score.toLocaleString("it-IT"), 10, 14);
    ctx.font = "700 8px system-ui"; ctx.fillStyle = "#a8b4c8"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 10, 29);
    ctx.fillText(`${ROUNDS[roundIdx].toUpperCase()}`, 10, 43);
    // the scoreboard
    const bx = touchMode ? 150 : 196, rows = [["TU", "p", "#3a8aff"], [opp.name, "c", opp.shirt]];
    rows.forEach(([name, who, col], i) => {
      const y = 14 + i * 19;
      ctx.fillStyle = col; ctx.fillRect(bx - 8, y - 6, 4, 12);
      ctx.fillStyle = "#f6f8ff"; ctx.font = "800 10px system-ui"; ctx.textAlign = "left"; ctx.fillText(name, bx, y);
      if (server === who) { ctx.fillStyle = "#e4ff3a"; ctx.beginPath(); ctx.arc(bx + 82, y, 3, 0, TAU); ctx.fill(); }
      ctx.textAlign = "center"; ctx.font = "900 13px system-ui"; ctx.fillStyle = "#e4ff3a"; ctx.fillText(String(games[who]), bx + 100, y);
      let p = pts[who] >= 3 && pts[other(who)] >= 3 ? (pts[who] > pts[other(who)] ? "V" : "40") : NAMES[Math.min(3, pts[who])];
      ctx.fillStyle = "#f6f8ff"; ctx.fillText(p, bx + 128, y);
    });
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!ball) { P = makePlayer(false); C = makePlayer(true); P.x = 1.5; P.y = -1; C.x = -1; C.y = L + 1; ball = { x: 0.4, y: 8, z: 1.4, vx: 0, vy: 0, vz: 0, bounces: {}, held: false }; }
    drawCourt();
    const things = [
      { y: NET_Y, d: drawNet },
      { y: C.y, d: () => drawPerson(C, opp.shirt, opp.hair, true) },
      { y: P.y, d: () => drawPerson(P, "#3a8aff", "#4a2a1a", false) },
      { y: ball.y - 0.01, d: drawBall },
    ].sort((a, b) => b.y - a.y);
    for (const t of things) t.d();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4);
      ctx.textAlign = "center"; ctx.font = "900 12px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0c1420"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    let msg = message;
    if (state === "matchEnd") msg = { text: matchWon ? (roundIdx === ROUNDS.length - 1 ? "HAI VINTO IL TORNEO!" : "PARTITA VINTA!") : "PARTITA PERSA", sub: `${games.p} - ${games.c} contro ${opp.name}`, t: 0.5 };
    if (state === "serve" && server === "p" && !msg) msg = { text: "", sub: serveSub === "ready" ? "TIRA per lanciare la palla" : "TIRA quando la palla è in alto!", t: 0.5, small: true };
    if (msg) {
      ctx.globalAlpha = Math.min(1, (2.2 - msg.t) * 2);
      ctx.textAlign = "center";
      if (!msg.small) {
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 250, W, 60);
        ctx.font = "italic 900 26px system-ui"; ctx.fillStyle = "#e4ff3a";
        ctx.lineWidth = 5; ctx.strokeStyle = "#0c1420"; ctx.strokeText(msg.text, W / 2, 280); ctx.fillText(msg.text, W / 2, 280);
        if (msg.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f6f8ff"; ctx.fillText(msg.sub, W / 2, 300); }
      } else {
        ctx.font = "800 12px system-ui"; ctx.lineWidth = 4; ctx.strokeStyle = "#0c1420"; ctx.fillStyle = "#f6f8ff";
        ctx.strokeText(msg.sub, W / 2, H - 14); ctx.fillText(msg.sub, W / 2, H - 14);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="setmatch-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lama d'Oro</title>
<style>
  :root {
    --bg: #120d0a;
    --fg: #f6ecd9;
    --muted: #c2b39a;
    --gold: #f2c14e;
    --bad: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #pauseBtn {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: none;
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(18, 13, 10, 0.6); border: 1px solid rgba(246, 236, 217, 0.3);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  #touch { position: fixed; inset: 0; z-index: 2; display: none; }
  #stick { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); pointer-events: none; display: none; }
  #knob { position: absolute; width: 52px; height: 52px; border-radius: 50%; background: rgba(242,193,78,0.55); pointer-events: none; display: none; }
  #stickHint { position: absolute; left: 24px; bottom: 24px; color: rgba(255,255,255,0.45); font: 600 13px system-ui, sans-serif; pointer-events: none; }
  .tbtn {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 700 13px system-ui, sans-serif; color: #fff; text-align: center;
    border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.14);
  }
  .tbtn.on { background: rgba(242,193,78,0.5); border-color: var(--gold); }
  #bAtk { right: 22px; bottom: 26px; width: 84px; height: 84px; }
  #bJump { right: 118px; bottom: 16px; width: 66px; height: 66px; }
  #bMagic { right: 34px; bottom: 124px; width: 60px; height: 60px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 13, 10, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(38px, 9vw, 70px); color: var(--gold); letter-spacing: 3px; text-shadow: 0 3px 0 #7a4a0c, 0 0 24px rgba(242,193,78,0.35); }
  #overlay h2 { font-size: clamp(28px, 6vw, 46px); }
  #overlay h2.win { color: var(--gold); }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 580px; font-size: clamp(13px, 3.2vw, 17px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); font-family: system-ui, sans-serif; font-size: clamp(12px, 3vw, 15px); }
  #overlay .rotate { display: none; color: var(--gold); }
  @media (orientation: portrait) and (max-width: 700px) { #overlay .rotate { display: block; } }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px system-ui, sans-serif; letter-spacing: 1px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(246,236,217,0.3); border-radius: 8px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { background: var(--gold); border-color: var(--gold); color: #2a1804; padding: 10px 28px; }
  @media (max-height: 520px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 34px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #bAtk { width: 70px; height: 70px; bottom: 16px; }
    #bJump { width: 56px; height: 56px; right: 102px; bottom: 10px; }
    #bMagic { width: 52px; height: 52px; bottom: 96px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div id="stickHint">trascina qui per muoverti</div>
  <div id="stick"></div><div id="knob"></div>
  <div class="tbtn" id="bAtk" data-btn="attack">SPADA</div>
  <div class="tbtn" id="bJump" data-btn="jump">SALTO</div>
  <div class="tbtn" id="bMagic" data-btn="magic">MAGIA</div>
</div>
<button id="pauseBtn" type="button">❚❚ Pausa</button>
<div id="overlay"></div>

<script>
(() => {
  "use strict";

  // ---------- Constants ----------
  const VW = 800, VH = 450, BAND_TOP = 272, BAND_BOT = 434;
  const GRAV = 1300, MAX_POTIONS = 6;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici più deboli · attacca un nemico alla volta", lives: 5, dmg: 0.6, hp: 0.8, attackers: 1, potions: 2 },
    normale:   { label: "NORMALE",   color: "#f2c14e", desc: "3 vite · fino a 2 nemici attaccano insieme", lives: 3, dmg: 1, hp: 1, attackers: 2, potions: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "2 vite · nemici più forti · fino a 3 attaccano insieme", lives: 2, dmg: 1.4, hp: 1.25, attackers: 3, potions: 0 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "lama-doro-difficulty";
  const bestKey = (id) => `lama-doro-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

  const TYPES = {
    soldato:   { name: "Soldato",             hp: 50,  speed: 75,  dmg: 8,  range: 54,  windup: 0.45, cd: [1.2, 2.0], knock: false, score: 300 },
    scheletro: { name: "Scheletro",           hp: 35,  speed: 115, dmg: 6,  range: 50,  windup: 0.3,  cd: [0.9, 1.6], knock: false, score: 200 },
    cavaliere: { name: "Cavaliere",           hp: 110, speed: 58,  dmg: 14, range: 60,  windup: 0.6,  cd: [1.5, 2.4], knock: true,  score: 600 },
    drago:     { name: "Cavaliere del drago", hp: 60,  speed: 80,  dmg: 12, range: 110, windup: 0.55, cd: [1.8, 2.6], knock: true,  score: 500 },
    boss:      { name: "Signore dell'Ascia",  hp: 600, speed: 72,  dmg: 22, range: 96,  windup: 0.7,  cd: [0.9, 1.6], knock: true,  score: 5000 },
    gnomo:     { name: "Gnomo ladro",         hp: 1,   speed: 150, dmg: 0,  range: 0,   windup: 0,    cd: [9, 9],     knock: false, score: 100 },
  };

  const STAGES = [
    {
      name: "Il villaggio in fiamme", theme: "villaggio",
      waves: [
        { x: 300, spawn: ["soldato", "soldato"] },
        { x: 900, spawn: ["soldato", "scheletro", "soldato"], gnome: true },
        { x: 1500, spawn: ["drago", "soldato"] },
        { x: 2100, spawn: ["cavaliere", "soldato", "soldato"] },
      ],
    },
    {
      name: "La foresta oscura", theme: "foresta",
      waves: [
        { x: 300, spawn: ["scheletro", "scheletro", "scheletro"] },
        { x: 900, spawn: ["soldato", "soldato", "scheletro"], gnome: true },
        { x: 1500, spawn: ["drago", "scheletro", "scheletro"] },
        { x: 2100, spawn: ["cavaliere", "cavaliere", "scheletro"], gnome: true },
      ],
    },
    {
      name: "Il castello dell'Ascia", theme: "castello",
      waves: [
        { x: 300, spawn: ["cavaliere", "soldato", "scheletro"], gnome: true },
        { x: 900, spawn: ["drago", "drago"] },
        { x: 1500, spawn: ["cavaliere", "cavaliere", "scheletro", "scheletro"], gnome: true },
        { x: 2100, spawn: ["boss"], boss: true },
      ],
    },
  ];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const touchLayer = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1;
  function resize() {
    const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = VW * s + "px";
    canvas.style.height = VH * s + "px";
    canvas.width = Math.round(VW * pxRatio);
    canvas.height = Math.round(VH * pxRatio);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function noise(dur, vol = 0.08) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    gain.gain.value = vol;
    src.buffer = buf;
    src.connect(gain).connect(audioCtx.destination);
    src.start();
  }
  const sfx = {
    swing: () => beep(700, 0.08, "sawtooth", 0.025, -500),
    hit: () => { noise(0.08, 0.1); beep(140, 0.1, "square", 0.05, -60); },
    heavy: () => { noise(0.18, 0.14); beep(90, 0.2, "square", 0.07, -40); },
    hurt: () => beep(220, 0.25, "sawtooth", 0.06, -140),
    jump: () => beep(300, 0.12, "triangle", 0.05, 200),
    potion: () => [880, 1175].forEach((f, i) => setTimeout(() => beep(f, 0.1, "triangle", 0.06), i * 70)),
    meat: () => [440, 660].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.07), i * 80)),
    magic: () => { noise(0.9, 0.12); [196, 262, 330, 392].forEach((f, i) => setTimeout(() => beep(f, 0.4, "sawtooth", 0.05, 200), i * 100)); },
    fire: () => noise(0.35, 0.07),
    go: () => [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.12, "square", 0.04), i * 90)),
    roar: () => { beep(90, 0.8, "sawtooth", 0.09, -40); noise(0.5, 0.06); },
    clear: () => [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "square", 0.05), i * 120)),
    die: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.22, "sawtooth", 0.06), i * 160)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null;
  let stageIndex = 0, stage = null, cam = { x: 0 }, waveIdx = 0, wave = null, spawnQueue = [];
  let player = null, enemies = [], mounts = [], pickups = [], particles = [], popups = [], bolts = [];
  let lives = 3, score = 0, potions = 0, kills = 0, clock = 0, freeze = 0, shake = 0, flash = 0;
  let banner = null, goArrow = 0, stageTimer = 0, lastHit = null, magicFx = null;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Input ----------
  const keys = {};
  const pressed = { attack: false, jump: false, magic: false };
  const touch = { dx: 0, dy: 0, attack: false, jump: false, magic: false };
  const KEYMAP = { j: "attack", z: "attack", k: "jump", x: "jump", " ": "jump", l: "magic", c: "magic" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (k === "arrowleft") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 2) % 3]);
      else if (k === "arrowright") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 1) % 3]);
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { togglePause(); return; }
    if (!keys[k] && KEYMAP[k]) pressed[KEYMAP[k]] = true;
    keys[k] = true;
  });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (isPlaying()) togglePause(); });

  function readMove() {
    let dx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    let dy = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    if (touch.dx || touch.dy) { dx = touch.dx; dy = touch.dy; }
    return { dx, dy };
  }

  // Touch: floating stick on the left half, buttons on the right.
  const stickEl = document.getElementById("stick"), knobEl = document.getElementById("knob");
  let stickPtr = null, stickOrigin = null;
  touchLayer.addEventListener("pointerdown", (e) => {
    const btn = e.target.closest && e.target.closest("[data-btn]");
    if (btn) {
      const name = btn.dataset.btn;
      pressed[name] = true;
      touch[name] = true;
      btn.classList.add("on");
      btn._ptr = e.pointerId;
      return;
    }
    if (e.clientX < window.innerWidth * 0.55 && stickPtr === null) {
      stickPtr = e.pointerId;
      stickOrigin = { x: e.clientX, y: e.clientY };
      stickEl.style.display = knobEl.style.display = "block";
      stickEl.style.left = e.clientX - 60 + "px"; stickEl.style.top = e.clientY - 60 + "px";
      moveKnob(e.clientX, e.clientY);
    }
  });
  function moveKnob(x, y) {
    let dx = x - stickOrigin.x, dy = y - stickOrigin.y;
    const d = Math.hypot(dx, dy), max = 50;
    if (d > max) { dx = (dx / d) * max; dy = (dy / d) * max; }
    knobEl.style.left = stickOrigin.x + dx - 26 + "px"; knobEl.style.top = stickOrigin.y + dy - 26 + "px";
    touch.dx = Math.abs(dx) > 12 ? Math.sign(dx) * Math.min(1, Math.abs(dx) / 35) : 0;
    touch.dy = Math.abs(dy) > 12 ? Math.sign(dy) * Math.min(1, Math.abs(dy) / 35) : 0;
  }
  touchLayer.addEventListener("pointermove", (e) => { if (e.pointerId === stickPtr) moveKnob(e.clientX, e.clientY); });
  function releasePointer(e) {
    if (e.pointerId === stickPtr) {
      stickPtr = null; touch.dx = touch.dy = 0;
      stickEl.style.display = knobEl.style.display = "none";
    }
    for (const b of touchLayer.querySelectorAll("[data-btn]")) {
      if (b._ptr === e.pointerId) { b._ptr = null; b.classList.remove("on"); touch[b.dataset.btn] = false; }
    }
  }
  for (const ev of ["pointerup", "pointercancel"]) touchLayer.addEventListener(ev, releasePointer);
  let touchMode = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); } }, true);
  function syncControls() {
    const playing = isPlaying();
    touchLayer.style.display = playing && touchMode ? "block" : "none";
    pauseBtn.style.display = playing ? "block" : "none";
  }
  pauseBtn.addEventListener("click", () => togglePause());

  // ---------- Entities ----------
  function makeFighter(team, type, x, y) {
    const t = TYPES[type];
    const hp = team === 0 ? 100 : Math.round(t.hp * diff.hp);
    return {
      team, type, x, y, z: 0, vx: 0, vz: 0, face: 1, hp, maxHp: hp,
      state: "idle", t: 0, cd: rand(0.5, 1.5), flash: 0, invuln: 0, anim: Math.random() * 6,
      combo: 0, lastAtk: -9, hitDone: false, hitIds: null, mount: null, dead: false, deadT: 0,
    };
  }
  function makeMount(x, y) { return { x, y, face: -1, rider: null, state: "idle", t: 0, vx: 0, anim: 0 }; }

  function spawnEnemy(type) {
    const fromLeft = type === "gnomo" ? true : type === "boss" ? false : Math.random() < 0.35;
    const x = fromLeft ? cam.x - 50 : cam.x + VW + 50;
    const e = makeFighter(1, type, x, rand(BAND_TOP + 10, BAND_BOT - 10));
    e.face = fromLeft ? 1 : -1;
    e.homeY = e.y;
    if (type === "drago") {
      const m = makeMount(x, e.y);
      m.rider = e;
      e.mount = m;
      mounts.push(m);
    }
    if (type === "gnomo") { e.state = "walk"; e.sack = difficulty === "facile" ? 2 : 1; }
    if (type === "boss") { e.state = "intro"; e.t = 1.5; sfx.roar(); showBanner("Il Signore dell'Ascia!", "#ff5a4a", 2.4); shake = 0.5; }
    enemies.push(e);
    return e;
  }

  // ---------- Game flow ----------
  const isPlaying = () => state === "playing" || state === "clear";

  function startGame() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; }
    }
    lives = diff.lives; score = 0; kills = 0; potions = diff.potions;
    player = null;
    loadStage(0);
    state = "playing";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }

  function loadStage(i) {
    stageIndex = i;
    stage = STAGES[i];
    cam.x = 0; waveIdx = 0; wave = null; spawnQueue = [];
    enemies = []; mounts = []; pickups = []; particles = []; popups = []; bolts = [];
    magicFx = null; lastHit = null; goArrow = 0;
    const hp = player ? player.hp : 100;
    player = makeFighter(0, "hero", 120, 350);
    player.hp = Math.max(hp, 60);
    player.invuln = 1;
    showBanner(`Livello ${i + 1}: ${stage.name}`, "#f2c14e", 2.6);
  }

  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }

  function endGame(won) {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const reached = stageIndex + 1, played = diff.label;
    menu = () => showOverlay(
      `<h2 class="${won ? "win" : "lose"}">${won ? "VITTORIA!" : "GAME OVER"}</h2>
       <p>${won ? "Hai sconfitto il Signore dell'Ascia e liberato il regno!" : `Sei caduto nel livello ${reached}: ${STAGES[reached - 1].name}`} · ${played}</p>
       <p>Punteggio: <b>${score}</b> · Nemici sconfitti: ${kills}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
    if (won) sfx.clear(); else sfx.die();
  }

  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best}` : ""}</p>`;
  }
  function setDifficulty(id) {
    if (!DIFFICULTIES[id]) return;
    difficulty = id; diff = DIFFICULTIES[id];
    store(DIFF_KEY, id);
    if (menu) menu();
  }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>LAMA D'ORO</h1>
       <p>Il Signore dell'Ascia ha invaso il regno. Attraversa il villaggio, la foresta e il suo castello, sconfiggi i suoi soldati e affrontalo nel suo trono.</p>
       <p class="muted">Tastiera: frecce o WASD per muoverti · J o Z spada (premi più volte per la combo) · K, X o SPAZIO salto (spada in aria per l'attacco in salto) · L o C magia · P pausa<br>
       Colpisci gli gnomi ladri per rubare le pozioni blu: la magia le usa tutte, più ne hai più è potente. Disarciona i cavalieri dei draghi e cavalca il drago: la spada diventa fuoco!</p>
       <p class="rotate">Suggerimento: ruota il telefono in orizzontale</p>
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  function showBanner(text, color = "#f6ecd9", t = 2) { banner = { text, color, t }; }
  function popup(x, y, text, color = "#fff") { popups.push({ x, y, text, color, t: 0 }); }
  function burst(x, y, color, n = 10, speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * speed;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 500, life: 0.3 + Math.random() * 0.4, max: 0.7, color, size: 2 + Math.random() * 3 });
    }
  }

  // ---------- Combat ----------
  function damage(t, dmg, src, knock) {
    if (t.dead || t.invuln > 0 || t.state === "down") return false;
    if (t.team === 1 && t.type === "gnomo") { stealFrom(t, src); return true; }
    t.hp -= dmg;
    t.flash = 0.12;
    freeze = Math.max(freeze, knock ? 0.08 : 0.045);
    burst(t.x + (src ? -src.face * 6 : 0), t.y - t.z - 40, t.team === 0 ? "#ff6a4a" : "#fff2c0", knock ? 12 : 6, knock ? 200 : 120);
    if (t.team === 1) lastHit = { e: t, t: 2.5 };
    const armored = t.type === "boss";
    if (t.hp <= 0) knock = true;
    if (t.team === 0) {
      sfx.hurt();
      shake = Math.max(shake, 0.15);
      if (t.mount) dismount(t);
    } else (knock ? sfx.heavy : sfx.hit)();
    if (armored && t.hp > 0) return true; // the boss shrugs off stagger
    const dir = src ? Math.sign(t.x - src.x) || src.face : -t.face;
    if (knock) {
      if (t.mount && t.team === 1) dismount(t);
      t.state = "down"; t.t = t.hp <= 0 ? 1.1 : 0.9;
      t.vx = dir * 190; t.vz = 280; t.z = Math.max(t.z, 1);
    } else {
      t.state = "hurt"; t.t = 0.28; t.vx = dir * 70;
    }
    return true;
  }

  // Hits every target in front of `att`; returns how many were hit.
  function strike(att, range, depth, dmg, knock, zTol = 36) {
    const targets = att.team === 0 ? enemies : [player];
    let n = 0;
    for (const t of targets) {
      if (t.dead || t === att) continue;
      const dx = (t.x - att.x) * att.face;
      if (dx < -12 || dx > range) continue;
      if (Math.abs(t.y - att.y) > depth) continue;
      if (Math.abs(t.z - att.z) > zTol) continue;
      if (att.hitIds) { if (att.hitIds.has(t)) continue; att.hitIds.add(t); }
      if (damage(t, dmg, att, knock)) n++;
    }
    return n;
  }

  function stealFrom(g, src) {
    if (g.sack <= 0) return;
    for (let i = 0; i < g.sack; i++) pickups.push({ kind: "potion", x: g.x + rand(-20, 20), y: clamp(g.y + rand(-10, 10), BAND_TOP, BAND_BOT), z: 30, vz: 220 });
    g.sack = 0;
    g.flash = 0.2;
    g.speedBoost = 1.8;
    g.face = 1;
    score += TYPES.gnomo.score;
    sfx.hit();
    popup(g.x, g.y - 60, "Pozione!", "#6ab4ff");
  }

  function dismount(rider) {
    const m = rider.mount;
    if (!m) return;
    m.rider = null;
    m.state = "run"; m.t = 1.1; m.vx = (rider.team === 0 ? -rider.face : rider.face) * 150;
    rider.mount = null;
    if (rider.team === 1) rider.type = "soldato";
  }

  function castMagic() {
    const p = player;
    const level = potions;
    potions = 0;
    p.state = "magic"; p.t = 1.3; p.invuln = 1.6;
    magicFx = { t: 1.3, level, applied: false };
    flash = 0.35;
    sfx.magic();
    showBanner(`MAGIA DEL TUONO · livello ${level}`, "#9fd0ff", 1.4);
  }
  function applyMagic() {
    const lvl = magicFx.level;
    bolts = [];
    for (const e of enemies) {
      if (e.dead || e.x < cam.x - 20 || e.x > cam.x + VW + 20) continue;
      bolts.push({ x: e.x, y: e.y, t: 0.5 });
      if (e.type === "gnomo") continue;
      const dmg = 22 * lvl * (e.type === "boss" ? 0.5 : 1);
      e.invuln = 0;
      damage(e, dmg, player, true);
    }
    shake = 0.5;
    flash = 0.5;
  }

  // ---------- Updates ----------
  function physics(f, dt) {
    f.x += f.vx * dt;
    if (f.z > 0 || f.vz > 0) {
      f.z += f.vz * dt;
      f.vz -= GRAV * dt;
      if (f.z <= 0) { f.z = 0; f.vz = 0; }
    }
  }

  function updatePlayer(dt) {
    const p = player;
    p.invuln = Math.max(0, p.invuln - dt);
    p.flash = Math.max(0, p.flash - dt);
    p.anim += dt;
    const mv = readMove();

    if (p.state === "down") {
      physics(p, dt); p.vx *= 0.92; p.t -= dt;
      if (p.t <= 0 && p.z === 0) {
        if (p.hp <= 0) { loseLife(); return; }
        p.state = "idle"; p.invuln = 1;
      }
      return;
    }
    if (p.state === "hurt") { p.t -= dt; physics(p, dt); p.vx *= 0.85; if (p.t <= 0) p.state = "idle"; return; }
    if (p.state === "magic") {
      p.t -= dt;
      if (magicFx && !magicFx.applied && p.t < 0.8) { magicFx.applied = true; applyMagic(); }
      if (p.t <= 0) { p.state = "idle"; magicFx = null; }
      return;
    }
    if (p.state === "attack" || p.state === "breath") {
      p.t += dt;
      const heavy = p.combo === 3;
      const hitAt = p.state === "breath" ? 0.15 : heavy ? 0.16 : 0.09;
      const dur = p.state === "breath" ? 0.6 : heavy ? 0.42 : 0.26;
      if (p.state === "breath" && p.t > 0.1 && p.t < 0.45) {
        for (let i = 0; i < 3; i++) particles.push({ x: p.x + p.face * 40, y: p.y - 50, vx: p.face * rand(220, 360), vy: rand(-40, 30), g: -60, life: 0.35, max: 0.35, color: Math.random() < 0.5 ? "#ffb02e" : "#ff5a1a", size: rand(4, 8) });
      }
      if (!p.hitDone && p.t >= hitAt) {
        p.hitDone = true;
        if (p.state === "breath") { sfx.fire(); strike(p, 120, 30, 18, true); }
        else { sfx.swing(); strike(p, heavy ? 66 : 58, 22, heavy ? 20 : 12, heavy); }
      }
      if (pressed.attack && p.t > 0.08) { p.queued = true; pressed.attack = false; }
      if (p.t >= dur) {
        p.state = "idle";
        p.lastAtk = clock;
        if (p.queued && p.combo < 3 && p.state !== "breath") { p.queued = false; startAttack(); }
        p.queued = false;
      }
      return;
    }
    // Airborne
    if (p.z > 0 || p.vz > 0) {
      p.vx = mv.dx * 150;
      p.y = clamp(p.y + mv.dy * 70 * dt, BAND_TOP, BAND_BOT);
      if (mv.dx) p.face = Math.sign(mv.dx);
      physics(p, dt);
      if (pressed.attack && !p.airAtk) { p.airAtk = true; p.hitIds = new Set(); sfx.swing(); }
      if (p.airAtk && p.vz < 200) strike(p, 56, 24, 18, true, 70);
      if (p.z === 0) { p.state = "idle"; p.airAtk = false; p.hitIds = null; p.vx = 0; }
      clampToScreen(p);
      return;
    }
    // On the ground
    p.vx = 0;
    if (pressed.magic && potions > 0 && !p.mount) castMagic();
    else if (pressed.attack) startAttack();
    else if (pressed.jump && !p.mount) { p.vz = 470; p.z = 0.01; p.airAtk = false; p.state = "jump"; sfx.jump(); }
    else {
      const speed = p.mount ? 130 : 150;
      p.x += mv.dx * speed * dt;
      p.y = clamp(p.y + mv.dy * 100 * dt, BAND_TOP, BAND_BOT);
      if (mv.dx) p.face = Math.sign(mv.dx);
      p.state = mv.dx || mv.dy ? "walk" : "idle";
      if (!p.mount) {
        for (const m of mounts) {
          if (!m.rider && m.state === "idle" && Math.abs(m.x - p.x) < 34 && Math.abs(m.y - p.y) < 16) {
            m.rider = p; p.mount = m;
            popup(p.x, p.y - 90, "In sella!", "#7dff9a");
            sfx.go();
            break;
          }
        }
      }
      for (const it of pickups) {
        if (it.taken || it.z > 5 || Math.abs(it.x - p.x) > 26 || Math.abs(it.y - p.y) > 16) continue;
        if (it.kind === "potion") {
          if (potions >= MAX_POTIONS) continue;
          it.taken = true; potions++; sfx.potion(); popup(it.x, it.y - 40, "+1 pozione", "#6ab4ff");
        } else {
          it.taken = true; p.hp = Math.min(100, p.hp + 35); sfx.meat(); popup(it.x, it.y - 40, "+35 vita", "#7dff9a");
        }
      }
    }
    clampToScreen(p);
  }

  function startAttack() {
    const p = player;
    pressed.attack = false;
    p.hitDone = false;
    p.t = 0;
    if (p.mount) { p.state = "breath"; p.combo = 1; return; }
    p.combo = clock - p.lastAtk < 0.3 && p.combo < 3 ? p.combo + 1 : 1;
    p.state = "attack";
  }

  function clampToScreen(f) {
    f.x = clamp(f.x, cam.x + 24, cam.x + VW - 24);
  }

  function loseLife() {
    lives--;
    if (lives <= 0) { endGame(false); return; }
    const p = player;
    p.hp = 100; p.state = "idle"; p.invuln = 2.5; p.z = 0; p.vz = 0;
    showBanner(`Vite rimaste: ${lives}`, "#ff5a4a", 1.6);
    // Clear some room around the hero.
    for (const e of enemies) if (!e.dead && e.type !== "gnomo" && Math.abs(e.x - p.x) < 140) { e.invuln = 0; damage(e, 0, p, true); }
  }

  function updateEnemy(e, dt) {
    const T = TYPES[e.type];
    e.flash = Math.max(0, e.flash - dt);
    e.invuln = Math.max(0, e.invuln - dt);
    e.anim += dt;
    if (e.dead) { e.deadT += dt; return; }

    if (e.type === "gnomo") {
      const sp = T.speed * (e.speedBoost || 0.55);
      e.x += sp * dt;
      e.state = "walk";
      if (e.x > cam.x + VW + 80) e.dead = true, e.deadT = 9;
      return;
    }

    if (e.state === "down") {
      physics(e, dt); e.vx *= 0.92; e.t -= dt;
      if (e.t <= 0 && e.z === 0) {
        if (e.hp <= 0) {
          e.dead = true; e.deadT = 0; kills++;
          score += T.score;
          popup(e.x, e.y - 70, `+${T.score}`, "#f2c14e");
          if (Math.random() < 0.12) pickups.push({ kind: "meat", x: e.x, y: e.y, z: 20, vz: 200 });
          if (e.type === "boss") bossDefeated(e);
        } else { e.state = "walk"; e.invuln = 0.4; e.cd = rand(0.4, 1); }
      }
      return;
    }
    if (e.state === "hurt") { e.t -= dt; physics(e, dt); e.vx *= 0.85; if (e.t <= 0) e.state = "walk"; return; }
    if (e.state === "intro") { e.t -= dt; e.x -= 60 * dt; e.face = -1; if (e.t <= 0) e.state = "walk"; return; }

    const p = player;
    const dx = p.x - e.x, dy = p.y - e.y;
    e.cd -= dt;

    if (e.state === "windup") {
      e.t -= dt;
      e.face = Math.sign(dx) || e.face;
      if (e.t <= 0) {
        e.state = "strike"; e.t = e.charge ? 0.9 : 0.3; e.hitIds = new Set();
        const dmg = Math.round(T.dmg * diff.dmg);
        if (e.charge) { e.vx = e.face * 380; sfx.roar(); }
        else if (e.mount) { sfx.fire(); }
        else { sfx.swing(); strike(e, T.range, e.type === "boss" ? 30 : 20, dmg, T.knock); }
      }
      return;
    }
    if (e.state === "strike") {
      e.t -= dt;
      if (e.charge) {
        e.x += e.vx * dt;
        strike(e, 40, 26, Math.round(18 * diff.dmg), true);
        if (e.x < cam.x + 40 || e.x > cam.x + VW - 40) e.t = 0;
      }
      if (e.mount && e.t > 0.05) {
        for (let i = 0; i < 3; i++) particles.push({ x: e.x + e.face * 46, y: e.y - 44, vx: e.face * rand(200, 320), vy: rand(-30, 30), g: -60, life: 0.35, max: 0.35, color: Math.random() < 0.5 ? "#ffb02e" : "#ff5a1a", size: rand(4, 8) });
        strike(e, T.range, 24, Math.round(T.dmg * diff.dmg), true);
      }
      if (e.t <= 0) { e.state = "walk"; e.charge = false; e.vx = 0; e.cd = rand(T.cd[0], T.cd[1]); e.hitIds = null; }
      return;
    }

    // Walking AI: attackers close in on a side slot, the others wait at a distance.
    const onScreen = e.x > cam.x - 10 && e.x < cam.x + VW + 10;
    let tx, ty;
    if (e.token && p.state !== "down") {
      const side = e.x < p.x ? -1 : 1;
      tx = p.x + side * (T.range * 0.8);
      ty = p.y;
    } else {
      const side = e.x < p.x ? -1 : 1;
      tx = clamp(p.x + side * 190, cam.x + 40, cam.x + VW - 40);
      ty = e.homeY;
    }
    if (!onScreen) { tx = e.x < cam.x ? cam.x + 40 : cam.x + VW - 40; }
    const mx = tx - e.x, my = ty - e.y;
    const sp = T.speed * (e.type === "boss" && e.hp < e.maxHp / 2 ? 1.3 : 1);
    if (Math.abs(mx) > 4) e.x += Math.sign(mx) * Math.min(Math.abs(mx), sp * dt);
    if (Math.abs(my) > 3) e.y += Math.sign(my) * Math.min(Math.abs(my), sp * 0.7 * dt);
    e.y = clamp(e.y, BAND_TOP, BAND_BOT);
    e.face = Math.sign(dx) || e.face;
    e.state = Math.abs(mx) > 4 || Math.abs(my) > 3 ? "walk" : "idle";

    if (e.token && e.cd <= 0 && onScreen && p.state !== "down" && Math.abs(dy) < 14 && Math.abs(dx) < T.range + 6) {
      e.state = "windup"; e.t = T.windup;
      e.charge = false;
    } else if (e.type === "boss" && e.token && e.cd <= 0 && onScreen && Math.abs(dy) < 18 && Math.abs(dx) > 220 && Math.random() < 0.02) {
      e.state = "windup"; e.t = 0.8; e.charge = true;
    }
    // The boss calls for help at 60% and 30% health.
    if (e.type === "boss") {
      const frac = e.hp / e.maxHp;
      if (!e.called1 && frac < 0.6) { e.called1 = true; spawnQueue.push({ type: "soldato", t: 0.2 }, { type: "scheletro", t: 0.8 }); showBanner("Guardie, a me!", "#ff5a4a", 1.5); }
      if (!e.called2 && frac < 0.3) { e.called2 = true; spawnQueue.push({ type: "cavaliere", t: 0.2 }, { type: "gnomo", t: 1.0 }); showBanner("Guardie, a me!", "#ff5a4a", 1.5); }
    }
  }

  function bossDefeated(e) {
    shake = 0.8; flash = 0.6;
    burst(e.x, e.y - 60, "#f2c14e", 50, 300);
    showBanner("Il Signore dell'Ascia è sconfitto!", "#f2c14e", 3);
    for (const o of enemies) if (!o.dead && o !== e && o.type !== "gnomo") { o.invuln = 0; o.hp = 0; damage(o, 1, player, true); }
  }

  function assignTokens() {
    const alive = enemies.filter((e) => !e.dead && e.type !== "gnomo");
    for (const e of alive) e.token = false;
    const ready = alive.filter((e) => e.state !== "down").sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x));
    let n = 0;
    for (const e of ready) {
      if (e.type === "boss") { e.token = true; continue; }
      if (n < diff.attackers) { e.token = true; n++; }
    }
    // Enemies already mid-attack keep attacking.
    for (const e of alive) if (e.state === "windup" || e.state === "strike") e.token = true;
  }

  function updateMounts(dt) {
    for (const m of mounts) {
      m.anim += dt;
      if (m.rider) {
        m.x = m.rider.x; m.y = m.rider.y; m.face = m.rider.face;
        if (m.rider.dead) m.rider = null;
        continue;
      }
      if (m.state === "run") {
        m.x += m.vx * dt; m.t -= dt;
        m.x = clamp(m.x, cam.x + 30, cam.x + VW - 30);
        m.face = Math.sign(m.vx) || m.face;
        if (m.t <= 0) m.state = "idle";
      }
    }
    mounts = mounts.filter((m) => m.rider || (m.x > cam.x - 200));
  }

  function updateWaves(dt) {
    // Camera: follow the hero, never scroll back, stop at the next wave.
    const next = stage.waves[waveIdx];
    const lockX = wave ? wave.x : next ? next.x : stage.waves[stage.waves.length - 1].x;
    const target = clamp(player.x - 320, 0, lockX);
    if (target > cam.x) cam.x += Math.min(target - cam.x, 260 * dt);

    if (!wave && next && cam.x >= next.x - 1) {
      wave = next;
      goArrow = 0;
      spawnQueue = wave.spawn.map((type, i) => ({ type, t: 0.4 + i * 0.9 }));
      if (wave.gnome) spawnQueue.push({ type: "gnomo", t: 1.5 });
    }
    for (const s of spawnQueue) s.t -= dt;
    while (spawnQueue.length && spawnQueue[0].t <= 0) spawnEnemy(spawnQueue.shift().type);
    spawnQueue.sort((a, b) => a.t - b.t);

    if (wave && !spawnQueue.length && !enemies.some((e) => !e.dead && e.type !== "gnomo")) {
      wave = null;
      waveIdx++;
      if (waveIdx >= stage.waves.length) { state = "clear"; stageTimer = 3; sfx.clear(); showBanner("Livello completato!", "#f2c14e", 3); }
      else { goArrow = 3; sfx.go(); }
    }
  }

  function update(dt) {
    clock += dt;
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt);
    goArrow = Math.max(0, goArrow - dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (lastHit) { lastHit.t -= dt; if (lastHit.t <= 0) lastHit = null; }
    for (const b of bolts) b.t -= dt;
    bolts = bolts.filter((b) => b.t > 0);
    if (freeze > 0) { freeze -= dt; pressed.jump = pressed.magic = false; return; }

    if (state === "clear") {
      stageTimer -= dt;
      player.state = "walk"; player.face = 1; player.x += 120 * dt; player.anim += dt;
      if (stageTimer <= 0) {
        if (stageIndex + 1 >= STAGES.length) { endGame(true); return; }
        loadStage(stageIndex + 1);
        state = "playing";
      }
    } else {
      updatePlayer(dt);
      if (state !== "playing") return;
      assignTokens();
      const frozen = magicFx && !magicFx.applied;
      if (!frozen) for (const e of enemies) updateEnemy(e, dt);
      updateMounts(dt);
      updateWaves(dt);
    }
    enemies = enemies.filter((e) => !e.dead || e.deadT < 1.2);

    for (const it of pickups) {
      // Keep items where the hero can reach them.
      it.x = clamp(it.x, cam.x + 34, cam.x + VW - 34);
      if (it.z > 0 || it.vz > 0) { it.z += it.vz * dt; it.vz -= GRAV * dt; if (it.z <= 0) { it.z = 0; it.vz = it.vz < -150 ? -it.vz * 0.35 : 0; } }
    }
    pickups = pickups.filter((it) => !it.taken);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1);
    pressed.attack = pressed.jump = pressed.magic = false;
  }

  // ---------- Rendering: scenery ----------
  const THEMES = {
    villaggio: { sky: ["#2a0f1a", "#b8471f"], far: "#3a1a18", ground: "#6e5236", groundDark: "#5a4128", edge: "#4a6a2a" },
    foresta:   { sky: ["#0c1a18", "#2f5040"], far: "#12261e", ground: "#4a5a2e", groundDark: "#3a4a22", edge: "#2e4a1e" },
    castello:  { sky: ["#140c20", "#3d2552"], far: "#241a33", ground: "#5a5563", groundDark: "#4a4553", edge: "#6b6575" },
  };

  function drawScenery() {
    const th = THEMES[stage.theme];
    const g = ctx.createLinearGradient(0, 0, 0, BAND_TOP);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, BAND_TOP);

    if (stage.theme === "villaggio") {
      // Distant hills and burning houses
      ctx.fillStyle = th.far;
      ctx.beginPath(); ctx.moveTo(0, BAND_TOP);
      for (let x = 0; x <= VW; x += 20) ctx.lineTo(x, 170 - Math.sin((x + cam.x * 0.2) / 90) * 20);
      ctx.lineTo(VW, BAND_TOP); ctx.fill();
      for (let i = -1; i < 7; i++) {
        const base = Math.floor(cam.x * 0.5 / 180) + i;
        const x = base * 180 - cam.x * 0.5;
        const h = 60 + (base * 37 % 3) * 14;
        ctx.fillStyle = "#2a1a14";
        ctx.fillRect(x, BAND_TOP - h, 110, h);
        ctx.beginPath(); ctx.moveTo(x - 10, BAND_TOP - h); ctx.lineTo(x + 55, BAND_TOP - h - 40); ctx.lineTo(x + 120, BAND_TOP - h); ctx.fill();
        ctx.fillStyle = "#f2a13a";
        ctx.fillRect(x + 20, BAND_TOP - h + 18, 14, 14);
        ctx.fillRect(x + 70, BAND_TOP - h + 18, 14, 14);
        if (base % 2 === 0) {
          for (let k = 0; k < 5; k++) {
            const fx = x + 30 + k * 14, fy = BAND_TOP - h - 30 - Math.abs(Math.sin(clock * 6 + k + base)) * 22;
            ctx.fillStyle = k % 2 ? "#ff7a1a" : "#ffc44a";
            ctx.beginPath(); ctx.moveTo(fx - 9, BAND_TOP - h - 10); ctx.lineTo(fx, fy); ctx.lineTo(fx + 9, BAND_TOP - h - 10); ctx.fill();
          }
        }
      }
    } else if (stage.theme === "foresta") {
      ctx.fillStyle = "#e8f0d0";
      ctx.beginPath(); ctx.arc(620 - cam.x * 0.02, 70, 26, 0, Math.PI * 2); ctx.fill();
      for (const [f, col, w] of [[0.25, "#16302a", 36], [0.55, "#0e221c", 52]]) {
        for (let i = -1; i < 10; i++) {
          const base = Math.floor(cam.x * f / 110) + i;
          const x = base * 110 - cam.x * f + (base * 53 % 40);
          ctx.fillStyle = col;
          ctx.fillRect(x, 0, w, BAND_TOP);
          ctx.beginPath(); ctx.ellipse(x + w / 2, 40 + (base * 29 % 50), w * 1.6, 60, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    } else {
      ctx.fillStyle = "#f0e8ff";
      for (let i = 0; i < 40; i++) ctx.fillRect(((i * 97 - cam.x * 0.05) % VW + VW) % VW, (i * 41) % 150, 2, 2);
      for (let i = -1; i < 6; i++) {
        const base = Math.floor(cam.x * 0.6 / 200) + i;
        const x = base * 200 - cam.x * 0.6;
        ctx.fillStyle = "#2c2238";
        ctx.fillRect(x, 60, 200, BAND_TOP - 60);
        for (let k = 0; k < 5; k++) ctx.fillRect(x + k * 42, 44, 26, 18);
        ctx.fillStyle = "#1a1224";
        ctx.fillRect(x + 80, 130, 40, 70);
        ctx.beginPath(); ctx.arc(x + 100, 130, 20, Math.PI, 0); ctx.fill();
        // torch
        ctx.fillStyle = "#5a3a20"; ctx.fillRect(x + 30, 170, 6, 22);
        ctx.fillStyle = Math.sin(clock * 20 + base) > 0 ? "#ffb02e" : "#ff7a1a";
        ctx.beginPath(); ctx.ellipse(x + 33, 164, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Ground band
    ctx.fillStyle = th.edge;
    ctx.fillRect(0, BAND_TOP - 22, VW, 14);
    ctx.fillStyle = th.ground;
    ctx.fillRect(0, BAND_TOP - 8, VW, VH - BAND_TOP + 8);
    ctx.fillStyle = th.groundDark;
    if (stage.theme === "castello") {
      for (let row = 0; row < 6; row++) {
        const y = BAND_TOP - 8 + row * 32;
        ctx.fillRect(0, y, VW, 2);
        const off = (row % 2) * 40;
        for (let x = -((cam.x + off) % 80); x < VW; x += 80) ctx.fillRect(x, y, 2, 32);
      }
    } else {
      for (let i = 0; i < 40; i++) {
        const x = ((i * 131 - cam.x) % (VW + 100) + VW + 100) % (VW + 100) - 50;
        const y = BAND_TOP + (i * 53) % (VH - BAND_TOP);
        ctx.fillRect(x, y, 18, 4);
      }
    }
  }

  // ---------- Rendering: characters ----------
  const LOOKS = {
    hero:      { skin: "#e3aa78", body: "#7a4a2a", legs: "#e3aa78", boots: "#5a3a20", hair: "#f2c14e", weapon: "sword", scale: 1 },
    soldato:   { skin: "#c9905e", body: "#a8342e", legs: "#5a4632", boots: "#3a2a1a", helmet: "#8a8f99", weapon: "club", scale: 1 },
    scheletro: { skin: "#e8e2cf", body: "#e8e2cf", legs: "#e8e2cf", boots: "#cfc8b2", weapon: "rusty", scale: 0.95, bones: true },
    cavaliere: { skin: "#c9905e", body: "#8a95a8", legs: "#6a7488", boots: "#4a5264", helmet: "#a9b3c6", plume: "#d63a3a", weapon: "mace", shield: true, scale: 1.08 },
    drago:     { skin: "#c9905e", body: "#6a3a8a", legs: "#4a3a5a", boots: "#2a2030", helmet: "#8a8f99", weapon: "lance", scale: 1 },
    boss:      { skin: "#8a6a5a", body: "#3a2a4a", legs: "#2a2034", boots: "#1a1420", helmet: "#4a3a5e", horns: true, weapon: "axe", scale: 1.5 },
    gnomo:     { skin: "#e3aa78", body: "#3c6cd6", legs: "#3c6cd6", boots: "#5a3a20", hood: true, scale: 0.62 },
  };

  function weaponAngle(f) {
    if (f.state === "attack") {
      const dur = f.combo === 3 ? 0.42 : 0.26, k = clamp(f.t / dur, 0, 1);
      const from = f.combo === 2 ? 1.2 : -2.2, to = f.combo === 2 ? -1.6 : 1.1;
      return from + (to - from) * Math.min(1, k * 2.2);
    }
    if (f.state === "windup") return -2.4;
    if (f.state === "strike") return f.charge ? -0.2 : 1.1;
    if (f.airAtk) return 1.6;
    if (f.state === "magic") return -3.0;
    return -0.5 + Math.sin(f.anim * 3) * 0.08;
  }

  function drawFighter(f, lookKey, lift = 0) {
    const L = LOOKS[lookKey];
    const sx = f.x - cam.x, sy = f.y - f.z - lift;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(f.face * L.scale, L.scale);
    const flashOn = f.flash > 0 || (f.invuln > 0 && f.team === 0 && Math.floor(f.invuln * 14) % 2);
    if (f.dead) ctx.globalAlpha = clamp(1 - f.deadT / 1.2, 0, 1) * (Math.floor(f.deadT * 12) % 2 ? 0.4 : 1);
    if (f.state === "down" || f.dead) { ctx.rotate(-Math.PI / 2 * f.face * f.face); ctx.translate(-8, 20); }
    if (f.state === "hurt") ctx.rotate(-0.25);
    const walk = f.state === "walk" ? Math.sin(f.anim * 12) : 0;
    const col = (c) => (flashOn ? "#ffffff" : c);

    if (lift === 0 && !f.mount) {
      // legs
      ctx.fillStyle = col(L.legs);
      ctx.fillRect(-8 + walk * 4, -30, 7, 24);
      ctx.fillRect(2 - walk * 4, -30, 7, 24);
      ctx.fillStyle = col(L.boots);
      ctx.fillRect(-9 + walk * 4, -8, 10, 8);
      ctx.fillRect(1 - walk * 4, -8, 10, 8);
    } else {
      ctx.fillStyle = col(L.legs);
      ctx.fillRect(-4, -30, 8, 18);
    }
    // torso
    if (L.bones) {
      ctx.fillStyle = col(L.body);
      for (let i = 0; i < 4; i++) ctx.fillRect(-9, -56 + i * 6, 18, 3);
      ctx.fillRect(-2, -58, 4, 28);
    } else {
      ctx.fillStyle = col(L.body);
      ctx.fillRect(-11, -58, 22, 30);
      if (lookKey === "hero") {
        ctx.fillStyle = col(L.skin);
        ctx.fillRect(-9, -58, 18, 16);
        ctx.fillStyle = col("#5a3a20");
        ctx.fillRect(-11, -32, 22, 5);
        ctx.fillStyle = col("#f2c14e");
        ctx.fillRect(-3, -32, 6, 5);
      }
    }
    // shield arm
    if (L.shield) {
      ctx.fillStyle = col("#6a7488");
      ctx.beginPath(); ctx.ellipse(-12, -44, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col("#d63a3a"); ctx.fillRect(-14, -50, 4, 12);
    }
    // head
    ctx.fillStyle = col(L.skin);
    ctx.beginPath(); ctx.arc(1, -67, 9, 0, Math.PI * 2); ctx.fill();
    if (L.bones) { ctx.fillStyle = "#1a1410"; ctx.fillRect(2, -70, 4, 4); ctx.fillRect(-4, -70, 3, 4); ctx.fillRect(0, -62, 6, 2); }
    else { ctx.fillStyle = "#1a1410"; ctx.fillRect(5, -69, 2.5, 3); }
    if (L.hair) {
      ctx.fillStyle = col(L.hair);
      ctx.beginPath(); ctx.arc(-1, -70, 9, Math.PI * 0.9, Math.PI * 2.05); ctx.fill();
      ctx.fillRect(-10, -70, 6, 22);
    }
    if (L.helmet) {
      ctx.fillStyle = col(L.helmet);
      ctx.beginPath(); ctx.arc(1, -69, 10, Math.PI, 0); ctx.fill();
      ctx.fillRect(-9, -70, 20, 3);
      if (L.plume) { ctx.fillStyle = col(L.plume); ctx.fillRect(-4, -86, 6, 10); }
      if (L.horns) {
        ctx.fillStyle = col("#e8e2cf");
        ctx.beginPath(); ctx.moveTo(-8, -74); ctx.lineTo(-18, -90); ctx.lineTo(-4, -78); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8, -74); ctx.lineTo(18, -90); ctx.lineTo(4, -78); ctx.fill();
        ctx.fillStyle = "#ff3b3b"; ctx.fillRect(3, -69, 4, 3);
      }
    }
    if (L.hood) {
      ctx.fillStyle = col(L.body);
      ctx.beginPath(); ctx.moveTo(-10, -64); ctx.lineTo(1, -90); ctx.lineTo(12, -64); ctx.fill();
      ctx.fillStyle = col("#8a5a2a");
      if (f.sack > 0) { ctx.beginPath(); ctx.ellipse(-14, -46, 11, 13, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    // weapon arm
    if (L.weapon) {
      ctx.save();
      ctx.translate(4, -52);
      ctx.rotate(weaponAngle(f));
      ctx.fillStyle = col(L.skin === "#e8e2cf" ? L.skin : L.skin);
      ctx.fillRect(0, -3, 16, 6);
      if (L.weapon === "sword") {
        ctx.fillStyle = col("#f2c14e"); ctx.fillRect(14, -7, 4, 14);
        ctx.fillStyle = col("#e8eef8"); ctx.fillRect(18, -3, 38, 6);
        ctx.beginPath(); ctx.moveTo(56, -3); ctx.lineTo(64, 0); ctx.lineTo(56, 3); ctx.fill();
      } else if (L.weapon === "club") {
        ctx.fillStyle = col("#6a4424"); ctx.fillRect(14, -4, 30, 8);
        ctx.beginPath(); ctx.ellipse(44, 0, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
      } else if (L.weapon === "rusty") {
        ctx.fillStyle = col("#9a7a5a"); ctx.fillRect(16, -2, 30, 4);
      } else if (L.weapon === "mace") {
        ctx.fillStyle = col("#4a4a52"); ctx.fillRect(14, -3, 24, 6);
        ctx.fillStyle = col("#8a8f99"); ctx.beginPath(); ctx.arc(42, 0, 9, 0, Math.PI * 2); ctx.fill();
      } else if (L.weapon === "lance") {
        ctx.fillStyle = col("#6a4424"); ctx.fillRect(10, -2, 50, 4);
        ctx.fillStyle = col("#c9ced8"); ctx.beginPath(); ctx.moveTo(60, -5); ctx.lineTo(72, 0); ctx.lineTo(60, 5); ctx.fill();
      } else if (L.weapon === "axe") {
        ctx.fillStyle = col("#5a3a20"); ctx.fillRect(10, -3, 52, 6);
        ctx.fillStyle = col("#c9ced8");
        ctx.beginPath(); ctx.moveTo(48, -3); ctx.quadraticCurveTo(62, -30, 74, -18); ctx.lineTo(66, 0); ctx.lineTo(74, 18); ctx.quadraticCurveTo(62, 30, 48, 3); ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawDragon(m) {
    const sx = m.x - cam.x, sy = m.y;
    const walk = (m.rider && m.rider.state === "walk") || m.state === "run" ? Math.sin(m.anim * 12) : 0;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(m.face, 1);
    ctx.fillStyle = "#3c8a3c";
    ctx.fillRect(-26 + walk * 5, -24, 9, 24); ctx.fillRect(14 - walk * 5, -24, 9, 24);
    ctx.fillStyle = "#4caf50";
    ctx.beginPath(); ctx.ellipse(-2, -34, 34, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-30, -38); ctx.lineTo(-62, -28 + walk * 3); ctx.lineTo(-30, -28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22, -42); ctx.lineTo(34, -66); ctx.lineTo(42, -60); ctx.lineTo(30, -36); ctx.fill();
    ctx.beginPath(); ctx.ellipse(44, -64, 14, 9, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8e2a0";
    ctx.beginPath(); ctx.ellipse(-2, -26, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd34d"; ctx.fillRect(44, -68, 4, 4);
    ctx.fillStyle = "#2e6a2e";
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-20 + i * 12, -48); ctx.lineTo(-14 + i * 12, -58); ctx.lineTo(-8 + i * 12, -48); ctx.fill(); }
    ctx.restore();
  }

  function drawShadow(x, y, w) {
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(x - cam.x, y, w, w * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawPickup(it) {
    const x = it.x - cam.x, y = it.y - it.z;
    drawShadow(it.x, it.y, 10);
    if (it.kind === "potion") {
      ctx.fillStyle = "#2a5ad6";
      ctx.beginPath(); ctx.ellipse(x, y - 10, 9, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6ab4ff"; ctx.fillRect(x - 3, y - 26, 6, 8);
      ctx.fillStyle = "#8a5a2a"; ctx.fillRect(x - 4, y - 29, 8, 4);
    } else {
      ctx.fillStyle = "#b8573a";
      ctx.beginPath(); ctx.ellipse(x, y - 9, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f6ecd9"; ctx.fillRect(x + 10, y - 12, 10, 5);
    }
  }

  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!stage) { ctx.fillStyle = "#120d0a"; ctx.fillRect(0, 0, VW, VH); return; }
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 20, (Math.random() - 0.5) * shake * 20);
    drawScenery();

    // Everything on the ground is drawn back to front.
    const list = [];
    for (const it of pickups) list.push({ y: it.y - 1, draw: () => drawPickup(it) });
    for (const m of mounts) if (!m.rider) list.push({ y: m.y, draw: () => { drawShadow(m.x, m.y, 36); drawDragon(m); } });
    for (const e of enemies) {
      const look = e.type === "drago" && !e.mount ? "soldato" : e.type;
      list.push({
        y: e.y, draw: () => {
          drawShadow(e.x, e.y, e.type === "boss" ? 36 : e.mount ? 36 : 22);
          if (e.mount) { drawDragon(e.mount); drawFighter(e, look, 34); } else drawFighter(e, look);
        },
      });
    }
    list.push({
      y: player.y + 0.1, draw: () => {
        drawShadow(player.x, player.y, player.mount ? 36 : 22);
        if (player.mount) { drawDragon(player.mount); drawFighter(player, "hero", 34); } else drawFighter(player, "hero");
      },
    });
    list.sort((a, b) => a.y - b.y);
    for (const o of list) o.draw();

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - cam.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (const b of bolts) {
      ctx.strokeStyle = `rgba(200,230,255,${b.t * 2})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      let x = b.x - cam.x, y = 0;
      ctx.moveTo(x, y);
      while (y < b.y - 40) { y += 30; x += rand(-18, 18); ctx.lineTo(x, y); }
      ctx.lineTo(b.x - cam.x, b.y - 40);
      ctx.stroke();
    }
    if (magicFx && !magicFx.applied) {
      ctx.fillStyle = `rgba(120,170,255,${0.15 + Math.random() * 0.1})`;
      ctx.fillRect(0, 0, VW, VH);
    }
    ctx.font = "bold 15px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x - cam.x, p.y - p.t * 40);
    }
    ctx.globalAlpha = 1;

    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`; ctx.fillRect(0, 0, VW, VH); }
    drawHUD();
  }

  function bar(x, y, w, h, frac, color) {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  }

  function drawHUD() {
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = "bold 14px Georgia, serif";
    ctx.fillStyle = "#f6ecd9";
    ctx.fillText("EROE", 14, 16);
    bar(60, 10, 160, 12, player.hp / 100, player.hp > 35 ? "#f2c14e" : "#ff5a4a");
    ctx.fillStyle = "#f6ecd9";
    ctx.fillText(`× ${Math.max(0, lives)}`, 230, 16);
    for (let i = 0; i < MAX_POTIONS; i++) {
      const x = 22 + i * 18, y = 40;
      ctx.fillStyle = i < potions ? "#2a5ad6" : "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.ellipse(x, y, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 2, y - 12, 4, 5);
    }
    ctx.fillStyle = "#9fc4ff";
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.fillText(potions ? `MAGIA liv. ${potions}` : "MAGIA: nessuna pozione", 132, 40);
    ctx.textAlign = "right";
    ctx.font = "bold 15px Georgia, serif";
    ctx.fillStyle = "#f2c14e";
    ctx.fillText(String(score).padStart(7, "0"), VW - 14, 16);
    ctx.fillStyle = "#c2b39a";
    ctx.font = "12px Georgia, serif";
    ctx.fillText(`Livello ${stageIndex + 1}/${STAGES.length} · ${stage.name}`, VW - 14, 36);

    if (lastHit && !lastHit.e.dead) {
      const e = lastHit.e;
      const boss = e.type === "boss";
      const w = boss ? 320 : 150, x = boss ? VW / 2 - w / 2 : VW - 14 - w, y = boss ? 58 : 50;
      ctx.textAlign = boss ? "center" : "right";
      ctx.fillStyle = "#f6ecd9";
      ctx.font = "bold 12px Georgia, serif";
      ctx.fillText(TYPES[e.type].name, boss ? VW / 2 : VW - 14, y);
      bar(x, y + 9, w, 8, e.hp / e.maxHp, "#ff5a4a");
    }
    if (goArrow > 0 && Math.floor(goArrow * 3) % 2 === 0) {
      ctx.textAlign = "right";
      ctx.font = "bold 30px Georgia, serif";
      ctx.fillStyle = "#f2c14e";
      ctx.fillText("AVANTI ➜", VW - 24, 130);
    }
    if (banner) {
      ctx.globalAlpha = Math.min(1, banner.t * 2);
      ctx.font = "bold 26px Georgia, serif";
      ctx.textAlign = "center";
      const tw = ctx.measureText(banner.text).width + 40;
      ctx.fillStyle = "rgba(18,13,10,0.75)";
      ctx.fillRect(VW / 2 - tw / 2, 88, tw, 46);
      ctx.fillStyle = banner.color;
      ctx.fillText(banner.text, VW / 2, 112);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  const STEP = 1 / 120;
  let acc = 0;
  function loop(now) {
    const frame = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += frame;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

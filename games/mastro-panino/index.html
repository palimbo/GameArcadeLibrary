<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mastro Panino</title>
<style>
  :root {
    --bg: #120a06;
    --fg: #fff6e6;
    --muted: #c8b49a;
    --bun: #e8a040;
    --lettuce: #5ad84a;
    --tomato: #ff4a3a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2a14, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 246, 230, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch button {
    width: 56px; height: 56px; border-radius: 14px; touch-action: none;
    font: 700 22px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(232, 160, 64, 0.7); background: rgba(232, 160, 64, 0.1);
  }
  #touch button[data-a="pepper"] { width: 92px; height: 92px; border-radius: 50%; border-color: rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.14); font: 800 14px system-ui, sans-serif; letter-spacing: 1px; pointer-events: auto; }
  #touch.small .pad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  #touch.small button { width: 44px; height: 44px; font-size: 17px; }
  #touch.small button[data-a="pepper"] { width: 70px; height: 70px; font-size: 12px; }
  #touch button.on { background: rgba(255, 246, 230, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 10, 6, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(36px, 10vw, 64px); font-weight: 900; letter-spacing: 1px; color: var(--bun); text-shadow: 0 4px 0 #8a4a14, 0 8px 0 var(--lettuce), 0 12px 0 #6a2a14; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--tomato); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,246,230,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--bun); color: #2a1206; background: var(--bun); padding: 11px 30px; box-shadow: 0 4px 0 #8a4a14; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Su">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
    <button type="button" data-a="down" aria-label="Giù">▼</button>
  </div>
  <button type="button" data-a="pepper" aria-label="Pepe">PEPE</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const CELL = 16, COLS = 32, ROWS = 28, W = COLS * CELL, H = ROWS * CELL;
  const FLOOR_ROWS = [3, 7, 11, 15, 19, 23];
  const PLATE_Y = 440, CHEF_SPEED = 66;
  const BURGER_COLS = [2, 10, 18, 26];
  const PIECES = ["top", "lettuce", "patty", "bottom"];
  // gaps in a floor can only be between the burgers: A = 6-9, B = 14-17, C = 22-25
  const GAP = { A: [6, 9], B: [14, 17], C: [22, 25] };
  const LEVELS = [
    { name: "IL CHIOSCO", wall: "#2a1a3a", girder: "#3a8aff",
      gaps: ["", "", "B", "", "A", ""],
      ladders: [[1, 0, 2], [1, 3, 5], [7, 0, 1], [8, 1, 5], [15, 0, 5], [16, 1, 3], [23, 0, 3], [24, 2, 5], [30, 0, 5]],
      burgers: [[0, 1, 3, 5], [0, 2, 3, 4], [1, 2, 4, 5], [0, 1, 2, 4]] },
    { name: "LA TAVOLA CALDA", wall: "#1a2a2a", girder: "#ff8a3a",
      gaps: ["", "AC", "B", "AC", "B", ""],
      ladders: [[1, 0, 5], [30, 0, 5], [7, 0, 2], [8, 2, 4], [8, 4, 5], [15, 0, 1], [16, 1, 3], [15, 3, 5], [23, 0, 2], [24, 2, 5]],
      burgers: [[0, 2, 3, 5], [1, 2, 4, 5], [0, 1, 3, 4], [0, 1, 2, 5]] },
    { name: "IL GRAND HOTEL", wall: "#2a0a1a", girder: "#ffd34d",
      gaps: ["B", "A", "C", "A", "C", ""],
      ladders: [[1, 0, 5], [30, 0, 5], [8, 0, 2], [7, 2, 5], [15, 1, 4], [16, 4, 5], [23, 0, 1], [24, 1, 3], [23, 3, 5]],
      burgers: [[0, 1, 3, 4], [0, 2, 3, 5], [1, 2, 3, 4], [0, 2, 4, 5]] },
  ];
  const ENEMY_KINDS = {
    wurstel: { color: "#e0603a", random: 0.15, speed: 1 },
    uovo: { color: "#fff6e6", random: 0.35, speed: 0.95 },
    cetriolo: { color: "#5ab84a", random: 0.05, speed: 1.05 },
  };
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: "down", down: "up", left: "right", right: "left" };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici lenti e meno numerosi", lives: 5, speed: 0.66, base: 2, pepper: 7 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, speed: 0.84, base: 3, pepper: 5 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 vite · nemici veloci e numerosi", lives: 3, speed: 0.95, base: 4, pepper: 4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "panino-difficulty";
  const bestKey = (id) => `panino-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  let bgCache = null, bgKey = "";
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(190px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 190;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
    bgKey = "";
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    step: lim(() => beep(420, 0.05, "square", 0.025)),
    fall: lim(() => beep(700, 0.3, "triangle", 0.04, -450)),
    land: lim(() => noise(0.12, 0.2, 500)),
    plate: lim(() => arp([784, 1047], 0.06, 0.1, "triangle", 0.05)),
    pepper: lim(() => noise(0.25, 0.15, 3000)),
    stun: lim(() => beep(1200, 0.15, "square", 0.03, -600)),
    squash: lim(() => { noise(0.2, 0.25, 900); beep(300, 0.2, "sawtooth", 0.04, -200); }),
    bonus: () => arp([659, 784, 1047, 1319], 0.06, 0.1, "square", 0.04),
    die: () => arp([523, 494, 466, 440, 415, 392, 370, 330], 0.09, 0.12),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    empty: lim(() => beep(150, 0.12, "square", 0.03)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 20000, pepper = 5;
  let grid = [], pieces = [], plates = [], chef = null, enemies = [], cloud = null, bonus = null, bonusCount = 0;
  let parts = [], popups = [], message = null, levelT = 0, distMap = null, distT = 0;
  const ctl = { up: false, down: false, left: false, right: false, pepper: false };
  let pepperPressed = false, lastDir = null;

  const L = () => LEVELS[level % LEVELS.length];
  const cellAt = (c, r) => (c >= 0 && c < COLS && r >= 0 && r < ROWS ? grid[r][c] : 0);
  const isF = (c, r) => (cellAt(c, r) & 1) !== 0;
  const isL = (c, r) => (cellAt(c, r) & 2) !== 0;
  function canMove(c, r, d) {
    const [dx, dy] = DIRS[d];
    return dx ? isF(c, r) && isF(c + dx, r) : isL(c, r) && isL(c, r + dy);
  }
  const lineY = (f) => (FLOOR_ROWS[f] + 1) * CELL;
  const cx = (c) => c * CELL + CELL / 2;

  function buildLevel() {
    const lv = L();
    grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
    FLOOR_ROWS.forEach((r, f) => {
      for (let c = 1; c <= 30; c++) {
        if ([...lv.gaps[f]].some((g) => c >= GAP[g][0] && c <= GAP[g][1])) continue;
        grid[r][c] |= 1;
      }
    });
    for (const [c, a, b] of lv.ladders) for (let r = FLOOR_ROWS[a]; r <= FLOOR_ROWS[b]; r++) grid[r][c] |= 2;
    pieces = [];
    lv.burgers.forEach((floors, col) => floors.forEach((f, k) => pieces.push({
      col, kind: PIECES[k], c0: BURGER_COLS[col], floor: f, y: lineY(f), steps: [0, 0, 0, 0],
      falling: false, plated: false, target: 0, riders: [], vy: 0, bounce: 0,
    })));
    plates = [0, 0, 0, 0];
    cloud = null; bonus = null; bonusCount = 0;
    levelT = 0;
    resetActors();
    message = { text: `LIVELLO ${level + 1}`, sub: L().name, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function makeActor(c, r, speed) { return { c, r, tc: c, tr: r, x: cx(c), y: cx(r), speed, face: "left", moving: false, walk: 0 }; }
  function resetActors() {
    chef = makeActor(16, FLOOR_ROWS[5], CHEF_SPEED);
    chef.dead = false; chef.inv = 0;
    const n = Math.min(6, diff.base + Math.floor(level / 2));
    const kinds = ["wurstel", "uovo", "wurstel", "cetriolo", "uovo", "cetriolo"];
    enemies = [];
    for (let i = 0; i < n; i++) enemies.push({ kind: kinds[i], wait: 1.2 + i * 1.6, alive: false });
    for (const p of pieces) p.riders = [];
    distMap = null;
  }
  const spawnPoints = () => [[1, 0], [30, 0], [1, 5], [30, 5]].map(([c, f]) => [c, FLOOR_ROWS[f]]).filter(([c, r]) => isF(c, r));
  function spawnEnemy(e) {
    // enter from the corner farthest from the chef
    const pts = spawnPoints().sort((a, b) => Math.hypot(cx(b[0]) - chef.x, cx(b[1]) - chef.y) - Math.hypot(cx(a[0]) - chef.x, cx(a[1]) - chef.y));
    const [c, r] = pts[Math.random() < 0.7 ? 0 : 1];
    const k = ENEMY_KINDS[e.kind];
    Object.assign(e, makeActor(c, r, 0), { alive: true, stun: 0, appear: 0.6, riding: null, dir: null, rand: k.random });
    e.speed = CHEF_SPEED * diff.speed * k.speed * (1 + Math.min(0.3, level * 0.04));
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 20000; pepper = diff.pepper;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff6e6") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.5, c: color });
    }
  }
  function killChef() {
    if (state !== "play" || chef.inv > 0) return;
    lives--; chef.dead = true;
    sfx.die();
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // pieces in mid-air finish their fall before everyone comes back
    for (const p of pieces) if (p.falling) { p.y = p.target; land(p); }
    resetActors();
    chef.inv = 1.5;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>MASTRO PANINO</h1>
       <p>Il cuoco deve preparare quattro panini giganti! Cammina sopra pane, insalata e hamburger per farli cadere di un piano, fino ai piatti in fondo. Attento a wurstel, uova e cetriolini che ti inseguono: schiacciali sotto gli ingredienti o stordiscili con una spruzzata di pepe.</p>
       <div class="pts">
         <span><b>Ingrediente che cade</b></span><span>50 per ogni piano</span>
         <span><b>Nemico schiacciato</b></span><span>500</span>
         <span><b>Nemici portati giù</b></span><span>1.000, 2.000, 4.000…</span>
         <span><b>Nemico col pepe</b></span><span>100</span>
         <span><b>Tazzina di caffè</b></span><span>+1 pepe e 500–1.500</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Croce per camminare e salire le scale · PEPE per stordire i nemici davanti a te</p>`

    const ey = e.kind === "wurstel" ? -22 : -17;
    ctx.fillStyle = "#fff"; ctx.fillRect(-1, ey, 4, 4); ctx.fillStyle = "#000";
    if (stunned) { ctx.fillRect(-1, ey + 1.5, 4, 1); } else ctx.fillRect(1, ey + 1, 2, 2);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-2, ey - 2, 5, 1);
    ctx.restore();
    if (stunned) {
      for (let k = 0; k < 3; k++) {
        const a = clock * 6 + k * 2.1;
        ctx.fillStyle = "#ffd34d"; ctx.font = "10px system-ui, sans-serif"; ctx.textAlign = "center";
        ctx.fillText("✦", e.x + Math.cos(a) * 9, e.y - 20 + Math.sin(a) * 3);
      }
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!chef) { ctx.fillStyle = "#120a06"; ctx.fillRect(0, 0, W, H); return; }
    buildBackground();
    ctx.drawImage(bgCache, 0, 0, W, H);
    for (const p of pieces) drawPiece(p);
    if (bonus && !(bonus.t < 2 && Math.floor(clock * 10) % 2)) {
      const { x, y } = bonus;
      ctx.fillStyle = "#fff"; ctx.fillRect(x - 6, y - 2, 12, 9); ctx.fillRect(x + 5, y, 4, 5);
      ctx.fillStyle = "#6a3a1a"; ctx.fillRect(x - 5, y - 2, 10, 2);
      ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.ellipse(x, y + 8, 10, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5;
      for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.moveTo(x - 2 + k * 4, y - 5); ctx.quadraticCurveTo(x + 1 + k * 4 + Math.sin(clock * 5) * 2, y - 9, x - 2 + k * 4, y - 13); ctx.stroke(); }
    }
    for (const e of enemies) drawEnemy(e);
    if (state !== "menu") drawChef();
    if (cloud) {
      const a = Math.max(0, 1 - cloud.t / 0.45);
      for (let k = 0; k < 9; k++) {
        const ang = k * 0.7 + cloud.t * 3, rr = 6 + cloud.t * 20;
        ctx.fillStyle = `rgba(${k % 2 ? 255 : 200}, ${k % 3 ? 220 : 120}, 200, ${0.55 * a})`;
        ctx.beginPath(); ctx.arc(cloud.x + Math.cos(ang) * rr * (cloud.dx ? 1.3 : 0.6), cloud.y + Math.sin(ang) * rr * (cloud.dy ? 1.3 : 0.6), 5, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 22px system-ui, sans-serif" : "900 13px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, W, 28);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 15px system-ui, sans-serif"; ctx.fillStyle = "#fff6e6";
    ctx.fillText(score.toLocaleString("it-IT"), 10, 14);
    ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#c8b49a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 96, 14);
    ctx.textAlign = "center"; ctx.font = "800 12px system-ui, sans-serif"; ctx.fillStyle = "#ff8a7a";
    ctx.fillText(`PEPE ${pepper}`, W / 2 + 10, 14);
    ctx.textAlign = "right"; ctx.fillStyle = "#e8a040";
    ctx.fillText(`LIVELLO ${level + 1}`, W - 10, 14);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) {
      const x = W - 104 - i * 13;
      ctx.fillStyle = "#fff"; ctx.fillRect(x - 4, 9, 8, 3); ctx.beginPath(); ctx.arc(x, 8, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(x, 16, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(18,10,6,0.8)"; ctx.fillRect(0, H / 2 - 40, W, message.sub ? 72 : 50);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui, sans-serif"; ctx.fillStyle = "#e8a040";
      ctx.fillText(message.text, W / 2, H / 2 - 6);
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#fff6e6"; ctx.fillText(message.sub, W / 2, H / 2 + 20); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildLevel(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

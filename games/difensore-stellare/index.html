<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Difensore Stellare</title>
<style>
  :root {
    --bg: #04040c;
    --fg: #f2f4ff;
    --muted: #a0a4c8;
    --green: #5aff8a;
    --gold: #ffd34d;
    --red: #ff4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1e2240, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to fly, fire and smart bomb buttons */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(90, 255, 138, 0.55); background: radial-gradient(circle, rgba(90,255,138,0.14), rgba(90,255,138,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(90, 255, 138, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(242,244,255,0.25); pointer-events: none; }
  #touch .btns { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  #touch .btns button { border-radius: 50%; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; line-height: 1.2; }
  #touch .fire { width: 92px; height: 92px; border: 2px solid rgba(255, 90, 90, 0.9); background: rgba(255, 90, 90, 0.2); }
  #touch .bomb { width: 64px; height: 64px; margin-bottom: 40px; border: 2px solid rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.16); font-size: 10px !important; }
  #touch .btns button.on { background: rgba(255, 211, 77, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 76px; height: 76px; font-size: 11px; }
  #touch.small .bomb { width: 56px; height: 56px; margin-bottom: 30px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 4, 12, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--green); text-shadow: 0 3px 0 #1a7a3a, 0 0 22px rgba(90,255,138,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--green); color: #04301a; background: var(--green); padding: 11px 30px; box-shadow: 0 4px 0 #1a7a3a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="bomb" aria-label="Bomba">BOMBA</button>
    <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 300, TOP = 40, GROUND = 290, WORLD = 3200, TAU = Math.PI * 2;
  const SCAN_W = 220, SCAN_X = (W - SCAN_W) / 2;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 navi · alieni lenti che sparano poco", lives: 5, fire: 0.5, speed: 0.85, landers: 12 },
    normale:   { label: "NORMALE",   color: "#5aff8a", desc: "3 navi · l'esperienza classica", lives: 3, fire: 1, speed: 1, landers: 15 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 navi · alieni veloci e numerosi", lives: 3, fire: 1.4, speed: 1.15, landers: 18 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "difensore-difficulty";
  const bestKey = (id) => `difensore-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const wrapX = (x) => ((x % WORLD) + WORLD) % WORLD;
  const dxw = (a, b) => { let d = wrapX(a - b); if (d > WORLD / 2) d -= WORLD; return d; };   // shortest way from b to a

  // mountains along the whole planet, as a looped height profile
  const MOUNT = [];
  for (let i = 0; i < WORLD / 16; i++) {
    const x = i * 16;
    MOUNT.push(18 + Math.abs(Math.sin(x * 0.0041) * 26 + Math.sin(x * 0.013 + 1) * 12 + Math.sin(x * 0.031 + 2) * 5));
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    laser: lim(() => beep(1800, 0.07, "sawtooth", 0.018, -1300)),
    boom: lim(() => { noise(0.35, 0.2, 1100); beep(140, 0.2, "square", 0.02, -80); }),
    shot: lim(() => beep(600, 0.06, "triangle", 0.02, -250)),
    grab: lim(() => arp([400, 300, 400, 300], 0.06, 0.06, "square", 0.03)),
    scream: lim(() => beep(1200, 0.5, "sawtooth", 0.02, -900)),
    mutant: lim(() => arp([200, 260, 200], 0.05, 0.06, "sawtooth", 0.03)),
    catch: () => arp([784, 988, 1175], 0.05, 0.08, "triangle", 0.05),
    save: () => arp([523, 659, 784, 1047], 0.06, 0.1, "triangle", 0.05),
    smart: () => { noise(0.8, 0.35, 3000); beep(80, 0.6, "sawtooth", 0.05, -40); },
    wave: () => arp([392, 523, 659, 784, 1047], 0.09, 0.14),
    die: () => { noise(1, 0.3, 700); arp([523, 415, 330, 262], 0.12, 0.18, "sawtooth", 0.035); },
    planet: () => { noise(2, 0.35, 300); beep(60, 1.8, "sawtooth", 0.05, -30); },
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, bombs = 3, wave = 0, bestCache = 0, nextLife = 10000, lifeStep = 20000;
  let ship = null, camX = 0, lookOff = 0, shots = [], foes = [], eshots = [], humans = [], parts = [], popups = [], message = null;
  let toSpawn = 0, spawnT = 0, waveT = 0, baiterT = 0, planetDead = false, flash = 0, stars = [];
  const ctl = { x: 0, y: 0 }, keys = { left: false, right: false, up: false, down: false };
  let fireHeld = false, bombPressed = false;
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * WORLD, y: rnd(TOP + 4, GROUND - 40), f: rnd(0.15, 0.5), c: Math.random() < 0.2 ? "#8ab0ff" : "#ffffff" });

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; bombs = 3; wave = 0; nextLife = 10000; lifeStep = 20000; planetDead = false;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    ship = newShip(); camX = ship.x + 120; lookOff = 120;
    humans = []; restoreHumans();
    beginWave();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function newShip(x = WORLD / 2) { return { x, y: 160, vx: 0, face: 1, inv: 2, cool: 0, dead: false, carry: null }; }
  function restoreHumans() {
    humans = humans.filter((h) => h.st !== "dead");
    while (humans.length < 10) humans.push({ x: Math.random() * WORLD, y: GROUND, st: "ground", vx: rnd(-8, 8), vy: 0, t: rnd(0, 5) });
    planetDead = false;
  }
  function beginWave() {
    foes = []; eshots = []; shots = [];
    if (wave > 0 && wave % 5 === 0) { restoreHumans(); }
    toSpawn = diff.landers + wave * 3; spawnT = 1; waveT = 0; baiterT = 0;
    // from the second wave: bombers laying mines; from the third: pods full of swarmers
    const extras = [];
    for (let i = 0; i < Math.min(4, wave); i++) extras.push("bomber");
    for (let i = 0; i < Math.min(3, wave - 1); i++) extras.push("pod");
    for (const k of extras) spawnFoe(k, Math.random() * WORLD, rnd(TOP + 40, GROUND - 90));
    message = { text: `ONDATA ${wave + 1}`, sub: planetDead ? "Il pianeta è distrutto: solo mutanti!" : `Proteggi gli umanoidi · ne restano ${humans.filter((h) => h.st !== "dead").length}`, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#f2f4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      // extra ships at 10.000, 30.000, 60.000, 100.000…
      nextLife += lifeStep; lifeStep += 10000; if (lives < 9) lives++; if (bombs < 9) bombs++; sfx.life();
      popups.push({ x: camX, y: H / 2 - 40, text: "NAVE + BOMBA", color: "#ffd34d", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 12, sp = 120, life = 0.6) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function killShip() {
    if (state !== "play" || ship.inv > 0) return;
    lives--; ship.dead = true;
    if (ship.carry) { ship.carry.st = "falling"; ship.carry.vy = 0; ship.carry = null; }
    sfx.die(); burst(ship.x, ship.y, "#ffffff", 30, 200, 1); burst(ship.x, ship.y, "#ff5a5a", 20, 150, 0.9);
    state = "dead"; stateT = 2.4;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    eshots = [];
    foes = foes.filter((f) => f.kind !== "mine" && Math.abs(dxw(f.x, ship.x)) > 260);
    ship = newShip(ship.x); ship.inv = 2.5;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, wv = wave + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Ondata ${wv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>DIFENSORE STELLARE</h1>
       <p>Sorvola il pianeta e proteggi i dieci umanoidi: i rapitori verdi li afferrano e li portano in cielo, dove diventano mutanti furiosi. Abbatti il rapitore, prendi al volo l'umanoide che cade e riportalo a terra! Il radar in alto mostra tutto il pianeta, che gira in tondo.</p>
       <div class="pts">
         <span><b>Rapitore · mutante</b></span><span>150</span>
         <span><b>Bombardiere · capsula</b></span><span>250 · 1.000 (e libera uno sciame)</span>
         <span><b>Umanoide preso al volo</b></span><span>500 · e altri 500 quando lo posi</span>
         <span><b>Bomba intelligente</b></span><span>distrugge tutti i nemici sullo schermo</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per volare (spingi nell'altra direzione per girarti) · tieni premuto FUOCO · BOMBA per la bomba intelligente</p>`
         : `<p class="muted help">Frecce o W A S D per volare · SPAZIO o Z per sparare · B o X per la bomba intelligente · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DECOLLA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  const keyAxis = () => { ctl.x = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); ctl.y = (keys.down ? 1 : 0) - (keys.up ? 1 : 0); };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (k === " " || k === "z") fireHeld = true;
    if ((k === "b" || k === "x") && !e.repeat) bombPressed = true;
    const a = KEYS[k]; if (a) { keys[a] = true; keyAxis(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "z") fireHeld = false;
    const a = KEYS[k]; if (a) { keys[a] = false; keyAxis(); }
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; ctl.x = ctl.y = 0; fireHeld = false; if (isPlaying()) togglePause(); });
  const fireBtn = touchEl.querySelector(".fire"), bombBtn = touchEl.querySelector(".bomb");
  let fireId = null;
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); fireId = e.pointerId; try { fireBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } fireHeld = true; fireBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, (e) => { if (e.pointerId !== fireId) return; fireId = null; fireHeld = false; fireBtn.classList.remove("on"); });

  // ---------- Update ----------

    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 16px system-ui, sans-serif" : "900 10px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, sx(q.x), q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, sx(q.x), q.y);
    }
    ctx.globalAlpha = 1;
    drawScanner();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(4,4,12,0.8)"; ctx.fillRect(0, H / 2 - 30, W, message.sub ? 50 : 34);
      ctx.textAlign = "center"; ctx.font = "900 19px system-ui, sans-serif"; ctx.fillStyle = "#5aff8a";
      ctx.fillText(message.text, W / 2, H / 2 - 7);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff"; ctx.fillText(message.sub, W / 2, H / 2 + 12); }
      ctx.globalAlpha = 1;
    }
  }
  function drawScanner() {
    // status bar with the radar of the whole planet in the middle
    ctx.fillStyle = "#04040c"; ctx.fillRect(0, 0, W, TOP);
    ctx.fillStyle = "#1a2a5a"; ctx.fillRect(0, TOP - 1.5, W, 1.5);
    ctx.strokeStyle = "#3a4a8a"; ctx.lineWidth = 1; ctx.strokeRect(SCAN_X + 0.5, 3.5, SCAN_W - 1, TOP - 8);
    const sy = (y) => 5 + (y - TOP) / (H - TOP) * (TOP - 11);
    const scx = (x) => SCAN_X + SCAN_W / 2 + dxw(x, camX) / WORLD * SCAN_W;
    // the part of the planet on screen
    ctx.strokeStyle = "rgba(242,244,255,0.5)"; ctx.strokeRect(SCAN_X + SCAN_W / 2 - W / WORLD * SCAN_W / 2, 4, W / WORLD * SCAN_W, TOP - 10);
    if (!planetDead) { ctx.fillStyle = "#c86a2a"; ctx.fillRect(SCAN_X + 1, sy(GROUND), SCAN_W - 2, 1); }
    for (const h of humans) { ctx.fillStyle = "#b05aff"; ctx.fillRect(scx(h.x) - 0.5, sy(h.y) - 1.5, 1.5, 1.5); }
    for (const f of foes) {
      if (f.kind === "mine") continue;
      ctx.fillStyle = { lander: "#5aff8a", mutant: "#ff5aff", bomber: "#5a8aff", pod: "#b05aff", swarmer: "#ff5a3a", baiter: "#9aff5a" }[f.kind];
      ctx.fillRect(scx(f.x) - 1, sy(f.y) - 1, 2, 2);
    }
    if (ship) { ctx.fillStyle = "#ffffff"; ctx.fillRect(scx(ship.x) - 1.5, sy(ship.y) - 1, 3, 2); }
    if (state === "menu") return;
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#a0a4c8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8, 29);
    ctx.textAlign = "right"; ctx.font = "800 10px system-ui, sans-serif"; ctx.fillStyle = "#5aff8a";
    ctx.fillText(`ONDATA ${wave + 1}`, W - 8, 11);
    // spare ships and smart bombs
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) drawShip({ face: 1 }, W - 18 - i * 22, 28);
    for (let i = 0; i < Math.min(bombs, 6); i++) { ctx.fillStyle = "#ffd34d"; ctx.fillRect(SCAN_X - 12 - i * 7, 26, 4, 7); }
    ctx.textBaseline = "alphabetic";
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); camX = wrapX(camX + dt * 30); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="difensore-best-" data-kind="score"></script>

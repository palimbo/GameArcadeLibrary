<!DOCTYPE html>
<html lang="it">
<head>

<title>Lumi sul Palco</title>
<style>

    --gold: #ff8ad6;

  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2e6e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {

    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;

  #overlay > :last-child { margin-bottom: auto; }

  #homeLink:hover { background: rgba(0,0,0,.8); }

  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #5a1a6a, 0 0 24px rgba(255,138,214,0.5); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }

  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }

  }

  @media (max-width: 520px) { #overlay .hero { flex-direction: column; text-align: center; gap: 6px; } #overlay .hero svg { width: 96px; flex-basis: auto; } }
  #overlay .songs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; width: min(620px, 100%); }
  #overlay .song { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px !important; letter-spacing: 0 !important; }
  #overlay .song b { font-size: 15px; } #overlay .song span { font: 600 11px system-ui, sans-serif; color: var(--muted); letter-spacing: 0.3px; }
  #overlay .song.on { border-color: var(--c) !important; box-shadow: 0 0 14px var(--c); }
  #overlay .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #overlay .row .lab { font: 700 11px system-ui, sans-serif; color: var(--muted); letter-spacing: 1px; }
  #overlay .sw { width: 30px; height: 30px; padding: 0 !important; border-radius: 50% !important; background: var(--c) !important; }
  #overlay .sw.on { box-shadow: 0 0 0 3px #fff; }
  #overlay .modes button.on { border-color: var(--gold); color: var(--gold); }
  #overlay .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 18px; font-size: 14px; }
  #overlay .rank { font: 900 64px system-ui, sans-serif; line-height: 1; }
  @media (max-height: 560px) {
    #overlay .hero svg { display: none; }
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>



<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const nf = (n) => Math.floor(n).toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "note più lente e più rade · non si perde mai", travel: 1.7, grid: 1, fail: false },
    normale:   { label: "NORMALE",   color: "#ffb0e0", desc: "note sulle crome · se l'energia finisce, cala il sipario", travel: 1.35, grid: 0.5, fail: true },
    difficile: { label: "DIFFICILE", color: "#ff6a9a", desc: "ogni nota della melodia, accordi a due corsie e note lunghe · energia severa", travel: 1.08, grid: 0.25, fail: true },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "lumi-difficulty";
  const bestKey = (id) => `lumi-best-${id}`;
  const songKey = (s, d) => `lumi-song-${s}-${d}`;
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];

  // ---------- Three songs of our own ----------
  // chords are semitone offsets from the key; each song is built bar by bar from its sections
  const SONGS = [
    { id: "stella", title: "Stella Cadente", mood: "pop allegro", bpm: 124, key: 60, scale: [0, 2, 4, 5, 7, 9, 11], color: "#ff8ad6", seed: 7,
      prog: { verse: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]], pre: [[5, 9, 12], [7, 11, 14], [4, 7, 11], [9, 12, 16]], chorus: [[5, 9, 12], [7, 11, 14], [4, 7, 11], [9, 12, 16]] },
      form: [["intro", 4], ["verse", 8], ["pre", 4], ["chorus", 8], ["verse", 8], ["pre", 4], ["chorus", 8], ["chorus", 8], ["outro", 4]], style: "pop" },
    { id: "neon", title: "Notte al Neon", mood: "elettronica da ballare", bpm: 136, key: 57, scale: [0, 2, 3, 5, 7, 8, 10], color: "#5ae0ff", seed: 21,
      prog: { verse: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], pre: [[-4, 0, 3], [-2, 2, 5], [0, 3, 7], [-2, 2, 5]], chorus: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]] },
      form: [["intro", 4], ["verse", 8], ["chorus", 8], ["verse", 8], ["pre", 4], ["chorus", 8], ["chorus", 8], ["outro", 2]], style: "edm" },
    { id: "pixel", title: "Cuore di Pixel", mood: "funky, a passo lento", bpm: 108, key: 62, scale: [0, 2, 3, 5, 7, 9, 10], color: "#ffd25a", seed: 33,
      prog: { verse: [[0, 3, 7, 10], [5, 9, 12, 15], [-2, 2, 5, 9], [7, 10, 14, 17]], pre: [[3, 7, 10, 14], [5, 9, 12, 15], [0, 3, 7, 10], [5, 9, 12, 16]], chorus: [[3, 7, 10, 14], [5, 9, 12, 15], [0, 3, 7, 10], [7, 10, 14, 17]] },
      form: [["intro", 4], ["verse", 8], ["chorus", 8], ["verse", 8], ["pre", 4], ["chorus", 8], ["outro", 4]], style: "funk" },
  ];
  const RHYTHMS = {
    verse: [[[0, 2], [3, 1], [4, 2], [8, 3], [12, 2], [14, 2]], [[0, 3], [4, 2], [6, 2], [8, 2], [10, 4], [14, 2]], [[2, 2], [4, 2], [6, 2], [8, 4], [12, 4]]],
    pre: [[[0, 4], [4, 4], [8, 4], [12, 4]], [[0, 2], [2, 2], [4, 4], [8, 2], [10, 2], [12, 4]]],
    chorus: [[[0, 2], [2, 2], [4, 2], [6, 2], [8, 3], [11, 1], [12, 4]], [[0, 3], [3, 3], [6, 2], [8, 2], [10, 2], [12, 2], [14, 2]], [[0, 2], [2, 1], [3, 3], [6, 2], [8, 6], [14, 2]]],
  };
  function buildSong(S) {
    const rng = mulberry(S.seed), ev = [], sections = [];
    const lo = S.key + 10, hi = S.key + 26;
    const inScale = (m) => S.scale.includes((((m - S.key) % 12) + 12) % 12);
    const near = (m, set) => { let best = m, bd = 99; for (let o = lo; o <= hi; o++) { if (!set(o)) continue; const d = Math.abs(o - m) + rng() * 0.6; if (d < bd) { bd = d; best = o; } } return best; };
    const cache = {};
    let bar = 0, last = S.key + 16;
    for (const [type, len] of S.form) {
      sections.push({ type, start: bar * 4, len: len * 4 });
      const prog = S.prog[type] || S.prog.verse;
      // the melody of a section is written once and reused when the section comes back
      if ((type === "verse" || type === "pre" || type === "chorus") && !cache[type]) {
        const mel = []; let prev = last;
        const rhythms = RHYTHMS[type];
        for (let b = 0; b < len; b++) {
          const chord = prog[b % prog.length].map((c) => S.key + c);
          const isChord = (m) => chord.some((c) => (((m - c) % 12) + 12) % 12 === 0);
          const motif = b % 2 === 1 && b % 4 !== 3 ? mel.filter((n) => n.bar === b - 1).map((n) => n.pos) : null;
          let rh = rhythms[Math.floor(rng() * rhythms.length)];
          if (b === len - 1) rh = [[0, 2], [2, 2], [4, 12]];
          const pos = motif ? rhythms.find((r) => r.length === motif.length) || rh : rh;
          for (const [p, d] of pos) {
            const strong = p % 8 === 0 || d >= 4;
            let m = strong ? near(prev + (rng() < 0.5 ? -2 : 2), isChord) : near(prev + Math.round((rng() - 0.5) * 5), inScale);
            if (b === len - 1 && p === 4) m = near(S.key + 12 + (type === "chorus" ? 12 : 0), (o) => (((o - S.key) % 12) + 12) % 12 === 0);
            mel.push({ bar: b, pos: p, dur: d, m }); prev = m;
          }
        }
        cache[type] = mel; last = prev;
      }
      for (let b = 0; b < len; b++) {
        const t0 = (bar + b) * 4, chord = prog[b % prog.length], root = S.key + chord[0];
        // drums
        const drums = type !== "intro" || b >= 2 || S.style === "edm";
        for (let q = 0; q < 16; q++) {
          const t = t0 + q / 4;
          if (drums) {
            if (S.style === "funk") { if (q === 0 || q === 6 || q === 10) ev.push({ t, v: "kick" }); }
            else if (q % 4 === 0 && !(type === "outro" && b === len - 1 && q > 0)) ev.push({ t, v: "kick" });
            if ((q === 4 || q === 12) && type !== "intro") ev.push({ t, v: "snare" });
            if (q % 2 === 0 || type === "chorus" || S.style === "funk") ev.push({ t, v: "hat", open: q % 4 === 2 && S.style === "edm" });
          }
          // bass
          const bp = S.style === "funk" ? [0, 3, 6, 8, 10, 14] : S.style === "edm" ? [2, 6, 10, 14] : [0, 2, 4, 6, 8, 10, 12, 14];
          if (bp.includes(q) && type !== "outro") ev.push({ t, v: "bass", m: root - 24 + (S.style === "pop" && q % 4 === 2 ? 12 : S.style === "funk" && q === 8 ? 7 : 0), d: S.style === "edm" ? 0.45 : 0.4 });
          // arpeggio in the chorus and intro
          if ((type === "chorus" || (type === "intro" && S.style === "edm")) && q % 1 === 0 && (S.style === "edm" || q % 2 === 0)) ev.push({ t, v: "arp", m: S.key + 12 + chord[q % chord.length] + (q % 8 >= 4 ? 12 : 0), d: 0.2 });
        }
        ev.push({ t: t0, v: "pad", ms: chord.map((c) => S.key + c), d: 4 });
        if (b === 0 && (type === "chorus" || type === "verse")) ev.push({ t: t0, v: "crash" });
        if (cache[type]) for (const n of cache[type].filter((n) => n.bar === b)) ev.push({ t: t0 + n.pos / 4, v: "lead", m: n.m, d: n.dur / 4, sec: type });
      }
      bar += len;
    }
    ev.sort((a, b) => a.t - b.t);
    return { ev, sections, beats: bar * 4, spb: 60 / S.bpm };
  }
  // the notes to hit, made from the music
  function buildChart(song, built, dId) {
    const D = DIFFICULTIES[dId], notes = [], spb = built.spb;
    const leads = built.ev.filter((e) => e.v === "lead");
    let lo = 999, hi = 0; for (const n of leads) { lo = Math.min(lo, n.m); hi = Math.max(hi, n.m); }
    const laneOf = (m) => clamp(Math.floor((m - lo) / Math.max(1, hi - lo + 1) * 4), 0, 3);
    const grid = D.grid, onGrid = (t) => Math.abs(t / grid - Math.round(t / grid)) < 0.01;
    let lastT = -9, lastLane = -1, lastM = 0, same = 0;
    const push = (t, lane, holdBeats) => {
      if (notes.some((n) => Math.abs(n.t - t) < 0.01 && n.lane === lane)) return;
      if (notes.some((n) => n.lane === lane && t > n.t - 0.01 && t < n.t + (n.hold || 0) + 0.24)) return;
      notes.push({ t, lane, hold: holdBeats || 0 });
    };
    for (const n of leads) {
      if (!onGrid(n.t)) continue;
      if (n.t - lastT < grid - 0.01) continue;
      // follow the shape of the melody: up goes right, down goes left
      let lane;
      if (lastLane < 0) lane = laneOf(n.m);
      else { const d = n.m - lastM; if (d === 0) { same++; lane = same % 3 === 2 ? 3 - lastLane : lastLane; } else { same = 0; lane = lastLane + Math.sign(d) * (Math.abs(d) >= 4 ? 2 : 1); if (lane > 3) lane = 3 - (lane - 3) - 1 < 0 ? 0 : 2; if (lane < 0) lane = 1; } }
      lastM = n.m;
      const holdMin = dId === "facile" ? 3 : 1.5;
      push(n.t, lane, n.d >= holdMin ? n.d - 0.25 : 0); lastT = n.t; lastLane = lane;
      if (dId === "difficile" && n.sec === "chorus" && Math.abs(n.t % 2) < 0.01 && n.d >= 0.5) push(n.t, (lane + 2) % 4, 0);
    }
    // drum notes where the melody rests (intro, outro, gaps)
    const kicks = built.ev.filter((e) => e.v === "kick" || e.v === "snare");
    let alt = 0;
    for (const k of kicks) {
      const step = dId === "facile" ? 2 : 1;
      if (Math.abs(k.t / step - Math.round(k.t / step)) > 0.01) continue;
      if (notes.some((n) => Math.abs(n.t - k.t) < 1.6 || (n.hold && k.t > n.t && k.t < n.t + n.hold + 0.5))) continue;
      push(k.t, k.v === "snare" ? 2 + (alt % 2) : alt % 2, 0); alt++;
    }
    notes.sort((a, b) => a.t - b.t || a.lane - b.lane);
    return notes.map((n) => ({ ...n, time: n.t * spb, end: (n.t + n.hold) * spb, judged: false, holding: false, done: false }));
  }

  // ---------- Audio ----------
  let audioCtx = null, master = null, comp = null;
  function startAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); comp = audioCtx.createDynamicsCompressor(); master = audioCtx.createGain(); master.gain.value = 0.8; master.connect(comp).connect(audioCtx.destination); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  let noiseBuf = null;
  function getNoise() { if (!noiseBuf) { const n = audioCtx.sampleRate; noiseBuf = audioCtx.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
  function env(g, t, a, peak, dur, rel = 0.05) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + Math.max(a, dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel); }
  function osc(type, f, t, dur, vol, out, detune = 0, cutoff = 0) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    let node = o; if (cutoff) { const fl = audioCtx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = cutoff; o.connect(fl); node = fl; }
    node.connect(g).connect(out || master); env(g, t, 0.008, vol, dur); o.start(t); o.stop(t + dur + 0.1); return o;
  }
  function noiseHit(t, dur, freq, type, vol) { const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(); s.buffer = getNoise(); f.type = type; f.frequency.value = freq; s.connect(f).connect(g).connect(master); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02); }
  function playEvent(e, t, spb, style) {
    switch (e.v) {
      case "kick": { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g).connect(master); o.start(t); o.stop(t + 0.32); break; }
      case "snare": noiseHit(t, 0.18, 1800, "bandpass", 0.45); osc("triangle", 190, t, 0.08, 0.2); break;
      case "hat": noiseHit(t, e.open ? 0.16 : 0.04, 8000, "highpass", e.open ? 0.12 : 0.08); break;
      case "crash": noiseHit(t, 1.1, 5000, "highpass", 0.12); break;
      case "bass": osc(style === "funk" ? "square" : "sawtooth", midi(e.m), t, e.d * spb, 0.16, null, 0, style === "edm" ? 700 : 500); osc("sine", midi(e.m), t, e.d * spb, 0.18); break;
      case "pad": for (const m of e.ms) { osc(style === "edm" ? "sawtooth" : "triangle", midi(m), t, e.d * spb * 0.98, style === "edm" ? 0.025 : 0.035, null, -6, 1800); osc("triangle", midi(m + 12), t, e.d * spb * 0.98, 0.015, null, 6); } break;
      case "arp": osc(style === "funk" ? "triangle" : "square", midi(e.m), t, e.d * spb, 0.03, null, 0, 3000); break;
      case "lead": {
        const dur = e.d * spb * 0.95, f = midi(e.m);
        const o1 = osc(style === "funk" ? "square" : "sawtooth", f, t, dur, 0.06, null, -7, 2600), o2 = osc("square", f, t, dur, 0.04, null, 7, 2200);
        if (dur > 0.3) for (const o of [o1, o2]) { const l = audioCtx.createOscillator(), lg = audioCtx.createGain(); l.frequency.value = 5.5; lg.gain.value = 6; l.connect(lg).connect(o.frequency); l.start(t + 0.18); l.stop(t + dur + 0.1); }
        break;
      }
    }
  }
  const sfx = {
    tap: (lane) => { if (!audioCtx) return; const t = audioCtx.currentTime; osc("sine", [880, 988, 1175, 1319][lane], t, 0.05, 0.05); },
    miss: () => { if (!audioCtx) return; noiseHit(audioCtx.currentTime, 0.08, 400, "lowpass", 0.15); },
    brillo: () => { if (!audioCtx) return; const t = audioCtx.currentTime; [784, 988, 1175, 1568].forEach((f, i) => osc("triangle", f, t + i * 0.05, 0.3, 0.06)); noiseHit(t, 0.8, 6000, "highpass", 0.08); },
    ui: () => { if (!audioCtx) return; osc("sine", 1320, audioCtx.currentTime, 0.06, 0.05); },
  };

  // ---------- Lumi: a little 3D dancer, posed bone by bone ----------

  canvas.addEventListener("wheel", (e) => { if (mode !== "free" || state !== "play") return; e.preventDefault(); cam.free = true; cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.001), 1.1, 4.2); cam.ty = lerp(1.25, 0.85, (cam.dist - 1.1) / 3.1); }, { passive: false });
  window.addEventListener("blur", () => { if (state === "play") togglePause(); });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  resize(); showTitle();
  requestAnimationFrame(frame);
})();
</script>

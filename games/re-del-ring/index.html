<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Re del Ring</title>
<style>
  :root {
    --bg: #10101e;
    --fg: #f4f6ee;
    --muted: #d0d0e8;
    --pink: #ffd23a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a3a6a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: move around the ring; the big COLPO punches (and is the button to hammer in a grapple or a pin), the small PRESA grabs, or pins a wrestler who is down */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(16, 16, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #8a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8781a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Presa">PRESA</button><button type="button" class="jump hop" aria-label="Colpo">COLPO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the ring floor, seen from the crowd: X from 0 to 400, Z from 0 (back ropes) to 190 (front ropes)
  const RX = 400, RZ = 190, BACK = 128, MATCH_T = 180;
  const sxOf = (X, Z) => W / 2 + (X - RX / 2) * (0.82 + 0.36 * Z / RZ);
  const syOf = (Z) => BACK + Z;
  // the six challengers on the way to the belt
  const RIVALS = [
    { name: "TORO BRAVO", trunks: "#d83a3a", skin: "#e8b088", hair: "#2a1a0a", power: 1, speed: 1, mash: 5.2, grab: 0.25, size: 1 },
    { name: "MISTER URAGANO", trunks: "#3a7ad8", skin: "#f0c8a0", hair: "#e8d040", power: 0.9, speed: 1.3, mash: 5.8, grab: 0.25, size: 0.95 },
    { name: "MASCHERA D'ARGENTO", trunks: "#c8c8d8", skin: "#d8a078", mask: "#c8c8d8", power: 1, speed: 1.1, mash: 6.3, grab: 0.45, size: 1 },
    { name: "GIGANTE DI PIETRA", trunks: "#5a5a5a", skin: "#c8906a", hair: null, power: 1.4, speed: 0.75, mash: 6.6, grab: 0.35, size: 1.22 },
    { name: "CAPITAN VULCANO", trunks: "#ff7a1a", skin: "#e0a070", hair: "#c81a1a", power: 1.15, speed: 1.15, mash: 7, grab: 0.35, size: 1.05 },
    { name: "BARONE NERO", trunks: "#1a1a1a", skin: "#a87050", hair: "#0a0a0a", power: 1.25, speed: 1.15, mash: 7.5, grab: 0.4, size: 1.1, champ: true },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "2 rivincite · avversari più lenti a reagire e meno forti nelle prese", retries: 2, ai: 0.75, mash: 0.8 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "1 rivincita · un incontro perso si può rigiocare una volta", retries: 1, ai: 1, mash: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "nessuna rivincita · avversari svelti e fortissimi nelle prese", retries: 0, ai: 1.25, mash: 1.18 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ring-difficulty";
  const bestKey = (id) => `ring-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    whoosh: lim(() => beep(500, 0.05, "triangle", 0.015, -250)),
    smack: lim(() => { beep(rnd(120, 160), 0.07, "square", 0.04, -60); beep(rnd(900, 1100), 0.03, "sawtooth", 0.02); }),
    grab: lim(() => beep(260, 0.08, "square", 0.03)),
    mash: lim(() => beep(rnd(600, 700), 0.025, "square", 0.012)),
    slam: lim(() => { beep(70, 0.35, "sawtooth", 0.08, -30); beep(110, 0.2, "square", 0.05, -60); }),
    count: lim(() => beep(880, 0.12, "square", 0.05)),
    kickout: lim(() => arp([523, 784], 0.05, 0.08, "square", 0.04)),
    bell: () => { arp([1568, 1568, 1568], 0.18, 0.4, "triangle", 0.06); },
    crowd: lim(() => { beep(rnd(200, 260), 0.4, "sawtooth", 0.01, 60); }),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, round = 0, lap = 0, retries = 1, wins = 0, matchT = 0, phase = "fight", phaseT = 0;
  let P = null, E = null, grapple = null, pin = null, parts = [], popups = [], message = null, flash = 0;
  let actHeld = false, wasAct = false, grabHeld = false, wasGrab = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const R = () => RIVALS[round];
  const lapK = () => 1 + 0.15 * lap;

  // ---------- Wrestlers ----------
  function wrestler(isPlayer, look) {
    return { player: isPlayer, low: 100, look, X: isPlayer ? 90 : RX - 90, Z: RZ * 0.55, face: isPlayer ? 1 : -1, energy: 100, st: "idle", t: 0, hits: 0, hitT: 0, anim: 0, inv: 0, cd: 0, think: 0, plan: null, mashT: 0 };
  }
  const PLAYER_LOOK = { name: "TU", trunks: "#3ad84a", skin: "#f0c090", hair: "#5a2a0a", size: 1 };
  const standing = (w) => ["idle", "walk", "punch", "wind", "stun", "daze"].includes(w.st);
  const near = (a, b, dx = 46, dz = 20) => Math.abs(a.X - b.X) < dx && Math.abs(a.Z - b.Z) < dz;
  function addScore(n, w, col = "#ffe8a0") { score += n; if (w) popups.push({ x: sxOf(w.X, w.Z), y: syOf(w.Z) - 80, text: `+${n}`, col, t: 0 }); }
  function burst(w, col, n = 8) { const x = sxOf(w.X, w.Z), y = syOf(w.Z) - 50; for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-110, 110), vy: rnd(-140, 20), t: 0, life: rnd(0.3, 0.6), col }); }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startMatch() {
    P = wrestler(true, PLAYER_LOOK); E = wrestler(false, R());
    grapple = null; pin = null; matchT = MATCH_T; phase = "intro"; phaseT = 2.4;
    message = { text: `INCONTRO ${round + 1} di ${RIVALS.length}${lap ? ` · giro ${lap + 1}` : ""}`, sub: `contro ${R().name}${R().champ ? " · in palio la cintura!" : ""}`, t: 0, long: true };
    sfx.bell();
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; round = 0; lap = 0; wins = 0; retries = diff.retries; parts = []; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startMatch();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function endMatch(playerWon, how) {
    phase = "end"; phaseT = 3.4; grapple = null;
    sfx.bell();
    if (playerWon) {
      const used = MATCH_T - matchT;
      const bonus = 2000 * (round + 1) * lapK() + Math.max(0, Math.round(matchT)) * 10 + Math.round(P.energy) * 20;
      addScore(Math.round(bonus));
      wins++;
      if (used < 30) impresa("rapido");
      if (P.low < 25) impresa("rimonta");
      if (R().champ) impresa("campione");
      P.st = "win"; P.t = 0; sfx.win();
      message = { text: R().champ ? "SEI IL CAMPIONE!" : "HAI VINTO!", sub: `${how} · bonus ${Math.round(bonus).toLocaleString("it-IT")}`, t: 0, long: true };
    } else {
      E.st = "win"; E.t = 0; sfx.lose();
      message = { text: "HAI PERSO", sub: `${how}${retries > 0 ? " · c'è una rivincita" : ""}`, t: 0, long: true };
    }
    phaseT = 3.4; P.won = playerWon;
  }
  function afterMatch() {
    if (P.won) { round++; if (round >= RIVALS.length) { round = 0; lap++; } startMatch(); }
    else if (retries > 0) { retries--; startMatch(); }
    else gameOver();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">FINE DEL TORNEO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${wins} ${wins === 1 ? "incontro vinto" : "incontri vinti"} · ultimo avversario ${R().name} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>SALI SUL RING</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>RE DEL RING</h1>
       <p>Sei lottatori ti separano dalla cintura di campione. Sul ring si picchia, ci si afferra e si vola: per vincere un incontro bisogna schienare l'avversario a terra mentre l'arbitro conta fino a tre. Ma chi ha ancora energia si libera, quindi prima stancalo con pugni e proiezioni.</p>
       <div class="pts">
         <span><b>Colpo</b></span><span>un pugno · tre di fila stordiscono l'avversario (le stelline): in quel momento non resiste alle prese</span>
         <span><b>Presa</b></span><span>da vicino afferri l'avversario: premete COLPO più in fretta che potete, chi vince lo scaraventa a terra</span>
         <span><b>Schienata</b></span><span>PRESA su un avversario a terra: l'arbitro conta, e chi è sotto deve premere COLPO in fretta per liberarsi (con poca energia ne servono di più)</span>
         <span><b>Punti</b></span><span>pugno 50 · proiezione 300 · liberarsi 200 · vittoria 2.000 × incontro più tempo ed energia rimasti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: muoviti sul ring · COLPO (e da premere in fretta nelle prese) · PRESA</p>`
         : `<p class="muted help">Frecce o WASD per muoverti · SPAZIO o J colpo (premilo in fretta nelle prese) · K o X presa · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SUONA LA CAMPANA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;

    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = col; const fw = w * clamp(frac, 0, 1); ctx.fillRect(right ? x + w - fw : x, y, fw, 8);
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 7);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(16,16,30,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle";
    const x0 = touchMode ? 130 : 10;
    ctx.textAlign = "left"; ctx.fillStyle = "#ffffff"; ctx.font = "900 14px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#d0d0e8"; ctx.font = "700 8px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")} · rivincite ${retries}`, x0, 25);
    // the two energies either side of the clock
    const cx = touchMode ? 400 : 380;
    ctx.fillStyle = "#3ad84a"; ctx.font = "900 8px system-ui"; ctx.textAlign = "right"; ctx.fillText("TU", cx - 22, 7);
    bar(cx - 122, 12, 100, P ? P.energy / 100 : 1, "#3ad84a", true);
    ctx.fillStyle = "#ffffff"; ctx.font = "900 12px system-ui"; ctx.textAlign = "center";
    const t = Math.ceil(matchT); ctx.fillText(`${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`, cx, 16);
    ctx.fillStyle = "#ff8a5a"; ctx.font = "900 8px system-ui"; ctx.textAlign = "left"; ctx.fillText(R().name, cx + 22, 7);
    bar(cx + 22, 12, 100, E ? E.energy / 100 : 1, "#ff5a3a", false);
    ctx.textBaseline = "alphabetic";
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#10101e"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) { P = wrestler(true, PLAYER_LOOK); E = wrestler(false, RIVALS[0]); P.X = 160; E.X = 240; }
    drawArena();
    ropes(false);
    const list = [P, E].sort((a, b) => a.Z - b.Z || (a.st === "pinned" ? -1 : 1));
    for (const w of list) drawWrestler(w);
    drawReferee();
    ropes(true);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); outlined(p.text, p.x, p.y, "900 11px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    ctx.textAlign = "center";
    // the tug of war in a grapple
    if (grapple) {
      const g = grapple, me = g.a === P ? 1 : -1, v = clamp(g.tug * me, -1, 1);
      const bx = W / 2 - 110, by = TOP + 14;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx - 6, by - 6, 232, 30);
      ctx.fillStyle = "#ff5a3a"; ctx.fillRect(bx, by, 220, 10); ctx.fillStyle = "#3ad84a"; ctx.fillRect(bx, by, 110 + 110 * v, 10);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(bx + 110 + 110 * v - 2, by - 3, 4, 16);
      outlined(Math.floor(clock * 8) % 2 ? "PREMI COLPO IN FRETTA!" : "PREMI COLPO IN FRETTA!", W / 2, by + 24, "italic 900 11px system-ui", "#ffe84a", 3);
    }
    if (pin) {
      outlined(pin.count ? `${pin.count}!` : "SCHIENATA!", W / 2, 110, "italic 900 40px system-ui", "#ffffff", 7);
      if (pin.b === P) {
        const bx = W / 2 - 80, by = 126;
        ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(bx, by, 160, 8); ctx.fillStyle = "#3ad84a"; ctx.fillRect(bx, by, 160 * pin.presses / pin.need, 8);
        outlined("PREMI COLPO PER LIBERARTI!", W / 2, by + 24, "italic 900 12px system-ui", "#ffe84a", 3);
      }
    }
    if (phase === "intro" && phaseT < 1) outlined("COMBATTETE!", W / 2, 150, "italic 900 34px system-ui", "#ffd23a", 7);
    if (message && !pin) {
      const lifeT = message.long ? 3 : 1.6;
      ctx.globalAlpha = Math.min(1, (lifeT - message.t) * 2);
      outlined(message.text, W / 2, 96, "italic 900 26px system-ui", "#ffd23a", 6);
      if (message.sub) outlined(message.sub, W / 2, 118, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="ring-best-" data-kind="score"></script>

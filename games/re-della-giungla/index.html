<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Re della Giungla</title>
<style>
  :root {
    --bg: #0c1a0e;
    --fg: #f4f6ee;
    --muted: #c8e0b8;
    --pink: #ffd23a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run, swim (all four ways) and duck; the big SALTA jumps and lets go of a vine, the small COLTELLO stabs in the river */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(120, 220, 110, 0.9); background: rgba(120, 220, 110, 0.22); }
  #touch .jump.on { background: rgba(120, 220, 110, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 9px; letter-spacing: 0; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 8px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 26, 14, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e2004; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8881a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Coltello">COLTELLO</button><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const G = 950;
  const SCENES = ["liane", "fiume", "massi", "cannibali"];
  const SCENE_NAMES = { liane: "LE LIANE", fiume: "IL FIUME", massi: "LA COLLINA DEI MASSI", cannibali: "IL VILLAGGIO" };
  const SCENE_HINT = { liane: "salta da una liana all'altra", fiume: "colpisci i coccodrilli quando chiudono la bocca, e torna su a respirare", massi: "salta i massi grandi, accucciati sotto quelli che rimbalzano", cannibali: "salta i cannibali e libera l'esploratrice" };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · tutto più lento · le liane si afferrano più facilmente", lives: 5, tempo: 0.85, grab: 1.3 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "3 vite", lives: 3, tempo: 1, grab: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · tutto più veloce · liane più lontane", lives: 3, tempo: 1.15, grab: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "regiungla-difficulty";
  const bestKey = (id) => `regiungla-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  // the feats of shared/imprese.js: the game only announces them, the hall keeps them
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let riverKills = 0, roundLost = false;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    jump: lim(() => beep(300, 0.12, "square", 0.03, 300)),
    grab: lim(() => arp([523, 784], 0.05, 0.08, "square", 0.035)),
    yell: () => { beep(500, 0.3, "sawtooth", 0.04, 400); beep(900, 0.3, "sawtooth", 0.03, -300, 0.3); },
    stab: lim(() => { noise(0.08, 0.08, 2000); beep(800, 0.06, "square", 0.03, -400); }),
    kill: lim(() => arp([659, 523, 392], 0.05, 0.08, "square", 0.035)),
    splash: lim(() => noise(0.25, 0.08, 900)),
    breath: lim(() => beep(600, 0.15, "sine", 0.04, 300)),
    roll: lim(() => noise(0.1, 0.05, 200)),
    pass: lim(() => beep(988, 0.06, "square", 0.025)),
    die: () => { noise(0.3, 0.1, 400); for (let i = 0; i < 6; i++) beep(600 - i * 70, 0.12, "triangle", 0.045, 0, i * 0.07); },
    clear: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0, sceneT = 0;
  let score = 0, lives = 3, round = 1, sceneIdx = 0, bestCache = 0, nextLife = 20000;
  let P = null, camX = 0, vines = [], crocs = [], rocks = [], natives = [], parts = [], popups = [], message = null, END = 0, air = 100, spawnT = 0, bonus = 0;
  let jumpPressed = false, stabPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const scene = () => SCENES[sceneIdx];
  const tempo = () => diff.tempo * (1 + 0.12 * Math.min(6, round - 1));
  const SURF = 110, RIVER_BOT = 336;
  const groundAt = (x) => 330 - Math.max(0, x - 120) * 0.22;

  // ---------- Scenes ----------
  function buildScene() {
    camX = 0; parts = []; popups = []; crocs = []; rocks = []; natives = []; vines = [];
    const s = scene(), lvl = Math.min(6, round - 1);
    if (s === "liane") {
      // vines swinging from the canopy: the gaps grow, the swings get faster
      let x = 150;
      for (let i = 0; i < 8 + lvl; i++) {
        const L = rnd(120, 165);
        vines.push({ x, y: TOP + 6, L, A: rnd(0.55, 0.8), w: Math.sqrt(G / L) * rnd(0.9, 1.05), ph: rnd(0, TAU) });
        x += rnd(118, 140) + lvl * 5 + (difficulty === "difficile" ? 8 : difficulty === "facile" ? -8 : 0);
      }
      END = x - 40;
      // every vine must lead to the next one: if a swing never reaches it, its rhythm is reshuffled
      const tp = diff.tempo * (1 + 0.12 * lvl);
      for (let i = 0; i < vines.length; i++) {
        for (let tries = 0; tries < 40 && reachable(vines[i], vines[i + 1] || null, tp) < 0.3; tries++) {
          const o = vines[i + 1]; if (!o) { END -= 10; continue; }
          o.ph = rnd(0, TAU); o.w = Math.sqrt(G / o.L) * rnd(0.9, 1.05);
        }
      }
      const v = vines[0];
      P = { mode: "vine", v, r: v.L, x: 0, y: 0, vx: 0, vy: 0, face: 1 };
      setOnVine(P);
    } else if (s === "fiume") {
      END = 1600 + lvl * 150;
      P = { mode: "swim", x: 60, y: SURF + 2, vx: 0, vy: 0, face: 1, stab: 0 };
      air = 100; spawnT = 1.5;
    } else if (s === "massi") {
      END = 1500 + lvl * 120;
      P = { mode: "run", x: 60, y: groundAt(60), vx: 0, vy: 0, face: 1, duck: false, air: false };
      spawnT = 1.2;
    } else {
      END = 560;
      P = { mode: "run", x: 50, y: 300, vx: 0, vy: 0, face: 1, duck: false, air: false };
      for (const [i, x] of [[0, 260], [1, 420]]) natives.push({ x, y: 300, vy: 0, hop: 0.6 + i * 0.7, beat: rnd(1.5, 1.9), passed: false, dir: 1, home: x });
    }
    sceneT = 0;
  }
  // the share of release moments (over a few swings) from which vine v reaches vine o, or the far bank
  function reachable(v, o, tp) {
    let ok = 0, tot = 0;
    for (let t0 = 0; t0 < 5; t0 += 0.05) {
      tot++;
      const w = v.w * tp, a = v.A * Math.sin(t0 * w + v.ph), da = v.A * w * Math.cos(t0 * w + v.ph), r = v.L - 10;
      let x = v.x + Math.sin(a) * r, y = v.y + Math.cos(a) * r + 42, vx = Math.cos(a) * r * da + 90, vy = -Math.sin(a) * r * da - 190;
      for (let k = 0; k < 160; k++) {
        const h = 1 / 60; vy += G * h; x += vx * h; y += vy * h;
        if (y > 350) break;
        if (!o) { if (x > END && y < 300) { ok++; break; } continue; }
        const tt = t0 + (k + 1) * h, oa = o.A * Math.sin(tt * o.w * tp + o.ph), ex = Math.sin(oa), ey = Math.cos(oa), hy = y - 42;
        const proj = (x - o.x) * ex + (hy - o.y) * ey;
        if (proj > 40 && proj < o.L && Math.abs((x - o.x) * ey - (hy - o.y) * ex) < 14) { ok++; break; }
      }
    }
    return ok / tot;
  }
  const vineAngle = (v) => v.A * Math.sin(sceneT * v.w * tempo() + v.ph);
  function setOnVine(p) {
    const a = vineAngle(p.v);
    p.x = p.v.x + Math.sin(a) * p.r; p.y = p.v.y + Math.cos(a) * p.r + 42;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 1; sceneIdx = 0; nextLife = 30000; roundLost = false;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginScene();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginScene() {
    buildScene(); riverKills = 0;
    bonus = 3000 * round;
    message = { text: SCENE_NAMES[scene()], sub: SCENE_HINT[scene()], t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 70000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: P.x, y: P.y - 50, text: "VITA EXTRA!", color: "#7ed87a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play") return;
    if (window.__deaths) window.__deaths.push([round, scene(), by, Math.round(P.x)]);
    if (window.__god) { if (by === "aria") air = 100; return; }
    roundLost = true;
    lives--; sfx.die(); burst(P.x, P.y - 10, "#ffffff", 18, 110, 0.6);
    message = { text: { caduta: "GIÙ DALLA LIANA!", coccodrillo: "PRESO DAL COCCODRILLO!", aria: "SENZA FIATO!", masso: "TRAVOLTO DA UN MASSO!", cannibale: "CATTURATO!" }[by] || "AHIA!", t: 0 };
    state = "dead"; stateT = 2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · giro ${round} · ${SCENE_NAMES[scene()].toLowerCase()} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>TORNA NELLA GIUNGLA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>RE DELLA GIUNGLA</h1>
       <p>I cannibali hanno rapito l'esploratrice! Attraversa la giungla in quattro prove: salta di liana in liana, nuota nel fiume tra i coccodrilli, risali la collina dei massi e salta i cannibali per tirarla fuori dal pentolone. Poi si ricomincia, tutto più veloce.</p>
       <div class="pts">
         <span><b>Prove</b></span><span>liana presa 100 · coccodrillo 200 · masso superato 100 · cannibale saltato 300 · ogni prova vale il bonus di tempo rimasto</span>
         <span><b>Fiume</b></span><span>il coltello funziona solo se il coccodrillo ha la bocca chiusa · in superficie si riprende fiato</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per correre, nuotare e accucciarti · SALTA (anche per lasciare la liana) · COLTELLO nel fiume</p>`
         : `<p class="muted help">Frecce o W A S D · SPAZIO o K per saltare e lasciare la liana · J o X per il coltello · P pausa</p>`}
       ${difficultyHTML()}

        const x = n.x, y = n.y;
        ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x - 4, y - 16); ctx.lineTo(x - 6, y); ctx.moveTo(x + 4, y - 16); ctx.lineTo(x + 6, y); ctx.stroke();
        ctx.fillStyle = "#6a4a2a"; ctx.fillRect(x - 8, y - 38, 16, 22);
        ctx.fillStyle = "#c8281a"; ctx.fillRect(x - 9, y - 20, 18, 6);
        ctx.fillStyle = "#6a4a2a"; ctx.beginPath(); ctx.arc(x, y - 44, 7, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffd23a"; ctx.fillRect(x - 6, y - 54, 3, 8); ctx.fillStyle = "#ff5a3a"; ctx.fillRect(x + 2, y - 56, 3, 9);
        ctx.strokeStyle = "#a8743a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 12, y - 60); ctx.lineTo(x - 12, y - 4); ctx.stroke();
        ctx.fillStyle = "#c8c8d8"; ctx.beginPath(); ctx.moveTo(x - 15, y - 60); ctx.lineTo(x - 12, y - 68); ctx.lineTo(x - 9, y - 60); ctx.fill();
      }
      if (state !== "dead" || Math.floor(clock * 6) % 2) drawHero(P.x, P.y, P.air ? "fly" : P.duck ? "duck" : "run");
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0c1a0e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 2.8 : 2.2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0c1a0e"; ctx.strokeText(message.text, W / 2, 90); ctx.fillText(message.text, W / 2, 90);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 109); ctx.fillText(message.sub, W / 2, 109); }
      ctx.globalAlpha = 1;
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(12,26,14,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8e0b8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 10px system-ui"; ctx.fillText(`GIRO ${round} · ${sceneIdx + 1}/4`, x0 + 80, 21);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 10px system-ui"; ctx.fillText(`BONUS ${(Math.round(bonus / 10) * 10).toLocaleString("it-IT")}`, x0 + 170, 14);
    if (scene() === "fiume") {
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x0 + 260, 9, 80, 10);
      ctx.fillStyle = air < 30 ? (Math.floor(clock * 6) % 2 ? "#ff3a3a" : "#ff8a3a") : "#7ad8ff"; ctx.fillRect(x0 + 260, 9, 80 * air / 100, 10);
      ctx.fillStyle = "#ffffff"; ctx.font = "800 8px system-ui"; ctx.fillText("ARIA", x0 + 345, 14);
    }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#f4ecd0"; ctx.beginPath(); ctx.arc(lx - 5 - i * 13, 15, 5, Math.PI, TAU); ctx.fill(); ctx.fillRect(lx - 11 - i * 13, 15, 12, 2); }
    ctx.textBaseline = "alphabetic";
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="regiungla-best-" data-kind="score"></script>

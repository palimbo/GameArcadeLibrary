<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Salva Mariky!</title>
<style>
  :root {
    --bg: #14223a;
    --fg: #f4f6ee;
    --muted: #c8d0dc;
    --gold: #ffd23a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2e3a4e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 26, 36, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #6a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "5 vite · nemici più lenti · 400 secondi per livello · il Barone cade dopo 2 salti in testa", lives: 5, speed: 0.8, time: 400, boss: 2 },
    normale:   { label: "NORMALE",   color: "#ffd66b", desc: "3 vite · 300 secondi per livello · il Barone cade dopo 3 salti in testa", lives: 3, speed: 1, time: 300, boss: 3 },
    difficile: { label: "DIFFICILE", color: "#ff6b7d", desc: "3 vite · nemici più veloci · 240 secondi per livello · il Barone vuole 4 salti in testa", lives: 3, speed: 1.25, time: 240, boss: 4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "salvamariky-difficulty";
  const bestKey = (id) => `salvamariky-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const nf = (n) => n.toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- The world ----------
  const T = 24, ROWS = 15;
  const SOLID = new Set(["#", "B", "C", "P", "F", "U", "X", "D"]);   // D: dark ceiling rock
  // the six levels, built with a few simple tools
  const LEVELS = [
    { name: "I Prati di Fiordaliso", theme: "prato", len: 172, build(b) {
      b.ground(0, 29, 2); b.row(8, 9, "C"); b.row(12, 9, "BPBCB"); b.enemy(20, "g"); b.coins(13, 6, 3);
      b.ground(29, 35, 4); b.ground(35, 50, 2); b.enemy(40, "g"); b.enemy(45, "g"); b.coins(36, 9, 4);
      b.ground(53, 76, 2); b.plat(56, 10, 4); b.coins(56, 9, 4); b.row(63, 9, "BBCBB"); b.row(65, 5, "C"); b.enemy(66, "g"); b.enemy(70, "g");
      b.stairs(76, 4, 1); b.ground(76, 80, 2); b.ground(82, 120, 2); b.stairs(82, 3, -1); b.check(90);
      b.row(95, 9, "BFB"); b.enemy(100, "g"); b.enemy(103, "g"); b.row(104, 6, "BBBB"); b.coins(104, 5, 4); b.enemy(112, "g");
      b.ground(123, 172, 2); b.plat(126, 10, 3); b.enemy(132, "g"); b.row(135, 9, "BCBCB"); b.enemy(142, "g"); b.enemy(146, "g");
      b.stairs(152, 5, 1); b.ground(152, 158, 2); b.bell(166);
    } },
    { name: "Le Grotte di Brina", theme: "grotta", len: 176, build(b) {
      b.ceiling(0, 176, 2); b.ground(0, 30, 2); b.row(10, 9, "BCBBPB"); b.enemy(18, "g"); b.enemy(24, "r"); b.coins(10, 8, 6);
      b.ground(34, 60, 2); b.mover(30, 11, 3, "y", 3); b.enemy(42, "g"); b.row(46, 8, "BBBBBB"); b.coins(46, 11, 6); b.enemy(52, "r");
      b.ground(60, 64, 5); b.ground(64, 88, 2); b.enemy(70, "g"); b.enemy(74, "g"); b.row(76, 9, "BFB"); b.check(80);
      b.mover(88, 11, 3, "y", 2); b.mover(93, 10, 3, "y", 2); b.ground(99, 130, 2); b.enemy(105, "r"); b.enemy(110, "g"); b.row(112, 9, "CBCBC"); b.enemy(118, "g"); b.spikes(122, 125, 12);
      b.ground(134, 176, 2); b.mover(130, 11, 3, "x", 2); b.enemy(140, "r"); b.enemy(146, "g"); b.row(150, 9, "BPB"); b.stairs(156, 4, 1); b.ground(156, 162, 2); b.bell(170);
    } },
    { name: "I Colli del Tramonto", theme: "colli", len: 184, build(b) {
      b.ground(0, 24, 2); b.ground(24, 36, 4); b.enemy(16, "g"); b.row(10, 9, "BCB"); b.enemy(30, "a", 8);
      b.plat(39, 9, 3); b.plat(44, 7, 3); b.coins(44, 6, 3); b.ground(48, 70, 3); b.enemy(54, "g"); b.enemy(58, "a", 7); b.row(60, 8, "BPBB"); b.enemy(66, "g");
      b.plat(72, 10, 3); b.ground(77, 105, 2); b.check(80); b.enemy(86, "a", 8); b.enemy(90, "g"); b.enemy(93, "g"); b.row(95, 9, "CBFBC"); b.coins(95, 5, 5);
      b.ground(105, 112, 5); b.ground(112, 126, 2); b.enemy(118, "r"); b.plat(128, 9, 3); b.plat(133, 11, 3); b.ground(138, 184, 2); b.enemy(144, "a", 7); b.enemy(150, "g");
      b.row(154, 9, "BCBCB"); b.enemy(158, "g"); b.stairs(164, 5, 1); b.ground(164, 170, 2); b.bell(178);
    } },
    { name: "Il Sentiero delle Nuvole", theme: "nuvole", len: 180, build(b) {
      b.ground(0, 14, 3); b.plat(16, 10, 4); b.plat(23, 8, 4); b.coins(23, 7, 4); b.mover(29, 9, 3, "x", 3); b.plat(38, 10, 5); b.enemy(40, "a", 7);
      b.plat(46, 8, 3); b.row(46, 4, "C"); b.mover(51, 10, 3, "y", 3); b.ground(56, 72, 3); b.enemy(60, "g"); b.row(62, 8, "BPB"); b.enemy(66, "g"); b.check(68);
      b.plat(74, 10, 3); b.plat(78, 8, 3); b.plat(82, 10, 4); b.enemy(80, "a", 8); b.mover(88, 9, 3, "x", 2); b.plat(95, 9, 10); b.coins(99, 8, 6); b.row(101, 5, "BFB");
      b.mover(107, 10, 3, "y", 3); b.ground(112, 130, 3); b.enemy(116, "g"); b.enemy(120, "r"); b.enemy(124, "a", 7);
      b.plat(131, 10, 3); b.mover(137, 9, 3, "x", 2); b.plat(145, 10, 5); b.plat(152, 8, 3); b.ground(157, 180, 3); b.enemy(162, "g"); b.bell(174);
    } },
    { name: "La Palude Nebbiosa", theme: "palude", len: 182, build(b) {
      b.water(0, 182); b.ground(0, 18, 3); b.enemy(12, "g"); b.row(8, 8, "BCB"); b.plat(20, 11, 3); b.ground(25, 44, 3); b.enemy(30, "r"); b.enemy(36, "g"); b.row(34, 8, "BPB");
      b.plat(46, 10, 2); b.plat(50, 11, 2); b.ground(54, 74, 3); b.enemy(58, "a", 8); b.enemy(64, "g"); b.spikes(68, 70, 11); b.check(72);
      b.mover(76, 11, 3, "x", 3); b.ground(84, 104, 3); b.row(88, 8, "CFC"); b.enemy(92, "r"); b.enemy(97, "g"); b.enemy(100, "g");
      b.plat(105, 10, 3); b.plat(110, 9, 3); b.plat(115, 10, 2); b.ground(118, 140, 3); b.enemy(124, "a", 7); b.enemy(128, "r"); b.row(130, 8, "BCBCB");
      b.mover(142, 11, 3, "y", 3); b.ground(147, 182, 3); b.enemy(152, "g"); b.enemy(156, "g"); b.stairs(162, 4, 1); b.ground(162, 167, 3); b.bell(176);
    } },
    { name: "Il Castello del Barone", theme: "castello", len: 170, boss: true, build(b) {
      b.ceiling(0, 170, 1); b.lava(0, 170); b.stone(0, 16, 3); b.row(8, 9, "BPB"); b.enemy(12, "g");
      b.stone(19, 30, 3); b.spikes(23, 25, 11); b.enemy(28, "r"); b.mover(32, 10, 3, "x", 3); b.stone(40, 58, 3); b.enemy(44, "g"); b.enemy(48, "g"); b.row(50, 8, "BFB"); b.enemy(54, "r");
      b.stone(61, 64, 6); b.stone(67, 70, 4); b.stone(73, 92, 3); b.check(76); b.enemy(82, "a", 8); b.enemy(86, "g"); b.spikes(89, 90, 11);
      b.mover(94, 10, 2, "y", 3); b.mover(99, 9, 2, "x", 2); b.stone(105, 120, 3); b.row(108, 8, "CPC"); b.enemy(114, "r");
      // the Baron's hall
      b.stone(122, 170, 3); b.stone(122, 124, 5); b.stone(167, 170, 12); b.arena(125, 166); b.cage(160);
    } },
  ];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), pauseBtn = document.getElementById("pauseBtn");
  let W = 640, H = 360, portrait = false, pxRatio = 1, VW = 640;
  let touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  let pads = [];
  function layoutPads() {
    // on a phone held upright the controls sit under the game; sideways they float on it
    pads = portrait
      ? [{ id: "left", x: 50, y: 500, r: 46 }, { id: "right", x: 150, y: 500, r: 46 }, { id: "fire", x: 236, y: 540, r: 38 }, { id: "jump", x: 310, y: 470, r: 46 }]
      : [{ id: "left", x: 46, y: 318, r: 32 }, { id: "right", x: 122, y: 318, r: 32 }, { id: "fire", x: 528, y: 324, r: 27 }, { id: "jump", x: 598, y: 300, r: 34 }];
  }
  function resize() {
    portrait = window.innerHeight > window.innerWidth * 1.15;
    W = portrait ? 360 : 640; H = portrait ? 640 : 360; VW = portrait ? 360 : 640;
    layoutPads();
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio); canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, music = true;
  try { music = load("salvamariky-music") !== "0"; } catch { /* ignore */ }
  function tone(freq, dur, type = "square", vol = 0.03, delay = 0, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, freq, vol) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime, n = Math.floor(audioCtx.sampleRate * dur), b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(audioCtx.destination); s.start(t);
  }
  const sfx = {
    jump: () => tone(330, 0.15, "square", 0.025, 0, 660),
    coin: () => { tone(988, 0.06, "square", 0.025); tone(1319, 0.2, "square", 0.025, 0.06); },
    stomp: () => { tone(220, 0.08, "square", 0.03, 0, 110); noise(0.08, 900, 0.08); },
    bump: () => tone(160, 0.07, "triangle", 0.04),
    brick: () => noise(0.25, 1600, 0.12),
    item: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.08, "square", 0.025, i * 0.05)),
    power: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.09, "square", 0.025, i * 0.06)),
    hurt: () => tone(500, 0.3, "square", 0.03, 0, 120),
    shoot: () => tone(700, 0.07, "triangle", 0.03, 0, 300),
    die: () => [523, 494, 466, 440, 330, 262].forEach((f, i) => tone(f, 0.16, "square", 0.03, i * 0.13)),
    bell: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.6, "triangle", 0.04, i * 0.12)),
    life: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.1, "square", 0.025, i * 0.07)),
    boss: () => { tone(110, 0.3, "sawtooth", 0.04); tone(98, 0.4, "sawtooth", 0.04, 0.2); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.22, "square", 0.03, i * 0.14)),
  };
  // a little tune of our own, faster or darker depending on the place
  const MEL = [72, 0, 76, 79, 77, 76, 74, 0, 72, 74, 76, 72, 69, 0, 67, 0, 72, 0, 76, 79, 81, 79, 77, 76, 74, 76, 77, 74, 72, 0, 0, 0];
  const BAS = [48, 55, 48, 55, 53, 60, 53, 60, 48, 55, 48, 55, 45, 52, 43, 50, 48, 55, 48, 55, 53, 60, 53, 60, 50, 57, 43, 50, 48, 55, 48, 0];
  const MOOD = { prato: [0, 0.2], grotta: [-3, 0.24], colli: [2, 0.2], nuvole: [5, 0.19], palude: [-5, 0.23], castello: [-7, 0.22], boss: [-10, 0.16] };
  let beat = 0, nextBeat = 0, mood = "prato";
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  setInterval(() => {
    if (!audioCtx || !music || state !== "play" || audioCtx.state !== "running") { if (audioCtx) nextBeat = audioCtx.currentTime + 0.05; return; }
    const [tr, step] = MOOD[mood] || MOOD.prato, minor = mood === "grotta" || mood === "palude" || mood === "castello" || mood === "boss";
    while (nextBeat < audioCtx.currentTime + 0.15) {
      const k = beat % 32, delay = Math.max(0, nextBeat - audioCtx.currentTime);
      let m = MEL[k]; if (m && minor && [76, 81, 64].includes(m)) m -= 1;
      if (m) tone(midi(m + tr), step * 0.9, "square", 0.012, delay);
      if (BAS[k]) tone(midi(BAS[k] + tr), step * 0.95, "triangle", 0.03, delay);
      beat++; nextBeat += step;
    }
  }, 50);

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0, stateT = 0;
  let score = 0, lives = 0, coins = 0, lvl = 0, bestCache = 0, coinsTotal = 0;
  let map = null, LV = null, levelW = 0, P = null, enemies = [], items = [], movers = [], shots = [], parts = [], texts = [], bumps = [];
  let checkReached = false, camX = 0, timeLeft = 0, checkpoint = null, checkX = 0, bellX = 0, hurtThisLevel = false, arena = null, boss = null, cage = null, chain = 0, deadT = 0, endT = 0;
  const isPlaying = () => ["intro", "play", "dead", "clear", "victory"].includes(state);

  // ---------- Building a level ----------
  function buildLevel(n) {
    LV = LEVELS[n]; levelW = LV.len; checkX = 0;
    map = [...Array(ROWS)].map(() => Array(levelW).fill("."));
    enemies = []; items = []; movers = []; shots = []; parts = []; texts = []; bumps = []; checkpoint = null; arena = null; boss = null; cage = null;
    const groundTop = (x) => { for (let y = 0; y < ROWS; y++) if (SOLID.has(map[y][x]) && map[y][x] !== "D") return y; return ROWS; };
    const pend = [];
    const b = {
      ground: (x0, x1, h) => { for (let x = x0; x < x1; x++) for (let y = ROWS - h; y < ROWS; y++) map[y][x] = "#"; },
      stone: (x0, x1, h) => { for (let x = x0; x < x1; x++) for (let y = ROWS - h; y < ROWS; y++) map[y][x] = "X"; },
      ceiling: (x0, x1, h) => { for (let x = x0; x < x1; x++) for (let y = 0; y < h; y++) map[y][x] = "D"; },
      row: (x, y, s) => { [...s].forEach((ch, k) => { map[y][x + k] = ch; }); },
      coins: (x, y, n) => { for (let k = 0; k < n; k++) map[y][x + k] = "o"; },
      plat: (x, y, w) => { for (let k = 0; k < w; k++) map[y][x + k] = "="; },
      stairs: (x, n, dir) => { for (let k = 0; k < n; k++) { const h = dir > 0 ? k + 1 : n - k; for (let y = ROWS - 2 - h; y < ROWS - 2; y++) map[y][x + k] = "X"; } },
      spikes: (x0, x1, y) => { for (let x = x0; x < x1; x++) map[y][x] = "^"; },
      water: (x0, x1) => { for (let x = x0; x < x1; x++) map[ROWS - 1][x] = "~"; },
      lava: (x0, x1) => { for (let x = x0; x < x1; x++) map[ROWS - 1][x] = "L"; },
      enemy: (x, kind, y) => pend.push(() => { const gy = y !== undefined ? y : groundTop(x); enemies.push(makeEnemy(kind, x * T, gy * T)); }),
      mover: (x, y, w, axis, range) => movers.push({ x: x * T, y: y * T, x0: x * T, y0: y * T, w: w * T, axis, range: range * T, t: x * 0.9, dx: 0, dy: 0 }),
      check: (x) => { checkX = x; checkpoint = { x: x * T, got: false }; },
      bell: (x) => { bellX = x * T; },
      arena: (x0, x1) => { arena = { x0: x0 * T, x1: x1 * T }; },
      cage: (x) => { cage = { x: x * T, y: (ROWS - 3) * T - 60, open: false }; },
    };
    LV.build(b); pend.forEach((f) => f());
    if (!LV.boss) arena = null;
    if (LV.boss) bellX = -1;
  }

    if (bellX > 0) { let gy = 0; for (let y = 0; y < ROWS; y++) if (solidAt(Math.floor(bellX / T), y)) { gy = y * T; break; } ctx.fillStyle = "#8a5a30"; ctx.fillRect(bellX - 4, gy - 110, 6, 110); ctx.fillRect(bellX + 38, gy - 110, 6, 110); ctx.fillRect(bellX - 8, gy - 116, 56, 8); const sw = state === "clear" ? Math.sin(stateT * 12) * 0.5 * Math.max(0, 1 - stateT / 2) : Math.sin(clock * 2) * 0.05; ctx.save(); ctx.translate(bellX + 20, gy - 108); ctx.rotate(sw); ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(-14, 30); ctx.quadraticCurveTo(-14, 4, 0, 4); ctx.quadraticCurveTo(14, 4, 14, 30); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#c8962a"; ctx.fillRect(-16, 28, 32, 4); ctx.beginPath(); ctx.arc(0, 34, 3, 0, TAU); ctx.fill(); ctx.restore(); }
    if (cage) { const gx = cage.x, gyy = cage.y; drawMariky(gx + 20, gyy + 58, cage.open); if (!cage.open) { ctx.strokeStyle = "#c8c8d0"; ctx.lineWidth = 3; for (let k = 0; k <= 5; k++) { ctx.beginPath(); ctx.moveTo(gx + k * 8, gyy); ctx.lineTo(gx + k * 8, gyy + 60); ctx.stroke(); } ctx.fillStyle = "#8a8a98"; ctx.fillRect(gx - 4, gyy - 6, 48, 8); ctx.fillRect(gx - 4, gyy + 58, 48, 6); } }
    for (const it of items) {
      if (it.kind === "pagnotta") { ctx.fillStyle = "#d89a4a"; rr(it.x, it.y + 4, it.w, it.h - 4, 8); ctx.fill(); ctx.fillStyle = "#f0c078"; for (let k = 0; k < 3; k++) ctx.fillRect(it.x + 4 + k * 5, it.y + 6, 2, 6); }
      else { ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(it.x + 10, it.y + it.h); ctx.lineTo(it.x + 10, it.y + 9); ctx.lineTo(it.x + 3, it.y + 1); ctx.moveTo(it.x + 10, it.y + 9); ctx.lineTo(it.x + 17, it.y + 1); ctx.stroke(); ctx.strokeStyle = "#ff5a6e"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(it.x + 3, it.y + 1); ctx.quadraticCurveTo(it.x + 10, it.y + 8, it.x + 17, it.y + 1); ctx.stroke(); }
    }
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBaron(boss);
    for (const s of shots) { ctx.fillStyle = "#8a8a9a"; ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, TAU); ctx.fill(); }
    if (P) drawNino(P.x, P.y, P.power > 0, P.face, P.anim, P.onGround, P.inv);
    for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); } ctx.globalAlpha = 1;
    for (const t of texts) if (!t.banner) { ctx.globalAlpha = 1 - t.t / 0.9; ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 3; ctx.font = "800 12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.strokeText(t.text, t.x, t.y - t.t * 40); ctx.fillText(t.text, t.x, t.y - t.t * 40); ctx.globalAlpha = 1; }
    ctx.restore();
    // banners
    const bn = texts.filter((t) => t.banner).slice(-1)[0];
    if (bn) { ctx.globalAlpha = Math.min(1, (2.4 - bn.t) * 2); ctx.font = "800 14px system-ui, sans-serif"; const w = Math.min(VW - 20, ctx.measureText(bn.text).width + 28); ctx.fillStyle = "rgba(10,16,30,0.82)"; rr(VW / 2 - w / 2, 46, w, 28, 14); ctx.fill(); ctx.fillStyle = "#ffd23a"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(bn.text, VW / 2, 60, VW - 40); ctx.globalAlpha = 1; }
    // the HUD
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0, 0, VW, 28);
    ctx.textBaseline = "middle"; ctx.font = "800 13px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.fillText(nf(score), 8, 14);
    ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.ellipse(portrait ? 92 : 110, 14, 5, 7, 0, 0, TAU); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(`× ${coins}`, portrait ? 100 : 118, 14);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffd23a"; ctx.fillText(portrait ? `${lvl + 1}/6` : `${lvl + 1}/6 · ${LV.name}`, portrait ? 170 : VW / 2, 14);
    ctx.textAlign = "right"; ctx.fillStyle = timeLeft < 40 ? "#ff6b7d" : "#fff"; ctx.fillText(`⏱ ${Math.ceil(timeLeft)}`, portrait ? 268 : VW - (touchMode ? 120 : 70), 14);
    if (!(portrait && touchMode)) { ctx.fillStyle = "#ff8aa0"; ctx.fillText(`♥ ${lives}`, VW - (touchMode ? 64 : 10), 14); }
    // intro, level clear and the ending
    if (state === "intro") card(() => { ctx.fillStyle = "#c8d4f0"; ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(`LIVELLO ${lvl + 1} DI ${LEVELS.length}`, VW / 2, 140); ctx.fillStyle = "#ffd23a"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillText(LV.name, VW / 2, 168); ctx.fillStyle = "#fff"; ctx.font = "600 12px system-ui, sans-serif"; ctx.fillText(LV.boss ? "In fondo c'è il Barone Grugno, e Mariky in gabbia" : `Suona la campana in fondo al livello · ♥ ${lives}`, VW / 2, 194); if (stateT > 0.4) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffd23a"; ctx.fillText(touchMode ? "tocca per partire" : "Spazio o Invio per partire", VW / 2, 220); ctx.globalAlpha = 1; } });
    if (state === "clear" && stateT > 0.8) card(() => { ctx.fillStyle = "#ffd23a"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillText("DIN DON! LIVELLO FINITO", VW / 2, 150); ctx.fillStyle = "#fff"; ctx.font = "600 13px system-ui, sans-serif"; ctx.fillText(`Tempo avanzato: +${nf(clearInfo.tb)} · campana: +1.000`, VW / 2, 180); if (stateT > 2) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffd23a"; ctx.fillText(touchMode ? "tocca per continuare" : "Spazio per continuare", VW / 2, 214); ctx.globalAlpha = 1; } });
    if (state === "victory" && stateT > 0.6) card(() => { ctx.fillStyle = "#ff8ac0"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillText("«GRAZIE, NINO!»", VW / 2, 150); ctx.fillStyle = "#fff"; ctx.font = "600 13px system-ui, sans-serif"; ctx.fillText("La principessa Mariky è libera!", VW / 2, 178); if (stateT > 2) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffd23a"; ctx.fillText(touchMode ? "tocca per continuare" : "Spazio per continuare", VW / 2, 212); ctx.globalAlpha = 1; } });
    ctx.restore();
    // touch pads (and the space under the game, upright)
    if (portrait) { ctx.fillStyle = "#101a2c"; ctx.fillRect(0, 404, W, H - 404); ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.font = "600 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(touchMode ? `♥ ${lives} · M musica in pausa` : "frecce, Spazio, X", W / 2, 420); ctx.fillStyle = "#14223a"; ctx.fillRect(0, 0, W, 44); }
    if (touchMode || portrait) for (const pd of pads) drawPad(pd, pd.id === "jump" ? "SALTA" : "FIONDA");
  }
  function card(fn) { const w = Math.min(VW - 30, 380); ctx.fillStyle = "rgba(10,16,30,0.86)"; rr(VW / 2 - w / 2, 118, w, 120, 14); ctx.fill(); ctx.strokeStyle = "rgba(255,210,58,0.6)"; ctx.lineWidth = 2; ctx.stroke(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; fn(); }

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  function demo() { lvl = 0; startLevel(); state = "menu"; P.x = 10 * T; camX = 4 * T; }
  resize(); demo();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

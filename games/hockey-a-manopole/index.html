<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hockey a Manopole</title>
<style>
  :root {
    --bg: #08121e;
    --fg: #f4f6ee;
    --muted: #c8e0f0;
    --pink: #4ac8ff;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: slide your player nearest the puck; tap TIRO to shoot (stick up or down picks the corner) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(74, 200, 255, 0.9); background: rgba(74, 200, 255, 0.22); }
  #touch .jump.on { background: rgba(74, 200, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(8, 18, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #021a2a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #1a7aa8; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Tiro">TIRO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the rink, the goal mouths, and the slots each little player slides in
  const RX0 = 34, RX1 = 606, RY0 = 40, RY1 = 350, MID = (RY0 + RY1) / 2, MOUTH = 38, PR = 10, PK = 6, REACH = 24, WINS = 3;
  const SLOTS = [
    { role: "P", x0: 50, x1: 66, y0: MID - 40, y1: MID + 40 },
    { role: "D", x0: 118, x1: 190, y0: 56, y1: MID - 8 },
    { role: "D", x0: 118, x1: 190, y0: MID + 8, y1: RY1 - 16 },
    { role: "A", x0: 262, x1: 346, y0: 52, y1: MID - 30 },
    { role: "A", x0: 262, x1: 346, y0: MID + 30, y1: RY1 - 12 },
    { role: "C", x0: 382, x1: 452, y0: MID - 80, y1: MID + 80 },
  ];
  const TEAMS = [
    ["LUPI DEL LAGO", "#c8c8d8"], ["ORSI DI MONTAGNA", "#8a5a3a"], ["VOLPI ARTICHE", "#f08a2a"], ["AQUILE REALI", "#d8b83a"],
    ["SQUALI DEL NORD", "#5a7a9a"], ["DIAVOLI ROSSI", "#e83a3a"], ["DRAGHI NERI", "#3a3a4a"], ["CAMPIONI DEL MONDO", "#ffd23a"],
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "2 occasioni · avversari lenti e imprecisi", lives: 2, skill: 0 },
    normale:   { label: "NORMALE",   color: "#4ac8ff", desc: "1 occasione", lives: 1, skill: 1.4 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "1 occasione · avversari svelti e precisi fin dalla prima partita", lives: 1, skill: 2.8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "manopole-difficulty";
  const bestKey = (id) => `manopole-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  // the feats of shared/imprese.js: the game only announces them, the hall keeps them
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let maxDown = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    hit: lim(() => beep(rnd(500, 700), 0.04, "square", 0.03, -200)),
    board: lim(() => beep(rnd(120, 160), 0.06, "triangle", 0.05)),
    swing: lim(() => beep(300, 0.05, "sawtooth", 0.012, 200)),
    goal: () => arp([523, 659, 784, 1047, 784, 1047], 0.08, 0.14, "square", 0.05),
    against: () => arp([392, 330, 262], 0.12, 0.18, "triangle", 0.05),
    whistle: () => { beep(2400, 0.25, "square", 0.02); beep(2600, 0.25, "square", 0.015); },
    win: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.08, 0.16, "square", 0.05),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 1, match = 1, goalsFor = 0, goalsAgainst = 0, mine = 0, theirs = 0, matchT = 0, overtime = false;
  let puck = null, players = [], active = null, pause = 0, after = null, stillT = 0, parts = [], popups = [], message = null, shotsTaken = 0;
  let actHeld = false, wasHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The table ----------
  // how good this match's opponents are: the tournament gets harder every match
  function cpu() {
    const k = diff.skill + (match - 1) * 0.75;
    return { speed: 120 + 22 * k, keeper: 95 + 18 * k, aim: Math.max(4, 24 - 4 * k), react: Math.max(0.05, 0.28 - 0.04 * k), power: 500 + 22 * k };
  }
  function buildTeams() {
    players = []; active = null;
    for (const team of [0, 1]) for (const s of SLOTS) {
      const slot = team === 0 ? s : { role: s.role, x0: W - s.x1, x1: W - s.x0, y0: s.y0, y1: s.y1 };
      players.push({ team, slot, x: (slot.x0 + slot.x1) / 2, y: (slot.y0 + slot.y1) / 2, vx: 0, vy: 0, swing: 0, struck: false, think: 0, aimY: MID });
    }
  }
  function faceoff(towards) {
    puck = { x: W / 2, y: MID, vx: rnd(-30, 30) + (towards || 0) * 40, vy: (Math.random() < 0.5 ? -1 : 1) * rnd(60, 110) };
    stillT = 0;
    for (const p of players) { p.x = (p.slot.x0 + p.slot.x1) / 2; p.y = (p.slot.y0 + p.slot.y1) / 2; p.swing = 0; }
  }
  function shoot(p, aimY, power) {
    // a sweep of the stick sends the puck towards the far goal
    const gx = p.team === 0 ? RX1 + 10 : RX0 - 10;
    const dx = gx - puck.x, dy = aimY - puck.y, d = Math.hypot(dx, dy) || 1;
    puck.vx = dx / d * power; puck.vy = dy / d * power;
    p.struck = true; sfx.hit(); puck.last = p;
    if (p.team === 0) shotsTaken++;
  }
  function physics(dt) {
    puck.x += puck.vx * dt; puck.y += puck.vy * dt;
    const f = Math.pow(0.68, dt); puck.vx *= f; puck.vy *= f;
    // the boards, with gaps where the goals are
    const inMouth = Math.abs(puck.y - MID) < MOUTH - PK * 0.5;
    if (puck.y < RY0 + PK) { puck.y = RY0 + PK; puck.vy = Math.abs(puck.vy) * 0.85; sfx.board(); }
    if (puck.y > RY1 - PK) { puck.y = RY1 - PK; puck.vy = -Math.abs(puck.vy) * 0.85; sfx.board(); }
    if (!inMouth) {
      if (puck.x < RX0 + PK) { puck.x = RX0 + PK; puck.vx = Math.abs(puck.vx) * 0.85; sfx.board(); }
      if (puck.x > RX1 - PK) { puck.x = RX1 - PK; puck.vx = -Math.abs(puck.vx) * 0.85; sfx.board(); }
    } else {
      if (puck.x < RX0 - 4) return goal(1);
      if (puck.x > RX1 + 4) return goal(0);
    }
    // the corners are rounded on the real tables: push the puck out of them
    for (const [cx, cy] of [[RX0 + 30, RY0 + 30], [RX1 - 30, RY0 + 30], [RX0 + 30, RY1 - 30], [RX1 - 30, RY1 - 30]]) {
      const ox = puck.x - cx, oy = puck.y - cy;
      if (Math.sign(ox) !== Math.sign(cx - W / 2) || Math.sign(oy) !== Math.sign(cy - MID)) continue;
      const d = Math.hypot(ox, oy);
      if (d > 30 - PK) { const nx = ox / d, ny = oy / d; puck.x = cx + nx * (30 - PK); puck.y = cy + ny * (30 - PK); const vn = puck.vx * nx + puck.vy * ny; if (vn > 0) { puck.vx -= 1.85 * vn * nx; puck.vy -= 1.85 * vn * ny; } }
    }
    for (const p of players) {
      const dx = puck.x - p.x, dy = puck.y - p.y, d = Math.hypot(dx, dy), m = PR + PK;
      if (d >= m || d === 0) continue;
      const nx = dx / d, ny = dy / d;
      puck.x = p.x + nx * m; puck.y = p.y + ny * m;
      const rvx = puck.vx - p.vx, rvy = puck.vy - p.vy, vn = rvx * nx + rvy * ny;
      if (vn < 0) { puck.last = p; puck.vx -= 1.7 * vn * nx; puck.vy -= 1.7 * vn * ny; if (Math.abs(vn) > 60) sfx.hit(); }
    }
    const sp = Math.hypot(puck.vx, puck.vy);
    if (sp > 700) { puck.vx *= 700 / sp; puck.vy *= 700 / sp; }
    // a puck that dies where no stick can reach is dropped again at centre ice
    const reachable = players.some((p) => Math.hypot(puck.x - p.x, puck.y - p.y) < REACH + 12);
    // and one pinned where nobody can play it for a while is dropped too
    if (sp < 18) { stillT += dt; if (stillT > (reachable ? 3 : 1.2)) { sfx.whistle(); faceoff(0); } } else stillT = 0;
  }
  function goal(team) {
    if (team === 0) {
      mine++; goalsFor++;
      if (puck.last && puck.last.team === 0 && puck.last.slot.role === "P") impresa("portiere");
      const pts = 100 * match; score += pts;
      popups.push({ x: RX1 - 40, y: MID - 30, text: `+${pts}`, color: "#4ac8ff", t: 0 });
      message = { text: "GOL!", sub: `${mine} - ${theirs}`, t: 0 }; sfx.goal();
    } else {
      theirs++; goalsAgainst++; maxDown = Math.max(maxDown, theirs - mine);
      message = { text: "GOL SUBITO", sub: `${mine} - ${theirs}`, t: 0 }; sfx.against();
    }
    for (let i = 0; i < 24; i++) parts.push({ x: puck.x, y: puck.y, vx: rnd(-160, 160), vy: rnd(-160, 160), t: 0, life: rnd(0.4, 0.9), color: team === 0 ? "#4ac8ff" : "#ff5a5a" });
    puck.vx = puck.vy = 0;
    pause = 1.6;
    if (overtime || mine >= WINS || theirs >= WINS) after = mine > theirs ? "won" : "lost";
    else after = team === 0 ? "faceoff-1" : "faceoff1";
  }
  function endMatch(won) {
    if (won) {
      if (theirs === 0 && mine >= 3) impresa("cappotto");
      if (maxDown >= 2) impresa("rimonta");
      const bonus = 500 * match + 100 * match * (mine - theirs);
      score += bonus; sfx.win();
      message = { text: `${TEAMS[(match - 1) % TEAMS.length][0]} BATTUTI!`, sub: `${mine} - ${theirs} · bonus +${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
      pause = 2.6; after = "next";
    } else {
      lives--;
      message = { text: "PARTITA PERSA", sub: lives > 0 ? "ultima occasione: la rivincita!" : `${mine} - ${theirs}`, t: 0, long: true };
      pause = 2.6; after = lives > 0 ? "rematch" : "over";
    }
  }
  function startMatch() {
    mine = 0; theirs = 0; matchT = 120; overtime = false; maxDown = 0;
    buildTeams(); faceoff(0);
    message = { text: `PARTITA ${match}`, sub: `contro ${TEAMS[(match - 1) % TEAMS.length][0]} · vince chi arriva a ${WINS}`, t: 0, long: true };
    pause = 1.2; after = null;
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; match = 1; goalsFor = 0; goalsAgainst = 0; shotsTaken = 0; parts = []; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startMatch();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">FUORI DAL TORNEO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${match - 1} ${match - 1 === 1 ? "partita vinta" : "partite vinte"} · gol ${goalsFor} fatti, ${goalsAgainst} subiti · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>NUOVO TORNEO</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>HOCKEY A MANOPOLE</h1>
       <p>L'hockey da tavolo dei bar e delle sale giochi: sei omini per squadra, ognuno fermo nella sua scanalatura, e un dischetto che schizza da tutte le parti. Tu guidi sempre il tuo omino più vicino al disco: spostalo, tira e scegli l'angolo della porta. Vinci la partita arrivando a ${WINS} gol e passa alla squadra successiva del torneo.</p>
       <div class="pts">
         <span><b>Tiro</b></span><span>TIRO quando il disco è vicino al tuo omino · levetta in su o in giù mentre tiri per mirare all'angolo alto o basso</span>
         <span><b>Punti</b></span><span>gol 100 × partita · vittoria 500 × partita più 100 × partita per ogni gol di scarto · 2 minuti, poi gol d'oro</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per l'omino evidenziato · tocca TIRO</p>`
         : `<p class="muted help">Frecce o WASD per l'omino evidenziato · SPAZIO (o J) per tirare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA IL TORNEO</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);


  // ---------- Update ----------
  function moveTo(p, tx, ty, speed, dt) {
    const s = p.slot, nx = clamp(tx, s.x0, s.x1), ny = clamp(ty, s.y0, s.y1);
    const dx = nx - p.x, dy = ny - p.y, d = Math.hypot(dx, dy), stepLen = Math.min(d, speed * dt);
    const ox = p.x, oy = p.y;
    if (d > 0.01) { p.x += dx / d * stepLen; p.y += dy / d * stepLen; }
    p.vx = (p.x - ox) / dt; p.vy = (p.y - oy) / dt;
  }
  function nearest(team) {
    let best = null, bd = 1e9;
    for (const p of players) { if (p.team !== team) continue; const d = Math.hypot(puck.x - clamp(puck.x, p.slot.x0, p.slot.x1), puck.y - clamp(puck.y, p.slot.y0, p.slot.y1)) + Math.hypot(puck.x - p.x, puck.y - p.y) * 0.3; if (d < bd) { bd = d; best = p; } }
    return best;
  }
  function updatePlayers(dt) {
    // the player picks the closest of his own men, with a little stickiness so it does not flicker
    const near = nearest(0);
    if (!active || (near !== active && Math.hypot(puck.x - near.x, puck.y - near.y) + 14 < Math.hypot(puck.x - active.x, puck.y - active.y))) active = near;
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1), my = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    const press = actHeld && !wasHeld; wasHeld = actHeld;
    const c = cpu(), cnear = nearest(1);
    for (const p of players) {
      if (p.swing > 0) { p.swing -= dt; if (p.swing <= 0) p.struck = false; }
      if (p.team === 0) {
        if (p === active) {
          moveTo(p, p.x + mx * 400, p.y + my * 400, 230, dt);
          if (press && p.swing <= 0) { p.swing = 0.18; p.struck = false; sfx.swing(); p.aimY = MID + my * (MOUTH - 8); }
        } else if (p.slot.role === "P") moveTo(p, p.x, puck.y, 120, dt);
        else moveTo(p, (p.slot.x0 + p.slot.x1) / 2, puck.y, 60, dt);
      } else {
        // the table's other side: everyone follows the puck, the nearest goes for it and shoots
        p.think -= dt;
        if (p.think <= 0) { p.think = c.react * rnd(0.7, 1.3); p.tx = puck.x + puck.vx * 0.1; p.ty = puck.y + puck.vy * 0.1; }
        if (p.slot.role === "P") moveTo(p, p.x, clamp(p.ty, MID - 40, MID + 40), c.keeper, dt);
        else if (p === cnear) moveTo(p, p.tx + 8, p.ty, c.speed, dt);
        else moveTo(p, (p.slot.x0 + p.slot.x1) / 2, p.ty, c.speed * 0.45, dt);
        if (p.swing <= 0 && Math.hypot(puck.x - p.x, puck.y - p.y) < REACH && puck.x <= p.x + 4 && Math.random() < dt * 6) {
          p.swing = 0.18; p.struck = false; sfx.swing();
          p.aimY = MID + (Math.random() < 0.5 ? -1 : 1) * rnd(10, MOUTH - 6) + rnd(-1, 1) * c.aim;
        }
      }
      if (p.swing > 0 && !p.struck && Math.hypot(puck.x - p.x, puck.y - p.y) < REACH) {
        shoot(p, p.aimY + rnd(-6, 6), p.team === 0 ? 580 : c.power);
      }
    }
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (message) { message.t += dt; if (message.t > (message.long ? 2.6 : 1.6)) message = null; }
    if (state !== "play") return;
    if (pause > 0) {
      pause -= dt;
      if (pause <= 0) {
        const a = after; after = null;
        if (a === "won") endMatch(true);
        else if (a === "lost") endMatch(false);
        else if (a === "next") { match++; startMatch(); }
        else if (a === "rematch") startMatch();
        else if (a === "over") gameOver();
        else if (a === "faceoff-1") { buildTeams(); faceoff(-1); }
        else if (a === "faceoff1") { buildTeams(); faceoff(1); }
      }
      return;
    }
    matchT -= dt;
    if (matchT <= 0 && !overtime) {
      matchT = 0;
      if (mine !== theirs) { pause = 0.8; after = mine > theirs ? "won" : "lost"; sfx.whistle(); return; }
      overtime = true; sfx.whistle(); message = { text: "GOL D'ORO!", sub: "chi segna vince", t: 0 };
    }
    updatePlayers(dt);
    physics(dt);
  }

  // ---------- Drawing ----------
  function drawRink() {
    ctx.fillStyle = "#08121e"; ctx.fillRect(0, TOP, W, H - TOP);
    // the wooden cabinet and the boards
    ctx.fillStyle = "#6a3a1a"; ctx.beginPath(); ctx.roundRect(RX0 - 14, RY0 - 10, RX1 - RX0 + 28, RY1 - RY0 + 20, 40); ctx.fill();
    const g = ctx.createLinearGradient(0, RY0, 0, RY1);
    g.addColorStop(0, "#e8f4fc"); g.addColorStop(1, "#c8dcec");
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(RX0, RY0, RX1 - RX0, RY1 - RY0, 30); ctx.fill();
    // the lines painted under the ice
    ctx.fillStyle = "rgba(232,58,58,0.7)"; ctx.fillRect(W / 2 - 2, RY0, 4, RY1 - RY0);
    ctx.fillStyle = "rgba(58,90,216,0.6)"; ctx.fillRect(220, RY0, 5, RY1 - RY0); ctx.fillRect(W - 225, RY0, 5, RY1 - RY0);
    ctx.strokeStyle = "rgba(232,58,58,0.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, MID, 34, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(232,58,58,0.6)"; ctx.fillRect(RX0 + 26, RY0 + 4, 2, RY1 - RY0 - 8); ctx.fillRect(RX1 - 28, RY0 + 4, 2, RY1 - RY0 - 8);
    // the slots cut in the table
    for (const p of players) { ctx.fillStyle = "rgba(40,60,90,0.18)"; const s = p.slot; ctx.beginPath(); ctx.roundRect(s.x0 - 3, s.y0 - 3, s.x1 - s.x0 + 6, s.y1 - s.y0 + 6, 6); ctx.fill(); }
    // the goals
    for (const [x, dir, col] of [[RX0, -1, "#3a7ad8"], [RX1, 1, "#d83a3a"]]) {
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fillRect(dir < 0 ? x - 16 : x, MID - MOUTH, 16, MOUTH * 2);
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(dir < 0 ? x - 16 : x, MID - MOUTH, 16, MOUTH * 2);
      ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 1;
      for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(dir < 0 ? x - 16 : x, MID - MOUTH + i * MOUTH / 3); ctx.lineTo(dir < 0 ? x : x + 16, MID - MOUTH + i * MOUTH / 3); ctx.stroke(); }
    }
  }
  function drawPlayer(p) {
    const col = p.team === 0 ? "#2a5ad8" : TEAMS[(match - 1) % TEAMS.length][1], dir = p.team === 0 ? 1 : -1;
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 3, PR, PR * 0.8, 0, 0, TAU); ctx.fill();
    // the stick: it sweeps forward when he shoots
    const sw = p.swing > 0 ? Math.sin((1 - p.swing / 0.18) * Math.PI) : 0;
    const a = (dir > 0 ? 0 : Math.PI) + (0.9 - 1.8 * sw) * dir;
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * 18, p.y + Math.sin(a) * 18); ctx.stroke();
    ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 18, p.y + Math.sin(a) * 18, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, PR - 3, 0, TAU); ctx.stroke();
    ctx.fillStyle = p.slot.role === "P" ? "#ffd23a" : "#f4dcc8"; ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, TAU); ctx.fill();
    if (p === active && state === "play") {
      ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, PR + 5 + Math.sin(clock * 8), 0, TAU); ctx.stroke();
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(8,18,30,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8e0f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#4ac8ff"; ctx.font = "900 10px system-ui"; ctx.fillText(`PARTITA ${match}`, x0 + 80, 21);
    // the scoreboard
    ctx.textAlign = "center";
    ctx.fillStyle = "#2a5ad8"; ctx.fillRect(330, 4, 34, 20); ctx.fillStyle = TEAMS[(match - 1) % TEAMS.length][1]; ctx.fillRect(400, 4, 34, 20);
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(String(mine), 347, 15); ctx.fillText(String(theirs), 417, 15);
    const t = Math.ceil(matchT), clockTxt = overtime ? "ORO" : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
    ctx.fillStyle = overtime ? "#ffd23a" : "#c8e0f0"; ctx.font = "800 11px system-ui"; ctx.fillText(clockTxt, 382, 15);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffd23a"; ctx.font = "900 11px system-ui";
    ctx.fillText(`${"●".repeat(Math.max(0, lives))}`, touchMode ? W - 60 : W - 14, 14);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!players.length) { buildTeams(); faceoff(0); }
    drawRink();
    for (const p of players) drawPlayer(p);
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(puck.x + 2, puck.y + 2, PK, PK * 0.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#101010"; ctx.beginPath(); ctx.arc(puck.x, puck.y, PK, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a4a4a"; ctx.beginPath(); ctx.arc(puck.x - 1.5, puck.y - 1.5, 2, 0, TAU); ctx.fill();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 13px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#08121e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 2.6 : 1.6) - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 26px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 6; ctx.strokeStyle = "#08121e"; ctx.strokeText(message.text, W / 2, 130); ctx.fillText(message.text, W / 2, 130);
      if (message.sub) { ctx.font = "800 13px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 150); ctx.fillText(message.sub, W / 2, 150); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

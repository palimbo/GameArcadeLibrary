<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Biglia Pazza</title>
<style>
  :root {
    --bg: #0a0818;
    --fg: #f0eefa;
    --muted: #a8a4c8;
    --pink: #ff6ad8;
    --gold: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2448, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(240, 238, 250, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: center; align-items: flex-end; pointer-events: none;
  }
  /* one analog stick: the ball rolls the way you push, harder the further you push */
  #touch .stick { position: relative; width: 150px; height: 150px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 106, 216, 0.55); background: radial-gradient(circle, rgba(255,106,216,0.14), rgba(255,106,216,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255, 106, 216, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(240,238,250,0.25); pointer-events: none; }
  #touch.side { justify-content: flex-start; padding-left: 12px; }
  #touch.small .stick { width: 120px; height: 120px; }
  #touch.small .stick .knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 8, 24, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 60px); font-weight: 900; letter-spacing: 2px; color: var(--pink); text-shadow: 0 3px 0 #6a1a5a, 0 0 22px rgba(255,106,216,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(240,238,250,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0020; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #6a1a5a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 480, HUD = 24, TAU = Math.PI * 2;
  const T = 30, COLS = 12, R = 7;            // tile size, tiles across, ball radius
  // pieces of course, twelve tiles wide; every piece starts and ends open in the middle
  // .  floor   (space) the void   #  raised block   < > ^ v  slopes   ~  ice   e  black marble   w  acid worm   G  finish
  const PIECES = {
    wide:    ["  ........  ", "  ........  ", " .......... ", " .......... ", "  ........  ", "  ........  "],
    bridge:  ["   ......   ", "    ....    ", "     ..     ", "     ..     ", "     ..     ", "     ..     ", "    ....    ", "   ......   "],
    zigzag:  ["  ........  ", "  ...       ", "  ...       ", "  ......... ", "        ... ", "        ... ", "  ......... ", "    ....    "],
    slalom:  ["  ........  ", "  #####...  ", "  ........  ", "  ...#####  ", "  ........  ", "  #####...  ", "  ........  "],
    tiltL:   ["   ......   ", "  <<<<<<<<  ", " .<<<<<<<<. ", " .<<<<<<<<. ", "  <<<<<<<<  ", "   ......   "],
    tiltR:   ["   ......   ", "  >>>>>>>>  ", " .>>>>>>>>. ", " .>>>>>>>>. ", "  >>>>>>>>  ", "   ......   "],
    ice:     ["  ........  ", "  ~~~~~~~~  ", "  ~~~~~~~~  ", "   ~~~~~~   ", "    ~~~~    ", "   ~~~~~~   ", "  ........  "],
    chute:   ["   ......   ", "   .vvvv.   ", "    vvvv    ", "    vvvv    ", "    vvvv    ", "   ......   ", "  ........  "],
    uphill:  ["  ........  ", "  ^^^^^^^^  ", "  ^^^^^^^^  ", "  ^^^^^^^^  ", "  ........  "],
    arena:   [" .......... ", " ...e...... ", " .......... ", " ......e... ", " .......... ", "  ........  "],
    worms:   ["  ........  ", "  w.......  ", "  ........  ", "  .......w  ", "  ........  "],
    islands: ["  ........  ", "  ..    ..  ", "  ..    ..  ", "  ........  ", "     ..     ", "  ........  ", "  ..    ..  ", "  ........  "],
    narrowIce: ["   ......   ", "     ~~     ", "     ~~     ", "     ~~     ", "   ......   "],
    tiltBridge: ["   ......   ", "   >>>>>>   ", "   >>>>>>   ", "   <<<<<<   ", "   <<<<<<   ", "   ......   "],
  };
  const START = ["            ", "  ........  ", "  ...S....  ", "  ........  ", "   ......   "];
  const GOAL = ["   ......   ", "  ........  ", "  GGGGGGGG  ", "  GGGGGGGG  ", "            "];
  // which pieces each course draws from, getting meaner
  const COURSES = [
    { name: "Pista di Prova", pieces: ["wide", "bridge", "wide", "slalom", "tiltL", "wide", "uphill", "chute"], time: 34 },
    { name: "I Ponti", pieces: ["bridge", "zigzag", "tiltR", "islands", "bridge", "arena", "chute", "wide"], time: 36 },
    { name: "Il Ghiacciaio", pieces: ["ice", "wide", "narrowIce", "tiltL", "ice", "worms", "zigzag", "slalom"], time: 34 },
    { name: "La Fossa", pieces: ["arena", "tiltBridge", "islands", "worms", "chute", "tiltR", "narrowIce", "arena", "bridge"], time: 38 },
    { name: "Follia", pieces: ["zigzag", "tiltBridge", "arena", "narrowIce", "worms", "tiltL", "islands", "uphill", "tiltR", "bridge"], time: 40 },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "più tempo · nemici lenti · pendenze dolci", time: 1.25, foe: 0.7, slope: 0.8 },
    normale:   { label: "NORMALE",   color: "#ff6ad8", desc: "l'esperienza classica", time: 0.9, foe: 1, slope: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "meno tempo · nemici svelti · pendenze ripide", time: 0.75, foe: 1.3, slope: 1.1 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "biglia-difficulty";
  const bestKey = (id) => `biglia-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    touchEl.classList.toggle("side", !portrait);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(180px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 180;
    if (showTouch && !portrait) {
      const side = touchEl.firstElementChild.offsetWidth + 24;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, roll = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    bump: lim(() => beep(180, 0.06, "square", 0.03, -60)),
    clack: lim(() => beep(900, 0.05, "triangle", 0.04, -300)),
    fall: () => beep(700, 0.9, "sine", 0.04, -620),
    melt: () => arp([400, 300, 220, 160], 0.07, 0.12, "sawtooth", 0.035),
    enemyFall: () => beep(500, 0.7, "triangle", 0.03, -420),
    goal: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14),
    start: () => arp([392, 523, 659, 784], 0.1, 0.14),
    tick: lim(() => beep(1400, 0.03, "square", 0.02)),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };
  function rollStart() {
    if (!audioCtx || roll) return;
    const len = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 300; g.gain.value = 0;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
    roll = { g, f };
  }
  function rollSet(speed) {
    if (!roll) return;
    const t = audioCtx.currentTime;
    roll.g.gain.setTargetAtTime(Math.min(0.08, speed / 3000), t, 0.05);
    roll.f.frequency.setTargetAtTime(150 + speed * 2, t, 0.05);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, course = 0, bestCache = 0, timeLeft = 0, lap = 0, bestRow = 0, falls = 0;
  let grid = [], rows = 0, B = null, safe = null, foes = [], parts = [], popups = [], message = null, camY = 0;
  let stick = [0, 0];
  const keys = { left: false, right: false, up: false, down: false };

  // ---------- Courses ----------
  function buildCourse() {
    const c = COURSES[course % COURSES.length];
    let lines = START.slice();
    for (const p of c.pieces) lines = lines.concat(PIECES[p]);
    lines = lines.concat(GOAL);
    grid = lines.map((l) => l.padEnd(COLS, " ").slice(0, COLS).split(""));
    rows = grid.length;
    foes = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < COLS; x++) {
      const ch = grid[y][x];
      if (ch === "S") { B = { x: x * T + T / 2, y: y * T + T / 2, vx: 0, vy: 0, z: 0, fall: 0, spin: 0, melt: 0 }; grid[y][x] = "."; }
      if (ch === "e") { foes.push({ kind: "marble", x: x * T + T / 2, y: y * T + T / 2, vx: 0, vy: 0, fall: 0 }); grid[y][x] = "."; }
      if (ch === "w") { foes.push({ kind: "worm", x: x * T + T / 2, y: y * T + T / 2, dir: 1, t: 0 }); grid[y][x] = "."; }
    }
    safe = { x: B.x, y: B.y };
    bestRow = Math.floor(B.y / T);
    camY = B.y - H * 0.4;
    return c;
  }
  const tileAt = (px, py) => { const x = Math.floor(px / T), y = Math.floor(py / T); if (x < 0 || x >= COLS || y < 0 || y >= rows) return " "; return grid[y][x]; };
  const solid = (ch) => ch === "#";
  const isVoid = (ch) => ch === " ";

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "goal"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    rollStart();
    score = 0; course = 0; lap = 0; falls = 0; timeLeft = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginCourse();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginCourse() {
    const c = buildCourse();
    lap = Math.floor(course / COURSES.length);
    // the time left over carries on to the next course
    const add = Math.round(c.time * diff.time * Math.pow(0.9, lap));
    timeLeft += add;
    message = { text: c.name.toUpperCase(), sub: `Percorso ${course + 1} · +${add} secondi`, t: 0 };
    state = "intro"; stateT = 1.5;
    sfx.start();
  }
  function addScore(n, x, y, color = "#f0eefa") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: "+" + n, color, t: 0 });
  }
  function burst(x, y, color, n = 10, sp = 80, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function gameOver() {
    state = "over";
    rollSet(0);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label;
    menu = () => showOverlay(
      `<h2 class="lose">TEMPO SCADUTO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Percorsi completati: ${course} · ${played}</p>
       <p class="muted">Cadute: ${falls}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; rollSet(0);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "16px", left: "auto" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>BIGLIA PAZZA</h1>
       <p>Porta la biglia fino al traguardo a scacchi lungo percorsi sospesi nel vuoto. La biglia ha inerzia: frena prima dei ponti stretti, occhio alle pendenze che ti spingono verso il bordo e al ghiaccio dove non si frena. Se cadi riparti un po' più indietro, ma il tempo corre: quello che avanzi passa al percorso dopo.</p>
       <div class="pts">
         <span><b>Strada fatta</b></span><span>10 punti per ogni fila nuova</span>
         <span><b>Traguardo</b></span><span>1.000 per percorso, più 20 per ogni secondo rimasto</span>
         <span><b>Biglia nera</b></span><span>ti viene addosso e ti spinge: falla cadere (500)</span>
         <span><b>Verme acido</b></span><span>se lo tocchi ti scioglie</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Spingi la levetta nella direzione in cui vuoi rotolare: più la spingi, più acceleri</p>`
         : `<p class="muted help">Frecce o WASD per spingere la biglia · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>VIA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick = [0, 0]; if (isPlaying()) togglePause(); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const m = Math.min(1, len / max);
    stick = m < 0.12 ? [0, 0] : [dx / (len || 1) * Math.min(1, (m - 0.12) / 0.7), dy / (len || 1) * Math.min(1, (m - 0.12) / 0.7)];
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick = [0, 0]; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Physics ----------
  const SLOPE = { "<": [-1, 0], ">": [1, 0], "^": [0, -1], "v": [0, 1] };
  function rollBall(o, ax, ay, dt, isPlayer) {
    const ch = tileAt(o.x, o.y), ice = ch === "~";
    const s = SLOPE[ch];
    const grip = ice ? 0.3 : 1;
    o.vx += (ax * 450 * grip + (s ? s[0] * 220 * diff.slope : 0)) * dt;
    o.vy += (ay * 450 * grip + (s ? s[1] * 220 * diff.slope : 0)) * dt;
    const fr = Math.exp(-(ice ? 0.15 : 1.4) * dt);
    o.vx *= fr; o.vy *= fr;
    const sp = Math.hypot(o.vx, o.vy), max = 280;
    if (sp > max) { o.vx *= max / sp; o.vy *= max / sp; }
    // move, bouncing off raised blocks
    o.x += o.vx * dt;
    if (bumpBlocks(o, true) && isPlayer) sfx.bump();
    o.y += o.vy * dt;
    if (bumpBlocks(o, false) && isPlayer) sfx.bump();
    o.x = clamp(o.x, -T, COLS * T + T);
  }
  function bumpBlocks(o, horiz) {
    const x0 = Math.floor((o.x - R) / T), x1 = Math.floor((o.x + R) / T), y0 = Math.floor((o.y - R) / T), y1 = Math.floor((o.y + R) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= rows || !solid(grid[ty][tx])) continue;
      const cx = clamp(o.x, tx * T, tx * T + T), cy = clamp(o.y, ty * T, ty * T + T);
      const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
      if (d >= R) continue;
      if (horiz) { o.x = o.vx > 0 ? tx * T - R : tx * T + T + R; o.vx = -o.vx * 0.5; }
      else { o.y = o.vy > 0 ? ty * T - R : ty * T + T + R; o.vy = -o.vy * 0.5; }
      return true;
    }
    return false;
  }
  function fallsOff(o) { return isVoid(tileAt(o.x, o.y)); }
  // a safe spot: on the floor with no void right next to it
  function isSafe(x, y) {
    for (const [dx, dy] of [[0, 0], [T * 0.6, 0], [-T * 0.6, 0], [0, T * 0.6], [0, -T * 0.6]]) { const ch = tileAt(x + dx, y + dy); if (isVoid(ch) || SLOPE[ch] || ch === "~") return false; }
    return true;
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 18 * dt; }
    popups = popups.filter((q) => q.t < 0.9);
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; follow(dt); if (stateT <= 0) state = "play"; return; }
    if (state === "goal") { stateT -= dt; B.vx *= 0.95; B.vy *= 0.95; B.x += B.vx * dt; B.y += B.vy * dt; follow(dt); if (stateT <= 0) { course++; beginCourse(); } return; }
    timeLeft -= dt;
    if (timeLeft <= 10 && Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) sfx.tick();
    if (timeLeft <= 0) { timeLeft = 0; gameOver(); return; }
    // the player's marble
    if (B.fall > 0 || B.melt > 0) {
      if (B.fall > 0) { B.fall += dt; B.x += B.vx * dt * 0.3; B.y += B.vy * dt * 0.3; }
      else B.melt += dt;
      if (B.fall > 1.1 || B.melt > 1.1) { Object.assign(B, { x: safe.x, y: safe.y, vx: 0, vy: 0, fall: 0, melt: 0 }); B.inv = 1; }
    } else {
      let ax = stick[0] + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ay = stick[1] + (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
      rollBall(B, ax, ay, dt, true);
      B.spin += Math.hypot(B.vx, B.vy) * dt / R;
      B.inv = Math.max(0, (B.inv || 0) - dt);
      if (fallsOff(B)) { B.fall = 0.001; falls++; sfx.fall(); message = { text: "CADUTA!", t: 0 }; }
      else {
        if (isSafe(B.x, B.y)) { safe.x = B.x; safe.y = B.y; }
        const row = Math.floor(B.y / T);
        if (row > bestRow) { addScore((row - bestRow) * 10); bestRow = row; }
        if (tileAt(B.x, B.y) === "G") {
          const bonus = 1000 + Math.floor(timeLeft) * 20;
          addScore(bonus, B.x, B.y - 20, "#ffd23a");
          message = { text: "TRAGUARDO!", sub: `+${bonus.toLocaleString("it-IT")}`, t: 0 };
          sfx.goal(); state = "goal"; stateT = 2.2;
          burst(B.x, B.y, "#ffd23a", 30, 120, 0.9);
        }
      }
    }
    rollSet(B.fall || B.melt ? 0 : Math.hypot(B.vx, B.vy));
    // enemies
    for (const f of foes) {
      if (f.gone) continue;
      if (f.kind === "marble") {
        if (f.fall > 0) { f.fall += dt; if (f.fall > 1) f.gone = true; continue; }
        const dx = B.x - f.x, dy = B.y - f.y, d = Math.hypot(dx, dy);
        const chase = d < 170 && !B.fall && !B.melt ? 0.75 * diff.foe : 0;
        rollBall(f, chase * dx / (d || 1), chase * dy / (d || 1), dt, false);
        if (fallsOff(f)) { f.fall = 0.001; sfx.enemyFall(); addScore(500, f.x, f.y - 14, "#ffd23a"); }
        // marbles bump into each other
        if (!B.fall && !B.melt && d < R * 2 && d > 0.01) {
          const nx = dx / d, ny = dy / d, rel = (f.vx - B.vx) * nx + (f.vy - B.vy) * ny;
          const push = (R * 2 - d) / 2;
          B.x += nx * push; B.y += ny * push; f.x -= nx * push; f.y -= ny * push;
          if (rel > 0) { const j = rel * 1.1; B.vx += nx * j; B.vy += ny * j; f.vx -= nx * j; f.vy -= ny * j; sfx.clack(); }
        }
      } else {
        // the worm inches along its floor, turning at edges and blocks
        f.t += dt;
        const nx = f.x + f.dir * 22 * diff.foe * dt;
        const ahead = tileAt(nx + f.dir * 8, f.y);
        if (isVoid(ahead) || solid(ahead)) f.dir = -f.dir; else f.x = nx;
        if (!B.fall && !B.melt && !(B.inv > 0) && Math.abs(B.x - f.x) < 14 && Math.abs(B.y - f.y) < 10) {
          B.melt = 0.001; falls++; sfx.melt(); message = { text: "SCIOLTA DAL VERME ACIDO!", t: 0 };
          burst(B.x, B.y, "#7dff3a", 16, 70, 0.6);
        }
      }
    }
    foes = foes.filter((f) => !f.gone);
    follow(dt);
  }
  function follow(dt) {
    const target = clamp(B.y - (H - HUD) * 0.4 - HUD, -HUD - 10, rows * T - H + 20);
    camY += (target - camY) * Math.min(1, dt * 5);
  }

  // ---------- Drawing ----------
  const TILE_TOP = { ".": "#8a84c8", "~": "#bfe8ff", "G": "#ffffff", "<": "#9a8ad8", ">": "#9a8ad8", "^": "#9a8ad8", "v": "#9a8ad8" };
  function drawTiles() {
    const y0 = Math.max(0, Math.floor(camY / T) - 1), y1 = Math.min(rows - 1, Math.floor((camY + H) / T) + 1);
    // the sides of the floor, seen from above and a little south: a darker face under each tile over the void
    for (let y = y0; y <= y1; y++) for (let x = 0; x < COLS; x++) {
      const ch = grid[y][x]; if (isVoid(ch)) continue;
      const px = x * T, py = y * T - camY;
      if (y + 1 >= rows || isVoid(grid[y + 1][x])) {
        const g = ctx.createLinearGradient(0, py + T, 0, py + T + 26);
        g.addColorStop(0, "#4a4488"); g.addColorStop(1, "rgba(40,36,90,0)");
        ctx.fillStyle = g; ctx.fillRect(px, py + T, T, 26);
      }
    }
    for (let y = y0; y <= y1; y++) for (let x = 0; x < COLS; x++) {
      const ch = grid[y][x]; if (isVoid(ch)) continue;
      const px = x * T, py = y * T - camY;
      if (ch === "#") {
        ctx.fillStyle = "#3a3478"; ctx.fillRect(px, py + 4, T, T - 4);
        ctx.fillStyle = "#c8a0ff"; ctx.fillRect(px, py - 6, T, T - 4);
        ctx.fillStyle = "#e8d8ff"; ctx.fillRect(px, py - 6, T, 3);
        continue;
      }
      if (ch === "G") { for (let k = 0; k < 9; k++) { ctx.fillStyle = ((k + (k / 3 | 0) + x + y) % 2) ? "#111" : "#fff"; ctx.fillRect(px + (k % 3) * 10, py + ((k / 3) | 0) * 10, 10, 10); } continue; }
      ctx.fillStyle = TILE_TOP[ch] || "#8a84c8"; ctx.fillRect(px, py, T, T);
      if ((x + y) % 2 && ch !== "~") { ctx.fillStyle = "rgba(40,30,110,0.12)"; ctx.fillRect(px, py, T, T); }
      ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(px, py, T, 1.5); ctx.fillRect(px, py, 1.5, T);
      // a grid of lines, like the original's checker
      ctx.strokeStyle = "rgba(40,30,90,0.35)"; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
      if (SLOPE[ch]) {
        const [sx, sy] = SLOPE[ch], ph = (clock * 1.5) % 1;
        ctx.fillStyle = "rgba(60,40,140,0.45)";
        for (let k = 0; k < 2; k++) {
          const o = ((k * 0.5 + ph) % 1) * T - T / 2;
          ctx.save(); ctx.translate(px + T / 2 + sx * o, py + T / 2 + sy * o); ctx.rotate(Math.atan2(sy, sx));
          ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -6); ctx.lineTo(-4, 6); ctx.fill(); ctx.restore();
        }
      }
      if (ch === "~") { ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(px + 5, py + 7, 8, 2); ctx.fillRect(px + 15, py + 18, 9, 2); }
    }
  }
  function drawMarble(x, y, col, hi, scale = 1, spin = 0) {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x + 3, y + 5, R * scale, R * 0.6 * scale, 0, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(x - 2.5 * scale, y - 3 * scale, 1, x, y, R * scale);
    g.addColorStop(0, hi); g.addColorStop(1, col);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * scale, 0, TAU); ctx.fill();
    // a swirl that turns as the marble rolls
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.2 * scale;
    ctx.beginPath(); ctx.arc(x, y, R * 0.55 * scale, spin, spin + 2); ctx.stroke();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#1a1440"); bg.addColorStop(1, "#06040e");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // stars in the void
    for (let k = 0; k < 40; k++) { const x = (k * 97) % W, y = ((k * 61 - camY * 0.3) % H + H) % H; ctx.fillStyle = k % 3 ? "rgba(255,255,255,0.3)" : "rgba(255,106,216,0.4)"; ctx.fillRect(x, y, 1.5, 1.5); }
    if (!grid.length) buildCourse();
    drawTiles();
    if (state !== "menu") {
      for (const f of foes) {
        const y = f.y - camY;
        if (f.kind === "marble") drawMarble(f.x, y, "#141418", "#7a7a8a", f.fall ? Math.max(0.05, 1 - f.fall) : 1, clock * 3);
        else {
          // the acid worm: a line of green blobs
          for (let k = 0; k < 4; k++) { const wx = f.x - f.dir * k * 5, wy = y + Math.sin(f.t * 8 + k) * 2; ctx.fillStyle = k ? "#5ad83a" : "#8aff5a"; ctx.beginPath(); ctx.arc(wx, wy, 4 - k * 0.4, 0, TAU); ctx.fill(); }
          ctx.fillStyle = "#1a1a1a"; ctx.fillRect(f.x + f.dir * 1 - 1, y - 2, 1.5, 1.5);
          if (Math.random() < 0.1) parts.push({ x: f.x, y: f.y, vx: 0, vy: 0, t: 0, life: 0.6, c: "rgba(125,255,58,0.5)" });
        }
      }
      if (B) {
        const scale = B.fall ? Math.max(0.05, 1 - B.fall) : B.melt ? 1 : 1;
        if (B.melt) { ctx.fillStyle = `rgba(125,255,58,${Math.max(0, 1 - B.melt)})`; ctx.beginPath(); ctx.ellipse(B.x, B.y - camY + 3, R * (1 + B.melt), R * 0.5, 0, 0, TAU); ctx.fill(); }
        else if (!(B.inv > 0 && Math.floor(clock * 14) % 2)) drawMarble(B.x, B.y - camY, "#c81a8a", "#ffc8f0", scale, B.spin);
      }
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - camY - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / 0.9);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y - camY); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y - camY);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    // status bar and the time left, big
    ctx.fillStyle = "rgba(10,8,24,0.92)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = "#f0eefa";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a3a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 70, 12);
    ctx.textAlign = "center"; ctx.font = "900 16px system-ui, sans-serif";
    ctx.fillStyle = timeLeft < 10 && Math.floor(clock * 4) % 2 ? "#ff4a3a" : "#ffd23a";
    ctx.fillText(`${Math.ceil(timeLeft)}`, W / 2 + 30, 12);
    ctx.textAlign = "right"; ctx.font = "800 10px system-ui, sans-serif"; ctx.fillStyle = "#ff6ad8";
    ctx.fillText(`PERCORSO ${course + 1}`, W - 8, 12);
    // progress down the course
    const prog = clamp(B.y / (rows * T), 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(W - 5, HUD + 8, 2, 140);
    ctx.fillStyle = "#ff6ad8"; ctx.fillRect(W - 6, HUD + 8 + 140 * prog - 2, 4, 4);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#ff6ad8";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, 110); ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f0eefa"; ctx.strokeText(message.sub, W / 2, 130); ctx.fillText(message.sub, W / 2, 130); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="biglia-best-" data-kind="score"></script>

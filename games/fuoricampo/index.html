<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fuoricampo</title>
<style>
  :root {
    --bg: #0a1426;
    --fg: #f4f8ff;
    --muted: #b8cce8;
    --pink: #ffd23a;
    --yellow: #ffd23a;
    --red: #ff5a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a7a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: move the bat over the plate; BATTI swings */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 255, 255, 0.6); background: radial-gradient(circle, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 20, 38, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #7a1a0a, 0 0 22px rgba(255,210,58,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a00; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8901a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Batti">BATTI</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28, DEG = Math.PI / 180;
  // the pitch, seen from behind home plate
  const REL = { x: 326, y: 152 }, ZONE = { x0: 290, x1: 350, y0: 212, y1: 284 }, PLATE_Y = 300;
  const CUR = { x0: 258, x1: 382, y0: 192, y1: 304 };
  const WINDOW = 0.12;
  // the teams, one after the other; after the last the league starts again, tougher
  const TEAMS = [
    { name: "Gabbiani di Rimini", col: "#5ab0ff", runs: 2, mph: 76, brk: 0.6, mix: { fast: 0.65, curve: 0.35 } },
    { name: "Leoni di Nettuno", col: "#ffb02a", runs: 3, mph: 80, brk: 0.8, mix: { fast: 0.5, curve: 0.3, change: 0.2 } },
    { name: "Volpi di Parma", col: "#ff6a3a", runs: 3, mph: 83, brk: 1, mix: { fast: 0.45, curve: 0.25, change: 0.15, sinker: 0.15 } },
    { name: "Squali di Bologna", col: "#6a8aaa", runs: 4, mph: 86, brk: 1.1, mix: { fast: 0.4, curve: 0.25, change: 0.15, sinker: 0.2 } },
    { name: "Tori di Grosseto", col: "#c83a3a", runs: 5, mph: 89, brk: 1.2, mix: { fast: 0.4, curve: 0.2, change: 0.2, sinker: 0.2 } },
    { name: "Draghi di San Marino", col: "#3ac87a", runs: 6, mph: 92, brk: 1.3, mix: { fast: 0.35, curve: 0.25, change: 0.2, sinker: 0.2 } },
  ];
  const PITCHES = {
    fast: { name: "VELOCE", k: 1, bx: 0, by: 0 },
    curve: { name: "CURVA", k: 0.86, bx: 70, by: 26 },
    change: { name: "CAMBIO", k: 0.74, bx: 0, by: 14 },
    sinker: { name: "AFFONDATA", k: 0.93, bx: -16, by: 46 },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 riprese · una partita di riserva · lanci più lenti · mazza più larga", lives: 2, speed: 0.86, bat: 1.25, innings: 4 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "alla prima partita persa il campionato finisce", lives: 1, speed: 1, bat: 1, innings: 3 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "una sola partita · lanci più veloci e angolati · mazza più stretta", lives: 1, speed: 1.08, bat: 0.85, innings: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fuoricampo-difficulty";
  const bestKey = (id) => `fuoricampo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    pitch: () => noise(0.12, 0.05, 2500),
    mitt: () => { noise(0.08, 0.14, 700); beep(180, 0.06, "triangle", 0.05); },
    swing: () => noise(0.16, 0.06, 1500),
    crack: (q) => { noise(0.06, 0.2, 3000); beep(900 + q * 500, 0.05, "square", 0.06); },
    foul: () => beep(500, 0.08, "triangle", 0.04, -150),
    out: () => arp([392, 330], 0.1, 0.12, "triangle", 0.045),
    hit: (n) => arp([523, 659, 784, 1047].slice(0, n + 1), 0.07, 0.1, "square", 0.045),
    hr: () => { arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.07, 0.12, "square", 0.05); noise(1.2, 0.05, 900); },
    run: () => beep(1047, 0.1, "square", 0.04),
    win: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.09, 0.14, "square", 0.05),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 1, game = 1, bestCache = 0, team = null;
  let inning = 1, outs = 0, balls = 0, strikes = 0, runs = 0, bases = [false, false, false], won = false;
  let pitch = null, swingT = -1, swingAnim = 0, hit = null, message = null, popups = [], callText = null, lastResult = "";
  let swingPressed = false;
  const cur = { x: 320, y: 248 };
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  // counters for the test runs
  const stat = (k, sub) => { const s = window.__stats; if (!s) return; if (sub !== undefined) { s[k] = s[k] || {}; s[k][sub] = (s[k][sub] || 0) + 1; } else s[k] = (s[k] || 0) + 1; };

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "windup", "pitch", "hit", "result", "end"].includes(state);
  function teamFor(n) {
    const t = TEAMS[(n - 1) % TEAMS.length], lap = Math.floor((n - 1) / TEAMS.length);
    return { ...t, runs: t.runs + lap * 2, mph: (t.mph + lap * 3) * diff.speed, brk: t.brk * (1 + 0.1 * lap) };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; game = 1;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginGame();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginGame() {
    team = teamFor(game);
    inning = 1; runs = 0; outs = 0; balls = 0; strikes = 0; bases = [false, false, false];
    hit = null; pitch = null; popups = [];
    message = { text: `PARTITA ${game} · ${team.name.toUpperCase()}`, sub: `hanno fatto ${team.runs} punti: superali in ${diff.innings} riprese!`, t: 0, long: true };
    state = "intro"; stateT = 2.6;
  }
  function nextPitch() { pitch = null; swingT = -1; state = "windup"; stateT = rnd(0.9, 1.5); }
  function mult() { return 1 + 0.25 * (game - 1); }
  function addScore(n, x, y, color = "#ffd23a", text) {
    score += Math.round(n * mult());
    if (x !== undefined) popups.push({ x, y, text: text || `+${Math.round(n * mult())}`, color, t: 0 });
  }
  // the pitcher picks a pitch and a spot: more strikes when behind in the count, more teasing when ahead
  function throwPitch() {
    const mix = team.mix; let r = Math.random(), type = "fast";
    for (const k in mix) { if (r < mix[k]) { type = k; break; } r -= mix[k]; }
    const P = PITCHES[type];
    const pStrike = balls === 3 ? 0.85 : strikes === 2 && balls < 2 ? 0.42 : 0.6;
    const inZone = Math.random() < pStrike;
    let tx, ty;
    if (inZone) { tx = rnd(ZONE.x0 + 4, ZONE.x1 - 4); ty = rnd(ZONE.y0 + 4, ZONE.y1 - 4); }
    else {
      const side = Math.floor(Math.random() * 4);
      tx = side === 0 ? ZONE.x0 - rnd(10, 30) : side === 1 ? ZONE.x1 + rnd(10, 30) : rnd(ZONE.x0, ZONE.x1);
      ty = side === 2 ? ZONE.y0 - rnd(10, 26) : side === 3 ? ZONE.y1 + rnd(10, 24) : rnd(ZONE.y0, ZONE.y1);
    }
    const mph = team.mph * P.k * rnd(0.97, 1.03);
    const T = 60.5 / (mph * 1.467) * 1.55;
    const dir = Math.random() < 0.5 ? -1 : 1;
    pitch = { type, mph: Math.round(mph), T, t: 0, tx, ty, bx: P.bx * team.brk * (type === "curve" ? dir : 1), by: P.by * team.brk, inZone, done: false };
    sfx.pitch();
    state = "pitch";
  }
  // where the ball is at a point of its flight (0 = release, 1 = over the plate)
  function ballAt(s) {
    const e = s * s - s;
    return { x: REL.x + (pitch.tx - REL.x) * s - pitch.bx * e, y: REL.y + (pitch.ty - REL.y) * s - pitch.by * e * (pitch.type === "sinker" ? s * 2 : 1), r: 2 + 7 * s * s };
  }
  function call(text, col) { callText = { text, col, t: 0 }; }
  function strikeCalled(swung) {
    strikes++;
    call(swung ? "STRIKE! (MANCATA)" : "STRIKE!", "#ff5a5a");
    if (strikes >= 3) { out("ELIMINATO AL PIATTO"); return; }
    afterPitch();
  }
  function ballCalled() {
    balls++;
    call("BALL", "#5ae8ff");
    if (balls >= 4) { call("BASE BALL!", "#5ae8ff"); walk(); return; }
    afterPitch();
  }
  function afterPitch() { state = "result"; stateT = 1.1; }
  function out(why) {
    outs++; balls = 0; strikes = 0; lastResult = why;
    stat("outs");
    call(why, "#ff5a5a"); sfx.out();
    state = "result"; stateT = 1.4;
  }
  function walk() {
    // forced runners only
    if (bases[0] && bases[1] && bases[2]) scoreRuns(1);
    if (bases[0] && bases[1]) bases[2] = true;
    if (bases[0]) bases[1] = true;
    bases[0] = true; balls = 0; strikes = 0;
    addScore(30, W / 2, 190, "#5ae8ff");
    state = "result"; stateT = 1.3;
  }
  function advance(n) {
    let scored = 0;
    for (let b = 2; b >= 0; b--) if (bases[b]) { bases[b] = false; if (b + n >= 3) scored++; else bases[b + n] = true; }
    if (n >= 4) scored++; else bases[n - 1] = true;
    scoreRuns(scored);
  }
  function scoreRuns(n) {
    if (!n) return;
    runs += n;
    for (let i = 0; i < n; i++) setTimeout(() => sfx.run(), i * 180);
    addScore(150 * n, W / 2, 150, "#7ed87a", `${n === 1 ? "PUNTO" : n + " PUNTI"}! +${Math.round(150 * n * mult())}`);
  }
  function checkEnd() {
    if (runs > team.runs) { endGame(true); return true; }
    if (outs >= 3) {
      outs = 0; balls = 0; strikes = 0; bases = [false, false, false];
      if (inning >= diff.innings && runs < team.runs) { endGame(false); return true; }
      inning++;
      message = { text: inning > diff.innings ? "RIPRESA SUPPLEMENTARE!" : `${inning}ª RIPRESA`, sub: `ti mancano ${team.runs - runs + 1} punti`, t: 0 };
    }
    return false;
  }
  function endGame(w) {
    won = w; state = "end"; stateT = 3.2;
    if (w) {
      const bonus = 1000 * game + 300 * (runs - team.runs) * game;
      score += bonus;
      message = { text: "VITTORIA!", sub: `${runs} a ${team.runs} contro i ${team.name} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
      sfx.win();
    } else {
      lives--;
      message = { text: "SCONFITTA", sub: `${runs} a ${team.runs} · ${lives > 0 ? "hai ancora una partita" : "il campionato finisce qui"}`, t: 0, long: true };
      sfx.lose();
    }
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">CAMPIONATO FINITO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${game > 1 ? `${game - 1} ${game - 1 === 1 ? "partita vinta" : "partite vinte"}` : "nessuna partita vinta"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>ALLA BATTUTA!</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
      if (state === "pitch") { pitch = null; state = "windup"; stateT = 1; }
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>FUORICAMPO</h1>

    if (state === "hit" && hit) drawField(); else drawPitchView();
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4);
      ctx.textAlign = "center"; ctx.font = "900 13px system-ui";
      ctx.lineWidth = 4; ctx.strokeStyle = "#0a1426"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 3 : 2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0a1426"; ctx.strokeText(message.text, W / 2, 74); ctx.fillText(message.text, W / 2, 74);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 93); ctx.fillText(message.sub, W / 2, 93); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

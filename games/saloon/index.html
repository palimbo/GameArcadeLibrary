<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saloon</title>
<style>
  :root {
    --bg: #120a06;
    --fg: #fff4e0;
    --muted: #d0b898;
    --accent: #ffb03a;
    --gold: #ffd34d;
    --bad: #ff4f6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 3px #4a2a12, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 224, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch button {
    width: 56px; height: 56px; border-radius: 14px; touch-action: none;
    font: 700 22px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(255, 176, 58, 0.6); background: rgba(255, 176, 58, 0.08);
  }
  #touch button[data-a="serve"] { width: 92px; height: 92px; border-radius: 50%; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.15); font: 700 15px Georgia, serif; letter-spacing: 1px; pointer-events: auto; }
  #touch.small .pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); }
  #touch.small button { width: 46px; height: 46px; font-size: 18px; }
  #touch.small button[data-a="serve"] { width: 72px; height: 72px; font-size: 13px; }
  #touch button.on { background: rgba(255, 244, 224, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 10, 6, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(44px, 12vw, 76px); font-weight: 700; letter-spacing: 6px; color: var(--gold); text-shadow: 3px 3px 0 #8a3a0a, 0 0 22px rgba(255, 176, 58, 0.5); font-style: italic; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 700; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(14px, 3.6vw, 17px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 14px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px Georgia, serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,224,0.3); border-radius: 8px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1206; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #8a5a00; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 36px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Bancone sopra">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="down" aria-label="Bancone sotto">▼</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
  </div>
  <button type="button" data-a="serve" aria-label="Servi">SERVI</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 480;
  // four counters, each a little longer than the one above
  const BARS = [0, 1, 2, 3].map((i) => ({ y: 160 + i * 86, xL: 128 - i * 30, xR: 540 + i * 10 }));
  const DRINK_SPEED = 300, MUG_SPEED = 120, WALK = 210;
  // every few rounds the saloon gets a new look
  const PLACES = [
    { name: "IL SALOON", wall: "#5a2a14", wall2: "#4a2010", bar: "#8a4a1a", top: "#c07830", drink: "#c86a1a", foam: "#fff4e0" },
    { name: "LO STADIO", wall: "#1a3a2a", wall2: "#143020", bar: "#5a5a6a", top: "#9a9aaa", drink: "#ffd34d", foam: "#ffffff" },
    { name: "IL LOCALE ROCK", wall: "#2a1030", wall2: "#200a26", bar: "#3a3a3a", top: "#ff4fa3", drink: "#b0ff3d", foam: "#e8ffd0" },
    { name: "LA STAZIONE SPAZIALE", wall: "#0a1430", wall2: "#060e24", bar: "#3a4a6a", top: "#3de0ff", drink: "#3dd6ff", foam: "#e0fbff" },
  ];
  const HATS = ["#8a4a1a", "#3a3a3a", "#c8a060", "#6a2a1a", "#2a2a5a", "#e8e0c8"];
  const SHIRTS = ["#c83a3a", "#3a6ac8", "#3aa85a", "#c8a03a", "#8a3ac8", "#3ac8b8"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · clienti lenti e pazienti", lives: 5, speed: 0.8, spawn: 1.3 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, spawn: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · clienti veloci e numerosi", lives: 3, speed: 1.2, spawn: 0.8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "saloon-difficulty";
  const bestKey = (id) => `saloon-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(150px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 150;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    pour: lim(() => noise(0.25, 0.08, 2500)),
    slide: lim(() => beep(300, 0.2, "triangle", 0.03, -120)),
    catch: lim(() => beep(880, 0.08, "square", 0.04, 200)),
    out: lim(() => arp([523, 659, 784], 0.05, 0.08, "square", 0.035)),
    mug: lim(() => beep(1320, 0.05, "triangle", 0.05)),
    smash: () => { noise(0.5, 0.35, 1500); beep(200, 0.4, "sawtooth", 0.04, -120); },
    step: lim(() => beep(150, 0.03, "square", 0.015)),
    tip: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "triangle", 0.05),
    move: lim(() => beep(440, 0.05, "square", 0.02, 100)),
    clear: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.1, 0.16),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, round = 0, bestCache = 0, nextLife = 20000;
  let barman = null, customers = [], drinks = [], mugs = [], tips = [], popups = [], shards = [];
  let toServe = 0, spawned = 0, spawnT = 0, danceT = 0, message = null, failWhy = "", failAt = null;
  const ctl = { left: false, right: false, up: false, down: false, serve: false };
  let upPressed = false, downPressed = false, servePressed = false;

  const place = () => PLACES[round % PLACES.length];
  const speedMul = () => diff.speed * (1 + Math.min(0.8, round * 0.1));

  function startRound() {
    barman = { bar: 1, x: BARS[1].xR + 14, pour: 0, walk: 0, face: -1 };
    customers = []; drinks = []; mugs = []; tips = []; shards = [];
    toServe = 6 + round * 3; spawned = 0; spawnT = 0.5; danceT = 0;
    // a few customers are already waiting when the doors open
    for (let i = 0; i < Math.min(4, 1 + Math.floor(round / 2)); i++) spawnCustomer(i % 4, BARS[i % 4].xL + rnd(0, 60));
    message = { text: `${place().name} · ROUND ${round + 1}`, sub: `Clienti da servire: ${toServe}`, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function spawnCustomer(bar, x) {
    const B = BARS[bar];
    customers.push({ bar, x: x ?? B.xL - 10, state: "walk", t: rnd(0.2, 0.8), stepLeft: rnd(30, 60), drinkT: 0, pushT: 0, look: Math.floor(Math.random() * 6), shirt: Math.floor(Math.random() * 6) });
    spawned++;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "fail", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff4e0") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 25000; lives++; sfx.life(); popups.push({ x: W / 2, y: 100, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function fail(why, x, y) {
    if (state !== "play") return;
    lives--; failWhy = why; failAt = { x, y };
    sfx.smash();
    state = "fail"; stateT = 2.4;
  }
  function afterFail() {
    if (lives <= 0) { gameOver(); return; }
    // the counters are cleared and the remaining customers come back in
    const left = toServe;
    const served = spawned - customers.length;
    customers = []; drinks = []; mugs = []; tips = []; shards = [];
    spawned = served;
    toServe = left;
    barman.x = BARS[barman.bar].xR + 14; barman.pour = 0;
    spawnT = 0.8;
    for (let i = 0; i < Math.min(3, toServe); i++) spawnCustomer(i, BARS[i].xL + rnd(0, 40));
    state = "play";
  }
  function roundCleared() {
    const bonus = 1000 + round * 500;
    addScore(bonus);
    message = { text: "ROUND COMPLETATO!", sub: `Tutti serviti · bonus ${bonus}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 2.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, rd = round + 1;
    menu = () => showOverlay(
      `<h2 class="lose">IL SALOON CHIUDE</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Round ${rd} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIAPRI IL LOCALE</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% + 6px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SALOON</h1>
       <p>Sei il barista del locale più affollato del West! Riempi i boccali di bibita alla spina e falli scivolare lungo i banconi: ogni cliente che ne prende uno viene spinto indietro, e se esce dalla porta è servito. Recupera i boccali vuoti che ti rilanciano. Non far arrivare nessuno alla spina, non lanciare bibite a vuoto e non far cadere i boccali!</p>
       <div class="pts">
         <span><b>Cliente servito</b></span><span>50</span>
         <span><b>Boccale vuoto preso</b></span><span>100</span>
         <span><b>Mancia</b></span><span>1500 · arrivano le ballerine e i clienti si distraggono</span>
       </div>
       ${touchMode
         ? `<p class="muted help">▲ ▼ per cambiare bancone · ◀ ▶ per camminare lungo il bancone · SERVI per riempire e lanciare</p>`
         : `<p class="muted help">↑ ↓ cambia bancone · ← → cammina lungo il bancone · SPAZIO riempi e lancia · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>APRI IL LOCALE</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down", " ": "serve", enter: "serve" };
  function pressed(a) { if (a === "up") upPressed = true; if (a === "down") downPressed = true; if (a === "serve") servePressed = true; }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      else if (k === "arrowleft") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 2) % 3]);
      else if (k === "arrowright") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 1) % 3]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    ctl[a] = true;
    if (!e.repeat) pressed(a);
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true; pressed(a);
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function updateBarman(dt) {
    const b = barman, B = BARS[b.bar];
    const atTap = b.x >= B.xR + 10;
    // up and down jump straight to the tap of the other counter
    if (upPressed || downPressed) {
      const nb = Math.max(0, Math.min(3, b.bar + (upPressed ? -1 : 1)));
      if (nb !== b.bar) { b.bar = nb; b.x = BARS[nb].xR + 14; b.pour = 0; sfx.move(); }
      upPressed = downPressed = false;
      return;
    }
    // pouring: the drink slides away when the mug is full
    if (b.pour > 0) {
      b.pour += dt;
      if (b.pour >= 0.28) {
        b.pour = 0;
        drinks.push({ bar: b.bar, x: B.xR - 8, full: true });
        sfx.slide();
      }
      servePressed = false;
      return;
    }
    if (servePressed) {
      servePressed = false;
      if (atTap) { b.pour = 0.001; sfx.pour(); return; }
      b.x = B.xR + 14; // back to the tap
    }
    const mv = (ctl.right ? 1 : 0) - (ctl.left ? 1 : 0);
    if (mv) {
      b.face = mv;
      b.x = Math.max(B.xL + 24, Math.min(B.xR + 14, b.x + mv * WALK * dt));
      b.walk += dt * 10;
      if (Math.floor(b.walk) % 3 === 0 && Math.random() < 0.1) sfx.step();
    }
    // tips on the counter
    for (const t of tips) {
      if (t.bar !== b.bar || t.gone || Math.abs(t.x - b.x) > 20) continue;
      t.gone = true;
      addScore(1500, t.x, B.y - 50, "#ffd34d");
      danceT = 3; sfx.tip();
    }
  }
  function updateCustomers(dt) {
    const sp = 34 * speedMul();
    for (const c of customers) {
      const B = BARS[c.bar];
      if (c.state === "walk") {
        if (danceT > 0) continue; // watching the dancers
        c.t -= dt;
        if (c.t > 0) continue;
        // shuffle forward a bit, then wait
        const step = Math.min(c.stepLeft, sp * dt * 2.2);
        c.x += step; c.stepLeft -= step;
        if (c.stepLeft <= 0) { c.stepLeft = rnd(24, 54); c.t = rnd(0.5, 1.4) / speedMul(); }
        // reached the tap: the barman is in trouble
        if (c.x >= B.xR - 12) { fail("Un cliente è arrivato alla spina senza essere servito!", c.x, B.y); return; }
      } else if (c.state === "pushed") {
        // caught a drink: slides back towards the door while drinking
        c.pushT -= dt;
        c.x -= 170 * dt;
        if (c.x < B.xL - 12) {
          c.gone = true; toServe--;
          addScore(50, B.xL + 10, B.y - 60, "#7dff9a"); sfx.out();
          if (toServe <= 0 && !customers.some((q) => !q.gone && q !== c)) { roundCleared(); return; }
          continue;
        }
        if (c.pushT <= 0) { c.state = "drink"; c.drinkT = rnd(0.8, 1.4) / speedMul(); }
      } else if (c.state === "drink") {
        c.drinkT -= dt;
        if (c.drinkT <= 0) {
          // done: the empty mug is sent back down the counter
          mugs.push({ bar: c.bar, x: c.x + 14 });
          c.state = "walk"; c.t = 0.5; c.stepLeft = rnd(24, 54);
        }
      }
    }
    customers = customers.filter((c) => !c.gone);
  }
  function updateDrinks(dt) {
    for (const d of drinks) {
      const B = BARS[d.bar];
      d.x -= DRINK_SPEED * dt;
      // the first thirsty customer on the way grabs it
      const c = customers.filter((q) => q.bar === d.bar && q.state === "walk" && q.x <= d.x + 6 && q.x >= d.x - 14).sort((a, b) => b.x - a.x)[0];
      if (c) {
        d.gone = true;
        c.state = "pushed"; c.pushT = rnd(0.35, 0.6);
        addScore(0);
        sfx.catch();
        if (Math.random() < 0.1) tips.push({ bar: c.bar, x: c.x + 10, t: 6 });
        continue;
      }
      // nobody took it: it flies off the end and smashes
      if (d.x < B.xL - 4) { d.gone = true; fail("Hai lanciato una bibita a vuoto!", B.xL, B.y); return; }
    }
    drinks = drinks.filter((d) => !d.gone);
  }
  function updateMugs(dt) {
    for (const m of mugs) {
      const B = BARS[m.bar];
      m.x += MUG_SPEED * speedMul() * dt;
      // caught when it reaches the barman on its counter
      if (barman.bar === m.bar && m.x >= barman.x - 16 && m.x <= barman.x + 6) {
        m.gone = true; addScore(100, m.x, B.y - 40, "#3dd6ff"); sfx.mug();
        continue;
      }
      if (m.x > B.xR + 30) { m.gone = true; fail("Un boccale vuoto è caduto dal bancone!", B.xR + 30, B.y); return; }
    }
    mugs = mugs.filter((m) => !m.gone);
  }
  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 1));
    for (const s of shards) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; }
    shards = shards.filter((s) => s.t < 1);
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "fail") {
      stateT -= dt;
      if (failAt && Math.random() < 0.3 && stateT > 1.8) shards.push({ x: failAt.x, y: failAt.y - 10, vx: rnd(-120, 120), vy: rnd(-200, -60), t: 0 });
      if (stateT <= 0) afterFail();
      return;
    }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) { round++; startRound(); } return; }

    danceT = Math.max(0, danceT - dt);
    updateBarman(dt);
    // new customers come in through the doors
    const maxHere = 3 + Math.min(6, round);
    const pending = toServe - customers.length;
    spawnT -= dt;
    if (spawnT <= 0 && pending > 0 && spawned < toServe + 50 && customers.length < maxHere && danceT <= 0) {
      const counts = BARS.map((_, i) => customers.filter((c) => c.bar === i).length);
      const bar = Math.random() < 0.6 ? counts.indexOf(Math.min(...counts)) : Math.floor(Math.random() * 4);
      spawnCustomer(bar);
      spawnT = rnd(1.2, 2.6) * diff.spawn / Math.min(1.8, 1 + round * 0.1);
    }
    updateCustomers(dt); if (state !== "play") return;
    updateDrinks(dt); if (state !== "play") return;
    updateMugs(dt); if (state !== "play") return;
    for (const t of tips) { t.t -= dt; if (t.t <= 0) t.gone = true; }
    tips = tips.filter((t) => !t.gone);
  }

  // ---------- Drawing ----------
  function drawRoom() {
    const P = place();
    ctx.fillStyle = P.wall; ctx.fillRect(0, 0, W, H);
    // wall planks
    ctx.fillStyle = P.wall2;
    for (let x = 0; x < W; x += 32) ctx.fillRect(x, 0, 2, H);
    // doors on the left of each counter
    for (const B of BARS) {
      ctx.fillStyle = "#1a0a04"; ctx.fillRect(B.xL - 40, B.y - 70, 30, 70);
      ctx.fillStyle = P.bar;
      const swing = Math.sin(clock * 3) * 2;
      ctx.fillRect(B.xL - 40, B.y - 52, 14 + swing, 30); ctx.fillRect(B.xL - 24 - swing, B.y - 52, 14 + swing, 30);
    }
    // bottles on shelves behind the barman
    const colors = ["#3aa85a", "#c83a3a", "#ffd34d", "#3a6ac8"];
    for (let i = 0; i < 4; i++) { const B = BARS[i]; for (let k = 0; k < 3; k++) { ctx.fillStyle = colors[(i + k) % 4]; ctx.fillRect(B.xR + 46 + k * 9, B.y - 62, 6, 16); ctx.fillRect(B.xR + 48 + k * 9, B.y - 68, 2, 6); } ctx.fillStyle = "#3a1a0a"; ctx.fillRect(B.xR + 42, B.y - 46, 36, 3); }
    // title board
    ctx.fillStyle = "#2a1206"; ctx.fillRect(W / 2 - 110, 40, 220, 34);
    ctx.strokeStyle = "#ffb03a"; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 110, 40, 220, 34);
    ctx.fillStyle = "#ffd34d"; ctx.font = "italic 700 18px Georgia, serif"; ctx.textAlign = "center"; ctx.fillText(P.name, W / 2, 63);
  }
  function drawCounter(B) {
    const P = place();
    ctx.fillStyle = P.bar; ctx.fillRect(B.xL, B.y, B.xR - B.xL, 26);
    ctx.fillStyle = P.top; ctx.fillRect(B.xL - 4, B.y - 4, B.xR - B.xL + 8, 7);
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    for (let x = B.xL + 30; x < B.xR; x += 40) ctx.fillRect(x, B.y + 6, 2, 20);
    // the tap
    ctx.fillStyle = "#c8c8d0"; ctx.fillRect(B.xR + 30, B.y - 34, 8, 30);
    ctx.fillStyle = P.drink; ctx.fillRect(B.xR + 24, B.y - 40, 20, 8);
  }
  function drawCustomer(c) {
    const B = BARS[c.bar], x = c.x, y = B.y - 4;
    const bob = c.state === "walk" && c.t <= 0 ? Math.abs(Math.sin(clock * 12)) * 2 : 0;
    ctx.save(); ctx.translate(x, y - bob);
    // body behind the counter
    ctx.fillStyle = SHIRTS[c.shirt]; ctx.fillRect(-10, -30, 20, 26);
    ctx.fillStyle = "#f0c090"; ctx.beginPath(); ctx.arc(0, -38, 9, 0, Math.PI * 2); ctx.fill();
    // hat
    ctx.fillStyle = HATS[c.look]; ctx.fillRect(-14, -46, 28, 4); ctx.fillRect(-8, -56, 16, 11);
    // face: eyes on the barman, or on the dancers
    ctx.fillStyle = "#000";
    const look = danceT > 0 ? -2 : 2;
    ctx.fillRect(look - 3, -40, 2, 2); ctx.fillRect(look + 2, -40, 2, 2);
    ctx.fillStyle = "#6a3a1a"; ctx.fillRect(-4, -34, 8, 2);
    // arm raised for a drink, or holding the mug
    ctx.fillStyle = SHIRTS[c.shirt];
    if (c.state === "walk") { ctx.fillRect(8, -44, 5, 16); ctx.fillStyle = "#f0c090"; ctx.fillRect(8, -48, 5, 5); }
    else { ctx.fillRect(8, -26, 12, 5); drawMug(22, -24, true, c.state === "drink" ? Math.max(0, c.drinkT) : 1); }
    ctx.restore();
  }
  function drawMug(x, y, full, fill = 1) {
    const P = place();
    ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fillRect(x - 6, y - 14, 12, 14);
    if (full) { const h = 12 * Math.min(1, fill); ctx.fillStyle = P.drink; ctx.fillRect(x - 5, y - 1 - h, 10, h); ctx.fillStyle = P.foam; if (fill > 0.8) ctx.fillRect(x - 6, y - 16, 12, 4); }
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 7, y - 7, 4, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  }
  function drawBarman() {
    const b = barman, B = BARS[b.bar];
    const x = b.x + 8, y = B.y + 24;
    ctx.save(); ctx.translate(x, y);
    const legs = Math.sin(b.walk) * 3;
    ctx.fillStyle = "#2a2a3a"; ctx.fillRect(-7, -12, 5, 12 + legs); ctx.fillRect(2, -12, 5, 12 - legs);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-10, -38, 20, 27);            // white shirt
    ctx.fillStyle = "#e8e0d0"; ctx.fillRect(-9, -30, 18, 20);             // apron
    ctx.fillStyle = "#c83a3a"; ctx.fillRect(-3, -38, 6, 4);               // bow tie
    ctx.fillStyle = "#f0c090"; ctx.beginPath(); ctx.arc(0, -46, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a1a0a"; ctx.fillRect(-9, -56, 18, 6); ctx.fillRect(-5, -44, 10, 2); // hair and moustache
    ctx.fillStyle = "#000"; ctx.fillRect(-5, -48, 2, 2); ctx.fillRect(2, -48, 2, 2);
    // arm at the tap while pouring
    ctx.fillStyle = "#ffffff";
    if (b.pour > 0) { ctx.fillRect(-18, -34, 10, 5); drawMug(-20, -26, true, b.pour / 0.28); }
    else ctx.fillRect(-14, -34, 5, 14);
    ctx.restore();
  }
  function drawDancers() {
    const a = Math.min(1, danceT * 2);
    ctx.globalAlpha = a;
    for (let k = 0; k < 3; k++) {
      const x = W / 2 - 60 + k * 60, y = 120, kick = Math.sin(clock * 10 + k * 2) * 10;
      ctx.fillStyle = ["#ff4fa3", "#ffd34d", "#3dd6ff"][k];
      ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y); ctx.lineTo(x + 6, y - 24); ctx.lineTo(x - 6, y - 24); ctx.fill();
      ctx.fillStyle = "#f0c090"; ctx.beginPath(); ctx.arc(x, y - 30, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#f0c090"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y + 14); ctx.moveTo(x + 4, y); ctx.lineTo(x + 8 + kick, y + 12 - Math.abs(kick) * 0.5); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawRoom();
    if (!barman) return;
    if (danceT > 0) drawDancers();
    for (let i = 0; i < 4; i++) {
      const B = BARS[i];
      for (const c of customers) if (c.bar === i) drawCustomer(c);
      drawCounter(B);
      for (const d of drinks) if (d.bar === i) drawMug(d.x, B.y - 3, true);
      for (const m of mugs) if (m.bar === i) drawMug(m.x, B.y - 3, false);
      for (const t of tips) if (t.bar === i && !(t.t < 2 && Math.floor(clock * 8) % 2)) { ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.ellipse(t.x, B.y - 5, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#c8902a"; ctx.fillRect(t.x - 1, B.y - 6, 2, 2); }
      if (barman.bar === i && state !== "menu") drawBarman();
    }
    for (const s of shards) { ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fillRect(s.x, s.y, 4, 3); }
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 1));
      ctx.textAlign = "center"; ctx.font = q.big ? "700 24px Georgia, serif" : "700 15px Georgia, serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "#1a0a04"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status
    ctx.textAlign = "left"; ctx.font = "700 20px Georgia, serif"; ctx.fillStyle = "#ffd34d";
    ctx.fillText(score.toLocaleString("it-IT"), 14, 28);
    ctx.font = "700 12px Georgia, serif"; ctx.fillStyle = "#d0b898";
    ctx.fillText(`RECORD ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 14, 46);
    for (let i = 0; i < Math.min(lives - (state === "fail" ? 0 : 1), 6); i++) drawMug(W - 20 - i * 22, 30, true);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff4e0"; ctx.font = "700 13px Georgia, serif";
    ctx.fillText(`ROUND ${round + 1} · ANCORA ${Math.max(0, toServe)} CLIENTI`, W - 14, 52);
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(18,10,6,0.8)"; ctx.fillRect(0, H / 2 - 50, W, message.sub ? 80 : 56);
      ctx.textAlign = "center"; ctx.font = "italic 700 28px Georgia, serif"; ctx.fillStyle = "#ffd34d";
      ctx.fillText(message.text, W / 2, H / 2 - 14);
      if (message.sub) { ctx.font = "700 15px Georgia, serif"; ctx.fillStyle = "#fff4e0"; ctx.fillText(message.sub, W / 2, H / 2 + 14); }
      ctx.globalAlpha = 1;
    }
    if (state === "fail") {
      ctx.fillStyle = "rgba(18,10,6,0.8)"; ctx.fillRect(0, H / 2 - 40, W, 64);
      ctx.textAlign = "center"; ctx.font = "italic 700 26px Georgia, serif"; ctx.fillStyle = "#ff4f6a";
      ctx.fillText("PASTICCIO!", W / 2, H / 2 - 10);
      ctx.font = "700 14px Georgia, serif"; ctx.fillStyle = "#fff4e0"; ctx.fillText(failWhy, W / 2, H / 2 + 14);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  startRound(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="saloon-best-" data-kind="score"></script>

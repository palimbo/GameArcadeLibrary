<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pattuglia Lunare</title>
<style>
  :root {
    --bg: #0a0618;
    --fg: #f4f0ff;
    --muted: #a89cc8;
    --buggy: #c86aff;
    --ground: #c8783a;
    --gold: #ffd34d;
    --red: #ff4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 240, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(200, 106, 255, 0.7); background: rgba(200, 106, 255, 0.1);
  }
  #touch button[data-a="jump"] { width: 84px; height: 84px; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.14); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch button[data-a="fire"] { width: 84px; height: 84px; border-color: rgba(255, 74, 90, 0.9); background: rgba(255, 74, 90, 0.14); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch.small button { width: 56px; height: 56px; font-size: 20px; }
  #touch.small button[data-a="jump"], #touch.small button[data-a="fire"] { width: 68px; height: 68px; font-size: 11px; }
  #touch button.on { background: rgba(244, 240, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 6, 24, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 60px); font-weight: 900; letter-spacing: 2px; color: var(--buggy); text-shadow: 0 3px 0 #5a1a8a, 0 0 22px rgba(200,106,255,0.5); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,240,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--buggy); color: #1a0628; background: var(--buggy); padding: 11px 30px; box-shadow: 0 4px 0 #5a1a8a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-a="left" aria-label="Rallenta">◀</button>
    <button type="button" data-a="right" aria-label="Accelera">▶</button>
  </div>
  <div class="cl">
    <button type="button" data-a="fire" aria-label="Fuoco">FUOCO</button>
    <button type="button" data-a="jump" aria-label="Salta">SALTA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 320, TOP = 26, GY = 268;
  const SEG = 900, CHECKS_PER_STAGE = 5, STAGE_LEN = SEG * CHECKS_PER_STAGE;
  const G = 1000, JUMP_V = 360;
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const STAGES = [
    { name: "IL MARE DELLA TRANQUILLITÀ", sky: ["#0a0618", "#3a1a5a"], hills: "#2a6a8a", near: "#1a4a5a", ground: "#c8783a" },
    { name: "IL CRATERE COPERNICO", sky: ["#02081a", "#1a3a6a"], hills: "#6a3a8a", near: "#4a2a6a", ground: "#b8a078" },
    { name: "IL LATO OSCURO", sky: ["#000000", "#1a0a1a"], hills: "#4a4a5a", near: "#2a2a3a", ground: "#8a8a9a" },
    { name: "LA BASE NEMICA", sky: ["#1a0206", "#5a1a1a"], hills: "#8a3a2a", near: "#5a2a1a", ground: "#c85a3a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · meno ostacoli e dischi volanti", lives: 5, dens: 0.7, ufo: 0.6 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, dens: 1, ufo: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 vite · strada dissestata e cielo pieno di nemici", lives: 3, dens: 1.3, ufo: 1.45 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pattuglia-difficulty";
  const bestKey = (id) => `pattuglia-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(120px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 120;
    if (showTouch && !portrait) {
      // in landscape the buttons sit below the field when there is room, otherwise at its sides
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      const below = window.innerHeight - 8 - 110;
      if (below / H * W <= window.innerWidth - 8 && below / H > (window.innerWidth - 2 * side) / W) availH = below;
      else if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
    wrap.style.alignItems = showTouch && !portrait && availH < window.innerHeight - 8 ? "flex-start" : "center";
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(900, 0.06, "square", 0.02, -500)),
    jump: lim(() => beep(220, 0.2, "triangle", 0.04, 300)),
    land: lim(() => beep(120, 0.06, "square", 0.03)),
    rock: lim(() => { noise(0.2, 0.2, 700); beep(200, 0.12, "square", 0.03, -100); }),
    ufo: lim(() => { noise(0.3, 0.2, 2000); arp([880, 660, 440], 0.05, 0.08, "square", 0.03); }),
    bomb: lim(() => beep(1200, 0.4, "sine", 0.02, -900)),
    crater: lim(() => noise(0.3, 0.25, 400)),
    tank: lim(() => beep(160, 0.15, "sawtooth", 0.04, -60)),
    die: () => { noise(0.8, 0.35, 600); arp([523, 392, 330, 262, 196], 0.12, 0.16, "sawtooth", 0.035); },
    check: () => arp([659, 784, 1047], 0.07, 0.12, "triangle", 0.05),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    over80: lim(() => beep(1500, 0.05, "triangle", 0.03)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, bestCache = 0, nextLife = 10000;
  let course = [], obstacles = [], buggy = null, dist = 0, checkpoint = 0, checkT = 0, stageT = 0;
  let shotsF = [], shotsU = [], ufos = [], bombs = [], shells = [], ufoT = 4, parts = [], popups = [], message = null;
  const ctl = { left: false, right: false, jump: false, fire: false };
  let jumpPressed = false, firePressed = false, fireT = 0;

  const ST = () => STAGES[stage % STAGES.length];
  const stageStart = () => stage * STAGE_LEN;
  const BX = () => 110 + (buggy ? (buggy.speed - 100) * 0.35 : 0);
  const sx = (wx) => wx - dist + BX();

  // the road of one stage, obstacle by obstacle
  function buildCourse() {
    const s0 = stageStart(), dens = diff.dens * (1 + Math.min(0.9, stage * 0.15));
    course = [];
    let x = s0 + 520;
    while (x < s0 + STAGE_LEN - 200) {
      const r = Math.random(), lvl = stage;
      if (r < 0.26) course.push({ kind: "crater", x, w: rnd(26, 40) });
      else if (r < 0.4) course.push({ kind: "crater", x, w: rnd(46, 62) });
      else if (r < 0.58) course.push({ kind: "rock", x, big: false, hp: 1 });
      else if (r < 0.7) course.push({ kind: "rock", x, big: true, hp: 2 });
      else if (r < 0.8 && lvl >= 1) course.push({ kind: "mine", x });
      else if (r < 0.9 && lvl >= 1) course.push({ kind: "tank", x, hp: 1, fireT: rnd(0.5, 1.5) });
      else { course.push({ kind: "crater", x, w: rnd(26, 36) }); course.push({ kind: "rock", x: x + 110, big: false, hp: 1 }); x += 110; }
      x += rnd(190, 330) / dens;
    }
  }
  function resetFrom(wx) {
    obstacles = course.filter((o) => o.x > wx + 60).map((o) => ({ ...o }));
    dist = wx; shotsF = []; shotsU = []; ufos = []; bombs = []; shells = [];
    buggy = { speed: 100, y: 0, vy: 0, air: false, dead: false, inv: 1.5, bob: 0 };
    ufoT = rnd(3, 5);
  }
  function startStage() {
    buildCourse();
    checkpoint = stageStart(); checkT = 0; stageT = 0;
    resetFrom(checkpoint);
    message = { text: `FASE ${stage + 1}`, sub: ST().name, t: 0 };
    state = "intro"; stateT = 1.6;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; nextLife = 10000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f4f0ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 20000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.4 + Math.random() * 0.5, c: color });
    }
  }
  function crash(what) {
    if (state !== "play" || buggy.inv > 0) return;
    lives--; buggy.dead = true;
    sfx.die();
    burst(BX(), GY - 12 + buggy.y, "#ffd34d", 26, 180);
    burst(BX(), GY - 12 + buggy.y, "#c86aff", 16, 140);
    message = { text: what, t: 0 };
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    resetFrom(checkpoint);
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, pt = LETTERS[Math.min(25, Math.floor((checkpoint) / SEG) % 26)];
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Fase ${stage + 1}, punto ${pt} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PATTUGLIA LUNARE</h1>
       <p>Guida il fuoristrada lunare dal punto A al punto Z! Salta crateri e mine, distruggi i massi col cannone e abbatti i dischi volanti: il cannone spara insieme in avanti e verso il cielo. Occhio alle bombe, che aprono nuovi crateri sulla strada.</p>
       <div class="pts">
         <span><b>Salto di un ostacolo</b></span><span>50</span>
         <span><b>Masso</b></span><span>100 · il masso grande ne vuole due</span>
         <span><b>Disco volante</b></span><span>200 · bombardiere 300</span>
         <span><b>Carro armato</b></span><span>500</span>
         <span><b>Fine fase</b></span><span>bonus tempo</span>
       </div>
       ${touchMode
         ? `<p class="muted help">◀ ▶ per rallentare e accelerare · SALTA · FUOCO (in avanti e in alto insieme)</p>`
         : `<p class="muted help">← → per rallentare e accelerare · ↑ o SPAZIO per saltare · Z o X per sparare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "jump", w: "jump", " ": "jump", z: "fire", x: "fire", control: "fire" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    ctl[a] = true;
    if (a === "jump" && !e.repeat) jumpPressed = true;
    if (a === "fire" && !e.repeat) firePressed = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      if (a === "jump") jumpPressed = true;
      if (a === "fire") firePressed = true;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Updates ----------
  const holes = () => obstacles.filter((o) => o.kind === "crater");
  function updateBuggy(dt) {
    const b = buggy;
    b.inv = Math.max(0, b.inv - dt);
    const target = ctl.right ? 160 : ctl.left ? 60 : 100;
    b.speed += (target - b.speed) * Math.min(1, dt * 2);
    dist += b.speed * dt;
    b.bob += dt * b.speed * 0.1;
    if (jumpPressed && !b.air) { b.vy = -JUMP_V; b.air = true; sfx.jump(); }
    jumpPressed = false;
    if (b.air) {
      b.vy += G * dt; b.y += b.vy * dt;
      if (b.y >= 0) { b.y = 0; b.vy = 0; b.air = false; sfx.land(); }
    }
    // the gun fires forward and up at the same time
    fireT -= dt;
    if ((firePressed || ctl.fire) && fireT <= 0) {
      if (shotsF.length < 2) shotsF.push({ x: dist + 26, y: GY - 16 + b.y, t: 0 });
      if (shotsU.length < 4) shotsU.push({ x: dist - 4, y: GY - 26 + b.y });
      fireT = 0.22; sfx.shot();
    }
    firePressed = false;
    // falling into a crater
    if (!b.air) for (const o of holes()) if (dist > o.x + 5 && dist < o.x + o.w - 5) { crash("NEL CRATERE!"); return; }
  }
  function updateObstacles(dt) {
    const b = buggy;
    for (const o of obstacles) {
      if (o.gone) continue;
      const rel = o.x - dist;
      // points for jumping over things
      if (!o.passed && rel < -20 && o.kind !== "tank") {
        o.passed = true;
        if (o.jumped) { addScore(50, sx(o.x), GY - 40, "#bfe6ff"); sfx.over80(); }
      }
      if (b.air && Math.abs(rel) < 30) o.jumped = true;
      if (o.kind === "rock" || o.kind === "mine" || o.kind === "tank") {
        const half = o.kind === "rock" ? (o.big ? 13 : 8) : o.kind === "tank" ? 16 : 9;
        const height = o.kind === "rock" ? (o.big ? 22 : 13) : o.kind === "tank" ? 18 : 5;
        if (Math.abs(rel) < half + 16 && -b.y < height) { crash(o.kind === "rock" ? "CONTRO UN MASSO!" : o.kind === "mine" ? "SU UNA MINA!" : "CONTRO IL CARRO ARMATO!"); return; }
      }
      if (o.kind === "tank" && rel < 420 && rel > 30) {
        o.fireT -= dt;
        if (o.fireT <= 0) { o.fireT = rnd(1.6, 2.6) / Math.min(1.8, 1 + stage * 0.15); shells.push({ x: o.x - 18, y: GY - 12, v: 150 }); sfx.tank(); }
      }
    }
    obstacles = obstacles.filter((o) => !o.gone && o.x > dist - 200);
    for (const s of shells) {
      s.x -= s.v * dt;
      if (Math.abs(s.x - dist) < 18 && -b.y < 18) { s.gone = true; crash("COLPITO DAL CARRO ARMATO!"); return; }
      if (s.x < dist - 150) s.gone = true;
    }
    shells = shells.filter((s) => !s.gone);
  }
  function updateShots(dt) {
    for (const s of shotsF) {
      s.x += 420 * dt; s.t += dt;
      for (const o of obstacles) {
        if (o.gone || (o.kind !== "rock" && o.kind !== "tank")) continue;
        if (s.x > o.x - 12 && s.x < o.x + 12) {
          s.gone = true; o.hp--;
          burst(sx(o.x), GY - 8, o.kind === "tank" ? "#8aff6a" : "#c8a078", 8, 80);
          if (o.hp <= 0) { o.gone = true; addScore(o.kind === "tank" ? 500 : o.big ? 200 : 100, sx(o.x), GY - 34, "#ffd34d"); sfx.rock(); }
          else sfx.land();
          break;
        }
      }
      for (const sh of shells) if (!s.gone && Math.abs(sh.x - s.x) < 10) { sh.gone = true; s.gone = true; addScore(50, sx(sh.x), GY - 30); }
      if (s.t > 0.42) s.gone = true;
    }
    shotsF = shotsF.filter((s) => !s.gone);
    for (const s of shotsU) {
      s.y -= 380 * dt; s.x += buggy.speed * dt * 0.6;
      for (const u of ufos) if (!u.gone && Math.abs(u.x - s.x) < 16 && Math.abs(u.y - s.y) < 12) { s.gone = true; u.gone = true; addScore(u.kind === "bomber" ? 300 : 200, sx(u.x), u.y - 10, "#ff8aff"); burst(sx(u.x), u.y, "#ff8aff", 16, 140); sfx.ufo(); }
      for (const bb of bombs) if (!s.gone && Math.abs(bb.x - s.x) < 8 && Math.abs(bb.y - s.y) < 10) { s.gone = true; bb.gone = true; addScore(20); burst(sx(bb.x), bb.y, "#fff", 5, 60); }
      if (s.y < TOP) s.gone = true;
    }
    shotsU = shotsU.filter((s) => !s.gone);
  }
  function updateUfos(dt) {
    const b = buggy, m = diff.ufo * (1 + Math.min(1, stage * 0.2));
    ufoT -= dt * m;
    if (ufoT <= 0 && stageStart() + STAGE_LEN - dist > 300) {
      ufoT = rnd(5, 8);
      const n = 2 + Math.floor(Math.random() * 2) + (stage > 1 ? 1 : 0);
      const kind = stage >= 1 && Math.random() < 0.4 ? "bomber" : "saucer";
      for (let i = 0; i < n; i++) ufos.push({ kind, x: dist + 360 + i * 40, y: 60 + i * 12, ph: i * 1.3, bombT: rnd(1, 2.5) + i * 0.5, life: 0, cy: rnd(55, 120) });
    }
    for (const u of ufos) {
      u.life += dt;
      // they hover over the buggy, weaving about
      const tx = dist + 40 + Math.sin(u.life * 0.9 + u.ph) * 150;
      u.x += (tx - u.x) * Math.min(1, dt * 0.8) + b.speed * dt * 0.95;
      u.y = u.cy + Math.sin(u.life * 2.3 + u.ph) * (u.kind === "bomber" ? 12 : 25);
      u.bombT -= dt * m;
      if (u.bombT <= 0 && u.life > 1.5) {
        u.bombT = rnd(2.6, 4.6) / Math.min(1.6, 1 + stage * 0.1);
        bombs.push({ x: u.x, y: u.y + 8, vy: 60, crater: u.kind === "bomber" });
        sfx.bomb();
      }
      if (u.life > 22) { u.y -= 80 * dt; u.cy -= 80 * dt; if (u.y < -20) u.gone = true; }
    }
    ufos = ufos.filter((u) => !u.gone);
    for (const bb of bombs) {
      bb.vy += 160 * dt; bb.y += bb.vy * dt; bb.x += b.speed * dt * 0.2;
      if (Math.abs(bb.x - dist) < 18 && bb.y > GY - 24 + b.y && bb.y < GY + b.y) { bb.gone = true; crash("BOMBARDATO!"); return; }
      if (bb.y >= GY) {
        bb.gone = true; sfx.crater(); burst(sx(bb.x), GY - 4, "#c8783a", 10, 90);
        // bombers open a fresh crater in the road
        if (bb.crater && bb.x > dist + 30) obstacles.push({ kind: "crater", x: bb.x - 13, w: 26, fresh: true });
      }
    }
    bombs = bombs.filter((bb) => !bb.gone);
  }
  function updateCheckpoints() {
    const next = checkpoint + SEG;
    if (dist >= next) {
      checkpoint = next;
      const idx = Math.floor(checkpoint / SEG);
      const letter = LETTERS[idx % 26];
      sfx.check();
      if (checkpoint >= stageStart() + STAGE_LEN) {
        const par = 55 + stage * 5, bonus = Math.max(0, Math.round((par - stageT) * 100 / 10) * 10) + 1000;
        addScore(bonus);
        message = { text: `FASE ${stage + 1} COMPLETATA!`, sub: `Tempo ${stageT.toFixed(1)} s · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
        state = "clear"; stateT = 3.2;
        sfx.clear();
      } else {
        message = { text: `PUNTO ${letter}`, sub: `${checkT.toFixed(1)} s`, t: 0 };
        checkT = 0;
      }
    }
  }

  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 220 * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.9));
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) afterDeath(); return; }
    if (state === "clear") { stateT -= dt; dist += 100 * dt; if (stateT <= 0) { stage++; startStage(); } return; }
    stageT += dt; checkT += dt;
    updateBuggy(dt);
    if (state !== "play") return;
    updateObstacles(dt);
    if (state !== "play") return;
    updateShots(dt);
    updateUfos(dt);
    if (state !== "play") return;
    updateCheckpoints();
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const st = ST();
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, st.sky[0]); g.addColorStop(1, st.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) {
      const x = ((i * 97 - dist * 0.02) % W + W) % W, y = TOP + (i * 53) % 150;
      ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 4) * 0.15})`; ctx.fillRect(x, y, 1.5, 1.5);
    }
    // the earth hanging in the sky
    ctx.fillStyle = "#3a7ae8"; ctx.beginPath(); ctx.arc(400, 70, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3ac86a"; ctx.beginPath(); ctx.arc(394, 66, 6, 0, Math.PI * 2); ctx.arc(406, 76, 4, 0, Math.PI * 2); ctx.fill();
    // far mountains
    ctx.fillStyle = st.hills; ctx.beginPath(); ctx.moveTo(0, GY);
    for (let x = 0; x <= W + 20; x += 20) { const wx = x + dist * 0.15; ctx.lineTo(x, 175 - Math.abs(Math.sin(wx * 0.011)) * 55 - Math.sin(wx * 0.037) * 12); }
    ctx.lineTo(W, GY); ctx.fill();
    // near hills with domes of the moon base
    ctx.fillStyle = st.near; ctx.beginPath(); ctx.moveTo(0, GY);
    for (let x = 0; x <= W + 10; x += 10) { const wx = x + dist * 0.4; ctx.lineTo(x, 225 - Math.abs(Math.sin(wx * 0.02)) * 28); }
    ctx.lineTo(W, GY); ctx.fill();
    for (let k = -1; k < 4; k++) {
      const wx = Math.floor(dist * 0.4 / 260) * 260 + k * 260, x = wx - dist * 0.4 + 60;
      ctx.fillStyle = "rgba(200,230,255,0.25)"; ctx.beginPath(); ctx.arc(x, 232, 16, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "rgba(255,230,120,0.6)"; ctx.fillRect(x - 3, 224, 2, 2); ctx.fillRect(x + 4, 226, 2, 2);
    }
  }
  function drawGround() {
    const st = ST();
    ctx.fillStyle = st.ground; ctx.fillRect(0, GY, W, H - GY);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let x = -((dist) % 24); x < W; x += 24) ctx.fillRect(x, GY + 8 + ((x + dist) * 7 % 3), 10, 3);
    for (let x = -((dist * 1.2) % 40); x < W; x += 40) ctx.fillRect(x + 15, GY + 26, 16, 3);
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(0, GY, W, 2);
    // craters
    for (const o of obstacles) {
      if (o.kind !== "crater") continue;
      const x = sx(o.x);
      if (x > W + 20 || x + o.w < -20) continue;
      ctx.fillStyle = "#1a0a18"; ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + o.w, GY); ctx.lineTo(x + o.w - 8, GY + 22); ctx.lineTo(x + 8, GY + 22); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(x - 3, GY - 2, 3, 2); ctx.fillRect(x + o.w, GY - 2, 3, 2);
    }
    // checkpoint posts
    for (let k = 0; k < 3; k++) {
      const wx = (Math.floor(dist / SEG) + k) * SEG, x = sx(wx);
      if (x < -20 || x > W + 20 || wx <= 0) continue;
      ctx.fillStyle = "#e8e8f0"; ctx.fillRect(x - 1, GY - 40, 3, 40);
      ctx.fillStyle = "#ff4a5a"; ctx.fillRect(x + 2, GY - 40, 20, 14);
      ctx.fillStyle = "#fff"; ctx.font = "900 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(LETTERS[Math.floor(wx / SEG) % 26], x + 12, GY - 29);
    }
  }
  function drawObstacles() {
    for (const o of obstacles) {
      const x = sx(o.x);
      if (x < -30 || x > W + 30 || o.kind === "crater") continue;
      if (o.kind === "rock") {
        const r = o.big ? 14 : 9, hurt = o.big && o.hp === 1;
        ctx.fillStyle = hurt ? "#7a6a5a" : "#9a8a78"; ctx.beginPath(); ctx.ellipse(x, GY - r * 0.75, r, r * (o.big ? 1.05 : 0.9), 0, Math.PI, 0); ctx.lineTo(x + r, GY); ctx.lineTo(x - r, GY); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.arc(x - r * 0.3, GY - r * 1.1, r * 0.3, 0, Math.PI * 2); ctx.fill();
        if (hurt) { ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 4, GY - 20); ctx.lineTo(x + 2, GY - 10); ctx.lineTo(x - 2, GY - 4); ctx.stroke(); }
      } else if (o.kind === "mine") {
        ctx.fillStyle = "#5a5a6a"; ctx.fillRect(x - 9, GY - 4, 18, 4);
        ctx.fillStyle = Math.floor(clock * 6) % 2 ? "#ff4a5a" : "#8a2a2a"; ctx.fillRect(x - 2, GY - 7, 4, 3);
      } else if (o.kind === "tank") {
        ctx.fillStyle = "#3a6a2a"; ctx.fillRect(x - 16, GY - 10, 32, 10);
        ctx.fillStyle = "#4a8a3a"; ctx.fillRect(x - 9, GY - 18, 18, 8); ctx.fillRect(x - 24, GY - 15, 16, 3);
        ctx.fillStyle = "#1a1a1a"; for (let i = -12; i <= 12; i += 8) { ctx.beginPath(); ctx.arc(x + i, GY - 2, 3, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    for (const s of shells) { const x = sx(s.x); ctx.fillStyle = "#ffb03a"; ctx.fillRect(x - 5, s.y - 2, 10, 4); ctx.fillStyle = "#fff"; ctx.fillRect(x - 5, s.y - 1, 3, 2); }
  }
  function drawBuggy() {
    const b = buggy;
    if (b.dead || (b.inv > 0 && Math.floor(clock * 12) % 2)) return;
    const x = BX(), y = GY + b.y;
    const wob = (k) => (b.air ? 0 : Math.sin(b.bob + k * 2.1) * 1.2);
    ctx.save(); ctx.translate(x, y);
    if (b.air) ctx.rotate(Math.max(-0.2, Math.min(0.2, b.vy * 0.0005)));
    // body
    ctx.fillStyle = "#c86aff"; ctx.beginPath(); ctx.moveTo(-24, -12); ctx.lineTo(22, -12); ctx.lineTo(26, -18); ctx.lineTo(10, -20); ctx.lineTo(4, -26); ctx.lineTo(-12, -26); ctx.lineTo(-18, -20); ctx.lineTo(-26, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8ae0ff"; ctx.beginPath(); ctx.moveTo(-10, -24); ctx.lineTo(3, -24); ctx.lineTo(7, -19); ctx.lineTo(-14, -19); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5a1a8a"; ctx.fillRect(-24, -14, 48, 3);
    // the two guns: forward and up
    ctx.fillStyle = "#e8e8f0"; ctx.fillRect(22, -17, 8, 3); ctx.fillRect(-5, -34, 3, 9);
    ctx.fillStyle = "#ffd34d"; ctx.fillRect(-16, -32, 1.5, 8); ctx.beginPath(); ctx.arc(-15.3, -33, 2, 0, Math.PI * 2); ctx.fill();
    // wheels on springy legs
    for (const [k, wx] of [[0, -18], [1, -2], [2, 16]]) {
      const wy = -6 + wob(k);
      ctx.strokeStyle = "#8a8a9a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, -12); ctx.lineTo(wx, wy); ctx.stroke();
      ctx.fillStyle = "#2a2a3a"; ctx.beginPath(); ctx.arc(wx, wy, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#9a9aaa"; ctx.beginPath(); ctx.arc(wx, wy, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#5a5a6a"; ctx.lineWidth = 1; ctx.beginPath(); const a = b.bob * 1.5; ctx.moveTo(wx + Math.cos(a) * 5, wy + Math.sin(a) * 5); ctx.lineTo(wx - Math.cos(a) * 5, wy - Math.sin(a) * 5); ctx.stroke();
    }
    ctx.restore();
  }
  function drawUfo(u) {
    const x = sx(u.x), y = u.y;
    if (u.kind === "saucer") {
      ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.ellipse(x, y, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#8ae0ff"; ctx.beginPath(); ctx.ellipse(x, y - 4, 7, 5, 0, Math.PI, 0); ctx.fill();
      for (let i = -1; i <= 1; i++) { ctx.fillStyle = Math.floor(clock * 8 + i) % 2 ? "#ff4a5a" : "#ffd34d"; ctx.fillRect(x + i * 8 - 1, y - 1, 2, 2); }
    } else {
      ctx.fillStyle = "#ff6a3a"; ctx.beginPath(); ctx.moveTo(x - 18, y); ctx.lineTo(x, y - 8); ctx.lineTo(x + 18, y); ctx.lineTo(x, y + 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.arc(x, y - 1, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,90,58,0.4)"; ctx.fillRect(x - 12, y + 4, 24, 2);
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!buggy) { ctx.fillStyle = "#0a0618"; ctx.fillRect(0, 0, W, H); return; }
    drawBackground();
    drawGround();
    drawObstacles();
    for (const u of ufos) drawUfo(u);
    for (const bb of bombs) {
      // bombs leave a short trail so they are easy to spot
      const x = sx(bb.x);
      ctx.fillStyle = bb.crater ? "rgba(255,106,58,0.35)" : "rgba(255,255,255,0.3)"; ctx.fillRect(x - 1, bb.y - 12, 2, 10);
      ctx.fillStyle = bb.crater ? "#ff6a3a" : "#fff"; ctx.beginPath(); ctx.arc(x, bb.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ffd34d";
    for (const s of shotsF) ctx.fillRect(sx(s.x) - 5, s.y - 1, 10, 3);
    for (const s of shotsU) ctx.fillRect(sx(s.x) - 1, s.y - 5, 3, 10);
    if (state !== "menu") drawBuggy();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 20px system-ui, sans-serif" : "900 12px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar, with the course from the current point to the next
    ctx.fillStyle = "#0a0618"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f4f0ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 13);
    ctx.font = "700 10px system-ui, sans-serif"; ctx.fillStyle = "#a89cc8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 78, 13);
    const idx = Math.floor(checkpoint / SEG), prog = Math.min(1, (dist - checkpoint) / SEG);
    const bx0 = 180, bw = 130;
    ctx.fillStyle = "#2a1a4a"; ctx.fillRect(bx0, 9, bw, 8);
    ctx.fillStyle = "#c86aff"; ctx.fillRect(bx0, 9, bw * prog, 8);
    ctx.fillStyle = "#fff"; ctx.font = "900 11px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.fillText(LETTERS[idx % 26], bx0 - 4, 13);
    ctx.textAlign = "left"; ctx.fillText(LETTERS[(idx + 1) % 26], bx0 + bw + 4, 13);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffd34d"; ctx.font = "800 11px system-ui, sans-serif";
    ctx.fillText(`FASE ${stage + 1}`, W - 8, 13);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) { ctx.fillStyle = "#c86aff"; ctx.fillRect(W - 110 + i * 11, 9, 8, 5); ctx.fillStyle = "#2a2a3a"; ctx.fillRect(W - 110 + i * 11, 14, 2, 3); ctx.fillRect(W - 104 + i * 11, 14, 2, 3); }
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 24px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = "#000";
      ctx.strokeText(message.text, W / 2, 110); ctx.fillStyle = "#ffd34d"; ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.strokeText(message.sub, W / 2, 132); ctx.fillStyle = "#f4f0ff"; ctx.fillText(message.sub, W / 2, 132); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  startStage(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="pattuglia-best-" data-kind="score"></script>

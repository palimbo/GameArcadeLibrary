<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vortice</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f0f4ff;
    --muted: #8a94c0;
    --claw: #ffe03a;
    --tube: #3a6aff;
    --red: #ff3a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a2050, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(240, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(58, 106, 255, 0.8); background: rgba(58, 106, 255, 0.12);
  }
  #touch button[data-a="fire"] { width: 88px; height: 88px; border-color: rgba(255, 224, 58, 0.9); background: rgba(255, 224, 58, 0.14); font: 800 14px system-ui, sans-serif; letter-spacing: 1px; }
  #touch button[data-a="zap"] { width: 60px; height: 60px; border-color: rgba(255, 58, 74, 0.9); background: rgba(255, 58, 74, 0.14); font: 800 12px system-ui, sans-serif; }
  #touch.small button { width: 56px; height: 56px; font-size: 20px; }
  #touch.small button[data-a="fire"] { width: 70px; height: 70px; font-size: 12px; }
  #touch.small button[data-a="zap"] { width: 50px; height: 50px; font-size: 10px; }
  #touch button.on { background: rgba(240, 244, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(0, 0, 0, 0.86);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(40px, 12vw, 72px); font-weight: 900; letter-spacing: 6px; color: transparent; -webkit-text-stroke: 2px var(--tube); text-shadow: 0 0 18px rgba(58,106,255,0.8); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(240,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--claw); color: #1a1400; background: var(--claw); padding: 11px 30px; box-shadow: 0 0 18px rgba(255,224,58,0.5); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 34px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-a="left" aria-label="Ruota a sinistra">⟲</button>
    <button type="button" data-a="right" aria-label="Ruota a destra">⟳</button>
  </div>
  <div class="cl">
    <button type="button" data-a="zap" aria-label="Superzapper">ZAP</button>
    <button type="button" data-a="fire" aria-label="Fuoco">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 520, TOP = 30, NL = 16;
  // the tubes: polygons (closed) or polylines (open), resampled into 16 lanes.
  // vp = vanishing point, k = size of the far end
  const SHAPES = [
    { name: "CERCHIO", color: "#3a6aff", closed: true, vp: [240, 285], k: 0.12, poly: circle(240, 285, 205, 16) },
    { name: "QUADRATO", color: "#ff3a4a", closed: true, vp: [240, 285], k: 0.14, poly: [[50, 95], [430, 95], [430, 475], [50, 475]] },
    { name: "CROCE", color: "#3aff8a", closed: true, vp: [240, 285], k: 0.12, poly: [[175, 85], [305, 85], [305, 220], [440, 220], [440, 350], [305, 350], [305, 485], [175, 485], [175, 350], [40, 350], [40, 220], [175, 220]] },
    { name: "V", color: "#ffe03a", closed: false, vp: [240, 200], k: 0.1, poly: [[30, 120], [240, 490], [450, 120]] },
    { name: "STELLA", color: "#ff5aff", closed: true, vp: [240, 290], k: 0.12, poly: star(240, 290, 215, 110, 5) },
    { name: "PIANURA", color: "#5affff", closed: false, vp: [240, 150], k: 0.1, poly: [[20, 470], [120, 450], [240, 445], [360, 450], [460, 470]] },
    { name: "TRIANGOLO", color: "#ff9a3a", closed: true, vp: [240, 320], k: 0.13, poly: [[240, 70], [455, 470], [25, 470]] },
    { name: "ONDA", color: "#9a7aff", closed: false, vp: [240, 170], k: 0.1, poly: [[20, 420], [80, 480], [140, 420], [200, 480], [280, 480], [340, 420], [400, 480], [460, 420]] },
  ];
  function circle(cx, cy, r, n) { return Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }); }
  function star(cx, cy, r1, r2, n) { return Array.from({ length: n * 2 }, (_, i) => { const a = -Math.PI / 2 + (i / (n * 2)) * Math.PI * 2, r = i % 2 ? r2 : r1; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }); }
  // evenly spaced points along the outline
  function resample(poly, closed, n) {
    const pts = closed ? [...poly, poly[0]] : poly;
    const seg = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); total += l; }
    const count = closed ? n : n + 1, out = [];
    for (let k = 0; k < count; k++) {
      let d = (k / n) * total, i = 0;
      while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const t = Math.min(1, d / seg[i]);
      out.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]);
    }
    return out;
  }
  for (const s of SHAPES) {
    s.outer = resample(s.poly, s.closed, NL);
    s.inner = s.outer.map(([x, y]) => [s.vp[0] + (x - s.vp[0]) * s.k, s.vp[1] + (y - s.vp[1]) * s.k]);
  }

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici lenti, pochi colpi nemici", lives: 5, speed: 0.72, fire: 0.45 },
    normale:   { label: "NORMALE",   color: "#ffe03a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, fire: 1 },
    difficile: { label: "DIFFICILE", color: "#ff3a4a", desc: "3 vite · nemici rapidi e aggressivi", lives: 3, speed: 1.25, fire: 1.5 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "vortice-difficulty";
  const bestKey = (id) => `vortice-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(120px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 120;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 240) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1400, 0.06, "square", 0.02, -900)),
    move: lim(() => beep(180, 0.02, "triangle", 0.02)),
    boom: lim(() => { noise(0.25, 0.25, 1800); beep(300, 0.2, "sawtooth", 0.03, -200); }),
    split: lim(() => beep(600, 0.15, "square", 0.03, 400)),
    spike: lim(() => beep(2000, 0.03, "square", 0.015)),
    eshot: lim(() => beep(700, 0.08, "triangle", 0.02, 300)),
    zap: () => { noise(0.8, 0.3, 4000); arp([200, 400, 800, 1600], 0.05, 0.2, "sawtooth", 0.04); },
    die: () => { noise(0.8, 0.35, 900); arp([784, 622, 523, 392, 311, 262], 0.1, 0.14, "sawtooth", 0.035); },
    warp: () => { beep(80, 2.2, "sawtooth", 0.035, 1600); },
    clear: () => arp([523, 659, 784, 1047, 1319], 0.08, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    grab: () => arp([200, 180, 160, 140], 0.06, 0.1, "sawtooth", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 20000;
  let player = null, bullets = [], enemies = [], eshots = [], spikes = [], queue = [], spawnT = 0, zapper = 1, zapFlash = 0;
  let parts = [], popups = [], message = null, levelT = 0, moveT = 0, fireT = 0, stars = [];
  const ctl = { left: false, right: false, fire: false, zap: false };
  let zapPressed = false;

  const S = () => SHAPES[level % SHAPES.length];
  const lane = (i) => { const s = S(); return s.closed ? ((i % NL) + NL) % NL : Math.max(0, Math.min(NL - 1, i)); };
  const persp = (z) => Math.max(0, z) ** 1.7;
  // a point on the tube: lane i, depth z (0 = far end, 1 = rim), across the lane 0..1
  function pt(i, z, a = 0.5) {
    const s = S(), n = s.outer.length, i0 = lane(i), i1 = s.closed ? (i0 + 1) % n : i0 + 1, f = persp(z);
    const ax = s.inner[i0][0] + (s.outer[i0][0] - s.inner[i0][0]) * f, ay = s.inner[i0][1] + (s.outer[i0][1] - s.inner[i0][1]) * f;
    const bx = s.inner[i1][0] + (s.outer[i1][0] - s.inner[i1][0]) * f, by = s.inner[i1][1] + (s.outer[i1][1] - s.inner[i1][1]) * f;
    return [ax + (bx - ax) * a, ay + (by - ay) * a];
  }
  function laneDist(a, b) {
    const d = b - a;
    if (!S().closed) return d;
    return ((d % NL) + NL + NL / 2) % NL - NL / 2;
  }

  function buildLevel() {
    player = { lane: 0, z: 1, dead: false, drop: 0 };
    bullets = []; enemies = []; eshots = [];
    spikes = new Array(NL).fill(0);
    const n = 10 + level * 2;
    queue = [];
    for (let k = 0; k < n; k++) {
      const r = Math.random();
      queue.push(level >= 1 && r < 0.22 ? "tanker" : level >= 2 && r < 0.4 ? "spiker" : "flipper");
    }
    spawnT = 1; zapper = 1; levelT = 0;
    message = { text: `LIVELLO ${level + 1}`, sub: S().name, t: 0 };
    state = "intro"; stateT = 1.5;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "warp"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f0f4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 40000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffe03a", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 14, sp = 140) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.5, c: color });
    }
  }
  function killPlayer(why) {
    if ((state !== "play" && state !== "warp") || player.dead) return;
    lives--; player.dead = true; player.why = why;
    const [x, y] = pt(player.lane, Math.max(0.05, player.z));
    burst(x, y, "#ffe03a", 30, 220);
    sfx.die();
    message = { text: why, t: 0 };
    player.wasWarp = state === "warp";
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the enemies in the tube go back to the waiting line
    for (const e of enemies) if (e.kind !== "spiker") queue.push(e.kind);
    enemies = []; eshots = []; bullets = [];
    player = { lane: player.lane, z: 1, dead: false };
    spawnT = 1.5;
    state = player && queue.length === 0 ? "warp" : "play";
    if (state === "warp") { player.z = 1; sfx.warp(); }
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--claw)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>VORTICE</h1>
       <p>La tua navicella a forma di artiglio gira sul bordo di un tunnel al neon. Dal fondo salgono i nemici: sparagli lungo le corsie prima che arrivino in cima e ti afferrino! Quando il tunnel è vuoto ti tuffi nel successivo: attento alle punte verdi lasciate dagli Spinosi.</p>
       <div class="pts">
         <span><b>Farfalla</b> (rossa)</span><span>150 · in cima ti insegue lungo il bordo</span>
         <span><b>Cisterna</b> (viola)</span><span>100 · colpita si divide in due farfalle</span>
         <span><b>Spinoso</b> (verde)</span><span>50 · lascia punte nella sua corsia</span>
         <span><b>Superzapper</b></span><span>uno per livello: distrugge tutto</span>
       </div>
       ${touchMode
         ? `<p class="muted help">⟲ ⟳ per girare sul bordo · FUOCO (tieni premuto) · ZAP per il superzapper</p>`
         : `<p class="muted help">← → per girare sul bordo · SPAZIO o Z per sparare (tieni premuto) · X o ↓ superzapper · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "fire", z: "fire", arrowup: "fire", w: "fire", x: "zap", arrowdown: "zap", s: "zap" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    if ((a === "left" || a === "right") && !ctl[a]) moveT = 0;
    ctl[a] = true;
    if (a === "zap" && !e.repeat) zapPressed = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      if (a === "zap") zapPressed = true;
      if (a === "left" || a === "right") moveT = 0;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Player ----------
  function updatePlayer(dt) {
    const p = player;
    moveT -= dt;
    const dir = (ctl.right ? 1 : 0) - (ctl.left ? 1 : 0);
    if (dir && moveT <= 0) {
      const to = p.lane + dir;
      if (S().closed || (to >= 0 && to < NL)) { p.lane = lane(to); sfx.move(); }
      moveT = 0.085;
    }
    fireT -= dt;
    if (ctl.fire && fireT <= 0 && bullets.length < 6) {
      bullets.push({ lane: p.lane, z: p.z });
      fireT = 0.14; sfx.shot();
    }
    if (zapPressed) {
      zapPressed = false;
      if (zapper > 0 && state === "play") {
        zapper--; zapFlash = 0.6; sfx.zap();
        for (const e of enemies) { const [x, y] = pt(e.lane, e.z); burst(x, y, "#ffffff", 8, 120); addScore(50); }
        enemies = []; eshots = [];
      }
    }
  }

  // ---------- Enemies ----------
  function spawn(kind) {
    const s = { flipper: 0.2, tanker: 0.15, spiker: 0.24 }[kind] * diff.speed * (1 + Math.min(1.2, level * 0.1));
    enemies.push({ kind, lane: Math.floor(Math.random() * NL), z: 0, speed: s, flip: null, flipT: rnd(1, 2.5), fireT: rnd(1.5, 4), top: rnd(0.35, 0.75), back: false });
  }
  function startFlip(e, dir) {
    const to = e.lane + dir;
    if (!S().closed && (to < 0 || to >= NL)) return false;
    e.flip = { from: e.lane, to: lane(to), dir, t: 0 };
    return true;
  }
  function updateEnemies(dt) {
    const p = player;
    spawnT -= dt;
    if (queue.length && spawnT <= 0) { spawn(queue.shift()); spawnT = rnd(0.5, 1.3) / Math.min(2.5, 1 + level * 0.1); }
    for (const e of enemies) {
      if (e.flip) {
        e.flip.t += dt / 0.22;
        if (e.flip.t >= 1) { e.lane = e.flip.to; e.flip = null; }
      }
      if (e.kind === "spiker") {
        // climbs, lays a spike in its lane, then goes back down and leaves
        if (!e.back) { e.z += e.speed * dt; spikes[e.lane] = Math.max(spikes[e.lane], e.z); if (e.z >= e.top) e.back = true; }
        else { e.z -= e.speed * dt; if (e.z <= 0) e.gone = true; }
        continue;
      }
      if (e.z < 1) {
        e.z = Math.min(1, e.z + e.speed * dt);
        if (e.kind === "flipper") {
          e.flipT -= dt;
          if (e.flipT <= 0 && !e.flip) { startFlip(e, Math.random() < 0.5 ? -1 : 1); e.flipT = rnd(1, 2.6); }
        }
        e.fireT -= dt * diff.fire;
        if (e.fireT <= 0 && e.z > 0.15 && e.z < 0.85) { e.fireT = rnd(1.8, 4) / Math.min(2.5, 1 + level * 0.1); eshots.push({ lane: e.lane, z: e.z }); sfx.eshot(); }
        if (e.z >= 1 && e.kind === "tanker") {
          // a tanker that reaches the rim bursts into two flippers
          e.gone = true; sfx.split();
          for (const d of [-1, 1]) { const f = { kind: "flipper", lane: lane(e.lane + d), z: 1, speed: 0.16, flip: null, flipT: 0.3, fireT: 9, top: 0 }; enemies.push(f); }
        }
      } else if (e.kind === "flipper") {
        // on the rim: flips lane by lane towards the claw
        if (!e.flip) {
          e.flipT -= dt;
          const d = laneDist(e.lane, p.lane);
          if (d === 0 && state === "play") { sfx.grab(); killPlayer("AFFERRATO!"); return; }
          if (e.flipT <= 0) { startFlip(e, Math.sign(d) || 1); e.flipT = 0.32 / diff.speed / (1 + Math.min(0.6, level * 0.05)); }
        }
      }
    }
    enemies = enemies.filter((e) => !e.gone);
    for (const s of eshots) {
      s.z += 0.55 * diff.speed * dt;
      if (s.z >= 1) { s.gone = true; if (s.lane === p.lane) killPlayer("COLPITO!"); }
    }
    eshots = eshots.filter((s) => !s.gone);
  }
  function hitEnemy(e) {
    const [x, y] = pt(e.flip ? e.flip.to : e.lane, e.z);
    const pts = { flipper: 150, tanker: 100, spiker: 50 }[e.kind];
    addScore(pts, x, y - 10, { flipper: "#ff5a6a", tanker: "#c88aff", spiker: "#5aff8a" }[e.kind]);
    burst(x, y, { flipper: "#ff3a4a", tanker: "#b85aff", spiker: "#3aff8a" }[e.kind], 14, 150);
    sfx.boom();
    e.gone = true;
    if (e.kind === "tanker") {
      sfx.split();
      for (const d of [-1, 1]) {
        const l = e.lane + d;
        if (!S().closed && (l < 0 || l >= NL)) continue;
        enemies.push({ kind: "flipper", lane: lane(l), z: e.z, speed: 0.2 * diff.speed * (1 + Math.min(1.2, level * 0.1)), flip: null, flipT: rnd(0.6, 1.5), fireT: rnd(2, 4), top: 0 });
      }
    }
  }
  function updateBullets(dt) {
    for (const b of bullets) {
      const z0 = b.z;
      b.z -= 2.3 * dt;
      // enemies in the same lane
      for (const e of enemies) {
        if (e.gone) continue;
        const el = e.flip ? (e.flip.t < 0.5 ? e.flip.from : e.flip.to) : e.lane;
        if (el !== b.lane) continue;
        if (e.z <= z0 + 0.04 && e.z >= b.z - 0.04) { b.gone = true; hitEnemy(e); break; }
      }
      if (b.gone) continue;
      for (const s of eshots) if (!s.gone && s.lane === b.lane && s.z <= z0 + 0.04 && s.z >= b.z - 0.04) { s.gone = true; b.gone = true; addScore(10); break; }
      if (b.gone) continue;
      // chipping away the spikes
      if (spikes[b.lane] > 0 && b.z <= spikes[b.lane]) {
        spikes[b.lane] = Math.max(0, spikes[b.lane] - 0.07); b.gone = true; addScore(3); sfx.spike();
        const [x, y] = pt(b.lane, spikes[b.lane] + 0.03); burst(x, y, "#3aff8a", 4, 60);
      }
      if (b.z <= 0) b.gone = true;
    }
    bullets = bullets.filter((b) => !b.gone);
    enemies = enemies.filter((e) => !e.gone);
    eshots = eshots.filter((s) => !s.gone);
  }

  function update(dt) {
    clock += dt;
    sfxN = 0;
    zapFlash = Math.max(0, zapFlash - dt);
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.9));
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) afterDeath(); return; }
    if (state === "warp") {
      // diving down the tube: spikes are deadly now
      updatePlayer(dt);
      updateBullets(dt);
      player.z -= dt * 0.55;
      if (spikes[player.lane] > 0 && player.z <= spikes[player.lane] + 0.02) { killPlayer("INFILZATO DA UNA PUNTA!"); return; }
      if (player.z <= -0.15) {
        addScore(500 * (level + 1));
        sfx.clear();
        level++; buildLevel();
      }
      return;
    }
    levelT += dt;
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    if (state === "play" && !queue.length && !enemies.length) {
      state = "warp"; eshots = []; sfx.warp();
      message = { text: "TUFFO!", sub: `Bonus ${(500 * (level + 1)).toLocaleString("it-IT")} · evita le punte verdi`, t: 0 };
    }
  }

  // ---------- Drawing ----------
  function line(pts, color, width = 1.5, close = false) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    if (close) ctx.closePath();
    ctx.stroke();
  }
  function drawTube() {
    const s = S(), n = s.outer.length;
    ctx.save();
    ctx.shadowColor = s.color; ctx.shadowBlur = 8;
    const col = zapFlash > 0 ? "#ffffff" : s.color;
    line(s.outer, col, 2, s.closed);
    line(s.inner, col, 1, s.closed);
    for (let i = 0; i < n; i++) line([s.inner[i], s.outer[i]], col, 1);
    // the player's lane glows
    if (player && !player.dead) {
      const i0 = player.lane, i1 = s.closed ? (i0 + 1) % n : i0 + 1;
      ctx.fillStyle = "rgba(255,224,58,0.07)";
      ctx.beginPath(); ctx.moveTo(...s.inner[i0]); ctx.lineTo(...s.outer[i0]); ctx.lineTo(...s.outer[i1]); ctx.lineTo(...s.inner[i1]); ctx.closePath(); ctx.fill();
      line([s.inner[i0], s.outer[i0]], "#ffe03a", 1.5); line([s.inner[i1], s.outer[i1]], "#ffe03a", 1.5);
    }
    ctx.restore();
  }
  function drawEnemy(e) {
    let l = e.lane, a = 0.5;
    if (e.flip) { l = e.flip.from; a = 0.5 + e.flip.dir * e.flip.t; if (!S().closed) l = e.flip.from; }
    const z = Math.max(0.02, e.z);
    const A = pt(l, z, a - 0.5), B = pt(l, z, a + 0.5), C = pt(l, z, a);
    const w = Math.hypot(B[0] - A[0], B[1] - A[1]);
    ctx.save();
    if (e.kind === "flipper") {
      ctx.shadowColor = "#ff3a4a"; ctx.shadowBlur = 6;
      const up = [(-(B[1] - A[1])) * 0.25, (B[0] - A[0]) * 0.25];
      line([A, [C[0] + up[0], C[1] + up[1]], B, [C[0] - up[0], C[1] - up[1]]], "#ff3a4a", 2, true);
      line([[(A[0] + C[0]) / 2 + up[0] * 0.5, (A[1] + C[1]) / 2 + up[1] * 0.5], [(B[0] + C[0]) / 2 - up[0] * 0.5, (B[1] + C[1]) / 2 - up[1] * 0.5]], "#ff9aa2", 1);
    } else if (e.kind === "tanker") {
      ctx.shadowColor = "#b85aff"; ctx.shadowBlur = 6;
      const r = w * 0.35, ang = Math.atan2(B[1] - A[1], B[0] - A[0]);
      const dia = [0, 1, 2, 3].map((k) => [C[0] + Math.cos(ang + k * Math.PI / 2) * r, C[1] + Math.sin(ang + k * Math.PI / 2) * r]);
      line(dia, "#b85aff", 2, true);
      line([dia[0], dia[2]], "#e8c8ff", 1); line([dia[1], dia[3]], "#e8c8ff", 1);
    } else {
      ctx.shadowColor = "#3aff8a"; ctx.shadowBlur = 6;
      const r = w * 0.35, pts = [];
      for (let k = 0; k < 14; k++) { const ang = k * 0.9 + clock * 6, rr = r * (k / 14); pts.push([C[0] + Math.cos(ang) * rr, C[1] + Math.sin(ang) * rr]); }
      line(pts, "#3aff8a", 1.5);
    }
    ctx.restore();
  }
  function drawClaw() {
    const p = player;
    if (p.dead) return;
    const z = Math.max(-0.1, p.z);
    const A = pt(p.lane, Math.max(0.01, z), 0), B = pt(p.lane, Math.max(0.01, z), 1);
    const C = pt(p.lane, Math.max(0.01, z), 0.5), Cin = pt(p.lane, Math.max(0.01, z) - 0.08, 0.5);
    // the claw's point sticks out a fixed distance, whatever the shape of the tube
    const dl = Math.hypot(C[0] - Cin[0], C[1] - Cin[1]) || 1, O = [C[0] + (C[0] - Cin[0]) / dl * 16, C[1] + (C[1] - Cin[1]) / dl * 16];
    const mid1 = [(A[0] * 2 + O[0]) / 3, (A[1] * 2 + O[1]) / 3], mid2 = [(B[0] * 2 + O[0]) / 3, (B[1] * 2 + O[1]) / 3];
    ctx.save(); ctx.shadowColor = "#ffe03a"; ctx.shadowBlur = 10;
    line([A, mid1, O, mid2, B, C, A], "#ffe03a", 2.2);
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = zapFlash > 0 ? `rgba(255,255,255,${zapFlash * 0.3})` : "#000"; ctx.fillRect(0, 0, W, H);
    if (zapFlash > 0) { ctx.fillStyle = "#000"; ctx.globalAlpha = 1 - zapFlash * 0.3; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    for (const s of stars) {
      // stars stream out of the tube, faster while diving
      const sp = state === "warp" ? 4 : 0.35;
      s.d += s.v * sp * 0.016; if (s.d > 1) { s.d = 0.02; s.a = Math.random() * Math.PI * 2; }
      const vp = S().vp, r = s.d * s.d * 420;
      ctx.fillStyle = `rgba(200,210,255,${Math.min(1, s.d * 1.5)})`;
      ctx.fillRect(vp[0] + Math.cos(s.a) * r, vp[1] + Math.sin(s.a) * r, 1.5, 1.5);
    }
    if (!player) return;
    drawTube();
    // spikes
    ctx.save(); ctx.shadowColor = "#3aff8a"; ctx.shadowBlur = 6;
    spikes.forEach((s, i) => { if (s > 0) { line([pt(i, 0), pt(i, s)], "#3aff8a", 2); const tip = pt(i, s); ctx.fillStyle = "#c8ffd8"; ctx.fillRect(tip[0] - 1.5, tip[1] - 1.5, 3, 3); } });
    ctx.restore();
    for (const e of enemies) drawEnemy(e);
    for (const s of eshots) {
      const [x, y] = pt(s.lane, s.z), r = 2 + persp(s.z) * 4;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    }
    for (const b of bullets) {
      const [x, y] = pt(b.lane, Math.max(0, b.z)), r = 1.5 + persp(b.z) * 3;
      ctx.fillStyle = "#ffe03a"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    if (state !== "menu") drawClaw();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 22px system-ui, sans-serif" : "800 12px system-ui, sans-serif";
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 15px system-ui, sans-serif"; ctx.fillStyle = "#f0f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), 10, 15);
    ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#8a94c0";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 96, 15);
    ctx.textAlign = "center"; ctx.font = "800 11px system-ui, sans-serif";
    ctx.fillStyle = zapper ? "#ff3a4a" : "#4a4a5a"; ctx.fillText(zapper ? "ZAP ●" : "ZAP ○", 236, 15);
    ctx.fillStyle = "#8a94c0"; ctx.fillText(`NEMICI ${queue.length + enemies.length}`, 306, 15);
    ctx.textAlign = "right"; ctx.fillStyle = S().color;
    ctx.fillText(`LIVELLO ${level + 1}`, W - 10, 15);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) {
      const x = 16 + i * 16, y = H - 22;
      ctx.strokeStyle = "#ffe03a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 6, y + 10); ctx.lineTo(x, y); ctx.lineTo(x + 6, y + 10); ctx.lineTo(x, y + 6); ctx.closePath(); ctx.stroke();
    }
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 28px system-ui, sans-serif"; ctx.fillStyle = S().color;
      ctx.shadowColor = S().color; ctx.shadowBlur = 12;
      ctx.fillText(message.text, W / 2, 80);
      ctx.shadowBlur = 0;
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#f0f4ff"; ctx.fillText(message.sub, W / 2, 102); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  stars = Array.from({ length: 70 }, () => ({ a: Math.random() * Math.PI * 2, d: Math.random(), v: 0.2 + Math.random() * 0.5 }));
  syncControls();
  buildLevel(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="vortice-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pennello Svelto</title>
<style>
  :root {
    --bg: #0e1420;
    --fg: #f4f6ee;
    --muted: #a8b4a8;
    --pink: #3ad0c0;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1e2a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run along the lines; SALTA makes every enemy jump, so you can slip past them */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(58, 208, 192, 0.6); background: radial-gradient(circle, rgba(58,208,192,0.14), rgba(58,208,192,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(58, 208, 192, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 20, 32, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #0a3a3a, 0 0 22px rgba(58,208,192,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #04201e; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #1a8a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Salta">SALTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 34;
  const NP = 8, NR = 7, X0 = 44, DX = 78, Y0 = 52, DY = 48;
  const PSPEED = 125, TINTS = ["#ff8ab8", "#7ad0ff", "#8ae07a", "#ffb05a", "#c89aff", "#5ae0d0"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · 5 salti a vita · guardiani lenti", lives: 5, jumps: 5, speed: 0.8, enemies: 0, tracer: 3 },
    normale:   { label: "NORMALE",   color: "#3ad0c0", desc: "3 vite · 3 salti a vita", lives: 3, jumps: 3, speed: 1, enemies: 0, tracer: 2 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · 2 salti a vita · guardiani svelti e numerosi", lives: 3, jumps: 2, speed: 1.15, enemies: 1, tracer: 1 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pennello-difficulty";
  const bestKey = (id) => `pennello-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    paint: lim(() => beep(880 + Math.random() * 120, 0.04, "square", 0.02)),
    box: lim(() => arp([659, 784, 988], 0.05, 0.08, "square", 0.04)),
    jump: lim(() => beep(260, 0.35, "triangle", 0.05, 500)),
    corner: () => arp([523, 659, 784, 1047, 1319], 0.06, 0.12, "square", 0.045),
    eat: lim((n) => arp([784 * (1 + n * 0.15), 1047 * (1 + n * 0.15)], 0.05, 0.1, "square", 0.045)),
    hit: () => { noise(0.4, 0.18, 500); arp([392, 330, 262, 196], 0.1, 0.16, "sawtooth", 0.04); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 10000, jumps = 3, jumpT = 0, scareT = 0, eaten = 0, cornersDone = false;
  let verts = [], nodes = [], edges = [], boxes = [], P = null, enemies = [], parts = [], popups = [], message = null, tint = TINTS[0];
  let jumpPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  let lastKey = null;

  // ---------- The grid ----------
  // Horizontal lines run right across; each band between two lines has its own set of uprights.
  const nid = (r, p) => r * NP + p;
  const nxy = (n) => [X0 + (n % NP) * DX, Y0 + Math.floor(n / NP) * DY];
  function buildGrid(lv) {
    const R = rng(lv * 7919 + 11);
    verts = [];
    for (let r = 0; r < NR - 1; r++) {
      let row;
      for (let t = 0; t < 50; t++) {
        // the first grids have fewer, wider boxes
        row = [0]; for (let p = 1; p < NP - 1; p++) if (R() < (lv <= 2 ? 0.36 : 0.5)) row.push(p); row.push(NP - 1);
        // no box wider than three steps, no two bands alike
        let ok = true; for (let i = 1; i < row.length; i++) if (row[i] - row[i - 1] > 3) ok = false;
        if (r > 0 && row.join() === verts[r - 1].join()) ok = false;
        if (ok && row.length >= 4) break;
      }
      verts.push(row);
    }
    nodes = [];
    for (let r = 0; r < NR; r++) for (let p = 0; p < NP; p++) { const on = (r > 0 && verts[r - 1].includes(p)) || (r < NR - 1 && verts[r].includes(p)); nodes[nid(r, p)] = on ? { id: nid(r, p), r, p, adj: [] } : null; }
    edges = [];
    const link = (a, b, kind) => { const e = { a, b, kind, painted: false }; edges.push(e); const [ax, ay] = nxy(a), [bx, by] = nxy(b); e.len = Math.hypot(bx - ax, by - ay); nodes[a].adj.push({ e, to: b, dx: sign(bx - ax) * (kind === "h"), dy: sign(by - ay) * (kind === "v") }); nodes[b].adj.push({ e, to: a, dx: -sign(bx - ax) * (kind === "h"), dy: -sign(by - ay) * (kind === "v") }); };
    for (let r = 0; r < NR; r++) { let prev = -1; for (let p = 0; p < NP; p++) if (nodes[nid(r, p)]) { if (prev >= 0) link(nid(r, prev), nid(r, p), "h"); prev = p; } }
    for (let r = 0; r < NR - 1; r++) for (const p of verts[r]) link(nid(r, p), nid(r + 1, p), "v");
    boxes = [];
    for (let r = 0; r < NR - 1; r++) for (let i = 0; i + 1 < verts[r].length; i++) {
      const pa = verts[r][i], pb = verts[r][i + 1];
      const sides = edges.filter((e) => (e.kind === "h" && (nodes[e.a].r === r || nodes[e.a].r === r + 1) && Math.min(nodes[e.a].p, nodes[e.b].p) >= pa && Math.max(nodes[e.a].p, nodes[e.b].p) <= pb) || (e.kind === "v" && nodes[e.a].r === r && (nodes[e.a].p === pa || nodes[e.a].p === pb)));
      boxes.push({ r, pa, pb, sides, filled: false, corner: (r === 0 || r === NR - 2) && (i === 0 || i + 2 === verts[r].length) });
    }
  }
  const findAdj = (n, dx, dy) => nodes[n].adj.find((a) => a.dx === dx && a.dy === dy);
  // a thing on the grid: at node `from`, heading to `to`, `s` pixels along
  function posOf(m) { const [ax, ay] = nxy(m.from); if (m.to === null) return [ax, ay]; const [bx, by] = nxy(m.to), k = m.s / m.e.len; return [ax + (bx - ax) * k, ay + (by - ay) * k]; }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 25000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildGrid(level); tint = TINTS[(level - 1) % TINTS.length];
    cornersDone = false;
    placeActors();
    message = { text: `LIVELLO ${level}`, sub: "dipingi i lati di ogni riquadro!", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function placeActors() {
    P = { from: nid(NR - 1, 3), to: null, e: null, s: 0, full: false, face: 1, safe: 2 };
    if (!nodes[P.from]) P.from = nid(NR - 1, 0);
    // every new life brings a full set of jumps
    jumps = diff.jumps; jumpT = 0; scareT = 0; eaten = 0;
    // the rim guard joins in from a later level on the easier settings
    const zig = clamp(1 + Math.floor(level / 2) + diff.enemies, 1, 6);
    enemies = level >= diff.tracer ? [{ kind: "tracer", from: nid(0, 0), to: null, e: null, s: 0, last: null, wait: rnd(4, 6) }] : [];
    const tops = [...Array(NP).keys()].filter((p) => nodes[nid(0, p)] && p > 0);
    for (let i = 0; i < zig; i++) enemies.push({ kind: "amidar", from: nid(0, tops[(i * 2 + 1) % tops.length]), to: null, e: null, s: 0, h: Math.random() < 0.5 ? 1 : -1, v: 1, cameV: true, wait: rnd(0.4, 1) + i * rnd(0.7, 1.4) });
  }
  const enemySpeed = (e) => 50 * diff.speed * Math.min(1.6, 1 + (level - 1) * 0.07) * (scareT > 0 ? 0.7 : 1);
  function addScore(n, x, y, color = "#f4f6ee", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 25000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 80, text: "VITA EXTRA!", color: "#ffd23a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function caught() {
    if (state !== "play") return;
    lives--; sfx.hit();
    const [x, y] = posOf(P); burst(x, y, "#ffd23a", 18, 120, 0.8);
    message = { text: "PRESO!", sub: lives > 0 ? "i lati dipinti restano dipinti" : "", t: 0 };
    state = "dead"; stateT = 1.8;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · livello ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PENNELLO SVELTO</h1>
       <p>Corri col tuo rullo lungo le linee della griglia: ogni tratto che percorri resta dipinto, e quando un riquadro ha tutti i lati dipinti si riempie di colore. Riempili tutti per passare di livello, ma occhio ai guardiani che scendono a zig-zag!</p>
       <div class="pts">
         <span><b>Tratto</b></span><span>10 · <b>Riquadro</b> 50 × livello</span>
         <span><b>Salto</b></span><span>per un attimo tutti i guardiani saltano e puoi passare sotto di loro · pochi per ogni vita</span>
         <span><b>Quattro angoli</b></span><span>riempi i riquadri dei quattro angoli: i guardiani scappano e si possono acchiappare (200, 400, 800…)</span>
         <span><b>Vita extra</b></span><span>ogni 25.000 punti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per correre lungo le linee · SALTA quando un guardiano ti è addosso</p>`
         : `<p class="muted help">Frecce o WASD per correre · SPAZIO per saltare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>AL LAVORO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();

      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }

    if (KEYMAP[k]) { keys[KEYMAP[k]] = true; lastKey = KEYMAP[k]; }
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const jumpBtn = touchEl.querySelector(".jump");
  jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); jumpPressed = true; jumpBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove("on"));
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);

  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);
  function wanted() {
    // the stick's stronger axis wins, with the other one kept as a second choice for the next corner
    if (stick.x || stick.y) {
      const a = Math.abs(stick.x) >= Math.abs(stick.y) ? [[sign(stick.x), 0], stick.y ? [0, sign(stick.y)] : null] : [[0, sign(stick.y)], stick.x ? [sign(stick.x), 0] : null];
      return a;
    }
    const held = ["left", "right", "up", "down"].filter((k) => keys[k]);
    if (!held.length) return null;
    const map = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
    const first = held.includes(lastKey) ? lastKey : held[0], second = held.find((k) => k !== first);
    return [map[first], second ? map[second] : null];
  }

  // ---------- Update ----------
  function arrive(m) { m.from = m.to; m.to = null; m.e = null; m.s = 0; }
  function paintEdge(e) {
    if (e.painted) return;
    e.painted = true;
    addScore(10); sfx.paint();
    for (const b of boxes) {
      if (b.filled || !b.sides.includes(e) || !b.sides.every((s) => s.painted)) continue;
      b.filled = true;
      const x = X0 + (b.pa + b.pb) / 2 * DX, y = Y0 + (b.r + 0.5) * DY;
      addScore(50 * level, x, y, "#ffd23a"); sfx.box(); burst(x, y, tint, 16, 120, 0.6);
    }
    if (!cornersDone && boxes.filter((b) => b.corner).every((b) => b.filled)) {
      cornersDone = true; scareT = 7; eaten = 0; sfx.corner();
      message = { text: "QUATTRO ANGOLI!", sub: "acchiappa i guardiani finché lampeggiano!", t: 0 };
    }
  }
  function movePlayer(dt) {
    P.safe = Math.max(0, P.safe - dt);
    const want = wanted();
    let dist = PSPEED * dt;
    for (let guard = 0; guard < 4 && dist > 0; guard++) {
      if (P.to === null) {
        if (!want) return;
        // at a crossing: the wanted way, or the second choice
        let a = findAdj(P.from, want[0][0], want[0][1]) || (want[1] && findAdj(P.from, want[1][0], want[1][1]));
        if (!a && P.lastDir) { const [lx, ly] = P.lastDir; if (want[0][0] * lx + want[0][1] * ly >= 0) a = findAdj(P.from, lx, ly); }
        if (!a) return;
        P.to = a.to; P.e = a.e; P.s = 0; P.full = true; P.lastDir = [a.dx, a.dy]; if (a.dx) P.face = a.dx;
      }
      if (!want) return;
      const [dx, dy] = P.lastDir;
      // turning back halfway (right by a crossing, it gets there first so the edge still gets painted)
      if (want[0][0] === -dx && want[0][1] === -dy && P.e.len - P.s > 8) { const f = P.from; P.from = P.to; P.to = f; P.s = P.e.len - P.s; P.full = false; P.lastDir = [-dx, -dy]; if (dx) P.face = -dx; }
      const step = Math.min(dist, P.e.len - P.s);
      P.s += step; dist -= step;
      if (P.s >= P.e.len - 1e-6) { const e = P.e; if (P.full) paintEdge(e); arrive(P); }
    }
  }
  function moveEnemy(m, dt) {
    if (m.wait > 0) { m.wait -= dt; return; }
    let dist = enemySpeed(m) * dt;
    for (let guard = 0; guard < 4 && dist > 0; guard++) {
      if (m.to === null) {
        const n = nodes[m.from];
        let a = null;
        if (m.kind === "tracer") {
          // round and round the outer edge
          const rim = (o) => (o.dx !== 0 && (n.r === 0 || n.r === NR - 1)) || (o.dy !== 0 && (n.p === 0 || n.p === NP - 1));
          a = n.adj.find((o) => rim(o) && o.to !== m.last) || n.adj.find(rim);
        } else {
          // the zig-zag: along the line until an upright, one step up or down it, then along again
          if (!m.cameV) {
            a = findAdj(m.from, 0, m.v);
            if (!a && (n.r === 0 || n.r === NR - 1)) { m.v = -m.v; a = findAdj(m.from, 0, m.v); }
          }
          if (!a) { a = findAdj(m.from, m.h, 0); if (!a) { m.h = -m.h; a = findAdj(m.from, m.h, 0); } }
          if (!a) a = findAdj(m.from, 0, m.v) || findAdj(m.from, 0, -m.v);
        }
        m.last = m.from; m.to = a.to; m.e = a.e; m.s = 0; m.cameV = a.dy !== 0;
      }
      const step = Math.min(dist, m.e.len - m.s);
      m.s += step; dist -= step;
      if (m.s >= m.e.len - 1e-6) arrive(m);
    }
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (state === "menu") { if (enemies.length) for (const m of enemies) moveEnemy(m, dt); return; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) { if (lives <= 0) gameOver(); else { placeActors(); state = "play"; } } return; }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) { level++; beginLevel(); } return; }
    if (window.__bot) window.__bot(dt);
    if (jumpPressed) { jumpPressed = false; if (jumps > 0 && jumpT <= 0) { jumps--; jumpT = 1.1; sfx.jump(); } }
    jumpT = Math.max(0, jumpT - dt); scareT = Math.max(0, scareT - dt);
    movePlayer(dt);
    for (const m of enemies) moveEnemy(m, dt);
    // meeting a guard
    const [px, py] = posOf(P);
    for (const m of enemies) {
      if (m.wait > 0) continue;
      const [ex, ey] = posOf(m);
      if (Math.hypot(ex - px, ey - py) > 11) continue;
      if (scareT > 0) { const pts = 200 * Math.pow(2, Math.min(eaten, 4)); eaten++; addScore(pts, ex, ey - 12, "#7ad0ff"); sfx.eat(eaten); burst(ex, ey, "#7ad0ff", 14, 110, 0.6); m.from = nid(0, 0); m.to = null; m.e = null; m.s = 0; m.wait = 3; m.h = 1; m.v = 1; m.cameV = true; continue; }
      if (jumpT > 0 || P.safe > 0) continue;
      caught(); return;
    }
    if (boxes.every((b) => b.filled)) {
      const bonus = 500 * level + 200 * jumps;
      addScore(bonus);
      message = { text: "GRIGLIA DIPINTA!", sub: `bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
      sfx.clear(); state = "clear"; stateT = 2.6;
    }
  }

  // ---------- Drawing ----------
  function drawGrid() {
    for (const b of boxes) {
      const x = X0 + b.pa * DX, y = Y0 + b.r * DY, w = (b.pb - b.pa) * DX;
      if (b.filled) { ctx.fillStyle = tint; ctx.globalAlpha = 0.85; ctx.fillRect(x + 3, y + 3, w - 6, DY - 6); ctx.globalAlpha = 1; ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x + 3, y + 3, w - 6, 6); }
      else if (b.corner) { ctx.strokeStyle = "rgba(255,210,58,0.25)"; ctx.lineWidth = 1; ctx.setLineDash([3, 4]); ctx.strokeRect(x + 6, y + 6, w - 12, DY - 12); ctx.setLineDash([]); }
    }
    ctx.lineCap = "round";
    for (const e of edges) {
      const [ax, ay] = nxy(e.a), [bx, by] = nxy(e.b);
      ctx.strokeStyle = e.painted ? "#ffd23a" : "#3a4a6a"; ctx.lineWidth = e.painted ? 6 : 5;

    ctx.lineCap = "butt";
    for (const n of nodes) if (n) { const [x, y] = nxy(n.id); ctx.fillStyle = "#4a5a7a"; ctx.fillRect(x - 2, y - 2, 4, 4); }
  }
  function drawPlayer() {
    if (P.safe > 0 && Math.floor(clock * 10) % 2) return;
    const [x, y] = posOf(P);
    ctx.save(); ctx.translate(x, y); ctx.scale(P.face, 1);
    const b = P.to !== null ? Math.sin(clock * 20) * 1.5 : 0;
    ctx.fillStyle = "#2a8a8a"; ctx.fillRect(-5, -2 + b, 10, 9);
    ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(0, -7 + b, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#f4f6ee"; ctx.beginPath(); ctx.arc(0, -10 + b, 5, Math.PI, 0); ctx.fill(); ctx.fillRect(-6, -10 + b, 12, 2);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(2, -8 + b, 1.5, 1.5);
    ctx.fillStyle = "#8a6a4a"; ctx.fillRect(5, -6 + b, 2, 10); ctx.fillStyle = "#ffd23a"; ctx.fillRect(3, 4 + b, 9, 4);
    ctx.restore();
  }
  function drawEnemy(m) {
    if (m.wait > 0 && state === "play" && scareT <= 0 && m.wait > 0.6) { ctx.globalAlpha = 0.35; }
    const [x, y] = posOf(m), hop = jumpT > 0 ? -Math.sin((1.1 - jumpT) / 1.1 * Math.PI) * 14 : 0;
    const scared = scareT > 0, blink = scared && scareT < 2 && Math.floor(clock * 8) % 2;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, y + 7, 7, 2.5, 0, 0, TAU); ctx.fill();
    const col = scared ? (blink ? "#f4f6ee" : "#4a7aff") : m.kind === "tracer" ? "#ff4a5a" : "#b86aff";
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 3 + hop, 8, Math.PI, 0); ctx.lineTo(x + 8, y + 5 + hop);
    for (let i = 0; i < 4; i++) ctx.lineTo(x + 8 - (i + 0.5) * 4, y + (i % 2 ? 5 : 2) + hop);
    ctx.lineTo(x - 8, y + 5 + hop); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x - 3, y - 4 + hop, 2.5, 0, TAU); ctx.arc(x + 3, y - 4 + hop, 2.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - 3, y - 4 + hop, 1.5, 1.5); ctx.fillRect(x + 3, y - 4 + hop, 1.5, 1.5);
    ctx.globalAlpha = 1;
  }
  function drawHud() {
    ctx.fillStyle = "rgba(14,20,32,0.92)"; ctx.fillRect(0, 0, W, TOP - 6);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#f4f6ee"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#98a8b8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 86, 9);
    ctx.fillStyle = "#3ad0c0"; ctx.font = "900 9px system-ui"; ctx.fillText(`LIVELLO ${level}`, x0 + 86, 20);
    const filled = boxes.filter((b) => b.filled).length;
    ctx.fillStyle = "#ffd23a"; ctx.font = "800 10px system-ui"; ctx.fillText(`RIQUADRI ${filled}/${boxes.length}`, x0 + 160, 14);
    ctx.fillStyle = "#98a8b8"; ctx.font = "800 9px system-ui"; ctx.fillText("SALTI", x0 + 260, 14);
    for (let i = 0; i < jumps; i++) { ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(x0 + 296 + i * 12, 19); ctx.lineTo(x0 + 301 + i * 12, 9); ctx.lineTo(x0 + 306 + i * 12, 19); ctx.fill(); }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(lx - i * 14, 15, 4.5, 0, TAU); ctx.fill(); ctx.fillStyle = "#f4f6ee"; ctx.fillRect(lx - i * 14 - 5, 8, 10, 3); }
    if (scareT > 0) { ctx.fillStyle = "#7ad0ff"; ctx.font = "900 10px system-ui"; ctx.textAlign = "right"; ctx.fillText(`CACCIA ${Math.ceil(scareT)}`, lx - 60, 14); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!nodes.length) { buildGrid(1); placeActors(); for (const m of enemies) m.wait = 0; edges.forEach((e, i) => { if (i % 3 === 0) e.painted = true; }); boxes.forEach((b, i) => { if (i % 4 === 1) b.filled = true; }); }
    ctx.fillStyle = "#0e1420"; ctx.fillRect(0, 0, W, H);
    drawGrid();
    for (const m of enemies) drawEnemy(m);
    if (state !== "dead" || Math.floor(clock * 6) % 2) drawPlayer();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 12px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0e1420"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);

    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 160, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#3ad0c0";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0e1420"; ctx.strokeText(message.text, W / 2, 187); ctx.fillText(message.text, W / 2, 187);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f4f6ee"; ctx.fillText(message.sub, W / 2, 206); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

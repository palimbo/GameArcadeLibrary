<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Giostra Volante</title>
<style>
  :root {
    --bg: #0a0508;
    --fg: #fff2e0;
    --muted: #c8b0a0;
    --lava: #ff5a1a;
    --gold: #ffd34d;
    --bad: #ff4f6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1410, 0 10px 40px rgba(255, 90, 26, 0.12); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 242, 224, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 66px; height: 66px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid var(--c, rgba(255, 242, 224, 0.6)); background: rgba(255, 242, 224, 0.08);
  }
  #touch.two button { width: 54px; height: 54px; font-size: 19px; }
  #touch.small button { width: 54px; height: 54px; font-size: 20px; }
  #touch.two.small button { width: 46px; height: 46px; }
  #touch button.on { background: rgba(255, 242, 224, 0.4); }
  #touch button[data-a="flap"] { width: 84px; height: 84px; background: rgba(255, 211, 77, 0.14); }
  #touch.two button[data-a="flap"] { width: 62px; height: 62px; }
  #touch.small button[data-a="flap"] { width: 66px; height: 66px; }
  #touch.two.small button[data-a="flap"] { width: 52px; height: 52px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 5, 8, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 9vw, 60px); font-weight: 900; letter-spacing: 2px; color: var(--gold); text-shadow: 0 0 18px rgba(255, 90, 26, 0.8), 3px 3px 0 #6a1a08; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,242,224,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #1a0a00; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #8a5a00; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 480, HUD = 26, LAVA_Y = 456;
  const G = 520, FLAP = 205, MAXFALL = 380, PMAX = 230;
  const BW = 10, BH = 26;                          // rider box: x±10, from feet up 26
  // stone ledges: the outer ones continue across the screen edge
  const PLATS = [
    { x: 90, y: 430, w: 460, h: 22, ground: true },
    { x: 0, y: 150, w: 92, h: 12 }, { x: 548, y: 150, w: 92, h: 12 },
    { x: 232, y: 108, w: 176, h: 12 },
    { x: 0, y: 272, w: 132, h: 12 }, { x: 520, y: 262, w: 120, h: 12 },
    { x: 246, y: 282, w: 140, h: 12 },
    { x: 130, y: 362, w: 120, h: 12 }, { x: 420, y: 352, w: 120, h: 12 },
  ];
  const PADS = [{ x: 320, p: 0 }, { x: 320, p: 3 }, { x: 58, p: 4 }, { x: 480, p: 8 }];
  const TIERS = [
    { name: "Predone", col: "#ff4f4f", bird: "#b08050", pts: 500, speed: 105, flapCd: 0.38, aim: 0 },
    { name: "Cacciatore", col: "#c8c8d8", bird: "#9090a8", pts: 750, speed: 140, flapCd: 0.27, aim: -14 },
    { name: "Signore Oscuro", col: "#4f8aff", bird: "#6a6ac0", pts: 1500, speed: 175, flapCd: 0.18, aim: -26 },
  ];
  const PCOL = [{ rider: "#ffd34d", bird: "#e8b040", name: "G1" }, { rider: "#7df9ff", bird: "#5aa0d8", name: "G2" }];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "6 vite · nemici più lenti · le uova si schiudono dopo 9 secondi", lives: 6, speed: 0.85, hatch: 9 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "4 vite · l'esperienza classica", lives: 4, speed: 1, hatch: 7 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · nemici veloci · le uova si schiudono in fretta", lives: 3, speed: 1.15, hatch: 5 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "giostra-difficulty", MODE_KEY = "giostra-mode";
  const bestKey = (id) => `giostra-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const wrapX = (x) => ((x % W) + W) % W;
  const wdx = (a, b) => { let d = b - a; if (d > W / 2) d -= W; if (d < -W / 2) d += W; return d; };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    touchEl.classList.toggle("two", players.length === 2);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(140px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 140;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    flap: lim(() => noise(0.07, 0.12, 700)),
    step: lim(() => beep(90, 0.03, "square", 0.02)),
    clash: lim(() => { beep(1200, 0.06, "square", 0.03, -600); noise(0.08, 0.2, 3000); }),
    win: lim(() => { noise(0.2, 0.3, 1500); arp([659, 988], 0.06, 0.1); }),
    egg: lim((k) => arp([784 + k * 100, 1047 + k * 100], 0.05, 0.08, "triangle", 0.05)),
    hatch: () => arp([392, 330, 262], 0.08, 0.1, "square", 0.035),
    spawn: lim(() => beep(200, 0.4, "sine", 0.04, 800)),
    die: () => { noise(0.6, 0.35, 900); beep(500, 0.8, "sawtooth", 0.04, -420); },
    lava: () => { noise(1, 0.35, 400); beep(160, 0.9, "sawtooth", 0.04, -110); },
    troll: () => beep(70, 0.5, "sawtooth", 0.05, 30),
    ptero: () => arp([1800, 1500, 1800, 1500], 0.06, 0.06, "sawtooth", 0.03),
    wave: () => arp([392, 523, 659, 784], 0.1, 0.14),
    life: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.1, "triangle", 0.05),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let twoPlayers = load(MODE_KEY) === "2";
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let wave = 0, waveT = 0, bestCache = 0, eggStreak = 0, survival = false, deathsThisWave = 0;
  let players = [], foes = [], eggs = [], parts = [], popups = [], queue = [], ptero = null, troll = null, trollT = 0, message = null;
  const ctl = [{ left: false, right: false, flap: false }, { left: false, right: false, flap: false }];

  function rider(x, y, extra) {
    return Object.assign({ x, y, vx: 0, vy: 0, face: 1, ground: null, flapT: 0, wing: 0, run: 0, flapCd: 0 }, extra);
  }
  function newPlayer(i) { return rider(0, 0, { i, lives: diff.lives, score: 0, nextLife: 20000, spawnT: 0, inv: 0, dead: false, respawnT: 0, flapHeld: false }); }
  function spawnPlayer(p) {
    const pad = p.i === 0 || players.length === 1 ? PADS[0] : PADS[3];
    const pl = PLATS[pad.p];
    Object.assign(p, { x: pad.x + (players.length === 2 && p.i === 0 ? -40 : 0), y: pl.y, vx: 0, vy: 0, ground: pl, dead: false, spawnT: 1, inv: 2.2, face: p.i ? -1 : 1 });
  }
  function spawnFoe(tier, pad) {
    const pl = PLATS[pad.p];
    foes.push(rider(pad.x, pl.y, { tier, spawnT: 0.9, face: Math.random() < 0.5 ? -1 : 1, targetY: rnd(120, 380), thinkT: 0, dead: false }));
    sfx.spawn();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "clear"].includes(state);
  const alive = () => players.filter((p) => p.lives > 0 || !p.dead);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    players = twoPlayers ? [newPlayer(0), newPlayer(1)] : [newPlayer(0)];
    for (const p of players) spawnPlayer(p);
    wave = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    for (const c of ctl) c.left = c.right = c.flap = false;
    buildTouch();
    nextWave();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function nextWave() {
    wave++;
    waveT = 0; eggStreak = 0; deathsThisWave = 0; ptero = null; troll = null; trollT = rnd(4, 8);
    foes = []; eggs = []; queue = [];
    survival = wave % 5 === 2;
    const eggWave = wave % 5 === 0;
    const n = Math.min(8, 2 + wave);
    // tougher riders appear as the waves go on
    for (let k = 0; k < n; k++) {
      const roll = Math.random() * (wave + 2);
      const tier = roll > 7 ? 2 : roll > 3 ? 1 : 0;
      if (eggWave) {
        const pl = PLATS[1 + Math.floor(Math.random() * (PLATS.length - 1))];
        eggs.push({ x: pl.x + rnd(10, pl.w - 10), y: pl.y, vx: 0, vy: 0, t: rnd(0, 2), tier, ground: pl, hatchT: diff.hatch + rnd(2, 5) });
      } else queue.push({ tier, t: 0.6 + k * 0.7 });
    }
    message = { text: eggWave ? `ONDATA ${wave} · ONDATA DELLE UOVA` : survival ? `ONDATA ${wave} · SOPRAVVIVENZA` : `PREPARATI PER L'ONDATA ${wave}`, sub: eggWave ? "Raccogli le uova prima che si schiudano!" : survival ? "Nessuna vita persa: 3.000 punti di bonus" : null, t: 0 };
    state = "intro"; stateT = 2;
    sfx.wave();
  }
  function addScore(p, n, x, y, color = "#fff2e0") {
    p.score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (p.score >= p.nextLife) { p.nextLife += 20000; p.lives++; sfx.life(); popups.push({ x: W / 2, y: 70, text: "VITA EXTRA", color: PCOL[p.i].rider, t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 140) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.4 + Math.random() * 0.4, c: color });
    }
  }
  function killPlayer(p, lava) {
    if (p.dead || p.inv > 0) return;
    p.dead = true; p.lives--; p.respawnT = 2; deathsThisWave++;
    if (lava) sfx.lava(); else sfx.die();
    burst(p.x, p.y - 14, PCOL[p.i].rider, 16, 160);
    if (players.every((q) => q.dead && q.lives <= 0)) { stateT = 2; state = "play"; gameOverT = 1.8; }
  }
  let gameOverT = 0;
  function gameOver() {
    state = "over";
    const top = Math.max(...players.map((p) => p.score));
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = top > prev;
    if (record) store(bestKey(difficulty), String(top));
    const played = diff.label, w = wave;
    const scores = players.length === 2
      ? `<p><span style="color:${PCOL[0].rider}">Giocatore 1: <b>${players[0].score.toLocaleString("it-IT")}</b></span> · <span style="color:${PCOL[1].rider}">Giocatore 2: <b>${players[1].score.toLocaleString("it-IT")}</b></span></p>`
      : `<p>Punteggio: <b>${top.toLocaleString("it-IT")}</b></p>`;
    menu = () => showOverlay(
      `<h2 class="lose">PARTITA FINITA</h2>
       ${scores}
       <p class="muted">Ondata ${w} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${modeHTML()}${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(112px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function modeHTML() {
    return `<div class="diff">
      <button type="button" data-mode="1" class="${twoPlayers ? "" : "on"}" style="--c:#ffd34d">1 GIOCATORE</button>
      <button type="button" data-mode="2" class="${twoPlayers ? "on" : ""}" style="--c:#7df9ff">2 GIOCATORI</button>
    </div>`;
  }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function helpHTML() {
    if (touchMode) return twoPlayers
      ? `<p class="muted help">Ognuno ha i suoi tasti ai lati: ◀ ▶ per girarti e correre · ▲ per sbattere le ali (tieni premuto per volare)</p>`
      : `<p class="muted help">◀ ▶ per girarti e correre · ▲ per sbattere le ali (tieni premuto per continuare a volare)</p>`;
    return twoPlayers
      ? `<p class="muted help"><b style="color:${PCOL[0].rider}">Giocatore 1</b>: A D e W per volare · <b style="color:${PCOL[1].rider}">Giocatore 2</b>: ← → e ↑ per volare · P pausa</p>`
      : `<p class="muted help">← → o A D per girarti · SPAZIO, ↑ o W per sbattere le ali · P pausa</p>`;
  }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>GIOSTRA VOLANTE</h1>
       <p>In sella al tuo struzzo volante, sfida i cavalieri sulle avvoltoi: quando due cavalieri si scontrano vince chi è più in alto. Chi perde diventa un uovo: raccoglilo prima che si schiuda! Non cadere nella lava e occhio alla mano del troll.</p>
       <div class="pts">
         <span><b>Predone</b> (rosso)</span><span>500</span>
         <span><b>Cacciatore</b> (grigio)</span><span>750</span>
         <span><b>Signore Oscuro</b> (blu)</span><span>1500</span>
         <span><b>Uova</b></span><span>250 · 500 · 750 · 1000 di fila, +500 al volo</span>
       </div>
       ${modeHTML()}
       ${helpHTML()}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    const m = e.target.closest("[data-mode]");
    if (m) { twoPlayers = m.dataset.mode === "2"; store(MODE_KEY, twoPlayers ? "2" : "1"); if (menu) menu(); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = {
    a: [0, "left"], d: [0, "right"], w: [0, "flap"], " ": [0, "flap"],
    arrowleft: [1, "left"], arrowright: [1, "right"], arrowup: [1, "flap"], enter: [1, "flap"],
  };

  // ---------- Drawing ----------

    // spawn pads shimmer while a rider materialises
    for (const f of foes) if (f.spawnT > 0) { ctx.fillStyle = `rgba(255,211,77,${0.3 + 0.3 * Math.sin(clock * 30)})`; ctx.fillRect(f.x - 14, f.y - 30, 28, 30); }
    for (const e of eggs) drawEgg(e);
    for (const f of foes) { const T = TIERS[f.tier]; drawRider(f, T.col, T.bird, f.spawnT > 0 ? 0.4 : 1); }
    for (const p of players) {
      if (p.dead) continue;
      if (p.inv > 0 && Math.floor(clock * 12) % 2) continue;
      drawRider(p, PCOL[p.i].rider, PCOL[p.i].bird);
      // a rider across the screen edge is drawn on both sides
      if (p.x < 24) { ctx.save(); ctx.translate(W, 0); drawRider(p, PCOL[p.i].rider, PCOL[p.i].bird); ctx.restore(); }
      if (p.x > W - 24) { ctx.save(); ctx.translate(-W, 0); drawRider(p, PCOL[p.i].rider, PCOL[p.i].bird); ctx.restore(); }
    }
    if (ptero) drawPtero();
    if (troll) drawTroll();
    // lava
    const lg = ctx.createLinearGradient(0, LAVA_Y, 0, H);
    lg.addColorStop(0, "#ffb03a"); lg.addColorStop(0.3, "#ff5a1a"); lg.addColorStop(1, "#8a1a08");
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, LAVA_Y + Math.sin(clock * 2 + x * 0.05) * 3);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    drawPlatform(PLATS[0]);
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 22px system-ui, sans-serif" : "900 12px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, HUD - 4);
    ctx.font = "800 13px system-ui, sans-serif"; ctx.textBaseline = "middle";
    players.forEach((p) => {
      const left = p.i === 0;
      ctx.textAlign = left ? "left" : "right"; ctx.fillStyle = PCOL[p.i].rider;
      ctx.fillText(`${p.score.toLocaleString("it-IT")}   ${"♦".repeat(Math.max(0, Math.min(8, p.lives - (p.dead ? 0 : 1))))}`, left ? 10 : W - 10, 11);
    });
    ctx.textAlign = "center"; ctx.fillStyle = "#c8b0a0";
    const top = Math.max(bestCache, ...players.map((p) => p.score));
    ctx.fillText(`ONDATA ${Math.max(1, wave)} · RECORD ${top.toLocaleString("it-IT")}`, players.length === 2 ? W / 2 : W - 150, 11);
    ctx.textBaseline = "alphabetic";
    if (message) {
      const a = Math.min(1, (2.6 - message.t) * 2);
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = "900 26px system-ui, sans-serif"; ctx.lineWidth = 5; ctx.strokeStyle = "#000";
      ctx.strokeText(message.text, W / 2, 210); ctx.fillStyle = "#ffd34d"; ctx.fillText(message.text, W / 2, 210);
      if (message.sub) { ctx.font = "700 15px system-ui, sans-serif"; ctx.strokeText(message.sub, W / 2, 236); ctx.fillStyle = "#fff2e0"; ctx.fillText(message.sub, W / 2, 236); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

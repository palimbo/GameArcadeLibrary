<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Terra dei Mostri</title>
<style>
  :root {
    --bg: #10200f;
    --fg: #f4f6ee;
    --muted: #c8d8a8;
    --pink: #ffc83a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk (up at a door to go in); SALTA jumps, SPADA strikes */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(122, 228, 255, 0.9); background: rgba(122, 228, 255, 0.22); }
  #touch .jump.on { background: rgba(122, 228, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(16, 32, 15, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a3a0a, 0 0 22px rgba(255,200,58,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1800; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Spada">SPADA</button><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GRAV = 1150, PW = 8, PH = 26, ARENA = 560;
  const ZONES = [
    { name: "Prati di Smeraldo", sky: ["#6ac8ff", "#c8f0ff"], hill: "#5aa84a", ground: "#7a5a3a", grass: "#6ad04a", boss: "ciclope" },
    { name: "Bosco Oscuro", sky: ["#1a3a2a", "#4a7a5a"], hill: "#1a4a2a", ground: "#4a3a2a", grass: "#3a8a3a", boss: "drago" },
    { name: "Grotte di Cristallo", sky: ["#1a1a3a", "#3a2a5a"], hill: "#2a2a5a", ground: "#4a4a6a", grass: "#8a8ae0", boss: "ciclope" },
    { name: "Palude Nebbiosa", sky: ["#4a5a4a", "#8a9a7a"], hill: "#3a4a3a", ground: "#4a4a2a", grass: "#7a8a3a", boss: "drago" },
    { name: "Vulcano Ardente", sky: ["#3a0a0a", "#a83a1a"], hill: "#5a1a0a", ground: "#3a2a2a", grass: "#ff6a2a", boss: "ciclope" },
    { name: "Castello del Drago", sky: ["#0a0a1a", "#3a2a4a"], hill: "#2a2a3a", ground: "#5a5a6a", grass: "#9a9aaa", boss: "drago" },
  ];
  const FOES = {
    lumaca: { hp: 1, dmg: 1, sp: 22, w: 11, h: 12, col: "#e0a040", gold: 2 },
    serpente: { hp: 1, dmg: 1, sp: 40, w: 12, h: 10, col: "#5ad05a", gold: 3 },
    pipistrello: { hp: 1, dmg: 1, sp: 60, w: 10, h: 8, col: "#8a5ac8", gold: 3, fly: true },
    goblin: { hp: 2, dmg: 2, sp: 48, w: 10, h: 20, col: "#7ab03a", gold: 6, shoot: true },
    scheletro: { hp: 3, dmg: 2, sp: 44, w: 10, h: 24, col: "#e8e8d8", gold: 8 },
  };
  const SHOP = [
    { id: "spada", name: "Spada", lv: [0, 40, 100, 200], desc: ["Spada di legno", "Spada di ferro", "Spada d'argento", "Spada leggendaria"] },
    { id: "armatura", name: "Armatura", lv: [0, 50, 120, 220], desc: ["Tunica", "Cotta di maglia", "Corazza", "Armatura d'oro"] },
    { id: "stivali", name: "Stivali", lv: [0, 40, 110], desc: ["Sandali", "Stivali alati", "Stivali di vento"] },
    { id: "pozione", name: "Pozione", price: 25, desc: "+2 cuori" },
    { id: "clessidra", name: "Clessidra", price: 15, desc: "rigira la clessidra" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "7 cuori · clessidra lenta · botteghe meno care", hearts: 7, sand: 70, price: 0.75, foe: 0.85 },
    normale:   { label: "NORMALE",   color: "#ffc83a", desc: "5 cuori", hearts: 5, sand: 55, price: 1, foe: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "4 cuori · clessidra veloce · mostri più forti e svelti", hearts: 4, sand: 42, price: 1.15, foe: 1.2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "terra-difficulty";
  const bestKey = (id) => `terra-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    slash: lim(() => noise(0.08, 0.06, 2600)),
    hit: lim(() => { noise(0.06, 0.1, 900); beep(300, 0.06, "square", 0.04, -120); }),
    kill: lim(() => arp([660, 880], 0.05, 0.07, "square", 0.04)),
    coin: lim(() => arp([1319, 1760], 0.04, 0.06, "square", 0.03)),
    jump: lim(() => beep(320, 0.09, "square", 0.025, 300)),
    hurt: lim(() => { beep(220, 0.18, "sawtooth", 0.05, -120); }),
    fall: () => { for (let i = 0; i < 6; i++) beep(700 - i * 90, 0.08, "triangle", 0.04, 0, i * 0.05); },
    buy: () => arp([784, 988, 1319], 0.06, 0.1, "square", 0.045),
    no: () => beep(160, 0.15, "square", 0.04),
    door: () => arp([392, 523], 0.08, 0.1, "triangle", 0.04),
    sand: () => arp([880, 660, 440], 0.1, 0.12, "triangle", 0.04),
    roar: () => { noise(0.5, 0.12, 300); beep(110, 0.5, "sawtooth", 0.05, -40); },
    boom: lim(() => noise(0.3, 0.14, 250)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, gold = 0, zone = 1, bestCache = 0, sand = 0;
  let level = null, P = null, foes = [], shots = [], coins = [], parts = [], popups = [], boss = null, camX = 0, message = null;
  let gear = { spada: 0, armatura: 0, stivali: 0 }, shopSel = 0, shopNote = "";
  let jumpPressed = false, swordPressed = false, upPressed = false, lastStickY = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const Z = () => ZONES[(zone - 1) % ZONES.length];
  const lap = () => Math.floor((zone - 1) / ZONES.length);

  // ---------- The level ----------
  // ground blocks [x0, x1, top] with pits between some of them, floating ledges, one shop, then the boss arena
  function buildLevel() {
    const lvl = zone - 1, len = 2600 + Math.min(6, lvl) * 250;
    const ground = [], ledges = [], spots = [];
    let x = 0, y = 296;
    ground.push([-200, 360, y]); x = 360;
    while (x < len) {
      const pit = Math.random() < 0.28 + 0.03 * Math.min(6, lvl);
      const gap = pit ? rnd(36, Math.min(62, 50 + lvl * 2) + (difficulty === "difficile" ? 6 : 0)) : 0;
      const ny = clamp(y + pick([-34, -24, 0, 0, 0, 22, 30]), 236, 316);
      const w = rnd(170, 400);
      x += gap;
      // never a pit straight into a much higher block
      const top = pit ? Math.max(ny, y - 20) : ny;
      ground.push([x, x + w, top]);
      if (Math.random() < 0.35 && w > 220) ledges.push([x + rnd(30, w - 140), 0, top - rnd(56, 70)]);
      spots.push([x + 40, x + w - 40, top]);
      x += w; y = top;
    }
    ground.push([x, x + ARENA + 200, 300]);
    for (const l of ledges) l[1] = l[0] + rnd(70, 110);
    const end = x;
    // the shop door halfway, on a wide block
    let shop = null;
    for (const g of ground) if (g[0] > len * 0.42 && g[1] - g[0] > 200) { shop = { x: (g[0] + g[1]) / 2, y: g[2] }; break; }
    if (!shop) { const g = ground[Math.floor(ground.length / 2)]; shop = { x: (g[0] + g[1]) / 2, y: g[2] }; }
    level = { len, ground, ledges, end, shop, arena: end + 40 };
    // the monsters
    foes = [];
    const kinds = ["lumaca", "serpente", "pipistrello", ...(lvl >= 1 ? ["goblin"] : []), ...(lvl >= 2 ? ["scheletro"] : [])];
    const n = Math.round((9 + lvl * 2) * diff.foe);
    for (let i = 0; i < n; i++) {
      const s = pick(spots.filter((p) => p[0] > 500 && Math.abs((p[0] + p[1]) / 2 - shop.x) > 80));
      if (!s) continue;
      const k = pick(kinds), fx = rnd(s[0], s[1]);
      foes.push(makeFoe(k, fx, FOES[k].fly ? s[2] - rnd(50, 90) : s[2]));
    }
    // a few chests of gold up on the ledges
    coins = [];
    for (const l of ledges) if (Math.random() < 0.6) coins.push({ x: (l[0] + l[1]) / 2, y: l[2] - 6, v: 5, vy: 0, rest: true, t: 0 });
    boss = null; shots = [];
  }
  function makeFoe(kind, x, y) {
    const F = FOES[kind], hpUp = lap() + (difficulty === "difficile" ? 1 : 0);
    const hp = F.hp + (F.hp > 1 ? hpUp : 0);
    return { kind, x, y, baseY: y, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, hp, max: hp, t: rnd(0, 3), hurt: 0, cd: rnd(1, 3) };
  }
  // the top of the ground under x (ledges included when falling onto them), or null over a pit
  function groundAt(x) { for (const g of level.ground) if (x >= g[0] && x <= g[1]) return g[2]; return null; }
  function landOn(x, hw, y0, y1) {
    let best = null;
    for (const g of level.ground) if (x + hw > g[0] && x - hw < g[1] && y0 <= g[2] + 0.5 && y1 >= g[2] && (best === null || g[2] < best)) best = g[2];
    for (const l of level.ledges) if (x + hw > l[0] && x - hw < l[1] && y0 <= l[2] + 0.5 && y1 >= l[2] && (best === null || l[2] < best)) best = l[2];
    return best;
  }
  // a block side that stops walking: any block whose top is above the feet
  function wallBetween(x0, x1, feet) {
    for (const g of level.ground) {
      if (g[2] >= feet - 2) continue;
      if (x1 > x0 && x0 <= g[0] && x1 > g[0]) return g[0];
      if (x1 < x0 && x0 >= g[1] && x1 < g[1]) return g[1];
    }
    return null;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "shop", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; gold = 0; zone = 1; gear = { spada: 0, armatura: 0, stivali: 0 };
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = { hp: diff.hearts * 2, max: diff.hearts * 2 };
    beginZone();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginZone() {
    buildLevel();
    Object.assign(P, { x: 60, y: 296, vx: 0, vy: 0, air: false, face: 1, swing: 0, safe: 1.5, walk: 0, coyote: 0, lastSafe: { x: 60, y: 296 }, shopped: false });
    camX = 0; sand = diff.sand; parts = []; popups = [];
    message = { text: `ZONA ${zone} · ${Z().name.toUpperCase()}`, sub: "verso destra! in fondo ti aspetta il guardiano", t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  // damage in half hearts; the armour takes some of it off
  function hurt(dmg, from, why) {
    if (state !== "play" || P.safe > 0) return;
    const d = Math.max(1, dmg - Math.floor((gear.armatura + 1) / 2));
    if (window.__hits) window.__hits.push([zone, why || "?", d]);
    if (window.__god) return;
    P.hp -= d; P.safe = 1.1; sfx.hurt();
    P.vx = (P.x < from ? -1 : 1) * 160; P.vy = -230; P.air = true;
    popups.push({ x: P.x, y: P.y - 34, text: d >= 2 ? "−1 ❤" : "−½ ❤", color: "#ff5a5a", t: 0 });
    if (P.hp <= 0) die();
  }
  function die() { P.hp = 0; state = "dead"; stateT = 2.2; sfx.over(); message = { text: "SEI CADUTO!", sub: `la tua avventura finisce nella ${Z().name}`, t: 0, long: true }; }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">AVVENTURA FINITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · zona ${zone} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPARTI ALL'AVVENTURA</button>`
    );
    menu();
    syncControls();
  }

    if (boss) updateBoss(dt);
    updateShots(dt);
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const z = Z(), g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, z.sky[0]); g.addColorStop(1, z.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    // far hills, slower than the ground
    ctx.fillStyle = z.hill;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) { const wx = x + camX * 0.3; ctx.lineTo(x, 210 + Math.sin(wx * 0.008) * 30 + Math.sin(wx * 0.021) * 12); }
    ctx.lineTo(W, H); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 4; i++) { const x = ((i * 190 - camX * 0.15) % (W + 120) + W + 120) % (W + 120) - 60; ctx.beginPath(); ctx.ellipse(x, 60 + i * 14, 30, 9, 0, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function drawLevel() {
    const z = Z();
    for (const g of level.ground) {
      const x0 = g[0] - camX, x1 = g[1] - camX; if (x1 < -10 || x0 > W + 10) continue;
      ctx.fillStyle = z.ground; ctx.fillRect(x0, g[2], x1 - x0, H - g[2]);
      ctx.fillStyle = "rgba(0,0,0,0.15)"; for (let y = g[2] + 14; y < H; y += 16) for (let x = x0 + ((y / 16) % 2) * 12; x < x1; x += 24) ctx.fillRect(x, y, 2, 2);
      ctx.fillStyle = z.grass; ctx.fillRect(x0, g[2], x1 - x0, 6);
    }
    for (const l of level.ledges) {
      const x0 = l[0] - camX, x1 = l[1] - camX; if (x1 < -10 || x0 > W + 10) continue;
      ctx.fillStyle = z.ground; ctx.fillRect(x0, l[2], x1 - x0, 10); ctx.fillStyle = z.grass; ctx.fillRect(x0, l[2], x1 - x0, 4);
    }
    // the shop door
    const s = level.shop, sx = s.x - camX;
    if (sx > -40 && sx < W + 40) {
      ctx.fillStyle = "#8a5a3a"; ctx.fillRect(sx - 26, s.y - 56, 52, 56);
      ctx.fillStyle = "#c8384a"; ctx.beginPath(); ctx.moveTo(sx - 32, s.y - 54); ctx.lineTo(sx, s.y - 76); ctx.lineTo(sx + 32, s.y - 54); ctx.fill();
      ctx.fillStyle = "#3a2010"; ctx.fillRect(sx - 10, s.y - 30, 20, 30);
      ctx.fillStyle = "#ffd23a"; ctx.font = "800 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("BOTTEGA", sx, s.y - 40);
      if (Math.abs(P.x - s.x) < 16 && state === "play") { ctx.fillStyle = "#ffffff"; ctx.font = "800 10px system-ui"; ctx.fillText("↑ ENTRA", sx, s.y - 82); }
    }
    // the gate to the arena
    const ax = level.arena - camX;
    if (ax > -20 && ax < W + 20) { ctx.fillStyle = "#5a5a6a"; ctx.fillRect(ax - 8, 230, 8, 70); ctx.fillRect(ax - 14, 222, 20, 10); }
  }
  function drawHero() {
    if (P.safe > 0 && state === "play" && Math.floor(clock * 14) % 2) return;
    const x = P.x - camX, y = P.y, f = P.face, b = P.air ? 0 : Math.abs(Math.sin(P.walk)) * 1.5;
    const armor = ["#3a8ad0", "#8a9ab0", "#c0c8d8", "#ffd23a"][gear.armatura];
    ctx.fillStyle = gear.stivali ? "#c83a3a" : "#8a5a3a"; ctx.fillRect(x - 6, y - 5, 5, 5); ctx.fillRect(x + 1, y - 5, 5, 5);
    if (gear.stivali) { ctx.fillStyle = "#ffffff"; ctx.fillRect(x - f * 8, y - 6, 3, 2); }
    ctx.fillStyle = "#f0c090"; ctx.fillRect(x - 5, y - 10 - b * 0.3, 3, 6); ctx.fillRect(x + 2, y - 10 - b * 0.3, 3, 6);
    ctx.fillStyle = armor; ctx.fillRect(x - 7, y - 21 - b, 14, 12);
    ctx.fillStyle = "#f0c090"; ctx.beginPath(); ctx.arc(x, y - 26 - b, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.arc(x - f, y - 28 - b, 6, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x + f * 3 - 1, y - 27 - b, 2, 2);
    // the sword, swept round in an arc when striking
    const swordCol = ["#c8a06a", "#c8d0d8", "#f0f4ff", "#ffe86a"][gear.spada];
    ctx.strokeStyle = swordCol; ctx.lineWidth = 3; ctx.lineCap = "round";
    if (P.swing > 0) {
      const k = 1 - P.swing / 0.24, a = -1.6 + k * 2.2;
      ctx.beginPath(); ctx.moveTo(x + f * 6, y - 16); ctx.lineTo(x + f * (6 + Math.cos(a) * 22), y - 16 + Math.sin(a) * 22); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + f * 6, y - 16, 22, f > 0 ? -1.6 : Math.PI - 0.6, f > 0 ? 0.6 : Math.PI + 1.6); ctx.stroke();
    } else { ctx.beginPath(); ctx.moveTo(x + f * 7, y - 14); ctx.lineTo(x + f * 10, y - 30); ctx.stroke(); }
    ctx.lineCap = "butt";
  }
  function drawFoe(f) {
    const F = FOES[f.kind], x = f.x - camX, y = f.y, d = f.dir;
    if (x < -30 || x > W + 30) return;
    ctx.fillStyle = f.hurt > 0 ? "#ffffff" : F.col;
    if (f.kind === "lumaca") {
      ctx.beginPath(); ctx.ellipse(x - d * 2, y - 9, 9, 8, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#8a5a1a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x - d * 2, y - 9, 4, 0, TAU * 0.8); ctx.stroke();
      ctx.fillStyle = "#c8c88a"; ctx.fillRect(x - 9, y - 3, 18, 3); ctx.fillRect(x + d * 7, y - 9, 2, 6);
    } else if (f.kind === "serpente") {
      ctx.beginPath(); for (let i = 0; i < 4; i++) ctx.arc(x - d * i * 5, y - 4 - Math.sin(f.t * 6 + i) * 2, 4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x + d * 4, y - 9, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff3a3a"; ctx.fillRect(x + d * 9, y - 9, d * 4, 1.5);
    } else if (f.kind === "pipistrello") {
      const w = Math.sin(f.t * 18) * 6;
      ctx.beginPath(); ctx.ellipse(x, y, 5, 6, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 4, y - 2); ctx.lineTo(x - 15, y - 4 - w); ctx.lineTo(x - 10, y + 2); ctx.moveTo(x + 4, y - 2); ctx.lineTo(x + 15, y - 4 - w); ctx.lineTo(x + 10, y + 2); ctx.fill();
      ctx.fillStyle = "#ffff6a"; ctx.fillRect(x - 3, y - 3, 2, 2); ctx.fillRect(x + 1, y - 3, 2, 2);
    } else {
      // goblins and skeletons walk on two legs
      const sk = f.kind === "scheletro", lg = Math.sin(f.t * 10) * 3;
      ctx.fillRect(x - 5 + lg, y - 8, 3, 8); ctx.fillRect(x + 2 - lg, y - 8, 3, 8);
      ctx.fillRect(x - 6, y - (sk ? 22 : 18), 12, sk ? 14 : 11);
      ctx.beginPath(); ctx.arc(x, y - (sk ? 27 : 23), sk ? 6 : 6, 0, TAU); ctx.fill();
      ctx.fillStyle = sk ? "#1a1a1a" : "#ff3a3a"; ctx.fillRect(x + d * 2 - 1, y - (sk ? 29 : 25), 2, 2); ctx.fillRect(x + d * 2 - 4, y - (sk ? 29 : 25), 2, 2);
      if (sk) { ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + d * 6, y - 14); ctx.lineTo(x + d * 14, y - 26); ctx.stroke(); }
      else { ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + d * 6, y - 10); ctx.lineTo(x + d * 6, y - 32); ctx.stroke(); }
    }
  }
  function drawBoss() {
    const b = boss, x = b.x - camX, y = b.y, f = b.face;
    ctx.fillStyle = b.hurt > 0 ? "#ffffff" : b.kind === "ciclope" ? "#c87a4a" : "#3aa84a";
    if (b.kind === "ciclope") {
      ctx.fillRect(x - 14, y - 18, 10, 18); ctx.fillRect(x + 4, y - 18, 10, 18);
      ctx.beginPath(); ctx.ellipse(x, y - 36, 22, 22, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y - 64, 13, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x + f * 3, y - 66, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#c82a2a"; ctx.beginPath(); ctx.arc(x + f * 5, y - 66, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#6a4a2a"; ctx.fillRect(x - 20, y - 38, 40, 8);
      ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + f * 20, y - 40); ctx.lineTo(x + f * 34, y - 70); ctx.stroke();
    } else {
      const w = Math.sin(b.t * 6) * 12;
      ctx.beginPath(); ctx.ellipse(x, y, 26, 14, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 8, y - 6); ctx.lineTo(x - 30, y - 30 - w); ctx.lineTo(x + 4, y - 8); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - f * 22, y); ctx.lineTo(x - f * 44, y + 8); ctx.lineTo(x - f * 22, y + 6); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + f * 28, y - 8, 12, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffd23a"; ctx.fillRect(x + f * 30 - 1, y - 12, 3, 3);
      ctx.fillStyle = "#c8f0a8"; ctx.beginPath(); ctx.ellipse(x, y + 4, 18, 6, 0, 0, Math.PI); ctx.fill();
    }
    // its energy bar
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(W / 2 - 100, TOP + 8, 200, 8);
    ctx.fillStyle = "#ff5a3a"; ctx.fillRect(W / 2 - 100, TOP + 8, 200 * Math.max(0, b.hp) / b.max, 8);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 8px system-ui"; ctx.textAlign = "center"; ctx.fillText(b.kind === "ciclope" ? "CICLOPE" : "DRAGO", W / 2, TOP + 26);
  }
  function drawShop() {
    ctx.fillStyle = "rgba(20,10,4,0.92)"; ctx.fillRect(110, 52, 420, 268);
    ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 2; ctx.strokeRect(110, 52, 420, 268);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffd23a"; ctx.font = "italic 900 20px system-ui"; ctx.fillText("LA BOTTEGA", W / 2, 80);
    ctx.font = "700 11px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(`Monete: ${gold} 🪙`, W / 2, 98);
    SHOP.forEach((it, i) => {
      const y = 124 + i * 32, sel = i === shopSel, p = priceOf(it);
      if (sel) { ctx.fillStyle = "rgba(255,210,58,0.18)"; ctx.fillRect(126, y - 16, 388, 28); }
      ctx.textAlign = "left"; ctx.font = "800 13px system-ui"; ctx.fillStyle = sel ? "#ffd23a" : "#ffffff";
      const label = it.price ? `${it.name} · ${it.desc}` : p === null ? `${it.desc[gear[it.id]]} (al massimo)` : `${it.desc[gear[it.id] + 1]}`;
      ctx.fillText(`${sel ? "▶ " : ""}${label}`, 136, y);
      ctx.textAlign = "right"; ctx.fillStyle = p === null ? "#8a8a8a" : gold >= p ? "#7ed87a" : "#ff7a6a";
      ctx.fillText(p === null ? "—" : `${p} 🪙`, 504, y);
    });
    ctx.textAlign = "center"; ctx.font = "700 11px system-ui"; ctx.fillStyle = "#c8d8a8"; ctx.fillText(shopNote, W / 2, 292);
    ctx.fillStyle = "#ffffff"; ctx.font = "700 10px system-ui"; ctx.fillText(touchMode ? "levetta su/giù per scegliere · SPADA compra · SALTA esce" : "↑ ↓ per scegliere · X o INVIO compra · SPAZIO esce", W / 2, 310);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(16,32,15,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 14px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8d8a8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 76, 9);
    ctx.fillStyle = "#ffc83a"; ctx.font = "900 9px system-ui"; ctx.fillText(`ZONA ${zone}`, x0 + 76, 21);
    // hearts, in halves
    for (let i = 0; i < P.max / 2; i++) {
      const v = clamp(P.hp - i * 2, 0, 2), hx = x0 + 136 + i * 13;
      ctx.font = "11px system-ui"; ctx.globalAlpha = v === 0 ? 0.3 : 1; ctx.fillText(v === 2 ? "❤️" : v === 1 ? "💔" : "🖤", hx, 14); ctx.globalAlpha = 1;
    }
    const gx = touchMode ? W - 200 : W - 150;
    ctx.fillStyle = "#ffd23a"; ctx.font = "800 11px system-ui"; ctx.fillText(`🪙 ${gold}`, gx, 14);
    // the hourglass
    const k = clamp(sand / diff.sand, 0, 1);
    ctx.fillStyle = "#3a3a2a"; ctx.fillRect(gx + 50, 7, 50, 8); ctx.fillStyle = k < 0.25 && Math.floor(clock * 4) % 2 ? "#ff5a3a" : "#e8d080"; ctx.fillRect(gx + 50, 7, 50 * k, 8);
    ctx.font = "10px system-ui"; ctx.fillText("⏳", gx + 102, 12);
    ctx.font = "700 7px system-ui"; ctx.fillStyle = "#c8d8a8"; ctx.fillText(`⚔${gear.spada + 1} 🛡${gear.armatura} 👢${gear.stivali}`, gx + 50, 22);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!level) { buildLevel(); P = { x: 200, y: 296, face: 1, swing: 0, safe: 0, walk: 0, hp: 10, max: 10, air: false }; camX = 0; }
    drawBackground();
    drawLevel();
    for (const c of coins) { const x = c.x - camX; ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.ellipse(x, c.y, 4 * Math.abs(Math.cos(clock * 4 + c.x)) + 1, 5, 0, 0, TAU); ctx.fill(); }
    for (const f of foes) drawFoe(f);
    if (boss) drawBoss();
    for (const s of shots) {
      const x = s.x - camX;
      if (s.kind === "lancia") { ctx.strokeStyle = "#c8a06a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 9, s.y); ctx.lineTo(x + 9, s.y); ctx.stroke(); ctx.fillStyle = "#e0e0e0"; ctx.fillRect(x + Math.sign(s.vx) * 9 - 2, s.y - 2, 4, 4); }
      else if (s.kind === "onda") { ctx.fillStyle = "rgba(255,200,120,0.85)"; ctx.beginPath(); ctx.ellipse(x, s.y, 10, 7, 0, Math.PI, TAU); ctx.fill(); }
      else { ctx.fillStyle = "#ff8a2a"; ctx.beginPath(); ctx.arc(x, s.y, 6, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffe86a"; ctx.beginPath(); ctx.arc(x, s.y, 3, 0, TAU); ctx.fill(); }
    }
    if (state !== "menu" && (state !== "dead" || Math.floor(clock * 6) % 2)) drawHero();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - camX - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#10200f"; ctx.strokeText(p.text, p.x - camX, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - camX, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (state === "shop") drawShop();
    if (message) {
      const life = message.long ? 3 : 2.2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ffc83a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#10200f"; ctx.strokeText(message.text, W / 2, 84); ctx.fillText(message.text, W / 2, 84);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 103); ctx.fillText(message.sub, W / 2, 103); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="terra-best-" data-kind="score"></script>

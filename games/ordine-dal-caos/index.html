<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ordine dal Caos</title>
<style>
  :root {
    --bg: #0d0822;
    --fg: #f1eeff;
    --muted: #a9a3cf;
    --cyan: #5fe3d6;
    --yellow: #ffd66b;
    --red: #ff6b7d;
    --pink: #ff9be0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1f55, 0 10px 40px rgba(0,0,0,0.6); cursor: pointer; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(241, 238, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(13, 8, 34, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 54px); font-weight: 900; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #2a1f6a, 0 0 22px rgba(255,155,224,0.35); text-wrap: balance; }
  #overlay h2 { font-size: clamp(24px, 7vw, 40px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(241,238,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0a22; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8508e; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TOP = 56, TAU = Math.PI * 2;
  const AREA = { x: 10, y: TOP + 8, w: 340, h: H - TOP - 18 };
  // the grid grows level after level
  const SIZES = [[4, 5], [5, 6], [5, 7], [6, 7], [6, 8], [7, 8], [7, 9]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "tanti scambi · più tessere fisse · un puntino chiaro sulle tessere già a posto", k: 2.3, size: 0, anchors: true, marks: true },
    normale:   { label: "NORMALE",   color: "#ffd66b", desc: "fissi solo i quattro angoli · nessun aiuto", k: 1.65, size: 0, anchors: false, marks: false },
    difficile: { label: "DIFFICILE", color: "#ff6b7d", desc: "griglie più grandi da subito · scambi contati", k: 1.3, size: 2, anchors: false, marks: false },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "caos-difficulty";
  const bestKey = (id) => `caos-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => n.toLocaleString("it-IT");
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio: soft tones ----------
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.05, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type, vol) => notes.forEach((f, i) => beep(f, d, type, vol, i * gap));
  const sfx = {
    pick: () => beep(520, 0.08, "sine", 0.04),
    swap: () => arp([392, 494], 0.05, 0.14, "triangle", 0.045),
    home: () => beep(988, 0.22, "sine", 0.04, 0.08),
    fixed: () => beep(160, 0.08, "sine", 0.05),
    scramble: () => arp([784, 622, 698, 523, 587, 440], 0.06, 0.1, "triangle", 0.03),
    win: () => arp([523, 659, 784, 1047], 0.09, 0.35),
    perfect: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.4),
    lose: () => arp([392, 330, 277, 220], 0.16, 0.4, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, level = 0, bestCache = 0, cleared = 0, perfects = 0;
  let cols = 4, rows = 5, cell = 60, gx0 = 0, gy0 = 0;
  let slots = [], minSwaps = 0, budget = 0, left = 0, moves = 0, movable = 0;
  let sel = -1, press = null, cursor = -1, popups = [], message = null, winT = 0;

  const slotX = (i) => gx0 + (i % cols) * cell, slotY = (i) => gy0 + Math.floor(i / cols) * cell;
  const isPlaying = () => ["show", "scramble", "play", "levelup", "fail"].includes(state);
  const misplaced = () => slots.reduce((n, t, i) => n + (t.home !== i ? 1 : 0), 0);

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  // a smooth picture: four corner colours blended across the grid
  function buildLevel() {
    [cols, rows] = SIZES[Math.min(SIZES.length - 1, level + diff.size)];
    cell = Math.floor(Math.min(AREA.w / cols, AREA.h / rows));
    gx0 = Math.round((W - cols * cell) / 2); gy0 = Math.round(AREA.y + (AREA.h - rows * cell) / 2);
    const h0 = rnd(0, 360);
    const corner = shuffle([h0, h0 + rnd(55, 100), h0 + rnd(150, 210), h0 + rnd(250, 305)]).map((h) => hsl(h, rnd(0.7, 0.92), rnd(0.44, 0.68)));
    slots = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const u = i / (cols - 1), v = j / (rows - 1), idx = j * cols + i;
      const c = [0, 1, 2].map((k) => Math.round((corner[0][k] * (1 - u) + corner[1][k] * u) * (1 - v) + (corner[2][k] * (1 - u) + corner[3][k] * u) * v));
      const isCorner = (i === 0 || i === cols - 1) && (j === 0 || j === rows - 1);
      const border = i === 0 || j === 0 || i === cols - 1 || j === rows - 1;
      slots.push({ home: idx, color: `rgb(${c[0]},${c[1]},${c[2]})`, fixed: isCorner || (diff.anchors && border && (i + j) % 2 === 0), px: slotX(idx), py: slotY(idx), pop: 0 });
    }
    sel = -1; press = null; cursor = -1; moves = 0; winT = 0;
  }
  // mix the free tiles, and count the fewest swaps that would undo it
  function scramble() {
    const free = slots.map((t, i) => i).filter((i) => !slots[i].fixed);
    movable = free.length;
    const tiles = free.map((i) => slots[i]);
    let perm;
    do {
      perm = shuffle(free.map((_, k) => k));
      const seen = new Array(perm.length).fill(false);
      let cycles = 0;
      for (let k = 0; k < perm.length; k++) if (!seen[k]) { cycles++; for (let q = k; !seen[q]; q = perm[q]) seen[q] = true; }
      minSwaps = perm.length - cycles;
    } while (minSwaps < movable * 0.7);
    free.forEach((slot, k) => { slots[slot] = tiles[perm[k]]; });
    const k = Math.max(1.15, diff.k - 0.04 * Math.max(0, level + diff.size - (SIZES.length - 1)));
    budget = Math.ceil(minSwaps * k) + 1; left = budget;
    sfx.scramble();
  }

  // ---------- Flow ----------
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; level = 0; cleared = 0; perfects = 0; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    budget = left = 0;
    message = { text: `LIVELLO ${level + 1}`, sub: `${cols} × ${rows} · guarda bene, tra poco si mescola`, t: 0.7 };
    state = "show"; stateT = 2.6;
  }
  function addScore(n, y, color, label = "") {
    score += n;
    popups.push({ x: W / 2, y, text: `${label}+${nf(n)}`, color, t: 0 });
  }
  function tap(i) {
    if (state !== "play" || i < 0) return;
    if (slots[i].fixed) { slots[i].pop = -1; sfx.fixed(); return; }
    if (sel === -1) { sel = i; sfx.pick(); }
    else if (sel === i) sel = -1;
    else { const a = sel; sel = -1; swap(a, i); }
  }
  function swap(a, b) {
    if (state !== "play" || a === b || slots[a].fixed || slots[b].fixed) return;
    [slots[a], slots[b]] = [slots[b], slots[a]];
    slots[a].pop = slots[b].pop = 1;
    moves++; left--;
    sfx.swap();
    if (diff.marks && (slots[a].home === a || slots[b].home === b)) sfx.home();
    if (misplaced() === 0) { win(); return; }
    if (left <= 0) { state = "fail"; stateT = 1.0; message = { text: "SCAMBI FINITI", sub: `restavano ${misplaced()} tessere fuori posto`, t: 0 }; sfx.lose(); }
  }
  function win() {
    const perfect = moves <= minSwaps;
    state = "levelup"; stateT = 2.2; winT = 0.0001; cleared++; sel = -1; press = null;
    addScore(400 * (level + 1), 300, "#5fe3d6");
    if (left > 0) addScore(60 * left, 278, "#ffd66b", `${left} ${left === 1 ? "scambio" : "scambi"} · `);
    if (perfect) { perfects++; addScore(800, 256, "#ff9be0", "percorso minimo · "); sfx.perfect(); } else sfx.win();
    message = { text: perfect ? "OTTIMO GLOBALE!" : "ORDINE RISTABILITO", sub: `rumore 0% in ${moves} scambi (minimo ${minSwaps})`, t: 0 };
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">SCAMBI FINITI</h2>
       <p>Punteggio: <b>${nf(score)}</b> · ${cleared} ${cleared === 1 ? "immagine riordinata" : "immagini riordinate"}${perfects ? ` · ${perfects} col percorso minimo` : ""} · ${diff.label}</p>
       <p class="muted">Un po' di rumore è rimasto. Si riparte da capo, con calma.</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPROVA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; press = null;
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (state === "menu") buildLevel(); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ORDINE DAL CAOS</h1>
       <p>Un'immagine fatta di sfumature viene mescolata: rimetti ogni colore al suo posto, uno scambio alla volta. Nessun timer: qui conta solo togliere il rumore.</p>
       <div class="pts">
         <span><b>Scambi</b></span><span>ne hai un numero contato per ogni immagine: se finiscono prima dell'ordine, la partita si chiude</span>
         <span><b>Tessere fisse</b></span><span>quelle col puntino scuro non si muovono: parti da lì</span>
         <span><b>Rumore</b></span><span>la percentuale in alto dice quante tessere sono ancora fuori posto</span>
         <span><b>Punti</b></span><span>400 × livello · 60 per ogni scambio avanzato · 800 se usi il numero minimo di scambi</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tocca due tessere per scambiarle, oppure trascinane una sull'altra</p>`
         : `<p class="muted help">Clicca due tessere per scambiarle, o trascinane una sull'altra · oppure frecce e Spazio · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>RIMETTI IN ORDINE</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (state !== "play") return;
    if (k.startsWith("arrow")) {
      if (cursor < 0) { cursor = sel >= 0 ? sel : 0; return; }
      let i = cursor % cols, j = Math.floor(cursor / cols);
      if (k === "arrowleft") i = (i + cols - 1) % cols;
      if (k === "arrowright") i = (i + 1) % cols;
      if (k === "arrowup") j = (j + rows - 1) % rows;
      if (k === "arrowdown") j = (j + 1) % rows;
      cursor = j * cols + i;
    } else if ((k === " " || k === "enter") && !e.repeat && cursor >= 0) tap(cursor);
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  const toWorld = (e) => { const rc = canvas.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * W, y: (e.clientY - rc.top) / rc.height * H }; };
  function slotAt(p) {
    const i = Math.floor((p.x - gx0) / cell), j = Math.floor((p.y - gy0) / cell);
    return i >= 0 && j >= 0 && i < cols && j < rows ? j * cols + i : -1;
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state !== "play") return;
    const p = toWorld(e), i = slotAt(p);
    cursor = -1;
    if (i < 0) { sel = -1; return; }
    press = { id: e.pointerId, i, x0: p.x, y0: p.y, x: p.x, y: p.y, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!press || press.id !== e.pointerId) return;
    const p = toWorld(e); press.x = p.x; press.y = p.y;
    if (!press.moved && Math.hypot(p.x - press.x0, p.y - press.y0) > 10 && !slots[press.i].fixed) { press.moved = true; sel = -1; }
  });
  canvas.addEventListener("pointerup", (e) => {
    if (!press || press.id !== e.pointerId) return;
    const pr = press; press = null;
    if (!pr.moved) { tap(pr.i); return; }
    const j = slotAt({ x: pr.x, y: pr.y });
    if (j >= 0 && j !== pr.i) { if (slots[j].fixed) { slots[j].pop = -1; sfx.fixed(); } else swap(pr.i, j); }
  });
  canvas.addEventListener("pointercancel", () => { press = null; });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    if (message) { message.t += dt; if (message.t > 2) message = null; }
    for (const p of popups) { p.t += dt; p.y -= 14 * dt; }
    popups = popups.filter((p) => p.t < 1.8);
    const ease = Math.min(1, dt * (state === "scramble" ? 7 : 16));
    slots.forEach((t, i) => {
      t.px += (slotX(i) - t.px) * ease; t.py += (slotY(i) - t.py) * ease;
      if (t.pop > 0) t.pop = Math.max(0, t.pop - dt * 5); else if (t.pop < 0) t.pop = Math.min(0, t.pop + dt * 5);
    });
    if (winT) winT += dt;
    if (!isPlaying()) return;
    if (state === "show") { stateT -= dt; if (stateT <= 0) { scramble(); state = "scramble"; stateT = 0.9; } }
    else if (state === "scramble") { stateT -= dt; if (stateT <= 0) state = "play"; }
    else if (state === "levelup") { stateT -= dt; if (stateT <= 0) { level++; beginLevel(); } }
    else if (state === "fail") { stateT -= dt; if (stateT <= 0) gameOver(); }
  }

  // ---------- Drawing ----------
  function drawTile(t, x, y, scale, i) {
    const s = cell * scale, o = (cell - s) / 2;
    ctx.fillStyle = t.color; ctx.fillRect(x + o, y + o, s + 0.5, s + 0.5);
    if (t.fixed) { ctx.fillStyle = "rgba(13,8,34,0.75)"; ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, Math.max(2.5, cell * 0.06), 0, TAU); ctx.fill(); }
    else if (diff.marks && state === "play" && t.home === i) { ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, Math.max(2, cell * 0.045), 0, TAU); ctx.fill(); }
  }
  function drawGrid() {
    const dragging = press && press.moved ? press.i : -1;
    slots.forEach((t, i) => {
      if (i === sel || i === dragging) return;
      let sc = 1 + 0.12 * Math.max(0, t.pop), x = t.px, y = t.py;
      if (t.pop < 0) x += Math.sin(t.pop * 30) * 3;
      if (winT) { const d = (i % cols + Math.floor(i / cols)) * 0.07, w = winT - d; if (w > 0 && w < 0.5) sc = 1 - 0.14 * Math.sin(w / 0.5 * Math.PI); }
      drawTile(t, x, y, sc, i);
    });
    // the target of a drag, and the keyboard cursor
    if (dragging >= 0) {
      const j = slotAt({ x: press.x, y: press.y });
      if (j >= 0 && j !== dragging && !slots[j].fixed) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.strokeRect(slotX(j) + 1.5, slotY(j) + 1.5, cell - 3, cell - 3); }
      ctx.fillStyle = "rgba(13,8,34,0.55)"; ctx.fillRect(slotX(dragging), slotY(dragging), cell, cell);
    }
    if (cursor >= 0 && state === "play") { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.strokeRect(slotX(cursor) + 2, slotY(cursor) + 2, cell - 4, cell - 4); ctx.setLineDash([]); }
    // the lifted tile on top of everything
    const up = dragging >= 0 ? dragging : sel;
    if (up >= 0 && slots[up]) {
      const t = slots[up], x = dragging >= 0 ? press.x - cell / 2 : t.px, y = dragging >= 0 ? press.y - cell / 2 - (touchMode ? cell * 0.5 : 0) : t.py;
      const sc = 1.16 + 0.03 * Math.sin(clock * 6), s = cell * sc, o = (cell - s) / 2;
      ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
      ctx.fillStyle = t.color; ctx.fillRect(x + o, y + o, s, s);
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.strokeRect(x + o, y + o, s, s);
    }
  }
  function drawHud() {
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, TOP - 4);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#f1eeff"; ctx.font = "900 18px system-ui"; ctx.fillText(nf(score), 12, 16);
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${nf(Math.max(bestCache, score))}`, 12, 36);
    ctx.textAlign = "center"; ctx.fillStyle = "#ff9be0"; ctx.font = "900 12px system-ui"; ctx.fillText(`LIVELLO ${level + 1}`, W / 2, 14);
    const noise = movable && budget ? Math.round(misplaced() / movable * 100) : 0;
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 10px system-ui"; ctx.fillText(`rumore ${noise}%`, W / 2, 34);
    const ex = touchMode ? W - 62 : W - 12;
    ctx.textAlign = "right"; ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText("SCAMBI", ex, 12);
    ctx.fillStyle = !budget ? "#a9a3cf" : left <= 3 ? "#ff6b7d" : "#ffd66b"; ctx.font = "900 20px system-ui"; ctx.fillText(budget ? String(left) : "–", ex, 32);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(0, TOP - 4, W, 4);
    if (budget) { ctx.fillStyle = left <= 3 ? "#ff6b7d" : "#ffd66b"; ctx.fillRect(0, TOP - 4, W * left / budget, 4); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, H);
    drawGrid();
    if (state === "menu") return;
    drawHud();
    for (const p of popups) {
      ctx.globalAlpha = clamp((1.8 - p.t) * 2, 0, 1);
      ctx.textAlign = "center"; ctx.font = "900 14px system-ui";
      ctx.lineWidth = 4; ctx.strokeStyle = "#0d0822"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = Math.min(1, (2 - message.t) * 2);
      ctx.fillStyle = "rgba(13,8,34,0.78)"; ctx.fillRect(0, 330, W, 62);
      ctx.textAlign = "center"; ctx.font = "900 24px system-ui"; ctx.fillStyle = "#ff9be0";
      ctx.fillText(message.text, W / 2, 358);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f1eeff"; ctx.fillText(message.sub, W / 2, 380); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  buildLevel();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="caos-best-" data-kind="score"></script>

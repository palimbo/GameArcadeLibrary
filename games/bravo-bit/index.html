<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bravo, Bit!</title>
<style>
  :root {
    --bg: #0d0822;
    --fg: #f1eeff;
    --muted: #a9a3cf;
    --cyan: #5fe3d6;
    --yellow: #ffd66b;
    --red: #ff6b7d;
    --pink: #8fe36b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1f55, 0 10px 40px rgba(0,0,0,0.6); cursor: pointer; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(241, 238, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(13, 8, 34, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 54px); font-weight: 900; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #2a1f6a, 0 0 22px rgba(143,227,107,0.35); text-wrap: balance; }
  #overlay h2 { font-size: clamp(24px, 7vw, 40px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(241,238,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #0c2406; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #5a9a3f; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TOP = 56, TAU = Math.PI * 2;
  const ACC = "#8fe36b";
  const MOVES = ["SIEDE", "SALTA", "GIRA", "ABBAIA", "ZAMPA", "ROTOLA"];
  const MCOL = ["#6bb8ff", "#ffd66b", "#ff9be0", "#ff9a6b", "#5fe3d6", "#b79bff"];
  const LR = 2, NR = 2.5;                          // how much a biscuit, and a "no", change Bit's mind
  const BTN = { x: 172, y: 486, w: 174, h: 66 }, NOB = { x: 14, y: 486, w: 150, h: 66 };
  // per trick length: how many moves Bit has, and how many times the trick must come out
  const PLAN = [null, { turns: 30, goal: 10 }, { turns: 55, goal: 7 }, { turns: 95, goal: 5 }];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "tanti biscotti e tanti «no», Bit va piano · 4 errori concessi", treats: 12, nos: 12, pace: 1.25, lives: 4 },
    normale:   { label: "NORMALE",   color: "#ffd66b", desc: "biscotti e «no» contati · 3 errori concessi", treats: 9, nos: 9, pace: 1.05, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff6b7d", desc: "pochi biscotti, pochi «no», Bit va svelto · 3 errori concessi", treats: 7, nos: 6, pace: 0.85, lives: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "bit-difficulty";
  const bestKey = (id) => `bit-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => n.toLocaleString("it-IT");

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio: soft tones ----------
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.05, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type, vol) => notes.forEach((f, i) => beep(f, d, type, vol, i * gap));
  const sfx = {
    pick: () => beep(520, 0.06, "sine", 0.035),
    step: (v) => beep(392 * Math.pow(1.09, v), 0.09, "triangle", 0.04),
    edge: () => beep(150, 0.08, "sine", 0.045),
    row: () => beep(880, 0.1, "sine", 0.03, 0.05),
    win: () => arp([523, 659, 784, 1047], 0.09, 0.35),
    perfect: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.4),
    fail: () => arp([392, 330, 277], 0.14, 0.35, "triangle", 0.05),
    lose: () => arp([392, 330, 277, 220], 0.16, 0.4, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, level = 0, bestCache = 0, cleared = 0, lives = 0;
  let n = 4, trick = [], prefs = [], hist = [], since = 0, match = 0, done = 0, goal = 0, left = 0, turns = 0, treats = 0, treats0 = 0, nos = 0, nos0 = 0, said = 0;
  let actT = 0, dur = 1, fed = false, crumbs = [], cheer = 0;
  let popups = [], message = null;
  const isPlaying = () => ["play", "levelup", "fail"].includes(state);

  // ---------- Bit's mind ----------
  // what Bit is inclined to do next, given what it has just done
  function probs() {
    const prev = hist.length ? hist[hist.length - 1] : n, w = Array.from({ length: n }, (_, a) => Math.exp(prefs[prev][a])), s = w.reduce((x, y) => x + y, 0);
    return w.map((x) => x / s);
  }
  function buildLevel() {
    const len = level < 2 ? 1 : level < 5 ? 2 : 3;
    n = [4, 5, 4, 4, 5, 4, 4][level] || 5;
    // no move twice in a row, and the trick does not end where it starts
    trick = []; while (trick.length < len) { const a = rint(0, n - 1); if (trick[trick.length - 1] !== a && !(len > 1 && trick.length === len - 1 && a === trick[0])) trick.push(a); }
    prefs = Array.from({ length: n + 1 }, () => Array(n).fill(0));
    hist = []; since = 0; match = 0; done = 0; crumbs = [];
    goal = PLAN[len].goal + Math.min(3, Math.max(0, Math.floor((level - 7) / 3))) - (len === 1 && n === 5 ? 1 : 0);
    left = turns = PLAN[len].turns;
    treats0 = treats = Math.max(5, diff.treats - Math.max(0, Math.floor((level - 8) / 3)));
    nos0 = nos = len === 1 ? 0 : Math.max(4, diff.nos + (len - 2) * 2 - Math.max(0, Math.floor((level - 8) / 3)));
    dur = Math.max(0.6, diff.pace - level * 0.015); actT = 0; fed = false;
  }
  function act() {
    const p = probs(); let r = Math.random(), a = 0;
    while (a < n - 1 && r >= p[a]) r -= p[a++];
    hist.push(a); left--; actT = 0; fed = false;
    // how much of the trick the latest moves make up
    match = 0;
    for (let k = Math.min(trick.length, hist.length - since); k > 0; k--) { let ok = true; for (let i = 0; i < k && ok; i++) ok = hist[hist.length - k + i] === trick[i]; if (ok) { match = k; break; } }
    if (match === trick.length) { done++; since = hist.length; cheer = 1; sfx.row(); }
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; level = 0; cleared = 0; lives = diff.lives; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    state = "play"; act();
    message = { text: `IL NUMERO: ${trick.map((a) => MOVES[a]).join(" → ")}`, sub: `deve riuscire ${goal} volte in ${turns} mosse`, t: 0 };
  }
  function addScore(k, y, color, label = "") { score += k; popups.push({ text: `${label}+${nf(k)}`, x: W / 2, y, t: 0, color }); }
  // a biscuit: the move just made becomes more likely after the one before it, and a little the two before too
  function reward() {
    if (state !== "play" || fed) return;
    if (treats <= 0) { sfx.edge(); return; }
    treats--; fed = true;
    for (let k = 0; k < 3; k++) {
      const i = hist.length - 1 - k; if (i < 0) break;
      const a = hist[i], prev = i > 0 ? hist[i - 1] : n, f = LR * Math.pow(0.5, k);
      prefs[prev][a] += f;
    }
    crumbs.push({ x: 0, y: -90, t: 0 });
    sfx.step(2);
  }
  // a "no": the move just made becomes much less likely after the one before it
  function scold() {
    if (state !== "play" || fed || nos0 === 0) return;
    if (nos <= 0) { sfx.edge(); return; }
    nos--; fed = true; said = 1;
    const i = hist.length - 1;
    prefs[i > 0 ? hist[i - 1] : n][hist[i]] -= NR;
    sfx.edge();
  }
  // the end of a move: is the level decided, or does Bit go on?
  function advance() {
    if (state !== "play") return;
    if (done >= goal) {
      state = "levelup"; stateT = 2.8; cleared++;
      addScore(250 * (level + 1), 440, ACC);
      if (left > 0) addScore(30 * left, 418, "#ffd66b", `${left} ${left === 1 ? "mossa avanzata" : "mosse avanzate"} · `);
      if (treats + nos > 0) addScore(40 * (treats + nos), 396, "#5fe3d6", `${treats} biscotti e ${nos} «no» avanzati · `);
      sfx.win();
      message = { text: "BRAVO, BIT!", sub: `il numero è riuscito ${done} volte`, t: 0 };
    } else if (left <= 0) {
      lives--;
      state = "fail"; stateT = 2.8;
      (lives > 0 ? sfx.fail : sfx.lose)();
      message = { text: "BIT NON HA CAPITO", sub: `il numero è riuscito ${done} volte su ${goal}`, t: 0, bad: true };
    } else act();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">BIT VA A NANNA</h2>
       <p>Punteggio: <b>${nf(score)}</b> · ${cleared} ${cleared === 1 ? "numero imparato" : "numeri imparati"} · ${diff.label}</p>
       <p class="muted">Si chiama apprendimento per rinforzo: nessuno spiega cosa fare, arriva solo un premio ogni tanto, e bisogna capire da soli a che cosa era dovuto.</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPROVA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (state === "menu") buildLevel(); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>BRAVO, BIT!</h1>
       <p>Bit è un cucciolo robot e non capisce le parole: fa una mossa dopo l'altra, a caso. Tu hai dei biscotti e qualche «no». Un biscotto subito dopo una mossa e Bit la rifarà più spesso, in quella stessa situazione; un «no» e la farà molto meno. Con pochi premi e pochi rimproveri deve imparare un numero intero: prima una mossa, poi due di fila, poi tre.</p>
       <div class="pts">
         <span><b>Biscotto</b></span><span>premia la mossa appena fatta, e un po' anche le due prima</span>
         <span><b>No!</b></span><span>quando Bit comincia bene e poi sbaglia il seguito, diglielo: quella strada la prenderà di meno</span>
         <span><b>La testa di Bit</b></span><span>le barre mostrano cosa farà più probabilmente adesso</span>
         <span><b>Punti</b></span><span>250 × livello · 30 per ogni mossa avanzata · 40 per ogni biscotto o «no» avanzato</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tocca BISCOTTO o NO mentre Bit fa la mossa: una cosa sola per mossa</p>`
         : `<p class="muted help">Spazio o → per il biscotto, N o ← per il «no», mentre Bit fa la mossa · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>PRIMO NUMERO</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if ((k === " " || k === "enter" || k === "arrowright") && !e.repeat) reward();
    else if ((k === "n" || k === "arrowleft" || k === "x") && !e.repeat) scold();
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  const toWorld = (e) => { const rc = canvas.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * W, y: (e.clientY - rc.top) / rc.height * H }; };
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); if (state !== "play") return; const p = toWorld(e); if (p.y < BTN.y - 8) return; if (p.x < BTN.x - 4) scold(); else reward(); });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const p of popups) { p.t += dt; p.y -= 14 * dt; }
    popups = popups.filter((p) => p.t < 1.8);
    for (const c of crumbs) c.t += dt * 2.2;
    crumbs = crumbs.filter((c) => c.t < 1);
    cheer = Math.max(0, cheer - dt * 1.6); said = Math.max(0, said - dt * 1.5);
    if (message) { message.t += dt; if (message.t > (state === "play" ? 2.4 : 2.8)) message = null; }
    if (state === "play") { actT += dt / dur; if (actT >= 1) advance(); }
    else if (state === "levelup") { stateT -= dt; if (stateT <= 0) { level++; beginLevel(); } }
    else if (state === "fail") { stateT -= dt; if (stateT <= 0) { if (lives <= 0) gameOver(); else beginLevel(); } }
  }

  // ---------- Drawing ----------
  // Bit, doing move a, t from 0 to 1 along it
  function drawBit(x, y, a, t) {
    const e = Math.sin(Math.PI * clamp(t, 0, 1)), body = "#d7dcff", dark = "#8f96d6";
    let dy = 0, rot = 0, sx = 1, paw = 0, bark = 0, sit = 0;
    if (a === 0) sit = e; else if (a === 1) dy = -52 * e; else if (a === 2) sx = Math.cos(TAU * t); else if (a === 3) bark = e; else if (a === 4) paw = e; else if (a === 5) rot = TAU * t;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, y + 30, 46 * (1 + dy / 140), 7, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(x, y + dy + sit * 6 - (a === 5 ? 14 * e : 0)); ctx.rotate(rot - sit * 0.3); ctx.scale(sx || 0.02, 1);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-34, -4); ctx.quadraticCurveTo(-52, -12 - Math.sin(clock * 9) * 6, -48, -28); ctx.stroke();
    ctx.fillStyle = dark;
    for (const lx of [-24, 18]) { const up = lx > 0 ? paw : 0; ctx.save(); ctx.translate(lx, 14); ctx.rotate(-up * 1.4); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 18 - sit * (lx < 0 ? 8 : 0), 4); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(-36, -18, 68, 36, 14); ctx.fill();
    ctx.fillStyle = MCOL[a]; ctx.beginPath(); ctx.arc(-8, 0, 6, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(30, -30); ctx.rotate(-bark * 0.35);
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-20, -32); ctx.lineTo(-4, -20); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, -16); ctx.lineTo(16, -32); ctx.lineTo(2, -20); ctx.fill();
    ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(-20, -22, 42, 38, 13); ctx.fill();
    ctx.fillStyle = "#0d0822"; ctx.beginPath(); ctx.arc(-4, -5, 3.5, 0, TAU); ctx.arc(12, -5, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#0d0822"; ctx.beginPath(); ctx.ellipse(4, 6, 6, 1.5 + bark * 6 + cheer * 2, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
    if (bark > 0.2) { ctx.fillStyle = MCOL[3]; ctx.font = "900 15px system-ui"; ctx.textAlign = "center"; ctx.fillText("BAU!", x + 78, y - 56 - bark * 8); }
  }
  function drawStage() {
    ctx.fillStyle = "#120b2c"; ctx.beginPath(); ctx.roundRect(8, 62, W - 16, 216, 12); ctx.fill();
    ctx.fillStyle = "#1a1240"; ctx.fillRect(8, 232, W - 16, 46); ctx.beginPath(); ctx.roundRect(8, 250, W - 16, 28, [0, 0, 12, 12]); ctx.fill();
    const a = hist.length ? hist[hist.length - 1] : 0;
    drawBit(170, 204, a, state === "play" ? actT : 1);
    for (const c of crumbs) { ctx.fillStyle = "#e8b87a"; ctx.beginPath(); ctx.arc(200 + c.x, 204 - 80 * (1 - c.t) - 20, 7 * (1 - c.t * 0.5), 0, TAU); ctx.fill(); ctx.fillStyle = "#8a5a2a"; ctx.beginPath(); ctx.arc(198, 204 - 80 * (1 - c.t) - 22, 1.6, 0, TAU); ctx.fill(); }
    if (state === "menu") return;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = MCOL[a]; ctx.font = "900 22px system-ui"; ctx.fillText(MOVES[a], W / 2, 86);
    if (fed) { ctx.fillStyle = said ? "#ff6b7d" : "#e8b87a"; ctx.font = "800 10px system-ui"; ctx.fillText(said ? "no!" : "premiata", W / 2, 104); }
    if (said > 0) { ctx.globalAlpha = said; ctx.fillStyle = "#ff6b7d"; ctx.font = "900 30px system-ui"; ctx.fillText("NO!", 70, 150 - (1 - said) * 14); ctx.globalAlpha = 1; }
    // the latest moves, oldest on the left
    const recent = hist.slice(-9, -1);
    recent.forEach((m, i) => { ctx.globalAlpha = 0.25 + 0.6 * (i + 1) / recent.length; ctx.fillStyle = MCOL[m]; ctx.font = "800 8px system-ui"; ctx.fillText(MOVES[m], 30 + (i + 0.5) * 38, 264); });
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }
  function drawTrick() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.textAlign = "left"; ctx.fillText("IL NUMERO DA IMPARARE", 14, 292);
    ctx.textAlign = "right"; ctx.fillStyle = done >= goal ? "#7ee0a0" : "#f1eeff"; ctx.font = "800 11px system-ui"; ctx.fillText(`riuscito ${done} di ${goal}`, W - 14, 292);
    const L = trick.length, cw = 92, x0 = W / 2 - (L * cw + (L - 1) * 14) / 2;
    trick.forEach((a, i) => {
      const x = x0 + i * (cw + 14), lit = i < match || cheer > 0;
      ctx.fillStyle = lit ? MCOL[a] : "#1a1240"; ctx.strokeStyle = MCOL[a]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x, 304, cw, 30, 9); ctx.fill(); ctx.stroke();
      ctx.textAlign = "center"; ctx.fillStyle = lit ? "#0d0822" : "#f1eeff"; ctx.font = "900 13px system-ui"; ctx.fillText(MOVES[a], x + cw / 2, 319.5);
      if (i < L - 1) { ctx.fillStyle = "#a9a3cf"; ctx.fillText("→", x + cw + 7, 319); }
    });
    // Bit's mind: how likely each move is as the next one
    const p = probs(), bw = (W - 28) / n, want = trick[match % trick.length];
    ctx.textAlign = "left"; ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText("LA TESTA DI BIT · cosa farà adesso, più o meno", 14, 352);
    for (let a = 0; a < n; a++) {
      const x = 14 + a * bw + 3, w = bw - 6, h = 62;
      ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(x, 364, w, h);
      ctx.fillStyle = MCOL[a]; ctx.fillRect(x, 364 + h * (1 - p[a]), w, h * p[a]);
      if (a === want) { ctx.strokeStyle = "#f1eeff"; ctx.lineWidth = 1.5; ctx.strokeRect(x - 1.5, 362.5, w + 3, h + 3); }
      ctx.textAlign = "center"; ctx.fillStyle = a === want ? "#f1eeff" : "#a9a3cf"; ctx.font = `800 ${n > 5 ? 8 : 9}px system-ui`; ctx.fillText(MOVES[a], x + w / 2, 364 + h + 11);
      ctx.fillStyle = "#f1eeff"; ctx.font = "800 9px system-ui"; ctx.fillText(`${Math.round(p[a] * 100)}%`, x + w / 2, 364 + h + 24);
    }
    ctx.textBaseline = "alphabetic";
  }
  function drawControls() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const dots = (b, n0, k, colOn, colIn) => { const gap = Math.min(16, (b.w - 24) / Math.max(1, n0)); for (let i = 0; i < n0; i++) { const x = b.x + b.w / 2 + (i - (n0 - 1) / 2) * gap; ctx.fillStyle = i < k ? colOn : "rgba(0,0,0,0.22)"; ctx.beginPath(); ctx.arc(x, b.y + 44, 5, 0, TAU); ctx.fill(); if (i < k && colIn) { ctx.fillStyle = colIn; ctx.beginPath(); ctx.arc(x, b.y + 44, 3.5, 0, TAU); ctx.fill(); } } };
    let b = BTN, on = state === "play" && !fed && treats > 0;
    ctx.globalAlpha = on ? 1 : 0.35;
    ctx.fillStyle = "#5a9a3f"; ctx.beginPath(); ctx.roundRect(b.x, b.y + 6, b.w, b.h - 6, 14); ctx.fill();
    ctx.fillStyle = ACC; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h - 7, 14); ctx.fill();
    ctx.fillStyle = "#0c2406"; ctx.font = "900 18px system-ui"; ctx.fillText(treats > 0 ? "BISCOTTO!" : "FINITI", b.x + b.w / 2, b.y + 22);
    dots(b, treats0, treats, "#8a5a2a", "#e8b87a");
    b = NOB; on = state === "play" && !fed && nos > 0;
    ctx.globalAlpha = nos0 === 0 ? 0.15 : on ? 1 : 0.35;
    ctx.fillStyle = "#a8404e"; ctx.beginPath(); ctx.roundRect(b.x, b.y + 6, b.w, b.h - 6, 14); ctx.fill();
    ctx.fillStyle = "#ff6b7d"; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h - 7, 14); ctx.fill();
    ctx.fillStyle = "#2a0610"; ctx.font = "900 18px system-ui"; ctx.fillText(nos0 === 0 ? "NO" : nos > 0 ? "NO!" : "FINITI", b.x + b.w / 2, b.y + 22);
    dots(b, nos0, nos, "#2a0610");
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 10px system-ui";
    if (state === "play") ctx.fillText(match > 0 && match < trick.length ? `ha cominciato bene: ora serve ${MOVES[trick[match]]}` : nos0 === 0 ? "premia la mossa mentre la sta facendo" : "una cosa sola per mossa: biscotto oppure no", W / 2, 572);
    ctx.textBaseline = "alphabetic";
  }
  function drawHud() {
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, TOP - 4);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#f1eeff"; ctx.font = "900 18px system-ui"; ctx.fillText(nf(score), 12, 16);
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${nf(Math.max(bestCache, score))}`, 12, 36);
    ctx.textAlign = "center"; ctx.fillStyle = ACC; ctx.font = "900 12px system-ui"; ctx.fillText(`LIVELLO ${level + 1}`, W / 2, 14);
    ctx.fillStyle = left <= 8 ? "#ff6b7d" : "#ffd66b"; ctx.font = "800 11px system-ui"; ctx.fillText(`${left} ${left === 1 ? "mossa" : "mosse"} · ${treats} biscotti${nos0 ? ` · ${nos} no` : ""}`, W / 2, 34);
    const ex = touchMode ? W - 62 : W - 12;
    for (let i = 0; i < diff.lives; i++) { ctx.fillStyle = i < lives ? "#ffd66b" : "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(ex - 6 - i * 13, 16, 4.5, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(0, TOP - 4, W, 4);
    ctx.fillStyle = left <= 8 ? "#ff6b7d" : "#ffd66b"; ctx.fillRect(0, TOP - 4, W * (left + 1 - (state === "play" ? actT : 0)) / (turns || 1), 4);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, H);
    drawStage();
    if (state === "menu") return;
    drawTrick();
    drawControls();
    drawHud();
    for (const p of popups) {
      ctx.globalAlpha = clamp((1.8 - p.t) * 2, 0, 1);
      ctx.textAlign = "center"; ctx.font = "900 14px system-ui";
      ctx.lineWidth = 4; ctx.strokeStyle = "#0d0822"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = Math.min(1, ((state === "play" ? 2.4 : 2.8) - message.t) * 2);
      ctx.fillStyle = "rgba(13,8,34,0.92)"; ctx.fillRect(0, 224, W, 58);
      ctx.textAlign = "center"; ctx.font = `900 ${message.text.length > 28 ? 14 : 19}px system-ui`; ctx.fillStyle = message.bad ? "#ff6b7d" : ACC;
      ctx.fillText(message.text, W / 2, 249);
      if (message.sub) { ctx.font = "800 11px system-ui"; ctx.fillStyle = "#f1eeff"; ctx.fillText(message.sub, W / 2, 269); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  buildLevel();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="bit-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scie di Luce</title>
<style>
  :root {
    --bg: #04060f;
    --fg: #eef6ff;
    --muted: #9fb0cc;
    --p1: #3de0ff;
    --p2: #ffb03a;
    --bad: #ff5a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap.top { align-items: flex-start; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  canvas { display: block; touch-action: none; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(4, 6, 15, 0.7); border: 1px solid rgba(238, 246, 255, 0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 8px; pointer-events: auto; }
  #touch .cl[data-p="1"] { display: none; }
  #touch.versus .cl[data-p="1"] { display: flex; }
  #touch button {
    width: 64px; height: 64px; border-radius: 16px; touch-action: none;
    font: 700 26px system-ui, sans-serif; color: var(--fg);
    border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, transparent);
  }
  #touch.small button { width: 54px; height: 54px; font-size: 22px; }
  #touch.versus.narrow button { width: calc((100vw - 24px - 48px) / 6); height: calc((100vw - 24px - 48px) / 6); font-size: 22px; }
  #touch button.on { background: color-mix(in srgb, var(--c) 55%, transparent); }
  #touch button[data-a="boost"] { font-size: 22px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 6, 15, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 {
    font-size: clamp(38px, 9vw, 64px); letter-spacing: 3px; line-height: 1.05;
    color: var(--p1); text-shadow: 0 0 14px rgba(61,224,255,0.8), 0 0 40px rgba(61,224,255,0.4);
  }
  #overlay h2 { font-size: clamp(28px, 7vw, 46px); }
  #overlay h2.win { color: var(--p1); }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(238,246,255,0.3); border-radius: 8px; padding: 8px 16px;
  }
  #overlay .row button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { background: var(--p1); border-color: var(--p1); color: #031820; padding: 10px 28px; }
  #overlay .keys { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 14px; color: var(--muted); text-align: left; }
  #overlay .keys b { color: var(--fg); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 34px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl" data-p="0" style="--c:#3de0ff">
    <button type="button" data-p="0" data-a="left" aria-label="Gira a sinistra">⟲</button>
    <button type="button" data-p="0" data-a="boost" aria-label="Turbo">⚡</button>
    <button type="button" data-p="0" data-a="right" aria-label="Gira a destra">⟳</button>
  </div>
  <div class="cl" data-p="1" style="--c:#ffb03a">
    <button type="button" data-p="1" data-a="left" aria-label="Giocatore 2: gira a sinistra">⟲</button>
    <button type="button" data-p="1" data-a="boost" aria-label="Giocatore 2: turbo">⚡</button>
    <button type="button" data-p="1" data-a="right" aria-label="Giocatore 2: gira a destra">⟳</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  // ---------- Arena ----------
  const N = 56, CELL = 10, HUD = 40, W = N * CELL, H = HUD + N * CELL;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
  const COLORS = ["#3de0ff", "#ffb03a", "#ff5ad9", "#7dff9a"];
  const NAMES = ["TU", "G2", "ROSA", "VERDE"];
  const SPAWNS = [
    { x: 14, y: 42, d: 0 }, { x: 41, y: 13, d: 2 }, { x: 13, y: 13, d: 1 }, { x: 42, y: 42, d: 3 },
  ];
  const BOOST_MAX = 1.6, BOOST_MUL = 1.85;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · moto più lente · il computer sbaglia spesso", lives: 5, speed: 0.85, ai: 0 },
    normale:   { label: "NORMALE",   color: "#3de0ff", desc: "3 vite · il computer pensa prima di girare", lives: 3, speed: 1, ai: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a6a", desc: "3 vite · moto veloci · il computer ti taglia la strada e usa il turbo", lives: 3, speed: 1.15, ai: 2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "scie-difficulty", MODE_KEY = "scie-mode";
  const bestKey = (id) => `scie-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, scale = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("versus", mode === "versus");
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    touchEl.classList.toggle("narrow", window.innerWidth < 6 * 64 + 90);
    wrap.classList.toggle("top", showTouch && portrait);
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch) {
      const r = touchEl.querySelector(".cl").getBoundingClientRect();
      if (portrait) availH -= r.height + 36;
      else availW -= 2 * (r.width + 24);
    }
    scale = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, scale * (window.devicePixelRatio || 1));
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, hum = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.045) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    turn: () => beep(700, 0.03, "square", 0.015),
    boost: () => beep(300, 0.25, "sawtooth", 0.03, 500),
    crash: () => { beep(200, 0.4, "sawtooth", 0.06, -150); beep(90, 0.5, "square", 0.05, -40, 0.03); },
    count: () => beep(660, 0.12, "square", 0.04),
    go: () => beep(1320, 0.25, "square", 0.05),
    win: () => arp([523, 659, 784, 1047], 0.09, 0.16),
    lose: () => arp([440, 349, 262], 0.14, 0.22),
    over: () => arp([523, 415, 330, 262, 196], 0.16, 0.26),
  };
  function humOn(on) {
    if (!audioCtx) return;
    if (on && !hum) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sawtooth"; o.frequency.value = 55; g.gain.value = 0.012;
      o.connect(g).connect(audioCtx.destination); o.start(); hum = { o, g };
    } else if (!on && hum) { hum.o.stop(); hum = null; }
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let mode = load(MODE_KEY) === "versus" ? "versus" : "solo";
  let state = "menu", menu = null, pausedFrom = null, stateT = 0;
  let grid = new Int8Array(N * N), bikes = [], particles = [], popups = [];
  let round = 1, lives = 3, score = 0, bestCache = 0, tally = [0, 0], roundT = 0, stepId = 0, clock = 0, lastWinner = -2;
  const idx = (x, y) => y * N + x;
  const free = (x, y) => x >= 0 && y >= 0 && x < N && y < N && grid[idx(x, y)] === 0;

  function baseSpeed() {
    const s = mode === "versus" ? 11 : 10 + Math.min(round, 10) * 0.5;
    return s * diff.speed;
  }
  function startRound() {
    grid.fill(0);
    particles = []; popups = [];
    const n = mode === "versus" ? 2 : 1 + Math.min(3, 1 + Math.floor((round - 1) / 2));
    const order = mode === "versus" ? [0, 1] : [0, 1, 2, 3].slice(0, n);
    bikes = order.map((slot, i) => {
      const sp = SPAWNS[slot];
      const human = i === 0 || (mode === "versus" && i === 1);
      const color = mode === "versus" ? COLORS[i] : i === 0 ? COLORS[0] : COLORS[1 + ((i - 1) % 3)];
      const b = { i, x: sp.x, y: sp.y, px: sp.x, py: sp.y, d: sp.d, alive: true, human, color, name: mode === "versus" ? (i ? "G2" : "G1") : i ? "CPU" : "TU",
        path: [[sp.x, sp.y]], acc: 0, queue: [], boost: BOOST_MAX, boosting: 0, fade: 0, lastStep: -1, cells: 0 };
      grid[idx(sp.x, sp.y)] = i + 1;
      return b;
    });
    roundT = 0;
    state = "countdown"; stateT = 2.4;
    last = performance.now();
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    round = 1; lives = diff.lives; score = 0; tally = [0, 0];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    menu = null;
    overlay.classList.add("hidden");
    startRound();
    syncControls();
  }

  // ---------- Bikes ----------
  function turn(b, rel) { if (b.alive) { b.queue.push({ rel }); if (b.queue.length > 3) b.queue.shift(); } }
  function steer(b, abs) {
    if (!b.alive) return;
    const lastD = b.queue.length && b.queue[b.queue.length - 1].abs !== undefined ? b.queue[b.queue.length - 1].abs : b.d;
    if (abs === lastD || (abs + 2) % 4 === lastD) return;
    b.queue.push({ abs }); if (b.queue.length > 3) b.queue.shift();
  }
  function boost(b) {
    if (!b.alive || b.boosting > 0 || b.boost < 0.5) return;
    b.boosting = Math.min(b.boost, 0.9);
    sfx.boost();
  }
  function crash(b) {
    b.alive = false; b.fade = 0.9;
    for (let k = 0; k < 26; k++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 200;
      particles.push({ x: (b.x + 0.5) * CELL, y: HUD + (b.y + 0.5) * CELL, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5 + Math.random() * 0.6, color: b.color });
    }
    sfx.crash();
    if (mode === "solo" && b.i !== 0 && bikes[0].alive) { score += 200; popups.push({ x: (b.x + 0.5) * CELL, y: HUD + b.y * CELL, text: "+200", color: "#ffd34d", t: 0 }); }
  }
  function stepBike(b) {
    // apply one queued turn per cell
    while (b.queue.length) {
      const q = b.queue.shift();
      const nd = q.abs !== undefined ? q.abs : (b.d + (q.rel === "left" ? 3 : 1)) % 4;
      if ((nd + 2) % 4 === b.d || nd === b.d) continue;
      b.d = nd; if (b.human) sfx.turn();
      break;
    }
    const [dx, dy] = DIRS[b.d];
    const nx = b.x + dx, ny = b.y + dy;
    b.px = b.x; b.py = b.y;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) { crash(b); return; }
    const o = grid[idx(nx, ny)];
    if (o !== 0) {
      // head-on: the other bike moved into this very cell during this step
      const other = bikes[o - 1];
      if (other && other.alive && other.x === nx && other.y === ny && other.lastStep === stepId) crash(other);
      b.x = nx; b.y = ny;
      crash(b);
      return;
    }
    b.x = nx; b.y = ny; b.lastStep = stepId;
    grid[idx(nx, ny)] = b.i + 1;
    const lastPt = b.path[b.path.length - 1];
    if (b.path.length >= 2) {
      const prev = b.path[b.path.length - 2];
      if ((prev[0] === lastPt[0] && lastPt[0] === nx) || (prev[1] === lastPt[1] && lastPt[1] === ny)) { lastPt[0] = nx; lastPt[1] = ny; }
      else b.path.push([nx, ny]);
    } else b.path.push([nx, ny]);
    b.cells++;
    if (mode === "solo" && b.i === 0) score += 1;
  }

  // ---------- Computer players ----------
  function area(sx, sy, limit) {
    if (!free(sx, sy)) return 0;
    const seen = new Uint8Array(N * N), q = [idx(sx, sy)];
    seen[q[0]] = 1;
    let n = 0;
    while (n < q.length && q.length < limit) {
      const c = q[n++], x = c % N, y = (c / N) | 0;
      for (const [dx, dy] of DIRS) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= N || yy >= N) continue;
        const k = idx(xx, yy);
        if (!seen[k] && grid[k] === 0) { seen[k] = 1; q.push(k); }
      }
    }
    return q.length;
  }
  function thinkCPU(b) {
    const opts = [b.d, (b.d + 3) % 4, (b.d + 1) % 4];
    const ai = diff.ai;
    const target = bikes[0].alive ? bikes[0] : bikes.find((o) => o.alive && o !== b);
    let best = null;
    for (const d of opts) {
      const nx = b.x + DIRS[d][0], ny = b.y + DIRS[d][1];
      if (!free(nx, ny)) continue;
      let s;
      if (ai === 0 && Math.random() < 0.55) s = Math.random() * 50;
      else s = area(nx, ny, ai === 0 ? 60 : 700);
      // avoid cells right next to another head (possible head-on)
      for (const o of bikes) if (o !== b && o.alive && Math.abs(o.x + DIRS[o.d][0] - nx) + Math.abs(o.y + DIRS[o.d][1] - ny) === 0) s -= 400;
      if (d === b.d) s += 3;
      if (ai === 2 && target && target !== b) {
        // cut off: aim a few cells ahead of the target's head
        const tx = target.x + DIRS[target.d][0] * 6, ty = target.y + DIRS[target.d][1] * 6;
        s -= (Math.abs(tx - nx) + Math.abs(ty - ny)) * 0.8;
      }
      if (ai === 0) s += Math.random() * 20;
      if (!best || s > best.s) best = { d, s };
    }
    if (best && best.d !== b.d) b.queue = [{ abs: best.d }];
    if (ai === 2 && target && b.boost > 1.2 && Math.abs(target.x - b.x) + Math.abs(target.y - b.y) < 14 && Math.random() < 0.05) boost(b);
  }

  // ---------- Flow ----------
  const isPlaying = () => ["countdown", "playing", "roundover"].includes(state);
  function endRound() {
    const alive = bikes.filter((b) => b.alive);
    state = "roundover"; stateT = 2.4;
    humOn(false);
    if (mode === "versus") {
      if (alive.length === 1) { tally[alive[0].i]++; lastWinner = alive[0].i; sfx.win(); } else { lastWinner = -1; sfx.lose(); }
      return;
    }
    if (bikes[0].alive) {
      const bonus = 500 * round;
      score += bonus; lastWinner = 0;
      popups.push({ x: W / 2, y: HUD + N * CELL * 0.6, text: `+${bonus} vittoria`, color: "#ffd34d", t: 0 });
      sfx.win();
    } else if (alive.length === 0) { lastWinner = -1; sfx.lose(); }
    else { lastWinner = 1; lives--; sfx.lose(); }
  }
  function afterRound() {
    if (mode === "versus") {
      if (tally[0] >= 3 || tally[1] >= 3) { versusOver(); return; }
      round++; startRound(); return;
    }
    if (lives <= 0) { gameOver(); return; }
    if (lastWinner === 0) round++;
    startRound();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, reached = round;
    menu = () => showOverlay(
      `<h2 class="lose">FINE CORSA</h2>
       <p>Sei arrivato al round ${reached}.</p>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${played}</p>
       ${record ? "<p style='color:#ffd34d'>★ NUOVO RECORD! ★</p>" : ""}
       ${modeHTML()}${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function versusOver() {
    state = "over";
    const w = tally[0] > tally[1] ? 0 : 1;
    menu = () => showOverlay(
      `<h2 style="color:${COLORS[w]}">VINCE IL GIOCATORE ${w + 1}!</h2>
       <p>Risultato: <b style="color:${COLORS[0]}">${tally[0]}</b> – <b style="color:${COLORS[1]}">${tally[1]}</b></p>
       ${modeHTML()}${difficultyHTML()}
       <button class="start" data-start>RIVINCITA</button>`
    );
    menu();
    sfx.win();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; humOn(false);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
      if (state === "playing") humOn(true);
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(100px + env(safe-area-inset-bottom, 0px))", right: "14px" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function modeHTML() {
    return `<div class="row">
      <button type="button" data-mode="solo" class="${mode === "solo" ? "on" : ""}" style="--c:#3de0ff">1 GIOCATORE</button>
      <button type="button" data-mode="versus" class="${mode === "versus" ? "on" : ""}" style="--c:#ffb03a">2 GIOCATORI</button>
    </div>`;
  }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    const desc = mode === "versus" ? `Sfida al meglio dei 5 round (vince chi arriva a 3) · la difficoltà cambia la velocità` : `${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}`;
    return `<div class="row">${buttons}</div><p class="muted">${desc}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function setMode(m) { mode = m; store(MODE_KEY, m); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    const keys = mode === "versus"
      ? `<div class="keys"><span><b style="color:#3de0ff">Giocatore 1</b></span><span>W A S D · turbo Q</span><span><b style="color:#ffb03a">Giocatore 2</b></span><span>frecce · turbo INVIO o L</span></div>`
      : `<p class="muted help">Frecce o WASD per girare · SPAZIO turbo · P pausa</p>`;
    showOverlay(
      `<h1>SCIE DI LUCE</h1>
       <p>Guida la tua moto di luce: dietro di te resta una scia che nessuno può attraversare, nemmeno tu. Chi tocca una scia o il bordo dell'arena è fuori! Chiudi gli avversari in trappola e resta l'ultimo in pista.</p>
       <p class="muted">Il turbo ⚡ ti fa accelerare per un attimo, poi si ricarica · in un giocatore affronti round dopo round sempre più moto</p>
       ${touchMode ? `<p class="muted help">Touch: ⟲ ⟳ per girare, ⚡ turbo (in due giocatori ognuno ha i suoi pulsanti), oppure scorri il dito sul campo</p>` : keys}
       ${modeHTML()}${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    const m = e.target.closest("[data-mode]");
    if (m) { setMode(m.dataset.mode); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const P1_ABS = { w: 0, d: 1, s: 2, a: 3 }, ARROWS = { arrowup: 0, arrowright: 1, arrowdown: 2, arrowleft: 3 };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (e.repeat || !bikes.length) return;
    if (mode === "versus") {
      if (P1_ABS[k] !== undefined) steer(bikes[0], P1_ABS[k]);
      else if (k === "q") boost(bikes[0]);
      else if (ARROWS[k] !== undefined) steer(bikes[1], ARROWS[k]);
      else if (k === "enter" || k === "l" || k === "0") boost(bikes[1]);
    } else {
      if (P1_ABS[k] !== undefined) steer(bikes[0], P1_ABS[k]);
      else if (ARROWS[k] !== undefined) steer(bikes[0], ARROWS[k]);
      else if (k === " " || k === "shift") boost(bikes[0]);
    }
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on");
      const b = bikes[+btn.dataset.p];
      if (!b || !isPlaying()) return;
      if (btn.dataset.a === "boost") boost(b); else turn(b, btn.dataset.a);
    });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) btn.addEventListener(ev, () => btn.classList.remove("on"));
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); } }, true);
  // Swipe on the arena steers the bike on that half of the screen (player 1 in single player)
  let swipe = null;
  canvas.addEventListener("pointerdown", (e) => { swipe = { x: e.clientX, y: e.clientY, done: false }; });
  canvas.addEventListener("pointermove", (e) => {
    if (!swipe || swipe.done || !bikes.length) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.hypot(dx, dy) < 24) return;
    swipe.done = true;
    const r = canvas.getBoundingClientRect();
    const who = mode === "versus" && swipe.x > r.left + r.width / 2 ? bikes[1] : bikes[0];
    steer(who, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  window.addEventListener("pointerup", () => { swipe = null; });

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    particles = particles.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 24 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (!isPlaying()) return;
    // crashed trails fade and free their cells
    for (const b of bikes) if (!b.alive && b.fade > 0) {
      b.fade -= dt;
      if (b.fade <= 0) { for (let k = 0; k < grid.length; k++) if (grid[k] === b.i + 1) grid[k] = 0; b.path = []; }
    }
    if (state === "countdown") {
      const before = Math.ceil(stateT / 0.8);
      stateT -= dt;
      if (Math.ceil(stateT / 0.8) !== before && stateT > 0) sfx.count();
      if (stateT <= 0) { state = "playing"; sfx.go(); humOn(true); }
      return;
    }
    if (state === "roundover") { stateT -= dt; if (stateT <= 0) afterRound(); return; }

    roundT += dt;
    const base = baseSpeed() * (1 + Math.min(roundT, 40) * 0.006);
    if (hum) hum.o.frequency.setTargetAtTime(50 + base * 2, audioCtx.currentTime, 0.1);
    // each bike advances cell by cell; all bikes that step in this frame share a step id for head-on checks
    stepId++;
    let steps = 0;
    for (const b of bikes) {
      if (!b.alive) continue;
      if (b.boosting > 0) { b.boosting -= dt; b.boost = Math.max(0, b.boost - dt); }
      else b.boost = Math.min(BOOST_MAX, b.boost + dt * 0.28);
      b.acc += dt * base * (b.boosting > 0 ? BOOST_MUL : 1);
    }
    let moved = true;
    while (moved && steps < 6) {
      moved = false; steps++;
      for (const b of bikes) {
        if (!b.alive || b.acc < 1) continue;
        if (!b.human) thinkCPU(b);
        b.acc -= 1;
        stepBike(b);
        moved = true;
      }
      stepId++;
    }
    const alive = bikes.filter((b) => b.alive);
    const over = mode === "versus" ? alive.length <= 1 : (!bikes[0].alive || alive.length <= 1);
    if (over) endRound();
  }

  // ---------- Drawing ----------
  function drawTrail(b, alpha) {
    if (b.path.length < 1) return;
    const pts = b.path.map(([x, y]) => [(x + 0.5) * CELL, HUD + (y + 0.5) * CELL]);
    if (b.alive) { const [hx, hy] = headPos(b); pts.push([hx, hy]); }
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.globalAlpha = alpha * 0.25; ctx.strokeStyle = b.color; ctx.lineWidth = 9;
    ctx.beginPath(); pts.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.globalAlpha = alpha; ctx.lineWidth = 3.5;
    ctx.stroke();
    ctx.globalAlpha = alpha * 0.9; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // smooth position between cells, towards the next one
  function headPos(b) {
    const k = state === "playing" && b.alive ? Math.max(0, Math.min(0.95, b.acc)) : 0;
    return [(b.x + 0.5 + DIRS[b.d][0] * k) * CELL, HUD + (b.y + 0.5 + DIRS[b.d][1] * k) * CELL];
  }
  function drawBike(b) {
    const [x, y] = headPos(b);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.d * Math.PI / 2);
    ctx.shadowColor = b.color; ctx.shadowBlur = b.boosting > 0 ? 22 : 12;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 3); ctx.lineTo(3, 7); ctx.lineTo(-3, 7); ctx.lineTo(-5, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-1.5, -5, 3, 6);
    ctx.shadowBlur = 0;
    if (b.boosting > 0) { ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.moveTo(-3, 8); ctx.lineTo(0, 16 + Math.random() * 6); ctx.lineTo(3, 8); ctx.fill(); }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#04060f"; ctx.fillRect(0, 0, W, H);
    // grid
    ctx.strokeStyle = "rgba(61,160,255,0.09)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k <= N; k += 4) { ctx.moveTo(k * CELL + 0.5, HUD); ctx.lineTo(k * CELL + 0.5, H); ctx.moveTo(0, HUD + k * CELL + 0.5); ctx.lineTo(W, HUD + k * CELL + 0.5); }
    ctx.stroke();
    ctx.strokeStyle = "rgba(61,224,255,0.6)"; ctx.lineWidth = 2; ctx.shadowColor = "#3de0ff"; ctx.shadowBlur = 10;
    ctx.strokeRect(1, HUD + 1, W - 2, N * CELL - 2); ctx.shadowBlur = 0;

    for (const b of bikes) if (b.alive || b.fade > 0) drawTrail(b, b.alive ? 1 : Math.max(0, b.fade / 0.9) * (0.6 + 0.4 * Math.sin(clock * 40)));
    for (const b of bikes) if (b.alive) drawBike(b);
    for (const p of particles) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = "#04060f"; ctx.fillRect(0, 0, W, HUD);
    const meter = (b, x, align) => {
      const w = 70;
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(align === "left" ? x : x - w, 28, w, 5);
      ctx.fillStyle = b.boost >= 0.5 ? b.color : "#556"; ctx.fillRect(align === "left" ? x : x - w, 28, w * b.boost / BOOST_MAX, 5);
    };
    if (mode === "versus") {
      ctx.textAlign = "left"; ctx.font = "800 16px system-ui, sans-serif"; ctx.fillStyle = COLORS[0];
      ctx.fillText(`G1  ${tally[0]}`, 12, 21);
      ctx.textAlign = "right"; ctx.fillStyle = COLORS[1];
      ctx.fillText(`${tally[1]}  G2`, W - (touchMode ? 60 : 12), 21);
      ctx.textAlign = "center"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#9fb0cc";
      ctx.fillText(`ROUND ${round} · a 3 vittorie`, W / 2, 16);
      if (bikes[0]) meter(bikes[0], 12, "left");
      if (bikes[1]) meter(bikes[1], W - (touchMode ? 60 : 12), "right");
    } else {
      ctx.textAlign = "left"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#9fb0cc";
      ctx.fillText("PUNTI", 12, 14);
      ctx.font = "800 16px system-ui, sans-serif"; ctx.fillStyle = "#eef6ff";
      ctx.fillText(score.toLocaleString("it-IT"), 56, 15);
      if (bikes[0]) meter(bikes[0], 12, "left");
      ctx.textAlign = "center"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#9fb0cc";
      ctx.fillText(`ROUND ${round} · ${Math.max(0, bikes.length - 1)} avversari`, W / 2, 16);
      ctx.fillStyle = "#3de0ff"; ctx.font = "800 13px system-ui, sans-serif";
      ctx.fillText("♥".repeat(Math.max(0, lives)), W / 2, 33);
      if (!(touchMode && isPlaying())) {
        ctx.textAlign = "right"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#9fb0cc";
        ctx.fillText("RECORD", W - 12, 14);
        ctx.font = "800 16px system-ui, sans-serif"; ctx.fillStyle = "#ffd34d";
        ctx.fillText(Math.max(score, bestCache).toLocaleString("it-IT"), W - 12, 33);
      }
    }
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, (1.2 - p.t) * 3);
      ctx.textAlign = "center"; ctx.font = "900 15px system-ui, sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(4,6,15,0.9)"; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    const banner = (t, sub, color) => {
      ctx.textAlign = "center"; ctx.font = "900 38px system-ui, sans-serif";
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(4,6,15,0.9)"; ctx.strokeText(t, W / 2, HUD + N * CELL * 0.45);
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fillText(t, W / 2, HUD + N * CELL * 0.45); ctx.shadowBlur = 0;
      if (sub) { ctx.font = "800 16px system-ui, sans-serif"; ctx.strokeText(sub, W / 2, HUD + N * CELL * 0.45 + 30); ctx.fillStyle = "#eef6ff"; ctx.fillText(sub, W / 2, HUD + N * CELL * 0.45 + 30); }
    };
    if (state === "countdown") {
      const n = Math.ceil(stateT / 0.8);
      banner(String(n), `Round ${round}${mode === "solo" ? ` · ${bikes.length - 1} avversari` : ""}`, "#eef6ff");
      // show where each bike starts and faces
      for (const b of bikes) {
        const x = (b.x + 0.5) * CELL, y = HUD + (b.y + 0.5) * CELL;
        ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 8);
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.fillStyle = b.color; ctx.font = "800 11px system-ui, sans-serif"; ctx.textAlign = "center";
        ctx.fillText(b.name, x, y - 20);
      }
    }
    if (state === "roundover") {
      if (mode === "versus") banner(lastWinner >= 0 ? `PUNTO AL G${lastWinner + 1}!` : "PAREGGIO!", `${tally[0]} – ${tally[1]}`, lastWinner >= 0 ? COLORS[lastWinner] : "#eef6ff");
      else if (lastWinner === 0) banner("ROUND VINTO!", "arriva il prossimo avversario", "#3de0ff");
      else if (lastWinner === -1) banner("PAREGGIO!", "nessuna vita persa", "#eef6ff");
      else banner("FUORI!", lives > 0 ? `vite rimaste: ${lives}` : "", "#ff5a6a");
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sfida delle Gelatine</title>
<style>
  :root {
    --bg: #1a0e24;
    --fg: #f4f6ee;
    --muted: #a8b4a8;
    --pink: #ff6ab8;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a1e4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: left/right to move the pair, down to drop it faster; RUOTA turns it */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 106, 184, 0.6); background: radial-gradient(circle, rgba(255,106,184,0.14), rgba(255,106,184,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 106, 184, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(90, 224, 255, 0.9); background: rgba(90, 224, 255, 0.22); }
  #touch .jump.on { background: rgba(90, 224, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 14, 36, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #4a0a3a, 0 0 22px rgba(255,106,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a041a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Ruota">RUOTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  const COLS = 6, ROWS = 13, CELL = 22, NUIS = 9;
  const BX = [44, 464], BY = 60;
  const COLORS = [null, { c: "#ff4a6a", d: "#a81a3a" }, { c: "#4ad86a", d: "#1a8a3a" }, { c: "#4a8aff", d: "#1a4aa8" }, { c: "#ffd23a", d: "#b8901a" }, { c: "#c86aff", d: "#6a2aa8" }];
  const CHAIN_POWER = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
  const COLOR_BONUS = [0, 0, 3, 6, 12, 24];
  const GROUP_BONUS = (n) => (n <= 4 ? 0 : n >= 11 ? 10 : n - 3);
  const ROT = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const LOCK = 0.35, SOFT = 16;
  const RIVALS = [
    { name: "Gelatino", c: "#ff8ab8" }, { name: "Budino", c: "#c89a5a" }, { name: "Marmellata", c: "#ff5a5a" }, { name: "Caramella", c: "#ffb03a" },
    { name: "Meringa", c: "#f4f0e8" }, { name: "Torrone", c: "#e8c88a" }, { name: "Panna Cotta", c: "#ffe8c8" }, { name: "Re Tiramisù", c: "#8a5a3a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "3 cuori · avversari lenti e distratti", lives: 3, skill: 0.6 },
    normale:   { label: "NORMALE",   color: "#ff6ab8", desc: "2 cuori", lives: 2, skill: 1.15 },
    difficile: { label: "DIFFICILE", color: "#ff4a4a", desc: "1 cuore · avversari svelti che preparano catene lunghe", lives: 1, skill: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "gelatine-difficulty";
  const bestKey = (id) => `gelatine-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    move: lim((me) => { if (me) beep(520, 0.03, "square", 0.018); }),
    rot: lim((me) => { if (me) beep(760, 0.04, "triangle", 0.03); }),
    land: lim((me) => { if (me) noise(0.05, 0.06, 500); }),
    pop: lim((chain, me) => { const b = 400 * Math.pow(1.12, chain); beep(b, 0.12, "square", me ? 0.045 : 0.025, b); arp([b * 1.5, b * 2], 0.05, 0.08, "triangle", me ? 0.03 : 0.015); }),
    junk: lim(() => { noise(0.3, 0.14, 250); }),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    lose: () => arp([392, 330, 262, 196], 0.14, 0.2, "sawtooth", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0, matchT = 0;
  let score = 0, lives = 2, stage = 0, bestCache = 0, queue = [], boards = [], parts = [], popups = [], message = null, winner = -1;
  let rotPressed = 0;
  const keys = { left: false, right: false, down: false };
  const stick = { x: 0, y: 0 };
  let das = { dir: 0, t: 0 }, stickUp = false;

  // ---------- Boards ----------
  function pairAt(i) {
    // both players get the same sequence of pairs
    while (queue.length <= i) { const n = colorCount(); queue.push([1 + Math.floor(Math.random() * n), 1 + Math.floor(Math.random() * n)]); }
    return queue[i];
  }
  const colorCount = () => 4;
  function newBoard(side) {
    return { side, grid: new Uint8Array(COLS * ROWS), off: new Float32Array(COLS * ROWS), piece: null, qi: 0, phase: "spawn", t: 0, chain: 0, pending: 0, acc: 0, popping: null, lost: false, score: 0, ai: null, lockT: 0 };
  }
  const idx = (x, y) => y * COLS + x;
  const cell = (b, x, y) => (x < 0 || x >= COLS || y >= ROWS ? 255 : y < 0 ? 0 : b.grid[idx(x, y)]);
  const cellG = (g, x, y) => (x < 0 || x >= COLS || y >= ROWS ? 255 : y < 0 ? 0 : g[idx(x, y)]);
  function fits(b, x, y, rot) { const [dx, dy] = ROT[rot]; return cell(b, x, y) === 0 && cell(b, x + dx, y + dy) === 0; }
  function gravity(g, off) {
    for (let x = 0; x < COLS; x++) {
      let w = ROWS - 1;
      for (let y = ROWS - 1; y >= 0; y--) { const v = g[idx(x, y)]; if (!v) continue; if (w !== y) { g[idx(x, w)] = v; g[idx(x, y)] = 0; if (off) off[idx(x, w)] = (off[idx(x, y)] || 0) + (w - y); if (off) off[idx(x, y)] = 0; } w--; }
    }
  }
  function findGroups(g) {
    const seen = new Uint8Array(COLS * ROWS), groups = [];
    for (let y = 1; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const v = g[idx(x, y)]; if (!v || v === NUIS || seen[idx(x, y)]) continue;
      const q = [[x, y]], cells = []; seen[idx(x, y)] = 1;
      while (q.length) { const [cx, cy] = q.pop(); cells.push([cx, cy]); for (const [dx, dy] of ROT) { const nx = cx + dx, ny = cy + dy; if (ny < 1 || cellG(g, nx, ny) !== v || seen[idx(nx, ny)]) continue; seen[idx(nx, ny)] = 1; q.push([nx, ny]); } }
      if (cells.length >= 4) groups.push({ v, cells });
    }
    return groups;
  }
  function chainScore(groups, chain) {
    let n = 0, gb = 0; const cols = new Set();
    for (const gr of groups) { n += gr.cells.length; gb += GROUP_BONUS(gr.cells.length); cols.add(gr.v); }
    const mult = clamp(CHAIN_POWER[Math.min(chain, CHAIN_POWER.length) - 1] + COLOR_BONUS[cols.size] + gb, 1, 999);
    return 10 * n * mult;
  }
  function clearGroups(g, groups) {
    for (const gr of groups) for (const [x, y] of gr.cells) {
      g[idx(x, y)] = 0;
      // grey junk next to a popping group pops too
      for (const [dx, dy] of ROT) if (cellG(g, x + dx, y + dy) === NUIS) g[idx(x + dx, y + dy)] = 0;
    }
  }
  // what a placement would lead to: the chain count, the score, and the grid left behind
  function simulate(g0, x, rot, pair) {
    const g = new Uint8Array(g0), [dx, dy] = ROT[rot];
    const drop = (cx, v) => { let y = 0; while (y + 1 < ROWS && !g[idx(cx, y + 1)]) y++; if (g[idx(cx, y)]) return false; g[idx(cx, y)] = v; return true; };
    if (dy === 1) { if (!drop(x, pair[1]) || !drop(x, pair[0])) return null; }
    else if (dy === -1) { if (!drop(x, pair[0]) || !drop(x, pair[1])) return null; }
    else { if (!drop(x, pair[0]) || !drop(x + dx, pair[1])) return null; }
    let chains = 0, total = 0;
    for (;;) { const gr = findGroups(g); if (!gr.length) break; chains++; total += chainScore(gr, chains); clearGroups(g, gr); gravity(g); }
    return { g, chains, score: total };
  }

  // ---------- Thinking, for the rival (and for nobody else) ----------
  function heights(g) { const h = []; for (let x = 0; x < COLS; x++) { let y = 0; while (y < ROWS && !g[idx(x, y)]) y++; h.push(ROWS - y); } return h; }
  function reachable(b, x, rot) {
    // the columns between the spawn and the target must be clear at the top
    const [dx] = ROT[rot], lo = Math.min(2, x, x + dx), hi = Math.max(2, x, x + dx);
    for (let c = lo; c <= hi; c++) if (b.grid[idx(c, 1)]) return false;
    return true;
  }
  function choose(b, p) {
    const pair = b.piece.c, threat = b.pending >= 6 || Math.max(...heights(b.grid)) >= 9;
    let best = null, bv = -1e9;
    for (let x = 0; x < COLS; x++) for (let rot = 0; rot < 4; rot++) {
      const [dx] = ROT[rot]; if (x + dx < 0 || x + dx >= COLS || !reachable(b, x, rot)) continue;
      const r = simulate(b.grid, x, rot, pair); if (!r) continue;
      const h = heights(r.g);
      let v = 0;
      if (r.chains) v = r.chains >= p.target || threat || r.score >= 2000 ? 1000 * r.chains + r.score / 20 : -30 * (p.target - r.chains);
      else {
        // keep colours together, keep it low, keep the middle clear
        for (let cx = 0; cx < COLS; cx++) for (let cy = 1; cy < ROWS; cy++) { const c = r.g[idx(cx, cy)]; if (!c || c === NUIS) continue; if (cellG(r.g, cx + 1, cy) === c) v += 3; if (cellG(r.g, cx, cy + 1) === c) v += 3; }
        for (const gr of (() => { const seen = new Uint8Array(COLS * ROWS), out = []; for (let cy = 1; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) { const c = r.g[idx(cx, cy)]; if (!c || c === NUIS || seen[idx(cx, cy)]) continue; let n = 0; const q = [[cx, cy]]; seen[idx(cx, cy)] = 1; while (q.length) { const [a, bb] = q.pop(); n++; for (const [ddx, ddy] of ROT) { const nx = a + ddx, ny = bb + ddy; if (ny < 1 || cellG(r.g, nx, ny) !== c || seen[idx(nx, ny)]) continue; seen[idx(nx, ny)] = 1; q.push([nx, ny]); } } out.push(n); } return out; })()) if (gr === 3) v += 6;
      }
      v -= h.reduce((s, q) => s + q * q, 0) * 0.08 + (h[2] >= 9 ? 60 : 0) + Math.max(...h) * 1.5;
      v += (Math.random() - 0.5) * p.noise * 60;
      if (v > bv) { bv = v; best = { x, rot }; }
    }
    return best || { x: 2, rot: 0 };
  }
  function rivalParams() {
    const k = diff.skill * (0.7 + stage * 0.17);
    return { think: clamp(0.9 / k, 0.12, 1.4), move: clamp(0.18 / k, 0.035, 0.3), noise: clamp(1.4 - k * 0.7, 0.05, 1.2), target: clamp(Math.round(1 + k * 1.3), 1, 5), drop: k > 0.8 };
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "end"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginMatch();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMatch() {
    queue = []; boards = [newBoard(0), newBoard(1)]; matchT = 0; winner = -1;
    boards[1].ai = { p: rivalParams(), plan: null, t: 0 };
    message = { text: `SFIDA ${stage + 1}: ${RIVALS[stage % RIVALS.length].name.toUpperCase()}`, sub: stage >= RIVALS.length ? "secondo giro: si fa sul serio!" : "quattro dello stesso colore scoppiano!", t: 0 };
    state = "intro"; stateT = 1.8;
  }
  const gravSpeed = () => Math.min(6, 0.9 + stage * 0.12 + matchT / 45);
  function spawn(b) {
    if (b.grid[idx(2, 1)]) { lose(b); return; }
    b.piece = { x: 2, y: 1, rot: 0, fy: 0, c: pairAt(b.qi++) };
    b.phase = "fall"; b.lockT = 0;
    if (b.ai) { b.ai.plan = null; b.ai.t = b.ai.p.think * rnd(0.8, 1.2); }
  }
  function tryMove(b, dx) { const p = b.piece; if (p && fits(b, p.x + dx, p.y, p.rot)) { p.x += dx; sfx.move(b.side === 0); return true; } return false; }
  function tryRotate(b, dir) {
    const p = b.piece; if (!p) return false;
    const r = (p.rot + dir + 4) % 4;
    const kicks = r === 1 ? [[0, 0], [-1, 0]] : r === 3 ? [[0, 0], [1, 0]] : r === 2 ? [[0, 0], [0, -1]] : [[0, 0]];
    for (const [kx, ky] of kicks) if (fits(b, p.x + kx, p.y + ky, r)) { p.x += kx; p.y += ky; p.rot = r; sfx.rot(b.side === 0); return true; }
    // squeezed on both sides in a one-wide gap: flip the pair over instead
    if (r === 1 || r === 3) {
      const flip = (p.rot + 2) % 4;
      for (const ky of [0, -1]) if (fits(b, p.x, p.y + ky, flip)) { p.y += ky; p.rot = flip; sfx.rot(b.side === 0); return true; }
    }
    return false;
  }
  function lockPiece(b) {
    const p = b.piece, [dx, dy] = ROT[p.rot];
    b.grid[idx(p.x, p.y)] = p.c[0];
    if (p.y + dy >= 0) b.grid[idx(p.x + dx, p.y + dy)] = p.c[1];
    b.piece = null; sfx.land(b.side === 0);
    gravity(b.grid, b.off);
    b.phase = "drop"; b.chain = 0;
  }
  function afterDrop(b) {
    const groups = findGroups(b.grid);
    if (groups.length) {
      b.chain++;
      const pts = chainScore(groups, b.chain);
      b.score += pts;
      if (b.side === 0) addScore(pts);
      // junk to send: first it cancels what is coming your way
      b.acc += pts; let n = Math.floor(b.acc / 70); b.acc -= n * 70;

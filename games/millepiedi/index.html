<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Millepiedi</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f3fff0;
    --muted: #a8b8a0;
    --glow: #7dff5a;
    --bad: #ff4f6a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(125, 255, 90, 0.25), 0 0 24px rgba(125, 255, 90, 0.08); }
  canvas.playing { cursor: none; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(243, 255, 240, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(0, 0, 0, 0.84);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(38px, 10vw, 66px); letter-spacing: 5px; font-weight: 400; color: #ff5ad8; text-shadow: 0 0 12px #ff5ad8, 4px 4px 0 #3a8a1a; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 400; letter-spacing: 3px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.6; font-family: system-ui, sans-serif; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 20px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); font-weight: 400; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(243,255,240,0.35); border-radius: 4px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--glow); color: #000; background: var(--glow); padding: 10px 28px; box-shadow: 0 0 16px rgba(125,255,90,0.55); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const CELL = 16, COLS = 30, ROWS = 32, TOP = 28;           // field below a 28px status bar
  const W = COLS * CELL, FH = ROWS * CELL, H = FH + TOP;
  const PZ = 26;                                              // first row of the player's zone
  const PLAYER_SPEED = 260, SHOT_SPEED = 1100, PR = 6;
  const LIFE_EVERY = 12000;
  // a new colour scheme every wave, like the arcade cabinet
  const PALETTES = [
    { mush: "#ff5ad8", edge: "#3dd6ff", body: "#7dff5a", head: "#ff5ad8", ship: "#ffd34d" },
    { mush: "#3dd6ff", edge: "#ff8a3a", body: "#ffd34d", head: "#ff4f6a", ship: "#7dff5a" },
    { mush: "#ffd34d", edge: "#ff4f6a", body: "#3dd6ff", head: "#7dff5a", ship: "#ff5ad8" },
    { mush: "#7dff5a", edge: "#b98cff", body: "#ff8a3a", head: "#3dd6ff", ship: "#f3fff0" },
    { mush: "#ff8a3a", edge: "#3dd6ff", body: "#ff5ad8", head: "#ffd34d", ship: "#7dff5a" },
    { mush: "#b98cff", edge: "#7dff5a", body: "#ff4f6a", head: "#f3fff0", ship: "#3dd6ff" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · millepiedi lento · ragno meno aggressivo", lives: 5, speed: 7.5, spider: 0.8, mush: 38 },
    normale:   { label: "NORMALE",   color: "#ff5ad8", desc: "3 vite · l'esperienza classica", lives: 3, speed: 9.5, spider: 1, mush: 45 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · millepiedi veloce · più funghi e ragni scatenati", lives: 3, speed: 11.5, spider: 1.3, mush: 55 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "millepiedi-difficulty";
  const bestKey = (id) => `millepiedi-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, scale = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    scale = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, scale * (window.devicePixelRatio || 1));
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1500, 0.04, "square", 0.015, -900)),
    mush: lim(() => beep(260, 0.03, "square", 0.02)),
    seg: lim((head) => { noise(0.1, 0.25, head ? 2400 : 1500); beep(head ? 700 : 440, 0.06, "square", 0.03, -200); }),
    spider: () => { noise(0.3, 0.3, 1200); arp([880, 1175, 1568], 0.05, 0.08); },
    flea: () => beep(1800, 0.25, "sine", 0.03, -1500),
    scorpion: () => arp([1047, 784, 523], 0.06, 0.1, "sawtooth", 0.03),
    walk: lim((hi) => beep(hi ? 150 : 120, 0.04, "square", 0.02)),
    die: () => { noise(1.1, 0.45, 800); beep(400, 1, "sawtooth", 0.04, -360); },
    restore: lim(() => beep(1200, 0.03, "triangle", 0.03)),
    life: () => arp([523, 784, 1047, 1319], 0.07, 0.12, "triangle", 0.05),
    wave: () => arp([392, 523, 659, 784], 0.08, 0.12),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let wave = 0, score = 0, lives = 3, nextLife = LIFE_EVERY, bestCache = 0;
  let mush = [], segs = [], player = null, shot = null, spider = null, flea = null, scorpion = null;
  let stepT = 0, stepAcc = 0, parts = [], popups = [], spiderT = 4, scorpionT = 12, fleaT = 3, headT = 0, reachedBottom = false, walkHi = false;
  let restoreQueue = [];
  const ctl = { up: false, down: false, left: false, right: false, fire: false };
  let pointerTarget = null, touchFire = false, mouseFire = false;
  const pal = () => PALETTES[(wave - 1 + PALETTES.length) % PALETTES.length];

  const cellFree = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && !mush[r][c];
  function placeMushrooms(n) {
    mush = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    let k = 0;
    while (k < n) {
      const c = Math.floor(Math.random() * COLS), r = 2 + Math.floor(Math.random() * (ROWS - 4));
      if (!mush[r][c]) { mush[r][c] = { hp: 4, poison: false }; k++; }
    }
  }
  function mushCount(r0, r1) { let n = 0; for (let r = r0; r <= r1; r++) for (let c = 0; c < COLS; c++) if (mush[r][c]) n++; return n; }

  // the centipede: every segment follows the same rules, so the body follows the head's path
  let segId = 0;
  function newSeg(c, r, dir, head) { return { id: segId++, c, r, pc: c - dir, pr: r, dir, vdir: 1, head, dive: false }; }
  function spawnCentipede(length, extraHeads) {
    segs = [];
    const start = 14;
    for (let i = 0; i < length; i++) segs.push(newSeg(start + i, 0, -1, i === 0));
    for (let k = 0; k < extraHeads; k++) {
      const c = Math.floor(rnd(2, COLS - 2));
      segs.push(newSeg(c, Math.floor(rnd(0, 4)), Math.random() < 0.5 ? 1 : -1, true));
    }
    reachedBottom = false; headT = 0;
  }
  function stepSegment(s) {
    s.pc = s.c; s.pr = s.r;
    if (s.dive) {
      s.r++;
      if (s.r >= PZ) { s.dive = false; }
      if (s.r >= ROWS - 1) { s.r = ROWS - 1; s.vdir = -1; s.dive = false; }
      return;
    }
    const nc = s.c + s.dir;
    const blocked = nc < 0 || nc >= COLS || !!mush[s.r][nc];
    if (!blocked) { s.c = nc; return; }
    // a poisoned mushroom sends the centipede straight down
    if (nc >= 0 && nc < COLS && mush[s.r][nc] && mush[s.r][nc].poison && s.r < PZ) { s.dive = true; s.r++; s.dir = -s.dir; return; }
    // otherwise drop (or climb, in the player's zone) one row and turn round
    if (s.r >= ROWS - 1) s.vdir = -1;
    if (s.vdir < 0 && s.r <= PZ) s.vdir = 1;
    s.r += s.vdir;
    s.dir = -s.dir;
    if (s.r >= ROWS - 1) reachedBottom = true;
  }
  function segPos(s) {
    const t = clamp(stepAcc / stepT, 0, 1);
    return { x: (s.pc + (s.c - s.pc) * t) * CELL + CELL / 2, y: (s.pr + (s.r - s.pr) * t) * CELL + CELL / 2 + TOP };
  }

  // ---------- Flow ----------
  const isPlaying = () => ["play", "dead", "between"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; nextLife = LIFE_EVERY; wave = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    placeMushrooms(diff.mush);
    player = { x: W / 2, y: TOP + (ROWS - 2) * CELL + CELL / 2 };
    nextWave();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function nextWave() {
    wave++;
    // each wave the main centipede is shorter, and loose heads join it
    const heads = Math.min(8, wave - 1), length = Math.max(4, 12 - heads);
    spawnCentipede(length, heads);
    stepT = 1 / (diff.speed * Math.min(1.5, 1 + (wave - 1) * 0.04));
    stepAcc = 0;
    shot = null; spider = null; flea = null; scorpion = null;
    spiderT = rnd(3, 6); scorpionT = rnd(10, 18); fleaT = 2;
    state = "play";
    sfx.wave();
  }
  function addScore(n, x, y, color) {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), t: 0, color: color || "#f3fff0" });
    if (score >= nextLife) { nextLife += LIFE_EVERY; lives++; sfx.life(); popups.push({ x: W / 2, y: TOP + 60, text: "VITA EXTRA", t: 0, color: "#ffd34d", big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 140) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function die() {
    if (state !== "play") return;
    lives--;
    sfx.die();
    burst(player.x, player.y, pal().ship, 30, 200);
    burst(player.x, player.y, "#ffffff", 14, 120);
    state = "dead"; stateT = 1.6;
    shot = null;
    // damaged or poisoned mushrooms are healed one by one, 5 points each
    restoreQueue = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const m = mush[r][c]; if (m && (m.hp < 4 || m.poison)) restoreQueue.push([c, r]); }
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the survivors regroup into a centipede at the top
    const n = segs.length;
    const heads = segs.filter((s) => s.head).length;
    spawnCentipede(Math.max(1, n - Math.max(0, heads - 1)), Math.max(0, heads - 1));
    stepAcc = 0; spider = null; flea = null; scorpion = null; spiderT = rnd(3, 6);
    player.x = W / 2; player.y = TOP + (ROWS - 2) * CELL + CELL / 2;
    // make sure the player does not start inside a mushroom
    const pc = Math.floor(player.x / CELL), pr = Math.floor((player.y - TOP) / CELL);
    mush[pr][pc] = null;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, w = wave;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Ondata ${w} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    canvas.classList.toggle("playing", isPlaying());
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>MILLEPIEDI</h1>
       <p>Un millepiedi scende a zigzag tra i funghi: ogni volta che sbatte contro un fungo o il bordo, scende di una fila. Colpisci i segmenti: ogni segmento colpito diventa un fungo e spezza il millepiedi in due. Attento al ragno, alla pulce e allo scorpione!</p>
       <div class="pts">
         <span><b>Testa</b></span><span>100 · segmento 10</span>
         <span><b>Ragno</b></span><span>300 · 600 · 900 (più è vicino, più vale)</span>
         <span><b>Pulce</b></span><span>200 · due colpi</span>
         <span><b>Scorpione</b></span><span>1000 · avvelena i funghi</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Trascina il dito ovunque per muoverti (come una trackball) · finché tieni il dito sullo schermo spari</p>`
         : `<p class="muted help">Mouse per muoverti e clic (tieni premuto) per sparare · oppure frecce o W A S D e SPAZIO · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "fire" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      else if (k === "arrowleft") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 2) % 3]);
      else if (k === "arrowright") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 1) % 3]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (a) { ctl[a] = true; if (a !== "fire") pointerTarget = null; }
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; touchFire = mouseFire = false; if (isPlaying()) togglePause(); });
  // mouse: the shooter follows the pointer; touch: the finger drags it like a trackball and fires
  const touches = new Map();
  function toField(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); }
    if (!isPlaying()) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    if (e.pointerType === "mouse") { mouseFire = true; pointerTarget = toField(e); return; }
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    touchFire = true;
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!isPlaying() || !player) return;
    if (e.pointerType === "mouse") { pointerTarget = toField(e); return; }
    const t = touches.get(e.pointerId);
    if (!t) return;
    const k = 1.4 / scale;
    const tx = (pointerTarget ? pointerTarget.x : player.x) + (e.clientX - t.x) * k;
    const ty = (pointerTarget ? pointerTarget.y : player.y) + (e.clientY - t.y) * k;
    pointerTarget = { x: clamp(tx, PR, W - PR), y: clamp(ty, TOP + PZ * CELL + PR, H - PR) };
    t.x = e.clientX; t.y = e.clientY;
  });
  const release = (e) => {
    if (e.pointerType === "mouse") { mouseFire = false; return; }
    touches.delete(e.pointerId);
    if (!touches.size) touchFire = false;
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- Update ----------
  function hitsMushroom(x, y, r) {
    const c0 = Math.floor((x - r) / CELL), c1 = Math.floor((x + r) / CELL);
    const r0 = Math.floor((y - r - TOP) / CELL), r1 = Math.floor((y + r - TOP) / CELL);
    for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || !mush[rr][cc]) continue;
      // mushrooms are a little smaller than their cell
      const mx = cc * CELL + 2, my = rr * CELL + TOP + 2, ms = CELL - 4;
      if (x + r > mx && x - r < mx + ms && y + r > my && y - r < my + ms) return true;
    }
    return false;
  }
  function movePlayer(dt) {
    let dx = 0, dy = 0;
    if (pointerTarget) {
      const tx = pointerTarget.x - player.x, ty = pointerTarget.y - player.y, d = Math.hypot(tx, ty), step = PLAYER_SPEED * 1.6 * dt;
      if (d > 0.5) { dx = tx / d * Math.min(d, step); dy = ty / d * Math.min(d, step); }
    } else {
      const kx = (ctl.right ? 1 : 0) - (ctl.left ? 1 : 0), ky = (ctl.down ? 1 : 0) - (ctl.up ? 1 : 0);
      const k = Math.hypot(kx, ky) || 1;
      dx = kx / k * PLAYER_SPEED * dt; dy = ky / k * PLAYER_SPEED * dt;
    }
    const minY = TOP + PZ * CELL + PR, maxY = H - PR;
    const nx = clamp(player.x + dx, PR, W - PR);
    if (!hitsMushroom(nx, player.y, PR)) player.x = nx;
    const ny = clamp(player.y + dy, minY, maxY);
    if (!hitsMushroom(player.x, ny, PR)) player.y = ny;
  }
  function damageMushroom(c, r) {
    const m = mush[r][c];
    m.hp--;
    sfx.mush();
    if (m.hp <= 0) { mush[r][c] = null; addScore(1); burst(c * CELL + 8, r * CELL + TOP + 8, m.poison ? "#b98cff" : pal().mush, 5, 60); }
  }
  function killSegment(i) {
    const s = segs[i], p = segPos(s);
    segs.splice(i, 1);
    addScore(s.head ? 100 : 10, p.x, p.y - 8, s.head ? pal().head : undefined);
    sfx.seg(s.head);
    burst(p.x, p.y, s.head ? pal().head : pal().body, 10, 120);
    // the segment turns into a mushroom (never inside the player's own spot)
    const c = clamp(s.c, 0, COLS - 1), r = clamp(s.r, 0, ROWS - 1);
    if (!mush[r][c] && !(Math.abs(c * CELL + 8 - player.x) < CELL && Math.abs(r * CELL + TOP + 8 - player.y) < CELL)) mush[r][c] = { hp: 4, poison: false };
    // the segment that was following it becomes a head
    const follower = segs.find((q) => !q.head && q.r === s.pr && q.c === s.pc) || segs.find((q) => !q.head && q.c === s.pc && q.r === s.pr);
    if (follower) follower.head = true;
    if (!segs.length) { state = "between"; stateT = 1; }
  }
  function updateShot(dt) {
    const fire = ctl.fire || touchFire || mouseFire;
    if (!shot && fire) { shot = { x: player.x, y: player.y - 8 }; sfx.shot(); }
    if (!shot) return;
    const SUB = 4;
    for (let k = 0; k < SUB && shot; k++) {
      shot.y -= SHOT_SPEED * dt / SUB;
      if (shot.y < TOP) { shot = null; break; }
      // centipede segments
      for (let i = 0; i < segs.length; i++) {
        const p = segPos(segs[i]);
        if (Math.abs(p.x - shot.x) < 8 && Math.abs(p.y - shot.y) < 8) { killSegment(i); shot = null; break; }
      }
      if (!shot) break;
      // spider, flea and scorpion
      if (spider && Math.abs(spider.x - shot.x) < 12 && Math.abs(spider.y - shot.y) < 9) {
        const d = Math.abs(spider.y - player.y);
        const pts = d < 32 ? 900 : d < 64 ? 600 : 300;
        addScore(pts, spider.x, spider.y - 10, "#ffd34d"); sfx.spider(); burst(spider.x, spider.y, "#ff8a3a", 18, 160);
        spider = null; spiderT = rnd(2, 5) / diff.spider; shot = null; break;
      }
      if (flea && Math.abs(flea.x - shot.x) < 8 && Math.abs(flea.y - shot.y) < 9) {
        flea.hp--; shot = null;
        if (flea.hp <= 0) { addScore(200, flea.x, flea.y, "#3dd6ff"); burst(flea.x, flea.y, "#3dd6ff", 12, 120); sfx.seg(true); flea = null; }
        else { flea.vy *= 2; beep(900, 0.05, "square", 0.03); }
        break;
      }
      if (scorpion && Math.abs(scorpion.x - shot.x) < 12 && Math.abs(scorpion.y - shot.y) < 8) {
        addScore(1000, scorpion.x, scorpion.y - 10, "#b98cff"); sfx.scorpion(); burst(scorpion.x, scorpion.y, "#b98cff", 18, 150);
        scorpion = null; shot = null; break;
      }
      // mushrooms
      const c = Math.floor(shot.x / CELL), r = Math.floor((shot.y - TOP) / CELL);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && mush[r][c]) { damageMushroom(c, r); shot = null; break; }
    }
  }
  function updateSpider(dt) {
    if (!spider) {
      spiderT -= dt;
      if (spiderT <= 0) {
        const left = Math.random() < 0.5;
        spider = { dir: left ? 1 : -1, x: left ? -12 : W + 12, y: TOP + rnd(PZ - 4, ROWS - 1) * CELL, vx: (left ? 1 : -1) * rnd(70, 120) * diff.spider, vy: rnd(90, 150) * diff.spider * (Math.random() < 0.5 ? -1 : 1), zig: 0 };
      }
      return;
    }
    const s = spider;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const top = TOP + (PZ - 5) * CELL, bottom = H - 8;
    if (s.y < top) { s.y = top; s.vy = Math.abs(s.vy); }
    if (s.y > bottom) { s.y = bottom; s.vy = -Math.abs(s.vy); }
    s.zig -= dt;
    // it keeps crossing the same way, sometimes pausing its sideways run to bounce on the spot
    if (s.zig <= 0) { s.zig = rnd(0.3, 0.9); s.vx = Math.random() < 0.3 ? 0 : s.dir * rnd(70, 120) * diff.spider; s.vy = Math.sign(s.vy || 1) * rnd(90, 160) * diff.spider; }
    // it munches mushrooms as it goes
    const c = Math.floor(s.x / CELL), r = Math.floor((s.y - TOP) / CELL);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && mush[r][c] && Math.random() < 0.02) mush[r][c] = null;
    if (s.x < -30 || s.x > W + 30) { spider = null; spiderT = rnd(2, 6) / diff.spider; }
  }
  function updateFlea(dt) {
    if (!flea) {
      if (wave < 2) return;
      fleaT -= dt;
      if (fleaT <= 0 && mushCount(PZ, ROWS - 1) < 5 + Math.min(4, wave - 2)) {
        flea = { x: Math.floor(rnd(1, COLS - 1)) * CELL + CELL / 2, y: TOP, vy: 260, hp: 2, lastR: -1 };
        sfx.flea();
      }
      if (fleaT <= 0) fleaT = rnd(2, 5);
      return;
    }
    flea.y += flea.vy * dt;
    const r = Math.floor((flea.y - TOP) / CELL), c = Math.floor(flea.x / CELL);
    if (r !== flea.lastR && r >= 1 && r < ROWS - 1) { flea.lastR = r; if (!mush[r][c] && Math.random() < 0.28) mush[r][c] = { hp: 4, poison: false }; }
    if (flea.y > H + 10) flea = null;
  }
  function updateScorpion(dt) {
    if (!scorpion) {
      if (wave < 3) return;
      scorpionT -= dt;
      if (scorpionT <= 0) {
        const left = Math.random() < 0.5, row = Math.floor(rnd(3, PZ - 8));
        scorpion = { x: left ? -12 : W + 12, y: TOP + row * CELL + CELL / 2, vx: (left ? 1 : -1) * (wave > 5 ? 110 : 75) };
        scorpionT = rnd(12, 22);
      }
      return;
    }
    scorpion.x += scorpion.vx * dt;
    const r = Math.floor((scorpion.y - TOP) / CELL), c = Math.floor(scorpion.x / CELL);
    if (c >= 0 && c < COLS && mush[r][c]) mush[r][c].poison = true;
    if (scorpion.x < -30 || scorpion.x > W + 30) scorpion = null;
  }
  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 20 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.8));
    if (!isPlaying()) return;
    if (state === "dead") {
      stateT -= dt;
      // heal one damaged mushroom every few frames
      if (stateT < 1.2 && restoreQueue.length) {
        const [c, r] = restoreQueue.shift();
        if (mush[r][c]) { mush[r][c].hp = 4; mush[r][c].poison = false; addScore(5); sfx.restore(); }
        if (restoreQueue.length) stateT = Math.max(stateT, 0.3);
      }
      if (stateT <= 0 && !restoreQueue.length) afterDeath();
      return;
    }
    if (state === "between") { stateT -= dt; if (stateT <= 0) nextWave(); return; }

    movePlayer(dt);
    updateShot(dt);
    if (state !== "play") return;
    // centipede steps
    stepAcc += dt;
    while (stepAcc >= stepT) {
      stepAcc -= stepT;
      for (const s of segs) stepSegment(s);
      walkHi = !walkHi;
      if (segs.length) sfx.walk(walkHi);
    }
    // once it has reached the bottom, extra heads keep arriving from the sides
    if (reachedBottom) {
      headT += dt;
      if (headT > 6) {
        headT = 0;
        const left = Math.random() < 0.5;
        const s = newSeg(left ? 0 : COLS - 1, PZ, left ? 1 : -1, true);
        s.pc = s.c;
        segs.push(s);
      }
    }
    updateSpider(dt);
    updateFlea(dt);
    updateScorpion(dt);
    // anything touching the shooter
    const pr = PR + 1;
    for (const s of segs) { const p = segPos(s); if (Math.abs(p.x - player.x) < 6 + pr && Math.abs(p.y - player.y) < 6 + pr) { die(); return; } }
    if (spider && Math.abs(spider.x - player.x) < 11 + pr && Math.abs(spider.y - player.y) < 7 + pr) { die(); return; }
    if (flea && Math.abs(flea.x - player.x) < 6 + pr && Math.abs(flea.y - player.y) < 7 + pr) { die(); return; }
  }

  // ---------- Drawing ----------
  function drawMushroom(c, r, m) {
    const x = c * CELL, y = r * CELL + TOP, p = pal();
    const col = m.poison ? "#b98cff" : p.mush, edge = m.poison ? "#ffffff" : p.edge;
    const f = m.hp / 4; // damage eats the cap from the bottom up
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x + 8, y + 8, 7, Math.PI, 0); ctx.lineTo(x + 15, y + 9); ctx.lineTo(x + 1, y + 9); ctx.fill();
    ctx.fillStyle = edge;
    ctx.fillRect(x + 5, y + 9, 6, 3 + 3 * f);
    ctx.fillStyle = "#000";
    if (f < 1) ctx.fillRect(x, y + 2 + 8 * f, CELL, 3);
    if (f < 0.75) ctx.fillRect(x, y + 8 * f, CELL, 4);
    ctx.fillStyle = edge; ctx.fillRect(x + 4, y + 4, 2, 2); ctx.fillRect(x + 10, y + 3, 2, 2);
  }
  function drawSeg(s) {
    const p = segPos(s), P = pal();
    const col = s.head ? P.head : P.body;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
    // little legs
    const leg = Math.floor(clock * 12 + s.id) % 2 ? 2 : -2;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x - 4, p.y + 5); ctx.lineTo(p.x - 6 + leg, p.y + 8); ctx.moveTo(p.x + 4, p.y + 5); ctx.lineTo(p.x + 6 - leg, p.y + 8); ctx.stroke();
    if (s.head) {
      const d = s.dir;
      ctx.fillStyle = "#000"; ctx.fillRect(p.x + d * 2 - 1, p.y - 3, 3, 3);
      ctx.strokeStyle = P.body; ctx.beginPath(); ctx.moveTo(p.x + d * 3, p.y - 6); ctx.lineTo(p.x + d * 7, p.y - 10); ctx.moveTo(p.x - d * 1, p.y - 6); ctx.lineTo(p.x + d * 1, p.y - 11); ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(p.x - 1, p.y - 7, 2, 14);
    }
  }
  function drawPlayer() {
    const P = pal(), x = player.x, y = player.y;
    ctx.fillStyle = P.ship;
    ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 6, y + 2); ctx.lineTo(x + 4, y + 7); ctx.lineTo(x - 4, y + 7); ctx.lineTo(x - 6, y + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.head; ctx.fillRect(x - 1.5, y - 4, 3, 5);
    ctx.fillStyle = "#000"; ctx.fillRect(x - 3, y + 3, 2, 2); ctx.fillRect(x + 1, y + 3, 2, 2);
  }
  function drawSpider() {
    const s = spider, legs = Math.floor(clock * 14) % 2 ? 3 : -3;
    ctx.strokeStyle = "#ff8a3a"; ctx.lineWidth = 2;
    for (const k of [-1, 1]) for (const j of [0, 1, 2]) {
      ctx.beginPath(); ctx.moveTo(s.x + k * 4, s.y); ctx.lineTo(s.x + k * (8 + j * 2), s.y - 5 + j * 4 + (j === 1 ? legs : 0)); ctx.lineTo(s.x + k * (12 + j), s.y + 3 + j * 2); ctx.stroke();
    }
    ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.ellipse(s.x, s.y, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff4f6a"; ctx.fillRect(s.x - 3, s.y - 2, 2, 2); ctx.fillRect(s.x + 1, s.y - 2, 2, 2);
  }
  function drawFlea() {
    const f = flea;
    ctx.fillStyle = f.hp < 2 ? "#ffffff" : "#3dd6ff";
    ctx.beginPath(); ctx.ellipse(f.x, f.y, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#3dd6ff"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(f.x - 4, f.y + 4); ctx.lineTo(f.x - 7, f.y + 9); ctx.moveTo(f.x + 4, f.y + 4); ctx.lineTo(f.x + 7, f.y + 9); ctx.stroke();
  }
  function drawScorpion() {
    const s = scorpion, d = Math.sign(s.vx);
    ctx.fillStyle = "#b98cff";
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 1, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#b98cff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(s.x - d * 8, s.y); ctx.quadraticCurveTo(s.x - d * 14, s.y - 12, s.x - d * 4, s.y - 10); ctx.stroke();
    ctx.fillStyle = "#ff4f6a"; ctx.beginPath(); ctx.arc(s.x - d * 4, s.y - 10, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x + d * 8, s.y); ctx.lineTo(s.x + d * 13, s.y - 3); ctx.moveTo(s.x + d * 8, s.y + 3); ctx.lineTo(s.x + d * 13, s.y + 5); ctx.stroke();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    // player's zone hint
    ctx.fillStyle = "rgba(255,255,255,0.025)"; ctx.fillRect(0, TOP + PZ * CELL, W, (ROWS - PZ) * CELL);
    if (mush.length) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (mush[r][c]) drawMushroom(c, r, mush[r][c]);
    for (const s of segs) drawSeg(s);
    if (spider) drawSpider();
    if (flea) drawFlea();
    if (scorpion) drawScorpion();
    if (shot) { ctx.fillStyle = "#ffffff"; ctx.fillRect(shot.x - 1, shot.y - 6, 2, 8); }
    if (player && (state === "play" || state === "between" || state === "paused" && pausedFrom !== "dead")) drawPlayer();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.8));
      ctx.font = q.big ? "700 20px ui-monospace, Menlo, monospace" : "700 11px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center"; ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, TOP);
    ctx.fillStyle = pal().mush; ctx.fillRect(0, TOP - 2, W, 2);
    ctx.font = "700 14px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.fillStyle = "#f3fff0"; ctx.fillText(score.toLocaleString("it-IT"), 10, TOP / 2);
    ctx.textAlign = "center"; ctx.fillStyle = "#a8b8a0"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.fillText(`RECORD ${Math.max(bestCache, score).toLocaleString("it-IT")} · ONDATA ${Math.max(1, wave)}`, W / 2, TOP / 2);
    ctx.textAlign = "right";
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) {
      const x = W - 14 - i * 16, y = TOP / 2;
      ctx.fillStyle = pal().ship; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y + 2); ctx.lineTo(x + 3, y + 6); ctx.lineTo(x - 3, y + 6); ctx.lineTo(x - 5, y + 2); ctx.closePath(); ctx.fill();
    }
    ctx.textBaseline = "alphabetic";
    if (state === "between") {
      ctx.textAlign = "center"; ctx.font = "400 26px ui-monospace, Menlo, monospace"; ctx.fillStyle = pal().head;
      ctx.shadowColor = pal().head; ctx.shadowBlur = 12; ctx.fillText(`ONDATA ${wave + 1}`, W / 2, TOP + FH / 2); ctx.shadowBlur = 0;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  // a field behind the title screen
  wave = 1; placeMushrooms(DIFFICULTIES.normale.mush); spawnCentipede(12, 0); stepT = 0.1;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Raid sul Fiume</title>
<style>
  :root {
    --bg: #0e1622;
    --fg: #f4f6ee;
    --muted: #a8b4a8;
    --pink: #ffd23a;
    --yellow: #7ad0ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #22324a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: left/right to steer, up to speed up, down to slow down; FUOCO fires (hold it for a burst) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 90, 74, 0.9); background: rgba(255, 90, 74, 0.22); }
  #touch .jump.on { background: rgba(255, 90, 74, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 22, 34, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a3a0a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a0a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TAU = Math.PI * 2;
  const PY = 500, SEG = 8, SECT = 1600, ROWS = SECT / SEG, BRIDGE_AT = 80, START_AT = 170;
  const CRUISE = 110, FAST = 190, SLOW = 60, SIDE = 150, BULLET_V = 560;
  const KINDS = {
    nave:       { w: 36, h: 12, pts: 30 },
    elicottero: { w: 26, h: 14, pts: 60 },
    deposito:   { w: 20, h: 36, pts: 80 },
    jet:        { w: 28, h: 12, pts: 100 },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 aerei · fiume largo · nemici lenti · carburante che dura di più", lives: 5, burn: 2.3, chan: 14, dense: 0.75, speed: 0.75, act: 0.55, depots: 3 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "4 aerei", lives: 4, burn: 3, chan: 0, dense: 1, speed: 1, act: 0.8, depots: 2 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "3 aerei · fiume stretto · nemici svelti · serbatoio assetato", lives: 3, burn: 3.7, chan: -8, dense: 1.25, speed: 1.25, act: 1, depots: 2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "raid-difficulty";
  const bestKey = (id) => `raid-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1200, 0.07, "square", 0.025, -700)),
    boom: lim(() => { noise(0.35, 0.16, 500); beep(160, 0.25, "sawtooth", 0.035, -90); }),
    bridge: lim(() => { noise(0.8, 0.22, 260); arp([392, 523, 659, 784], 0.08, 0.14, "square", 0.04); }),
    fuel: lim(() => beep(500 + fuel * 8, 0.05, "triangle", 0.035)),
    low: lim(() => { beep(880, 0.12, "square", 0.035); beep(660, 0.12, "square", 0.035, 0, 0.14); }),
    crash: () => { noise(0.9, 0.24, 200); beep(140, 0.6, "sawtooth", 0.06, -90); },
    life: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    go: () => arp([392, 523, 659], 0.09, 0.12),
  };
  function engineSound() {
    if (!audioCtx) return;
    if (!engine) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sawtooth"; g.gain.value = 0; o.connect(g).connect(audioCtx.destination); o.start();
      engine = { o, g };
    }
    engine.o.frequency.setTargetAtTime(55 + P.v * 0.45, audioCtx.currentTime, 0.05);
    engine.g.gain.setTargetAtTime(state === "play" || state === "intro" ? 0.011 : 0, audioCtx.currentTime, 0.05);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, bestCache = 0, nextLife = 10000, fuel = 100, lowT = 0, fuelT = 0;
  let seed = 1, checkpoint = 0, builtTo = -1, sections = new Map();
  let P = null, things = [], bullets = [], parts = [], popups = [], message = null, broken = new Set(), jetT = 0, fireCool = 0;
  let firing = false;
  const keys = { left: false, right: false, up: false, down: false, fire: false };
  const stick = { x: 0, y: 0 };

  // ---------- The river ----------
  // Every stretch between two bridges is built from a seed, so after a crash the stretch comes back exactly the same.
  const level = (k) => Math.min(k, 12);
  const minChannel = (k) => 76 - level(k) * 1.6 + diff.chan;
  function waypoints(k) {
    const R = rng(seed * 7919 + k * 104729);
    const lv = level(k), mc = minChannel(k), n = ROWS / 20, wps = [];
    for (let j = 0; j <= n; j++) {
      // a straight, narrow channel under each bridge
      if (j <= 1 || j === n) { wps.push({ cx: 180, w: 130, isl: 0 }); continue; }
      const prev = wps[j - 1], last = j === n - 1;
      const maxW = 330 - lv * 7;
      let w = R() < 0.18 + lv * 0.02 ? mc + R() * 16 : mc * 1.4 + R() * (maxW - mc * 1.4);
      w = clamp(w, prev.w - 60, prev.w + 60);
      if (last) w = clamp(w, Math.max(mc, 70), 190);
      let cx = clamp(prev.cx + (R() * 2 - 1) * 55, w / 2 + 6, W - w / 2 - 6);
      if (last) cx = clamp(cx, 180 - 50, 180 + 50);
      // islands split the river in two; each side stays wide enough to fly through
      let isl = 0;
      const room = w - 2 * mc;
      // no island right in front of the take-off point
      if (!last && j > 2 && room > 40 && R() < 0.3 + lv * 0.03) isl = Math.min(room, prev.isl + 60, 40 + R() * (room - 40));
      if (prev.isl > 0 && isl === 0 && room > 20 && R() < 0.5) isl = Math.min(room, Math.max(0, prev.isl - 50));
      wps.push({ cx, w, isl });
    }
    return wps;
  }
  function section(k) {
    let s = sections.get(k);
    if (s) return s;
    const wps = waypoints(k);
    const l = new Float32Array(ROWS), r = new Float32Array(ROWS), il = new Float32Array(ROWS), ir = new Float32Array(ROWS);
    for (let i = 0; i < ROWS; i++) {
      const j = Math.floor(i / 20), t = (i % 20) / 20, e = (1 - Math.cos(Math.PI * t)) / 2, a = wps[j], b = wps[j + 1];
      const cx = a.cx + (b.cx - a.cx) * e, w = a.w + (b.w - a.w) * e, isl = a.isl + (b.isl - a.isl) * e;
      l[i] = cx - w / 2; r[i] = cx + w / 2;
      if (isl > 6) { il[i] = cx - isl / 2; ir[i] = cx + isl / 2; } else { il[i] = ir[i] = cx; }
    }
    s = { l, r, il, ir };
    sections.set(k, s);
    return s;
  }
  function rowAt(d) {
    const k = Math.floor(d / SECT), s = section(Math.max(0, k)), i = clamp(Math.floor((d - Math.max(0, k) * SECT) / SEG), 0, ROWS - 1);
    return { l: s.l[i], r: s.r[i], il: s.il[i], ir: s.ir[i] };
  }
  function isWater(x, d) {
    const w = rowAt(d);
    return x > w.l && x < w.r && !(x > w.il && x < w.ir);
  }
  function boxInWater(x, d, w, h, m = 0) {
    const x0 = x - w / 2 - m, x1 = x + w / 2 + m, n = Math.ceil((x1 - x0) / 5);
    for (const dd of [d - h / 2, d, d + h / 2]) for (let i = 0; i <= n; i++) if (!isWater(x0 + (x1 - x0) * i / n, dd)) return false;
    return true;
  }
  const bridgeD = (k) => k * SECT + BRIDGE_AT;

  // Enemies and fuel depots of one stretch, always the same for the same stretch
  function populate(k) {
    const R = rng(seed * 31337 + k * 7703), lv = level(k), list = [];
    const base = k * SECT;
    const place = (kind, d0, d1) => {
      const K = KINDS[kind];
      for (let tries = 0; tries < 40; tries++) {
        const d = base + d0 + R() * (d1 - d0);
        if (list.some((o) => Math.abs(o.d - d) < 64)) continue;
        const row = rowAt(d);
        const x = row.l + R() * (row.r - row.l);
        if (!boxInWater(x, d, K.w, K.h, 4)) continue;
        const moves = kind !== "deposito" && R() < Math.min(0.95, (0.3 + lv * 0.07) * diff.act);
        const v = (kind === "nave" ? 34 + lv * 3 : 52 + lv * 4) * diff.speed * (0.8 + R() * 0.4);
        list.push({ kind, x, d, vx: moves ? (R() < 0.5 ? -v : v) : 0, moves, trig: 170 + R() * 200, awake: false, dead: false, t: R() * 10 });
        return;
      }
    };
    // fuel: spread evenly along the stretch, so there is always one ahead
    for (let i = 0; i < diff.depots; i++) { const f = (i + 0.5) / diff.depots; place("deposito", 300 + f * (SECT - 520) - 90, 300 + f * (SECT - 520) + 90); }
    const n = Math.round((5 + lv * 0.9) * diff.dense);
    for (let i = 0; i < n; i++) place(R() < 0.45 + lv * 0.02 ? "elicottero" : "nave", 380, SECT - 150);
    return list;
  }
  function ensureBuilt() {
    while (builtTo < Math.floor((P.d + 900) / SECT)) { builtTo++; things.push(...populate(builtTo)); }
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "crash"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; nextLife = 10000; checkpoint = 0;
    seed = Math.floor(Math.random() * 1e6); sections = new Map(); broken = new Set();
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    launch();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function launch() {
    // take off again just past the last bridge blown up, with a full tank; that stretch starts over
    P = { x: 180, d: checkpoint * SECT + START_AT, v: CRUISE, vx: 0, alive: true, tilt: 0 };
    fuel = 100; lowT = 0; fireCool = 0; jetT = 4;
    things = []; bullets = []; builtTo = checkpoint - 1;
    ensureBuilt();
    message = { text: checkpoint ? `PONTE ${checkpoint}` : "DECOLLO!", sub: checkpoint ? "si riparte da qui" : "abbatti i ponti e non restare a secco", t: 0 };
    state = "intro"; stateT = 1.4;
    sfx.go();
  }
  function addScore(n, x, y, color = "#f4f6ee") {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 10000; sfx.life(); popups.push({ x: W / 2, y: 140, text: "AEREO EXTRA!", color: "#ffd23a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  const sy = (d) => PY - (d - P.d);
  function burst(x, y, c, n = 14, sp = 120, life = 0.7) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function destroy(o) {
    o.dead = true;
    const K = KINDS[o.kind];
    addScore(K.pts, o.x, sy(o.d) - 16, o.kind === "deposito" ? "#ff8a7a" : "#ffd23a");
    burst(o.x, sy(o.d), o.kind === "deposito" ? "#ff5a4a" : "#ffb03a", 16, 130, 0.7); burst(o.x, sy(o.d), "#5a5a5a", 8, 70, 0.8);
    sfx.boom();
  }
  function blowBridge(k) {
    broken.add(k); checkpoint = Math.max(checkpoint, k);
    const d = bridgeD(k), row = rowAt(d);
    addScore(500, W / 2, sy(d) - 20, "#ffd23a");
    for (let x = row.l + 8; x < row.r; x += 18) { burst(x, sy(d), "#8a6a4a", 5, 110, 0.9); burst(x, sy(d), "#ffb03a", 3, 90, 0.6); }
    message = { text: `PONTE ${k} DISTRUTTO!`, sub: "+500 · se cadi, riparti da qui", t: 0 };
    sfx.bridge();
  }
  function crash(why) {
    if (!P.alive) return;
    P.alive = false; P.why = why;
    burst(P.x, PY, "#ffd23a", 26, 160, 0.9); burst(P.x, PY, "#ff5a4a", 16, 110, 0.8); burst(P.x, PY, "#4a4a4a", 12, 80, 1);
    sfx.crash();
    lives--;
    state = "crash"; stateT = 1.8;
  }
  function gameOver() {
    state = "over";
    if (engine) engine.g.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "AEREI FINITI!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ponti abbattuti: ${checkpoint} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      if (engine) engine.g.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02);

    if (message) {
      ctx.globalAlpha = Math.min(1, (2 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 200, W, 60);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0e1622"; ctx.strokeText(message.text, W / 2, 230); ctx.fillText(message.text, W / 2, 230);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f4f6ee"; ctx.fillText(message.sub, W / 2, 250); }
      ctx.globalAlpha = 1;
    }
    if (state === "crash") {
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui"; ctx.fillStyle = "#ff5a4a"; ctx.lineWidth = 4; ctx.strokeStyle = "#0e1622";
      const t = { bank: "CONTRO LA RIVA!", hit: "COLPITO!", bridge: "CONTRO IL PONTE!", fuel: "SENZA CARBURANTE!" }[P.why];
      ctx.strokeText(t, W / 2, 320); ctx.fillText(t, W / 2, 320);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="raid-best-" data-kind="score"></script>

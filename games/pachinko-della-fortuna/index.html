<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pachinko della Fortuna</title>
<style>
  :root {
    --bg: #0a0a1e;
    --fg: #f4f6ee;
    --muted: #e0c8f0;
    --pink: #ff4ad8;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: turn the power knob left and right; hold LANCIA to keep shooting balls */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 74, 216, 0.9); background: rgba(255, 74, 216, 0.22); }
  #touch .jump.on { background: rgba(255, 74, 216, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 10, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0222; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a01a8a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Lancia">LANCIA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const FX0 = 160, FX1 = 480, FY0 = 64, FY1 = 350, BR = 3.6, PR = 2.6, GRAV = 520;
  const START = { x: 320, y: 238, w: 14 }, TULIPS = [{ x: 222, y: 286, w: 14 }, { x: 418, y: 286, w: 14 }], GATE = { x: 320, y: 304, w: 52 };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "300 biglie · la febbre arriva più spesso", balls: 300, odds: 0.14 },
    normale:   { label: "NORMALE",   color: "#ff4ad8", desc: "200 biglie", balls: 200, odds: 0.1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "150 biglie · la febbre è più rara", balls: 150, odds: 0.075 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pachinko-difficulty";
  const bestKey = (id) => `pachinko-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  // the feats of shared/imprese.js: the game only announces them, the hall keeps them
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    shoot: lim(() => beep(900, 0.03, "square", 0.012, -400)),
    pin: lim(() => beep(rnd(3000, 4200), 0.02, "triangle", 0.008)),
    pocket: lim(() => arp([1047, 1319], 0.04, 0.06, "square", 0.03)),
    tick: lim(() => beep(1500, 0.02, "square", 0.015)),
    reach: () => arp([659, 784, 659, 784, 880, 988], 0.09, 0.1, "square", 0.04),
    fever: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568, 2093], 0.07, 0.14, "square", 0.05),
    miss: () => arp([392, 330], 0.1, 0.15, "triangle", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, stock = 200, bestCache = 0, balls = [], pins = [], parts = [], popups = [], message = null, power = 0.5, shootCd = 0, shot = 0, won = 0, jackpots = 0;
  let reels = [7, 7, 7], spin = null, held = 0, fever = 0, feverIn = 0, idleT = 0, lightT = 0;
  let launchHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The board ----------
  // rows of brass pins, with clear lanes leading into the pockets
  function buildPins() {
    pins = [];
    for (let r = 0; r < 11; r++) {
      const y = 96 + r * 19, off = (r % 2) * 13;
      for (let x = FX0 + 14 + off; x < FX1 - 10; x += 26) {
        if (Math.abs(x - START.x) < 12 && y > START.y - 30 && y < START.y + 4) continue;
        if (y > 220 && y < 262 && Math.abs(x - START.x) < 34 && Math.abs(x - START.x) > 8) { pins.push({ x, y }); continue; }
        pins.push({ x, y });
      }
    }
    // the reels window is a solid box: no pins inside, a rim of pins around it
    pins = pins.filter((p) => !(p.x > 262 && p.x < 378 && p.y > 120 && p.y < 180));
    for (let x = 270; x <= 370; x += 8) { pins.push({ x, y: 126 }); pins.push({ x, y: 174 }); }
    for (let y = 134; y <= 166; y += 8) { pins.push({ x: 268, y }); pins.push({ x: 372, y }); }
    // the pins that frame the pockets
    for (const p of [START, ...TULIPS]) { pins.push({ x: p.x - p.w / 2 - 3, y: p.y - 8 }); pins.push({ x: p.x + p.w / 2 + 3, y: p.y - 8 }); }
  }
  // the knob's power decides where the ball comes in at the top of the board
  const entryX = (pw) => FX0 + 20 + pw * (FX1 - FX0 - 40);
  function launch() {
    stock--; shot++;
    balls.push({ x: clamp(entryX(power) + rnd(-10, 10), FX0 + 6, FX1 - 6), y: FY0 + 2, vx: rnd(-25, 25), vy: rnd(10, 40) });
    sfx.shoot();
  }
  function physics(dt) {
    for (const b of balls) {
      b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < FX0 + BR) { b.x = FX0 + BR; b.vx = Math.abs(b.vx) * 0.5; }
      if (b.x > FX1 - BR) { b.x = FX1 - BR; b.vx = -Math.abs(b.vx) * 0.5; }
      for (const p of pins) {
        const dx = b.x - p.x, dy = b.y - p.y, d2 = dx * dx + dy * dy, m = BR + PR;
        if (d2 >= m * m) continue;
        const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d;
        b.x = p.x + nx * m; b.y = p.y + ny * m;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 1.55 * vn * nx; b.vy -= 1.55 * vn * ny; b.vx += rnd(-12, 12); sfx.pin(); }
      }
      // the pockets catch balls falling into their mouths
      if (b.vy > 0) {
        if (Math.abs(b.x - START.x) < START.w / 2 && b.y > START.y && b.y < START.y + 8) { b.gone = true; startPocket(b); continue; }
        for (const t of TULIPS) if (Math.abs(b.x - t.x) < t.w / 2 && b.y > t.y && b.y < t.y + 8) { b.gone = true; payout(4, t.x, t.y, "#7ad8ff"); break; }
        if (!b.gone && fever > 0 && Math.abs(b.x - GATE.x) < GATE.w / 2 && b.y > GATE.y && b.y < GATE.y + 10) { b.gone = true; feverIn++; payout(13, b.x, GATE.y, "#ffd23a"); if (feverIn === 6) impresa("porta"); }
      }
      if (b.y > FY1) b.gone = true;
      // a ball resting in a groove between two pins gets a nudge, as the glass would
      b.age = (b.age || 0) + dt;
      if (Math.abs(b.vx) + Math.abs(b.vy) < 25) { b.still = (b.still || 0) + dt; if (b.still > 0.4) { b.vx = (Math.random() < 0.5 ? -1 : 1) * 60; b.vy = -40; b.still = 0; } } else b.still = 0;
      if (b.age > 20) b.gone = true;
    }
    balls = balls.filter((b) => !b.gone);
  }
  function payout(n, x, y, color) {
    stock += n; won += n; score += n * 10; idleT = 0;
    popups.push({ x, y: y - 8, text: `+${n}`, color, t: 0 });
    sfx.pocket();
  }
  function startPocket(b) {
    payout(3, START.x, START.y, "#ff4ad8");
    // each ball in the start pocket spins the reels (up to four waiting)
    if (spin || fever > 0) held = Math.min(4, held + 1); else spinReels();
  }
  function spinReels() {
    // the outcome is decided now; the reels just take their time to show it
    const hit = Math.random() < diff.odds, reach = hit || Math.random() < 0.18;
    const a = 1 + Math.floor(Math.random() * 7);
    let c = hit ? a : 1 + Math.floor(Math.random() * 7);
    if (!hit && c === a) c = (a % 7) + 1;
    const b = reach ? a : ((a + 1 + Math.floor(Math.random() * 5)) % 7) + 1;
    spin = { t: 0, res: [a, b, c], hit, reach, stop: [0.9, 1.4, reach ? 3.4 : 1.9], shown: [false, false, false] };
  }
  function updateReels(dt) {
    if (!spin) { if (held > 0 && fever <= 0) { held--; spinReels(); } return; }
    spin.t += dt;
    for (let i = 0; i < 3; i++) {
      if (!spin.shown[i] && spin.t >= spin.stop[i]) { spin.shown[i] = true; reels[i] = spin.res[i]; sfx.tick(); if (i === 1 && spin.reach) { sfx.reach(); message = { text: "ATTESA!", sub: "due numeri uguali...", t: 0 }; } }
      else if (!spin.shown[i] && Math.random() < dt * 20) reels[i] = 1 + Math.floor(Math.random() * 7);
    }
    if (spin.t > spin.stop[2] + 0.3) {
      if (spin.hit) {
        jackpots++; fever = 9; feverIn = 0; sfx.fever();
        if (reels[0] === 7) impresa("sette");
        if (jackpots === 2) impresa("doppia");
        score += 500 * jackpots;
        message = { text: `FEBBRE ${reels[0]}${reels[0]}${reels[0]}!`, sub: "la grande porta si apre: mira al centro!", t: 0, long: true };
      } else if (spin.reach) sfx.miss();
      spin = null;
    }
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; stock = diff.balls; shot = 0; won = 0; jackpots = 0; held = 0; fever = 0; spin = null; balls = []; idleT = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildPins();
    message = { text: "PACHINKO!", sub: "regola la forza e tieni premuto LANCIA", t: 0 };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">BIGLIE FINITE</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${shot} biglie lanciate · ${won} vinte · ${jackpots} ${jackpots === 1 ? "febbre" : "febbri"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>ALTRE BIGLIE</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PACHINKO DELLA FORTUNA</h1>
       <p>Il flipper verticale delle sale giochi giapponesi! Le biglie entrano dall'alto e rimbalzano tra centinaia di chiodi. Tu regoli solo la forza del lancio, cioè dove entrano. Se una biglia cade nella tasca centrale girano i rulli: con tre numeri uguali scatta la FEBBRE, la grande porta si apre e ogni biglia che ci entra ne vale tredici.</p>
       <div class="pts">
         <span><b>Tasche</b></span><span>tasca centrale +3 e gira i rulli · tulipani ai lati +4 · porta della febbre +13 per biglia · ogni biglia vinta 10 punti</span>
         <span><b>Febbre</b></span><span>9 secondi di porta aperta · 500 punti per la prima, 1.000 per la seconda e così via</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a sinistra e destra per la forza (dove entrano le biglie) · tieni premuto LANCIA</p>`
         : `<p class="muted help">Frecce o A D per la forza · tieni premuto SPAZIO (o J) per lanciare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>CAMBIA LE BIGLIE</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "right", w: "right", arrowdown: "left", s: "left" };
  const LAUNCHKEYS = [" ", "j", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (LAUNCHKEYS.includes(k)) launchHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (LAUNCHKEYS.includes(k)) launchHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; launchHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); launchHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { launchHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.12 ? 0 : Math.sign(v) * Math.min(1, (a - 0.12) / 0.6); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (message) { message.t += dt; if (message.t > (message.long ? 2.8 : 2)) message = null; }
    if (state !== "play") return;
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    power = clamp(power + mx * 0.45 * dt, 0, 1);
    if (shootCd > 0) shootCd -= dt;
    if (launchHeld && shootCd <= 0 && stock > 0) { launch(); shootCd = 0.3; }
    if (fever > 0) { fever -= dt; if (fever <= 0) { message = { text: "FINE DELLA FEBBRE", sub: `${feverIn} biglie nella porta`, t: 0 }; } }
    updateReels(dt);
    physics(dt);
    if (stock <= 0 && !balls.length && !spin && held <= 0 && fever <= 0) { idleT += dt; if (idleT > 1.5) gameOver(); } else idleT = 0;
  }

  // ---------- Drawing ----------
  function drawBoard() {
    // the cabinet face with its glass, chrome rails and lamps
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#1a0a3a"); g.addColorStop(1, "#0a0a1e");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    ctx.fillStyle = "#2a1a4a"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(FX0 - 14, FY0 - 22, FX1 - FX0 + 28, FY1 - FY0 + 30, 26) : ctx.rect(FX0 - 14, FY0 - 22, FX1 - FX0 + 28, FY1 - FY0 + 30); ctx.fill();
    ctx.fillStyle = "#e8e0f0"; ctx.globalAlpha = 0.08; ctx.fillRect(FX0, FY0, FX1 - FX0, FY1 - FY0); ctx.globalAlpha = 1;
    ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(FX0, FY1); ctx.lineTo(FX0, FY0 + 10); ctx.quadraticCurveTo(FX0, FY0 - 12, FX0 + 30, FY0 - 12); ctx.lineTo(FX1 - 30, FY0 - 12); ctx.quadraticCurveTo(FX1, FY0 - 12, FX1, FY0 + 10); ctx.lineTo(FX1, FY1); ctx.stroke();
    for (let i = 0; i < 16; i++) { const a = i / 15 * Math.PI, x = 320 - Math.cos(a) * 175, y = FY0 - 12 - Math.sin(a) * 18; ctx.fillStyle = `hsla(${(i * 25 + clock * 120) % 360},90%,60%,${fever > 0 ? 1 : 0.5 + 0.3 * Math.sin(clock * 4 + i)})`; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); }
    // where the knob sends the balls
    ctx.fillStyle = "rgba(255,74,216,0.35)"; ctx.beginPath(); ctx.moveTo(entryX(power) - 8, FY0); ctx.lineTo(entryX(power) + 8, FY0); ctx.lineTo(entryX(power), FY0 + 12); ctx.fill();
    // the reels window in the middle of the board
    const rx = 320, ry = 150;
    ctx.fillStyle = "#0a0a1a"; ctx.fillRect(rx - 50, ry - 22, 100, 40);
    ctx.strokeStyle = fever > 0 ? "#ffd23a" : "#ff4ad8"; ctx.lineWidth = 2; ctx.strokeRect(rx - 50, ry - 22, 100, 40);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = "#f4f4f8"; ctx.fillRect(rx - 45 + i * 31, ry - 18, 28, 32);
      const spinning = spin && !spin.shown[i];
      ctx.fillStyle = spinning ? "#8a8aa8" : reels[i] === 7 ? "#ff3a3a" : "#1a1a3a"; ctx.font = "900 22px system-ui"; ctx.textAlign = "center"; ctx.fillText(String(reels[i]), rx - 31 + i * 31, ry + 6);
    }
    if (held) for (let i = 0; i < held; i++) { ctx.fillStyle = "#ff4ad8"; ctx.beginPath(); ctx.arc(rx - 15 + i * 10, ry + 26, 3, 0, TAU); ctx.fill(); }
    for (const p of pins) { ctx.fillStyle = "#c8a85a"; ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, TAU); ctx.fill(); ctx.fillStyle = "#fff4c8"; ctx.fillRect(p.x - 1, p.y - 1.5, 1.5, 1.5); }
    // the pockets
    const pocket = (p, col, label) => {
      ctx.fillStyle = col; ctx.fillRect(p.x - p.w / 2 - 2, p.y, p.w + 4, 9);
      ctx.fillStyle = "#0a0a1a"; ctx.fillRect(p.x - p.w / 2, p.y + 2, p.w, 6);
      ctx.fillStyle = "#ffffff"; ctx.font = "800 7px system-ui"; ctx.textAlign = "center"; ctx.fillText(label, p.x, p.y + 18);
    };
    pocket(START, "#ff4ad8", "AVVIO");
    for (const t of TULIPS) pocket(t, "#5ab8ff", "+4");
    // the fever gate: closed it is just a plate, open it swallows everything
    ctx.fillStyle = fever > 0 ? "#ffd23a" : "#4a3a6a";
    if (fever > 0) { ctx.fillRect(GATE.x - GATE.w / 2 - 6, GATE.y - 4, 6, 18); ctx.fillRect(GATE.x + GATE.w / 2, GATE.y - 4, 6, 18); ctx.fillStyle = "#0a0a1a"; ctx.fillRect(GATE.x - GATE.w / 2, GATE.y, GATE.w, 14); ctx.fillStyle = "#ffd23a"; ctx.font = "900 9px system-ui"; ctx.fillText(`APERTA ${Math.ceil(fever)}`, GATE.x, GATE.y + 26); }
    else { ctx.fillRect(GATE.x - GATE.w / 2, GATE.y, GATE.w, 8); ctx.fillStyle = "#a89ac8"; ctx.font = "800 7px system-ui"; ctx.fillText("FEBBRE", GATE.x, GATE.y + 7); }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(10,10,30,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e0c8f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff4ad8"; ctx.font = "900 10px system-ui"; ctx.fillText(`FEBBRI ${jackpots}`, x0 + 80, 21);
    ctx.textBaseline = "alphabetic";
    // the ball tray and the power knob
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(18, 70, 120, 80); ctx.fillRect(W - 138, 70, 120, 120);
    ctx.textAlign = "center"; ctx.fillStyle = "#e0c8f0"; ctx.font = "800 10px system-ui"; ctx.fillText("BIGLIE", 78, 88);
    ctx.fillStyle = stock < 20 ? "#ff5a5a" : "#ffffff"; ctx.font = "900 30px system-ui"; ctx.fillText(String(stock), 78, 124);
    ctx.fillStyle = "#c8c8d8"; for (let i = 0; i < Math.min(30, stock); i++) { ctx.beginPath(); ctx.arc(26 + (i % 15) * 7.4, 136 + Math.floor(i / 15) * 7, 3, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#e0c8f0"; ctx.font = "800 10px system-ui"; ctx.fillText("FORZA", W - 78, 88);
    const kx = W - 78, ky = 140, a = Math.PI * 0.75 + power * Math.PI * 1.5;
    ctx.fillStyle = "#3a2a5a"; ctx.beginPath(); ctx.arc(kx, ky, 30, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#ff4ad8"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(kx, ky, 34, Math.PI * 0.75, a); ctx.stroke();
    ctx.fillStyle = "#e8e8f8"; ctx.beginPath(); ctx.arc(kx, ky, 22, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#1a1a3a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx + Math.cos(a) * 18, ky + Math.sin(a) * 18); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.font = "900 12px system-ui"; ctx.fillText(`${Math.round(power * 100)}%`, kx, ky + 50);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!pins.length) buildPins();
    drawBoard();
    for (const b of balls) { const g = ctx.createRadialGradient(b.x - 1, b.y - 1, 0.5, b.x, b.y, BR); g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#8a8aa8"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, TAU); ctx.fill(); }
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0a0a1e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 2.8 : 2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = fever > 0 ? "#ffd23a" : "#ff4ad8";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0a0a1e"; ctx.strokeText(message.text, W / 2, 112); ctx.fillText(message.text, W / 2, 112);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 130); ctx.fillText(message.sub, W / 2, 130); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tiro a Segno</title>
<style>
  :root {
    --bg: #120c1e;
    --fg: #fff6e8;
    --muted: #c8b8a8;
    --red: #e83a3a;
    --gold: #ffcf3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a2a4a, 0 10px 40px rgba(0,0,0,0.6); cursor: none; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 246, 232, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 12, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 10vw, 60px); font-weight: 900; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #a82a2a, 0 0 22px rgba(255,207,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,246,232,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #3a1a0a; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a86a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  const ROW1 = 118, ROW2 = 196, SHELF = 268, COUNTER = 300;
  const CLIP = 6, RELOAD_TIME = 0.9, ROUND_TIME = 40, BONUS_TIME = 20;
  const RELOAD_BOX = { x: 532, y: 314, w: 98, h: 38 };
  const BOTTLE_SLOTS = [110, 190, 270, 370, 450, 530];
  const POP_SLOTS = [150, 230, 320, 410, 490];
  const PTS = { bottle: 40, duck: 60, rabbit: 100, balloon: 30, golden: 500, clock: 50 };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "bersagli lenti · punteggio minimo basso", speed: 0.85, quota: 0.75, pop: 1.9 },
    normale:   { label: "NORMALE",   color: "#ffcf3a", desc: "bersagli a velocità normale", speed: 1, quota: 1, pop: 1.5 },
    difficile: { label: "DIFFICILE", color: "#e83a3a", desc: "bersagli veloci · punteggio minimo alto", speed: 1.2, quota: 1.25, pop: 1.2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "tiro-difficulty";
  const bestKey = (id) => `tiro-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => { noise(0.08, 0.16, 1800); beep(180, 0.06, "square", 0.04, -100); }),
    ding: lim((p) => beep(880 + p * 60, 0.12, "triangle", 0.06)),
    glass: lim(() => { noise(0.2, 0.1, 5000); beep(2400, 0.08, "sine", 0.03); }),
    pop: lim(() => { noise(0.06, 0.14, 3000); beep(1200, 0.04, "square", 0.03, -600); }),
    miss: lim(() => beep(140, 0.05, "square", 0.02)),
    empty: lim(() => beep(260, 0.03, "square", 0.03)),
    reload: () => { beep(500, 0.04, "square", 0.03); beep(700, 0.05, "square", 0.03, 0, 0.35); beep(900, 0.05, "square", 0.03, 0, 0.7); },
    owl: () => arp([330, 262, 196], 0.08, 0.14, "sawtooth", 0.04),
    golden: () => arp([1047, 1319, 1568, 2093], 0.05, 0.1),
    clock: () => arp([784, 1047], 0.06, 0.1),
    combo: lim(() => arp([1319, 1568], 0.04, 0.07, "triangle", 0.04)),
    pass: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.18),
    tick: lim(() => beep(1500, 0.03, "square", 0.02)),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, round = 0, roundScore = 0, quota = 0, timeLeft = 0, bestCache = 0, bonusRound = false;
  let ammo = CLIP, reloadT = 0, streak = 0, shots = 0, hits = 0, roundShots = 0, roundHits = 0;
  let targets = [], bottles = [], parts = [], popups = [], holes = [], message = null, tally = null;
  let spawn1 = 0, spawn2 = 0, spawnPop = 0, spawnBalloon = 0, spawnGold = 0, recoil = 0;
  const cross = { x: W / 2, y: 180, seen: false };
  const keys = { left: false, right: false, up: false, down: false };

  const isBonus = (r) => r % 3 === 2;
  const speedK = () => diff.speed * (1 + Math.min(round, 12) * 0.06);
  const mult = () => Math.min(4, 1 + Math.floor(streak / 5));

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "tally"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; round = 0; shots = 0; hits = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginRound() {
    bonusRound = isBonus(round);
    roundScore = 0; roundShots = 0; roundHits = 0; streak = 0;
    const n = round - Math.floor(round / 3);
    quota = bonusRound ? 0 : Math.round((4000 + 1900 * n) * diff.quota / 100) * 100;
    timeLeft = bonusRound ? BONUS_TIME : ROUND_TIME;
    ammo = CLIP; reloadT = 0;
    targets = []; parts = []; popups = []; holes = [];
    bottles = BOTTLE_SLOTS.map((x) => ({ x, alive: true, t: rnd(0, 1) }));
    spawn1 = 0; spawn2 = 0.5; spawnPop = 1.5; spawnBalloon = bonusRound ? 0 : 3; spawnGold = rnd(8, 16);
    if (!bonusRound) {
      // start with the rails already populated
      for (let x = -20; x < W; x += rnd(80, 130)) addDuck(x);
      for (let x = W + 20; x > 0; x -= rnd(100, 160)) addRabbit(x);
    }
    message = bonusRound ? { text: "PIOGGIA DI PALLONCINI!", sub: "round bonus: nessun minimo da raggiungere", t: 0 }
      : { text: `ROUND ${round + 1}`, sub: `punteggio minimo ${quota.toLocaleString("it-IT")} in ${ROUND_TIME} secondi`, t: 0 };
    state = "intro"; stateT = 2;
  }
  function addDuck(x) {
    // now and then a clock (extra time) or an owl you must not hit rides the duck rail
    const r = Math.random();
    const kind = r < 0.1 + Math.min(round, 8) * 0.012 ? "owl" : r < 0.16 + Math.min(round, 8) * 0.012 ? "clock" : "duck";
    targets.push({ kind, x, y: ROW1, vx: 70 * speedK(), r: kind === "clock" ? 13 : 15, ph: rnd(0, TAU), hitT: 0 });
  }
  function addRabbit(x) {
    const kind = Math.random() < 0.08 + Math.min(round, 8) * 0.01 ? "owl" : "rabbit";
    targets.push({ kind, x, y: ROW2, vx: -105 * speedK(), r: kind === "owl" ? 15 : 13, ph: rnd(0, TAU), hitT: 0 });
  }
  function addPopup() {
    const free = POP_SLOTS.filter((x) => !targets.some((t) => t.kind === "bull" && t.x === x));
    if (!free.length) return;
    targets.push({ kind: "bull", x: free[Math.floor(Math.random() * free.length)], y: SHELF - 30, vx: 0, r: 22, up: 0, life: diff.pop * (1 - Math.min(round, 10) * 0.03), hitT: 0 });
  }
  function addBalloon() {
    const colors = ["#e83a3a", "#3a8aff", "#ffcf3a", "#6ae86a", "#c86aff", "#ff8ad0"];
    targets.push({ kind: "balloon", x: rnd(60, W - 60), y: COUNTER + 20, vx: 0, vy: -rnd(38, 60) * speedK(), r: 13, ph: rnd(0, TAU), c: colors[Math.floor(Math.random() * colors.length)], hitT: 0 });
  }
  function addGolden() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    targets.push({ kind: "golden", x: dir > 0 ? -30 : W + 30, y: rnd(72, 90), vx: dir * 230 * speedK(), r: 12, ph: 0, hitT: 0 });
  }
  function addScore(n, x, y, color = "#fff6e8") {
    score += n; roundScore += n;
    if (x !== undefined) popups.push({ x, y, text: (n > 0 ? "" : "") + n, color, t: 0 });
  }
  function burst(x, y, c, n = 10, sp = 120, life = 0.6, g = 300) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, g, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function endRound() {
    const acc = roundShots ? roundHits / roundShots : 0;
    const accBonus = Math.round(acc * 10) * 100;
    const passed = bonusRound || roundScore >= quota;
    if (passed) { score += accBonus; sfx.pass(); }
    tally = { passed, acc, accBonus, roundScore, quota };
    state = "tally"; stateT = 3.2;
  }
  function afterTally() {
    if (!tally.passed) { gameOver(); return; }
    round++;
    beginRound();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const acc = shots ? Math.round(hits / shots * 100) : 0;
    const failed = tally && !tally.passed;
    menu = () => showOverlay(
      `<h2 class="lose">${failed ? "PUNTEGGIO MINIMO MANCATO" : "PARTITA FINITA"}</h2>
       ${failed ? `<p>Round ${round + 1}: ${tally.roundScore.toLocaleString("it-IT")} punti su ${tally.quota.toLocaleString("it-IT")}.</p>` : ""}
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · precisione ${acc}% · ${diff.label}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); tally = null; gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>TIRO A SEGNO</h1>
       <p>Il baraccone del luna park è aperto! Papere, conigli, bottiglie e bersagli che spuntano dal bancone: in ogni round devi fare almeno il punteggio minimo prima che scada il tempo. Occhio al gufo col cartello: non va colpito.</p>
       <div class="pts">
         <span><b>Bersagli</b></span><span>bottiglia 40 · papera 60 · coniglio 100 · palloncino 30 · bersaglio 50/100/200 (centro)</span>
         <span><b>Speciali</b></span><span>papera d'oro in volo 500 · orologio +5 secondi</span>
         <span><b>Gufo</b></span><span>colpirlo costa 200 punti e 3 secondi</span>
         <span><b>Combo</b></span><span>ogni 5 colpi a segno di fila il moltiplicatore sale (fino a ×4); un colpo a vuoto lo azzera</span>
         <span><b>Fucile</b></span><span>${CLIP} colpi, poi si ricarica da solo; puoi ricaricare prima quando vuoi</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tocca un bersaglio per sparare · tocca RICARICA sul bancone per ricaricare</p>`
         : `<p class="muted help">Mira col mouse e clicca per sparare · tasto destro o R per ricaricare · (anche frecce + SPAZIO) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SI SPARA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Shooting ----------
  function startReload() {
    if (reloadT > 0 || ammo === CLIP || state !== "play") return;
    reloadT = RELOAD_TIME; sfx.reload();
  }
  const inReloadBox = (x, y) => x >= RELOAD_BOX.x && x <= RELOAD_BOX.x + RELOAD_BOX.w && y >= RELOAD_BOX.y && y <= RELOAD_BOX.y + RELOAD_BOX.h;
  function shoot(x, y) {
    if (state !== "play") return;
    if (inReloadBox(x, y)) { startReload(); return; }
    if (reloadT > 0) return;
    if (ammo <= 0) { sfx.empty(); startReload(); return; }
    ammo--; shots++; roundShots++; recoil = 1;
    sfx.shot();
    // the front-most target under the sight takes the shot
    let hit = null;
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.hitT > 0) continue;
      if (t.kind === "bull" && t.up < 0.6) continue;
      const dx = x - t.x, dy = y - (t.kind === "bull" ? t.y : t.y);
      if (dx * dx + dy * dy <= t.r * t.r) { hit = t; break; }
    }
    let bottle = null;
    if (!hit) for (const b of bottles) if (b.alive && Math.abs(x - b.x) < 8 && y > SHELF - 34 && y < SHELF) bottle = b;
    if (hit) hitTarget(hit, x, y);
    else if (bottle) {
      bottle.alive = false; bottle.t = rnd(2.5, 4);
      registerHit(PTS.bottle, bottle.x, SHELF - 36);
      sfx.glass(); burst(bottle.x, SHELF - 16, "#8ae8a8", 14, 140, 0.6);
    } else {
      streak = 0; sfx.miss();
      holes.push({ x, y, t: 0 });
      burst(x, y, "#c8a878", 4, 50, 0.3);
    }
    if (ammo === 0) startReload();
  }
  function registerHit(base, x, y, color) {
    hits++; roundHits++; streak++;
    const m = mult();
    if (streak % 5 === 0 && m > 1) sfx.combo();
    addScore(base * m, x, y, color || (m > 1 ? "#ffcf3a" : "#fff6e8"));
  }
  function hitTarget(t, x, y) {
    t.hitT = 0.001;
    if (t.kind === "owl") {
      streak = 0; hits++; roundHits++;
      addScore(-200, t.x, t.y - 24, "#e83a3a");
      timeLeft = Math.max(0, timeLeft - 3);
      popups.push({ x: t.x, y: t.y - 40, text: "−3 s", color: "#e83a3a", t: 0 });
      sfx.owl();
      return;
    }
    if (t.kind === "bull") {
      const d = Math.hypot(x - t.x, y - t.y), ring = d < 7 ? 200 : d < 15 ? 100 : 50;
      registerHit(ring, t.x, t.y - 30, ring === 200 ? "#ffcf3a" : undefined);
      sfx.ding(ring / 50);
      if (ring === 200) burst(t.x, t.y, "#ffcf3a", 12, 110, 0.5);
      return;
    }
    if (t.kind === "balloon") { registerHit(PTS.balloon, t.x, t.y - 18); sfx.pop(); burst(t.x, t.y, t.c, 12, 140, 0.4, 100); return; }
    if (t.kind === "golden") { registerHit(PTS.golden, t.x, t.y - 18, "#ffcf3a"); sfx.golden(); burst(t.x, t.y, "#ffcf3a", 24, 160, 0.8); return; }
    if (t.kind === "clock") {
      registerHit(PTS.clock, t.x, t.y - 24); timeLeft += 5; sfx.clock();
      popups.push({ x: t.x, y: t.y - 40, text: "+5 s", color: "#7ad0ff", t: 0 });
      return;
    }
    registerHit(PTS[t.kind], t.x, t.y - 24);
    sfx.ding(t.kind === "rabbit" ? 3 : 1);
  }

  // ---------- Input ----------

      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 13px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#120c1e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (state === "tally" && tally) {
      ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(140, 110, 360, 130);
      ctx.strokeStyle = "#ffcf3a"; ctx.lineWidth = 2; ctx.strokeRect(140, 110, 360, 130);
      ctx.textAlign = "center"; ctx.font = "900 24px system-ui"; ctx.fillStyle = tally.passed ? "#6ae86a" : "#e83a3a";
      ctx.fillText(bonusRound ? "FINE DEL BONUS" : tally.passed ? "ROUND SUPERATO!" : "TEMPO SCADUTO", W / 2, 145);
      ctx.font = "800 13px system-ui"; ctx.fillStyle = "#fff6e8";
      if (!bonusRound) ctx.fillText(`Punti del round: ${tally.roundScore.toLocaleString("it-IT")} (minimo ${tally.quota.toLocaleString("it-IT")})`, W / 2, 175);
      ctx.fillText(`Precisione ${Math.round(tally.acc * 100)}%${tally.passed ? ` · bonus ${tally.accBonus.toLocaleString("it-IT")}` : ""}`, W / 2, 198);
      ctx.fillStyle = "#ffcf3a"; ctx.fillText(`Totale ${score.toLocaleString("it-IT")}`, W / 2, 222);
    }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 140, W, 64);
      ctx.textAlign = "center"; ctx.font = "900 28px system-ui"; ctx.fillStyle = "#ffcf3a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#120c1e"; ctx.strokeText(message.text, W / 2, 173); ctx.fillText(message.text, W / 2, 173);
      if (message.sub) { ctx.font = "800 13px system-ui"; ctx.fillStyle = "#fff6e8"; ctx.fillText(message.sub, W / 2, 195); }
      ctx.globalAlpha = 1;
    }
    drawCross();
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  // the booth is dressed up behind the title screen
  bottles = BOTTLE_SLOTS.map((x) => ({ x, alive: true, t: 0 }));
  for (let x = 40; x < W; x += 110) targets.push({ kind: "duck", x, y: ROW1, vx: 40, r: 15, ph: x, hitT: 0 });
  for (let x = 90; x < W; x += 150) targets.push({ kind: "rabbit", x, y: ROW2, vx: -50, r: 13, ph: x, hitT: 0 });
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="tiro-best-" data-kind="score"></script>

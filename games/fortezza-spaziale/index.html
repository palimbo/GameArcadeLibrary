<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fortezza Spaziale</title>
<style>
  :root {
    --bg: #060812;
    --fg: #eef4ff;
    --muted: #9aa8c8;
    --cyan: #4ae8ff;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --green: #6ae86a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a2440, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(238, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: left and right move the ship sideways, up and down change its height; hold FUOCO */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(74, 232, 255, 0.6); background: radial-gradient(circle, rgba(74,232,255,0.14), rgba(74,232,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(74, 232, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(238,244,255,0.25); pointer-events: none; }
  #touch .fire { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.2); }
  #touch .fire.on { background: rgba(255, 74, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 8, 18, 0.92);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; letter-spacing: 3px; color: var(--cyan);
    text-shadow: 0 0 14px rgba(74,232,255,0.6), 0 0 34px rgba(74,232,255,0.3); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--cyan); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 580px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(238,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--cyan); color: #021a22; background: var(--cyan); padding: 11px 30px; box-shadow: 0 0 18px rgba(74,232,255,0.5); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  // isometric view: forward runs up-right, sideways down-right, height straight up
  const X0 = 110, Y0 = 235, K = 1.45, XW = 70, ZMAX = 80, SHIP_W = 8, SHIP_H = 5;
  const FORT_LEN = 3600, SPACE_LEN = 2400;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 navi · torrette lente, varchi più larghi", lives: 5, fire: 0.65, speed: 0.9, gap: 1.2, fuel: 0.8 },
    normale:   { label: "NORMALE",   color: "#4ae8ff", desc: "3 navi · l'esperienza classica", lives: 3, fire: 1, speed: 1, gap: 1, fuel: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 navi · colpi fitti, varchi stretti", lives: 3, fire: 1.35, speed: 1.1, gap: 0.88, fuel: 1.15 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fortezza-difficulty";
  const bestKey = (id) => `fortezza-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1100, 0.05, "square", 0.015, -600)),
    pop: lim(() => { noise(0.15, 0.14, 1200); beep(220, 0.1, "square", 0.025, -120); }),
    fuel: lim(() => arp([659, 880, 1175], 0.05, 0.08, "square", 0.03)),
    enemy: lim(() => beep(300, 0.12, "sawtooth", 0.015, 200)),
    pass: lim(() => beep(1400, 0.04, "sine", 0.02)),
    zap: lim(() => noise(0.08, 0.05, 3000)),
    warn: lim(() => beep(880, 0.1, "square", 0.02)),
    boss: () => arp([196, 262, 196, 262], 0.15, 0.14, "sawtooth", 0.03),
    die: () => { noise(0.6, 0.3, 600); arp([392, 330, 262, 196, 131], 0.1, 0.16, "triangle", 0.05); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    start: () => arp([392, 523, 659, 784, 1047], 0.08, 0.14),
    life: () => arp([784, 988, 1175, 1568], 0.07, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, round = 0, bestCache = 0, nextLife = 20000;
  let S = null, objs = [], shots = [], bullets = [], parts = [], popups = [], message = null;
  let seg = "fort", segLen = 0, segDone = 0, nextSpawn = 0, fuel = 100, boss = null, scroll = 0, why = "";
  let firing = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const pace = () => diff.speed * (1 + Math.min(round, 5) * 0.06);
  const V = () => 120 * pace();

  // ---------- Projection ----------
  const PX = (x, yr, z) => X0 + (x + yr) * 0.866 * K;
  const PY = (x, yr, z) => Y0 + ((x - yr) * 0.5 - z) * K;

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginSegment("fort", 1);
    S = { x: 0, z: 30, inv: 1.5, cool: 0, tilt: 0 };
    fuel = 100;
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  let fortNo = 1;
  function beginSegment(kind, n) {
    seg = kind; segDone = 0; nextSpawn = 200; boss = null;
    if (kind === "fort") { fortNo = n; segLen = FORT_LEN; message = { text: `FORTEZZA ${round * 2 + n}`, sub: n === 2 ? "in fondo ti aspetta il robot guardiano" : "passa i muri dai varchi, colpisci i serbatoi", t: 0 }; }
    else { segLen = SPACE_LEN; message = { text: "SPAZIO APERTO", sub: "caccia nemici: guarda l'altimetro", t: 0 }; }
    state = "intro"; stateT = 1.4;
  }
  function addScore(n, x, yr, z, color = "#eef4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, yr, z, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; if (lives < 9) { lives++; sfx.life(); popups.push({ x: S.x, yr: 30, z: S.z + 20, text: "NAVE EXTRA", color: "#ffe04a", t: 0 }); } }
  }
  function burst(x, yr, z, c, n = 12, sp = 90, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, b = Math.random() * Math.PI, s = sp * rnd(0.3, 1); parts.push({ x, yr, z, vx: Math.cos(a) * Math.sin(b) * s, vy: Math.sin(a) * Math.sin(b) * s, vz: Math.cos(b) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(reason) {
    if (state !== "play" || S.inv > 0) return;
    why = reason;
    lives--;
    sfx.die(); burst(S.x, 0, S.z, "#ffb43a", 30, 120, 0.9); burst(S.x, 0, S.z, "#ff4a3a", 16, 80, 0.7);
    message = { text: "NAVE ABBATTUTA!", sub: `${reason}${lives > 0 ? ` · ne restano ${lives}` : ""}`, t: 0 };
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // a clear stretch ahead to start again
    objs = objs.filter((o) => o.yr > 260 || o.kind === "boss");
    bullets = [];
    S = { x: 0, z: 30, inv: 2.2, cool: 0, tilt: 0 };
    fuel = Math.max(fuel, 70);
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, f = round * 2 + fortNo;
    menu = () => showOverlay(
      `<h2 class="lose">MISSIONE FALLITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Fortezza ${f} · ${played}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>FORTEZZA SPAZIALE</h1>
       <p>Vola sopra le fortezze nemiche: la nave avanza da sola, tu la sposti di lato e cambi quota. L'ombra sul pavimento e l'altimetro a sinistra ti dicono a che altezza sei. Il carburante cala: colpisci i serbatoi per fare il pieno.</p>
       <div class="pts">
         <span><b>Muri</b></span><span>passa dal varco: l'altimetro mostra la quota giusta</span>
         <span><b>Barriere</b></span><span>raggi elettrici a una certa quota: passa sopra o sotto</span>
         <span><b>Bersagli</b></span><span>torrette 100 · serbatoi 300 e carburante · radar 1.000 · caccia 200</span>
         <span><b>Robot guardiano</b></span><span>alla seconda fortezza: colpiscilo al petto prima che se ne vada (5.000)</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: destra/sinistra di lato, su/giù sali e scendi · FUOCO (tieni premuto)</p>`
         : `<p class="muted help">← → di lato · ↑ ↓ sali e scendi (o WASD) · SPAZIO, J o Z fuoco · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DECOLLO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const FIRE_KEYS = [" ", "j", "z", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (FIRE_KEYS.includes(k)) firing = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (FIRE_KEYS.includes(k)) firing = false;
    if (KEYMAP[k]) keys[KEYMAP[k]] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; firing = false; if (isPlaying()) togglePause(); });
  const fireBtn = touchEl.querySelector(".fire");
  let fireId = null;
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); fireId = e.pointerId; try { fireBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } firing = true; fireBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, (e) => { if (e.pointerId !== fireId) return; fireId = null; firing = false; fireBtn.classList.remove("on"); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.15 ? 0 : sign(v) * Math.min(1, (a - 0.15) / 0.7); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Spawning ----------
  const SPAWN_YR = 400;
  const FLOOR = { turret: { h: 14, w: 12, hp: 1, pts: 100 }, tank: { h: 18, w: 14, hp: 1, pts: 300 }, radar: { h: 22, w: 14, hp: 2, pts: 1000 } };
  function floorThing(kind, x) { objs.push({ kind, x: clamp(x, -XW + 10, XW - 10), yr: SPAWN_YR + rnd(0, 40), z: 0, ...FLOOR[kind], cool: rnd(0.8, 2), flash: 0 }); }
  function spawnPattern() {

    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x + 6, y1, 6, h);
    // what's coming next: the opening, the barrier, the aircraft
    const next = objs.filter((o) => o.yr > 0 && o.yr < 360 && (o.kind === "wall" || o.kind === "field" || o.kind === "plane")).sort((a, b) => a.yr - b.yr)[0];
    if (next) {
      if (next.kind === "wall") { ctx.fillStyle = "rgba(255,224,74,0.7)"; ctx.fillRect(x, zf(next.h1), 18, zf(next.h0) - zf(next.h1)); }
      else if (next.kind === "field") { ctx.fillStyle = "rgba(74,232,255,0.7)"; ctx.fillRect(x, zf(next.fz + next.th), 18, zf(next.fz - next.th) - zf(next.fz + next.th)); }
      else { ctx.fillStyle = "#ff5a5a"; ctx.fillRect(x, zf(next.z) - 2, 18, 4); }
    }
    if (boss && !boss.dead) { ctx.fillStyle = "#ff4a3a"; ctx.fillRect(x, zf(boss.z) - 2, 18, 4); }
    if (S) { ctx.fillStyle = "#eef4ff"; ctx.beginPath(); ctx.moveTo(x + 20, zf(S.z)); ctx.lineTo(x + 26, zf(S.z) - 4); ctx.lineTo(x + 26, zf(S.z) + 4); ctx.fill(); ctx.fillRect(x + 4, zf(S.z) - 1, 12, 2); }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(6,8,18,0.7)"; ctx.fillRect(0, 0, W, 26);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#eef4ff"; ctx.font = "900 14px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 10, 9);
    ctx.fillStyle = "#9aa8c8"; ctx.font = "700 8px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 10, 20);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ae8ff"; ctx.font = "800 10px system-ui";
    ctx.fillText(seg === "space" ? "SPAZIO APERTO" : `FORTEZZA ${round * 2 + fortNo}`, W / 2, 9);
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(W / 2 - 70, 16, 140, 4); ctx.fillStyle = "#4ae8ff"; ctx.fillRect(W / 2 - 70, 16, 140 * clamp(segDone / segLen, 0, 1), 4);
    // fuel
    const fx = W - 170, low = fuel < 25;
    ctx.textAlign = "right"; ctx.fillStyle = low && Math.floor(clock * 4) % 2 ? "#ff4a3a" : "#9aa8c8"; ctx.font = "800 8px system-ui"; ctx.fillText("CARBURANTE", fx - 4, 13);
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(fx, 8, 100, 10);
    ctx.fillStyle = low ? "#ff4a3a" : fuel < 50 ? "#ffe04a" : "#6ae86a"; ctx.fillRect(fx, 8, fuel, 10);
    ctx.fillStyle = "#eef4ff"; ctx.font = "800 11px system-ui"; ctx.fillText(`✈×${Math.max(0, lives)}`, W - 10, 13);
    if (boss && !boss.dead) { ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(W / 2 - 70, 30, 140, 4); ctx.fillStyle = "#ff4a3a"; ctx.fillRect(W / 2 - 70, 30, 140 * boss.hp / boss.max, 4); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu") scroll += 1;
    drawBackground();
    // far first; things more to the side-near drawn later
    const list = [...objs.map((o) => ({ o, k: (o.kind === "boss" && boss ? boss.yr : o.yr) - (o.x || 0) * 0.6 })), { o: null, k: -(S ? S.x : 0) * 0.6 }];
    list.sort((a, b) => b.k - a.k);
    for (const it of list) if (it.o) drawObj(it.o); else if (S) drawShip();
    for (const s of shots) { const [sx, sy] = P(s.x, s.yr, s.z); ctx.fillStyle = "#e8fcff"; ctx.fillRect(sx - 3, sy - 1, 6, 2); if (seg === "fort") { const [hx, hy] = P(s.x, s.yr, 0); ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(hx - 2, hy - 1, 4, 2); } }
    for (const b of bullets) { const [sx, sy] = P(b.x, b.yr, b.z); ctx.fillStyle = "rgba(255,90,40,0.35)"; ctx.beginPath(); ctx.arc(sx, sy, b.big ? 7 : 5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffb43a"; ctx.beginPath(); ctx.arc(sx, sy, b.big ? 3.5 : 2.5, 0, TAU); ctx.fill(); }
    for (const p of parts) { const [sx, sy] = P(p.x, p.yr, p.z); ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      const [sx, sy] = P(p.x, p.yr, p.z);
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#060812"; ctx.strokeText(p.text, sx, sy); ctx.fillStyle = p.color; ctx.fillText(p.text, sx, sy);
    }
    ctx.globalAlpha = 1;
    if (state !== "menu") { drawAltimeter(); drawHud(); }
    if (message && state !== "menu") {
      ctx.globalAlpha = Math.min(1, (2.6 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui";
      ctx.lineWidth = 6; ctx.strokeStyle = "#060812"; ctx.strokeText(message.text, W / 2 + 60, 70); ctx.fillStyle = "#4ae8ff"; ctx.fillText(message.text, W / 2 + 60, 70);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2 + 60, 92); ctx.fillStyle = "#eef4ff"; ctx.fillText(message.sub, W / 2 + 60, 92); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="fortezza-best-" data-kind="score"></script>
</body>

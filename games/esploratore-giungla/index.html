<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Esploratore della Giungla</title>
<style>
  :root {
    --bg: #07140a;
    --fg: #f2f0dc;
    --muted: #a8b894;
    --leaf: #7ad84a;
    --gold: #ffd23a;
    --red: #ff5a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1e3a14, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 240, 220, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick (left and right to run, up and down on ladders and to let go of a vine) and a jump button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(122, 216, 74, 0.55); background: radial-gradient(circle, rgba(122,216,74,0.14), rgba(122,216,74,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(122, 216, 74, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(242,240,220,0.25); pointer-events: none; }
  #touch .jump { width: 100px; height: 100px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 14px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.18); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 84px; height: 84px; font-size: 12px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(7, 20, 10, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(28px, 8vw, 54px); font-weight: 900; letter-spacing: 1px; color: var(--leaf); text-shadow: 0 3px 0 #1e4a0e, 0 0 22px rgba(122,216,74,0.4); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay h2.win { color: var(--gold); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,240,220,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--leaf); color: #0e2a06; background: var(--leaf); padding: 11px 30px; box-shadow: 0 4px 0 #1e4a0e; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Salta">SALTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 300, HUD = 22, TAU = Math.PI * 2;
  const TOP = 190, UNDER = 282, CEIL = 214;    // feet on the jungle floor, feet in the tunnel, the tunnel ceiling
  const PIT_A = 170, PIT_B = 310;              // every pond, pit and crocodile pool spans this stretch
  const LADDER_X = 240;
  const VINE = { x: 240, y: 26, len: 128 };
  const WORLD = 40, TREASURES = 12;
  const TREASURE_KINDS = [
    { kind: "sacco", name: "SACCO DI MONETE", pts: 2000, col: "#c8a86a" },
    { kind: "argento", name: "LINGOTTO D'ARGENTO", pts: 3000, col: "#dce4ec" },
    { kind: "oro", name: "LINGOTTO D'ORO", pts: 4000, col: "#ffd23a" },
    { kind: "anello", name: "ANELLO DI DIAMANTI", pts: 5000, col: "#8ae8ff" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "8 minuti · 5 vite · coccodrilli e sabbie mobili lenti", time: 480, lives: 5, pace: 0.75 },
    normale:   { label: "NORMALE",   color: "#7ad84a", desc: "6 minuti · 3 vite · l'esperienza classica", time: 360, lives: 3, pace: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a3a", desc: "5 minuti e mezzo · 3 vite · tutto più veloce", time: 330, lives: 3, pace: 1.3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "giungla-difficulty";
  const bestKey = (id) => `giungla-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // a small seeded random generator, so every screen keeps its shape for the whole game
  function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 240) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    jump: lim(() => beep(300, 0.15, "square", 0.03, 300)),
    step: lim(() => beep(90, 0.03, "square", 0.015)),
    vine: () => { beep(500, 0.4, "triangle", 0.04, 400); beep(700, 0.3, "triangle", 0.03, -200, 0.1); },
    bump: lim(() => { noise(0.1, 0.15, 400); beep(120, 0.08, "square", 0.03, -40); }),
    treasure: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.06, 0.12, "square", 0.04),
    die: () => arp([784, 659, 523, 440, 349, 262], 0.1, 0.16, "triangle", 0.05),
    splash: () => { noise(0.5, 0.25, 900); beep(200, 0.4, "sine", 0.04, -150); },
    chomp: () => { noise(0.15, 0.3, 1200); beep(90, 0.2, "sawtooth", 0.05, -40); },
    fall: () => beep(700, 0.5, "sine", 0.035, -550),
    ladder: lim(() => beep(260, 0.04, "triangle", 0.02)),
    start: () => arp([392, 523, 659, 523, 659, 784, 1047], 0.1, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568, 2093], 0.09, 0.16),
    tick: lim(() => beep(1400, 0.04, "square", 0.02)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 2000, lives = 3, bestCache = 0, timeLeft = 0, found = 0, screen = 0;
  let world = [], P = null, logs = [], scorp = null, vineA = 0, parts = [], popups = [], message = null, deathWhy = "";
  let jumpPressed = false, jumpHeld = false;
  const ctl = { left: false, right: false, up: false, down: false };
  const keys = { left: false, right: false, up: false, down: false };

  // ---------- The jungle ----------
  // WORLD screens in a ring; each one has a floor type, maybe a vine, logs, a hazard, a treasure and a tunnel below
  function buildWorld() {
    const rnd = mulberry((Math.random() * 1e9) | 0);
    world = [];
    for (let i = 0; i < WORLD; i++) {
      const r = rnd();
      let ground = "solid";
      if (i > 0) ground = r < 0.16 ? "water" : r < 0.3 ? "tar" : r < 0.46 ? "quicksand" : r < 0.62 ? "croc" : r < 0.74 ? "holes3" : r < 0.86 ? "hole" : "solid";
      const s = { ground, vine: false, logs: 0, rolling: false, hazard: null, treasure: null, wall: null, scorpion: false, trees: [] };
      if (ground === "water" || ground === "tar") s.vine = true;
      else if (ground === "croc" || ground === "quicksand") s.vine = rnd() < 0.5;
      if ((ground === "solid" || ground === "hole" || ground === "holes3") && rnd() < 0.7) { s.logs = 1 + Math.floor(rnd() * 3); s.rolling = rnd() < 0.6; }
      else if (ground === "quicksand" && rnd() < 0.3) { s.logs = 1; s.rolling = true; }
      if (!s.logs && ground === "solid" && i > 0) s.hazard = rnd() < 0.5 ? "fire" : "snake";
      // the tunnel: a brick wall now and then, otherwise a scorpion
      const w = rnd();
      if (w < 0.3) s.wall = rnd() < 0.5 ? "left" : "right"; else s.scorpion = i > 0 && rnd() < 0.8;
      for (let t = 0; t < 4; t++) s.trees.push(30 + t * 120 + Math.floor(rnd() * 50));
      world.push(s);
    }
    // treasures: on screens without a snake or a fire, spread round the ring
    const slots = [];
    for (let i = 2; i < WORLD; i++) if (!world[i].hazard) slots.push(i);
    for (let k = 0; k < TREASURES && slots.length; k++) {
      const j = Math.floor(rnd() * slots.length), i = slots.splice(j, 1)[0];
      world[i].treasure = TREASURE_KINDS[Math.floor(rnd() * TREASURE_KINDS.length)];
    }
  }
  const S = () => world[((screen % WORLD) + WORLD) % WORLD];
  const TREASURE_X = 420;
  // the shifting pits breathe open and closed
  function pitOpen(s, x) {
    if (x < PIT_A || x > PIT_B) return false;
    if (s.ground === "water" || s.ground === "tar") return true;
    if (s.ground === "quicksand") {
      const k = Math.max(0, Math.sin(clock * 0.9 * diff.pace)), half = (PIT_B - PIT_A) / 2 * k, mid = (PIT_A + PIT_B) / 2;
      return Math.abs(x - mid) < half;
    }
    return false;
  }
  const HOLES = { hole: [LADDER_X], holes3: [150, LADDER_X, 330] };
  const inHole = (s, x) => (HOLES[s.ground] || []).some((h) => Math.abs(x - h) < 11);
  const CROCS = [207, 240, 273];
  const crocOpen = (i) => Math.sin(clock * 1.5 * diff.pace + i * 0.7) > 0.25;

  // ---------- Flow ----------
  const isPlaying = () => ["play", "dead"].includes(state);
  function newExplorer(x = 30, y = 110) { return { x, y, vx: 0, vy: 0, face: 1, ground: false, layer: "top", mode: "air", run: 0, stumble: 0, grabCool: 0, inv: 0 }; }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 2000; lives = diff.lives; found = 0; timeLeft = diff.time; screen = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildWorld();
    P = newExplorer(40, TOP); P.mode = "run"; P.ground = true;
    enterScreen();
    message = { text: "TROVA I TESORI!", sub: `${TREASURES} tesori nascosti nella giungla, a destra e a sinistra`, t: 0 };
    state = "play";
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function enterScreen() {
    const s = S();
    logs = [];
    for (let i = 0; i < s.logs; i++) logs.push({ x: s.rolling ? 460 - i * 44 : 330 + i * 44 - (s.logs - 1) * 22, spin: 0 });
    if (s.ground === "croc" || s.ground === "water" || s.ground === "tar" || s.ground === "quicksand") for (const l of logs) if (l.x > PIT_A - 10 && l.x < PIT_B + 10) l.x = 380 + (l.x % 60);
    scorp = s.scorpion ? { x: 360, face: -1, t: 0 } : null;
  }
  function addScore(n, x, y, color = "#f2f0dc") {
    score = Math.max(0, score + n);
    if (x !== undefined) popups.push({ x, y, text: (n > 0 ? "+" : "") + n.toLocaleString("it-IT"), color, t: 0 });
  }
  function burst(x, y, color, n = 12, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function die(why, sound) {
    if (state !== "play") return;
    lives--; deathWhy = why;
    (sound || sfx.die)();
    message = { text: why, sub: lives > 0 ? `Vite rimaste: ${lives}` : "", t: 0 };
    state = "dead"; stateT = 2;
    P.mode = "dead";
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(false); return; }
    // back from the treetops on the left, as in the old days
    P = newExplorer(30, 100);
    P.inv = 1;
    enterScreen();
    state = "play";
  }
  function gameOver(won) {
    state = "over";
    let bonus = 0;
    if (won) { bonus = Math.floor(timeLeft) * 10; score += bonus; }
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    won ? sfx.win() : sfx.over();
    const played = diff.label;
    menu = () => showOverlay(
      `<h2 class="${won ? "win" : "lose"}">${won ? "TUTTI I TESORI!" : timeLeft <= 0 ? "TEMPO SCADUTO" : "GAME OVER"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Tesori ${found}/${TREASURES} · ${played}</p>
       ${won ? `<p class="muted">Bonus tempo: ${bonus.toLocaleString("it-IT")}</p>` : ""}
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(false); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ESPLORATORE DELLA GIUNGLA</h1>
       <p>${TREASURES} tesori sono nascosti nella giungla e il tempo corre. Dondola sulle liane sopra stagni e pozze di catrame, salta sulle teste dei coccodrilli quando chiudono la bocca, evita i tronchi, il fuoco e i serpenti. Nel tunnel sotterraneo ogni schermata ne vale tre in superficie… ma ci sono gli scorpioni e i muri.</p>
       <div class="pts">
         <span><b>Tesori</b></span><span>sacco 2.000 · argento 3.000 · oro 4.000 · anello 5.000</span>
         <span><b>Tronchi</b></span><span>non uccidono, ma ogni botta costa 100 punti</span>
         <span><b>Liana</b></span><span>salta per aggrapparti, salta o giù per lasciarla</span>
         <span><b>Tunnel</b></span><span>scendi dai buchi con la scala: ogni schermata sotto ne vale tre sopra</span>
         <span><b>Tutti i tesori</b></span><span>bonus di 10 punti per ogni secondo rimasto</span>
       </div>
       ${touchMode

        ctx.fillStyle = "#e8e0c8"; ctx.beginPath(); ctx.ellipse(0, -4, 8, 4, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#e8e0c8"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-6, -5); ctx.quadraticCurveTo(-14, -18, -4, -16 + Math.sin(clock * 6) * 2); ctx.stroke();
        ctx.lineWidth = 1.5; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 4, -2); ctx.lineTo(k * 4 + 2, 0); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(11, -8); ctx.moveTo(6, -3); ctx.lineTo(11, -1); ctx.stroke();
        ctx.restore();
      }
      if (s.vine) {
        const [ex, ey] = vineEnd();
        ctx.strokeStyle = "#5a8a22"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(VINE.x, VINE.y); ctx.quadraticCurveTo((VINE.x + ex) / 2 + Math.sin(vineA) * 8, (VINE.y + ey) / 2, ex, ey); ctx.stroke();
        ctx.fillStyle = "#7ab83a"; ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, TAU); ctx.fill();
      }
    }
    if (P && state !== "menu") {
      if (!(P.inv > 0 && Math.floor(clock * 14) % 2) && !(state === "dead" && P.sink && P.y > TOP + 20)) {
        if (P.sink) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, TOP + 2); ctx.clip(); }
        drawExplorer(P.x, P.y, P.face, P.mode === "dead" ? "run" : P.mode, P.run);
        if (P.sink) ctx.restore();
      }
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu" || !P) return;
    // status bar
    ctx.fillStyle = "rgba(7,20,10,0.85)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = "#f2f0dc";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 11);
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff5a3a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 80, 11);
    ctx.textAlign = "center"; ctx.font = "900 13px system-ui, sans-serif";
    const m = Math.floor(timeLeft / 60), sec = Math.floor(timeLeft % 60);
    ctx.fillStyle = timeLeft < 30 && Math.floor(clock * 4) % 2 ? "#ff5a3a" : "#ffd23a";
    ctx.fillText(`${m}:${String(sec).padStart(2, "0")}`, W / 2, 11);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#7ad84a";
    ctx.fillText(`TESORI ${found}/${TREASURES} · ♥ ${Math.max(0, lives)}`, W - 8, 11);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.6 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui, sans-serif"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, 80); ctx.fillText(message.text, W / 2, 80);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2f0dc"; ctx.strokeText(message.sub, W / 2, 98); ctx.fillText(message.sub, W / 2, 98); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="giungla-best-" data-kind="score"></script>

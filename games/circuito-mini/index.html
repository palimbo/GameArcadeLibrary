<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Circuito Mini</title>
<style>
  :root {
    --bg: #0b1210;
    --fg: #f4f2ea;
    --muted: #a8b4a8;
    --yellow: #ffd23a;
    --red: #ff4a3a;
    --cyan: #4ad8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #22342a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 242, 234, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* the stick points where the car should head (pushing further means more throttle); the button brakes */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.55); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,242,234,0.25); pointer-events: none; }
  #touch .brake { width: 88px; height: 88px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.18); }
  #touch .brake.on { background: rgba(255, 74, 58, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .brake { width: 74px; height: 74px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(11, 18, 16, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--yellow); text-shadow: 0 3px 0 #8a5a10, 0 0 22px rgba(255,210,58,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay h2.win { color: var(--yellow); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,242,234,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay .ups button { border-color: var(--cyan); color: var(--cyan); }
  #overlay .ups button small { display: block; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); margin-top: 2px; }
  #overlay button.start { border-color: var(--yellow); color: #2a1a00; background: var(--yellow); padding: 11px 30px; box-shadow: 0 4px 0 #8a5a10; }
  #overlay table { border-collapse: collapse; font-size: 14px; }
  #overlay td { padding: 3px 10px; text-align: left; }
  #overlay td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #overlay tr.me td { color: var(--yellow); font-weight: 800; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="brake" aria-label="Freno">FRENO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 320, HUD = 22, TAU = Math.PI * 2;
  const ROAD = 19;             // half the width of the track
  const LAPS = 3, N = 240;     // laps per race; samples along each track's centre line
  const COLORS = [
    { body: "#ffd23a", roof: "#c89a10", name: "Tu" },
    { body: "#ff4a3a", roof: "#a82a1a", name: "Rosso" },
    { body: "#4a9aff", roof: "#2a5aa8", name: "Blu" },
    { body: "#5ad86a", roof: "#2a8a3a", name: "Verde" },
  ];
  // the circuits, as control points of a closed curve
  const TRACKS = [
    { name: "L'Ovale", pts: [[90, 60], [390, 60], [440, 100], [440, 250], [390, 292], [90, 292], [40, 250], [40, 100]] },
    { name: "La Chicane", pts: [[70, 58], [180, 58], [250, 145], [320, 58], [420, 58], [445, 110], [370, 165], [445, 220], [420, 292], [70, 292], [38, 240], [120, 175], [38, 110]] },
    { name: "Il Serpente", pts: [[70, 58], [180, 58], [240, 110], [300, 58], [420, 58], [445, 100], [445, 250], [420, 292], [330, 292], [270, 240], [210, 292], [70, 292], [38, 250], [38, 100]] },
    { name: "I Tornanti", pts: [[70, 50], [420, 50], [448, 85], [420, 120], [160, 120], [128, 155], [160, 190], [420, 190], [448, 235], [420, 282], [70, 290], [38, 250], [38, 90]] },
  ];
  const UPGRADES = {
    speed: { name: "VELOCITÀ", desc: "+8% velocità massima" },
    accel: { name: "ACCELERAZIONE", desc: "+15% scatto" },
    grip:  { name: "ADERENZA", desc: "+15% tenuta in curva" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "basta arrivare 3° per continuare · avversari tranquilli", need: 3, ai: 0.82, grow: 0.025 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "devi arrivare almeno 2° · l'esperienza classica", need: 2, ai: 0.9, grow: 0.03 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "solo la vittoria ti fa continuare · avversari aggressivi", need: 1, ai: 0.96, grow: 0.035 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "circuito-difficulty";
  const bestKey = (id) => `circuito-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrapA = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 240) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
    trackDirty = true;
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    count: () => beep(440, 0.25, "square", 0.05),
    go: () => beep(880, 0.5, "square", 0.05),
    bump: lim(() => { noise(0.1, 0.18, 600); beep(110, 0.08, "square", 0.03, -30); }),
    skid: lim(() => noise(0.2, 0.05, 2500)),
    wrench: () => arp([784, 1047, 1319], 0.06, 0.1, "square", 0.04),
    oil: lim(() => beep(400, 0.4, "sine", 0.04, -300)),
    splash: lim(() => noise(0.3, 0.15, 1200)),
    lap: () => arp([659, 880], 0.08, 0.12, "triangle", 0.05),
    finish: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14),
    lose: () => arp([523, 415, 330, 262], 0.18, 0.25),
    upgrade: () => arp([392, 523, 659, 784, 1047], 0.06, 0.12, "square", 0.04),
  };
  function engineStart() {
    if (!audioCtx || engine) return;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    osc.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = 0;
    osc.connect(f).connect(g).connect(audioCtx.destination); osc.start();
    engine = { osc, g };
  }
  function engineSet(on, speed) {
    if (!engine) return;
    const t = audioCtx.currentTime;
    engine.g.gain.setTargetAtTime(on ? 0.014 : 0, t, 0.05);
    engine.osc.frequency.setTargetAtTime(60 + speed * 1.2, t, 0.05);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, race = 0, bestCache = 0, wrenches = 0, tokens = 0, raceT = 0, lastResult = null;
  let track = null, cars = [], items = [], parts = [], popups = [], message = null, finishers = [];
  let ups = { speed: 0, accel: 0, grip: 0 };
  let stick = null, brakeHeld = false, trackDirty = true, skidLayer = null;
  const keys = { left: false, right: false, up: false, down: false };

  // ---------- Tracks ----------
  // a Catmull-Rom curve through the control points, resampled to N evenly spaced points
  function buildTrack(def) {
    const P = def.pts, dense = [];
    for (let i = 0; i < P.length; i++) {
      const p0 = P[(i - 1 + P.length) % P.length], p1 = P[i], p2 = P[(i + 1) % P.length], p3 = P[(i + 2) % P.length];
      for (let k = 0; k < 20; k++) {
        const t = k / 20, t2 = t * t, t3 = t2 * t;
        dense.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                    0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
      }
    }
    let total = 0; const cum = [0];
    for (let i = 1; i <= dense.length; i++) { const a = dense[i - 1], b = dense[i % dense.length]; total += Math.hypot(b[0] - a[0], b[1] - a[1]); cum.push(total); }
    const pts = [];
    let j = 0;
    for (let i = 0; i < N; i++) {
      const d = i / N * total;
      while (cum[j + 1] < d) j++;
      const a = dense[j], b = dense[(j + 1) % dense.length], t = (d - cum[j]) / (cum[j + 1] - cum[j] || 1);
      pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
    // how sharply the road bends at each point, looking a little ahead
    const ang = pts.map((p, i) => { const q = pts[(i + 1) % N]; return Math.atan2(q[1] - p[1], q[0] - p[0]); });
    const bend = pts.map((_, i) => Math.abs(wrapA(ang[(i + 6) % N] - ang[i])));
    return { name: def.name, pts, ang, bend, length: total };
  }
  function nearest(t, x, y, from, span) {
    let best = from, bd = 1e9;
    for (let k = -span; k <= span; k++) {
      const i = ((from + k) % N + N) % N, p = t.pts[i], d = (p[0] - x) ** 2 + (p[1] - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return [best, Math.sqrt(bd)];
  }

  // ---------- Flow ----------
  const isPlaying = () => ["count", "race", "finish"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    engineStart();
    score = 0; race = 0; wrenches = 0; tokens = 0; ups = { speed: 0, accel: 0, grip: 0 };
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginRace();
  }
  function beginRace() {
    track = buildTrack(TRACKS[race % TRACKS.length]);
    trackDirty = true; skidLayer = null;
    const a = track.ang[0];
    const fx = Math.cos(a), fy = Math.sin(a), sx = -fy, sy = fx;
    cars = COLORS.map((c, i) => {
      // two by two on the grid behind the line
      const row = Math.floor(i / 2), side = i % 2 ? 1 : -1;
      const back = 16 + row * 22 + (i % 2) * 6, p = track.pts[0];
      const x = p[0] - fx * back + sx * side * 8, y = p[1] - fy * back + sy * side * 8;
      const [idx] = nearest(track, x, y, 0, 30);
      return { i, ...c, x, y, a, vx: 0, vy: 0, lap: 0, idx, prog: 0, dist: 0, done: false, time: 0, spin: 0, wet: 0, lane: (i - 1.5) * 5, skill: 1, laps: [], lapStart: 0 };
    });
    const pace = diff.ai * (1 + race * diff.grow);
    cars.forEach((c, i) => { if (i) c.skill = pace * [1, 0.97, 1.02][i - 1] * rnd(0.98, 1.02); });
    // wrenches along the track, and from the second race oil and puddles
    items = [];
    const spots = [];
    for (let k = 0; k < 3; k++) spots.push({ kind: "wrench", i: Math.floor(N * (0.2 + k * 0.28 + rnd(0, 0.1))) % N });
    if (race >= 1) for (let k = 0; k < Math.min(4, race); k++) spots.push({ kind: k % 2 ? "water" : "oil", i: Math.floor(rnd(0.15, 0.9) * N) });
    for (const s of spots) {
      const p = track.pts[s.i], a2 = track.ang[s.i], off = rnd(-ROAD + 7, ROAD - 7);
      items.push({ kind: s.kind, x: p[0] - Math.sin(a2) * off, y: p[1] + Math.cos(a2) * off, t: rnd(0, 5) });
    }
    finishers = []; raceT = 0; parts = []; popups = [];
    message = { text: track.name.toUpperCase(), sub: `Gara ${race + 1} · ${LAPS} giri · arriva almeno ${diff.need}°`, t: 0 };
    state = "count"; stateT = 3.2;
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f4f2ea") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: "+" + n, color, t: 0 });
  }
  function burst(x, y, color, n = 10, sp = 80, life = 0.4) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  const standings = () => cars.slice().sort((a, b) => (b.done - a.done) || (a.done && b.done ? a.finishOrder - b.finishOrder : b.dist - a.dist));
  function carFinished(c) {
    c.done = true; c.finishOrder = finishers.length; finishers.push(c);
    if (c.i === 0) {
      const pos = finishers.length;
      const pts = [1500, 900, 500, 200][pos - 1];
      addScore(pts);
      sfx[pos <= diff.need ? "finish" : "lose"]();
      message = { text: pos === 1 ? "VITTORIA!" : `${pos}° POSTO`, t: 0 };
      state = "finish"; stateT = 3;
    }
  }
  function endRace() {
    // the others are placed where they are when you cross the line
    const order = standings();
    const pos = order.indexOf(cars[0]) + 1;
    const ok = pos <= diff.need;
    engineSet(false, 0);
    const best = cars[0].laps.length ? Math.min(...cars[0].laps) : 0;
    lastResult = { pos, ok, order, best };
    if (!ok) { gameOver(); return; }
    tokens += Math.floor(wrenches / 3); wrenches %= 3;
    state = "between";
    menu = showBetween; showBetween();
    syncControls();
  }
  function resultsHTML() {
    const r = lastResult;
    const rows = r.order.map((c, i) => `<tr class="${c.i === 0 ? "me" : ""}"><td>${i + 1}°</td><td style="color:${c.body}">■</td><td>${c.name}</td><td class="n">${c.done ? c.time.toFixed(2) + " s" : "—"}</td></tr>`).join("");
    return `<table>${rows}</table>${r.best ? `<p class="muted">Giro più veloce: ${r.best.toFixed(2)} s · Punteggio ${score.toLocaleString("it-IT")}</p>` : ""}`;
  }
  function showBetween() {
    const r = lastResult;
    const up = tokens > 0 ? `<p>Hai ${tokens > 1 ? tokens + " potenziamenti" : "un potenziamento"} da scegliere:</p>
       <div class="diff ups">${Object.entries(UPGRADES).map(([k, u]) => `<button type="button" data-up="${k}" ${ups[k] >= 5 ? "disabled" : ""}>${u.name} ${"●".repeat(ups[k])}<small>${u.desc}</small></button>`).join("")}</div>` : `<p class="muted">Chiavi inglesi: ${wrenches}/3 per il prossimo potenziamento</p>`;
    showOverlay(
      `<h2 class="win">${r.pos === 1 ? "VITTORIA!" : r.pos + "° POSTO"}</h2>
       ${resultsHTML()}
       ${up}
       ${tokens > 0 ? "" : `<button class="start" data-next>PROSSIMA GARA</button>`}`
    );
  }

    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a3a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 70, 11);
    const pos = standings().indexOf(me) + 1;
    ctx.textAlign = "center"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = pos <= diff.need ? "#7dff9a" : "#ff4a3a";
    ctx.fillText(`${pos}°`, W / 2 - 40, 11);
    ctx.fillStyle = "#ffd23a"; ctx.fillText(`GIRO ${Math.min(LAPS, me.lap + 1)}/${LAPS}`, W / 2 + 20, 11);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#f4f2ea";
    ctx.fillText(`${raceT.toFixed(1)} s · CHIAVI ${wrenches}/3`, W - 8, 11);
    ctx.textBaseline = "alphabetic";
    if (state === "count") {
      const n = Math.ceil(stateT);
      ctx.textAlign = "center"; ctx.font = "900 44px system-ui, sans-serif"; ctx.lineWidth = 6; ctx.strokeStyle = "#000";
      const txt = n > 3 ? "" : String(n);
      ctx.fillStyle = "#ffd23a"; ctx.strokeText(txt, W / 2, H / 2 + 50); ctx.fillText(txt, W / 2, H / 2 + 50);
      // the lights
      for (let k = 0; k < 3; k++) { ctx.fillStyle = 3 - k >= n && n <= 3 ? "#ff3a2a" : "#3a1a1a"; ctx.beginPath(); ctx.arc(W / 2 - 20 + k * 20, 40, 7, 0, TAU); ctx.fill(); }
    }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui, sans-serif"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, H / 2 - 30); ctx.fillText(message.text, W / 2, H / 2 - 30);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f4f2ea"; ctx.strokeText(message.sub, W / 2, H / 2 - 12); ctx.fillText(message.sub, W / 2, H / 2 - 12); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="circuito-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coccinella</title>
<style>
  :root {
    --bg: #0a0a1e;
    --fg: #fff4f4;
    --muted: #b8b0d0;
    --red: #ff3a4a;
    --yellow: #ffe04a;
    --green: #4ae08a;
    --blue: #4ab0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 244, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: center; align-items: flex-end; pointer-events: none;
  }
  /* one thumb stick: the ladybug turns at the next crossing the way you point */
  #touch .stick { position: relative; width: 150px; height: 150px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 58, 74, 0.6); background: radial-gradient(circle, rgba(255,58,74,0.14), rgba(255,58,74,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
    background: rgba(255, 58, 74, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(255,244,244,0.25); pointer-events: none; }
  #touch.side { justify-content: flex-start; }
  #touch.small .stick { width: 120px; height: 120px; }
  #touch.small .stick .knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 10, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; letter-spacing: 2px; color: var(--red);
    text-shadow: 3px 3px 0 #3a0a1a, 0 0 22px rgba(255,58,74,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--green); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,244,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--red); color: #fff; background: var(--red); padding: 11px 30px; box-shadow: 0 4px 0 #8a1a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 480, TAU = Math.PI * 2;
  const N = 11, CS = 28, MX = (W - N * CS) / 2, MY = 78, MID = 5;   // an 11×11 maze, the insects' den in the middle
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];                    // up, right, down, left
  const WORD = "EXTRA";

  const THEMES = [
    { wall: "#4ab0ff", wall2: "#1a4a8a", bug: ["#4ae08a", "#1a6a3a"] },
    { wall: "#ff7ac8", wall2: "#8a2a6a", bug: ["#ffb43a", "#8a5a0a"] },
    { wall: "#7ae84a", wall2: "#2a6a1a", bug: ["#c86aff", "#5a1a8a"] },
    { wall: "#ffd04a", wall2: "#8a6a10", bug: ["#4ad8ff", "#0a5a7a"] },
  ];
  const VEGGIES = [["🥕", "Carota"], ["🍆", "Melanzana"], ["🥒", "Cetriolo"], ["🌽", "Pannocchia"], ["🥔", "Patata"], ["🍅", "Pomodoro"], ["🥦", "Broccolo"], ["🧅", "Cipolla"]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · insetti lenti e distratti", lives: 5, speed: 0.9, chase: 0.48, release: 1.15 },
    normale:   { label: "NORMALE",   color: "#ff3a4a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1.06, chase: 0.64, release: 0.95 },
    difficile: { label: "DIFFICILE", color: "#ffe04a", desc: "3 vite · insetti veloci che ti inseguono", lives: 3, speed: 1.18, chase: 0.76, release: 0.8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "coccinella-difficulty";
  const bestKey = (id) => `coccinella-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    touchEl.classList.toggle("side", !portrait);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(180px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 180;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  let dotTick = 0;
  const sfx = {
    dot: lim(() => { dotTick = 1 - dotTick; beep(dotTick ? 880 : 988, 0.04, "square", 0.015); }),
    gate: lim(() => { beep(300, 0.06, "triangle", 0.03, 200); noise(0.04, 0.04, 2000); }),
    heart: lim(() => arp([659, 880, 1175], 0.05, 0.08, "square", 0.03)),
    letter: lim(() => arp([784, 988, 1319], 0.05, 0.08, "square", 0.03)),
    release: lim(() => beep(180, 0.2, "sawtooth", 0.025, 120)),
    skull: lim(() => { noise(0.25, 0.15, 400); beep(120, 0.25, "square", 0.04, -60); }),
    veg: () => arp([523, 784, 1047, 1568], 0.06, 0.12),
    die: () => { noise(0.3, 0.2, 900); arp([784, 659, 523, 392, 262], 0.09, 0.14, "triangle", 0.05); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    extra: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.07, 0.14),
    start: () => arp([659, 784, 880, 1047, 880, 1047, 1319], 0.09, 0.13),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, mult = 1, extra = [false, false, false, false, false];
  let vegGiven = false, wallR = [], wallD = [], gates = [], gateOf = new Map(), items = [], L = null, bugs = [], queue = 0, lap = 0, lapT = 10, veggie = null, freezeT = 0;
  let parts = [], popups = [], message = null;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const theme = () => THEMES[level % THEMES.length];
  const pace = () => diff.speed * (1 + Math.min(level, 8) * 0.04);

  // ---------- The maze ----------
  // wallR[r][c]: wall on the right of cell (r,c) · wallD[r][c]: wall below it
  const inside = (c, r) => c >= 0 && r >= 0 && c < N && r < N;
  const edgeKey = (c, r, d) => { const [dx, dy] = DIRS[d]; const c2 = c + dx, r2 = r + dy; return dx ? `v${Math.min(c, c2)},${r}` : `h${c},${Math.min(r, r2)}`; };
  function wallBetween(c, r, d) {
    const [dx, dy] = DIRS[d], c2 = c + dx, r2 = r + dy;
    if (!inside(c2, r2)) return true;
    if (dx) return wallR[r][Math.min(c, c2)];
    return wallD[Math.min(r, r2)][c];
  }
  function gateBlocks(c, r, d) {
    const k = edgeKey(c, r, d), g = gateOf.get(k);
    if (!g) return false;
    return (k[0] === "h") === (g.o === "h");
  }
  const isDen = (c, r) => c === MID && r === MID;
  // a gate turns about a corner: flat ('h') it closes the two edges below it, upright ('v') the two beside it
  function gateEdges(g) { const { c, r } = g; return { h: [`h${c - 1},${r - 1}`, `h${c},${r - 1}`], v: [`v${c - 1},${r - 1}`, `v${c - 1},${r}`] }; }
  function buildMaze() {
    for (let tries = 0; tries < 200; tries++) {
      wallR = Array.from({ length: N }, () => Array(N).fill(false));
      wallD = Array.from({ length: N }, () => Array(N).fill(false));
      // short wall pieces, mirrored left to right
      for (let r = 0; r < N; r++) for (let c = 0; c <= MID; c++) {
        if (c < N - 1 && Math.random() < 0.3) { wallR[r][c] = true; wallR[r][N - 2 - c] = true; }
        if (r < N - 1 && Math.random() < 0.3) { wallD[r][c] = true; wallD[r][N - 1 - c] = true; }
      }
      // the den: shut on every side but the top
      wallR[MID][MID - 1] = true; wallR[MID][MID] = true; wallD[MID][MID] = true; wallD[MID - 1][MID] = false;
      // no dead ends: every cell keeps two ways out (the den excepted)
      for (let pass = 0; pass < 3; pass++) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (isDen(c, r)) continue;
        let open = [0, 1, 2, 3].filter((d) => !wallBetween(c, r, d) && !isDen(c + DIRS[d][0], r + DIRS[d][1]));
        while (open.length < 2) {
          const shut = [0, 1, 2, 3].filter((d) => wallBetween(c, r, d) && inside(c + DIRS[d][0], r + DIRS[d][1]) && !isDen(c + DIRS[d][0], r + DIRS[d][1]));
          if (!shut.length) break;
          const d = shut[Math.floor(Math.random() * shut.length)], c2 = c + DIRS[d][0], r2 = r + DIRS[d][1];
          if (DIRS[d][0]) { const cc = Math.min(c, c2); wallR[r][cc] = false; wallR[r][N - 2 - cc] = false; } else { const rr = Math.min(r, r2); wallD[rr][c] = false; wallD[rr][N - 1 - c] = false; }
          open = [0, 1, 2, 3].filter((dd) => !wallBetween(c, r, dd) && !isDen(c + DIRS[dd][0], r + DIRS[dd][1]));
        }
      }
      wallR[MID][MID - 1] = true; wallR[MID][MID] = true; wallD[MID][MID] = true; wallD[MID - 1][MID] = false;
      // every cell reachable
      const seen = new Set(["0,0"]), q = [[0, 0]];
      while (q.length) { const [c, r] = q.pop(); for (let d = 0; d < 4; d++) { const c2 = c + DIRS[d][0], r2 = r + DIRS[d][1]; if (!wallBetween(c, r, d) && !seen.has(`${c2},${r2}`)) { seen.add(`${c2},${r2}`); q.push([c2, r2]); } } }
      if (seen.size === N * N) break;
    }
    // the gates, on corners whose four edges are open and far enough from one another
    gates = []; gateOf = new Map();
    const cand = [];
    for (let r = 1; r < N; r++) for (let c = 1; c <= MID; c++) cand.push([c, r]);
    cand.sort(() => Math.random() - 0.5);
    const taken = (c, r) => gates.some((g) => Math.max(Math.abs(g.c - c), Math.abs(g.r - r)) < 2);
    for (const [c, r] of cand) {
      if (gates.length >= 14) break;
      const mc = N - c;
      if (taken(c, r) || taken(mc, r)) continue;
      const g = { c, r, o: Math.random() < 0.5 ? "h" : "v", turn: 0 }, e = gateEdges(g);
      const near = (cc, rr) => Math.abs(cc - MID) <= 1 && Math.abs(rr - MID) <= 1;
      if (near(c - 1, r - 1) || near(c, r) || near(c - 1, r) || near(c, r - 1)) continue;
      const allOpen = !wallD[r - 1][c - 1] && !wallD[r - 1][c] && !wallR[r - 1][c - 1] && !wallR[r][c - 1];
      if (!allOpen) continue;
      const m = { c: mc, r, o: g.o === "h" ? "h" : "v", turn: 0 };
      const mOpen = !wallD[r - 1][mc - 1] && !wallD[r - 1][mc] && !wallR[r - 1][mc - 1] && !wallR[r][mc - 1];
      if (!mOpen) continue;
      gates.push(g); if (mc !== c) gates.push(m);
    }
    for (const g of gates) { const e = gateEdges(g); for (const k of [...e.h, ...e.v]) gateOf.set(k, g); }
  }
  function placeItems() {
    items = [];
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!isDen(c, r) && !(c === MID && r === N - 1)) cells.push([c, r]);
    cells.sort(() => Math.random() - 0.5);
    let k = 0;
    const put = (type, extraProps = {}) => { const [c, r] = cells[k++]; items.push({ c, r, type, ...extraProps }); };
    for (let i = 0; i < 3; i++) put("heart", { ph: Math.random() * 3 });
    const need = [0, 1, 2, 3, 4].filter((i) => !extra[i]).sort(() => Math.random() - 0.5);
    for (let i = 0; i < 3; i++) put("letter", { ch: WORD[need.length ? need[i % need.length] : Math.floor(Math.random() * 5)], ph: Math.random() * 3 });
    // skulls: never near the start, and never cutting off a part of the garden
    const skulls = Math.min(5, 2 + Math.floor(level / 2)), skullAt = new Set();
    const rest = cells.slice(k);
    const allReachable = () => {
      const seen = new Set([`${MID},${N - 1}`]), q = [[MID, N - 1]];
      while (q.length) { const [c, r] = q.pop(); for (let d = 0; d < 4; d++) { const c2 = c + DIRS[d][0], r2 = r + DIRS[d][1], key = `${c2},${r2}`; if (!wallBetween(c, r, d) && !isDen(c2, r2) && !skullAt.has(key) && !seen.has(key)) { seen.add(key); q.push([c2, r2]); } } }
      return seen.size === N * N - 1 - skullAt.size;
    };
    for (const [c, r] of rest) {
      if (skullAt.size >= skulls) break;
      if (Math.abs(c - MID) + Math.abs(r - (N - 1)) < 3) continue;
      if (items.some((it) => it.c === c && it.r === r)) continue;
      skullAt.add(`${c},${r}`);
      if (!allReachable()) skullAt.delete(`${c},${r}`);
    }
    for (const key of skullAt) { const [c, r] = key.split(",").map(Number); items.push({ c, r, type: "skull" }); }
    for (const [c, r] of rest) if (!skullAt.has(`${c},${r}`)) items.push({ c, r, type: "dot" });
    items.push({ c: MID, r: N - 1, type: "dot" });
  }

  // ---------- Actors ----------
  const cellX = (c) => MX + c * CS + CS / 2, cellY = (r) => MY + r * CS + CS / 2;
  function newActor(c, r, d, speed) { return { c, r, d, nd: d, t: 0, moving: false, speed, x: cellX(c), y: cellY(r) }; }
  function canGo(a, d, player) {
    if (wallBetween(a.c, a.r, d)) return false;
    const c2 = a.c + DIRS[d][0], r2 = a.r + DIRS[d][1];
    if (player && isDen(c2, r2)) return false;
    if (!player && gateBlocks(a.c, a.r, d)) return false;
    return true;
  }
  function stepActor(a, dt, choose) {
    if (!a.moving) {
      const d = choose(a);
      if (d === null || d === undefined) { a.x = cellX(a.c); a.y = cellY(a.r); return; }
      a.d = d; a.moving = true; a.t = 0;
      if (a === L && gateBlocks(a.c, a.r, d)) { const g = gateOf.get(edgeKey(a.c, a.r, d)); g.o = g.o === "h" ? "v" : "h"; g.turn = 1; sfx.gate(); }
    }
    a.t += a.speed * dt;
    if (a.t >= 1) {
      a.c += DIRS[a.d][0]; a.r += DIRS[a.d][1]; a.moving = false;
      const over = a.t - 1; a.t = 0;
      a.x = cellX(a.c); a.y = cellY(a.r);
      if (a.onCell) a.onCell();
      if (over > 0 && state === "play" && !a.dead) { stepActor(a, over / a.speed, choose); return; }
      return;
    }
    a.x = cellX(a.c) + DIRS[a.d][0] * CS * a.t; a.y = cellY(a.r) + DIRS[a.d][1] * CS * a.t;
  }
  function inputDir() {
    const ix = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    const iy = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    if (Math.abs(ix) < 0.3 && Math.abs(iy) < 0.3) return null;
    return Math.abs(ix) > Math.abs(iy) ? (ix > 0 ? 1 : 3) : (iy > 0 ? 2 : 0);
  }
  function choosePlayer(a) {
    const want = inputDir();
    if (want !== null) a.nd = want;
    if (canGo(a, a.nd, true)) return a.nd;

    ctx.textAlign = "left"; ctx.fillStyle = "#fff4f4"; ctx.font = "900 17px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 12, 18);
    ctx.fillStyle = "#b8b0d0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 12, 36);
    ctx.textAlign = "center"; ctx.fillStyle = "#ff3a4a"; ctx.font = "800 11px system-ui"; ctx.fillText(`GIARDINO ${level + 1}`, W / 2, 18);
    if (mult > 1) { ctx.fillStyle = "#4ab0ff"; ctx.font = "900 12px system-ui"; ctx.fillText(`PUNTI ×${mult}`, W / 2, 36); }
    ctx.textAlign = "right";
    for (let i = 0; i < Math.min(lives, 6); i++) { const x = W - 16 - i * 18, y = 20; ctx.fillStyle = "#e8283a"; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill(); ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 0.5, y - 6, 1, 12); ctx.beginPath(); ctx.arc(x - 2.5, y - 1, 1.2, 0, TAU); ctx.arc(x + 2.5, y + 2, 1.2, 0, TAU); ctx.fill(); }
    // EXTRA
    const ey = MY + N * CS + 30;
    for (let i = 0; i < 5; i++) {
      const x = W / 2 + (i - 2) * 26;
      ctx.fillStyle = extra[i] ? "#ffe04a" : "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.arc(x, ey, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = extra[i] ? "#1a0a1a" : "rgba(255,255,255,0.45)"; ctx.font = "900 12px system-ui"; ctx.textAlign = "center"; ctx.fillText(WORD[i], x, ey + 0.5);
    }
    ctx.fillStyle = "#b8b0d0"; ctx.font = "700 9px system-ui"; ctx.textAlign = "center";
    ctx.fillText(queue > 0 ? `insetti nella tana: ${queue}` : veggie ? `${veggie.name} al centro: congela gli insetti!` : "", W / 2, ey + 22);
    if (freezeT > 0) { ctx.fillStyle = "#a8d8ff"; ctx.font = "900 11px system-ui"; ctx.fillText(`INSETTI CONGELATI ${freezeT.toFixed(1)}`, W / 2, ey + 36); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!L) { buildMaze(); placeItems(); L = newActor(MID, N - 1, 0, 3.6); }
    ctx.fillStyle = "#0a0a1e"; ctx.fillRect(0, 0, W, H);
    drawMaze();
    drawItems();
    for (const b of bugs) drawBug(b);
    if (state !== "menu") drawLadybug();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0a0a1e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui";
      ctx.lineWidth = 6; ctx.strokeStyle = "#0a0a1e"; ctx.strokeText(message.text, W / 2, MY + N * CS / 2 - 40); ctx.fillStyle = "#ff3a4a"; ctx.fillText(message.text, W / 2, MY + N * CS / 2 - 40);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, MY + N * CS / 2 - 18); ctx.fillStyle = "#fff4f4"; ctx.fillText(message.sub, W / 2, MY + N * CS / 2 - 18); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="coccinella-best-" data-kind="score"></script>

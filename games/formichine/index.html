<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Formichine</title>
<style>
  :root {
    --bg: #0c0a16;
    --fg: #f4f8f0;
    --muted: #b0b8c8;
    --green: #5ae05a;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --blue: #4a8aff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a3a, 0 10px 40px rgba(0,0,0,0.6); cursor: crosshair; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 248, 240, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 10, 22, 0.92);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; letter-spacing: 2px; color: var(--green);
    text-shadow: 3px 3px 0 #1a3a1a, 0 0 22px rgba(90,224,90,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--green); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 580px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,248,240,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--green); color: #0a2a0a; background: var(--green); padding: 11px 30px; box-shadow: 0 4px 0 #2a7a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 270, TW = 480, TH = 220, BAR = 220;
  const TICK = 1 / 18, SPLAT = 62, TAU = Math.PI * 2;
  const EMPTY = 0, DIRT = 1, STEEL = 2, BRICK = 3;

  const SKILLS = [
    { id: "climb", label: "SALI", key: "1" }, { id: "float", label: "OMBRELLO", key: "2" }, { id: "bomb", label: "BOMBA", key: "3" },
    { id: "block", label: "STOP", key: "4" }, { id: "build", label: "SCALA", key: "5" }, { id: "bash", label: "SFONDA", key: "6" }, { id: "dig", label: "SCAVA", key: "7" },
  ];
  const THEMES = [
    { sky: ["#1a2a4a", "#0c1020"], dirt: [[150, 100, 60], [120, 78, 44]], top: [120, 200, 80] },
    { sky: ["#3a1a3a", "#120814"], dirt: [[190, 150, 110], [150, 110, 80]], top: [230, 200, 150] },
    { sky: ["#0a2a2a", "#061214"], dirt: [[90, 110, 150], [60, 80, 120]], top: [150, 220, 255] },
    { sky: ["#3a2a0a", "#140c04"], dirt: [[170, 90, 60], [130, 60, 40]], top: [255, 180, 90] },
  ];
  const r = (x, y, w, h, m = DIRT) => ({ x, y, w, h, m });
  // eight levels; every one is solved with the skills it gives (see the tests)
  const LEVELS = [
    { name: "Basta una buca", tip: "Fai scavare in giù una formichina: le altre la seguiranno",
      shapes: [r(20, 90, 440, 14), r(10, 40, 10, 64, STEEL), r(460, 40, 10, 64, STEEL), r(0, 145, 480, 75), r(0, 110, 8, 35, STEEL), r(472, 110, 8, 35, STEEL)],
      hatch: [80, 45], exit: [400, 144], total: 10, need: 7, time: 120, rate: 2, skills: { dig: 2 } },
    { name: "Una scala per salire", tip: "Fai costruire una scala poco prima del blocco d'acciaio",
      shapes: [r(0, 160, 480, 60), r(0, 100, 8, 60, STEEL), r(472, 100, 8, 60, STEEL), r(200, 150, 40, 10, STEEL)],
      hatch: [60, 110], exit: [400, 159], total: 10, need: 9, time: 120, rate: 2, skills: { build: 2 } },
    { name: "Il muro", tip: "Sfonda il muro di terra",
      shapes: [r(0, 160, 480, 60), r(0, 100, 8, 60, STEEL), r(472, 100, 8, 60, STEEL), r(220, 90, 40, 70)],
      hatch: [60, 110], exit: [400, 159], total: 12, need: 10, time: 120, rate: 2, skills: { bash: 2 } },
    { name: "Il ponte", tip: "Ferma le altre con uno STOP mentre la prima costruisce il ponte; poi falla saltare",
      shapes: [r(0, 130, 210, 90), r(242, 130, 238, 90), r(0, 70, 8, 60, STEEL), r(472, 70, 8, 60, STEEL)],
      water: [[210, 196, 32, 24]], hatch: [40, 80], exit: [420, 129], total: 10, need: 8, time: 150, rate: 2, skills: { build: 2, block: 1, bomb: 1 } },
    { name: "Ombrelli aperti", tip: "Senza ombrello, un salto così è troppo alto",
      shapes: [r(0, 70, 200, 14), r(0, 20, 8, 64, STEEL), r(0, 200, 480, 20), r(472, 150, 8, 50, STEEL)],
      hatch: [40, 25], exit: [400, 199], total: 10, need: 7, time: 150, rate: 2.5, skills: { float: 10 } },
    { name: "Scalatori", tip: "L'uscita è sulla sporgenza: servono formichine che sanno arrampicarsi",
      shapes: [r(0, 170, 480, 50), r(0, 110, 8, 60, STEEL), r(300, 90, 180, 12), r(300, 90, 20, 80), r(472, 40, 8, 50, STEEL)],
      hatch: [60, 120], exit: [430, 89], total: 10, need: 7, time: 150, rate: 2.5, skills: { climb: 10 } },
    { name: "Giù e poi dritto", tip: "Scava fino alla galleria, poi sfonda il muro",
      shapes: [r(20, 90, 280, 20), r(10, 40, 10, 70, STEEL), r(300, 60, 30, 85), r(0, 145, 480, 75), r(0, 110, 8, 35, STEEL), r(472, 100, 8, 45, STEEL)],
      hatch: [80, 45], exit: [420, 144], total: 12, need: 10, time: 150, rate: 2, skills: { dig: 2, bash: 2 } },
    { name: "Il gran finale", tip: "Ponte, poi una buca nel tetto della grotta",
      shapes: [r(0, 120, 200, 100), r(232, 120, 248, 20), r(232, 140, 10, 35), r(232, 175, 248, 45), r(0, 60, 8, 60, STEEL), r(472, 60, 8, 115, STEEL)],
      water: [[200, 196, 32, 24]], hatch: [40, 70], exit: [420, 174], total: 12, need: 9, time: 180, rate: 2, skills: { build: 2, block: 1, bomb: 1, dig: 2 } },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 tentativi · più abilità, più tempo, bastano meno formichine", tries: 5, need: -0.2, extra: 1, time: 1.4, rate: 1.15 },
    normale:   { label: "NORMALE",   color: "#5ae05a", desc: "3 tentativi · l'esperienza classica", tries: 3, need: 0, extra: 0, time: 1, rate: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 tentativi · meno tempo, bisogna salvarne di più", tries: 3, need: 0.1, extra: 0, time: 0.75, rate: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "formichine-difficulty";
  const bestKey = (id) => `formichine-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, cssScale = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    cssScale = s;
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());
  const terrCanvas = document.createElement("canvas"); terrCanvas.width = TW; terrCanvas.height = TH;
  const tctx = terrCanvas.getContext("2d");
  const img = tctx.createImageData(TW, TH);

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    assign: lim(() => beep(880, 0.06, "square", 0.03, 200)),
    nope: lim(() => beep(160, 0.08, "square", 0.02)),
    select: lim(() => beep(660, 0.04, "triangle", 0.03)),
    brick: lim(() => beep(420, 0.03, "square", 0.012)),
    dig: lim(() => noise(0.04, 0.03, 500)),
    splat: lim(() => { noise(0.15, 0.12, 300); beep(90, 0.1, "square", 0.03, -40); }),
    drown: lim(() => noise(0.3, 0.08, 1400)),
    boom: lim(() => { noise(0.35, 0.25, 500); beep(80, 0.25, "sine", 0.06, -40); }),
    saved: lim(() => arp([784, 1047], 0.05, 0.07, "square", 0.025)),
    door: () => arp([262, 330, 392], 0.08, 0.12, "triangle", 0.04),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    fail: () => arp([523, 466, 415, 392], 0.14, 0.2, "triangle", 0.05),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, tries = 3, level = 0, loop = 0, bestCache = 0, result = null;
  let terr = new Uint8Array(TW * TH), dirty = true, L = null, lems = [], spawned = 0, saved = 0, lost = 0, timeLeft = 0, spawnT = 0, tickAcc = 0;
  let skills = {}, sel = 4, fast = false, nuking = false, parts = [], popups = [], message = null, cursor = { x: 240, y: 110, on: false }, hover = null;
  const keys = { left: false, right: false, up: false, down: false };
  const theme = () => THEMES[level % THEMES.length];

  // ---------- Terrain ----------
  const at = (x, y) => (x < 0 || x >= TW ? STEEL : y < 0 || y >= TH ? EMPTY : terr[y * TW + x]);
  const solid = (x, y) => at(x, y) !== EMPTY;
  function setT(x, y, m) { if (x >= 0 && x < TW && y >= 0 && y < TH) { terr[y * TW + x] = m; dirty = true; } }
  function clearDirt(x, y) { if (x < 0 || x >= TW || y < 0 || y >= TH) return false; const m = terr[y * TW + x]; if (m === DIRT || m === BRICK) { terr[y * TW + x] = EMPTY; dirty = true; return true; } return false; }
  function buildTerrain(lv) {
    terr = new Uint8Array(TW * TH);
    for (const s of lv.shapes) for (let y = s.y; y < s.y + s.h; y++) for (let x = s.x; x < s.x + s.w; x++) if (x >= 0 && x < TW && y >= 0 && y < TH) terr[y * TW + x] = s.m;
    dirty = true;
  }
  function paintTerrain() {
    const th = theme(), d = img.data;
    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
      const i = (y * TW + x) * 4, m = terr[y * TW + x];
      if (m === EMPTY) { d[i + 3] = 0; continue; }
      let c;
      if (m === STEEL) {
        const edge = x % 16 === 0 || y % 16 === 0, rivet = (x % 16 === 3 || x % 16 === 12) && (y % 16 === 3 || y % 16 === 12);
        const v = edge ? 90 : rivet ? 200 : 140 + ((x + y) % 7);
        c = [v, v + 4, v + 12];
      } else if (m === BRICK) {
        c = (x + y * 3) % 8 === 0 ? [150, 60, 40] : [210, 110, 70];
      } else {
        const h = ((x * 73856093) ^ (y * 19349663)) >>> 0, k = (h % 100) / 100;
        const [a, b] = th.dirt; c = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        if (y > 0 && terr[(y - 1) * TW + x] === EMPTY) c = th.top;
        else if (y > 1 && terr[(y - 2) * TW + x] === EMPTY) c = [(c[0] + th.top[0]) / 2, (c[1] + th.top[1]) / 2, (c[2] + th.top[2]) / 2];
      }
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    tctx.putImageData(img, 0, 0);
    dirty = false;
  }

  // ---------- Levels ----------
  function levelNeed(lv) {
    let need = lv.need + Math.round(lv.total * diff.need);
    const minLoss = lv.skills.bomb ? 1 : 0;
    return clamp(need, 1, lv.total - minLoss);
  }
  function beginLevel() {
    L = LEVELS[level % LEVELS.length];
    buildTerrain(L);
    lems = []; spawned = 0; saved = 0; lost = 0; spawnT = 1.5; tickAcc = 0; nuking = false; fast = false; parts = []; popups = [];
    timeLeft = Math.round(L.time * diff.time * Math.pow(0.9, loop));
    skills = {};
    for (const s of SKILLS) skills[s.id] = L.skills[s.id] ? L.skills[s.id] + diff.extra : 0;
    sel = SKILLS.findIndex((s) => skills[s.id] > 0);
    message = { text: `LIVELLO ${level + 1}: ${L.name.toUpperCase()}`, sub: `Salvane ${levelNeed(L)} su ${L.total} · ${L.tip}`, t: 0 };
    state = "intro"; stateT = 2.6;
  }
  const alive = () => lems.filter((l) => !l.gone);

  // ---------- Lemmings ----------
  function spawn() {
    const [hx, hy] = L.hatch;
    lems.push({ x: hx, y: hy, dir: 1, st: "fall", fall: 0, t: 0, climber: false, floater: false, bomb: 0, bricks: 0, anim: 0, id: spawned });
    spawned++;
  }
  function kill(l, how) {
    if (l.gone) return;
    l.gone = true; lost++;
    if (how === "splat") { sfx.splat(); burst(l.x, l.y - 2, "#5ae05a", 8, 60); }
    else if (how === "drown") { sfx.drown(); burst(l.x, l.y, "#4a8aff", 10, 50); }
    else if (how === "boom") { burst(l.x, l.y - 5, "#ffb43a", 22, 110); }
    else burst(l.x, l.y - 3, "#ffffff", 6, 40);
  }
  function blockedBy(l, nx) {
    for (const b of lems) if (b !== l && !b.gone && b.st === "block" && Math.abs(b.x - nx) <= 3 && Math.abs(b.y - l.y) < 10 && Math.sign(b.x - l.x) === l.dir) return true;
    return false;
  }
  function inWater(l) { return (L.water || []).some(([x, y, w, h]) => l.x >= x && l.x < x + w && l.y >= y && l.y < y + h); }
  function atExit(l) { const [ex, ey] = L.exit; return Math.abs(l.x - ex) <= 3 && l.y >= ey - 6 && l.y <= ey + 1; }
  function explode(l) {
    const cx = l.x, cy = l.y - 8, R = 12;
    for (let y = cy - R; y <= cy + R; y++) for (let x = cx - R; x <= cx + R; x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= R * R) clearDirt(x, y);
    sfx.boom(); kill(l, "boom");
  }
  function walkStep(l) {
    const nx = l.x + l.dir;
    if (blockedBy(l, nx)) { l.dir = -l.dir; return; }
    if (solid(nx, l.y)) {
      let rise = 0;
      for (let k = 1; k <= 6; k++) if (!solid(nx, l.y - k)) { rise = k; break; }
      if (rise) { l.x = nx; l.y -= rise; }
      else if (l.climber) { l.st = "climb"; }
      else l.dir = -l.dir;
      return;
    }
    l.x = nx;
    if (solid(l.x, l.y + 1)) return;
    for (let d = 1; d <= 3; d++) if (solid(l.x, l.y + 1 + d)) { l.y += d; return; }
    l.st = "fall"; l.fall = 0;
  }
  function lemTick(l) {
    l.anim++;
    if (l.bomb > 0) { l.bomb -= TICK; if (l.bomb <= 0) { explode(l); return; } }
    switch (l.st) {
      case "fall": {
        const speed = l.floater && l.fall > 12 ? 1 : 3;
        for (let k = 0; k < speed; k++) {
          if (solid(l.x, l.y + 1)) {
            if (l.fall > SPLAT && !l.floater) { kill(l, "splat"); return; }
            l.st = "walk"; l.fall = 0; break;
          }
          l.y++; l.fall++;
          if (l.y >= TH) { kill(l, "fall"); return; }
        }
        break;
      }
      case "walk": walkStep(l); break;
      case "climb": {
        if (solid(l.x, l.y - 11)) { l.dir = -l.dir; l.st = "fall"; l.fall = 0; break; }
        l.y--;
        if (!solid(l.x + l.dir, l.y)) { l.x += l.dir; l.st = "walk"; }
        break;
      }
      case "build": {
        l.t++;
        if (l.t % 9 !== 0) break;
        if (l.bricks >= 12) { l.st = "walk"; break; }
        // something in the way at head height: stop and turn
        for (let i = 1; i <= 5; i++) for (let yy = l.y - 11; yy <= l.y - 3; yy++) if (solid(l.x + l.dir * i, yy)) { l.st = "walk"; l.dir = -l.dir; return; }
        for (let i = 0; i < 8; i++) for (const yy of [l.y, l.y - 1]) if (!solid(l.x + l.dir * i, yy)) setT(l.x + l.dir * i, yy, BRICK);
        l.x += l.dir * 4; l.y -= 2; l.bricks++; sfx.brick();
        break;
      }
      case "bash": {
        l.t++;
        if (l.t % 2) break;
        for (let i = 1; i <= 3; i++) for (let yy = l.y - 9; yy <= l.y; yy++) if (at(l.x + l.dir * i, yy) === STEEL) { l.st = "walk"; l.dir = -l.dir; return; }
        let any = false;
        for (let i = 1; i <= 8 && !any; i++) for (let yy = l.y - 9; yy <= l.y; yy++) { const m = at(l.x + l.dir * i, yy); if (m === DIRT || m === BRICK) { any = true; break; } }
        if (!any) { l.st = "walk"; break; }
        for (let i = 1; i <= 4; i++) for (let yy = l.y - 9; yy <= l.y; yy++) clearDirt(l.x + l.dir * i, yy);

    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.fillStyle = p.color; ctx.font = "900 8px system-ui"; ctx.textAlign = "center"; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;
    if (state !== "menu") {
      drawBar();
      // counters
      const out = alive().length, need = L ? levelNeed(L) : 0;
      ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(4, 4, 196, 13);
      ctx.fillStyle = "#f4f8f0"; ctx.font = "800 8px system-ui"; ctx.textAlign = "left";
      ctx.fillText(`LIV. ${level + 1} · FUORI ${out} · A CASA `, 8, 13);
      const wd = ctx.measureText(`LIV. ${level + 1} · FUORI ${out} · A CASA `).width;
      ctx.fillStyle = saved >= need ? "#5ae05a" : "#ffe04a"; ctx.fillText(`${saved}/${need}`, 8 + wd, 13);
      ctx.fillStyle = "#b0b8c8"; ctx.fillText(` · perse ${lost}`, 8 + wd + ctx.measureText(`${saved}/${need}`).width, 13);
    }
    const msg = state === "result" && result ? { text: result.text, sub: result.sub, t: 0.5 } : message;
    if (msg && state !== "menu") {
      ctx.globalAlpha = Math.min(1, (3 - msg.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 70, W, 50);
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = state === "result" && result && !result.ok ? "#ff4a3a" : "#5ae05a";
      ctx.fillText(msg.text, W / 2, 91);
      if (msg.sub) { ctx.font = "700 8.5px system-ui"; ctx.fillStyle = "#f4f8f0"; ctx.fillText(msg.sub, W / 2, 108); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="formichine-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Le Scale del Demone</title>
<style>
  :root {
    --bg: #0e0c14;
    --fg: #f4f6ee;
    --muted: #d8d0b8;
    --pink: #ffd23a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk the corridors; hold SPADA to draw the sword (put it away and the shield in front stops the spells) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 12, 20, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a1a6a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8781a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Spada">SPADA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // each floor of the tower is a maze of COLS × ROWS rooms; walls are bits of each room: N 1 · E 2 · S 4 · W 8
  const COLS = 18, ROWS = 9, CS = 34, MX = (W - COLS * CS) / 2, MY = TOP + (H - TOP - ROWS * CS) / 2;
  const DIRS = [{ dx: 0, dy: -1, b: 1 }, { dx: 1, dy: 0, b: 2 }, { dx: 0, dy: 1, b: 4 }, { dx: -1, dy: 0, b: 8 }];
  const OPP = [2, 3, 0, 1];
  // the monsters. hp: how long they last against the sword · atk: health they take from Gilberto per second of contact
  const KINDS = {
    slime:  { name: "Gelatina verde", hp: 0.25, atk: 70, speed: 1.0, pts: 100 },
    blue:   { name: "Gelatina blu", hp: 0.6, atk: 90, speed: 1.35, pts: 200 },
    knight: { name: "Cavaliere nero", hp: 3, atk: 30, speed: 1.25, pts: 500 },
    red:    { name: "Cavaliere rosso", hp: 5, atk: 40, speed: 1.5, pts: 800 },
    mage:   { name: "Mago", hp: 0.2, atk: 20, speed: 0, pts: 300 },
    ghost:  { name: "Fantasma", hp: 0.5, atk: 50, speed: 0.75, pts: 400 },
    wisp:   { name: "Fuoco fatuo", hp: 0.3, atk: 60, speed: 1.1, pts: 50 },
    demon:  { name: "Il Demone", hp: 8, atk: 45, speed: 0.9, pts: 5000 },
  };
  // what makes the floor's treasure appear (always written at the top)
  const QUESTS = [
    { id: "slimes", text: "sconfiggi tutte le gelatine" },
    { id: "mage", text: "sconfiggi un mago", needs: "mage" },
    { id: "fastkey", text: "prendi la chiave entro 15 secondi" },
    { id: "knight", text: "sconfiggi un cavaliere", needs: "knight" },
    { id: "still", text: "resta fermo 3 secondi con la spada sguainata" },
    { id: "doorfirst", text: "tocca la porta prima di avere la chiave" },
    { id: "block", text: "para 2 incantesimi con lo scudo", needs: "mage" },
  ];
  const TREASURES = [
    { id: "sword", name: "SPADA D'ARGENTO", sub: "colpi più forti" },
    { id: "armor", name: "ARMATURA", sub: "i mostri ti fanno meno male" },
    { id: "boots", name: "STIVALI", sub: "cammini più svelto" },
    { id: "candle", name: "CANDELA", sub: "vedi dove compariranno i maghi" },
    { id: "potion", name: "POZIONE", sub: "salute piena" },
    { id: "hourglass", name: "CLESSIDRA", sub: "+20 secondi" },
    { id: "gem", name: "GEMMA", sub: "+2.000 punti" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 vite · 80 secondi a piano · meno mostri, e fanno meno male", lives: 4, time: 80, hurt: 0.9, more: 0.8, bolt: 4.2 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "3 vite · 70 secondi a piano", lives: 3, time: 70, hurt: 1.4, more: 1, bolt: 5 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · 60 secondi a piano · più mostri, più forti, incantesimi più veloci", lives: 3, time: 60, hurt: 1.8, more: 1.3, bolt: 6 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "demone-difficulty";
  const bestKey = (id) => `demone-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let treasureRun = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    step: lim(() => beep(rnd(150, 180), 0.03, "triangle", 0.012)),
    clang: lim(() => { beep(rnd(900, 1100), 0.05, "square", 0.025); beep(rnd(300, 360), 0.07, "sawtooth", 0.02); }),
    kill: lim(() => arp([660, 880, 1175], 0.04, 0.07, "square", 0.035)),
    ouch: lim(() => beep(180, 0.1, "sawtooth", 0.03, -60)),
    spell: lim(() => beep(1200, 0.25, "sine", 0.03, -900)),
    block: lim(() => arp([1568, 2093], 0.03, 0.06, "square", 0.035)),
    zap: lim(() => { beep(220, 0.3, "sawtooth", 0.05, -150); }),
    poof: lim(() => beep(500, 0.15, "triangle", 0.025, 400)),
    key: () => arp([784, 988, 1175, 1568], 0.07, 0.12, "square", 0.045),
    chest: () => arp([523, 659, 784, 1047, 1319], 0.06, 0.1, "square", 0.04),
    quest: () => arp([1047, 1319, 1568], 0.06, 0.08, "triangle", 0.05),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    roar: () => { beep(90, 0.6, "sawtooth", 0.06, 40); beep(60, 0.6, "square", 0.04); },
    tick: lim(() => beep(1400, 0.03, "square", 0.02)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, floor = 1, nextLife = 20000, kills = 0;
  let walls = [], gil = null, mobs = [], bolts = [], parts = [], popups = [], message = null;
  let keyAt = null, doorAt = null, hasKey = false, chest = null, quest = null, questDone = false, gotTreasure = false;
  let timeLeft = 70, floorT = 0, wispT = 0, deadT = 0, clearT = 0, stillT = 0, blocks = 0, killedSlimes = 0, startAt = null;
  const items = new Set();
  let actHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The maze ----------
  const inside = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
  const open = (c, r, d) => inside(c + DIRS[d].dx, r + DIRS[d].dy) && !(walls[r][c] & DIRS[d].b);
  function carve(c, r, d) { walls[r][c] &= ~DIRS[d].b; walls[r + DIRS[d].dy][c + DIRS[d].dx] &= ~DIRS[OPP[d]].b; }
  // a winding maze with a few extra openings, so there's always more than one way round a monster
  function makeMaze() {
    walls = Array.from({ length: ROWS }, () => new Array(COLS).fill(15));
    const seen = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
    const stack = [[Math.floor(Math.random() * COLS), Math.floor(Math.random() * ROWS)]];
    seen[stack[0][1]][stack[0][0]] = true;
    while (stack.length) {
      const [c, r] = stack[stack.length - 1];
      const ds = [0, 1, 2, 3].filter((d) => { const nc = c + DIRS[d].dx, nr = r + DIRS[d].dy; return inside(nc, nr) && !seen[nr][nc]; });
      if (!ds.length) { stack.pop(); continue; }
      const d = ds[Math.floor(Math.random() * ds.length)];
      carve(c, r, d);
      const nc = c + DIRS[d].dx, nr = r + DIRS[d].dy; seen[nr][nc] = true; stack.push([nc, nr]);
    }
    let extra = Math.round(COLS * ROWS * 0.14);
    while (extra > 0) {
      const c = Math.floor(Math.random() * COLS), r = Math.floor(Math.random() * ROWS), d = Math.floor(Math.random() * 4);
      if (open(c, r, d) || !inside(c + DIRS[d].dx, r + DIRS[d].dy)) continue;
      carve(c, r, d); extra--;
    }
  }
  // distances from a room to every other, walking the corridors
  function distMap(c0, r0) {
    const d = Array.from({ length: ROWS }, () => new Array(COLS).fill(Infinity));
    d[r0][c0] = 0; const q = [[c0, r0]];
    for (let i = 0; i < q.length; i++) {
      const [c, r] = q[i];
      for (let k = 0; k < 4; k++) if (open(c, r, k)) { const nc = c + DIRS[k].dx, nr = r + DIRS[k].dy; if (d[nr][nc] === Infinity) { d[nr][nc] = d[r][c] + 1; q.push([nc, nr]); } }
    }
    return d;
  }
  function farthest(dm, minFrom = []) {
    let best = null, bd = -1;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (dm[r][c] === Infinity || minFrom.some(([a, b]) => Math.abs(a - c) + Math.abs(b - r) < 4)) continue;
      const v = dm[r][c] + Math.random() * 3;
      if (v > bd) { bd = v; best = [c, r]; }
    }
    return best;
  }

  // ---------- Movers ----------
  // something that walks from room to room: it sits in a room (c, r) or is on its way to the next one (t from 0 to 1)
  function mover(c, r) { return { c, r, tc: c, tr: r, t: 0, dir: -1, face: 2 }; }
  const px = (m) => m.c + (m.tc - m.c) * m.t, py = (m) => m.r + (m.tr - m.r) * m.t;
  const atCenter = (m) => m.dir < 0;
  function startMove(m, d) { m.dir = d; m.tc = m.c + DIRS[d].dx; m.tr = m.r + DIRS[d].dy; m.t = 0; m.face = d; }
  // moves along; returns true each time it reaches a room
  function advance(m, sp, dt) {
    if (m.dir < 0) return false;
    m.t += sp * dt;
    if (m.t >= 1) { m.c = m.tc; m.r = m.tr; m.t = 0; m.dir = -1; return true; }
    return false;
  }
  function reverse(m) { const d = OPP[m.dir]; [m.c, m.tc] = [m.tc, m.c]; [m.r, m.tr] = [m.tr, m.r]; m.t = 1 - m.t; m.dir = d; m.face = d; }

  // ---------- Floors ----------
  function addMob(kind, c, r) {
    const K = KINDS[kind], m = mover(c, r);
    Object.assign(m, { kind, K, hp: K.hp * (kind === "demon" ? 1 + 0.3 * (floor / 5 - 1) : 1), hit: 0, vis: kind !== "mage", wait: rnd(0.5, 2.5), cast: false, x: c, y: r, id: Math.random() });
    mobs.push(m);
    return m;
  }
  function buildFloor() {
    makeMaze();
    mobs = []; bolts = []; chest = null; hasKey = false; questDone = false; gotTreasure = false;
    const s = [Math.floor(Math.random() * 3), Math.floor(Math.random() * ROWS)];
    startAt = s;
    const dm = distMap(s[0], s[1]);
    const demonFloor = floor % 5 === 0;
    keyAt = demonFloor ? null : farthest(dm);
    doorAt = farthest(distMap(...(keyAt || s)), keyAt ? [keyAt, s] : [s]);
    const n = (k) => Math.max(0, Math.round(k * diff.more));
    const spots = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (dm[r][c] >= 5) spots.push([c, r]);
    const take = () => spots.splice(Math.floor(Math.random() * spots.length), 1)[0];
    const slimes = n(Math.min(7, 3 + floor / 2));
    for (let i = 0; i < slimes; i++) { const p = take(); if (p) addMob(floor >= 4 && i % 3 === 0 ? "blue" : "slime", ...p); }
    if (floor >= 2) for (let i = 0; i < n(Math.min(3, 1 + Math.floor((floor - 2) / 3))); i++) addMob("mage", 0, 0).wait = rnd(2, 5);
    if (floor >= 2) for (let i = 0; i < n(Math.min(3, 1 + Math.floor((floor - 2) / 4))); i++) { const p = take(); if (p) addMob(floor >= 7 && i === 0 ? "red" : "knight", ...p); }
    if (floor >= 7) for (let i = 0; i < n(Math.min(3, 1 + Math.floor((floor - 7) / 5))); i++) { const p = take(); if (p) addMob("ghost", ...p); }
    if (demonFloor) { const p = farthest(dm); addMob("demon", ...p); }
    // the treasure of the floor: one of the quests this floor can offer
    const kinds = new Set(mobs.map((m) => (m.kind === "red" ? "knight" : m.kind)));
    const ok = QUESTS.filter((q) => !q.needs || kinds.has(q.needs));
    quest = ok[(floor * 5 + Math.floor(Math.random() * 3)) % ok.length];
    killedSlimes = 0; blocks = 0; stillT = 0;
  }
  function placeGil() {
    gil = mover(startAt[0], startAt[1]); gil.face = 1;
    Object.assign(gil, { hp: 100, hurt: 0, inv: 2 });
  }
  function startFloor() {
    buildFloor();
    const hp = gil ? gil.hp : 100;
    placeGil(); gil.hp = Math.min(100, hp + 25);
    timeLeft = diff.time; floorT = 0; wispT = 0;
    message = { text: floor % 5 === 0 ? `PIANO ${floor} · IL DEMONE` : `PIANO ${floor}`, sub: floor % 5 === 0 ? "la chiave ce l'ha lui: sconfiggilo!" : "trova la chiave, poi la porta", t: 0 };
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; floor = 1; nextLife = 30000; kills = 0; deadT = 0; clearT = 0; parts = []; popups = []; gil = null; treasureRun = 0;
    items.clear();
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;

  }
  function drawKey() {

    ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 3;

  function drawChest() {

    ctx.fillStyle = "#ffd23a"; ctx.fillRect(-10, -5, 20, 2); ctx.fillRect(-2, -6, 4, 5);
    ctx.restore();
  }
  function drawGil() {
    if (deadT > 0 && Math.floor(clock * 10) % 2) return;
    if (gil.inv > 0 && deadT <= 0 && Math.floor(clock * 12) % 2) return;
    const x = sx(px(gil)), y = sy(py(gil)), f = gil.face, sword = actHeld && deadT <= 0;
    const bob = gil.dir >= 0 ? Math.abs(Math.sin(clock * 12)) * 1.5 : 0;
    ctx.save(); ctx.translate(x, y - bob);
    // body: golden armour
    ctx.fillStyle = gil.hurt > 0 ? "#ff8a8a" : "#e8b830"; ctx.beginPath(); ctx.ellipse(0, 3, 8, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#c8981a"; ctx.fillRect(-8, 4, 16, 3);
    // helmet with a red plume
    ctx.fillStyle = "#f0c840"; ctx.beginPath(); ctx.arc(0, -7, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; const vx = [0, 3, 0, -3][f], vy = [-3, 0, 2, 0][f]; if (f !== 0) ctx.fillRect(-4 + vx, -8 + vy, 8, 2);
    ctx.fillStyle = "#d82a2a"; ctx.beginPath(); ctx.ellipse(0, -15, 3, 4, 0, 0, TAU); ctx.fill();

    const D = DIRS[f];
    if (!sword) {
      ctx.fillStyle = "#4a7ad8"; ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(D.dx * 10, D.dy * 9 + 2, D.dx ? 3 : 7, D.dx ? 8 : 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = items.has("sword") ? "#e8f0ff" : "#c8c8d0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(D.dx * 6, D.dy * 6 + 2); ctx.lineTo(D.dx * 22, D.dy * 20 + 2); ctx.stroke();
      ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(D.dx * 7 - D.dy * 4, D.dy * 7 + 2 - D.dx * 4); ctx.lineTo(D.dx * 7 + D.dy * 4, D.dy * 7 + 2 + D.dx * 4); ctx.stroke();

    ctx.restore();
  }
  function drawMob(m) {
    const x = sx(m.x), y = sy(m.y), K = m.kind;
    if (K === "mage" && !m.vis) {
      if (m.hint) { ctx.strokeStyle = `rgba(200,140,255,${0.5 + 0.4 * Math.sin(clock * 20)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.stroke(); }
      return;
    }
    ctx.save(); ctx.translate(x, y);
    if (m.hit > 0) ctx.translate(rnd(-1.5, 1.5), rnd(-1.5, 1.5));
    if (K === "slime" || K === "blue") {
      const s = 1 + Math.sin(clock * 6 + m.id * 10) * 0.12;
      ctx.fillStyle = K === "blue" ? "#3a8aff" : "#4ad84a"; ctx.beginPath(); ctx.ellipse(0, 4, 10 * s, 8 / s, 0, Math.PI, 0); ctx.lineTo(10 * s, 8); ctx.lineTo(-10 * s, 8); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(-5, -1, 3, 4); ctx.fillRect(2, -1, 3, 4); ctx.fillStyle = "#000"; ctx.fillRect(-4, 1, 2, 2); ctx.fillRect(3, 1, 2, 2);
    } else if (K === "knight" || K === "red") {
      ctx.fillStyle = K === "red" ? "#a82a2a" : "#3a3a4a"; ctx.beginPath(); ctx.ellipse(0, 3, 8, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = K === "red" ? "#c83a3a" : "#5a5a6a"; ctx.beginPath(); ctx.arc(0, -7, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff3a3a"; ctx.fillRect(-4, -8, 8, 2);
      const D = DIRS[m.face]; ctx.strokeStyle = "#a8a8b8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(D.dx * 6 + 6, D.dy * 6); ctx.lineTo(D.dx * 18 + 6, D.dy * 18 - 4); ctx.stroke();
    } else if (K === "mage") {
      const a = Math.min(1, (2.4 - m.wait) * 4, m.wait * 4);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = "#7a3ad8"; ctx.beginPath(); ctx.moveTo(-9, 11); ctx.lineTo(0, -6); ctx.lineTo(9, 11); ctx.fill();
      ctx.fillStyle = "#ffd0a8"; ctx.beginPath(); ctx.arc(0, -6, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#5a2aa8"; ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(0, -20); ctx.lineTo(7, -8); ctx.fill();
      if (!m.cast) { ctx.fillStyle = `rgba(255,120,255,${0.5 + 0.5 * Math.sin(clock * 30)})`; ctx.beginPath(); ctx.arc(0, -24, 3, 0, TAU); ctx.fill(); }
    } else if (K === "ghost") {
      ctx.globalAlpha = m.vis ? 0.85 : 0.15;
      ctx.fillStyle = "#d8e8ff"; ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.lineTo(9, 10); for (let i = 0; i < 4; i++) ctx.lineTo(9 - (i + 0.5) * 4.5, 6 + (i % 2) * 4); ctx.lineTo(-9, 10); ctx.fill();
      ctx.fillStyle = "#1a1a3a"; ctx.fillRect(-5, -4, 3, 4); ctx.fillRect(2, -4, 3, 4);
    } else if (K === "wisp") {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 10); g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#5affd8"); g.addColorStop(1, "rgba(90,255,216,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 10 + Math.sin(clock * 15) * 2, 0, TAU); ctx.fill();
    } else if (K === "demon") {
      ctx.scale(1.6, 1.6);
      ctx.fillStyle = "#6a1a8a"; ctx.beginPath(); ctx.ellipse(0, 3, 10, 10, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#8a2aaa"; ctx.beginPath(); ctx.arc(0, -7, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e8d8a8"; ctx.beginPath(); ctx.moveTo(-7, -11); ctx.lineTo(-12, -19); ctx.lineTo(-4, -13); ctx.fill(); ctx.beginPath(); ctx.moveTo(7, -11); ctx.lineTo(12, -19); ctx.lineTo(4, -13); ctx.fill();
      ctx.fillStyle = "#ffd23a"; ctx.fillRect(-5, -9, 3, 3); ctx.fillRect(2, -9, 3, 3);
      ctx.fillStyle = "#4a0a5a"; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-18, -6 + Math.sin(clock * 8) * 3); ctx.lineTo(-10, 6); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, -6 + Math.sin(clock * 8) * 3); ctx.lineTo(10, 6); ctx.fill();

    ctx.fillStyle = "#d8d0b8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 76, 9);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 9px system-ui"; ctx.fillText(`PIANO ${floor} · ♥ ${lives}`, x0 + 76, 20);

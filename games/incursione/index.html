<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Incursione</title>
<style>
  :root {
    --bg: #03040c;
    --fg: #eef4ff;
    --muted: #9aa8c8;
    --accent: #ff4f6a;
    --fuel: #7dff5a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(125, 255, 90, 0.25), 0 0 24px rgba(125, 255, 90, 0.08); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(238, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch .fire { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  #touch button {
    width: 52px; height: 52px; border-radius: 12px; touch-action: none;
    font: 700 20px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(238, 244, 255, 0.5); background: rgba(238, 244, 255, 0.08);
  }
  #touch button[data-a="fire"] { width: 78px; height: 78px; border-radius: 50%; border-color: rgba(255, 79, 106, 0.9); background: rgba(255, 79, 106, 0.14); font: 700 12px ui-monospace, monospace; }
  #touch button[data-a="bomb"] { width: 66px; height: 66px; border-radius: 50%; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.12); font: 700 11px ui-monospace, monospace; }
  #touch.small .pad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
  #touch.small button { width: 42px; height: 42px; font-size: 16px; }
  #touch.small button[data-a="fire"] { width: 62px; height: 62px; }
  #touch.small button[data-a="bomb"] { width: 54px; height: 54px; }
  #touch button.on { background: rgba(238, 244, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(3, 4, 12, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(36px, 10vw, 64px); letter-spacing: 6px; font-weight: 400; color: var(--fuel); text-shadow: 0 0 14px rgba(125,255,90,0.7), 3px 3px 0 #1a4a2a; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 400; letter-spacing: 3px; }
  #overlay h2.lose { color: var(--accent); }
  #overlay h2.win { color: var(--gold); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.6; font-family: system-ui, sans-serif; }
  #overlay p.muted { color: var(--muted); }
  #overlay .stages { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: var(--muted); }
  #overlay .stages span { border: 1px solid rgba(238,244,255,0.25); padding: 3px 8px; border-radius: 4px; }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 20px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); font-weight: 400; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(238,244,255,0.35); border-radius: 4px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--fuel); color: #000; background: var(--fuel); padding: 10px 28px; box-shadow: 0 0 16px rgba(125,255,90,0.5); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts, #overlay .stages { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Su">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
    <button type="button" data-a="down" aria-label="Giù">▼</button>
  </div>
  <div class="fire">
    <button type="button" data-a="bomb" aria-label="Bomba">BOMBA</button>
    <button type="button" data-a="fire" aria-label="Fuoco">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 400, HUD = 26, COL = 16;
  const SHIP_SPEED = 170, LASER_SPEED = 560;
  // the six sectors of a mission
  const STAGES = [
    { name: "MONTAGNE", cols: 150, cave: false, launch: 0.45, ground: ["#c86a2a", "#7a3a14"], edge: "#ffb03a" },
    { name: "DISCHI VOLANTI", cols: 130, cave: false, launch: 0, ufos: true, ground: ["#3a8a4a", "#1a4a2a"], edge: "#7dff5a" },
    { name: "PIOGGIA DI METEORE", cols: 130, cave: false, launch: 0, meteors: true, ground: ["#6a5aa8", "#2a2458"], edge: "#b98cff" },
    { name: "CAVERNA", cols: 150, cave: true, gap: [150, 128], launch: 0.6, ground: ["#3a7ab8", "#1a3a6a"], edge: "#3de0ff" },
    { name: "LABIRINTO", cols: 140, cave: true, gap: [118, 100], launch: 0.2, maze: true, ground: ["#a83a6a", "#5a1a3a"], edge: "#ff5ad8" },
    { name: "BASE NEMICA", cols: 110, cave: true, gap: [146, 132], launch: 0.3, base: true, ground: ["#8a8a9a", "#3a3a4a"], edge: "#eef4ff" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · il carburante dura di più · meno missili", lives: 5, fuel: 0.034, speed: 62, launch: 0.7 },
    normale:   { label: "NORMALE",   color: "#7dff5a", desc: "3 vite · l'esperienza classica", lives: 3, fuel: 0.048, speed: 72, launch: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · più veloce · il carburante finisce in fretta", lives: 3, fuel: 0.058, speed: 84, launch: 1.25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "incursione-difficulty";
  const bestKey = (id) => `incursione-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(180px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 180;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  function engineOn(on) {
    if (!audioCtx) return;
    if (!engine) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      o.type = "sawtooth"; o.frequency.value = 55; f.type = "lowpass"; f.frequency.value = 300; g.gain.value = 0;
      o.connect(f).connect(g).connect(audioCtx.destination); o.start();
      engine = g;
    }
    engine.gain.setTargetAtTime(on ? 0.035 : 0, audioCtx.currentTime, 0.1);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    laser: lim(() => beep(1400, 0.06, "square", 0.02, -900)),
    bomb: lim(() => beep(900, 0.4, "sine", 0.03, -700)),
    boom: lim((big) => noise(big ? 0.6 : 0.3, big ? 0.4 : 0.25, big ? 600 : 1200)),
    launch: lim(() => noise(0.5, 0.15, 3000)),
    fuel: () => arp([659, 880, 1175], 0.05, 0.08, "triangle", 0.05),
    low: () => { beep(440, 0.1, "square", 0.04); beep(440, 0.1, "square", 0.04, 0, 0.15); },
    die: () => { noise(1.2, 0.45, 700); beep(300, 1, "sawtooth", 0.05, -260); },
    stage: () => arp([392, 523, 659, 784], 0.08, 0.12),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.1, 0.16),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, loop = 0, bestCache = 0, nextLife = 10000, fuel = 1, lowWarn = false;
  let ground = [], ceil = [], stageStart = [], objects = [], scroll = 0, ship = null, lasers = [], bombs = [], foes = [], parts = [], popups = [], stars = [];
  let stageI = 0, checkpoint = 0, fireCd = 0, spawnT = 0, message = null, baseHit = false;
  const ctl = { up: false, down: false, left: false, right: false, fire: false, bomb: false };
  let bombPressed = false;

  const speed = () => diff.speed * (1 + loop * 0.12);
  function makeRng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- The landscape of a whole mission ----------
  function buildMission() {
    const r = makeRng(1234 + loop * 97);
    ground = []; ceil = []; stageStart = []; objects = [];
    let h = H - 70;
    STAGES.forEach((S, si) => {
      stageStart.push(ground.length);
      const n = S.cols;
      let target = h, flatLeft = 12;
      for (let i = 0; i < n; i++) {
        const col = ground.length;
        const lead = i < 14; // a quiet stretch at the start of every sector
        if (!lead && flatLeft <= 0 && Math.abs(target - h) < 1) {
          const lo = S.cave ? H - 150 : H - 190, hi = H - 34;
          target = Math.round(clamp(h + rnd(-1, 1) * (S.maze ? 90 : 70) + 0 * r(), lo, hi) / 4) * 4;
          if (Math.random() < 0.5) target = Math.round(clamp(h + (r() - 0.5) * (S.maze ? 150 : 120), lo, hi) / 4) * 4;
          flatLeft = 3 + Math.floor(r() * 5);
        }
        if (Math.abs(target - h) >= 1) h += clamp(target - h, -22, 22);
        else flatLeft--;
        ground.push(h);
        // ceiling: follows the ground in the caves
        if (S.cave) {
          const t = i / n, gap = S.gap[0] + (S.gap[1] - S.gap[0]) * t;
          const wob = S.maze ? Math.sin(col * 0.35) * 16 + (r() < 0.12 ? -18 : 0) : Math.sin(col * 0.2) * 8;
          ceil.push(Math.max(HUD + 18, Math.min(h - gap + wob, h - 90)));
        } else ceil.push(0);
        // targets on flat ground
        if (!lead && i < n - 6 && Math.abs(target - h) < 1 && flatLeft === 2) {
          const roll = r();
          const x = col * COL + COL / 2;
          if (S.base && i > n - 30 && !objects.some((o) => o.type === "base")) objects.push({ type: "base", wx: x, stage: si, hp: 1 });
          else if (roll < 0.34) objects.push({ type: "fuel", wx: x, stage: si });
          else if (roll < 0.8) objects.push({ type: "rocket", wx: x, stage: si, launcher: r() < S.launch * diff.launch, flying: false, vy: 0, dy: 0 });
          else objects.push({ type: "mystery", wx: x, stage: si });
        }
      }
    });
    // make sure the final sector has its base
    if (!objects.some((o) => o.type === "base")) {
      const col = ground.length - 20;
      for (let k = -2; k <= 2; k++) ground[col + k] = ground[col];
      objects.push({ type: "base", wx: col * COL + COL / 2, stage: 5, hp: 1 });
    }
    stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: HUD + Math.random() * (H - HUD), s: Math.random() < 0.2 ? 2 : 1, v: 0.2 + Math.random() * 0.5 }));
  }
  const heightAt = (arr, wx) => {
    const f = wx / COL - 0.5, i = Math.floor(f), t = f - i;
    const a = arr[clamp(i, 0, arr.length - 1)], b = arr[clamp(i + 1, 0, arr.length - 1)];
    return a + (b - a) * t;
  };
  const groundAt = (wx) => heightAt(ground, wx);
  // where a cave begins or ends there is no slope: the rock face is vertical
  const ceilAt = (wx) => {
    const f = wx / COL - 0.5, i = Math.floor(f);
    const a = ceil[clamp(i, 0, ceil.length - 1)], b = ceil[clamp(i + 1, 0, ceil.length - 1)];
    if (!a || !b) return f - i < 0.5 ? a : b;
    return heightAt(ceil, wx);
  };
  const objY = (o) => groundAt(o.wx);
  function stageAt(wx) { const c = wx / COL; let s = 0; for (let i = 0; i < stageStart.length; i++) if (c >= stageStart[i]) s = i; return s; }

  function startFrom(col) {
    scroll = col * COL;
    // start in the open space: halfway up a cave, or well above the ground
    let gMin = 1e9, cMax = 0;
    for (let dx = 60; dx <= 200; dx += 8) { gMin = Math.min(gMin, groundAt(scroll + dx)); cMax = Math.max(cMax, ceilAt(scroll + dx)); }
    const sy = cMax > 0 ? (gMin + cMax) / 2 : Math.min(gMin - 70, H / 2);
    ship = { x: 110, y: sy, dead: false, deadT: 0, tilt: 0 };
    lasers = []; bombs = []; foes = []; fuel = 1; lowWarn = false; fireCd = 0; spawnT = 1;
    // targets of the sector come back, still standing
    for (const o of objects) if (o.wx > scroll) { o.dead = false; o.flying = false; o.dy = 0; o.vy = 0; }
    stageI = stageAt(scroll + 110);
    baseHit = false;
    message = { text: `SETTORE ${stageI + 1} · ${STAGES[stageI].name}`, t: 0 };
    state = "intro"; stateT = 1.4;
    sfx.stage();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "win"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; loop = 0; nextLife = 10000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildMission();
    checkpoint = 0;
    startFrom(0);
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#eef4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 20000; lives++; sfx.life(); popups.push({ x: W / 2, y: 80, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 140) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.4 + Math.random() * 0.5, c: color });
    }
  }
  function die() {
    if (state !== "play" || ship.dead) return;
    ship.dead = true; lives--;
    engineOn(false);
    sfx.die();
    burst(ship.x, ship.y, "#ffb03a", 30, 200); burst(ship.x, ship.y, "#ffffff", 14, 120);
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(false); return; }
    startFrom(stageStart[stageAt(scroll + 110)]);
  }
  function missionComplete() {
    const bonus = 2000 + loop * 1000;
    addScore(bonus);
    message = { text: "MISSIONE COMPIUTA!", sub: `Base distrutta · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    sfx.win();
    state = "win"; stateT = 3.2;
  }
  function gameOver() {
    state = "over";
    engineOn(false);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, where = `Missione ${loop + 1}, settore ${stageI + 1}`;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${where} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; engineOn(false);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;

    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop_);
  }
  syncControls();
  buildMission(); scroll = 200; ship = { x: 110, y: 200, dead: false, tilt: 0 };
  showTitle();
  requestAnimationFrame(loop_);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saltacubi</title>
<style>
  :root {
    --bg: #0a0614;
    --fg: #fff4e8;
    --muted: #b8a8d0;
    --accent: #ff8a1f;
    --bad: #ff4f6a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #241a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 232, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: grid; grid-template-columns: 70px; gap: 10px; pointer-events: auto; }
  #touch button {
    width: 70px; height: 70px; border-radius: 18px; touch-action: none;
    font: 700 28px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(255, 138, 31, 0.7); background: rgba(255, 138, 31, 0.1);
  }
  #touch.small .cl { grid-template-columns: 56px; }
  #touch.small button { width: 56px; height: 56px; font-size: 22px; }
  #touch button.on { background: rgba(255, 138, 31, 0.45); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 6, 20, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(38px, 10vw, 64px); font-weight: 900; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 #3a1a6a, 6px 6px 0 #1dd6c0; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,232,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--accent); color: #1a0a00; background: var(--accent); padding: 11px 30px; box-shadow: 0 4px 0 #8a3a00; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-d="UL" aria-label="Su a sinistra">↖</button>
    <button type="button" data-d="DL" aria-label="Giù a sinistra">↙</button>
  </div>
  <div class="cl">
    <button type="button" data-d="UR" aria-label="Su a destra">↗</button>
    <button type="button" data-d="DR" aria-label="Giù a destra">↘</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 560, ROWS = 7;
  const X0 = 240, Y0 = 118, HW = 32, HH = 16, SIDE = 32; // cube geometry
  const HOP = 0.3;
  const DIRS = { UL: [-1, -1], UR: [-1, 0], DL: [1, 0], DR: [1, 1] };
  // a colour scheme per round: start, middle, target, left face, right face, background
  const SCHEMES = [
    { c: ["#3d7bff", "#ff5a8a", "#ffd34d"], l: "#d8b070", r: "#6a4a2a", bg: "#0a0614" },
    { c: ["#ffd34d", "#ff8a1f", "#3dd6c0"], l: "#5a8ad8", r: "#2a3a6a", bg: "#06101a" },
    { c: ["#8a8aa0", "#3dd6ff", "#ff5a8a"], l: "#d0d0e0", r: "#5a5a70", bg: "#120614" },
    { c: ["#1dd6c0", "#ffd34d", "#b98cff"], l: "#e0a040", r: "#7a4a10", bg: "#0a0a06" },
  ];
  // level rules: how many hops a cube needs, and whether hopping on a finished cube undoes it
  const LEVELS = [
    { steps: 1, revert: false, text: "Salta su ogni cubo una volta" },
    { steps: 2, revert: false, text: "Ogni cubo va saltato due volte" },
    { steps: 1, revert: true, text: "Attento: risaltare su un cubo finito lo fa tornare indietro!" },
    { steps: 2, revert: true, text: "Due salti per cubo, e risaltarci lo fa tornare indietro!" },
  ];
  const ROUNDS = 4;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici lenti e meno numerosi", lives: 5, speed: 0.8, spawn: 1.35 },
    normale:   { label: "NORMALE",   color: "#ff8a1f", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, spawn: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · nemici veloci e numerosi", lives: 3, speed: 1.2, spawn: 0.75 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "saltacubi-difficulty";
  const bestKey = (id) => `saltacubi-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const onPyramid = (r, c) => r >= 0 && r < ROWS && c >= 0 && c <= r;
  const pos = (r, c) => ({ x: X0 + (c - r / 2) * HW * 2, y: Y0 + r * (HH * 2 + SIDE / 2) });

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 24;
      if (window.innerWidth - 2 * side > 260) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    hop: lim(() => beep(420, 0.08, "square", 0.03, 380)),
    paint: lim((k) => beep(660 + k * 180, 0.07, "triangle", 0.04)),
    ball: lim(() => beep(180, 0.05, "square", 0.02, -60)),
    coily: lim(() => beep(120, 0.07, "sawtooth", 0.025, 60)),
    curse: () => { for (let i = 0; i < 8; i++) beep(200 + Math.random() * 600, 0.06, "square", 0.04, 0, i * 0.06); },
    fall: () => beep(900, 1.1, "sine", 0.05, -820),
    disc: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.12, 0.14, "triangle", 0.04),
    coilyFall: () => { beep(700, 1, "sawtooth", 0.035, -620); arp([784, 988, 1175], 0.1, 0.1, "square", 0.04, 1); },
    freeze: () => arp([1568, 1319, 1047, 784], 0.07, 0.12, "sine", 0.05),
    catch: () => arp([988, 1319], 0.08, 0.1),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, round = 0, bestCache = 0, nextLife = 8000;
  let cubes = [], hero = null, foes = [], discs = [], popups = [], spawnT = 2, freezeT = 0, queued = null, deathKind = "", curse = 0;

  const scheme = () => SCHEMES[round % SCHEMES.length];
  // colour of a cube top: with one hop per cube there is no middle colour
  const cubeColor = (v) => (rule().steps === 1 ? scheme().c[v ? 2 : 0] : scheme().c[v]);
  const rule = () => LEVELS[level % LEVELS.length];
  const speedMul = () => diff.speed * (1 + 0.05 * round + 0.08 * Math.floor(level / LEVELS.length) + 0.04 * (level % LEVELS.length));

  // an actor hopping from cube to cube; off the pyramid it falls
  function actor(type, r, c) { return { type, r, c, fr: r, fc: c, t: 1, dir: "DR", falling: false, fy: 0, fvy: 0, fx: 0, wait: 0, drop: 0, done: false }; }
  function hopTo(a, dr, dc, dur) {
    a.fr = a.r; a.fc = a.c; a.r += dr; a.c += dc; a.t = 0; a.dur = dur;
  }
  function actorXY(a) {
    const A = pos(a.fr, a.fc), B = pos(a.r, a.c);
    const t = Math.min(1, a.t);
    let x = A.x + (B.x - A.x) * t, y = A.y + (B.y - A.y) * t;
    if (a.drop > 0) return { x: B.x, y: B.y - a.drop };
    // arc: rise first, then land
    y -= Math.sin(Math.PI * t) * 26;
    if (a.falling) { x += a.fx; y += a.fy; }
    return { x, y };
  }

  function buildRound() {
    cubes = Array.from({ length: ROWS }, (_, r) => Array(r + 1).fill(0));
    // two flying discs on opposite sides, on different rows
    const r1 = 2 + Math.floor(Math.random() * 3);
    let r2 = 2 + Math.floor(Math.random() * 3);
    if (r2 === r1) r2 = r1 === 4 ? 2 : r1 + 1;
    discs = [{ r: r1, c: -1, used: false }, { r: r2, c: r2 + 1, used: false }];
    hero = actor("hero", 0, 0);
    foes = []; popups = []; queued = null; freezeT = 0;
    spawnT = 2.2 * diff.spawn;
    state = "intro"; stateT = 2.2;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear", "disc"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; round = 0; nextLife = 8000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff4e8") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 14000; lives++; sfx.life(); popups.push({ x: W / 2, y: 90, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function roundCleared() {
    const bonus = 1000 + 250 * (level * ROUNDS + round);
    const discBonus = discs.filter((d) => !d.used).length * 50;
    addScore(bonus + discBonus);
    popups.push({ x: W / 2, y: 470, text: `BONUS ${(bonus + discBonus).toLocaleString("it-IT")}`, color: "#ffd34d", t: 0, big: true });
    sfx.clear();
    state = "clear"; stateT = 2.4;
  }
  function nextRound() {
    round++;
    if (round >= ROUNDS) { round = 0; level++; }
    buildRound();
  }
  function killHero(kind) {
    if (state !== "play") return;
    lives--;
    deathKind = kind;
    if (kind === "fall") sfx.fall(); else sfx.curse();
    curse = 1.6;
    state = "dead"; stateT = kind === "fall" ? 1.8 : 1.6;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the pyramid is cleared of enemies; after a fall the hero starts again from the top
    foes = [];
    if (deathKind === "fall" || !onPyramid(hero.r, hero.c)) hero = actor("hero", 0, 0);
    hero.t = 1; hero.fr = hero.r; hero.fc = hero.c;
    spawnT = 1.8 * diff.spawn; freezeT = 0; queued = null;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1, rd = round + 1;
    menu = () => showOverlay(
      `<h2 class="lose">PARTITA FINITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv}, giro ${rd} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(60px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SALTACUBI</h1>
       <p>Salta di cubo in cubo lungo la piramide e cambia il colore di tutte le facce superiori per passare al giro successivo. Non saltare giù dal bordo! Schiva le palle rosse e Coily, il serpente: sali su un disco volante e Coily ti seguirà giù nel vuoto.</p>
       <div class="pts">
         <span><b>Cubo colorato</b></span><span>25 punti</span>
         <span><b>Coily nel vuoto</b></span><span>500 punti</span>
         <span><b>Palla verde</b></span><span>ferma tutti i nemici · 100</span>
         <span><b>Sam</b></span><span>rimette i colori · prendilo: 300</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Usa i quattro tasti in diagonale, oppure tocca lo schermo dalla parte dove vuoi saltare</p>`
         : `<p class="muted help">Frecce: ↑ su a destra · → giù a destra · ↓ giù a sinistra · ← su a sinistra<br>oppure Q E Z C, o il tastierino 7 9 1 3 · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  // the classic diagonal layout: the arrows are turned 45°
  const KEYS = { arrowup: "UR", arrowright: "DR", arrowdown: "DL", arrowleft: "UL", q: "UL", e: "UR", z: "DL", c: "DR", "7": "UL", "9": "UR", "1": "DL", "3": "DR", w: "UR", d: "DR", s: "DL", a: "UL" };
  function press(dir) {
    if (state !== "play" && state !== "intro") return;
    queued = dir;
  }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k) && e.location !== 3) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const d = KEYS[k];
    if (d && !e.repeat) press(d);
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.classList.add("on"); press(btn.dataset.d); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, () => btn.classList.remove("on"));
  }
  // tapping the screen: jump towards that side of the hero
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); }
    if (!hero || !isPlaying()) return;
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const p = actorXY(hero);
    press((y < p.y - 6 ? "U" : "D") + (x < p.x ? "L" : "R"));
  });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function paint(r, c) {
    const rl = rule(), v = cubes[r][c], target = rl.steps;
    if (v < target) {
      cubes[r][c] = v + 1;
      const p = pos(r, c);
      addScore(rl.steps === 2 && v === 0 ? 15 : 25, p.x, p.y - 30, scheme().c[2]);
      sfx.paint(v);
    } else if (rl.revert) {
      cubes[r][c] = target - 1;
      sfx.paint(-1);
    }
    if (cubes.every((row) => row.every((x) => x >= target))) roundCleared();
  }
  function heroLanded() {
    const h = hero;
    if (onPyramid(h.r, h.c)) { paint(h.r, h.c); return; }
    // off the edge: a disc, or a long fall
    const d = discs.find((q) => !q.used && q.r === h.r && q.c === h.c);
    if (d) {
      d.used = true; d.rider = true; d.t = 0;
      h.onDisc = d;
      sfx.disc();
      state = "disc"; stateT = 2;
      return;
    }
    h.falling = true; h.fvy = -60; h.fy = 0; h.fx = 0;
    killHero("fall");
  }
  function spawnFoe() {
    const coilyAround = foes.some((f) => f.type === "purple" || f.type === "coily");
    const roll = Math.random();
    let type = "red";
    if (!coilyAround && roll < 0.3) type = "purple";
    else if (roll > 0.9) type = "green";
    else if (roll > 0.78 && (rule().steps === 2 || rule().revert)) type = "sam";
    const a = actor(type, 1, Math.random() < 0.5 ? 0 : 1);
    a.fr = a.r; a.fc = a.c; a.t = 1; a.drop = 220; a.wait = 0.35;
    foes.push(a);
  }
  function foeStep(f) {
    const hopDur = (f.type === "coily" ? 0.34 : 0.3) / speedMul();
    if (f.type === "coily") {
      // head for the hero (or for the spot where the hero jumped off onto a disc)
      const target = hero.onDisc ? { r: hero.onDisc.r, c: hero.onDisc.c } : { r: hero.r, c: hero.c };
      const tp = pos(target.r, target.c);
      let best = null, bd = 1e9;
      for (const k of Object.keys(DIRS)) {
        const [dr, dc] = DIRS[k], nr = f.r + dr, nc = f.c + dc;
        const toTarget = nr === target.r && nc === target.c;
        if (!onPyramid(nr, nc) && !toTarget) continue;
        const p = pos(nr, nc), d = Math.hypot(p.x - tp.x, p.y - tp.y);
        if (d < bd) { bd = d; best = k; }
      }
      if (!best) return;
      f.dir = best; hopTo(f, ...DIRS[best], hopDur);
      sfx.coily();
      return;
    }
    // balls, and Sam, bounce down at random and drop off the bottom
    const k = Math.random() < 0.5 ? "DL" : "DR";
    f.dir = k; hopTo(f, ...DIRS[k], hopDur);
    if (f.type !== "sam") sfx.ball();
  }
  function foeLanded(f) {
    if (!onPyramid(f.r, f.c)) {
      f.falling = true; f.fvy = -40; f.fy = 0; f.fx = 0;
      if (f.type === "coily") {
        const p = actorXY(f);
        addScore(500, p.x, p.y - 30, "#b98cff");
        sfx.coilyFall();
      }
      return;
    }
    if (f.type === "sam") {
      const rl = rule();
      if (cubes[f.r][f.c] > 0) cubes[f.r][f.c] = Math.max(0, cubes[f.r][f.c] - 1);
      if (rl.steps === 1 && !rl.revert) cubes[f.r][f.c] = 0;
    }
    if (f.type === "purple" && f.r === ROWS - 1) { f.type = "coily"; f.wait = 0.5; }
    f.wait = Math.max(f.wait, f.type === "coily" ? 0.22 / speedMul() : 0.28 / speedMul());
  }
  function updateActorFall(a, dt) {
    a.fvy += 900 * dt; a.fy += a.fvy * dt;
    a.fx += (a.c < 0 || (a.r >= 0 && a.c < a.r / 2) ? -30 : 30) * dt;
  }
  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of popups) { q.t += dt; q.y -= 24 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.8 : 0.9));
    curse = Math.max(0, curse - dt);
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) nextRound(); return; }
    if (state === "dead") {
      stateT -= dt;
      if (hero.falling) updateActorFall(hero, dt);
      if (stateT <= 0) afterDeath();
      return;
    }
    if (state === "disc") {
      // the disc carries the hero to the top; everything else keeps moving
      stateT -= dt;
      hero.onDisc.t = Math.min(1, (2 - stateT) / 1.6);
      if (stateT <= 0) {
        hero.onDisc.rider = false;
        hero = actor("hero", 0, 0); hero.t = 1;
        state = "play";
        queued = null;
      }
    }

    // hero hop
    const h = hero;
    if (state === "play") {
      if (h.t < 1) {
        h.t += dt / HOP;
        if (h.t >= 1) { h.t = 1; heroLanded(); }
      } else if (queued) {
        const [dr, dc] = DIRS[queued];
        h.dir = queued; hopTo(h, dr, dc, HOP);
        queued = null;
        sfx.hop();
      }
    }
    if (state === "clear" || state === "dead") return;

    // enemies
    freezeT = Math.max(0, freezeT - dt);
    if (freezeT <= 0) {
      spawnT -= dt;
      const maxFoes = 2 + Math.min(4, Math.floor((level * ROUNDS + round) / 3));
      if (spawnT <= 0) { spawnT = rnd(2.2, 3.6) * diff.spawn / Math.min(1.6, 1 + 0.05 * (level * ROUNDS + round)); if (foes.filter((f) => !f.falling).length < maxFoes) spawnFoe(); }
      for (const f of foes) {
        if (f.falling) { updateActorFall(f, dt); if (f.fy > 700) f.done = true; continue; }
        if (f.drop > 0) { f.drop = Math.max(0, f.drop - 700 * dt); continue; }
        if (f.t < 1) {
          f.t += dt / f.dur;
          if (f.t >= 1) { f.t = 1; foeLanded(f); }
          continue;
        }
        f.wait -= dt;
        if (f.wait <= 0) foeStep(f);
      }
      foes = foes.filter((f) => !f.done);
    }

    // touching anything?
    if (state !== "play" || h.falling) return;
    const hp = actorXY(h);
    for (const f of foes) {
      if (f.falling || f.drop > 20) continue;
      const fp = actorXY(f);
      if (Math.hypot(fp.x - hp.x, fp.y - hp.y) > 20) continue;
      if (f.type === "green") {
        f.done = true; freezeT = 4; addScore(100, fp.x, fp.y - 26, "#7dff5a"); sfx.freeze();
      } else if (f.type === "sam") {
        f.done = true; addScore(300, fp.x, fp.y - 26, "#7dff5a"); sfx.catch();
      } else if (freezeT <= 0) {
        killHero("hit"); return;
      }
    }
    foes = foes.filter((f) => !f.done);
  }

  // ---------- Drawing ----------
  function drawCube(r, c) {
    const p = pos(r, c), S = scheme(), v = cubes[r][c];
    let top = cubeColor(v);
    if (state === "clear" && Math.floor(clock * 10) % 2) top = ["#ffffff", S.c[2]][Math.floor(clock * 5) % 2];
    ctx.fillStyle = S.l;
    ctx.beginPath(); ctx.moveTo(p.x - HW, p.y); ctx.lineTo(p.x, p.y + HH); ctx.lineTo(p.x, p.y + HH + SIDE); ctx.lineTo(p.x - HW, p.y + SIDE); ctx.closePath(); ctx.fill();
    ctx.fillStyle = S.r;
    ctx.beginPath(); ctx.moveTo(p.x + HW, p.y); ctx.lineTo(p.x, p.y + HH); ctx.lineTo(p.x, p.y + HH + SIDE); ctx.lineTo(p.x + HW, p.y + SIDE); ctx.closePath(); ctx.fill();
    ctx.fillStyle = top;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - HH); ctx.lineTo(p.x + HW, p.y); ctx.lineTo(p.x, p.y + HH); ctx.lineTo(p.x - HW, p.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1; ctx.stroke();
  }
  function drawDisc(d) {
    let p = pos(d.r, d.c);
    if (d.rider) {
      const top = pos(0, 0), t = d.t;
      p = { x: p.x + (top.x - p.x) * t, y: p.y + (top.y - 60 - p.y) * t };
    } else if (d.used) return;
    const spin = clock * 8;
    ctx.save(); ctx.translate(p.x, p.y + 6);
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = ["#ff4f6a", "#ffd34d", "#3dd6c0", "#b98cff"][(k + Math.floor(spin)) % 4];
      ctx.beginPath(); ctx.ellipse(0, 0, 20 - k * 4, 7 - k * 1.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    if (d.rider) { hero.discXY = { x: p.x, y: p.y - 4 }; }
  }
  function drawHero() {
    const h = hero;
    let p = h.onDisc && h.onDisc.rider ? h.discXY || actorXY(h) : actorXY(h);
    if (!p) return;
    const up = h.dir[0] === "U", left = h.dir[1] === "L";
    const sx = left ? -1 : 1;
    const y = p.y - 14;
    ctx.save(); ctx.translate(p.x, y);
    // feet
    ctx.fillStyle = "#c83a1a";
    ctx.beginPath(); ctx.ellipse(-6, 13, 6, 3.5, 0, 0, Math.PI * 2); ctx.ellipse(6, 13, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff8a1f"; ctx.fillRect(-5, 6, 3, 7); ctx.fillRect(2, 6, 3, 7);
    // round body
    const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, 13);
    g.addColorStop(0, "#ffc070"); g.addColorStop(1, "#e86a10");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    // snout, pointing where it jumps
    ctx.fillStyle = "#ff8a1f";
    ctx.save(); ctx.scale(sx, 1);
    ctx.beginPath(); ctx.ellipse(10, up ? -4 : 4, 8, 5, up ? -0.4 : 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a1a00"; ctx.beginPath(); ctx.ellipse(17, up ? -7 : 7, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    // eye
    if (!up) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(3, -5, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(4.5, -4, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    ctx.restore();
    if (curse > 0 && deathKind === "hit") {
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      const bx = p.x + 18, by = y - 46;
      ctx.beginPath(); ctx.ellipse(bx + 22, by, 38, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx - 2, by + 10); ctx.lineTo(p.x + 4, y - 14); ctx.lineTo(bx + 10, by + 14); ctx.fill();
      ctx.fillStyle = "#000"; ctx.font = "900 14px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("@!#?@!", bx + 22, by + 5);
    }
  }
  function drawFoe(f) {
    const p = actorXY(f);
    const frozen = freezeT > 0 && Math.floor(clock * 8) % 2;
    const y = p.y - 10;
    if (f.type === "red" || f.type === "purple" || f.type === "green") {
      const col = f.type === "red" ? "#ff3d4a" : f.type === "purple" ? "#a24aff" : "#3ddc5a";
      const r = f.type === "purple" ? 11 : 9;
      const squash = f.t >= 1 && !f.falling && f.drop <= 0 ? 0.85 : 1;
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, r, 4, 0, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(p.x - 3, y - 4, 1, p.x, y, r);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.3, frozen ? "#bff4ff" : col); g.addColorStop(1, "#1a0a20");
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(p.x, y + (1 - squash) * r, r, r * squash, 0, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "coily") {
      const left = f.dir[1] === "L", up = f.dir[0] === "U";
      ctx.fillStyle = frozen ? "#bff4ff" : "#8a2ad8";
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(p.x + (k % 2 ? 3 : -3), p.y - 4 - k * 7, 9 - k, 5, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = frozen ? "#e0f8ff" : "#b05aff";
      const hx = p.x + (left ? -4 : 4), hy = p.y - 36;
      ctx.beginPath(); ctx.ellipse(hx, hy, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(hx + (left ? -3 : 3), hy - 2, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff3d4a"; ctx.beginPath(); ctx.arc(hx + (left ? -4 : 4), hy - 1.5, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ff3d4a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hx + (left ? -8 : 8), hy + (up ? -2 : 3)); ctx.lineTo(hx + (left ? -13 : 13), hy + (up ? -4 : 5)); ctx.stroke();
    } else if (f.type === "sam") {
      ctx.fillStyle = frozen ? "#bff4ff" : "#3ddc5a";
      ctx.beginPath(); ctx.arc(p.x, y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111"; ctx.fillRect(p.x - 8, y - 4, 16, 5);
      ctx.fillStyle = "#1a8a3a"; ctx.fillRect(p.x - 6, y + 8, 4, 5); ctx.fillRect(p.x + 2, y + 8, 4, 5);
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const S = scheme();
    ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
    // starry backdrop
    for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.2 * Math.sin(clock + i)})`; ctx.fillRect((i * 97) % W, (i * 61) % H, 1.5, 1.5); }
    if (cubes.length) {
      // actors behind the pyramid (falling off the far side) first
      const fallingBehind = (a) => a.falling && a.r < ROWS;
      for (const f of foes) if (fallingBehind(f) && f.fy > 30) drawFoe(f);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c <= r; c++) drawCube(r, c);
      for (const d of discs) drawDisc(d);
      const actors = [...foes.filter((f) => !(fallingBehind(f) && f.fy > 30)), hero].filter(Boolean);
      actors.sort((a, b) => actorXY(a).y - actorXY(b).y);
      for (const a of actors) { if (a === hero) { if (state !== "menu") drawHero(); } else drawFoe(a); }
    }
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.8 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 24px system-ui, sans-serif" : "900 13px system-ui, sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status: score, lives, level, target colour
    ctx.textAlign = "left"; ctx.font = "900 18px system-ui, sans-serif"; ctx.fillStyle = "#ff8a1f";
    ctx.fillText(score.toLocaleString("it-IT"), 14, 28);
    ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#b8a8d0";
    ctx.fillText(`RECORD ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 14, 44);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) {
      ctx.fillStyle = "#ff8a1f"; ctx.beginPath(); ctx.arc(20 + i * 18, 62, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(25 + i * 18, 64, 4, 2.5, 0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = "right"; ctx.fillStyle = "#fff4e8"; ctx.font = "800 13px system-ui, sans-serif";
    ctx.fillText(`LIVELLO ${level + 1} · GIRO ${round + 1}`, W - 14, 26);
    ctx.fillStyle = "#b8a8d0"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillText("COLORE DA RAGGIUNGERE", W - 44, 46);
    // a tiny cube in the target colour
    const tx = W - 26, ty = 42;
    ctx.fillStyle = S.l; ctx.beginPath(); ctx.moveTo(tx - 10, ty); ctx.lineTo(tx, ty + 5); ctx.lineTo(tx, ty + 15); ctx.lineTo(tx - 10, ty + 10); ctx.fill();
    ctx.fillStyle = S.r; ctx.beginPath(); ctx.moveTo(tx + 10, ty); ctx.lineTo(tx, ty + 5); ctx.lineTo(tx, ty + 15); ctx.lineTo(tx + 10, ty + 10); ctx.fill();
    ctx.fillStyle = S.c[2]; ctx.beginPath(); ctx.moveTo(tx, ty - 5); ctx.lineTo(tx + 10, ty); ctx.lineTo(tx, ty + 5); ctx.lineTo(tx - 10, ty); ctx.fill();
    if (state === "intro") {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(10,6,20,0.8)"; ctx.fillRect(0, H - 110, W, 70);
      ctx.font = "900 24px system-ui, sans-serif"; ctx.fillStyle = "#ff8a1f";
      ctx.fillText(`LIVELLO ${level + 1} · GIRO ${round + 1}`, W / 2, H - 80);
      ctx.font = "700 14px system-ui, sans-serif"; ctx.fillStyle = "#fff4e8";
      ctx.fillText(rule().text, W / 2, H - 56);
    }
    if (freezeT > 0 && state === "play") {
      ctx.textAlign = "center"; ctx.font = "900 16px system-ui, sans-serif"; ctx.fillStyle = "#7dff5a";
      ctx.fillText(`NEMICI CONGELATI ${Math.ceil(freezeT)}`, W / 2, H - 40);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  // a pyramid behind the title screen
  buildRound(); state = "menu";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c <= r; c++) cubes[r][c] = (r + c) % 3 === 0 ? 1 : 0;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>

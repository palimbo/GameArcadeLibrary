<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calcetto Arcade</title>
<style>
  :root {
    --bg: #07180e;
    --fg: #f2fff4;
    --muted: #a8c8b0;
    --blue: #4a8aff;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --green: #5ae07a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a24, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 255, 244, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to run, PASSA and TIRA with the other thumb (in defence: change player and slide tackle) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(90, 224, 122, 0.6); background: radial-gradient(circle, rgba(90,224,122,0.14), rgba(90,224,122,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(90, 224, 122, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(242,255,244,0.25); pointer-events: none; }
  #touch .btns { display: flex; align-items: flex-end; gap: 10px; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; line-height: 1.2; }
  #touch .pass { width: 80px; height: 80px; margin-bottom: 50px; border: 2px solid rgba(74, 138, 255, 0.9); background: rgba(74, 138, 255, 0.22); }
  #touch .shoot { width: 96px; height: 96px; border: 2px solid rgba(255, 224, 74, 0.9); background: rgba(255, 224, 74, 0.2); }
  #touch .pass.on { background: rgba(74, 138, 255, 0.6); }
  #touch .shoot.on { background: rgba(255, 224, 74, 0.55); }
  #touch small { display: block; font-size: 9px; font-weight: 700; opacity: 0.75; letter-spacing: 0; }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .btns { flex-direction: column-reverse; align-items: center; }
  #touch.small .shoot { width: 80px; height: 80px; font-size: 11px; }
  #touch.small .pass { width: 64px; height: 64px; margin-bottom: 0; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(7, 24, 14, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--yellow);
    text-shadow: 3px 3px 0 #1a3a24, 0 0 22px rgba(255,224,74,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--green); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 580px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,255,244,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--yellow); color: #2a2400; background: var(--yellow); padding: 11px 30px; box-shadow: 0 4px 0 #8a7a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="pass" aria-label="Passa">PASSA<small>cambia</small></button>
    <button type="button" class="shoot" aria-label="Tira">TIRA<small>scivolata</small></button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  // an indoor five-a-side pitch with boards all round: the ball bounces back in
  const FW = 1000, FH = 340, GM = 44, PR = 8, BR = 4, MATCH_T = 100;
  const HUMAN = { name: "Azzurri", shirt: "#3a7aff", dark: "#1a3a8a", gk: "#ffe04a" };
  const RIVALS = [
    { name: "Gatti Rossi", shirt: "#e83a3a", dark: "#7a1a1a", gk: "#5ae07a" },
    { name: "Lupi Neri", shirt: "#3a3a44", dark: "#101014", gk: "#ff9a3a" },
    { name: "Tori Gialli", shirt: "#f0c030", dark: "#7a5a10", gk: "#3ad0e0" },
    { name: "Squali Verdi", shirt: "#2ab05a", dark: "#0a5a2a", gk: "#ff5ac8" },
    { name: "Aquile Viola", shirt: "#9a4ae8", dark: "#4a1a7a", gk: "#ffe04a" },
    { name: "Leoni d'Oro", shirt: "#e8a020", dark: "#7a4a0a", gk: "#e83a3a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "avversari lenti e imprecisi · il tuo portiere para di più", str: 0.62, gk: 1.05 },
    normale:   { label: "NORMALE",   color: "#ffe04a", desc: "l'esperienza classica", str: 0.9, gk: 0.95 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "avversari veloci, pressing e tiri precisi", str: 1.1, gk: 0.86 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "calcetto-difficulty";
  const bestKey = (id) => `calcetto-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    kick: lim(() => { noise(0.05, 0.12, 700); beep(160, 0.06, "sine", 0.05, -60); }),
    shot: lim(() => { noise(0.08, 0.2, 500); beep(120, 0.1, "sine", 0.07, -60); }),
    wall: lim(() => noise(0.05, 0.08, 300)),
    tackle: lim(() => noise(0.15, 0.1, 1400)),
    steal: lim(() => beep(500, 0.05, "square", 0.02, 200)),
    save: lim(() => { noise(0.1, 0.12, 900); beep(330, 0.1, "triangle", 0.04); }),
    whistle: () => { beep(2100, 0.25, "sine", 0.05); beep(2300, 0.25, "sine", 0.03, 0, 0.02); },
    goal: () => { noise(1.2, 0.12, 900); arp([523, 659, 784, 1047, 784, 1047, 1319], 0.09, 0.16); },
    against: () => arp([392, 330, 262], 0.12, 0.2, "triangle", 0.05),
    win: () => arp([523, 659, 784, 1047, 1319, 1568], 0.1, 0.18),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, round = 0, cup = 0, bestCache = 0, goals = [0, 0], matchT = MATCH_T, golden = false;
  let teams = [], players = [], ball = null, ctrl = null, camX = 0, camY = 0, kickoffTeam = 0;
  let parts = [], popups = [], message = null, switchT = 0;
  let passPressed = false, shootPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const strength = () => clamp(diff.str + round * 0.07 + cup * 0.1, 0.3, 1.5);

  // ---------- Teams ----------
  const ROLES = ["gk", "def", "midT", "midB", "fwd"];
  const BASE = { gk: [0.03, 0.5], def: [0.2, 0.5], midT: [0.4, 0.26], midB: [0.4, 0.74], fwd: [0.6, 0.5] };
  function makeTeams() {
    const rival = RIVALS[round % RIVALS.length];
    const s = strength();
    teams = [
      { id: 0, side: 1, look: HUMAN, speed: 112, str: 1, gkSkill: diff.gk },
      { id: 1, side: -1, look: rival, speed: 88 + s * 24, str: s, gkSkill: 0.62 + s * 0.35 },
    ];
    players = [];
    for (const t of teams) for (const role of ROLES) players.push({ team: t, role, x: 0, y: 0, vx: 0, vy: 0, face: t.side > 0 ? 0 : Math.PI, slide: 0, sdir: 0, recover: 0, stun: 0, think: 0, tx: 0, ty: 0, hold: 0, walk: 0 });
  }
  const goalX = (t) => (t.side > 0 ? FW : 0);     // where the team shoots
  const ownGoalX = (t) => (t.side > 0 ? 0 : FW);
  function spot(p) {
    const t = p.team, attacking = ball.owner && ball.owner.team === t;
    let [fx, fy] = BASE[p.role];
    if (p.role !== "gk") {
      fx += attacking ? 0.12 : -0.06;
      fx += (ball.x / FW - 0.5) * (t.side > 0 ? 0.35 : -0.35);
      fy += (ball.y / FH - 0.5) * 0.3;
    }
    fx = clamp(fx, 0.03, 0.92);
    return { x: t.side > 0 ? fx * FW : (1 - fx) * FW, y: clamp(fy, 0.08, 0.92) * FH };
  }
  function kickoff(teamIdx) {
    ball = { x: FW / 2, y: FH / 2, vx: 0, vy: 0, owner: null, kicker: null, kickT: 0, shot: false };
    for (const p of players) {
      const t = p.team, [fx, fy] = BASE[p.role];
      const x = Math.min(fx, 0.42);
      p.x = t.side > 0 ? x * FW : (1 - x) * FW; p.y = fy * FH;
      p.vx = p.vy = 0; p.slide = 0; p.recover = 0; p.stun = 0; p.face = t.side > 0 ? 0 : Math.PI; p.hold = 0;
    }
    const kicker = players.find((p) => p.team.id === teamIdx && p.role === "fwd");
    kicker.x = FW / 2 - teams[teamIdx].side * 10; kicker.y = FH / 2;
    ball.owner = kicker;
    ctrl = players.find((p) => p.team.id === 0 && p.role === (teamIdx === 0 ? "fwd" : "midT"));
    if (teamIdx === 0) ctrl = kicker;
    camX = clamp(FW / 2 - W / 2, -40, FW + 40 - W); camY = clamp(FH / 2 - H / 2, -40, FH + 40 - H);
    state = "kickoff"; stateT = 1.2;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "kickoff", "play", "goal", "full"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; round = 0; cup = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginMatch();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMatch() {
    makeTeams();
    goals = [0, 0]; matchT = MATCH_T; golden = false;
    kickoff(0);
    const r = teams[1].look;
    message = { text: `${round + 1}° TURNO${cup ? ` · COPPA ${cup + 1}` : ""}`, sub: `Azzurri contro ${r.name}`, t: 0 };
    state = "intro"; stateT = 2.2;
  }
  function addScore(n, x, y, color = "#f2fff4") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 10, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function scored(teamIdx) {
    goals[teamIdx]++;
    if (teamIdx === 0) { addScore(1000, ball.x - 30, ball.y - 20, "#ffe04a"); sfx.goal(); burst(ball.x, ball.y, "#ffe04a", 30, 200, 0.9); }
    else sfx.against();
    message = { text: teamIdx === 0 ? "GOOOL!" : `GOL DEI ${teams[1].look.name.toUpperCase()}`, sub: `${goals[0]} - ${goals[1]}`, t: 0 };
    kickoffTeam = 1 - teamIdx;
    state = "goal"; stateT = 2.2;
  }
  function endMatch() {
    sfx.whistle();
    const diffG = goals[0] - goals[1];
    if (diffG > 0) {
      const bonus = 3000 * (round + 1) + diffG * 500 + (goals[1] === 0 ? 1000 : 0);
      addScore(bonus);
      message = { text: "VITTORIA!", sub: `${goals[0]} - ${goals[1]} · bonus ${bonus.toLocaleString("it-IT")}`, t: -0.2 };
      sfx.win();
      state = "full"; stateT = 3.4;
    } else if (diffG === 0) {
      golden = true; matchT = 0;
      message = { text: "GOLDEN GOAL!", sub: "chi segna per primo vince", t: 0 };
      kickoff(Math.random() < 0.5 ? 0 : 1);
    } else gameOver(`Sconfitti ${goals[0]} - ${goals[1]} dai ${teams[1].look.name}`);
  }
  function gameOver(why) {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, rd = round + 1;
    menu = () => showOverlay(
      `<h2 class="lose">FUORI DAL TORNEO</h2>
       <p>${why || ""}</p>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${rd}° turno · ${played}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CALCETTO ARCADE</h1>
       <p>Torneo a eliminazione diretta di calcio a cinque, con le sponde intorno al campo. Guidi gli Azzurri: controlli il giocatore più vicino alla palla (quello con l'anello giallo). Vinci per passare il turno; se pareggi si va al golden goal, se perdi sei fuori.</p>
       <div class="pts">
         <span><b>In attacco</b></span><span>PASSA verso il compagno a cui punti · TIRA in porta (su/giù per mirare all'angolo)</span>
         <span><b>In difesa</b></span><span>PASSA cambia giocatore · TIRA fa la scivolata per rubare palla</span>
         <span><b>Punti</b></span><span>gol 1.000 · vittoria 3.000 per turno · 500 per gol di scarto · porta inviolata 1.000</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per correre · PASSA e TIRA (in difesa: cambia e scivolata)</p>`
         : `<p class="muted help">Frecce o WASD per correre · Z o J passa (cambia) · X, K o SPAZIO tira (scivolata) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>FISCHIO D'INIZIO!</button>`
    );
  }

    ctx.beginPath(); ctx.moveTo(FW / 2, 0); ctx.lineTo(FW / 2, FH); ctx.stroke();
    ctx.beginPath(); ctx.arc(FW / 2, FH / 2, 44, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(FW / 2, FH / 2, 3, 0, TAU); ctx.fill();
    for (const [x0, d] of [[0, 1], [FW, -1]]) {
      ctx.beginPath(); ctx.arc(x0, FH / 2, 110, -Math.PI / 2, Math.PI / 2, d < 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(x0 + d * 70, FH / 2, 3, 0, TAU); ctx.fill();
    }
    // the boards all round
    ctx.fillStyle = "#e8e4dc"; ctx.fillRect(-8, -8, FW + 16, 8); ctx.fillRect(-8, FH, FW + 16, 8);
    ctx.fillRect(-8, 0, 8, FH / 2 - GM); ctx.fillRect(-8, FH / 2 + GM, 8, FH / 2 - GM); ctx.fillRect(FW, 0, 8, FH / 2 - GM); ctx.fillRect(FW, FH / 2 + GM, 8, FH / 2 - GM);
    ctx.fillStyle = "#e83a3a"; for (let x = 20; x < FW; x += 120) { ctx.fillRect(x, -8, 60, 8); ctx.fillRect(x + 60, FH, 60, 8); }
    // the goals and their nets
    for (const [x0, d] of [[0, -1], [FW, 1]]) {
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(d < 0 ? -26 : FW, FH / 2 - GM, 26, GM * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
      for (let k = 0; k <= 26; k += 5) { ctx.beginPath(); ctx.moveTo(x0 + d * k, FH / 2 - GM); ctx.lineTo(x0 + d * k, FH / 2 + GM); ctx.stroke(); }
      for (let k = -GM; k <= GM; k += 6) { ctx.beginPath(); ctx.moveTo(x0, FH / 2 + k); ctx.lineTo(x0 + d * 26, FH / 2 + k); ctx.stroke(); }
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x0 - 3, FH / 2 - GM - 3, 6, 6); ctx.fillRect(x0 - 3, FH / 2 + GM - 3, 6, 6);
      ctx.fillRect(d < 0 ? x0 - 26 : x0, FH / 2 - GM - 2, 26, 3); ctx.fillRect(d < 0 ? x0 - 26 : x0, FH / 2 + GM - 1, 26, 3);
    }
    ctx.restore();
  }
  function drawPlayer(p) {
    const x = p.x - camX, y = p.y - camY, look = p.team.look;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) return;
    const body = p.role === "gk" ? look.gk : look.shirt;
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(x + 2, y + 4, 9, 5, 0, 0, TAU); ctx.fill();
    if (p === ctrl && p.team.id === 0) {
      ctx.strokeStyle = "#ffe04a"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, PR + 5, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffe04a"; ctx.beginPath(); ctx.moveTo(x - 5, y - 24); ctx.lineTo(x + 5, y - 24); ctx.lineTo(x, y - 17); ctx.fill();
    }
    const px = -Math.sin(p.face), py = Math.cos(p.face), sw = p.slide > 0 ? 0 : Math.sin(p.walk) * 3;
    ctx.fillStyle = "#1a1a1a";
    if (p.slide > 0) { ctx.fillRect(x + Math.cos(p.sdir) * 6 - 3, y + Math.sin(p.sdir) * 6 - 3, 6, 6); }
    else {
      ctx.beginPath(); ctx.arc(x + px * 4 + Math.cos(p.face) * sw, y + py * 4 + Math.sin(p.face) * sw, 2.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x - px * 4 - Math.cos(p.face) * sw, y - py * 4 - Math.sin(p.face) * sw, 2.6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(x, y, PR, PR * 0.85, p.face, 0, TAU); ctx.fill();
    ctx.strokeStyle = look.dark; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = p.stun > 0 ? "#ffffff" : "#e8b890"; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.arc(x - Math.cos(p.face) * 1.2, y - Math.sin(p.face) * 1.2, 3.4, 0, TAU); ctx.fill();
  }
  function drawBall() {
    const x = ball.x - camX, y = ball.y - camY;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x + 2, y + 3, 5, 3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x, y, BR + 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(x + Math.cos(clock * 9) * 1.5, y + Math.sin(clock * 9) * 1.5, 1.6, 0, TAU); ctx.fill();
    if (ball.shot) { ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - ball.vx * 0.04, y - ball.vy * 0.04); ctx.stroke(); }
  }
  function drawRadar() {
    const rw = 120, rh = 42, rx = W / 2 - rw / 2, ry = H - rh - 6;
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(rx - 2, ry - 2, rw + 4, rh + 4);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
    ctx.beginPath(); ctx.moveTo(rx + rw / 2, ry); ctx.lineTo(rx + rw / 2, ry + rh); ctx.stroke();
    for (const p of players) { ctx.fillStyle = p.team.id === 0 ? (p === ctrl ? "#ffe04a" : "#6aa0ff") : p.team.look.shirt; ctx.fillRect(rx + p.x / FW * rw - 1.5, ry + p.y / FH * rh - 1.5, 3, 3); }
    ctx.fillStyle = "#ffffff"; ctx.fillRect(rx + ball.x / FW * rw - 1, ry + ball.y / FH * rh - 1, 2.5, 2.5);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(7,24,14,0.8)"; ctx.fillRect(W / 2 - 150, 0, 300, 30);
    ctx.textBaseline = "middle"; ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff"; ctx.font = "900 17px system-ui"; ctx.fillText(`${goals[0]} - ${goals[1]}`, W / 2, 12);
    ctx.font = "800 10px system-ui"; ctx.textAlign = "right"; ctx.fillStyle = "#6aa0ff"; ctx.fillText("AZZURRI", W / 2 - 30, 12);
    ctx.textAlign = "left"; ctx.fillStyle = teams[1] ? teams[1].look.shirt : "#fff"; ctx.fillText(teams[1] ? teams[1].look.name.toUpperCase() : "", W / 2 + 30, 12);
    ctx.textAlign = "center"; ctx.font = "800 9px system-ui";
    const tm = Math.ceil(matchT), txt = golden ? "GOLDEN GOAL" : `${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, "0")}`;
    ctx.fillStyle = golden || (matchT < 10 && Math.floor(clock * 3) % 2) ? "#ffe04a" : "#a8c8b0"; ctx.fillText(txt, W / 2, 24);
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(7,24,14,0.7)"; ctx.fillRect(0, 0, 118, 30);
    ctx.fillStyle = "#f2fff4"; ctx.font = "900 13px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 8, 10);
    ctx.fillStyle = "#a8c8b0"; ctx.font = "700 8px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")} · ${round + 1}° TURNO`, 8, 23);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!ball) { round = 0; makeTeams(); kickoff(0); state = "menu"; }
    if (state === "menu") camX = FW / 2 - W / 2 + Math.sin(clock * 0.3) * 200;
    drawPitch();
    const list = [...players].sort((a, b) => a.y - b.y);
    for (const p of list) drawPlayer(p);
    drawBall();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - camX - 1.5, p.y - camY - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#07180e"; ctx.strokeText(p.text, p.x - camX, p.y - camY); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - camX, p.y - camY);
    }
    ctx.globalAlpha = 1;
    if (state !== "menu") { drawRadar(); drawHud(); }
    if (message && message.t >= 0) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 32px system-ui";
      ctx.lineWidth = 6; ctx.strokeStyle = "#07180e"; ctx.strokeText(message.text, W / 2, 110); ctx.fillStyle = "#ffe04a"; ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "800 13px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 134); ctx.fillStyle = "#f2fff4"; ctx.fillText(message.sub, W / 2, 134); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="calcetto-best-" data-kind="score"></script>

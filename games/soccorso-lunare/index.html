<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Soccorso Lunare</title>
<style>
  :root {
    --bg: #06061a;
    --fg: #f4f6ee;
    --muted: #c8d8f0;
    --pink: #5aff8a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: steer left and right; hold RAZZO to brake on the way down, and to fire on the way back up */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(90, 255, 138, 0.9); background: rgba(90, 255, 138, 0.22); }
  #touch .jump.on { background: rgba(90, 255, 138, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 6, 26, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #022a0a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #1aa84a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Razzo">RAZZO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the mothership up top, a belt of rocks in the middle, the moon's surface with three landing pads below
  const SHIP_Y = 52, BAY_W = 40, SURF = 330, PADS = [{ x: 96, w: 56, pts: 50 }, { x: 320, w: 50, pts: 100 }, { x: 548, w: 44, pts: 150 }];
  const BELT = [124, 160, 196, 232], LR = 9, SAFE_VY = 80, GRAV = 40, THRUST = 110;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 moduli · asteroidi lenti · dischi rari", lives: 4, rock: 0.65, ufo: 0.55, downUfo: 5, ramp: 0.07 },
    normale:   { label: "NORMALE",   color: "#5aff8a", desc: "3 moduli", lives: 3, rock: 0.85, ufo: 0.8, downUfo: 3, ramp: 0.12 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 moduli · asteroidi svelti e fitti · tanti dischi", lives: 3, rock: 1.15, ufo: 1.2, downUfo: 2, ramp: 0.14 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "soccorso-difficulty";
  const bestKey = (id) => `soccorso-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  // the feats of shared/imprese.js: the game only announces them, the hall keeps them
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let waveLost = false, waveUfos = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    drop: () => beep(600, 0.3, "triangle", 0.03, -400),
    thrust: lim(() => beep(rnd(70, 110), 0.05, "sawtooth", 0.02)),
    shot: lim(() => beep(1400, 0.05, "square", 0.015, -600)),
    boom: lim(() => { beep(80, 0.3, "sawtooth", 0.05, -40); beep(rnd(150, 220), 0.12, "square", 0.03, -100); }),
    land: () => arp([392, 523], 0.06, 0.1, "triangle", 0.04),
    board: () => arp([659, 784, 988], 0.06, 0.08, "square", 0.035),
    dock: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12, "square", 0.045),
    bump: lim(() => beep(160, 0.08, "triangle", 0.04)),
    crash: () => { beep(60, 0.6, "sawtooth", 0.06, -30); arp([392, 330, 262, 196], 0.1, 0.14, "triangle", 0.04); },
    wave: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, wave = 1, saved = 0, waiting = [], nextLife = 10000, totalSaved = 0;
  let ship = { x: W / 2, dir: 1 }, lander = null, rocks = [], ufos = [], shots = [], parts = [], popups = [], message = null, stars = [];
  let phase = "dock", phaseT = 0, deadT = 0, waveT = 0, ufoT = 3, shotCd = 0;
  let actHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: TOP + Math.random() * (SURF - TOP), s: Math.random() < 0.2 ? 2 : 1 });

  // ---------- The field ----------
  const k = () => 1 + diff.ramp * (wave - 1);
  function buildBelt() {
    rocks = [];
    BELT.forEach((y, row) => {
      const dir = row % 2 ? -1 : 1, sp = (28 + row * 7) * diff.rock * k() * (Math.random() < 0.5 ? 1 : 1.2);
      const n = Math.min(7, 2 + Math.floor((wave + row % 2) / 2));
      for (let i = 0; i < n; i++) rocks.push({ x: (i + rnd(0, 0.6)) * W / n, y, vx: dir * sp, r: rnd(9, 14), spin: rnd(0, TAU) });
    });
  }
  // the ground: three flat pads, jagged hills between them
  function groundY(x) {
    for (const p of PADS) if (Math.abs(x - p.x) <= p.w / 2) return SURF - 6;
    // the hills rise away from the pads, so the last stretch down to a pad is open
    const d = Math.min(...PADS.map((p) => Math.abs(x - p.x) - p.w / 2)), ramp = Math.min(1, d / 40);
    return SURF - 6 - ramp * (16 + Math.abs(Math.sin(x * 0.045)) * 26 + Math.abs(Math.sin(x * 0.11)) * 8);
  }
  const padAt = (x) => PADS.findIndex((p) => Math.abs(x - p.x) <= p.w / 2 - 6);

  // ---------- The lander ----------
  function launch() {
    lander = { x: ship.x, y: SHIP_Y + 18, vx: 0, vy: 20, fuel: 100, up: false, crew: false, inv: 0 };
    phase = "down"; sfx.drop();
  }
  function crash(why) {
    if (deadT > 0) return;
    deadT = 2; sfx.crash(); waveLost = true;
    for (let i = 0; i < 28; i++) { const a = rnd(0, TAU), v = rnd(30, 160); parts.push({ x: lander.x, y: lander.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rnd(0.5, 1.1), color: i % 2 ? "#ff8a3a" : "#ffd23a" }); }
    // an astronaut on board climbs back out onto the pad to wait for the next try
    if (lander.crew) { const p = lander.from; waiting[p]++; }
    message = { text: why, sub: lives > 1 ? `${lives - 1} ${lives - 1 === 1 ? "modulo rimasto" : "moduli rimasti"}` : "", t: 0 };
    lander = null;
  }
  function updateLander(dt) {
    const L = lander;
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    L.vx += (mx * 120 - L.vx) * Math.min(1, dt * 5);
    L.x = clamp(L.x + L.vx * dt, 12, W - 12);
    if (phase === "down") {
      L.vy += GRAV * k() * 0.6 * dt + GRAV * 0.4 * dt;
      if (actHeld && L.fuel > 0) { L.vy -= THRUST * dt; L.fuel = Math.max(0, L.fuel - 12 * dt); if (Math.random() < dt * 14) sfx.thrust(); L.burn = true; } else L.burn = false;
      L.vy = Math.max(-40, L.vy);
      L.y += L.vy * dt;
      const gy = groundY(L.x);
      if (L.y + LR >= gy) {
        const p = padAt(L.x);
        if (p < 0) return crash("SCHIANTATO SUI MONTI");
        if (L.vy > SAFE_VY) return crash("ATTERRAGGIO TROPPO VELOCE");
        L.y = gy - LR; L.vy = 0; L.from = p; phase = "landed"; phaseT = 0; sfx.land();
        addScore(PADS[p].pts * wave, L.x, L.y - 24, "#5aff8a");
        if (p === 2) impresa("piazzola");
      }
    } else if (phase === "landed") {
      // the astronaut runs over and climbs in, then the lander lifts off by itself
      phaseT += dt;
      if (!L.crew && phaseT > 0.8) { if (waiting[L.from] > 0) { waiting[L.from]--; L.crew = true; sfx.board(); } else { L.crew = false; } }
      if (phaseT > 1.6) { phase = "up"; L.vy = -62; }
    } else if (phase === "up") {
      L.vy = -62 * (1 + 0.04 * (wave - 1));
      L.y += L.vy * dt;
      shotCd -= dt;
      if (actHeld && shotCd <= 0) { shotCd = 0.22; shots.push({ x: L.x, y: L.y - 12 }); sfx.shot(); }
      // the bay doors: miss them and you bump the hull and slide along under it
      if (L.y - LR <= SHIP_Y + 14) {
        if (Math.abs(L.x - ship.x) < BAY_W / 2 - 4) dock();
        else { L.y = SHIP_Y + 14 + LR; if (Math.random() < dt * 4) sfx.bump(); }
      }
    }
    if (L.inv > 0) L.inv -= dt;
  }
  function dock() {
    const L = lander;
    if (L.crew) { saved++; totalSaved++; const pts = 250 * wave; addScore(pts, ship.x, SHIP_Y + 30, "#ffd23a"); sfx.dock(); popups.push({ x: ship.x, y: SHIP_Y + 46, text: "ASTRONAUTA IN SALVO!", color: "#ffffff", t: 0 }); }
    else sfx.bump();
    lander = null; phase = "dock"; phaseT = 0; shots = [];
    if (waiting.every((n) => n === 0)) {
      if (!waveLost) impresa("ondata");
      const bonus = 1000 * wave; addScore(bonus);
      waveT = 3; sfx.wave(); message = { text: "TUTTI IN SALVO!", sub: `ondata ${wave} completata · +${bonus.toLocaleString("it-IT")}`, t: 0 };
    }
  }
  function addScore(n, x, y, color = "#ffffff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: `+${n}`, color, t: 0 });
    if (score >= nextLife) { lives++; nextLife = nextLife < 20000 ? 20000 : Infinity; popups.push({ x: W / 2, y: 120, text: "MODULO EXTRA!", color: "#7ed87a", t: 0 }); }
  }

  // ---------- Rocks and saucers ----------
  function updateField(dt) {
    ship.x += ship.dir * 26 * dt; if (ship.x > W - 90 || ship.x < 90) ship.dir = -ship.dir;
    for (const r of rocks) { r.x += r.vx * dt; r.spin += dt * 2; if (r.x > W + 20) r.x -= W + 40; if (r.x < -20) r.x += W + 40; }
    // saucers dive in on the way back up (and from a later wave, on the way down too)
    if (lander && (phase === "up" || (phase === "down" && wave >= diff.downUfo))) {
      ufoT -= dt;
      if (ufoT <= 0) { ufoT = rnd(3, 4.6) / (diff.ufo * (1 + 0.12 * (wave - 1))); const side = Math.random() < 0.5 ? -1 : 1; ufos.push({ x: side < 0 ? -20 : W + 20, y: rnd(110, 250), vx: -side * rnd(70, 110) * diff.ufo, t: 0, dive: false }); }
    }
    for (const u of ufos) {
      u.t += dt;
      if (!u.dive && lander && Math.abs(u.x - lander.x) < 110 && u.t > 1 && Math.random() < dt * 0.9) { u.dive = true; const a = Math.atan2(lander.y - u.y, lander.x - u.x); u.vx = Math.cos(a) * 100 * diff.ufo; u.vy = Math.sin(a) * 100 * diff.ufo; }
      u.x += u.vx * dt; u.y += (u.vy || Math.sin(u.t * 4) * 30) * dt;
    }
    ufos = ufos.filter((u) => u.x > -40 && u.x < W + 40 && u.y > TOP && u.y < SURF && !u.gone);
    for (const s of shots) {
      s.y -= 420 * dt;
      for (const u of ufos) if (!u.gone && Math.abs(u.x - s.x) < 14 && Math.abs(u.y - s.y) < 10) { u.gone = true; s.gone = true; addScore(100 * wave, u.x, u.y - 10, "#ff8ad8"); boom(u.x, u.y, "#ff8ad8"); if (++waveUfos === 3) impresa("dischi"); break; }
      if (s.gone) continue;
      for (const r of rocks) if (!r.gone && Math.hypot(r.x - s.x, r.y - s.y) < r.r + 3) { r.gone = true; s.gone = true; addScore(30, r.x, r.y - 10); boom(r.x, r.y, "#c8b8a8"); break; }
    }
    shots = shots.filter((s) => !s.gone && s.y > SHIP_Y);
    rocks = rocks.filter((r) => !r.gone);
    if (!lander || deadT > 0 || phase === "landed") return;
    for (const r of rocks) if (Math.hypot(r.x - lander.x, r.y - lander.y) < r.r + LR - 2) return crash("COLPITO DA UN ASTEROIDE");
    for (const u of ufos) if (!u.gone && Math.hypot(u.x - lander.x, u.y - lander.y) < 12 + LR - 2) { u.gone = true; return crash("COLPITO DA UN DISCO"); }
  }
  function boom(x, y, c) { sfx.boom(); for (let i = 0; i < 12; i++) { const a = rnd(0, TAU), v = rnd(30, 110); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rnd(0.3, 0.7), color: c }); } }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startWave() {
    waiting = [2, 2, 2]; saved = 0; waveLost = false; waveUfos = 0; buildBelt(); ufos = []; shots = []; lander = null; phase = "dock"; phaseT = 0; ufoT = 2;
    message = { text: `ONDATA ${wave}`, sub: "sei astronauti aspettano sulla Luna", t: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; wave = 1; nextLife = 5000; totalSaved = 0; deadT = 0; waveT = 0; parts = []; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startWave();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">MISSIONE FALLITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ondata ${wave} · ${totalSaved} ${totalSaved === 1 ? "astronauta salvato" : "astronauti salvati"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>NUOVA MISSIONE</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SOCCORSO LUNARE</h1>
       <p>Sei astronauti sono rimasti a terra sulla Luna. Sgancia il modulo dalla nave madre, scendi tra gli asteroidi frenando con il razzo e posati piano su una piazzola: l'astronauta sale a bordo e il modulo riparte da solo. Risalendo spara ad asteroidi e dischi volanti e centra il portellone della nave madre.</p>
       <div class="pts">
         <span><b>Discesa</b></span><span>tieni premuto RAZZO per frenare (il carburante è poco) · tocca terra piano e solo sulle piazzole: più è piccola, più punti vale (50, 100, 150)</span>
         <span><b>Risalita</b></span><span>RAZZO spara verso l'alto · disco 100 × ondata · asteroide 30 · astronauta in salvo 250 × ondata · ondata completa 1.000 × ondata</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a destra e sinistra · RAZZO per sganciare, frenare e sparare</p>`
         : `<p class="muted help">Frecce o A D · SPAZIO (o J) per sganciare, frenare e sparare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>AL LAVORO</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);


  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    if (state !== "play") { ship.x += ship.dir * 26 * dt; if (ship.x > W - 90 || ship.x < 90) ship.dir = -ship.dir; for (const r of rocks) { r.x += r.vx * dt; if (r.x > W + 20) r.x -= W + 40; if (r.x < -20) r.x += W + 40; } return; }
    updateField(dt);
    if (deadT > 0) { deadT -= dt; if (deadT <= 0) { lives--; if (lives <= 0) { gameOver(); return; } phase = "dock"; phaseT = 0; ufos = []; } return; }
    if (waveT > 0) { waveT -= dt; if (waveT <= 0) { wave++; startWave(); } return; }
    if (phase === "dock") {
      // the lander waits in the bay; the button drops it
      phaseT += dt;
      if (actHeld && phaseT > 0.6) launch();
      return;
    }
    if (lander) updateLander(dt);
  }

  // ---------- Drawing ----------
  function drawScene() {
    ctx.fillStyle = "#06061a"; ctx.fillRect(0, TOP, W, H - TOP);
    for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.3 * Math.sin(clock * 2 + s.x)})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
    // the Earth hanging in the sky
    ctx.fillStyle = "#2a6ad8"; ctx.beginPath(); ctx.arc(70, 96, 18, 0, TAU); ctx.fill(); ctx.fillStyle = "#3aa84a"; ctx.beginPath(); ctx.arc(64, 92, 7, 0, TAU); ctx.arc(76, 102, 5, 0, TAU); ctx.fill();
    // the moon's surface
    ctx.fillStyle = "#8a8a9a"; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) ctx.lineTo(x, groundY(x));
    ctx.lineTo(W, H); ctx.fill();
    ctx.fillStyle = "#6a6a7a"; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.ellipse((i * 53 + 20) % W, SURF + 12 + (i % 3) * 6, 8, 3, 0, 0, TAU); ctx.fill(); }
    PADS.forEach((p, i) => {
      ctx.fillStyle = "#5aff8a"; ctx.fillRect(p.x - p.w / 2, SURF - 6, p.w, 4);
      ctx.fillStyle = "#c8d8f0"; ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; ctx.fillText(String(p.pts), p.x, SURF + 12);
      // the astronauts waiting, waving
      for (let j = 0; j < waiting[i]; j++) {
        const ax = p.x + (j ? 14 : -14), ay = SURF - 10, wv = Math.sin(clock * 6 + j) * 3;
        ctx.fillStyle = "#ffffff"; ctx.fillRect(ax - 2.5, ay - 6, 5, 7); ctx.beginPath(); ctx.arc(ax, ay - 9, 3.5, 0, TAU); ctx.fill();
        ctx.fillStyle = "#3a6ad8"; ctx.fillRect(ax - 1.5, ay - 10, 3, 2);
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ax + 2, ay - 5); ctx.lineTo(ax + 6, ay - 10 + wv); ctx.stroke();
      }
    });
  }
  function drawShip() {
    const x = ship.x, y = SHIP_Y;
    ctx.fillStyle = "#c8c8d8"; ctx.beginPath(); ctx.ellipse(x, y, 70, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#8a8aa8"; ctx.beginPath(); ctx.ellipse(x, y - 8, 30, 10, 0, Math.PI, 0); ctx.fill();
    for (let i = -5; i <= 5; i++) { ctx.fillStyle = Math.floor(clock * 4 + i) % 3 ? "#5aff8a" : "#ffd23a"; ctx.beginPath(); ctx.arc(x + i * 11, y + 2, 2, 0, TAU); ctx.fill(); }
    // the bay doors
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - BAY_W / 2, y + 6, BAY_W, 8);
    ctx.strokeStyle = "#5aff8a"; ctx.lineWidth = 1.5; ctx.strokeRect(x - BAY_W / 2, y + 6, BAY_W, 8);
    if (phase === "dock" && deadT <= 0 && waveT <= 0 && state === "play") drawLander(x, y + 14, false, Math.floor(clock * 3) % 2 === 0);
  }
  function drawLander(x, y, burn, blink) {
    ctx.fillStyle = blink ? "#ffd23a" : "#e8e8f0"; ctx.beginPath(); ctx.arc(x, y - 3, 7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#c8a83a"; ctx.fillRect(x - 8, y - 3, 16, 6);
    ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 6, y + 3); ctx.lineTo(x - 10, y + 9); ctx.moveTo(x + 6, y + 3); ctx.lineTo(x + 10, y + 9); ctx.stroke();
    ctx.fillStyle = "#3a6ad8"; ctx.fillRect(x - 3, y - 7, 6, 3);
    if (burn) { ctx.fillStyle = `rgba(255,${150 + Math.random() * 80},40,0.9)`; ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x, y + 12 + Math.random() * 6); ctx.lineTo(x + 4, y + 4); ctx.fill(); }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(6,6,26,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8d8f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#5aff8a"; ctx.font = "900 10px system-ui"; ctx.fillText(`ONDATA ${wave}`, x0 + 80, 21);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffffff"; ctx.font = "800 10px system-ui"; ctx.fillText(`IN SALVO ${saved}/6`, 360, 9);
    const f = lander ? lander.fuel : 100;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(320, 17, 80, 6); ctx.fillStyle = f < 25 ? "#ff5a5a" : "#ffd23a"; ctx.fillRect(320, 17, 80 * f / 100, 6);
    ctx.fillStyle = "#c8d8f0"; ctx.font = "700 8px system-ui"; ctx.fillText("CARBURANTE", 440, 20);
    // the descent speed: red when a landing now would crash
    if (lander && phase === "down") { ctx.fillStyle = lander.vy > SAFE_VY ? "#ff5a5a" : "#5aff8a"; ctx.font = "900 10px system-ui"; ctx.fillText(`↓ ${Math.round(lander.vy)}`, 500, 14); }
    ctx.textAlign = "right";
    for (let i = 0; i < Math.min(6, lives); i++) drawLander((touchMode ? W - 64 : W - 18) - i * 18, 15, false, false);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!rocks.length && state === "menu") { waiting = [2, 2, 2]; buildBelt(); }
    drawScene();
    for (const r of rocks) {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.spin);
      ctx.fillStyle = "#8a7a6a"; ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = r.r * (0.8 + ((i * 37) % 5) / 20); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill();
      ctx.fillStyle = "#6a5a4a"; ctx.beginPath(); ctx.arc(-r.r * 0.3, -r.r * 0.2, r.r * 0.25, 0, TAU); ctx.fill();
      ctx.restore();
    }
    drawShip();
    for (const u of ufos) {
      ctx.fillStyle = "#ff8ad8"; ctx.beginPath(); ctx.ellipse(u.x, u.y, 13, 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#c8f0ff"; ctx.beginPath(); ctx.ellipse(u.x, u.y - 4, 6, 5, 0, Math.PI, 0); ctx.fill();
      for (let i = -1; i <= 1; i++) { ctx.fillStyle = Math.floor(clock * 10 + i) % 2 ? "#ffd23a" : "#ffffff"; ctx.fillRect(u.x + i * 7 - 1, u.y, 2, 2); }
    }
    for (const s of shots) { ctx.fillStyle = "#5aff8a"; ctx.fillRect(s.x - 1, s.y - 6, 2, 8); }
    if (lander) {
      drawLander(lander.x, lander.y, lander.burn && phase === "down", false);
      if (lander.crew) { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(lander.x, lander.y - 5, 2, 0, TAU); ctx.fill(); }
      if (phase === "landed" && !lander.crew && phaseT > 0.1) { const p = PADS[lander.from]; const t = Math.min(1, phaseT / 0.8), ax = p.x + (waiting[lander.from] > 0 ? 14 : 0) * (1 - t); ctx.fillStyle = "#ffffff"; ctx.fillRect(ax - 2, SURF - 16, 4, 7); }
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#06061a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (phase === "dock" && deadT <= 0 && waveT <= 0 && !message) { ctx.textAlign = "center"; ctx.fillStyle = "#5aff8a"; ctx.font = "900 12px system-ui"; ctx.fillText(touchMode ? "RAZZO PER SGANCIARE IL MODULO" : "SPAZIO PER SGANCIARE IL MODULO", W / 2, 100); }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#5aff8a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#06061a"; ctx.strokeText(message.text, W / 2, 112); ctx.fillText(message.text, W / 2, 112);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 130); ctx.fillText(message.sub, W / 2, 130); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="soccorso-best-" data-kind="score"></script>

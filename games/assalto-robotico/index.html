<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Assalto Robotico</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f4f4ff;
    --muted: #9a9ac8;
    --hero: #ffe03a;
    --red: #ff3a4a;
    --green: #3aff6a;
    --cyan: #3ae8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a1a3a, 0 10px 40px rgba(0,0,0,0.6); cursor: crosshair; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  /* two virtual sticks: move on the left, shoot on the right */
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  .stick { position: relative; width: 130px; height: 130px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(58, 232, 255, 0.55); background: rgba(58, 232, 255, 0.07); }
  .stick.fire { border-color: rgba(255, 58, 74, 0.7); background: rgba(255, 58, 74, 0.08); }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(58, 232, 255, 0.45); border: 2px solid rgba(255,255,255,0.6); pointer-events: none; }
  .stick.fire .knob { background: rgba(255, 58, 74, 0.5); }
  .stick span { position: absolute; left: 0; right: 0; top: -20px; text-align: center; font: 800 11px system-ui, sans-serif; letter-spacing: 1.5px; color: rgba(255,255,255,0.6); }
  #touch.small .stick { width: 110px; height: 110px; }
  #touch.small .stick .knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(0, 0, 0, 0.86);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 60px); font-weight: 900; letter-spacing: 3px; background: linear-gradient(90deg, #ff3a4a, #ffe03a, #3aff6a, #3ae8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--hero); color: #1a1400; background: var(--hero); padding: 11px 30px; box-shadow: 0 0 18px rgba(255,224,58,0.5); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" data-stick="move"><span>MUOVI</span><div class="knob"></div></div>
  <div class="stick fire" data-stick="fire"><span>SPARA</span><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 508, TOP = 30;
  const AX = 6, AY = 36, AW = W - 12, AH = H - AY - 6;
  const ARENA_COLORS = ["#ff3a4a", "#3aff6a", "#3ae8ff", "#ffe03a", "#ff5aff", "#ff9a3a"];
  const HUMAN_KINDS = [{ name: "papà", c: "#3a8aff" }, { name: "mamma", c: "#ff6ab8" }, { name: "bimbo", c: "#ffe03a" }];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · robot lenti e meno numerosi", lives: 5, speed: 0.78, count: 0.7 },
    normale:   { label: "NORMALE",   color: "#ffe03a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, count: 1 },
    difficile: { label: "DIFFICILE", color: "#ff3a4a", desc: "3 vite · un'orda di robot velocissimi", lives: 3, speed: 1.2, count: 1.3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "robotico-difficulty";
  const bestKey = (id) => `robotico-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 24;
      if (window.innerWidth - 2 * side > 240) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1600, 0.04, "square", 0.015, -1000)),
    boom: lim(() => { noise(0.15, 0.18, 1600); beep(220, 0.1, "square", 0.025, -120); }),
    zap: lim(() => beep(2400, 0.08, "sawtooth", 0.02, -1800)),
    thud: lim(() => beep(90, 0.06, "square", 0.03)),
    save: lim((k) => arp([784 + k * 60, 988 + k * 60, 1319 + k * 60], 0.05, 0.1, "triangle", 0.05)),
    lost: lim(() => beep(300, 0.3, "sawtooth", 0.03, -200)),
    spark: lim(() => beep(1200, 0.06, "triangle", 0.02, 500)),
    spawn: lim(() => beep(400, 0.2, "sine", 0.02, 800)),
    die: () => { noise(0.8, 0.35, 900); arp([784, 622, 523, 392, 311, 262], 0.1, 0.14, "sawtooth", 0.035); },
    wave: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, wave = 0, bestCache = 0, nextLife = 50000;
  let player = null, bullets = [], enemies = [], humans = [], sparks = [], rescued = 0, fireT = 0;
  let parts = [], popups = [], message = null, waveT = 0;
  const keys = {};
  const aim = { mx: 0, my: 0, fx: 0, fy: 0, mouse: false, mousePos: null };

  function spawnPoint(minD) {
    for (let k = 0; k < 40; k++) {
      const x = rnd(AX + 14, AX + AW - 14), y = rnd(AY + 14, AY + AH - 14);
      if (Math.hypot(x - W / 2, y - (AY + AH / 2)) > minD) return [x, y];
    }
    return [AX + 20, AY + 20];
  }
  function buildWave() {
    const w = wave, c = diff.count;
    enemies = []; humans = []; bullets = []; sparks = []; rescued = 0;
    const add = (kind, n, extra = {}) => { for (let i = 0; i < n; i++) { const [x, y] = spawnPoint(kind === "electrode" ? 110 : 150); enemies.push({ kind, x, y, vx: 0, vy: 0, t: rnd(0, 2), appear: 0.6 + Math.random() * 0.5, ...extra }); } };
    add("grunt", Math.round(Math.min(60, (10 + w * 5) * c)));
    add("electrode", Math.round(Math.min(16, (4 + w) * c)), { shape: w % 4 });
    if (w >= 1) add("hulk", Math.round(Math.min(8, w * c)), { dir: Math.floor(Math.random() * 4), turnT: rnd(1, 3) });
    if (w >= 2) add("spheroid", Math.min(4, Math.floor((w - 1) * c)), { made: 0, spawnT: rnd(2, 4) });
    for (let i = 0; i < Math.min(8, 3 + w); i++) {
      const [x, y] = spawnPoint(80);
      humans.push({ x, y, kind: HUMAN_KINDS[i % 3], dir: Math.random() * Math.PI * 2, t: rnd(0, 2) });
    }
    player = { x: W / 2, y: AY + AH / 2, face: 0, walk: 0, inv: 1.2, dead: false };
    waveT = 0;
    message = { text: `ONDATA ${wave + 1}`, sub: "Salva la famiglia!", t: 0 };
    state = "intro"; stateT = 1.4;
    sfx.spawn();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; wave = 0; nextLife = 50000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildWave();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f4f4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 75000; lives = Math.min(9, lives + 1); sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffe03a", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 130) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.25 + Math.random() * 0.4, c: color });
    }
  }
  function killPlayer() {
    if (state !== "play" || player.inv > 0) return;
    lives--; player.dead = true;
    sfx.die();
    for (let k = 0; k < 3; k++) burst(player.x, player.y, ["#ffe03a", "#ff3a4a", "#ffffff"][k], 16, 200);
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // back to the middle; the robots nearby are pushed out of the way
    Object.assign(player, { x: W / 2, y: AY + AH / 2, dead: false, inv: 2 });
    for (const e of enemies) if (Math.hypot(e.x - player.x, e.y - player.y) < 130) { const [x, y] = spawnPoint(160); e.x = x; e.y = y; e.appear = 0.6; }
    sparks = []; bullets = [];
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, wv = wave + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Ondata ${wv} · ${played}</p>
       ${record ? "<p style='color:var(--hero)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ASSALTO ROBOTICO</h1>
       <p>I robot hanno invaso la città e l'ultima famiglia umana è in pericolo! Muoviti in una direzione e spara in un'altra: abbatti le ondate di robot e raggiungi papà, mamma e bimbo per metterli in salvo prima che i giganti verdi li schiaccino.</p>
       <div class="pts">
         <span><b>Robot rosso</b></span><span>100 · marcia verso di te</span>
         <span><b>Gigante verde</b></span><span>indistruttibile · i colpi lo respingono</span>
         <span><b>Sfera</b></span><span>1.000 · genera i droni che sparano (150)</span>
         <span><b>Ostacoli elettrici</b></span><span>25 · non toccarli</span>
         <span><b>Umano salvato</b></span><span>1.000, 2.000… fino a 5.000</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta sinistra per muoverti · levetta destra per sparare nella direzione in cui la spingi</p>`
         : `<p class="muted help">W A S D per muoverti · frecce per sparare in 8 direzioni (oppure tieni premuto il mouse per mirare) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    keys[k] = true;
  });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; aim.mouse = false; if (isPlaying()) togglePause(); });
  // mouse: hold a button on the field to shoot towards the pointer
  const toGame = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  canvas.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") return; aim.mouse = true; aim.mousePos = toGame(e); });
  window.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && aim.mouse) aim.mousePos = toGame(e); });
  window.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") aim.mouse = false; });
  // touch sticks
  for (const st of touchEl.querySelectorAll(".stick")) {
    const knob = st.querySelector(".knob"), which = st.dataset.stick;
    let id = null;
    const setV = (e) => {
      const r = st.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const max = r.width / 2 - 10, d = Math.hypot(dx, dy);
      if (d > max) { dx *= max / d; dy *= max / d; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      const n = Math.hypot(dx, dy) / max;
      const vx = n > 0.2 ? dx / max : 0, vy = n > 0.2 ? dy / max : 0;
      if (which === "move") { aim.mx = vx; aim.my = vy; } else { aim.fx = vx; aim.fy = vy; }
    };
    st.addEventListener("pointerdown", (e) => { e.preventDefault(); id = e.pointerId; try { st.setPointerCapture(id); } catch { /* ignore */ } setV(e); });
    st.addEventListener("pointermove", (e) => { if (e.pointerId === id) setV(e); });
    const end = (e) => { if (e.pointerId !== id) return; id = null; knob.style.transform = ""; if (which === "move") { aim.mx = 0; aim.my = 0; } else { aim.fx = 0; aim.fy = 0; } };
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) st.addEventListener(ev, end);
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Player ----------
  function moveInput() {
    let x = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), y = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
    if (!x && !y) { x = aim.mx; y = aim.my; }
    const l = Math.hypot(x, y);
    return l > 1 ? [x / l, y / l] : [x, y];
  }
  function fireInput() {
    let x = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0), y = (keys.arrowdown ? 1 : 0) - (keys.arrowup ? 1 : 0);
    if (!x && !y && (aim.fx || aim.fy)) { x = aim.fx; y = aim.fy; }
    if (!x && !y && aim.mouse && aim.mousePos) { x = aim.mousePos[0] - player.x; y = aim.mousePos[1] - player.y; }
    const l = Math.hypot(x, y);
    return l > 0.01 ? [x / l, y / l] : null;
  }
  function updatePlayer(dt) {
    const p = player;
    p.inv = Math.max(0, p.inv - dt);
    const [mx, my] = moveInput();
    p.x = clamp(p.x + mx * 135 * dt, AX + 7, AX + AW - 7);
    p.y = clamp(p.y + my * 135 * dt, AY + 9, AY + AH - 9);
    if (mx || my) { p.walk += dt * 12; p.face = Math.atan2(my, mx); }
    fireT -= dt;
    const f = fireInput();
    if (f && fireT <= 0 && bullets.length < 7) {
      bullets.push({ x: p.x + f[0] * 8, y: p.y + f[1] * 8, vx: f[0] * 460, vy: f[1] * 460 });
      fireT = 0.09; sfx.shot();
    }
  }

  // ---------- Enemies ----------
  const sp = () => diff.speed * (1 + Math.min(1, wave * 0.08));
  function updateEnemies(dt) {
    const p = player;
    for (const e of enemies) {
      if (e.appear > 0) { e.appear -= dt; continue; }
      e.t += dt;
      if (e.kind === "grunt") {
        // marches straight at the hero, a little faster every wave
        const d = Math.hypot(p.x - e.x, p.y - e.y) || 1, v = (34 + Math.min(70, wave * 7)) * sp() * (0.8 + 0.4 * Math.sin(e.t * 3 + e.x));
        e.x += (p.x - e.x) / d * v * dt; e.y += (p.y - e.y) / d * v * dt;
      } else if (e.kind === "hulk") {
        // wanders the arena, going after the humans
        e.turnT -= dt;
        if (e.turnT <= 0) {
          e.turnT = rnd(0.8, 2.2);
          const h = humans.reduce((a, b) => (!a || Math.hypot(b.x - e.x, b.y - e.y) < Math.hypot(a.x - e.x, a.y - e.y) ? b : a), null);
          const tx = h ? h.x : p.x, ty = h ? h.y : p.y;
          e.dir = Math.random() < 0.3 ? Math.floor(Math.random() * 4) : Math.abs(tx - e.x) > Math.abs(ty - e.y) ? (tx > e.x ? 0 : 2) : (ty > e.y ? 1 : 3);
        }
        const v = 34 * sp(), a = e.dir * Math.PI / 2;
        e.x += Math.cos(a) * v * dt; e.y += Math.sin(a) * v * dt;
        e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 1 - dt * 6; e.vy *= 1 - dt * 6;
        if (e.x < AX + 12 || e.x > AX + AW - 12 || e.y < AY + 14 || e.y > AY + AH - 14) e.dir = (e.dir + 2) % 4;
      } else if (e.kind === "spheroid") {
        // drifts in wide curves and gives birth to drones
        e.vx += Math.cos(e.t * 1.3 + e.y) * 120 * dt; e.vy += Math.sin(e.t * 1.1 + e.x) * 120 * dt;
        const s = Math.hypot(e.vx, e.vy), max = 110 * sp(); if (s > max) { e.vx *= max / s; e.vy *= max / s; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.spawnT -= dt;
        if (e.spawnT <= 0 && e.made < 3) { e.made++; e.spawnT = rnd(2.5, 4.5); enemies.push({ kind: "drone", x: e.x, y: e.y, vx: 0, vy: 0, t: 0, appear: 0.4, fireT: rnd(1, 2) }); sfx.spawn(); }
        if (e.made >= 3 && e.spawnT <= 0) e.gone = true;
      } else if (e.kind === "drone") {
        // floats after the hero and fires sparks
        const d = Math.hypot(p.x - e.x, p.y - e.y) || 1;
        e.vx += (p.x - e.x) / d * 160 * dt + Math.sin(e.t * 4) * 60 * dt; e.vy += (p.y - e.y) / d * 160 * dt + Math.cos(e.t * 4) * 60 * dt;
        const s = Math.hypot(e.vx, e.vy), max = 95 * sp(); if (s > max) { e.vx *= max / s; e.vy *= max / s; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.fireT -= dt;
        if (e.fireT <= 0) {
          e.fireT = rnd(1.4, 2.8) / Math.min(1.8, 1 + wave * 0.06);
          const lead = 0.4, tx = p.x - e.x + rnd(-20, 20), ty = p.y - e.y + rnd(-20, 20), l = Math.hypot(tx, ty) || 1;
          sparks.push({ x: e.x, y: e.y, vx: tx / l * 150 * sp(), vy: ty / l * 150 * sp(), t: 0, lead });
          sfx.spark();
        }
      }
      if (e.kind !== "electrode") { e.x = clamp(e.x, AX + 8, AX + AW - 8); e.y = clamp(e.y, AY + 8, AY + AH - 8); }
      // touching the hero
      const r = e.kind === "hulk" ? 13 : e.kind === "electrode" ? 9 : e.kind === "spheroid" ? 10 : 9;
      if (Math.hypot(e.x - p.x, e.y - p.y) < r + 6) { killPlayer(); return; }
    }
    enemies = enemies.filter((e) => !e.gone);
    for (const s of sparks) {
      s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < AX || s.x > AX + AW) { s.vx = -s.vx; s.x = clamp(s.x, AX, AX + AW); }
      if (s.y < AY || s.y > AY + AH) { s.vy = -s.vy; s.y = clamp(s.y, AY, AY + AH); }
      if (Math.hypot(s.x - p.x, s.y - p.y) < 7) { killPlayer(); return; }
      if (s.t > 3.5) s.gone = true;
    }
    sparks = sparks.filter((s) => !s.gone);
  }
  function updateBullets(dt) {
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < AX || b.x > AX + AW || b.y < AY || b.y > AY + AH) { b.gone = true; continue; }
      for (const e of enemies) {
        if (e.gone || e.appear > 0) continue;
        const r = e.kind === "hulk" ? 13 : e.kind === "spheroid" ? 11 : 9;
        if (Math.hypot(e.x - b.x, e.y - b.y) > r + 3) continue;
        b.gone = true;
        if (e.kind === "hulk") { e.vx += b.vx * 0.35; e.vy += b.vy * 0.35; sfx.thud(); break; }
        e.gone = true;
        const pts = { grunt: 100, electrode: 25, spheroid: 1000, drone: 150 }[e.kind];
        addScore(pts, e.x, e.y - 10, { grunt: "#ff8a8a", electrode: "#bfe6ff", spheroid: "#ff8aff", drone: "#8affff" }[e.kind]);
        burst(e.x, e.y, { grunt: "#ff3a4a", electrode: "#3ae8ff", spheroid: "#ff5aff", drone: "#3ae8ff" }[e.kind], e.kind === "spheroid" ? 24 : 10, 150);
        e.kind === "electrode" ? sfx.zap() : sfx.boom();
        break;
      }
      if (b.gone) continue;
      for (const s of sparks) if (!s.gone && Math.hypot(s.x - b.x, s.y - b.y) < 7) { s.gone = true; b.gone = true; addScore(25); }
    }
    bullets = bullets.filter((b) => !b.gone);
    enemies = enemies.filter((e) => !e.gone);
  }
  function updateHumans(dt) {
    const p = player;
    for (const h of humans) {
      h.t += dt;
      if (Math.random() < dt * 0.6) h.dir += rnd(-1.5, 1.5);
      h.x += Math.cos(h.dir) * 22 * dt; h.y += Math.sin(h.dir) * 22 * dt;
      if (h.x < AX + 8 || h.x > AX + AW - 8) { h.dir = Math.PI - h.dir; h.x = clamp(h.x, AX + 8, AX + AW - 8); }
      if (h.y < AY + 10 || h.y > AY + AH - 10) { h.dir = -h.dir; h.y = clamp(h.y, AY + 10, AY + AH - 10); }
      if (Math.hypot(h.x - p.x, h.y - p.y) < 12) {
        rescued++;
        const pts = Math.min(5000, rescued * 1000);
        addScore(pts, h.x, h.y - 14, "#ffe03a"); sfx.save(Math.min(5, rescued));
        burst(h.x, h.y, h.kind.c, 12, 90);
        h.gone = true; continue;
      }
      // the green giants crush humans
      for (const e of enemies) if (e.kind === "hulk" && e.appear <= 0 && Math.hypot(e.x - h.x, e.y - h.y) < 14) {
        h.gone = true; sfx.lost(); popups.push({ x: h.x, y: h.y - 12, text: "✝", color: "#ff5a6a", t: 0 }); break;
      }
    }
    humans = humans.filter((h) => !h.gone);
  }

  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 2; q.vy *= 1 - dt * 2; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.9));
    if (message) { message.t += dt; if (message.t > 2) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) afterDeath(); return; }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) { wave++; buildWave(); } return; }
    waveT += dt;
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    if (state !== "play") return;
    updateHumans(dt);
    // the wave ends when only the indestructible giants (and electric obstacles) are left
    if (!enemies.some((e) => e.kind === "grunt" || e.kind === "spheroid" || e.kind === "drone")) {
      const bonus = 1000 * (wave + 1) + humans.length * 0;
      addScore(bonus);
      message = { text: `ONDATA ${wave + 1} SUPERATA`, sub: `Umani salvati: ${rescued} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
      sfx.wave();
      state = "clear"; stateT = 2.4;
    }
  }

  // ---------- Drawing ----------
  function drawGrunt(e) {
    const s = Math.sin(e.t * 10) * 2;
    ctx.fillStyle = "#ff3a4a"; ctx.fillRect(e.x - 6, e.y - 7, 12, 10);
    ctx.fillStyle = "#ffe03a"; ctx.fillRect(e.x - 4, e.y - 11, 8, 4);
    ctx.fillStyle = "#3a8aff"; ctx.fillRect(e.x - 3, e.y - 10, 2, 2); ctx.fillRect(e.x + 1, e.y - 10, 2, 2);
    ctx.fillStyle = "#ff3a4a"; ctx.fillRect(e.x - 5, e.y + 3, 3, 5 + s); ctx.fillRect(e.x + 2, e.y + 3, 3, 5 - s);
    ctx.fillStyle = "#ffe03a"; ctx.fillRect(e.x - 9, e.y - 5, 3, 7); ctx.fillRect(e.x + 6, e.y - 5, 3, 7);
  }
  function drawHulk(e) {
    const s = Math.sin(e.t * 7) * 2;
    ctx.fillStyle = "#3aff6a"; ctx.fillRect(e.x - 10, e.y - 10, 20, 16);
    ctx.fillStyle = "#1a8a3a"; ctx.fillRect(e.x - 6, e.y - 15, 12, 6);
    ctx.fillStyle = "#ff3a4a"; ctx.fillRect(e.x - 4, e.y - 13, 3, 2); ctx.fillRect(e.x + 1, e.y - 13, 3, 2);
    ctx.fillStyle = "#3aff6a"; ctx.fillRect(e.x - 14, e.y - 8, 4, 12); ctx.fillRect(e.x + 10, e.y - 8, 4, 12);
    ctx.fillStyle = "#1a8a3a"; ctx.fillRect(e.x - 8, e.y + 6, 6, 7 + s); ctx.fillRect(e.x + 2, e.y + 6, 6, 7 - s);
  }
  function drawElectrode(e) {
    const c = ARENA_COLORS[(wave + 2) % ARENA_COLORS.length], p = 1 + Math.sin(clock * 6 + e.x) * 0.15;
    ctx.save(); ctx.translate(e.x, e.y); ctx.scale(p, p);
    ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.shadowColor = c; ctx.shadowBlur = 6;
    ctx.beginPath();
    if (e.shape === 0) { for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? 3 : 8; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); }
    else if (e.shape === 1) { ctx.rect(-6, -6, 12, 12); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); }
    else if (e.shape === 2) { ctx.moveTo(0, -8); ctx.lineTo(7, 5); ctx.lineTo(-7, 5); ctx.closePath(); }
    else { ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7); }
    ctx.stroke(); ctx.restore();
  }
  function drawHuman(h) {
    const s = Math.sin(h.t * 10) * 2, c = h.kind.c, small = h.kind.name === "bimbo";
    const k = small ? 0.75 : 1;
    ctx.save(); ctx.translate(h.x, h.y); ctx.scale(k, k);
    ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(0, -8, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c; ctx.fillRect(-4, -4, 8, 8);
    if (h.kind.name === "mamma") { ctx.beginPath(); ctx.moveTo(-5, 4); ctx.lineTo(5, 4); ctx.lineTo(6, 8); ctx.lineTo(-6, 8); ctx.fill(); }
    ctx.fillStyle = "#f4f4ff"; ctx.fillRect(-3, 4, 2, 5 + s); ctx.fillRect(1, 4, 2, 5 - s);
    ctx.restore();
    // a little blinking "help!" arrow over their heads
    if (Math.floor(clock * 3 + h.x) % 3 === 0) { ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "700 8px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("AIUTO!", h.x, h.y - 15); }
  }
  function drawPlayer() {
    const p = player;
    if (p.dead || (p.inv > 0 && Math.floor(clock * 14) % 2)) return;
    const s = Math.sin(p.walk) * 2.5;
    ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(p.x, p.y - 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffe03a"; ctx.fillRect(p.x - 5, p.y - 4, 10, 9);
    ctx.fillStyle = "#3ae8ff"; ctx.fillRect(p.x - 4, p.y + 5, 3, 5 + s); ctx.fillRect(p.x + 1, p.y + 5, 3, 5 - s);
    ctx.fillStyle = "#ff3a4a"; ctx.fillRect(p.x - 5, p.y - 12, 10, 3);
    const f = fireInput();
    if (f) { ctx.strokeStyle = "#ffe03a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + f[0] * 11, p.y + f[1] * 11); ctx.stroke(); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    const c = ARENA_COLORS[wave % ARENA_COLORS.length];
    ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = 10; ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.strokeRect(AX, AY, AW, AH); ctx.restore();
    if (!player) return;
    for (const h of humans) drawHuman(h);
    for (const e of enemies) {
      if (e.appear > 0) {
        // materialising: a column of lines coming together
        const k = Math.min(1, e.appear / 0.8);
        ctx.strokeStyle = e.kind === "hulk" ? "#3aff6a" : e.kind === "electrode" ? "#3ae8ff" : "#ff3a4a"; ctx.lineWidth = 1.5;
        ctx.beginPath(); for (let i = -2; i <= 2; i++) { ctx.moveTo(e.x - 8, e.y + i * 4 * (1 + k * 4)); ctx.lineTo(e.x + 8, e.y + i * 4 * (1 + k * 4)); } ctx.stroke();
        continue;
      }
      if (e.kind === "grunt") drawGrunt(e);
      else if (e.kind === "hulk") drawHulk(e);
      else if (e.kind === "electrode") drawElectrode(e);
      else if (e.kind === "spheroid") {
        const r = 8 + Math.sin(clock * 8 + e.x) * 3;
        ctx.strokeStyle = "#ff5aff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#ffe03a"; ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2); ctx.stroke();
      } else if (e.kind === "drone") {
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(clock * 4);
        ctx.fillStyle = "#3ae8ff"; ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(7, 0); ctx.lineTo(0, 8); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillRect(-2, -2, 4, 4); ctx.restore();
      }
    }
    for (const s of sparks) {
      ctx.strokeStyle = Math.floor(clock * 20) % 2 ? "#ffffff" : "#ff5aff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(s.x - 4, s.y - 4); ctx.lineTo(s.x + 4, s.y + 4); ctx.moveTo(s.x + 4, s.y - 4); ctx.lineTo(s.x - 4, s.y + 4); ctx.stroke();
    }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    for (const b of bullets) { const l = Math.hypot(b.vx, b.vy); ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / l * 8, b.y - b.vy / l * 8); ctx.stroke(); }
    if (state !== "menu") drawPlayer();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 22px system-ui, sans-serif" : "800 11px system-ui, sans-serif";
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 15px system-ui, sans-serif"; ctx.fillStyle = "#f4f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 16);
    ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#9a9ac8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 92, 16);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const x = 196 + i * 13; ctx.fillStyle = "#ffe03a"; ctx.fillRect(x - 3, 13, 7, 7); ctx.fillStyle = "#ffcf9e"; ctx.fillRect(x - 2, 8, 5, 5); }
    ctx.textAlign = "center"; ctx.fillStyle = "#ffcf9e"; ctx.font = "800 11px system-ui, sans-serif";
    ctx.fillText(`UMANI ${humans.length}`, 330, 16);
    ctx.textAlign = "right"; ctx.fillStyle = c;
    ctx.fillText(`ONDATA ${wave + 1}`, W - 8, 16);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui, sans-serif"; ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 12;
      ctx.fillText(message.text, W / 2, H / 2 - 10); ctx.shadowBlur = 0;
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#f4f4ff"; ctx.fillText(message.sub, W / 2, H / 2 + 14); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildWave(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

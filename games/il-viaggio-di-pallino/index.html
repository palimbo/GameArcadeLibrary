<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Il Viaggio di Pallino</title>
<style>
  :root {
    --bg: #1a1030;
    --fg: #f4f6ee;
    --muted: #e8d8f0;
    --pink: #ffa83a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk left and right; SALTA jumps (tap it quickly to swim across the water, and again in the air with the magic boots) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 168, 58, 0.9); background: rgba(255, 168, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 168, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 16, 48, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1402; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8681a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GROUND = 300, PR = 12, GRAV = 900, JUMP = 360, SPEED = 150, WATER_Y = GROUND + 8, SINK = GROUND + 46;
  const GHOST_COLS = ["#ff3a3a", "#ff8ad8", "#3ae8ff", "#ffa83a"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 vite · 110 secondi per viaggio · fantasmi più lenti e radi", lives: 4, time: 115, ghost: 0.75, power: 9 },
    normale:   { label: "NORMALE",   color: "#ffa83a", desc: "3 vite · 95 secondi per viaggio", lives: 3, time: 95, ghost: 1.5, power: 7.5 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · 85 secondi · fantasmi svelti e fitti", lives: 3, time: 85, ghost: 1.8, power: 6 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pallino-difficulty";
  const bestKey = (id) => `pallino-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    jump: lim(() => beep(420, 0.12, "square", 0.025, 300)),
    swim: lim(() => beep(rnd(500, 600), 0.06, "triangle", 0.025, -200)),
    spring: lim(() => beep(300, 0.3, "square", 0.035, 900)),
    splash: lim(() => beep(200, 0.2, "sawtooth", 0.03, -120)),
    bump: lim(() => beep(140, 0.08, "triangle", 0.04)),
    item: lim(() => arp([988, 1319], 0.05, 0.08, "square", 0.035)),
    pill: () => arp([523, 659, 784, 1047, 1319], 0.05, 0.1, "square", 0.04),
    eat: lim(() => arp([1568, 1175, 1568, 2093], 0.04, 0.06, "square", 0.04)),
    horn: lim(() => arp([392, 330], 0.08, 0.12, "square", 0.025)),
    goal: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => arp([784, 740, 698, 659, 622, 587, 554, 523, 392], 0.06, 0.08, "square", 0.04),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, round = 1, leg = 0, timeLeft = 95, nextLife = 20000, eatenTotal = 0;
  let me = null, cam = 0, gaps = [], hydrants = [], springs = [], items = [], ghosts = [], spawns = [], parts = [], popups = [], message = null;
  let routeLen = 3000, checkpoint = 60, powerT = 0, eatChain = 0, deadT = 0, goalT = 0;
  let actHeld = false, wasHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The road ----------
  const boots = () => leg === 1;
  function gapAt(x) { for (const g of gaps) if (x > g.x0 && x < g.x1) return g; return null; }
  // the route: stretches of road with hydrants, ditches (some with a springboard), ponds and ghosts waiting
  function buildRoute() {
    gaps = []; hydrants = []; springs = []; items = []; ghosts = []; spawns = [];
    routeLen = 2600 + 300 * Math.min(6, round - 1) + (boots() ? 300 : 0);
    let x = 420;
    const g = diff.ghost * (1 + 0.3 * (round - 1) + (boots() ? 0.15 : 0));
    while (x < routeLen - 300) {
      const k = Math.random();
      if (k < 0.2) { hydrants.push({ x, w: 18, h: 24, bonus: Math.random() < 0.45 ? (Math.random() < 0.5 ? "pill" : "fruit") : null }); x += 160; }
      else if (k < 0.36) { const w = rnd(48, 72); gaps.push({ x0: x, x1: x + w, kind: "pit" }); x += w + 150; }
      else if (k < 0.5) { const w = rnd(150, 200); gaps.push({ x0: x, x1: x + w, kind: "pit" }); springs.push({ x: x + w / 2 }); x += w + 160; }
      else if (k < 0.58) { const w = rnd(150, 240); gaps.push({ x0: x, x1: x + w, kind: "water" }); x += w + 170; }
      else {
        // a stretch of open road where the ghosts come
        const r = Math.random(), type = r < 0.4 ? "walker" : r < 0.7 ? "car" : "plane";
        spawns.push({ x, type, n: type === "walker" ? (Math.random() < 0.5 * g ? 2 : 1) + (Math.random() < 0.2 * g ? 1 : 0) : 1 });
        x += 220 / Math.min(1.4, g);
      }
      if (Math.random() < 0.25) items.push({ x: x - 60, y: GROUND - rnd(50, 90), kind: Math.random() < 0.3 ? "pill" : "fruit" });
    }
    checkpoint = 60;
  }
  function ghostFrom(sp) {
    const col = GHOST_COLS[Math.floor(Math.random() * 4)], g = diff.ghost * (1 + 0.2 * (round - 1));
    const out = [];
    for (let i = 0; i < sp.n; i++) {
      if (sp.type === "walker") out.push({ kind: "walker", x: sp.x + 200 + i * 90, y: GROUND, vx: -55 * g, vy: 0, hopT: 0.8 + i * 1.3, col });
      else if (sp.type === "car") { out.push({ kind: "car", x: cam + W + 60, y: GROUND, vx: -190 * g, vy: 0, col }); sfx.horn(); }
      else out.push({ kind: "plane", x: cam + W + 60, y: GROUND - 80, y0: GROUND - 80, vx: -80 * g, vy: 0, t: 0, dropT: rnd(1, 2), col });
    }
    return out;
  }

  // the ghosts move the same way in the game and in the bot's look-ahead: walkers hop on a steady beat
  function stepGhost(gh, dt) {
    if (gh.kind === "walker") {
      gh.hopT -= dt;
      if (gh.hopT <= 0 && gh.vy === 0 && gh.y >= GROUND) { gh.vy = -210; gh.hopT = 2.6; }
      gh.vy += GRAV * dt; gh.y += gh.vy * dt;
      if (gh.y >= GROUND) { gh.y = GROUND; gh.vy = 0; }
      const ahead = gh.x + gh.vx * dt;
      if (gapAt(ahead - 14) && gh.y >= GROUND - 1) gh.vx = -gh.vx; else gh.x = ahead;
    } else if (gh.kind === "car") gh.x += gh.vx * dt;
    else { gh.t += dt; gh.x += gh.vx * dt; gh.y = gh.y0 + Math.sin(gh.t * 2) * 16; }
  }
  const HIT = (gh) => (gh.small ? 15 : 19);

  // ---------- Bodies ----------
  // one step of the hero's physics, shared by the game and by the look-ahead the practice bot uses
  function stepBody(b, h, jump, dt) {
    const g = gapAt(b.x);
    const inWater = g && g.kind === "water" && b.y > WATER_Y - 2;
    b.vx += (h * (inWater ? 90 : SPEED) - b.vx) * Math.min(1, dt * (b.ground ? 10 : 4));
    if (jump) {
      if (inWater) { b.vy = -230; b.swims++; }
      else if (b.ground) { b.vy = -JUMP; b.ground = false; b.jumps = 1; }
      else if (boots() && b.vy > -150) { b.vy = -JUMP * 0.85; b.jumps++; }
    }
    b.vy += (inWater ? GRAV * 0.35 : GRAV) * dt;
    if (inWater) b.vy = Math.min(b.vy, 70);
    let nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
    // hydrants are solid: stand on them or bump into their sides
    for (const hy of hydrants) {
      const l = hy.x - hy.w / 2 - PR + 3, r = hy.x + hy.w / 2 + PR - 3, top = GROUND - hy.h;
      if (nx > l && nx < r && ny > top && b.y <= top + 1 && b.vy >= 0) { ny = top; b.vy = 0; b.ground = true; b.on = hy; }
      else if (nx > l && nx < r && ny > top + 2) { nx = b.x < hy.x ? l : r; b.vx = 0; b.bumped = hy; }
    }
    // below the road surface, the walls of a ditch or a pond hold you in: climb out with a jump
    if (b.y > GROUND + 4 && !gapAt(nx)) { nx = b.x; b.vx = 0; }
    const gp = gapAt(nx);
    if (!gp && ny >= GROUND && b.y <= GROUND + 4) { ny = GROUND; b.vy = 0; b.ground = true; b.jumps = 0; }
    else if (!(b.on && Math.abs(ny - (GROUND - b.on.h)) < 0.5 && nx > b.on.x - b.on.w / 2 - PR + 3 && nx < b.on.x + b.on.w / 2 + PR - 3)) { b.ground = false; b.on = null; }
    if (b.ground && b.on) b.jumps = 0;
    // a springboard in a ditch bounces you high
    if (gp && gp.kind === "pit" && b.vy > 0 && b.y <= GROUND && ny >= GROUND) for (const s of springs) if (Math.abs(nx - s.x) < 22) { ny = GROUND; b.vy = -560; b.sprung = true; }
    b.x = nx; b.y = ny;
  }
  const deadly = (b) => b.y > H + 30 || (gapAt(b.x) && gapAt(b.x).kind === "water" && b.y > SINK);
  // the look-ahead: would this plan of moves end badly within the next moments?
  function simulate(plan, T) {
    const b = { x: me.x, y: me.y, vx: me.vx, vy: me.vy, ground: me.ground, on: me.on, jumps: me.jumps, swims: 0 };
    const dt = 1 / 60, gs = ghosts.filter((g) => !g.eaten && Math.abs(g.x - me.x) < 500).map((g) => ({ ...g }));
    for (let t = 0; t < T; t += dt) {
      const step = plan(t, b);
      stepBody(b, step.h, step.jump, dt);
      if (deadly(b)) return { dead: true, t, x: b.x };
      for (const gh of gs) stepGhost(gh, dt);
      if (powerT - t <= 0.3) for (const gh of gs) if (Math.hypot(gh.x - b.x, (gh.y - 10) - (b.y - PR)) < HIT(gh) + 2) return { dead: true, t, x: b.x };
    }
    return { dead: false, x: b.x };
  }

  // ---------- The hero ----------
  function newHero(x) { return { x, y: GROUND, vx: 0, vy: 0, ground: true, on: null, jumps: 0, swims: 0, face: 1, walk: 0, inv: 1.5 }; }
  function updateHero(dt) {
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    const h = Math.abs(mx) > 0.3 ? Math.sign(mx) : 0;
    const press = actHeld && !wasHeld; wasHeld = actHeld;
    const wasGround = me.ground, wasWater = gapAt(me.x) && gapAt(me.x).kind === "water" && me.y > WATER_Y - 2;
    me.bumped = null; me.sprung = false;
    stepBody(me, h, press, dt);
    if (press) { if (wasWater) sfx.swim(); else if (wasGround || boots()) sfx.jump(); }
    if (me.sprung) sfx.spring();
    if (h) { me.face = h; if (me.ground) me.walk += dt * 14; }
    const nowWater = gapAt(me.x) && gapAt(me.x).kind === "water" && me.y > WATER_Y - 2;
    if (nowWater && !wasWater) { sfx.splash(); for (let i = 0; i < 8; i++) parts.push({ x: me.x, y: WATER_Y, vx: rnd(-60, 60), vy: rnd(-120, -40), t: 0, life: 0.5, color: "#a8e8ff" }); }
    // the camera follows, and never scrolls back
    cam = Math.max(cam, me.x - 220); cam = Math.min(cam, routeLen - W + 40);
    if (me.x < cam + PR) { me.x = cam + PR; me.vx = Math.max(0, me.vx); }
    if (me.inv > 0) me.inv -= dt;
    // a hydrant with something inside opens when you push against it
    if (me.bumped && me.bumped.bonus && me.ground) { const hy = me.bumped; items.push({ x: hy.x, y: GROUND - hy.h - 30, kind: hy.bonus, vy: -120 }); hy.bonus = null; sfx.bump(); }
    if (me.x > checkpoint + 700 && me.ground && !gapAt(me.x)) checkpoint = Math.floor(me.x);
    if (deadly(me)) { die(me.y > H ? "CADUTO NEL FOSSO" : "AFFOGATO"); return; }
    if (me.x >= routeLen - 60 && goalT <= 0) reachGoal();
  }

  // ---------- Ghosts ----------
  function updateGhosts(dt) {
    for (const sp of spawns) if (!sp.done && sp.x < cam + W + 40) { sp.done = true; ghosts.push(...ghostFrom(sp)); }
    for (const gh of ghosts) {
      if (gh.eaten) { gh.y -= 140 * dt; gh.x += 60 * dt; continue; }
      stepGhost(gh, dt);
      if (gh.kind === "plane") {
        gh.dropT -= dt;
        if (gh.dropT <= 0 && gh.x < cam + W - 40 && gh.x > cam + 120) { gh.dropT = rnd(2.5, 4); ghosts.push({ kind: "walker", x: gh.x, y: gh.y + 10, vx: -45 * diff.ghost, vy: 0, hopT: 1.8, col: gh.col, small: true }); }
      }
    }
    ghosts = ghosts.filter((g) => g.x > cam - 120 && g.y > TOP - 30 && g.x < cam + W + 900);
    if (me.inv > 0 || deadT > 0) return;
    for (const gh of ghosts) {
      if (gh.eaten) continue;
      if (Math.hypot(gh.x - me.x, (gh.y - 10) - (me.y - PR)) < HIT(gh)) {
        if (powerT > 0) {
          gh.eaten = true; eatenTotal++;
          const pts = [200, 400, 800, 1600][Math.min(3, eatChain)] * (gh.kind === "plane" ? 2 : 1); eatChain++;
          addScore(pts, gh.x, gh.y - 20, "#3ae8ff"); sfx.eat();
        } else { die(gh.kind === "car" ? "INVESTITO!" : "PRESO DA UN FANTASMA"); return; }
      }
    }
  }
  function updateItems(dt) {
    for (const it of items) {
      if (it.vy !== undefined) { it.vy += 300 * dt; it.y += it.vy * dt; if (it.y > GROUND - 40) { it.y = GROUND - 40; it.vy = 0; } }

      ctx.lineWidth = 3; ctx.strokeStyle = "#1a1030"; ctx.strokeText(p.text, p.x - cam, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - cam, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffa83a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a1030"; ctx.strokeText(message.text, W / 2, 110); ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 128); ctx.fillText(message.sub, W / 2, 128); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

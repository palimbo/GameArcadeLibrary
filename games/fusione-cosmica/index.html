<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fusione Cosmica</title>
<style>
  :root {
    --bg: #0a0a1e;
    --fg: #f4f6ee;
    --muted: #c8c8f0;
    --pink: #ffb83a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a3a7a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 10, 30, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a2a0a, 0 0 22px rgba(255,184,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1400; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8741a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the celestial bodies, from the smallest to the Sun: two equal ones that touch fuse into the next
  const BODIES = [
    { name: "Meteorite", r: 8 },
    { name: "Luna", r: 11 },
    { name: "Mercurio", r: 15 },
    { name: "Marte", r: 19 },
    { name: "Venere", r: 24 },
    { name: "Terra", r: 30 },
    { name: "Nettuno", r: 36 },
    { name: "Urano", r: 43 },
    { name: "Saturno", r: 50 },
    { name: "Giove", r: 58 },
    { name: "Sole", r: 68 },
  ];
  const SUN = BODIES.length - 1, COMET = -1, COMET_R = 8;
  const DROP_W = [30, 26, 20, 14, 10];   // how often each of the five smallest bodies comes up
  const COMET_EVERY = 16;                // a comet every so many drops
  const FLOOR = 352, LINE = 92, DROP_Y = 62, CX = 320, G = 900;
  const pointsFor = (lv) => lv * (lv + 1) * 5;   // for creating the body of that level

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "pozzo largo e più tempo sopra la linea", ww: 284, limit: 3.5 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "il pozzo di sempre", ww: 252, limit: 2.5 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "pozzo stretto e linea severa", ww: 226, limit: 1.8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fusione-difficulty";
  const bestKey = (id) => `fusione-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    touchEl.style.display = "none";
    wrapEl.style.paddingBottom = "0";
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, noiseBuf = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q = 1, delay = 0, slide = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const SCALE = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047, 1175];
  const sfx = {
    drop: () => { beep(300, 0.09, "sine", 0.05, -150); noise(0.05, 0.03, 900, 1); },
    // a bell that climbs with the body and with the chain
    merge: (lv, chain) => {
      const f = SCALE[Math.min(SCALE.length - 1, lv + Math.min(3, chain - 1))];
      beep(f, 0.3, "sine", 0.07); beep(f * 2, 0.18, "triangle", 0.03); beep(f * 1.5, 0.22, "sine", 0.025, 0, 0.05);
      noise(0.08, 0.02 + lv * 0.004, 500 + lv * 60, 0.8);
    },
    big: () => arp([523, 659, 784, 1047], 0.07, 0.2, "triangle", 0.05),
    sun: () => { arp([392, 523, 659, 784, 1047, 1319], 0.09, 0.3, "triangle", 0.06); noise(0.9, 0.05, 300, 0.5, 0, 900); },
    nova: () => { noise(1.6, 0.16, 1200, 0.4, 0, -1100); beep(60, 1.4, "sawtooth", 0.1, -30); arp([1047, 1319, 1568, 2093], 0.1, 0.4, "sine", 0.05); },
    comet: () => { noise(0.3, 0.07, 2400, 1.2, 0, -1900); beep(1400, 0.25, "sine", 0.04, -1000); },
    fizz: () => noise(0.2, 0.04, 3000, 2, 0, -1500),
    warn: () => beep(880, 0.07, "square", 0.03),
    end: () => { arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05); noise(1, 0.05, 200, 0.6, 0.2); },
  };

  // ---------- Sprites ----------
  // every body is painted once on its own little canvas (radius 1 = the body), then stamped turned and scaled
  const SPR = 3, SPAN = 1.75;   // sprite resolution and how far a sprite reaches beyond the body (rings, glow)
  const sprites = [];
  function blob(c, x, y, r, col, sx = 1, sy = 1, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, r * sx, r * sy, rot, 0, TAU); c.fill(); }
  function bands(c, list) { for (const [y, h, col] of list) { c.fillStyle = col; c.fillRect(-1.1, y, 2.2, h); } }
  const PAINT = [
    (c) => {   // meteorite
      c.fillStyle = "#8a7a6a"; c.beginPath();
      for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, r = 0.86 + (i % 3) * 0.07; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill(); c.clip();
      blob(c, -0.3, -0.2, 0.25, "#6a5c4e"); blob(c, 0.35, 0.3, 0.2, "#6a5c4e"); blob(c, 0.2, -0.45, 0.13, "#a89886");
    },
    (c) => {   // moon
      blob(c, 0, 0, 1, "#d8d8e4"); c.clip();
      blob(c, -0.35, -0.3, 0.28, "#b4b4c4"); blob(c, 0.4, 0.1, 0.2, "#b4b4c4"); blob(c, -0.1, 0.5, 0.24, "#b4b4c4"); blob(c, 0.3, -0.55, 0.12, "#c4c4d2"); blob(c, -0.6, 0.25, 0.1, "#c4c4d2");
    },
    (c) => {   // Mercury
      blob(c, 0, 0, 1, "#b89878"); c.clip();
      blob(c, 0.3, -0.3, 0.3, "#9a7c5e"); blob(c, -0.4, 0.2, 0.22, "#9a7c5e"); blob(c, 0.15, 0.55, 0.18, "#cdb090"); blob(c, -0.3, -0.55, 0.14, "#cdb090"); blob(c, 0.6, 0.3, 0.1, "#8a6c50");
    },
    (c) => {   // Mars
      blob(c, 0, 0, 1, "#e0603a"); c.clip();
      blob(c, -0.2, 0.1, 0.45, "#b8452a", 1.3, 0.6, 0.3); blob(c, 0.45, -0.3, 0.25, "#c8502e", 1.2, 0.7, -0.4); blob(c, 0.3, 0.6, 0.2, "#f08a5a");
      blob(c, 0, -1, 0.42, "#fff4ea", 1.3, 0.6); blob(c, 0, 1.02, 0.3, "#fff4ea", 1.3, 0.5);
    },
    (c) => {   // Venus
      blob(c, 0, 0, 1, "#f0d488"); c.clip();
      blob(c, -0.2, -0.45, 0.5, "#e2b85e", 1.6, 0.28, 0.2); blob(c, 0.2, 0, 0.5, "#f8e8b0", 1.7, 0.22, -0.15); blob(c, -0.1, 0.45, 0.5, "#dca850", 1.6, 0.25, 0.1); blob(c, 0.3, 0.75, 0.4, "#f8e8b0", 1.3, 0.2, -0.1);
    },
    (c) => {   // Earth
      blob(c, 0, 0, 1, "#2a7ae0"); c.clip();
      blob(c, -0.4, -0.25, 0.4, "#4ab85a", 0.8, 1.1, 0.4); blob(c, -0.25, 0.45, 0.25, "#4ab85a", 0.8, 1.2, -0.3); blob(c, 0.5, 0.05, 0.36, "#5ac86a", 0.9, 1.2, -0.2); blob(c, 0.35, -0.6, 0.2, "#4ab85a", 1.4, 0.7);
      blob(c, 0, -1, 0.3, "#ffffff", 1.4, 0.5); blob(c, 0, 1, 0.3, "#ffffff", 1.5, 0.5);
      c.globalAlpha = 0.75; blob(c, -0.1, -0.05, 0.4, "#ffffff", 1.5, 0.16, 0.2); blob(c, 0.3, 0.55, 0.3, "#ffffff", 1.5, 0.16, -0.15); blob(c, -0.5, 0.7, 0.2, "#ffffff", 1.4, 0.2, 0.3);
    },
    (c) => {   // Neptune
      blob(c, 0, 0, 1, "#3a55e0"); c.clip();
      bands(c, [[-0.6, 0.16, "#4a6af0"], [-0.1, 0.12, "#2e46c8"], [0.4, 0.2, "#4a6af0"]]);
      blob(c, 0.3, 0.1, 0.24, "#22349a", 1.5, 0.8); blob(c, -0.4, -0.35, 0.14, "#c8d8ff", 1.8, 0.5);
    },
    (c) => {   // Uranus
      c.strokeStyle = "rgba(200,255,250,0.7)"; c.lineWidth = 0.05; c.beginPath(); c.ellipse(0, 0, 0.3, 1.4, 0.25, Math.PI * 0.5, Math.PI * 1.5, true); c.stroke();
      c.save(); blob(c, 0, 0, 1, "#7ae0e0"); c.clip();
      bands(c, [[-0.7, 0.2, "#96ecec"], [0.1, 0.22, "#62cfd2"], [0.6, 0.15, "#96ecec"]]); c.restore();
      c.beginPath(); c.ellipse(0, 0, 0.3, 1.4, 0.25, Math.PI * 0.5, Math.PI * 1.5); c.stroke();
    },
    (c) => {   // Saturn
      const ring = (from, to) => { for (const [r, col, lw] of [[1.6, "rgba(232,208,150,0.9)", 0.16], [1.38, "rgba(190,160,104,0.9)", 0.1]]) { c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.ellipse(0, 0, r, r * 0.3, -0.3, from, to); c.stroke(); } };
      ring(Math.PI, TAU);
      c.save(); blob(c, 0, 0, 1, "#e8c878"); c.clip();
      bands(c, [[-0.75, 0.2, "#d8b060"], [-0.3, 0.14, "#f4dc98"], [0.15, 0.2, "#d0a458"], [0.6, 0.14, "#f4dc98"]]); c.restore();
      ring(0, Math.PI);
    },
    (c) => {   // Jupiter
      blob(c, 0, 0, 1, "#e0b888"); c.clip();
      bands(c, [[-0.85, 0.2, "#b88458"], [-0.5, 0.14, "#f0d8b4"], [-0.2, 0.24, "#c0703c"], [0.2, 0.12, "#f0d8b4"], [0.45, 0.22, "#b88458"], [0.8, 0.2, "#d09868"]]);
      blob(c, 0.4, 0.28, 0.2, "#d8482a", 1.5, 0.9); blob(c, 0.4, 0.28, 0.1, "#f07048", 1.5, 0.9);
    },
    (c) => {   // the Sun
      const g = c.createRadialGradient(0, 0, 0.8, 0, 0, 1.6);
      g.addColorStop(0, "rgba(255,200,60,0.7)"); g.addColorStop(1, "rgba(255,120,20,0)");
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1.6, 0, TAU); c.fill();
      c.fillStyle = "#ffa82a"; c.beginPath();
      for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, r = i % 2 ? 1.02 : 1.2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill();
      const s = c.createRadialGradient(-0.2, -0.2, 0.1, 0, 0, 1);
      s.addColorStop(0, "#fffbd0"); s.addColorStop(0.6, "#ffd84a"); s.addColorStop(1, "#ff9a1a");
      c.fillStyle = s; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill(); c.clip();
      blob(c, 0.4, 0.3, 0.2, "rgba(255,140,20,0.6)", 1.4, 0.7, 0.4); blob(c, -0.45, 0.45, 0.14, "rgba(255,140,20,0.6)"); blob(c, -0.3, -0.5, 0.18, "rgba(255,250,220,0.6)", 1.5, 0.6, -0.3);
    },
  ];
  let shade = null;
  function makeSprites() {
    BODIES.forEach((b, lv) => {
      const size = Math.ceil(b.r * 2 * SPAN * SPR), cv = document.createElement("canvas");
      cv.width = cv.height = size;
      const c = cv.getContext("2d");
      c.translate(size / 2, size / 2); c.scale(b.r * SPR, b.r * SPR);
      PAINT[lv](c);
      sprites[lv] = cv;
    });
    // the light: the same for every body, never turning with it
    shade = document.createElement("canvas"); shade.width = shade.height = 128;
    const c = shade.getContext("2d");
    c.beginPath(); c.arc(64, 64, 64, 0, TAU); c.clip();
    const g = c.createRadialGradient(40, 36, 6, 64, 64, 66);
    g.addColorStop(0, "rgba(255,255,255,0.35)"); g.addColorStop(0.35, "rgba(255,255,255,0)"); g.addColorStop(0.75, "rgba(0,0,30,0.12)"); g.addColorStop(1, "rgba(0,0,30,0.55)");
    c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  }
  function drawBody(lv, x, y, r, a = 0) {
    if (lv === COMET) { drawComet(x, y, r, a); return; }
    const s = r * SPAN;
    ctx.save(); ctx.translate(x, y); ctx.rotate(lv === 8 || lv === 7 ? a * 0.15 : a);
    ctx.drawImage(sprites[lv], -s, -s, s * 2, s * 2);
    ctx.restore();
    if (lv !== SUN) ctx.drawImage(shade, x - r, y - r, r * 2, r * 2);
  }
  function drawComet(x, y, r, tail) {
    const g = ctx.createLinearGradient(x, y, x, y - r * 5);
    g.addColorStop(0, "rgba(140,220,255,0.8)"); g.addColorStop(1, "rgba(140,220,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + Math.sin(clock * 9) * 2, y - r * (3 + tail * 2)); ctx.lineTo(x + r, y); ctx.fill();
    const h = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, r);
    h.addColorStop(0, "#ffffff"); h.addColorStop(0.5, "#b8ecff"); h.addColorStop(1, "#4aa8e8");
    ctx.fillStyle = h; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, bodies = [], parts = [], popups = [], rings = [], message = null;
  let cur = 0, next = 0, aimX = CX, cool = 0, drops = 0, chain = 0, bestChain = 0, maxLv = 0, merges = 0, overT = 0, ending = 0, warnT = 0, flash = 0, shake = 0, novas = 0, nextId = 1;
  const keys = { left: false, right: false };
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: TOP + Math.random() * (H - TOP), s: Math.random() < 0.15 ? 1.6 : 1, p: Math.random() * TAU }));
  const isPlaying = () => state === "play";
  const WL = () => CX - diff.ww / 2, WR = () => CX + diff.ww / 2;
  const radiusOf = (lv) => lv === COMET ? COMET_R : BODIES[lv].r;

  function pick() {
    let n = Math.random() * DROP_W.reduce((a, b) => a + b, 0);
    for (let i = 0; i < DROP_W.length; i++) { n -= DROP_W[i]; if (n < 0) return i; }
    return 0;
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; bodies = []; parts = []; popups = []; rings = []; drops = 0; chain = 0; bestChain = 0; maxLv = 0; merges = 0; overT = 0; ending = 0; flash = 0; shake = 0; novas = 0; cool = 0.3;
    cur = pick(); next = pick(); aimX = CX; keys.left = keys.right = false;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    message = { text: "FUSIONE COSMICA", sub: "due corpi uguali si fondono in uno più grande", t: 0, long: true };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }

    drawHud();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); outlined(p.text, clamp(p.x, WL() + 30, WR() - 30), p.y, p.big ? "900 16px system-ui" : "900 12px system-ui", p.col, 4); }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = clamp(((message.long ? 3.2 : 2.4) - message.t) * 2, 0, 1);
      outlined(message.text, CX, 196, "italic 900 26px system-ui", message.col || "#ffb83a", 6);
      if (message.sub) outlined(message.sub, CX, 216, "800 11px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
    if (ending) { ctx.textAlign = "center"; outlined("POZZO PIENO!", CX, 180, "italic 900 30px system-ui", "#ff5a4a", 6); }
    if (flash > 0) { ctx.fillStyle = `rgba(255,250,220,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  makeSprites();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

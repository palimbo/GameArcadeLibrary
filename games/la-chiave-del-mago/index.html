<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>La Chiave del Mago</title>
<style>
  :root {
    --bg: #120a22;
    --fg: #f4f6ee;
    --muted: #d8c8f0;
    --pink: #ffc83a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk, up jumps, down crouches (the wand then aims one block lower); the big MAGIA makes or breaks a block, the small FUOCO throws a fireball */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 200, 58, 0.9); background: rgba(255, 200, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 200, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 10, 34, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8781a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Fuoco">FUOCO</button><button type="button" class="jump hop" aria-label="Magia">MAGIA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const COLS = 15, ROWS = 12, T = 26, MX = (W - COLS * T) / 2, MY = TOP + (H - TOP - ROWS * T) / 2;
  // # stone (no spell moves it) · o magic brick · P wizard · K key · D door · J fire jar · B gem
  // G goblin · F ghost · R dragon · M mirror (more monsters come out of it)
  const LEVELS = [
    ["...............",
     "...............",
     "..........K....",
     ".........ooo...",
     "...............",
     "...oooo........",
     "...............",
     ".........G.....",
     ".......#####...",
     "...............",
     ".P..J.......D..",
     "###############"],
    ["...............",
     ".K..........J..",
     "###.......#####",
     "...............",
     "......ooo......",
     "..M............",
     "#####......G...",
     "..........#####",
     "...............",
     "....ooo........",
     ".P.........#.D.",
     "###############"],
    ["......K........",
     ".....###.......",
     "...............",
     "..F........J...",
     "..........###..",
     "....oooo.......",
     "...............",
     "###.......ooo..",
     "...............",
     ".......G.......",
     ".P...#####...D.",
     "###############"],
    ["...............",
     "..J.........K..",
     "#####.....#####",
     "...............",
     "...............",
     "......ooo......",
     "..R..........G.",
     "#####.....#####",
     "...............",
     "...............",
     ".P..........D..",
     "###############"],
    [".D.............",
     "###............",
     "...............",
     "......oo.....K.",
     "...M.......####",
     "...............",
     "#####..........",
     "......G...J....",
     "....#######....",
     "...............",
     "........F....P.",
     "###############"],
    ["...............",
     ".K.....#.....J.",
     "###....#....###",
     ".......#.......",
     "...R...#...G...",
     "####...#...####",
     ".......o.......",
     ".......o.......",
     "...ooo.#.ooo...",
     "...............",
     ".P.....#.....D.",
     "###############"],
    ["M.............M",
     "...............",
     "....B.....K....",
     "...ooo...###...",
     "...............",
     "#.............#",
     "##...ooooo...##",
     "...............",
     "......F........",
     "..ooo.....ooo..",
     ".P.....J.....D.",
     "###############"],
    ["...............",
     ".R...........J.",
     "####.......####",
     "...............",
     "......#K#......",
     "......###......",
     "...............",
     "..G.......G....",
     "######...######",
     "...............",
     ".P.....M.....D.",
     "###############"],
    [".......K.......",
     "......###......",
     "...............",
     "..F.........F..",
     "...............",
     ".###.......###.",
     "...............",
     "......ooo......",
     "...R.......R...",
     "..###.....###..",
     ".P.....J.....D.",
     "###############"],
    ["D.............M",
     "##.............",
     "...........G...",
     "......ooooooo..",
     "..R............",
     "####...........",
     ".........F.....",
     "....#####......",
     ".J.............",
     "####.....oooo..",
     "............KP.",
     "###############"],
  ];
  const NAMES = ["Il primo incantesimo", "Lo specchio dei goblin", "Il fantasma della torre", "Il drago di guardia", "La porta in alto",
    "Il muro di pietra", "Due specchi", "La chiave murata", "Doppio drago", "L'ultima sala"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 vite · 100 secondi per sala · mostri lenti", lives: 4, time: 100, speed: 0.9, spawn: 1.2 },
    normale:   { label: "NORMALE",   color: "#ffc83a", desc: "3 vite · 80 secondi per sala", lives: 3, time: 80, speed: 1.3, spawn: 0.7 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · 65 secondi per sala · mostri svelti, specchi frequenti", lives: 3, time: 65, speed: 1.5, spawn: 0.55 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "salomone-difficulty";
  const bestKey = (id) => `salomone-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const cx = (c) => MX + c * T + T / 2, cy = (r) => MY + r * T + T / 2;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    step: lim(() => beep(rnd(180, 220), 0.03, "triangle", 0.015)),
    jump: lim(() => beep(300, 0.12, "square", 0.025, 300)),
    make: lim(() => arp([660, 990], 0.04, 0.07, "square", 0.03)),
    unmake: lim(() => arp([990, 660], 0.04, 0.07, "square", 0.03)),
    fizz: lim(() => beep(150, 0.12, "sawtooth", 0.025, -60)),
    bump: lim(() => beep(120, 0.08, "triangle", 0.05)),
    crack: lim(() => beep(rnd(240, 300), 0.1, "sawtooth", 0.03, -150)),
    fire: lim(() => beep(500, 0.2, "sawtooth", 0.025, -300)),
    kill: lim(() => arp([784, 1047, 1319], 0.04, 0.08, "square", 0.035)),
    splat: lim(() => beep(90, 0.2, "sawtooth", 0.05, -40)),
    item: lim(() => arp([1047, 1568], 0.05, 0.08, "square", 0.035)),
    key: () => arp([784, 988, 1175, 1568], 0.07, 0.12, "square", 0.045),
    roar: lim(() => beep(110, 0.3, "sawtooth", 0.03, 60)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, level = 1, timeLeft = 80, nextLife = 20000, killed = 0;
  let grid = [], crack = [], items = [], mirrors = [], enemies = [], shots = [], flames = [], parts = [], popups = [], message = null;
  let dana = null, hasKey = false, doorAt = null, fireballs = 0, deadT = 0, clearT = 0;
  let actHeld = false, wasAct = false, fireHeld = false, wasFire = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The hall ----------
  const map = () => LEVELS[(level - 1) % LEVELS.length];
  const loop = () => Math.floor((level - 1) / LEVELS.length);
  const solid = (c, r) => c < 0 || c >= COLS || r < 0 || r >= ROWS || grid[r][c] > 0;
  const tileAt = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS ? 1 : grid[r][c]);
  const itemAt = (c, r) => items.find((i) => i.c === c && i.r === r && !i.taken);
  const speedK = () => diff.speed * (1 + 0.15 * loop());
  function loadLevel() {
    const m = map();
    grid = []; crack = []; items = []; mirrors = []; enemies = []; shots = []; flames = [];
    hasKey = false;
    for (let r = 0; r < ROWS; r++) {
      grid.push([]); crack.push([]);
      for (let c = 0; c < COLS; c++) {
        const ch = m[r][c];
        grid[r].push(ch === "#" ? 1 : ch === "o" ? 2 : 0); crack[r].push(0);
        if (ch === "P") dana = { c, r, mv: null, facing: c < COLS / 2 ? 1 : -1, air: false, rise: 0, drifted: false, crouch: false, cast: 0, walkT: 0 };
        else if (ch === "K") items.push({ c, r, kind: "key" });
        else if (ch === "D") doorAt = { c, r };
        else if (ch === "J") items.push({ c, r, kind: "jar" });
        else if (ch === "B") items.push({ c, r, kind: "gem" });
        else if (ch === "M") mirrors.push({ c, r, t: 4 + Math.random() * 3, n: 0 });
        else if (ch === "G") enemies.push(goblin(c, r));
        else if (ch === "F") enemies.push(ghost(c, r));
        else if (ch === "R") enemies.push({ kind: "dragon", c, r, mv: null, t: 1, face: 1, fall: 0 });
      }
    }
    timeLeft = diff.time;
  }
  function goblin(c, r) { return { kind: "goblin", c, r, mv: null, dir: Math.random() < 0.5 ? -1 : 1, wait: 0.5, fall: 0 }; }
  function ghost(c, r) { const a = (Math.floor(Math.random() * 4) + 0.5) * Math.PI / 2; return { kind: "ghost", x: cx(c), y: cy(r), vx: Math.cos(a), vy: Math.sin(a) }; }
  const posOf = (e) => e.mv ? { x: cx(e.mv.fc) + (cx(e.mv.tc) - cx(e.mv.fc)) * Math.min(1, e.mv.t / e.mv.dur), y: cy(e.mv.fr) + (cy(e.mv.tr) - cy(e.mv.fr)) * Math.min(1, e.mv.t / e.mv.dur) } : e.kind === "ghost" ? { x: e.x, y: e.y } : { x: cx(e.c), y: cy(e.r) };
  function moveTo(e, c, r, dur, kind) { e.mv = { fc: e.c, fr: e.r, tc: c, tr: r, t: 0, dur, kind }; }
  function advance(e, dt) {
    if (!e.mv) return false;
    e.mv.t += dt;
    if (e.mv.t < e.mv.dur) return false;
    e.c = e.mv.tc; e.r = e.mv.tr; e.mv = null;
    return true;
  }
  const occupied = (c, r) => enemies.some((e) => { if (e.kind === "ghost") return Math.abs(e.x - cx(c)) < T * 0.85 && Math.abs(e.y - cy(r)) < T * 0.85; return (e.c === c && e.r === r) || (e.mv && e.mv.tc === c && e.mv.tr === r); });

  // ---------- The wand ----------
  // the spell lands on the square in front of the wizard, or the one below that when he crouches
  function castSpell() {
    const c = (dana.mv ? dana.mv.tc : dana.c) + dana.facing, r = (dana.mv ? dana.mv.tr : dana.r) + (dana.crouch ? 1 : 0);
    dana.cast = 0.18;
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) { sfx.fizz(); return; }
    if (grid[r][c] === 2) {
      grid[r][c] = 0; crack[r][c] = 0; sfx.unmake(); sparkle(c, r, "#ffc83a");
    } else if (grid[r][c] === 0) {
      const blocked = (dana.c === c && dana.r === r) || (dana.mv && dana.mv.tc === c && dana.mv.tr === r) || itemAt(c, r) || (doorAt.c === c && doorAt.r === r) || occupied(c, r) || mirrors.some((m) => m.c === c && m.r === r);
      if (blocked) { sfx.fizz(); return; }
      grid[r][c] = 2; crack[r][c] = 0; sfx.make(); sparkle(c, r, "#ffffff");
    } else sfx.fizz();
  }
  function sparkle(c, r, color) { for (let i = 0; i < 8; i++) parts.push({ x: cx(c) + rnd(-10, 10), y: cy(r) + rnd(-10, 10), vx: rnd(-40, 40), vy: rnd(-60, 10), t: 0, life: rnd(0.3, 0.5), color }); }
  function bump(c, r) {
    // a head-butt cracks a magic brick; the second one breaks it
    if (tileAt(c, r) === 2) {
      crack[r][c]++;
      if (crack[r][c] >= 2) { grid[r][c] = 0; crack[r][c] = 0; sfx.crack(); for (let i = 0; i < 10; i++) parts.push({ x: cx(c) + rnd(-10, 10), y: cy(r) + rnd(-8, 8), vx: rnd(-80, 80), vy: rnd(-80, 40), t: 0, life: rnd(0.3, 0.6), color: "#c8783a" }); }
      else sfx.bump();
    } else sfx.bump();
  }
  function throwFire() {
    if (fireballs <= 0 || shots.length) return;
    fireballs--;
    const p = posOf(dana);
    shots.push({ x: p.x + dana.facing * 8, y: p.y, vx: dana.facing * 7 * T });
    sfx.fire();
  }

  // ---------- The wizard ----------
  function input() {
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    const my = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    return { h: Math.abs(mx) > 0.3 ? Math.sign(mx) : 0, up: my < -0.5, down: my > 0.5 };
  }
  function arrive() {
    const it = itemAt(dana.c, dana.r);
    if (it) {
      it.taken = true;
      if (it.kind === "key") { hasKey = true; addScore(500); sfx.key(); popups.push({ x: cx(it.c), y: cy(it.r) - 12, text: "LA CHIAVE! +500", color: "#ffd23a", t: 0 }); message = { text: "LA PORTA È APERTA", sub: "corri all'uscita", t: 0 }; }
      else if (it.kind === "jar") { fireballs = Math.min(9, fireballs + 2); addScore(100); sfx.item(); popups.push({ x: cx(it.c), y: cy(it.r) - 12, text: "+2 FUOCO", color: "#ff8a3a", t: 0 }); }

    ctx.fillStyle = "#3a5ad8"; ctx.beginPath(); ctx.moveTo(x - 8, y + 12); ctx.lineTo(x + 8, y + 12); ctx.lineTo(x + 5, y - 2); ctx.lineTo(x - 5, y - 2); ctx.fill();
    ctx.fillStyle = "#f4dcc8"; ctx.beginPath(); ctx.arc(x, y - 5, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(x - 4, y - 3); ctx.lineTo(x + 4, y - 3); ctx.lineTo(x + f * 2, y + 4); ctx.fill();
    ctx.fillStyle = "#2a3ab8"; ctx.beginPath(); ctx.moveTo(x - 7, y - 8); ctx.lineTo(x + 7, y - 8); ctx.lineTo(x - f * 4, y - 20); ctx.fill();
    ctx.fillStyle = "#ffd23a"; ctx.fillRect(x - 1, y - 14, 2, 2);
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x + f * 2 - 0.5, y - 6, 1.5, 1.5);
    const wy = dana.crouch ? y + 6 : y + 1, wx = x + f * (dana.cast > 0 ? 15 : 11);
    ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + f * 4, y + 2); ctx.lineTo(wx, wy); ctx.stroke();
    ctx.fillStyle = dana.cast > 0 ? "#ffffff" : "#ffd23a"; ctx.beginPath(); ctx.arc(wx, wy, dana.cast > 0 ? 3.5 : 2, 0, TAU); ctx.fill();
  }
  function drawEnemy(e) {
    const p = posOf(e), x = p.x, y = p.y;
    if (e.kind === "goblin") {
      const s = Math.sin(clock * 12) * 1.5;
      ctx.fillStyle = "#4aa83a"; ctx.beginPath(); ctx.ellipse(x, y + 2, 8, 10, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#2a6a1a"; ctx.beginPath(); ctx.moveTo(x - 8, y - 6); ctx.lineTo(x - 13, y - 11); ctx.lineTo(x - 5, y - 8); ctx.moveTo(x + 8, y - 6); ctx.lineTo(x + 13, y - 11); ctx.lineTo(x + 5, y - 8); ctx.fill();
      ctx.fillStyle = "#ffe14a"; ctx.fillRect(x - 4 + e.dir, y - 3, 2.5, 2.5); ctx.fillRect(x + 2 + e.dir, y - 3, 2.5, 2.5);
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 6, y + 11 + s * 0.3, 4, 2); ctx.fillRect(x + 2, y + 11 - s * 0.3, 4, 2);
      ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + e.dir * 6, y + 2); ctx.lineTo(x + e.dir * 12, y - 6 + s); ctx.stroke();
    } else if (e.kind === "ghost") {
      const w = Math.sin(clock * 8) * 2;
      ctx.fillStyle = "rgba(240,240,255,0.9)"; ctx.beginPath(); ctx.arc(x, y - 2, 9, Math.PI, 0); ctx.lineTo(x + 9, y + 9); ctx.lineTo(x + 4.5, y + 6 + w); ctx.lineTo(x, y + 9); ctx.lineTo(x - 4.5, y + 6 - w); ctx.lineTo(x - 9, y + 9); ctx.fill();
      ctx.fillStyle = "#1a1a3a"; ctx.beginPath(); ctx.arc(x - 3.5 + e.vx * 1.5, y - 3, 2, 0, TAU); ctx.arc(x + 3.5 + e.vx * 1.5, y - 3, 2, 0, TAU); ctx.fill();
    } else {
      const f = e.face, open = e.t < 0.6 && dana && dana.r === e.r;
      ctx.fillStyle = "#d83a3a"; ctx.beginPath(); ctx.ellipse(x - f * 2, y + 4, 10, 8, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + f * 7, y - 4, 7, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(x - f * 4, y - 4); ctx.lineTo(x - f * 10, y - 12); ctx.lineTo(x - f * 9, y - 2); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x + f * 8, y - 7, 2.5, 2.5);
      if (open) { ctx.fillStyle = `rgba(255,${120 + 100 * Math.sin(clock * 30)},40,0.9)`; ctx.beginPath(); ctx.arc(x + f * 14, y - 3, 4 + 2 * Math.sin(clock * 30), 0, TAU); ctx.fill(); }
    }
  }
  function drawPanels() {
    ctx.textAlign = "center";
    // left: fireballs and the key
    ctx.fillStyle = "#d8c8f0"; ctx.font = "800 10px system-ui"; ctx.fillText("FUOCO", MX / 2, MY + 20);
    for (let i = 0; i < 9; i++) { ctx.fillStyle = i < fireballs ? "#ff8a3a" : "rgba(255,255,255,0.1)"; ctx.beginPath(); ctx.arc(MX / 2 - 24 + (i % 3) * 24, MY + 40 + Math.floor(i / 3) * 22, 7, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#d8c8f0"; ctx.fillText("CHIAVE", MX / 2, MY + 130);
    ctx.fillStyle = hasKey ? "#ffd23a" : "rgba(255,255,255,0.12)"; ctx.font = "900 26px system-ui"; ctx.fillText(hasKey ? "✓" : "?", MX / 2, MY + 162);
    // right: the candle of time
    const x = MX + COLS * T + (W - MX - COLS * T) / 2, h = 220, f = timeLeft / diff.time;
    ctx.fillStyle = "#d8c8f0"; ctx.font = "800 10px system-ui"; ctx.fillText("TEMPO", x, MY + 20);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(x - 9, MY + 30, 18, h);
    ctx.fillStyle = f < 0.25 ? "#ff5a5a" : "#f4ecd8"; ctx.fillRect(x - 9, MY + 30 + h * (1 - f), 18, h * f);
    ctx.fillStyle = "#ffc83a"; ctx.beginPath(); ctx.ellipse(x, MY + 24 + h * (1 - f), 4, 7 + Math.sin(clock * 20), 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "900 14px system-ui"; ctx.fillText(String(Math.ceil(timeLeft)), x, MY + h + 50);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(18,10,34,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#d8c8f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffc83a"; ctx.font = "900 10px system-ui"; ctx.fillText(`SALA ${level}`, x0 + 80, 21);
    ctx.textAlign = "right";
    for (let i = 0; i < Math.min(6, lives); i++) {
      const x = (touchMode ? W - 60 : W - 14) - i * 13, y = 16;
      ctx.fillStyle = "#3a5ad8"; ctx.fillRect(x - 4, y, 8, 6); ctx.fillStyle = "#2a3ab8"; ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x, y - 10); ctx.fill();
    }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!grid.length) loadLevel();
    drawHall();
    for (const e of enemies) drawEnemy(e);
    for (const f of flames) { ctx.fillStyle = "#ff5a1a"; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, TAU); ctx.fill(); }
    for (const s of shots) { ctx.fillStyle = "#ff8a3a"; ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, TAU); ctx.fill(); }
    drawDana();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    drawPanels();
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#120a22"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffc83a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#120a22"; ctx.strokeText(message.text, W / 2, 175); ctx.fillText(message.text, W / 2, 175);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 193); ctx.fillText(message.sub, W / 2, 193); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="salomone-best-" data-kind="score"></script>

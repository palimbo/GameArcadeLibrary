<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pianeta Svelato</title>
<style>
  :root {
    --bg: #04030c;
    --fg: #f0f4ff;
    --muted: #94a0c8;
    --ship: #4dd8ff;
    --laser: #ff5a5a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(77, 216, 255, 0.3), 0 0 24px rgba(77, 216, 255, 0.12); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(240, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch .acts { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: auto; }
  #touch button {
    width: 54px; height: 54px; border-radius: 12px; touch-action: none;
    font: 700 20px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(240, 244, 255, 0.5); background: rgba(240, 244, 255, 0.08);
  }
  #touch button[data-a="draw"] { width: 96px; height: 60px; border-radius: 30px; border-color: rgba(77, 216, 255, 0.9); background: rgba(77, 216, 255, 0.15); font: 700 13px ui-monospace, monospace; }
  #touch button[data-a="fire"] { width: 96px; height: 48px; border-radius: 24px; border-color: rgba(255, 90, 90, 0.5); background: rgba(255, 90, 90, 0.06); font: 700 12px ui-monospace, monospace; opacity: 0.45; }
  #touch button[data-a="fire"].armed { opacity: 1; border-color: rgba(255, 90, 90, 0.95); background: rgba(255, 90, 90, 0.2); }
  #touch.small .pad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  #touch.small button { width: 44px; height: 44px; font-size: 16px; }
  #touch.small button[data-a="draw"] { width: 84px; height: 52px; }
  #touch.small button[data-a="fire"] { width: 84px; height: 42px; }
  #touch button.on { background: rgba(240, 244, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 3, 12, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 9vw, 58px); letter-spacing: 5px; font-weight: 400; background: linear-gradient(90deg, #4dd8ff, #b98cff, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(77,216,255,0.5)); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 400; letter-spacing: 3px; }
  #overlay h2.lose { color: #ff5a8a; }
  #overlay p { max-width: 580px; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.6; font-family: system-ui, sans-serif; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 20px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); font-weight: 400; }
  #overlay .pts i { font-style: normal; font-weight: 700; padding: 0 5px; border-radius: 3px; color: #000; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(240,244,255,0.35); border-radius: 4px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: #4dd8ff; color: #000; background: #4dd8ff; padding: 10px 28px; box-shadow: 0 0 16px rgba(77,216,255,0.55); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Su">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
    <button type="button" data-a="down" aria-label="Giù">▼</button>
  </div>
  <div class="acts">
    <button type="button" data-a="fire" aria-label="Spara col laser">LASER</button>
    <button type="button" data-a="draw" aria-label="Taglia">TAGLIA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const GW = 128, GH = 96, CS = 4;                     // the field: 128×96 cells of 4px
  const FW = GW * CS, FH = GH * CS;
  const OX = 8, OY = 40, W = FW + OX * 2, H = FH + OY + 8;
  const EMPTY = 0, CLAIMED = 1, BORDER = 2, TRAIL = 3;
  const TARGET = 0.8;
  const SPEED_EDGE = 48, SPEED_CUT = 40, SPEED_BACK = 75, CRAWL_SPEED = 24;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // the five planets: the picture hidden under the alien crust, and the boss that guards it
  const PLANETS = [
    { name: "Valle del Tramonto", accent: [255, 90, 160], boss: { name: "Medusa Reale", style: "jelly", c1: "#ff5ad8", c2: "#ffd0f4", eye: "#2a0030" } },
    { name: "Arcipelago Azzurro", accent: [90, 200, 255], boss: { name: "Granchio Corazzato", style: "crab", c1: "#ff7a3a", c2: "#ffd0a0", eye: "#1a0a00" } },
    { name: "Città delle Cupole", accent: [160, 110, 255], boss: { name: "Occhio Supremo", style: "eye", c1: "#7aff5a", c2: "#e8ffe0", eye: "#103000" } },
    { name: "Foresta dei Funghi", accent: [110, 255, 160], boss: { name: "Polpo d'Ombra", style: "jelly", c1: "#9a6aff", c2: "#e0d0ff", eye: "#fff060" } },
    { name: "Distese di Ghiaccio", accent: [120, 230, 255], boss: { name: "Stella Vorace", style: "star", c1: "#5ae8ff", c2: "#e0faff", eye: "#ff3a6a" } },
  ];
  // power-up crates: enclose them in your territory to open them
  const POWERS = {
    L: { name: "LASER", color: "#ff5a5a", dur: 10 },
    V: { name: "VELOCITÀ", color: "#5aff8a", dur: 12 },
    T: { name: "TEMPO FERMO", color: "#5ac8ff", dur: 6 },
    S: { name: "SCUDO", color: "#ffd34d", dur: 10 },
    "+": { name: "VITA EXTRA", color: "#ff8ad8" },
    "?": { name: "MISTERO", color: "#c8a0ff" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · alieni lenti · più tempo", lives: 5, speed: 0.8, fire: 0.6, extra: 0, time: 130 },
    normale:   { label: "NORMALE",   color: "#4dd8ff", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, fire: 1, extra: 1, time: 100 },
    difficile: { label: "DIFFICILE", color: "#ff5a8a", desc: "3 vite · alieni veloci · più nemici", lives: 3, speed: 1.22, fire: 1.35, extra: 2, time: 90 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "svelato-difficulty";
  const bestKey = (id) => `svelato-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const px = (x) => OX + x * CS + 2, py = (y) => OY + y * CS + 2;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  const fireBtn = touchEl.querySelector('[data-a="fire"]');
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const pictureCanvas = mk(FW, FH), crustCanvas = mk(FW, FH), revealCanvas = mk(FW, FH);
  const maskCanvas = mk(GW, GH), edgeCanvas = mk(GW, GH);
  const maskImg = maskCanvas.getContext("2d").createImageData(GW, GH), edgeImg = edgeCanvas.getContext("2d").createImageData(GW, GH);
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(185px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 185;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- The planets' pictures ----------
  function seeded(seed) {
    return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function vgrad(c, y0, y1, stops) {
    const g = c.createLinearGradient(0, y0, 0, y1);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  }
  function ridge(c, base, amp, freq, seed, color) {
    c.fillStyle = color; c.beginPath(); c.moveTo(0, FH);
    for (let x = 0; x <= FW; x += 4) c.lineTo(x, base - amp * (Math.sin(x * freq + seed) * 0.6 + Math.sin(x * freq * 2.3 + seed * 2) * 0.3 + Math.sin(x * freq * 5.1 + seed) * 0.1));
    c.lineTo(FW, FH); c.closePath(); c.fill();
  }
  function disc(c, x, y, r, fill) { c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  function paintPicture(n) {
    const c = pictureCanvas.getContext("2d"), R = seeded(n * 977 + 13);
    c.clearRect(0, 0, FW, FH);
    if (n === 0) {
      // sunset over the mountains and a lake
      c.fillStyle = vgrad(c, 0, 290, [[0, "#2b1055"], [0.45, "#d7385e"], [0.8, "#ff9a3c"], [1, "#ffd56b"]]); c.fillRect(0, 0, FW, 300);
      const sun = c.createRadialGradient(330, 210, 10, 330, 210, 120);
      sun.addColorStop(0, "rgba(255,246,200,1)"); sun.addColorStop(0.4, "rgba(255,180,80,0.6)"); sun.addColorStop(1, "rgba(255,150,60,0)");
      c.fillStyle = sun; c.fillRect(200, 80, 260, 260);
      disc(c, 330, 210, 46, "#ffe7a0");
      for (let k = 0; k < 7; k++) { c.fillStyle = `rgba(255,${150 + k * 10},${190 - k * 8},0.35)`; c.beginPath(); c.ellipse(R() * FW, 40 + R() * 120, 40 + R() * 50, 6 + R() * 6, 0, 0, Math.PI * 2); c.fill(); }
      ridge(c, 240, 70, 0.012, 1, "#7a2a6e");
      ridge(c, 268, 45, 0.019, 4, "#4d1f58");
      ridge(c, 292, 26, 0.03, 7, "#2a1240");
      c.fillStyle = vgrad(c, 290, FH, [[0, "#5a2a7a"], [1, "#160a2a"]]); c.fillRect(0, 296, FW, FH - 296);
      for (let k = 0; k < 12; k++) { c.fillStyle = `rgba(255,214,130,${0.6 - k * 0.045})`; c.fillRect(330 - (46 - k * 3), 302 + k * 7, (46 - k * 3) * 2, 3); }
      for (let k = 0; k < 20; k++) { c.fillStyle = "rgba(255,190,220,0.25)"; c.fillRect(R() * FW, 300 + R() * 80, 10 + R() * 30, 1.5); }
      c.strokeStyle = "#1a0820"; c.lineWidth = 2;
      for (let k = 0; k < 5; k++) { const bx = 80 + k * 26 + R() * 10, by = 70 + R() * 50; c.beginPath(); c.moveTo(bx - 7, by - 3); c.quadraticCurveTo(bx - 3, by - 6, bx, by); c.quadraticCurveTo(bx + 3, by - 6, bx + 7, by - 3); c.stroke(); }
    } else if (n === 1) {
      // islands in a blue sea
      c.fillStyle = vgrad(c, 0, 200, [[0, "#3aa8f0"], [1, "#c8f0ff"]]); c.fillRect(0, 0, FW, 200);
      disc(c, 70, 60, 34, "rgba(255,255,255,0.35)"); disc(c, 70, 60, 26, "#fff8d0");
      disc(c, 420, 50, 16, "#e8f0ff"); disc(c, 455, 80, 9, "#d8e4ff");
      for (let k = 0; k < 6; k++) { c.fillStyle = "rgba(255,255,255,0.8)"; const x = R() * FW, y = 30 + R() * 110; for (let j = 0; j < 4; j++) { c.beginPath(); c.arc(x + j * 16, y + (j % 2) * -6, 14, 0, Math.PI * 2); c.fill(); } }
      c.fillStyle = vgrad(c, 196, FH, [[0, "#2a9ae0"], [1, "#0a2a6a"]]); c.fillRect(0, 196, FW, FH - 196);
      c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1.5;
      for (let k = 0; k < 70; k++) { const x = R() * FW, y = 205 + R() * 175, w = 6 + R() * 10; c.beginPath(); c.arc(x, y, w, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
      const island = (x, y, rx, palms) => {
        c.fillStyle = "rgba(120,230,255,0.5)"; c.beginPath(); c.ellipse(x, y + 6, rx + 18, 22, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#f0d890"; c.beginPath(); c.ellipse(x, y, rx, 22, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#3cb050"; c.beginPath(); c.ellipse(x - 6, y - 10, rx * 0.72, 22, 0, Math.PI, Math.PI * 2); c.fill();
        for (let p = 0; p < palms; p++) {
          const tx = x - rx * 0.5 + p * rx * 0.5, th = 60 + p * 8;
          c.strokeStyle = "#8a5a2a"; c.lineWidth = 6; c.beginPath(); c.moveTo(tx, y - 10); c.quadraticCurveTo(tx + 14, y - th / 2, tx + 6, y - th); c.stroke();
          c.fillStyle = "#1f8a3a";
          for (let l = 0; l < 6; l++) { c.save(); c.translate(tx + 6, y - th); c.rotate(l * Math.PI / 3 + 0.3); c.beginPath(); c.ellipse(16, 0, 18, 5, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
        }
      };
      island(170, 268, 110, 3); island(420, 236, 55, 1);
      c.strokeStyle = "#304060"; c.lineWidth = 2;
      for (let k = 0; k < 4; k++) { const bx = 260 + k * 30, by = 110 + R() * 30; c.beginPath(); c.moveTo(bx - 8, by - 4); c.lineTo(bx, by); c.lineTo(bx + 8, by - 4); c.stroke(); }
    } else if (n === 2) {
      // a city of domes under the stars
      c.fillStyle = vgrad(c, 0, FH, [[0, "#050a2a"], [0.65, "#2a1a5a"], [1, "#6a2a7a"]]); c.fillRect(0, 0, FW, FH);
      for (let k = 0; k < 170; k++) disc(c, R() * FW, R() * 250, R() * 1.4 + 0.3, `rgba(255,255,255,${0.4 + R() * 0.6})`);
      disc(c, 400, 80, 44, "#f0f0ff"); disc(c, 388, 70, 8, "#d0d0e8"); disc(c, 414, 96, 11, "#d0d0e8"); disc(c, 420, 64, 5, "#d0d0e8");
      const glow = c.createLinearGradient(0, 230, 0, FH); glow.addColorStop(0, "rgba(255,80,200,0)"); glow.addColorStop(1, "rgba(255,80,200,0.45)");
      c.fillStyle = glow; c.fillRect(0, 230, FW, FH - 230);
      for (let x = -10; x < FW; x += 26 + R() * 18) {
        const h = 70 + R() * 150, w = 22 + R() * 20;
        c.fillStyle = R() < 0.5 ? "#1a1440" : "#241c56"; c.fillRect(x, FH - h, w, h);
        if (R() < 0.35) { c.fillRect(x + w / 2 - 2, FH - h - 26, 4, 26); disc(c, x + w / 2, FH - h - 28, 3, "#ff5a8a"); }
        for (let wy = FH - h + 8; wy < FH - 8; wy += 10) for (let wx = x + 4; wx < x + w - 5; wx += 7) if (R() < 0.45) { c.fillStyle = R() < 0.8 ? "#ffd86a" : "#7ae8ff"; c.fillRect(wx, wy, 3, 4); }
      }
      for (const [x, r] of [[110, 70], [300, 90], [470, 55]]) {
        const g = c.createRadialGradient(x - r * 0.3, FH - r * 0.6, 4, x, FH, r);
        g.addColorStop(0, "rgba(200,250,255,0.85)"); g.addColorStop(1, "rgba(60,160,255,0.35)");
        c.fillStyle = g; c.beginPath(); c.arc(x, FH, r, Math.PI, Math.PI * 2); c.fill();
        c.strokeStyle = "rgba(200,250,255,0.7)"; c.lineWidth = 2; c.stroke();
        c.lineWidth = 1; for (let a = 1; a < 6; a++) { c.beginPath(); c.moveTo(x, FH - r); c.quadraticCurveTo(x + (a - 3) * r * 0.5, FH - r * 0.5, x + (a - 3) * r * 0.66, FH); c.stroke(); }
      }
    } else if (n === 3) {
      // a forest of giant glowing mushrooms
      c.fillStyle = vgrad(c, 0, FH, [[0, "#1a0a3a"], [0.5, "#5a2a8a"], [1, "#2a8a7a"]]); c.fillRect(0, 0, FW, FH);
      for (let k = 0; k < 60; k++) { const x = R() * FW, y = R() * FH, r = 1 + R() * 2.5; const g = c.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, "rgba(220,255,160,0.9)"); g.addColorStop(1, "rgba(220,255,160,0)"); c.fillStyle = g; c.fillRect(x - r * 4, y - r * 4, r * 8, r * 8); }
      ridge(c, 330, 18, 0.02, 3, "#1a4a3a");
      const caps = ["#ff4a6a", "#ffaa3a", "#6aff9a", "#4ad0ff", "#ff6ad8"];
      const shrooms = [[70, 160, 60], [200, 230, 40], [330, 120, 80], [450, 210, 46], [130, 290, 26], [400, 300, 22], [260, 310, 18]];
      for (const [x, top, r] of shrooms) {
        c.fillStyle = vgrad(c, top, FH, [[0, "#f8ecd8"], [1, "#b8a890"]]); c.fillRect(x - r * 0.22, top, r * 0.44, FH - top);
        c.fillStyle = caps[(x + r) % caps.length]; c.beginPath(); c.ellipse(x, top + 2, r, r * 0.62, 0, Math.PI, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(0,0,0,0.25)"; c.beginPath(); c.ellipse(x, top + 2, r, r * 0.14, 0, 0, Math.PI); c.fill();
        for (let k = 0; k < 6; k++) { const a = Math.PI + R() * Math.PI, d = R() * 0.75; disc(c, x + Math.cos(a) * r * d, top + Math.sin(a) * r * 0.55 * d, 2 + R() * r * 0.1, "rgba(255,255,255,0.85)"); }
      }
      c.fillStyle = "#0e3a2a"; c.fillRect(0, 360, FW, 24);
      c.strokeStyle = "#3aff8a"; c.lineWidth = 1.5;
      for (let x = 0; x < FW; x += 5) { c.beginPath(); c.moveTo(x, 362); c.lineTo(x + R() * 4 - 2, 350 - R() * 12); c.stroke(); }
    } else {
      // ice fields under a ringed planet and the aurora

      ctx.fillStyle = b.eye; ctx.beginPath(); ctx.ellipse(ix, iy, r * 0.1, r * 0.26 * (0.6 + Math.abs(Math.sin(t * 1.3)) * 0.4), 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(ix - r * 0.12, iy - r * 0.14, 2.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.9);
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 1.1);
      g.addColorStop(0, c2); g.addColorStop(1, c1);
      ctx.fillStyle = g; ctx.beginPath();
      for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, rr = k % 2 ? r * 0.55 : r * (1.05 + Math.sin(t * 6 + k) * 0.08); k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#ffffff88"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      ctx.fillStyle = "#101828"; ctx.beginPath(); ctx.arc(x, y, r * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = b.eye; ctx.beginPath(); ctx.arc(x + Math.cos(look) * r * 0.12, y + Math.sin(look) * r * 0.12, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - r * 0.2, y + r * 0.42); for (let k = 1; k <= 4; k++) ctx.lineTo(x - r * 0.2 + k * r * 0.1, y + r * 0.42 + (k % 2 ? 4 : 0)); ctx.stroke();
    }
    ctx.lineCap = "butt";
    // health bar, once the guardian has been hit or the laser is on
    if (b.hp < b.max || active("L")) {
      const w = r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - w / 2, y - r * 1.45, w, 5);
      ctx.fillStyle = "#ff5a5a"; ctx.fillRect(x - w / 2 + 1, y - r * 1.45 + 1, (w - 2) * b.hp / b.max, 3);
    }
  }
  function drawMinion(m) {
    const x = px(m.x), y = py(m.y), r = m.r * CS + 1;
    ctx.save(); ctx.translate(x, y); ctx.rotate(m.spin);
    ctx.fillStyle = `hsla(${m.hue},95%,60%,0.3)`; ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.fill();
    if (m.seeker) {
      ctx.fillStyle = `hsl(${m.hue},95%,58%)`;
      ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = k * Math.PI * 2 / 3; ctx.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2); ctx.lineTo(Math.cos(a + Math.PI / 3) * r * 0.5, Math.sin(a + Math.PI / 3) * r * 0.5); } ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = `hsl(${m.hue},95%,60%)`;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawCrate(c) {
    const P = POWERS[c.k], x = px(c.x), y = py(c.y) + Math.sin(c.t * 3) * 1.5, s = 7;
    ctx.fillStyle = P.color + "40"; ctx.beginPath(); ctx.arc(x, y, 12 + Math.sin(c.t * 4) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - s, y - s, s * 2, s * 2);
    ctx.strokeStyle = P.color; ctx.lineWidth = 2; ctx.strokeRect(x - s, y - s, s * 2, s * 2);
    ctx.fillStyle = P.color; ctx.font = "700 11px ui-monospace, Menlo, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(c.k, x, y + 1);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#04030c"; ctx.fillRect(0, 0, W, H);
    if (!player) return;
    if (dirty) paintField();
    // the crust, pulsing a little, then the uncovered picture and the white edges
    ctx.drawImage(crustCanvas, OX, OY);
    const [ar, ag, ab] = planet().accent;
    ctx.fillStyle = `rgba(${ar},${ag},${ab},${0.04 + Math.sin(clock * 2) * 0.03})`; ctx.fillRect(OX, OY, FW, FH);
    ctx.drawImage(revealCanvas, OX, OY);
    if (state === "clear") { ctx.globalAlpha = clearReveal; ctx.drawImage(pictureCanvas, OX, OY); ctx.globalAlpha = 1; }
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = state === "clear" ? 1 - clearReveal : 1;
    ctx.drawImage(edgeCanvas, OX, OY, FW, FH);
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = true;
    if (state !== "clear") for (const c of crates) drawCrate(c);
    // the cut, glowing
    if (trail.length) {
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(px(player.start.x), py(player.start.y));
      for (const t of trail) ctx.lineTo(px(t.x), py(t.y));
      ctx.strokeStyle = "rgba(77,216,255,0.35)"; ctx.lineWidth = 7; ctx.stroke();
      ctx.strokeStyle = ctl.draw ? "#bff4ff" : "#ff8a5a"; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.lineCap = "butt";
    }
    if (state !== "clear" && boss && !boss.dead) drawBoss();
    for (const m of minions) drawMinion(m);
    for (const s of shots) { ctx.fillStyle = "#ff3a6a"; ctx.beginPath(); ctx.arc(px(s.x), py(s.y), 3.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px(s.x), py(s.y), 1.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    for (const l of lasers) { const n = Math.hypot(l.vx, l.vy); ctx.beginPath(); ctx.moveTo(px(l.x), py(l.y)); ctx.lineTo(px(l.x - l.vx / n * 2.5), py(l.y - l.vy / n * 2.5)); ctx.stroke(); }
    ctx.lineCap = "butt";
    // border crawlers: spiky purple mines that run along the edges
    for (const s of crawlers) {
      const x = px(s.x), y = py(s.y);
      (s.tail || []).forEach(([tx, ty], i) => { ctx.fillStyle = `rgba(200,90,255,${0.45 - i * 0.07})`; ctx.beginPath(); ctx.arc(px(tx), py(ty), 4 - i * 0.5, 0, Math.PI * 2); ctx.fill(); });
      ctx.strokeStyle = "#e05aff"; ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) { const a = clock * 8 + k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); ctx.stroke(); }
      ctx.fillStyle = "#e05aff"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
    }
    if (state !== "menu" && state !== "dead" && state !== "clear") drawShip(px(player.x), py(player.y));
    if (active("T") && state === "play") { ctx.fillStyle = `rgba(90,200,255,${0.08 + Math.sin(clock * 6) * 0.04})`; ctx.fillRect(OX, OY, FW, FH); }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 1.2));
      ctx.textAlign = "center"; ctx.font = q.big ? "700 18px ui-monospace, Menlo, monospace" : "700 14px ui-monospace, Menlo, monospace";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status: score, record, planet, time, percentage towards the target, lives, power-ups
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "700 15px ui-monospace, Menlo, monospace"; ctx.fillStyle = "#f0f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), OX, 14);
    ctx.font = "700 10px ui-monospace, Menlo, monospace"; ctx.fillStyle = "#94a0c8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")} · PIANETA ${level + 1}`, OX + 92, 14);
    const tl = Math.ceil(timeLeft);
    ctx.fillStyle = fury ? (Math.floor(clock * 6) % 2 ? "#ff5a5a" : "#ffd34d") : tl <= 10 ? "#ff8a5a" : "#f0f4ff";
    ctx.font = "700 11px ui-monospace, Menlo, monospace"; ctx.textAlign = "right";
    ctx.fillText(fury ? "⏱ FURIA ALIENA" : `⏱ ${tl}`, W - OX, 32);
    ctx.textAlign = "left";
    const pct = claimed / interior, bx = W - 196, bw = 130;
    ctx.strokeStyle = "#94a0c8"; ctx.lineWidth = 1; ctx.strokeRect(bx, 7, bw, 14);
    ctx.fillStyle = pct >= TARGET ? "#7dff5a" : "#4dd8ff"; ctx.fillRect(bx + 1, 8, (bw - 2) * Math.min(1, pct), 12);
    ctx.fillStyle = "#ffd34d"; ctx.fillRect(bx + bw * TARGET, 4, 2, 20);
    ctx.fillStyle = "#f0f4ff"; ctx.textAlign = "right"; ctx.font = "700 12px ui-monospace, Menlo, monospace";
    ctx.fillText(`${Math.floor(pct * 100)}%`, bx - 5, 14);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) {
      const x = W - 52 + i * 10, y = 14;
      ctx.fillStyle = "#e8f6ff"; ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 4, y + 4); ctx.lineTo(x - 4, y + 4); ctx.closePath(); ctx.fill();
    }
    ctx.textAlign = "left"; ctx.font = "700 10px ui-monospace, Menlo, monospace";
    let chipX = OX;
    for (const kk of ["L", "V", "T", "S"]) {
      if (!active(kk)) continue;
      const P = POWERS[kk], label = `${P.name} ${Math.ceil(power[kk])}`, w = ctx.measureText(label).width + 10;
      ctx.fillStyle = P.color + "33"; ctx.fillRect(chipX, 26, w, 11);
      ctx.fillStyle = P.color; ctx.fillText(label, chipX + 5, 32);
      chipX += w + 6;
    }
    if (chipX === OX) { ctx.fillStyle = "#5a6488"; ctx.fillText(`${planet().name} · guardiano: ${planet().boss.name}`, OX, 32); }
    ctx.textBaseline = "alphabetic";
    fireBtn.classList.toggle("armed", active("L"));
    if (message) {
      const life = message.long ? 3.2 : 2.4;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.fillStyle = "rgba(4,3,12,0.75)"; ctx.fillRect(0, H / 2 - 40, W, message.sub ? 70 : 50);
      ctx.textAlign = "center"; ctx.font = "400 22px ui-monospace, Menlo, monospace"; ctx.fillStyle = "#4dd8ff";
      ctx.fillText(message.text, W / 2, H / 2 - 8);
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#f0f4ff"; ctx.fillText(message.sub, W / 2, H / 2 + 18); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildLevel(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="svelato-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Botte da Strada</title>
<style>
  :root {
    --bg: #140c10;
    --fg: #f4f6ee;
    --muted: #e8c8b8;
    --pink: #ffb03a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a2a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk left and right, up and down along the street; the big PUGNO hits (and picks up weapons), the small SALTO jumps (PUGNO in the air is a flying kick) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 140, 58, 0.6); background: radial-gradient(circle, rgba(255,140,58,0.14), rgba(255,140,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 140, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 140, 58, 0.9); background: rgba(255, 140, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 140, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 12, 16, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a0a, 0 0 22px rgba(255,140,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1002; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a85a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Salto">SALTO</button><button type="button" class="jump hop" aria-label="Pugno">PUGNO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the street: feet move between ZMIN (against the wall) and ZMAX (the front edge)
  const ZMIN = 214, ZMAX = 344, GRAV = 1100;
  // the gang. reach: how far the blow lands · wind: how long the arm is pulled back before it (the warning)
  const FOES = {
    tep:      { name: "TEPPISTA", hp: 30, speed: 72, reach: 30, dmg: 7, wind: 0.34, cool: 1.3, pts: 300, col: "#4a9a4a", hair: "#2a1a0a" },
    mazza:    { name: "MAZZA", hp: 34, speed: 66, reach: 42, dmg: 10, wind: 0.42, cool: 1.5, pts: 400, col: "#c83a3a", hair: "#1a1a1a", weapon: "bat" },
    frusta:   { name: "FRUSTA", hp: 26, speed: 92, reach: 56, dmg: 6, wind: 0.38, cool: 1.3, pts: 400, col: "#9a4ad8", hair: "#ff4ad8", whip: true },
    coltello: { name: "COLTELLO", hp: 28, speed: 70, reach: 30, dmg: 6, wind: 0.5, cool: 2.2, pts: 450, col: "#e8c83a", hair: "#5a3a1a", thrower: true },
    bestione: { name: "BESTIONE", hp: 100, speed: 52, reach: 40, dmg: 15, wind: 0.5, cool: 1.6, pts: 1500, col: "#8a5a3a", hair: null, big: 1.32, heavy: true },
    capo:     { name: "IL CORVO", hp: 170, speed: 96, reach: 34, dmg: 11, wind: 0.3, cool: 0.9, pts: 5000, col: "#2a2a3a", hair: "#0a0a0a", big: 1.12, heavy: true, thrower: true, boss: true },
  };
  // four missions to the gang's hideout; at = where the camera stops for each fight
  const MISSIONS = [
    { name: "IL QUARTIERE", theme: 0, len: 2700, waves: [
      { at: 260, foes: ["tep", "tep"] },
      { at: 860, foes: ["tep", "mazza", "tep"] },
      { at: 1460, foes: ["frusta", "tep", "mazza"] },
      { at: 2060, foes: ["bestione", "tep", "tep"], boss: true }],
      items: [{ k: "crate", x: 700, z: 240 }, { k: "barrel", x: 1260, z: 300 }, { k: "crate", x: 1900, z: 320 }] },
    { name: "LA FABBRICA", theme: 1, len: 3000, waves: [
      { at: 260, foes: ["tep", "coltello", "tep"] },
      { at: 900, foes: ["mazza", "frusta", "tep"] },
      { at: 1540, foes: ["coltello", "mazza", "tep", "frusta"] },
      { at: 2360, foes: ["mazza", "bestione", "mazza"], boss: true }],
      items: [{ k: "barrel", x: 600, z: 320 }, { k: "crate", x: 1300, z: 236 }, { k: "barrel", x: 1950, z: 250 }, { k: "crate", x: 2250, z: 330 }] },
    { name: "IL BOSCO", theme: 2, len: 3000, waves: [
      { at: 260, foes: ["frusta", "frusta", "tep"] },
      { at: 900, foes: ["coltello", "tep", "mazza", "tep"] },
      { at: 1540, foes: ["bestione", "frusta", "coltello"] },
      { at: 2360, foes: ["bestione", "bestione", "tep"], boss: true }],
      items: [{ k: "crate", x: 620, z: 330 }, { k: "barrel", x: 1250, z: 240 }, { k: "crate", x: 2000, z: 300 }, { k: "barrel", x: 2200, z: 330 }] },
    { name: "IL COVO DEI CORVI", theme: 3, len: 2800, waves: [
      { at: 260, foes: ["mazza", "frusta", "coltello", "tep"] },
      { at: 900, foes: ["bestione", "mazza", "frusta"] },
      { at: 1540, foes: ["coltello", "coltello", "tep", "mazza", "tep"] },
      { at: 2160, foes: ["capo", "tep", "frusta"], boss: true }],
      items: [{ k: "barrel", x: 640, z: 250 }, { k: "crate", x: 1250, z: 320 }, { k: "crate", x: 1900, z: 240 }, { k: "barrel", x: 2050, z: 320 }] },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 vite · i Corvi colpiscono piano e ti attaccano uno alla volta", lives: 4, dmg: 0.6, hp: 0.85, wind: 1.3, attackers: 1, food: 55 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "3 vite · i Corvi attaccano in due", lives: 3, dmg: 1.25, hp: 1, wind: 0.9, attackers: 2, food: 35 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · i Corvi picchiano duro, sono più resistenti e attaccano in tre", lives: 3, dmg: 1.6, hp: 1.25, wind: 0.72, attackers: 3, food: 20 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "botte-difficulty";
  const bestKey = (id) => `botte-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let missionLost = false;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };

  let noiseBuf = null;
  function thud(vol = 0.12, freq = 900, dur = 0.08) {
    if (!audioCtx) return;
    if (!noiseBuf) { noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate / 2, audioCtx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    s.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(audioCtx.destination); s.start(t, Math.random() * 0.3, dur + 0.02);
  }
  const sfx = {
    swing: lim(() => thud(0.03, 3000, 0.05)),
    hit: lim(() => { thud(0.16, 700, 0.09); beep(rnd(110, 140), 0.06, "square", 0.03); }),
    heavy: lim(() => { thud(0.22, 400, 0.16); beep(80, 0.12, "sawtooth", 0.04, -30); }),
    hurt: lim(() => { thud(0.18, 600, 0.1); beep(220, 0.14, "sawtooth", 0.03, -120); }),
    jump: lim(() => beep(260, 0.1, "triangle", 0.03, 200)),
    land: lim(() => thud(0.08, 300, 0.06)),
    grab: lim(() => arp([660, 880], 0.04, 0.06, "square", 0.03)),
    throw: lim(() => beep(500, 0.18, "sawtooth", 0.02, -320)),
    crash: lim(() => { thud(0.25, 1500, 0.22); beep(160, 0.2, "sawtooth", 0.03, -100); }),
    eat: lim(() => arp([523, 659, 784, 1047], 0.05, 0.08, "square", 0.035)),
    ko: lim(() => arp([392, 330, 262], 0.06, 0.1, "triangle", 0.04)),
    go: () => arp([784, 988, 784, 988], 0.1, 0.1, "square", 0.035),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, mission = 0, lap = 0, nextLife = 30000, kos = 0;
  let P = null, foes = [], items = [], shots = [], parts = [], popups = [], message = null;
  let camX = 0, waveI = 0, wave = null, goT = 0, clearT = 0, deadT = 0, focus = null, focusT = 0, tokenT = 0, shake = 0, nextId = 1;
  let actHeld = false, wasAct = false, jumpHeld = false, wasJump = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const M = () => MISSIONS[mission];
  const lapK = () => 1 + 0.25 * lap;

  // ---------- Fighters ----------
  function makeFighter(kind, x, z) {
    const F = kind === "player" ? null : FOES[kind];
    const hp = F ? Math.round(F.hp * 1.3 * diff.hp * lapK()) : 100;
    return { id: nextId++, kind, F, x, z, h: 0, vx: 0, vz: 0, vh: 0, face: 1, hp, maxHp: hp, st: "idle", t: 0, atk: null, combo: 0, comboT: 0,
      weapon: F && F.weapon ? F.weapon : null, inv: 0, anim: 0, cd: rnd(0.4, 1.2), token: false, hits: 0, armedHit: false, air: false, side: 1 };
  }
  function addScore(n, x, z, col = "#ffe8a0") {
    score += n;
    if (x !== undefined) popups.push({ x, y: z - 70, text: `+${n}`, col, t: 0 });
    if (score >= nextLife) { lives++; nextLife += 80000; sfx.oneup(); message = { text: "VITA EXTRA!", t: 0 }; }
  }
  function burst(x, y, col, n = 6) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-120, 120), vy: rnd(-160, -20), t: 0, life: rnd(0.25, 0.5), col }); }

  // the blows: what each one reaches and how hard it lands
  const MOVES = {
    jab:   { dur: 0.2, hitAt: 0.07, range: 34, dmg: 5, kd: false, pts: 50 },
    cross: { dur: 0.22, hitAt: 0.08, range: 36, dmg: 6, kd: false, pts: 50 },
    kick:  { dur: 0.34, hitAt: 0.12, range: 44, dmg: 10, kd: true, pts: 100 },
    bat:   { dur: 0.36, hitAt: 0.14, range: 56, dmg: 14, kd: true, pts: 100, armed: true },
    fly:   { dur: 0.4, hitAt: 0.04, range: 42, dmg: 12, kd: true, pts: 150, air: true },
  };
  // a blow by the player: everyone in reach in front of Rocco, at the same depth, takes it
  function landBlow(a) {
    const m = a.m;
    let n = 0;
    for (const e of foes) {
      if (e.st === "dead" || e.st === "down" || e.inv > 0 || a.done.has(e.id)) continue;
      const dx = (e.x - P.x) * P.face, dz = Math.abs(e.z - P.z);
      if (dx > -8 && dx < m.range * (e.F.big || 1) && dz < 15 && e.h < 50 && Math.abs(P.h - e.h) < 50) {
        a.done.add(e.id); n++;
        hitFoe(e, m.dmg, m.kd, P.face, m.armed);
        addScore(m.pts, e.x, e.z);
      }
    }
    for (const it of items) {
      if (it.k !== "crate" || it.gone) continue;
      const dx = (it.x - P.x) * P.face;
      if (dx > -8 && dx < m.range + 6 && Math.abs(it.z - P.z) < 16) breakCrate(it);
    }
    if (n) { a.hitAny = true; (m.kd ? sfx.heavy : sfx.hit)(); shake = Math.max(shake, m.kd ? 0.12 : 0.05); }
    if (n >= 3) impresa("tris");
    return n;
  }
  function hitFoe(e, dmg, kd, dir, armed) {
    e.hp -= dmg; e.hits++;
    if (armed) e.armedHit = true;
    focus = e; focusT = 2.5;
    burst(e.x, e.z - 44 * (e.F.big || 1), "#ffffff", 4);
    e.atk = null;
    if (e.hp <= 0) {
      e.hp = 0; e.st = "dead"; e.t = 0; e.vx = dir * 150; e.vh = 220; e.air = true; e.face = -dir;
      kos++; sfx.ko(); addScore(Math.round(e.F.pts * lapK()), e.x, e.z - 20, "#ffd23a");
      if (e.weapon === "bat") items.push({ k: "bat", x: e.x + dir * 20, z: e.z });
      if (e.kind === "bestione" && !e.armedHit) impresa("mani");
      return;
    }
    // the big ones only go down to kicks and weapons, and take a punch without flinching for long
    if (kd || (!e.F.heavy && e.hits >= 3)) {
      e.st = "down"; e.t = 0; e.vx = dir * 130; e.vh = 200; e.air = true; e.hits = 0; e.face = -dir;
      if (e.weapon === "bat" && Math.random() < 0.5) { items.push({ k: "bat", x: e.x + dir * 24, z: e.z }); e.weapon = null; }
    } else { e.st = "hurt"; e.t = 0; e.hurtT = e.F.heavy ? 0.1 : 0.24; e.x += dir * 4; e.face = -dir; }
  }
  function hurtPlayer(dmg, dir, heavy) {
    if (P.inv > 0 || P.st === "down" || P.st === "dead") return;
    P.hp -= dmg * 1.5 * diff.dmg * (1 + 0.25 * lap); shake = 0.15; sfx.hurt();
    burst(P.x, P.z - 44, "#ff5a5a", 5);
    P.atk = null;
    if (P.hp <= 0 || heavy) {
      P.st = "down"; P.t = 0; P.vx = dir * 140; P.vh = 220; P.air = true; P.face = -dir;
      if (P.weapon) { if (P.weapon !== "barrel") items.push({ k: P.weapon, x: P.x, z: P.z }); P.weapon = null; }
      if (P.hp <= 0) { P.hp = 0; P.st = "dead"; }
    } else { P.st = "hurt"; P.t = 0; P.x += dir * 6; }
  }
  function breakCrate(it) {
    it.gone = true; sfx.crash(); burst(it.x, it.z - 16, "#c8a060", 12);
    const r = Math.random();

        message = { text: "RIALZATI, ROCCO!", sub: `${lives} ${lives === 1 ? "vita rimasta" : "vite rimaste"}`, t: 0 };
        for (const e of foes) if (e.st !== "dead" && Math.abs(e.x - P.x) < 120) { e.st = "down"; e.t = 0; e.vx = Math.sign(e.x - P.x || 1) * 140; e.vh = 160; e.air = true; }
      }
    }
  }

  // ---------- Drawing: the scenery ----------
  function drawScenery() {
    const th = M().theme, cx = camX;
    const sky = [["#2a1a3a", "#c85a3a"], ["#1a1a20", "#2a2a30"], ["#0a1428", "#1a3a3a"], ["#1a0a0a", "#3a1010"]][th];

    if (th === 0) {
      // the skyline far behind, then the brick wall of the street
      ctx.fillStyle = "#2a1a2a";
      for (let i = -1; i < 9; i++) { const x = i * 90 - (cx * 0.3) % 90, h = 40 + ((i + Math.floor(cx * 0.3 / 90)) * 37 % 5) * 12; ctx.fillRect(x, 120 - h, 70, h + 10); }

        ctx.fillStyle = "#6a3424"; ctx.fillRect(x, 96, 300, 110);
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        for (let r = 0; r < 11; r++) for (let c = 0; c < 12; c++) ctx.fillRect(x + c * 26 + (r % 2) * 13, 98 + r * 10, 24, 1);
        if (seg % 3 === 1) { ctx.fillStyle = "#4a4a52"; ctx.fillRect(x + 60, 130, 110, 76); ctx.fillStyle = "#3a3a42"; for (let k = 0; k < 7; k++) ctx.fillRect(x + 60, 134 + k * 10, 110, 2); }
        else { ctx.fillStyle = "#e8c86a"; ctx.fillRect(x + 50, 116, 34, 30); ctx.fillRect(x + 200, 116, 34, 30); ctx.fillStyle = "#3a2a2a"; ctx.fillRect(x + 66, 116, 2, 30); ctx.fillRect(x + 216, 116, 2, 30); }
        if (seg % 4 === 2) { ctx.save(); ctx.font = "italic 900 26px system-ui"; ctx.fillStyle = "rgba(90,220,255,0.55)"; ctx.fillText("CORVI", x + 190, 186); ctx.restore(); }
      }
      ctx.fillStyle = "#8a8a8a"; ctx.fillRect(0, 200, W, 22);
      ctx.fillStyle = "#3a3a42"; ctx.fillRect(0, 222, W, H - 222);
      ctx.fillStyle = "#e8e0a0"; for (let i = -1; i < 9; i++) ctx.fillRect(i * 90 - cx % 90, 290, 46, 3);
    } else if (th === 1) {
      const off = cx % 160;
      ctx.fillStyle = "#4a4a50"; ctx.fillRect(0, 60, W, 150);
      for (let i = -1; i < 6; i++) {
        const x = i * 160 - off;
        ctx.fillStyle = "#3a3a40"; ctx.fillRect(x, 60, 4, 150);
        ctx.fillStyle = "#5a5a62"; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + 20 + k * 36, 70, 2, 0, TAU); ctx.fill(); }
        ctx.fillStyle = "#7a5a2a"; ctx.fillRect(x + 30, 150, 50, 56); ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.strokeRect(x + 30, 150, 50, 56); ctx.beginPath(); ctx.moveTo(x + 30, 150); ctx.lineTo(x + 80, 206); ctx.stroke();
      }
      ctx.fillStyle = "#8a6a3a"; ctx.fillRect(0, 84, W, 10); ctx.fillStyle = "#6a8aa0"; ctx.fillRect(0, 104, W, 6);
      ctx.fillStyle = "#ffb000"; for (let i = -1; i < 22; i++) ctx.fillRect(i * 32 - cx % 32, 200, 16, 10);
      ctx.fillStyle = "#1a1a1a"; for (let i = -1; i < 22; i++) ctx.fillRect(i * 32 + 16 - cx % 32, 200, 16, 10);
      ctx.fillStyle = "#5a5a58"; ctx.fillRect(0, 210, W, H - 210);
      ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1;
      for (let i = -1; i < 12; i++) { const x = i * 64 - cx % 64; ctx.beginPath(); ctx.moveTo(x, 210); ctx.lineTo(x - 40, H); ctx.stroke(); }
      const glow = ctx.createRadialGradient(W / 2, 40, 10, W / 2, 40, 300); glow.addColorStop(0, "rgba(255,160,60,0.18)"); glow.addColorStop(1, "rgba(255,160,60,0)"); ctx.fillStyle = glow; ctx.fillRect(0, TOP, W, H - TOP);
    } else if (th === 2) {
      ctx.fillStyle = "#e8e8c8"; ctx.beginPath(); ctx.arc(520 - (cx * 0.05) % 60, 70, 18, 0, TAU); ctx.fill();
      for (let layer = 0; layer < 2; layer++) {
        const k = layer ? 0.6 : 0.3, sp = layer ? 110 : 70;
        ctx.fillStyle = layer ? "#0e2a1a" : "#123222";
        for (let i = -1; i < 12; i++) {
          const x = i * sp - (cx * k) % sp, top = 70 + ((i + Math.floor(cx * k / sp)) * 29 % 4) * 14 + layer * 20;
          ctx.beginPath(); ctx.moveTo(x, 210); ctx.lineTo(x + sp * 0.45, top); ctx.lineTo(x + sp * 0.9, 210); ctx.fill();
        }
      }
      ctx.fillStyle = "#3a2a1a"; for (let i = -1; i < 6; i++) { const x = i * 150 - cx % 150; ctx.fillRect(x + 40, 110, 12, 100); ctx.fillStyle = "#1a4a2a"; ctx.beginPath(); ctx.arc(x + 46, 110, 30, 0, TAU); ctx.fill(); ctx.fillStyle = "#3a2a1a"; }
      ctx.fillStyle = "#2a4a22"; ctx.fillRect(0, 198, W, H - 198);
      ctx.fillStyle = "#6a5a3a"; ctx.beginPath(); ctx.moveTo(0, 250); ctx.lineTo(W, 240); ctx.lineTo(W, 320); ctx.lineTo(0, 330); ctx.fill();
      ctx.fillStyle = "#3a6a2a"; for (let i = -1; i < 40; i++) { const x = i * 18 - cx % 18; ctx.fillRect(x, 206 + (i * 7 % 5), 2, 6); }
    } else {
      const off = cx % 200;
      ctx.fillStyle = "#3a1414"; ctx.fillRect(0, 40, W, 170);
      for (let i = -1; i < 5; i++) {
        const x = i * 200 - off;
        ctx.fillStyle = "#2a0e0e"; ctx.fillRect(x, 40, 30, 170);
        ctx.fillStyle = "#8a1a1a"; ctx.fillRect(x + 80, 70, 50, 90); ctx.beginPath(); ctx.moveTo(x + 80, 160); ctx.lineTo(x + 105, 176); ctx.lineTo(x + 130, 160); ctx.fill();
        // the crow on the banner
        ctx.fillStyle = "#0a0a0a"; ctx.beginPath(); ctx.ellipse(x + 105, 112, 12, 8, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 93, 108); ctx.lineTo(x + 80, 96); ctx.lineTo(x + 98, 104); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 117, 108); ctx.lineTo(x + 130, 96); ctx.lineTo(x + 112, 104); ctx.fill();
        const fl = 0.7 + Math.sin(clock * 12 + i) * 0.2;
        ctx.fillStyle = `rgba(255,170,60,${fl})`; ctx.beginPath(); ctx.ellipse(x + 170, 100, 5, 9, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#4a3a2a"; ctx.fillRect(x + 167, 108, 6, 16);
      }
      ctx.fillStyle = "#4a2a1a"; ctx.fillRect(0, 210, W, H - 210);
      ctx.fillStyle = "rgba(0,0,0,0.3)"; for (let r = 0; r < 8; r++) ctx.fillRect(0, 222 + r * 18, W, 1);
      for (let r = 0; r < 8; r++) for (let i = -1; i < 8; i++) ctx.fillRect(i * 100 + (r % 2) * 50 - cx % 100, 222 + r * 18 - 18, 1, 18);
    }
  }

  // ---------- Drawing: the fighters ----------
  // a fighter drawn from its feet up, facing right (mirrored when facing left)
  function drawFighter(f) {
    const isP = f.kind === "player", F = f.F, big = isP ? 1 : F.big || 1;
    const sx = f.x - camX, sy = f.z - f.h;
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(sx, f.z, 16 * big, 5 * big, 0, 0, TAU); ctx.fill();
    if ((f.inv > 0 && Math.floor(clock * 14) % 2) || (f.st === "dead" && f.t > 0.8 && Math.floor(clock * 14) % 2)) return;
    const body = isP ? "#f4f4f0" : F.col, legs = isP ? "#3a5ac8" : f.kind === "bestione" ? "#4a3a2a" : f.kind === "capo" ? "#1a1a24" : "#2a2a3a";
    const skin = f.kind === "bestione" ? "#a86a4a" : "#ffd0a8", hair = isP ? "#6a3a1a" : F.hair;
    ctx.save(); ctx.translate(sx, sy); ctx.scale(f.face * big, big);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const lying = f.st === "down" || f.st === "dead";
    if (lying && !f.air) {
      // flat on the ground
      ctx.strokeStyle = legs; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-32, -3); ctx.stroke();
      ctx.fillStyle = body; ctx.fillRect(-6, -10, 26, 10);
      ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(28, -5, 7, 0, TAU); ctx.fill();
      if (hair) { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(31, -5, 7, -Math.PI / 2, Math.PI / 2); ctx.fill(); }
      ctx.restore(); return;
    }
    const st = f.st, a = f.atk, m = a && a.m;
    let lean = 0, armF = [10, -40], armB = [-8, -38], legF = [6, 0], legB = [-6, 0];
    if (st === "walk" || st === "enter") { const s = Math.sin(f.anim) * 8; legF = [6 + s, 0]; legB = [-6 - s, 0]; armF = [6 - s * 0.6, -36]; armB = [-6 + s * 0.6, -36]; }
    if (st === "atk") {
      const mv = isP ? m : null;
      if (mv === MOVES.kick || (!isP && f.kind === "capo" && f.t > 0.12)) { legF = [30, -30]; legB = [-8, 0]; lean = -6; armF = [6, -44]; }
      else if (mv === MOVES.bat || (!isP && f.weapon === "bat")) { armF = [22, -46]; }
      else armF = [26, -50];
    }
    if (st === "wind") { armF = [-16, -50]; lean = -3; }
    if (st === "throw") armF = [24, -56];
    if (st === "hurt") { lean = -9; armF = [4, -32]; armB = [-14, -40]; }
    if (st === "air" || (lying && f.air)) {
      if (a && m === MOVES.fly) { legF = [30, -18]; legB = [-10, -16]; lean = -8; }
      else { legF = [10, -12]; legB = [-8, -10]; }
      if (lying) lean = -20;
    }
    const hipY = -30, shY = -54;
    // legs
    ctx.strokeStyle = legs; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-3, hipY); ctx.lineTo(legB[0], legB[1]); ctx.moveTo(3, hipY); ctx.lineTo(legF[0], legF[1]); ctx.stroke();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(legB[0] - 4, legB[1] - 3, 9, 4); ctx.fillRect(legF[0] - 4, legF[1] - 3, 9, 4);
    // back arm
    ctx.strokeStyle = skin; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(lean - 4, shY + 2); ctx.lineTo(armB[0] + lean, armB[1]); ctx.stroke();
    // torso
    ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-9, hipY); ctx.lineTo(9, hipY); ctx.lineTo(10 + lean, shY); ctx.lineTo(-10 + lean, shY); ctx.closePath(); ctx.fill();
    if (f.kind === "frusta") { ctx.fillStyle = "#1a1a2a"; ctx.fillRect(-9, hipY - 2, 18, 6); }
    if (isP) { ctx.fillStyle = "#c83a3a"; ctx.fillRect(-9, hipY - 3, 18, 3); }
    if (f.kind === "capo") { ctx.fillStyle = "#c81a1a"; ctx.fillRect(-8 + lean, shY, 16, 6); }
    // head
    const hx = lean, hy = shY - 9;
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 8, 0, TAU); ctx.fill();
    if (hair) {
      ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(hx - 1, hy - 2, 8, Math.PI * 0.95, Math.PI * 2.1); ctx.fill();
      if (f.kind === "frusta") { ctx.fillRect(hx - 9, hy - 2, 5, 14); }
      if (isP) { ctx.beginPath(); ctx.moveTo(hx + 6, hy - 7); ctx.lineTo(hx + 12, hy - 4); ctx.lineTo(hx + 6, hy - 3); ctx.fill(); }
    }
    if (f.kind === "capo") { ctx.fillStyle = "#0a0a0a"; ctx.beginPath(); ctx.moveTo(hx + 4, hy - 1); ctx.lineTo(hx + 15, hy + 2); ctx.lineTo(hx + 4, hy + 4); ctx.fill(); }
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(hx + 3, hy - 2, 2, 2);
    // front arm and what it holds
    ctx.strokeStyle = skin; ctx.lineWidth = 5;
    const ax = armF[0] + lean, ay = armF[1];
    ctx.beginPath(); ctx.moveTo(lean + 4, shY + 2); ctx.lineTo(ax, ay); ctx.stroke();
    if (st === "wind") { ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(clock * 40)})`; ctx.beginPath(); ctx.arc(ax, ay, 5, 0, TAU); ctx.fill(); }
    const w = isP ? f.weapon : f.weapon;
    if (w === "bat") { ctx.strokeStyle = "#c89a5a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + (st === "atk" ? 26 : 8), ay + (st === "atk" ? -4 : -24)); ctx.stroke(); }
    if (w === "knife") { ctx.strokeStyle = "#dde"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 10, ay - 4); ctx.stroke(); }
    if (w === "barrel") { ctx.fillStyle = "#8a5a2a"; ctx.fillRect(-14, shY - 30, 28, 26); ctx.fillStyle = "#4a3a2a"; ctx.fillRect(-14, shY - 24, 28, 3); ctx.fillRect(-14, shY - 12, 28, 3); }
    if (F && F.whip && st === "atk") { ctx.strokeStyle = "#5a2a1a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(ax + 30, ay - 14, ax + 50, ay + 4); ctx.stroke(); }
    if (F && F.whip && st !== "atk") { ctx.strokeStyle = "#5a2a1a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(ax + 6, ay + 14, ax - 2, ay + 22); ctx.stroke(); }
    ctx.restore();
  }
  function drawItem(it) {
    const x = it.x - camX, y = it.z;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, y, 14, 4, 0, 0, TAU); ctx.fill();
    if (it.k === "crate") { ctx.fillStyle = "#a0763a"; ctx.fillRect(x - 15, y - 28, 30, 28); ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.strokeRect(x - 15, y - 28, 30, 28); ctx.beginPath(); ctx.moveTo(x - 15, y - 28); ctx.lineTo(x + 15, y); ctx.moveTo(x + 15, y - 28); ctx.lineTo(x - 15, y); ctx.stroke(); }
    else if (it.k === "barrel") { ctx.fillStyle = "#8a5a2a"; ctx.fillRect(x - 12, y - 30, 24, 30); ctx.fillStyle = "#4a3a2a"; ctx.fillRect(x - 12, y - 24, 24, 3); ctx.fillRect(x - 12, y - 9, 24, 3); }
    else if (it.k === "bat") { ctx.strokeStyle = "#c89a5a"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x - 14, y - 3); ctx.lineTo(x + 14, y - 5); ctx.stroke(); }
    else if (it.k === "knife") { ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, y - 3); ctx.lineTo(x + 8, y - 4); ctx.stroke(); ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 10, y - 3); ctx.lineTo(x - 6, y - 3); ctx.stroke(); }
    else if (it.k === "pizza") { ctx.fillStyle = "#e8b04a"; ctx.beginPath(); ctx.ellipse(x, y - 4, 13, 5, 0, 0, TAU); ctx.fill(); ctx.fillStyle = "#d83a2a"; for (const [a, b] of [[-5, -5], [4, -3], [0, -6]]) { ctx.beginPath(); ctx.arc(x + a, y + b, 2, 0, TAU); ctx.fill(); } }
    if (it.k !== "crate" && it.k !== "barrel" && Math.floor(clock * 3) % 2) { ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(x - 1, y - 18, 2, 6); }
  }
  function drawShot(s) {
    const x = s.x - camX, y = s.z - s.h;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, s.z, 10, 3, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(x, y);
    if (s.k === "barrel") { ctx.rotate(s.spin * Math.sign(s.vx)); ctx.fillStyle = "#8a5a2a"; ctx.fillRect(-12, -14, 24, 28); ctx.fillStyle = "#4a3a2a"; ctx.fillRect(-12, -8, 24, 3); ctx.fillRect(-12, 5, 24, 3); }
    else { ctx.scale(Math.sign(s.vx), 1); ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(8, 0); ctx.stroke(); ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-6, 0); ctx.stroke(); }
    ctx.restore();
  }
  function bar(x, y, w, h, frac, col) {
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(20,12,16,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e8c8b8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 82, 9);
    ctx.fillStyle = "#ffb03a"; ctx.font = "900 9px system-ui"; ctx.fillText(`M${mission + 1 + lap * MISSIONS.length} · ${M().name}`, x0 + 82, 20);
    const bx = touchMode ? 330 : 300;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.fillText("ROCCO", bx, 9);
    bar(bx, 15, 90, 7, P ? P.hp / 100 : 1, P && P.hp < 30 ? "#ff5a3a" : "#7aff7a");
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 10px system-ui"; ctx.fillText(`× ${lives}`, bx + 96, 18);
    if (focus && focusT > 0 && (focus.hp > 0 || focusT > 1.5) && !touchMode) {
      ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.fillText(focus.F.name, 470, 9);
      bar(470, 15, 150, 7, focus.hp / focus.maxHp, "#ff8a3a");
    }
    ctx.textBaseline = "alphabetic";
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#140c10"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) { P = makeFighter("player", 160, 300); items = M().items.map((i) => ({ ...i })); const e = makeFighter("mazza", 420, 280); e.face = -1; foes = [e, Object.assign(makeFighter("tep", 330, 240), { face: -1 })]; }
    if (shake > 0) ctx.translate(rnd(-3, 3), rnd(-3, 3));
    drawScenery();
    // everything on the street, back to front
    const list = [...items.filter((i) => !i.gone).map((i) => ({ z: i.z - (i.k === "crate" || i.k === "barrel" ? 0 : 20), d: () => drawItem(i) })),
      ...foes.map((e) => ({ z: e.z, d: () => drawFighter(e) })), { z: P.z, d: () => drawFighter(P) }, ...shots.map((s) => ({ z: s.z, d: () => drawShot(s) }))];
    list.sort((a, b) => a.z - b.z).forEach((o) => o.d());
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - camX - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); outlined(p.text, p.x - camX, p.y, "900 11px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu") return;
    drawHud();
    if (goT > 0 && Math.floor(goT * 3) % 2) { ctx.textAlign = "right"; outlined("VAI ➜", W - 20, 140, "italic 900 30px system-ui", "#ffd23a", 6); }
    if (message) {
      const lifeT = message.long ? 3 : 2;
      ctx.globalAlpha = Math.min(1, (lifeT - message.t) * 2);
      ctx.textAlign = "center"; outlined(message.text, W / 2, 96, "italic 900 24px system-ui", "#ffb03a", 6);
      if (message.sub) outlined(message.sub, W / 2, 116, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<title>Corridoi di Ferro</title>
<style>
  :root {
    --bg: #0a0809;
    --fg: #f4f6ee;
    --muted: #e8d2c0;
    --pink: #ff8a3a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: forward, back and turn; FUOCO fires, ARMA changes weapon, MAPPA shows the map */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 138, 58, 0.6); background: radial-gradient(circle, rgba(255,138,58,0.14), rgba(255,138,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 138, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 138, 58, 0.9); background: rgba(255, 138, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 138, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 8, 9, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a1a0a, 0 0 22px rgba(255,138,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1002; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8501a; }
  #touch .row2 { display: flex; gap: 10px; pointer-events: none; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>

    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; floorN = 0; loopN = 0;
    hp = 100; armor = 0; ammo = { chiodi: 50, cartucce: 0, celle: 0 }; owned = [true, true, false, false]; weap = 1; keys = [false, false, false, false];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    loadFloor(0); snapshotInv();
    state = "play"; menu = null; overlay.classList.add("hidden");
    syncControls(); last = performance.now();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0, record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    if (document.pointerLockElement) try { document.exitPointerLock(); } catch { /* ignore */ }
    menu = () => showOverlay(
      `<h2 class="lose">FINE DEL TURNO</h2>
       <p>Punteggio: <b>${nf(score)}</b> · arrivata al piano ${floorN + 1}${loopN ? ` del turno ${loopN + 1}` : ""} · ${diff.label}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPROVA</button>`
    );
    menu(); syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; for (const k in keysDown) keysDown[k] = false; fireHeld = false;
      if (document.pointerLockElement) try { document.exitPointerLock(); } catch { /* ignore */ }
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") { state = pausedFrom; overlay.classList.add("hidden"); last = performance.now(); }
    syncControls();
  }
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); gameOver(); });
  function syncControls() { pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none"; resize(); }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => { const d = DIFFICULTIES[id]; return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`; }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CORRIDOI DI FERRO</h1>
       <p>La Base Sette, su Titano, non risponde più. I robot di servizio sono impazziti e una muffa venuta dal sottosuolo li fa marciare; quello che tocca diventa vivo. Sei l'ultima tecnica rimasta: trova le schede d'accesso, apri le porte e raggiungi l'ascensore di ogni piano, giù fino al reattore.</p>
       <div class="pts">
         <span><b>Armi</b></span><span>chiave inglese, sparachiodi; e da qualche parte il fucile a pallini e il lanciaplasma</span>
         <span><b>Porte</b></span><span>si aprono andandoci contro; quelle colorate vogliono la scheda dello stesso colore</span>
         <span><b>Nemici</b></span><span>ronzini volanti, muffoidi che mordono, sentinelle che sparano e il colosso</span>
         <span><b>Bidoni</b></span><span>sparaci da lontano: esplodono, e travolgono chi c'è vicino</span>
         <span><b>Segreti</b></span><span>qualche muro ha una crepa: andandoci contro, si apre</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: avanti, indietro e girarsi · FUOCO per sparare · ARMA per cambiare · MAPPA per la mappa</p>`
         : `<p class="muted help">Frecce o W S per muoverti, ← → per girarti, A D di lato, Maiusc per correre · Spazio o Ctrl per sparare (o clic, col mouse per guardarti intorno) · 1–4 o Q per le armi · M mappa · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SCENDI NELLA BASE</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", arrowright: "right", a: "sl", d: "sr", shift: "run", " ": "fire", control: "fire", f: "fire" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") { if (e.key === "Enter") startGame(); else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]); return; }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (state === "tally") { if ((k === " " || k === "enter") && !e.repeat && tally.t > 1.2) nextFloor(); return; }
    if (KEYMAP[k]) keysDown[KEYMAP[k]] = true;
    if (e.repeat) return;
    if (k >= "1" && k <= "4") selectWeapon(+k - 1);
    else if (k === "q" || k === "tab") nextWeapon();
    else if (k === "m") mapOpen = !mapOpen;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keysDown[KEYMAP[k]] = false; });
  window.addEventListener("blur", () => { for (const k in keysDown) keysDown[k] = false; fireHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  // the mouse: a click captures it to look around (where the browser allows), the button fires
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch") { if (state === "tally" && tally.t > 1.2) nextFloor(); return; }
    if (state === "tally") { if (tally.t > 1.2) nextFloor(); return; }
    if (state !== "play") return;
    if (!document.pointerLockElement && canvas.requestPointerLock) { try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch { /* ignore */ } }
    fireHeld = true; fire();
  });
  window.addEventListener("pointerup", (e) => { if (e.pointerType !== "touch") fireHeld = false; });
  window.addEventListener("mousemove", (e) => { if (document.pointerLockElement === canvas && state === "play") mouseDX += e.movementX || 0; });
  document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement && state === "play") { fireHeld = false; togglePause(); } });
  {
    const hold = (sel, on, off) => { const b = touchEl.querySelector(sel); b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("on"); on(); }); for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { b.classList.remove("on"); if (off) off(); }); };
    hold(".fire", () => { if (state === "tally") { if (tally.t > 1.2) nextFloor(); } else { fireHeld = true; fire(); } }, () => { fireHeld = false; });
    hold(".weap", () => nextWeapon());
    hold(".map", () => { mapOpen = !mapOpen; });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy); if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.18 ? 0 : Math.sign(v) * Math.min(1, (a - 0.18) / 0.55); };
    stick.x = f(dx) * 0.8; stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }
  loadFloor(0); pa = 0.35;
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="corridoi-best-" data-kind="score"></script>

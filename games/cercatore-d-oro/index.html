<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cercatore d'Oro</title>
<style>
  :root {
    --bg: #07070f;
    --fg: #f6f2ff;
    --muted: #a8a0c8;
    --gold: #ffd34d;
    --brick: #c8502a;
    --hero: #6ae8ff;
    --red: #ff4a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2440, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(246, 242, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to move, two buttons to dig */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(106, 232, 255, 0.6); background: radial-gradient(circle, rgba(106,232,255,0.16), rgba(106,232,255,0.05)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(106, 232, 255, 0.5); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick i { position: absolute; font: 900 14px system-ui, sans-serif; font-style: normal; color: rgba(246,242,255,0.35); pointer-events: none; }
  #touch .stick i.on { color: #ffd34d; }
  #touch .stick i[data-d="up"] { left: 50%; top: 6px; transform: translateX(-50%); }
  #touch .stick i[data-d="down"] { left: 50%; bottom: 6px; transform: translateX(-50%); }
  #touch .stick i[data-d="left"] { top: 50%; left: 8px; transform: translateY(-50%); }
  #touch .stick i[data-d="right"] { top: 50%; right: 8px; transform: translateY(-50%); }
  #touch .digs { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch .digs button { width: 76px; height: 76px; border-radius: 50%; touch-action: none; color: var(--fg);
    font: 800 12px system-ui, sans-serif; letter-spacing: 0.5px; line-height: 1.2;
    border: 2px solid rgba(200, 80, 42, 0.9); background: rgba(200, 80, 42, 0.18); }
  #touch .digs button b { display: block; font-size: 20px; }
  #touch .digs button.on { background: rgba(246, 242, 255, 0.4); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .digs button { width: 62px; height: 62px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(7, 7, 15, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 9.5vw, 60px); font-weight: 900; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #a86a0a, 0 0 22px rgba(255,211,77,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(246,242,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a00; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a86a0a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta">
    <i data-d="up">▲</i><i data-d="down">▼</i><i data-d="left">◀</i><i data-d="right">▶</i>
    <div class="knob"></div>
  </div>
  <div class="digs">
    <button type="button" data-a="digL" aria-label="Scava a sinistra"><b>◣</b>SCAVA</button>
    <button type="button" data-a="digR" aria-label="Scava a destra"><b>◢</b>SCAVA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const T = 18, COLS = 28, ROWS = 16, HUD = 24, W = COLS * T, H = HUD + ROWS * T;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const HOLE_TIME = 6.5, TRAP_TIME = 2.6;
  // the levels are described by floors, ladders, ropes and gold; walking rows are 2, 5, 8, 11 and 14
  const LEVELS = [
    { name: "LA MINIERA", floors: [[3, 0, 27], [6, 0, 12], [6, 16, 27], [9, 3, 27], [12, 0, 20], [12, 24, 27]],
      ladders: [[4, 3, 5], [20, 3, 5], [10, 6, 8], [25, 6, 8], [14, 9, 11], [3, 9, 11], [22, 12, 14], [8, 12, 14]],
      ropes: [], gold: [[2, 2], [15, 2], [26, 5], [7, 5], [18, 8], [5, 8], [18, 11], [10, 11], [4, 14], [17, 14]],
      hero: [13, 14], guards: [[1, 2], [26, 8]], exit: [13, 0, 2] },
    { name: "IL PONTE DI CORDA", floors: [[3, 0, 9], [3, 10, 17, "@"], [3, 18, 27], [6, 0, 6], [6, 10, 27], [9, 0, 18], [9, 22, 27], [12, 0, 11], [12, 12, 15, "@"], [12, 16, 27]],
      ladders: [[8, 3, 5], [19, 3, 5], [3, 6, 8], [24, 6, 8], [12, 9, 11], [26, 9, 11], [6, 12, 14], [20, 12, 14]],
      ropes: [[5, 6, 10], [8, 18, 22]], gold: [[1, 2], [14, 2], [26, 2], [15, 5], [1, 5], [20, 8], [5, 8], [13, 11], [27, 11], [2, 14], [24, 14]],
      hero: [14, 14], guards: [[0, 2], [27, 5], [10, 8]], exit: [16, 0, 2] },
    { name: "LA TORRE", floors: [[3, 2, 25], [6, 0, 8], [6, 12, 16], [6, 20, 27], [9, 0, 3, "@"], [9, 4, 27], [12, 4, 23]],
      ladders: [[2, 3, 8], [25, 3, 5], [14, 6, 8], [22, 6, 8], [6, 9, 11], [21, 9, 11], [4, 12, 14], [23, 12, 14]],
      ropes: [[5, 8, 12], [5, 16, 20]], gold: [[3, 2], [24, 2], [13, 2], [13, 5], [26, 5], [1, 8], [26, 8], [12, 11], [19, 11], [1, 14], [26, 14]],
      hero: [14, 14], guards: [[20, 2], [5, 8], [25, 11]], exit: [5, 0, 2] },
    { name: "IL LABIRINTO D'ORO", floors: [[3, 0, 11], [3, 12, 15, "@"], [3, 16, 27], [6, 0, 4], [6, 8, 19], [6, 23, 27], [9, 0, 10], [9, 14, 27], [12, 0, 27]],
      ladders: [[1, 3, 5], [26, 3, 5], [6, 6, 8], [21, 6, 8], [12, 9, 11], [3, 9, 11], [17, 12, 14], [9, 12, 14]],
      ropes: [[8, 10, 14], [5, 19, 23], [5, 4, 8]], gold: [[6, 2], [20, 2], [14, 2], [2, 5], [13, 5], [25, 5], [8, 8], [18, 8], [5, 11], [23, 11], [13, 14], [26, 14]],
      hero: [4, 14], guards: [[26, 2], [1, 8], [20, 11], [14, 5]], exit: [24, 0, 2] },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · guardie lente, buche aperte più a lungo", lives: 5, guard: 2.6, hole: 1.25 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, guard: 3.2, hole: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a4a", desc: "3 vite · guardie veloci, buche che si chiudono presto", lives: 3, guard: 3.8, hole: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "oro-difficulty";
  const bestKey = (id) => `oro-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    gold: lim(() => arp([1319, 1760], 0.05, 0.08, "square", 0.035)),
    dig: lim(() => noise(0.25, 0.2, 700)),
    trap: lim(() => beep(300, 0.2, "square", 0.03, -150)),
    crush: lim(() => { noise(0.3, 0.25, 400); beep(200, 0.25, "sawtooth", 0.035, -120); }),
    fall: lim(() => beep(600, 0.25, "triangle", 0.02, -400)),
    reveal: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.12, "triangle", 0.05),
    die: () => arp([784, 659, 523, 392, 330, 262], 0.1, 0.13, "sawtooth", 0.035),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.13),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    step: lim(() => beep(120, 0.02, "square", 0.012)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 20000;
  let map = [], holes = [], gold = new Set(), hero = null, guards = [], exitCells = [], revealed = false;
  let parts = [], popups = [], message = null, levelT = 0;
  const ctl = { up: false, down: false, left: false, right: false };
  let digPressed = 0;

  const LV = () => LEVELS[level % LEVELS.length];
  const loopN = () => Math.floor(level / LEVELS.length);
  const key = (c, r) => r * COLS + c;
  const cellAt = (c, r) => (c < 0 || c >= COLS || r >= ROWS ? "@" : r < 0 ? "." : map[r][c]);
  const holeAt = (c, r) => holes.find((h) => h.c === c && h.r === r);
  // bricks with a hole dug in them are open until the hole fills up again
  const solid = (c, r) => { const t = cellAt(c, r); return t === "@" || (t === "#" && !holeAt(c, r)); };
  const ladder = (c, r) => cellAt(c, r) === "H";
  const rope = (c, r) => cellAt(c, r) === "-";
  const cx = (c) => c * T + T / 2, cy = (r) => HUD + r * T + T / 2;

  function buildLevel() {
    const lv = LV();
    map = Array.from({ length: ROWS }, () => new Array(COLS).fill("."));
    for (let c = 0; c < COLS; c++) map[ROWS - 1][c] = "@";
    for (const [r, a, b, m] of lv.floors) for (let c = a; c <= b; c++) map[r][c] = m || "#";
    for (const [c, a, b] of lv.ladders) for (let r = a; r <= b; r++) map[r][c] = "H";
    for (const [r, a, b] of lv.ropes) for (let c = a; c <= b; c++) if (map[r][c] === ".") map[r][c] = "-";
    gold = new Set(lv.gold.map(([c, r]) => key(c, r)));
    exitCells = []; for (let r = lv.exit[1]; r <= lv.exit[2]; r++) exitCells.push([lv.exit[0], r]);
    revealed = false; holes = []; levelT = 0;
    resetActors();
    message = { text: `LIVELLO ${level + 1}`, sub: lv.name, t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function makeActor(c, r, speed) { return { c, r, tc: c, tr: r, x: cx(c), y: cy(r), speed, face: 1, moving: false, walk: 0, dir: null }; }
  function resetActors() {
    const lv = LV();
    hero = makeActor(lv.hero[0], lv.hero[1], 5.2 * T);
    hero.dead = false; hero.digT = 0; hero.inv = 1; hero.onCell = heroOnCell;
    const sp = diff.guard * (1 + Math.min(0.35, loopN() * 0.12)) * T;
    guards = lv.guards.map(([c, r], i) => Object.assign(makeActor(c, r, sp * (0.92 + i * 0.05)), { trapped: 0, carry: false, home: [c, r], wait: 1 + i * 0.4, dead: 0, onCell: guardOnCell }));
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f6f2ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 110) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function killHero(why) {
    if (state !== "play" || hero.inv > 0) return;
    lives--; hero.dead = true;
    sfx.die();
    burst(hero.x, hero.y, "#6ae8ff", 16, 130);
    message = { text: why, t: 0 };
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the level starts over, with all its gold back in place
    const lv = LV();
    gold = new Set(lv.gold.map(([c, r]) => key(c, r)));
    revealed = false; holes = [];
    resetActors();
    state = "intro"; stateT = 1;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CERCATORE D'ORO</h1>
       <p>Raccogli tutti i lingotti d'oro correndo su scale e corde, mentre le guardie ti danno la caccia. Non puoi saltare né combattere, ma puoi scavare buche nei mattoni: le guardie ci cadono dentro e restano intrappolate. Preso tutto l'oro compare la scala d'uscita: salila fino in cima!</p>
       <div class="pts">
         <span><b>Lingotto</b></span><span>250</span>
         <span><b>Guardia in trappola</b></span><span>75 · se la buca si richiude su di lei 75 in più</span>

         <span><b>Trucco</b></span><span>una buca ti fa anche scendere al piano di sotto</span>
       </div>
       ${touchMode

  }
  overlay.addEventListener("click", (e) => {

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };

  });

  for (const btn of touchEl.querySelectorAll(".digs button")) {

  }
  // thumb stick: the stronger axis gives the direction, with a small dead zone in the middle

  for (const m of stick.querySelectorAll("i")) marks[m.dataset.d] = m;
  let stickId = null, stickDir = null;
  function stickAt(e) {

    let d = null;
    if (len > max * 0.28) {
      const ax = Math.abs(dx), ay = Math.abs(dy), horiz = stickDir === "left" || stickDir === "right";
      if (stickDir && (horiz ? ax > ay * 0.75 : ay > ax * 0.75)) d = horiz ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      else d = ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    }

    for (const k in DIRS) { ctl[k] = k === d; marks[k].classList.toggle("on", k === d); }

  // ---------- Movement rules (the same for the hero and the guards) ----------
  const trappedGuardAt = (c, r) => guards.some((g) => !g.dead && g.trapped > 0 && g.c === c && g.r === r);
  function supported(a) {
    const { c, r } = a;
    if (r >= ROWS - 1) return true;
    if (ladder(c, r) || rope(c, r)) return true;
    if (a.trapped > 0) return true;

  }
  function canMove(a, d) {

  // ---------- Hero ----------
  function chooseHero(a) {

    return null;

  function heroOnCell(a) {

  function checkReveal() {

  function dig(dir) {

    if (cellAt(c, r) !== "#" || holeAt(c, r)) return;
    if (solid(c, h.r) || ladder(c, h.r) || cellAt(c, h.r) === "H") return;
    if (guards.some((g) => !g.dead && Math.abs(g.x - cx(c)) < T * 0.8 && Math.abs(g.y - cy(h.r)) < T * 0.8)) return;

  // ---------- Guards ----------
  function guardStep(g) {
    // breadth-first search over the cells, using the same moves as the hero; first step towards him
    const start = key(g.c, g.r), goal = key(hero.c, hero.r);

      const moves = !supported(a) ? ["down"] : Object.keys(DIRS).filter((d) => canMove(a, d));
      for (const d of moves) {

  function updateGuards(dt) {

  function update(dt) {

  // ---------- Drawing ----------
  function drawTile(c, r) {

  function drawRunner(a, color, band) {

  function draw() {

      ctx.fillText(message.text, W / 2, H / 2 - 5);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.fillStyle = "#f6f2ff"; ctx.fillText(message.sub, W / 2, H / 2 + 14); }

  // ---------- Loop ----------
  const STEP = 1 / 120;

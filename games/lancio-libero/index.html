<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lancio Libero</title>
<style>
  :root {
    --bg: #0e2238;
    --fg: #f4f6ee;
    --muted: #c8d0dc;
    --gold: #ffd24a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2e3a4e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 26, 36, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #1a3a6a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  #overlay .menuList { display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; max-width: 600px; font-size: 13px; color: var(--muted); }
  #overlay .menuList span { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 4px 9px; }
  #overlay .menuList b { color: var(--gold); }
  #overlay .upgs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button.upg { display: flex; flex-direction: column; gap: 3px; width: 170px; text-align: center; letter-spacing: 0.3px; font-size: 13px; }
  #overlay button.upg span { font-weight: 600; font-size: 12px; color: var(--muted); }
  #overlay button.upg:disabled { opacity: 0.4; cursor: default; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
    #overlay .menuList { font-size: 11px; gap: 4px; }
    #overlay button.upg { width: 150px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const nf = (n) => Math.floor(n).toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "anelli larghi, poco vento, bersaglio grande · quattro paracadute di riserva", ring: 1.3, wind: 0.6, target: 1.3, speed: 0.88, lives: 4, birds: 0.6 },
    normale:   { label: "NORMALE",   color: "#ffd24a", desc: "una bella giornata di lanci · tre paracadute di riserva", ring: 1, wind: 1, target: 1, speed: 1, lives: 3, birds: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "anelli stretti, raffiche forti, bersaglio piccolo", ring: 0.8, wind: 1.35, target: 0.82, speed: 1.1, lives: 3, birds: 1.4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "lancio-difficulty";
  const bestKey = (id) => `lancio-best-${id}`;
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];

  // the eight drop zones
  const JUMPS = [
    { name: "Campagna", sky: ["#5aa8f0", "#cfe8ff"], ground: "#5aa84a", far: "#7ac06a", kind: "fields", wind: 12, rings: 10, birds: 1 },
    { name: "Spiaggia", sky: ["#3a9ae8", "#d8f0ff"], ground: "#f0d89a", far: "#3a9ad8", kind: "beach", wind: 18, rings: 11, birds: 2 },
    { name: "Colline al tramonto", sky: ["#e8784a", "#ffd8a0"], ground: "#9aa04a", far: "#c88a5a", kind: "hills", wind: 22, rings: 12, birds: 2 },
    { name: "Montagna", sky: ["#4a8ad8", "#e8f4ff"], ground: "#f4f8fc", far: "#a8b8d0", kind: "snow", wind: 26, rings: 12, birds: 3 },
    { name: "Città", sky: ["#6a9ad0", "#e0ecf8"], ground: "#8a8a92", far: "#6a7488", kind: "city", wind: 30, rings: 13, birds: 3 },
    { name: "Deserto", sky: ["#e8a84a", "#fff0c8"], ground: "#e8c47a", far: "#d8a85a", kind: "desert", wind: 34, rings: 13, birds: 3 },
    { name: "L'isola", sky: ["#2a8ae0", "#c8ecff"], ground: "#e8d090", far: "#2a8ad0", kind: "island", wind: 38, rings: 14, birds: 4 },
    { name: "Notte di stelle", sky: ["#0a1030", "#2a3a6a"], ground: "#2a4a3a", far: "#1a2a4a", kind: "night", wind: 42, rings: 14, birds: 4 },
  ];
  const START_ALT = 1800, FALL = 62, CANOPY = 19, OPEN_TIME = 1.2, SAFE = 26;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), pauseBtn = document.getElementById("pauseBtn");
  let W = 640, H = 360, portrait = false, pxRatio = 1, PPM = 3, PY = 110, PY0 = 110, OPEN_BTN = null;
  function resize() {
    const wasW = W;
    portrait = window.innerHeight > window.innerWidth * 1.05;
    W = portrait ? 360 : 640; H = portrait ? 640 : 360;
    const s = Math.max(0.2, Math.min((window.innerWidth - 4) / W, (window.innerHeight - 4) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio); canvas.height = Math.round(H * pxRatio);
    PPM = portrait ? 640 / 150 : 360 / 105; PY0 = portrait ? 200 : 104; PY = PY0;
    OPEN_BTN = portrait ? { x: W - 104, y: H - 104, r: 46 } : { x: W - 62, y: H - 62, r: 44 };
    // keep horizontal positions on screen when the orientation changes
    if (wasW !== W && P) { const k = W / wasW; P.x *= k; P.tx *= k; for (const o of [...rings, ...birds, ...stars]) o.x *= k; if (target) target.x *= k; }
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Sound ----------
  let audioCtx = null, windNode = null, windGain = null, windOn = load("lancio-wind") !== "0";
  function tone(freq, dur, type = "square", vol = 0.03, delay = 0, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, freq, vol) { if (!audioCtx) return; const t = audioCtx.currentTime, n = Math.floor(audioCtx.sampleRate * dur), b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(); s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(audioCtx.destination); s.start(t); }
  function startWind() {
    if (!audioCtx || windNode) return;
    const n = audioCtx.sampleRate * 2, b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    windNode = audioCtx.createBufferSource(); windNode.buffer = b; windNode.loop = true;
    const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 500; f.Q.value = 0.6;
    windGain = audioCtx.createGain(); windGain.gain.value = 0;
    windNode.connect(f).connect(windGain).connect(audioCtx.destination); windNode.start();
  }
  const sfx = {
    ring: (c) => { tone(880 + c * 60, 0.12, "triangle", 0.045); tone(1320 + c * 90, 0.16, "triangle", 0.03, 0.05); },
    center: () => [1047, 1319, 1568].forEach((f, i) => tone(f, 0.1, "square", 0.025, i * 0.05)),
    open: () => { noise(0.5, 1800, 0.18); tone(140, 0.4, "sine", 0.08, 0.1, 70); },
    bird: () => { tone(1800, 0.06, "square", 0.03, 0, 2600); tone(2200, 0.06, "square", 0.025, 0.08, 3000); noise(0.15, 1200, 0.1); },
    star: () => tone(1760, 0.08, "triangle", 0.03),
    land: (good) => good ? [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "triangle", 0.04, i * 0.08)) : tone(330, 0.3, "triangle", 0.04),
    crash: () => { noise(0.6, 500, 0.25); tone(110, 0.5, "sawtooth", 0.05, 0, 55); },
    splash: () => { noise(0.8, 2400, 0.18); tone(600, 0.3, "sine", 0.03, 0, 200); },
    beep: () => tone(1400, 0.06, "square", 0.025),
  };

  // ---------- State ----------
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let jump = 0, score = 0, lives = 3, P = null, rings = [], birds = [], stars = [], clouds = [], target = null, fx = [], texts = [];
  let jumpScore = 0, ringsHit = 0, ringsTotal = 0, combo = 0, wind = 0, landed = 0, landInfo = null, keys = {}, pointer = null, beepT = 0;
  const J = () => JUMPS[jump];

  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    startWind();
    jump = 0; score = 0; lives = diff.lives;
    startJump();
  }
  function startJump() {
    const j = J();
    PY = PY0;
    P = { x: W / 2, tx: W / 2, alt: START_ALT, vy: FALL * diff.speed, phase: "free", openT: 0, openAlt: 0, tumble: 0, tilt: 0, swing: 0 };
    wind = j.wind * diff.wind * (Math.random() < 0.5 ? -1 : 1) * (portrait ? 0.75 : 1);
    jumpScore = 0; ringsHit = 0; combo = 0; landed = 0; landInfo = null; fx = []; texts = [];
    // rings from just under the plane down to the opening zone
    rings = []; const n = j.rings; let lastX = W / 2;
    for (let i = 0; i < n; i++) {
      const alt = START_ALT - 140 - i * ((START_ALT - 420) / n) + rnd(-15, 15);
      const r = (portrait ? 34 : 40) * diff.ring * (1 - jump * 0.025);
      let x = clamp(lastX + rnd(-1, 1) * W * (0.25 + jump * 0.03), r + 16, W - r - 16); lastX = x;
      rings.push({ x, alt, r, hit: 0, miss: false });
    }
    ringsTotal = rings.length;
    birds = [];
    const nb = Math.round(j.birds * diff.birds * 2.2);
    for (let i = 0; i < nb; i++) { const dir = Math.random() < 0.5 ? 1 : -1; birds.push({ alt: rnd(260, START_ALT - 250), x: dir > 0 ? -40 - rnd(0, 200) : W + 40 + rnd(0, 200), vx: dir * rnd(40, 80) * (portrait ? 0.7 : 1), n: 1 + Math.floor(Math.random() * 3), hit: false, flap: Math.random() * 6, balloon: jump >= 2 && Math.random() < 0.3 }); }
    for (const b of birds) if (b.balloon) { b.vx *= 0.25; b.x = rnd(40, W - 40); }
    stars = []; for (let i = 0; i < 8; i++) stars.push({ x: rnd(30, W - 30), alt: rnd(40, 420), got: false });
    target = { x: rnd(W * 0.25, W * 0.75), r: (portrait ? 40 : 46) * diff.target * (1 - jump * 0.04) };
    clouds = []; for (let i = 0; i < 14; i++) clouds.push({ x: rnd(-40, W + 40), alt: rnd(300, START_ALT), s: rnd(0.6, 1.4), d: rnd(0.4, 1) });
    state = "intro"; menu = null;
    showOverlay(`<h2>LANCIO ${jump + 1} DI ${JUMPS.length}</h2><p><b>${j.name}</b> · vento ${Math.abs(Math.round(wind / 3))} nodi verso ${wind > 0 ? "destra →" : "← sinistra"}</p>
      <p class="muted">${ringsTotal} anelli in caduta libera, poi apri il paracadute e punta al bersaglio. ${jump === 0 ? "Sotto i 150 metri l'apertura è da brivido (bonus grande), sotto i 60 è troppo tardi!" : ""}</p>
      <button class="start" data-go>SALTA!</button>`);
    syncControls();
  }
  function openChute() {
    if (state !== "play" || P.phase !== "free") return;
    P.phase = "opening"; P.openT = 0; P.openAlt = P.alt; sfx.open();
    const a = P.alt;
    const bonus = a > 800 ? 0 : a > 300 ? Math.round((800 - a) * 0.5) : Math.round(250 + (300 - a) * 2);
    const label = a > 800 ? "apertura prudente" : a > 300 ? "bella apertura" : a > 150 ? "apertura coraggiosa!" : "APERTURA DA BRIVIDO!";
    if (bonus) { jumpScore += bonus; texts.push({ x: P.x, y: PY - 40, text: `${label} +${bonus}`, c: a <= 150 ? "#ff8a5a" : "#fff6a0", t: 0 }); }
    else texts.push({ x: P.x, y: PY - 40, text: label, c: "#e0f0ff", t: 0 });
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const f of fx) f.t += dt; fx = fx.filter((f) => f.t < f.life);
    for (const t of texts) t.t += dt; texts = texts.filter((t) => t.t < 1.6);
    if (windGain && audioCtx) windGain.gain.setTargetAtTime(windOn && state === "play" ? (P.phase === "free" ? 0.05 : 0.015) : 0, audioCtx.currentTime, 0.2);
    if (state !== "play") return;
    if (landed) { landed += dt; if (landed > 2.4) endJump(); return; }
    // steering
    const free = P.phase === "free";
    let dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    const maxV = free ? 190 : 95;
    if (P.tumble > 0) { P.tumble -= dt; dir = 0; }
    else if (pointer) P.tx = clamp(pointer.x, 14, W - 14);
    if (dir) P.tx = clamp(P.x + dir * 60, 14, W - 14);
    const want = P.tumble > 0 ? 0 : clamp((P.tx - P.x) * 4, -maxV, maxV);
    const vx = want + wind * (free ? 0.25 : 1);
    P.x = clamp(P.x + vx * dt, 10, W - 10);
    P.tilt = lerp(P.tilt, clamp(want / maxV, -1, 1), dt * 8);
    // falling
    const prevAlt = P.alt;
    if (P.phase === "opening") { P.openT += dt; P.vy = lerp(FALL * diff.speed, CANOPY, clamp(P.openT / OPEN_TIME, 0, 1)); if (P.openT >= OPEN_TIME) P.phase = "canopy"; }
    else if (P.phase === "canopy") P.vy = CANOPY;
    P.alt -= P.vy * dt; P.swing = Math.sin(clock * 1.6) * (P.phase === "free" ? 0 : 0.08) + (P.phase === "free" ? 0 : -P.tilt * 0.2);
    // rings
    for (const r of rings) {
      if (r.hit || r.miss || !(prevAlt >= r.alt && P.alt < r.alt)) continue;
      const dx = Math.abs(P.x - r.x);
      if (dx < r.r * 0.92 && P.tumble <= 0) {
        combo++; ringsHit++; const centre = dx < r.r * 0.35;
        const pts = 100 + (centre ? 100 : 0) + (combo - 1) * 25; jumpScore += pts; r.hit = 1;
        texts.push({ x: r.x, y: PY - 26, text: `${centre ? "CENTRO! " : ""}+${pts}`, c: centre ? "#ffe060" : "#fff", t: 0 });
        fx.push({ kind: "ring", x: r.x, y: PY, r: r.r, t: 0, life: 0.5 }); centre ? sfx.center() : sfx.ring(Math.min(combo, 8));
      } else { r.miss = true; combo = 0; }
    }
    // birds and balloons
    for (const b of birds) {
      b.x += b.vx * dt; b.flap += dt * 10;
      if (b.hit) continue;
      const by = PY + (P.alt - b.alt) * PPM, w = b.balloon ? 22 : 12 + b.n * 9;
      if (Math.abs(P.x - b.x) < w && Math.abs(by - PY) < (b.balloon ? 26 : 14) + (P.phase === "free" ? 6 : 12)) {
        b.hit = true; P.tumble = free ? 1 : 0.6; combo = 0; jumpScore = Math.max(0, jumpScore - 50); sfx.bird();
        texts.push({ x: P.x, y: PY + 30, text: b.balloon ? "BONK! −50" : "STORMO! −50", c: "#ff9a8a", t: 0 });
        for (let k = 0; k < 8; k++) fx.push({ kind: "feather", x: b.x, y: by, vx: rnd(-60, 60), vy: rnd(-60, 30), t: 0, life: 0.9 });
      }
    }
    // stars, under the canopy
    for (const s of stars) if (!s.got && P.phase !== "free" && Math.abs(P.alt - s.alt) < 5 && Math.abs(P.x - s.x) < 20) { s.got = true; jumpScore += 25; sfx.star(); texts.push({ x: s.x, y: PY - 20, text: "+25", c: "#ffe060", t: 0 }); }
    // altimeter beeps in the last few hundred metres of free fall
    if (free && P.alt < 400) { beepT -= dt; if (beepT <= 0) { sfx.beep(); beepT = P.alt < 150 ? 0.15 : 0.4; } }
    // the camera slides up near the ground so the landing zone stays in view
    PY = P.phase === "free" ? PY0 : lerp(PY0, H * 0.66, clamp((80 - P.alt) / 80, 0, 1));
    // the ground
    if (P.alt <= 0) touchDown();
  }
  function touchDown() {
    P.alt = 0;
    const j = J(), dx = Math.abs(P.x - target.x), r = target.r;
    const water = (j.kind === "beach" && P.x > W * 0.86) || (j.kind === "island" && dx > r * 2.4);
    if (P.phase === "free" || (P.phase === "opening" && P.vy > SAFE)) {
      lives--; sfx.crash(); landInfo = { crash: true }; jumpScore = Math.round(jumpScore / 2);
      texts.push({ x: P.x, y: PY - 50, text: "TROPPO TARDI!", c: "#ff6a5a", t: 0 });
      for (let k = 0; k < 18; k++) fx.push({ kind: "dust", x: P.x, y: PY + 10, vx: rnd(-120, 120), vy: rnd(-140, -20), t: 0, life: 1 });
    } else if (water) {
      sfx.splash(); landInfo = { water: true, pts: 0 };
      texts.push({ x: P.x, y: PY - 50, text: "SPLASH! In acqua", c: "#a0e0ff", t: 0 });
      for (let k = 0; k < 18; k++) fx.push({ kind: "drop", x: P.x, y: PY + 12, vx: rnd(-80, 80), vy: rnd(-160, -40), t: 0, life: 1 });
    } else {
      const pts = dx < r * 0.25 ? 500 : dx < r * 0.55 ? 300 : dx < r ? 150 : dx < r * 2 ? 50 : 0;
      jumpScore += pts; landInfo = { pts, bull: dx < r * 0.25 };
      sfx.land(pts >= 150);
      texts.push({ x: P.x, y: PY - 50, text: pts >= 500 ? "CENTRO PERFETTO! +500" : pts ? `+${pts}` : "fuori bersaglio", c: pts >= 300 ? "#ffe060" : "#fff", t: 0 });
      if (landInfo.bull) feat("centro");
      if (P.openAlt <= 120 && pts > 0) feat("brivido");

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pinza Fortunata</title>
<style>
  :root {
    --bg: #1a0a24;
    --fg: #f4f6ee;
    --muted: #e8c8f0;
    --pink: #ff7ac8;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: slide the crane left and right; PRENDI drops the claw */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 122, 200, 0.9); background: rgba(255, 122, 200, 0.22); }
  #touch .jump.on { background: rgba(255, 122, 200, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 10, 36, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e0420; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Prendi">PRENDI</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const BX0 = 150, BX1 = 560, FLOOR = 330, CHUTE = 214, RAIL = 74, GRAV = 900;
  // the plush prizes: radius, weight, points, colours
  const KINDS = {
    orsetto:  { r: 20, w: 1.0, pts: 100, c: "#c8864a", c2: "#f0c890", name: "ORSETTO" },
    coniglio: { r: 18, w: 0.8, pts: 150, c: "#f0f0f8", c2: "#ffb0c8", name: "CONIGLIO" },
    palla:    { r: 15, w: 0.6, pts: 80, c: "#5ab8ff", c2: "#ffffff", name: "PALLA" },
    stella:   { r: 13, w: 0.5, pts: 300, c: "#ffd23a", c2: "#fff4a0", name: "STELLA" },
    drago:    { r: 26, w: 1.7, pts: 500, c: "#5ac85a", c2: "#c8f0a0", name: "DRAGO" },
    gatto:    { r: 19, w: 0.9, pts: 200, c: "#3a3a4a", c2: "#ffffff", name: "GATTO" },
    gettone:  { r: 12, w: 0.5, pts: 50, c: "#ffb000", c2: "#fff0a0", name: "GETTONE D'ORO" },
  };
  const POOL = ["orsetto", "orsetto", "coniglio", "coniglio", "palla", "palla", "stella", "drago", "gatto", "gatto"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "15 gettoni · pinza più forte · più tempo per mirare", credits: 15, power: 1.25, time: 15 },
    normale:   { label: "NORMALE",   color: "#ff7ac8", desc: "10 gettoni", credits: 10, power: 1, time: 10 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "8 gettoni · pinza più debole · meno tempo per mirare", credits: 8, power: 0.82, time: 8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pinza-difficulty";
  const bestKey = (id) => `pinza-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let hum = null;
  function motor(on, f = 90) {
    if (!audioCtx) return;
    if (on && !hum) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sawtooth"; o.frequency.value = f; g.gain.value = 0.012; o.connect(g).connect(audioCtx.destination); o.start(); hum = { o, g }; }
    else if (!on && hum) { hum.o.stop(); hum = null; }
    else if (on && hum) hum.o.frequency.value = f;
  }
  const sfx = {
    coin: () => arp([988, 1319], 0.06, 0.1, "square", 0.04),
    close: () => { beep(300, 0.12, "square", 0.04, -120); beep(180, 0.1, "square", 0.03, 0, 0.1); },
    slip: () => arp([600, 450, 300], 0.06, 0.1, "triangle", 0.045),
    thud: () => beep(110, 0.1, "sine", 0.06, -40),
    win: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.14, "square", 0.05),
    bonus: () => arp([784, 988, 1175, 1568, 1976], 0.06, 0.12, "square", 0.05),
    machine: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    tick: () => beep(1600, 0.03, "square", 0.02),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let nextCoin = 1500, score = 0, credits = 10, level = 1, bestCache = 0, won = 0, prizes = [], parts = [], popups = [], message = null, claw = null, aimT = 0, lastTick = 0, haul = 0, strong = false;
  let grabPressed = false;
  const keys = { left: false, right: false };
  const stick = { x: 0, y: 0 };

  // ---------- The machine ----------
  function fillMachine() {
    prizes = [];
    const n = 15 + Math.min(4, level);
    for (let i = 0; i < n; i++) {
      const k = i === 0 ? "gettone" : pick(POOL), K = KINDS[k];
      prizes.push({ k, r: K.r, w: K.w, x: rnd(CHUTE + 40 + K.r, BX1 - K.r - 4), y: rnd(60, 250), vx: 0, vy: 0, rot: rnd(-0.4, 0.4), held: false, gone: false });
    }
    // let the pile settle before the first coin
    for (let i = 0; i < 600; i++) physics(1 / 120);
    for (const p of prizes) { p.vx = 0; p.vy = 0; }
  }
  function physics(dt) {
    for (const p of prizes) {
      if (p.held || p.gone) continue;
      p.vy += GRAV * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.pow(0.4, dt);
      // the glass walls, and the little wall that keeps the pile out of the chute
      if (p.x - p.r < BX0 + 4) { p.x = BX0 + 4 + p.r; p.vx = Math.abs(p.vx) * 0.3; }
      if (p.x + p.r > BX1 - 4) { p.x = BX1 - 4 - p.r; p.vx = -Math.abs(p.vx) * 0.3; }
      if (p.x > CHUTE && p.x - p.r < CHUTE + 6 && p.y + p.r > FLOOR - 28) {
        if (p.y < FLOOR - 28) { p.y = FLOOR - 28 - p.r; p.vy = Math.min(0, p.vy) * -0.2; }
        else { p.x = CHUTE + 6 + p.r; p.vx = Math.abs(p.vx) * 0.3; }
      }
      if (p.x < CHUTE) { if (p.y - p.r > FLOOR + 6) wonPrize(p); }
      else if (p.y + p.r > FLOOR) { if (p.vy > 220) sfx.thud(); p.y = FLOOR - p.r; p.vy = -p.vy * 0.18; p.vx *= 0.8; if (Math.abs(p.vy) < 20) p.vy = 0; }
    }
    // soft bodies pushing each other apart
    for (let i = 0; i < prizes.length; i++) {
      const a = prizes[i]; if (a.gone) continue;
      for (let j = i + 1; j < prizes.length; j++) {
        const b = prizes[j]; if (b.gone) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r - 1;
        if (d >= m || d < 0.01) continue;
        const nx = dx / d, ny = dy / d, over = m - d, wa = a.held ? 0 : b.held ? 1 : b.w / (a.w + b.w), wb = 1 - wa;
        if (!a.held) { a.x -= nx * over * wa; a.y -= ny * over * wa; }
        if (!b.held) { b.x += nx * over * wb; b.y += ny * over * wb; }
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) { const imp = -rv * 0.6; if (!a.held) { a.vx -= nx * imp * wa; a.vy -= ny * imp * wa; } if (!b.held) { b.vx += nx * imp * wb; b.vy += ny * imp * wb; } }
      }
    }
  }
  function wonPrize(p) {
    if (p.gone) return;
    p.gone = true; won++; haul++;
    const K = KINDS[p.k], pts = K.pts * (1 + 0.25 * (level - 1)) * haul;
    if (p.k === "gettone") { credits += 2; sfx.bonus(); popups.push({ x: 180, y: 240, text: "+2 GETTONI!", color: "#ffd23a", t: 0 }); }
    else sfx.win();
    addScore(Math.round(pts), 180, 270, haul > 1 ? "#ffd23a" : "#ffffff", `${K.name} ${haul > 1 ? "×" + haul + " " : ""}+${Math.round(pts)}`);
    for (let i = 0; i < 16; i++) { const a = Math.random() * TAU; parts.push({ x: 182, y: 320, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 - 80, t: 0, life: 0.8, c: pick(["#ff7ac8", "#ffd23a", "#5ae8ff", "#7ed87a"]) }); }
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; credits = diff.credits; level = 1; won = 0; nextCoin = 1500;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginMachine();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMachine() {
    fillMachine();
    claw = { x: 360, y: RAIL, mode: "wait", open: 1, t: 0, prize: null, grip: 0 };
    message = { text: `MACCHINA ${level}`, sub: "porta i peluche nello scivolo a sinistra!", t: 0 };
    state = "intro"; stateT = 1.4;
  }
  const power = () => diff.power * Math.pow(0.93, Math.min(8, level - 1));
  function newTry() {
    if (credits <= 0) { gameOver(); return; }
    credits--; sfx.coin(); haul = 0;
    // now and then the machine is generous
    strong = Math.random() < 0.15;
    claw = { x: 360, y: RAIL, mode: "aim", open: 1, t: 0, prize: null, grip: 0 };
    aimT = diff.time; lastTick = Math.ceil(aimT);
    if (strong) message = { text: "PINZA FORTE!", sub: "questo giro la pinza stringe di più", t: 0 };
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    // every 1.500 points the machine gives back a coin
    while (score >= nextCoin) { nextCoin += 1500; credits++; popups.push({ x: 300, y: 120, text: "GETTONE IN REGALO!", color: "#ffd23a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function gameOver() {
    state = "over"; motor(false);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">GETTONI FINITI</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${won} ${won === 1 ? "peluche vinto" : "peluche vinti"} · macchina ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>ALTRI GETTONI</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; motor(false);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PINZA FORTUNATA</h1>
       <p>La macchina dei peluche della sala giochi! Ogni gettone è un tentativo: sposta la gru sopra un peluche e premi PRENDI. La pinza scende, si chiude e porta il premio allo scivolo... se non scivola prima. Più sei centrato, più stringe forte; i peluche grandi pesano di più. Svuota la macchina e ne arriva un'altra, più avara.</p>
       <div class="pts">
         <span><b>Peluche</b></span><span>palla 80 · orsetto 100 · coniglio 150 · gatto 200 · stella 300 (piccola) · drago 500 (pesante) · gettone d'oro +2 gettoni</span>
         <span><b>Colpi doppi</b></span><span>due premi nello stesso tentativo valgono il doppio, tre il triplo · ogni macchina in più vale il 25% in più · un gettone in regalo ogni 1.500 punti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a destra e sinistra per spostare la gru · PRENDI per calare la pinza</p>`
         : `<p class="muted help">Frecce o A D per spostare la gru · SPAZIO, J o ↓ per calare la pinza · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INSERISCI GETTONE</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (!e.repeat && [" ", "j", "x", "arrowdown", "s"].includes(k)) grabPressed = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); grabPressed = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.12 ? 0 : Math.sign(v) * Math.min(1, (a - 0.12) / 0.6); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- The claw ----------
  // the lowest point the claw can reach at x: the top of the first prize under its fingers, or the floor
  function stopAt(x) {
    let y = FLOOR - 6;
    for (const p of prizes) {
      if (p.gone || p.held) continue;
      const dx = Math.abs(p.x - x);
      if (dx < p.r + 8) { const top = p.y - Math.sqrt(Math.max(0, (p.r + 8) * (p.r + 8) - dx * dx)) + 6; y = Math.min(y, top); }
    }
    return y;
  }
  function updateClaw(dt) {
    const c = claw;
    c.t += dt;
    if (c.mode === "aim") {
      const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
      c.x = clamp(c.x + mx * 130 * dt, CHUTE + 20, BX1 - 20);
      motor(Math.abs(mx) > 0.1, 70);
      aimT -= dt;
      if (Math.ceil(aimT) < lastTick && aimT > 0 && aimT < 4) { lastTick = Math.ceil(aimT); sfx.tick(); }
      if (grabPressed || aimT <= 0) { c.mode = "drop"; c.t = 0; c.target = stopAt(c.x); motor(true, 110); }
    } else if (c.mode === "drop") {
      c.y = Math.min(c.target, c.y + 150 * dt);
      if (c.y >= c.target) { c.mode = "close"; c.t = 0; motor(false); sfx.close(); }
    } else if (c.mode === "close") {
      c.open = Math.max(0, 1 - c.t / 0.45);
      if (c.t >= 0.45) {
        // the prize under the fingers, and how firmly it is held
        let best = null;
        for (const p of prizes) {
          if (p.gone) continue;
          const dx = Math.abs(p.x - c.x), dy = p.y - p.r - c.y;
          if (dx < p.r * 0.95 && dy < 14 && dy > -p.r && (!best || dx < Math.abs(best.x - c.x))) best = p;
        }
        if (best) {
          const off = Math.abs(best.x - c.x) / best.r;
          c.prize = best; best.held = true; best.hx = best.x - c.x; best.vx = best.vy = 0;
          c.grip = (1 - off * off) * power() * (strong ? 1.6 : 1) / Math.pow(best.w, 0.7);
          if (window.__grips) window.__grips.push([best.k, Math.round(off * 100), Math.round(c.grip * 100)]);
        }
        c.mode = "lift"; c.t = 0; motor(true, 100);
      }
    } else if (c.mode === "lift" || c.mode === "carry") {
      if (c.mode === "lift") { c.y = Math.max(RAIL, c.y - 90 * dt); if (c.y <= RAIL) { c.mode = "carry"; c.t = 0; } }
      else { c.x = Math.max(182, c.x - 110 * dt); if (c.x <= 182) { c.mode = "open"; c.t = 0; motor(false); } }
      // a weak grip may let the prize slip on the way
      if (c.prize) {
        const p = c.prize, slipRate = Math.max(0, 0.95 - c.grip) * (c.mode === "lift" ? 1.6 : 1.1);
        p.x = c.x + p.hx * 0.6 + Math.sin(clock * 7) * (1 - Math.min(1, c.grip)) * 3; p.y = c.y + p.r + 12;
        if (Math.random() < slipRate * dt) { p.held = false; p.vy = 30; p.vx = rnd(-30, 30); c.prize = null; sfx.slip(); popups.push({ x: p.x, y: p.y - 30, text: "SCIVOLATO!", color: "#ff8a8a", t: 0 }); }
      }
    } else if (c.mode === "open") {
      c.open = Math.min(1, c.t / 0.3);
      if (c.prize && c.t > 0.15) { const p = c.prize; p.held = false; p.vy = 40; p.vx = 0; c.prize = null; }
      if (c.t > 1.4) { c.mode = "home"; c.t = 0; motor(true, 80); }
    } else if (c.mode === "home") {
      c.x = Math.min(360, c.x + 160 * dt);
      if (c.x >= 360) {
        motor(false);
        if (prizes.filter((p) => !p.gone).length < 7) {
          const b = 1000 * level; addScore(b, 360, 160, "#ffd23a", `MACCHINA SVUOTATA +${b.toLocaleString("it-IT")}`);
          message = { text: "MACCHINA SVUOTATA!", sub: "arriva una macchina nuova", t: 0, long: true };
          sfx.machine(); state = "clear"; stateT = 2.4;
        } else newTry();
      }
    }
    // the prizes that already fell into the chute are out of play
    prizes = prizes.filter((p) => !p.gone || p.held);
  }
  function update(dt) {
    clock += dt;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.4);
    if (message) { message.t += dt; if (message.t > (message.long ? 2.6 : 2)) message = null; }
    const flags = () => { grabPressed = false; };
    if (state === "intro") { stateT -= dt; flags(); if (stateT <= 0) { state = "play"; newTry(); } return; }
    if (state === "clear") { stateT -= dt; flags(); if (stateT <= 0) { level++; credits += 2; beginMachine(); } return; }
    if (state !== "play") { flags(); return; }
    updateClaw(dt); flags();
    physics(dt);
  }

  // ---------- Drawing ----------
  function drawPrize(p) {
    const K = KINDS[p.k], x = p.x, y = p.y, r = p.r;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot || 0);
    if (p.k === "stella") {
      ctx.fillStyle = K.c; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r * 1.1; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.fill();
    } else if (p.k === "gettone") {
      ctx.fillStyle = K.c; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = K.c2; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r - 3, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#a86a00"; ctx.font = "900 11px system-ui"; ctx.textAlign = "center"; ctx.fillText("G", 0, 4);
      ctx.restore(); return;
    } else if (p.k === "palla") {
      ctx.fillStyle = K.c; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = K.c2; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r - 1, -0.6, 0.6); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, r - 1, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
    } else {
      // ears first, then the round body
      ctx.fillStyle = K.c;
      if (p.k === "coniglio") { ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 1.05, r * 0.22, r * 0.55, -0.2, 0, TAU); ctx.ellipse(r * 0.4, -r * 1.05, r * 0.22, r * 0.55, 0.2, 0, TAU); ctx.fill(); }
      else if (p.k === "gatto") { ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 0.4); ctx.lineTo(-r * 0.6, -r * 1.1); ctx.lineTo(-r * 0.15, -r * 0.75); ctx.moveTo(r * 0.8, -r * 0.4); ctx.lineTo(r * 0.6, -r * 1.1); ctx.lineTo(r * 0.15, -r * 0.75); ctx.fill(); }
      else if (p.k === "drago") { ctx.fillStyle = "#3a9a3a"; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.4 - 5, -r * 0.85); ctx.lineTo(i * r * 0.4, -r * 1.25); ctx.lineTo(i * r * 0.4 + 5, -r * 0.85); ctx.fill(); } ctx.fillStyle = K.c; }
      else { ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.7, r * 0.32, 0, TAU); ctx.arc(r * 0.7, -r * 0.7, r * 0.32, 0, TAU); ctx.fill(); }
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = K.c2; ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.5, r * 0.38, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = p.k === "gatto" ? "#ffd23a" : "#1a1a1a"; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.15, r * 0.12, 0, TAU); ctx.arc(r * 0.35, -r * 0.15, r * 0.12, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff7a9a"; ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.1, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  function drawClaw() {
    const c = claw; if (!c) return;
    // the gantry, the cable and the three fingers
    ctx.fillStyle = "#c8c8d8"; ctx.fillRect(c.x - 16, RAIL - 30, 32, 12);
    ctx.strokeStyle = "#8a8a9a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c.x, RAIL - 18); ctx.lineTo(c.x, c.y); ctx.stroke();
    ctx.fillStyle = "#e8e8f0"; ctx.fillRect(c.x - 9, c.y - 2, 18, 9);
    const spread = 6 + c.open * 12;
    ctx.strokeStyle = "#d8d8e8"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(c.x + s * 6, c.y + 6); ctx.lineTo(c.x + s * (spread + 4), c.y + 20); ctx.lineTo(c.x + s * (spread - 4 * (1 - c.open) + 1), c.y + 32); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(c.x, c.y + 7); ctx.lineTo(c.x, c.y + 30); ctx.stroke();
    if (c.mode === "aim") {
      // a faint guide straight down
      ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.moveTo(c.x, c.y + 34); ctx.lineTo(c.x, FLOOR); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(26,10,36,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e8c8f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff7ac8"; ctx.font = "900 10px system-ui"; ctx.fillText(`MACCHINA ${level} · VINTI ${won}`, x0 + 80, 21);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 12px system-ui"; ctx.fillText(`🪙 ${credits}`, x0 + 210, 14);
    if (claw && claw.mode === "aim") { ctx.fillStyle = aimT < 3 ? "#ff5a5a" : "#ffffff"; ctx.fillText(`⏱ ${Math.ceil(aimT)}`, x0 + 260, 14); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!prizes.length && state === "menu") { level = 1; fillMachine(); claw = { x: 380, y: RAIL + 60, mode: "wait", open: 0.8, t: 0 }; }
    // the arcade around the cabinet
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#2a0a3a"); g.addColorStop(1, "#140820");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    for (let i = 0; i < 9; i++) { ctx.fillStyle = `hsla(${(i * 47 + clock * 40) % 360},90%,60%,${0.35 + 0.25 * Math.sin(clock * 3 + i)})`; ctx.beginPath(); ctx.arc(BX0 - 22, TOP + 30 + i * 34, 4, 0, TAU); ctx.arc(BX1 + 22, TOP + 30 + i * 34, 4, 0, TAU); ctx.fill(); }
    // the cabinet: marquee, glass box and the chute
    ctx.fillStyle = "#ff7ac8"; ctx.fillRect(BX0 - 12, TOP + 2, BX1 - BX0 + 24, 22);
    ctx.fillStyle = "#2a0a3a"; ctx.font = "italic 900 14px system-ui"; ctx.textAlign = "center"; ctx.fillText("★ PINZA FORTUNATA ★", (BX0 + BX1) / 2, TOP + 18);
    ctx.fillStyle = "rgba(160,200,255,0.08)"; ctx.fillRect(BX0, TOP + 24, BX1 - BX0, FLOOR - TOP - 24);
    ctx.fillStyle = "#3a1a4a"; ctx.fillRect(BX0 - 12, TOP + 24, 12, H - TOP - 24); ctx.fillRect(BX1, TOP + 24, 12, H - TOP - 24);
    ctx.fillStyle = "#c8c8d8"; ctx.fillRect(BX0, RAIL - 34, BX1 - BX0, 4);
    ctx.fillStyle = "#4a2a5a"; ctx.fillRect(CHUTE, FLOOR, BX1 - CHUTE, H - FLOOR);
    ctx.fillStyle = "#6a4a7a"; ctx.fillRect(CHUTE, FLOOR - 28, 6, 28);
    ctx.fillStyle = "#0a0410"; ctx.fillRect(BX0, FLOOR, CHUTE - BX0, H - FLOOR);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 9px system-ui"; ctx.fillText("PREMI ↓", (BX0 + CHUTE) / 2, FLOOR + 14);
    for (const p of prizes) if (!p.held) drawPrize(p);
    drawClaw();
    for (const p of prizes) if (p.held) drawPrize(p);
    // reflections on the glass
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.beginPath(); ctx.moveTo(BX0 + 30, TOP + 24); ctx.lineTo(BX0 + 70, TOP + 24); ctx.lineTo(BX0 + 10, FLOOR); ctx.lineTo(BX0, FLOOR); ctx.fill();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1a0a24"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 2.6 : 2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ff7ac8";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a0a24"; ctx.strokeText(message.text, W / 2, 150); ctx.fillText(message.text, W / 2, 150);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 169); ctx.fillText(message.sub, W / 2, 169); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="pinza-best-" data-kind="score"></script>

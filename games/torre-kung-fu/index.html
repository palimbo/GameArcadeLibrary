<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Torre del Kung Fu</title>
<style>
  :root {
    --bg: #1a0806;
    --fg: #fff4e0;
    --muted: #d0b090;
    --red: #e8302a;
    --gold: #ffc83a;
    --jade: #3ac88a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a1a0a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 224, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch button {
    width: 52px; height: 52px; border-radius: 14px; touch-action: none;
    font: 700 20px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(255, 200, 58, 0.6); background: rgba(255, 200, 58, 0.08);
  }
  #touch .acts { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch .acts button { width: 78px; height: 78px; border-radius: 50%; font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .acts button[data-a="punch"] { border-color: rgba(232, 48, 42, 0.9); background: rgba(232, 48, 42, 0.16); }
  #touch .acts button[data-a="kick"] { border-color: rgba(58, 200, 138, 0.9); background: rgba(58, 200, 138, 0.16); margin-bottom: 26px; }
  #touch.small .pad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  #touch.small button { width: 44px; height: 44px; font-size: 17px; }
  #touch.small .acts button { width: 64px; height: 64px; font-size: 11px; }
  #touch button.on { background: rgba(255, 244, 224, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 8, 6, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 2px; color: var(--gold); text-shadow: 3px 3px 0 var(--red), 6px 6px 0 #3a0a04; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,224,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--red); color: #fff; background: var(--red); padding: 11px 30px; box-shadow: 0 4px 0 #7a1010; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Salta">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
    <button type="button" data-a="down" aria-label="Accovacciati">▼</button>
  </div>
  <div class="acts">
    <button type="button" data-a="punch" aria-label="Pugno">PUGNO</button>
    <button type="button" data-a="kick" aria-label="Calcio">CALCIO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 300, TOP = 44, GY = 262, FLOOR_LEN = 1700, TIME = 90;
  const FLOORS = [
    { boss: "IL MAESTRO DEL BASTONE", color: "#c8a03a", wall: "#6a1a0e", beam: "#3a0a04", attack: "stick" },
    { boss: "IL LANCIATORE DI BOOMERANG", color: "#3a8ae8", wall: "#1a3a2a", beam: "#0a1a10", attack: "boomerang" },
    { boss: "IL GIGANTE", color: "#8a5a3a", wall: "#3a2a5a", beam: "#1a1030", attack: "giant" },
    { boss: "IL MAGO DELLE OMBRE", color: "#b85aff", wall: "#1a1a2a", beam: "#08080e", attack: "magic" },
    { boss: "IL SIGNORE DELLA TORRE", color: "#e8302a", wall: "#4a3a0a", beam: "#2a1a02", attack: "master" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici lenti, colpi meno dolorosi", lives: 5, speed: 0.8, dmg: 0.6, spawn: 0.7 },
    normale:   { label: "NORMALE",   color: "#ffc83a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, dmg: 1, spawn: 1 },
    difficile: { label: "DIFFICILE", color: "#e8302a", desc: "3 vite · un'orda di nemici agguerriti", lives: 3, speed: 1.2, dmg: 1.35, spawn: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "kungfu-difficulty";
  const bestKey = (id) => `kungfu-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(180px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 180;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    swing: lim(() => noise(0.08, 0.12, 1800)),
    hit: lim(() => { noise(0.1, 0.3, 700); beep(180, 0.08, "square", 0.04, -80); }),
    ko: lim(() => beep(600, 0.3, "triangle", 0.04, -450)),
    hurt: lim(() => { noise(0.15, 0.25, 400); beep(140, 0.15, "sawtooth", 0.04, -60); }),
    knife: lim(() => beep(2000, 0.08, "triangle", 0.02, -800)),
    grab: lim(() => beep(260, 0.2, "sawtooth", 0.03, -100)),
    shake: lim(() => beep(500, 0.05, "square", 0.03)),
    jump: lim(() => beep(300, 0.15, "triangle", 0.03, 300)),
    gong: () => { beep(110, 1.4, "sine", 0.08); beep(220, 1.2, "sine", 0.04); beep(333, 1, "sine", 0.02); },
    boss: () => arp([220, 233, 220, 196], 0.12, 0.2, "sawtooth", 0.035),
    die: () => arp([523, 494, 440, 392, 349, 330, 262], 0.1, 0.14, "sawtooth", 0.035),
    clear: () => arp([523, 587, 659, 784, 880, 1047], 0.09, 0.16, "triangle", 0.05),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, floor = 0, bestCache = 0, nextLife = 30000;
  let hero = null, enemies = [], knives = [], boss = null, camX = 0, timeLeft = TIME, spawnT = 2;
  let parts = [], popups = [], message = null, floorT = 0, shake = 0;
  const ctl = { up: false, down: false, left: false, right: false, punch: false, kick: false };
  let punchPressed = false, kickPressed = false, jumpPressed = false, dirTaps = 0, lastTap = null;

  const F = () => FLOORS[floor % FLOORS.length];
  const loop = () => Math.floor(floor / FLOORS.length);
  // odd floors are walked to the left, even ones to the right, as in the pagoda of the arcade
  const dirOf = () => (floor % 2 === 0 ? -1 : 1);
  const bossX = () => (dirOf() < 0 ? 140 : FLOOR_LEN - 140);

  function buildFloor() {
    const d = dirOf();
    hero = { x: d < 0 ? FLOOR_LEN - 80 : 80, y: 0, vy: 0, face: d, crouch: false, air: false, atk: null, energy: 100, inv: 1, grabbed: 0, hurtT: 0, walk: 0, dead: false };
    enemies = []; knives = []; boss = null; timeLeft = TIME; spawnT = 1.5; floorT = 0;
    camX = clamp(hero.x - W / 2, 0, FLOOR_LEN - W);
    message = { text: `PIANO ${floor + 1}`, sub: `In cima ti aspetta ${F().boss.toLowerCase()}`, t: 0 };
    state = "intro"; stateT = 1.8;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; floor = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildFloor();
    sfx.gong();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff4e0") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 40000; lives++; sfx.life(); popups.push({ x: hero.x, y: 120, text: "VITA EXTRA", color: "#ffc83a", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function hurt(amount, from) {
    const h = hero;
    if (state !== "play" || h.inv > 0) return;
    h.energy -= amount * diff.dmg; h.inv = 0.7; h.hurtT = 0.25; shake = 0.15;
    h.x += Math.sign(h.x - from) * 10;
    sfx.hurt();
    burst(h.x, GY - 40, "#ffffff", 6, 80);
    if (h.energy <= 0) loseLife("K.O.!");
  }
  function loseLife(why) {
    if (state !== "play") return;
    lives--; hero.dead = true; hero.energy = 0;
    sfx.die();
    message = { text: why, t: 0 };
    state = "dead"; stateT = 2.4;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the floor starts again from the beginning
    buildFloor();
  }
  function floorCleared() {
    const tb = Math.round(timeLeft) * 100, eb = Math.round(hero.energy) * 20;
    addScore(tb + eb);
    message = { text: `PIANO ${floor + 1} CONQUISTATO!`, sub: `Bonus tempo ${tb.toLocaleString("it-IT")} · energia ${eb.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3.4;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, fl = floor + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Piano ${fl} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>TORRE DEL KUNG FU</h1>
       <p>Sali i cinque piani della pagoda a colpi di pugni e calci! Ogni piano è pieno di scagnozzi e in fondo ti aspetta un maestro. Attento agli afferratori che ti bloccano e ti tolgono energia: scuotiti premendo ◀ ▶ più volte.</p>
       <div class="pts">
         <span><b>Afferratore</b> (viola)</span><span>100 · ti blocca: scuotiti!</span>
         <span><b>Nano saltellante</b></span><span>300 · colpiscilo da accovacciato</span>
         <span><b>Lanciatore di coltelli</b></span><span>500 · coltelli alti (abbassati) e bassi (salta)</span>
         <span><b>Maestro del piano</b></span><span>2.000 × piano</span>
         <span><b>Fine piano</b></span><span>bonus tempo ed energia</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Croce per camminare, saltare (▲) e abbassarti (▼) · PUGNO e CALCIO (da accovacciato colpiscono in basso)</p>`
         : `<p class="muted help">← → per camminare · ↑ salta · ↓ abbassati · Z pugno · X calcio (da accovacciato colpiscono in basso) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right", z: "punch", j: "punch", x: "kick", k: "kick", " ": "kick" };
  function press(a) {
    if (a === "punch") punchPressed = true;
    if (a === "kick") kickPressed = true;
    if (a === "up") jumpPressed = true;
    // wiggling left and right shakes the grippers off
    if ((a === "left" || a === "right") && a !== lastTap) { dirTaps++; lastTap = a; }
    if (a === "punch" || a === "kick") dirTaps += 0.5;
  }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    ctl[a] = true;
    if (!e.repeat) press(a);
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true; press(a);
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Hero ----------
  function updateHero(dt) {
    const h = hero;

    bar(112, "TU", hero.energy, 100, hero.energy > 30 ? "#ffc83a" : "#e8302a");
    bar(244, boss ? "MAESTRO" : "MAESTRO ?", boss ? boss.hp : 1, boss ? boss.maxHp : 1, boss ? F().color : "#5a3a2a");
    ctx.textAlign = "right"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = timeLeft < 15 ? "#e8302a" : "#fff4e0";
    ctx.fillText(`⏱ ${Math.ceil(timeLeft)}`, W - 8, 12);
    ctx.font = "800 10px system-ui, sans-serif"; ctx.fillStyle = "#ffc83a";
    ctx.fillText(`PIANO ${floor + 1}`, W - 8, 30);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) { ctx.fillStyle = "#f4f4f4"; ctx.fillRect(378 + i * 9, 26, 6, 8); ctx.fillStyle = "#e8302a"; ctx.fillRect(378 + i * 9, 24, 6, 2); }
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 22px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = "#000";
      ctx.strokeText(message.text, W / 2, 110); ctx.fillStyle = "#ffc83a"; ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.strokeText(message.sub, W / 2, 132); ctx.fillStyle = "#fff4e0"; ctx.fillText(message.sub, W / 2, 132); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loopFn(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loopFn);
  }
  syncControls();
  buildFloor(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loopFn);
})();
</script>
<script src="../../shared/iniziali.js" data-record="kungfu-best-" data-kind="score"></script>

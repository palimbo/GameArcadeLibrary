<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scoppia Palloni</title>
<style>
  :root {
    --bg: #14101f;
    --fg: #fff6ea;
    --muted: #c4b8d6;
    --accent: #ff3d5a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2c2240, 0 10px 40px rgba(0, 0, 0, 0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 246, 234, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid var(--c, rgba(255, 246, 234, 0.6)); background: rgba(255, 246, 234, 0.08);
  }
  #touch.two button { width: 54px; height: 54px; font-size: 19px; }
  #touch.small button { width: 56px; height: 56px; font-size: 20px; }
  #touch.two.small button { width: 48px; height: 48px; }
  #touch button.on { background: rgba(255, 246, 234, 0.4); }
  #touch button[data-a="fire"] { width: 80px; height: 80px; background: rgba(255, 61, 90, 0.16); }
  #touch.two button[data-a="fire"] { width: 60px; height: 60px; }
  #touch.small button[data-a="fire"] { width: 64px; height: 64px; }
  #touch.two.small button[data-a="fire"] { width: 52px; height: 52px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 16, 31, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 {
    font-size: clamp(36px, 9vw, 62px); line-height: 1.05; letter-spacing: 2px; font-weight: 900;
    background: linear-gradient(90deg, #ff3d5a, #ffb000, #3dd6ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #5a1830);
  }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--accent); }
  #overlay h2.win { color: var(--gold); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay .items { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 16px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .items b { color: var(--fg); }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,246,234,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--accent); color: #fff; background: var(--accent); padding: 11px 30px; box-shadow: 0 4px 0 #8a1830; }
  @media (max-width: 520px) { #overlay .items { grid-template-columns: repeat(2, auto); } }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .items { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, FLOOR = 400, H = 440;          // playfield 640×400, status bar below
  const G = 560;                                  // gravity for the balloons
  const RADII = [40, 26, 15, 8];
  const BOUNCE = [250, 200, 140, 90].map((h) => Math.sqrt(2 * G * h)); // every size always bounces to the same height
  const POINTS = [50, 100, 150, 200];
  const HSPEED = 80;
  const PCOL = [{ body: "#3d8bff", dark: "#1d4fa8", name: "G1" }, { body: "#3ddc6a", dark: "#1a8a3a", name: "G2" }];

  // ---------- The world tour: 5 places × 3 stages ----------
  const PLACES = [
    { name: "MONTE FUJI", ball: "#ff3d5a" },
    { name: "COLOSSEO", ball: "#3d8bff" },
    { name: "PIRAMIDI", ball: "#c05aff" },
    { name: "TORRE EIFFEL", ball: "#ffb000" },
    { name: "TORRE DI PISA", ball: "#2fcf8a" },
  ];
  // balls: [size, x, direction]; platforms: [x, y, w, h, "s" solid | "g" glass]
  const LEVELS = [
    { balls: [[0, 150, 1]], plats: [] },
    { balls: [[1, 140, 1], [1, 500, -1]], plats: [[270, 210, 100, 14, "g"]] },
    { balls: [[0, 120, 1], [1, 520, -1]], plats: [[110, 190, 90, 14, "g"], [440, 190, 90, 14, "g"]] },
    { balls: [[0, 200, -1], [0, 440, 1]], plats: [[60, 210, 100, 14, "s"], [480, 210, 100, 14, "s"]] },
    { balls: [[0, 320, 1], [2, 100, 1], [2, 540, -1]], plats: [[220, 170, 40, 16, "g"], [260, 170, 40, 16, "g"], [300, 170, 40, 16, "g"], [340, 170, 40, 16, "g"], [380, 170, 40, 16, "g"]] },
    { balls: [[1, 100, 1], [1, 320, -1], [1, 540, -1]], plats: [[150, 230, 120, 14, "s"], [370, 230, 120, 14, "s"]] },
    { balls: [[0, 110, 1], [0, 530, -1]], plats: [[240, 272, 160, 16, "g"], [270, 256, 100, 16, "g"], [300, 240, 40, 16, "g"]] },
    { balls: [[0, 320, 1], [1, 80, 1], [1, 560, -1]], plats: [[0, 190, 110, 14, "s"], [530, 190, 110, 14, "s"]] },
    { balls: [[0, 170, 1], [0, 470, -1], [2, 320, 1]], plats: [[90, 175, 80, 14, "g"], [470, 175, 80, 14, "g"], [290, 260, 60, 14, "s"]] },
    { balls: [[0, 320, -1], [1, 150, 1], [1, 490, -1]], plats: [[304, 290, 32, 28, "g"], [304, 262, 32, 28, "g"], [304, 234, 32, 28, "g"]] },
    { balls: [[0, 100, 1], [0, 540, -1], [1, 320, 1]], plats: [[200, 180, 240, 14, "s"]] },
    { balls: [[0, 120, 1], [0, 320, -1], [0, 520, -1]], plats: [] },
    { balls: [[0, 160, 1], [0, 480, -1], [2, 100, 1], [2, 540, -1]], plats: [[150, 210, 60, 14, "g"], [290, 210, 60, 14, "g"], [430, 210, 60, 14, "g"]] },
    { balls: [[0, 320, 1], [1, 120, 1], [1, 520, -1], [2, 320, -1]], plats: [[70, 235, 100, 14, "s"], [470, 235, 100, 14, "s"], [270, 170, 100, 14, "g"]] },
    { balls: [[0, 100, 1], [0, 260, 1], [0, 380, -1], [0, 540, -1]], plats: [[40, 185, 80, 14, "g"], [520, 185, 80, 14, "g"]] },
  ];

  const ITEMS = {
    double:   { label: "Doppio arpione", color: "#3dd6ff" },
    wire:     { label: "Arpione fisso", color: "#ffb000" },
    gun:      { label: "Pistola", color: "#ff7a3a" },
    clock:    { label: "Orologio", color: "#b98cff" },
    shield:   { label: "Scudo", color: "#7dff9a" },
    dynamite: { label: "Dinamite", color: "#ff3d5a" },
    fruit:    { label: "Frutta", color: "#ff5a8a" },
    life:     { label: "Vita", color: "#ff3d5a" },
  };
  const ITEM_POOL = ["double", "double", "wire", "wire", "gun", "gun", "clock", "clock", "shield", "shield", "dynamite", "fruit", "fruit", "fruit", "life"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · palloni più lenti · più tempo e più sorprese", lives: 5, speed: 0.85, time: 1.3, drop: 0.22 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, time: 1, drop: 0.16 },
    difficile: { label: "DIFFICILE", color: "#ff3d5a", desc: "3 vite · palloni più veloci · meno tempo e meno sorprese", lives: 3, speed: 1.15, time: 0.8, drop: 0.11 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "palloni-difficulty", MODE_KEY = "palloni-mode";
  const bestKey = (id) => `palloni-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  let bgCache = null, bgKey = "";
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    touchEl.classList.toggle("two", players.length === 2);
    // portrait: the game sits in the space above the buttons; landscape: between the two button groups
    wrap.style.paddingBottom = showTouch && portrait ? "calc(150px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 150;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
    bgKey = "";
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    shoot: lim(() => beep(520, 0.12, "sawtooth", 0.025, 500)),
    gun: lim(() => beep(1100, 0.05, "square", 0.02, -500)),
    pop: lim((s) => { noise(0.12, 0.25, [700, 1100, 1600, 2400][s]); beep([220, 330, 440, 660][s], 0.1, "square", 0.03, 300); }),
    glass: lim(() => { noise(0.25, 0.2, 4000); beep(1800, 0.1, "triangle", 0.03, -800); }),
    clink: lim(() => beep(300, 0.04, "square", 0.02)),
    item: () => arp([784, 988, 1319], 0.05, 0.08, "square", 0.035),
    life: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.1, "triangle", 0.05),
    boom: () => { noise(0.8, 0.4, 600); beep(90, 0.6, "sawtooth", 0.04, -50); },
    die: () => { beep(660, 0.9, "square", 0.04, -560); noise(0.3, 0.2, 900); },
    tick: lim(() => beep(1400, 0.03, "square", 0.02)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047], 0.09, 0.14),
    ready: () => arp([392, 523], 0.12, 0.12, "triangle", 0.05),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let twoPlayers = load(MODE_KEY) === "2";
  let state = "menu", menu = null, pausedFrom = null, stateT = 0;
  let level = 0, timeLeft = 0, clock = 0, freezeT = 0, bestCache = 0, deathMsg = "";
  let players = [], balls = [], plats = [], items = [], parts = [], popups = [], tally = null;
  const ctl = [{ left: false, right: false, fire: false }, { left: false, right: false, fire: false }];

  function newPlayer(i) {
    return { i, x: 0, dir: 1, lives: diff.lives, score: 0, weapon: "harpoon", shots: [], fireCd: 0, walk: 0, shootT: 0, shield: false, inv: 0, hit: false, firePrev: false };
  }
  function makeBall(size, x, y, vx, vy) { return { size, r: RADII[size], x, y, vx, vy }; }
  function placePlayers() {
    const xs = players.length === 2 ? [W / 2 - 60, W / 2 + 60] : [W / 2];
    players.forEach((p, k) => { p.x = xs[k]; p.dir = k ? -1 : 1; p.shots = []; p.inv = 0; p.hit = false; p.shootT = 0; });
  }
  function loadLevel() {
    const L = LEVELS[level];
    balls = L.balls.map(([s, x, d]) => makeBall(s, x, s === 0 ? 90 : 120, d * HSPEED * diff.speed, 0));
    plats = L.plats.map(([x, y, w, h, t]) => ({ x, y, w, h, t }));
    items = []; parts = []; popups = []; freezeT = 0;
    timeLeft = Math.round(Math.min(150, 60 + balls.reduce((a, b) => a + (4 - b.size) * 8, 0)) * diff.time);
    placePlayers();
    state = "intro"; stateT = 1.6;
    sfx.ready();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  const alive = () => players.filter((p) => p.lives > 0);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    players = twoPlayers ? [newPlayer(0), newPlayer(1)] : [newPlayer(0)];
    level = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    for (const c of ctl) { c.left = c.right = c.fire = false; }
    buildTouch();
    loadLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(p, n, x, y, color = "#fff6ea") {
    p.score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  function hitPlayer(p) {
    if (p.inv > 0 || p.hit || p.lives <= 0 || state !== "play") return;
    if (p.shield) {
      p.shield = false; p.inv = 1.5;
      sfx.glass();
      burst(p.x, FLOOR - 18, "#7dff9a", 14);
      return;
    }
    p.hit = true;
    for (const q of players) if (q.hit) { q.lives--; q.weapon = "harpoon"; q.shots = []; q.shield = false; }
    deathMsg = "";
    sfx.die();
    state = "dead"; stateT = 1.9;
  }
  function afterDeath() {
    if (!alive().length) { gameOver(false); return; }
    for (const p of players) { p.hit = false; p.shots = []; }
    loadLevel(); // like the arcade classic: the stage starts again from the beginning
  }
  function levelCleared() {
    const per = Math.max(0, Math.ceil(timeLeft)) * 20;
    for (const p of alive()) addScore(p, per);
    tally = { time: Math.max(0, Math.ceil(timeLeft)), per };
    for (const p of players) p.shots = [];
    items = [];
    sfx.clear();
    state = "clear"; stateT = 2.8;
  }
  function nextLevel() {
    if (level + 1 >= LEVELS.length) { gameOver(true); return; }
    level++;
    loadLevel();
  }
  function gameOver(won) {
    state = "over";
    const top = Math.max(...players.map((p) => p.score));
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = top > prev;
    if (record) store(bestKey(difficulty), String(top));
    const played = diff.label, place = PLACES[Math.floor(level / 3)].name, stage = level % 3 + 1;
    const scores = players.length === 2
      ? `<p><span style="color:${PCOL[0].body}">Giocatore 1: <b>${players[0].score.toLocaleString("it-IT")}</b></span> · <span style="color:${PCOL[1].body}">Giocatore 2: <b>${players[1].score.toLocaleString("it-IT")}</b></span></p>`
      : `<p>Punteggio: <b>${top.toLocaleString("it-IT")}</b></p>`;
    menu = () => showOverlay(
      (won
        ? `<h2 class="win">GIRO DEL MONDO COMPLETATO!</h2><p>Hai scoppiato tutti i palloni, dal Monte Fuji alla Torre di Pisa · ${played}</p>`
        : `<h2 class="lose">PARTITA FINITA</h2><p class="muted">Sei arrivato a ${place} ${stage}/3 · livello ${level + 1} di 15 · ${played}</p>`)
      + scores
      + (record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : "")
      + modeHTML() + difficultyHTML()
      + `<button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    if (won) sfx.clear(); else sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(116px + env(safe-area-inset-bottom, 0px))", right: "14px", left: "auto" }
      : players.length === 2
        ? { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "auto", left: "50%" }
        : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    if (portrait && players.length === 2) Object.assign(pauseBtn.style, { right: "auto", left: "calc(50% - 20px)", bottom: "calc(96px + env(safe-area-inset-bottom, 0px))" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function modeHTML() {
    return `<div class="diff">
      <button type="button" data-mode="1" class="${twoPlayers ? "" : "on"}" style="--c:#3d8bff">1 GIOCATORE</button>
      <button type="button" data-mode="2" class="${twoPlayers ? "on" : ""}" style="--c:#3ddc6a">2 GIOCATORI</button>
    </div>`;
  }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function helpHTML() {
    if (touchMode) return twoPlayers
      ? `<p class="muted help">Ognuno ha i suoi tasti: giocatore 1 a sinistra, giocatore 2 a destra · ◀ ▶ per muoverti · ● per sparare</p>`

  function burst(x, y, color, n = 10, speed = 160) {

    let dx = b.x - cx, dy = b.y - cy;

    if (d2 >= b.r * b.r) return;

    if (!silent) sfx.pop(b.size);
    burst(b.x, b.y, PLACES[Math.floor(level / 3)].ball, 6 + (3 - b.size) * 3, 120 + b.r * 3);

      sky([[0, "#8fd0ff"], [1, "#e8f7ff"]]);
      circle(560, 70, 28, "#fff8d0");
      c.fillStyle = "#f2ead8"; c.fillRect(40, 240, 220, 110); c.beginPath(); c.moveTo(40, 240); c.lineTo(150, 196); c.lineTo(260, 240); c.fill();
      c.beginPath(); c.arc(190, 222, 34, Math.PI, 0); c.fill();
      c.fillStyle = "#d8ccb0"; for (let k = 0; k < 9; k++) c.fillRect(52 + k * 24, 262, 10, 70);
      c.save(); c.translate(430, 355); c.rotate(0.09);
      c.fillStyle = "#f6efe0"; c.fillRect(-36, -250, 72, 250);
      c.fillStyle = "#d8ccb0";
      for (let row = 0; row < 7; row++) { c.fillRect(-38, -250 + row * 36, 76, 4); for (let k = 0; k < 5; k++) c.fillRect(-30 + k * 14, -242 + row * 36, 6, 24); }
      c.fillStyle = "#f6efe0"; c.fillRect(-24, -278, 48, 28);
      c.restore();
      c.fillStyle = "#7ac06a"; c.fillRect(0, 350, W, 50);
    }
    // soft haze so the balloons stand out
    c.fillStyle = "rgba(255,255,255,0.12)"; c.fillRect(0, 0, W, FLOOR);
  }
  function drawBall(b) {
    const col = PLACES[Math.floor(level / 3)].ball;
    if (freezeT > 0 && freezeT < 1.5 && Math.floor(clock * 10) % 2) return drawBallShape(b, "#ffffff");
    drawBallShape(b, col);
  }
  function drawBallShape(b, col) {
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(b.x, FLOOR - 2, b.r * (0.5 + 0.5 * (b.y / FLOOR)), 3, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, col); g.addColorStop(1, shade(col));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  const shadeCache = {};
  function shade(hex) {
    if (shadeCache[hex]) return shadeCache[hex];
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) * 0.45, g = ((n >> 8) & 255) * 0.45, bl = (n & 255) * 0.45;
    return (shadeCache[hex] = `rgb(${r | 0},${g | 0},${bl | 0})`);
  }
  function drawPlat(pl) {
    if (pl.t === "g") {
      ctx.fillStyle = "rgba(160,230,255,0.55)"; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.5; ctx.strokeRect(pl.x + 0.75, pl.y + 0.75, pl.w - 1.5, pl.h - 1.5);
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.moveTo(pl.x + 5, pl.y + pl.h - 4); ctx.lineTo(pl.x + Math.min(16, pl.w / 3), pl.y + 3); ctx.stroke();
    } else {
      ctx.fillStyle = "#6a5a50"; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.fillStyle = "#8a7a6a"; ctx.fillRect(pl.x, pl.y, pl.w, 4);
      ctx.strokeStyle = "#3a2e28"; ctx.lineWidth = 1;
      for (let x = pl.x + 20; x < pl.x + pl.w; x += 20) { ctx.beginPath(); ctx.moveTo(x, pl.y + 4); ctx.lineTo(x, pl.y + pl.h); ctx.stroke(); }
      ctx.strokeRect(pl.x + 0.5, pl.y + 0.5, pl.w - 1, pl.h - 1);
    }
  }
  function drawPlayer(p) {
    if (p.lives <= 0 && !p.hit) return;
    if (p.inv > 0 && Math.floor(clock * 14) % 2) return;
    const col = PCOL[p.i], x = p.x, y = FLOOR;
    ctx.save();
    if (p.hit && state === "dead") {
      const t = 1.9 - stateT;
      ctx.translate(x, y - 20 - Math.max(0, 40 * t - 60 * t * t)); ctx.rotate(t * 6 * p.dir); ctx.translate(-x, -(y - 20));
    }
    const shooting = p.shootT > 0, step = Math.sin(p.walk) * 5;
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.beginPath(); ctx.ellipse(x, y - 1, 13, 3, 0, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.fillStyle = "#3a2a2a";
    ctx.fillRect(x - 7, y - 12, 5, 12 + (shooting ? 0 : Math.min(0, step)));
    ctx.fillRect(x + 2, y - 12, 5, 12 + (shooting ? 0 : Math.min(0, -step)));
    // body
    ctx.fillStyle = col.body; ctx.fillRect(x - 9, y - 26, 18, 15);
    ctx.fillStyle = col.dark; ctx.fillRect(x - 9, y - 14, 18, 3);
    // arms
    ctx.fillStyle = "#ffcf9e";
    if (shooting) { ctx.fillRect(x - 2, y - 38, 4, 13); }
    else { ctx.fillRect(x + p.dir * 9 - 2, y - 24, 4, 10); }
    // head and explorer hat
    ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(x, y - 31, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x + p.dir * 2 - 1, y - 32, 2, 2);
    ctx.fillStyle = "#d8b060"; ctx.fillRect(x - 11, y - 36, 22, 3); ctx.beginPath(); ctx.arc(x, y - 36, 7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = col.dark; ctx.fillRect(x - 7, y - 38, 14, 2);
    ctx.restore();
    if (p.shield) {
      ctx.strokeStyle = `rgba(125,255,154,${0.6 + 0.3 * Math.sin(clock * 8)})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y - 20, 24, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawShot(s, p) {
    if (s.bullet) {
      ctx.fillStyle = "#ffe07a"; ctx.fillRect(s.x - 2, s.y, 4, 12);
      ctx.fillStyle = "#fff"; ctx.fillRect(s.x - 1, s.y, 2, 5);
      return;
    }
    const top = s.tip;
    if (s.wire) {
      ctx.strokeStyle = s.stick > 0 && s.stick < 0.8 && Math.floor(clock * 12) % 2 ? "rgba(255,176,0,0.4)" : "#ffb000"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.x, top); ctx.lineTo(s.x, FLOOR); ctx.stroke();
      ctx.fillStyle = "#fff"; for (let y = top + 6; y < FLOOR; y += 12) ctx.fillRect(s.x - 1.5, y, 3, 3);
    } else {
      ctx.strokeStyle = PCOL[p.i].body === "#3d8bff" ? "#e8e0d0" : "#e8f0d0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, FLOOR);
      for (let y = FLOOR - 6, k = 0; y > top + 10; y -= 6, k++) ctx.lineTo(s.x + (k % 2 ? 3 : -3), y);
      ctx.lineTo(s.x, top + 10); ctx.stroke();
    }
    // arrow head
    ctx.fillStyle = "#dfe6f0"; ctx.beginPath(); ctx.moveTo(s.x, top); ctx.lineTo(s.x - 6, top + 12); ctx.lineTo(s.x + 6, top + 12); ctx.fill();
    ctx.fillStyle = "#8a96a8"; ctx.fillRect(s.x - 1.5, top + 11, 3, 4);
  }
  function drawItemIcon(type, x, y, fruit = 0) {
    const col = ITEMS[type].color;
    ctx.fillStyle = "rgba(20,16,31,0.8)"; ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2;
    const arrow = (ax) => { ctx.beginPath(); ctx.moveTo(ax, y + 6); ctx.lineTo(ax, y - 4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(ax, y - 7); ctx.lineTo(ax - 3, y - 2); ctx.lineTo(ax + 3, y - 2); ctx.fill(); };
    switch (type) {
      case "double": arrow(x - 3.5); arrow(x + 3.5); break;
      case "wire": arrow(x); ctx.fillRect(x - 6, y - 9, 12, 2); break;
      case "gun": ctx.fillRect(x - 6, y - 4, 11, 4); ctx.fillRect(x - 6, y - 1, 4, 7); break;
      case "clock": ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 4); ctx.moveTo(x, y); ctx.lineTo(x + 3, y + 1); ctx.stroke(); break;
      case "shield": ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y - 4); ctx.quadraticCurveTo(x + 5, y + 4, x, y + 7); ctx.quadraticCurveTo(x - 5, y + 4, x - 6, y - 4); ctx.closePath(); ctx.fill(); break;
      case "dynamite": ctx.fillRect(x - 3, y - 4, 6, 10); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.quadraticCurveTo(x + 4, y - 8, x + 2, y - 9); ctx.stroke(); ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.arc(x + 2, y - 9, 1.8, 0, Math.PI * 2); ctx.fill(); break;
      case "life": ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.bezierCurveTo(x - 9, y - 1, x - 5, y - 9, x, y - 3); ctx.bezierCurveTo(x + 5, y - 9, x + 9, y - 1, x, y + 6); ctx.fill(); break;
      case "fruit":
        if (fruit === 0) { ctx.strokeStyle = "#3a8a3a"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 3, y + 1); ctx.quadraticCurveTo(x, y - 8, x + 3, y - 7); ctx.moveTo(x + 3, y + 2); ctx.lineTo(x + 3, y - 7); ctx.stroke(); ctx.fillStyle = "#ff3d5a"; ctx.beginPath(); ctx.arc(x - 3, y + 3, 3.5, 0, Math.PI * 2); ctx.arc(x + 3.5, y + 4, 3.5, 0, Math.PI * 2); ctx.fill(); }
        else if (fruit === 1) { ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.arc(x, y - 3, 8, 0.4, Math.PI - 0.4); ctx.arc(x, y - 7, 8, Math.PI - 0.6, 0.6, true); ctx.fill(); }
        else { ctx.fillStyle = "#3ddc6a"; ctx.beginPath(); ctx.arc(x, y + 1, 7, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#1a6a2a"; ctx.lineWidth = 1; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(x + k * 3, y - 6); ctx.lineTo(x + k * 3, y + 8); ctx.stroke(); } }
        break;
    }
  }
  function drawHud() {
    ctx.fillStyle = "#1c1530"; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = "#2c2240"; ctx.fillRect(0, FLOOR, W, 3);
    const place = PLACES[Math.floor(level / 3)];
    ctx.textAlign = "center"; ctx.fillStyle = "#fff6ea"; ctx.font = "800 13px system-ui, sans-serif";
    ctx.fillText(`${place.name} ${level % 3 + 1}/3`, W / 2, FLOOR + 17);
    ctx.font = "900 15px system-ui, sans-serif";
    ctx.fillStyle = timeLeft < 10 && Math.floor(clock * 4) % 2 ? "#ff3d5a" : "#ffd34d";
    ctx.fillText(`TEMPO ${Math.max(0, Math.ceil(timeLeft))}`, W / 2, FLOOR + 35);
    players.forEach((p) => {
      const left = p.i === 0, x0 = left ? 12 : W - 12;
      ctx.textAlign = left ? "left" : "right";
      ctx.fillStyle = PCOL[p.i].body; ctx.font = "800 11px system-ui, sans-serif";
      ctx.fillText(players.length === 2 ? `GIOCATORE ${p.i + 1}` : `RECORD ${Math.max(bestCache, p.score).toLocaleString("it-IT")}`, x0, FLOOR + 16);
      ctx.fillStyle = "#fff6ea"; ctx.font = "900 17px system-ui, sans-serif";
      ctx.fillText(p.score.toLocaleString("it-IT"), x0, FLOOR + 35);
      // lives and weapon
      const tw = ctx.measureText(p.score.toLocaleString("it-IT")).width;
      const lx = left ? x0 + tw + 14 : x0 - tw - 14;
      ctx.fillStyle = "#ff5a8a"; ctx.font = "800 12px system-ui, sans-serif";
      ctx.fillText(`♥${Math.max(0, p.lives)}`, lx, FLOOR + 35);
      if (p.weapon !== "harpoon" && p.lives > 0) drawItemIcon(p.weapon, left ? lx + 42 : lx - 42, FLOOR + 30);
      if (p.shield && p.lives > 0) drawItemIcon("shield", left ? lx + 68 : lx - 68, FLOOR + 30);
    });
  }
  function banner(text, sub, color = "#fff6ea") {
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(20,16,31,0.7)"; ctx.fillRect(0, 150, W, sub ? 96 : 70);
    ctx.font = "900 34px system-ui, sans-serif"; ctx.lineWidth = 6; ctx.strokeStyle = "#14101f";
    ctx.strokeText(text, W / 2, 196); ctx.fillStyle = color; ctx.fillText(text, W / 2, 196);
    if (sub) { ctx.font = "700 16px system-ui, sans-serif"; ctx.fillStyle = "#c4b8d6"; ctx.fillText(sub, W / 2, 226); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    buildBackground();
    ctx.drawImage(bgCache, 0, 0, W, FLOOR);
    // floor
    ctx.fillStyle = "#5a4a40"; ctx.fillRect(0, FLOOR - 3, W, 3);
    for (const pl of plats) drawPlat(pl);
    for (const it of items) if (!(it.t > 6 && Math.floor(clock * 10) % 2)) drawItemIcon(it.type, it.x, it.y, it.fruit);
    for (const p of players) for (const s of p.shots) drawShot(s, p);
    for (const b of balls) drawBall(b);
    for (const p of players) drawPlayer(p);
    for (const q of parts) { ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color; ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 26px system-ui, sans-serif" : "900 13px system-ui, sans-serif";
      ctx.lineWidth = q.big ? 5 : 3; ctx.strokeStyle = "#14101f"; ctx.strokeText(q.text, q.x, q.y);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    if (freezeT > 0) { ctx.fillStyle = "rgba(185,140,255,0.08)"; ctx.fillRect(0, 0, W, FLOOR); }
    drawHud();
    if (state === "intro") banner(`${PLACES[Math.floor(level / 3)].name} · LIVELLO ${level + 1}`, "PRONTI? VIA!", "#ffd34d");
    else if (state === "dead" && deathMsg) banner(deathMsg, null, "#ff3d5a");
    else if (state === "clear" && tally) banner("LIVELLO SUPERATO!", `Bonus tempo: ${tally.time} s × 20 = ${tally.per.toLocaleString("it-IT")}`, "#7dff9a");
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  // a sample stage behind the title screen
  players = [newPlayer(0)]; loadLevel(); state = "menu";
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pista da Ballo</title>
<style>
  :root {
    --bg: #12062a;
    --fg: #f4f6ee;
    --muted: #d8c0f0;
    --pink: #ff4ad8;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2a7a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: flick it towards each arrow (a diagonal presses two at once) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 74, 216, 0.6); background: radial-gradient(circle, rgba(255,74,216,0.14), rgba(255,74,216,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 74, 216, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 6, 42, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a6a, 0 0 22px rgba(255,74,216,0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0222; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a01a8a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const LANE = 58, LX = W / 2 - LANE * 2, TY = 70, SCROLL = 250;
  const DIRS = ["left", "down", "up", "right"], ROT = [Math.PI / 2, 0, Math.PI, -Math.PI / 2];
  const WIN = [0.045, 0.09, 0.14], JUDGE = [
    { name: "PERFETTO", pts: 300, life: 2, col: "#ffe84a" },
    { name: "OTTIMO", pts: 200, life: 1.5, col: "#4ae8ff" },
    { name: "BENE", pts: 100, life: 0.3, col: "#8aff8a" },
  ];
  // the songs of the night, one after the other; after the last one they come back faster
  const SONGS = [
    { name: "Luci al Neon", bpm: 112, root: 57, prog: [0, 7, 9, 5], style: 0 },
    { name: "Febbre del Sabato", bpm: 120, root: 60, prog: [0, 5, 7, 7], style: 1 },
    { name: "Pioggia di Stelle", bpm: 128, root: 62, prog: [9, 5, 0, 7], style: 0 },
    { name: "Ritmo Vulcano", bpm: 136, root: 55, prog: [0, 3, 5, 7], style: 2 },
    { name: "Galassia Disco", bpm: 144, root: 58, prog: [0, 8, 3, 10], style: 1 },
    { name: "Mezzanotte a Mille", bpm: 152, root: 61, prog: [9, 7, 5, 4], style: 2 },
  ];
  const MEASURES = 26;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "canzoni più lente · meno frecce · un errore costa poco", tempo: 0.88, dense: 0.7, drain: 6 },
    normale:   { label: "NORMALE",   color: "#ff4ad8", desc: "il ritmo giusto", tempo: 1, dense: 1, drain: 11 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "canzoni più veloci · più frecce e salti · un errore costa caro", tempo: 1.1, dense: 1.25, drain: 13 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ballo-difficulty";
  const bestKey = (id) => `ballo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Music ----------
  // everything is synthesised: drums, bass and a lead that plays exactly on the arrows
  let audioCtx = null, master = null, audioStart = 0, scheduled = 0;
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function tone(when, freq, dur, type, vol, slide = 0) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, when);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), when + dur);
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(master); o.start(when); o.stop(when + dur + 0.02);
  }
  let noiseBuf = null;
  function hiss(when, dur, vol, freq, type = "bandpass") {
    if (!noiseBuf) { noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f).connect(g).connect(master); s.start(when, Math.random() * 0.5, dur + 0.02);
  }
  // schedules the music up to a little ahead of the song clock
  function scheduleMusic() {
    if (!audioCtx || !song || state !== "play") return;
    const ahead = songT + 0.25, beat = 60 / song.bpm;
    while (scheduled * beat / 4 < ahead && scheduled < song.steps) {
      const st = scheduled, t = st * beat / 4, when = audioStart + t;
      if (when > audioCtx.currentTime - 0.01) {
        const inBeat = st % 4, bar = Math.floor(st / 16), chord = song.prog[bar % 4], root = song.root + chord - 24;
        if (inBeat === 0) tone(when, 150, 0.16, "sine", 0.22, -110);
        if (song.style === 1 && st % 16 === 10) tone(when, 150, 0.16, "sine", 0.18, -110);
        if (st % 8 === 4) hiss(when, 0.13, 0.16, 1800);
        if (st % 2 === 0) hiss(when, 0.035, st % 4 === 2 ? 0.08 : 0.04, 8000, "highpass");
        if (song.style === 2 && st % 2 === 1) hiss(when, 0.02, 0.025, 9000, "highpass");
        if (st % 2 === 0) tone(when, hz(root + (st % 8 === 6 ? 12 : 0)), beat / 2 * 0.9, "triangle", 0.11);
        if (st % 16 === 0) for (const k of [0, 4, 7]) tone(when, hz(song.root + chord + k + (k === 4 && [3, 8, 10].includes(chord % 12) ? -1 : 0)), beat * 3.6, "sawtooth", 0.012);
      }
      scheduled++;
    }
    for (const n of notes) {
      if (n.sched || n.t > ahead) continue;
      n.sched = true;
      const when = audioStart + n.t;
      if (when > audioCtx.currentTime - 0.01) tone(when, hz(n.pitch), 0.13, "square", 0.03);
    }
  }
  const sfx = {
    miss: () => { if (audioCtx) tone(audioCtx.currentTime, 140, 0.1, "sawtooth", 0.03, -40); },
    clear: () => { if (!audioCtx) return; [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(audioCtx.currentTime + i * 0.08, f, 0.14, "square", 0.04)); },
    fail: () => { if (!audioCtx) return; [523, 466, 415, 392, 330, 262].forEach((f, i) => tone(audioCtx.currentTime + i * 0.15, f, 0.24, "triangle", 0.05)); },
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, stage = 1, bestCache = 0, life = 50, combo = 0, maxCombo = 0;
  let song = null, notes = [], songT = 0, counts = [0, 0, 0, 0], judgeShow = null, flashes = [0, 0, 0, 0], pose = -1, poseT = 0, message = null, sparks = [];
  const keys = {};
  const stick = { x: 0, y: 0 };
  const held = [false, false, false, false];

  // ---------- The chart ----------
  // arrows follow the melody: steady quarters at first, eighths, jumps and quick pairs later on
  function makeSong(n) {
    const base = SONGS[(n - 1) % SONGS.length], lap = Math.floor((n - 1) / SONGS.length);
    const bpm = Math.round(base.bpm * diff.tempo * (1 + 0.15 * lap));
    const lvl = Math.min(8, n - 1 + lap * 2);
    const s = { ...base, bpm, steps: (MEASURES + 1) * 16, lvl };
    const beat = 60 / bpm, list = [];
    const pEighth = Math.min(0.55, (0.08 + 0.09 * lvl) * diff.dense), pJump = lvl >= 1 ? Math.min(0.22, (0.04 + 0.03 * lvl) * diff.dense) : 0, pSix = lvl >= 3 ? Math.min(0.2, 0.04 * (lvl - 2) * diff.dense) : 0;
    const pRest = Math.max(0.05, 0.3 - 0.04 * lvl) / diff.dense;
    let last = 1, lastT = -1;
    const pick = (avoidSame, gap) => { let d; do d = Math.floor(Math.random() * 4); while (d === last && (avoidSame || Math.random() < 0.6) && gap < beat * 0.6); return d; };
    for (let m = 1; m <= MEASURES; m++) {
      const scale = [0, 2, 4, 7, 9];
      for (let b = 0; b < 4; b++) {
        const t0 = (m * 16 + b * 4) * beat / 4;
        if (m === MEASURES && b === 3) break;
        if (Math.random() < pRest && b % 2 === 1) continue;
        const add = (t, d, sub) => { list.push({ t, lane: d, sub, pitch: s.root + 12 + scale[(d + Math.floor(t / beat)) % 5] + (sub === 2 ? 12 : 0), hit: -1 }); last = d; lastT = t; };
        const d = pick(false, t0 - lastT);
        add(t0, d, 0);
        // a jump: two arrows that a diagonal of the stick can press together
        if (Math.random() < pJump && b % 2 === 0) { const pairs = { 0: [1, 2], 3: [1, 2], 1: [0, 3], 2: [0, 3] }; add(t0, pairs[d][Math.floor(Math.random() * 2)], 0); last = d; }
        if (Math.random() < pEighth) {
          add(t0 + beat / 2, pick(beat / 2 < 0.24, beat / 2), 1);
          if (Math.random() < pSix) add(t0 + beat * 0.75, pick(true, beat / 4), 2);
        }
      }
    }
    list.sort((a, b) => a.t - b.t);
    s.len = (MEASURES + 1) * 4 * beat;
    return { s, list };
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); master = audioCtx.createGain(); master.gain.value = 0.9; master.connect(audioCtx.destination); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; stage = 1; life = 50; combo = 0; maxCombo = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginSong();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginSong() {
    const m = makeSong(stage);
    song = m.s; notes = m.list; songT = -1.2; scheduled = 0; counts = [0, 0, 0, 0];
    life = Math.max(life, 50);
    message = { text: `CANZONE ${stage} · ${song.name.toUpperCase()}`, sub: `${song.bpm} battiti al minuto · ${notes.length} frecce`, t: 0 };
    state = "intro"; stateT = 2;
  }
  function syncAudio() { if (audioCtx) audioStart = audioCtx.currentTime - songT; }
  function judge(note, j) {
    note.hit = j; counts[j]++;
    combo++; maxCombo = Math.max(maxCombo, combo);
    const pts = Math.round(JUDGE[j].pts * (1 + Math.min(combo, 100) / 100) * (1 + 0.15 * (stage - 1)));
    score += pts;
    life = Math.min(100, life + JUDGE[j].life);
    judgeShow = { j, t: 0 };
    flashes[note.lane] = 0.25;
    for (let k = 0; k < 6; k++) sparks.push({ x: LX + note.lane * LANE + LANE / 2, y: TY, vx: rnd(-80, 80), vy: rnd(-90, 30), t: 0, c: JUDGE[j].col });
  }
  function missNote(note) {
    note.hit = 3; counts[3]++;
    if (window.__miss) window.__miss++;
    combo = 0; judgeShow = { j: 3, t: 0 };
    life -= diff.drain * (1 + 0.12 * (stage - 1)) * (window.__god ? 0 : 1);
    sfx.miss();
    if (life <= 0 && state === "play") { life = 0; failSong(); }
  }
  // a press on one arrow: the closest arrow still to hit in that lane, if close enough in time
  function press(lane, t) {
    if (state !== "play") return;
    pose = lane; poseT = 0.25;
    let best = null;
    for (const n of notes) {
      if (n.lane !== lane || n.hit >= 0) continue;
      if (n.t > t + WIN[2]) break;
      if (Math.abs(n.t - t) <= WIN[2] && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n;
    }
    if (!best) return;
    const e = Math.abs(best.t - t);
    judge(best, e <= WIN[0] ? 0 : e <= WIN[1] ? 1 : 2);
  }
  function grade() {
    const tot = notes.length || 1, pct = (counts[0] * 3 + counts[1] * 2 + counts[2]) / (tot * 3);
    return pct >= 0.93 ? "S" : pct >= 0.8 ? "A" : pct >= 0.65 ? "B" : pct >= 0.5 ? "C" : "D";
  }
  function clearSong() {
    const g = grade(), full = counts[3] === 0;
    const bonus = 1000 * stage + ({ S: 2000, A: 1000, B: 500, C: 200, D: 0 })[g] * stage + (full ? 1500 * stage : 0);
    score += bonus;
    message = { text: `${full ? "COMBO PERFETTA! " : ""}VOTO ${g}`, sub: `perfetti ${counts[0]} · ottimi ${counts[1]} · bene ${counts[2]} · mancati ${counts[3]} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
    sfx.clear(); state = "clear"; stateT = 3.4;
  }
  function failSong() {
    state = "fail"; stateT = 2.4;
    message = { text: "FUORI TEMPO!", sub: `la pista ti ha battuto alla canzone ${stage}`, t: 0, long: true };
    sfx.fail();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">SERATA FINITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${stage > 1 ? `${stage - 1} ${stage - 1 === 1 ? "canzone superata" : "canzoni superate"}` : "nessuna canzone superata"} · combo massima ${maxCombo} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>BALLA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      if (audioCtx) audioCtx.suspend();
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare · la canzone riparte da un attimo prima</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
      // back a little, so the music doesn't restart in the middle of an arrow
      if (state === "play") { songT -= 1.5; for (const n of notes) if (n.t > songT) n.sched = false; scheduled = Math.max(0, Math.floor(songT / (60 / song.bpm / 4))); }
      if (audioCtx) audioCtx.resume().then(syncAudio);
      syncAudio();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); if (audioCtx) audioCtx.resume(); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PISTA DA BALLO</h1>
       <p>Le frecce salgono a tempo di musica: premi la direzione giusta quando ogni freccia arriva sulla sagoma in alto. Più sei preciso più fai punti, e la serie di frecce prese di fila li moltiplica. Ogni freccia mancata svuota la barra dell'energia: se si svuota, la serata finisce. Ogni canzone è più veloce della precedente.</p>
       <div class="pts">
         <span><b>Precisione</b></span><span>PERFETTO 300 · OTTIMO 200 · BENE 100 · ogni freccia di fila aggiunge l'1% (fino al doppio)</span>
         <span><b>Frecce</b></span><span>rosse sul battito · blu a metà · gialle sui quarti · due frecce insieme: premile insieme</span>
         <span><b>Canzone</b></span><span>bonus 1.000 e un voto da D a S · combo perfetta senza errori 1.500 · dalla 2ª canzone tutto vale di più</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Spingi la levetta verso la freccia e torna al centro tra una freccia e l'altra · in diagonale premi due frecce insieme (con le frecce del menu è ancora più facile)</p>`
         : `<p class="muted help">Frecce o W A S D · P pausa · alza il volume!</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SI BALLA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  // the moment of a press, on the song clock, between two updates
  let lastStepWall = performance.now();
  const nowT = () => songT + Math.min(0.05, (performance.now() - lastStepWall) / 1000);
  const KEYMAP = { arrowleft: 0, a: 0, arrowdown: 1, s: 1, arrowup: 2, w: 2, arrowright: 3, d: 3 };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (e.repeat) return;
    const lane = KEYMAP[k];
    if (lane !== undefined) { held[lane] = true; press(lane, nowT()); }
  });
  window.addEventListener("keyup", (e) => { const lane = KEYMAP[e.key.toLowerCase()]; if (lane !== undefined) held[lane] = false; });
  window.addEventListener("blur", () => { held.fill(false); stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  const stickOn = [false, false, false, false];
  // pushing the stick into a direction presses that arrow; it has to come back before pressing it again
  function stickDirs() {
    const on = [stick.x < -0.45, stick.y > 0.45, stick.y < -0.45, stick.x > 0.45];
    const t = nowT();
    for (let i = 0; i < 4; i++) { if (on[i] && !stickOn[i]) press(i, t); stickOn[i] = on[i]; held[i] = on[i]; }
  }
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.18 ? 0 : Math.sign(v) * Math.min(1, (a - 0.18) / 0.55); };
    stick.x = f(dx); stick.y = f(dy);
    stickDirs();
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; stickDirs(); };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    lastStepWall = performance.now();
    if (window.__bot) window.__bot(dt);
    for (let i = 0; i < 4; i++) if (flashes[i] > 0) flashes[i] -= dt;
    if (poseT > 0) poseT -= dt;
    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; }
    sparks = sparks.filter((s) => s.t < 0.5);
    if (judgeShow) { judgeShow.t += dt; if (judgeShow.t > 0.6) judgeShow = null; }
    if (message) { message.t += dt; if (message.t > (message.long ? 3 : 2)) message = null; }
    if (state === "intro") { stateT -= dt; if (stateT <= 0) { state = "play"; syncAudio(); } return; }
    if (state === "clear" || state === "fail") {
      stateT -= dt;
      if (stateT <= 0) { if (state === "clear") { stage++; beginSong(); } else gameOver(); }
      return;
    }
    if (state !== "play") return;
    songT += dt;
    // keep the song clock on the audio clock
    if (audioCtx && audioCtx.state === "running" && !window.__fast) { const a = audioCtx.currentTime - audioStart, d = a - songT; if (Math.abs(d) > 0.25) syncAudio(); else songT += d * 0.05; }
    scheduleMusic();
    for (const n of notes) { if (n.t > songT) break; if (n.hit < 0 && songT - n.t > WIN[2]) { missNote(n); if (state !== "play") return; } }
    if (songT > song.len + 0.3) clearSong();
  }

  // ---------- Drawing ----------
  function arrow(x, y, lane, s, fill, stroke) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ROT[lane]); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 20); ctx.lineTo(-19, 1); ctx.lineTo(-8, 1); ctx.lineTo(-8, -19); ctx.lineTo(8, -19); ctx.lineTo(8, 1); ctx.lineTo(19, 1); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.stroke(); }
    ctx.restore();
  }
  function drawScene() {
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#1a0838"); g.addColorStop(1, "#3a0a4a");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    const beatF = song && state === "play" ? (songT * song.bpm / 60) % 1 : (clock * 2) % 1, pulse = Math.max(0, 1 - beatF * 3);
    // disco lights sweeping from above
    for (let i = 0; i < 5; i++) {
      const a = Math.sin(clock * 0.8 + i * 1.3) * 0.5, x = 60 + i * 130;
      ctx.fillStyle = `hsla(${(i * 70 + clock * 30) % 360},90%,60%,${0.06 + pulse * 0.05})`;
      ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x + Math.sin(a) * 300 - 40, H); ctx.lineTo(x + Math.sin(a) * 300 + 40, H); ctx.fill();
    }
    // the light-up dance floor at the sides
    for (const side of [0, 1]) for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const x = (side ? W - 150 : 18) + c * 44, y = 230 + r * 40;
      const on = (r + c + Math.floor(clock * (song ? song.bpm / 60 : 2))) % 3 === 0;
      ctx.fillStyle = on ? `hsla(${(r * 60 + c * 40 + side * 180) % 360},90%,${55 + pulse * 15}%,0.85)` : "rgba(255,255,255,0.06)";
      ctx.fillRect(x, y, 40, 36);
    }
    // the mirror ball
    ctx.fillStyle = "#c8c8d8"; ctx.beginPath(); ctx.arc(W / 2, TOP + 2, 12, 0, Math.PI); ctx.fill();
    // the lanes
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(LX - 6, TOP, LANE * 4 + 12, H - TOP);
    for (let i = 0; i < 4; i++) {
      if (flashes[i] > 0) { ctx.fillStyle = `rgba(255,255,255,${flashes[i] * 0.6})`; ctx.fillRect(LX + i * LANE, TOP, LANE, H - TOP); }
      if (held[i]) { ctx.fillStyle = "rgba(255,74,216,0.12)"; ctx.fillRect(LX + i * LANE, TOP, LANE, H - TOP); }
    }
    // the targets, beating in time
    for (let i = 0; i < 4; i++) arrow(LX + i * LANE + LANE / 2, TY, i, 1 + pulse * 0.08, held[i] ? "rgba(255,255,255,0.25)" : "rgba(255,255,255,0.08)", `rgba(255,255,255,${0.55 + pulse * 0.4})`);
  }
  function drawDancer() {
    // the dancer on the left strikes a pose for each arrow
    const x = 92, y = 200, p = poseT > 0 ? pose : -1, bob = song && state === "play" ? Math.abs(Math.sin(songT * Math.PI * song.bpm / 60)) * 4 : 0;
    ctx.save(); ctx.translate(x, y - bob);
    ctx.strokeStyle = "#ffd8b0"; ctx.lineWidth = 5; ctx.lineCap = "round";
    const arms = [[[-22, -6], [-10, 14]], [[-12, 16], [12, 16]], [[-14, -36], [14, -36]], [[10, 14], [22, -6]]][p] || [[-14, 6], [14, 6]];
    ctx.beginPath(); ctx.moveTo(-7, -18); ctx.lineTo(-7 + arms[0][0] * 0.6, -18 + arms[0][1] * 0.6); ctx.moveTo(7, -18); ctx.lineTo(7 + arms[1][0] * 0.6, -18 + arms[1][1] * 0.6); ctx.stroke();
    const legs = p === 0 ? [[-18, 26], [6, 28]] : p === 3 ? [[-6, 28], [18, 26]] : p === 1 ? [[-14, 24], [14, 24]] : [[-6, 30], [6, 30]];
    ctx.strokeStyle = "#2a2a5a"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-4, 4); ctx.lineTo(legs[0][0], legs[0][1]); ctx.moveTo(4, 4); ctx.lineTo(legs[1][0], legs[1][1]); ctx.stroke();
    ctx.fillStyle = "#ff4ad8"; ctx.beginPath(); ctx.ellipse(0, -10, 11, 16, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffd23a"; ctx.fillRect(-11, -2, 22, 3);
    ctx.fillStyle = "#ffd8b0"; ctx.beginPath(); ctx.arc(0, -34, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a1a0a"; ctx.beginPath(); ctx.arc(0, -38, 9, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-5, -36, 10, 3);
    ctx.restore();
    // the speaker on the right, its cone pumping on the beat
    const beatF = song && state === "play" ? (songT * song.bpm / 60) % 1 : 0.5, pump = Math.max(0, 1 - beatF * 4);
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(W - 128, 100, 70, 110);
    for (const [cy, r] of [[130, 14], [180, 22]]) { ctx.fillStyle = "#3a3a4a"; ctx.beginPath(); ctx.arc(W - 93, cy, r + pump * 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#6a6a7a"; ctx.beginPath(); ctx.arc(W - 93, cy, r * 0.35, 0, TAU); ctx.fill(); }
  }
  function drawNotes() {
    if (!song) return;
    const sp = SCROLL * (1 + Math.min(0.3, (song.bpm - 120) / 300));
    for (const n of notes) {
      if (n.hit >= 0 && n.hit < 3) continue;
      const y = TY + (n.t - songT) * sp;
      if (y > H + 30) break;
      if (y < TOP - 30) continue;
      const col = ["#ff4a5a", "#4a8aff", "#ffd23a"][n.sub];
      ctx.globalAlpha = n.hit === 3 ? 0.35 : 1;
      arrow(LX + n.lane * LANE + LANE / 2, y, n.lane, 0.95, col, "#ffffff");
      ctx.globalAlpha = 1;
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(18,6,42,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#d8c0f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 90, 9);
    ctx.fillStyle = "#ff4ad8"; ctx.font = "900 10px system-ui"; ctx.fillText(song ? `${stage} · ${song.name.toUpperCase()} · ${song.bpm} BPM` : "", x0 + 90, 21);
    // the energy bar
    const bx = touchMode ? W - 200 : W - 170, bw = 150;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 8, bw, 12);
    ctx.fillStyle = life < 25 ? (Math.floor(clock * 6) % 2 ? "#ff3a3a" : "#ff8a3a") : "#4aff9a"; ctx.fillRect(bx, 8, bw * life / 100, 12);
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(bx, 8, bw, 12);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 8px system-ui"; ctx.textAlign = "right"; ctx.fillText("ENERGIA", bx - 4, 14);
    // song progress along the lanes' bottom edge
    if (song && state === "play") { ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(LX - 6, H - 3, (LANE * 4 + 12) * clamp(songT / song.len, 0, 1), 3); }
    ctx.textBaseline = "alphabetic";
    if (judgeShow) {
      const J = judgeShow.j === 3 ? { name: "MANCATO", col: "#ff5a5a" } : JUDGE[judgeShow.j], k = 1 + Math.max(0, 0.15 - judgeShow.t) * 2;
      ctx.save(); ctx.translate(W / 2, 170); ctx.scale(k, k);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.lineWidth = 5; ctx.strokeStyle = "#12062a"; ctx.strokeText(J.name, 0, 0); ctx.fillStyle = J.col; ctx.fillText(J.name, 0, 0);
      ctx.restore();
    }
    if (combo >= 5) { ctx.textAlign = "center"; ctx.font = "900 15px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeStyle = "#12062a"; ctx.strokeText(`${combo} DI FILA`, W / 2, 196); ctx.fillText(`${combo} DI FILA`, W / 2, 196); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!song && state === "menu") { const m = makeSong(1); song = m.s; notes = m.list; songT = 3; }
    drawScene();
    drawDancer();
    drawNotes();
    for (const s of sparks) { ctx.globalAlpha = Math.max(0, 1 - s.t / 0.5); ctx.fillStyle = s.c; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (state === "intro" && stateT < 1.2) { ctx.textAlign = "center"; ctx.font = "italic 900 30px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 6; ctx.strokeStyle = "#12062a"; const t = stateT > 0.6 ? "PRONTI?" : "VIA!"; ctx.strokeText(t, W / 2, 250); ctx.fillText(t, W / 2, 250); }
    if (message) {
      const lifeT = message.long ? 3 : 2;
      ctx.globalAlpha = Math.min(1, (lifeT - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ff4ad8";
      ctx.lineWidth = 5; ctx.strokeStyle = "#12062a"; ctx.strokeText(message.text, W / 2, 118); ctx.fillText(message.text, W / 2, 118);
      if (message.sub) { ctx.font = "800 11px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 138); ctx.fillText(message.sub, W / 2, 138); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="ballo-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Capostazione</title>
<style>
  :root {
    --bg: #16241a;
    --fg: #f4f6ee;
    --muted: #c8d0dc;
    --gold: #ffd24a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2e3a4e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 26, 36, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #6a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  #overlay .menuList { display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; max-width: 600px; font-size: 13px; color: var(--muted); }
  #overlay .menuList span { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 4px 9px; }
  #overlay .menuList b { color: var(--gold); }
  #overlay .upgs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button.upg { display: flex; flex-direction: column; gap: 3px; width: 170px; text-align: center; letter-spacing: 0.3px; font-size: 13px; }
  #overlay button.upg span { font-weight: 600; font-size: 12px; color: var(--muted); }
  #overlay button.upg:disabled { opacity: 0.4; cursor: default; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
    #overlay .menuList { font-size: 11px; gap: 4px; }
    #overlay button.upg { width: 150px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => Math.floor(n).toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "treni lenti e radi · quattro cuori", speed: 0.75, gap: 1.3, lives: 4 },
    normale:   { label: "NORMALE",   color: "#ffd24a", desc: "l'orario di tutti i giorni · tre cuori", speed: 1, gap: 1, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "ora di punta: treni veloci e fitti · tre cuori", speed: 1.28, gap: 0.82, lives: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "capostazione-difficulty";
  const bestKey = (id) => `capostazione-best-${id}`;
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];

  // ---------- Colors, shapes, levels ----------
  const LINES = [
    { name: "Rossa", c: "#e8423a", shape: "circle", note: 0 }, { name: "Blu", c: "#3a6ae8", shape: "square", note: 2 },
    { name: "Gialla", c: "#f2c230", shape: "triangle", note: 4 }, { name: "Verde", c: "#3aa84a", shape: "diamond", note: 5 },
    { name: "Viola", c: "#9a4ad8", shape: "star", note: 7 }, { name: "Arancio", c: "#f2862a", shape: "hex", note: 9 },
    { name: "Rosa", c: "#f070b0", shape: "heart", note: 11 }, { name: "Azzurra", c: "#30c0d8", shape: "plus", note: 12 },
  ];
  // stations per tunnel, train count, speed factor
  const LEVELS = [
    { trees: [3], trains: 8 }, { trees: [4], trains: 10 }, { trees: [5], trains: 12 }, { trees: [6], trains: 13 },
    { trees: [3, 3], trains: 14 }, { trees: [7], trains: 15 }, { trees: [4, 4], trains: 16 }, { trees: [8], trains: 17 },
    { trees: [3, 3, 2], trains: 18 }, { trees: [4, 4], trains: 22 },
  ];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), pauseBtn = document.getElementById("pauseBtn");
  let W = 640, H = 360, portrait = false, pxRatio = 1;
  function toXY(u, v) { return portrait ? { x: 22 + v * 316, y: 86 + u * 532 } : { x: 26 + u * 588, y: 54 + v * 292 }; }
  function resize() {
    portrait = window.innerHeight > window.innerWidth * 1.05;
    W = portrait ? 360 : 640; H = portrait ? 640 : 360;
    const s = Math.max(0.2, Math.min((window.innerWidth - 4) / W, (window.innerHeight - 4) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio); canvas.height = Math.round(H * pxRatio);
    if (nodes.length) geometry();
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Sound ----------
  let audioCtx = null;
  function tone(freq, dur, type = "square", vol = 0.03, delay = 0, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const sfx = {
    click: () => { tone(1800, 0.03, "square", 0.025); tone(900, 0.04, "square", 0.02, 0.03); },
    arrive: (n) => { tone(midi(72 + n), 0.18, "triangle", 0.05); tone(midi(79 + n), 0.25, "triangle", 0.03, 0.08); },
    wrong: () => { tone(200, 0.35, "sawtooth", 0.05, 0, 110); tone(150, 0.35, "square", 0.03, 0.05, 90); },
    whistle: () => { tone(1240, 0.22, "sine", 0.025); tone(1480, 0.3, "sine", 0.02, 0.05); },
    level: () => [0, 4, 7, 12].forEach((n, i) => tone(midi(72 + n), 0.16, "square", 0.03, i * 0.1)),
  };
  // a little "clickety-clack" ditty
  const TUNE = [60, 64, 67, 64, 65, 69, 72, 69, 67, 71, 74, 71, 72, 67, 64, 67];
  let tb = 0, nextT = 0, music = load("capostazione-music") !== "0";
  setInterval(() => {
    if (!audioCtx || !music || state !== "play") { if (audioCtx) nextT = audioCtx.currentTime + 0.05; return; }
    while (nextT < audioCtx.currentTime + 0.15) {
      const d = Math.max(0, nextT - audioCtx.currentTime);
      if (tb % 2 === 0) tone(midi(TUNE[(tb / 2) % TUNE.length]), 0.16, "triangle", 0.016, d);
      if (tb % 4 === 0) tone(midi(TUNE[(tb / 2) % TUNE.length] - 24), 0.2, "triangle", 0.022, d);
      if (tb % 2 === 1) tone(5000, 0.012, "square", 0.004, d);
      tb++; nextT += 0.17;
    }
  }, 50);

  // ---------- The network ----------
  // nodes: tunnel (root) → switches → stations; each edge goes from a node to its child: vertical first, then horizontal
  let nodes = [], tunnels = [], switches = [], stations = [], deco = [];
  function buildLevel(L) {
    const def = LEVELS[L - 1], rng = mulberry(L * 7919 + 13);
    nodes = []; tunnels = []; switches = []; stations = [];
    const total = def.trees.reduce((a, b) => a + b, 0);
    const colors = LINES.map((_, i) => i).sort(() => rng() - 0.5).slice(0, total);
    let slot = 0, ci = 0;
    def.trees.forEach((n, ti) => {
      // random binary tree with n leaves
      const mk = (k, depth) => {
        if (k === 1) return { kind: "station", depth, children: [] };
        let a = Math.round(k / 2 + (rng() - 0.5) * (k - 1) * 0.9); a = clamp(a, 1, k - 1);
        const nd = { kind: "switch", depth, children: [mk(a, depth + 1), mk(k - a, depth + 1)] };
        nd.children.forEach((c) => (c.parent = nd)); return nd;
      };
      const root = mk(n, 1), tun = { kind: "tunnel", depth: 0, children: [root], tree: ti }; root.parent = tun;
      const all = [];
      (function walk(nd) { all.push(nd); nd.children.forEach(walk); })(tun);
      const D = Math.max(...all.map((x) => x.depth));
      // leaves get even slots across the whole screen (gaps between tunnels' groups)
      const slots = total + (def.trees.length - 1) * 0.6;
      (function place(nd) {
        nd.tree = ti;
        if (nd.kind === "station") { nd.v = (slot + 0.5) / slots; slot++; nd.color = colors[ci++]; }
        else { nd.children.forEach(place); nd.v = nd.children.reduce((a, c) => a + c.v, 0) / nd.children.length; }
      })(tun);
      slot += 0.6;
      tun.v = root.v;
      for (const nd of all) { nd.u = nd.kind === "tunnel" ? 0 : 0.05 + 0.91 * (nd.depth / D); nd.id = nodes.length; nodes.push(nd); }
      // a station that ends early sits at its own depth; switches near the edge get a bit more room
      tunnels.push(tun);
    });
    for (const nd of nodes) { if (nd.kind === "switch") { nd.state = 0; switches.push(nd); } if (nd.kind === "station") stations.push(nd); }
    switches.sort((a, b) => a.u - b.u || a.v - b.v).forEach((s, i) => (s.num = i + 1));
    geometry();
  }
  function roundPoly(pts, r) {
    // polyline with rounded corners, sampled
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const l1 = Math.hypot(b.x - a.x, b.y - a.y), l2 = Math.hypot(c.x - b.x, c.y - b.y), rr = Math.min(r, l1 / 2, l2 / 2);
      const p1 = { x: b.x + ((a.x - b.x) / l1) * rr, y: b.y + ((a.y - b.y) / l1) * rr }, p2 = { x: b.x + ((c.x - b.x) / l2) * rr, y: b.y + ((c.y - b.y) / l2) * rr };
      for (let k = 0; k <= 8; k++) { const t = k / 8, m = 1 - t; out.push({ x: m * m * p1.x + 2 * m * t * b.x + t * t * p2.x, y: m * m * p1.y + 2 * m * t * b.y + t * t * p2.y }); }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function geometry() {
    for (const nd of nodes) { const p = toXY(nd.u, nd.v); nd.x = p.x; nd.y = p.y; }
    for (const nd of nodes) {
      if (!nd.parent) continue;
      const P = nd.parent, corner = portrait ? { x: nd.x, y: P.y } : { x: P.x, y: nd.y };
      let pts = [{ x: P.x, y: P.y }, corner, { x: nd.x, y: nd.y }].filter((p, i, arr) => i === 0 || Math.hypot(p.x - arr[i - 1].x, p.y - arr[i - 1].y) > 0.5);
      pts = pts.length > 2 ? roundPoly(pts, 16) : pts;
      const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
      const oldLen = nd.len; nd.pts = pts; nd.cum = cum; nd.len = cum[cum.length - 1];
      if (oldLen && oldLen !== nd.len) for (const t of trains) if (t.path[t.path.length - 1] === nd) t.s *= nd.len / oldLen;
    }
    // scenery away from the tracks
    const rng = mulberry(level * 31 + (portrait ? 7 : 3)); deco = [];
    for (let k = 0; k < 400 && deco.length < 34; k++) {
      const x = 10 + rng() * (W - 20), y = (portrait ? 52 : 40) + rng() * (H - (portrait ? 60 : 48));
      let ok = true;
      for (const nd of nodes) { if (Math.hypot(nd.x - x, nd.y - y) < 30) { ok = false; break; } if (nd.pts) for (let i = 0; i < nd.pts.length; i += 2) if (Math.hypot(nd.pts[i].x - x, nd.pts[i].y - y) < 20) { ok = false; break; } if (!ok) break; }
      if (ok && !deco.some((d) => Math.hypot(d.x - x, d.y - y) < 22)) deco.push({ x, y, k: Math.floor(rng() * 5), s: 0.8 + rng() * 0.5 });
    }
  }
  function pointAt(nd, s) {
    // position and direction at distance s along the edge into nd
    const c = nd.cum, P = nd.pts; s = clamp(s, 0, nd.len);
    let i = 1; while (i < c.length - 1 && c[i] < s) i++;
    const a = P[i - 1], b = P[i], seg = c[i] - c[i - 1] || 1, t = (s - c[i - 1]) / seg;
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, a: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  function trainPoint(t, back) {
    // walk back from the head along the edges already travelled
    let k = t.path.length - 1, s = t.s - back;
    while (s < 0 && k > 0) { k--; s += t.path[k].len; }
    if (s < 0) return null; // still inside the tunnel
    return pointAt(t.path[k], s);
  }

  // ---------- State ----------
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let level = 1, score = 0, lives = 3, streak = 0, bestStreak = 0, levelErrors = 0, totalOk = 0, totalBad = 0;
  let trains = [], toSpawn = 0, queue = [], spawnT = 0, fx = [], texts = [], shake = 0;
  const speed = () => 34 * diff.speed * (1 + 0.08 * (level - 1)) * (portrait ? 1.15 : 1);
  const CAR = 15, CARS = 3;

  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    level = 1; score = 0; lives = diff.lives; streak = 0; bestStreak = 0; totalOk = 0; totalBad = 0;
    startLevel();
  }
  function startLevel() {
    buildLevel(level); trains = []; fx = []; texts = []; levelErrors = 0;
    const def = LEVELS[level - 1];
    toSpawn = Math.round(def.trains * (difficulty === "facile" ? 0.85 : 1));
    // per tunnel queue of colors (no colour three times in a row)
    queue = tunnels.map(() => []);
    spawnT = 1.2;
    state = "intro"; menu = null;
    const news = level === 5 ? "<p>Da qui le gallerie sono due: ogni galleria porta solo alle sue stazioni.</p>" : level === 9 ? "<p>Tre gallerie insieme!</p>" : level === 10 ? "<p>Ultima corsa: l'ora di punta.</p>" : "";
    showOverlay(`<h2>LIVELLO ${level} DI ${LEVELS.length}</h2><p>${stations.length} stazioni · ${toSpawn} treni da smistare</p>${news}
      <div class="menuList">${stations.map((s) => `<span style="color:${LINES[s.color].c}"><b style="color:${LINES[s.color].c}">${shapeChar(LINES[s.color].shape)}</b> ${LINES[s.color].name}</span>`).join("")}</div>
      <button class="start" data-go>VIA!</button>`);
    syncControls();
  }
  const shapeChar = (s) => ({ circle: "●", square: "■", triangle: "▲", diamond: "◆", star: "★", hex: "⬢", heart: "♥", plus: "✚" })[s];
  function nextColor(ti) {
    const opts = stations.filter((s) => s.tree === ti).map((s) => s.color), q = queue[ti];
    let c; do { c = opts[Math.floor(Math.random() * opts.length)]; } while (q.length >= 2 && q[q.length - 1] === c && q[q.length - 2] === c && opts.length > 1);
    q.push(c); return c;
  }
  function spawn() {
    // pick a tunnel whose mouth is clear
    const free = tunnels.filter((tn) => !trains.some((t) => t.tunnel === tn && t.path.length === 1 && t.s < CAR * CARS + 26));
    if (!free.length) return false;
    const tn = free[Math.floor(Math.random() * free.length)];
    const color = tn.next !== undefined ? tn.next : nextColor(tn.tree);
    tn.next = undefined;
    trains.push({ tunnel: tn, color, path: [tn.children[0]], s: -8, done: 0, ok: false, puff: 0 });
    sfx.whistle(); return true;
  }
  function toggle(sw) { if (state !== "play") return; sw.state ^= 1; sw.flash = 0.25; sfx.click(); }

  // ---------- Update ----------
  function update(dt) {
    clock += dt; shake = Math.max(0, shake - dt * 2);
    for (const f of fx) f.t += dt; fx = fx.filter((f) => f.t < f.life);
    for (const t of texts) t.t += dt; texts = texts.filter((t) => t.t < 1.3);
    for (const s of switches) if (s.flash) s.flash = Math.max(0, s.flash - dt);
    if (state !== "play") return;
    // the next train is announced above its tunnel before it comes out
    spawnT -= dt;
    if (toSpawn > 0) {
      for (const tn of tunnels) if (tn.next === undefined && toSpawn > tunnels.filter((x) => x.next !== undefined).length) tn.next = nextColor(tn.tree);
      if (spawnT <= 0) { if (spawn()) { toSpawn--; spawnT = (2.5 + Math.random() * 1.4) * diff.gap / (1 + 0.06 * (level - 1)) / Math.sqrt(tunnels.length * 0.8 + 0.2); } else spawnT = 0.4; }
    } else for (const tn of tunnels) tn.next = undefined;
    const v = speed();
    for (const t of trains) {
      if (t.done) { t.done += dt; continue; }
      t.s += v * dt; t.puff -= dt;
      if (t.puff <= 0 && t.s > 0) { t.puff = 0.35; const p = trainPoint(t, 0); if (p) fx.push({ kind: "smoke", x: p.x, y: p.y - 6, t: 0, life: 1.1 }); }
      let edge = t.path[t.path.length - 1];
      while (t.s >= edge.len) {
        if (edge.kind === "station") { arrive(t, edge); break; }
        t.s -= edge.len; edge = edge.children[edge.state]; t.path.push(edge);
      }
    }
    trains = trains.filter((t) => t.done < 0.8);
    if (state === "play" && toSpawn <= 0 && !trains.length) endLevel();
  }
  function arrive(t, st) {
    t.done = 0.001; t.s = st.len;
    const good = st.color === t.color;
    if (good) {
      streak++; bestStreak = Math.max(bestStreak, streak); totalOk++;
      const pts = 50 + 10 * level + 5 * Math.min(streak, 20); score += pts;
      texts.push({ x: st.x, y: st.y - 18, text: `+${pts}`, c: "#fff6a0", t: 0 });
      fx.push({ kind: "ring", x: st.x, y: st.y, c: LINES[st.color].c, t: 0, life: 0.6 });
      sfx.arrive(LINES[st.color].note);
      if (streak === 30) feat("serie");
    } else {
      streak = 0; lives--; levelErrors++; totalBad++; shake = 1; t.wrong = true;
      texts.push({ x: st.x, y: st.y - 18, text: "STAZIONE SBAGLIATA!", c: "#ff9a8a", t: 0 });
      fx.push({ kind: "x", x: st.x, y: st.y, t: 0, life: 0.9 });
      sfx.wrong();
      if (lives <= 0) { state = "ending"; setTimeout(() => gameOver(false), 1200); }
    }
  }
  function endLevel() {
    state = "between";
    if (!levelErrors && level >= 3) feat("senzaerrori");
    const bonus = levelErrors ? 0 : 100 * level; score += bonus;
    if (level >= LEVELS.length) { feat("capolinea"); gameOver(true); return; }
    const gain = lives < diff.lives; if (gain) lives++;
    sfx.level();
    menu = () => showOverlay(`<h2>LIVELLO ${level} FATTO!</h2><p>${levelErrors ? `${levelErrors} ${levelErrors > 1 ? "treni sbagliati" : "treno sbagliato"}` : `Nessun errore: bonus <b>+${bonus}</b>`}${gain ? " · un cuore in più" : ""}</p>
      <p>Punti: <b>${nf(score)}</b> · serie migliore ${bestStreak}</p><button class="start" data-next>LIVELLO ${level + 1}</button>`);
    menu(); syncControls();
  }
  function gameOver(won, quit = false) {
    if (state === "over") return;
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0, record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      (won ? `<h2>CAPOLINEA!</h2><p>Dieci livelli di scambi e neanche un passeggero perso per strada: la ferrovia è tua.</p>`
           : `<h2 class="lose">FINE SERVIZIO</h2><p>${quit ? `Hai chiuso la cabina al livello ${level}.` : `Troppi treni alla stazione sbagliata: il servizio si ferma al livello ${level}.`}</p>`) +
      `<p>Punti: <b>${nf(score)}</b> · treni giusti ${totalOk} · serie migliore ${bestStreak} · ${diff.label}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>NUOVO TURNO</button>`);
    menu(); syncControls();
  }

  // ---------- Drawing ----------
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function shapePath(shape, x, y, r) {
    ctx.beginPath();
    switch (shape) {
      case "circle": ctx.arc(x, y, r, 0, TAU); break;
      case "square": ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7); break;
      case "triangle": ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.95, y + r * 0.75); ctx.lineTo(x - r * 0.95, y + r * 0.75); ctx.closePath(); break;
      case "diamond": ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); break;
      case "star": for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); break;
      case "hex": for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); break;
      case "heart": ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.5, y - r * 0.1, x - r * 0.6, y - r * 1.3, x, y - r * 0.45); ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.5, y - r * 0.1, x, y + r * 0.9); break;
      case "plus": { const a = r * 0.36; ctx.moveTo(x - a, y - r); ctx.lineTo(x + a, y - r); ctx.lineTo(x + a, y - a); ctx.lineTo(x + r, y - a); ctx.lineTo(x + r, y + a); ctx.lineTo(x + a, y + a); ctx.lineTo(x + a, y + r); ctx.lineTo(x - a, y + r); ctx.lineTo(x - a, y + a); ctx.lineTo(x - r, y + a); ctx.lineTo(x - r, y - a); ctx.lineTo(x - a, y - a); ctx.closePath(); break; }
    }
  }
  function strokePts(pts) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke(); }
  function drawTracks() {
    const edges = nodes.filter((n) => n.pts);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#9a8a6a"; ctx.lineWidth = 14; edges.forEach((e) => strokePts(e.pts));
    ctx.strokeStyle = "#5a3e26"; ctx.lineWidth = 11; ctx.setLineDash([3, 4]); ctx.lineCap = "butt"; edges.forEach((e) => strokePts(e.pts)); ctx.setLineDash([]); ctx.lineCap = "round";
    // two rails: a light stroke, hollowed in the middle
    for (const e of edges) {
      const sw = e.parent.kind === "switch" ? e.parent : null, active = !sw || sw.children[sw.state] === e;
      ctx.strokeStyle = active ? "#e8ecf0" : "#8a9098"; ctx.lineWidth = 7; strokePts(e.pts);
      ctx.strokeStyle = "#7a6a52"; ctx.lineWidth = 3.4; strokePts(e.pts);
    }
  }
  function drawSwitch(s) {
    const act = s.children[s.state], other = s.children[1 - s.state];
    // arrow pointing down the active branch
    const p = pointAt(act, Math.min(22, act.len * 0.5)), q = pointAt(other, Math.min(16, other.len * 0.5));
    const pulse = s.flash ? 1 + s.flash * 1.2 : 1;
    circ(s.x, s.y, 15 * pulse); ctx.fillStyle = "rgba(20,30,20,0.55)"; ctx.fill();
    circ(s.x, s.y, 13); ctx.fillStyle = "#fff4c8"; ctx.fill(); ctx.strokeStyle = "#3a2a10"; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "rgba(120,110,90,0.5)"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + (q.x - s.x) * 0.45, s.y + (q.y - s.y) * 0.45); ctx.stroke();
    const a = Math.atan2(p.y - s.y, p.x - s.x);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a);
    ctx.fillStyle = "#2a8a3a"; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-2, -7); ctx.lineTo(-2, -2.5); ctx.lineTo(-8, -2.5); ctx.lineTo(-8, 2.5); ctx.lineTo(-2, 2.5); ctx.lineTo(-2, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (!touchMode && s.num <= 9) { ctx.fillStyle = "#fff"; ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; circ(s.x + 13, s.y - 12, 6.5); ctx.fillStyle = "#2a3a5a"; ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(s.num, s.x + 13, s.y - 11.5); }
  }
  function drawStation(st) {
    const L = LINES[st.color], e = st.pts, last = e[e.length - 1], prev = e[e.length - 3] || e[0], a = Math.atan2(last.y - prev.y, last.x - prev.x);
    // buffer stop
    ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(a);
    ctx.fillStyle = "#c8302a"; ctx.fillRect(2, -8, 4, 16); ctx.restore();
    // the station badge
    const bx = st.x + Math.cos(a) * 17, by = st.y + Math.sin(a) * 17;
    circ(bx, by, 14); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = L.c; ctx.lineWidth = 4; ctx.stroke();
    shapePath(L.shape, bx, by, 8); ctx.fillStyle = L.c; ctx.fill();
    st.bx = bx; st.by = by;
  }
  function drawTunnel(tn) {
    const x = tn.x, y = tn.y, a = portrait ? Math.PI / 2 : 0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.fillStyle = "#6a6a72"; ctx.beginPath(); ctx.ellipse(-18, 0, 26, 30, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#7a7a84"; ctx.beginPath(); ctx.ellipse(-22, -6, 18, 20, 0, 0, TAU); ctx.fill();
    rr(-4, -15, 12, 30, 6); ctx.fillStyle = "#1a1416"; ctx.fill(); ctx.strokeStyle = "#c8b890"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
    if (tn.next !== undefined && state === "play") {
      const L = LINES[tn.next], ix = portrait ? x + 28 : x + 30, iy = portrait ? y - 8 : y - 24, blink = 0.75 + 0.25 * Math.sin(clock * 6);
      ctx.globalAlpha = blink; circ(ix, iy, 11); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = L.c; ctx.lineWidth = 3; ctx.stroke(); shapePath(L.shape, ix, iy, 6.5); ctx.fillStyle = L.c; ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  function drawTrain(t) {
    const L = LINES[t.color], fade = t.done ? clamp(1 - t.done / 0.8, 0, 1) : 1;
    ctx.globalAlpha = fade;
    for (let k = CARS - 1; k >= 0; k--) {
      const p = trainPoint(t, k * CAR + 6); if (!p) continue;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      if (k === 0) {
        rr(-7, -6.5, 14, 13, 3); ctx.fillStyle = L.c; ctx.fill(); ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.5; ctx.stroke();
        rr(-7, -5, 6, 10, 2); ctx.fillStyle = "#2a2a2a"; ctx.fill();
        circ(4, 0, 2.6); ctx.fillStyle = "#1a1a1a"; ctx.fill();
        ctx.fillStyle = "#ffe8a0"; ctx.fillRect(6.5, -4.5, 1.8, 2.5); ctx.fillRect(6.5, 2, 1.8, 2.5);
      } else {
        rr(-6.5, -5.5, 13, 11, 2.5); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.rotate(-p.a); shapePath(L.shape, 0, 0, 4.2); ctx.fillStyle = L.c; ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawDeco(d) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.s, d.s);
    if (d.k <= 1) { circ(0, 3, 7); ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fill(); circ(0, 0, 7); ctx.fillStyle = d.k ? "#3a8a3a" : "#4a9a3a"; ctx.fill(); circ(-2, -2, 3); ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fill(); }
    else if (d.k === 2) { ctx.fillStyle = "#2a6a32"; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(7, 5); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#6a4a2a"; ctx.fillRect(-1.5, 5, 3, 3); }
    else if (d.k === 3) { for (const [x, y, c] of [[-3, 0, "#ffe060"], [3, 1, "#ff8ab0"], [0, -3, "#fff"]]) { circ(x, y, 1.8); ctx.fillStyle = c; ctx.fill(); } }
    else { ctx.fillStyle = "#c8c0b0"; ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.5, 0.3, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (shake) ctx.translate((Math.random() - 0.5) * shake * 6, (Math.random() - 0.5) * shake * 6);
    ctx.fillStyle = "#6aaa4a"; ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.fillStyle = "rgba(255,255,255,0.05)"; for (let i = 0; i < 18; i++) { circ((i * 97) % W, (i * 53) % H, 30 + (i % 4) * 10); ctx.fill(); }
    for (const d of deco) drawDeco(d);
    if (nodes.length) {
      drawTracks();
      for (const st of stations) drawStation(st);
      for (const t of trains) drawTrain(t);
      for (const tn of tunnels) drawTunnel(tn);
      for (const s of switches) drawSwitch(s);
    }
    for (const f of fx) {
      const k = f.t / f.life;
      if (f.kind === "smoke") { ctx.globalAlpha = 0.5 * (1 - k); circ(f.x, f.y - k * 10, 3 + k * 6); ctx.fillStyle = "#f4f4f4"; ctx.fill(); }
      if (f.kind === "ring") { ctx.globalAlpha = 1 - k; circ(f.x, f.y, 10 + k * 30); ctx.strokeStyle = f.c; ctx.lineWidth = 4; ctx.stroke(); }
      if (f.kind === "x") { ctx.globalAlpha = 1 - k; ctx.strokeStyle = "#e82a2a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(f.x - 10, f.y - 10); ctx.lineTo(f.x + 10, f.y + 10); ctx.moveTo(f.x + 10, f.y - 10); ctx.lineTo(f.x - 10, f.y + 10); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    for (const t of texts) { ctx.globalAlpha = Math.min(1, (1.3 - t.t) * 2); ctx.font = "900 13px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; const x = clamp(t.x, 70, W - 70); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(20,30,20,0.85)"; ctx.strokeText(t.text, x, t.y - t.t * 18); ctx.fillStyle = t.c; ctx.fillText(t.text, x, t.y - t.t * 18); }
    ctx.globalAlpha = 1;
    // HUD
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    rr(6, 6, portrait ? 262 : 330, 26, 9); ctx.fillStyle = "rgba(16,30,18,0.78)"; ctx.fill();
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "800 12px system-ui, sans-serif";
    ctx.fillStyle = "#fff"; ctx.fillText(`Liv. ${level}`, 14, 19);
    ctx.fillStyle = "#ffe08a"; ctx.fillText(nf(score), 62, 19);
    ctx.fillStyle = "#ff6a6a"; ctx.fillText("♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, diff.lives - lives)), portrait ? 124 : 132, 19);
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "700 10px system-ui";
    const left = toSpawn + trains.filter((t) => !t.done).length;
    ctx.fillText(portrait ? `${left} treni` : `${left} treni · serie ${streak}`, portrait ? 200 : 220, 19);
  }

  // ---------- Menus ----------
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => { const d = DIFFICULTIES[id]; return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`; }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle; state = "menu";
    showOverlay(
      `<h1>CAPO<span>STAZIONE</span></h1>
       <p>Dalle gallerie escono trenini di tutti i colori e ognuno deve arrivare alla stazione del suo colore. Tu sei nella cabina di comando: tocca gli scambi per girarli al momento giusto e manda ogni treno sul binario buono.</p>
       <div class="pts">
         <span><b>Scambi</b></span><span>tocca un cerchio per girarlo: la freccia verde indica dove andrà il prossimo treno</span>
         <span><b>Treni</b></span><span>colore e simbolo sui vagoni dicono la stazione; sopra la galleria vedi chi sta per uscire</span>
         <span><b>Cuori</b></span><span>un treno alla stazione sbagliata costa un cuore; finito un livello ne riprendi uno</span>
       </div>
       <p class="muted help">${touchMode ? "Tutto si fa toccando gli scambi." : "Clicca gli scambi, oppure premi il loro numero (1–9). P pausa, M musica."}</p>
       ${difficultyHTML()}
       <button class="start" data-start>APRI LA LINEA</button>`);
    syncControls();
  }
  function togglePause() {
    if (state === "play") { pausedFrom = state; state = "paused"; showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Musica: <button type="button" data-music>${music ? "ACCESA" : "SPENTA"}</button></p>`); }
    else if (state === "paused") { state = pausedFrom; overlay.classList.add("hidden"); lastT = performance.now(); }
    syncControls();
  }
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); gameOver(false, true); });
  function syncControls() { pauseBtn.style.display = state === "play" && touchMode ? "block" : "none"; resize(); }
  pauseBtn.addEventListener("click", () => togglePause());
  function go() { state = "play"; overlay.classList.add("hidden"); syncControls(); lastT = performance.now(); }
  overlay.addEventListener("click", (e) => {
    const q = (s) => e.target.closest(s); let el;
    if ((el = q("[data-diff]"))) { setDifficulty(el.dataset.diff); return; }
    if (q("[data-music]")) { music = !music; store("capostazione-music", music ? "1" : "0"); q("[data-music]").textContent = music ? "ACCESA" : "SPENTA"; return; }
    if (q("[data-start]")) { startGame(); return; }
    if (q("[data-go]")) { go(); return; }
    if (q("[data-next]")) { level++; startLevel(); return; }
    if (q("[data-resume]")) { togglePause(); return; }
  });

  // ---------- Input ----------
  let touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function tapAt(p) {
    if (state !== "play") return;
    let best = null, bd = touchMode ? 40 : 30;
    for (const s of switches) { const d = Math.hypot(p.x - s.x, p.y - s.y); if (d < bd) { bd = d; best = s; } }
    if (best) toggle(best);
  }
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); const rc = canvas.getBoundingClientRect(); tapAt({ x: ((e.clientX - rc.left) / rc.width) * W, y: ((e.clientY - rc.top) / rc.height) * H }); });
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (state === "menu" || state === "over") { if (e.key === "Enter") startGame(); return; }
    if (state === "intro" && e.key === "Enter") { go(); return; }
    if (state === "between" && e.key === "Enter") { level++; startLevel(); return; }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (k === "m" && !e.repeat) { music = !music; store("capostazione-music", music ? "1" : "0"); return; }
    if (state !== "play" || e.repeat) return;
    const m = /^Digit([1-9])$/.exec(e.code) || /^Numpad([1-9])$/.exec(e.code);
    if (m) { const s = switches.find((x) => x.num === +m[1]); if (s) toggle(s); }
  });
  window.addEventListener("blur", () => { if (state === "play") togglePause(); });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  buildLevel(1);
  resize(); showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="capostazione-best-" data-kind="score"></script>
</body>

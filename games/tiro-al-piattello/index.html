<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tiro al Piattello</title>
<style>
  :root {
    --bg: #140e04;
    --fg: #f4f6ee;
    --muted: #f0e0c0;
    --pink: #ffb03a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a4a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: moves the sight; FUOCO shoots (two shots for each series) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 176, 58, 0.6); background: radial-gradient(circle, rgba(255,176,58,0.14), rgba(255,176,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 176, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 14, 4, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a2a, 0 0 22px rgba(255,176,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8701a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Fuoco">FUOCO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the two trap houses: the high one on the left, the low one on the right
  const HOUSES = [{ x: 52, y: 176, dir: 1 }, { x: 588, y: 262, dir: -1 }];
  const GRAV = 280, PATTERN = 15;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "rosa dei pallini più larga · piattelli più lenti · per passare il turno basta la metà", pat: 1.4, speed: 0.85, need: 0.5 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "per passare il turno servono tre piattelli su cinque", pat: 1, speed: 1, need: 0.63 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "rosa più stretta · piattelli più veloci · servono quasi tre piattelli su quattro", pat: 0.85, speed: 1.1, need: 0.72 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "piattello-difficulty";
  const bestKey = (id) => `piattello-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    bang: lim(() => { beep(90, 0.18, "sawtooth", 0.07, -50); beep(1200, 0.05, "square", 0.03, -1000); }),
    pull: lim(() => beep(220, 0.12, "triangle", 0.03, 180)),
    shatter: lim(() => { for (let i = 0; i < 4; i++) beep(1400 + Math.random() * 1600, 0.04, "square", 0.025, -600, i * 0.02); }),
    click: lim(() => beep(600, 0.03, "square", 0.02)),
    double: () => arp([784, 1047, 1319], 0.06, 0.1, "square", 0.04),
    pass: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    fail: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, round = 0, series = [], sIdx = 0, hits = 0, thrown = 0, needed = 0, doublesRow = 0, roundsDone = 0;
  let clays = [], shells = 2, phase = "intro", phaseT = 0, waitT = 0, message = null, popups = [], parts = [], flashT = 0, curSeries = null;
  const cross = { x: W / 2, y: 150, hold: 0 };
  let actHeld = false, wasAct = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const isPlaying = () => state === "play";

  // ---------- Flow ----------
  // a round: single clays from either house and doubles (one from each, together)
  function makeRound() {
    const doubles = Math.min(8, 3 + round), singles = 8;
    const s = [];
    for (let i = 0; i < singles; i++) s.push({ houses: [i % 2] });
    for (let i = 0; i < doubles; i++) s.push({ houses: [0, 1] });
    // shuffle, but start with two singles to warm up
    const rest = s.slice(2);
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    return s.slice(0, 2).concat(rest);
  }
  function startRound() {
    series = makeRound(); sIdx = 0; hits = 0; thrown = 0;
    const total = series.reduce((a, s) => a + s.houses.length, 0);
    needed = Math.ceil(total * diff.need);
    clays = []; phase = "intro"; phaseT = 2;
    message = { text: `TURNO ${round + 1}`, sub: `${total} piattelli · per passare ne servono ${needed}`, t: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; round = 0; doublesRow = 0; roundsDone = 0; popups = []; parts = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    cross.x = W / 2; cross.y = 150;
    startRound();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function nextSeries() {
    if (sIdx >= series.length) return endRound();
    curSeries = series[sIdx++];
    shells = 2; phase = "ready"; waitT = rnd(0.5, 1.1) * (window.__fast ? 0.3 : 1);
  }
  function launch() {
    sfx.pull();
    const sp = diff.speed * (0.86 + 0.1 * round);
    curSeries.hit = 0;
    for (const h of curSeries.houses) {
      const H0 = HOUSES[h], high = h === 0;
      clays.push({ x: H0.x, y: H0.y, vx: H0.dir * rnd(250, 330) * sp, vy: (high ? -rnd(150, 210) : -rnd(250, 310)) * Math.sqrt(sp), t: 0, alive: true, house: h });
      thrown++;
    }
    phase = "fly"; phaseT = 0;
  }
  function fire() {
    if (phase !== "fly" || shells <= 0) { if (phase === "fly") sfx.click(); return; }
    shells--; sfx.bang(); flashT = 0.08;
    const r = PATTERN * diff.pat;
    for (const c of clays) {
      if (!c.alive) continue;
      const s = scaleOf(c);
      if (Math.hypot(c.x - cross.x, c.y - cross.y) <= r + 6 * s) {
        c.alive = false; hits++; curSeries.hit++;
        const fresh = clamp(1 - c.t / 1.8, 0, 1);
        const pts = Math.round((100 + 100 * fresh) * (round + 1));
        score += pts;
        popups.push({ x: c.x, y: c.y - 12, text: `+${pts}`, col: "#ffffff", t: 0 });
        for (let i = 0; i < 12; i++) parts.push({ x: c.x, y: c.y, vx: c.vx * 0.3 + rnd(-120, 120), vy: c.vy * 0.3 + rnd(-140, 60), t: 0, life: rnd(0.5, 1), col: Math.random() < 0.5 ? "#ff8a2a" : "#2a2a2a", r: rnd(1, 3) });
        sfx.shatter();
      }
    }
    if (curSeries.houses.length === 2 && curSeries.hit === 2 && !curSeries.paid) {
      curSeries.paid = true;
      const b = 300 * (round + 1); score += b;
      popups.push({ x: W / 2, y: 90, text: `DOPPIETTA! +${b}`, col: "#ffd23a", t: 0, big: true });
      sfx.double();
      if (++doublesRow === 5) impresa("doppiette");
    }
  }
  const scaleOf = (c) => clamp(1 - c.t * 0.28, 0.45, 1);
  function seriesOver() {
    if (curSeries.houses.length === 2 && curSeries.hit < 2) doublesRow = 0;
    phase = "gap"; waitT = window.__fast ? 0.2 : 0.7;
  }
  function endRound() {
    const total = thrown;
    if (hits >= needed) {
      roundsDone++;
      let bonus = (hits - needed) * 100 * (round + 1) + 1000 * (round + 1);
      if (hits === total) { bonus += 5000 * (round + 1); impresa("perfetto"); }
      if (roundsDone === 5) impresa("cinque");
      score += bonus;
      message = { text: hits === total ? "TURNO PERFETTO!" : "TURNO SUPERATO!", sub: `${hits} su ${total} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
      sfx.pass(); phase = "pass"; phaseT = 3;
    } else {
      message = { text: "NON BASTA", sub: `${hits} su ${total}: ne servivano ${needed}`, t: 0, long: true };
      sfx.fail(); phase = "fail"; phaseT = 2.6;
    }
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">FINE DELLA GARA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${roundsDone} ${roundsDone === 1 ? "turno superato" : "turni superati"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>UN'ALTRA GARA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>TIRO AL PIATTELLO</h1>
       <p>Le due casette lanciano i piattelli: quella alta a sinistra, quella bassa a destra, a volte insieme. Hai due colpi per ogni serie: porta il mirino sul piattello e spara. Ogni turno chiede un numero minimo di piattelli rotti, e i piattelli vanno sempre più veloci e le doppiette aumentano.</p>
       <div class="pts">
         <span><b>Mira</b></span><span>levetta per il mirino (più la tieni, più corre) · il cerchio è la rosa dei pallini</span>
         <span><b>Spara</b></span><span>FUOCO · due colpi per serie, anche per le doppiette</span>
         <span><b>Punti</b></span><span>piattello 100-200 (di più se lo rompi appena esce), × turno · doppietta 300 × turno · turno superato 1.000 × turno più 100 per piattello in più · turno perfetto 5.000 × turno</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: mirino · FUOCO</p>`
         : `<p class="muted help">Frecce o WASD: mirino · SPAZIO o J fuoco · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>IN PEDANA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);


  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (message) { message.t += dt; if (message.t > (message.long ? 3 : 2)) message = null; }
    flashT = Math.max(0, flashT - dt);
    if (state !== "play") return;
    // the sight: faster the longer you push
    const sx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1), sy = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    const m = Math.hypot(sx, sy);
    cross.hold = m > 0.1 ? cross.hold + dt : 0;
    const sp = 170 + Math.min(1, cross.hold / 0.3) * 260;
    cross.x = clamp(cross.x + sx * sp * dt, 10, W - 10); cross.y = clamp(cross.y + sy * sp * dt, TOP + 8, H - 10);
    if (actHeld && !wasAct) fire();
    wasAct = actHeld;
    phaseT += dt;
    if (phase === "intro") { if (phaseT >= 2) nextSeries(); return; }
    if (phase === "pass") { if (phaseT >= 3) { round++; startRound(); } return; }
    if (phase === "fail") { if (phaseT >= 2.6) gameOver(); return; }
    if (phase === "ready") { waitT -= dt; if (waitT <= 0) launch(); return; }
    if (phase === "gap") { waitT -= dt; if (waitT <= 0) nextSeries(); return; }
    if (phase === "fly") {
      for (const c of clays) {
        if (!c.alive) continue;
        c.t += dt; c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt;
        if (c.y > 300 || c.x < -20 || c.x > W + 20) { c.alive = false; dust(c.x, Math.min(c.y, 300)); }
      }
      if (!clays.some((c) => c.alive)) { clays = []; seriesOver(); }
    }
  }
  function dust(x, y) { for (let i = 0; i < 5; i++) parts.push({ x, y, vx: rnd(-40, 40), vy: rnd(-60, -10), t: 0, life: 0.5, col: "#a89a7a", r: 2 }); }

  // ---------- Drawing ----------
  function drawField() {
    const g = ctx.createLinearGradient(0, TOP, 0, 240);
    g.addColorStop(0, "#4a9ae8"); g.addColorStop(1, "#c8e4f8");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // clouds
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (let i = 0; i < 4; i++) { const x = ((i * 190 + clock * 6) % (W + 160)) - 80, y = 60 + (i % 2) * 34; ctx.beginPath(); ctx.ellipse(x, y, 40, 12, 0, 0, TAU); ctx.ellipse(x + 26, y - 6, 26, 12, 0, 0, TAU); ctx.fill(); }
    // hills and the line of trees
    ctx.fillStyle = "#7aa85a"; ctx.beginPath(); ctx.moveTo(0, 230); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 222 - Math.sin(x / 90) * 14); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    for (let i = 0; i < 26; i++) { const x = i * 26 + (i % 3) * 5, y = 222 - Math.sin(x / 90) * 14; ctx.fillStyle = i % 2 ? "#2e6a2a" : "#3a7a32"; ctx.beginPath(); ctx.arc(x, y, 13 + (i % 4) * 2, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#6a9a4a"; ctx.fillRect(0, 262, W, H - 262);
    ctx.fillStyle = "#8aba5a"; for (let i = 0; i < 8; i++) ctx.fillRect(0, 270 + i * 12, W, 5);
    // the shooting stand: a curve of pads
    ctx.fillStyle = "#c8b890"; ctx.beginPath(); ctx.ellipse(W / 2, 352, 230, 26, 0, Math.PI, TAU); ctx.fill();
    // the houses
    const hs = (x, y, w, h) => { ctx.fillStyle = "#e8e0d0"; ctx.fillRect(x - w / 2, y - h, w, h + 70); ctx.fillStyle = "#8a3a2a"; ctx.beginPath(); ctx.moveTo(x - w / 2 - 6, y - h); ctx.lineTo(x, y - h - 16); ctx.lineTo(x + w / 2 + 6, y - h); ctx.fill(); ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 8, y - 8, 16, 12); };
    hs(32, 184, 44, 70); hs(608, 268, 44, 26);
    ctx.fillStyle = "#1a1a1a"; ctx.font = "900 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("ALTA", 32, 136); ctx.fillText("BASSA", 608, 236);
  }
  function drawClays() {
    for (const c of clays) {
      if (!c.alive) continue;
      const s = scaleOf(c), r = 9 * s;
      // a clay seen a little from below: orange top, dark rim; it tilts with its flight
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.atan2(c.vy, c.vx) * 0.25);
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(1, 2, r, r * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#2a2a2a"; ctx.beginPath(); ctx.ellipse(0, 1.5 * s, r, r * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffb06a"; ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.12, r * 0.4, r * 0.18, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  function drawCross() {
    const r = PATTERN * diff.pat;
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cross.x, cross.y, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "#ff3a3a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cross.x - r - 6, cross.y); ctx.lineTo(cross.x - 4, cross.y); ctx.moveTo(cross.x + 4, cross.y); ctx.lineTo(cross.x + r + 6, cross.y);
    ctx.moveTo(cross.x, cross.y - r - 6); ctx.lineTo(cross.x, cross.y - 4); ctx.moveTo(cross.x, cross.y + 4); ctx.lineTo(cross.x, cross.y + r + 6); ctx.stroke();
    if (flashT > 0) { ctx.fillStyle = "rgba(255,240,180,0.5)"; ctx.beginPath(); ctx.arc(cross.x, cross.y, r * 1.3, 0, TAU); ctx.fill(); }
    // the gun barrel from below, pointing at the sight
    const gx = W / 2 + (cross.x - W / 2) * 0.25, a = Math.atan2(cross.y - H - 40, cross.x - gx);
    ctx.save(); ctx.translate(gx, H + 30); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = "#3a3a44"; ctx.fillRect(-7, -120, 14, 100); ctx.fillStyle = "#5a5a66"; ctx.fillRect(-7, -120, 14, 6); ctx.fillStyle = "#6a4a2a"; ctx.fillRect(-12, -30, 24, 40);
    ctx.restore();
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#1a0e04"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(20,14,4,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#f0e0c0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 90, 9);
    ctx.fillStyle = "#ffb03a"; ctx.font = "900 9px system-ui"; ctx.fillText(`TURNO ${round + 1} · SERIE ${Math.min(sIdx, series.length)}/${series.length}`, x0 + 90, 20);
    // hits against what is needed
    const bx = touchMode ? 320 : 290, total = series.reduce((a, s) => a + s.houses.length, 0);
    ctx.textAlign = "left"; ctx.font = "900 11px system-ui"; ctx.fillStyle = hits >= needed ? "#5aff7a" : "#ffffff";
    ctx.fillText(`ROTTI ${hits} / ${needed}`, bx, 14);
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "700 9px system-ui"; ctx.fillText(`(su ${total})`, bx + 82, 14);
    // shells
    ctx.textAlign = "right";
    for (let i = 0; i < 2; i++) { const x = (touchMode ? W - 80 : W - 20) - i * 14; ctx.fillStyle = i < shells && (phase === "fly" || phase === "ready") ? "#d83a2a" : "rgba(255,255,255,0.2)"; ctx.fillRect(x - 4, 6, 8, 16); ctx.fillStyle = i < shells && (phase === "fly" || phase === "ready") ? "#d8b83a" : "rgba(255,255,255,0.15)"; ctx.fillRect(x - 4, 18, 8, 4); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawField();
    drawClays();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
    ctx.globalAlpha = 1;
    if (state !== "menu") drawCross();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); outlined(p.text, p.x, p.y, p.big ? "italic 900 18px system-ui" : "900 12px system-ui", p.col, 4); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    ctx.textAlign = "center";
    if (phase === "ready") outlined("PRONTO...", W / 2, 120, "italic 900 16px system-ui", "#ffffff", 4);
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2) - message.t) * 2);
      outlined(message.text, W / 2, 112, "italic 900 26px system-ui", "#ffb03a", 6);
      if (message.sub) outlined(message.sub, W / 2, 134, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="piattello-best-" data-kind="score"></script>

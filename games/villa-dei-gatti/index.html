<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Villa dei Gatti</title>
<style>
  :root {
    --bg: #0e0a18;
    --fg: #fff8ee;
    --muted: #b8a8c8;
    --blue: #5aa8ff;
    --gold: #ffd34d;
    --red: #ff4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2040, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 248, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick (only left and right count) and a door button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(90, 168, 255, 0.6); background: radial-gradient(circle, rgba(90,168,255,0.16), rgba(90,168,255,0.05)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(90, 168, 255, 0.5); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick i { position: absolute; top: 50%; transform: translateY(-50%); font: 900 14px system-ui, sans-serif; font-style: normal; color: rgba(255,248,238,0.35); pointer-events: none; }
  #touch .stick i.on { color: var(--gold); }
  #touch .stick i[data-d="left"] { left: 8px; }
  #touch .stick i[data-d="right"] { right: 8px; }
  #touch .door { width: 92px; height: 92px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; line-height: 1.2;
    border: 2px solid rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.18); }
  #touch .door b { display: block; font-size: 20px; }
  #touch .door.on { background: rgba(255, 211, 77, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .door { width: 76px; height: 76px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 10, 24, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 9.5vw, 60px); font-weight: 900; letter-spacing: 1px; color: var(--blue); text-shadow: 0 3px 0 #1a4a9a, 0 0 22px rgba(90,168,255,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,248,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--blue); color: #06204a; background: var(--blue); padding: 11px 30px; box-shadow: 0 4px 0 #1a4a9a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><i data-d="left">◀</i><i data-d="right">▶</i><div class="knob"></div></div>
  <button type="button" class="door" aria-label="Porta"><b>🚪</b>PORTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 420, HUD = 24, TAU = Math.PI * 2;
  const FLOORS = [96, 158, 220, 282, 344];          // walking surfaces, top to bottom
  const TRAMP_Y = 392;                              // the trampolines at the bottom of each shaft
  const SHAFTS = [100, 240, 380], SH = 16;          // shaft centres and half width
  const SEGS = [[8, 84], [116, 224], [256, 364], [396, 472]];
  const BOUNCE_V = 190, BREAK_AT = 4;
  const ITEMS = [
    { id: "radio", name: "Radio", pts: 100, color: "#ff8a4a" },
    { id: "tv", name: "Televisore", pts: 200, color: "#5ad8ff" },
    { id: "pc", name: "Computer", pts: 300, color: "#9aff7a" },
    { id: "quadro", name: "Quadro", pts: 400, color: "#ffd34d" },
    { id: "cassa", name: "Cassaforte", pts: 500, color: "#c8c8d8" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · gatti lenti e meno numerosi", lives: 5, cat: 0.8, cats: 2, hurry: 75, hunt: 0.5 },
    normale:   { label: "NORMALE",   color: "#5aa8ff", desc: "3 vite · l'esperienza classica", lives: 3, cat: 1, cats: 3, hurry: 60, hunt: 0.7 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 vite · gatti veloci e agguerriti", lives: 3, cat: 1.15, cats: 4, hurry: 50, hunt: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "villa-difficulty";
  const bestKey = (id) => `villa-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    boing: lim((n) => beep(220 + n * 90, 0.12, "triangle", 0.04, 260)),
    item: lim(() => arp([988, 1319], 0.05, 0.08, "square", 0.035)),
    pair: () => arp([784, 988, 1319, 1568], 0.06, 0.1, "square", 0.04),
    door: lim(() => beep(140, 0.08, "square", 0.04, -40)),
    stun: lim(() => arp([1200, 900, 1200], 0.04, 0.05, "square", 0.025)),
    wave: () => { beep(300, 0.6, "sawtooth", 0.03, 900); beep(450, 0.6, "triangle", 0.03, 1200); },
    swept: lim((n) => beep(500 + n * 200, 0.15, "square", 0.035)),
    hurry: () => arp([880, 880, 880, 1175], 0.12, 0.1, "square", 0.04),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.09, 0.14),
    die: () => arp([784, 622, 523, 415, 330], 0.12, 0.16, "sawtooth", 0.035),
    snap: () => { beep(90, 0.4, "sawtooth", 0.05, -50); },
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, round = 0, bestCache = 0, nextLife = 20000;
  let mouse = null, cats = [], items = [], doors = [], waves = [], parts = [], popups = [], message = null;
  let roundT = 0, hurry = false, lastKind = null, sweepN = 0, catQueue = [], brokenAt = -1;
  let axis = 0, wantDir = 0, wantT = 0, doorPressed = false;
  const keys = { left: false, right: false };

  const segOf = (x) => SEGS.findIndex(([a, b]) => x >= a - 0.5 && x <= b + 0.5);
  const catSpeed = () => 58 * diff.cat * (1 + Math.min(0.5, round * 0.05)) * (hurry ? 1.3 : 1);

  // ---------- Layout of a round ----------
  function buildRound() {
    // items: five pairs spread over the floor segments, never on the mouse's starting spot
    const spots = [];
    for (let f = 0; f < FLOORS.length; f++) for (let s = 0; s < SEGS.length; s++) if (!(f === 4 && s === 0)) spots.push([f, s]);
    for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
    items = [];
    const kinds = ITEMS.flatMap((k) => [k, k]);
    kinds.forEach((k, i) => {
      const [f, s] = spots[i], [a, b] = SEGS[s];
      items.push({ f, x: Math.round(rnd(a + 18, b - 18)), kind: k, got: false, t: rnd(0, 5) });
    });
    // doors: one or two per floor, a couple of them are power doors
    doors = [];
    for (let f = 0; f < FLOORS.length; f++) {
      const segs = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, f === 4 ? 1 : 2);
      for (const s of segs) {
        const [a, b] = SEGS[s];
        let x = 0, tries = 0;
        do { x = Math.round(rnd(a + 22, b - 22)); tries++; } while (tries < 20 && items.some((it) => it.f === f && Math.abs(it.x - x) < 18));
        if (f === 4 && s === 0) continue;
        doors.push({ f, x, open: Math.random() < 0.4, power: false, swing: 0, side: 1 });
      }
    }
    const closed = doors.filter((d) => !d.open);
    for (let i = 0; i < Math.min(2 + (round > 3 ? 1 : 0), closed.length); i++) pick(closed.filter((d) => !d.power)).power = true;
    roundT = 0; hurry = false; lastKind = null; waves = []; sweepN = 0; brokenAt = -1;
    resetActors();
    message = { text: `ROUND ${round + 1}`, sub: "Recupera la refurtiva: 5 coppie di oggetti", t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function makeMover(x, f) { return { x, y: FLOORS[f], f, st: "floor", dir: 1, face: 1, vy: 0, count: 0, t: 0 }; }
  function resetActors() {
    mouse = makeMover(40, 4); mouse.inv = 1.5;
    cats = []; catQueue = [];
    const n = Math.min(6, diff.cats + Math.floor(round / 2));
    for (let i = 0; i < n; i++) catQueue.push(1 + i * 1.6);
    waves = [];
  }
  function spawnCat() {
    // cats come in through the attic hatch, onto the top floor
    const s = pick([1, 2]), [a, b] = SEGS[s];
    const c = makeMover(rnd(a + 12, b - 12), 0);
    c.dir = Math.random() < 0.5 ? -1 : 1; c.stun = 0; c.exitCool = 0; c.pace = rnd(0.88, 1.08); c.skin = pick(["#ff9ad0", "#ffb05a", "#e8e0f0"]);
    c.boss = cats.length === 0 && round >= 2 && Math.random() < 0.5;
    cats.push(c);
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff8ee") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife += 40000; if (lives < 9) lives++; sfx.life();
      popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 10, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random()), c: color });
    }
  }
  function killMouse(why) {
    if (state !== "play" || mouse.inv > 0) return;
    lives--;
    sfx.die(); burst(mouse.x, mouse.y - 8, "#c8c8e0", 16, 120, 0.6);
    message = { text: why, t: 0 };
    mouse.dead = true;
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    brokenAt = -1;
    resetActors();
    state = "intro"; stateT = 1;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, rd = round + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Round ${rd} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>VILLA DEI GATTI</h1>
       <p>Il topo poliziotto deve recuperare la refurtiva nascosta nella villa dei gatti. Si sale e si scende solo rimbalzando sui trampolini: salta giù dal trampolino al piano che vuoi. Ma attento, al quarto rimbalzo di fila il trampolino si rompe! Sui trampolini i gatti non ti prendono; sui pavimenti sì, ma una porta aperta in faccia li stordisce.</p>
       <div class="pts">
         <span><b>Oggetti</b></span><span>radio 100 · TV 200 · computer 300 · quadro 400 · cassaforte 500</span>
         <span><b>Coppia</b></span><span>due oggetti uguali di fila valgono doppio</span>
         <span><b>Gatto stordito</b></span><span>50</span>
         <span><b>Porta blu</b></span><span>un'onda spazza via i gatti del piano: 200, 400, 800…</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a destra e sinistra per correre e per saltare giù dal trampolino · PORTA apre e chiude la porta davanti a te</p>`
         : `<p class="muted help">Frecce ←→ o A D per correre e saltare giù dal trampolino · SPAZIO o Z apre e chiude la porta · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  function setWant(d) { if (d) { wantDir = d; wantT = 0.4; } }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if ((k === " " || k === "z" || k === "x") && !e.repeat) doorPressed = true;
    if (k === "arrowleft" || k === "a") { keys.left = true; if (!e.repeat) setWant(-1); }
    if (k === "arrowright" || k === "d") { keys.right = true; if (!e.repeat) setWant(1); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
  });
  window.addEventListener("blur", () => { keys.left = keys.right = false; axis = 0; if (isPlaying()) togglePause(); });

    if (c.stun > 0) {
      ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(1, -21); ctx.lineTo(4, -18); ctx.moveTo(4, -21); ctx.lineTo(1, -18); ctx.moveTo(5, -21); ctx.lineTo(8, -18); ctx.moveTo(8, -21); ctx.lineTo(5, -18); ctx.stroke();
    } else {
      ctx.fillStyle = "#3a8a3a"; ctx.fillRect(2, -21, 2.2, 2.6); ctx.fillRect(6, -21, 2.2, 2.6);
    }
    ctx.fillStyle = "#ff5a8a"; ctx.fillRect(7, -17, 2, 1.5);
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(7, -16); ctx.lineTo(13, -18); ctx.moveTo(7, -15); ctx.lineTo(13, -14); ctx.stroke();
    if (c.boss) { ctx.fillStyle = "#ff4a5a"; ctx.fillRect(-4, -14, 11, 2); }
    ctx.restore();
    if (c.stun > 0) {
      for (let k = 0; k < 3; k++) {
        const a = clock * 6 + k * TAU / 3;
        ctx.fillStyle = "#ffd34d"; ctx.font = "900 8px system-ui, sans-serif"; ctx.textAlign = "center";
        ctx.fillText("★", c.x + Math.cos(a) * 9, c.y - 34 + Math.sin(a) * 3);
      }
    }
  }
  function drawMouseIcon(x, y) {
    ctx.fillStyle = "#b8b8cc"; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#e8a8c0"; ctx.beginPath(); ctx.arc(x - 4, y - 3, 2.5, 0, TAU); ctx.arc(x + 4, y - 3, 2.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a3a9a"; ctx.fillRect(x - 3, y - 5, 6, 2);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0e0a18"; ctx.fillRect(0, 0, W, H);
    drawHouse();
    if (state === "menu" || !mouse) return;
    for (const it of items) if (!it.got) drawItem(it);
    for (const d of doors) drawDoor(d);
    for (const w of waves) {
      const y = FLOORS[w.f];
      for (let k = 0; k < 4; k++) {
        ctx.strokeStyle = `rgba(140,200,255,${0.8 - k * 0.18})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(w.x - w.dir * k * 7, y - 18, 16 - k, -Math.PI / 2 * w.dir - 1.2 * w.dir + (w.dir < 0 ? Math.PI : 0), -Math.PI / 2 * w.dir + 1.2 * w.dir + (w.dir < 0 ? Math.PI : 0)); ctx.stroke();
      }
    }
    for (const c of cats) drawCat(c);
    if (!(mouse.inv > 0 && state === "play" && Math.floor(clock * 12) % 2) && !(state === "dead" && mouse.st !== "fall" && stateT < 1.8)) drawMouse(mouse);
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 20px system-ui, sans-serif" : "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "#0e0a18"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#fff8ee";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    const sw = ctx.measureText(score.toLocaleString("it-IT")).width;
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#b8a8c8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8 + Math.max(58, sw + 10), 12);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) drawMouseIcon(196 + i * 14, 13);
    // the loot still to find, as small coloured dots
    const left = items.filter((it) => !it.got);
    left.forEach((it, i) => { ctx.fillStyle = it.kind.color; ctx.fillRect(292 + i * 8, 9, 6, 6); });
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = hurry ? (Math.floor(clock * 4) % 2 ? "#ff4a5a" : "#ffd34d") : "#5aa8ff";
    ctx.fillText(`ROUND ${round + 1}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(14,10,24,0.82)"; ctx.fillRect(0, H / 2 - 44, W, message.sub ? 52 : 36);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#5aa8ff";
      ctx.fillText(message.text, W / 2, H / 2 - 19);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#fff8ee"; ctx.fillText(message.sub, W / 2, H / 2); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="villa-best-" data-kind="score"></script>

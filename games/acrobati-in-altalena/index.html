<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Acrobati in Altalena</title>
<style>
  :root {
    --bg: #1a0a2a;
    --fg: #f4f6ee;
    --muted: #e8c8b8;
    --pink: #ffd23a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: slide the seesaw left and right */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 10, 42, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a4a0a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8901a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GY = 326, L = 38, TILT = 0.27, LAND_Y = GY - 26, BR = 10, AR = 8;
  const ROWS = [
    { y: 70, color: "#4ad0ff", pts: 30, bonus: 500, dir: 1, sp: 34 },
    { y: 102, color: "#ffd23a", pts: 20, bonus: 300, dir: -1, sp: 26 },
    { y: 134, color: "#ff4a6a", pts: 10, bonus: 200, dir: 1, sp: 18 },
  ];
  const NB = 16, GAP = W / NB;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 acrobati · si vola più piano e l'altalena perdona", lives: 5, grav: 0.85, margin: 12, side: 0.8 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "3 acrobati", lives: 3, grav: 1.05, margin: 5, side: 1.15 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 acrobati · voli svelti, rimbalzi più larghi, poco margine", lives: 3, grav: 1.3, margin: 0, side: 1.6 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "acrobati-difficulty";
  const bestKey = (id) => `acrobati-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    pop: lim((r) => { noise(0.06, 0.08, 2500 + r * 500); beep(900 - r * 150, 0.05, "square", 0.025, 300); }),
    boing: lim(() => beep(180, 0.25, "triangle", 0.06, 300)),
    wall: lim(() => beep(260, 0.05, "square", 0.02)),
    row: () => arp([523, 659, 784, 1047, 1319], 0.06, 0.12, "square", 0.045),
    splat: () => { noise(0.35, 0.18, 300); arp([392, 330, 262, 196], 0.1, 0.16, "triangle", 0.05); },
    level: () => arp([523, 659, 784, 659, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 10000, cleared = 0;
  let S = null, F = null, side = -1, rows = [], parts = [], popups = [], message = null, lastBy = "", pending = 0;
  const keys = { left: false, right: false };
  const stick = { x: 0, y: 0 };

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  const grav = () => 560 * diff.grav * Math.min(1.4, 1 + 0.05 * (level - 1));
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 10000; cleared = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    rows = ROWS.map((r, i) => ({ ...r, off: i * 13, cells: new Array(NB).fill(true), refill: 0 }));
    S = { x: W / 2, vx: 0 };
    newPair();
    message = { text: "IL CIRCO È APERTO!", sub: "scoppia i palloncini e riprendi l'acrobata sull'altalena", t: 0 };
    state = "intro"; stateT = 1.6;
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function newPair() {
    side = Math.random() < 0.5 ? -1 : 1;
    // one acrobat is thrown in from the side of the ring
    const fromLeft = Math.random() < 0.5;
    F = { x: clamp(S.x + (fromLeft ? -70 : 70), 30, W - 30), y: 120, vx: fromLeft ? 25 : -25, vy: -80, spin: 0, col: "#ff8a3a" };
    pending = 0;
  }
  // where the raised end is, and how far along the plank a point lies from the pivot on that side
  const raisedD = (x) => (x - S.x) * -side;
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 15000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 190, text: "ACROBATA EXTRA!", color: "#7ae05a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function miss(by) {
    if (window.__deaths) window.__deaths.push([level, by]);
    if (window.__god) { F.vy = -500; F.y = LAND_Y - 1; return; }
    lives--; lastBy = by; sfx.splat(); burst(F.x, GY + 10, "#ff8a3a", 20, 120, 0.7);
    state = "dead"; stateT = 1.8;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "ACROBATI FINITI!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · numero ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ACROBATI IN ALTALENA</h1>
       <p>Due acrobati e un'altalena sotto il tendone: uno vola in alto e scoppia i palloncini, l'altro aspetta seduto. Sposta l'altalena perché chi ricade atterri sull'estremità alzata: così lancia in aria il compagno! Se manca l'altalena, si spiaccica.</p>
       <div class="pts">
         <span><b>Palloncini</b></span><span>blu 30 · gialli 20 · rossi 10 · fila completa: 500 · 300 · 200</span>
         <span><b>Atterraggio</b></span><span>più vicino alla punta, più alto il lancio · sul lato del compagno o per terra: acrobata perso</span>
         <span><b>Numeri</b></span><span>ogni tre file completate si passa al numero successivo, più veloce</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a destra e sinistra per spostare l'altalena</p>`
         : `<p class="muted help">Frecce o A D per spostare l'altalena · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SI VA IN SCENA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    const dx = clamp(e.clientX - (r.left + r.width / 2), -max, max);
    knob.style.transform = `translate(${dx}px, 0px)`;
    const m = Math.abs(dx) / max;
    stick.x = m < 0.1 ? 0 : Math.sign(dx) * Math.min(1, (m - 0.1) / 0.6);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function updateSeesaw(dt) {
    const ix = clamp(stick.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), -1, 1);
    S.vx += (ix * 330 - S.vx) * Math.min(1, dt * 12);
    S.x += S.vx * dt;
    if (S.x < L + 6 || S.x > W - L - 6) { S.x = clamp(S.x, L + 6, W - L - 6); S.vx = 0; }
  }
  function updateRows(dt) {
    const sp = 1 + 0.12 * (level - 1);
    for (const [i, r] of rows.entries()) {
      r.off = (r.off + r.dir * r.sp * sp * dt + W) % W;
      if (r.refill > 0) { r.refill -= dt; if (r.refill <= 0) r.cells.fill(true); continue; }
      for (let k = 0; k < NB; k++) {
        if (!r.cells[k]) continue;
        const x = (k * GAP + r.off) % W;
        if (Math.hypot(F.x - x, F.y - r.y) < BR + AR) {
          r.cells[k] = false; addScore(r.pts, x, r.y - 14, r.color); sfx.pop(i); burst(x, r.y, r.color, 8, 80, 0.4);
          if (r.cells.every((c) => !c)) {
            addScore(r.bonus * level, W / 2, r.y + 20, "#ffffff", `FILA COMPLETA! ${(r.bonus * level).toLocaleString("it-IT")}`); sfx.row();
            r.refill = 1.5; cleared++;
            if (cleared % 3 === 0) { level++; message = { text: `NUMERO ${level}`, sub: "i palloncini corrono più veloci", t: 0 }; sfx.level(); }
          }
        }
      }
    }
  }
  function updateFlyer(dt) {
    const g = grav();
    F.vy += g * dt; F.x += F.vx * dt; F.y += F.vy * dt; F.spin += dt * (F.vx > 0 ? 8 : -8);
    if (F.x < AR + 4) { F.x = AR + 4; F.vx = Math.abs(F.vx); sfx.wall(); }
    if (F.x > W - AR - 4) { F.x = W - AR - 4; F.vx = -Math.abs(F.vx); sfx.wall(); }
    if (F.y < TOP + 12) { F.y = TOP + 12; F.vy = Math.abs(F.vy) * 0.5; sfx.wall(); }
    if (F.vy > 0 && F.y >= LAND_Y) {
      const d = raisedD(F.x);
      if (d >= -diff.margin * 0.5 && d <= L + diff.margin) {
        // a good landing: the plank flips and the partner flies
        const vin = F.vy, boost = 0.86 + 0.26 * clamp(d / L, 0, 1);
        const sitterX = S.x + side * (L - 8);
        const vout = clamp(vin * boost, 430, 660);
        const spread = diff.side * Math.min(2.4, 1 + 0.2 * (level - 1));
        const nvx = clamp(F.vx * 0.45 + S.vx * 0.3 + rnd(-45, 45) * spread, -200 * spread, 200 * spread);
        side = -side;
        F = { x: sitterX, y: LAND_Y - 2, vx: nvx, vy: -vout, spin: 0, col: F.col === "#ff8a3a" ? "#4ad07a" : "#ff8a3a" };
        addScore(5); sfx.boing();
      } else if (F.y >= GY + 16) miss(d < 0 && d > -L - 4 ? "BONK" : "TERRA");
    }
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; updateSeesaw(dt); if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; updateSeesaw(dt); if (stateT <= 0) { if (lives <= 0) { gameOver(); return; } newPair(); state = "play"; } return; }
    if (window.__bot) window.__bot(dt);
    updateSeesaw(dt);
    updateRows(dt);
    updateFlyer(dt);
  }

  // ---------- Drawing ----------
  function drawTent() {
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#2a0a3a"); g.addColorStop(1, "#5a1a3a");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.05)" : "rgba(255,210,58,0.06)"; ctx.beginPath(); ctx.moveTo(W / 2, TOP); ctx.lineTo(i * 58 - 20, H); ctx.lineTo(i * 58 + 38, H); ctx.closePath(); ctx.fill(); }
    // the crowd at the bottom
    for (let x = 6; x < W; x += 12) { ctx.fillStyle = `hsl(${(x * 7) % 360},40%,${25 + (x % 3) * 5}%)`; ctx.beginPath(); ctx.arc(x, H - 6 + Math.sin(clock * 6 + x) * (state === "play" ? 0.8 : 0), 6, Math.PI, TAU); ctx.fill(); }
    ctx.fillStyle = "#c8343a"; ctx.fillRect(0, GY + 10, W, 12); ctx.fillStyle = "#ffd23a"; for (let x = 0; x < W; x += 24) ctx.fillRect(x, GY + 10, 12, 3);
  }
  function drawBalloon(x, y, c) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, BR - 1, BR, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(x - 3, y - 3, 2, 3, -0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + BR); ctx.lineTo(x, y + BR + 5); ctx.stroke();
  }
  function drawAcro(x, y, col, spin, sitting) {
    ctx.save(); ctx.translate(x, y); if (!sitting) ctx.rotate(spin);
    ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-4, -5, 8, 11, 3); ctx.fill();
    ctx.fillStyle = "#ffe8d8"; ctx.beginPath(); ctx.arc(0, -9, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a1a0a"; ctx.beginPath(); ctx.arc(0, -11, 4.5, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    if (sitting) { ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(-6, 9); ctx.moveTo(3, 5); ctx.lineTo(6, 9); ctx.moveTo(-4, -3); ctx.lineTo(-8, -8); ctx.moveTo(4, -3); ctx.lineTo(8, -8); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(-5, 11); ctx.moveTo(3, 5); ctx.lineTo(5, 11); ctx.moveTo(-4, -3); ctx.lineTo(-9, -10); ctx.moveTo(4, -3); ctx.lineTo(9, -10); ctx.stroke(); }
    ctx.restore();
  }
  function drawSeesaw() {
    const a = side * TILT, x = S.x;
    // stand and pivot
    ctx.fillStyle = "#8a8aa0"; ctx.beginPath(); ctx.moveTo(x - 10, GY + 10); ctx.lineTo(x + 10, GY + 10); ctx.lineTo(x, GY - 2); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(x, GY - 2); ctx.rotate(a);
    ctx.fillStyle = "#c88a3a"; ctx.fillRect(-L, -3, L * 2, 6); ctx.fillStyle = "#ffd23a"; ctx.fillRect(-L, -3, L * 2, 2);
    ctx.fillStyle = "#ff4a6a"; ctx.fillRect(-side * L - (side < 0 ? 0 : 6), -5, 6, 4);
    ctx.restore();
    // the landing zone, faintly
    const ex = x - side * L * Math.cos(TILT), ey = GY - 2 - L * Math.sin(TILT);
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x, LAND_Y + 10); ctx.lineTo(ex - side * diff.margin, LAND_Y + 10); ctx.stroke(); ctx.setLineDash([]);
    // the partner waiting on the low end
    const sx = x + side * (L - 8) * Math.cos(TILT), sy = GY - 2 + (L - 8) * Math.sin(TILT) - 12;
    if (state !== "dead" || true) drawAcro(sx, sy, F && F.col === "#ff8a3a" ? "#4ad07a" : "#ff8a3a", 0, true);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(20,6,26,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e8c8b8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 10px system-ui"; ctx.fillText(`NUMERO ${level}`, x0 + 80, 21);
    ctx.fillStyle = "#e8c8b8"; ctx.font = "800 9px system-ui"; ctx.fillText(`FILE ${cleared % 3}/3`, x0 + 170, 14);
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 8); i++) { const cx = lx - i * 12; ctx.fillStyle = i % 2 ? "#4ad07a" : "#ff8a3a"; ctx.fillRect(cx - 3, 13, 6, 8); ctx.fillStyle = "#ffe8d8"; ctx.beginPath(); ctx.arc(cx, 10, 3, 0, TAU); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!S) { rows = ROWS.map((r, i) => ({ ...r, off: i * 13, cells: new Array(NB).fill(true).map((v, k) => (k * 7 + i) % 5 !== 0), refill: 0 })); S = { x: 280, vx: 0 }; side = -1; F = { x: 380, y: 170, vx: 0, vy: 0, spin: 0.4, col: "#ff8a3a" }; }
    drawTent();
    for (const r of rows) { if (r.refill > 0) continue; for (let k = 0; k < NB; k++) if (r.cells[k]) drawBalloon((k * GAP + r.off) % W, r.y + Math.sin(clock * 3 + k) * 1.5, r.color); }
    drawSeesaw();
    if (state !== "dead") drawAcro(F.x, F.y, F.col, F.spin, false);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1a0a2a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a0a2a"; ctx.strokeText(message.text, W / 2, 190); ctx.fillText(message.text, W / 2, 190);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.strokeText(message.sub, W / 2, 209); ctx.fillText(message.sub, W / 2, 209); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = lastBy === "BONK" ? "ATTERRATO SUL COMPAGNO!" : "SPIACCICATO A TERRA!";
      ctx.strokeText(t, W / 2, 230); ctx.fillText(t, W / 2, 230);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="acrobati-best-" data-kind="score"></script>

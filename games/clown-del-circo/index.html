<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Clown del Circo</title>
<style>
  :root {
    --bg: #12060a;
    --fg: #fff6ea;
    --muted: #c8a8a8;
    --red: #ff3a4a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a1a20, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 246, 234, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick (only left and right count) and a jump button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 211, 77, 0.6); background: radial-gradient(circle, rgba(255,211,77,0.16), rgba(255,211,77,0.05)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 211, 77, 0.5); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick i { position: absolute; top: 50%; transform: translateY(-50%); font: 900 14px system-ui, sans-serif; font-style: normal; color: rgba(255,246,234,0.35); pointer-events: none; }
  #touch .stick i.on { color: var(--red); }
  #touch .stick i[data-d="left"] { left: 8px; }
  #touch .stick i[data-d="right"] { right: 8px; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 58, 74, 0.9); background: rgba(255, 58, 74, 0.2); }
  #touch .jump.on { background: rgba(255, 211, 77, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 6, 10, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 9.5vw, 60px); font-weight: 900; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #b01a2a, 0 0 22px rgba(255,211,77,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,246,234,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #4a1a00; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #b01a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><i data-d="left">◀</i><i data-d="right">▶</i><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Salta">SALTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 300, HUD = 24, GROUND = 262, ROPE = 214, TAU = Math.PI * 2;
  const PX_M = 30, LEN = 100 * PX_M, CHECK = 25 * PX_M;           // 100 metres per act, checkpoints every 25
  // the three acts; each has its own jump
  const ACTS = [
    { id: "leone", name: "Il leone e i cerchi di fuoco", jumpH: 52, jumpT: 0.9, fwd: 110, back: -50 },
    { id: "fune", name: "Il funambolo e le scimmie", jumpH: 46, jumpT: 0.7, fwd: 80, back: -45 },
    { id: "palle", name: "Le palle giganti", jumpH: 54, jumpT: 0.8, fwd: 95, back: -45 },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · ostacoli più radi e più lenti", lives: 5, dense: 0.75, speed: 0.85 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, dense: 1, speed: 1 },
    difficile: { label: "DIFFICILE", color: "#ff3a4a", desc: "3 vite · ostacoli fitti e veloci", lives: 3, dense: 1.25, speed: 1.15 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "circo-difficulty";
  const bestKey = (id) => `circo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    jump: lim(() => beep(330, 0.18, "triangle", 0.04, 330)),
    pass: lim(() => arp([988, 1319], 0.05, 0.08, "square", 0.03)),
    bag: () => arp([1319, 1568, 2093], 0.05, 0.1, "square", 0.04),
    land: lim(() => beep(180, 0.08, "triangle", 0.035, -60)),
    step: lim(() => beep(700, 0.02, "square", 0.01)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14),
    die: () => arp([784, 740, 698, 659, 622, 587], 0.1, 0.12, "sawtooth", 0.035),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    tick: lim(() => beep(1200, 0.03, "square", 0.02)),
  };
  // a little circus march in the background while playing
  const MARCH = [523, 0, 392, 0, 523, 0, 392, 0, 523, 587, 659, 587, 523, 494, 523, 0, 587, 0, 440, 0, 587, 0, 440, 0, 587, 659, 698, 659, 587, 523, 494, 0];
  let marchT = 0, marchI = 0;

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, bestCache = 0, nextLife = 20000, bonus = 5000, bonusT = 0;
  let p = null, camX = 0, obs = [], parts = [], popups = [], message = null, spawnT = 0, lastCheck = 0;
  let axis = 0, jumpPressed = false;
  const keys = { left: false, right: false };

  const act = () => ACTS[stage % 3];
  const loopN = () => Math.floor(stage / 3);
  const pace = () => diff.speed * (1 + Math.min(0.45, loopN() * 0.15));

  // ---------- Stages ----------
  function buildStage(fromX = 0) {
    obs = [];
    const a = act().id;
    if (a === "leone") {
      // fire pots stand still along the track; flaming rings roll in from the right
      let x = 380;
      while (x < LEN - 200) {
        if (x > fromX + 180) obs.push({ k: "pot", x, passed: false });
        x += rnd(260, 420) / diff.dense;
      }
    }
    p = { x: fromX + 60, h: 0, vx: 0, air: false, t: 0, jt: 0, jvx: 0, st: "ok", deadT: 0, walk: 0, ball: null };
    if (a === "palle") {
      const b = { k: "ball", x: p.x, vx: 0, mine: true, rot: 0, hue: 0 };
      obs.push(b); p.ball = b;
    }
    camX = Math.max(0, p.x - 140);
    spawnT = 0.5;
    lastCheck = fromX;
  }
  function startStage() {
    bonus = 5000; bonusT = 0;
    buildStage(0);
    message = { text: `NUMERO ${stage + 1}`, sub: act().name, t: 0 };
    state = "intro"; stateT = 1.8;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff6ea") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife += 30000; if (lives < 9) lives++; sfx.life();
      popups.push({ x: camX + W / 2, y: 110, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 10, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random()), c: color });
    }
  }
  function fall(why) {
    if (state !== "play") return;
    lives--; p.st = "fall"; p.deadT = 0;
    sfx.die();
    message = { text: why, t: 0 };
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // back to the last checkpoint behind the clown
    const cp = Math.floor(Math.max(0, p.x - 40) / CHECK) * CHECK;
    const keep = obs.filter((o) => o.k === "pot" && o.x > cp + 180);
    buildStage(cp);
    if (act().id === "leone") obs = keep;
    if (bonus <= 0) bonus = 2000;
    state = "intro"; stateT = 1;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, st = stage + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Numero ${st} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CLOWN DEL CIRCO</h1>
       <p>Signore e signori, il grande spettacolo! Il clown affronta tre numeri da 100 metri: in groppa al leone attraverso i cerchi di fuoco, sulla fune contro le scimmie dispettose e in equilibrio sulle palle giganti. Arriva al podio prima che il bonus arrivi a zero!</p>
       <div class="pts">
         <span><b>Cerchio di fuoco</b></span><span>100 · quello piccolo col sacchetto 500</span>
         <span><b>Braciere saltato</b></span><span>200</span>
         <span><b>Scimmia saltata</b></span><span>100 · quella blu 200</span>
         <span><b>Salto su una palla</b></span><span>150</span>
         <span><b>Bonus</b></span><span>parte da 5.000 e scende: incassi quello che resta al podio</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta ▶ per avanzare e ◀ per indietreggiare · SALTA per saltare (il salto segue la direzione in cui stai andando)</p>`
         : `<p class="muted help">Frecce ←→ o A D per avanzare e indietreggiare · SPAZIO, Z o ↑ per saltare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SI VA IN SCENA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if ((k === " " || k === "z" || k === "arrowup" || k === "w") && !e.repeat) jumpPressed = true;
    if (k === "arrowleft" || k === "a") keys.left = true;
    if (k === "arrowright" || k === "d") keys.right = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
  });
  window.addEventListener("blur", () => { keys.left = keys.right = false; axis = 0; if (isPlaying()) togglePause(); });
  const jumpBtn = touchEl.querySelector(".jump");
  jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); jumpPressed = true; jumpBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove("on"));
  // thumb stick: only its horizontal part matters
  const stick = touchEl.querySelector(".stick"), knob = stick.querySelector(".knob"), marks = {};
  for (const m of stick.querySelectorAll("i")) marks[m.dataset.d] = m;
  let stickId = null;
  function stickAt(e) {
    const r = stick.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy * 0.4}px)`;
    const v = dx / max;
    axis = Math.abs(v) < 0.25 ? 0 : Math.sign(v);
    marks.left.classList.toggle("on", axis < 0); marks.right.classList.toggle("on", axis > 0);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; axis = 0; marks.left.classList.remove("on"); marks.right.classList.remove("on"); };
  stick.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stick.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  const jumpHeight = (a, t) => { const u = (t / a.jumpT) * 2 - 1; return a.jumpH * (1 - u * u); };
  function spawn(dt) {
    const a = act().id, right = camX + W + 30;
    spawnT -= dt;
    if (spawnT > 0 || right > LEN + 100) return;
    if (a === "leone") {
      // flaming rings; now and then a small one with a money bag
      // the ring meets a clown going full speed about here: keep it clear of the pots, or right on top of one
      const vr = -32 * pace(), meet = p.x + (right - p.x) * act().fwd / (act().fwd - vr);
      // (a pot just past the meeting point is cleared by the same jump through the ring)
      if (obs.some((o) => o.k === "pot" && !(o.x - meet >= -8 && o.x - meet <= 22) && Math.abs(o.x - meet) < 150)) { spawnT = 0.15; return; }
      const small = Math.random() < 0.18;

      ctx.fillText(message.text, W / 2, 83);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#fff6ea"; ctx.fillText(message.sub, W / 2, 101); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildStage(0);
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Torre dell'Arcobaleno</title>
<style>
  :root {
    --bg: #12204a;
    --fg: #f4f6ee;
    --muted: #a8c8d8;
    --pink: #ff6ad0;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk (down on a rainbow breaks it); SALTA jumps, ARCO casts a rainbow */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(122, 228, 255, 0.9); background: rgba(122, 228, 255, 0.22); }
  #touch .jump.on { background: rgba(122, 228, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 32, 74, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e0418; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Arcobaleno">ARCO</button><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28, VIEW = H - TOP;
  const FX0 = 100, FX1 = 540, PW = 7, PH = 22, R = 34;
  const GRAV = 1050, JV = 405, WALK = 118;
  const COLORS = ["#ff3a3a", "#ff9a2a", "#ffe83a", "#3ad05a", "#3a9aff", "#9a5aff"];
  const ISLANDS = [
    { name: "ISOLA DEI FIORI", sky: ["#5ab0ff", "#c8ecff"], plat: "#3aa84a", dirt: "#7a5a3a" },
    { name: "ISOLA DEI GIOCATTOLI", sky: ["#ff9ad0", "#ffe0f0"], plat: "#ff6a3a", dirt: "#8a3a5a" },
    { name: "ISOLA DEI DOLCI", sky: ["#ffd8a0", "#fff4e0"], plat: "#c87a3a", dirt: "#5a3a2a" },
    { name: "ISOLA DEI DRAGHI", sky: ["#3a2a5a", "#8a6ab0"], plat: "#5a5a7a", dirt: "#2a2a3a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · l'acqua arriva tardi e sale piano · mostri più lenti", lives: 5, water: 0.7, foe: 0.8, hurry: 1.4 },
    normale:   { label: "NORMALE",   color: "#ff6ad0", desc: "3 vite", lives: 3, water: 1, foe: 1, hurry: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · l'acqua arriva presto e sale svelta · più mostri", lives: 3, water: 1.3, foe: 1.25, hurry: 0.75 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "arcobaleno-difficulty";
  const bestKey = (id) => `arcobaleno-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    rainbow: lim(() => arp([523, 659, 784, 988, 1175, 1319], 0.025, 0.06, "sine", 0.035)),
    jump: lim(() => beep(330, 0.09, "square", 0.025, 300)),
    kill: lim(() => { beep(900, 0.08, "square", 0.04, 600); noise(0.08, 0.05, 2000); }),
    crash: lim(() => { noise(0.25, 0.1, 700); arp([784, 659, 523], 0.05, 0.08, "square", 0.04); }),
    gem: lim((n) => beep(1200 + n * 60, 0.07, "square", 0.035)),
    power: () => arp([523, 784, 1047, 1568], 0.06, 0.1, "square", 0.045),
    hurry: () => arp([440, 466, 440, 466], 0.12, 0.12, "sawtooth", 0.035),
    die: () => { noise(0.3, 0.1, 400); for (let i = 0; i < 7; i++) beep(800 - i * 80, 0.1, "triangle", 0.04, 0, i * 0.06); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 30000;
  let LH = 1400, TOPY = 110, plats = [], rainbows = [], foes = [], gems = [], parts = [], popups = [], P = null, camY = 0, water = 0, waterT = 0, hurried = false, message = null, bestY = 0;
  let jumpPressed = false, arcPressed = false, downTap = false, lastStickY = 0;
  const keys = { left: false, right: false, down: false };
  const stick = { x: 0, y: 0 };
  const isle = () => ISLANDS[Math.floor((level - 1) / 2) % ISLANDS.length];

  // ---------- The tower ----------
  // rows of one-way ledges up to the treasure chest; each row can always be reached from the one below
  function buildLevel() {
    LH = Math.min(2600, 1300 + 160 * (level - 1));
    plats = [[FX0, FX1, LH - 30, true]];
    let y = LH - 30, prev = [[FX0, FX1]];
    while (y > 170) {
      y -= rnd(54, 66);
      const n = Math.random() < 0.55 ? 1 : 2, row = [];
      for (let i = 0; i < n; i++) {
        const w = rnd(80, 170 - level * 4 > 90 ? 170 - level * 4 : 90);
        // near a ledge of the row below, so a jump (or a rainbow) gets there
        const base = pick(prev), cx = clamp(rnd(base[0] - 70, base[1] + 70), FX0 + w / 2, FX1 - w / 2);
        const seg = [cx - w / 2, cx + w / 2];
        if (row.some((r) => seg[0] < r[1] + 30 && seg[1] > r[0] - 30)) continue;
        row.push(seg); plats.push([seg[0], seg[1], y, false]);
      }
      prev = row.length ? row : prev;
    }
    TOPY = y - 58;
    plats.push([FX0 + 60, FX1 - 60, TOPY, true]);
    // monsters on the ledges and in the air
    foes = [];
    const n = Math.round((6 + level * 2) * diff.foe);
    const ledges = plats.filter((p) => !p[3] && p[2] < LH - 200 && p[1] - p[0] > 70);
    for (let i = 0; i < n && ledges.length; i++) {
      const p = pick(ledges), kind = level >= 2 && Math.random() < 0.3 ? "ape" : level >= 3 && Math.random() < 0.25 ? "ragno" : "bruco";
      if (kind === "bruco") foes.push({ kind, x: rnd(p[0] + 10, p[1] - 10), y: p[2], p, dir: Math.random() < 0.5 ? -1 : 1, t: rnd(0, 3) });
      else if (kind === "ape") foes.push({ kind, x: rnd(FX0 + 30, FX1 - 30), y: p[2] - rnd(20, 40), y0: p[2] - 30, dir: Math.random() < 0.5 ? -1 : 1, t: rnd(0, 6) });
      else foes.push({ kind, x: rnd(p[0] + 10, p[1] - 10), y: p[2] + 10, y0: p[2] + 6, len: rnd(40, 70), t: rnd(0, 4) });
    }
    rainbows = []; gems = []; water = LH + 60; waterT = 0; hurried = false;
  }
  // the top of the ledge or rainbow crossed going down from y0 to y1
  function arcY(r, x) { const dx = x - r.cx; return Math.abs(dx) >= R ? null : r.by - Math.sqrt(R * R - dx * dx); }
  function landOn(x, y0, y1) {
    let best = null, on = null;
    for (const p of plats) if (x + PW > p[0] && x - PW < p[1] && y0 <= p[2] + 0.5 && y1 >= p[2] && (best === null || p[2] < best)) { best = p[2]; on = null; }
    for (const r of rainbows) {
      if (r.t < 1 || r.fall) continue;
      const s = arcY(r, x); if (s === null) continue;
      if (y0 <= s + 3 && y1 >= s - 1 && (best === null || s < best)) { best = s; on = r; }
    }
    return best === null ? null : { y: best, on };
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    P = { x: (FX0 + FX1) / 2, y: LH - 30, vx: 0, vy: 0, air: false, face: 1, on: null, safe: 1.5, walk: 0, cd: 0, max: 2, fast: false, lastSafe: { x: (FX0 + FX1) / 2, y: LH - 30 } };
    bestY = P.y; camY = LH - VIEW; parts = []; popups = [];
    message = { text: `${isle().name} · ${level}`, sub: "sali fino al forziere prima che salga l'acqua!", t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 50000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: P.x, y: P.y - 50, text: "VITA EXTRA!", color: "#7ed87a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c: c || pick(COLORS) }); }
  }
  function die(by) {
    if (state !== "play" || P.safe > 0) return;
    if (window.__deaths) window.__deaths.push([level, by, Math.round(LH - P.y)]);
    if (window.__god) return;
    lives--; sfx.die(); burst(P.x, P.y - 10, "#ffffff", 20, 120, 0.7);
    state = "dead"; stateT = 2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · torre ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>TORRE DELL'ARCOBALENO</h1>
       <p>Arrampicati fino al forziere in cima a ogni torre! Il tuo arcobaleno è un'arma e un ponte: lanciato davanti a te abbatte i mostri che tocca, poi ci puoi camminare sopra per salire più in alto. Premendo giù mentre ci sei sopra lo rompi e cade, schiacciando chi c'è sotto. Ma sbrigati: dopo un po' l'acqua comincia a salire!</p>
       <div class="pts">
         <span><b>Mostri</b></span><span>bruchi, api e ragni · colpiti dall'arcobaleno 100 · schiacciati da un arcobaleno che cade 300, 600, 1.200…</span>
         <span><b>Premi</b></span><span>gemme 200 · scarpe (più veloce) · stella (un arcobaleno in più) · forziere in cima 1.000 per torre</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per camminare (giù su un arcobaleno per romperlo) · SALTA · ARCO per lanciare l'arcobaleno</p>`
         : `<p class="muted help">Frecce o A D per camminare · ↓ o S su un arcobaleno per romperlo · SPAZIO, W, ↑ o J per saltare · X, K o Z per l'arcobaleno · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>ALL'ARREMBAGGIO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowdown: "down", s: "down" };
  const JUMPKEYS = [" ", "w", "arrowup", "j"], ARCKEYS = ["x", "k", "z"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (JUMPKEYS.includes(k) && !e.repeat) jumpPressed = true;
    if (ARCKEYS.includes(k) && !e.repeat) arcPressed = true;
    if ((k === "arrowdown" || k === "s") && !e.repeat) downTap = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  for (const [sel, fn] of [[".hop", () => { jumpPressed = true; }], [".axe", () => { arcPressed = true; }]]) {
    const b = touchEl.querySelector(sel);
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); fn(); b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.18 ? 0 : Math.sign(v) * Math.min(1, (a - 0.18) / 0.55); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function castRainbow() {
    if (P.cd > 0 || rainbows.filter((r) => !r.fall).length >= P.max) return;

    rainbows.push({ cx: P.x + P.face * (R + 2), by: P.y, dir: P.face, t: 0, life: 5.5, hit: new Set(), fall: false, vy: 0, kills: 0 });
    P.cd = 0.32; sfx.rainbow();
  }
  function updatePlayer(dt) {

    const sp = WALK * (P.fast ? 1.3 : 1);

    if (P.y < bestY - 50) { bestY = P.y; addScore(10); }
    // the treasure chest at the top
    const top = plats[plats.length - 1];
    if (!P.air && Math.abs(P.y - top[2]) < 1 && Math.abs(P.x - (FX0 + FX1) / 2) < 22) levelClear();
    if (P.y > water - 4) die("acqua");
  }
  function killFoe(f, pts, label) {
    f.dead = true; sfx.kill(); burst(f.x, f.y - 6, null, 14, 110, 0.5);
    addScore(pts, f.x, f.y - 20, "#ffffff", label);
    const roll = Math.random();
    gems.push({ x: f.x, y: f.y - 8, vy: -180, kind: roll < 0.04 ? "scarpe" : roll < 0.08 ? "stella" : "gemma", c: pick(COLORS), rest: false, t: 0 });
  }
  function updateRainbows(dt) {
    for (const r of rainbows) {
      if (r.fall) {

        continue;

        r.t = Math.min(1, r.t + dt / 0.22);

    foes = foes.filter((f) => !f.dead);
  }
  function updateFoes(dt) {
    const sp = diff.foe * (1 + 0.05 * Math.min(10, level - 1));
    for (const f of foes) {
      f.t += dt;
      if (f.kind === "bruco") { f.x += f.dir * 34 * sp * dt; if (f.x < f.p[0] + 6 || f.x > f.p[1] - 6) { f.dir = -f.dir; f.x = clamp(f.x, f.p[0] + 6, f.p[1] - 6); } }
      else if (f.kind === "ape") { f.x += f.dir * 60 * sp * dt; f.y = f.y0 + Math.sin(f.t * 3) * 16; if (f.x < FX0 + 10 || f.x > FX1 - 10) f.dir = -f.dir; }
      else { f.y = f.y0 + (0.5 - 0.5 * Math.cos(f.t * 1.4 * sp)) * f.len; }
      if (P.safe <= 0 && Math.abs(f.x - P.x) < 12 && f.y > P.y - PH - 4 && f.y - 12 < P.y) die(f.kind);
    }
  }
  function updateGems(dt) {
    for (const g of gems) {
      g.t += dt;
      if (!g.rest) { const y0 = g.y; g.vy += GRAV * dt; g.y += g.vy * dt; if (g.vy > 0) { const l = landOn(g.x, y0, g.y); if (l && !l.on) { g.y = l.y; g.rest = true; } } if (g.y > water) g.gone = true; }
      if (Math.abs(g.x - P.x) < 14 && Math.abs(g.y - (P.y - 8)) < 18) {
        g.gone = true;
        if (g.kind === "scarpe") { P.fast = true; sfx.power(); popups.push({ x: g.x, y: g.y - 16, text: "SCARPE VELOCI!", color: "#ffd23a", t: 0 }); }
        else if (g.kind === "stella") { P.max = Math.min(3, P.max + 1); sfx.power(); popups.push({ x: g.x, y: g.y - 16, text: "UN ARCOBALENO IN PIÙ!", color: "#ffd23a", t: 0 }); }
        else { addScore(200, g.x, g.y - 14, g.c, "200"); sfx.gem(Math.floor(Math.random() * 6)); }
      }

  }
  function levelClear() {
    if (state !== "play") return;
    const bonus = 1000 * level + Math.max(0, Math.round((water - P.y) / 10)) * 10;
    score += bonus;
    message = { text: "IL FORZIERE!", sub: `torre ${level} superata · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
    burst(P.x, P.y - 20, null, 40, 180, 1.2);

  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; }

      stateT -= dt; flags();
      if (stateT <= 0) {
        if (lives <= 0) gameOver();
        else {
          // back on the last ledge stood on, and the water drops a little
          water = Math.max(water, P.lastSafe.y + 220); waterT = Math.min(waterT, 8);
          Object.assign(P, { x: P.lastSafe.x, y: P.lastSafe.y, vx: 0, vy: 0, air: false, on: null, safe: 2 });

        }
      }
      return;
    }
    if (state === "clear") { stateT -= dt; flags(); if (stateT <= 0) { level++; beginLevel(); } return; }
    if (state !== "play") { flags(); return; }
    // the water: after a while it starts rising, faster and faster
    waterT += dt;
    const hurry = Math.max(14, (34 - level * 1.5) * diff.hurry);
    if (waterT > hurry) {
      if (!hurried) { hurried = true; sfx.hurry(); message = { text: "SBRIGATI!", sub: "l'acqua sale!", t: 0 }; }

    updateFoes(dt); if (state !== "play") return;

  // ---------- Drawing ----------
  const sy = (y) => TOP + y - camY;
  function drawRainbow(r) {
    const x = r.cx, y = sy(r.by);
    ctx.globalAlpha = r.life < 1 && !r.fall ? (Math.floor(clock * 10) % 2 ? 0.4 : 1) : 1;
    const a0 = r.dir > 0 ? Math.PI : 0, a1 = a0 + r.dir * Math.PI * r.t;

  }
  function drawHero() {
    if (P.safe > 0 && state === "play" && Math.floor(clock * 12) % 2) return;
    const x = P.x, y = sy(P.y), f = P.face, b = P.air ? 0 : Math.abs(Math.sin(P.walk)) * 1.5;
    ctx.fillStyle = "#3a5aff"; ctx.fillRect(x - 6, y - 6, 5, 6); ctx.fillRect(x + 1, y - 6, 5, 6);
    ctx.fillStyle = P.fast ? "#ff3a3a" : "#8a5a2a"; ctx.fillRect(x - 7, y - 2, 6, 2); ctx.fillRect(x + 1, y - 2, 6, 2);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 6, y - 15 - b, 12, 10);
    ctx.fillStyle = "#ffe0b0"; ctx.beginPath(); ctx.arc(x, y - 19 - b, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#c8381a"; ctx.beginPath(); ctx.arc(x, y - 21 - b, 6, Math.PI, TAU); ctx.fill(); ctx.fillRect(x - f * 6, y - 22 - b, 3, 6);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x + f * 2, y - 20 - b, 2, 2);
  }
  function drawFoe(f) {
    const x = f.x, y = sy(f.y);
    if (f.kind === "bruco") {
      for (let i = 3; i >= 0; i--) { ctx.fillStyle = i ? "#8ae04a" : "#5ab02a"; ctx.beginPath(); ctx.arc(x - f.dir * i * 5, y - 5 - Math.abs(Math.sin(f.t * 8 + i)) * 2, 5, 0, TAU); ctx.fill(); }
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x + f.dir * 2, y - 8, 2, 2);
    } else if (f.kind === "ape") {
      ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.ellipse(x, y - 6, 8, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 3, y - 12, 2, 12); ctx.fillRect(x + 2, y - 12, 2, 12);
      ctx.fillStyle = "rgba(255,255,255,0.8)"; const w = Math.sin(clock * 30) * 3; ctx.beginPath(); ctx.ellipse(x - 2, y - 14 - w, 4, 3, -0.4, 0, TAU); ctx.ellipse(x + 3, y - 14 - w, 4, 3, 0.4, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, sy(f.y0 - 6)); ctx.lineTo(x, y - 8); ctx.stroke();
      ctx.fillStyle = "#5a3a7a"; ctx.beginPath(); ctx.arc(x, y - 6, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#5a3a7a"; ctx.lineWidth = 1.5; for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + s * 10, y - 10 + k * 5); ctx.stroke(); }
      ctx.fillStyle = "#ff3a3a"; ctx.fillRect(x - 3, y - 8, 2, 2); ctx.fillRect(x + 1, y - 8, 2, 2);
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(18,32,74,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#a8c8d8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff6ad0"; ctx.font = "900 10px system-ui"; ctx.fillText(`TORRE ${level}`, x0 + 80, 21);
    // how far up the tower, and where the water is
    const k = clamp(1 - (P.y - TOPY) / (LH - 30 - TOPY), 0, 1), kw = clamp(1 - (water - TOPY) / (LH - 30 - TOPY), 0, 1);
    ctx.fillStyle = "#2a3a6a"; ctx.fillRect(x0 + 150, 10, 110, 8);
    ctx.fillStyle = "#3a8aff"; ctx.fillRect(x0 + 150, 10, 110 * kw, 8);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x0 + 150 + 110 * k - 1, 7, 3, 14);
    ctx.font = "800 9px system-ui"; ctx.fillStyle = "#a8c8d8"; ctx.fillText("🏁", x0 + 264, 14);
    for (let i = 0; i < P.max; i++) { ctx.strokeStyle = COLORS[i * 2]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x0 + 300 + i * 18, 18, 7, Math.PI, TAU); ctx.stroke(); }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#c8381a"; ctx.beginPath(); ctx.arc(lx - i * 13, 14, 5, 0, TAU); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!plats.length) { buildLevel(); P = { x: 320, y: LH - 30, face: 1, air: false, walk: 0, safe: 0, max: 2 }; camY = LH - VIEW; rainbows.push({ cx: 356, by: LH - 30, dir: 1, t: 1, life: 9, fall: false }); }
    const is = isle(), g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, is.sky[0]); g.addColorStop(1, is.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);

    for (let i = 0; i < 6; i++) { const y = ((i * 170 - camY * 0.4) % 700 + 700) % 700 - 100 + TOP, x = (i * 113 + clock * 6) % (W + 80) - 40; ctx.beginPath(); ctx.ellipse(x, y, 34, 10, 0, 0, TAU); ctx.fill(); }

    ctx.fillStyle = is.dirt; ctx.fillRect(0, TOP, FX0, H - TOP); ctx.fillRect(FX1, TOP, W - FX1, H - TOP);

      for (let x = 0; x <= W; x += 10) ctx.lineTo(x, wy + Math.sin(x * 0.06 + clock * 4) * 2);
      ctx.stroke();

    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, sy(p.y) - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#12204a"; ctx.strokeText(p.text, p.x, sy(p.y)); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, sy(p.y));
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 2.8 : 2.2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ff6ad0";
      ctx.lineWidth = 5; ctx.strokeStyle = "#12204a"; ctx.strokeText(message.text, W / 2, 80); ctx.fillText(message.text, W / 2, 80);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 99); ctx.fillText(message.sub, W / 2, 99); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

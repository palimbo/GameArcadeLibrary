<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Asso dei Cieli</title>
<style>
  :root {
    --bg: #04121f;
    --fg: #f4f1e6;
    --muted: #9fb4c4;
    --sky: #6ac8ff;
    --gold: #ffc93a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #12324a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 241, 230, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* analog thumb stick, a fire button (hold for autofire) and the looping button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(106, 200, 255, 0.55); background: radial-gradient(circle, rgba(106,200,255,0.14), rgba(106,200,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(106, 200, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,241,230,0.25); pointer-events: none; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .fire { width: 96px; height: 96px; border: 2px solid rgba(255, 90, 74, 0.9); background: rgba(255, 90, 74, 0.2); }
  #touch .loop { width: 66px; height: 66px; font-size: 11px !important; border: 2px solid rgba(255, 201, 58, 0.9); background: rgba(255, 201, 58, 0.16); }
  #touch .btns button.on { background: rgba(255, 201, 58, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #touch.small .loop { width: 56px; height: 56px; font-size: 10px !important; }
  #touch.small .btns { gap: 6px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 18, 31, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #8a4a10, 0 0 22px rgba(255,201,58,0.4); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,241,230,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1600; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #8a4a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="loop" aria-label="Giro della morte">GIRO</button>
    <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 480, HUD = 24, TAU = Math.PI * 2;
  const STAGE_LEN = 62;                 // seconds of formations before the flying fortress
  const KINDS = {
    zero:   { pts: 50,   r: 11, hp: 1,  col: "#5aa05a", col2: "#2e6a3a" },
    red:    { pts: 100,  r: 11, hp: 1,  col: "#e8463a", col2: "#8a1e1a" },
    grey:   { pts: 80,   r: 11, hp: 1,  col: "#9aa4ae", col2: "#5a646e" },
    bomber: { pts: 500,  r: 20, hp: 7,  col: "#6a8a4a", col2: "#3a5a2a" },
    boss:   { pts: 5000, r: 40, hp: 70, col: "#7a8a5a", col2: "#4a5a34" },
  };
  const POWS = {
    P: { col: "#ff5a4a", text: "FUOCO QUADRUPLO!" },
    G: { col: "#6ac8ff", text: "GREGARI IN VOLO!" },
    L: { col: "#ffc93a", text: "GIRO EXTRA!" },
    B: { col: "#b86aff", text: "BOMBA: CIELO PULITO!" },
    S: { col: "#f4f1e6", text: "STELLA: 1.000 PUNTI" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 aerei · 4 giri per missione · nemici lenti e pochi colpi", lives: 5, loops: 4, aggr: 0.75, fire: 0.5, bullet: 0.8 },
    normale:   { label: "NORMALE",   color: "#6ac8ff", desc: "3 aerei · 3 giri per missione · l'esperienza classica", lives: 3, loops: 3, aggr: 1, fire: 1, bullet: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "3 aerei · 3 giri · squadriglie fitte e colpi rapidi", lives: 3, loops: 3, aggr: 1.25, fire: 1.5, bullet: 1.15 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "asso-difficulty";
  const bestKey = (id) => `asso-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1100, 0.04, "square", 0.015, -500)),
    boom: lim(() => { noise(0.3, 0.22, 1200); beep(180, 0.15, "square", 0.02, -100); }),
    hit: lim(() => beep(520, 0.05, "square", 0.025, -150)),
    big: lim(() => { noise(0.9, 0.35, 600); arp([330, 262, 196, 131], 0.08, 0.16, "sawtooth", 0.03); }),
    loop: () => { beep(300, 0.6, "sawtooth", 0.025, 500); beep(800, 0.6, "triangle", 0.02, -500, 0.6); },
    pow: () => arp([659, 880, 1047, 1319, 1760], 0.06, 0.1, "square", 0.04),
    die: () => { noise(1, 0.35, 700); arp([523, 415, 330, 262, 196], 0.12, 0.2, "sawtooth", 0.035); },
    start: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.11, 0.16),
    boss: () => arp([196, 262, 196, 262, 196, 311], 0.16, 0.22, "sawtooth", 0.035),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.09, 0.15),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    warn: lim(() => beep(1400, 0.08, "square", 0.02, 0)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, bestCache = 0, nextLife = 20000;
  let P = null, foes = [], shots = [], eshots = [], pows = [], parts = [], popups = [], warns = [], message = null;
  let stageT = 0, waveT = 0, redT = 0, bomberT = 0, boss = null, bossDone = false, spawned = 0, downed = 0, flash = 0, powCycle = 0;
  let isles = [], clouds = [], waves = [], carrier = null, scroll = 0;
  let stickV = [0, 0], fireHeld = false, loopPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  for (let i = 0; i < 60; i++) waves.push({ x: Math.random() * W, y: Math.random() * H, w: rnd(6, 16) });

  const pace = () => diff.aggr * (1 + Math.min(0.8, stage * 0.08));

  // ---------- Scenery ----------
  function makeIsle(y) {
    const r = rnd(26, 60), n = 12, pts = [];
    for (let i = 0; i < n; i++) pts.push(r * rnd(0.7, 1.15));
    return { x: rnd(20, W - 20), y, r, pts, rot: rnd(0, TAU), palms: Math.floor(rnd(1, 5)) };
  }
  function resetScenery() {
    isles = []; clouds = [];
    for (let y = -60; y < H; y += rnd(170, 260)) isles.push(makeIsle(y));
    for (let i = 0; i < 4; i++) clouds.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.7, 1.4) });
  }
  function scrollScenery(dt) {
    const v = 36;
    scroll += v * dt;
    for (const w of waves) { w.y += v * dt; if (w.y > H + 4) { w.y = -4; w.x = Math.random() * W; } }
    for (const s of isles) s.y += v * dt;
    isles = isles.filter((s) => s.y < H + 90);
    if (!isles.length || isles[isles.length - 1].y > rnd(120, 220)) isles.push(makeIsle(-90));
    for (const c of clouds) { c.y += v * 2.2 * dt; if (c.y > H + 70) { c.y = -70; c.x = rnd(0, W); c.s = rnd(0.7, 1.4); } }
    if (carrier) carrier.y += v * dt;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function newPlane() { return { x: W / 2, y: 400, inv: 2, cool: 0, quad: false, wing: 0, loop: 0, dead: false, bank: 0 }; }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; nextLife = 20000; powCycle = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = newPlane();
    resetScenery();
    beginStage();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginStage() {
    foes = []; shots = []; eshots = []; pows = []; warns = [];
    stageT = 0; waveT = 2.2; redT = rnd(6, 9); bomberT = rnd(16, 22); boss = null; bossDone = false; spawned = 0; downed = 0;
    P.x = W / 2; P.y = 400; P.inv = 2; P.loops = diff.loops; P.loop = 0;
    carrier = { y: 300 };
    message = { text: `MISSIONE ${stage + 1}`, sub: "Decollo dalla portaerei!", t: 0 };
    state = "intro"; stateT = 2;
  }
  function addScore(n, x, y, color = "#f4f1e6") {
    score += n;
    if (x !== undefined && n >= 100) popups.push({ x, y, text: n.toLocaleString("it-IT"), color, t: 0 });
    if (score >= nextLife) {
      nextLife = nextLife === 20000 ? 80000 : nextLife + 80000;
      if (lives < 9) lives++; sfx.life();
      popups.push({ x: W / 2, y: H / 2 - 40, text: "AEREO EXTRA", color: "#ffc93a", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 12, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function smoke(x, y) { parts.push({ x, y, vx: rnd(-10, 10), vy: rnd(20, 40), t: 0, life: 0.8, c: "#556", big: true }); }
  function losePlane() {
    if (state !== "play" || P.dead || P.inv > 0 || P.loop > 0) return;
    lives--; P.dead = true;
    sfx.die(); burst(P.x, P.y, "#ffffff", 26, 150, 1); burst(P.x, P.y, "#ff8a3a", 24, 120, 0.9); burst(P.x, P.y, "#ffc93a", 12, 70, 0.7);
    state = "dead"; stateT = 2.4;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    const loops = P.loops;
    P = newPlane(); P.loops = Math.max(loops, 1); P.inv = 2.5;
    eshots = [];
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, st = stage + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Missione ${st} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ASSO DEI CIELI</h1>
       <p>Decolla dalla portaerei e vola sopra l'oceano: squadriglie di caccia arrivano in picchiata, di lato e perfino da dietro. Col giro della morte schivi tutto per un istante. Abbatti la squadriglia rossa al completo per un potenziamento e, a fine missione, affronta la fortezza volante.</p>
       <div class="pts">
         <span><b>Caccia verde · grigio</b></span><span>50 · 80</span>
         <span><b>Squadriglia rossa</b></span><span>100 l'uno · tutti e 5 lasciano un POW</span>
         <span><b>Bombardiere</b></span><span>7 colpi · 500</span>
         <span><b>Fortezza volante</b></span><span>5.000</span>
         <span><b>POW</b></span><span>P fuoco quadruplo · G gregari · L giro extra · B bomba</span>
         <span><b>Atterraggio</b></span><span>bonus in base alla percentuale di abbattuti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per volare · FUOCO per sparare (tienilo premuto) · GIRO per il giro della morte</p>`
         : `<p class="muted help">Frecce o WASD per volare · SPAZIO o Z per sparare (tienilo premuto) · X o SHIFT giro della morte · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DECOLLA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------

    ctx.save(); ctx.translate(W / 2, y);
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.ellipse(0, 175, 40, 18, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#5a646e"; ctx.beginPath(); ctx.moveTo(0, -170); ctx.lineTo(34, -120); ctx.lineTo(36, 160); ctx.lineTo(-36, 160); ctx.lineTo(-34, -120); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7a6a52"; ctx.fillRect(-28, -130, 56, 285);
    ctx.strokeStyle = "#f4f1e6"; ctx.lineWidth = 1.5; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(0, -125); ctx.lineTo(0, 150); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#3a444e"; ctx.fillRect(30, -20, 10, 40);
    ctx.fillStyle = "#ffc93a"; ctx.fillRect(-28, 140, 56, 3);
    ctx.restore();
  }
  function drawIsle(s) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    const shape = (grow) => { ctx.beginPath(); s.pts.forEach((r, i) => { const a = i / s.pts.length * TAU, rr = r + grow; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }); ctx.closePath(); };
    ctx.fillStyle = "#2a8ab8"; shape(10); ctx.fill();
    ctx.fillStyle = "#e8d49a"; shape(3); ctx.fill();
    ctx.fillStyle = "#4a9a4a"; shape(-5); ctx.fill();
    ctx.fillStyle = "#3a7a3a"; shape(-s.r * 0.5); ctx.fill();
    ctx.fillStyle = "#2a5a2a";
    for (let i = 0; i < s.palms; i++) { const a = i * 2.1, rr = s.r * 0.35; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 5, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    // the ocean
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a4a7a"); g.addColorStop(1, "#0a3a64");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    for (const w of waves) ctx.fillRect(w.x, w.y, w.w, 1.5);
    for (const s of isles) drawIsle(s);
    if (carrier && carrier.y < H + 200) drawCarrier(carrier.y);
    if (state === "menu" || !P) { drawClouds(); return; }
    // shadows then planes
    for (const f of foes) if (f.t >= 0) drawShadow(() => drawFoe(f));
    const showP = !P.dead && !(P.inv > 0 && state === "play" && Math.floor(clock * 12) % 2);
    const lp = P.loop > 0 ? 1 - P.loop / 1.3 : 0;
    const pScale = 1 + 0.6 * Math.sin(Math.PI * lp), pFlip = P.loop > 0 ? Math.cos(TAU * lp) : 1;
    const pY = P.y - 40 * Math.sin(TAU * lp) * (1 - lp);
    if (showP) drawShadow(() => drawP38(P.x, P.y, P.bank, 1, pFlip));
    for (const p of pows) {
      const c = POWS[p.type].col;
      ctx.fillStyle = Math.floor(clock * 6) % 2 ? c : "#f4f1e6";
      ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#1a1a1a"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.fillText(p.type === "S" ? "★" : p.type, p.x, p.y + 1);
      ctx.textBaseline = "alphabetic";
    }
    for (const f of foes) if (f.t >= 0) drawFoe(f);
    ctx.fillStyle = "#ffe89a";
    for (const b of shots) ctx.fillRect(b.x - 1, b.y - 5, 2, 8);
    for (const b of eshots) { ctx.fillStyle = "#ff5a2a"; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffe89a"; ctx.beginPath(); ctx.arc(b.x, b.y, 1.3, 0, TAU); ctx.fill(); }
    if (showP) {
      if (P.wing & 1) drawP38(P.x - 24, P.y + 4, P.bank, 0.65, 1, "#c8d4a8");
      if (P.wing & 2) drawP38(P.x + 24, P.y + 4, P.bank, 0.65, 1, "#c8d4a8");
      drawP38(P.x, pY, P.bank, pScale, pFlip);
    }
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / q.life) * (q.big ? 0.5 : 1); ctx.fillStyle = q.c;
      if (q.big) { ctx.beginPath(); ctx.arc(q.x, q.y, 3 + q.t * 6, 0, TAU); ctx.fill(); } else ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
    drawClouds();
    for (const w of warns) {
      if (Math.floor(w.t * 8) % 2) continue;
      ctx.fillStyle = "#ffc93a"; ctx.beginPath(); ctx.moveTo(w.x, H - 34); ctx.lineTo(w.x + 12, H - 14); ctx.lineTo(w.x - 12, H - 14); ctx.fill();
      ctx.fillStyle = "#1a1a1a"; ctx.textAlign = "center"; ctx.font = "900 12px system-ui, sans-serif"; ctx.fillText("!", w.x, H - 17);
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 18px system-ui, sans-serif" : "900 10px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "rgba(4,18,31,0.85)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f4f1e6";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.textAlign = "center"; ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff5a4a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, W / 2, 12);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#6ac8ff";
    ctx.fillText(`MISSIONE ${stage + 1}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    // spare planes (left) and loops left (right)
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) drawP38(14 + i * 20, H - 12, 0, 0.55);
    ctx.textAlign = "right"; ctx.font = "900 11px system-ui, sans-serif";
    for (let i = 0; i < Math.min(P.loops, 8); i++) { ctx.fillStyle = "#ffc93a"; ctx.fillText("L", W - 8 - i * 11, H - 7); }
    // mission progress
    if (state === "play" && !bossDone) {
      const k = Math.min(1, stageT / STAGE_LEN);
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(W - 5, HUD + 8, 2, 120);
      ctx.fillStyle = "#ffc93a"; ctx.fillRect(W - 6, HUD + 8 + 120 * (1 - k) - 2, 4, 4);
    }
    if (boss && !boss.dead && !boss.gone && boss.t > 0) {
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(W / 2 - 60, HUD + 4, 120, 5);
      ctx.fillStyle = "#ff5a4a"; ctx.fillRect(W / 2 - 60, HUD + 4, 120 * boss.hp / boss.max, 5);
    }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#ffc93a";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, H / 2 - 20); ctx.fillText(message.text, W / 2, H / 2 - 20);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f4f1e6"; ctx.strokeText(message.sub, W / 2, H / 2); ctx.fillText(message.sub, W / 2, H / 2); }
      ctx.globalAlpha = 1;
    }
  }
  function drawClouds() {
    for (const c of clouds) {
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.beginPath();
      ctx.arc(c.x, c.y, 26 * c.s, 0, TAU); ctx.arc(c.x + 24 * c.s, c.y + 6 * c.s, 20 * c.s, 0, TAU); ctx.arc(c.x - 22 * c.s, c.y + 8 * c.s, 18 * c.s, 0, TAU);
      ctx.fill();
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  resetScenery();
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="asso-best-" data-kind="score"></script>

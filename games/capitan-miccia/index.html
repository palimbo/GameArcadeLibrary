<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Capitan Miccia</title>
<style>
  :root {
    --bg: #07061a;
    --fg: #fff4e8;
    --muted: #b8b0d8;
    --hero: #3d8bff;
    --fuse: #ff5a1a;
    --gold: #ffd34d;
    --bad: #ff4f6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2250, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 232, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(61, 139, 255, 0.7); background: rgba(61, 139, 255, 0.1);
  }
  #touch button[data-a="jump"] { width: 92px; height: 92px; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.14); font: 800 15px system-ui, sans-serif; letter-spacing: 1px; }
  #touch.small button { width: 56px; height: 56px; font-size: 20px; }
  #touch.small button[data-a="jump"] { width: 72px; height: 72px; font-size: 13px; }
  #touch button.on { background: rgba(255, 244, 232, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(7, 6, 26, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(36px, 10vw, 64px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold); text-shadow: 3px 3px 0 #c83a1a, 6px 6px 0 #3d3dc8; }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,232,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1206; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a85a00; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
  </div>
  <div class="cl">
    <button type="button" data-a="jump" aria-label="Salta">SALTA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 512, H = 448, TOP = 30, FLOOR = 424;
  const G = 760, JUMP = 560, RUN = 150, AIR = 140, GLIDE = 48, HW = 9, HH = 26;
  // five places around the world (and beyond); each with its own ledges
  const ROUNDS = [
    { name: "EGITTO", sky: ["#1a1040", "#e8804a"], plats: [[70, 330, 120], [320, 330, 120], [196, 230, 120], [40, 140, 110], [362, 140, 110]] },
    { name: "GRECIA", sky: ["#0a2a6a", "#6ac0ff"], plats: [[180, 340, 150], [40, 250, 120], [352, 250, 120], [196, 150, 120]] },
    { name: "CASTELLO", sky: ["#1a0a2a", "#8a3a8a"], plats: [[40, 320, 110], [200, 320, 110], [362, 320, 110], [120, 210, 110], [282, 210, 110], [200, 110, 110]] },
    { name: "METROPOLI", sky: ["#02020e", "#2a1a5a"], plats: [[60, 350, 90], [362, 350, 90], [160, 270, 190], [30, 180, 100], [382, 180, 100], [196, 110, 120]] },
    { name: "LUNA", sky: ["#000000", "#1a1a3a"], plats: [[110, 330, 100], [302, 330, 100], [206, 240, 100], [60, 160, 100], [352, 160, 100]] },
  ];
  const LIT_BONUS = [[23, 50000], [22, 30000], [21, 20000], [20, 10000]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · nemici lenti e meno numerosi", lives: 5, speed: 0.8, cap: 4, every: 5 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, cap: 6, every: 3.6 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · nemici veloci e numerosi", lives: 3, speed: 1.2, cap: 8, every: 2.8 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "miccia-difficulty";
  const bestKey = (id) => `miccia-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  let bgCache = null, bgKey = "";
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(130px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 130;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
    bgKey = "";
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    jump: lim(() => beep(260, 0.25, "square", 0.03, 700)),
    glide: lim(() => beep(900, 0.05, "triangle", 0.02)),
    bomb: lim((lit) => lit ? arp([1319, 1760], 0.04, 0.07, "square", 0.04) : beep(988, 0.07, "square", 0.035)),
    power: () => arp([523, 659, 784, 1047, 1319], 0.05, 0.1, "square", 0.04),
    coin: lim((k) => beep(1200 + k * 120, 0.1, "triangle", 0.05)),
    spawn: lim(() => beep(200, 0.3, "sine", 0.03, 400)),
    morph: lim(() => beep(500, 0.2, "sawtooth", 0.025, -300)),
    die: () => { noise(0.5, 0.3, 800); arp([784, 659, 523, 392, 262], 0.1, 0.12); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, round = 0, bestCache = 0, nextLife = 20000;
  let plats = [], bombs = [], hero = null, foes = [], power = null, coinT = 0, coinStreak = 0, litCount = 0, lastIdx = -1;
  let parts = [], popups = [], spawnT = 0, powerT = 12, message = null, roundT = 0;
  const ctl = { left: false, right: false, jump: false };
  let jumpPressed = false;

  const R = () => ROUNDS[round % ROUNDS.length];
  const speedMul = () => diff.speed * (1 + Math.min(0.6, round * 0.06));

  function buildRound() {
    plats = R().plats.map(([x, y, w]) => ({ x, y, w }));
    // 24 bombs: rows above the ledges, along the top and down the sides, in a fixed order
    const spots = [];
    // never right under a ledge, where they would be awkward to reach
    const clear = (x, y) => !plats.some((p) => x > p.x - 14 && x < p.x + p.w + 14 && y > p.y - 12 && y < p.y + 50);
    const tryAdd = (x, y) => { if (spots.length < 24 && clear(x, y) && !spots.some((s) => Math.hypot(s.x - x, s.y - y) < 22)) spots.push({ x, y }); };
    for (let x = 60; x <= W - 60 && spots.length < 6; x += 78) tryAdd(x, TOP + 26);
    for (const p of plats) for (let k = 0; k < 3; k++) tryAdd(p.x + p.w * (0.2 + k * 0.3), p.y - 22);
    for (let y = 110; y < FLOOR - 40 && spots.length < 20; y += 64) { tryAdd(22, y); tryAdd(W - 22, y); }
    for (let x = 100; spots.length < 24 && x < W - 60; x += 54) tryAdd(x, FLOOR - 70);
    for (let x = 60; spots.length < 24 && x < W - 40; x += 44) tryAdd(x, FLOOR - 20);
    for (let x = 81; spots.length < 24; x += 37) tryAdd(x % (W - 60) + 30, TOP + 70 + (x % 5) * 50);
    bombs = spots.slice(0, 24).map((s, i) => ({ ...s, i, got: false }));
    hero = { x: W / 2, y: FLOOR, vx: 0, vy: 0, ground: true, face: 1, jumpT: 0, gliding: false, walk: 0, dead: false, inv: 1.5 };
    foes = []; power = null; coinT = 0; coinStreak = 0; litCount = 0; lastIdx = -1;
    spawnT = 1.5; powerT = rnd(10, 16); roundT = 0;
    message = { text: `ROUND ${round + 1} · ${R().name}`, t: 0 };
    state = "intro"; stateT = 1.6;
  }
  // the lit bomb is the next one in order after the last one collected
  function litBomb() {
    const left = bombs.filter((b) => !b.got);
    if (!left.length) return null;
    return left.find((b) => b.i > lastIdx) || left[0];
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff4e8") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.5, c: color });
    }
  }
  function die() {
    if (state !== "play" || hero.inv > 0) return;
    lives--; hero.dead = true;
    sfx.die();
    burst(hero.x, hero.y - 14, "#3d8bff", 20, 160);
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // start again in the middle; the bombs already taken stay taken
    Object.assign(hero, { x: W / 2, y: FLOOR, vx: 0, vy: 0, ground: true, dead: false, inv: 2, gliding: false });
    foes = foes.filter((f) => Math.hypot(f.x - W / 2, f.y - FLOOR) > 160).slice(0, 2);
    spawnT = 2;
    state = "play";
  }
  function roundCleared() {
    const b = LIT_BONUS.find(([n]) => litCount >= n);
    const bonus = b ? b[1] : 0;
    if (bonus) addScore(bonus);
    message = { text: "TUTTE LE BOMBE!", sub: `Micce accese prese: ${litCount}${bonus ? ` · bonus ${bonus.toLocaleString("it-IT")}` : " (servono almeno 20 per il bonus)"}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, rd = round + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Round ${rd} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CAPITAN MICCIA</h1>
       <p>Il supereroe col mantello salta altissimo e plana come una piuma! In ogni schermo ci sono 24 bombe: raccoglile tutte prima che i nemici ti prendano. Una delle bombe ha la miccia accesa: prendendo sempre quella giusta segui l'ordine e alla fine arriva un bonus enorme. Afferra la sfera P per trasformare i nemici in monete.</p>
       <div class="pts">
         <span><b>Bomba</b></span><span>100 · con la miccia accesa 200</span>
         <span><b>Micce accese in fila</b></span><span>20 → 10.000 · 23 → 50.000</span>
         <span><b>Sfera P</b></span><span>nemici in monete: 100, 200, 300…</span>
         <span><b>Sfera E</b></span><span>vita extra</span>
       </div>
       ${touchMode
         ? `<p class="muted help">◀ ▶ per muoverti · SALTA (tieni premuto per saltare più in alto) · in aria tocca di nuovo SALTA per planare</p>`
         : `<p class="muted help">← → per muoverti · SPAZIO, ↑ o Z per saltare (tieni premuto per saltare più in alto) · in aria premi di nuovo e tieni per planare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "jump", arrowup: "jump", w: "jump", z: "jump" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    ctl[a] = true;
    if (a === "jump" && !e.repeat) jumpPressed = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      if (a === "jump") jumpPressed = true;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });

  // ---------- Enemies ----------

  function update(dt) {

    requestAnimationFrame(loop);
  }
  syncControls();
  buildRound(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

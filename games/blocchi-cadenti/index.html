<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Blocchi Cadenti</title>
<style>
  :root {
    --bg: #0a0b1e;
    --fg: #f3f0ff;
    --muted: #a7a3c9;
    --accent: #3de0ff;
    --gold: #ffd34d;
    --bad: #ff5a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap.top { align-items: flex-start; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  #wrap.top.low { padding-top: calc(52px + env(safe-area-inset-top, 0px)); }
  canvas { display: block; touch-action: none; }
  .corner {
    position: fixed; z-index: 3; display: none;
    top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(10, 11, 30, 0.7); border: 1px solid rgba(243, 240, 255, 0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; min-width: 38px;
  }
  #pauseBtn { right: 10px; }
  #musicBtn { right: 58px; }
  #musicBtn.off { opacity: 0.45; text-decoration: line-through; }
  #touch {
    position: fixed; z-index: 2; display: none;
    left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: grid; gap: 7px; pointer-events: auto; }
  #touch .left { grid-template-columns: repeat(3, var(--b)); grid-template-rows: var(--b) var(--b); }
  #touch .right { grid-template-columns: repeat(2, var(--b)); grid-template-rows: var(--b) var(--b); }
  #touch { --b: 60px; }
  #touch.small { --b: 50px; }
  #touch button {
    border-radius: 14px; border: 2px solid rgba(61, 224, 255, 0.55); background: rgba(61, 224, 255, 0.14);
    color: var(--fg); font: 700 24px system-ui, sans-serif; touch-action: none;
  }
  #touch button.on { background: rgba(255, 211, 77, 0.45); border-color: var(--gold); }
  #touch [data-b="drop"] { grid-column: 2; grid-row: 1; }
  #touch [data-b="left"] { grid-column: 1; grid-row: 2; }
  #touch [data-b="down"] { grid-column: 2; grid-row: 2; }
  #touch [data-b="right"] { grid-column: 3; grid-row: 2; }
  #touch [data-b="hold"] { font-size: 12px; letter-spacing: 0.5px; }
  #touch [data-b="cw"] { grid-column: 1 / span 2; font-size: 30px; border-color: rgba(185, 140, 255, 0.7); background: rgba(185, 140, 255, 0.18); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 11, 30, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 {
    font-size: clamp(36px, 9vw, 64px); letter-spacing: 2px; line-height: 1.05;
    background: linear-gradient(90deg, #3de0ff, #b98cff 35%, #ff5a6a 60%, #ffd34d 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #1c1440);
  }
  #overlay h2 { font-size: clamp(28px, 7vw, 46px); }
  #overlay h2.lose { color: var(--bad); }
  #overlay h2.win { color: var(--gold); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .minos { display: flex; gap: 10px; justify-content: center; }
  #overlay .minos i { width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25); }
  #overlay .stats { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; font-size: 14px; color: var(--muted); }
  #overlay .stats b { display: block; color: var(--fg); font-size: 20px; font-variant-numeric: tabular-nums; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(243,240,255,0.3); border-radius: 8px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { background: var(--accent); border-color: var(--accent); color: #06202a; padding: 10px 28px; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 34px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl left">
    <button type="button" data-b="drop" aria-label="Caduta istantanea">⤓</button>
    <button type="button" data-b="left" aria-label="Sinistra">◀</button>
    <button type="button" data-b="down" aria-label="Giù">▼</button>
    <button type="button" data-b="right" aria-label="Destra">▶</button>
  </div>
  <div class="cl right">
    <button type="button" data-b="hold">SCORTA</button>
    <button type="button" data-b="ccw" aria-label="Ruota a sinistra">⟲</button>
    <button type="button" data-b="cw" aria-label="Ruota a destra">⟳</button>
  </div>
</div>
<button id="musicBtn" class="corner" type="button" aria-label="Musica">♪</button>
<button id="pauseBtn" class="corner" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  // ---------- Geometry ----------
  const COLS = 10, ROWS = 20, HID = 2, TOT = ROWS + HID, CELL = 28, PAD = 12, PANEL = 104;
  const BW = COLS * CELL, BH = ROWS * CELL, TOP_BOX = 70, TOP_STATS = 26;
  // Two layouts: "wide" puts the panels beside the board; "tall" (phones held upright) puts them above it.
  let tall = false, BX = 0, BY = 0, RX = 0, W = 0, H = 0;
  function setLayout(t) {
    tall = t;
    if (tall) { BX = PAD; BY = PAD + TOP_BOX + 6 + TOP_STATS + 8; W = PAD + BW + PAD; RX = 0; }
    else { BX = PAD + PANEL + PAD; BY = PAD; RX = BX + BW + PAD; W = RX + PANEL + PAD; }
    H = BY + BH + PAD;
  }
  setLayout(false);

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "Caduta più lenta · 5 pezzi in anteprima · più tempo per appoggiare", start: 1, grav: 1.4, lock: 0.8, previews: 5, garbage: false },
    normale:   { label: "NORMALE",   color: "#3de0ff", desc: "La classica: 3 pezzi in anteprima, si accelera ogni 10 righe", start: 1, grav: 1, lock: 0.5, previews: 3, garbage: false },
    difficile: { label: "DIFFICILE", color: "#ff5a6a", desc: "Parti dal livello 5 · file di detriti salgono dal fondo", start: 5, grav: 1, lock: 0.42, previews: 2, garbage: true },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "blocchi-difficulty", MUSIC_KEY = "blocchi-music";
  const bestKey = (id) => `blocchi-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

  // ---------- Pieces (SRS) ----------
  const PIECES = {
    I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], color: "#3de0ff" },
    J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]], color: "#4a7aff" },
    L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]], color: "#ff9a3d" },
    O: { n: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], color: "#ffd34d" },
    S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], color: "#7dff9a" },
    T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]], color: "#b98cff" },
    Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]], color: "#ff5a6a" },
  };
  const TYPES = Object.keys(PIECES);
  const COLORS = { G: "#6b6f8a" };
  for (const t of TYPES) COLORS[t] = PIECES[t].color;
  // SHAPES[type][rotation] = cells; clockwise rotation inside the n×n box gives the SRS states.
  const SHAPES = {};
  for (const t of TYPES) {
    const { n, cells } = PIECES[t];
    const rots = [cells];
    for (let r = 1; r < 4; r++) rots.push(t === "O" ? cells : rots[r - 1].map(([x, y]) => [n - 1 - y, x]));
    SHAPES[t] = rots;
  }
  // Wall kicks (x right, y up) from the SRS guideline.
  const KICKS = {
    "0>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]], "1>0": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    "1>2": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]], "2>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    "2>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]], "3>2": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    "3>0": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]], "0>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  };
  const KICKS_I = {
    "0>1": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]], "1>0": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    "1>2": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]], "2>1": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    "2>3": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]], "3>2": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    "3>0": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]], "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  };
  const CLEAR_NAMES = ["", "SINGOLA", "DOPPIA", "TRIPLA", "QUADRUPLA!"];
  const DAS = 0.16, ARR = 0.033, SOFT = 0.03, CLEAR_T = 0.38, ARE = 0.08, MAX_RESETS = 15;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  const musicBtn = document.getElementById("musicBtn");
  let pxRatio = 1, scale = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.classList.toggle("top", showTouch && portrait);
    setLayout(window.innerHeight > window.innerWidth * 1.25);
    wrap.classList.toggle("low", tall && showTouch);
    let availW = window.innerWidth - 16, availH = window.innerHeight - 16 - (tall && showTouch ? 44 : 0);
    if (showTouch) {
      const l = touchEl.querySelector(".left").getBoundingClientRect();
      const r = touchEl.querySelector(".right").getBoundingClientRect();
      if (portrait) availH -= Math.max(l.height, r.height) + 24;
      else availW = window.innerWidth - 2 * (Math.max(l.width, r.width) + 24);
    }
    scale = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, scale * (window.devicePixelRatio || 1));
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function tone(freq, t, dur, type = "square", vol = 0.04, slide = 0) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const beep = (f, d, type, vol, slide) => audioCtx && tone(f, audioCtx.currentTime, d, type, vol, slide);
  const arp = (notes, gap, d, type, vol) => { if (audioCtx) notes.forEach((f, i) => tone(f, audioCtx.currentTime + i * gap, d, type, vol)); };
  const sfx = {
    move: () => beep(240, 0.025, "square", 0.015),
    rotate: () => beep(420, 0.05, "triangle", 0.04, 180),
    hold: () => beep(330, 0.08, "triangle", 0.05, 330),
    lock: () => beep(170, 0.06, "triangle", 0.05),
    drop: () => beep(150, 0.14, "square", 0.05, -90),
    clear: (n) => arp([523, 659, 784, 1047].slice(0, n + 1), 0.05, 0.12, "square", 0.045),
    quad: () => arp([523, 659, 784, 1047, 1319, 1568], 0.06, 0.16, "square", 0.05),
    tspin: () => arp([392, 587, 784, 1175], 0.05, 0.14, "sawtooth", 0.035),
    level: () => arp([659, 784, 988, 1319], 0.08, 0.14, "triangle", 0.06),
    garbage: () => beep(90, 0.22, "sawtooth", 0.05, -30),
    warn: () => beep(880, 0.06, "square", 0.025),
    perfect: () => arp([784, 988, 1175, 1568, 1976, 2349], 0.07, 0.18, "triangle", 0.06),
    over: () => arp([523, 466, 415, 349, 311, 262], 0.12, 0.2, "square", 0.045),
    start: () => arp([392, 523, 659, 784], 0.09, 0.14, "square", 0.04),
  };

  // Background tune: the Russian folk song "Korobeiniki" (public domain), in eighth notes.
  const MELODY = [
    ["E5", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["C5", 1], ["B4", 1],
    ["A4", 2], ["A4", 1], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
    ["B4", 3], ["C5", 1], ["D5", 2], ["E5", 2],
    ["C5", 2], ["A4", 2], ["A4", 4],
    [null, 1], ["D5", 2], ["F5", 1], ["A5", 2], ["G5", 1], ["F5", 1],
    ["E5", 3], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
    ["B4", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["E5", 2],
    ["C5", 2], ["A4", 2], ["A4", 2], [null, 2],
  ];
  const BASS = ["E2", "A2", "E2", "A2", "D2", "C2", "E2", "A2"];
  function noteFreq(n) {
    const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + (n[1] === "#" ? 1 : 0);
    const oct = +n[n.length - 1];
    return 440 * Math.pow(2, (12 * (oct + 1) + semi - 69) / 12);
  }
  const TUNE = new Array(64).fill(null);
  { let pos = 0; for (const [n, len] of MELODY) { if (n) TUNE[pos] = { f: noteFreq(n), len }; pos += len; } }
  let musicOn = load(MUSIC_KEY) !== "off", musicPos = 0, nextNoteT = 0;
  const eighth = () => Math.max(0.12, 0.2 - (level - 1) * 0.005);
  function musicTick() {
    if (!audioCtx || !musicOn || state !== "playing") return;
    const now = audioCtx.currentTime;
    if (nextNoteT < now) nextNoteT = now + 0.05;
    while (nextNoteT < now + 0.15) {
      const e = eighth(), m = TUNE[musicPos];
      if (m) tone(m.f, nextNoteT, m.len * e * 0.9, "square", 0.022);
      const root = noteFreq(BASS[musicPos >> 3]);
      tone(musicPos % 2 ? root * 2 : root, nextNoteT, e * 0.8, "triangle", 0.045);
      nextNoteT += e;
      musicPos = (musicPos + 1) % 64;
    }
  }
  function setMusic(on) {
    musicOn = on; store(MUSIC_KEY, on ? "on" : "off");
    musicBtn.classList.toggle("off", !on);
  }
  musicBtn.classList.toggle("off", !musicOn);
  musicBtn.addEventListener("click", () => setMusic(!musicOn));

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null;
  let board = [], queue = [], cur = null, hold = null, holdUsed = false;
  let score = 0, lines = 0, level = 1, combo = -1, b2b = false;
  let bestCache = 0;
  let fallAcc = 0, lockT = 0, lockResets = 0, lowestY = 0, lastRot = false, lastKick = 0;
  let clearing = null, areT = 0, dieT = 0, playTime = 0, clock = 0;
  let garbageT = 0, garbageWarned = false;
  let stats = { quads: 0, tspins: 0, maxCombo: 0, pieces: 0 };
  let particles = [], popups = [], trails = [], flashes = [], shake = 0, levelGlow = 0;
  const pending = { rot: 0, hold: false };

  const emptyRow = () => new Array(COLS).fill(0);
  const gravityInterval = () => {
    const l = Math.min(level, 20);
    return Math.pow(0.8 - (l - 1) * 0.007, l - 1) * diff.grav;
  };
  const garbageInterval = () => Math.max(8, 24 - (level - 5) * 1.5);

  function collides(p, dx = 0, dy = 0, r = p.r) {
    for (const [cx, cy] of SHAPES[p.type][r]) {
      const x = p.x + dx + cx, y = p.y + dy + cy;
      if (x < 0 || x >= COLS || y >= TOT) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }
  function refillQueue() {
    while (queue.length < 8) {
      const bag = TYPES.slice();
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      queue.push(...bag);
    }
  }
  function nextType() { refillQueue(); const t = queue.shift(); refillQueue(); return t; }

  function spawn(type) {
    cur = { type, r: 0, x: type === "O" ? 4 : 3, y: 0 };
    lastRot = false; lastKick = 0; lockT = 0; lockResets = 0; fallAcc = 0;
    if (collides(cur)) { cur = null; topOut(); return; }
    if (!collides(cur, 0, 1)) cur.y++;
    lowestY = cur.y;
    stats.pieces++;
    if (pending.hold) { pending.hold = false; doHold(); }
    if (pending.rot && cur) { tryRotate(pending.rot); }
    pending.rot = 0;
  }
  function spawnNext() { spawn(nextType()); }

  const grounded = () => cur && collides(cur, 0, 1);
  function onShifted() {
    if (grounded() && lockResets < MAX_RESETS) { lockT = 0; lockResets++; }
  }
  function move(dx) {
    if (!cur || collides(cur, dx, 0)) return false;
    cur.x += dx; lastRot = false; onShifted(); sfx.move();
    return true;
  }
  function tryRotate(dir) {
    if (!cur) { pending.rot = dir; return false; }
    if (cur.type === "O") return false;
    const from = cur.r, to = (cur.r + dir + 4) % 4;
    const kicks = (cur.type === "I" ? KICKS_I : KICKS)[`${from}>${to}`];
    for (let i = 0; i < kicks.length; i++) {
      const [kx, ky] = kicks[i];
      if (!collides(cur, kx, -ky, to)) {
        cur.x += kx; cur.y -= ky; cur.r = to;
        lastRot = true; lastKick = i;
        if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; }
        onShifted(); sfx.rotate();
        return true;
      }
    }
    return false;
  }
  function doHold() {
    if (!cur) { pending.hold = true; return; }
    if (holdUsed) return;
    const t = cur.type;
    cur = null;
    const next = hold || nextType();
    hold = t;
    holdUsed = true;
    sfx.hold();
    spawn(next);
    stats.pieces--;
  }
  function hardDrop() {
    if (!cur) return;
    const y0 = cur.y;
    while (!collides(cur, 0, 1)) cur.y++;
    const n = cur.y - y0;
    if (n) {
      lastRot = false;
      score += 2 * n;
      const xs = SHAPES[cur.type][cur.r].map(([cx]) => cur.x + cx);
      trails.push({ x0: Math.min(...xs), x1: Math.max(...xs) + 1, y0: y0 + minCellY(cur), y1: cur.y + minCellY(cur), color: COLORS[cur.type], t: 0 });
      shake = Math.min(6, 2 + n * 0.25);
    }
    sfx.drop();
    lockPiece();
  }
  const minCellY = (p) => Math.min(...SHAPES[p.type][p.r].map(([, cy]) => cy));

  function tSpinKind() {
    if (cur.type !== "T" || !lastRot) return null;
    const occ = ([cx, cy]) => {
      const x = cur.x + cx, y = cur.y + cy;
      return x < 0 || x >= COLS || y >= TOT || (y >= 0 && !!board[y][x]);
    };
    const corners = [[0, 0], [2, 0], [2, 2], [0, 2]].map(occ);
    if (corners.filter(Boolean).length < 3) return null;
    const front = [[0, 1], [1, 2], [2, 3], [3, 0]][cur.r];
    return (corners[front[0]] && corners[front[1]]) || lastKick === 4 ? "full" : "mini";
  }

  function lockPiece() {
    const tspin = tSpinKind();
    let above = true;
    const cells = [];
    for (const [cx, cy] of SHAPES[cur.type][cur.r]) {
      const x = cur.x + cx, y = cur.y + cy;
      if (y >= 0) board[y][x] = cur.type;
      if (y >= HID) above = false;
      cells.push([x, y]);
    }
    flashes.push({ cells, t: 0 });
    cur = null; holdUsed = false;
    if (above) { topOut(); return; }
    sfx.lock();
    const full = [];
    for (let y = 0; y < TOT; y++) if (board[y].every(Boolean)) full.push(y);
    scoreLock(full.length, tspin);
    if (full.length) {
      clearing = { rows: full, t: 0 };
      for (const y of full) for (let x = 0; x < COLS; x++) burst(x, y, COLORS[board[y][x]], 3);
    } else {
      areT = ARE;
    }
  }

  function scoreLock(n, tspin) {
    let base = 0, label = "", big = false, color = "#fff";
    if (tspin === "full") {
      base = [400, 800, 1200, 1600][n]; label = "T-SPIN" + (n ? " " + CLEAR_NAMES[n].replace("!", "") : "");
      big = n > 0; color = COLORS.T; stats.tspins++; sfx.tspin();
    } else if (tspin === "mini") {
      base = [100, 200, 400][n] || 400; label = "T-SPIN MINI" + (n ? " " + CLEAR_NAMES[n] : "");
      big = n > 0; color = COLORS.T; sfx.tspin();
    } else if (n) {
      base = [0, 100, 300, 500, 800][n]; label = CLEAR_NAMES[n]; big = n === 4;
      color = n === 4 ? "#3de0ff" : "#fff";
      if (n === 4) { stats.quads++; sfx.quad(); } else sfx.clear(n);
    }
    let sub = "";
    if (n) {
      if (big && b2b) { base = Math.floor(base * 1.5); sub = "DI FILA ×1,5"; }
      b2b = big;
      combo++;
      if (combo > 0) { score += 50 * combo * level; sub = (sub ? sub + " · " : "") + `COMBO ×${combo}`; stats.maxCombo = Math.max(stats.maxCombo, combo); }
    } else combo = -1;
    score += base * level;
    if (label) popup(label, sub, color, big);
    if (n) {
      lines += n;
      const nl = Math.min(20, diff.start + Math.floor(lines / 10));
      if (nl > level) { level = nl; levelGlow = 1; sfx.level(); popup(`LIVELLO ${level}`, "si accelera!", "#ffd34d", false); }
    }
  }

  function finishClear() {
    const rows = clearing.rows;
    for (let i = rows.length - 1; i >= 0; i--) board.splice(rows[i], 1);
    for (let i = 0; i < rows.length; i++) board.unshift(emptyRow());
    clearing = null;
    if (board.every((row) => row.every((c) => !c))) {
      score += 2000 * level;
      popup("TUTTO PULITO!", `+${2000 * level}`, "#7dff9a", true);
      sfx.perfect();
    }
    areT = ARE;
  }

  function addGarbage() {
    if (board[0].some(Boolean) || board[1].some(Boolean)) { cur = null; topOut(); return; }
    board.shift();
    const row = new Array(COLS).fill("G");
    row[Math.floor(Math.random() * COLS)] = 0;
    board.push(row);
    if (cur) {
      if (collides(cur)) { cur.y--; if (collides(cur)) { cur = null; topOut(); return; } }
      lowestY = Math.min(lowestY, cur.y);
    }
    shake = 4;
    sfx.garbage();
  }

  // ---------- Effects ----------
  function burst(cx, cy, color, n) {
    const px = BX + (cx + 0.5) * CELL, py = BY + (cy - HID + 0.5) * CELL;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.5 + Math.random() * 0.5, t: 0, color });
    }
  }
  function popup(text, sub, color, big) { popups.push({ text, sub, color, big, t: 0 }); }
  function updateEffects(dt) {
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; }
    particles = particles.filter((p) => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1.4);
    for (const t of trails) t.t += dt;
    trails = trails.filter((t) => t.t < 0.25);
    for (const f of flashes) f.t += dt;
    flashes = flashes.filter((f) => f.t < 0.15);
    shake = Math.max(0, shake - dt * 30);
    levelGlow = Math.max(0, levelGlow - dt * 0.8);
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "playing" || state === "dying";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    board = Array.from({ length: TOT }, emptyRow);
    queue = []; hold = null; holdUsed = false; cur = null;
    score = 0; lines = 0; level = diff.start; combo = -1; b2b = false;
    clearing = null; areT = 0.5; playTime = 0; dieT = 0;
    garbageT = garbageInterval(); garbageWarned = false;
    stats = { quads: 0, tspins: 0, maxCombo: 0, pieces: 0 };
    particles = []; popups = []; trails = []; flashes = [];
    pending.rot = 0; pending.hold = false;
    refillQueue();
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    musicPos = 0; nextNoteT = 0;
    state = "playing";
    menu = null;
    overlay.classList.add("hidden");
    sfx.start();
    syncControls();
    last = performance.now();
  }
  function topOut() {
    if (state !== "playing") return;
    state = "dying"; dieT = 0; clearing = null;
    sfx.over();
  }
  function togglePause() {
    if (state === "playing") {
      pausedFrom = state; state = "paused";
      releaseAll();
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare · M musica</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now(); nextNoteT = 0;
    }
    syncControls();
  }
  function syncControls() {
    const show = touchMode && state === "playing";
    pauseBtn.style.display = show ? "block" : "none";
    musicBtn.style.display = show ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());

  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const s = { score, lines, level, ...stats, played: diff.label, time: playTime };
    const mm = Math.floor(s.time / 60), ss = String(Math.floor(s.time % 60)).padStart(2, "0");
    menu = () => showOverlay(
      `<h2 class="lose">FINE PARTITA</h2>
       <p>Punteggio: <b>${s.score.toLocaleString("it-IT")}</b> · ${s.played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       <div class="stats">
         <span><b>${s.lines}</b>righe</span><span><b>${s.level}</b>livello</span><span><b>${mm}:${ss}</b>tempo</span>
         <span><b>${s.quads}</b>quadruple</span><span><b>${s.tspins}</b>T-spin</span><span><b>${s.maxCombo}</b>combo max</span>
       </div>
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) {
    if (!DIFFICULTIES[id]) return;
    difficulty = id; diff = DIFFICULTIES[id];
    store(DIFF_KEY, id);
    if (menu) menu();
  }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>BLOCCHI CADENTI</h1>
       <div class="minos">${TYPES.map((t) => `<i style="background:${COLORS[t]}"></i>`).join("")}</div>
       <p>Incastra i blocchi che cadono e completa le righe per farle sparire. Più righe fai sparire insieme, più punti guadagni: quattro in un colpo sono una <b>QUADRUPLA</b>! Ogni 10 righe sali di livello e i blocchi cadono più veloci.</p>
       ${touchMode
         ? `<p class="muted help">Usa i pulsanti in basso, oppure trascina sul campo per muovere, tocca per ruotare e scorri veloce in giù per far cadere. SCORTA mette da parte un pezzo per dopo.</p>`
         : `<p class="muted help">← → muovi · ↓ scendi · SPAZIO caduta istantanea · ↑ o X ruota · Z ruota al contrario · C tieni in scorta · P pausa · M musica</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const held = { left: false, right: false, down: false };
  let dasDir = 0, dasT = 0, arrAcc = 0;
  function press(b) {
    if (state !== "playing") return;
    if (b === "left" || b === "right") {
      held[b] = true;
      dasDir = b === "left" ? -1 : 1; dasT = 0; arrAcc = 0;
      move(dasDir);
    } else if (b === "down") { held.down = true; fallAcc = Math.min(fallAcc, SOFT); }
    else if (b === "drop") hardDrop();
    else if (b === "cw") tryRotate(1);
    else if (b === "ccw") tryRotate(-1);
    else if (b === "hold") doHold();
  }
  function release(b) {
    if (b === "left" || b === "right") {
      held[b] = false;
      const other = b === "left" ? "right" : "left";
      if (dasDir === (b === "left" ? -1 : 1)) {
        if (held[other]) { dasDir = other === "left" ? -1 : 1; dasT = 0; arrAcc = 0; } else dasDir = 0;
      }
    } else if (b === "down") held.down = false;
  }
  function releaseAll() { held.left = held.right = held.down = false; dasDir = 0; for (const b of touchEl.querySelectorAll("button")) b.classList.remove("on"); }
  const KEYMAP = {
    arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowdown: "down", s: "down",
    " ": "drop", arrowup: "cw", x: "cw", w: "cw", z: "ccw", control: "ccw", c: "hold", shift: "hold",
  };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (k === "m") { setMusic(!musicOn); return; }
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (k === "arrowleft") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 2) % 3]);
      else if (k === "arrowright") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 1) % 3]);
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused" && e.key === "Enter") { togglePause(); return; }
    const b = KEYMAP[k];
    if (b && !e.repeat) press(b);
  });
  window.addEventListener("keyup", (e) => { const b = KEYMAP[e.key.toLowerCase()]; if (b) release(b); });
  window.addEventListener("blur", () => { if (state === "playing") togglePause(); });

  for (const btn of touchEl.querySelectorAll("button")) {
    const b = btn.dataset.b;
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.classList.add("on"); press(b); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) btn.addEventListener(ev, () => { if (btn.classList.contains("on")) { btn.classList.remove("on"); release(b); } });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); } }, true);

  // Gestures on the playfield: drag sideways to move, drag down to soft drop, flick down to hard drop, tap to rotate.
  let gesture = null;
  canvas.addEventListener("pointerdown", (e) => {
    if (state !== "playing") return;
    gesture = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false, dropped: false };

  });
  canvas.addEventListener("pointermove", (e) => {
    if (!gesture || e.pointerId !== gesture.id || state !== "playing") return;
    const step = CELL * scale * 0.9;
    while (e.clientX - gesture.x > step) { move(1); gesture.x += step; gesture.moved = true; }
    while (gesture.x - e.clientX > step) { move(-1); gesture.x -= step; gesture.moved = true; }
    const dy = e.clientY - gesture.sy, dt = performance.now() - gesture.t;
    if (!gesture.dropped && dy > 70 && dy / Math.max(1, dt) > 1.1 && Math.abs(e.clientX - gesture.sx) < dy * 0.6) {
      gesture.dropped = true; gesture.moved = true; hardDrop(); return;
    }
    while (!gesture.dropped && e.clientY - gesture.y > step * 1.1) {
      gesture.y += step * 1.1; gesture.moved = true;
      if (cur && !collides(cur, 0, 1)) { cur.y++; score += 1; lastRot = false; if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; lockT = 0; } }
    }
  });
  canvas.addEventListener("pointerup", (e) => {
    if (!gesture || e.pointerId !== gesture.id) return;

    gesture = null;
  });
  canvas.addEventListener("pointercancel", () => { gesture = null; });

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    updateEffects(dt);
    if (state === "dying") {
      dieT += dt;
      if (dieT > 1.5) gameOver();
      return;
    }
    if (state !== "playing") return;
    playTime += dt;

    if (dasDir) {
      dasT += dt;
      if (dasT >= DAS && cur) {
        arrAcc += dt;
        while (arrAcc >= ARR) { arrAcc -= ARR; if (!move(dasDir)) { arrAcc = 0; break; } }
      }
    }

    if (diff.garbage && cur) {
      garbageT -= dt;
      if (garbageT < 3 && !garbageWarned) { garbageWarned = true; sfx.warn(); }
      if (garbageT <= 0) { addGarbage(); garbageT = garbageInterval(); garbageWarned = false; if (state !== "playing") return; }
    }

    if (clearing) {
      clearing.t += dt;
      if (clearing.t >= CLEAR_T) finishClear();
      return;
    }
    if (!cur) {
      areT -= dt;
      if (areT <= 0) spawnNext();
      return;
    }

    const g = gravityInterval();
    const interval = held.down ? Math.min(g, SOFT) : g;
    fallAcc += dt;
    while (fallAcc >= interval) {
      fallAcc -= interval;
      if (!collides(cur, 0, 1)) {
        cur.y++; lastRot = false;
        if (held.down) score += 1;
        if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; lockT = 0; }
      } else { fallAcc = 0; break; }
    }
    if (grounded()) {
      lockT += dt;
      if (lockT >= diff.lock) lockPiece();
    }
  }

  // ---------- Drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function drawBlock(x, y, s, color, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
    const e = Math.max(2, s * 0.15);
    ctx.fillStyle = "rgba(255,255,255,0.38)";
    ctx.fillRect(x + 1, y + 1, s - 2, e);
    ctx.fillRect(x + 1, y + 1, e, s - 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(x + 1, y + s - 1 - e, s - 2, e);
    ctx.fillRect(x + s - 1 - e, y + 1, e, s - 2);
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.fillRect(x + s * 0.32, y + s * 0.32, s * 0.36, s * 0.36);
    ctx.globalAlpha = 1;
  }
  function drawMini(type, cx, cy, s, alpha = 1) {
    const cells = SHAPES[type][0];
    const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
    const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;
    const ox = cx - (w * s) / 2 - Math.min(...xs) * s, oy = cy - (h * s) / 2 - Math.min(...ys) * s;
    for (const [x, y] of cells) drawBlock(ox + x * s, oy + y * s, s, COLORS[type], alpha);
  }
  function panel(x, y, w, h, label) {
    rr(x, y, w, h, 10);
    ctx.fillStyle = "rgba(20, 20, 50, 0.75)"; ctx.fill();
    ctx.strokeStyle = "rgba(167, 163, 201, 0.25)"; ctx.lineWidth = 1.5; ctx.stroke();
    if (label) {
      ctx.fillStyle = "#a7a3c9"; ctx.font = "700 11px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(label, x + w / 2, y + 18);
    }
  }
  function stat(label, value, y, color = "#f3f0ff") {
    ctx.textAlign = "left";
    ctx.fillStyle = "#a7a3c9"; ctx.font = "700 11px system-ui, sans-serif";
    ctx.fillText(label, PAD + 8, y);
    ctx.fillStyle = color; ctx.font = "800 20px system-ui, sans-serif";
    ctx.fillText(value, PAD + 8, y + 22);
  }

  function drawTopStrip(hue, pulse) {
    const hw = TOP_BOX;
    panel(PAD, PAD, hw, TOP_BOX, "SCORTA");
    if (hold) drawMini(hold, PAD + hw / 2, PAD + 44, 14, holdUsed ? 0.35 : 1);
    const nx = PAD + hw + 8, nw = W - PAD - nx;
    panel(nx, PAD, nw, TOP_BOX, "");
    ctx.fillStyle = "#a7a3c9"; ctx.font = "700 11px system-ui, sans-serif"; ctx.textAlign = "left";
    ctx.fillText("PROSSIMI", nx + 10, PAD + 18);
    if (queue.length) {
      drawMini(queue[0], nx + 36, PAD + 46, 14);
      const step = Math.min(38, (nw - 80) / Math.max(1, diff.previews - 1));
      for (let i = 1; i < diff.previews; i++) drawMini(queue[i], nx + 60 + step * (i - 0.5), PAD + 46, 10, 0.9);
    }
    const sy = PAD + TOP_BOX + 6 + 18;
    ctx.textAlign = "left"; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#a7a3c9";
    ctx.fillText("PUNTI", PAD + 2, sy);
    ctx.font = "800 18px system-ui, sans-serif"; ctx.fillStyle = "#f3f0ff";
    ctx.fillText(score.toLocaleString("it-IT"), PAD + 42, sy + 1);
    ctx.textAlign = "right"; ctx.font = "800 14px system-ui, sans-serif";
    const right = `LIV ${level} · RIGHE ${lines}`;
    ctx.fillText(right, W - PAD - 2, sy);
    if (diff.garbage && (state === "playing" || state === "paused")) {
      const f = Math.max(0, Math.min(1, 1 - garbageT / garbageInterval()));
      rr(PAD, sy + 7, W - 2 * PAD, 4, 2); ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fill();
      rr(PAD, sy + 7, Math.max(4, (W - 2 * PAD) * f), 4, 2);
      ctx.fillStyle = garbageT < 3 ? `rgba(255,90,106,${0.6 + 0.4 * pulse})` : "#8b8fb0"; ctx.fill();
    }
  }

  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const hue = (230 + (level - 1) * 23) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${hue}, 45%, 12%)`);
    g.addColorStop(1, "#0a0b1e");

    ctx.fillRect(0, 0, W, H);
    // drifting background squares
    for (let i = 0; i < 14; i++) {
      const s = 10 + ((i * 37) % 26), x = (i * 97 + clock * (6 + (i % 4) * 3)) % (W + 40) - 20;
      const y = (i * 53 + Math.sin(clock * 0.3 + i) * 20 + H) % H;
      ctx.fillStyle = `hsla(${(hue + i * 40) % 360}, 70%, 60%, 0.05)`;

    // Board frame
    const danger = state === "playing" && board.length && board.slice(HID, HID + 5).some((r) => r.some(Boolean));
    const pulse = 0.5 + 0.5 * Math.sin(clock * 8);
    rr(BX - 5, BY - 5, BW + 10, BH + 10, 8);
    ctx.fillStyle = "#07081a"; ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = danger ? `rgba(255, 90, 106, ${0.5 + 0.5 * pulse})` : `hsla(${hue}, 80%, 65%, ${0.55 + levelGlow * 0.45})`;
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12 + levelGlow * 20;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.045)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(BX + x * CELL + 0.5, BY); ctx.lineTo(BX + x * CELL + 0.5, BY + BH); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(BX, BY + y * CELL + 0.5); ctx.lineTo(BX + BW, BY + y * CELL + 0.5); }
    ctx.stroke();

    ctx.save();
    ctx.beginPath(); ctx.rect(BX, BY, BW, BH); ctx.clip();
    if (board.length) {
      const deadRows = state === "dying" ? Math.floor(dieT / 1.2 * ROWS) : state === "over" ? ROWS : 0;
      for (let y = HID; y < TOT; y++) {
        const clearP = clearing && clearing.rows.includes(y) ? clearing.t / CLEAR_T : -1;
        const dead = TOT - y <= deadRows;
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (!c) continue;
          const px = BX + x * CELL, py = BY + (y - HID) * CELL;
          if (clearP >= 0) {
            const shrink = Math.max(0, (clearP - 0.35) / 0.65);
            const s = CELL * (1 - shrink);
            if (s > 1) drawBlock(px + (CELL - s) / 2, py + (CELL - s) / 2, s, clearP < 0.35 ? "#ffffff" : COLORS[c]);
          } else drawBlock(px, py, CELL, dead ? "#3a3c52" : COLORS[c]);
        }
      }
      for (const f of flashes) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - f.t / 0.15)})`;
        for (const [x, y] of f.cells) if (y >= HID) ctx.fillRect(BX + x * CELL + 1, BY + (y - HID) * CELL + 1, CELL - 2, CELL - 2);
      }
      for (const t of trails) {
        const a = 0.35 * (1 - t.t / 0.25);
        const tg = ctx.createLinearGradient(0, BY + (t.y0 - HID) * CELL, 0, BY + (t.y1 - HID) * CELL);
        tg.addColorStop(0, "rgba(255,255,255,0)");
        tg.addColorStop(1, t.color);
        ctx.globalAlpha = a; ctx.fillStyle = tg;
        ctx.fillRect(BX + t.x0 * CELL + 2, BY + (t.y0 - HID) * CELL, (t.x1 - t.x0) * CELL - 4, (t.y1 - t.y0) * CELL);
        ctx.globalAlpha = 1;
      }
      if (cur && state === "playing") {
        let gy = 0;
        while (!collides(cur, 0, gy + 1)) gy++;
        const color = COLORS[cur.type];
        for (const [cx, cy] of SHAPES[cur.type][cur.r]) {
          const px = BX + (cur.x + cx) * CELL, py = BY + (cur.y + gy + cy - HID) * CELL;
          ctx.globalAlpha = 0.14; ctx.fillStyle = color; ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          ctx.globalAlpha = 0.6; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.strokeRect(px + 2.5, py + 2.5, CELL - 5, CELL - 5);
          ctx.globalAlpha = 1;
        }
        const lockFade = grounded() ? 1 - 0.35 * Math.min(1, lockT / diff.lock) : 1;
        for (const [cx, cy] of SHAPES[cur.type][cur.r]) drawBlock(BX + (cur.x + cx) * CELL, BY + (cur.y + cy - HID) * CELL, CELL, color, lockFade);
      }
    }
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (tall) drawTopStrip(hue, pulse); else {
      // Left panel: hold + stats
      panel(PAD, BY, PANEL, 92, "SCORTA");
      if (hold) drawMini(hold, PAD + PANEL / 2, BY + 56, 20, holdUsed ? 0.35 : 1);
      const best = Math.max(score, bestCache);
      stat("PUNTI", score.toLocaleString("it-IT"), 132);
      stat("RECORD", best.toLocaleString("it-IT"), 184, "#ffd34d");
      stat("LIVELLO", String(level), 236);
      stat("RIGHE", String(lines), 288);
      const into = lines % 10;
      rr(PAD + 8, 318, PANEL - 16, 6, 3); ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fill();
      if (into) { rr(PAD + 8, 318, (PANEL - 16) * into / 10, 6, 3); ctx.fillStyle = `hsl(${hue}, 80%, 65%)`; ctx.fill(); }
      if (diff.garbage && (state === "playing" || state === "paused")) {
        const f = Math.max(0, Math.min(1, 1 - garbageT / garbageInterval()));
        ctx.textAlign = "left"; ctx.font = "700 11px system-ui, sans-serif";
        ctx.fillStyle = garbageT < 3 ? `rgba(255,90,106,${0.6 + 0.4 * pulse})` : "#a7a3c9";
        ctx.fillText("DETRITI", PAD + 8, 352);
        rr(PAD + 8, 360, PANEL - 16, 8, 4); ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fill();
        rr(PAD + 8, 360, Math.max(8, (PANEL - 16) * f), 8, 4); ctx.fillStyle = garbageT < 3 ? "#ff5a6a" : "#8b8fb0"; ctx.fill();
      }
      ctx.textAlign = "left"; ctx.font = "800 12px system-ui, sans-serif";
      ctx.fillStyle = diff.color;
      ctx.fillText(diff.label, PAD + 8, H - PAD - 4);

      // Right panel: next pieces
      const n = diff.previews;
      const ph = 26 + 70 + (n - 1) * 50 + 6;
      panel(RX, BY, PANEL, ph, "PROSSIMI");
      if (queue.length) {
        drawMini(queue[0], RX + PANEL / 2, BY + 60, 20);
        for (let i = 1; i < n; i++) drawMini(queue[i], RX + PANEL / 2, BY + 60 + 18 + i * 50, 14, 0.9);
      }
      let ty = BY + ph + 26;
      ctx.textAlign = "center";
      if (combo > 0 && state === "playing") {
        ctx.fillStyle = "#ffd34d"; ctx.font = "800 16px system-ui, sans-serif";
        ctx.fillText(`COMBO ×${combo}`, RX + PANEL / 2, ty); ty += 24;
      }
      if (b2b && state === "playing") {
        ctx.fillStyle = "#b98cff"; ctx.font = "800 13px system-ui, sans-serif";
        ctx.fillText("DI FILA", RX + PANEL / 2, ty); ty += 22;
      }
      if (!touchMode && H - ty > 150) {
        ctx.fillStyle = "rgba(167,163,201,0.75)"; ctx.font = "600 11px system-ui, sans-serif"; ctx.textAlign = "left";
        const hints = ["← →  muovi", "↓  scendi", "SPAZIO  cade", "↑ X  ruota", "Z  ruota ⟲", "C  scorta", "P  pausa", "M  musica"];
        hints.forEach((h, i) => ctx.fillText(h, RX + 8, H - PAD - 4 - (hints.length - 1 - i) * 17));
      }
    }

    // Popups over the board
    popups.forEach((p, i) => {
      const k = p.t / 1.4;
      const y = BY + BH * 0.34 - k * 40 + i * 44;
      ctx.globalAlpha = k < 0.8 ? 1 : 1 - (k - 0.8) / 0.2;
      const size = p.big ? 30 : 22;
      const pop = Math.min(1, p.t * 8);
      ctx.save();
      ctx.translate(BX + BW / 2, y);
      ctx.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
      ctx.textAlign = "center";
      ctx.font = `900 ${size}px system-ui, sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(7,8,26,0.85)";
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 14;
      ctx.fillText(p.text, 0, 0);
      ctx.shadowBlur = 0;
      if (p.sub) {
        ctx.font = "800 13px system-ui, sans-serif";
        ctx.strokeText(p.sub, 0, 20); ctx.fillStyle = "#f3f0ff"; ctx.fillText(p.sub, 0, 20);
      }
      ctx.restore();
    });
    ctx.globalAlpha = 1;

    if (state === "dying") {
      ctx.globalAlpha = Math.min(1, dieT / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 34px system-ui, sans-serif";
      ctx.lineWidth = 6; ctx.strokeStyle = "#07081a";
      ctx.strokeText("TROPPO IN ALTO!", BX + BW / 2, BY + BH / 2);
      ctx.fillStyle = "#ff5a6a"; ctx.fillText("TROPPO IN ALTO!", BX + BW / 2, BY + BH / 2);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    musicTick();
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pecore Testarde</title>
<style>
  :root {
    --bg: #12202e;
    --fg: #f4f6ee;
    --muted: #c8d8e4;
    --gold: #ffd23a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2e4a5e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 32, 46, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #6a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "due compiti in più di ogni tipo · serve salvare una pecora in meno · 5 tentativi", extra: 2, need: -1, time: 1.25, lives: 5 },
    normale:   { label: "NORMALE",   color: "#ffd66b", desc: "i compiti giusti e poco più · 3 tentativi", extra: 0, need: 0, time: 1, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff6b7d", desc: "serve salvare una pecora in più · meno tempo · 2 tentativi", extra: 0, need: 1, time: 0.75, lives: 2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pecore-difficulty";
  const bestKey = (id) => `pecore-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => n.toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  // ---------- The world: a grid of cells, two pixels each ----------
  const GW = 320, GH = 160, CELL = 2, STEP = 1 / 30;
  const AIR = 0, DIRT = 1, ROCK = 2, BRICK = 3, WATER = 4;
  const SPLAT = 34;   // a fall longer than this, without an umbrella, is the end
  const SKILLS = [
    { id: "ferma", name: "FERMA", desc: "si pianta lì e fa girare le altre" },
    { id: "ponte", name: "PONTE", desc: "costruisce dodici scalini in avanti" },
    { id: "scava", name: "SCAVA", desc: "scava dritta verso il basso" },
    { id: "sfonda", name: "SFONDA", desc: "scava un tunnel in avanti" },
    { id: "ombrello", name: "OMBRELLO", desc: "apre l'ombrello e scende piano" },
  ];

  // the ten fields; every level is drawn with rectangles
  const LEVELS = [
    { name: "Il muretto", tip: "Un muro di terra taglia il prato: una pecora che sfonda apre la strada alle altre.",
      total: 10, need: 8, time: 180, skills: { sfonda: 2 }, hatch: [30, 96], exit: [282, 119],
      build: (S) => { S.dirt(0, 120, 320, 40); S.dirt(150, 76, 22, 44); } },
    { name: "Il fosso", tip: "Il prato si interrompe. Una pecora che fa il ponte, partendo proprio dal bordo, lo scavalca.",
      total: 10, need: 8, time: 180, skills: { ponte: 2 }, hatch: [30, 96], exit: [282, 119],
      build: (S) => { S.dirt(0, 120, 142, 40); S.dirt(160, 120, 160, 40); S.rock(0, 150, 320, 10); S.water(142, 140, 18, 10); } },
    { name: "Giù dalla rupe", tip: "La rupe è troppo alta per saltare. Ogni pecora ha bisogno del suo ombrello.",
      total: 8, need: 6, time: 180, skills: { ombrello: 8 }, hatch: [24, 30], exit: [276, 139],
      build: (S) => { S.rock(0, 52, 96, 108); S.dirt(96, 140, 224, 20); } },
    { name: "Dentro la collina", tip: "Sulla collina non si scende vivi dai lati. Scava un pozzo, poi sfonda di lato.",
      total: 10, need: 8, time: 210, skills: { scava: 1, sfonda: 1 }, hatch: [84, 80], exit: [286, 149],
      build: (S) => { S.rock(0, 130, 220, 30); S.water(0, 124, 60, 6); S.dirt(60, 100, 160, 30); S.rock(220, 150, 100, 10); } },
    { name: "Il gradino", tip: "Una parete di roccia, troppo alta per salire. Due ponti di fila fanno una scala.",
      total: 10, need: 8, time: 210, skills: { ponte: 3 }, hatch: [24, 108], exit: [290, 107],
      build: (S) => { S.dirt(0, 130, 160, 30); S.rock(160, 108, 160, 52); } },
    { name: "Due strade", tip: "Le pecore escono da tutte e due le parti, e a sinistra c'è lo stagno. Fermane una e girano tutte.",
      total: 12, need: 8, time: 210, skills: { ferma: 1, sfonda: 1 }, hatch: [120, 98], exit: [292, 121], dirs: "alt",
      build: (S) => { S.rock(0, 150, 320, 10); S.water(0, 130, 64, 20); S.dirt(64, 122, 256, 28); S.dirt(196, 82, 18, 40); } },
    { name: "La grotta", tip: "L'ovile è nella grotta, sotto il prato. Scava giù e poi apriti la strada.",
      total: 10, need: 8, time: 210, skills: { scava: 1, sfonda: 1 }, hatch: [40, 62], exit: [288, 115],
      build: (S) => { S.rock(0, 116, 320, 44); S.rock(0, 70, 8, 46); S.rock(312, 70, 8, 46); S.dirt(8, 84, 304, 16); S.dirt(200, 100, 16, 16); } },
    { name: "Il lago", tip: "Un lago largo: un ponte solo non basta. Appena la prima pecora finisce gli scalini, falle fare il secondo ponte.",
      total: 12, need: 9, time: 240, skills: { ponte: 3 }, hatch: [70, 98], exit: [296, 121], dirs: "alt",
      build: (S) => { S.rock(0, 150, 320, 10); S.rock(0, 60, 6, 62); S.dirt(0, 122, 112, 28); S.water(112, 136, 46, 14); S.dirt(158, 122, 162, 28); } },
    { name: "Il castello", tip: "Su per le mura con i ponti, poi giù nel cortile scavando.",
      total: 10, need: 7, time: 240, skills: { ponte: 3, scava: 1 }, hatch: [24, 108], exit: [282, 129],
      build: (S) => { S.rock(0, 130, 320, 30); S.dirt(0, 128, 140, 2); S.rock(140, 108, 24, 22); S.dirt(164, 108, 156, 2); S.dirt(164, 110, 156, 6); S.rock(316, 60, 4, 70); } },
    { name: "La grande fuga", tip: "Un po' di tutto: ferma, sfonda, fai il ponte e alla fine apri gli ombrelli.",
      total: 12, need: 9, time: 300, skills: { ferma: 1, sfonda: 1, ponte: 2, ombrello: 12 }, hatch: [60, 50], exit: [296, 149], dirs: "alt",
      build: (S) => { S.rock(0, 150, 320, 10); S.water(0, 92, 30, 8); S.rock(0, 100, 30, 50); S.dirt(30, 72, 140, 78); S.dirt(100, 34, 16, 38); S.water(170, 130, 40, 20); S.dirt(210, 72, 50, 78); } },
  ];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), pauseBtn = document.getElementById("pauseBtn");
  const W = 640, H = 360, PH = GH * CELL;
  let pxRatio = 1;
  let touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  const BTN = [...SKILLS.map((s, i) => ({ id: s.id, x: 4 + i * 82, y: PH + 3, w: 78, h: 34 })), { id: "fast", x: 418, y: PH + 3, w: 70, h: 34 }, { id: "retry", x: 492, y: PH + 3, w: 70, h: 34 }];
  function resize() {
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio); canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "triangle", vol = 0.04, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function baa(pitch = 1, vol = 0.035) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain(), lfo = audioCtx.createOscillator(), lg = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.setValueAtTime(420 * pitch, t); o.frequency.linearRampToValueAtTime(380 * pitch, t + 0.4);
    lfo.frequency.value = 22; lg.gain.value = 18 * pitch; lfo.connect(lg).connect(o.frequency);
    f.type = "bandpass"; f.frequency.value = 1100; f.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(f).connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.5); lfo.start(t); lfo.stop(t + 0.5);
  }
  function noise(dur, freq, vol) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime, n = Math.floor(audioCtx.sampleRate * dur), b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(audioCtx.destination); s.start(t);
  }
  let lastBaa = 0;
  const sfx = {
    pick: () => beep(880, 0.05, "sine", 0.03),
    assign: () => { beep(660, 0.05, "square", 0.025); beep(990, 0.07, "square", 0.02, 0.05); },
    bad: () => beep(160, 0.08, "square", 0.03),
    saved: () => { beep(1047, 0.08, "triangle", 0.035); beep(1568, 0.12, "triangle", 0.03, 0.06); },
    lost: () => { noise(0.25, 900, 0.12); },
    splash: () => noise(0.4, 2500, 0.08),
    brick: () => beep(300, 0.03, "square", 0.012),
    spawn: () => { if (clock - lastBaa > 0.9) { lastBaa = clock; baa(0.9 + Math.random() * 0.3, 0.03); } },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.22, "triangle", 0.05, i * 0.1)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.3, "triangle", 0.05, i * 0.16)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0, stateT = 0;
  let score = 0, lives = 0, lvl = 0, bestCache = 0;
  let grid = null, sheep = [], skills = {}, used = 0, chosen = "ferma", fast = false, timeLeft = 0, spawned = 0, spawnT = 0, saved = 0, lost = 0, need = 0, total = 0;
  let parts = [], msg = null, hover = null, acc = 0, result = null, LV = null, terrainDirty = true, cursorSheep = -1, kbdSel = -1;
  const isPlaying = () => ["intro", "play", "result"].includes(state);

  // ---------- The terrain ----------
  const terrain = document.createElement("canvas"); terrain.width = GW; terrain.height = GH;
  const tctx = terrain.getContext("2d"), img = tctx.createImageData(GW, GH);
  const at = (x, y) => (x < 0 || x >= GW ? ROCK : y < 0 || y >= GH ? AIR : grid[y * GW + x]);
  const solid = (x, y) => { const v = at(x, y); return v === DIRT || v === ROCK || v === BRICK; };
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; };
  function paint(x, y) {
    if (x < 0 || y < 0 || x >= GW || y >= GH) return;
    const v = grid[y * GW + x], k = (y * GW + x) * 4, n = hash(x, y);
    let r = 0, g = 0, b = 0, a = 255;
    if (v === AIR) a = 0;
    else if (v === DIRT) {
      const depth = topDepth(x, y);
      if (depth < 2) { r = 92 + n * 20; g = 170 + n * 30; b = 70; }
      else if (depth < 3) { r = 70; g = 130 + n * 20; b = 52; }
      else { r = 128 + n * 26; g = 86 + n * 18; b = 52 + n * 10; if (n > 0.93) { r += 30; g += 26; b += 20; } }
    } else if (v === ROCK) { const c = 108 + n * 22 + ((x + y * 3) % 9 === 0 ? 10 : 0); r = c; g = c + 4; b = c + 12; }
    else if (v === BRICK) { const edge = (x % 4 === 0) ? -26 : 0; r = 214 + edge + n * 10; g = 150 + edge + n * 10; b = 86 + edge; }
    else if (v === WATER) { r = 50; g = 120 + n * 20; b = 200; a = 210; }
    img.data[k] = r; img.data[k + 1] = g; img.data[k + 2] = b; img.data[k + 3] = a;
  }
  function topDepth(x, y) { let d = 0; while (d < 3 && y - d - 1 >= 0 && grid[(y - d - 1) * GW + x] === DIRT) d++; return y - d - 1 < 0 || grid[(y - d - 1) * GW + x] !== DIRT ? d : 3; }
  function setCell(x, y, v) {
    if (x < 0 || y < 0 || x >= GW || y >= GH) return;
    grid[y * GW + x] = v;
    for (let k = 0; k <= 3; k++) paint(x, y + k);
    terrainDirty = true;
  }
  function buildLevel(n) {
    LV = LEVELS[n]; grid = new Uint8Array(GW * GH);
    const fill = (v) => (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < GW && j < GH) grid[j * GW + i] = v; };
    LV.build({ dirt: fill(DIRT), rock: fill(ROCK), water: fill(WATER) });
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) paint(x, y);
    terrainDirty = true;
  }

  // ---------- Sheep ----------
  function spawn() {
    const [x, y] = LV.hatch, dir = LV.dirs === "alt" && spawned % 2 ? -1 : 1;
    sheep.push({ id: spawned, x, y, dir, st: "fall", t: 0, fall: 0, umb: false, bricks: 0, anim: Math.random() * 10, work: 0 });
    spawned++; sfx.spawn();
  }
  const blocking = (s) => s.st === "ferma" || s.st === "ponte" || s.st === "sfonda" || s.st === "shrug";
  // a walker turns at a sheep standing in its way
  function blockedBy(s, nx) {
    for (const o of sheep) {
      if (o === s || !blocking(o)) continue;
      if (Math.abs(o.y - s.y) > 6) continue;
      const dx = o.x - s.x;
      if (Math.sign(dx) === s.dir && Math.abs(o.x - nx) <= 3) return true;
    }
    return false;
  }
  function walk(s) {
    if (!solid(s.x, s.y + 1)) { s.st = "fall"; s.fall = 0; return; }
    s.t++; if (s.t % 2) return;
    const nx = s.x + s.dir;
    if (blockedBy(s, nx)) { s.dir = -s.dir; return; }
    if (solid(nx, s.y)) {
      // a step up of a few cells, or a wall
      let up = 0; while (up <= 5 && solid(nx, s.y - up)) up++;
      if (up <= 4 && !solid(nx, s.y - up - 6)) { s.x = nx; s.y -= up; }
      else s.dir = -s.dir;
      return;
    }
    s.x = nx;
    // a gentle slope down
    if (!solid(s.x, s.y + 1)) for (let d = 1; d <= 3; d++) if (solid(s.x, s.y + 1 + d)) { s.y += d; break; }
  }
  function fall(s) {
    const speed = s.umb && s.fall > 10 ? 1 : 2;
    if (s.umb && s.fall > 10 && (s.t++ % 2)) return;
    if (s.resume && s.fall > 12) s.resume = null;
    for (let k = 0; k < speed; k++) {
      if (solid(s.x, s.y + 1)) {
        if (s.fall > SPLAT && !s.umb) { die(s, "poof"); return; }
        s.st = s.resume || "walk"; s.resume = null; s.fall = 0; s.t = 0; return;
      }
      s.y++; s.fall++;
      if (s.y >= GH + 4) { die(s, "out"); return; }
      if (at(s.x, s.y) === WATER) { die(s, "water"); return; }
    }
  }
  function dig(s) {
    s.t++; if (s.t % 4) return;
    let any = false, rockHit = false;
    for (let i = s.x - 3; i <= s.x + 3; i++) { const v = at(i, s.y + 1); if (v === DIRT || v === BRICK) { setCell(i, s.y + 1, AIR); any = true; } else if (v === ROCK && Math.abs(i - s.x) <= 1) rockHit = true; }
    if (rockHit && !any) { s.st = "walk"; s.t = 0; return; }
    if (any) { s.y++; dust(s, 0, 1); }
    if (!solid(s.x, s.y + 1) && !solid(s.x - 2, s.y + 1) && !solid(s.x + 2, s.y + 1)) { s.st = "fall"; s.fall = 0; }
    else if (!any) { s.st = "walk"; s.t = 0; }
  }
  function bash(s) {
    // the floor went away (a digger below): it falls, and goes back to work when it lands
    if (!solid(s.x, s.y + 1)) { s.st = "fall"; s.fall = 0; s.resume = "sfonda"; return; }
    s.t++; if (s.t % 3) return;
    // is there still earth ahead to dig?
    let ahead = false, rock = false;
    for (let d = 1; d <= 6; d++) for (let h = 1; h <= 7; h++) { const v = at(s.x + s.dir * d, s.y - h + 1); if (v === DIRT || v === BRICK) ahead = true; if (v === ROCK && d <= 2 && h <= 6) rock = true; }
    if (rock) { s.st = "walk"; s.t = 0; return; }
    if (!ahead) {
      // nothing to dig yet: it walks on, looking for earth (and gives up after a while, or once it has dug through)
      if (s.work > 0 || solid(s.x + s.dir, s.y) || ++s.walked > 40) { s.st = "walk"; s.t = 0; return; }
      s.x += s.dir; if (!solid(s.x, s.y + 1)) for (let d = 1; d <= 3; d++) if (solid(s.x, s.y + 1 + d)) { s.y += d; break; }
      return;

    drawSky();
    if (terrainDirty) { tctx.putImageData(img, 0, 0); terrainDirty = false; }
    ctx.imageSmoothingEnabled = false; ctx.drawImage(terrain, 0, 0, GW * CELL, GH * CELL); ctx.imageSmoothingEnabled = true;
    drawHatchAndExit();
    for (const s of sheep) if (s.st !== "dead" && s.st !== "saved") drawSheep(s);
    for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    ctx.globalAlpha = 1;
    // the sheep under the pointer, or picked with the keyboard
    const hs = state === "play" ? (hover ? sheepAt(hover) : sheep.find((o) => o.id === kbdSel)) : null;
    if (hs) { ctx.strokeStyle = canTake(hs, chosen) && skills[chosen] > 0 ? "#ffd23a" : "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5; rr(hs.x * CELL - 12, hs.y * CELL - 25, 24, 29, 4); ctx.stroke(); }

    // top info
    ctx.fillStyle = "rgba(10,20,30,0.55)"; rr(6, 5, touchMode ? 520 : 510, 22, 11); ctx.fill();
    ctx.textBaseline = "middle"; ctx.font = "800 12px system-ui, sans-serif"; ctx.textAlign = "left";
    const out = sheep.filter((s) => s.st !== "dead" && s.st !== "saved").length;
    ctx.fillStyle = "#ffd23a"; ctx.fillText(`${lvl + 1}. ${LV.name}`, 16, 16);
    ctx.fillStyle = "#f4f6ee";
    ctx.fillText(`all'ovile ${saved}/${need}`, 170, 16);
    ctx.fillText(`in giro ${out}`, 270, 16);
    ctx.fillText(`da uscire ${total - spawned}`, 340, 16);
    ctx.fillStyle = timeLeft < 30 ? "#ff6b7d" : "#f4f6ee"; ctx.fillText(`⏱ ${mmss(Math.max(0, timeLeft))}`, 440, 16);

    // bottom bar
    ctx.fillStyle = "#1a2a38"; ctx.fillRect(0, PH, W, H - PH);
    for (const b of BTN) {
      if (b.id === "fast") button(b, "VELOCE", fast ? "×3" : "×1", state === "play", fast);
      else if (b.id === "retry") button(b, "DA CAPO", "↺", state === "play", false);
      else { const sk = SKILLS.find((k) => k.id === b.id), n = skills[b.id] || 0; button(b, sk.name, String(n), n > 0, chosen === b.id && n > 0); }
    }
    ctx.textAlign = "left"; ctx.font = "700 10px system-ui, sans-serif"; ctx.fillStyle = "#c8d8e4";
    ctx.fillText(`${nf(score)} pt`, 570, PH + 12);
    for (let i = 0; i < diff.lives; i++) { ctx.fillStyle = i < lives ? "#fbfbf6" : "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(574 + i * 12, PH + 27, 4, 0, TAU); ctx.fill(); }

    if (state === "intro") panel(() => {
      ctx.fillStyle = "#c8d8e4"; ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(`LIVELLO ${lvl + 1} DI ${LEVELS.length}`, W / 2, 112);
      ctx.fillStyle = "#ffd23a"; ctx.font = "900 24px system-ui, sans-serif"; ctx.fillText(LV.name, W / 2, 140);
      ctx.fillStyle = "#f4f6ee"; ctx.font = "500 13px system-ui, sans-serif";
      wrap(LV.tip, 360).forEach((ln, k) => ctx.fillText(ln, W / 2, 168 + k * 18));
      ctx.fillStyle = "#c8d8e4"; ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(`${total} pecore · portane all'ovile almeno ${need} · tempo ${mmss(timeLeft)}`, W / 2, 214);
      if (stateT > 0.5) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffd23a"; ctx.fillText(touchMode ? "tocca per cominciare" : "clic o Invio per cominciare", W / 2, 240); ctx.globalAlpha = 1; }
    });
    if (state === "result" && stateT > 0.4) panel(() => {
      const R = result;
      ctx.fillStyle = R.ok ? "#ffd23a" : "#ff6b7d"; ctx.font = "900 24px system-ui, sans-serif";
      ctx.fillText(R.ok ? (saved === total ? "TUTTE ALL'OVILE!" : "LIVELLO SUPERATO!") : R.gaveUp ? "SI RICOMINCIA" : R.timeout ? "TEMPO SCADUTO" : "TROPPO POCHE", W / 2, 116);
      ctx.font = "600 13px system-ui, sans-serif"; ctx.fillStyle = "#f4f6ee";
      if (R.ok) {
        const rows = [["Pecore all'ovile", R.saved], ["Oltre il necessario", R.extra], ["Tempo avanzato", R.time], ["Compiti avanzati", R.skills]];
        rows.forEach(([t, v], i) => { const y = 146 + i * 19; ctx.textAlign = "left"; ctx.fillStyle = "#c8d8e4"; ctx.fillText(t, W / 2 - 120, y); ctx.textAlign = "right"; ctx.fillStyle = v ? "#f4f6ee" : "rgba(244,246,238,0.35)"; ctx.fillText(`+${nf(v)}`, W / 2 + 120, y); });
        ctx.textAlign = "center";
      } else {
        ctx.fillText(R.gaveUp ? "Il livello ricomincia da capo." : `Ne sono arrivate ${saved} su ${need}.`, W / 2, 150);
        ctx.fillStyle = "#c8d8e4"; ctx.fillText(lives > 0 ? `${lives} ${lives === 1 ? "tentativo rimasto" : "tentativi rimasti"}` : "Nessun tentativo rimasto", W / 2, 176);
      }
      if (stateT > 1.2) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffd23a"; ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(touchMode ? "tocca per continuare" : "clic o Invio per continuare", W / 2, 240); ctx.globalAlpha = 1; }
    });
    if (msg && state === "play") { ctx.globalAlpha = Math.min(1, (2.2 - msg.t) * 3); ctx.font = "800 14px system-ui, sans-serif"; const w = ctx.measureText(msg.text).width + 28; ctx.fillStyle = "rgba(10,20,30,0.85)"; rr(W / 2 - w / 2, 40, w, 28, 14); ctx.fill(); ctx.fillStyle = "#ffd23a"; ctx.textAlign = "center"; ctx.fillText(msg.text, W / 2, 54); ctx.globalAlpha = 1; }
  }
  function wrap(text, maxW) { const words = text.split(" "), lines = []; let cur = ""; for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }
  function panel(fn) { ctx.fillStyle = "rgba(12,22,32,0.9)"; rr(W / 2 - 210, 90, 420, 168, 14); ctx.fill(); ctx.strokeStyle = "rgba(255,210,58,0.7)"; ctx.lineWidth = 2; ctx.stroke(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; fn(); }

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  // behind the title: the first meadow, with a few sheep about
  function demo() { lvl = 0; diff = DIFFICULTIES[difficulty]; startLevel(); state = "menu"; for (let i = 0; i < 160; i++) { if (spawned < 4) { spawnT -= STEP; if (spawnT <= 0) { spawn(); spawnT = 1.35; } } for (const s of sheep) updateSheep(s); } }
  resize(); demo();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="pecore-best-" data-kind="score"></script>
</body>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quattro Re</title>
<style>
  :root {
    --bg: #0c0a14;
    --fg: #f2eee6;
    --muted: #aaa4b8;
    --blue: #4a9aff;
    --gold: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2440, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 238, 230, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* the stick points where the shield should stand on its arc; the button holds the fireball */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(74, 154, 255, 0.55); background: radial-gradient(circle, rgba(74,154,255,0.14), rgba(74,154,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(74, 154, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(242,238,230,0.25); pointer-events: none; }
  #touch .grab { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.18); }
  #touch .grab.on { background: rgba(255, 210, 58, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .grab { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 10, 20, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 62px); font-weight: 900; letter-spacing: 2px; color: var(--gold); text-shadow: 0 3px 0 #8a5a10, 0 0 22px rgba(255,210,58,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,238,230,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a00; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #8a5a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="grab" aria-label="Prendi la palla">PRENDI</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const F = 400, HUD = 24, W = F, H = F + HUD, TAU = Math.PI * 2;
  const CELL = 12, IN = 94, OUT = 120;      // the castle wall: cells between IN and OUT from the corner
  const ARC = 136, SPAN = 0.36;            // the shield's radius and angular length
  const BR = 4;                           // fireball radius
  const LORDS = [
    { name: "Tu", col: "#4a9aff", dark: "#1a4a8a", cx: 0, cy: F },
    { name: "Rosso", col: "#ff4a3a", dark: "#8a1a12", cx: F, cy: F },
    { name: "Verde", col: "#5ad86a", dark: "#1a6a2a", cx: F, cy: 0 },
    { name: "Viola", col: "#b86aff", dark: "#5a2a8a", cx: 0, cy: 0 },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "3 vite · avversari distratti · palla lenta", lives: 3, ai: 0.62, speed: 0.85 },
    normale:   { label: "NORMALE",   color: "#4a9aff", desc: "2 vite · l'esperienza classica", lives: 2, ai: 0.8, speed: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "1 vita · avversari svegli · palla veloce", lives: 1, ai: 0.95, speed: 1.12 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "quattrore-difficulty";
  const bestKey = (id) => `quattrore-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    brick: lim(() => beep(rnd(500, 800), 0.05, "square", 0.025, -200)),
    shield: lim(() => beep(260, 0.07, "triangle", 0.05, 120)),
    wall: lim(() => beep(160, 0.04, "square", 0.02)),
    grab: () => beep(700, 0.12, "sine", 0.04, -300),
    throw: () => beep(300, 0.2, "sawtooth", 0.03, 500),
    king: () => { noise(0.8, 0.35, 900); arp([392, 330, 262, 196, 131], 0.1, 0.18, "sawtooth", 0.04); },
    start: () => arp([262, 330, 392, 523, 392, 523, 659], 0.1, 0.14),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    lose: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 2, round = 0, bestCache = 0, wins = 0;
  let lords = [], bricks = null, ball = null, balls = [], nextBall = 0, parts = [], popups = [], message = null, roundT = 0;
  let stick = null, grabHeld = false;
  const keys = { left: false, right: false, up: false, down: false };

  // ---------- Castles ----------
  // each lord has a corner, a wall of bricks around it, a king in the corner and a shield on an arc
  const dirOf = (L) => [L.cx === 0 ? 1 : -1, L.cy === 0 ? 1 : -1];
  function arcPos(L, phi, r = ARC) { const [ux, uy] = dirOf(L); return [L.cx + ux * r * Math.cos(phi), HUD + L.cy + uy * r * Math.sin(phi)]; }
  const GRID = Math.ceil(OUT / CELL) + 1;
  function buildCastles() {
    bricks = [];
    lords = LORDS.map((d, k) => {
      const L = { ...d, k, alive: true, phi: Math.PI / 4, target: Math.PI / 4, err: 0, hold: 0, bricks: [] };
      const [ux, uy] = dirOf(L);
      for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++) {
        const x = (i + 0.5) * CELL, y = (j + 0.5) * CELL, r = Math.hypot(x, y);
        if (r < IN || r > OUT) continue;
        const b = { k, x: L.cx + ux * x, y: HUD + L.cy + uy * y, alive: true };
        bricks.push(b); L.bricks.push(b);
      }
      return L;
    });
  }
  const kingPos = (L) => { const [ux, uy] = dirOf(L); return [L.cx + ux * 19, HUD + L.cy + uy * 19]; };

  // ---------- Flow ----------
  const isPlaying = () => ["serve", "play", "roundEnd"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 0; wins = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginRound();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  const aiSkill = () => Math.min(0.99, diff.ai + round * 0.03);
  function beginRound() {
    buildCastles();
    balls = []; ball = null; nextBall = 25;
    roundT = 0;
    message = { text: `ROUND ${round + 1}`, sub: "Difendi il tuo re, abbatti gli altri tre", t: 0 };
    state = "serve"; stateT = 1.6;
  }
  function serve() {
    // a fireball from the middle towards a random lord (the "ball" variable always points at the one being handled)
    ball = { x: W / 2, y: HUD + F / 2, vx: 0, vy: 0, sp: 0, owner: -1, stuck: null };
    balls.push(ball);
    const L = lords.filter((l) => l.alive)[Math.floor(Math.random() * lords.filter((l) => l.alive).length)];
    const [kx, ky] = kingPos(L), a = Math.atan2(ky - ball.y, kx - ball.x) + rnd(-0.35, 0.35);
    ball.sp = 190 * diff.speed; ball.vx = Math.cos(a) * ball.sp; ball.vy = Math.sin(a) * ball.sp;
    state = "play";
  }
  function addScore(n, x, y, color = "#f2eee6") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: "+" + n, color, t: 0 });
  }
  function burst(x, y, color, n = 10, sp = 90, life = 0.45) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function killKing(L) {
    L.alive = false;
    const [kx, ky] = kingPos(L);
    burst(kx, ky, L.col, 30, 140, 1); burst(kx, ky, "#ffd23a", 16, 90, 0.8);
    sfx.king();
    for (const b of L.bricks) b.dead = true;       // the wall of a fallen lord turns to rubble
    if (ball.owner === 0 && L.k !== 0) addScore(500, kx + (L.cx ? -30 : 30), ky + (L.cy ? -20 : 30), "#ffd23a");
    if (L.k === 0) {
      lives--;
      message = { text: "IL TUO RE È CADUTO!", sub: lives > 0 ? `Vite rimaste: ${lives}` : "", t: 0 };
      state = "roundEnd"; stateT = 2.4; for (const b of balls) b.stuck = null;
      sfx.lose();
      return;
    }
    const left = lords.filter((l) => l.alive);
    if (left.length === 1 && left[0].k === 0) {
      wins++;
      const standing = lords[0].bricks.filter((b) => b.alive && !b.dead).length;
      addScore(1000 + standing * 5);
      message = { text: "HAI VINTO IL ROUND!", sub: `+1.000 · mura intatte +${standing * 5}`, t: 0 };
      state = "roundEnd"; stateT = 2.6;
      sfx.win();
    } else message = { text: `${L.name.toUpperCase()} È CADUTO!`, t: 0 };
  }
  function afterRound() {
    if (lives <= 0) { gameOver(); return; }
    round++;
    beginRound();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Round vinti: ${wins} su ${round + 1} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>QUATTRO RE</h1>
       <p>Quattro castelli, uno per angolo, e una palla di fuoco che rimbalza ovunque. Il tuo è quello blu in basso a sinistra: muovi lo scudo lungo le mura per respingere la palla, sgretola i castelli nemici e colpisci i loro re. L'ultimo re rimasto vince il round.</p>
       <div class="pts">
         <span><b>Mattone</b></span><span>10 punti, se la palla l'hai lanciata tu</span>
         <span><b>Re nemico</b></span><span>500</span>
         <span><b>Round vinto</b></span><span>1.000 più 5 per ogni tuo mattone rimasto</span>
         <span><b>Palle di fuoco</b></span><span>ogni 25 secondi ne arriva un'altra, fino a tre</span>
         <span><b>Prendi</b></span><span>tieni premuto per bloccare la palla sullo scudo, lascia per lanciarla</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Punta la levetta verso dove vuoi lo scudo (su o a destra) · tieni PRENDI per bloccare la palla, lascia per tirarla</p>`
         : `<p class="muted help">↑ ← e ↓ → per spostare lo scudo · tieni SPAZIO per bloccare la palla, lascia per tirarla · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>ALL'ASSALTO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (k === " " || k === "z" || k === "x") grabHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "z" || k === "x") grabHeld = false;
    if (KEYMAP[k]) keys[KEYMAP[k]] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick = null; grabHeld = false; if (isPlaying()) togglePause(); });
  const grabBtn = touchEl.querySelector(".grab");
  let grabId = null;
  grabBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); grabId = e.pointerId; try { grabBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } grabHeld = true; grabBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) grabBtn.addEventListener(ev, (e) => { if (e.pointerId !== grabId) return; grabId = null; grabHeld = false; grabBtn.classList.remove("on"); });
  // the stick: pointing up puts the shield at the top of its arc, pointing right at the right end
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    if (len < max * 0.25) { stick = null; return; }
    // up = π/2 on the arc, right = 0; left and down fold onto the nearer end
    let a = Math.atan2(-dy, dx);
    if (a < 0) a = a < -Math.PI / 2 ? Math.PI / 2 : 0;
    stick = clamp(a, 0, Math.PI / 2);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick = null; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Shields ----------
  const SHIELD_V = 2.8;          // radians per second along the arc
  function moveShield(L, target, dt, speed = SHIELD_V) {
    const lo = SPAN / 2 - 0.08, hi = Math.PI / 2 - SPAN / 2 + 0.08;
    target = clamp(target, lo, hi);
    L.phi += clamp(target - L.phi, -speed * dt, speed * dt);
  }
  // where (as an angle on its arc) will the fireball cross this lord's shield line?
  function predict(L) {
    let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
    const [ux, uy] = dirOf(L);
    for (let i = 0; i < 400; i++) {
      x += vx * 0.01; y += vy * 0.01;
      if (x < BR || x > W - BR) vx = -vx;
      if (y < HUD + BR || y > H - BR) vy = -vy;
      const lx = (x - L.cx) * ux, ly = (y - HUD - L.cy) * uy;
      if (lx >= 0 && ly >= 0 && Math.hypot(lx, ly) < ARC + 2) return [Math.atan2(ly, lx), i * 0.01];
    }
    return null;
  }
  function aiShield(L, dt) {
    const skill = aiSkill();
    let coming = null, pick = null;
    for (const b of balls) { if (b.stuck !== null) continue; ball = b; const c = predict(L); if (c && (!coming || c[1] < coming[1])) { coming = c; pick = b; } }
    if (pick) ball = pick;
    // each time the fireball heads their way (and more often as a long round wears them out) they decide how well to guard: sometimes they simply misjudge it
    const reach = (110 + 110 * skill) / Math.max(120, ball ? ball.sp : 0);   // they only see it coming from so far away
    if (coming && coming[1] < reach) {
      if (!L.approach) { L.approach = true; L.miss = Math.random() < (1 - skill) * 2 + Math.min(0.45, roundT / 110); L.err = rnd(-1, 1) * (1 - skill) * 0.6 + (L.miss ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.35, 0.6) : 0); }
      L.target = coming[0] + L.err;
    } else {
      if (!coming || coming[1] > reach + 0.3) L.approach = false;
      L.target = Math.PI / 4 + Math.sin(clock * 0.7 + L.k) * 0.25;
    }
    moveShield(L, L.target, dt, 1.1 + 1.1 * skill);
    // a good lord sometimes catches the ball and aims it
    const held = balls.find((b) => b.stuck === L.k);
    if (held) {
      ball = held;
      L.hold -= dt;
      const foes = lords.filter((l) => l.alive && l !== L);
      if (L.hold <= 0 && foes.length) {
        const f = foes[Math.floor(Math.random() * foes.length)], [kx, ky] = kingPos(f);
        release(L, Math.atan2(ky - ball.y, kx - ball.x) + rnd(-0.3, 0.3));
      }
    }
  }
  function release(L, angle) {
    ball.stuck = null;
    // never back into its own wall
    const [ux, uy] = dirOf(L);
    let dx = Math.cos(angle), dy = Math.sin(angle);
    if (dx * ux < 0.15) dx = 0.15 * ux; if (dy * uy < 0.15) dy = 0.15 * uy;
    const n = Math.hypot(dx, dy);
    ball.vx = dx / n * ball.sp; ball.vy = dy / n * ball.sp;
    fixAngle();
    ball.owner = L.k;
    sfx.throw();
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 2; q.vy *= 1 - dt * 2; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 18 * dt; }
    popups = popups.filter((q) => q.t < 0.9);
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    if (!isPlaying()) return;
    // the player's shield
    const P = lords[0];
    if (P.alive) {
      const kv = (keys.up || keys.left ? 1 : 0) - (keys.down || keys.right ? 1 : 0);
      if (stick !== null) moveShield(P, stick, dt);
      else if (kv) moveShield(P, P.phi + kv, dt);
    }
    for (const L of lords) if (L.k && L.alive) aiShield(L, dt);
    if (state === "serve") { stateT -= dt; if (stateT <= 0) serve(); return; }
    if (state === "roundEnd") { stateT -= dt; if (stateT <= 0) afterRound(); return; }
    roundT += dt;
    // the fireballs speed up as the round goes on, and every so often another one joins in
    nextBall -= dt;
    if (nextBall <= 0 && balls.length < 3) { nextBall = 25; serve(); message = { text: "UN'ALTRA PALLA DI FUOCO!", t: 0 }; sfx.throw(); }
    const target = (190 + Math.min(200, roundT * 5)) * diff.speed;
    for (const b of balls.slice()) {
      ball = b;
      if (ball.stuck === null) {
        ball.sp = target;
        const n = Math.hypot(ball.vx, ball.vy) || 1; ball.vx = ball.vx / n * ball.sp; ball.vy = ball.vy / n * ball.sp;
        stepBall(dt);
        if (state !== "play") return;
      } else {
        // held on a shield
        const L = lords[ball.stuck];
        [ball.x, ball.y] = arcPos(L, L.phi, ARC + BR + 3);
        if (L.k === 0) { L.hold -= dt; if (!grabHeld || L.hold <= 0) release(L, aimFromShield(L)); }
      }
    }
  }
  function aimFromShield(L) {
    // thrown outwards along the direction the shield faces
    const [ux, uy] = dirOf(L);
    return Math.atan2(uy * Math.sin(L.phi), ux * Math.cos(L.phi));
  }
  // never too flat: a fireball skimming along an edge would bounce there for ever
  function fixAngle() {
    const sp = Math.hypot(ball.vx, ball.vy) || 1, min = 0.3 * sp;
    if (Math.abs(ball.vx) < min) ball.vx = Math.sign(ball.vx || 1) * min;
    if (Math.abs(ball.vy) < min) ball.vy = Math.sign(ball.vy || 1) * min;
    const n = Math.hypot(ball.vx, ball.vy); ball.vx = ball.vx / n * sp; ball.vy = ball.vy / n * sp;
  }
  function stepBall(dt) {
    const px = ball.x, py = ball.y;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    // the edges of the field
    if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    if (ball.y < HUD + BR) { ball.y = HUD + BR; ball.vy = Math.abs(ball.vy); sfx.wall(); }
    if (ball.y > H - BR) { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); sfx.wall(); }
    for (const L of lords) {
      const [ux, uy] = dirOf(L);
      const lx = (ball.x - L.cx) * ux, ly = (ball.y - HUD - L.cy) * uy;
      if (lx < -BR || ly < -BR || lx > ARC + 10 || ly > ARC + 10) continue;
      const r = Math.hypot(lx, ly), a = Math.atan2(ly, lx);
      // the shield
      if (L.alive && Math.abs(r - ARC) < BR + 2 && Math.abs(a - L.phi) < SPAN / 2 + 0.03) {
        const nx = ux * lx / r, ny = uy * ly / r;               // outward from the corner
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          const busy = balls.some((o) => o.stuck === L.k);
          if (!busy && ((L.k === 0 && grabHeld) || (L.k && Math.random() < aiSkill() * 0.35 && !(L.coolT > clock)))) {
            ball.stuck = L.k; L.hold = L.k ? rnd(0.4, 1.1) : 2.5; sfx.grab();
            if (L.k) L.coolT = clock + 3;
            return;
          }
          ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny;
          // hitting off-centre adds spin along the arc
          const off = (a - L.phi) / (SPAN / 2), tx = -ux * Math.sin(a), ty = uy * Math.cos(a);   // along the arc
          ball.vx += tx * off * ball.sp * 0.35; ball.vy += ty * off * ball.sp * 0.35;
          ball.owner = L.k;
          fixAngle();
          sfx.shield();
          continue;
        }
      }
      // the king
      if (L.alive && lx < 33 && ly < 33) { killKing(L); if (state !== "play") return; ball.vx = -ball.vx; ball.vy = -ball.vy; continue; }
    }
    // bricks: find the cell the ball moved into
    for (const b of bricks) {
      if (!b.alive) continue;
      if (Math.abs(ball.x - b.x) < CELL / 2 + BR && Math.abs(ball.y - b.y) < CELL / 2 + BR) {
        b.alive = false;
        burst(b.x, b.y, b.dead ? "#777" : LORDS[b.k].col, 5, 60, 0.3);
        sfx.brick();
        if (ball.owner === 0 && b.k !== 0 && !b.dead) addScore(10);
        // bounce off the face we came through
        const wasX = Math.abs(px - b.x) >= CELL / 2 + BR, wasY = Math.abs(py - b.y) >= CELL / 2 + BR;
        if (wasX && !wasY) ball.vx = -ball.vx; else if (wasY && !wasX) ball.vy = -ball.vy; else { ball.vx = -ball.vx; ball.vy = -ball.vy; }
        ball.x = px; ball.y = py;
        break;
      }
    }
  }

  // ---------- Drawing ----------
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0c0a14"; ctx.fillRect(0, 0, W, H);
    // the courtyard: flagstones
    for (let y = 0; y < F; y += 25) for (let x = 0; x < F; x += 25) { ctx.fillStyle = (x / 25 + y / 25) % 2 ? "#1a1626" : "#1e1a2c"; ctx.fillRect(x, HUD + y, 25, 25); }
    ctx.strokeStyle = "rgba(255,210,58,0.12)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(W / 2, HUD + F / 2, 40, 0, TAU); ctx.stroke();
    if (!lords.length) buildCastles();
    for (const L of lords) {
      // the arc the shield runs on
      const [ux, uy] = dirOf(L);
      ctx.strokeStyle = L.alive ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.03)"; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k <= 20; k++) { const [x, y] = arcPos(L, k / 20 * Math.PI / 2); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
      // bricks
      for (const b of L.bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.dead ? "#4a4658" : L.col;
        ctx.fillRect(b.x - CELL / 2 + 0.5, b.y - CELL / 2 + 0.5, CELL - 1, CELL - 1);
        if (!b.dead) { ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(b.x - CELL / 2 + 0.5, b.y + CELL / 2 - 2.5, CELL - 1, 2); }
      }
      // the king
      const [kx, ky] = kingPos(L);
      if (L.alive) {
        ctx.fillStyle = L.dark; ctx.fillRect(kx - 14, ky - 14, 28, 28);
        ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(kx - 7, ky + 2); ctx.lineTo(kx - 7, ky - 6); ctx.lineTo(kx - 3.5, ky - 2); ctx.lineTo(kx, ky - 7); ctx.lineTo(kx + 3.5, ky - 2); ctx.lineTo(kx + 7, ky - 6); ctx.lineTo(kx + 7, ky + 2); ctx.fill();
        ctx.fillStyle = "#e8c8a0"; ctx.beginPath(); ctx.arc(kx, ky + 5, 3.5, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = "#3a3448"; ctx.fillRect(kx - 10, ky - 10, 20, 20);
        ctx.strokeStyle = "#6a6478"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(kx - 6, ky - 6); ctx.lineTo(kx + 6, ky + 6); ctx.moveTo(kx + 6, ky - 6); ctx.lineTo(kx - 6, ky + 6); ctx.stroke();
      }
      // the shield
      if (L.alive) {
        ctx.strokeStyle = L.col; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath();
        for (let k = 0; k <= 8; k++) { const [x, y] = arcPos(L, L.phi - SPAN / 2 + k / 8 * SPAN); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.lineCap = "butt";
      }
    }
    if (state === "menu") return;
    // the fireballs and their trails
    for (const ball of balls) {
      for (let k = 1; k <= 4; k++) { ctx.fillStyle = `rgba(255,140,40,${0.25 - k * 0.05})`; ctx.beginPath(); ctx.arc(ball.x - ball.vx * k * 0.012, ball.y - ball.vy * k * 0.012, BR + 1 - k * 0.5, 0, TAU); ctx.fill(); }
      ctx.fillStyle = "#ff8a2a"; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR + 1, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe89a"; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR - 1.5, 0, TAU); ctx.fill();
      if (ball.stuck !== null) { ctx.strokeStyle = LORDS[ball.stuck].col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR + 4 + Math.sin(clock * 12), 0, TAU); ctx.stroke(); }
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / 0.9);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "#0c0a14"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = "#f2eee6";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a3a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 80, 12);
    ctx.textAlign = "center"; ctx.font = "900 12px system-ui, sans-serif"; ctx.fillStyle = "#ffd23a";
    ctx.fillText(`ROUND ${round + 1}`, W / 2 + 20, 12);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#4a9aff";
    ctx.fillText(`VITE ${Math.max(0, lives)} · VINTI ${wins}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, HUD + F / 2 - 50); ctx.fillText(message.text, W / 2, HUD + F / 2 - 50);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2eee6"; ctx.strokeText(message.sub, W / 2, HUD + F / 2 - 30); ctx.fillText(message.sub, W / 2, HUD + F / 2 - 30); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

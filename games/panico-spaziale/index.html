<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panico Spaziale</title>
<style>
  :root {
    --bg: #0a0a24;
    --fg: #f4f6ee;
    --muted: #b0b8e0;
    --pink: #ffcc33;
    --yellow: #5aff8a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk the floors and climb the ladders; SCAVA digs, fills and bashes */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 204, 51, 0.6); background: radial-gradient(circle, rgba(255,204,51,0.14), rgba(255,204,51,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 204, 51, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 10, 36, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a4a0a, 0 0 22px rgba(255,204,51,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1e02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b88a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Scava">SCAVA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // five floors joined by ladders; columns 20px wide
  const FY = [96, 152, 208, 264, 320], NF = FY.length, CW = 20, C0 = 1, C1 = 30;
  const PSPEED = 84, CLIMB = 70, DIG_T = 0.42, FILL_T = 0.35, AR = 7;
  const TYPES = {
    rosso: { need: 1, pts: 100, c: "#ff4a4a", c2: "#a81a2a", name: "ROSSO" },
    verde: { need: 2, pts: 300, c: "#4ae05a", c2: "#1a7a2a", name: "VERDE" },
    bianco: { need: 3, pts: 500, c: "#f0f0ff", c2: "#8a8ab0", name: "BIANCO" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · alieni lenti che restano a lungo nelle buche · tanto ossigeno", lives: 5, speed: 0.65, trap: 8, air: 160, chase: 0.45 },
    normale:   { label: "NORMALE",   color: "#ffcc33", desc: "3 vite", lives: 3, speed: 1, trap: 5, air: 130, chase: 0.55 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · alieni svelti che escono presto dalle buche · poco ossigeno", lives: 3, speed: 1.4, trap: 3, air: 95, chase: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "panico-difficulty";
  const bestKey = (id) => `panico-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const colOf = (x) => Math.floor(x / CW);
  const colX = (c) => c * CW + CW / 2;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    dig: lim(() => noise(0.06, 0.05, 900 + Math.random() * 400)),
    fill: lim(() => noise(0.06, 0.05, 400)),
    hole: lim(() => beep(300, 0.1, "triangle", 0.04, -100)),
    trap: lim(() => arp([880, 660, 880, 660], 0.06, 0.07, "square", 0.035)),
    bash: lim(() => { noise(0.12, 0.14, 300); beep(160, 0.1, "square", 0.05, -60); }),
    fall: lim(() => beep(900, 0.4, "sine", 0.04, -700)),
    kill: lim(() => { noise(0.2, 0.12, 1500); arp([523, 784, 1047], 0.05, 0.1, "square", 0.04); }),
    out: lim(() => arp([220, 330, 440], 0.06, 0.08, "sawtooth", 0.025)),
    step: lim(() => beep(120 + Math.random() * 30, 0.03, "square", 0.012)),
    air: lim(() => beep(1200, 0.05, "sine", 0.03)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    die: () => { noise(0.3, 0.15, 600); for (let i = 0; i < 8; i++) beep(700 - i * 70, 0.1, "triangle", 0.04, 0, i * 0.06); },
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 20000;
  let P = null, aliens = [], ladders = [], holes = [], parts = [], popups = [], message = null;
  let air = 90, airMax = 90, lastBy = "", lastAirTick = 0;
  let digHeld = false, digPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const stars = Array.from({ length: 70 }, (_, i) => ({ x: (i * 97) % W, y: TOP + ((i * 61) % (H - TOP)), s: 1 + (i % 3 === 0 ? 1 : 0), p: i }));

  // ---------- The station ----------
  // ladders[g] = the columns of the ladders between floor g and floor g + 1
  function buildLevel() {
    ladders = [];
    for (let g = 0; g < NF - 1; g++) {
      const cols = [];
      const n = 3;
      for (let k = 0; k < 300 && cols.length < n; k++) {
        const c = 2 + Math.floor(Math.random() * 27);
        if (cols.every((o) => Math.abs(o - c) >= 6) && !(ladders[g - 1] || []).some((o) => Math.abs(o - c) < 2)) cols.push(c);
      }
      // one ladder in each third, so no floor end is far from a way out
      ladders.push(cols.sort((a, b) => a - b));
    }
    holes = FY.map(() => new Array(32).fill(0));
  }
  const ladderAt = (g, c) => g >= 0 && g < NF - 1 && ladders[g].includes(c);
  // a floor column with a ladder opening cannot be dug
  const solidCol = (f, c) => c < C0 || c > C1 || ladderAt(f, c) || ladderAt(f - 1, c) || f === NF - 1;
  const fullHole = (f, c) => f >= 0 && f < NF && c >= 0 && c < 32 && holes[f][c] >= 1;
  const trappedIn = (f, c) => aliens.find((a) => a.state === "trap" && a.f === f && a.c === c);

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function alienMix() {
    const n = Math.min(8, 2 + level), list = [];
    const nb = level >= 2 ? Math.min(3, Math.floor(level / 2)) : 0, nw = level >= 4 ? Math.min(2, Math.floor((level - 2) / 2)) : 0;
    for (let i = 0; i < n; i++) list.push(i < nw ? "bianco" : i < nw + nb ? "verde" : "rosso");
    return list;
  }
  function beginLevel() {
    buildLevel();
    airMax = diff.air;
    aliens = alienMix().map((type, i) => ({ type, hurt: 0, state: "wait", t: 0.6 + i * 0.9, x: 0, y: 0, f: 0, dir: 1, lad: -1, c: 0, angry: 0, wob: rnd(0, TAU) }));
    spawnPlayer();
    message = { text: `LIVELLO ${level}`, sub: "scava, aspetta che ci cadano e colpiscili giù!", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function spawnPlayer() {
    P = { x: colX(15) + 10, y: FY[NF - 1], f: NF - 1, lad: -1, face: 1, walk: 0, safe: 2, fill: 0, lock: false, swing: 0 };
    air = airMax;
    // the aliens that were about go back up to the top floor
    for (const a of aliens) if (a.state !== "dead") {
      if (a.state === "trap") holes[a.f][a.c] = 0;
      Object.assign(a, { state: "wait", t: 0.8 + aliens.indexOf(a) * 0.7, lad: -1 });
    }
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 70, text: "VITA EXTRA!", color: "#5aff8a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play" || P.safe > 0) return;
    lives--; lastBy = by; sfx.die();
    burst(P.x, P.y - 8, "#ffffff", 18, 110, 0.6);
    state = "dead"; stateT = 2;
  }
  function levelDone() {
    const b = Math.ceil(air) * 10;
    addScore(b);
    message = { text: "STAZIONE LIBERATA!", sub: `ossigeno rimasto: ${Math.ceil(air)} × 10 = ${b.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear(); state = "clear"; stateT = 2.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · livello ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PANICO SPAZIALE</h1>
       <p>La stazione è invasa dagli alieni e l'ossigeno sta finendo! Non hai armi, solo una pala: scava una buca nel pavimento, aspetta che un alieno ci cada dentro e colpiscilo prima che riesca a uscire, così precipita al piano di sotto.</p>
       <div class="pts">
         <span><b style="color:#ff4a4a">Rosso</b></span><span>basta una caduta · 100</span>
         <span><b style="color:#4ae05a">Verde</b></span><span>deve cadere per due piani in tutto · 300</span>
         <span><b style="color:#f0f0ff">Bianco</b></span><span>deve cadere per tre piani · 500</span>
         <span><b>Trucchi</b></span><span>scava buche una sopra l'altra per farli cadere di più piani in un colpo (punti × piani) · chi cade schiaccia gli alieni sotto</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per camminare e salire le scale · tieni premuto SCAVA per scavare o riempire una buca, toccalo per colpire l'alieno intrappolato</p>`
         : `<p class="muted help">Frecce o WASD per camminare e salire le scale · tieni premuto SPAZIO (o J, Z) per scavare o riempire, premilo per colpire · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>ALLA STAZIONE!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const DIGKEYS = [" ", "j", "z", "x"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (DIGKEYS.includes(k)) { if (!e.repeat) digPressed = true; digHeld = true; }
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (DIGKEYS.includes(k)) digHeld = false; const m = KEYMAP[k]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; digHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const digBtn = touchEl.querySelector(".jump");

      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(8,8,30,0.6)"; ctx.fillRect(0, 160, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffcc33";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0a0a24"; ctx.strokeText(message.text, W / 2, 187); ctx.fillText(message.text, W / 2, 187);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(message.sub, W / 2, 206); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = lastBy === "air" ? "OSSIGENO FINITO!" : `PRESO DA ${lastBy}!`;
      ctx.strokeText(t, W / 2, 130); ctx.fillText(t, W / 2, 130);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

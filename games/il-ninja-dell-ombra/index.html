<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Il Ninja dell'Ombra</title>
<style>
  :root {
    --bg: #0a0e18;
    --fg: #f4f6ee;
    --muted: #c8d0e8;
    --pink: #ff5a5a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run left and right, push it up to aim the shuriken upwards, down + SALTO drops from a branch; the big COLPO throws (sword when close), the small SALTO leaps */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 90, 90, 0.6); background: radial-gradient(circle, rgba(255,90,90,0.14), rgba(255,90,90,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 90, 90, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 90, 90, 0.9); background: rgba(255, 90, 90, 0.22); }
  #touch .jump.on { background: rgba(255, 90, 90, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 14, 24, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #1a1a4a, 0 0 22px rgba(255,90,90,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0202; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a81a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Salto">SALTO</button><button type="button" class="jump hop" aria-label="Colpo">COLPO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GROUND = 324, GRAV = 1100, JUMP = 600;
  // the way to the castle: the wood, the river, the castle walls, then the tower where the princess is held
  const STAGES = [
    { name: "IL BOSCO", kind: "wood", len: 2600 },
    { name: "IL FIUME", kind: "river", len: 2300 },
    { name: "LE MURA DEL CASTELLO", kind: "wall", len: 2400 },
    { name: "LA TORRE", kind: "tower", len: W },
  ];
  const SEASONS = [
    { name: "PRIMAVERA", leaf: "#e88ab8", leaf2: "#c86a98", grass: "#5aa84a", sky: ["#3a2a5a", "#c88ab0"] },
    { name: "ESTATE", leaf: "#3a8a3a", leaf2: "#2a6a2a", grass: "#4a9a3a", sky: ["#1a3a6a", "#7ab0d8"] },
    { name: "AUTUNNO", leaf: "#e88a2a", leaf2: "#b85a1a", grass: "#8a8a3a", sky: ["#3a1a2a", "#e8905a"] },
    { name: "INVERNO", leaf: "#e8eef8", leaf2: "#b8c8e0", grass: "#d8e0ec", sky: ["#0a1430", "#5a6a9a"] },
  ];
  const FOES = {
    ninja: { hp: 1, speed: 120, pts: 100, col: "#3a5ad8", throwT: [1.3, 2.4] },
    red:   { hp: 1, speed: 150, pts: 200, col: "#d83a3a", throwT: [1, 1.9], double: true },
    monk:  { hp: 2, speed: 50, pts: 300, col: "#c8501a", throwT: [2.2, 3.4], fire: true },
    boss:  { hp: 6, speed: 0, pts: 3000, col: "#8a3ad8", throwT: [1.8, 2.6], boss: true },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · pochi nemici alla volta · shuriken più lenti", lives: 5, maxFoes: 2, spawn: 2.2, shot: 0.8, fan: 1 },
    normale:   { label: "NORMALE",   color: "#ff5a5a", desc: "3 vite · un colpo e sei fuori, come il vero ninja", lives: 3, maxFoes: 3, spawn: 1.6, shot: 1.1, fan: 2 },
    difficile: { label: "DIFFICILE", color: "#ff3a8a", desc: "3 vite · nemici fitti, svelti e precisi", lives: 3, maxFoes: 4, spawn: 1.2, shot: 1.3, fan: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ombra-difficulty";
  const bestKey = (id) => `ombra-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let stageLost = false, deflects = 0, stageKills = 0;
  // the gate at the end of a stretch opens only after this many foes
  const quota = () => 8 + 3 * stage + 2 * lap;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    jump: lim(() => beep(380, 0.1, "triangle", 0.025, 300)),
    throw: lim(() => beep(1400, 0.06, "square", 0.015, -600)),
    slash: lim(() => { beep(900, 0.06, "sawtooth", 0.02, -500); beep(300, 0.05, "square", 0.015); }),
    clang: lim(() => arp([1760, 2349], 0.02, 0.06, "square", 0.03)),
    kill: lim(() => arp([523, 392, 262], 0.04, 0.08, "square", 0.035)),
    fire: lim(() => beep(160, 0.3, "sawtooth", 0.03, 120)),
    land: lim(() => beep(140, 0.03, "triangle", 0.02)),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    boss: () => { beep(110, 0.5, "sawtooth", 0.05, -40); beep(165, 0.5, "square", 0.03, -60); },
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, stage = 0, lap = 0, nextLife = 20000, kills = 0;
  let K = null, foes = [], shots = [], plats = [], parts = [], popups = [], message = null, camX = 0, spawnT = 0, deadT = 0, clearT = 0, bossOn = false, nextId = 1;
  let actHeld = false, wasAct = false, jumpHeld = false, wasJump = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const S = () => STAGES[stage], SEA = () => SEASONS[lap % SEASONS.length];
  const lapK = () => 1 + 0.2 * lap;

  // ---------- Stages ----------
  // one-way ledges (branches, logs, wall steps): you land on them from above, and drop through with down + jump
  function buildStage() {
    plats = []; foes = []; shots = []; camX = 0; spawnT = 1.5; bossOn = false; deflects = 0; stageLost = false; stageKills = 0;
    const st = S();
    if (st.kind === "wood") {
      for (let x = 220; x < st.len - 120; x += rnd(150, 210)) {
        const side = Math.random() < 0.5 ? -1 : 1;
        plats.push({ x: x + side * 40 - 35, y: 236, w: 70, tree: x }, { x: x - side * 40 - 40, y: 160, w: 80, tree: x });
      }
    } else if (st.kind === "river") {
      for (let x = 160; x < st.len - 120; x += rnd(140, 200)) plats.push({ x, y: rnd(244, 262), w: rnd(70, 100), log: true });
      for (let x = 300; x < st.len - 200; x += rnd(320, 420)) plats.push({ x, y: 176, w: 60, rock: true });
    } else if (st.kind === "wall") {
      for (let x = 120; x < st.len - 150; x += rnd(260, 340)) { plats.push({ x, y: 250, w: rnd(160, 220), wall: true }); plats.push({ x: x + 60, y: 176, w: rnd(90, 130), wall: true }); }
    } else {
      plats.push({ x: 70, y: 240, w: 140, wall: true }, { x: W - 210, y: 240, w: 140, wall: true }, { x: W / 2 - 80, y: 165, w: 160, wall: true });
    }
    K = { x: 60, y: GROUND, vx: 0, vy: 0, face: 1, ground: true, drop: 0, slash: 0, inv: 2, anim: 0, cool: 0, dead: false };
    message = { text: `${S().name}`, sub: `${SEA().name}${lap ? ` · giro ${lap + 1}` : ""} · ${st.kind === "tower" ? "il Signore delle Nebbie tiene prigioniera la principessa Kiri" : `sconfiggi ${quota()} nemici e il portale in fondo si apre`}`, t: 0, long: true };
    if (st.kind === "tower") { K.x = 80; startBoss(); }
  }
  function startBoss() {
    const b = addFoe("boss", W - 120, 165 - 0);
    b.hp = Math.round(FOES.boss.hp * lapK()); b.max = b.hp; b.onPlat = true; b.tele = 2;
    bossOn = true; sfx.boss();
  }
  function addFoe(kind, x, y) {
    const F = FOES[kind];
    const e = { id: nextId++, kind, F, x, y, vx: 0, vy: 0, face: -1, hp: F.hp, ground: false, throwT: rnd(1, 2) / diff.shot, anim: 0, seen: new Set(), hit: 0, jumpT: rnd(1, 3), dead: false };
    foes.push(e);
    return e;
  }
  function spawnFoe() {
    const st = S();
    if (st.kind === "tower") return;
    const n = foes.filter((e) => !e.dead).length;
    if (n >= diff.maxFoes + (lap > 0 ? 1 : 0)) return;
    if (K.x > st.len - 260 && stageKills >= quota()) return;
    const r = Math.random(), pMonk = st.kind === "wall" ? 0.35 : st.kind === "river" ? 0.25 : 0.12, pRed = Math.min(0.5, 0.1 + 0.12 * stage + 0.15 * lap);
    const kind = r < pMonk ? "monk" : r < pMonk + pRed ? "red" : "ninja";
    const side = Math.random() < 0.6 ? 1 : -1;
    // ninjas also drop from the treetops
    if (kind !== "monk" && st.kind === "wood" && Math.random() < 0.35) { const e = addFoe(kind, camX + rnd(120, W - 60), TOP - 10); e.vy = 60; return; }
    const x = side > 0 ? camX + W + 20 : Math.max(camX - 20, 0);
    if (x <= 0 && side < 0) return;
    const e = addFoe(kind, x, GROUND); e.ground = true; e.face = -side;
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; lap = 0; nextLife = 20000; kills = 0; deadT = 0; clearT = 0; parts = []; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildStage();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, col = "#ffe8a0") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: `+${n}`, col, t: 0 });
    if (score >= nextLife) { lives++; nextLife += 30000; sfx.oneup(); message = { text: "VITA EXTRA!", t: 0 }; }
  }
  function burst(x, y, col, n = 10) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-120, 120), vy: rnd(-160, 40), t: 0, life: rnd(0.3, 0.6), col }); }
  function stageClear(rescued) {
    if (!stageLost) impresa("illeso");
    const bonus = (rescued ? 5000 : 2000) * (stage + 1) * lapK();
    addScore(Math.round(bonus));
    clearT = rescued ? 4 : 2.6; sfx.clear();
    foes = []; shots = [];
    message = rescued ? { text: "LA PRINCIPESSA È LIBERA!", sub: `bonus ${Math.round(bonus).toLocaleString("it-IT")} · ma il Signore delle Nebbie la rapisce di nuovo…`, t: 0, long: true }
      : { text: "PERCORSO SUPERATO!", sub: `bonus ${Math.round(bonus).toLocaleString("it-IT")}`, t: 0 };
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">IL NINJA È CADUTO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${S().name.toLowerCase()} (${SEA().name.toLowerCase()}) · ${kills} ${kills === 1 ? "nemico sconfitto" : "nemici sconfitti"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>DI NUOVO NEL BOSCO</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>IL NINJA DELL'OMBRA</h1>
       <p>Il Signore delle Nebbie ha rapito la principessa Kiri. Il ninja dell'Ombra attraversa il bosco, il fiume e le mura del castello fino alla torre. Salta altissimo fino ai rami, lancia shuriken e da vicino sfodera la spada, che respinge anche gli shuriken e il fuoco dei nemici. Basta un colpo per cadere, quindi occhi aperti.</p>
       <div class="pts">
         <span><b>Colpo</b></span><span>lancia uno shuriken davanti (con la levetta in su, in diagonale verso l'alto) · se un nemico o un proiettile è vicino, sfodera la spada</span>
         <span><b>Salto</b></span><span>altissimo, fino ai rami e alle sporgenze · giù + SALTO per scendere da un ramo</span>
         <span><b>Nemici</b></span><span>ninja blu e rossi (lanciano shuriken), monaci (sputano fuoco, servono due colpi) e alla torre il Signore delle Nebbie</span>

    ctx.strokeStyle = col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-2, -16); ctx.lineTo(air ? -9 : -4 - s, air ? -6 : 0); ctx.moveTo(2, -16); ctx.lineTo(air ? 9 : 4 + s, air ? -8 : 0); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(6, -16); ctx.lineTo(7, -32); ctx.lineTo(-7, -32); ctx.closePath(); ctx.fill();
    if (opts.robe) { ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(7, -32); ctx.lineTo(-7, -32); ctx.fill(); }
    // arm: thrown forward when attacking
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(2, -29); ctx.lineTo(opts.throwing ? 15 : 8, opts.throwing ? -32 : -20); ctx.stroke();
    ctx.fillStyle = opts.skin || col; ctx.beginPath(); ctx.arc(0, -38, 6.5, 0, TAU); ctx.fill();
    if (opts.mask) { ctx.fillStyle = "#ffd8b0"; ctx.fillRect(1, -40, 6, 3); ctx.fillStyle = "#1a1a1a"; ctx.fillRect(4, -40, 2, 2); }
    if (opts.hair) {
      // Kage's long hair and red headband, streaming behind
      ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.moveTo(-3, -44); ctx.quadraticCurveTo(-18, -44 + Math.sin(clock * 10) * 3, -24, -32 + Math.sin(clock * 8) * 4); ctx.lineTo(-4, -36); ctx.fill();
      ctx.fillStyle = "#e82a2a"; ctx.fillRect(-6, -43, 12, 3); ctx.beginPath(); ctx.moveTo(-6, -42); ctx.lineTo(-16, -40 + Math.sin(clock * 12) * 3); ctx.lineTo(-6, -39); ctx.fill();
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(3, -39, 2, 2);
    }
    if (opts.bald) { ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(0, -38, 6.5, 0, TAU); ctx.fill(); ctx.fillStyle = "#1a1a1a"; ctx.fillRect(3, -39, 2, 2); }
    if (opts.white) { ctx.fillStyle = "#f0f0ff"; ctx.beginPath(); ctx.moveTo(-6, -44); ctx.lineTo(-16, -26); ctx.lineTo(-2, -36); ctx.fill(); }
    if (opts.slash) {
      ctx.strokeStyle = "rgba(220,240,255,0.9)"; ctx.lineWidth = 3;
      const k = 1 - opts.slash / 0.22;
      ctx.beginPath(); ctx.arc(4, -26, 34, -1.4 + k * 1.6, -0.2 + k * 1.6); ctx.stroke();
      ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, -24); ctx.lineTo(8 + Math.cos(-1 + k * 2) * 28, -24 + Math.sin(-1 + k * 2) * 28); ctx.stroke();
    }
    ctx.restore();
  }
  function drawShot(s) {
    const x = s.x - camX;
    if (s.kind === "fire") {
      const g = ctx.createRadialGradient(x, s.y, 1, x, s.y, 9); g.addColorStop(0, "#ffffa0"); g.addColorStop(0.5, "#ff8a2a"); g.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, s.y, 9, 0, TAU); ctx.fill(); return;
    }
    ctx.save(); ctx.translate(x, s.y); ctx.rotate(s.t * 25);
    ctx.fillStyle = s.mine ? "#e8e8f0" : "#ffd23a";
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 2 : 6, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.fill();
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(10,14,24,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8d0e8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 82, 9);
    ctx.fillStyle = "#ff5a5a"; ctx.font = "900 9px system-ui"; ctx.fillText(`${S().name} · ${SEA().name}`, x0 + 82, 20);
    ctx.font = "900 9px system-ui"; const lw = ctx.measureText(`${S().name} · ${SEA().name}`).width;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 11px system-ui"; ctx.fillText(`♥ ${lives}`, Math.max(x0 + 200, x0 + 82 + lw + 14), 14);
    // how far along the stretch, or the master's strength
    const bx = touchMode ? W - 230 : W - 180;
    if (S().kind !== "tower") {
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 11, 150, 6);
      ctx.fillStyle = "#ff5a5a"; ctx.fillRect(bx, 11, 150 * clamp(K.x / S().len, 0, 1), 6);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(bx + 150 * clamp(K.x / S().len, 0, 1) - 1, 8, 3, 12);
      const q = quota(), done = stageKills >= q;
      ctx.fillStyle = done ? "#7aff7a" : "#ffffff"; ctx.font = "900 9px system-ui"; ctx.textAlign = "right"; ctx.fillText(done ? "PORTALE APERTO ✓" : `NEMICI ${stageKills}/${q}`, bx - 8, 14); ctx.textAlign = "left";
    } else {
      const b = foes.find((e) => e.F.boss && !e.dead);
      ctx.fillStyle = "#ffffff"; ctx.font = "900 8px system-ui"; ctx.fillText("SIGNORE DELLE NEBBIE", bx, 7);
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 13, 150, 6);
      if (b) { ctx.fillStyle = "#c88aff"; ctx.fillRect(bx, 13, 150 * b.hp / b.max, 6); }
    }
    ctx.textBaseline = "alphabetic";
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#0a0e18"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!K) { buildStage(); message = null; addFoe("ninja", 420, GROUND).ground = true; const m = addFoe("monk", 560, GROUND); m.ground = true; }
    drawScenery();
    for (const e of foes) {
      if (e.dead && Math.floor(clock * 14) % 2) continue;
      const o = { run: e.anim, air: !e.ground, throwing: e.throwT > 0 && e.throwT < 0.2 };
      if (e.kind === "monk") Object.assign(o, { robe: true, bald: true, big: 1.1 });
      else if (e.F.boss) Object.assign(o, { mask: true, white: true, big: 1.25, throwing: e.throwT < 0.3 });
      else o.mask = true;
      ctx.globalAlpha = e.hit > 0 ? 0.5 : 1;
      drawFigure(e.x, e.y, e.face, e.F.col, o);
      ctx.globalAlpha = 1;
    }
    if (K && !(K.inv > 0 && Math.floor(clock * 14) % 2) && !(K.dead && Math.floor(clock * 10) % 2)) drawFigure(K.x, K.y, K.face, "#2a8a4a", { run: K.anim, air: !K.ground, hair: true, skin: "#ffd8b0", throwing: K.throwT > 0, slash: K.slash > 0 ? K.slash : 0 });
    for (const s of shots) drawShot(s);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - camX - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); outlined(p.text, p.x - camX, p.y, "900 11px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const lifeT = message.long ? 3.2 : 2.2;
      ctx.globalAlpha = Math.min(1, (lifeT - message.t) * 2);
      ctx.textAlign = "center"; outlined(message.text, W / 2, 96, "italic 900 26px system-ui", "#ff5a5a", 6);
      if (message.sub) outlined(message.sub, W / 2, 118, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="ombra-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Strada di Ruggine</title>
<style>
  :root {
    --bg: #1e120c;
    --fg: #f4f6ee;
    --muted: #c8d0dc;
    --gold: #ffb03a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2e1e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(30, 16, 10, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #6a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  #overlay .hero { display: flex; gap: 18px; align-items: center; max-width: 600px; text-align: left; }
  #overlay .hero svg { flex: 0 0 132px; width: 132px; height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  #overlay .quote { font-style: italic; color: #ffcf9a; }
  @media (max-width: 520px) { #overlay .hero { flex-direction: column; text-align: center; gap: 8px; } #overlay .hero svg { width: 104px; flex-basis: auto; } }
  @media (max-height: 560px) {
    #overlay .hero svg { display: none; }
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "4 auto · i colpi fanno meno male · predoni più rari e più lenti", lives: 4, dmg: 0.6, rate: 0.75, espd: 0.9, boss: 0.75 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "3 auto · la strada come deve essere", lives: 3, dmg: 1, rate: 1, espd: 1, boss: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "3 auto · colpi più duri · predoni più numerosi e veloci · capibanda più resistenti", lives: 3, dmg: 1.35, rate: 1.3, espd: 1.12, boss: 1.25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ruggine-difficulty";
  const bestKey = (id) => `ruggine-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const nf = (n) => Math.floor(n).toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // ---------- The five stretches of road ----------
  const STAGES = [
    { name: "Le Piane di Sale", quote: "La strada è lunga e la benzina è poca. Tieni gli occhi aperti.", len: 15000, hw: 114, a1: 60, f1: 0.0011, a2: 22, f2: 0.0029, wall: false,
      sand: ["#e2b07a", "#d29a62"], road: "#4c403a", mix: { corvo: 1, spinoso: 0, moto: 0, camion: 0 }, rate: 0.55, objs: { rock: 0.25, wreck: 0.1, can: 0.22, crate: 0.12, wrench: 0.06, nitro: 0.06 },
      boss: { name: "La Mietitrice", hp: 26, body: "#6a4a3a", accent: "#c8a050" } },
    { name: "Il Canyon delle Ossa", quote: "Nel canyon gli echi mentono. I Corvi no: arrivano sempre.", len: 16000, hw: 86, a1: 46, f1: 0.0016, a2: 18, f2: 0.0041, wall: true,
      sand: ["#c87a52", "#b0663e"], road: "#4a3832", mix: { corvo: 1, spinoso: 0, moto: 0.8, camion: 0 }, rate: 0.62, objs: { rock: 0.3, wreck: 0.06, can: 0.22, crate: 0.12, wrench: 0.06, nitro: 0.05 },
      boss: { name: "Il Rostro", hp: 34, body: "#5a3a3a", accent: "#d0d0d8" } },
    { name: "La Tempesta Rossa", quote: "Quando il cielo diventa rosso, guida col cuore.", len: 14000, hw: 106, a1: 55, f1: 0.0012, a2: 24, f2: 0.0033, wall: false, storm: true,
      sand: ["#c86a42", "#b25a36"], road: "#40322e", mix: { corvo: 1, spinoso: 0.6, moto: 0.6, camion: 0 }, rate: 0.62, objs: { rock: 0.22, wreck: 0.1, can: 0.24, crate: 0.12, wrench: 0.07, nitro: 0.05 },
      boss: { name: "Il Mangiavento", hp: 40, body: "#4a3a44", accent: "#e86a3a" } },
    { name: "La Raffineria", quote: "Lo Sciacallo vive di benzina. Andiamo a prendergli la sua.", len: 16000, hw: 102, a1: 40, f1: 0.0014, a2: 20, f2: 0.0037, wall: false, oil: true,
      sand: ["#8a7a6a", "#7a6a5a"], road: "#38302c", mix: { corvo: 1, spinoso: 0.8, moto: 0.5, camion: 0.5 }, rate: 0.7, objs: { rock: 0.1, wreck: 0.12, can: 0.24, crate: 0.13, wrench: 0.07, nitro: 0.06, slick: 0.2, barrel: 0.18 },
      boss: { name: "La Torcia", hp: 46, body: "#3a3a3a", accent: "#ff8a2a" } },
    { name: "La Strada per l'Oasi", quote: "L'Oasi esiste. E nessuno me la toglierà.", len: 17000, hw: 96, a1: 58, f1: 0.0015, a2: 24, f2: 0.0039, wall: true,
      sand: ["#d8a46a", "#c48e56"], road: "#463a34", mix: { corvo: 1, spinoso: 0.8, moto: 0.8, camion: 0.6 }, rate: 0.78, objs: { rock: 0.24, wreck: 0.08, can: 0.24, crate: 0.13, wrench: 0.07, nitro: 0.06, slick: 0.06, barrel: 0.08 },
      boss: { name: "Il Mastino dello Sciacallo", hp: 64, body: "#2a2a30", accent: "#e8c040", final: true } },
  ];
  const KINDS = {
    corvo: { w: 24, h: 40, hp: 2, dmg: 10, pts: 150 },
    spinoso: { w: 28, h: 44, hp: 4, dmg: 18, pts: 300 },
    moto: { w: 12, h: 30, hp: 1, dmg: 6, pts: 200 },
    camion: { w: 36, h: 72, hp: 7, dmg: 16, pts: 500 },
  };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), pauseBtn = document.getElementById("pauseBtn");
  const WW = 360;
  let W = 360, H = 640, VH = 640, OX = 0, portrait = true, pxRatio = 1;
  let touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  let pads = [];
  function resize() {
    portrait = window.innerHeight > window.innerWidth * 1.05;
    W = portrait ? 360 : 640; H = portrait ? 640 : 360; VH = H; OX = portrait ? 0 : 140;
    pads = portrait ? [{ id: "nitro", x: 54, y: 588, r: 34 }, { id: "fire", x: 304, y: 580, r: 42 }]
                    : [{ id: "nitro", x: 70, y: 296, r: 38 }, { id: "fire", x: 570, y: 290, r: 44 }];
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio); canvas.height = Math.round(H * pxRatio);
    if (P) { P.y = clamp(P.y, yMin(), yMax()); P.ty = clamp(P.ty, yMin(), yMax()); }
  }
  const yMin = () => portrait ? VH * 0.42 : VH * 0.45;
  const yMax = () => portrait ? VH - 120 : VH - 50;
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio: war drums, a growling bass and the engine ----------
  let audioCtx = null, music = true, engine = null;
  music = load("ruggine-music") !== "0";
  function tone(freq, dur, type = "square", vol = 0.03, delay = 0, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, freq, vol, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay, n = Math.floor(audioCtx.sampleRate * dur), b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(audioCtx.destination); s.start(t);
  }
  const sfx = {
    shoot: () => { tone(900, 0.08, "triangle", 0.03, 0, 300); noise(0.05, 3000, 0.04); },
    hit: () => tone(240, 0.06, "square", 0.03, 0, 120),
    crash: () => { noise(0.25, 900, 0.18); tone(90, 0.2, "sawtooth", 0.04, 0, 50); },
    boom: () => { noise(0.7, 500, 0.3); tone(70, 0.5, "sine", 0.08, 0, 30); },
    pick: () => [660, 880].forEach((f, i) => tone(f, 0.08, "square", 0.025, i * 0.06)),
    fuel: () => [392, 523, 659].forEach((f, i) => tone(f, 0.09, "triangle", 0.04, i * 0.05)),
    nitro: () => { noise(0.8, 2500, 0.12); tone(120, 0.8, "sawtooth", 0.04, 0, 400); },
    lob: () => tone(500, 0.3, "triangle", 0.02, 0, 200),
    flame: () => noise(0.3, 1800, 0.06),
    warn: () => { tone(880, 0.12, "square", 0.025); tone(880, 0.12, "square", 0.025, 0.2); },
    boss: () => { tone(82, 0.6, "sawtooth", 0.05); tone(78, 0.8, "sawtooth", 0.05, 0.3); },
    clear: () => [392, 494, 587, 784].forEach((f, i) => tone(f, 0.3, "sawtooth", 0.03, i * 0.13)),
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, "triangle", 0.04, i * 0.15)),
  };
  // E minor, heavy and steady: drums every beat, a riff on top
  const RIFF = [40, 0, 40, 43, 40, 0, 45, 43, 40, 0, 40, 47, 45, 43, 38, 0];
  const DRUM = ["K", "", "T", "", "K", "K", "T", "", "K", "", "T", "", "K", "T", "T", "T"];
  let beat = 0, nextBeat = 0;
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  setInterval(() => {
    if (!audioCtx || audioCtx.state !== "running") return;
    if (engine) { const on = music && (state === "play" || state === "boss"); engine.g.gain.setTargetAtTime(on ? 0.018 : 0.0001, audioCtx.currentTime, 0.1); engine.o.frequency.setTargetAtTime(38 + pSpeed * 0.11, audioCtx.currentTime, 0.1); engine.o2.frequency.setTargetAtTime(39.5 + pSpeed * 0.11, audioCtx.currentTime, 0.1); }
    if (!music || !["play", "boss", "intro"].includes(state)) { nextBeat = audioCtx.currentTime + 0.05; return; }
    const step = state === "boss" ? 0.13 : 0.15;
    while (nextBeat < audioCtx.currentTime + 0.15) {
      const k = beat % 16, d = Math.max(0, nextBeat - audioCtx.currentTime), dr = DRUM[k];
      if (dr === "K") tone(110, 0.25, "sine", 0.09, d, 40);
      if (dr === "T") { tone(150, 0.18, "triangle", 0.05, d, 90); noise(0.08, 1200, 0.05, d); }
      if (RIFF[k] && state !== "intro") tone(midi(RIFF[k] + (beat % 64 >= 48 ? 3 : 0)), step * 1.6, "sawtooth", 0.022, d);
      beat++; nextBeat += step;
    }
  }, 50);
  function startEngine() {
    if (!audioCtx || engine) return;
    const o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    o.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 420; g.gain.value = 0.0001;
    o.connect(f); o2.connect(f); f.connect(g).connect(audioCtx.destination); o.start(); o2.start(); engine = { o, o2, g };
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0, stateT = 0;
  let score = 0, lives = 0, stg = 0, ST = STAGES[0], dist = 0, pSpeed = 200, shake = 0, flash = 0;
  let P = null, enemies = [], objs = [], bolts = [], lobs = [], parts = [], texts = [], B = null;
  let spawnWy = 0, enemyT = 2, rams = 0, damagedThisStage = false, clearInfo = null, fireCD = 0, bossWarn = 0;
  const isPlaying = () => ["intro", "play", "boss", "dead", "clear", "victory"].includes(state);

  // ---------- The road ----------
  function roadC(wy) { const c = WW / 2 + ST.a1 * Math.sin(wy * ST.f1) + ST.a2 * Math.sin(wy * ST.f2 + 1.3); const hw = roadHW(wy); return clamp(c, hw + 30, WW - hw - 30); }
  function roadHW(wy) { return ST.hw + 12 * Math.sin(wy * 0.0007 + stg); }
  const wyAt = (y) => dist + (VH - y);
  const yAt = (wy) => VH - (wy - dist);
  const edgeOf = (wy) => ST.wall ? roadHW(wy) + 20 : 999;

  // ---------- Starting ----------
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    startEngine();
    score = 0; lives = diff.lives; rams = 0; stg = 0;
    P = { x: 180, y: 0, ty: 0, tx: 180, w: 26, h: 46, armor: 100, fuel: 100, ammo: 14, nitros: 1, nitroT: 0, inv: 0, spin: 0, slow: 0, hitCD: 0, wallCD: 0 };
    startStage(0); menu = null; overlay.classList.add("hidden"); syncControls(); lastT = performance.now();
  }
  function startStage(n) {
    stg = n; ST = STAGES[n]; dist = 0; enemies = []; objs = []; bolts = []; lobs = []; parts = []; texts = []; B = null;
    spawnWy = VH + 100; enemyT = 3; damagedThisStage = false; bossWarn = 0;
    P.y = P.ty = lerp(yMin(), yMax(), 0.6); P.x = P.tx = roadC(wyAt(P.y)); P.fuel = Math.max(P.fuel, 70); P.nitroT = 0; P.spin = 0; P.slow = 0;
    // scatter the first stretch
    while (spawnWy < dist + VH * 2) spawnSlot(true);
    state = "intro"; stateT = 0;
  }

  // ---------- Spawning ----------
  function pick(weights) { let tot = 0; for (const k in weights) tot += weights[k]; let r = Math.random() * tot; for (const k in weights) { r -= weights[k]; if (r <= 0) return k; } return null; }
  function spawnSlot(early) {
    const wy = spawnWy; spawnWy += rnd(55, 110);
    const c = roadC(wy), hw = roadHW(wy);
    // something by the roadside
    if (Math.random() < 0.7) {
      const side = Math.random() < 0.5 ? -1 : 1, off = ST.wall ? 0 : rnd(20, 90);
      const deco = ST.oil ? pick({ pipe: 1, tower: 0.4, bones: 0.3 }) : ST.wall ? pick({ bones: 1, totem: 0.5 }) : pick({ bones: 1, cactus: 0.8, totem: 0.4, husk: 0.3 });
      const x = c + side * (hw + 20 + off);
      if (x > -20 && x < WW + 20) objs.push({ type: deco, wy, x, side, seed: Math.random() });
    }
    if (early && wy < VH + 200) return;
    if (B && Math.random() < 0.6) return;
    if (Math.random() > 0.62) return;
    const type = pick(ST.objs); if (!type) return;
    const x = c + rnd(-1, 1) * (hw - 22);
    const o = { type, wy, x, seed: Math.random() };
    o.r = { rock: rnd(13, 19), wreck: 18, can: 10, crate: 10, wrench: 10, nitro: 10, slick: rnd(18, 26), barrel: 10 }[type] || 10;
    objs.push(o);
  }
  function spawnEnemy(kind) {
    const k = KINDS[kind], fromBehind = kind !== "camion";
    const y = fromBehind ? VH + 60 : -90, wy = wyAt(y), c = roadC(wy);
    const e = { kind, ...k, maxHp: k.hp, x: c + rnd(-0.6, 0.6) * roadHW(wy), y, spd: fromBehind ? pSpeed + 140 : 150, vx: 0, kick: 0, t: 0, mode: "pace", side: Math.random() < 0.5 ? -1 : 1, next: rnd(1, 2.5), oy: rnd(-30, 30), drops: 0, throws: 0, rammedT: 0, flashT: 0, cd: rnd(1, 2), lane: rnd(-0.5, 0.5) };
    enemies.push(e);
  }

  // ---------- Damage ----------
  function hurt(n, x, y) {
    if (P.inv > 0 || state === "dead") return;
    if (P.nitroT > 0) n *= 0.5;
    P.armor -= n * diff.dmg; damagedThisStage = true; shake = Math.max(shake, 0.25); flash = 0.25;
    if (x !== undefined) spark(x, y, "#ffd27a", 8);
    if (P.armor <= 0) { P.armor = 0; wreck("La Cobra è a pezzi"); }
  }
  function wreck(why) {
    if (state === "dead") return;
    explode(P.x, P.y, 1.6); state = "dead"; stateT = 0; clearInfo = { why }; P.nitroT = 0;
  }
  function explode(x, y, size = 1) {
    sfx.boom(); shake = Math.max(shake, 0.35 * size);
    for (let k = 0; k < 26 * size; k++) { const a = Math.random() * TAU, s = rnd(40, 220) * size; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.4, 0.9), c: ["#ffd23a", "#ff8a2a", "#ff4a1a", "#3a2a22"][k % 4], s: rnd(3, 7) * size, drag: 0.92 }); }
    for (let k = 0; k < 8 * size; k++) parts.push({ x: x + rnd(-10, 10), y: y + rnd(-10, 10), vx: rnd(-20, 20), vy: rnd(-40, 0), t: 0, life: rnd(1, 1.8), c: "rgba(40,30,26,0.6)", s: rnd(10, 18) * size, smoke: true, drag: 0.96 });
  }
  function spark(x, y, c, n) { for (let k = 0; k < n; k++) { const a = Math.random() * TAU; parts.push({ x, y, vx: Math.cos(a) * rnd(60, 180), vy: Math.sin(a) * rnd(60, 180), t: 0, life: 0.35, c, s: 2.5, drag: 0.9 }); } }
  function popText(x, y, text, c = "#fff") { texts.push({ x, y, text, c, t: 0 }); }
  function killEnemy(e, rammed) {
    e.dead = true; explode(e.x, e.y, e.kind === "camion" ? 1.4 : 1);

  // ---------- Update ----------

    for (const [t, f, c] of lines) { ctx.font = f; for (const l of wrap(t, w - 28)) rows.push([l, f, c, parseInt(f.match(/(\d+)px/)[1], 10) + 9]); }
    const h = 28 + rows.reduce((a, r) => a + r[3], 0) + (sub ? 26 : 0), x = OX + WW / 2 - w / 2, y = VH * 0.28;
    ctx.fillStyle = "rgba(24,12,8,0.88)"; rr(x, y, w, h, 12); ctx.fill(); ctx.strokeStyle = "rgba(255,176,58,0.6)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    let yy = y + 14; for (const [t, f, c, lh] of rows) { ctx.font = f; ctx.fillStyle = c; ctx.fillText(t, OX + WW / 2, yy + lh / 2); yy += lh; }
    if (sub) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); ctx.fillStyle = "#ffb03a"; ctx.font = "700 12px system-ui, sans-serif"; ctx.fillText(sub, OX + WW / 2, y + h - 18); ctx.globalAlpha = 1; }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#1e120c"; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(OX, 0); ctx.beginPath(); ctx.rect(0, 0, WW, VH); ctx.clip();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 18, (Math.random() - 0.5) * shake * 18);
    drawWorld();
    ctx.restore();
    drawHUD();
    const go = touchMode ? "tocca per continuare" : "Spazio per continuare";
    if (state === "intro") card([[`TRATTO ${stg + 1} DI 5`, "700 11px system-ui, sans-serif", "#c8a080"], [ST.name, "900 20px system-ui, sans-serif", "#ffb03a"], [`«${ST.quote}»`, "italic 600 11px system-ui, sans-serif", "#ffe0c0"]], stateT > 0.5 ? (touchMode ? "tocca per partire" : "Spazio per partire") : null);
    if (state === "clear" && stateT > 0.6) card([["TRATTO SUPERATO", "900 20px system-ui, sans-serif", "#ffb03a"], [`Benzina avanzata +${nf(clearInfo.fb)} · corazza +${nf(clearInfo.ab)}`, "600 12px system-ui, sans-serif", "#fff"], [stg < 4 ? "Mariky ripara la Cobra: +25 di corazza" : "In fondo alla strada, qualcosa di verde…", "italic 600 11px system-ui, sans-serif", "#ffe0c0"]], stateT > 1.8 ? go : null);
    if (state === "dead" && stateT > 0.6) card([[clearInfo.why.toUpperCase(), "900 18px system-ui, sans-serif", "#ff5a3a"], [lives > 1 ? `Mariky esce dalle lamiere. Restano ${lives - 1} auto` : "Era l'ultima auto…", "600 12px system-ui, sans-serif", "#fff"]]);
    if (state === "victory" && stateT > 1.5) card([["L'OASI DELLE RONDINI", "900 20px system-ui, sans-serif", "#7ee0a0"], ["«Le rondini tornano dove c'è acqua.»", "italic 600 12px system-ui, sans-serif", "#ffe0c0"], [`Auto rimaste: +${nf(clearInfo.lb)}`, "600 12px system-ui, sans-serif", "#fff"]], stateT > 2.5 ? go : null);
  }

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  function demo() { P = { x: 180, y: 0, ty: 0, tx: 180, w: 26, h: 46, armor: 100, fuel: 100, ammo: 14, nitros: 1, nitroT: 0, inv: 0, spin: 0, slow: 0, hitCD: 0, wallCD: 0 }; ST = STAGES[0]; P.y = lerp(yMin(), yMax(), 0.6); dist = 0; spawnWy = VH + 100; while (spawnWy < dist + VH * 2) spawnSlot(false); state = "menu"; }
  resize(); demo();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

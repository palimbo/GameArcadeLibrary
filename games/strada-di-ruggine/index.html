<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Strada di Ruggine</title>
<style>
  :root {
    --bg: #1e120c;
    --fg: #f4f6ee;
    --muted: #c8d0dc;
    --gold: #ffb03a;
    --red: #ff5a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2e1e, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(30, 16, 10, 0.94);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--gold);
    text-shadow: 3px 3px 0 #6a1a1a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h1 span { color: #fff; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--gold); color: #2a1a02; background: var(--gold); padding: 11px 30px; box-shadow: 0 4px 0 #a87a0a; }
  #overlay .hero { display: flex; gap: 18px; align-items: center; max-width: 600px; text-align: left; }
  #overlay .hero svg { flex: 0 0 132px; width: 132px; height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  #overlay .quote { font-style: italic; color: #ffcf9a; }
  @media (max-width: 520px) { #overlay .hero { flex-direction: column; text-align: center; gap: 8px; } #overlay .hero svg { width: 104px; flex-basis: auto; } }
  #overlay.wide { justify-content: flex-start; background: rgba(30,16,10,0.975); }
  #overlay.wide ~ #homeLink { display: none; }
  #overlay.wide > :first-child { margin-top: 0; }
  #overlay .panel { width: min(860px, 100%); text-align: left; display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
  #overlay .tabs { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: 0; background: rgba(30,16,10,0.97); padding: 6px 0; z-index: 2; }
  #overlay .tabs button { padding: 7px 12px; font-size: 13px; }
  #overlay .tabs button.on { border-color: var(--gold); color: var(--gold); }
  #overlay .tabs .close { margin-left: auto; }
  #overlay h3 { font-size: 14px; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; margin-top: 6px; }
  #overlay .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  #overlay .rcard, #overlay .wcard { display: flex; flex-direction: column; gap: 4px; background: rgba(255,240,220,0.06); border: 1px solid rgba(255,190,120,0.18); border-radius: 10px; padding: 9px 10px; font-size: 12px; }
  #overlay .wcard { border-left: 4px solid var(--rc); }
  #overlay .wcard.empty { color: var(--muted); justify-content: center; min-height: 60px; }
  #overlay .rcard.dim { opacity: 0.62; }
  #overlay .rcard b, #overlay .wcard b { font-size: 13px; }
  #overlay .rcard .d, #overlay .wcard .st, #overlay .wcard .rar { color: var(--muted); line-height: 1.35; }
  #overlay .wcard i { color: #ffcf9a; }
  #overlay .costs { display: flex; flex-wrap: wrap; gap: 4px; }
  #overlay .chip { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.3); }
  #overlay .chip.ok { color: #7ee0a0; } #overlay .chip.no { color: #ff8a6a; }
  #overlay .rcard button, #overlay .wcard button { font-size: 11px; padding: 6px 8px; letter-spacing: 0.5px; }
  #overlay .rcard button:disabled, #overlay .wcard button:disabled { opacity: 0.55; cursor: default; }
  #overlay .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  #overlay .resline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; background: rgba(0,0,0,0.25); padding: 8px 10px; border-radius: 8px; }
  #overlay .journal { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  #overlay .q { display: flex; flex-direction: column; gap: 2px; } #overlay .q span { color: var(--muted); }
  #overlay .q.done b { color: #7ee0a0; } #overlay .q.cur b { color: var(--gold); } #overlay .q.next b { color: rgba(255,255,255,0.35); }
  #overlay #bigmap { width: min(512px, 100%); height: auto; align-self: center; border-radius: 10px; border: 2px solid rgba(255,176,58,0.4); }
  @media (max-height: 560px) {
    #overlay .hero svg { display: none; }
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>



<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => Math.floor(rnd(a, b + 1));
  const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const nf = (n) => Math.floor(n).toLocaleString("it-IT");
  const feat = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function unstore(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } }

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "i nemici fanno meno male · sete e fame più lente · da morta perdi poco", dmg: 0.6, hp: 0.8, drain: 0.7, loss: 0.15, mult: 1 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "il deserto com'è: duro ma giusto", dmg: 1, hp: 1, drain: 1, loss: 0.3, mult: 2 },
    difficile: { label: "DIFFICILE", color: "#ff5a4a", desc: "nemici più duri e cattivi · sete e fame più rapide · da morta perdi metà dello zaino", dmg: 1.4, hp: 1.25, drain: 1.3, loss: 0.5, mult: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ruggine-difficulty", SAVE_KEY = "ruggine-save-v2";
  const bestKey = (id) => `ruggine-best-${id}`;
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];

  // ---------- Things you can carry ----------
  const RES = {
    rottami: { name: "Rottami", color: "#a8a8b0" }, legno: { name: "Legno", color: "#b07a42" }, stoffa: { name: "Stoffa", color: "#d86a5a" },
    ossa: { name: "Ossa", color: "#efe2c8" }, benzina: { name: "Benzina", color: "#ffb03a" }, circuiti: { name: "Circuiti", color: "#5ae0a0" }, polvere: { name: "Polvere da sparo", color: "#8a8a98" },
  };
  const RES_IDS = Object.keys(RES);
  const RARITY = [
    { name: "Comune", color: "#e8e4dc" }, { name: "Non comune", color: "#6ade5a" }, { name: "Rara", color: "#4aa8ff" },
    { name: "Epica", color: "#c07aff" }, { name: "Leggendaria", color: "#ff9a2a" },
  ];
  const ELEM = { fuoco: { name: "Fuoco", color: "#ff7a2a" }, shock: { name: "Elettrico", color: "#6ad8ff" }, acido: { name: "Acido", color: "#a8f03a" } };
  // weapon bases: melee or with a kind of ammo
  const BASES = {
    pugni:        { name: "Pugni", g: "m", melee: true, dmg: 6, rate: 0.42, range: 28 },
    spranga:      { name: "Spranga", g: "f", melee: true, dmg: 13, rate: 0.48, range: 36 },
    machete:      { name: "Machete", g: "m", melee: true, dmg: 19, rate: 0.42, range: 38 },
    balestra:     { name: "Balestra", g: "f", ammo: "dardi", dmg: 28, rate: 0.75, speed: 540, spread: 0.02, range: 420 },
    pistola:      { name: "Pistola", g: "f", ammo: "proiettili", dmg: 14, rate: 0.3, speed: 660, spread: 0.06, range: 400 },
    doppietta:    { name: "Doppietta", g: "f", ammo: "proiettili", dmg: 7, pellets: 6, rate: 0.85, speed: 560, spread: 0.32, range: 220 },
    mitraglietta: { name: "Mitraglietta", g: "f", ammo: "proiettili", dmg: 7, rate: 0.1, speed: 640, spread: 0.13, range: 360 },
    lanciafiamme: { name: "Lanciafiamme", g: "m", ammo: "benzina", per: 0.04, dmg: 4, rate: 0.05, speed: 300, spread: 0.25, range: 140, elem: "fuoco" },
  };
  const ADJ = {
    dmg: [["Rabbioso", "Rabbiosa"], ["Brutale", "Brutale"], ["Pesante", "Pesante"]], rate: [["Frenetico", "Frenetica"], ["Svelto", "Svelta"]], spread: [["Preciso", "Precisa"], ["Puntiglioso", "Puntigliosa"]],
    fuoco: [["Ardente", "Ardente"]], shock: [["Elettrico", "Elettrica"]], acido: [["Corrosivo", "Corrosiva"]], plain: [["Arrugginito", "Arrugginita"], ["Rattoppato", "Rattoppata"], ["Fidato", "Fidata"]],
  };
  const LEGENDS = [
    { base: "pistola", name: "Nonna Tuono", quip: "Ai miei tempi si sparava a piedi, e in salita." },
    { base: "balestra", name: "La Rondine", quip: "Torna sempre a casa. Il dardo no." },
    { base: "doppietta", name: "Il Ragionevole Dubbio", quip: "Dopo di lei, nessun dubbio." },
    { base: "mitraglietta", name: "Brontolona", quip: "Si lamenta di tutto, ma non sbaglia un colpo." },
    { base: "machete", name: "Sputacactus", quip: "Punge come il deserto, e non chiede scusa." },
    { base: "lanciafiamme", name: "Il Barbecue della Domenica", quip: "Invitati: tutti. Sopravvissuti: pochi." },
  ];
  function rollRarity(lvl, bonus = 0) {
    const r = Math.random() - bonus;
    if (r < 0.012 + lvl * 0.004) return 4; if (r < 0.05 + lvl * 0.01) return 3; if (r < 0.16 + lvl * 0.015) return 2; if (r < 0.42) return 1; return 0;
  }
  function makeWeapon(base, rarity, lvl = 1, forceLegend) {
    const B = BASES[base], m = [1, 1.2, 1.45, 1.75, 2.2][rarity] * (1 + 0.12 * (lvl - 1));
    const w = { base, rarity, lvl, dmg: B.dmg * m * rnd(0.9, 1.1), rate: B.rate * rnd(0.88, 1.08), spread: (B.spread || 0) * rnd(0.7, 1.15), elem: B.elem || null };
    if (!w.elem && !B.melee && Math.random() < [0, 0.15, 0.35, 0.6, 1][rarity]) w.elem = pickOne(["fuoco", "shock", "acido"]);
    if (B.melee && rarity >= 3 && Math.random() < 0.6) w.elem = pickOne(["fuoco", "shock", "acido"]);
    if (rarity === 4) { const L = LEGENDS.find((l) => l.base === base) || forceLegend; if (L) { w.name = L.name; w.quip = L.quip; w.dmg *= 1.15; } }
    if (base === "pugni") w.name = "Pugni";
    if (!w.name) {
      const g = B.g === "f" ? 1 : 0, sc = { dmg: w.dmg / (B.dmg * m), rate: B.rate / w.rate, spread: B.spread ? (B.spread / Math.max(0.001, w.spread)) : 0 };
      let key = w.elem || (rarity === 0 ? "plain" : Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0]);
      w.name = `${B.name} ${pickOne(ADJ[key])[g]}`;
    }
    return w;
  }

  // ---------- The world ----------
  const T = 32, N = 128;
  const TL = { SABBIA: 0, DUNA: 1, ROCCIA: 2, GHIAIA: 3, SALE: 4, STRADA: 5, MURO: 6, PAV: 7, ACQUA: 8, ERBA: 9 };
  const BLOCK = new Set([TL.ROCCIA, TL.MURO, TL.ACQUA]);
  let tiles = new Uint8Array(N * N), seen = new Uint8Array(N * N), seed = 1;
  const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= N || ty >= N ? TL.ROCCIA : tiles[ty * N + tx]);
  const tileAtW = (x, y) => tileAt(Math.floor(x / T), Math.floor(y / T));
  const blockedAt = (x, y) => BLOCK.has(tileAtW(x, y));
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function makeNoise(rng, size = 64) {
    const g = new Float32Array(size * size); for (let i = 0; i < g.length; i++) g[i] = rng();
    const v = (i, j) => g[(((j % size) + size) % size) * size + (((i % size) + size) % size)], s = (t) => t * t * (3 - 2 * t);
    return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), u = s(x - xi), w = s(y - yi), a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w; };
  }
  // the places on the map
  let POIS = [];
  const POI_DEF = [
    { id: "start", name: "Il relitto della Cobra", x: 64, y: 112, r: 5, kind: "start" },
    { id: "pozzo", name: "Il Pozzo Storto", x: 56, y: 100, r: 3, kind: "pozzo" },
    { id: "discarica", name: "La Discarica", x: 28, y: 92, r: 9, kind: "discarica" },
    { id: "stazione", name: "La Stazione", x: 62, y: 78, r: 8, kind: "town" },
    { id: "borgo", name: "Borgo Polvere", x: 98, y: 98, r: 8, kind: "town" },
    { id: "miniera", name: "La Miniera di Sale", x: 22, y: 58, r: 8, kind: "town" },
    { id: "covo1", name: "Il Covo del Dente", x: 102, y: 64, r: 7, kind: "covo" },
    { id: "covo2", name: "Il Covo della Gola", x: 28, y: 32, r: 7, kind: "covo" },
    { id: "covo3", name: "Il Covo del Fumo", x: 68, y: 44, r: 7, kind: "covo" },
    { id: "raffineria", name: "La Raffineria", x: 100, y: 26, r: 11, kind: "raffineria" },
    { id: "oasi", name: "L'Oasi delle Rondini", x: 42, y: 6, r: 6, kind: "oasi" },
  ];
  const ROADS = [["start", "pozzo"], ["pozzo", "stazione"], ["stazione", "discarica"], ["stazione", "borgo"], ["stazione", "miniera"], ["stazione", "covo3"], ["borgo", "covo1"], ["miniera", "covo2"], ["covo3", "raffineria"], ["covo1", "raffineria"], ["covo2", "covo3"]];
  const poi = (id) => POIS.find((p) => p.id === id);
  let nodes = [], decor = [], spawns = [];
  function genWorld(sd) {
    seed = sd; const rng = mulberry(sd), R = (a, b) => a + rng() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1));
    const n1 = makeNoise(rng), n2 = makeNoise(rng), fbm = (n, x, y) => n(x, y) * 0.6 + n(x * 2.1, y * 2.1) * 0.28 + n(x * 4.3, y * 4.3) * 0.12;
    tiles = new Uint8Array(N * N); nodes = []; decor = []; spawns = [];
    POIS = POI_DEF.map((p) => ({ ...p, x: p.kind === "start" || p.kind === "oasi" ? p.x : clamp(p.x + RI(-3, 3), 12, N - 12), y: p.kind === "start" || p.kind === "oasi" ? p.y : clamp(p.y + RI(-3, 3), 18, N - 10) }));
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const e = fbm(n1, x / 20, y / 20), m = fbm(n2, x / 28 + 40, y / 28 + 40);
      let t = TL.SABBIA;
      if (y < 16) t = e > 0.72 ? TL.ROCCIA : TL.DUNA;
      else if (e > 0.64) t = TL.ROCCIA; else if (e > 0.56) t = TL.GHIAIA; else if (m < 0.34 && e < 0.46) t = TL.SALE;
      if (x < 2 || y < 1 || x >= N - 2 || y >= N - 2) t = TL.ROCCIA;
      tiles[y * N + x] = t;
    }
    const set = (x, y, t) => { if (x > 1 && y > 0 && x < N - 2 && y < N - 2) tiles[y * N + x] = t; };
    // clear around the places
    for (const p of POIS) for (let y = -p.r - 2; y <= p.r + 2; y++) for (let x = -p.r - 2; x <= p.r + 2; x++) { if (x * x + y * y > (p.r + 2) ** 2) continue; const t = tileAt(p.x + x, p.y + y); if (t === TL.ROCCIA || t === TL.MURO) set(p.x + x, p.y + y, p.y + y < 16 ? TL.DUNA : TL.SABBIA); }
    // old roads
    for (const [a, b] of ROADS) {
      const A = poi(a), B2 = poi(b), len = Math.hypot(B2.x - A.x, B2.y - A.y), ph = R(0, 6);
      for (let s = 0; s <= len; s += 0.5) { const k = s / len, wob = Math.sin(k * 6 + ph) * 3 * Math.sin(k * Math.PI); const x = A.x + (B2.x - A.x) * k + wob * (B2.y - A.y) / len, y = A.y + (B2.y - A.y) * k - wob * (B2.x - A.x) / len; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx * dx + dy * dy <= 1) set(Math.round(x + dx), Math.round(y + dy), TL.STRADA); }
    }
    const addNode = (type, tx, ty, extra = {}) => { if (BLOCK.has(tileAt(tx, ty))) return null; const nd = { id: nodes.length, type, x: tx * T + T / 2 + R(-6, 6), y: ty * T + T / 2 + R(-6, 6), charges: NODE[type].charges, respawn: 0, ...extra }; nodes.push(nd); return nd; };
    const building = (cx, cy, w, h, fill) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const edge = x === 0 || y === 0 || x === w - 1 || y === h - 1; set(cx + x, cy + y, edge ? TL.MURO : TL.PAV); }
      const side = RI(0, 3), dx = side < 2 ? RI(1, w - 2) : side === 2 ? 0 : w - 1, dy = side >= 2 ? RI(1, h - 2) : side === 0 ? 0 : h - 1;
      set(cx + dx, cy + dy, TL.PAV); if (side < 2) set(cx + Math.min(w - 2, dx + 1), cy + dy, TL.PAV); else set(cx + dx, cy + Math.min(h - 2, dy + 1), TL.PAV);
      for (const f of fill) addNode(f, cx + RI(1, w - 2), cy + RI(1, h - 2));
    };
    const ring = (p, r, gaps) => { for (let a = 0; a < TAU; a += 0.04) { const x = Math.round(p.x + Math.cos(a) * r), y = Math.round(p.y + Math.sin(a) * r); if (gaps.some((g) => Math.abs(((a - g + Math.PI * 3) % TAU) - Math.PI) < 0.22)) { set(x, y, TL.PAV); continue; } set(x, y, TL.MURO); } };
    for (const p of POIS) {

    <linearGradient id="hair" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3a1a0e"/><stop offset="1" stop-color="#1e0c06"/></linearGradient>
    <linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#e2a57c"/><stop offset="0.5" stop-color="#f0bf98"/><stop offset="1" stop-color="#d89a72"/></linearGradient></defs>
    <rect width="120" height="150" rx="16" fill="url(#sun)"/>
    <path d="M40 44 C32 70 28 98 18 124 C32 122 44 112 50 98 L52 60 Z" fill="url(#hair)"/>
    <path d="M78 36 C98 42 114 66 118 100 C106 90 94 84 80 82 Z" fill="url(#hair)"/>
    <path d="M6 150 C10 124 30 110 50 106 L70 106 C90 110 110 124 114 150 Z" fill="#2a1a14"/>
    <path d="M50 106 L60 122 L70 106 L74 108 L60 132 L46 108 Z" fill="#3e2a20"/>
    <path d="M10 150 C12 132 20 118 34 112 L42 150 Z" fill="#8e8e96"/><path d="M14 136 C20 128 28 122 36 120" stroke="#b8b8c0" stroke-width="1.5" fill="none"/>
    <circle cx="20" cy="132" r="1.6" fill="#3a3a40"/><circle cx="28" cy="124" r="1.6" fill="#3a3a40"/><circle cx="34" cy="140" r="1.6" fill="#3a3a40"/>
    <path d="M78 150 L104 116 L109 120 L86 150 Z" fill="#6a4228"/><rect x="92" y="126" width="4" height="7" rx="1" fill="#c8a050" transform="rotate(38 94 129)"/><rect x="98" y="118" width="4" height="7" rx="1" fill="#c8a050" transform="rotate(38 100 121)"/>
    <path d="M53 82 L67 82 L67 106 C63 109 57 109 53 106 Z" fill="#d89a72"/><path d="M53 86 C56 92 64 92 67 86 L67 90 C63 95 57 95 53 90 Z" fill="#b97e5a" opacity=".6"/>
    <path d="M42 102 C50 110 70 110 78 102 L82 110 C70 120 50 120 38 110 Z" fill="#c4281e"/>
    <path d="M80 104 C92 106 106 102 116 94 C112 106 100 114 84 114 Z" fill="#a01c14"/><path d="M84 110 C96 112 106 116 112 124 C100 122 92 118 82 114 Z" fill="#c4281e"/>
    <path d="M42 50 C42 34 50 28 60 28 C70 28 78 34 78 50 C78 64 74 76 66 86 C63 90 61 92 60 92 C59 92 57 90 54 86 C46 76 42 64 42 50 Z" fill="url(#skin)"/>
    <ellipse cx="48.5" cy="67" rx="4.5" ry="2.6" fill="#e07a62" opacity=".28"/><ellipse cx="71.5" cy="67" rx="4.5" ry="2.6" fill="#e07a62" opacity=".28"/>
    <path d="M44 51.5 C47 48.6 52 48.4 56 50.2" stroke="#2a120a" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M64 50.2 C68 48.4 73 48.6 76 51.5" stroke="#2a120a" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M45 58 C47 54.6 53 54.2 56 57.6 C53 60.2 48 60.6 45 58 Z" fill="#f6eee6"/><path d="M64 57.6 C67 54.2 73 54.6 75 58 C72 60.6 67 60.2 64 57.6 Z" fill="#f6eee6"/>
    <circle cx="50.8" cy="57.6" r="2.4" fill="#5e7e34"/><circle cx="69.2" cy="57.6" r="2.4" fill="#5e7e34"/>
    <circle cx="50.8" cy="57.6" r="1.1" fill="#120804"/><circle cx="69.2" cy="57.6" r="1.1" fill="#120804"/>
    <circle cx="51.6" cy="56.8" r=".7" fill="#fff"/><circle cx="70" cy="56.8" r=".7" fill="#fff"/>
    <path d="M44.4 58 C47 53.8 53 53.4 56.6 57.4 M44.4 58 L41.6 55.4" stroke="#120804" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M75.6 58 C73 53.8 67 53.4 63.4 57.4 M75.6 58 L78.4 55.4" stroke="#120804" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M46 60.6 C49 61.6 53 61.4 55.5 59.4" stroke="#9a5e40" stroke-width=".6" fill="none" opacity=".7"/><path d="M74 60.6 C71 61.6 67 61.4 64.5 59.4" stroke="#9a5e40" stroke-width=".6" fill="none" opacity=".7"/>
    <path d="M60 60 C59.6 64.5 58.6 67.6 57.8 69.4 C59 70.6 61 70.6 62.2 69.6" stroke="#b07454" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M53.4 76 C56 74 58.6 74.4 60 75.3 C61.4 74.4 64 74 66.6 76 C63.6 77.2 56.4 77.2 53.4 76 Z" fill="#a83a32"/>
    <path d="M54 76.2 C57 80.4 63 80.4 66 76.2 C63 77.6 57 77.6 54 76.2 Z" fill="#c4544a"/><path d="M58 78.4 C59.4 79 61 79 62.4 78.4" stroke="#e8887a" stroke-width=".8" fill="none" stroke-linecap="round"/>
    <path d="M66.6 76 C67.6 75.4 68.2 74.6 68.4 73.8" stroke="#a83a32" stroke-width=".9" fill="none" stroke-linecap="round"/>
    <path d="M67 64.4 L74.5 62.6" stroke="#7a3e26" stroke-width="1.2" opacity=".55" stroke-linecap="round"/><path d="M68 66.6 L73 65.4" stroke="#7a3e26" stroke-width=".8" opacity=".4" stroke-linecap="round"/>
    <path d="M40 54 C37 30 50 19 62 19 C77 19 85 30 82 52 C79 42 73 35 65 33 C58 39 50 46 40 54 Z" fill="url(#hair)"/>
    <path d="M43 46 C38 60 38 74 43 90 C46 76 46 60 50 47 Z" fill="#2e1408"/>
    <path d="M78 42 C82 56 81 70 77 80 C80 70 80 56 76 44 Z" fill="#2e1408"/>
    <path d="M62 22 C56 26 52 32 50 40" stroke="#5a2e18" stroke-width="1.2" fill="none" opacity=".7"/><path d="M68 22 C74 26 78 32 79 40" stroke="#5a2e18" stroke-width="1.2" fill="none" opacity=".7"/>
    <rect x="40" y="27" width="42" height="5" rx="2.5" fill="#5a3a22" transform="rotate(-4 61 29)"/>
    <circle cx="50" cy="29.6" r="7" fill="#2e2018"/><circle cx="50" cy="29.6" r="5.2" fill="#ff9a2a"/><path d="M46.6 27.4 A4 4 0 0 1 52 26" stroke="#fff4d0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="70.6" cy="28.2" r="7" fill="#2e2018"/><circle cx="70.6" cy="28.2" r="5.2" fill="#ff9a2a"/><path d="M67.2 26 A4 4 0 0 1 72.6 24.6" stroke="#fff4d0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>`;
  let confirmNew = false;
  function showTitle() {
    menu = showTitle;
    const sv = readSave();
    showOverlay(
      `<h1>STRADA DI <span>RUGGINE</span></h1>
       <div class="hero">${PORTRAIT}<p>Il mondo è finito in polvere. Lo Sciacallo e i suoi Corvi di Ruggine si sono presi l'ultima raffineria e tutta l'acqua, e hanno fatto a pezzi la Cobra di <b>Mariky</b>. Lei si risveglia nel deserto con la gola secca e niente in mano. Sopravvivi, raccogli, costruisci attrezzi, armi, un campo e poi le ruote, e trova la strada per l'<b>Oasi delle Rondini</b>.</p></div>
       <div class="pts">
         <span><b>Sopravvivi</b></span><span>acqua, cibo e salute calano: bevi alle cisterne e dai cactus, caccia, cuoci al falò. Di notte escono le iene</span>
         <span><b>Costruisci</b></span><span>raccogli rottami, legno, stoffa, ossa, benzina, circuiti e polvere da sparo; nello Zaino crei attrezzi, armi, munizioni, vestiti, il campo e i veicoli</span>
         <span><b>Combatti</b></span><span>i Corvi lasciano armi di rarità diversa, dalla comune alla leggendaria, alcune col fuoco, l'elettricità o l'acido</span>
         <span><b>Comandi</b></span><span>${touchMode ? "trascina a sinistra per muoverti; ATTACCA mira da solo; AZIONE raccoglie (tienilo premuto), usa e fa salire sui veicoli" : "WASD per muoverti, mouse per mirare e sparare (o Spazio con mira automatica), E azione (tieni premuto per raccogliere), Q cambia arma, I zaino, M mappa, B bevi, H bende"}</span>
       </div>
       ${sv ? `<p class="muted">Salvataggio: giorno ${sv.day}, livello ${sv.P.lvl}, missione «${QUESTS[sv.qi].title}» · ${DIFFICULTIES[sv.difficulty].label}</p><button class="start" data-continue>CONTINUA</button>` : ""}
       ${difficultyHTML()}
       <button class="${sv ? "" : "start"}" data-new>${sv ? (confirmNew ? "SICURA? IL SALVATAGGIO SI CANCELLA" : "NUOVA PARTITA") : "COMINCIA"}</button>`
    );
  }
  function newGame() {
    startAudio();
    genWorld((Math.random() * 1e9) | 0); seen = new Uint8Array(N * N);
    P = newPlayer(); vehicles = []; structs = []; items = []; shots = []; parts = []; texts = []; fires = []; toasts = [];
    flags = { fragments: [], engine: false, sciacallo: false, rottamaio: false, dead: [], drank: false, mirage: false, oasiBonus: false };
    stats = { kills: 0, crafted: 0, rams: 0, legend: false }; score = 0; qi = 0; day = 1; dayT = 70; hintDune = false;
    populate(); camX = P.x; camY = P.y; confirmNew = false;
    state = "play"; stateT = 0; menu = null; overlay.classList.add("hidden"); syncControls(); lastT = performance.now(); clock = 0;
    toast("Missione: Sete. Il pozzo è a nord-ovest, segui la freccia gialla", "#ffd23a"); saveGame();
  }
  function continueGame() {
    const sv = readSave(); if (!sv) return; startAudio(); loadGame(sv);
    items = []; shots = []; parts = []; texts = []; fires = []; toasts = []; camX = P.x; camY = P.y;
    state = "play"; stateT = 0; menu = null; overlay.classList.add("hidden"); syncControls(); lastT = performance.now(); clock = 0;
    toast(`Bentornata, Mariky. Giorno ${day}`, "#ffd23a");
  }
  function endRun(won) {
    const record = updateBest(); if (!won) saveGame();
    state = "over";
    menu = () => showOverlay(
      (won ? `<h2>L'OASI DELLE RONDINI</h2><p class="quote">«Le rondini tornano dove c'è acqua. Anch'io sono tornata.»</p><p>Lo Sciacallo è caduto, la Raffineria brucia e l'acqua dell'Oasi adesso è di tutti. Mariky ce l'ha fatta in ${day === 1 ? "un giorno" : day + " giorni"}.</p>`
        : `<h2>LA STRADA ASPETTA</h2><p>La partita è salvata: puoi riprenderla quando vuoi da CONTINUA.</p>`) +
      `<p>Punteggio: <b>${nf(score)}</b> · giorno ${day} · livello ${P.lvl} · ${stats.kills} nemici · ${stats.crafted} oggetti creati · ${diff.label}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       <button class="start" data-title>TORNA AL MENU</button>`
    );
    menu(); syncControls();
  }
  function togglePause() {
    if (state === "play" || state === "dead" || state === "victory") { pausedFrom = state; state = "paused"; keys.clear(); joy.active = false; touchBtn.atk = touchBtn.act = false; showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Musica e suoni: <button type="button" data-music>${music ? "ACCESI" : "SPENTI"}</button></p><p class="muted">La partita si salva da sola ogni tanto, e quando usi il falò.</p>`); }
    else if (state === "paused") { state = pausedFrom; overlay.classList.add("hidden"); lastT = performance.now(); }
    else if (state === "panel") closePanel();
    syncControls();
  }
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); endRun(false); });
  function syncControls() { pauseBtn.style.display = (state === "play" || state === "dead" || state === "victory") && touchMode ? "block" : "none"; resize(); }
  pauseBtn.addEventListener("click", () => togglePause());
  function toggleMusic() { music = !music; store("ruggine-music", music ? "1" : "0"); const b = overlay.querySelector("[data-music]"); if (b) b.textContent = music ? "ACCESI" : "SPENTI"; }
  overlay.addEventListener("click", (e) => {
    const q = (s) => e.target.closest(s);
    let el;
    if ((el = q("[data-diff]"))) { setDifficulty(el.dataset.diff); return; }
    if (q("[data-music]")) { toggleMusic(); return; }
    if (q("[data-continue]")) { continueGame(); return; }
    if (q("[data-new]")) { if (readSave() && !confirmNew) { confirmNew = true; showTitle(); return; } unstore(SAVE_KEY); newGame(); return; }
    if (q("[data-resume]")) { togglePause(); return; }
    if (q("[data-title]")) { showTitle(); return; }
    if (state !== "panel") return;
    if ((el = q("[data-tab]"))) { panelTab = el.dataset.tab; renderPanel(); overlay.scrollTop = 0; return; }
    if (q("[data-close]")) { closePanel(); return; }
    if ((el = q("[data-craft]"))) { craft(el.dataset.craft); checkQuests(); const r = RECIPES.find((x) => x.id === el.dataset.craft); if (r && (r.struct || r.cat === "Veicoli")) { closePanel(); return; } renderPanel(); return; }
    if ((el = q("[data-cur]"))) { P.cur = +el.dataset.cur; renderPanel(); return; }
    if ((el = q("[data-unequip]"))) { const i = +el.dataset.unequip; if (P.bag.length < 12) { P.bag.push(P.slots[i]); P.slots[i] = null; } renderPanel(); return; }
    if ((el = q("[data-equip]"))) { const i = +el.dataset.equip, w = P.bag[i], free = P.slots.indexOf(null); if (free >= 0) { P.slots[free] = w; P.bag.splice(i, 1); P.cur = free; } else { P.bag[i] = P.slots[P.cur]; P.slots[P.cur] = w; } renderPanel(); return; }
    if ((el = q("[data-scrap]"))) { const i = +el.dataset.scrap, v = scrapValue(P.bag[i]); P.bag.splice(i, 1); P.res.rottami += v.rottami; P.res.circuiti += v.circuiti; sfx.craft(); renderPanel(); return; }
    if ((el = q("[data-eat]"))) { eat(el.dataset.eat); renderPanel(); return; }
    if (q("[data-flask]")) { useFlask(); renderPanel(); return; }
  });

  // ---------- Input ----------
  const KEYMAP = { w: "up", arrowup: "up", s: "down", arrowdown: "down", a: "left", arrowleft: "left", d: "right", arrowright: "right", " ": "atk", e: "act", f: "act" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") { if (e.key === "Enter") { if (state === "over") showTitle(); else if (readSave()) continueGame(); else newGame(); } return; }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "panel") { if (["i", "tab", "z"].includes(k) && panelTab !== "mappa" || (k === "m" && panelTab === "mappa")) closePanel(); else if (k === "m") { panelTab = "mappa"; renderPanel(); } return; }
    if (state === "victory" && stateT > 3 && (k === "enter" || k === " ")) { endRun(true); return; }
    if (state !== "play") return;
    if (!e.repeat) {
      if (k === "i" || k === "tab" || k === "z") { openPanel("crea"); return; }
      if (k === "m") { openPanel("mappa"); return; }
      if (k === "q") { cycleWeapon(); return; } if (["1", "2", "3"].includes(k) && P.slots[+k - 1]) { P.cur = +k - 1; return; }
      if (k === "b") { useFlask(); return; } if (k === "h") { eat("bende"); return; }
      if (k === "c") { eat(P.cons.cotta ? "cotta" : P.cons.scatola ? "scatola" : "carne"); return; }
      if (k === "x") { musicKey(); return; }
    }
    const a = KEYMAP[k]; if (!a) return;
    if (a === "act" && !keys.has("act")) input.actPressed = true;
    if (a === "atk") input.mouseAim = false;
    keys.add(a);
  });
  function musicKey() { toggleMusic(); toast(music ? "Audio acceso" : "Audio spento"); }
  window.addEventListener("keyup", (e) => { const a = KEYMAP[e.key.toLowerCase()]; if (a) keys.delete(a); });
  function cycleWeapon() { for (let k = 1; k <= 3; k++) { const i = (P.cur + k) % 3; if (P.slots[i]) { P.cur = i; toast(P.slots[i].name, RARITY[P.slots[i].rarity].color); return; } } }
  const joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 }, touchBtn = { atk: false, act: false, atkId: null, actId: null };
  let mouseDown = false, lastMouse = -10;
  const toScreen = (e) => { const rc = canvas.getBoundingClientRect(); return { x: ((e.clientX - rc.left) / rc.width) * W, y: ((e.clientY - rc.top) / rc.height) * H }; };
  function btnAt(p) { for (const id in BTN) { const b = BTN[id]; if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.25) return id; } return null; }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state === "victory" && stateT > 3) { endRun(true); return; }
    if (state !== "play") return;
    const p = toScreen(e), mm = minimap();
    if (p.x > mm.x && p.y < mm.y + mm.s + 12 && p.y > mm.y && p.x < mm.x + mm.s) { openPanel("mappa"); return; }
    if (e.pointerType === "mouse") { if (e.button === 0) { mouseDown = true; input.mouseAim = true; lastMouse = clock; const w = toWorld(p); input.aimX = w.x; input.aimY = w.y; } return; }
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    const b = touchMode ? btnAt(p) : null;
    if (b === "atk") { touchBtn.atk = true; touchBtn.atkId = e.pointerId; return; }
    if (b === "act") { touchBtn.act = true; touchBtn.actId = e.pointerId; input.actPressed = true; return; }
    if (b === "swap") { cycleWeapon(); return; }
    if (b === "bag") { openPanel("crea"); return; }
    if (!joy.active) { joy.active = true; joy.id = e.pointerId; joy.bx = p.x; joy.by = p.y; joy.dx = joy.dy = 0; }
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = toScreen(e);
    if (e.pointerType === "mouse") { input.mouseAim = true; lastMouse = clock; const w = toWorld(p); input.aimX = w.x; input.aimY = w.y; return; }
    if (joy.active && e.pointerId === joy.id) { let dx = (p.x - joy.bx) / 40, dy = (p.y - joy.by) / 40; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } joy.dx = dx; joy.dy = dy; }
  });
  const lift = (e) => {
    if (e.pointerType === "mouse") { mouseDown = false; return; }
    if (joy.active && e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; }
    if (e.pointerId === touchBtn.atkId) { touchBtn.atk = false; touchBtn.atkId = null; }
    if (e.pointerId === touchBtn.actId) { touchBtn.act = false; touchBtn.actId = null; }
  };
  canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);
  window.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") mouseDown = false; });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  function toWorld(p) { return { x: p.x + camX - W / 2, y: p.y + camY - H / 2 }; }
  function readInput() {
    let mx = (keys.has("right") ? 1 : 0) - (keys.has("left") ? 1 : 0), my = (keys.has("down") ? 1 : 0) - (keys.has("up") ? 1 : 0);
    if (joy.active) { mx = joy.dx; my = joy.dy; if (Math.hypot(mx, my) < 0.15) mx = my = 0; }
    input.mx = mx; input.my = my;
    if (clock - lastMouse > 3 && !mouseDown) input.mouseAim = false;
    if (input.mouseAim && !mouseDown) { /* keep the aim where the mouse was */ }
    input.attack = mouseDown || keys.has("atk") || touchBtn.atk;
    input.act = keys.has("act") || touchBtn.act;
  }
  window.addEventListener("blur", () => { keys.clear(); mouseDown = false; joy.active = false; touchBtn.atk = touchBtn.act = false; if (state === "play") togglePause(); });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused" && state !== "panel" && state !== "over") update(dt);
    if (state === "panel" && panelTab === "mappa") drawBigMap();
    draw();
    requestAnimationFrame(frame);
  }
  function demo() { genWorld(12345); seen = new Uint8Array(N * N).fill(1); P = newPlayer(); populate(); camX = P.x; camY = P.y; state = "menu"; }
  resize(); demo();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Raggio Traente</title>
<style>
  :root {
    --bg: #0a0a16;
    --fg: #f4f6ee;
    --muted: #a8b4a8;
    --pink: #ff9a3a;
    --yellow: #5af0ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: point it where the nose should go, push it further to fire the engine; FUOCO fires (hold it for a burst) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 154, 58, 0.6); background: radial-gradient(circle, rgba(255,154,58,0.14), rgba(255,154,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 154, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 90, 74, 0.9); background: rgba(255, 90, 74, 0.22); }
  #touch .jump.on { background: rgba(255, 90, 74, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 10, 22, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a2a0a, 0 0 22px rgba(255,154,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1204; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8581a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  const GRAV = 40, THRUST = 165, TURN = 4.2, MAX_V = 170, POD_MASS = 1.2, BULLET_V = 300;
  const EXIT_Y = -150, SKY_TOP = -250;
  // The caves: the shaft walls as [depth, left x, right x], rock islands, and what sits in them.
  // Guns: { side: "L" | "R", y } sit on a wall; { x, y, a } sit on a floor, a ledge or under one.
  const LEVELS = [
    { name: "Primo contatto", color: "#3a8a4a", edge: "#7ae08a", floor: 420,
      walls: [[0, 250, 390], [110, 240, 400], [250, 150, 500], [420, 150, 500]], rocks: [],
      pod: 330, reactor: 450, fuel: [[100, 0], [210, 420]], guns: [{ side: "L", y: 200 }, { side: "R", y: 330 }] },
    { name: "L'isola", color: "#8a5a3a", edge: "#e0a07a", floor: 600,
      walls: [[0, 250, 390], [140, 220, 420], [260, 90, 550], [600, 90, 550]],
      rocks: [[[250, 330], [390, 330], [430, 380], [390, 430], [250, 430], [210, 380]]],
      pod: 260, reactor: 470, fuel: [[560, 0], [320, 330]], guns: [{ side: "L", y: 300 }, { side: "R", y: 480 }, { x: 385, y: 430, a: Math.PI / 2 }] },
    { name: "Le mensole", color: "#3a5a9a", edge: "#7aa8ff", floor: 760,
      walls: [[0, 260, 380], [120, 260, 380], [160, 60, 580], [760, 60, 580]],
      rocks: [[[60, 250], [400, 250], [410, 270], [400, 285], [60, 295]], [[240, 470], [580, 460], [580, 500], [240, 495], [230, 482]]],
      pod: 420, reactor: 280, fuel: [[560, 0], [330, 250], [150, 760]],
      guns: [{ x: 150, y: 250, a: -Math.PI / 2 }, { x: 300, y: 288, a: Math.PI / 2 }, { side: "R", y: 360 }, { x: 480, y: 463, a: -Math.PI / 2 }, { x: 560, y: 760, a: -Math.PI / 2 }] },
    { name: "La serpentina", color: "#7a3a8a", edge: "#d07ae8", floor: 960,
      walls: [[0, 240, 400], [140, 240, 400], [300, 160, 320], [460, 300, 460], [620, 160, 320], [780, 300, 460], [820, 170, 560], [960, 170, 560]], rocks: [],
      pod: 450, reactor: 340, fuel: [[90, 0], [230, 960]],
      guns: [{ side: "R", y: 220 }, { side: "L", y: 380 }, { side: "R", y: 540 }, { side: "L", y: 700 }, { x: 530, y: 960, a: -Math.PI / 2 }] },
    { name: "Le caverne gemelle", color: "#8a7a3a", edge: "#f0d87a", floor: 820,
      walls: [[0, 260, 380], [100, 260, 380], [140, 40, 600], [820, 40, 600]],
      rocks: [[[280, 240], [360, 240], [380, 500], [360, 820], [280, 820], [260, 500]], [[40, 420], [150, 428], [150, 448], [40, 450]], [[600, 560], [490, 568], [490, 588], [600, 590]]],
      pod: 440, reactor: 215, fuel: [[560, 0], [90, 421], [140, 820]],
      guns: [{ x: 320, y: 240, a: -Math.PI / 2 }, { side: "L", y: 300 }, { side: "R", y: 380 }, { x: 100, y: 449, a: Math.PI / 2 }, { x: 560, y: 563, a: -Math.PI / 2 }, { x: 372, y: 700, a: 0 }, { x: 60, y: 820, a: -Math.PI / 2 }] },
    { name: "Il nucleo", color: "#9a3a3a", edge: "#ff8a7a", floor: 1080,
      walls: [[0, 270, 370], [150, 270, 370], [200, 120, 520], [380, 120, 520], [420, 240, 400], [560, 240, 400], [600, 80, 560], [1080, 80, 560]],
      rocks: [[[260, 260], [380, 260], [380, 320], [260, 320]], [[80, 760], [300, 780], [300, 800], [80, 800]], [[560, 900], [330, 920], [330, 940], [560, 940]]],
      pod: 460, reactor: 200, fuel: [[90, 0], [320, 260], [150, 762], [140, 1080]],
      guns: [{ side: "L", y: 300 }, { side: "R", y: 300 }, { x: 320, y: 320, a: Math.PI / 2 }, { side: "L", y: 490 }, { x: 200, y: 791, a: Math.PI / 2 }, { x: 450, y: 910, a: -Math.PI / 2 }, { side: "R", y: 700 }, { x: 320, y: 1080, a: -Math.PI / 2 }] },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 navi · cannoni lenti e imprecisi · gravità leggera · gli urti leggeri non fanno danni", lives: 5, fire: 3.2, bv: 85, err: 0.3, grav: 0.85, count: 14, bump: 70 },
    normale:   { label: "NORMALE",   color: "#ff9a3a", desc: "4 navi", lives: 4, fire: 2.3, bv: 105, err: 0.2, grav: 1, count: 11, bump: 45 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 navi · cannoni svelti e precisi · gravità forte · basta sfiorare la roccia", lives: 3, fire: 1.6, bv: 135, err: 0.1, grav: 1.12, count: 9, bump: 25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "raggio-difficulty";
  const bestKey = (id) => `raggio-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(900, 0.07, "square", 0.025, -500)),
    enemy: lim(() => beep(300, 0.08, "square", 0.022, -120)),
    boom: lim(() => { noise(0.35, 0.16, 500); beep(150, 0.25, "sawtooth", 0.035, -80); }),
    hit: lim(() => { noise(0.12, 0.1, 1200); beep(220, 0.1, "square", 0.03); }),
    bump: lim(() => { noise(0.08, 0.12, 300); beep(90, 0.08, "square", 0.04); }),
    grab: lim(() => arp([440, 660, 880], 0.05, 0.1, "triangle", 0.05)),
    fuel: lim(() => beep(400 + fuel / 4, 0.05, "triangle", 0.03)),
    crash: () => { noise(0.9, 0.24, 200); beep(140, 0.6, "sawtooth", 0.06, -90); },
    alarm: lim(() => { beep(880, 0.15, "square", 0.04); beep(660, 0.15, "square", 0.04, 0, 0.2); }),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.18),
    life: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };
  function engineSound(on) {
    if (!audioCtx) return;
    if (!engine) {
      const len = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0;
      src.connect(f).connect(g).connect(audioCtx.destination); src.start();
      engine = { g };
    }
    engine.g.gain.setTargetAtTime(on ? 0.1 : 0, audioCtx.currentTime, 0.04);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, bestCache = 0, nextLife = 10000, fuel = 1000, levelN = 0, loop = 0, camY = -200;
  let L = null, S = null, pod = null, guns = [], tanks = [], reactor = null, bullets = [], shots = [], parts = [], popups = [], message = null;
  let countdown = 0, hintT = 0, thrusting = false, firing = false, fireCool = 0, beam = null;
  const keys = { left: false, right: false, up: false, fire: false };
  const stick = { x: 0, y: 0 };
  let stars = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * 400, Math.random()]);

  // ---------- The cave ----------
  function wallsAt(y) {
    const w = L.walls;
    if (y <= w[0][0]) return [w[0][1], w[0][2]];
    for (let i = 1; i < w.length; i++) if (y <= w[i][0]) { const a = w[i - 1], b = w[i], t = (y - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
    const e = w[w.length - 1]; return [e[1], e[2]];
  }
  function inPoly(x, y, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function solid(x, y) {
    if (y < 0) return false;
    if (y >= L.floor || x <= 0 || x >= W) return true;
    const [l, r] = wallsAt(y);
    if (x <= l || x >= r) return true;
    for (const p of L.rocks) if (inPoly(x, y, p)) return true;
    return false;
  }
  function clearLine(x0, y0, x1, y1) {
    const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 6);
    for (let i = 1; i < n; i++) if (solid(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false;
    return true;
  }
  const gravity = () => GRAV * diff.grav * (1 + Math.min(loop, 3) * 0.12);
  function buildLevel() {
    L = LEVELS[levelN];
    guns = L.guns.map((g) => {
      let x = g.x, y = g.y, a = g.a;
      if (g.side) { const [l, r] = wallsAt(g.y); x = g.side === "L" ? l : r; a = g.side === "L" ? 0 : Math.PI; }
      // the dome sits just off the rock, facing into the cave
      return { x: x + Math.cos(a) * 7, y: y + Math.sin(a) * 7, a, t: rnd(0.5, 2) * diff.fire, dead: false };
    });
    tanks = L.fuel.map(([x, y]) => ({ x, y, left: 300, dead: false }));
    reactor = { x: L.reactor, y: L.floor, hp: 10, smoke: 0, dead: false };
    countdown = 0;
    resetPod();
  }
  function resetPod() { pod = { x: L.pod, y: L.floor - 17, vx: 0, vy: 0, on: false, len: 48 }; }
  function spawnShip() {
    S = { x: 320, y: -110, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, safe: 1.5 };
    // a new ship always brings a small reserve of fuel
    fuel = Math.max(fuel, 250);
    bullets = []; shots = []; beam = null;
    if (pod.on) resetPod();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "crash", "done"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; nextLife = 10000; fuel = 1000; levelN = 0; loop = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel(); spawnShip(); camY = -220;
    message = { text: `PIANETA ${levelN + 1 + loop * LEVELS.length}`, sub: `${L.name}${loop ? " · gravità più forte" : ""} · recupera la sfera!`, t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function addScore(n, x, y, color = "#f4f6ee") {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 10000; sfx.life(); popups.push({ x: W / 2, y: camY + 120, text: "NAVE EXTRA!", color: "#ff9a3a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 14, sp = 120, life = 0.7) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function crash(why) {
    if (!S.alive) return;
    S.alive = false; S.why = why;
    burst(S.x, S.y, "#ff9a3a", 26, 150, 0.9); burst(S.x, S.y, "#f4f6ee", 12, 90, 0.6);
    if (pod.on) { burst(pod.x, pod.y, "#5af0ff", 16, 110, 0.8); }
    sfx.crash(); engineSound(false);
    lives--;
    state = "crash"; stateT = 2;
  }
  function levelDone() {
    countdown = 0;
    const podBonus = pod.on ? 2000 + 500 * (levelN + loop * LEVELS.length) : 0, coreBonus = reactor.dead ? 3000 : 0;
    addScore(podBonus + coreBonus);
    message = { text: "MISSIONE COMPIUTA!", sub: [podBonus && `sfera recuperata +${podBonus.toLocaleString("it-IT")}`, coreBonus && `pianeta distrutto +${coreBonus.toLocaleString("it-IT")}`].filter(Boolean).join(" · "), t: 0 };
    sfx.win(); engineSound(false);
    state = "done"; stateT = 3;
  }
  function gameOver() {

    ctx.fillStyle = fuel < 200 && Math.floor(clock * 4) % 2 ? "#ff5a5a" : fuel < 200 ? "#ff9a3a" : "#5af0ff"; ctx.fillRect(fx, 14, fw * fuel / 1000, 8);
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "crash" ? 0 : 1), 6); i++) { ctx.save(); ctx.translate(lx - i * 14, 15); ctx.rotate(-Math.PI / 2); ctx.fillStyle = "#f4f6ee"; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -5); ctx.lineTo(-2, 0); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill(); ctx.restore(); }
    if (fuel <= 0 && S.alive) { ctx.textAlign = "center"; ctx.font = "900 16px system-ui"; ctx.fillStyle = "#ff5a5a"; ctx.fillText("CARBURANTE ESAURITO!", W / 2, 76); }
    if (countdown > 0) { ctx.textAlign = "center"; ctx.font = "900 22px system-ui"; ctx.fillStyle = Math.floor(clock * 4) % 2 ? "#ff5a5a" : "#ffd23a"; ctx.fillText(`ESPLOSIONE TRA ${Math.ceil(countdown)}`, W / 2, 50); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!L) { levelN = 0; buildLevel(); S = { x: 320, y: -40, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, safe: 0, demo: true }; camY = -130; }
    ctx.fillStyle = "#07071a"; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(0, -camY);
    // stars in the sky
    for (const [x, y, b] of stars) { const yy = y - 420; if (yy < camY - 10 || yy > camY + H) continue; ctx.fillStyle = `rgba(255,255,255,${0.3 + b * 0.6})`; ctx.fillRect(x, yy, 1.5, 1.5); }
    if (countdown > 0 && Math.floor(clock * 8) % 2) { ctx.fillStyle = "rgba(255,60,60,0.08)"; ctx.fillRect(0, camY, W, H); }
    drawCave();
    // the exit line in the sky
    ctx.strokeStyle = "rgba(90,240,255,0.25)"; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(0, EXIT_Y); ctx.lineTo(W, EXIT_Y); ctx.stroke(); ctx.setLineDash([]);
    // fuel tanks
    for (const t of tanks) {
      if (t.dead) continue;
      ctx.fillStyle = "#e8e0d0"; ctx.fillRect(t.x - 11, t.y - 18, 22, 18);
      ctx.fillStyle = "#d8a02a"; ctx.fillRect(t.x - 11, t.y - 18 + 18 * (1 - t.left / 300), 22, 18 * t.left / 300);
      ctx.strokeStyle = "#4a4a5a"; ctx.lineWidth = 1.5; ctx.strokeRect(t.x - 11, t.y - 18, 22, 18);
      ctx.fillStyle = "#1a1a2a"; ctx.font = "900 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("FUEL", t.x, t.y - 6);
    }
    // the reactor
    if (!reactor.dead) {
      const r = reactor;
      ctx.fillStyle = "#5a5a6a"; ctx.fillRect(r.x - 20, r.y - 6, 40, 6);
      ctx.fillStyle = r.smoke > 0 ? "#8a3a3a" : "#c84a3a"; ctx.beginPath(); ctx.arc(r.x, r.y - 6, 17, Math.PI, 0); ctx.fill();
      ctx.fillStyle = `rgba(255,${120 + 100 * Math.sin(clock * 6)},80,0.9)`; ctx.beginPath(); ctx.arc(r.x, r.y - 10, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1a1a2a"; ctx.fillRect(r.x - 16, r.y - 26, 32 * r.hp / 10, 2);
      if (r.smoke > 0 && Math.random() < 0.3) parts.push({ x: r.x + rnd(-8, 8), y: r.y - 20, vx: rnd(-10, 10), vy: -30, t: 0, life: 0.8, c: "#6a6a7a" });
    } else { ctx.fillStyle = "#3a2a2a"; ctx.fillRect(reactor.x - 20, reactor.y - 5, 40, 5); }
    for (const g of guns) if (!g.dead) drawGun(g);
    // pedestal and sphere
    ctx.fillStyle = "#5a5a7a"; ctx.fillRect(L.pod - 10, L.floor - 8, 20, 8);
    if (S.alive || !pod.on) {
      if (pod.on) { ctx.strokeStyle = "rgba(90,240,255,0.8)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(S.x, S.y); ctx.lineTo(pod.x, pod.y); ctx.stroke(); }
      const gl = ctx.createRadialGradient(pod.x - 3, pod.y - 3, 1, pod.x, pod.y, 9); gl.addColorStop(0, "#e8ffff"); gl.addColorStop(1, "#2ab0c8");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(pod.x, pod.y, 9, 0, TAU); ctx.fill();
    }
    if (beam && S.alive) {
      const tx = beam.tank ? beam.tank.x : pod.x, ty = beam.tank ? beam.tank.y - 18 : pod.y;
      ctx.fillStyle = "rgba(90,240,255,0.22)"; ctx.beginPath(); ctx.moveTo(S.x, S.y); ctx.lineTo(tx - 12, ty); ctx.lineTo(tx + 12, ty); ctx.closePath(); ctx.fill();
    }
    for (const b of bullets) { ctx.fillStyle = "#ff5a5a"; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill(); }
    for (const b of shots) { ctx.fillStyle = "#fff4a0"; ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); }
    if (S.alive && !(S.safe > 0 && Math.floor(clock * 10) % 2)) drawShip(S.x, S.y, S.a);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 12px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#07071a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 118, W, 58);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ff9a3a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#07071a"; ctx.strokeText(message.text, W / 2, 146); ctx.fillText(message.text, W / 2, 146);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f4f6ee"; ctx.fillText(message.sub, W / 2, 166); }
      ctx.globalAlpha = 1;
    }
    if (state === "crash") {
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui"; ctx.fillStyle = "#ff5a5a"; ctx.lineWidth = 4; ctx.strokeStyle = "#07071a";
      const t = { rock: "CONTRO LA ROCCIA!", pod: "LA SFERA HA URTATO!", shot: "COLPITO!", blast: "IL PIANETA È ESPLOSO!", fuel: "CARBURANTE ESAURITO!" }[S.why];
      ctx.strokeText(t, W / 2, 210); ctx.fillText(t, W / 2, 210);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="raggio-best-" data-kind="score"></script>

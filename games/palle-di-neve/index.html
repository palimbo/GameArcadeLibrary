<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Palle di Neve</title>
<style>
  :root {
    --bg: #1a1440;
    --fg: #f4f6ee;
    --muted: #a8c8d8;
    --pink: #ff7ab8;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk; SALTA jumps, NEVE throws snow (and kicks a snowball) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(122, 228, 255, 0.9); background: rgba(122, 228, 255, 0.22); }
  #touch .jump.on { background: rgba(122, 228, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 20, 64, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e0418; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Neve">NEVE</button><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GY = 338, WX0 = 10, WX1 = W - 10, PW = 7, PH = 18, ER = 9, BR = 11;
  const GRAV = 1000, JH = 74, JV = Math.sqrt(2 * GRAV * JH), WALK = 112;
  const SHOT_V = 270, SHOT_LIFE = 0.42, KICK_V = 270;
  // platform layouts: [x0, x1, y]; the floor is always there
  const LAYOUTS = [
    [[60, 260, 278], [380, 580, 278], [160, 480, 218], [40, 236, 158], [404, 600, 158], [200, 440, 98]],
    [[40, 280, 278], [360, 600, 278], [120, 520, 218], [40, 276, 158], [364, 600, 158], [240, 400, 98], [40, 140, 98], [500, 600, 98]],
    [[100, 540, 278], [40, 200, 218], [440, 600, 218], [160, 480, 158], [40, 240, 98], [400, 600, 98]],
    [[40, 280, 278], [360, 600, 278], [40, 160, 218], [240, 400, 218], [480, 600, 218], [100, 300, 158], [340, 540, 158], [200, 440, 98]],
    [[60, 220, 278], [260, 420, 278], [460, 600, 278], [140, 300, 218], [340, 500, 218], [60, 276, 158], [364, 580, 158], [240, 400, 98]],
  ];
  const KINDS = {
    diavolo: { col: "#ff4a5a", col2: "#a81a2a", pts: 0, sp: 46, name: "UN DIAVOLETTO" },
    rana: { col: "#5ad05a", col2: "#2a7a2a", pts: 0, sp: 40, name: "UNA RANA SALTERINA" },
    drago: { col: "#ff9a2a", col2: "#a8501a", pts: 0, sp: 36, name: "UN DRAGHETTO" },
  };
  const FRUITS = [["#ff3a3a", 200], ["#ffd23a", 300], ["#c87aff", 500], ["#5ad0ff", 800]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · mostri lenti e meno numerosi, la neve si scioglie piano", lives: 5, speed: 0.6, melt: 1.8, hurry: 70, fewer: 1 },
    normale:   { label: "NORMALE",   color: "#ff7ab8", desc: "3 vite", lives: 3, speed: 1.25, melt: 0.8, hurry: 38, fewer: -1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · più mostri e più svelti, la neve si scioglie presto, la zucca arriva prima", lives: 3, speed: 1.5, melt: 0.55, hurry: 30, fewer: -2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "neve-difficulty";
  const bestKey = (id) => `neve-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    throw: lim(() => noise(0.06, 0.05, 3500)),
    snow: lim((n) => beep(500 + n * 120, 0.06, "sine", 0.04, 200)),
    ball: lim(() => arp([784, 1047], 0.05, 0.08, "sine", 0.045)),
    kick: lim(() => { noise(0.08, 0.1, 900); beep(220, 0.12, "square", 0.04, 300); }),
    bounce: lim(() => beep(180, 0.06, "triangle", 0.04)),
    smash: lim((n) => { noise(0.15, 0.12, 1200); beep(600 + n * 150, 0.1, "square", 0.04, 400); }),
    shatter: lim(() => { noise(0.3, 0.14, 2500); }),
    jump: lim(() => beep(300, 0.1, "square", 0.025, 350)),
    fruit: lim(() => arp([880, 1175], 0.05, 0.08, "square", 0.04)),
    fire: lim(() => noise(0.2, 0.06, 500)),
    hurry: () => arp([440, 415, 392, 370], 0.1, 0.12, "sawtooth", 0.035),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    die: () => { noise(0.3, 0.14, 500); for (let i = 0; i < 8; i++) beep(800 - i * 80, 0.1, "triangle", 0.04, 0, i * 0.06); },
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 30000;
  let plats = [], P = null, foes = [], shots = [], fires = [], fruits = [], parts = [], popups = [], message = null;
  let ghost = null, levelT = 0, lastBy = "";
  let jumpPressed = false, snowPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const flakes = Array.from({ length: 60 }, (_, i) => ({ x: (i * 131) % W, y: (i * 71) % H, s: 0.5 + (i % 3) * 0.4 }));

  // ---------- Platforms ----------
  // the surface an object standing at (x, y) with half-width hw rests on, or null
  function surfaceAt(x, hw, y0, y1, skip) {
    // returns the highest top crossed going down from y0 to y1
    let best = null;
    if (y0 <= GY && y1 >= GY) best = GY;
    for (const p of plats) {
      if (p === skip) continue;
      if (x + hw > p[0] && x - hw < p[1] && y0 <= p[2] && y1 >= p[2] && (best === null || p[2] < best)) best = p[2];
    }
    return best;
  }
  function platUnder(x, hw, y) {
    if (Math.abs(y - GY) < 0.5) return "floor";
    for (const p of plats) if (Math.abs(y - p[2]) < 0.5 && x + hw > p[0] && x - hw < p[1]) return p;
    return null;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    plats = LAYOUTS[(level - 1) % LAYOUTS.length].map((p) => p.slice());
    foes = []; shots = []; fires = []; fruits = []; ghost = null; levelT = 0;
    const n = Math.min(8, 3 + Math.floor(level / 2)) - (diff.fewer || 0);
    const ups = plats.filter((p) => p[2] <= 218).sort(() => Math.random() - 0.5);
    for (let i = 0; i < n; i++) {
      const p = ups[i % ups.length];
      const kind = level >= (diff.fewer < 0 ? 2 : 3) && i % 3 === 2 ? "drago" : level >= 2 && i % 2 === 1 ? "rana" : "diavolo";
      foes.push(makeFoe(kind, rnd(p[0] + 12, p[1] - 12), p[2]));
    }
    spawnPlayer();
    message = { text: `PIANO ${level}`, sub: "copri di neve i mostri e calcia le palle di neve!", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function makeFoe(kind, x, y) {
    return { kind, x, y, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, air: false, layers: 0, meltT: 0, state: "walk", t: rnd(1, 3), cd: rnd(2, 4), walk: 0, drop: null };
  }
  function spawnPlayer() { P = { x: W / 2, y: GY, vy: 0, air: false, face: 1, walk: 0, safe: 2, cd: 0, drop: null, dropT: 0, kickT: 0 }; }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 40000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 70, text: "VITA EXTRA!", color: "#7ed87a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play" || P.safe > 0) return;
    if (window.__deaths) window.__deaths.push([level, by]);
    if (window.__god) return;
    lives--; lastBy = by; sfx.die(); burst(P.x, P.y - 9, "#ffffff", 20, 110, 0.6);
    state = "dead"; stateT = 2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · piano ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PALLE DI NEVE</h1>
       <p>Un pupazzo di neve contro i mostri della torre! Tira fiocchi di neve ai mostri finché non diventano una palla di neve, poi dagli un calcio: la palla rotola giù per i piani travolgendo tutti i mostri che incontra. Più ne prende in fila, più punti fai. Libera ogni piano prima che arrivi la zucca!</p>
       <div class="pts">
         <span><b>Neve</b></span><span>4 colpi trasformano un mostro in una palla · se lo lasci stare la neve si scioglie</span>
         <span><b>Calcio</b></span><span>palla rotta 500 · mostri travolti 1.000, 2.000, 4.000, 8.000… · un frutto per ogni mostro</span>
         <span><b>Mostri</b></span><span>diavoletti · rane che saltano ai piani di sopra · draghetti che sputano fuoco</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per camminare (giù + SALTA per scendere da un piano) · SALTA · NEVE per tirare la neve o calciare una palla</p>`
         : `<p class="muted help">Frecce o A D per camminare · SPAZIO, W, ↑ o J per saltare (con ↓ scendi da un piano) · X, K o Z per la neve e il calcio · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>NEVICA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowdown: "down", s: "down" };
  const JUMPKEYS = [" ", "w", "arrowup", "j"], SNOWKEYS = ["x", "k", "z"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);

    for (const f of foes) drawFoe(f);
    if (state !== "menu" && (state !== "dead" || Math.floor(clock * 6) % 2)) drawSnowman();
    for (const s of shots) { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.beginPath(); ctx.arc(s.x - Math.sign(s.vx) * 5, s.y, 2.5, 0, TAU); ctx.fill(); }
    for (const fr of fires) { ctx.fillStyle = "#ff8a2a"; ctx.beginPath(); ctx.arc(fr.x, fr.y, 5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.arc(fr.x, fr.y, 2.5, 0, TAU); ctx.fill(); }
    if (ghost) { ctx.font = "22px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.globalAlpha = 0.85 + 0.15 * Math.sin(clock * 6); ctx.fillText("🎃", ghost.x, ghost.y); ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic"; }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1a1440"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ff7ab8";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a1440"; ctx.strokeText(message.text, W / 2, 70); ctx.fillText(message.text, W / 2, 70);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.strokeText(message.sub, W / 2, 89); ctx.fillText(message.sub, W / 2, 89); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = `PRESO DA ${lastBy}!`;
      ctx.strokeText(t, W / 2, 190); ctx.fillText(t, W / 2, 190);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="neve-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sciame Galattico</title>
<style>
  :root {
    --bg: #02020a;
    --fg: #f2f4ff;
    --muted: #a0a8c8;
    --cyan: #5ae8ff;
    --gold: #ffd34d;
    --red: #ff4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a1a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick (only left and right count) and a fire button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(90, 232, 255, 0.55); background: radial-gradient(circle, rgba(90,232,255,0.14), rgba(90,232,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(90, 232, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick i { position: absolute; top: 50%; transform: translateY(-50%); font: 900 14px system-ui, sans-serif; font-style: normal; color: rgba(242,244,255,0.35); pointer-events: none; }
  #touch .stick i.on { color: var(--gold); }
  #touch .stick i[data-d="left"] { left: 8px; }
  #touch .stick i[data-d="right"] { right: 8px; }
  #touch .fire { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 74, 90, 0.9); background: rgba(255, 74, 90, 0.2); }
  #touch .fire.on { background: rgba(255, 211, 77, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(2, 2, 10, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--cyan); text-shadow: 0 3px 0 #1a4a8a, 0 0 22px rgba(90,232,255,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--cyan); color: #02203a; background: var(--cyan); padding: 11px 30px; box-shadow: 0 4px 0 #1a4a8a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><i data-d="left">◀</i><i data-d="right">▶</i><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 480, HUD = 24, TAU = Math.PI * 2;
  const PY = 440;                                   // the player's ship line
  const KINDS = {
    bee:  { pts: 50,  dive: 100, hp: 1, col: "#ffd34d", col2: "#3a6aff" },
    fly:  { pts: 80,  dive: 160, hp: 1, col: "#ff4a5a", col2: "#ffffff" },
    boss: { pts: 150, dive: 400, hp: 2, col: "#3ad86a", col2: "#ffd34d" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 navi · tuffi lenti e pochi colpi", lives: 5, aggr: 0.7, fire: 0.6 },
    normale:   { label: "NORMALE",   color: "#5ae8ff", desc: "3 navi · l'esperienza classica", lives: 3, aggr: 1, fire: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 navi · sciami rapidi e aggressivi", lives: 3, aggr: 1.3, fire: 1.4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "sciame-difficulty";
  const bestKey = (id) => `sciame-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function bez(p, t) {
    const u = 1 - t;
    return [u * u * u * p[0][0] + 3 * u * u * t * p[1][0] + 3 * u * t * t * p[2][0] + t * t * t * p[3][0],
            u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1]];
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1500, 0.06, "square", 0.02, -900)),
    boom: lim(() => { noise(0.25, 0.25, 1400); beep(220, 0.15, "square", 0.02, -120); }),
    bossHit: lim(() => beep(600, 0.08, "square", 0.03, -200)),
    dive: lim(() => beep(900, 0.5, "triangle", 0.02, -600)),
    beam: lim(() => { for (let k = 0; k < 6; k++) beep(300 + k * 60, 0.25, "sine", 0.025, 200, k * 0.2); }),
    captured: () => arp([784, 659, 523, 440, 392, 330], 0.14, 0.2, "triangle", 0.04),
    rescue: () => arp([523, 659, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    die: () => { noise(0.9, 0.35, 700); arp([523, 415, 330, 262], 0.12, 0.18, "sawtooth", 0.035); },
    start: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.11, 0.16),
    clear: () => arp([659, 784, 1047, 1319], 0.08, 0.14),
    perfect: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568, 2093], 0.08, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, bestCache = 0, nextLife = 20000;
  let ship = null, foes = [], shots = [], eshots = [], parts = [], popups = [], message = null, stars = [];
  let diveT = 0, breathe = 0, challenge = false, chHits = 0, chTotal = 0, spawnQ = [], captive = null, rescue = null, fired = 0, hits = 0;
  let axis = 0, fireHeld = false, firePressed = false;
  const keys = { left: false, right: false };
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, v: rnd(20, 70), c: pick(["#ffffff", "#5ae8ff", "#ffd34d", "#ff8ad8"]) });

  const isChallenge = (s) => s >= 2 && (s - 2) % 4 === 0;      // stages 3, 7, 11…
  const pace = () => diff.aggr * (1 + Math.min(0.6, stage * 0.05));

  // ---------- Formation ----------
  function slotPos(row, col) {
    const spread = 1 + Math.sin(breathe) * 0.06, sway = Math.sin(breathe * 0.5) * 10;
    return [W / 2 + (col - 4.5) * 30 * spread + sway, 64 + row * 28 * (1 + Math.sin(breathe) * 0.03)];
  }
  function slots() {
    const list = [];
    for (let c = 3; c <= 6; c++) list.push({ kind: "boss", row: 0, col: c });
    for (let r = 1; r <= 2; r++) for (let c = 1; c <= 8; c++) list.push({ kind: "fly", row: r, col: c });
    for (let r = 3; r <= 4; r++) for (let c = 0; c <= 9; c++) list.push({ kind: "bee", row: r, col: c });
    return list;
  }
  // entry paths: from the top in two files, or from the lower sides, curling into a loop
  function entryPath(side, dir) {
    if (side === 0) return [[W / 2 + 12 * dir, -20], [W / 2 + 12 * dir, 190], [W / 2 - 150 * dir, 330], [W / 2 - 100 * dir, 250]];
    return [[side < 0 ? -20 : W + 20, 400], [side < 0 ? 100 : W - 100, 330], [side < 0 ? 210 : W - 210, 210], [side < 0 ? 150 : W - 150, 170]];
  }
  function buildStage() {
    foes = []; shots = []; eshots = []; spawnQ = [];
    challenge = isChallenge(stage);
    const all = slots();
    const take = (pred, n) => { const out = []; for (let i = 0; i < all.length && out.length < n; i++) if (pred(all[i])) out.push(all.splice(i--, 1)[0]); return out; };
    let groups;
    if (!challenge) {
      groups = [
        { side: 0, members: [...take((s) => s.kind === "bee", 4), ...take((s) => s.kind === "fly", 4)] },
        { side: -1, members: [...take((s) => s.kind === "boss", 4), ...take((s) => s.kind === "fly", 4)] },
        { side: 1, members: take((s) => s.kind === "fly", 8) },
        { side: -1, members: take((s) => s.kind === "bee", 8) },
        { side: 1, members: take((s) => s.kind === "bee", 8) },
      ];
    } else {
      // the bonus stage: forty aliens fly past and never shoot
      const kinds = ["bee", "fly", "boss", "fly", "bee"];
      groups = kinds.map((k, i) => ({ side: [0, -1, 1, 0, -1][i], members: Array.from({ length: 8 }, () => ({ kind: k })) }));
      chHits = 0; chTotal = 40;
    }
    let delay = 0.8;
    groups.forEach((g, gi) => {
      g.members.forEach((m, i) => {
        const dir = g.side === 0 ? (i % 2 ? -1 : 1) : 1;
        spawnQ.push({ t: delay + Math.floor(i / (g.side === 0 ? 2 : 1)) * 0.16, kind: m.kind, row: m.row, col: m.col, path: entryPath(g.side, dir), loopDir: g.side === 0 ? dir : -g.side });
      });
      delay += challenge ? 2.2 : 2.6 / Math.min(1.5, pace());
    });
    diveT = 3.5;
  }
  function spawnFoe(q) {
    const k = KINDS[q.kind];
    const f = { kind: q.kind, hp: k.hp, row: q.row, col: q.col, st: "enter", t: 0, path: q.path, loopDir: q.loopDir, x: q.path[0][0], y: q.path[0][1], ang: Math.PI / 2, cool: rnd(0.5, 2), beam: 0 };
    foes.push(f);
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; nextLife = 20000; fired = 0; hits = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    ship = { x: W / 2, dual: false, inv: 0, cool: 0, dead: false, spin: 0 };
    captive = null; rescue = null;
    beginStage();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginStage() {
    buildStage();
    message = challenge ? { text: "LIVELLO BONUS", sub: "Non sparano: abbattili tutti e 40!", t: 0 } : { text: `LIVELLO ${stage + 1}`, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#f2f4ff") {
    score += n;
    if (x !== undefined && n >= 150) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife = nextLife === 20000 ? 70000 : nextLife + 70000;
      if (lives < 9) lives++; sfx.life();
      popups.push({ x: W / 2, y: H / 2, text: "NAVE EXTRA", color: "#ffd34d", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 12, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function loseShip(side) {
    if (state !== "play" || ship.inv > 0 || ship.dead) return;
    if (ship.dual) {
      // one of the two fighters goes, the other carries on
      ship.dual = false; ship.x += side * 10; ship.inv = 1;
      sfx.die(); burst(ship.x - side * 20, PY, "#ffffff", 20, 140, 0.8);
      return;
    }
    lives--; ship.dead = true;
    sfx.die(); burst(ship.x, PY, "#ffffff", 30, 160, 1); burst(ship.x, PY, "#ff5a3a", 20, 120, 0.9);
    state = "dead"; stateT = 2.4;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    ship = { x: W / 2, dual: false, inv: 2, cool: 0, dead: false, spin: 0 };
    eshots = [];
    for (const f of foes) if (f.st === "dive" || f.st === "plunge" || f.st === "beam") { f.st = "return"; }
    state = "play"; diveT = 2.5;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, st = stage + 1, ratio = fired ? Math.round(hits / fired * 100) : 0;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${st} · ${played}</p>
       <p class="muted">Colpi sparati ${fired} · a segno ${hits} · precisione ${ratio}%</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SCIAME GALATTICO</h1>
       <p>Lo sciame entra a spirale e si schiera in formazione, poi gli alieni si tuffano su di te. Attento al comandante verde: col suo raggio traente può catturare la tua nave! Se lo abbatti mentre si tuffa con la nave prigioniera, la liberi e voli con due caccia affiancati.</p>
       <div class="pts">
         <span><b>Ape · Farfalla</b></span><span>50 · 80 in formazione, il doppio in picchiata</span>
         <span><b>Comandante</b></span><span>due colpi · 150, 400 in picchiata</span>
         <span><b>Nave liberata</b></span><span>1.000 e doppio caccia</span>
         <span><b>Livello bonus</b></span><span>100 a colpo · 10.000 se li prendi tutti</span>
       </div>
       ${touchMode

    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.textAlign = "center"; ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a5a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, W / 2, 12);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#5ae8ff";
    ctx.fillText(challenge ? "BONUS" : `LIV ${stage + 1}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.save(); ctx.scale(0.7, 0.7); drawShipAt((12 + i * 18) / 0.7, (H - 10) / 0.7); ctx.restore(); }
    for (let i = 0; i < Math.min(stage + 1, 12); i++) { const x = W - 10 - i * 9; ctx.fillStyle = (i + 1) % 5 === 0 ? "#ffd34d" : "#ff4a5a"; ctx.beginPath(); ctx.moveTo(x, H - 16); ctx.lineTo(x + 5, H - 12); ctx.lineTo(x, H - 8); ctx.fill(); ctx.fillStyle = "#aaa"; ctx.fillRect(x - 1, H - 16, 1, 12); }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#5ae8ff";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, H / 2 + 10); ctx.fillText(message.text, W / 2, H / 2 + 10);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff"; ctx.strokeText(message.sub, W / 2, H / 2 + 30); ctx.fillText(message.sub, W / 2, H / 2 + 30); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="sciame-best-" data-kind="score"></script>

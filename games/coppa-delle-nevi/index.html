<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coppa delle Nevi</title>
<style>
  :root {
    --bg: #0b1730;
    --fg: #f4f8ff;
    --muted: #b8cce8;
    --pink: #ff3b4a;
    --yellow: #ffd23a;
    --red: #ff5a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a7a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: steer (down to tuck, up to brake); SALTA hops, takes off and lands the ski jump */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 255, 255, 0.6); background: radial-gradient(circle, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 59, 74, 0.9); background: rgba(255, 59, 74, 0.22); }
  #touch .jump.on { background: rgba(255, 59, 74, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(11, 23, 48, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a0a1a, 0 0 22px rgba(255,59,74,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #fff; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a81a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Salta">SALTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28, PY = 100, SEG = 20, PXM = 10;
  const MAXA = 1.15, GRAV = 230, DRAG = 0.0052;
  // the ski jump, seen from the side: the in-run ends at the lip, then the landing hill
  const RS = { x: 60, y: 80 }, LIP = { x: 520, y: 320 }, RUN = Math.hypot(LIP.x - RS.x, LIP.y - RS.y);
  const RU = { x: (LIP.x - RS.x) / RUN, y: (LIP.y - RS.y) / RUN }, JPM = 8.5, KPT = 110, HS = 130, WIN = 70;
  const EVENTS = [
    { id: "discesa", name: "DISCESA LIBERA", sub: "scendi fino all'arrivo prima che scada il tempo" },
    { id: "slalom", name: "SLALOM GIGANTE", sub: "passa tra i paletti di ogni porta" },
    { id: "salto", name: "SALTO DAL TRAMPOLINO", sub: "stacca sul dente, stai in equilibrio, atterra in telemark" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "più tempo · porte larghe · meno ostacoli e vento leggero", time: 1.3, dens: 0.6, gap: 84, pen: 2, skier: 0.8, half: 1.12, wind: 0.6 },
    normale:   { label: "NORMALE",   color: "#5ad0ff", desc: "il tempo giusto · porta mancata: 3 secondi", time: 1.0, dens: 1, gap: 70, pen: 3, skier: 1, half: 1, wind: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "tempo stretto · porte strette · più ostacoli e più vento · porta mancata: 4 secondi", time: 0.86, dens: 1.3, gap: 58, pen: 4, skier: 1.25, half: 0.9, wind: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "coppa-difficulty";
  const bestKey = (id) => `coppa-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtT = (t) => Math.max(0, t).toFixed(1).replace(".", ",");

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    carve: lim(() => noise(0.12, 0.035, 2400)),
    hop: lim(() => beep(300, 0.1, "square", 0.025, 300)),
    land: lim(() => noise(0.08, 0.06, 900)),
    crash: () => { noise(0.35, 0.14, 700); for (let i = 0; i < 6; i++) beep(600 - i * 70, 0.09, "triangle", 0.04, 0, i * 0.06); },
    flag: lim(() => arp([988, 1319], 0.05, 0.08, "square", 0.04)),
    gate: lim((n) => beep(660 + Math.min(6, n) * 80, 0.09, "sine", 0.05, 120)),
    miss: lim(() => beep(180, 0.25, "sawtooth", 0.04, -60)),
    pole: lim(() => beep(1200, 0.05, "square", 0.03, -400)),
    bump: lim(() => beep(140, 0.08, "triangle", 0.04)),
    tick: lim(() => beep(880, 0.06, "square", 0.03)),
    whoosh: lim(() => noise(0.5, 0.07, 1500)),
    tele: () => arp([784, 988, 1175, 1568], 0.07, 0.12, "square", 0.045),
    finish: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, tappa = 1, evI = 0, bestCache = 0, timeLeft = 0, timeMax = 0, endWhy = "";
  let P = null, J = null, course = null, obs = [], gates = [], skiers = [], parts = [], popups = [], trail = [], message = null;
  let camY = 0, lastTick = 0, gateStreak = 0, missedGates = 0, carveT = 0;
  let jumpPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const ev = () => EVENTS[evI].id;
  const mult = () => 1 + 0.5 * (tappa - 1);

  // ---------- Course ----------
  // the piste: a centre line and a half-width, sampled every SEG pixels down the mountain
  function buildCourse(kind) {
    const lvl = tappa - 1, slalom = kind === "slalom";
    const nGates = slalom ? 18 + 2 * lvl : 0, space = Math.max(170, 212 - 7 * lvl);
    const len = slalom ? 480 + nGates * space + 260 : 6200 + lvl * 500;
    const n = Math.ceil(len / SEG) + 60, cs = [], hs = [];
    let cx = W / 2, target = W / 2;
    for (let i = 0; i < n; i++) {
      const y = i * SEG;
      const base = slalom ? 252 : clamp(170 * diff.half * (1 - 0.05 * lvl), 118, 210);
      const h = y < 360 ? Math.max(base, 260) : slalom ? base : base + 30 * Math.sin(i * 0.05) * Math.sin(i * 0.013);
      if (!slalom && i % 24 === 0 && y > 300) target = rnd(h + 24, W - h - 24);
      if (slalom) target = W / 2 + 40 * Math.sin(i * 0.02);
      cx += clamp((target - cx) * 0.05, -6, 6);
      cs.push(clamp(cx, h + 10, W - h - 10)); hs.push(h);
    }
    course = { kind, len, cs, hs };
    obs = []; gates = []; skiers = [];
    const dens = diff.dens * (1 + 0.14 * lvl);
    if (slalom) {
      let side = Math.random() < 0.5 ? -1 : 1;
      const gap = Math.max(46, diff.gap - 2 * lvl);
      for (let i = 0; i < nGates; i++) {
        const y = 480 + i * space, c = centerAt(y);
        gates.push({ y, x: c + side * rnd(50, Math.min(115, 75 + 6 * lvl)), gap, red: i % 2 === 0, done: false, hit: false });
        side = -side;
        // later on, a few bumps between the gates
        if (lvl >= 1 && Math.random() < 0.2 * dens) obs.push({ t: "mogul", x: c + rnd(-150, 150), y: y + space / 2, r: 14 });
      }
    } else {
      let y = 520, lastHard = -999, lastX = 0;
      while (y < len - 320) {
        const c = centerAt(y), h = halfAt(y);
        const roll = Math.random();
        let t = roll < 0.4 ? "tree" : roll < 0.62 ? "rock" : roll < 0.76 ? "mogul" : roll < 0.9 ? "flag" : "kicker";
        let x = c + rnd(-0.78, 0.78) * h;
        const hard = t === "tree" || t === "rock";
        // two hard obstacles close together stay in the same lane or well apart, so there's always a way through
        if (hard && y - lastHard < 120 && Math.abs(x - lastX) > 24 && Math.abs(x - lastX) < 140) x = lastX + (x > lastX ? 140 : -140);
        if (hard && Math.abs(x - c) > h - 30) x = c + Math.sign(x - c) * (h - 30);
        if (hard) { lastHard = y; lastX = x; }
        obs.push({ t, x, y, r: { tree: 11, rock: 9, mogul: 14, flag: 9, kicker: 14 }[t] });
        y += clamp(rnd(85, 140) / dens, 60, 240);
      }
      const nSk = Math.round((2 + lvl) * diff.skier * Math.min(1.3, dens));
      const cols = ["#3a7aff", "#ffd23a", "#3ad07a", "#c87aff", "#ff8a2a"];
      for (let i = 0; i < nSk; i++) {
        const sy = 900 + (i + rnd(0.1, 0.9)) * (len - 1600) / nSk;
        skiers.push({ x: centerAt(sy), y: sy, v: rnd(70, 105) * diff.skier, ph: rnd(0, TAU), w: rnd(0.6, 1.0), amp: rnd(0.3, 0.55), col: cols[i % cols.length], a: 0, jumped: false });
      }
    }
  }
  function sample(arr, y) { const f = clamp(y / SEG, 0, arr.length - 1.001), i = Math.floor(f); return arr[i] + (arr[i + 1] - arr[i]) * (f - i); }
  const centerAt = (y) => sample(course.cs, y), halfAt = (y) => sample(course.hs, y);
  // the landing hill of the ski jump
  function hillY(x) {
    if (x < LIP.x) return LIP.y + 34 + (x - LIP.x) * 0.2;
    const d = Math.min(x - LIP.x, 1435);
    return LIP.y + 34 + 0.66 * d - 0.00023 * d * d;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "finish"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; tappa = 1; evI = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginEvent();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginEvent() {
    parts = []; popups = []; trail = []; gateStreak = 0; missedGates = 0; lastTick = 0;
    const E = EVENTS[evI];
    if (E.id === "salto") {
      course = null; obs = []; gates = []; skiers = [];
      J = { phase: "inrun", s: 0, v: 40, x: RS.x, y: RS.y, vx: 0, vy: 0, b: 0, gust: 0, q: 0, early: false, tele: false, teleEarly: false, dist: 0, fell: false, t: 0, top: 0, kmh: 0 };
      timeLeft = timeMax = 0;
    } else {
      J = null;
      buildCourse(E.id);
      P = { x: centerAt(0), y: 0, a: 0, v: 30, air: false, airT: 0, airMax: 0, fall: 0, safe: 0, tuck: false, brake: false, lastY: 0, poleHit: null };
      const lvlT = Math.max(0.75, Math.pow(E.id === "slalom" ? 0.97 : 0.95, tappa - 1));
      timeMax = timeLeft = Math.round((E.id === "slalom" ? course.len / 146 : course.len / 196) * diff.time * lvlT + 2);
    }
    camY = -PY;
    message = { text: `TAPPA ${tappa} · ${E.name}`, sub: E.id === "salto" ? E.sub : `${E.sub} · ${timeMax} secondi`, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function nextEvent() {
    evI++;
    if (evI >= EVENTS.length) { evI = 0; tappa++; }
    beginEvent();
  }
  function addScore(n, x, y, color = "#1a2a4a", text) {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function crash(why) {
    if (P.fall > 0 || P.safe > 0) return;
    if (window.__crashes) window.__crashes.push([tappa, ev(), why]);
    P.fall = 1.3; P.v = 0; P.air = false;
    sfx.crash(); burst(P.x, P.y, "#ffffff", 22, 120, 0.7);
    popups.push({ x: P.x, y: P.y - 18, text: `CADUTA! ${why}`, color: "#ff3b4a", t: 0 });
  }
  function finishEvent(text, sub) {
    message = { text, sub, t: 0 };
    sfx.finish();
    state = "finish"; stateT = 2.8;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${endWhy === "tempo" ? "TEMPO SCADUTO!" : "GARA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · tappa ${tappa}, ${EVENTS[evI].name.toLowerCase()} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GAREGGIA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); endWhy = ""; gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>COPPA DELLE NEVI</h1>

      ctx.fillStyle = "#ff3b4a"; ctx.fillRect(c - 90, fin - 34, 180, 16);
      ctx.fillStyle = "#ffffff"; ctx.font = "italic 900 12px system-ui"; ctx.textAlign = "center"; ctx.fillText("ARRIVO", c, fin - 22);
      ctx.fillStyle = "#1a2a4a"; ctx.fillRect(c - 92, fin - 34, 3, 34); ctx.fillRect(c + 89, fin - 34, 3, 34);
    }
  }
  function drawObstacles() {
    const list = obs.filter((o) => o.y - camY > TOP - 30 && o.y - camY < H + 30).sort((a, b) => a.y - b.y);
    for (const o of list) {
      const x = o.x, y = o.y - camY;
      if (o.t === "tree") drawTree(x, y, 1.1);
      else if (o.t === "rock") {
        ctx.fillStyle = "rgba(60,90,140,0.2)"; ctx.beginPath(); ctx.ellipse(x + 3, y + 5, 11, 4, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#6a7488"; ctx.beginPath(); ctx.moveTo(x - 10, y + 4); ctx.lineTo(x - 7, y - 5); ctx.lineTo(x, y - 8); ctx.lineTo(x + 8, y - 4); ctx.lineTo(x + 10, y + 4); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(x - 6, y - 5); ctx.lineTo(x, y - 8); ctx.lineTo(x + 6, y - 5); ctx.lineTo(x, y - 4); ctx.fill();
      } else if (o.t === "mogul") {
        ctx.fillStyle = "rgba(150,175,215,0.5)"; ctx.beginPath(); ctx.ellipse(x + 2, y + 3, 15, 8, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x - 1, y, 14, 7, 0, 0, TAU); ctx.fill();
      } else if (o.t === "kicker") {
        ctx.fillStyle = "#b8cce8"; ctx.beginPath(); ctx.moveTo(x - 15, y - 8); ctx.lineTo(x + 15, y - 8); ctx.lineTo(x + 13, y + 7); ctx.lineTo(x - 13, y + 7); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 15, y - 8, 30, 9);
        ctx.fillStyle = "#3a7aff"; ctx.fillRect(x - 15, y + 5, 30, 2);
      } else if (o.t === "flag" && !o.used) {
        ctx.strokeStyle = "#1a2a4a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x, y - 12); ctx.stroke();
        ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x + 10 + Math.sin(clock * 8) * 1.5, y - 8); ctx.lineTo(x, y - 4); ctx.fill();
      }
    }
    for (const g of gates) {
      const y = g.y - camY; if (y < TOP - 30 || y > H + 30) continue;
      const col = g.red ? "#ff3b4a" : "#3a7aff";
      for (const sd of [-1, 1]) {
        const x = g.x + sd * g.gap / 2;
        ctx.strokeStyle = "#1a2a4a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x, y - 18); ctx.stroke();
        ctx.fillStyle = g.done && !g.ok ? "#8a9ab8" : col; ctx.fillRect(x - (sd < 0 ? 0 : 12), y - 18, 12, 9);
      }
      if (g.done) { ctx.fillStyle = g.ok ? "#3ad07a" : "#ff3b4a"; ctx.font = "900 10px system-ui"; ctx.textAlign = "center"; ctx.fillText(g.ok ? "✓" : "✗", g.x, y - 6); }
    }
  }
  function drawDownhill() {
    drawSlope();
    drawObstacles();
    for (const s of skiers) { const y = s.y - camY; if (y > TOP - 20 && y < H + 20) drawSkierTop(s.x, y, s.a, s.col); }
    if (P && !(P.safe > 0 && Math.floor(clock * 12) % 2)) drawSkierTop(P.x, P.y - camY, P.a, "#ff3b4a", { tuck: P.tuck, brake: P.brake, air: P.air ? P.airT / P.airMax : 0, fall: P.fall > 0 ? 1.3 - P.fall : 0 });
  }
  function drawJump() {
    const cx = clamp(J.x - 210, -40, 2200), cy = clamp(J.y - 130, -20, 760);
    const sky = ctx.createLinearGradient(0, TOP, 0, H);
    sky.addColorStop(0, "#5a9ae8"); sky.addColorStop(1, "#c8e0ff");
    ctx.fillStyle = sky; ctx.fillRect(0, TOP, W, H - TOP);
    // far mountains
    ctx.fillStyle = "#9ab8e0";
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) { const wx = x + cx * 0.15; ctx.lineTo(x, 190 - cy * 0.08 + Math.sin(wx * 0.011) * 40 + Math.sin(wx * 0.031) * 14); }
    ctx.lineTo(W, H); ctx.fill();
    ctx.fillStyle = "#b8d0f0";
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) { const wx = x + cx * 0.3; ctx.lineTo(x, 250 - cy * 0.16 + Math.sin(wx * 0.017 + 2) * 26 + Math.sin(wx * 0.043) * 8); }
    ctx.lineTo(W, H); ctx.fill();
    ctx.save(); ctx.translate(-cx, -cy);
    // the landing hill
    ctx.fillStyle = "#f4f8ff"; ctx.beginPath(); ctx.moveTo(LIP.x - 260, hillY(LIP.x - 260));
    for (let x = LIP.x - 260; x <= LIP.x + 2400; x += 20) ctx.lineTo(x, hillY(x));
    ctx.lineTo(LIP.x + 2400, 1400); ctx.lineTo(LIP.x - 260, 1400); ctx.fill();
    ctx.strokeStyle = "#b8cce8"; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = LIP.x - 260; x <= LIP.x + 2400; x += 20) ctx.lineTo(x, hillY(x));
    ctx.stroke();
    // distance lines every 10 metres, the K point and the hill size
    ctx.font = "800 11px system-ui"; ctx.textAlign = "center";
    for (let m = 40; m <= 150; m += 10) {
      const x = LIP.x + m * JPM, y = hillY(x);
      ctx.strokeStyle = m === KPT ? "#ff3b4a" : m === HS ? "#1a2a4a" : "rgba(58,122,255,0.45)"; ctx.lineWidth = m === KPT || m === HS ? 3 : 1.5;
      ctx.beginPath(); ctx.moveTo(x - 6, y - 4); ctx.lineTo(x + 6, y + 4); ctx.stroke();
      ctx.fillStyle = m === KPT ? "#ff3b4a" : "#3a5a8a"; ctx.fillText(m === KPT ? `K ${m}` : m === HS ? `HS ${m}` : String(m), x + 14, y - 8);
    }
    // the crowd at the bottom
    for (let i = 0; i < 70; i++) { const x = LIP.x + 1435 + 40 + (i % 35) * 14, y = hillY(x) - 10 - Math.floor(i / 35) * 10; ctx.fillStyle = ["#ff3b4a", "#3a7aff", "#ffd23a", "#3ad07a"][i % 4]; ctx.beginPath(); ctx.arc(x, y + Math.sin(clock * 6 + i) * (J.phase !== "inrun" ? 1.5 : 0), 3.5, 0, TAU); ctx.fill(); }
    // the in-run tower
    ctx.fillStyle = "#6a7488";
    ctx.beginPath(); ctx.moveTo(RS.x - 10, RS.y); ctx.lineTo(LIP.x, LIP.y); ctx.lineTo(LIP.x, LIP.y + 12); ctx.lineTo(RS.x + 30, H + 600); ctx.lineTo(RS.x - 30, H + 600); ctx.fill();
    ctx.strokeStyle = "#4a5468"; ctx.lineWidth = 2;
    for (let k = 1; k < 8; k++) { const x = RS.x + (LIP.x - RS.x) * k / 8, y = RS.y + (LIP.y - RS.y) * k / 8; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x - 10, y + 400); ctx.stroke(); }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(RS.x - 10, RS.y - 2); ctx.lineTo(LIP.x, LIP.y - 2); ctx.stroke();
    // the take-off zone, greener towards the lip
    if (J.phase === "inrun") for (let k = 0; k < 7; k++) {
      const s0 = RUN - WIN + k * WIN / 7; ctx.strokeStyle = `rgba(58,208,122,${0.25 + k * 0.1})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(RS.x + RU.x * s0, RS.y + RU.y * s0 - 2); ctx.lineTo(RS.x + RU.x * (s0 + WIN / 7), RS.y + RU.y * (s0 + WIN / 7) - 2); ctx.stroke();
    }
    ctx.fillStyle = "#ff3b4a"; ctx.fillRect(LIP.x - 3, LIP.y - 10, 3, 10);
    drawJumper();
    ctx.restore();
  }
  function drawJumper() {
    const x = J.x, y = J.y;
    ctx.save(); ctx.translate(x, y);
    let ang = Math.atan2(RU.y, RU.x), crouch = 1;
    if (J.phase === "flight") { ang = 0.42 + J.b * 0.55; crouch = 0; }
    else if (J.phase === "out") { const d = 4; ang = Math.atan2(hillY(x + d) - hillY(x - d), 2 * d); crouch = J.fell ? 2 : 0.5; }
    ctx.rotate(ang);
    if (crouch === 2) {
      ctx.strokeStyle = "#1a2a4a"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(10, -6); ctx.moveTo(-4, -2); ctx.lineTo(18, 2); ctx.stroke();
      ctx.fillStyle = "#ff3b4a"; ctx.beginPath(); ctx.ellipse(0, -5, 10, 4, 0, 0, TAU); ctx.fill();
      ctx.restore(); return;
    }
    // skis
    ctx.strokeStyle = "#1a2a4a"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    if (J.phase === "flight") { ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(22, -9); ctx.moveTo(-6, 0); ctx.lineTo(22, -3); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(16, 0); ctx.stroke(); }
    // body: crouched on the in-run, stretched out over the skis in flight
    ctx.fillStyle = "#ff3b4a";
    if (crouch === 1) { ctx.fillRect(-6, -9, 6, 9); ctx.beginPath(); ctx.ellipse(1, -11, 9, 4, 0.2, 0, TAU); ctx.fill(); ctx.fillStyle = "#f4f8ff"; ctx.beginPath(); ctx.arc(10, -12, 3.5, 0, TAU); ctx.fill(); }
    else if (crouch === 0.5) { ctx.fillRect(-4, -14, 6, 14); ctx.fillStyle = "#f4f8ff"; ctx.beginPath(); ctx.arc(-1, -18, 3.5, 0, TAU); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(6, -6, 13, 3.5, -0.32, 0, TAU); ctx.fill(); ctx.fillStyle = "#f4f8ff"; ctx.beginPath(); ctx.arc(19, -10, 3.5, 0, TAU); ctx.fill(); ctx.strokeStyle = "#ff3b4a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(-6, -4); ctx.stroke(); }
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(11,23,48,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#b8cce8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff3b4a"; ctx.font = "900 10px system-ui"; ctx.fillText(`TAPPA ${tappa} · ${EVENTS[evI].name.split(" ")[0]}`, x0 + 80, 21);
    if (P && !J) {
      ctx.fillStyle = "#b8cce8"; ctx.font = "800 9px system-ui"; ctx.fillText(`${Math.round(P.v * 0.36)} km/h`, x0 + 210, 14);
      const k = clamp(P.y / course.len, 0, 1); ctx.fillStyle = "#2a4a7a"; ctx.fillRect(x0 + 260, 11, 70, 6); ctx.fillStyle = "#ffffff"; ctx.fillRect(x0 + 260, 11, 70 * k, 6);
      const tx = touchMode ? W - 60 : W - 12;
      ctx.textAlign = "right"; ctx.font = "900 16px system-ui";
      ctx.fillStyle = timeLeft < 5 && Math.floor(clock * 4) % 2 ? "#ffffff" : timeLeft < 5 ? "#ff3b4a" : "#ffd23a";
      ctx.fillText(`⏱ ${fmtT(timeLeft)}`, tx, 14);
    }
    if (J) {
      ctx.fillStyle = "#b8cce8"; ctx.font = "800 9px system-ui";
      ctx.fillText(J.phase === "inrun" ? `${Math.round(J.v * 0.25)} km/h` : J.phase === "flight" ? `${Math.max(0, (J.x - LIP.x) / JPM).toFixed(1).replace(".", ",")} m` : `${J.dist.toFixed(1).replace(".", ",")} m`, x0 + 210, 14);
    }
    ctx.textBaseline = "alphabetic";
    // in flight: the balance gauge and the landing call
    if (J && J.phase === "flight") {
      const gx = W / 2, gy = H - 22;
      ctx.fillStyle = "rgba(11,23,48,0.75)"; ctx.fillRect(gx - 90, gy - 9, 180, 18);
      ctx.fillStyle = "rgba(58,208,122,0.6)"; ctx.fillRect(gx - 22, gy - 6, 44, 12);
      ctx.fillStyle = "rgba(255,59,74,0.5)"; ctx.fillRect(gx - 86, gy - 6, 20, 12); ctx.fillRect(gx + 66, gy - 6, 20, 12);
      ctx.fillStyle = Math.abs(J.b) > 0.8 ? "#ff3b4a" : "#ffffff"; ctx.fillRect(gx + clamp(J.b, -1.1, 1.1) * 78 - 2, gy - 8, 4, 16);
      ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = "#ffffff"; ctx.fillText("EQUILIBRIO", gx, gy - 12);
      const hgt = hillY(J.x) - J.y;
      if (hgt < 45 && J.vy > 0 && !J.tele && !J.teleEarly) { ctx.font = "italic 900 20px system-ui"; ctx.fillStyle = "#ffd23a"; ctx.lineWidth = 4; ctx.strokeStyle = "#1a2a4a"; ctx.strokeText("ATTERRA!", W / 2, 120); ctx.fillText("ATTERRA!", W / 2, 120); }
    }
    if (J && J.phase === "inrun" && state === "play" && J.s > RUN - WIN - 60) { ctx.font = "italic 900 20px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = J.s > RUN - WIN ? "#3ad07a" : "#ffffff"; ctx.lineWidth = 4; ctx.strokeStyle = "#1a2a4a"; ctx.strokeText("STACCA!", W / 2, 120); ctx.fillText("STACCA!", W / 2, 120); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu" && !course && !J) { tappa = 1; buildCourse("discesa"); camY = 900; P = null; }
    if (J) drawJump(); else drawDownhill();
    const ox = J ? -clamp(J.x - 210, -40, 2200) : 0, oy = J ? -clamp(J.y - 130, -20, 760) : -camY;
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x + ox - 1.5, p.y + oy - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.strokeText(p.text, p.x + ox, p.y + oy); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x + ox, p.y + oy);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ff3b4a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#ffffff"; ctx.strokeText(message.text, W / 2, 70); ctx.fillText(message.text, W / 2, 70);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#1a2a4a"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 89); ctx.fillText(message.sub, W / 2, 89); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="coppa-best-" data-kind="score"></script>

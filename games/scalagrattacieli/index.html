<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scalagrattacieli</title>
<style>
  :root {
    --bg: #0a0c1a;
    --fg: #f2f4ff;
    --muted: #a8b0d0;
    --hero: #ff5a3a;
    --sky: #5ab8ff;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a3050, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 244, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: center; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 56px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch button {
    width: 60px; height: 56px; border-radius: 14px; touch-action: none;
    font: 700 22px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(90, 184, 255, 0.7); background: rgba(90, 184, 255, 0.1);
  }
  #touch button[data-a="up"] { border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.14); }
  /* in landscape the pad is split: left/right on one side, up/down on the other */
  #touch.split { justify-content: space-between; }
  #touch.split .pad { display: contents; }
  #touch.split .side { display: flex; gap: 8px; pointer-events: auto; }
  #touch.split .side.v { flex-direction: column; }
  #touch.split button[data-a="up"] { height: 76px; }
  #touch.small button { width: 50px; height: 48px; font-size: 18px; }
  #touch.small.split button[data-a="up"] { height: 60px; }
  #touch button.on { background: rgba(242, 244, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 12, 26, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(24px, 7.6vw, 56px); font-weight: 900; letter-spacing: 1px; max-width: 100%; color: var(--sky); text-shadow: 0 3px 0 #1a3a8a, 0 0 22px rgba(90,184,255,0.5); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--hero); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,244,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--sky); color: #06122a; background: var(--sky); padding: 11px 30px; box-shadow: 0 4px 0 #1a5aa8; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <div class="side h" style="display:contents">
      <button type="button" data-a="left" aria-label="Sinistra">◀</button>
      <button type="button" data-a="right" aria-label="Destra">▶</button>
    </div>
    <div class="side v" style="display:contents">
      <button type="button" data-a="up" aria-label="Su">▲</button>
      <button type="button" data-a="down" aria-label="Giù">▼</button>
    </div>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 384, H = 512, TOP = 30;
  const CW = 56, FH = 56, NCOLS = 6, BX = (W - NCOLS * CW) / 2;
  const SCREEN_BASE = 380;
  const CLIMB_T = 0.42, SIDE_T = 0.3;
  // four buildings, each narrower towards the top (setbacks: [from floor, first column, last column])
  const BUILDINGS = [
    { name: "IL PALAZZO DEGLI UFFICI", floors: 24, wall: "#c8b89a", trim: "#8a7a5a", sky: ["#5ab8ff", "#bfe6ff"], night: false,
      setbacks: [[0, 0, 5], [12, 1, 4]] },
    { name: "L'HOTEL AL TRAMONTO", floors: 30, wall: "#b86a5a", trim: "#6a3a2a", sky: ["#3a2a6a", "#ff9a5a"], night: false,
      setbacks: [[0, 0, 5], [10, 1, 5], [20, 1, 3]] },
    { name: "LA TORRE DI VETRO", floors: 36, wall: "#4a6a8a", trim: "#2a3a5a", sky: ["#02040e", "#1a2050"], night: true,
      setbacks: [[0, 0, 5], [8, 0, 4], [18, 1, 4], [28, 2, 4]] },
    { name: "IL GRATTACIELO DEI RECORD", floors: 42, wall: "#6a6a7a", trim: "#3a3a4a", sky: ["#1a1a2a", "#5a6a8a"], night: true,
      setbacks: [[0, 0, 5], [10, 1, 5], [20, 1, 4], [30, 2, 4], [36, 2, 3]] },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · poche finestre si chiudono, pochi oggetti dall'alto", lives: 5, active: 0.18, haz: 0.55 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, active: 0.28, haz: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a3a", desc: "3 vite · finestre dispettose e pioggia di oggetti", lives: 3, active: 0.38, haz: 1.4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "scala-difficulty";
  const bestKey = (id) => `scala-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("split", !portrait);
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    for (const s of touchEl.querySelectorAll(".side")) s.style.display = portrait ? "contents" : "flex";
    wrap.style.paddingBottom = showTouch && portrait ? "calc(190px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 190;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.querySelectorAll(".side")].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 240) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    climb: lim((k) => beep(k ? 330 : 294, 0.06, "square", 0.025)),
    side: lim(() => beep(260, 0.05, "triangle", 0.03)),
    pinch: lim(() => { noise(0.15, 0.2, 1500); beep(900, 0.2, "square", 0.04, -600); }),
    warn: lim(() => arp([1200, 900], 0.08, 0.07, "square", 0.03)),
    whistle: lim(() => beep(1400, 0.4, "sine", 0.03, -900)),
    hit: () => { noise(0.4, 0.3, 600); arp([523, 392, 330, 262, 196], 0.1, 0.14, "sawtooth", 0.035); },
    crash: lim(() => noise(0.25, 0.25, 400)),
    balloon: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12, "triangle", 0.05),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    tick: lim(() => beep(1600, 0.03, "square", 0.02)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, bestCache = 0, nextLife = 30000;
  let windows = [], climber = null, camY = 0, hazards = [], balloon = null, balloonT = 20, bonusTime = 5000, bonusTick = 0;
  let potT = 3, girderT = 8, birdT = 12, parts = [], popups = [], message = null, stageT = 0, maxFloor = 0;
  const ctl = { up: false, down: false, left: false, right: false };

  const B = () => BUILDINGS[stage % BUILDINGS.length];
  const lap = () => Math.floor(stage / BUILDINGS.length);
  function colsAt(f) {
    const b = B();
    if (f < 0 || f >= b.floors) return null;
    let r = b.setbacks[0];
    for (const s of b.setbacks) if (f >= s[0]) r = s;
    return [r[1], r[2]];
  }
  const inBuilding = (c, f) => { const r = colsAt(f); return !!r && c >= r[0] && c <= r[1]; };
  const win = (c, f) => (inBuilding(c, f) ? windows[f][c] : null);
  const colX = (c) => BX + c * CW + CW / 2;
  const screenY = (wy) => SCREEN_BASE - (wy - camY);

  function buildStage() {
    const b = B();
    const active = Math.min(0.6, diff.active + stage * 0.04);
    windows = [];
    for (let f = 0; f < b.floors; f++) {
      windows.push([]);
      for (let c = 0; c < NCOLS; c++) {
        // the first two floors are always calm
        const act = f >= 2 && Math.random() < active;
        windows[f].push({ o: 1, st: "open", t: rnd(0.5, 5), active: act, resident: 0, lit: Math.random() < 0.5 });
      }
    }
    climber = { c: 2, f: 0, y: 0, x: colX(2), move: null, stun: 0, inv: 0, hand: 0, dead: false, lift: null, pinch: 0 };
    camY = 0; hazards = []; balloon = null; balloonT = rnd(18, 26);
    potT = 3; girderT = rnd(8, 12); birdT = rnd(10, 16);
    bonusTime = 3000 + b.floors * 100; bonusTick = 0; stageT = 0; maxFloor = 0;
    message = { text: `EDIFICIO ${stage + 1}`, sub: `${b.name} · ${b.floors} piani`, t: 0 };
    state = "intro"; stateT = 1.8;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f2f4ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 50000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.5, c: color });
    }
  }
  function hitClimber(what) {
    if (state !== "play" || climber.inv > 0 || climber.lift) return;
    lives--; climber.dead = true; climber.move = null;
    sfx.hit();
    burst(climber.x, screenY(climber.y * FH), "#ffd34d", 16, 140);
    message = { text: what, t: 0 };
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    Object.assign(climber, { dead: false, inv: 2, stun: 0, pinch: 0, move: null, y: climber.f, x: colX(climber.c) });
    hazards = [];
    // the window he holds is open again when he comes back
    const w = win(climber.c, climber.f); if (w) { w.o = 1; w.st = "open"; w.t = rnd(2, 4); }
    const w2 = win(climber.c, climber.f + 1); if (w2) { w2.o = 1; w2.st = "open"; w2.t = rnd(2, 4); }
    state = "play";
  }
  function stageCleared() {
    const tb = Math.max(0, Math.round(bonusTime / 10) * 10);
    const sb = 1000 * (stage + 1);
    addScore(tb + sb);
    message = { text: "IN CIMA!", sub: `Bonus edificio ${sb.toLocaleString("it-IT")} · tempo ${tb.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3.4;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, st = stage + 1, fl = climber.f;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Edificio ${st}, piano ${fl} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "calc(12px + env(safe-area-inset-right, 0px))", left: "auto" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SCALAGRATTACIELI</h1>
       <p>Arrampicati a mani nude fino al tetto dei grattacieli, dove ti aspetta l'elicottero! Ti puoi aggrappare solo alle finestre aperte: se una si chiude mentre la tieni scivoli giù di un piano. E dall'alto piovono vasi di fiori, travi d'acciaio e… regalini dei piccioni.</p>
       <div class="pts">
         <span><b>Piano nuovo</b></span><span>20 punti</span>
         <span><b>In cima</b></span><span>1.000 × edificio + bonus tempo</span>
         <span><b>Palloncino</b></span><span>1.000 e ti porta su di 5 piani</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tieni premuto ▲ per salire · ◀ ▶ per spostarti di finestra · ▼ per scendere</p>`
         : `<p class="muted help">Tieni premuto ↑ o W per salire · ← → per spostarti di finestra · ↓ per scendere · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KEYS[k]) ctl[KEYS[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Windows ----------
  const isOpen = (w) => !!w && w.o >= 0.5;
  const isShut = (w) => !w || w.o < 0.15;
  function updateWindows(dt) {
    const lo = Math.max(0, climber.f - 4), hi = Math.min(B().floors - 1, climber.f + 9);
    for (let f = lo; f <= hi; f++) for (const w of windows[f]) {
      w.resident = Math.max(0, w.resident - dt);
      if (!w.active) continue;
      w.t -= dt;
      if (w.st === "open" && w.t <= 0) w.st = "closing";
      else if (w.st === "closing") { w.o -= dt / 0.75; if (w.o <= 0) { w.o = 0; w.st = "closed"; w.t = rnd(1, 2.4); } }
      else if (w.st === "closed" && w.t <= 0) w.st = "opening";
      else if (w.st === "opening") { w.o += dt / 0.6; if (w.o >= 1) { w.o = 1; w.st = "open"; w.t = rnd(1.8, 4.5); } }
    }
  }

  // ---------- Climber ----------
  function updateClimber(dt) {
    const k = climber;
    k.inv = Math.max(0, k.inv - dt);
    if (k.lift) {
      // carried up by the balloon
      k.lift.t += dt;
      const p = Math.min(1, k.lift.t / k.lift.dur);
      k.y = k.lift.from + (k.lift.to - k.lift.from) * (1 - (1 - p) * (1 - p));
      if (p >= 1) {
        k.f = k.lift.to; k.y = k.f; k.lift = null; k.inv = 1;
        const w = win(k.c, k.f); if (w) { w.o = 1; w.st = "open"; w.t = rnd(2, 4); }
        reachFloor();
      }
      return;
    }
    if (k.stun > 0) { k.stun -= dt; return; }
    if (k.move) {
      const m = k.move;
      m.t += dt;
      const p = Math.min(1, m.t / m.dur);
      if (m.type === "side") k.x = colX(m.from) + (colX(m.to) - colX(m.from)) * p;
      else k.y = m.from + (m.to - m.from) * p;
      // the window he is reaching for shuts on his fingers: back where he was
      const target = m.type === "side" ? win(m.to, k.f) : win(k.c, m.to);
      const toRoof = m.type === "up" && m.to >= B().floors;
      if (m.type !== "fall" && !toRoof && p > 0.25 && isShut(target)) {
        if (m.type === "side") { k.x = colX(m.from); } else { k.y = m.from; }
        k.move = null; k.stun = 0.45; sfx.pinch();
        popups.push({ x: k.x, y: screenY(k.y * FH) - 40, text: "AHI!", color: "#ff8a6a", t: 0 });
        return;
      }
      if (p >= 1) {
        if (m.type === "side") { k.c = m.to; k.x = colX(k.c); }
        else { k.f = m.to; k.y = k.f; }
        k.move = null;
        if (m.type === "up") reachFloor();
      }
      return;
    }
    // the window he is holding shuts: he slips down a floor
    const here = win(k.c, k.f);
    if (k.f > 0 && here && here.st === "closing" && here.o < 0.2) {
      k.move = { type: "fall", from: k.f, to: k.f - 1, t: 0, dur: 0.3 };
      k.f = k.f - 1; k.stun = 0.35; sfx.pinch();
      popups.push({ x: k.x, y: screenY(k.y * FH) - 40, text: "AHI!", color: "#ff8a6a", t: 0 });
      return;
    }
    if (ctl.up) {
      if (k.f + 1 >= B().floors) { if (inBuilding(k.c, k.f)) { k.move = { type: "up", from: k.f, to: k.f + 1, t: 0, dur: CLIMB_T }; k.hand ^= 1; } }
      else if (isOpen(win(k.c, k.f + 1))) { k.move = { type: "up", from: k.f, to: k.f + 1, t: 0, dur: CLIMB_T }; k.hand ^= 1; sfx.climb(k.hand); }
    } else if (ctl.left || ctl.right) {
      const to = k.c + (ctl.right ? 1 : -1);
      if (isOpen(win(to, k.f))) { k.move = { type: "side", from: k.c, to, t: 0, dur: SIDE_T }; sfx.side(); }
    } else if (ctl.down && k.f > 0 && isOpen(win(k.c, k.f - 1))) {
      k.move = { type: "down", from: k.f, to: k.f - 1, t: 0, dur: CLIMB_T }; k.hand ^= 1; sfx.climb(k.hand);
    }
  }
  function reachFloor() {
    const k = climber;
    if (k.f > maxFloor) {
      addScore(20 * (k.f - maxFloor), k.x + 24, screenY(k.y * FH) - 20, "#bfe6ff");
      maxFloor = k.f;
    }
    if (k.f >= B().floors) stageCleared();
  }

  // ---------- Hazards ----------
  function spawnPot() {
    const k = climber, opts = [];
    for (let f = k.f + 2; f <= k.f + 5; f++) for (let c = k.c - 1; c <= k.c + 1; c++) { const w = win(c, f); if (w && w.o > 0.9 && !w.resident) opts.push([c, f, w]); }
    if (!opts.length) return;
    // aims at him more often than not
    const same = opts.filter((o) => o[0] === k.c);
    const pool = same.length && Math.random() < 0.65 ? same : opts;
    const [c, f, w] = pool[Math.floor(Math.random() * pool.length)];
    w.resident = 1.2;
    hazards.push({ kind: "pot", c, x: colX(c), y: f * FH + 8, vy: 0, wait: 0.9 });
  }
  function spawnGirder() {
    const r = colsAt(climber.f) || [0, 5];
    const c = Math.max(r[0], Math.min(r[1] - 1, climber.c - (Math.random() < 0.5 ? 1 : 0)));
    hazards.push({ kind: "girder", c, x: colX(c) + CW / 2, y: camY + SCREEN_BASE + 10, vy: 0, wait: 1.2 });
    sfx.warn();
  }
  function spawnBird() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    hazards.push({ kind: "bird", dir, x: dir > 0 ? -20 : W + 20, y: (climber.y + rnd(3, 4.5)) * FH, dropped: false, t: 0 });
  }
  function updateHazards(dt) {
    const k = climber, m = diff.haz * (1 + Math.min(1, stage * 0.15));
    potT -= dt * m; girderT -= dt * m; birdT -= dt * m;
    if (potT <= 0) { potT = rnd(2.2, 4); spawnPot(); }
    if (girderT <= 0) { girderT = rnd(9, 14); if (stage > 0 || k.f > 8) spawnGirder(); }
    if (birdT <= 0) { birdT = rnd(11, 17); spawnBird(); }
    const ky = k.y * FH;
    for (const h of hazards) {
      if (h.kind === "bird") {
        h.t += dt; h.x += h.dir * 95 * dt;
        const col = Math.round((h.x - BX - CW / 2) / CW);
        if (!h.dropped && col === k.c && Math.abs(h.x - colX(k.c)) < 4) {
          h.dropped = true; sfx.whistle();
          hazards.push({ kind: "drop", c: k.c, x: h.x, y: h.y - 6, vy: -60, wait: 0 });
        }
        if (h.x < -40 || h.x > W + 40) h.gone = true;
        continue;
      }
      if (h.wait > 0) { h.wait -= dt; continue; }
      const g = h.kind === "girder" ? 420 : h.kind === "drop" ? 260 : 320;
      h.vy = Math.max(-(h.kind === "girder" ? 420 : 300), h.vy - g * dt);
      h.y += h.vy * dt;
      // collision with the climber
      const cols = h.kind === "girder" ? [h.c, h.c + 1] : [h.c];
      const kc = k.move && k.move.type === "side" ? (Math.abs(k.x - colX(k.move.from)) < CW / 2 ? k.move.from : k.move.to) : k.c;
      if (cols.includes(kc) && h.y < ky + 24 && h.y > ky - 26 && !k.dead) {
        hitClimber(h.kind === "pot" ? "VASO IN TESTA!" : h.kind === "girder" ? "TRAVE D'ACCIAIO!" : "BERSAGLIO DEL PICCIONE!");
        h.gone = true;
        return;
      }
      if (h.y < camY - 200) h.gone = true;
    }
    hazards = hazards.filter((h) => !h.gone);
    // the balloon floats up now and then
    balloonT -= dt;
    if (!balloon && balloonT <= 0 && k.f + 7 < B().floors) {
      const r = colsAt(k.f);
      balloon = { c: Math.max(r[0], Math.min(r[1], k.c + (Math.random() < 0.5 ? -1 : 1))), y: camY - 120 };
      balloon.x = colX(balloon.c);
    }
    if (balloon) {
      balloon.y += 55 * dt;
      if (!k.move && !k.lift && balloon.c === k.c && Math.abs(balloon.y - (ky + 40)) < 22) {
        const to = Math.min(B().floors - 2, k.f + 5);
        k.lift = { from: k.f, to, t: 0, dur: 2 };
        addScore(1000, k.x, screenY(ky) - 60, "#ffd34d"); sfx.balloon();
        hazards = hazards.filter((h) => h.kind === "bird");
        balloon = null; balloonT = rnd(22, 32);
      } else if (balloon.y > camY + SCREEN_BASE + 60) { balloon = null; balloonT = rnd(15, 25); }
    }
  }

  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.9));
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    if (climber) camY += (climber.y * FH - camY) * Math.min(1, dt * 5);
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) afterDeath(); return; }
    if (state === "clear") { stateT -= dt; climber.y += dt * 0.8; if (stateT <= 0) { stage++; buildStage(); } return; }

    stageT += dt;
    bonusTick += dt;
    if (bonusTick >= 0.2) { bonusTick -= 0.2; bonusTime = Math.max(0, bonusTime - 10); }
    updateWindows(dt);
    updateClimber(dt);
    if (state !== "play") return;
    updateHazards(dt);
  }

  // ---------- Drawing ----------
  function drawSky() {
    const b = B();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, b.sky[0]); g.addColorStop(1, b.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (b.night) {
      for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 4) * 0.15})`; ctx.fillRect((i * 97) % W, ((i * 53 + camY * 0.05) % H + H) % H, 1.5, 1.5); }
      ctx.fillStyle = "#fff6d0"; ctx.beginPath(); ctx.arc(320, 80 + camY * 0.03, 20, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      for (let i = 0; i < 6; i++) {
        const x = ((i * 131 + clock * 8) % (W + 120)) - 60, y = ((i * 97 + camY * 0.15) % (H + 80)) - 40;
        ctx.beginPath(); ctx.ellipse(x, y, 34, 10, 0, 0, Math.PI * 2); ctx.ellipse(x + 18, y - 6, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    // distant skyline, slowly scrolling
    const base = H + 120 + camY * 0.25;
    ctx.fillStyle = b.night ? "rgba(20,24,50,0.9)" : "rgba(60,80,120,0.35)";
    for (let i = 0; i < 12; i++) {
      const h = 120 + ((i * 71) % 160), x = i * 36 - 10;
      ctx.fillRect(x, base - h, 30, h + 400);
    }
  }
  function drawBuilding() {
    const b = B();
    const f0 = Math.max(0, Math.floor((camY - SCREEN_BASE - FH) / FH)), f1 = Math.min(b.floors - 1, Math.ceil((camY + SCREEN_BASE + FH) / FH));
    for (let f = f0; f <= f1; f++) {
      const r = colsAt(f), yc = screenY(f * FH);
      const x0 = BX + r[0] * CW, x1 = BX + (r[1] + 1) * CW;
      ctx.fillStyle = b.wall; ctx.fillRect(x0, yc - FH / 2, x1 - x0, FH + 1);
      ctx.fillStyle = b.trim; ctx.fillRect(x0, yc + FH / 2 - 3, x1 - x0, 3);
      // a ledge where the building gets narrower
      const up = colsAt(f + 1);
      if (up && (up[0] > r[0] || up[1] < r[1])) { ctx.fillStyle = b.trim; ctx.fillRect(x0 - 4, yc - FH / 2 - 4, x1 - x0 + 8, 6); }
      if (!up) { // the roof
        ctx.fillStyle = b.trim; ctx.fillRect(x0 - 6, yc - FH / 2 - 8, x1 - x0 + 12, 10);
        ctx.fillStyle = "#3a3a4a"; ctx.fillRect(x0 + 10, yc - FH / 2 - 30, x1 - x0 - 20, 22);
        ctx.fillStyle = "#ffd34d"; ctx.font = "900 16px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("H", (x0 + x1) / 2, yc - FH / 2 - 19); ctx.textBaseline = "alphabetic";
        drawHelicopter((x0 + x1) / 2, yc - FH / 2 - 110);
      }
      for (let c = r[0]; c <= r[1]; c++) drawWindow(windows[f][c], colX(c), yc, b);
      // floor number on the side
      if (f % 5 === 0) { ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "700 9px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.fillText(String(f), x0 - 3, yc + 3); }
    }
    // the street
    const sy = screenY(-FH / 2);
    if (sy < H) {
      ctx.fillStyle = "#3a3a44"; ctx.fillRect(0, sy, W, H - sy);
      ctx.fillStyle = "#6a6a74"; ctx.fillRect(0, sy, W, 6);
      ctx.fillStyle = "#ffd34d"; for (let x = 10; x < W; x += 40) ctx.fillRect(x, sy + 40, 20, 3);
    }
  }
  function drawWindow(w, x, y, b) {
    const ww = 38, wh = 40, x0 = x - ww / 2, y0 = y - wh / 2 + 2;
    ctx.fillStyle = b.trim; ctx.fillRect(x0 - 3, y0 - 3, ww + 6, wh + 6);
    ctx.fillStyle = b.night ? (w.lit ? "#ffe08a" : "#1a2440") : (w.lit ? "#8ac8ff" : "#4a7ab8");
    ctx.fillRect(x0, y0, ww, wh);
    if (w.resident > 0) {
      // a grumpy resident with a flowerpot
      ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(x, y0 + 16, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5a3a2a"; ctx.fillRect(x - 8, y0 + 7, 16, 4);
      ctx.fillStyle = "#000"; ctx.fillRect(x - 4, y0 + 15, 2, 2); ctx.fillRect(x + 2, y0 + 15, 2, 2); ctx.fillRect(x - 3, y0 + 20, 6, 1.5);
      ctx.fillStyle = "#c86a3a"; ctx.fillRect(x - 6, y0 + wh - 12, 12, 10);
      ctx.fillStyle = "#5ad84a"; ctx.beginPath(); ctx.arc(x, y0 + wh - 14, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(x0 + 4, y0 + 4, 4, wh - 8);
    }
    // the blind comes down as the window closes
    const cover = (1 - w.o) * wh;
    if (cover > 0.5) {
      ctx.fillStyle = w.st === "closing" ? "#e85a3a" : "#c8c8d8"; ctx.fillRect(x0, y0, ww, cover);
      ctx.fillStyle = "rgba(0,0,0,0.2)"; for (let yy = y0 + 4; yy < y0 + cover; yy += 5) ctx.fillRect(x0, yy, ww, 1);
    }
    ctx.fillStyle = b.trim; ctx.fillRect(x0, y0 + wh / 2 - 1, ww, 2); ctx.fillRect(x - 1, y0, 2, wh);
  }
  function drawHelicopter(x, y) {
    y += Math.sin(clock * 2) * 4;
    ctx.fillStyle = "#e84a3a"; ctx.beginPath(); ctx.ellipse(x, y, 30, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x + 20, y - 4, 40, 6); ctx.fillRect(x + 56, y - 12, 4, 14);
    ctx.fillStyle = "#8ac8ff"; ctx.beginPath(); ctx.ellipse(x - 12, y - 3, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a3a4a"; ctx.fillRect(x - 2, y - 20, 4, 8);
    const s = Math.abs(Math.sin(clock * 30));
    ctx.fillRect(x - 50 * s, y - 22, 100 * s, 3);
    ctx.fillRect(x - 22, y + 16, 44, 3); ctx.fillRect(x - 16, y + 12, 3, 6); ctx.fillRect(x + 13, y + 12, 3, 6);
  }
  function drawClimber() {
    const k = climber;
    if (k.inv > 0 && !k.lift && Math.floor(clock * 12) % 2) return;
    const x = k.x, y = screenY(k.y * FH);
    ctx.save(); ctx.translate(x, y + 6);
    if (k.dead) { const t = 2 - stateT; ctx.translate(0, t * t * 120); ctx.rotate(t * 6); }
    const m = k.move, p = m ? Math.min(1, m.t / m.dur) : 0, swing = Math.sin(p * Math.PI);
    const reachL = k.hand ? swing * 12 : 0, reachR = k.hand ? 0 : swing * 12;
    // arms up holding the window frame
    ctx.strokeStyle = "#ffcf9e"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-14, -24 - reachL); ctx.moveTo(6, -10); ctx.lineTo(14, -24 - reachR); ctx.stroke();
    ctx.fillStyle = "#ffcf9e"; ctx.beginPath(); ctx.arc(-14, -25 - reachL, 3, 0, Math.PI * 2); ctx.arc(14, -25 - reachR, 3, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.strokeStyle = "#2a4aa8"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-10, 20 - reachR * 0.6); ctx.moveTo(4, 6); ctx.lineTo(10, 20 - reachL * 0.6); ctx.stroke();
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(-14, 19 - reachR * 0.6, 7, 4); ctx.fillRect(7, 19 - reachL * 0.6, 7, 4);
    // body (seen from behind)
    ctx.fillStyle = "#ff5a3a"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, -12, 16, 20, 5) : ctx.rect(-8, -12, 16, 20); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("1", 0, 2);
    ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.arc(0, -17, 6, 0, Math.PI * 2); ctx.fill();
    if (k.stun > 0 && !k.dead) { ctx.fillStyle = "#ffd34d"; ctx.font = "10px system-ui"; for (let i = 0; i < 3; i++) { const a = clock * 6 + i * 2.1; ctx.fillText("✦", Math.cos(a) * 11, -26 + Math.sin(a) * 3); } }
    ctx.restore();
    if (k.lift) {
      // hanging from the balloon
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x, y - 60); ctx.stroke();
      drawBalloon(x, y - 80);
    }
  }
  function drawBalloon(x, y) {
    ctx.fillStyle = "#ff4a8a"; ctx.beginPath(); ctx.ellipse(x, y, 16, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(x - 6, y - 7, 4, 6, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff4a8a"; ctx.beginPath(); ctx.moveTo(x - 3, y + 20); ctx.lineTo(x + 3, y + 20); ctx.lineTo(x, y + 24); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "900 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("↑5", x, y + 4);
  }
  function drawHazards() {
    for (const h of hazards) {
      const y = screenY(h.y);
      if (h.kind === "pot") {
        if (h.wait > 0) continue;
        ctx.save(); ctx.translate(h.x, y); ctx.rotate(clock * 5);
        ctx.fillStyle = "#c86a3a"; ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(7, -4); ctx.lineTo(5, 7); ctx.lineTo(-5, 7); ctx.fill();
        ctx.fillStyle = "#5ad84a"; ctx.beginPath(); ctx.arc(0, -7, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff4a8a"; ctx.beginPath(); ctx.arc(2, -9, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (h.kind === "girder") {
        if (h.wait > 0) {
          // warning at the top of the screen
          if (Math.floor(clock * 8) % 2) {
            ctx.fillStyle = "#ff5a3a"; ctx.beginPath(); ctx.moveTo(h.x, TOP + 6); ctx.lineTo(h.x + 14, TOP + 30); ctx.lineTo(h.x - 14, TOP + 30); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "900 14px system-ui"; ctx.textAlign = "center"; ctx.fillText("!", h.x, TOP + 27);
            ctx.fillStyle = "rgba(255,90,58,0.12)"; ctx.fillRect(h.x - CW, TOP, CW * 2, H);
          }
          continue;
        }
        ctx.fillStyle = "#c83a2a"; ctx.fillRect(h.x - CW + 6, y - 7, CW * 2 - 12, 14);
        ctx.fillStyle = "#8a2a1a"; ctx.fillRect(h.x - CW + 6, y - 2, CW * 2 - 12, 4);
        ctx.fillStyle = "#ff8a6a"; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(h.x - CW + 14 + i * 17, y - 4, 1.5, 0, Math.PI * 2); ctx.fill(); }
      } else if (h.kind === "bird") {
        ctx.save(); ctx.translate(h.x, y); ctx.scale(h.dir, 1);
        const flap = Math.sin(h.t * 16) * 7;
        ctx.fillStyle = "#8a8a9a"; ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#6a6a7a"; ctx.beginPath(); ctx.moveTo(-3, -2); ctx.lineTo(-10, -12 - flap); ctx.lineTo(5, -3); ctx.fill();
        ctx.fillStyle = "#5a8a6a"; ctx.beginPath(); ctx.arc(9, -3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffb03a"; ctx.beginPath(); ctx.moveTo(13, -3); ctx.lineTo(18, -1); ctx.lineTo(13, 0); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillRect(9, -6, 3, 3); ctx.fillStyle = "#000"; ctx.fillRect(10, -5, 1.5, 1.5);
        ctx.restore();
      } else {
        ctx.fillStyle = "#f4f4e8"; ctx.beginPath(); ctx.ellipse(h.x, y, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c8c8a8"; ctx.beginPath(); ctx.arc(h.x - 1, y + 2, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!climber) { ctx.fillStyle = "#0a0c1a"; ctx.fillRect(0, 0, W, H); return; }
    drawSky();
    drawBuilding();
    if (balloon) drawBalloon(balloon.x, screenY(balloon.y));
    if (state !== "menu") drawClimber();
    drawHazards();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 22px system-ui, sans-serif" : "900 13px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, W, TOP - 2);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 14);
    ctx.font = "700 10px system-ui, sans-serif"; ctx.fillStyle = "#a8b0d0";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 76, 14);
    ctx.textAlign = "center"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#ffd34d";
    ctx.fillText(`⏱ ${bonusTime}`, 196, 14);
    ctx.textAlign = "right"; ctx.fillStyle = "#5ab8ff";
    ctx.fillText(`PIANO ${Math.min(climber.f, B().floors)}/${B().floors}`, W - 8, 14);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) { ctx.fillStyle = "#ff5a3a"; ctx.fillRect(W - 112 - i * 11, 9, 7, 9); ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.arc(W - 108.5 - i * 11, 7, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
    // progress bar on the right edge
    const prog = Math.min(1, climber.y / B().floors);
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(W - 6, TOP + 6, 3, H - TOP - 16);
    ctx.fillStyle = "#5ab8ff"; ctx.fillRect(W - 6, TOP + 6 + (H - TOP - 16) * (1 - prog), 3, (H - TOP - 16) * prog);
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(10,12,26,0.82)"; ctx.fillRect(0, H / 2 - 60, W, message.sub ? 72 : 50);
      ctx.textAlign = "center"; ctx.font = "900 24px system-ui, sans-serif"; ctx.fillStyle = "#5ab8ff";
      ctx.fillText(message.text, W / 2, H / 2 - 26);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.fillStyle = "#f2f4ff"; ctx.fillText(message.sub, W / 2, H / 2); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildStage(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="scala-best-" data-kind="score"></script>

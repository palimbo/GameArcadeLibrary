<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Il Galoppo d'Oro</title>
<style>
  :root {
    --bg: #081408;
    --fg: #f4f6ee;
    --muted: #d0e8c8;
    --pink: #ffd23a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a5a2a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: up and down change lane; tap SPINTA to urge the horse */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(8, 20, 8, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a2a, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a2002; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a88a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Spinta">SPINTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the track seen from the side: 5 lanes, the inside rail at the back (lane 0)
  const LANES = 5, LANE_Y = (l) => 196 + l * 30, LANE_S = (l) => 0.8 + l * 0.06;
  const PX_M = 9;   // pixels per metre on screen
  const V0 = 16, PUSH = 2.6, WHIP = 4.2;
  const RACES = [
    { name: "Premio dei Puledri", len: 800, cls: 0 }, { name: "Premio del Mulino", len: 1000, cls: 1 }, { name: "Coppa delle Colline", len: 1000, cls: 2 },
    { name: "Premio della Fontana", len: 1200, cls: 3 }, { name: "Coppa d'Argento", len: 1200, cls: 4 }, { name: "Premio dei Campioni", len: 1400, cls: 5 },
    { name: "Coppa d'Oro", len: 1400, cls: 6 }, { name: "Gran Premio", len: 1600, cls: 7 },
  ];
  const SILKS = [["#3a6ad8", "#ffffff"], ["#d83a3a", "#ffd23a"], ["#2a9a4a", "#ffffff"], ["#8a3ac8", "#ffd23a"], ["#ff8a2a", "#1a1a1a"], ["#1a1a1a", "#ff5a8a"], ["#ffd23a", "#2a5ad8"], ["#5ad8e8", "#c83a3a"]];
  const NAMES = ["Fulmine", "Brezza", "Tempesta", "Saetta", "Cometa", "Uragano", "Zefiro", "Mistral", "Bufera", "Scirocco", "Lampo", "Ciclone", "Vento d'Oro", "Libeccio"];
  const STYLES = ["fuga", "media", "rimonta"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "ti qualifichi arrivando nei primi 4 · avversari più lenti · 2 gettoni", place: 4, rival: 0.993, coins: 2 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "ti qualifichi arrivando nei primi 3 · 2 gettoni", place: 3, rival: 1, coins: 2 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "ti qualifichi solo arrivando primo o secondo · avversari più forti · 1 gettone", place: 2, rival: 1.02, coins: 1 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "galoppo-difficulty";
  const bestKey = (id) => `galoppo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    gallop: lim(() => beep(120 + Math.random() * 30, 0.03, "triangle", 0.025)),
    push: lim(() => beep(340, 0.04, "square", 0.02, 120)),
    whip: lim(() => beep(1800, 0.03, "sawtooth", 0.03, -1200)),
    bump: lim(() => beep(140, 0.08, "square", 0.04, -40)),
    bell: () => { for (let i = 0; i < 6; i++) beep(1320, 0.06, "square", 0.03, 0, i * 0.1); },
    gate: () => beep(200, 0.2, "sawtooth", 0.05, -100),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    ok: () => arp([523, 659, 784, 1047], 0.08, 0.14, "square", 0.04),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, raceN = 0, lap = 0, coins = 1, wins = 0, qualified = 0;
  let horses = [], me = null, race = null, phase = "intro", phaseT = 0, message = null, popups = [], finishOrder = [], camX = 0, lastAtHalf = false;
  let actHeld = false, wasAct = false, laneCool = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const isPlaying = () => state === "play";

  // ---------- The race ----------
  // the bends: the stretches of the race where the inside lane is shorter
  function bends(len) { const out = []; const n = len >= 1400 ? 2 : 1; for (let i = 0; i < n; i++) { const a = len * (0.18 + i * 0.4); out.push([a, a + len * 0.22]); } return out; }
  const inBend = (d) => race.bends.some(([a, b]) => d >= a && d < b);
  function startRace() {
    race = { ...RACES[raceN], bends: null };
    race.bends = bends(race.len);
    const names = [...NAMES].sort(() => Math.random() - 0.5);
    horses = [];
    const myGate = Math.floor(Math.random() * LANES);
    for (let i = 0; i < 8; i++) {
      const isMe = i === 0;
      const lane = isMe ? myGate : (myGate + i) % LANES;
      const h = { me: isMe, name: isMe ? "Tu" : names[i], silk: SILKS[i], lane, laneF: lane, toLane: lane, d: -Math.floor(i / LANES) * 3 - rnd(0, 0.5), v: 0, st: 100, urge: 0, whipT: 0, done: false, place: 0, stride: Math.random() * TAU, boxed: 0 };
      if (!isMe) {
        const cls = race.cls + lap * 2;
        h.ability = diff.rival * (0.99 + 0.007 * cls + rnd(-0.02, 0.02));
        h.style = STYLES[Math.floor(Math.random() * 3)];
        h.kick = h.style === "fuga" ? 0.62 : h.style === "media" ? 0.72 : 0.8;   // where in the race it gives everything
      }
      horses.push(h);
    }
    me = horses[0];
    finishOrder = []; lastAtHalf = false;
    phase = "intro"; phaseT = 0;
    camX = 0;
    message = { text: race.name.toUpperCase(), sub: `corsa ${raceN + 1} di ${RACES.length}${lap ? ` · giro ${lap + 1}` : ""} · ${race.len} metri · qualificati i primi ${diff.place}`, t: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; raceN = 0; lap = 0; wins = 0; qualified = 0; coins = diff.coins; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startRace();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  // a horse's top speed right now: pushing or whipping adds, an empty tank takes away
  function speedOf(h) {
    let v = V0 * (h.me ? 1 : h.ability);
    if (h.urge > 0) v += h.whipT > 0 ? WHIP : PUSH;
    if (h.st < 20) v -= (20 - h.st) * 0.3;
    return v;
  }
  function occupied(h, lane, ahead, behind) { return horses.some((o) => o !== h && !o.done && Math.round(o.laneF) === lane && o.d - h.d < ahead && h.d - o.d < behind); }
  function tryLane(h, dl) {
    const to = clamp(h.toLane + dl, 0, LANES - 1);
    if (to === h.toLane) return false;
    if (occupied(h, to, 2.6, 2.6)) { if (h.me) { sfx.bump(); popups.push({ text: "OCCUPATO!", x: 0, y: 0, t: 0, me: true }); } return false; }
    h.toLane = to; return true;
  }
  function aiStep(h, dt) {
    const frac = h.d / race.len;
    // pushing: by its style, how much tank is left and the end of the race
    const want = frac > h.kick ? 1 : h.style === "fuga" ? (h.st > 45 ? 0.55 : 0.1) : h.style === "media" ? (h.st > 65 ? 0.3 : 0.05) : (h.st > 85 ? 0.15 : 0);
    if (Math.random() < want * dt * 6) { h.urge = 0.3; if (frac > 0.8) h.whipT = 0.3; }
    // boxed in: look for room outside; in a bend, go to the rail if there is room
    h.think = (h.think || 0) - dt;
    if (h.think <= 0) {
      h.think = rnd(0.4, 0.9);
      if (h.boxed > 0.6) { if (!tryLane(h, 1)) tryLane(h, -1); }
      else if (inBend(h.d + 30) && h.toLane > 0 && Math.random() < 0.6) tryLane(h, -1);
    }
  }
  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (message) { message.t += dt; if (message.t > (message.long ? 3 : 2.4)) message = null; }
    if (state !== "play") return;
    phaseT += dt;
    if (phase === "intro") { if (phaseT >= 2.6) { phase = "run"; phaseT = 0; sfx.gate(); message = { text: "PARTITI!", t: 0 }; } updateCam(dt); return; }
    if (phase === "result") { if (phaseT >= 3.4) afterRace(); return; }
    // the player: lane with the stick, push with the button (taps: each one urges the horse for a moment)
    const sy = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    laneCool -= dt;
    if (!me.done && Math.abs(sy) > 0.6 && laneCool <= 0) { tryLane(me, Math.sign(sy)); laneCool = 0.35; }
    if (actHeld && !wasAct && !me.done) {
      me.urge = 0.32;
      if (me.d > race.len - 200) { me.whipT = 0.32; sfx.whip(); } else sfx.push();
    }
    wasAct = actHeld;
    // everybody runs
    for (const h of horses) {
      if (!h.me && !h.done) aiStep(h, dt);
      h.urge = Math.max(0, h.urge - dt); h.whipT = Math.max(0, h.whipT - dt);
      let target = speedOf(h);
      // boxed in by a slower horse just ahead in the same lane
      const lane = Math.round(h.laneF);
      const front = horses.filter((o) => o !== h && Math.round(o.laneF) === lane && o.d > h.d && o.d - h.d < 2.4);
      if (front.length && !h.done) { const minV = Math.min(...front.map((o) => o.v)); if (minV < target) { target = minV - 0.1; h.boxed += dt; if (h.me && h.boxed > 0.5 && Math.floor(h.boxed * 2) !== Math.floor((h.boxed - dt) * 2)) popups.push({ text: "CHIUSO!", x: 0, y: 0, t: 0, me: true }); } } else h.boxed = 0;
      if (h.done) target = 9;
      h.v += clamp(target - h.v, -6 * dt, 4 * dt);
      // the tank: pushing empties it, cruising fills it a little
      if (!h.done) { if (h.urge > 0) h.st = Math.max(0, h.st - (h.whipT > 0 ? 16 : 10) * dt); else h.st = Math.min(100, h.st + 2.2 * dt); }
      // in a bend the outside lanes are longer
      const k = inBend(h.d) ? 1 + 0.02 * h.laneF : 1;
      h.d += h.v * dt / k;
      h.laneF += clamp(h.toLane - h.laneF, -dt / 0.35, dt / 0.35);
      h.stride += h.v * dt * 0.55;
      if (!h.done && h.d >= race.len) { h.done = true; finishOrder.push(h); h.place = finishOrder.length; }
    }
    if (me && Math.random() < dt * me.v * 0.5) sfx.gallop();
    // halfway: who is last?
    if (!lastAtHalf && me.d >= race.len / 2) { lastAtHalf = true; race.lastAtHalf = horses.every((o) => o === me || o.d > me.d); }
    if (me.d > race.len - 200 && !race.bell) { race.bell = true; sfx.bell(); message = { text: "ULTIMI 200 METRI!", sub: "adesso frusta: ogni colpo vale di più", t: 0 }; }
    if (me.done && phase === "run") raceOver();
    updateCam(dt);
  }
  function updateCam(dt) { const t = me.d * PX_M - 220; camX += (t - camX) * Math.min(1, dt * 6); }
  function raceOver() {
    // let the others finish on their current pace
    const left = horses.filter((h) => !h.done).sort((a, b) => b.d - a.d);
    for (const h of left) { h.done = true; finishOrder.push(h); h.place = finishOrder.length; }
    const p = me.place;
    const second = finishOrder[1], first = finishOrder[0];
    const lengths = p === 1 ? Math.max(0, (me.d - second.d) / 2.4) : 0;
    const pts = [5000, 3000, 1800, 1000, 500][p - 1] || 0;
    const gain = Math.round((pts + lengths * 150) * (raceN + 1) * (1 + lap));
    score += gain;
    const ok = p <= diff.place;
    if (p === 1) { wins++; if (lengths >= 5) impresa("distacco"); if (race.lastAtHalf) impresa("rimonta"); if (raceN === RACES.length - 1) impresa("granpremio"); }
    if (ok) qualified++;
    if (p === 1) sfx.win(); else if (ok) sfx.ok(); else sfx.lose();
    race.ok = ok;
    if (!ok) coins--;
    message = { text: p === 1 ? "VITTORIA!" : `${p}° POSTO`, sub: `${ok ? "qualificato" : coins > 0 ? `non qualificato · ${coins} ${coins === 1 ? "gettone" : "gettoni"}: si ricorre` : "non qualificato"}${gain ? ` · +${gain.toLocaleString("it-IT")}` : ""}${p === 1 && lengths >= 1 ? ` · ${Math.round(lengths)} lunghezze` : ""}${p > 1 ? ` · ha vinto ${first.name}` : ""}`, t: 0, long: true };
    phase = "result"; phaseT = 0;
  }
  function afterRace() {
    if (race.ok) { raceN++; if (raceN >= RACES.length) { raceN = 0; lap++; } startRace(); }
    else if (coins > 0) startRace();
    else gameOver();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">FINE DELLA STAGIONE</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${wins} ${wins === 1 ? "vittoria" : "vittorie"} · ${qualified} ${qualified === 1 ? "corsa superata" : "corse superate"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>UN'ALTRA STAGIONE</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>IL GALOPPO D'ORO</h1>
       <p>Sei il fantino: otto corse, dal Premio dei Puledri al Gran Premio, contro sette cavalli che corrono ognuno a modo suo. Il tuo cavallo ha un serbatoio di fiato: spingerlo lo fa correre di più ma lo stanca, e un cavallo senza fiato rallenta molto. Qualche tocco ogni tanto si regge a lungo; il resto del fiato tienilo per lo scatto finale. In curva la corsia interna è più corta, e chi resta chiuso dietro un cavallo più lento perde terreno. Arriva tra i primi per passare alla corsa dopo.</p>
       <div class="pts">
         <span><b>Spingere</b></span><span>ogni tocco di SPINTA fa accelerare il cavallo per un attimo e consuma fiato · negli ultimi 200 metri è la frusta: vale di più e consuma di più</span>
         <span><b>Corsie</b></span><span>levetta su verso la corda (interno), giù verso l'esterno · non puoi entrare in una corsia occupata</span>
         <span><b>Punti</b></span><span>1° 5.000 · 2° 3.000 · 3° 1.800 · 4° 1.000, × corsa · 150 per lunghezza di vantaggio sul secondo</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta su e giù: corsia · SPINTA a tocchi</p>`
         : `<p class="muted help">Frecce su e giù o W/S: corsia · SPAZIO o J a tocchi · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>AI CANCELLI!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);


  // ---------- Drawing ----------
  function drawScene() {
    const g = ctx.createLinearGradient(0, TOP, 0, 150);
    g.addColorStop(0, "#5aa8f0"); g.addColorStop(1, "#cfe8f8");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // the far side: trees, then the grandstand which comes and goes (parallax)
    const far = camX * 0.15, mid = camX * 0.4;
    ctx.fillStyle = "#4a8a4a"; for (let i = -1; i < 16; i++) { const x = i * 48 - (far % 48); ctx.beginPath(); ctx.arc(x, 132, 26, Math.PI, TAU); ctx.fill(); }
    ctx.fillStyle = "#7ab85a"; ctx.fillRect(0, 132, W, 40);
    for (let i = -1; i < 4; i++) {
      const x = i * 420 - (mid % 420);
      ctx.fillStyle = "#e8e0d0"; ctx.fillRect(x, 96, 260, 64); ctx.fillStyle = "#c83a3a"; ctx.beginPath(); ctx.moveTo(x - 10, 96); ctx.lineTo(x + 130, 78); ctx.lineTo(x + 270, 96); ctx.fill();
      for (let r = 0; r < 3; r++) for (let c = 0; c < 26; c++) { ctx.fillStyle = ["#ff5a5a", "#5ab8ff", "#ffd23a", "#ffffff", "#8ae05a"][(c * 3 + r * 7 + i) % 5]; ctx.fillRect(x + 6 + c * 9.6, 108 + r * 14 + Math.sin(clock * 6 + c + r) * (race && race.bell ? 1.5 : 0.3), 6, 7); }
    }
    // the inside rail
    ctx.fillStyle = "#3a8a3a"; ctx.fillRect(0, 168, W, H - 168);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 176, W, 3);
    for (let i = -1; i < 30; i++) { const x = i * 30 - (camX % 30); ctx.fillRect(x, 176, 2, 10); }
    // turf stripes and the lanes
    for (let l = 0; l < LANES; l++) { ctx.fillStyle = l % 2 ? "#4aa848" : "#52b050"; ctx.fillRect(0, LANE_Y(l) - 15, W, 30); }
    ctx.fillStyle = "#3a9a3a"; ctx.fillRect(0, LANE_Y(LANES - 1) + 15, W, H);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, LANE_Y(LANES - 1) + 18, W, 3);
    if (!race) return;
    // the distance poles and the bends
    for (let m = 0; m <= race.len; m += 100) {
      const x = m * PX_M - camX; if (x < -20 || x > W + 20) continue;
      const left = race.len - m;
      ctx.fillStyle = left % 200 === 0 ? "#d83a3a" : "#ffffff"; ctx.fillRect(x - 2, 150, 4, 30);
      ctx.fillStyle = "#1a1a1a"; ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; if (left > 0 && left % 200 === 0) ctx.fillText(String(left), x, 146);
    }
    for (const [a, b] of race.bends) { const x0 = a * PX_M - camX, x1 = b * PX_M - camX; if (x1 < 0 || x0 > W) continue; ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(Math.max(0, x0), 168, Math.min(W, x1) - Math.max(0, x0), 6); ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.textAlign = "left"; if (x0 > 0) ctx.fillText("CURVA ▸", x0 + 4, 164); }
    // the finish post
    const fx = race.len * PX_M - camX;
    if (fx > -20 && fx < W + 20) { ctx.fillStyle = "#ffffff"; ctx.fillRect(fx - 2, 120, 4, 230); ctx.fillStyle = "#d83a3a"; ctx.beginPath(); ctx.arc(fx, 120, 9, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffffff"; ctx.fillRect(fx - 1, LANE_Y(0) - 15, 2, LANES * 30); }
    // the starting gate
    const gx = 0 - camX + 4;
    if (gx > -40 && gx < W) { ctx.fillStyle = "#8a8a9a"; for (let l = 0; l < LANES; l++) ctx.fillRect(gx - 8, LANE_Y(l) - 26, 16, 30); }
  }
  function drawHorse(h) {
    const x = h.d * PX_M - camX, y = LANE_Y(h.laneF), s = LANE_S(h.laneF);
    if (x < -60 || x > W + 60) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const run = phase !== "intro" && h.v > 0.5, st = h.stride;
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(-4, 12, 26, 4, 0, 0, TAU); ctx.fill();
    // legs
    ctx.strokeStyle = h.me ? "#5a3418" : "#4a2a14"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    const leg = (bx, ph) => { const a = run ? Math.sin(st + ph) * 0.7 : 0; ctx.beginPath(); ctx.moveTo(bx, -2); ctx.lineTo(bx + Math.sin(a) * 8, 6); ctx.lineTo(bx + Math.sin(a) * 10 + (run ? Math.cos(st + ph) * 3 : 0), 12); ctx.stroke(); };
    leg(-16, 0); leg(-12, 1.6); leg(10, 3.1); leg(14, 4.7);
    // body, neck, head, tail
    const bob = run ? Math.sin(st * 2) * 1.2 : 0;
    ctx.translate(0, bob);
    ctx.fillStyle = h.me ? "#8a4a1a" : ["#5a3418", "#2a1a10", "#a86a3a", "#6a4a3a"][horses.indexOf(h) % 4];
    ctx.beginPath(); ctx.ellipse(-2, -8, 20, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(24, -26); ctx.lineTo(30, -22); ctx.lineTo(20, -6); ctx.fill();
    ctx.beginPath(); ctx.ellipse(30, -23, 8, 4.5, 0.35, 0, TAU); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-21, -10); ctx.quadraticCurveTo(-32, -6 + (run ? Math.sin(st) * 3 : 0), -30, 2); ctx.stroke();
    // the number cloth and the jockey in silks
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-8, -12, 12, 8); ctx.fillStyle = "#1a1a1a"; ctx.font = "900 7px system-ui"; ctx.textAlign = "center"; ctx.fillText(String(horses.indexOf(h) + 1), -2, -5.5);
    const lean = h.urge > 0 ? 4 : 0;
    ctx.fillStyle = h.silk[0]; ctx.beginPath(); ctx.ellipse(2 + lean, -22, 6, 7, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = h.silk[1]; ctx.fillRect(-2 + lean, -24, 8, 3);
    ctx.fillStyle = h.silk[1]; ctx.beginPath(); ctx.arc(7 + lean, -30, 4.5, 0, TAU); ctx.fill(); ctx.fillStyle = h.silk[0]; ctx.fillRect(3 + lean, -31, 9, 2);
    if (h.whipT > 0) { ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0 + lean, -20); ctx.lineTo(-14, -30 + Math.sin(clock * 40) * 6); ctx.stroke(); }
    ctx.restore();
    if (h.me) { ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(x - 2, y - 46 * s); ctx.lineTo(x + 6, y - 46 * s); ctx.lineTo(x + 2, y - 40 * s); ctx.fill(); ctx.font = "900 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("TU", x + 2, y - 50 * s); }
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#0a1a0a"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(8,20,8,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#d0e8c8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 88, 9);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 9px system-ui"; ctx.fillText(`CORSA ${raceN + 1}/${RACES.length} · ${Math.max(0, Math.ceil(race.len - me.d))} m`, x0 + 88, 20);
    // position now
    const pos = 1 + horses.filter((o) => o !== me && (o.done ? o.place < (me.place || 99) : o.d > me.d)).length;
    ctx.textAlign = "center"; ctx.font = "900 16px system-ui"; ctx.fillStyle = pos <= diff.place ? "#5aff7a" : "#ffffff"; ctx.fillText(`${me.place || pos}°`, touchMode ? 360 : 330, 14);
    // the horse's breath
    const bx = touchMode ? 400 : 370, bw = 120;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 8, bw, 12);
    ctx.fillStyle = me.st > 50 ? "#5aff7a" : me.st > 20 ? "#ffd23a" : "#ff5a5a"; ctx.fillRect(bx, 8, bw * me.st / 100, 12);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 8px system-ui"; ctx.fillText("FIATO", bx + bw / 2, 14.5);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffd23a"; ctx.font = "900 10px system-ui"; ctx.fillText(`GETTONI ${coins}`, touchMode ? W - 70 : W - 12, 14);
    ctx.textBaseline = "alphabetic";
    // the field from above: a strip with everyone's position
    const sx = 20, sw = W - 40, sy = H - 12;
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(sx, sy - 4, sw, 8);
    for (const [a, b] of race.bends) { ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(sx + sw * a / race.len, sy - 4, sw * (b - a) / race.len, 8); }
    for (const h of horses) { ctx.fillStyle = h.me ? "#ffd23a" : h.silk[0]; ctx.beginPath(); ctx.arc(sx + sw * clamp(h.d / race.len, 0, 1), sy, h.me ? 4 : 3, 0, TAU); ctx.fill(); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!race) { raceN = 0; startRace(); state = "menu"; }
    drawScene();
    // back lanes first
    const order = [...horses].sort((a, b) => a.laneF - b.laneF);
    for (const h of order) drawHorse(h);
    if (state === "menu") return;
    drawHud();
    ctx.textAlign = "center";
    for (const p of popups) { if (!p.me) continue; ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); outlined(p.text, me.d * PX_M - camX, LANE_Y(me.laneF) - 64 - p.t * 20, "900 12px system-ui", "#ff8a6a", 4); }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2.4) - message.t) * 2);
      outlined(message.text, W / 2, 66, "italic 900 26px system-ui", "#ffd23a", 6);
      if (message.sub) outlined(message.sub, W / 2, 88, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="galoppo-best-" data-kind="score"></script>
</body>

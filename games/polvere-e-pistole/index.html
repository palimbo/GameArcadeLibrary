<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Polvere e Pistole</title>
<style>
  :root {
    --bg: #1e140c;
    --fg: #f4f6ee;
    --muted: #c8b8a8;
    --pink: #ffc84a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk in eight directions; the three fire buttons shoot up-left, straight up and up-right (hold to keep firing) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 130, 80, 0.9); background: rgba(255, 130, 80, 0.22); }
  #touch .jump.on { background: rgba(255, 130, 80, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: grid; grid-template-columns: repeat(3, auto); grid-template-areas: ". u ." "l . r"; gap: 2px 4px; pointer-events: none; }
  #touch .btns .fl { grid-area: l; } #touch .btns .fu { grid-area: u; } #touch .btns .fr { grid-area: r; }
  #touch .btns .jump { width: 66px; height: 66px; font-size: 22px; }
  #touch.small .btns .jump { width: 56px; height: 56px; font-size: 19px; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(30, 20, 12, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e1804; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8781a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump fl" aria-label="Spara in diagonale a sinistra">◤</button><button type="button" class="jump fu" aria-label="Spara dritto">▲</button><button type="button" class="jump fr" aria-label="Spara in diagonale a destra">◥</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const SX0 = 150, SX1 = 490, SPEED = 26;
  const ANG = 0.7; // the diagonal shots: about 35° from straight up
  const DIRS = { l: [-Math.sin(ANG), -Math.cos(ANG)], u: [0, -1], r: [Math.sin(ANG), -Math.cos(ANG)] };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · ogni città comincia a cavallo · banditi più lenti a sparare", lives: 5, fire: 0.55, bspd: 0.75, count: 0.75 },
    normale:   { label: "NORMALE",   color: "#ffc84a", desc: "3 vite", lives: 3, fire: 0.85, bspd: 0.95, count: 0.95 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · più banditi, più colpi e più veloci", lives: 3, fire: 1.15, bspd: 1.1, count: 1.2 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pistole-difficulty";
  const bestKey = (id) => `pistole-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const BOSSES = ["BILL IL NERO", "JACK DUE PISTOLE", "IL MESSICANO", "DOC VELENO", "MAMMA DALTON", "IL BARONE"];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => { noise(0.05, 0.06, 2600); beep(1100, 0.04, "square", 0.02, -600); }),
    enemyShot: lim(() => { noise(0.05, 0.05, 1300); }),
    kill: lim(() => { beep(600, 0.1, "square", 0.035, -400); noise(0.08, 0.05, 1500); }),
    barrel: lim(() => { noise(0.1, 0.07, 500); }),
    boom: lim(() => noise(0.4, 0.16, 260)),
    item: () => arp([659, 784, 988, 1319], 0.05, 0.08, "square", 0.04),
    neigh: () => { beep(900, 0.25, "sawtooth", 0.03, 400); beep(1300, 0.2, "sawtooth", 0.02, -500, 0.2); },
    bossHit: lim(() => beep(180, 0.06, "square", 0.04, -60)),
    wanted: () => arp([330, 330, 392, 330, 262], 0.14, 0.16, "triangle", 0.05),
    die: () => { noise(0.3, 0.1, 400); for (let i = 0; i < 6; i++) beep(600 - i * 70, 0.12, "triangle", 0.045, 0, i * 0.07); },
    clear: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 1, bestCache = 0, nextLife = 30000;
  let LEN = 2400, dist = 0, P = null, foes = [], shots = [], eshots = [], dyns = [], booms = [], barrels = [], items = [], parts = [], popups = [], boss = null, message = null, spawnT = 0, barrelT = 0;
  const fireBtn = { l: false, u: false, r: false };
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 1; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = null;
    beginStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginStage() {
    LEN = Math.min(4000, 2200 + 250 * (stage - 1));
    dist = 0; foes = []; shots = []; eshots = []; dyns = []; booms = []; barrels = []; items = []; parts = []; popups = []; boss = null;
    spawnT = 2.5; barrelT = 3;
    const keep = P ? { boots: P.boots, rifle: P.rifle } : { boots: 0, rifle: 0 };
    P = { x: 320, y: 300, safe: 1.5, walk: 0, cd: 0, horse: difficulty === "facile" ? 3 : 0, ...keep };
    message = { text: `CITTÀ ${stage}`, sub: `ricercato: ${BOSSES[(stage - 1) % BOSSES.length]}`, t: 0 };
    state = "intro"; stateT = 1.8;
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 50000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: P.x, y: P.y - 40, text: "VITA EXTRA!", color: "#7ed87a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function hurt(by) {
    if (state !== "play" || P.safe > 0) return;
    if (window.__deaths) window.__deaths.push([stage, by, Math.round(dist), P.horse]);
    if (window.__god) return;
    if (P.horse > 0) {
      // the horse takes the hit
      P.horse--; P.safe = 1.2; sfx.neigh(); burst(P.x, P.y, "#a86a3a", 12, 100, 0.5);
      if (!P.horse) popups.push({ x: P.x, y: P.y - 30, text: "IL CAVALLO SCAPPA!", color: "#ffc84a", t: 0 });
      return;
    }
    lives--; sfx.die(); burst(P.x, P.y - 8, "#ffffff", 20, 120, 0.7);
    state = "dead"; stateT = 2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · città ${stage} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>POLVERE E PISTOLE</h1>
       <p>Il nuovo sceriffo risale la strada principale di ogni città, che scorre da sola, fino al covo del ricercato del manifesto. Spara in tre direzioni: in diagonale a sinistra, dritto e in diagonale a destra. Le diagonali servono per i pistoleri alle finestre!</p>
       <div class="pts">
         <span><b>Banditi</b></span><span>a piedi 100 · alle finestre 200 · dinamitardi 300 · a cavallo 400 · candelotto colpito al volo 50</span>
         <span><b>Botti</b></span><span>sparaci: dentro trovi stivali (più veloce), fucile (colpi più lunghi), un cavallo (regge 3 colpi) o una stella (1.000)</span>
         <span><b>Ricercato</b></span><span>in fondo alla strada: taglia di 2.000 più 1.000 per città</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per muoverti · ◤ ▲ ◥ per sparare (tieni premuto)</p>`
         : `<p class="muted help">Frecce o W A S D per muoverti · J K L (oppure Z X C) per sparare a sinistra, dritto e a destra · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>IN SELLA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const FIREMAP = { j: "l", z: "l", k: "u", x: "u", l: "r", c: "r", " ": "u" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (FIREMAP[k]) fireBtn[FIREMAP[k]] = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (FIREMAP[k]) fireBtn[FIREMAP[k]] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; for (const k in fireBtn) fireBtn[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  for (const [sel, dir] of [[".fl", "l"], [".fu", "u"], [".fr", "r"]]) {
    const b = touchEl.querySelector(sel);
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); fireBtn[dir] = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { fireBtn[dir] = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.15 ? 0 : Math.sign(v) * Math.min(1, (a - 0.15) / 0.55); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);

  // ---------- Hero ----------

    let my = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);

  // ---------- Bandits ----------
  function spawnFoe() {

  function aimShot(x, y, spd, spread = 0) {

  const bspd = () => 125 * diff.bspd * (1 + 0.04 * Math.min(8, stage - 1));
  function updateFoes(dt) {
    const fire = diff.fire * (1 + 0.06 * Math.min(8, stage - 1));

      }
      if (f.kind === "cavallo") {
        f.y += f.vy * dt; f.x += Math.sin(f.t * 2) * 20 * dt;
        f.cd -= dt;
        if (f.cd <= 0 && f.y < P.y - 40) { aimShot(f.x, f.y, bspd() * 1.1); sfx.enemyShot(); f.cd = rnd(0.8, 1.3) / fire; }

      }

      if (f.wait > 0) {

      } else {

  function updateBoss(dt) {

    } else {
      ctx.fillStyle = "#3a2a1a"; ctx.fillRect(x0 + 230, 11, 120, 6);
      ctx.fillStyle = "#ffc84a"; ctx.fillRect(x0 + 230 + 120 * clamp(dist / LEN, 0, 1) - 1, 8, 3, 12);
    }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#e8e0c8"; ctx.fillRect(lx - 12 - i * 14, 12, 12, 3); ctx.fillRect(lx - 9 - i * 14, 8, 6, 5); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) P = { x: 320, y: 300, safe: 0, walk: 0, horse: 0, boots: 0, rifle: 0 };
    // the dusty main street
    ctx.fillStyle = "#c8a46a"; ctx.fillRect(0, TOP, W, H - TOP);
    ctx.fillStyle = "rgba(120,80,40,0.25)";
    for (let i = 0; i < 40; i++) { const y = ((i * 53 + dist) % (H - TOP)) + TOP, x = SX0 + ((i * 97) % (SX1 - SX0)); ctx.fillRect(x, y, 6, 2); }
    ctx.fillStyle = "rgba(120,80,40,0.18)"; ctx.fillRect(250, TOP, 6, H - TOP); ctx.fillRect(384, TOP, 6, H - TOP);
    drawBuildings();
    for (const b of barrels) {
      ctx.fillStyle = "#7a4a1a"; ctx.fillRect(b.x - 10, b.y - 12, 20, 22);
      ctx.fillStyle = "#3a2a1a"; ctx.fillRect(b.x - 10, b.y - 7, 20, 2); ctx.fillRect(b.x - 10, b.y + 4, 20, 2);
    }
    for (const it of items) {
      if (it.t > 9 && Math.floor(clock * 8) % 2) continue;
      ctx.font = "16px system-ui"; ctx.textAlign = "center";
      ctx.fillText({ stivali: "👢", fucile: "🔫", cavallo: "🐎", stella: "⭐" }[it.kind], it.x, it.y + 5);
    }
    for (const f of foes) drawFoe(f);
    if (boss) {
      const b = boss;
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(b.x, b.y + 2, 14, 4, 0, 0, TAU); ctx.fill();
      drawCowboy(b.x, b.y, b.t * 6, b.hurt > 0 ? "#ffffff" : "#2a2a2a", "#5a1a1a", "down", 1.6);
    }
    for (const d of dyns) { ctx.fillStyle = "#c8281a"; ctx.fillRect(d.x - 2, d.y - 5, 4, 10); ctx.fillStyle = Math.floor(clock * 20) % 2 ? "#ffd23a" : "#ffffff"; ctx.fillRect(d.x - 1, d.y - 8, 2, 3); }
    if (state !== "menu" && (state !== "dead" || Math.floor(clock * 6) % 2)) drawHero();
    ctx.fillStyle = "#fff8c8"; for (const s of shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, TAU); ctx.fill(); }
    for (const s of eshots) { ctx.fillStyle = "#2a1a1a"; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#ff6a3a"; ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, TAU); ctx.fill(); }
    for (const b of booms) { ctx.fillStyle = `rgba(255,${170 - b.t * 200},40,${1 - b.t / 0.5})`; ctx.beginPath(); ctx.arc(b.x, b.y - 4, 10 + b.t * 50, 0, TAU); ctx.fill(); }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1e140c"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      const life = message.long ? 2.8 : 2.2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ffc84a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1e140c"; ctx.strokeText(message.text, W / 2, 190); ctx.fillText(message.text, W / 2, 190);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 209); ctx.fillText(message.sub, W / 2, 209); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="pistole-best-" data-kind="score"></script>

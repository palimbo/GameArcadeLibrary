<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Allunaggio</title>
<style>
  :root {
    --bg: #05060c;
    --fg: #eef3ff;
    --muted: #9aa6c2;
    --glow: #7df9c8;
    --bad: #ff5a6a;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(125, 249, 200, 0.25), 0 0 24px rgba(125, 249, 200, 0.08); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(238, 243, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 64px; height: 64px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(125, 249, 200, 0.6); background: rgba(125, 249, 200, 0.08);
  }
  #touch.small button { width: 54px; height: 54px; font-size: 20px; }
  #touch button.on { background: rgba(125, 249, 200, 0.4); }
  #touch button[data-a="thrust"] { width: 84px; height: 84px; border-color: rgba(255, 176, 58, 0.85); background: rgba(255, 176, 58, 0.14); }
  #touch.small button[data-a="thrust"] { width: 68px; height: 68px; }
  #touch button[data-a="level"] { width: 50px; height: 50px; font-size: 16px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(5, 6, 12, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(36px, 9vw, 64px); letter-spacing: 6px; font-weight: 400; color: var(--fg); text-shadow: 0 0 12px var(--glow), 0 0 30px rgba(125, 249, 200, 0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 400; letter-spacing: 3px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.6; font-family: system-ui, sans-serif; }
  #overlay p.muted { color: var(--muted); }
  #overlay .worlds { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 18px; font-size: 12px; color: var(--muted); }
  #overlay .worlds b { color: var(--fg); font-weight: 400; display: block; font-size: 14px; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(238,243,255,0.35); border-radius: 4px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--glow); color: #000; background: var(--glow); padding: 10px 28px; box-shadow: 0 0 16px rgba(125,249,200,0.55); }
  @media (max-width: 520px) { #overlay .worlds { grid-template-columns: repeat(2, auto); } }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .worlds { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-a="left" aria-label="Ruota a sinistra">⟲</button>
    <button type="button" data-a="right" aria-label="Ruota a destra">⟳</button>
    <button type="button" data-a="level" aria-label="Raddrizza">◎</button>
  </div>
  <div class="cl">
    <button type="button" data-a="thrust" aria-label="Razzo">▲</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 800, H = 500;          // screen, in world units at zoom 1
  const WW = 1600;                  // the world wraps around horizontally
  const THRUST = 44, TURN = 2.8, FUEL_RATE = 26;
  const FOOT = 10, FOOT_X = 10;     // feet position below / beside the centre

  // four worlds, three stages each; after Titan the tour starts again with stronger gravity
  const WORLDS = [
    { name: "LUNA", g: 16, wind: 0, sky: ["#000000", "#05060c"], ground: "#24252e", line: "#d8dcea", pad: "#7df9c8", desc: "Nessun vento" },
    { name: "MARTE", g: 19, wind: 7, sky: ["#1a0604", "#3a120a"], ground: "#3a1a10", line: "#ff9a6a", pad: "#7df9c8", desc: "Vento leggero" },
    { name: "IO", g: 22, wind: 4, sky: ["#07050a", "#1a1206"], ground: "#3a3210", line: "#ffe36a", pad: "#7df9ff", desc: "Gravità forte" },
    { name: "TITANO", g: 18, wind: 13, sky: ["#1a0e02", "#4a2a08"], ground: "#3a2408", line: "#ffb03a", pad: "#b3ff7d", desc: "Raffiche forti" },
  ];
  const PAD_W = { 2: 84, 3: 60, 4: 46, 5: 34 };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "1.500 di carburante · gravità ridotta · atterraggi più morbidi accettati", fuel: 1500, safe: 26, gMul: 0.85 },
    normale:   { label: "NORMALE",   color: "#7df9c8", desc: "1.000 di carburante · l'esperienza classica", fuel: 1000, safe: 20, gMul: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a6a", desc: "800 di carburante · gravità più forte · serve un tocco leggerissimo", fuel: 800, safe: 15, gMul: 1.12 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "allunaggio-difficulty";
  const bestKey = (id) => `allunaggio-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const mod = (x, m) => ((x % m) + m) % m;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(140px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 140;
    if (showTouch && !portrait) {
      // landscape: keep the playfield between the two groups of buttons
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 300) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  // the rocket engine: a looping rumble whose volume follows the thrust
  function engineSet(on) {
    if (!audioCtx) return;
    if (!engine) {
      const len = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0;
      src.connect(f).connect(g).connect(audioCtx.destination); src.start();
      engine = g;
    }
    engine.gain.setTargetAtTime(on ? 0.22 : 0, audioCtx.currentTime, 0.04);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    land: () => arp([523, 659, 784, 1047], 0.08, 0.14, "triangle", 0.05),
    perfect: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.14, "square", 0.04),
    crash: () => { noise(1.4, 0.5, 700); beep(160, 0.9, "sawtooth", 0.05, -120); },
    alarm: () => beep(880, 0.1, "square", 0.03),
    low: () => { beep(440, 0.12, "square", 0.035); beep(440, 0.12, "square", 0.035, 0, 0.18); },
    start: () => arp([392, 523, 659], 0.1, 0.12, "triangle", 0.045),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0;
  let level = 0, score = 0, fuel = 0, bestCache = 0, clock = 0, gameTime = 0, landings = 0, crashes = 0;
  let terrain = [], pads = [], ship = null, parts = [], debris = [], result = null, windA = 0, windPhase = 0;
  let zoom = 1, camX = 0, camY = H / 2, lowWarned = false, alarmT = 0;
  const ctl = { left: false, right: false, thrust: false, level: false };
  const stars = Array.from({ length: 120 }, (_, i) => ({ x: (i * 173.3) % W, y: (i * 97.7) % H, s: i % 9 === 0 ? 1.8 : 1, tw: i * 1.7 }));

  const world = () => WORLDS[Math.floor(level / 3) % 4];
  const loopN = () => Math.floor(level / 12);
  const gravity = () => world().g * diff.gMul * (1 + 0.08 * loopN());

  // ---------- Terrain ----------
  function buildTerrain() {
    const r = rng(level * 7919 + 17), stage = level % 12;
    const step = 20, n = WW / step;
    const hs = [];
    let h = 380, v = 0;
    const rough = 1 + Math.min(stage, 11) * 0.12;
    for (let i = 0; i < n; i++) {
      v = v * 0.75 + (r() - 0.5) * 34 * rough;
      h += v;
      if (h < 220) { h = 220; v = Math.abs(v); }
      if (h > 470) { h = 470; v = -Math.abs(v); }
      hs.push(h);
    }
    // blend the end into the start so the world wraps without a step
    for (let k = 0; k < 10; k++) { const t = k / 10; hs[n - 10 + k] = hs[n - 10 + k] * (1 - t) + hs[0] * t; }
    // landing pads: fewer and narrower as the tour goes on
    const mults = stage < 3 ? [2, 2, 3, 5] : stage < 6 ? [2, 3, 4, 5] : stage < 9 ? [2, 3, 5] : [3, 4, 5];
    pads = [];
    const slots = mults.length, slotW = WW / slots;
    mults.forEach((m, k) => {
      const w = PAD_W[m];
      const x0 = Math.round((k * slotW + 60 + r() * (slotW - 120 - w)) / step) * step;
      const i0 = x0 / step, i1 = Math.ceil((x0 + w) / step);
      const py = Math.max(250, Math.min(460, hs[i0]));
      for (let i = i0; i <= i1; i++) hs[mod(i, n)] = py;
      pads.push({ x0, x1: x0 + w, y: py, m });
    });
    terrain = hs;
  }
  function groundAt(x) {
    const step = WW / terrain.length, fx = mod(x, WW) / step, i = Math.floor(fx), t = fx - i;
    const a = terrain[i % terrain.length], b = terrain[(i + 1) % terrain.length];
    return a + (b - a) * t;
  }
  function padAt(x) {
    const wx = mod(x, WW);
    return pads.find((p) => wx >= p.x0 && wx <= p.x1) || null;
  }

  function newShip() {
    const r = rng(level * 131 + crashes * 7 + 3);
    const dir = r() < 0.5 ? -1 : 1;
    return { x: 100 + r() * (WW - 200), y: 105, vx: dir * Math.min(70, 26 + level * 3), vy: 0, a: 0, thrusting: false, flame: 0, alive: true };
  }
  function startStage() {
    buildTerrain();
    ship = newShip();
    parts = []; debris = []; result = null;
    zoom = 1; camX = ship.x; camY = H / 2;
    windPhase = level * 1.3;
    state = "intro"; stateT = 1.6;
    sfx.start();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "fly", "landed", "crashed"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    level = 0; score = 0; fuel = diff.fuel; gameTime = 0; landings = 0; crashes = 0; lowWarned = false;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function landed(pad) {
    const s = ship;
    const vy = s.vy, vx = Math.abs(s.vx);
    const perfect = vy < diff.safe * 0.45 && vx < 5 && Math.abs(s.a) < 0.08;
    let pts = 50 * pad.m * (perfect ? 2 : 1) + 10 * (level + 1);
    const bonusFuel = perfect ? 160 : 80;
    score += pts; fuel += bonusFuel; landings++;
    s.vx = s.vy = 0; s.a = 0; s.y = pad.y - FOOT; s.thrusting = false;
    engineSet(false);
    result = { ok: true, perfect, pts, fuel: bonusFuel, m: pad.m };
    if (perfect) sfx.perfect(); else sfx.land();
    state = "landed"; stateT = 2.8;
  }
  function crash(reason) {
    const s = ship;
    s.alive = false; s.thrusting = false;
    engineSet(false);
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 90;
      debris.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp + s.vx * 0.3, vy: Math.sin(a) * sp - 40, a: Math.random() * 6, va: (Math.random() - 0.5) * 8, len: 4 + Math.random() * 7, t: 0 });
    }
    for (let k = 0; k < 40; k++) {
      const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 120;
      parts.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, t: 0, life: 0.5 + Math.random() * 0.9, c: Math.random() < 0.5 ? "#ffb03a" : "#ff5a3a", g: 40 });
    }
    const lost = Math.min(fuel, 150);
    fuel -= lost; crashes++;
    result = { ok: false, reason, lost };
    sfx.crash();
    state = "crashed"; stateT = 2.8;
  }
  function afterResult() {
    if (fuel <= 0) { gameOver(); return; }
    if (result.ok) level++;
    startStage();
  }
  function gameOver() {
    state = "over";
    engineSet(false);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, reached = `${world().name} ${level % 3 + 1}`;
    menu = () => showOverlay(
      `<h2 class="lose">CARBURANTE ESAURITO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${landings} atterraggi · arrivato a ${reached} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      engineSet(false);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(112px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "14px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>ALLUNAGGIO</h1>
       <p>Porta il modulo sulle piazzole di atterraggio: accendi il razzo per frenare la caduta, ruota per correggere la deriva e tocca il suolo dritto e piano. Le piazzole piccole valgono di più. Ogni atterraggio ti porta più lontano, ogni schianto ti costa carburante: quando finisce, la missione è chiusa.</p>
       <div class="worlds">
         <span><b>LUNA</b>nessun vento</span><span><b>MARTE</b>vento leggero</span><span><b>IO</b>gravità forte</span><span><b>TITANO</b>raffiche forti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">⟲ ⟳ per ruotare · ▲ razzo (tieni premuto) · ◎ raddrizza il modulo</p>`
         : `<p class="muted help">← → o A D ruota · ↑, W o SPAZIO razzo · ↓ o S raddrizza il modulo · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "thrust", w: "thrust", " ": "thrust", arrowdown: "level", s: "level" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (k === "arrowleft") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 2) % 3]);
      else if (k === "arrowright") setDifficulty(DIFF_IDS[(DIFF_IDS.indexOf(difficulty) + 1) % 3]);
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (a) ctl[a] = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  // points of the lander that can touch the ground, in world coordinates
  function hullPoints(s) {
    const c = Math.cos(s.a), sn = Math.sin(s.a);
    const tr = (lx, ly) => ({ x: s.x + lx * c - ly * sn, y: s.y + lx * sn + ly * c });
    const pts = [tr(-FOOT_X, FOOT), tr(FOOT_X, FOOT)];
    for (let k = 0; k < 8; k++) { const an = (k / 8) * Math.PI * 2; pts.push(tr(Math.cos(an) * 7, -3 + Math.sin(an) * 7)); }
    pts.push(tr(0, 6));
    return pts;
  }
  function altitude() { return groundAt(ship.x) - (ship.y + FOOT); }
  function update(dt) {
    clock += dt;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const d of debris) {
      d.t += dt; d.vy += gravity() * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt;
      if (d.y > groundAt(d.x)) { d.y = groundAt(d.x); d.vy *= -0.3; d.vx *= 0.6; d.va *= 0.5; }
    }
    if (!isPlaying()) return;
    // the camera zooms in close to the ground
    if (ship) {
      const near = ship.alive && altitude() < 120;
      zoom += ((near ? 2 : 1) - zoom) * Math.min(1, dt * 3);
      camX += (ship.x - camX) * Math.min(1, dt * 6);
      const vh = H / zoom;
      const wantY = zoom > 1.02 ? Math.max(vh / 2, Math.min(H - vh / 2, ship.y + 20)) : H / 2;
      camY += (wantY - camY) * Math.min(1, dt * 5);
    }
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "fly"; }
    if (state === "landed" || state === "crashed") { stateT -= dt; if (stateT <= 0) afterResult(); return; }
    if (state !== "fly" && state !== "intro") return;

    const s = ship;
    if (state === "intro") return;
    gameTime += dt;
    // rotation, with the stabiliser turning the lander upright
    if (ctl.left) s.a -= TURN * dt;
    if (ctl.right) s.a += TURN * dt;
    if (ctl.level && !ctl.left && !ctl.right) s.a -= Math.sign(s.a) * Math.min(Math.abs(s.a), TURN * dt);
    s.a = Math.max(-Math.PI * 0.55, Math.min(Math.PI * 0.55, s.a));
    s.thrusting = ctl.thrust && fuel > 0;
    engineSet(s.thrusting);
    if (s.thrusting) {
      s.vx += Math.sin(s.a) * THRUST * dt;
      s.vy -= Math.cos(s.a) * THRUST * dt;
      fuel = Math.max(0, fuel - FUEL_RATE * dt);
      s.flame = Math.min(1, s.flame + dt * 8);
      if (Math.random() < 0.7) {
        const c = Math.cos(s.a), sn = Math.sin(s.a), sp = 60 + Math.random() * 40, spread = (Math.random() - 0.5) * 0.5;
        parts.push({ x: s.x - sn * 9, y: s.y + c * 9, vx: s.vx - Math.sin(s.a + spread) * sp, vy: s.vy + Math.cos(s.a + spread) * sp, t: 0, life: 0.3 + Math.random() * 0.3, c: Math.random() < 0.5 ? "#ffd34d" : "#ff8a3a" });
      }
    } else s.flame = Math.max(0, s.flame - dt * 6);
    if (fuel < diff.fuel * 0.15 && !lowWarned) { lowWarned = true; sfx.low(); }
    // gravity and wind (gusts come and go)
    const w = world();
    windPhase += dt;
    windA = w.wind * (1 + 0.08 * loopN()) * (Math.sin(windPhase * 0.35) * 0.7 + Math.sin(windPhase * 1.1 + 1) * 0.3);
    s.vy += gravity() * dt;
    s.vx += windA * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < -260) { s.y = -260; s.vy = Math.max(0, s.vy); }
    s.x = mod(s.x, WW);
    if (Math.abs(camX - s.x) > WW / 2) camX += Math.sign(s.x - camX) * WW; // keep the camera on the same lap
    // danger beep when coming in too fast
    const alt = altitude();
    alarmT -= dt;
    if (alt < 60 && s.vy > diff.safe && alarmT <= 0) { alarmT = 0.25; sfx.alarm(); }
    // touchdown
    const pts = hullPoints(s);
    let touching = false, body = false;
    pts.forEach((p, k) => { if (p.y >= groundAt(p.x)) { touching = true; if (k >= 2) body = true; } });
    if (!touching) return;
    const pad = padAt(s.x);
    const onPad = pad && padAt(pts[0].x) === pad && padAt(pts[1].x) === pad;
    if (!onPad) { crash(pad ? "Troppo vicino al bordo della piazzola" : "Fuori dalla piazzola"); return; }
    if (body) { crash("Il modulo si è rovesciato"); return; }
    if (Math.abs(s.a) > 0.26) { crash("Troppo inclinato"); return; }
    if (s.vy > diff.safe) { crash("Discesa troppo veloce"); return; }
    if (Math.abs(s.vx) > diff.safe * 0.6) { crash("Troppa velocità orizzontale"); return; }
    landed(pad);
  }

  // ---------- Drawing ----------
  function toScreen() {
    // world → screen: zoom around the camera
    ctx.setTransform(pxRatio * zoom, 0, 0, pxRatio * zoom, pxRatio * (W / 2 - camX * zoom), pxRatio * (H / 2 - camY * zoom));
  }
  function drawWorld() {
    const w = world();
    const vw = W / zoom, left = camX - vw / 2, right = camX + vw / 2;
    // terrain: fill and line, repeating the wrapped world as needed
    const step = WW / terrain.length;
    const i0 = Math.floor(left / step) - 1, i1 = Math.ceil(right / step) + 1;
    ctx.beginPath();
    ctx.moveTo(i0 * step, H + 40);
    for (let i = i0; i <= i1; i++) ctx.lineTo(i * step, terrain[mod(i, terrain.length)]);
    ctx.lineTo(i1 * step, H + 40);
    ctx.closePath();
    ctx.fillStyle = w.ground; ctx.fill();
    ctx.beginPath();
    for (let i = i0; i <= i1; i++) { const x = i * step, y = terrain[mod(i, terrain.length)]; if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.strokeStyle = w.line; ctx.lineWidth = 1.6 / zoom * 1.2; ctx.shadowColor = w.line; ctx.shadowBlur = 6;
    ctx.stroke(); ctx.shadowBlur = 0;
    // pads
    const lap0 = Math.floor(left / WW) - 1, lap1 = Math.floor(right / WW) + 1;
    for (let lap = lap0; lap <= lap1; lap++) for (const p of pads) {
      const x0 = p.x0 + lap * WW, x1 = p.x1 + lap * WW;
      if (x1 < left - 20 || x0 > right + 20) continue;
      ctx.strokeStyle = w.pad; ctx.lineWidth = 3.5 / zoom * 1.4; ctx.shadowColor = w.pad; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(x0, p.y); ctx.lineTo(x1, p.y); ctx.stroke(); ctx.shadowBlur = 0;
      const on = Math.floor(clock * 2) % 2 === 0;
      ctx.fillStyle = on ? "#ff5a6a" : "rgba(255,90,106,0.3)";
      ctx.fillRect(x0 - 1.5, p.y - 4, 3, 3); ctx.fillRect(x1 - 1.5, p.y - 4, 3, 3);
      ctx.fillStyle = w.pad; ctx.font = `700 ${12 / zoom * 1.3}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center";
      ctx.fillText(`×${p.m}`, (x0 + x1) / 2, p.y + 16 / zoom * 1.3);
    }
  }
  function drawShip(s) {
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.lineWidth = 1.3; ctx.strokeStyle = "#eef3ff"; ctx.lineJoin = "round";
    // flame
    if (s.flame > 0.05) {
      const fl = (8 + Math.random() * 7) * s.flame;
      ctx.fillStyle = "rgba(255,176,58,0.9)"; ctx.beginPath(); ctx.moveTo(-3.5, 6); ctx.lineTo(0, 6 + fl); ctx.lineTo(3.5, 6); ctx.fill();
      ctx.fillStyle = "rgba(255,240,180,0.9)"; ctx.beginPath(); ctx.moveTo(-1.8, 6); ctx.lineTo(0, 6 + fl * 0.55); ctx.lineTo(1.8, 6); ctx.fill();
    }
    // descent stage, legs and feet
    ctx.fillStyle = "#c9a23a"; ctx.fillRect(-7, 0, 14, 5); ctx.strokeRect(-7, 0, 14, 5);
    ctx.beginPath();
    ctx.moveTo(-6, 4); ctx.lineTo(-FOOT_X, FOOT); ctx.moveTo(6, 4); ctx.lineTo(FOOT_X, FOOT);
    ctx.moveTo(-FOOT_X - 3, FOOT); ctx.lineTo(-FOOT_X + 3, FOOT); ctx.moveTo(FOOT_X - 3, FOOT); ctx.lineTo(FOOT_X + 3, FOOT);
    ctx.moveTo(-3, 5); ctx.lineTo(-2, 7); ctx.lineTo(2, 7); ctx.lineTo(3, 5);
    ctx.stroke();
    // ascent stage
    ctx.fillStyle = "#b8c0d8"; ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(-7, -6); ctx.lineTo(-3, -10); ctx.lineTo(3, -10); ctx.lineTo(7, -6); ctx.lineTo(6, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1a2a4a"; ctx.beginPath(); ctx.moveTo(-3, -7); ctx.lineTo(0, -8); ctx.lineTo(0, -4); ctx.lineTo(-3, -4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(5, -14); ctx.stroke();
    ctx.restore();
  }
  function drawSky() {
    const w = world();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, w.sky[0]); g.addColorStop(1, w.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // parallax stars
    for (const st of stars) {
      const x = mod(st.x - camX * 0.08, W), y = st.y;
      ctx.globalAlpha = (world().name === "TITANO" ? 0.25 : 0.6) + 0.35 * Math.sin(clock * 1.5 + st.tw);
      ctx.fillStyle = "#fff"; ctx.fillRect(x, y, st.s, st.s);
    }
    ctx.globalAlpha = 1;
    // a planet in the sky of each world
    const px = mod(620 - camX * 0.03, W + 200) - 100;
    if (w.name === "LUNA") { ctx.fillStyle = "#2a6aff"; ctx.beginPath(); ctx.arc(px, 90, 26, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#3dc86a"; ctx.beginPath(); ctx.arc(px - 8, 84, 9, 0, Math.PI * 2); ctx.arc(px + 9, 98, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.beginPath(); ctx.arc(px + 10, 90, 26, -Math.PI / 2, Math.PI / 2); ctx.fill(); }
    else if (w.name === "MARTE") { ctx.fillStyle = "#c8b8a0"; ctx.beginPath(); ctx.arc(px, 80, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#a89880"; ctx.beginPath(); ctx.arc(px - 90, 130, 4, 0, Math.PI * 2); ctx.fill(); }
    else if (w.name === "IO") {
      const g2 = ctx.createRadialGradient(px - 20, 100, 10, px, 120, 90);
      g2.addColorStop(0, "#f0d8b0"); g2.addColorStop(1, "#8a6a4a");
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(px, 120, 90, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(px, 120, 90, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "rgba(160,90,50,0.45)"; for (const y of [80, 108, 140, 170]) ctx.fillRect(px - 100, y, 200, 9);
      ctx.fillStyle = "#c8502a"; ctx.beginPath(); ctx.ellipse(px + 30, 150, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = "#e8d8a0"; ctx.beginPath(); ctx.arc(px, 100, 40, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(232,216,160,0.8)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(px, 100, 80, 14, -0.25, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function gauge(label, value, unit, ok, x, y) {
    ctx.textAlign = "right"; ctx.fillStyle = "#9aa6c2"; ctx.fillText(label, x, y);
    ctx.textAlign = "left"; ctx.fillStyle = ok ? "#7df9c8" : "#ff5a6a"; ctx.fillText(`${value}${unit}`, x + 8, y);
  }
  function drawHud() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const w = world();
    ctx.font = "700 13px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.fillStyle = "#eef3ff";
    ctx.fillText(`PUNTI ${score.toLocaleString("it-IT")}`, 14, 22);
    ctx.fillStyle = "#9aa6c2";
    ctx.fillText(`${w.name} ${level % 3 + 1}/3${loopN() ? ` · GIRO ${loopN() + 1}` : ""}`, 14, 40);
    ctx.fillText(`RECORD ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 14, 58);
    // fuel bar
    const fw = 200, fx = W / 2 - fw / 2, frac = Math.min(1, fuel / diff.fuel);
    ctx.textAlign = "center"; ctx.fillStyle = "#9aa6c2"; ctx.fillText(`CARBURANTE ${Math.ceil(fuel)}`, W / 2, 20);
    ctx.strokeStyle = "rgba(238,243,255,0.4)"; ctx.lineWidth = 1; ctx.strokeRect(fx, 27, fw, 8);
    const low = frac < 0.15;
    ctx.fillStyle = low ? (Math.floor(clock * 4) % 2 ? "#ff5a6a" : "#7a2a30") : frac < 0.35 ? "#ffd34d" : "#7df9c8";
    ctx.fillRect(fx + 1, 28, (fw - 2) * Math.min(1, frac), 6);
    if (fuel > diff.fuel) { ctx.fillStyle = "#7df9ff"; ctx.fillRect(fx + 1, 28, (fw - 2) * Math.min(1, (fuel - diff.fuel) / diff.fuel), 2); }
    // flight data
    if (ship) {
      const alt = Math.max(0, altitude());
      const x = W - 110;
      gauge("ALTITUDINE", Math.round(alt), "", true, x, 22);
      const hv = Math.round(ship.vx), vv = Math.round(ship.vy);
      gauge("VEL. ORIZZ.", `${hv > 0 ? "→" : hv < 0 ? "←" : " "}${Math.abs(hv)}`, "", Math.abs(ship.vx) <= diff.safe * 0.6, x, 40);
      gauge("VEL. VERT.", `${vv > 0 ? "↓" : vv < 0 ? "↑" : " "}${Math.abs(vv)}`, "", ship.vy <= diff.safe, x, 58);
      const tilt = Math.round(ship.a * 180 / Math.PI);
      gauge("INCLINAZIONE", `${tilt}°`, "", Math.abs(ship.a) <= 0.26, x, 76);
    }
    if (world().wind) {
      ctx.textAlign = "center"; ctx.fillStyle = "#9aa6c2"; ctx.fillText("VENTO", W / 2, 54);
      const len = Math.max(-60, Math.min(60, windA * 5));
      ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W / 2, 64); ctx.lineTo(W / 2 + len, 64); ctx.stroke();
      if (Math.abs(len) > 3) { const d = Math.sign(len); ctx.beginPath(); ctx.moveTo(W / 2 + len, 64); ctx.lineTo(W / 2 + len - d * 6, 60); ctx.lineTo(W / 2 + len - d * 6, 68); ctx.fillStyle = "#ffd34d"; ctx.fill(); }
    }
    // off the top of the screen: show where the lander is
    if (ship && ship.alive) {
      const sy = (ship.y - camY) * zoom + H / 2;
      if (sy < 0) {
        const sx = (ship.x - camX) * zoom + W / 2;
        ctx.fillStyle = "#7df9c8"; ctx.beginPath(); ctx.moveTo(sx, 90); ctx.lineTo(sx - 7, 102); ctx.lineTo(sx + 7, 102); ctx.fill();
      }
    }
    // messages
    ctx.textAlign = "center";
    const msg = (big, small, color) => {
      ctx.fillStyle = "rgba(5,6,12,0.65)"; ctx.fillRect(0, H / 2 - 62, W, small ? 104 : 72);
      ctx.font = "400 30px ui-monospace, Menlo, monospace"; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12;
      ctx.fillText(big, W / 2, H / 2 - 18); ctx.shadowBlur = 0;
      if (small) { ctx.font = "700 14px ui-monospace, Menlo, monospace"; ctx.fillStyle = "#eef3ff"; ctx.fillText(small, W / 2, H / 2 + 16); }
    };
    if (state === "intro") msg(`${w.name} · STAGE ${level % 3 + 1}`, `gravità ${gravity().toFixed(0)} · ${w.desc.toLowerCase()} · ${pads.length} piazzole`, "#7df9c8");
    else if (state === "landed" && result) msg(result.perfect ? "ATTERRAGGIO PERFETTO!" : "ATTERRATO!", `+${result.pts} punti (piazzola ×${result.m}${result.perfect ? ", doppio" : ""}) · +${result.fuel} carburante`, result.perfect ? "#ffd34d" : "#7df9c8");
    else if (state === "crashed" && result) msg("SCHIANTO!", `${result.reason} · -${Math.round(result.lost)} carburante`, "#ff5a6a");
    else if (state === "fly" && fuel <= 0) { ctx.font = "700 16px ui-monospace, Menlo, monospace"; ctx.fillStyle = Math.floor(clock * 4) % 2 ? "#ff5a6a" : "#eef3ff"; ctx.fillText("CARBURANTE ESAURITO", W / 2, 110); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawSky();
    if (!terrain.length) return;
    toScreen();
    drawWorld();
    // draw the lander on the lap closest to the camera
    for (const q of parts) {
      const x = q.x + Math.round((camX - q.x) / WW) * WW;
      ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(x - 1, q.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#eef3ff"; ctx.lineWidth = 1.2;
    for (const d of debris) {
      const x = d.x + Math.round((camX - d.x) / WW) * WW;
      ctx.beginPath(); ctx.moveTo(x - Math.cos(d.a) * d.len / 2, d.y - Math.sin(d.a) * d.len / 2); ctx.lineTo(x + Math.cos(d.a) * d.len / 2, d.y + Math.sin(d.a) * d.len / 2); ctx.stroke();
    }
    if (ship && ship.alive) {
      const x = ship.x + Math.round((camX - ship.x) / WW) * WW;
      drawShip({ ...ship, x });
    }
    drawHud();
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  // a stage behind the title screen
  buildTerrain(); ship = newShip(); ship.y = 120; camX = ship.x;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sotterranei del Mago</title>
<style>
  :root {
    --bg: #06061a;
    --fg: #f4f6ee;
    --muted: #a8a8d8;
    --pink: #ffd23a;
    --yellow: #3a5aff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a1a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk the dungeon; FUOCO shoots where the warrior looks */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 90, 74, 0.9); background: rgba(255, 90, 74, 0.22); }
  #touch .jump.on { background: rgba(255, 90, 74, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 6, 26, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #1a1a6a, 0 0 22px rgba(255,200,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1a04; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the dungeon: 11 x 6 cells, mirrored left to right, with a door on each side of the third row
  const CW = 11, CH = 6, C = 40, MX = 100, MY = TOP + 12, DOOR_Y = 2;
  const PSPEED = 3.2, SHOT_V = 11, HIT = 0.42;
  const KINDS = {
    burwor: { v: 1.3, pts: 100, chase: 0.45, fire: 0.2, col: "#3a8aff", name: "UN BURWOR" },
    garwor: { v: 1.7, pts: 200, chase: 0.65, fire: 0.4, col: "#ffd23a", name: "UN GARWOR" },
    thorwor: { v: 2.1, pts: 500, chase: 0.8, fire: 0.55, col: "#ff4a3a", name: "UN THORWOR" },
    worluk: { v: 3.4, pts: 1000, chase: 0, fire: 0, col: "#ff9ae8", name: "IL WORLUK" },
    mago: { v: 0, pts: 2500, chase: 0, fire: 1.4, col: "#b87aff", name: "IL MAGO" },
  };
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · mostri lenti che sparano poco", lives: 5, speed: 0.7, fire: 0.5 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "3 vite", lives: 3, speed: 1, fire: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · mostri svelti e più spari", lives: 3, speed: 1.15, fire: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "mago-difficulty";
  const bestKey = (id) => `mago-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0, beatT = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1200, 0.08, "sawtooth", 0.02, -700)),
    eshot: lim(() => beep(500, 0.1, "square", 0.02, -250)),
    kill: lim(() => { noise(0.15, 0.1, 900); beep(600, 0.15, "square", 0.03, -400); }),
    door: lim(() => beep(220, 0.2, "triangle", 0.03, 220)),
    appear: lim(() => arp([196, 262, 330], 0.06, 0.1, "sawtooth", 0.03)),
    worluk: () => { for (let i = 0; i < 6; i++) beep(880 - i * 60, 0.1, "square", 0.03, 0, i * 0.08); },
    mago: () => { for (let i = 0; i < 4; i++) beep(130 + i * 40, 0.4, "sawtooth", 0.035, 60, i * 0.12); },
    beat: () => beep(110, 0.06, "square", 0.025),
    die: () => { noise(0.6, 0.18, 400); arp([523, 415, 330, 262, 196], 0.1, 0.16, "sawtooth", 0.045); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.15),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 20000;
  let wr = [], wd = [], P = null, mons = [], shot = null, eshots = [], parts = [], popups = [], message = null;
  let doorT = 0, levelT = 0, phase = "mostri", spawnQ = [], lastBy = "", dist = null, distT = 0, magoDone = false;
  let firePressed = false, fireHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The dungeon ----------
  function buildDungeon() {
    wr = Array.from({ length: CH }, () => new Array(CW).fill(true));
    wd = Array.from({ length: CH }, () => new Array(CW).fill(true));
    const HALF = 6, seen = Array.from({ length: CH }, () => new Array(HALF).fill(false));
    const stack = [[0, CH - 1]]; seen[CH - 1][0] = true;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const opts = DIRS.map(([dx, dy]) => [x + dx, y + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < HALF && ny < CH && !seen[ny][nx]);
      if (!opts.length) { stack.pop(); continue; }
      const [nx, ny, dx, dy] = pick(opts);
      if (dx === 1) wr[y][x] = false; else if (dx === -1) wr[y][nx] = false; else if (dy === 1) wd[y][x] = false; else wd[ny][x] = false;
      seen[ny][nx] = true; stack.push([nx, ny]);
    }
    // open it up: the old dungeons are full of loops
    for (let y = 0; y < CH; y++) for (let x = 0; x < HALF; x++) {
      if (x < HALF - 1 && Math.random() < 0.15) wr[y][x] = false;
      if (y < CH - 1 && Math.random() < 0.15) wd[y][x] = false;
    }
    // the middle column joins the two halves
    for (let y = 0; y < CH; y++) if (Math.random() < 0.5) wr[y][HALF - 2] = false;
    // mirror
    for (let y = 0; y < CH; y++) {
      for (let x = 0; x <= 4; x++) wr[y][9 - x] = wr[y][x];
      for (let x = 0; x <= 4; x++) wd[y][10 - x] = wd[y][x];
    }
    for (let x = 0; x < CW; x++) wd[CH - 1][x] = true;
    // no dead ends with three walls next to the starting corners
    wr[CH - 1][0] = false; wr[CH - 1][9] = false;
  }
  const wallBetween = (x, y, dx, dy) => {
    if (dx === 1) return x >= CW - 1 ? !(y === DOOR_Y) : wr[y][x];
    if (dx === -1) return x <= 0 ? !(y === DOOR_Y) : wr[y][x - 1];
    if (dy === 1) return y >= CH - 1 || wd[y][x];
    return y <= 0 || wd[y - 1][x];
  };
  // can a body go from cell (x, y) towards (dx, dy)? the side doors only while they are open
  function canGo(x, y, dx, dy, who) {
    if (wallBetween(x, y, dx, dy)) return false;
    const nx = x + dx;
    if ((nx < 0 || nx >= CW) && (doorT > 0 || who === "mago")) return false;
    return true;
  }
  function computeDist() {
    dist = Array.from({ length: CH }, () => new Array(CW).fill(99));
    const sx = clamp(Math.floor(P.x), 0, CW - 1), sy = clamp(Math.floor(P.y), 0, CH - 1), q = [[sx, sy]]; dist[sy][sx] = 0;
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const [dx, dy] of DIRS) { if (wallBetween(x, y, dx, dy)) continue; const nx = (x + dx + CW) % CW, ny = y + dy; if (dist[ny][nx] === 99) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); } }
    }
  }
  // first step of the shortest way to a door cell
  function doorStep(sx, sy) {
    const prev = new Map([[sy * 100 + sx, null]]), q = [[sx, sy]];
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      if ((x === 0 || x === CW - 1) && y === DOOR_Y && i > 0) { let k = y * 100 + x, f = k; while (prev.get(k) !== null) { f = k; k = prev.get(k); } return [(f % 100) - sx, Math.floor(f / 100) - sy]; }
      for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (nx < 0 || nx >= CW || wallBetween(x, y, dx, dy) || prev.has(ny * 100 + nx)) continue; prev.set(ny * 100 + nx, y * 100 + x); q.push([nx, ny]); }
    }
    return null;
  }
  function lineOfSight(ax, ay, bx, by) {
    // same row or column with no wall between
    const x0 = Math.floor(ax), y0 = Math.floor(ay), x1 = Math.floor(bx), y1 = Math.floor(by);
    if (y0 === y1 && Math.abs(ay - by) < 0.3) { const d = Math.sign(x1 - x0); for (let x = x0; x !== x1; x += d) if (wallBetween(x, y0, d, 0)) return 0; return d ? [d, 0] : 0; }
    if (x0 === x1 && Math.abs(ax - bx) < 0.3) { const d = Math.sign(y1 - y0); for (let y = y0; y !== y1; y += d) if (wallBetween(x0, y, 0, d)) return 0; return d ? [0, d] : 0; }
    return 0;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildDungeon();
    mons = []; eshots = []; shot = null; parts = []; popups = []; doorT = 0; levelT = 0; phase = "mostri"; magoDone = false;
    spawnPlayer();
    for (let i = 0; i < 6; i++) { spawnMonster("burwor"); mons[mons.length - 1].pop = 2; }
    // as the burwors fall the meaner ones come out
    spawnQ = [];
    const ng = Math.min(4, 1 + Math.floor(level / 2)), nt = Math.min(3, Math.floor((level + 1) / 2));
    for (let i = 0; i < ng; i++) spawnQ.push("garwor");
    for (let i = 0; i < nt; i++) spawnQ.push("thorwor");
    message = { text: `SOTTERRANEO ${level}`, sub: level === 1 ? "elimina tutti i mostri: il radar li vede anche invisibili" : "", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function spawnPlayer() {
    P = { x: 0.5, y: CH - 0.5, dx: 0, dy: 0, face: [1, 0], safe: 2, step: 0 };
    computeDist();
  }
  function spawnMonster(kind) {
    // somewhere far from the warrior
    let best = null;
    for (let i = 0; i < 30; i++) { const x = Math.floor(rnd(0, CW)), y = Math.floor(rnd(0, CH)); const d = P ? Math.abs(x - P.x) + Math.abs(y - P.y) : 9; if (d >= 5) { best = [x, y]; break; } }
    if (!best) best = [CW - 1, 0];
    mons.push({ kind, x: best[0] + 0.5, y: best[1] + 0.5, dx: 0, dy: 0, cd: rnd(2, 4), inv: false, invT: rnd(2, 5), pop: 0.6, anim: rnd(0, 6), t: 0 });
    if (kind !== "burwor") sfx.appear();
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 70, text: "GUERRIERO EXTRA!", color: "#ffd23a", t: 0, screen: true }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  const px = (x) => MX + x * C, py = (y) => MY + y * C;
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play" || P.safe > 0) return;
    lives--; lastBy = by; sfx.die();
    burst(px(P.x), py(P.y), "#ffd23a", 18, 120, 0.7);
    state = "dead"; stateT = 1.8;
  }
  function levelDone() {
    const b = 1000 * level; addScore(b);
    message = { text: "SOTTERRANEO RIPULITO!", sub: `+${b.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear(); state = "clear"; stateT = 2.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · sotterraneo ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];

    ctx.fillStyle = "#c8a83a"; ctx.fillRect(-5, 3, 4, 8 + leg); ctx.fillRect(1, 3, 4, 8 - leg);
    ctx.fillStyle = "#ffd23a"; ctx.fillRect(-7, -6, 14, 11);
    ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.arc(0, -10, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a3a"; ctx.fillRect(-4, -11, 8, 2);
    // the blaster points where he looks
    ctx.strokeStyle = "#7ae4ff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx * 4, fy * 4 - 1); ctx.lineTo(fx * 14, fy * 14 - 1); ctx.stroke();
    ctx.restore();
  }
  function drawRadar() {
    const s = 7, rw = CW * s, rh = CH * s, rx = W / 2 - rw / 2, ry = H - rh - 12;
    ctx.fillStyle = "#0a0a24"; ctx.fillRect(rx - 3, ry - 3, rw + 6, rh + 6);
    ctx.strokeStyle = "#3a5aff"; ctx.lineWidth = 1; ctx.strokeRect(rx - 3.5, ry - 3.5, rw + 7, rh + 7);
    ctx.fillStyle = "#8aa8ff"; ctx.font = "800 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("RADAR", W / 2, ry - 6);
    for (const m of mons) { if (m.pop > 0) continue; ctx.fillStyle = KINDS[m.kind].col; ctx.fillRect(rx + m.x * s - 2.5, ry + m.y * s - 2.5, 5, 5); }
    ctx.fillStyle = Math.floor(clock * 6) % 2 ? "#ffffff" : "#ffd23a"; ctx.fillRect(rx + P.x * s - 2, ry + P.y * s - 2, 4, 4);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(6,6,26,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#a8a8d8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffd23a"; ctx.font = "900 10px system-ui"; ctx.fillText(`SOTTERRANEO ${level}`, x0 + 80, 21);
    ctx.fillStyle = "#a8a8d8"; ctx.font = "800 9px system-ui"; ctx.fillText(phase === "mostri" ? `mostri rimasti ${mons.length + spawnQ.length}` : phase === "worluk" ? "WORLUK!" : "IL MAGO!", x0 + 190, 14);
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const cx = lx - i * 14; ctx.fillStyle = "#ffd23a"; ctx.fillRect(cx - 4, 12, 8, 8); ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.arc(cx, 9, 4, 0, TAU); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!wr.length) { buildDungeon(); P = { x: 0.5, y: CH - 0.5, dx: 0, dy: 0, face: [1, 0], safe: 0, step: 0 }; for (const [k, x, y] of [["burwor", 3.5, 1.5], ["garwor", 7.5, 3.5], ["thorwor", 9.5, 0.5], ["burwor", 5.5, 4.5]]) mons.push({ kind: k, x, y, dx: 1, dy: 0, inv: false, pop: 0, anim: 0 }); }
    drawMaze();
    for (const m of mons) drawMonster(m);
    if (shot) { ctx.fillStyle = "#7ae4ff"; ctx.fillRect(px(shot.x) - (shot.dx ? 7 : 1.5), py(shot.y) - (shot.dy ? 7 : 1.5), shot.dx ? 14 : 3, shot.dy ? 14 : 3); }
    for (const e of eshots) { ctx.fillStyle = "#ff5a3a"; ctx.beginPath(); ctx.arc(px(e.x), py(e.y), 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffd8a0"; ctx.beginPath(); ctx.arc(px(e.x), py(e.y), 1.5, 0, TAU); ctx.fill(); }
    if (state !== "menu" && !(state === "dead" && Math.floor(clock * 6) % 2 === 0)) drawWarrior();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#06061a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawRadar();
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 130, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#06061a"; ctx.strokeText(message.text, W / 2, 157); ctx.fillText(message.text, W / 2, 157);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(message.sub, W / 2, 176); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 16px system-ui"; ctx.fillStyle = "#ff5a5a"; ctx.lineWidth = 4; ctx.strokeStyle = "#06061a";
      const t = `COLPITO DA ${lastBy}!`;
      ctx.strokeText(t, W / 2, 210); ctx.fillText(t, W / 2, 210);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="mago-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mostro in Città</title>
<style>
  :root {
    --bg: #080a14;
    --fg: #f2f6e8;
    --muted: #a8b0a0;
    --green: #7dd83a;
    --gold: #ffd34d;
    --red: #ff4a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #22283a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 246, 232, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to walk and climb, punch and jump buttons */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(125, 216, 58, 0.6); background: radial-gradient(circle, rgba(125,216,58,0.16), rgba(125,216,58,0.05)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(125, 216, 58, 0.5); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(242,246,232,0.25); pointer-events: none; }
  #touch .btns { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  #touch .btns button { border-radius: 50%; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; line-height: 1.2; }
  #touch .jump { width: 70px; height: 70px; margin-bottom: 40px; border: 2px solid rgba(90, 200, 255, 0.9); background: rgba(90, 200, 255, 0.18); }
  #touch .punch { width: 92px; height: 92px; border: 2px solid rgba(255, 74, 74, 0.9); background: rgba(255, 74, 74, 0.2); }
  #touch .punch b { display: block; font-size: 20px; }
  #touch .btns button.on { background: rgba(242, 246, 232, 0.45); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .punch { width: 76px; height: 76px; }
  #touch.small .jump { width: 60px; height: 60px; margin-bottom: 30px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(8, 10, 20, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 9.5vw, 60px); font-weight: 900; letter-spacing: 1px; color: var(--green); text-shadow: 0 3px 0 #2a5a0a, 0 0 22px rgba(125,216,58,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,246,232,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--green); color: #102a00; background: var(--green); padding: 11px 30px; box-shadow: 0 4px 0 #2a5a0a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="jump" aria-label="Salta">SALTA</button>
    <button type="button" class="punch" aria-label="Pugno"><b>👊</b>PUGNO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 480, H = 320, HUD = 24, GROUND = 292, FLH = 26, COLW = 24, TAU = Math.PI * 2;
  const BRICKS = ["#8a4a3a", "#5a6a8a", "#7a6a4a", "#4a6a5a", "#8a5a6a", "#6a5a8a"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · i militari fanno meno danni e sono meno", lives: 5, dmg: 0.6, army: 0.7 },
    normale:   { label: "NORMALE",   color: "#7dd83a", desc: "3 vite · l'esperienza classica", lives: 3, dmg: 1, army: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a4a", desc: "3 vite · esercito numeroso e agguerrito", lives: 3, dmg: 1.3, army: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "mostro-difficulty";
  const bestKey = (id) => `mostro-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    punch: lim(() => noise(0.08, 0.2, 900)),
    smash: lim(() => { noise(0.2, 0.3, 2500); beep(1800, 0.05, "square", 0.02, -900); }),
    crack: lim(() => { noise(0.1, 0.25, 3500); }),
    chomp: lim(() => arp([300, 200, 300, 150], 0.05, 0.06, "square", 0.04)),
    yum: lim(() => arp([523, 659, 784], 0.05, 0.08, "triangle", 0.05)),
    shot: lim(() => noise(0.05, 0.12, 4000)),
    boom: lim(() => { noise(0.4, 0.35, 700); beep(100, 0.3, "sawtooth", 0.04, -50); }),
    hurt: lim(() => beep(180, 0.12, "sawtooth", 0.035, -80)),
    collapse: () => { noise(1.6, 0.45, 300); beep(60, 1.2, "sawtooth", 0.05, -20); },
    roar: () => { beep(140, 0.6, "sawtooth", 0.05, -60); noise(0.6, 0.2, 500); },
    jump: lim(() => beep(200, 0.15, "triangle", 0.04, 200)),
    clear: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.1, 0.15),
    die: () => arp([392, 330, 262, 196, 147], 0.14, 0.2, "sawtooth", 0.04),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 30000;
  let M = null, buildings = [], soldiers = [], goodies = [], tanks = [], helis = [], bullets = [], parts = [], popups = [], message = null, shake = 0;
  let soldierT = 0, tankT = 0, heliT = 0, goodieT = 0, levelT = 0, stars = [];
  const ctl = { up: false, down: false, left: false, right: false };
  let punchPressed = false, jumpPressed = false;
  for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * W, y: rnd(HUD, 140), s: Math.random() });

  const roofY = (b) => GROUND - b.floors * FLH + b.sink;
  const cellRect = (b, r, c) => ({ x: b.x + 6 + c * COLW, y: roofY(b) + r * FLH + 5, w: 16, h: 16 });

  // ---------- City ----------
  function buildLevel() {
    buildings = [];
    const n = Math.min(5, 3 + Math.floor(level / 2));
    const widths = Array.from({ length: n }, () => (Math.random() < 0.5 ? 3 : 4) * COLW + 8);
    const total = widths.reduce((s, w) => s + w, 0), gap = (W - 40 - total) / (n + 1);
    let x = 20 + gap;
    for (let i = 0; i < n; i++) {
      const cols = (widths[i] - 8) / COLW, floors = Math.min(9, 5 + Math.floor(Math.random() * 3) + Math.floor(level / 2));
      const cells = Array.from({ length: floors }, () => new Array(cols).fill(2));
      buildings.push({ x, w: widths[i], cols, floors, cells, col: BRICKS[(i + level) % BRICKS.length], sink: 0, falling: false, done: false, lit: cells.map((row) => row.map(() => Math.random() < 0.6)) });
      x += widths[i] + gap;
    }
    soldiers = []; goodies = []; tanks = []; helis = []; bullets = [];
    soldierT = 2; tankT = 6 / diff.army; heliT = 10 / diff.army; goodieT = 4; levelT = 0;
    M = { x: 12, y: GROUND, vy: 0, st: "ground", face: 1, hp: 100, punchT: 0, b: null, inv: 1.5, t: 0, hurtT: 0 };
    message = { text: `GIORNO ${level + 1}`, sub: `Rasa al suolo ${buildings.length} palazzi!`, t: 0 };
    state = "intro"; stateT = 1.8;
    sfx.roar();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f2f6e8") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife += 40000; if (lives < 9) lives++; sfx.life();
      popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 10, sp = 110, life = 0.5, grav = 250) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random()), c: color, g: grav });
    }
  }
  function hurt(d) {
    if (state !== "play" || M.inv > 0) return;
    M.hp -= d * diff.dmg; M.hurtT = 0.2; sfx.hurt();
    if (M.hp <= 0) {
      M.hp = 0; lives--; sfx.die();
      message = { text: "IL MOSTRO È SFINITO!", sub: lives > 0 ? "Torna più arrabbiato di prima" : "", t: 0 };
      M.st = "dead"; M.deadT = 0;
      state = "dead"; stateT = 2.6;
    }
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    bullets = []; helis = helis.filter((h) => Math.abs(h.x - M.x) > 160); tanks = tanks.filter((t) => Math.abs(t.x - M.x) > 160);
    M = { x: M.x < W / 2 ? 12 : W - 12, y: GROUND, vy: 0, st: "ground", face: M.x < W / 2 ? 1 : -1, hp: 100, punchT: 0, b: null, inv: 2, t: 0, hurtT: 0 };
    state = "play"; sfx.roar();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Giorno ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>MOSTRO IN CITTÀ</h1>
       <p>Sei Lucertolone, una lucertola alta come un palazzo, e oggi sei di pessimo umore. Arrampicati sui grattacieli e prendili a pugni finché crollano! Soldati, carri armati ed elicotteri ti fanno male: mangia soldati e cibo dalle finestre per recuperare energia.</p>
       <div class="pts">
         <span><b>Finestra</b></span><span>crepa 10 · sfondata 50</span>
         <span><b>Palazzo crollato</b></span><span>100 per piano</span>
         <span><b>Soldato · cibo</b></span><span>200 · 100, e ti rimettono in forze</span>
         <span><b>Carro · elicottero</b></span><span>500 a pugni (o saltando sul carro)</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per camminare e per arrampicarti (▲ sulla facciata) · PUGNO · SALTA</p>`
         : `<p class="muted help">Frecce: cammina, ↑ arrampicati sulla facciata, ↓ scendi · Z pugno · X o SPAZIO salta · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DISTRUGGI!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (k === "z" && !e.repeat) punchPressed = true;
    if ((k === "x" || k === " ") && !e.repeat) jumpPressed = true;
    const a = KEYS[k]; if (a) ctl[a] = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const [sel, fn] of [[".punch", () => { punchPressed = true; }], [".jump", () => { jumpPressed = true; }]]) {
    const btn = touchEl.querySelector(sel);
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.classList.add("on"); fn(); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, () => btn.classList.remove("on"));
  }
  // thumb stick in eight directions: climbing can go diagonally across a facade
  const stick = touchEl.querySelector(".stick"), knob = stick.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stick.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const on = len > max * 0.3;

    ctx.restore();
  }
  function drawHeli(h) {
    ctx.save(); ctx.translate(h.x, h.y); ctx.scale(h.x < M.x ? 1 : -1, 1);
    if (h.dead) ctx.rotate(h.t * 6);
    ctx.fillStyle = "#6a6a5a"; ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, 0, 0, TAU); ctx.fill();
    ctx.fillRect(-20, -2, 12, 3); ctx.fillRect(-22, -6, 3, 8);
    ctx.fillStyle = "#9ad0ff"; ctx.beginPath(); ctx.ellipse(5, -1, 4, 3.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#222"; ctx.lineWidth = 1.5; const r = Math.cos(clock * 40) * 14;
    ctx.beginPath(); ctx.moveTo(-r, -8); ctx.lineTo(r, -8); ctx.moveTo(0, -6); ctx.lineTo(0, -8); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.fillRect(-6, 6, 12, 1.5);
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const sh = shake > 0 ? shake * 6 : 0;
    ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
    // night sky, moon and a far skyline
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, "#0a0a24"); g.addColorStop(1, "#3a2a4a");
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
    for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.3 + s.s * 0.6})`; ctx.fillRect(s.x, s.y, 1.2, 1.2); }
    ctx.fillStyle = "#fff8d0"; ctx.beginPath(); ctx.arc(420, 58, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a30";
    for (let i = 0; i < 16; i++) { const x = i * 32, h = 40 + ((i * 37) % 50); ctx.fillRect(x, GROUND - h, 28, h); }
    // street
    ctx.fillStyle = "#2a2a30"; ctx.fillRect(-10, GROUND, W + 20, H - GROUND + 10);
    ctx.fillStyle = "#ffd34d"; for (let x = 0; x < W; x += 30) ctx.fillRect(x, GROUND + 14, 14, 2);
    if (state === "menu" || !M) return;
    for (const b of buildings) drawBuilding(b);
    for (const s of soldiers) drawSoldier(s);
    for (const gd of goodies) drawGoodie(gd);
    for (const t of tanks) drawTank(t);
    drawMonster();
    for (const h of helis) drawHeli(h);
    for (const b of bullets) { ctx.fillStyle = b.shell ? "#ffa04a" : "#ffe89a"; ctx.beginPath(); ctx.arc(b.x, b.y, b.shell ? 3 : 1.8, 0, TAU); ctx.fill(); }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 20px system-ui, sans-serif" : "900 10px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    // status bar with the monster's energy
    ctx.fillStyle = "#080a14"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f2f6e8";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    const sw = ctx.measureText(score.toLocaleString("it-IT")).width;
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#a8b0a0";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8 + Math.max(58, sw + 10), 12);
    const bx = 168, bw = 110;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 7, bw, 10);
    ctx.fillStyle = M.hp < 30 ? (Math.floor(clock * 4) % 2 ? "#ff4a4a" : "#ffd34d") : "#7dd83a"; ctx.fillRect(bx, 7, bw * M.hp / 100, 10);
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.strokeRect(bx + 0.5, 7.5, bw - 1, 9);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 5); i++) { ctx.fillStyle = "#5aa82a"; ctx.beginPath(); ctx.arc(bx + bw + 14 + i * 11, 12, 4, 0, TAU); ctx.fill(); }
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillStyle = "#7dd83a";
    ctx.fillText(`GIORNO ${level + 1} · PALAZZI ${buildings.filter((b) => !b.falling).length}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(8,10,20,0.82)"; ctx.fillRect(0, 58, W, message.sub ? 50 : 34);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#7dd83a";
      ctx.fillText(message.text, W / 2, 82);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2f6e8"; ctx.fillText(message.sub, W / 2, 100); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="mostro-best-" data-kind="score"></script>
</body>

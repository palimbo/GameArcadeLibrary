<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Elisoccorso</title>
<style>
  :root {
    --bg: #0c0a14;
    --fg: #f4ede2;
    --muted: #b4a8a0;
    --orange: #ffab40;
    --gold: #ffd84a;
    --red: #ff4a3a;
    --green: #7de0a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2238, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 237, 226, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to fly in every direction, a missile and a bomb button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 171, 64, 0.55); background: radial-gradient(circle, rgba(255,171,64,0.14), rgba(255,171,64,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 171, 64, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,237,226,0.25); pointer-events: none; }
  #touch .btns { display: flex; gap: 10px; align-items: flex-end; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .bomb { width: 76px; height: 76px; border: 2px solid rgba(255, 216, 74, 0.9); background: rgba(255, 216, 74, 0.18); margin-bottom: 40px; }
  #touch .fire { width: 90px; height: 90px; border: 2px solid rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.2); }
  #touch .btns button.on { background: rgba(255, 216, 74, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .bomb { width: 62px; height: 62px; font-size: 10px; margin-bottom: 30px; }
  #touch.small .fire { width: 74px; height: 74px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 10, 20, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 2px; color: var(--orange); text-shadow: 0 3px 0 #6a3a10, 0 0 22px rgba(255,171,64,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,237,226,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--orange); color: #2a1400; background: var(--orange); padding: 11px 30px; box-shadow: 0 4px 0 #6a3a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="bomb" aria-label="Bomba">BOMBA</button>
    <button type="button" class="fire" aria-label="Missile">MISSILE</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, HUD = 32, TAU = Math.PI * 2;
  const WORLD = 3600, GROUND = 326, TOP = HUD + 18;
  const LAND_Y = GROUND - 11;          // the helicopter's centre when its skids touch the sand
  const BASE_ZONE = 360, BASE_DOOR = 86, PAD_X = 200, BORDER = 720, TANK_MIN = 780;
  const CAP = 16;                       // seats on board

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7de0a0", desc: "4 elicotteri da 4 colpi · nemici lenti e imprecisi", helis: 4, armor: 4, fire: 0.6, speed: 0.8, spread: 1.6, tanks: 0.7, jet: 0.7 },
    normale:   { label: "NORMALE",   color: "#ffab40", desc: "3 elicotteri da 3 colpi · l'esperienza classica", helis: 3, armor: 3, fire: 1, speed: 1, spread: 1, tanks: 1, jet: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 elicotteri da 2 colpi · fuoco fitto e caccia frequenti", helis: 3, armor: 2, fire: 1.35, speed: 1.15, spread: 0.7, tanks: 1.3, jet: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "elisoccorso-difficulty";
  const bestKey = (id) => `elisoccorso-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    missile: lim(() => { noise(0.1, 0.06, 2500); beep(900, 0.1, "sawtooth", 0.015, -500); }),
    bomb: lim(() => beep(700, 0.35, "sine", 0.025, -500)),
    boom: lim(() => { noise(0.4, 0.22, 700); beep(90, 0.3, "square", 0.04, -50); }),
    small: lim(() => noise(0.15, 0.1, 1200)),
    shell: lim(() => { noise(0.08, 0.08, 500); beep(160, 0.08, "square", 0.02, -60); }),
    hit: lim(() => { noise(0.2, 0.2, 1800); beep(300, 0.15, "square", 0.04, -200); }),
    door: lim(() => arp([392, 523], 0.07, 0.1, "square", 0.03)),
    board: lim(() => beep(1047, 0.06, "square", 0.025)),
    rescue: lim(() => arp([784, 1047], 0.06, 0.08, "square", 0.03)),
    lost: lim(() => beep(260, 0.25, "triangle", 0.04, -120)),
    land: lim(() => noise(0.12, 0.08, 300)),
    jet: lim(() => { noise(0.9, 0.06, 900); }),
    alarm: () => arp([880, 660, 880, 660], 0.14, 0.12, "square", 0.03),
    warn: lim(() => arp([1320, 990, 1320], 0.09, 0.08, "sawtooth", 0.018)),
    crash: () => { noise(0.9, 0.3, 600); arp([392, 330, 262, 196, 131], 0.12, 0.18, "triangle", 0.05); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    start: () => arp([392, 523, 659, 784, 659, 784], 0.1, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- Scenery (built once) ----------
  const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  const MOUNT = [], DUNE = [];
  for (let i = 0; i <= 200; i++) {
    const x = i * 12;
    MOUNT.push(210 + 26 * Math.sin(x * 0.011) + 18 * Math.sin(x * 0.027 + 1.3) + 9 * Math.sin(x * 0.07 + 2));
    DUNE.push(282 + 10 * Math.sin(x * 0.017 + 0.4) + 6 * Math.sin(x * 0.041 + 1.1));
  }
  const STARS = Array.from({ length: 50 }, (_, i) => ({ x: hash(i + 1) * W * 1.6, y: HUD + hash(i + 50) * 150, r: hash(i + 99) < 0.2 ? 1.4 : 0.8 }));

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, mission = 0, bestCache = 0, nextLife = 25000;
  let heli = null, cam = 0, aboard = 0, unloadT = 0;
  let barracks = [], hostages = [], tanks = [], jets = [], drones = [];
  let missiles = [], bombs = [], shells = [], parts = [], blasts = [], popups = [], message = null;
  let tankT = 0, jetT = 0, droneT = 0, jetsOn = false, missionT = 0;
  let rescued = 0, lost = 0, mRescued = 0, mLost = 0, mTotal = 0, totalRescued = 0, totalLost = 0;
  let fireHeld = false, bombPressed = false, fireCool = 0, bombCool = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const tough = () => 1 + Math.min(1, mission * 0.12);

  // ---------- Mission ----------
  function buildMission() {
    const n = Math.min(5, 3 + mission);
    const per = 8 + Math.min(4, mission);
    barracks = [];
    for (let i = 0; i < n; i++) {
      const x = Math.round(1100 + (i + 0.5) * ((WORLD - 1250) / n) + rnd(-60, 60));
      barracks.push({ x, inside: per, open: false, releaseT: 0, smoke: 0 });
    }
    mTotal = n * per; mRescued = 0; mLost = 0;
    hostages = []; tanks = []; jets = []; drones = [];
    missiles = []; bombs = []; shells = []; parts = []; blasts = []; popups = [];
    aboard = 0; unloadT = 0; jetsOn = false; missionT = 0;
    tankT = 3; jetT = rnd(10, 14) / diff.jet; droneT = rnd(12, 18);
    // a first patrol waits near the camp
    const first = Math.max(1, Math.round((1 + mission * 0.5) * diff.tanks));
    for (let i = 0; i < first; i++) addTank(barracks[Math.floor(rnd(0, n))].x + rnd(-120, 120));
    newHeli();
  }
  function newHeli() {
    heli = { x: PAD_X, y: LAND_Y, vx: 0, vy: 0, face: 1, landed: true, armor: diff.armor, inv: 2, rotor: 0, hurtT: 0 };
    cam = 0;
  }
  const tankCap = () => Math.min(7, Math.round((2 + mission * 0.7) * diff.tanks));
  function addTank(x) {
    x = clamp(x, TANK_MIN, WORLD - 30);
    tanks.push({ x, face: -1, fireT: rnd(1.5, 3), off: rnd(90, 210), side: Math.random() < 0.5 ? -1 : 1, sideT: rnd(4, 8), aim: -Math.PI / 2, tread: 0 });
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.helis; mission = 0; nextLife = 25000;
    totalRescued = 0; totalLost = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginMission();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMission() {
    buildMission();
    message = { text: `MISSIONE ${mission + 1}`, sub: `${barracks.length} baracche · ${mTotal} prigionieri da salvare`, t: 0 };
    state = "intro"; stateT = 2.2;
  }
  function addScore(n, x, y, color = "#f4ede2") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife += 25000;
      if (lives < 9) lives++;
      sfx.clear();
      popups.push({ x: heli.x, y: heli.y - 30, text: "ELICOTTERO EXTRA", color: "#ffd84a", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 10, sp = 90, life = 0.45, grav = 0) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color, g: grav });
    }
  }
  function killHostage(h, why) {
    if (h.dead) return;
    h.dead = true; lost++; mLost++; totalLost++;
    burst(h.x, GROUND - 5, "#f4ede2", 6, 50, 0.5, 200);
    popups.push({ x: h.x, y: GROUND - 22, text: why, color: "#ff4a3a", t: 0 });
    sfx.lost();
  }
  // an explosion on the ground: tanks, prisoners and closed barracks nearby all feel it
  function groundBlast(x, r, fromPlayer) {
    blasts.push({ x, y: GROUND - 4, r, t: 0 });
    for (const h of hostages) if (!h.dead && h.s !== "home" && Math.abs(h.x - x) < r) killHostage(h, fromPlayer ? "COLPITO!" : "PERSO");
    if (fromPlayer) {
      for (const t of tanks) if (!t.dead && Math.abs(t.x - x) < r + 17) destroyTank(t);
      for (const b of barracks) if (!b.open && Math.abs(b.x - x) < r + 30) openBarrack(b);
    }
  }
  function openBarrack(b) {
    if (b.open) return;
    b.open = true; b.releaseT = 0.4; b.smoke = 3;
    burst(b.x, GROUND - 20, "#c8a070", 16, 110, 0.7, 250);
    sfx.door();
    popups.push({ x: b.x, y: GROUND - 50, text: "LIBERI!", color: "#7de0a0", t: 0 });
  }
  function destroyTank(t) {
    if (t.dead) return;
    t.dead = true;
    burst(t.x, GROUND - 10, "#ffab40", 22, 150, 0.7, 150);
    burst(t.x, GROUND - 10, "#3a3a3a", 12, 70, 1.1, -20);
    sfx.boom();
    addScore(100, t.x, GROUND - 30, "#ffab40");
  }
  function hurtHeli() {
    if (heli.inv > 0 || state !== "play") return;
    heli.armor--; heli.inv = 1.1; heli.hurtT = 0.3;
    burst(heli.x, heli.y, "#ffd84a", 10, 120, 0.4);
    if (heli.armor <= 0) { crash(); return; }
    sfx.hit();
    if (heli.armor === 1) sfx.alarm();
  }
  function crash() {
    lives--;
    sfx.crash();
    burst(heli.x, heli.y, "#ffab40", 40, 200, 0.9, 200);
    burst(heli.x, heli.y, "#f4ede2", 18, 140, 1, 300);
    burst(heli.x, heli.y, "#333", 20, 80, 1.4, -30);
    // whoever was on board is lost with the helicopter
    if (aboard > 0) { lost += aboard; mLost += aboard; totalLost += aboard; }
    const who = aboard;
    aboard = 0;
    if (heli.y > GROUND - 50) groundBlast(heli.x, 30, false);
    message = { text: "ELICOTTERO ABBATTUTO", sub: (who ? `${who} prigionieri persi · ` : "") + (lives > 0 ? `Elicotteri rimasti: ${lives}` : "Nessun elicottero rimasto"), t: 0 };
    state = "dead"; stateT = 2.4;
  }
  function afterCrash() {
    if (lives <= 0) { gameOver(); return; }
    shells = []; jets = []; bombs = []; missiles = [];
    for (const d of drones) d.x = Math.max(d.x, BASE_ZONE + 300);
    newHeli();
    for (const h of hostages) if (h.s === "run") { h.s = "out"; h.hx = h.x; }
    state = "play";
  }
  function fieldLeft() {
    let n = aboard;
    for (const b of barracks) n += b.inside;
    for (const h of hostages) if (!h.dead) n++;
    return n;
  }
  function missionClear() {
    const bonus = mRescued * 50 + (mRescued === mTotal ? 3000 : 0);
    addScore(bonus);
    sfx.clear();
    message = { text: `MISSIONE ${mission + 1} COMPIUTA`, sub: `Salvati ${mRescued} su ${mTotal}${mRescued === mTotal ? " · TUTTI!" : ""} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    state = "clear"; stateT = 3.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, m = mission + 1, saved = totalRescued, gone = totalLost;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Missione ${m} · ${played}</p>
       <p class="muted">Prigionieri salvati: ${saved} · persi: ${gone}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }

  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");

  // ---------- Helicopter ----------

  function updateHeli(dt) {
    const h = heli;
    const ix = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);

  function touchdown() {

  // ---------- Prisoners ----------
  function updateHostages(dt) {

  // ---------- Enemies ----------
  function spawnSide() {

  function updateTanks(dt) {
    tankT -= dt;

    for (const t of tanks) {
      t.sideT -= dt;

  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (message) { message.t += dt; if (message.t > 2.6) message = null; }
    for (const p of parts) { p.t += dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.t < p.life);
    if (parts.length > 700) parts.splice(0, parts.length - 700);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < (p.big ? 1.6 : 1));

    }

    updateWeapons(dt);
    updateHostages(dt);
    updateTanks(dt);
    updateJets(dt);

    updateProjectiles(dt);

  }
  function followCam(dt) {
    const want = clamp(heli.x - W / 2 + heli.face * 90, 0, WORLD - W);
    cam += (want - cam) * Math.min(1, dt * 3);
    cam = clamp(cam, 0, WORLD - W);
  }

  // ---------- Drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, HUD, 0, GROUND);

    ctx.fillStyle = "#fff";

      if (x > W) continue;
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(clock * 2 + s.x);

    ctx.fillStyle = "#ffe8c0"; ctx.beginPath(); ctx.arc(W * 0.72 - cam * 0.02, HUD + 58, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a2a5a"; ctx.beginPath(); ctx.arc(W * 0.72 - cam * 0.02 + 7, HUD + 54, 14, 0, TAU); ctx.fill();

    for (const [arr, k, col] of [[MOUNT, 0.15, "#3a2240"], [DUNE, 0.45, "#7a4034"]]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);

        const wx = ((x + cam * k) % span + span) % span, i = Math.floor(wx / 12), f = (wx % 12) / 12;

  function drawGround() {

    ctx.fillStyle = "#e0b070"; ctx.fillRect(0, GROUND, W, 2);
    ctx.fillStyle = "rgba(90,50,20,0.5)";
    const from = Math.floor(cam / 23);
    for (let i = from; i < from + W / 23 + 2; i++) {
      const x = i * 23 - cam + hash(i) * 14, y = GROUND + 6 + hash(i + 7) * (H - GROUND - 10);
      ctx.fillRect(x, y, 2 + hash(i + 3) * 4, 1.5);
    }
  }
  function drawBase() {
    // hangar
    ctx.fillStyle = "#4a5260"; ctx.fillRect(20, GROUND - 46, 110, 46);
    ctx.fillStyle = "#5a6474"; ctx.beginPath(); ctx.moveTo(14, GROUND - 46); ctx.quadraticCurveTo(75, GROUND - 78, 136, GROUND - 46); ctx.fill();
    ctx.fillStyle = "#2a2e38"; ctx.fillRect(56, GROUND - 32, 30, 32);
    ctx.fillStyle = "#ffd84a"; ctx.fillRect(BASE_DOOR - 2, GROUND - 32, 4, 4);
    ctx.fillStyle = "#f4ede2"; ctx.font = "900 9px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("BASE", 75, GROUND - 52);
    // control tower with its beacon
    ctx.fillStyle = "#3a404c"; ctx.fillRect(142, GROUND - 70, 10, 70);
    ctx.fillStyle = "#5a6474"; ctx.fillRect(134, GROUND - 84, 26, 16);
    ctx.fillStyle = "#9ad0ff"; ctx.fillRect(137, GROUND - 81, 20, 7);
    ctx.fillStyle = Math.floor(clock * 2) % 2 ? "#ff4a3a" : "#5a1a1a"; ctx.beginPath(); ctx.arc(147, GROUND - 88, 3, 0, TAU); ctx.fill();
    // helipad
    ctx.fillStyle = "#3a3a3a"; ctx.beginPath(); ctx.ellipse(PAD_X, GROUND + 3, 42, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#ffd84a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(PAD_X, GROUND + 3, 36, 4.5, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#f4ede2"; ctx.font = "900 8px system-ui, sans-serif"; ctx.fillText("H", PAD_X, GROUND + 6);
    // windsock
    ctx.fillStyle = "#888"; ctx.fillRect(290, GROUND - 40, 2, 40);
    const flap = Math.sin(clock * 4) * 2;
    ctx.fillStyle = "#ff8a3a"; ctx.beginPath(); ctx.moveTo(292, GROUND - 40); ctx.lineTo(312, GROUND - 38 + flap); ctx.lineTo(312, GROUND - 34 + flap); ctx.lineTo(292, GROUND - 32); ctx.fill();

    ctx.strokeStyle = "#6a6a6a"; ctx.lineWidth = 1;
    for (let x = BORDER - 14; x <= BORDER + 14; x += 7) { ctx.fillStyle = "#555"; ctx.fillRect(x, GROUND - 26, 2, 26); }
    for (const y of [GROUND - 24, GROUND - 16, GROUND - 8]) { ctx.beginPath(); ctx.moveTo(BORDER - 16, y); ctx.lineTo(BORDER + 18, y); ctx.stroke(); }
    ctx.fillStyle = "#e8d8a8"; ctx.fillRect(BORDER - 22, GROUND - 44, 44, 12);
    ctx.fillStyle = "#6a2a1a"; ctx.font = "900 7px system-ui, sans-serif"; ctx.fillText("CONFINE", BORDER, GROUND - 35);
  }
  function drawBarrack(b) {
    const x = b.x;
    ctx.fillStyle = "#6a4a30"; ctx.fillRect(x - 30, GROUND - 32, 60, 32);
    ctx.fillStyle = "#4a3020"; ctx.beginPath(); ctx.moveTo(x - 36, GROUND - 32); ctx.lineTo(x, GROUND - 46); ctx.lineTo(x + 36, GROUND - 32); ctx.fill();
    for (let k = -24; k <= 24; k += 8) { ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fillRect(x + k, GROUND - 32, 1, 32); }

      ctx.fillStyle = "#3a2414"; ctx.fillRect(x - 8, GROUND - 22, 16, 22);
      ctx.fillStyle = "#aaa"; ctx.fillRect(x - 9, GROUND - 13, 18, 2);

      for (const wx of [x - 21, x + 13]) {
        ctx.fillStyle = "#1a1008"; ctx.fillRect(wx, GROUND - 26, 8, 8);
        if (Math.floor(clock * 1.5 + wx) % 3) { ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(wx + 4, GROUND - 22, 2.2, 0, TAU); ctx.fill(); }
        ctx.fillStyle = "#888"; ctx.fillRect(wx + 2, GROUND - 26, 1, 8); ctx.fillRect(wx + 5, GROUND - 26, 1, 8);
      }
      ctx.fillStyle = "#f4ede2"; ctx.font = "800 8px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(b.inside), x, GROUND - 50);
    } else {
      // the wall blown open
      ctx.fillStyle = "#1a1008"; ctx.beginPath(); ctx.moveTo(x - 14, GROUND); ctx.lineTo(x - 10, GROUND - 24); ctx.lineTo(x - 2, GROUND - 28); ctx.lineTo(x + 9, GROUND - 22); ctx.lineTo(x + 14, GROUND); ctx.fill();
      if (b.inside > 0) { ctx.fillStyle = "#f4ede2"; ctx.font = "800 8px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(String(b.inside), x, GROUND - 50); }
      if (b.smoke > 0 && Math.random() < 0.3) parts.push({ x: x + rnd(-10, 10), y: GROUND - 30, vx: rnd(-5, 5), vy: -25, t: 0, life: 1, c: "rgba(60,50,50,0.8)", g: 0 });
    }
  }
  function drawHostage(p) {
    const x = p.x, y = GROUND, leg = Math.sin(p.step) * 2;
    const moving = p.s === "run" || p.s === "home";
    ctx.strokeStyle = "#2a2a3a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x - (moving ? leg : 1.5), y); ctx.moveTo(x, y - 5); ctx.lineTo(x + (moving ? leg : 1.5), y); ctx.stroke();
    ctx.fillStyle = p.s === "home" ? "#7de0a0" : "#f4ede2"; ctx.fillRect(x - 2, y - 10, 4, 6);
    ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(x, y - 12, 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#e8b890"; ctx.lineWidth = 1.2; ctx.beginPath();
    if (p.wave) { const w = Math.sin(clock * 12 + x) * 2; ctx.moveTo(x - 2, y - 9); ctx.lineTo(x - 4, y - 14 + w); ctx.moveTo(x + 2, y - 9); ctx.lineTo(x + 4, y - 14 - w); }
    else { ctx.moveTo(x - 2, y - 9); ctx.lineTo(x - 3, y - 5); ctx.moveTo(x + 2, y - 9); ctx.lineTo(x + 3, y - 5); }
    ctx.stroke();
  }
  function drawTank(t) {
    ctx.save(); ctx.translate(t.x, GROUND);
    ctx.fillStyle = "#2a2a24"; ctx.beginPath(); ctx.roundRect(-18, -8, 36, 8, 4); ctx.fill();
    ctx.fillStyle = "#555"; for (let k = -14; k <= 14; k += 7) { ctx.beginPath(); ctx.arc(k + ((t.tread % 7) - 3.5) * 0, -4, 2.6, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#4a5a2a"; ctx.fillRect(-16, -15, 32, 7);
    ctx.fillStyle = "#5a6a34"; ctx.beginPath(); ctx.arc(0, -15, 8, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = "#3a4a20"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(Math.cos(t.aim) * 17, -18 + Math.sin(t.aim) * 17); ctx.stroke();
    ctx.restore();
  }
  function drawJet(j) {
    ctx.save(); ctx.translate(j.x, j.y); ctx.scale(j.dir, 1);
    ctx.fillStyle = "#8a94a4";
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(8, -4); ctx.lineTo(-16, -4); ctx.lineTo(-22, -11); ctx.lineTo(-26, -11); ctx.lineTo(-22, 3); ctx.lineTo(10, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5a6474"; ctx.beginPath(); ctx.moveTo(4, 1); ctx.lineTo(-12, 9); ctx.lineTo(-16, 9); ctx.lineTo(-8, 1); ctx.fill();
    ctx.fillStyle = "#9ad0ff"; ctx.beginPath(); ctx.ellipse(10, -4, 6, 2.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = Math.random() < 0.5 ? "#ffab40" : "#ffd84a"; ctx.beginPath(); ctx.moveTo(-24, -2); ctx.lineTo(-34 - Math.random() * 6, 0); ctx.lineTo(-24, 2); ctx.fill();
    ctx.restore();
  }
  function drawDrone(d) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.t * 2);
    ctx.strokeStyle = "#ff8a7a"; ctx.lineWidth = 1.5;
    for (let k = 0; k < 6; k++) { const a = k * TAU / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6); ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.stroke(); }
    ctx.fillStyle = "#7a2a2a"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = Math.floor(d.t * 4) % 2 ? "#ff4a3a" : "#ffd84a"; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawHeli(h) {
    ctx.save(); ctx.translate(h.x, h.y);
    const tilt = h.landed ? 0 : clamp(h.vx / 230, -1, 1) * 0.16;
    ctx.rotate(tilt);
    ctx.scale(h.face, 1);
    const hurt = h.hurtT > 0 && Math.floor(clock * 30) % 2;
    // tail boom and rotor
    ctx.fillStyle = hurt ? "#fff" : "#d8d8d8";
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-34, -3); ctx.lineTo(-34, 1); ctx.lineTo(-8, 3); ctx.fill();
    ctx.fillStyle = "#c83a2a"; ctx.fillRect(-36, -8, 4, 9);
    ctx.strokeStyle = "rgba(40,40,40,0.8)"; ctx.lineWidth = 1.5;

    ctx.fillStyle = hurt ? "#fff" : "#eeeae4";
    ctx.beginPath(); ctx.ellipse(2, 0, 17, 8.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#c83a2a"; ctx.fillRect(-12, 0, 26, 3);
    ctx.fillStyle = "#6ab0e0"; ctx.beginPath(); ctx.ellipse(11, -2, 7, 5, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();

    if (aboard > 0) { ctx.fillStyle = "#e8b890"; for (let k = 0; k < Math.min(3, Math.ceil(aboard / 5)); k++) { ctx.beginPath(); ctx.arc(-6 + k * 5, -3, 1.8, 0, TAU); ctx.fill(); } }

    ctx.fillStyle = "#444"; ctx.fillRect(0, -12, 3, 4);

  }
  function drawMinimap() {
    const y = 24, x0 = 8, w = W - 16, k = w / WORLD;

    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(x0 + cam * k, y - 1, W * k, 8);

    ctx.fillStyle = "#ffab40"; for (const j of jets) if (!(j.warn > 0)) ctx.fillRect(x0 + clamp(j.x, 0, WORLD) * k - 1, y, 3, 2);

  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0c0a14"; ctx.fillRect(0, 0, W, H);
    drawSky();
    drawGround();

      ctx.save(); ctx.translate(-Math.round(cam * 2) / 2, 0);
      if (cam < BORDER + 60) drawBase();
      for (const b of barracks) if (b.x > cam - 60 && b.x < cam + W + 60) drawBarrack(b);
      for (const t of tanks) if (t.x > cam - 30 && t.x < cam + W + 30) drawTank(t);
      for (const p of hostages) if (p.x > cam - 10 && p.x < cam + W + 10) drawHostage(p);

        ctx.beginPath(); ctx.moveTo(10, 60); ctx.lineTo(22, 52); ctx.lineTo(22, 68); ctx.fill();
        ctx.font = "800 9px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillText("BASE", 26, 63);
        ctx.globalAlpha = 1;

      const x = j.dir > 0 ? 6 : W - 6;
      ctx.fillStyle = "#ff4a3a";
      ctx.beginPath(); ctx.moveTo(x, j.y); ctx.lineTo(x + j.dir * 14, j.y - 8); ctx.lineTo(x + j.dir * 14, j.y + 8); ctx.fill();
      ctx.font = "900 11px system-ui, sans-serif"; ctx.textAlign = j.dir > 0 ? "left" : "right"; ctx.fillText("CACCIA!", x + j.dir * 18, j.y + 4);

  }
  function drawHud() {
    ctx.fillStyle = "rgba(12,10,20,0.92)"; ctx.fillRect(0, 0, W, HUD);

    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a3a";

      ctx.fillStyle = "#7de0a0"; ctx.fillText(`SALVATI ${mRescued}`, 316, 11);
      ctx.fillStyle = "#ff8a7a"; ctx.fillText(`PERSI ${mLost}`, 386, 11);
      ctx.fillStyle = "#b4a8a0"; ctx.fillText(`MISS. ${mission + 1}`, 448, 11);
      // armour pips and spare helicopters
      ctx.textAlign = "right";
      for (let i = 0; i < diff.armor; i++) { ctx.fillStyle = i < (state === "dead" ? 0 : heli.armor) ? (heli.armor === 1 ? "#ff4a3a" : "#ffab40") : "#3a3040"; ctx.fillRect(W - 60 + i * 7 - diff.armor * 7, 7, 5, 8); }

    }

    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.6 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillStyle = "#ffab40";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, 130); ctx.fillText(message.text, W / 2, 130);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.fillStyle = "#f4ede2"; ctx.strokeText(message.sub, W / 2, 152); ctx.fillText(message.sub, W / 2, 152); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>

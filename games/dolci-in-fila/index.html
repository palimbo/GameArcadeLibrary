<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dolci in Fila</title>
<style>
  :root {
    --bg: #2a0e24;
    --fg: #f4f6ee;
    --muted: #f0c8e0;
    --pink: #ff6ab8;
    --yellow: #5ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #6a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(42, 14, 36, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a3a, 0 0 22px rgba(255,106,184,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0218; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const N = 8, S = 38, BX = 168, BY = TOP + 6;
  // the sweets: colour, name
  const SWEETS = [
    { col: "#ff3a4a", dark: "#a8142a", name: "rosse" },
    { col: "#ff9a2a", dark: "#b85a0a", name: "arancioni" },
    { col: "#ffe03a", dark: "#b8980a", name: "gialle" },
    { col: "#4ad85a", dark: "#1a8a2a", name: "verdi" },
    { col: "#3a9aff", dark: "#1a4ab8", name: "blu" },
    { col: "#b85aff", dark: "#6a1ab8", name: "viola" },
  ];
  const CHERRY = -1, BOMB = -2, BEAR = -3;
  const FIXED = (p) => p && (p.c === CHERRY || p.c === BEAR);   // not a sweet: cannot be matched or blown up
  const POW = (p) => p && (p.sp === "h" || p.sp === "v" || p.sp === "w" || p.sp === "pesce");
  // the jelly layouts
  const JELLY = {
    centro: (r, c) => r >= 2 && r <= 5 && c >= 2 && c <= 5 ? 1 : 0,
    croce: (r, c) => r === c || r + c === N - 1 ? 1 : 0,
    bordo: (r, c) => r === 0 || c === 0 || r === N - 1 || c === N - 1 ? 1 : 0,
    fondo: (r) => r >= N - 3 ? 2 : 0,
    tutto: () => 1,
    angoli: (r, c) => (r < 3 || r > 4) && (c < 3 || c > 4) ? (r === 0 || r === N - 1) && (c === 0 || c === N - 1) ? 2 : 1 : 0,
  };
  // the levels: the goal, how many moves, the scores for the stars
  const LEVELS = [
    { goal: "punti", n: 2500, moves: 15 },
    { goal: "colore", color: 0, n: 18, moves: 18 },
    { goal: "gelatina", jelly: "centro", moves: 20 },
    { goal: "punti", n: 6000, moves: 18 },
    { goal: "ciliegie", n: 2, moves: 24 },
    { goal: "colore", color: 3, n: 24, moves: 20 },
    { goal: "gelatina", jelly: "croce", moves: 20 },
    { goal: "ciliegie", n: 3, moves: 24 },
    { goal: "punti", n: 12000, moves: 20 },
    { goal: "gelatina", jelly: "bordo", moves: 24 },
    { goal: "colore", color: 4, n: 30, moves: 22 },
    { goal: "gelatina", jelly: "fondo", moves: 24 },
    { goal: "ciliegie", n: 4, moves: 27 },
    { goal: "punti", n: 20000, moves: 20 },
    { goal: "gelatina", jelly: "angoli", moves: 24 },
    { goal: "gelatina", jelly: "tutto", moves: 30 },
  ];
  // the Soda mode: the soda rises when you pop the bottles, and in the soda the sweets float up
  const SODA_LEVELS = [
    { goal: "soda", soda: 2, bottles: 3, moves: 20 },
    { goal: "orsetti", n: 2, soda: 4, bottles: 2, moves: 24 },
    { goal: "colore", color: 2, n: 22, soda: 4, moves: 20 },
    { goal: "soda", soda: 1, bottles: 4, moves: 24 },
    { goal: "gelatina", jelly: "centro", soda: 4, moves: 24 },
    { goal: "orsetti", n: 3, soda: 2, bottles: 3, moves: 28 },
    { goal: "punti", n: 15000, soda: 8, moves: 20 },
    { goal: "soda", soda: 0, bottles: 4, moves: 26 },
    { goal: "orsetti", n: 4, soda: 3, bottles: 3, moves: 30 },
    { goal: "gelatina", jelly: "tutto", soda: 4, moves: 30 },
  ];
  const MODES = { classica: "CLASSICA", soda: "SODA" };
  const MODE_KEY = "dolci-modo";

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 colori di dolci · più mosse per livello · 5 vite", colors: 5, extra: 6, lives: 5 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "6 colori di dolci · 3 vite", colors: 6, extra: 3, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "6 colori di dolci · meno mosse per livello · 3 vite", colors: 6, extra: 0, lives: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "dolci-difficulty";
  const bestKey = (id) => `dolci-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = false;
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    pick: () => beep(660, 0.04, "square", 0.02),
    swap: () => beep(440, 0.06, "triangle", 0.03, 200),
    bad: () => beep(200, 0.12, "triangle", 0.04, -60),
    pop: lim((n) => beep(500 + n * 90, 0.08, "square", 0.03, 300)),
    special: () => arp([880, 1175, 1568], 0.04, 0.1, "square", 0.035),
    blast: lim(() => { beep(120, 0.25, "sawtooth", 0.05, -60); beep(900, 0.1, "triangle", 0.03, -600); }),
    cherry: () => arp([784, 988, 1319], 0.06, 0.1, "triangle", 0.04),
    fizz: () => { for (let i = 0; i < 6; i++) beep(rnd(1800, 3200), 0.04, "triangle", 0.015, -400, i * 0.04); },
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.16, "square", 0.045),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, lvN = 0, lv = null, moves = 0, levelScore = 0, got = 0, stars = 0, totalStars = 0;
  let grid = [], jelly = [], phase = "idle", phaseT = 0, sel = null, cursor = { r: 3, c: 3 }, swapA = null, swapB = null, swapBack = false, popping = [], cascade = 0, bestCascade = 0;
  let parts = [], popups = [], beams = [], message = null, idleT = 0, hint = null, finaleN = 0, uid = 0;
  let mode = MODES[load(MODE_KEY)] ? load(MODE_KEY) : "classica", sodaRow = N, fizzed = false, fishes = [], bubbles = [];
  const soda = () => mode === "soda";
  const keys = { left: false, right: false, up: false, down: false };
  const isPlaying = () => state === "play";

  // ---------- The board ----------
  const inB = (r, c) => r >= 0 && c >= 0 && r < N && c < N;
  const piece = (c, sp = null) => ({ c, sp, dy: 0, vy: 0, id: ++uid, pop: 0 });
  const randColor = () => Math.floor(Math.random() * diff.colors);
  const same = (a, b) => a && b && a.c >= 0 && a.c === b.c;
  function fillBoard() {
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let k;
        do { k = randColor(); } while ((c >= 2 && grid[r][c - 1].c === k && grid[r][c - 2].c === k) || (r >= 2 && grid[r - 1][c].c === k && grid[r - 2][c].c === k));
        grid[r].push(piece(k));
      }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c].dy = -(N - r) - rnd(0, 1.5);
  }
  // all the runs of three or more of a colour
  function findRuns() {
    const runs = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N;) { let e = c + 1; while (e < N && same(grid[r][c], grid[r][e])) e++; if (e - c >= 3) runs.push({ dir: "h", cells: Array.from({ length: e - c }, (_, i) => [r, c + i]) }); c = e; }
    for (let c = 0; c < N; c++) for (let r = 0; r < N;) { let e = r + 1; while (e < N && same(grid[r][c], grid[e][c])) e++; if (e - r >= 3) runs.push({ dir: "v", cells: Array.from({ length: e - r }, (_, i) => [r + i, c]) }); r = e; }
    // in the Soda mode a square of four is a match too (it makes a fish)
    if (soda()) for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) if (same(grid[r][c], grid[r][c + 1]) && same(grid[r][c], grid[r + 1][c]) && same(grid[r][c], grid[r + 1][c + 1])) runs.push({ dir: "q", cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
    return runs;
  }
  const isSpecial = (p) => p && (p.sp || p.c === BOMB);
  function swapCells(a, b) { const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t; }
  // is this swap a move? (it makes a line, or it puts two specials or a colour bomb together)
  function moveWorks(a, b) {
    const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
    if (!pa || !pb || FIXED(pa) && FIXED(pb)) return false;
    if (pa.c === BOMB || pb.c === BOMB) return !FIXED(pa) && !FIXED(pb);
    if (POW(pa) && POW(pb)) return true;
    swapCells(a, b); const ok = findRuns().length > 0; swapCells(a, b);
    return ok;
  }
  function allMoves() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) { const a = { r, c }, b = { r: r + dr, c: c + dc }; if (inB(b.r, b.c) && moveWorks(a, b)) out.push([a, b]); }
    return out;
  }
  function shuffleBoard() {
    for (let t = 0; t < 200; t++) {
      const list = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c].c >= 0 && !grid[r][c].sp) list.push(grid[r][c].c);
      list.sort(() => Math.random() - 0.5);
      let i = 0; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c].c >= 0 && !grid[r][c].sp) grid[r][c].c = list[i++];
      if (!findRuns().length && allMoves().length) break;
    }
    message = { text: "MESCOLO!", sub: "non c'erano più mosse", t: 0 };
  }

  // ---------- Clearing ----------
  function gain(n, r, c, col = "#ffffff") {
    score += n; levelScore += n;
    if (r !== undefined) popups.push({ text: `+${n}`, x: BX + c * S + S / 2, y: BY + r * S + S / 2, t: 0, col });
  }
  // clear a set of cells: specials caught inside go off too
  function blast(cells, colorBomb) {
    const done = new Set(), queue = [...cells];
    let n = 0;
    while (queue.length) {
      const [r, c] = queue.shift(), k = r * N + c;
      if (!inB(r, c) || done.has(k)) continue;
      done.add(k);
      const p = grid[r][c];
      if (jelly[r][c] > 0) { jelly[r][c]--; levelScore += 0; score += 100; levelScore += 100; for (let i = 0; i < 4; i++) parts.push({ x: BX + c * S + S / 2, y: BY + r * S + S / 2, vx: rnd(-60, 60), vy: rnd(-80, 0), t: 0, col: "#ff9ad8" }); }
      if (!p || FIXED(p) || p.keep) continue;
      if (p.sp === "bot") popBottle(r, c);
      if (p.sp === "pesce") { const t = fishTarget(done, r, c); if (t) { queue.push(t); fishes.push({ x0: BX + c * S + S / 2, y0: BY + r * S + S / 2, x1: BX + t[1] * S + S / 2, y1: BY + t[0] * S + S / 2, t: 0, col: SWEETS[p.c].col }); } }
      if (p.sp === "h") { beams.push({ r, c, dir: "h", t: 0 }); for (let i = 0; i < N; i++) queue.push([r, i]); sfx.blast(); }
      if (p.sp === "v") { beams.push({ r, c, dir: "v", t: 0 }); for (let i = 0; i < N; i++) queue.push([i, c]); sfx.blast(); }
      if (p.sp === "w") { beams.push({ r, c, dir: "w", t: 0 }); for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) queue.push([r + dr, c + dc]); sfx.blast(); }
      if (p.c === BOMB) { const k2 = colorBomb ?? mostColor(); beams.push({ r, c, dir: "b", t: 0 }); for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) if (grid[rr][cc] && grid[rr][cc].c === k2) queue.push([rr, cc]); sfx.blast(); }
      if (p.c >= 0 && lv.goal === "colore" && p.c === lv.color) got++;
      for (let i = 0; i < 6; i++) parts.push({ x: BX + c * S + S / 2, y: BY + r * S + S / 2, vx: rnd(-90, 90), vy: rnd(-120, 20), t: 0, col: p.c >= 0 ? SWEETS[p.c].col : "#6a3a1a" });
      popping.push({ r, c, p, t: 0 });
      grid[r][c] = null;
      n++;
    }
    return n;
  }
  function mostColor() { const cnt = Array(6).fill(0); for (const row of grid) for (const p of row) if (p && p.c >= 0) cnt[p.c]++; return cnt.indexOf(Math.max(...cnt)); }
  // the lines on the board: clear them, and make the special sweets
  function resolveRuns() {
    const runs = findRuns();
    if (!runs.length) return false;
    // runs sharing a sweet are one group (an L or a T)
    const groups = [];
    for (const run of runs) {
      const g = groups.find((x) => x.cells.some(([r, c]) => run.cells.some(([r2, c2]) => r === r2 && c === c2)));
      if (g) { g.runs.push(run); for (const cell of run.cells) if (!g.cells.some(([r, c]) => r === cell[0] && c === cell[1])) g.cells.push(cell); }
      else groups.push({ runs: [run], cells: [...run.cells] });
    }
    cascade++;
    bestCascade = Math.max(bestCascade, cascade);
    if (cascade >= 5) impresa("cascata");
    const make = [];
    for (const g of groups) {
      const lines = g.runs.filter((r) => r.dir !== "q");
      const long = Math.max(0, ...lines.map((r) => r.cells.length));
      const color = grid[g.cells[0][0]][g.cells[0][1]].c;
      let sp = null;
      if (long >= 5) sp = "bomb";
      else if (lines.some((r) => r.dir === "h") && lines.some((r) => r.dir === "v")) sp = "w";
      else if (long === 4) sp = lines[0].dir === "h" ? "v" : "h";
      else if (g.runs.some((r) => r.dir === "q")) sp = "pesce";
      // the new special goes where you moved, or in the middle
      let at = g.cells[Math.floor(g.cells.length / 2)];
      for (const s of [swapA, swapB]) if (s && g.cells.some(([r, c]) => r === s.r && c === s.c)) at = [s.r, s.c];
      if (sp) make.push({ at, sp, color });
      const pts = g.cells.length * 60 * cascade + (sp === "bomb" ? 400 : sp ? 200 : 0);
      const [mr, mc] = g.cells[Math.floor(g.cells.length / 2)];
      gain(pts, mr, mc, SWEETS[color].col);
    }
    const all = groups.flatMap((g) => g.cells);
    blast(all);
    for (const m of make) {
      const [r, c] = m.at;
      grid[r][c] = m.sp === "bomb" ? piece(BOMB) : piece(m.color, m.sp);
      grid[r][c].born = 0.3;
      if (m.sp === "bomb") impresa("bomba");
    }
    if (make.length) sfx.special();
    sfx.pop(cascade);
    swapA = swapB = null;
    return true;
  }
  // two specials swapped together (or a colour bomb with anything)
  function comboSwap(a, b) {
    const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
    const at = b;

    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

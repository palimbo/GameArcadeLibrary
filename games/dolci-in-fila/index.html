<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dolci in Fila</title>
<style>
  :root {
    --bg: #2a0e24;
    --fg: #f4f6ee;
    --muted: #f0c8e0;
    --pink: #ff6ab8;
    --yellow: #5ad8ff;
    --red: #ff4a3a;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #6a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(42, 14, 36, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a3a, 0 0 22px rgba(255,106,184,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0218; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a83a7a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const THEMES = [
    { name: "Bottega delle Caramelle", bg: ["#ffb8d8", "#c8a8ff"], frame: "rgba(70,20,80,0.55)", panel: "rgba(70,20,80,0.62)", deco: "caramelle", root: 60, tempo: 112, prog: [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]] },
    { name: "Bosco di Liquirizia", bg: ["#c8f0a8", "#3a8a6a"], frame: "rgba(20,50,30,0.58)", panel: "rgba(20,50,30,0.65)", deco: "foglie", root: 57, tempo: 100, prog: [[0, 3, 7], [8, 12, 15], [3, 7, 10], [10, 14, 17]] },
    { name: "Valle del Gelato", bg: ["#e8faff", "#7aa8ff"], frame: "rgba(20,40,90,0.5)", panel: "rgba(20,40,90,0.62)", deco: "fiocchi", root: 62, tempo: 120, prog: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]] },
    { name: "Isola del Cioccolato", bg: ["#ffd8a8", "#9a5a3a"], frame: "rgba(60,30,10,0.58)", panel: "rgba(60,30,10,0.65)", deco: "cacao", root: 55, tempo: 96, prog: [[0, 4, 7], [5, 9, 12], [2, 5, 9], [7, 11, 14]] },

  // where the jelly, the frosting and the chocolate go
  const PAT = {

  // a level: goals, moves and what is on the board

  const L = (goals, moves, o = {}) => ({ goals, moves, ...o });
  const CLASSIC = [

    L("ordine:h2", 20), L("gelatina", 26, { jelly: "croce", shape: "diamante" }), L("colore:3:20 colore:4:20", 22), L("ciliegie:2 gelatina", 30, { jelly: "basso" }),
    L("gelatina", 28, { jelly: "centro", jelly2: true, shape: "diamante", glassa: ["mezzo", 1] }),
    // 2 · Bosco di Liquirizia: the frosting

    L("gelatina", 24, { jelly: "anello", shape: "colonne" }), L("colore:1:25", 26, { glassa: ["centro", 2] }), L("gelatina", 26, { jelly: "croce", shape: "cornice" }), L("ordine:bomb1,w1", 30),
    L("ciliegie:2", 28, { glassa: ["tetto", 2] }),

    L("cioccolato", 32, { ciocco: "angolisu", glassa: ["mezzo", 1] }), L("ordine:h2,w1,bomb1", 28), L("gelatina", 30, { jelly: "anello", shape: "clessidra" }), L("colore:2:25 cioccolato", 28, { ciocco: "angolisu" }),
    L("ciliegie:2", 32, { ciocco: "angolisu" }),
    L("cioccolato gelatina", 32, { ciocco: "fondo", jelly: "alto" }),
    // 4 · Isola del Cioccolato: the time bombs
    L("punti:10000", 24, { timer: 14 }), L("gelatina", 26, { jelly: "centro", timer: 14 }), L("ciliegie:2", 32, { timer: 16 }), L("colore:5:24", 26, { timer: 12 }),
    L("ordine:w2", 32, { timer: 14 }), L("gelatina", 30, { jelly: "croce", shape: "cuore", timer: 14 }), L("cioccolato", 32, { ciocco: "angolisu", timer: 14 }), L("gelatina", 32, { jelly: "scacchi", glassa: ["mezzo", 1] }),
    L("ciliegie:2", 34, { glassa: ["tetto", 1], timer: 14 }),
    L("gelatina", 32, { jelly: "centro", jelly2: true, timer: 14, glassa: ["mezzo", 1], ciocco: "angolisu" }),
    // 5 · Castello di Zucchero: everything together
    L("gelatina", 28, { jelly: "scacchi", ciocco: "angolisu" }), L("ordine:bomb1,h2", 30), L("ciliegie:2", 34, { shape: "colonne", glassa: ["tetto", 2] }), L("punti:18000", 26, { timer: 14 }),
    L("gelatina", 34, { jelly: "bordo", shape: "diamante", glassa: ["centro", 2] }), L("cioccolato ciliegie:2", 36, { ciocco: "angolisu" }), L("colore:0:25 colore:2:25", 30, { timer: 14 }),
    L("gelatina", 34, { jelly: "scacchi", shape: "cornice", ciocco: "angolisu" }), L("ordine:h2,w1,bomb1", 34, { glassa: ["mezzo", 2] }),
    L("gelatina ciliegie:2", 36, { jelly: "centro", jelly2: true, glassa: ["tetto", 2], ciocco: "angolisu", timer: 14 }),
  ];
  const SODA = [
    // 1
    L("soda", 20, { soda: 2, bottles: 3 }), L("orsetti:2", 26, { soda: 4, bottles: 2 }), L("colore:2:22", 22, { soda: 4 }), L("soda", 24, { soda: 1, bottles: 4 }), L("gelatina", 24, { jelly: "centro", soda: 4 }),
    L("orsetti:3", 30, { soda: 3, bottles: 3 }), L("punti:15000", 22, { soda: 8 }), L("soda", 26, { soda: 0, bottles: 4, shape: "angoli" }), L("ordine:pesce3", 24, { soda: 4 }),
    L("orsetti:3 gelatina", 32, { soda: 3, bottles: 3, jelly: "basso", glassa: ["mezzo", 1] }),
    // 2
    L("soda", 26, { soda: 2, glassa: ["tetto", 1] }), L("orsetti:2", 30, { soda: 4, glassa: ["mezzo", 1] }), L("gelatina", 30, { jelly: "tutto", soda: 8, shape: "diamante" }), L("ordine:pesce2,w1", 28, { soda: 4 }),
    L("soda", 28, { soda: 0, bottles: 4, shape: "colonne" }), L("colore:4:25 orsetti:2", 32, { soda: 3 }), L("punti:20000", 26, { soda: 6, glassa: ["lati", 2] }), L("orsetti:3", 34, { soda: 3, shape: "clessidra" }),
    L("gelatina soda", 28, { jelly: "anello", soda: 2 }),
    L("orsetti:3 gelatina", 36, { soda: 3, jelly: "basso", glassa: ["tetto", 2] }),
    // 3
    L("cioccolato", 28, { soda: 4, ciocco: "angolisu" }), L("soda", 28, { soda: 2, ciocco: "angoli" }), L("orsetti:2", 32, { soda: 4, timer: 14 }), L("gelatina", 26, { jelly: "centro", soda: 6, ciocco: "angoli" }),
    L("ordine:pesce2,bomb1", 30, { soda: 4 }), L("soda", 28, { soda: 1, timer: 12 }), L("orsetti:2", 34, { soda: 3, shape: "cuore" }), L("cioccolato gelatina", 34, { soda: 8, ciocco: "mezzo", jelly: "alto" }),
    L("colore:0:30", 28, { soda: 4, timer: 14 }),
    L("orsetti:2 cioccolato gelatina", 40, { soda: 3, ciocco: "angolisu", jelly: "basso", timer: 14 }),
  ];
  const MODES = { classica: "CLASSICA", soda: "SODA" };
  const MODE_KEY = "dolci-modo", MUSIC_KEY = "dolci-musica";
  const CALLOUTS = ["", "", "Dolce!", "Gustoso!", "Delizioso!", "Divino!", "Dolcissimo!"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 colori di dolci · più mosse per livello · 5 vite", colors: 5, extra: 7, lives: 5 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "6 colori di dolci · 3 vite", colors: 6, extra: 3, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "6 colori di dolci · meno mosse per livello · 3 vite", colors: 6, extra: 0, lives: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "dolci-difficulty";
  const bestKey = (id) => `dolci-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = false;
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  // ---------- Sound ----------
  let noiseBuf = null;
  function noise(dur, vol, f0, f1, type = "lowpass", delay = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) { noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = audioCtx.currentTime + delay, src = audioCtx.createBufferSource(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl).connect(g).connect(audioCtx.destination); src.start(t); src.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const sfx = {
    pick: () => beep(880, 0.04, "sine", 0.03, 200),
    swap: () => noise(0.12, 0.05, 900, 3000, "bandpass"),
    bad: () => { beep(330, 0.16, "triangle", 0.05, -160); beep(250, 0.18, "triangle", 0.04, -120, 0.09); },
    pop: lim((n) => { const m = 72 + PENTA[Math.min(PENTA.length - 1, n)]; beep(hz(m), 0.12, "sine", 0.05, 0); beep(hz(m + 12), 0.06, "triangle", 0.02, 0, 0.02); noise(0.05, 0.03, 4000, 1500, "highpass"); }),

    if (kbd && !sel && phase === "idle") { ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.strokeRect(BX + cursor.c * S + 2, BY + cursor.r * S + 2, S - 4, S - 4); ctx.setLineDash([]); }
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#2a0a24"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function panel(x, y, w, h) { ctx.fillStyle = theme().panel; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); }
  function goalIcon(g, x, y) {
    if (g.t === "colore") sweetShape({ c: g.color, id: 0 }, x, y, 0.7);
    else if (g.t === "ciliegie") sweetShape({ c: CHERRY }, x, y, 0.7);
    else if (g.t === "orsetti") sweetShape({ c: BEAR }, x, y, 0.7);
    else if (g.t === "soda") sweetShape({ c: 4, sp: "bot" }, x, y, 0.7);
    else if (g.t === "gelatina") { ctx.fillStyle = "rgba(255,120,200,0.9)"; ctx.beginPath(); ctx.roundRect(x - 10, y - 10, 20, 20, 5); ctx.fill(); }
    else if (g.t === "cioccolato") { ctx.save(); ctx.translate(x - S * 0.35, y - S * 0.35); ctx.scale(0.7, 0.7); drawBlock({ kind: "ciocco", hit: 0 }, 0, 0); ctx.restore(); }
    else if (g.t === "punti") outlined("★", x, y + 7, "900 20px system-ui", "#ffd23a", 3);
    else { const i = g.items.find((it) => it.got < it.n) || g.items[0]; sweetShape(i.k === "bomb" ? { c: BOMB } : { c: 4, sp: i.k }, x, y, 0.7); }
  }
  function drawSide() {
    const th = theme();
    // left: the world, the level, the goals, the moves
    panel(10, BY, 146, 206);
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "800 8px system-ui"; ctx.fillText(`MONDO ${Math.floor(lvN / 10) + 1} · ${th.name.toUpperCase()}`, 83, BY + 13, 138);
    outlined(milestone() ? `TRAGUARDO ${lvN + 1}` : `LIVELLO ${lvN + 1}`, 83, BY + 31, "900 14px system-ui", milestone() ? "#ffd23a" : "#ffffff", 4);
    goals.slice(0, 3).forEach((g, i) => {
      const y = BY + 54 + i * 30;
      goalIcon(g, 40, y);
      const left = goalLeftOne(g), done = goalDoneOne(g);
      outlined(done ? "✓" : g.t === "punti" ? left.toLocaleString("it-IT") : String(left), 104, y + 7, "900 17px system-ui", done ? "#5aff7a" : "#ffffff", 4);
    });
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "800 9px system-ui"; ctx.fillText("MOSSE", 83, BY + 152);
    const mv = moves <= 3 ? 1 + Math.abs(Math.sin(clock * 6)) * 0.12 : 1;
    ctx.save(); ctx.translate(83, BY + 186); ctx.scale(mv, mv); outlined(String(moves), 0, 0, "900 30px system-ui", moves <= 3 ? "#ff6a6a" : "#ffd23a", 5); ctx.restore();
    panel(10, BY + 214, 146, 34);
    for (let i = 0; i < diff.lives; i++) { ctx.fillStyle = i < lives ? "#ff3a6a" : "rgba(255,255,255,0.2)"; ctx.font = "16px system-ui"; ctx.fillText("♥", 30 + i * 26, BY + 237); }
    // right: the score and the stars of this level
    panel(W - 156, BY, 146, 120);
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "800 9px system-ui"; ctx.fillText("PUNTI", W - 83, BY + 18);
    outlined(score.toLocaleString("it-IT"), W - 83, BY + 44, "900 20px system-ui", "#ffffff", 4);
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, W - 83, BY + 60);
    const ref = starRef(), k = clamp(levelScore / (ref * 2.2), 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.beginPath(); ctx.roundRect(W - 146, BY + 76, 126, 10, 5); ctx.fill();
    const gg = ctx.createLinearGradient(W - 146, 0, W - 20, 0); gg.addColorStop(0, "#ff6ab8"); gg.addColorStop(1, "#ffd23a");
    ctx.fillStyle = gg; ctx.beginPath(); ctx.roundRect(W - 146, BY + 76, Math.max(4, 126 * k), 10, 5); ctx.fill();
    for (const f of [1 / 2.2, 1.5 / 2.2, 1]) { const on = k >= f; ctx.save(); ctx.translate(W - 146 + 126 * f, BY + 100); if (on) { const z = 1 + 0.1 * Math.sin(clock * 5); ctx.scale(z, z); } ctx.fillStyle = on ? "#ffd23a" : "rgba(255,255,255,0.4)"; ctx.font = "15px system-ui"; ctx.fillText("★", 0, 4); ctx.restore(); }
    panel(W - 156, BY + 130, 146, 34);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 11px system-ui"; ctx.fillText(`★ ${totalStars} stelle`, W - 83, BY + 152);
    if (soda()) { panel(W - 156, BY + 172, 146, 34); ctx.fillStyle = "#5ad8ff"; ctx.font = "800 10px system-ui"; ctx.fillText(sodaRow ? `SODA: ${N - sodaRow}/${N} file` : "SODA PIENA!", W - 83, BY + 194); }
  }
  function drawBanner() {
    if (!banner || phase !== "intro") return;
    const th = theme(), kIn = Math.min(1, banner.t / 0.35), y = 120 + (1 - kIn) * -60;
    ctx.globalAlpha = kIn;
    if (banner.kind === "mondo") {
      ctx.fillStyle = "rgba(20,10,30,0.8)"; ctx.fillRect(0, y - 40, W, 104);
      outlined(`MONDO ${Math.floor(lvN / 10) + 1}`, W / 2, y - 6, "900 16px system-ui", "#ffffff", 4);
      outlined(th.name.toUpperCase(), W / 2, y + 24, "italic 900 28px system-ui", th.bg[0], 6);
      outlined(`livello ${lvN + 1} · ${goalText()}`, W / 2, y + 48, "800 12px system-ui", "#ffffff", 4);
    } else if (banner.kind === "traguardo") {
      ctx.fillStyle = "rgba(60,10,20,0.85)"; ctx.fillRect(0, y - 40, W, 104);
      const s = 1 + 0.06 * Math.sin(clock * 8);
      ctx.save(); ctx.translate(W / 2, y + 10); ctx.scale(s, s); outlined("LIVELLO TRAGUARDO!", 0, 0, "italic 900 30px system-ui", "#ffd23a", 6); ctx.restore();
      outlined(`livello ${lvN + 1} · ${goalText()} · ${lv.moves} mosse`, W / 2, y + 44, "800 12px system-ui", "#ffffff", 4);
    } else {
      ctx.fillStyle = "rgba(40,10,40,0.75)"; ctx.fillRect(BX - 6, y - 26, N * S + 12, 70);
      outlined(`LIVELLO ${lvN + 1}`, W / 2, y + 2, "italic 900 24px system-ui", "#ff6ab8", 5);
      outlined(`${goalText()} · ${lv.moves} mosse`, W / 2, y + 26, "800 11px system-ui", "#ffffff", 4);
    }
    ctx.globalAlpha = 1;
  }
  function drawWin() {
    if (phase === "won") {
      const k = Math.min(1, phaseT / 0.3);
      ctx.fillStyle = `rgba(30,10,40,${0.6 * k})`; ctx.fillRect(BX - 6, 100, N * S + 12, 130);
      const s = 0.6 + 0.4 * k + 0.05 * Math.sin(clock * 6);
      ctx.save(); ctx.translate(W / 2, 140); ctx.scale(s, s); outlined(milestone() ? "TRAGUARDO SUPERATO!" : "LIVELLO SUPERATO!", 0, 0, "italic 900 24px system-ui", "#ffd23a", 6); ctx.restore();
      for (let i = 0; i < 3; i++) {
        const tt = phaseT - 0.6 - i * 0.35, on = i < stars && tt > 0, sc = on ? Math.min(1.3, tt * 6) - clamp((tt - 0.2) * 2, 0, 0.3) : 1;
        ctx.save(); ctx.translate(W / 2 - 50 + i * 50, 186 - (i === 1 ? 8 : 0)); ctx.scale(sc, sc); ctx.rotate(on ? Math.sin(clock * 3 + i) * 0.1 : 0);
        ctx.font = "34px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = on ? "#ffd23a" : "rgba(255,255,255,0.25)"; ctx.fillText("★", 0, 12); ctx.restore();
      }
      outlined(`${levelScore.toLocaleString("it-IT")} punti`, W / 2, 222, "800 12px system-ui", "#ffffff", 4);
    } else if (phase === "world") {
      const next = THEMES[(Math.floor(lvN / 10) + 1) % THEMES.length], k = Math.min(1, phaseT / 0.5);
      ctx.fillStyle = `rgba(20,10,30,${0.85 * k})`; ctx.fillRect(0, 0, W, H);
      const s = 0.5 + 0.5 * k + 0.05 * Math.sin(clock * 5);
      ctx.save(); ctx.translate(W / 2, 120); ctx.scale(s, s); outlined(`MONDO ${Math.floor(lvN / 10) + 1} COMPLETATO!`, 0, 0, "italic 900 32px system-ui", "#ffd23a", 7); ctx.restore();
      outlined(`ecco il prossimo: ${next.name}`, W / 2, 168, "800 15px system-ui", next.bg[0], 5);
      const g = ctx.createLinearGradient(W / 2 - 120, 0, W / 2 + 120, 0); g.addColorStop(0, next.bg[0]); g.addColorStop(1, next.bg[1]);
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(W / 2 - 120, 190, 240, 46, 12); ctx.fill();
      for (let i = 0; i < 6; i++) sweetShape({ c: i, id: i }, W / 2 - 100 + i * 40, 213 + Math.sin(clock * 4 + i) * 4, 0.8);
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!lv) { lv = levelDef(0); goals = parseGoals(lv.goals); sodaRow = N; hole = Array.from({ length: N }, () => Array(N).fill(false)); block = Array.from({ length: N }, () => Array(N).fill(null)); jelly = Array.from({ length: N }, () => Array(N).fill(0)); fillBoard(); buildT = 9; }
    drawBack();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 10, rnd(-1, 1) * shake * 10);
    drawBoard();
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu") return;
    ctx.fillStyle = "rgba(30,10,30,0.9)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffffff"; ctx.font = "900 12px system-ui"; ctx.textBaseline = "middle";
    ctx.fillText(`${soda() ? "SODA" : "DOLCI IN FILA"} · ${milestone() ? "TRAGUARDO · " : ""}${goalText()}`, W / 2 - 20, 14);
    ctx.textAlign = "right"; ctx.fillStyle = musicOn ? "#ffd23a" : "rgba(255,255,255,0.35)"; ctx.font = "900 14px system-ui"; ctx.fillText(musicOn ? "♪" : "♪×", touchMode ? W - 70 : W - 12, 14);
    ctx.textBaseline = "alphabetic";
    drawSide();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t); const s = 1 + Math.max(0, 0.3 - p.t) * 1.5; ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); outlined(p.text, 0, 0, "900 13px system-ui", p.col, 4); ctx.restore(); }
    ctx.globalAlpha = 1;
    if (callout) {
      const t = callout.t, s = t < 0.2 ? t / 0.2 * 1.3 : t < 0.35 ? 1.3 - (t - 0.2) * 2 : 1;
      ctx.globalAlpha = clamp((1.3 - t) * 3, 0, 1);
      ctx.save(); ctx.translate(W / 2, BY + N * S / 2 - 20); ctx.scale(Math.max(0.01, s), Math.max(0.01, s)); ctx.rotate(Math.sin(t * 10) * 0.04);
      outlined(callout.text, 0, 0, "italic 900 30px system-ui", callout.col, 7); ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (message) {
      ctx.globalAlpha = clamp(((message.long ? 3 : 2.2) - message.t) * 2, 0, 1);
      ctx.fillStyle = "rgba(60,20,70,0.75)"; ctx.fillRect(BX - 6, 140, N * S + 12, 60);
      outlined(message.text, W / 2, 168, "italic 900 22px system-ui", message.col || "#ff6ab8", 5);
      if (message.sub) outlined(message.sub, W / 2, 188, "800 11px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
    drawBanner();
    drawWin();
    for (const p of confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.globalAlpha = clamp(3 - p.t, 0, 1); ctx.fillRect(-3, -1.5, 6, 3); ctx.restore(); }
    ctx.globalAlpha = 1;
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bolle di Drago</title>
<style>
  :root {
    --bg: #06061a;
    --fg: #f4f8ff;
    --muted: #a8b0d8;
    --dragon: #5aff6a;
    --bubble: #8ae0ff;
    --pink: #ff6ab8;
    --gold: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 248, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .cl { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: 68px; height: 68px; border-radius: 50%; touch-action: none;
    font: 700 24px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(90, 255, 106, 0.7); background: rgba(90, 255, 106, 0.1);
  }
  #touch button[data-a="blow"] { width: 84px; height: 84px; border-color: rgba(138, 224, 255, 0.9); background: rgba(138, 224, 255, 0.16); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch button[data-a="jump"] { width: 84px; height: 84px; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.14); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; margin-bottom: 26px; }
  #touch.small button { width: 56px; height: 56px; font-size: 20px; }
  #touch.small button[data-a="blow"], #touch.small button[data-a="jump"] { width: 68px; height: 68px; font-size: 11px; }
  #touch button.on { background: rgba(244, 248, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 6, 26, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 10vw, 62px); font-weight: 900; letter-spacing: 1px; color: var(--dragon); text-shadow: 0 0 0 transparent, 3px 3px 0 #1a6a2a, 0 0 24px rgba(138,224,255,0.6); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--pink); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,248,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--dragon); color: #06200a; background: var(--dragon); padding: 11px 30px; box-shadow: 0 4px 0 #1a8a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="cl">
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
  </div>
  <div class="cl">
    <button type="button" data-a="blow" aria-label="Bolla">BOLLA</button>
    <button type="button" data-a="jump" aria-label="Salta">SALTA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const T = 16, COLS = 30, ROWS = 24, HUD = 24, W = COLS * T, H = HUD + ROWS * T;
  const G = 900, JUMP = 390, SPEED = 90, GAP = [13, 16];
  // platforms per level: [row, firstCol, lastCol] (the side walls and the floor are added automatically)
  const LEVELS = [
    { color: "#ff6ab8", plats: [[5, 2, 9], [5, 20, 27], [9, 8, 21], [13, 2, 9], [13, 20, 27], [17, 8, 21], [20, 4, 10], [20, 19, 25]] },
    { color: "#5ab8ff", plats: [[5, 5, 24], [9, 2, 7], [9, 12, 17], [9, 22, 27], [13, 5, 24], [17, 2, 7], [17, 12, 17], [17, 22, 27], [20, 9, 20]] },
    { color: "#ffb03a", plats: [[5, 2, 7], [5, 22, 27], [9, 8, 13], [9, 16, 21], [13, 2, 7], [13, 22, 27], [17, 8, 13], [17, 16, 21], [20, 11, 18]] },
    { color: "#5aff9a", plats: [[4, 10, 19], [8, 2, 5], [8, 11, 18], [8, 24, 27], [12, 6, 23], [16, 2, 9], [16, 20, 27], [20, 6, 23]] },
    { color: "#c88aff", plats: [[5, 2, 12], [5, 17, 27], [9, 6, 23], [13, 2, 12], [13, 17, 27], [17, 6, 23], [21, 2, 8], [21, 21, 27]] },
    { color: "#ff5a5a", plats: [[6, 4, 9], [6, 20, 25], [10, 11, 18], [14, 4, 9], [14, 20, 25], [18, 11, 18], [18, 2, 4], [18, 25, 27], [10, 2, 3], [10, 26, 27], [21, 6, 11], [21, 18, 23]] },
  ];
  const FRUITS = [
    { name: "ciliegie", pts: 100, c: "#ff3a4a" }, { name: "banana", pts: 200, c: "#ffd34d" }, { name: "anguria", pts: 400, c: "#3ac86a" },
    { name: "torta", pts: 800, c: "#ff9ad8" }, { name: "diamante", pts: 2000, c: "#8ae0ff" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · mostri lenti, le bolle li tengono più a lungo", lives: 5, speed: 0.75, hold: 1.4 },
    normale:   { label: "NORMALE",   color: "#ffd34d", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, hold: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · mostri rapidi che scappano presto", lives: 3, speed: 1.25, hold: 0.75 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "draghi-difficulty";
  const bestKey = (id) => `draghi-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(140px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 140;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    blow: lim(() => beep(600, 0.12, "sine", 0.04, 500)),
    jump: lim(() => beep(330, 0.15, "square", 0.025, 330)),
    trap: lim(() => arp([880, 1175], 0.05, 0.08, "triangle", 0.04)),
    pop: lim((k) => beep(900 + k * 150, 0.07, "square", 0.03, -400)),
    popEmpty: lim(() => beep(1400, 0.04, "triangle", 0.02, -600)),
    bounce: lim(() => beep(500, 0.1, "sine", 0.04, 400)),
    fruit: lim((k) => arp([1047 + k * 60, 1319 + k * 60], 0.04, 0.08, "square", 0.035)),
    escape: lim(() => beep(200, 0.25, "sawtooth", 0.03, 150)),
    rock: lim(() => beep(120, 0.1, "square", 0.03)),
    hurry: () => arp([988, 988, 988, 1319], 0.1, 0.09, "square", 0.04),
    die: () => arp([784, 740, 698, 659, 622, 587, 554, 523], 0.07, 0.1, "square", 0.04),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.13),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 30000;
  let grid = [], hero = null, enemies = [], bubbles = [], fruits = [], rocks = [], ghost = null, blowT = 0;
  let parts = [], popups = [], message = null, levelT = 0, hurried = false, clearT = 0;
  const ctl = { left: false, right: false, jump: false, blow: false };
  let jumpPressed = false, blowPressed = false;

  const LV = () => LEVELS[level % LEVELS.length];
  const loopN = () => Math.floor(level / LEVELS.length);
  const rowTop = (r) => HUD + r * T;
  const isPlat = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === 2;

  function buildLevel() {
    grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
    for (let r = 0; r < ROWS; r++) { grid[r][0] = grid[r][1] = grid[r][COLS - 2] = grid[r][COLS - 1] = 1; }
    for (let c = 2; c < COLS - 2; c++) if (c < GAP[0] || c > GAP[1]) { grid[ROWS - 1][c] = 2; grid[0][c] = 1; }
    for (const [r, a, b] of LV().plats) for (let c = a; c <= b; c++) grid[r][c] = 2;
    hero = { x: 3 * T + 8, y: rowTop(ROWS - 1), vx: 0, vy: 0, ground: true, face: 1, inv: 2, dead: false, walk: 0 };
    bubbles = []; fruits = []; rocks = []; ghost = null; hurried = false; levelT = 0; clearT = 0;
    // the monsters drop in from the top gap to their platforms
    const n = Math.min(8, 4 + Math.floor(level / 2));
    const plats = LV().plats.filter(([r]) => r < 20);
    enemies = [];
    for (let i = 0; i < n; i++) {
      const [r, a, b] = plats[i % plats.length];
      const x = (a + (b - a) * (((i * 7) % 5) + 1) / 6) * T + 8;
      enemies.push({ kind: level >= 1 && i % 3 === 2 ? "thrower" : "walker", x, y: rowTop(r), vx: 0, vy: 0, ground: true, face: i % 2 ? 1 : -1, angry: false, t: rnd(0, 2), jumpT: rnd(1, 3), throwT: rnd(2, 4), trapped: false, drop: 0.5 + i * 0.15 });
    }
    message = { text: `LIVELLO ${level + 1}`, sub: "Intrappola i mostri nelle bolle!", t: 0 };
    state = "intro"; stateT = 1.6;
  }

  // ---------- Physics for everyone that walks and jumps ----------
  function moveBody(b, dt, hw) {
    b.vy = Math.min(420, b.vy + G * dt);
    const x0 = b.x;
    b.x = clamp(b.x + b.vx * dt, 2 * T + hw, W - 2 * T - hw);
    b.hitWall = b.x !== x0 + b.vx * dt;
    const py = b.y;
    b.y += b.vy * dt;
    b.ground = false;
    if (b.vy >= 0) {
      // one-way platforms: land on them from above, jump through them from below
      const r = Math.floor((b.y - HUD) / T);
      if (r >= 0 && r < ROWS && py <= rowTop(r) + 1 && b.y >= rowTop(r)) {
        const c0 = Math.floor((b.x - hw + 2) / T), c1 = Math.floor((b.x + hw - 2) / T);
        if (isPlat(c0, r) || isPlat(c1, r)) { b.y = rowTop(r); b.vy = 0; b.ground = true; }
      }
    }
    // the ceiling stops jumps; falling through the gap in the floor comes back from the top
    if (b.y < HUD + 2 * T) { b.y = HUD + 2 * T; b.vy = Math.max(0, b.vy); }
    if (b.y > H + 20) { b.y = HUD + 2 * T; }
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f4f8ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 50000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 110) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function killHero() {
    if (state !== "play" || hero.inv > 0) return;
    lives--; hero.dead = true;
    sfx.die();
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    Object.assign(hero, { x: 3 * T + 8, y: rowTop(ROWS - 1), vx: 0, vy: 0, dead: false, inv: 2.5, face: 1 });
    rocks = []; ghost = null; levelT = Math.min(levelT, 20); hurried = false;
    for (const e of enemies) e.angry = false;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>BOLLE DI DRAGO</h1>
       <p>Il draghetto soffia bolle! Intrappola i mostri in una bolla e poi falla scoppiare toccandola: il mostro diventa frutta da raccogliere. Scoppiane tante insieme per punti doppi, e tieni premuto SALTA per rimbalzare sulle bolle vuote. Se ci metti troppo arriva il fantasma!</p>
       <div class="pts">
         <span><b>Mostro scoppiato</b></span><span>1.000 · in fila 2.000, 4.000, 8.000…</span>
         <span><b>Frutta</b></span><span>da 100 (ciliegie) a 2.000 (diamante)</span>
         <span><b>Bolla vuota</b></span><span>10</span>
         <span><b>Mostri rossi</b></span><span>sono scappati dalla bolla: più veloci!</span>
       </div>
       ${touchMode
         ? `<p class="muted help">◀ ▶ per camminare · SALTA (tieni premuto sopra una bolla per rimbalzare) · BOLLA per soffiare</p>`
         : `<p class="muted help">← → per camminare · ↑ o SPAZIO per saltare (tieni premuto per rimbalzare sulle bolle) · Z o X per soffiare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "jump", w: "jump", " ": "jump", z: "blow", x: "blow", control: "blow" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];
    if (!a) return;
    ctl[a] = true;
    if (a === "jump" && !e.repeat) jumpPressed = true;
    if (a === "blow" && !e.repeat) blowPressed = true;
  });
  window.addEventListener("keyup", (e) => { const a = KEYS[e.key.toLowerCase()]; if (a) ctl[a] = false; });
  window.addEventListener("blur", () => { for (const k in ctl) ctl[k] = false; if (isPlaying()) togglePause(); });
  for (const btn of touchEl.querySelectorAll("button")) {
    const a = btn.dataset.a;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); btn.classList.add("on"); ctl[a] = true;
      if (a === "jump") jumpPressed = true;
      if (a === "blow") blowPressed = true;
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, () => { btn.classList.remove("on"); ctl[a] = false; });
  }
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Hero ----------
  function updateHero(dt) {
    const h = hero;
    h.inv = Math.max(0, h.inv - dt);
    const mv = (ctl.right ? 1 : 0) - (ctl.left ? 1 : 0);
    h.vx = mv * SPEED;
    if (mv) { h.face = mv; h.walk += dt * 12; }
    if (jumpPressed && h.ground) { h.vy = -JUMP; sfx.jump(); }
    jumpPressed = false;
    moveBody(h, dt, 6);
    blowT -= dt;
    if (blowPressed && blowT <= 0 && bubbles.length < 10) {
      bubbles.push({ x: h.x + h.face * 10, y: h.y - 8, vx: h.face * 300, vy: 0, t: 0, trapped: null, life: 9, wob: Math.random() * 6 });
      blowT = 0.28; sfx.blow();
    }
    blowPressed = false;
  }

  // ---------- Bubbles ----------
  function updateBubbles(dt) {
    const h = hero;
    for (const b of bubbles) {
      b.t += dt;
      if (b.t < 0.32 && !b.trapped) {
        // just blown: flies straight and catches a monster
        b.x += b.vx * dt; b.vx *= 1 - dt * 4;
        if (b.x < 2 * T + 8 || b.x > W - 2 * T - 8) { b.x = clamp(b.x, 2 * T + 8, W - 2 * T - 8); b.t = 0.32; }
        for (const e of enemies) {
          if (e.trapped || e.drop > 0 || e.dead) continue;
          if (Math.abs(e.x - b.x) < 14 && Math.abs(e.y - 8 - b.y) < 14) {
            e.trapped = true; b.trapped = e; b.t = 0.32;
            b.hold = (6.5 - Math.min(3, level * 0.25)) * diff.hold; sfx.trap();
            break;
          }
        }
      } else {
        // floating up, then drifting towards the middle of the ceiling
        const top = HUD + 2 * T + 10;
        b.vy += ((b.y > top ? -40 : 0) - b.vy) * Math.min(1, dt * 2);
        b.y += b.vy * dt + Math.sin(b.t * 3 + b.wob) * 0.3;
        if (b.y <= top) { b.y = top; b.x += (W / 2 + Math.sin(b.wob) * 60 - b.x) * Math.min(1, dt * 0.5); }
        b.x += Math.sin(b.t * 2 + b.wob) * 8 * dt;
        b.x = clamp(b.x, 2 * T + 8, W - 2 * T - 8);
      }
      if (b.trapped) {
        b.trapped.x = b.x; b.trapped.y = b.y + 8;
        b.hold -= dt;
        if (b.hold <= 0) {
          // the monster breaks free, angry and faster
          const e = b.trapped; e.trapped = false; e.angry = true; e.vy = -150; b.gone = true;
          sfx.escape(); burst(b.x, b.y, "#8ae0ff", 8, 80);
        }
      } else if (b.t > b.life) b.gone = true;
      if (b.gone || b.t < 0.2) continue;
      // touching a bubble: bounce on it with jump held, otherwise pop it
      if (!h.dead && Math.abs(b.x - h.x) < 15 && Math.abs(b.y - (h.y - 8)) < 16) {
        if (!b.trapped && ctl.jump && h.vy > 0 && h.y - 8 < b.y) { h.vy = -JUMP * 0.95; sfx.bounce(); }
        else popChain(b);
      }
    }
    bubbles = bubbles.filter((b) => !b.gone);
  }
  function popChain(first) {
    // bubbles touching a popped one pop too; every monster in the chain doubles the points
    const queue = [first], seen = new Set([first]);
    let kills = 0;
    while (queue.length) {
      const b = queue.shift();
      b.gone = true;
      if (b.trapped) {
        const e = b.trapped; e.dead = true; kills++;
        const pts = 1000 * 2 ** (kills - 1);
        addScore(pts, b.x, b.y - 12, "#ffd34d");
        sfx.pop(kills);
        const f = FRUITS[Math.min(FRUITS.length - 1, kills - 1 + Math.floor(loopN()))];
        fruits.push({ ...f, x: b.x, y: b.y, vx: rnd(-80, 80), vy: -220, ground: false, t: 0 });
        burst(b.x, b.y, "#8ae0ff", 14, 140);
      } else { addScore(10); sfx.popEmpty(); burst(b.x, b.y, "#8ae0ff", 6, 70); }
      for (const o of bubbles) if (!seen.has(o) && !o.gone && Math.hypot(o.x - b.x, o.y - b.y) < 30) { seen.add(o); queue.push(o); }
    }
    enemies = enemies.filter((e) => !e.dead);
  }

  // ---------- Monsters ----------
  function updateEnemies(dt) {
    const h = hero;
    for (const e of enemies) {
      e.t += dt;
      if (e.trapped) continue;
      if (e.drop > 0) { e.drop -= dt; continue; }
      const sp = (e.angry ? 70 : 38) * diff.speed * (1 + Math.min(0.5, level * 0.04));
      e.vx = e.face * sp;
      // at the end of a platform: turn round or drop down
      if (e.ground) {
        const ahead = Math.floor((e.x + e.face * 9) / T), r = Math.floor((e.y - HUD) / T);
        if (!isPlat(ahead, r) && Math.random() < 0.5) e.face = -e.face;
        e.jumpT -= dt;
        // jumps up towards the hero when he is higher up
        if (e.jumpT <= 0) { e.jumpT = rnd(2, 4); if (h.y < e.y - 20 && Math.random() < 0.7) e.vy = -JUMP; else if (Math.random() < 0.3) e.face = Math.sign(h.x - e.x) || e.face; }
      }
      moveBody(e, dt, 6);
      if (e.hitWall) e.face = -e.face;
      if (e.kind === "thrower") {
        e.throwT -= dt;
        if (e.throwT <= 0 && Math.abs(h.y - e.y) < 20 && Math.sign(h.x - e.x) === e.face) {
          e.throwT = rnd(2, 3.5);
          rocks.push({ x: e.x + e.face * 8, y: e.y - 8, vx: e.face * 150 * diff.speed, t: 0 });
          sfx.rock();
        }
      }
      if (Math.abs(e.x - h.x) < 11 && Math.abs(e.y - h.y) < 12) killHero();
    }
    for (const r of rocks) {
      r.t += dt; r.x += r.vx * dt;
      if (r.x < 2 * T || r.x > W - 2 * T) r.gone = true;
      if (Math.abs(r.x - h.x) < 10 && Math.abs(r.y - (h.y - 8)) < 10) { r.gone = true; killHero(); }
    }
    rocks = rocks.filter((r) => !r.gone);
    // taking too long: hurry up, then the ghost comes
    const hurryAt = 45 + Math.min(15, level * 2), ghostAt = hurryAt + 12;
    if (!hurried && levelT > hurryAt && enemies.length) { hurried = true; for (const e of enemies) e.angry = true; message = { text: "SBRIGATI!", t: 0 }; sfx.hurry(); }
    if (!ghost && levelT > ghostAt && enemies.length) ghost = { x: W / 2, y: HUD + 10 };
    if (ghost) {
      const dx = h.x - ghost.x, dy = h.y - 10 - ghost.y, d = Math.hypot(dx, dy) || 1, v = 52 * diff.speed;
      ghost.x += dx / d * v * dt; ghost.y += dy / d * v * dt;
      if (d < 14) killHero();
    }
  }
  function updateFruits(dt) {
    const h = hero;
    for (const f of fruits) {
      f.t += dt;
      moveBody(f, dt, 6);
      if (f.ground) f.vx = 0;
      if (f.t > 0.4 && Math.abs(f.x - h.x) < 14 && Math.abs(f.y - h.y) < 16) {
        f.gone = true; addScore(f.pts, f.x, f.y - 16, f.c); sfx.fruit(FRUITS.indexOf(FRUITS.find((q) => q.name === f.name)));
      }
      if (f.t > 9) f.gone = true;
    }
    fruits = fruits.filter((f) => !f.gone);
  }

  function update(dt) {
    clock += dt;
    sfxN = 0;
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 150 * dt; }
    parts = parts.filter((q) => q.t < q.life);
    for (const q of popups) { q.t += dt; q.y -= 22 * dt; }
    popups = popups.filter((q) => q.t < (q.big ? 1.6 : 0.9));
    if (message) { message.t += dt; if (message.t > 2) message = null; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; for (const e of enemies) if (e.drop > 0) e.drop -= dt * 0.3; if (stateT <= 0) state = "play"; return; }
    if (state === "dead") { stateT -= dt; if (stateT <= 0) afterDeath(); return; }
    if (state === "clear") {
      stateT -= dt; updateHero(dt); updateFruits(dt); updateBubbles(dt);
      if (stateT <= 0) { level++; buildLevel(); }
      return;
    }
    levelT += dt;
    updateHero(dt);
    updateBubbles(dt);
    if (state !== "play") return;
    updateEnemies(dt);
    if (state !== "play") return;
    updateFruits(dt);
    if (!enemies.length) {
      // a few seconds to pick up the fruit, then on to the next level
      clearT += dt;
      if (clearT > 3.2 || (!fruits.length && clearT > 1)) {
        message = { text: "LIVELLO SUPERATO!", t: 0 };
        sfx.clear(); state = "clear"; stateT = 1.8; ghost = null;
      }
    }
  }

  // ---------- Drawing ----------
  function drawTiles() {
    const c = LV().color;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      const v = grid[r][col];
      if (!v) continue;
      const x = col * T, y = rowTop(r);
      ctx.fillStyle = c; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(x + 1, y + 1, T - 2, 3);
      ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(x + 1, y + T - 4, T - 2, 3);
      ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(x + 4, y + 6, 8, 4);
    }
  }
  function drawDragon(x, y, face, walk, color, blowing) {
    ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
    const step = Math.sin(walk) * 2;
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, -8, 8, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff6c8"; ctx.beginPath(); ctx.ellipse(2, -6, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; ctx.fillRect(-5, -2, 4, 3 + step); ctx.fillRect(2, -2, 4, 3 - step);
    // spines and big eye
    ctx.fillStyle = "#fff"; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-7 + i * 3, -15 + i); ctx.lineTo(-9 + i * 3, -19 + i); ctx.lineTo(-5 + i * 3, -15 + i); ctx.fill(); }
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(4, -11, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1a3a"; ctx.fillRect(5, -12, 2, 3);
    if (blowing) { ctx.fillStyle = "#ff8aa8"; ctx.beginPath(); ctx.arc(8, -7, 2.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function drawMonster(e) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face, 1);
    const body = e.angry ? "#ff4a4a" : e.kind === "thrower" ? "#b85aff" : "#e8e8f8";
    const step = Math.sin(e.t * 14) * 2;
    if (e.kind === "walker") {
      // wind-up robot
      ctx.fillStyle = body; ctx.fillRect(-7, -14, 14, 12);
      ctx.fillStyle = e.angry ? "#8a1a1a" : "#5a5a8a"; ctx.fillRect(-6, -9, 12, 3);
      ctx.fillStyle = "#1a1a3a"; ctx.fillRect(1, -12, 3, 3);
      ctx.fillStyle = "#ffd34d"; ctx.fillRect(-10, -12 + Math.sin(e.t * 20) * 2, 3, 6);
      ctx.fillStyle = body; ctx.fillRect(-6, -2, 4, 2 + step); ctx.fillRect(2, -2, 4, 2 - step);
    } else {
      // hooded ghost that throws rocks
      ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-8, -16, 0, -16); ctx.quadraticCurveTo(8, -16, 8, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1a1a3a"; ctx.beginPath(); ctx.ellipse(2, -9, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd34d"; ctx.fillRect(1, -10, 2, 2); ctx.fillRect(4, -10, 2, 2);
    }
    ctx.restore();
  }
  function drawFruit(f) {
    const x = f.x, y = f.y - 7;
    if (f.t > 7 && Math.floor(clock * 10) % 2) return;
    ctx.fillStyle = f.c;
    if (f.name === "ciliegie") { ctx.beginPath(); ctx.arc(x - 3, y + 2, 4, 0, Math.PI * 2); ctx.arc(x + 4, y + 3, 4, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#3a8a2a"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 3, y - 2); ctx.lineTo(x + 1, y - 7); ctx.lineTo(x + 4, y - 1); ctx.stroke(); }
    else if (f.name === "banana") { ctx.strokeStyle = f.c; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(x, y - 4, 7, 0.4, 2.7); ctx.stroke(); }
    else if (f.name === "anguria") { ctx.beginPath(); ctx.arc(x, y - 1, 7, 0, Math.PI); ctx.fill(); ctx.fillStyle = "#ff4a5a"; ctx.beginPath(); ctx.arc(x, y - 1, 5, 0, Math.PI); ctx.fill(); }
    else if (f.name === "torta") { ctx.fillRect(x - 7, y - 3, 14, 8); ctx.fillStyle = "#fff"; ctx.fillRect(x - 7, y - 5, 14, 3); ctx.fillStyle = "#ff3a4a"; ctx.beginPath(); ctx.arc(x, y - 7, 2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 7, y - 1); ctx.lineTo(x, y + 6); ctx.lineTo(x - 7, y - 1); ctx.closePath(); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(x - 2, y - 4, 3, 3); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#06061a"; ctx.fillRect(0, 0, W, H);
    if (!hero) return;
    // soft background dots
    ctx.fillStyle = "rgba(138,224,255,0.05)";
    for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc((i * 131) % W, HUD + (i * 71) % (H - HUD), 6 + (i % 3) * 4, 0, Math.PI * 2); ctx.fill(); }
    drawTiles();
    for (const f of fruits) drawFruit(f);
    for (const e of enemies) { if (e.drop > 0 && state === "intro") { ctx.globalAlpha = 0.4; drawMonster(e); ctx.globalAlpha = 1; } else if (!e.trapped) drawMonster(e); }
    for (const r of rocks) { ctx.fillStyle = "#9a8a78"; ctx.beginPath(); ctx.arc(r.x, r.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#6a5a48"; ctx.fillRect(r.x - 2, r.y - 1, 3, 2); }
    // bubbles
    for (const b of bubbles) {
      const escaping = b.trapped && b.hold < 1.5;
      const r = 11 + (escaping ? Math.sin(clock * 30) * 1.5 : 0);
      if (b.trapped) {
        ctx.save(); ctx.globalAlpha = 0.9; ctx.translate(b.x, b.y + 8); ctx.scale(0.8, 0.8);
        drawMonster({ ...b.trapped, x: 0, y: 0, face: 1 });
        ctx.restore();
      }
      const tint = b.trapped ? (escaping ? "rgba(255,90,90,0.35)" : "rgba(90,255,106,0.28)") : "rgba(138,224,255,0.22)";
      ctx.fillStyle = tint; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = b.trapped ? (escaping ? "#ff8a8a" : "#8aff9a") : "#8ae0ff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.ellipse(b.x - 4, b.y - 5, 3, 2, -0.6, 0, Math.PI * 2); ctx.fill();
    }
    if (ghost) {
      ctx.save(); ctx.translate(ghost.x, ghost.y);
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(0, 0, 11, Math.PI, 0); ctx.lineTo(11, 10); for (let i = 0; i < 4; i++) ctx.lineTo(11 - (i + 0.5) * 5.5, 10 - (i % 2 ? 0 : 5)); ctx.lineTo(-11, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1a1a3a"; ctx.beginPath(); ctx.arc(-4, -1, 3, 0, Math.PI * 2); ctx.arc(4, -1, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const h = hero;
    if (!(h.inv > 0 && !h.dead && Math.floor(clock * 12) % 2)) {
      if (h.dead) { ctx.save(); ctx.translate(h.x, h.y - 8); ctx.rotate((2 - stateT) * 8); ctx.translate(-h.x, -(h.y - 8)); }
      drawDragon(h.x, h.y, h.face, h.walk, "#5aff6a", blowT > 0.12);
      if (h.dead) ctx.restore();
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 20px system-ui, sans-serif" : "900 12px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "#06061a"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f4f8ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.font = "700 10px system-ui, sans-serif"; ctx.fillStyle = "#a8b0d8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 90, 12);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#5aff6a"; ctx.beginPath(); ctx.arc(206 + i * 13, 12, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(207 + i * 13, 9, 2, 2); }
    ctx.textAlign = "center"; ctx.fillStyle = "#ff8aa8"; ctx.font = "800 11px system-ui, sans-serif";
    ctx.fillText(`MOSTRI ${enemies.length}`, 330, 12);
    ctx.textAlign = "right"; ctx.fillStyle = LV().color;
    ctx.fillText(`LIVELLO ${level + 1}`, W - 8, 12);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui, sans-serif"; ctx.lineWidth = 5; ctx.strokeStyle = "#06061a";
      ctx.strokeText(message.text, W / 2, H / 2 - 20); ctx.fillStyle = message.text === "SBRIGATI!" ? "#ff5a5a" : "#ffd34d"; ctx.fillText(message.text, W / 2, H / 2 - 20);
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, H / 2 + 4); ctx.fillStyle = "#f4f8ff"; ctx.fillText(message.sub, W / 2, H / 2 + 4); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildLevel(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="draghi-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Volo Fantastico</title>
<style>
  :root {
    --bg: #12061e;
    --fg: #fff0fa;
    --muted: #c8a8d8;
    --pink: #ff5ac8;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --cyan: #4ae8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a1a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 240, 250, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to fly anywhere on the screen, one button to fire (hold it) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(74, 232, 255, 0.6); background: radial-gradient(circle, rgba(74,232,255,0.14), rgba(74,232,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(74, 232, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(255,240,250,0.25); pointer-events: none; }
  #touch .fire { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 90, 200, 0.9); background: rgba(255, 90, 200, 0.22); }
  #touch .fire.on { background: rgba(255, 90, 200, 0.6); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 6, 30, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #3a0a3a, 0 0 22px rgba(255,90,200,0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--cyan); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 580px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,240,250,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0020; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #8a2a6a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  // the view: a camera behind the hero, looking at a ground that rushes toward it
  const HZ = 150, F = 300, CAM = 120, CAMH = 84, ZFAR = 1900, TILE_X = 64, TILE_Z = 90;
  const XMAX = 160, YMIN = 4, YMAX = 128, STAGE_T = 42, SEG_GAP = 22;

  const THEMES = [
    { name: "Valle dei Funghi", sky: ["#ff8ac8", "#ffd8a0"], hills: "#c85aa8", g1: "#f0d040", g2: "#58c048", deco: "mushroom" },
    { name: "Deserto di Cristallo", sky: ["#2a4ac8", "#a8d8ff"], hills: "#5a6ad8", g1: "#e8c080", g2: "#c89858", deco: "crystal" },
    { name: "Mare di Nuvole", sky: ["#4ab0f0", "#e8f8ff"], hills: "#ffffff", g1: "#e8f4ff", g2: "#7ab8f0", deco: "cloud" },
    { name: "Pianeta Rosso", sky: ["#2a0a1a", "#c83a2a"], hills: "#5a1a1a", g1: "#c85a3a", g2: "#6a2a1a", deco: "spire" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · nemici lenti, colpi radi", lives: 5, pace: 0.95, fire: 1.05, density: 1.1 },
    normale:   { label: "NORMALE",   color: "#ff5ac8", desc: "3 vite · l'esperienza classica", lives: 3, pace: 1.05, fire: 1.2, density: 1.2 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 vite · più nemici, colpi più fitti e veloci", lives: 3, pace: 1.18, fire: 1.45, density: 1.45 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "volo-difficulty";
  const bestKey = (id) => `volo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(900, 0.05, "square", 0.018, -500)),
    pop: lim(() => noise(0.12, 0.12, 1800)),
    boom: lim(() => { noise(0.35, 0.25, 500); beep(90, 0.25, "sine", 0.06, -50); }),
    fire: lim(() => beep(220, 0.18, "sawtooth", 0.02, -120)),
    clang: lim(() => beep(1200, 0.04, "square", 0.02, -400)),
    warn: () => arp([880, 660, 880, 660, 880, 660], 0.14, 0.12, "square", 0.035),
    hit: () => { noise(0.4, 0.3, 700); arp([523, 392, 311, 262], 0.08, 0.14, "triangle", 0.05); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    start: () => arp([392, 523, 659, 784, 1047], 0.08, 0.14),
    life: () => arp([784, 988, 1175, 1568], 0.07, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, hitFrom = "play", stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, loop = 0, bestCache = 0, nextLife = 40000;
  let P = { x: 0, y: 40, inv: 0, cool: 0, run: 0, tilt: 0 }, dist = 0, stageT = 0, waveT = 0, decoT = 0, boss = null;
  let objs = [], bullets = [], parts = [], popups = [], message = null;
  let firing = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const theme = () => THEMES[stage % THEMES.length];
  const pace = () => diff.pace * (1 + loop * 0.15 + (stage % THEMES.length) * 0.04);
  const speed = () => 430 * pace();

  // ---------- Projection ----------
  let cx = 0;
  const scaleAt = (z) => F / (z + CAM);
  const projX = (x, z) => W / 2 + (x - cx) * scaleAt(z);
  const projY = (y, z) => HZ + (CAMH - y) * scaleAt(z);

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "boss", "hit", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; loop = 0; nextLife = 40000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginStage();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginStage() {
    objs = []; bullets = []; boss = null;
    P = { x: 0, y: 40, inv: 1.5, cool: 0, run: 0, tilt: 0 };
    stageT = 0; waveT = 3; decoT = 0;
    message = { text: `STAGE ${stage + 1}`, sub: theme().name, t: 0 };
    state = "intro"; stateT = 2;
  }
  function addScore(n, x, y, z, color = "#fff0fa") {
    score += n;
    if (x !== undefined) popups.push({ x, y, z, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 40000; if (lives < 9) { lives++; sfx.life(); popups.push({ x: P.x, y: P.y + 30, z: 0, text: "VITA EXTRA", color: "#ffe04a", t: 0 }); } }
  }
  function burst(x, y, z, c, n = 12, sp = 160, life = 0.5) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, b = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, z, vx: Math.cos(a) * Math.sin(b) * s, vy: Math.sin(a) * Math.sin(b) * s, vz: Math.cos(b) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function hurt(why) {
    if (P.inv > 0 || (state !== "play" && state !== "boss")) return;
    lives--;
    sfx.hit();
    burst(P.x, P.y, 0, "#ff5ac8", 20, 200, 0.6);
    message = { text: "COLPITO!", sub: lives > 0 ? `Ne restano ${lives}` : "", t: 0 };
    hitFrom = state; state = "hit"; stateT = 1.6;
    (window.__hits = window.__hits || []).push(why);
  }
  function afterHit() {
    if (lives <= 0) { gameOver(); return; }
    // a clear moment: fireballs gone, nothing right on top of you
    objs = objs.filter((o) => o.kind !== "fireball" && !(o.z < 320 && o.z > -CAM));
    P.inv = 2.5;
    state = hitFrom === "boss" ? "boss" : "play";
  }
  function stageClear() {
    const bonus = 5000 + 2000 * stage;
    addScore(bonus);
    message = { text: "STAGE COMPLETATO!", sub: `Bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3.2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, st = stage + 1;
    menu = () => showOverlay(
      `<h2 class="lose">FINE DEL VOLO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Stage ${st} · ${played}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>VOLO FANTASTICO</h1>
       <p>Con il cannone e lo zaino a razzo voli sopra mondi fantastici che ti corrono incontro. Muoviti in tutto lo schermo per schivare ostacoli, nemici e palle di fuoco, e spara dritto davanti a te. In fondo a ogni stage ti aspetta un drago.</p>
       <div class="pts">
         <span><b>Palle di fuoco</b></span><span>vanno dove eri quando sono partite: spostati e ti mancano</span>
         <span><b>Colonne</b></span><span>troppo alte da sorvolare e indistruttibili: passa di lato</span>
         <span><b>Nemici</b></span><span>caccia 200 · anelli 300 (poi ti puntano) · robot 1.000 (cinque colpi)</span>
         <span><b>Il drago</b></span><span>colpisci la testa: il corpo para i colpi. 5.000 punti</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per volare in tutto lo schermo · FUOCO (tieni premuto)</p>`
         : `<p class="muted help">Frecce o WASD per volare · SPAZIO, J o Z fuoco (tieni premuto) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SI VOLA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const FIRE_KEYS = [" ", "j", "z", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (FIRE_KEYS.includes(k)) firing = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (FIRE_KEYS.includes(k)) firing = false;
    if (KEYMAP[k]) keys[KEYMAP[k]] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; firing = false; if (isPlaying()) togglePause(); });
  const fireBtn = touchEl.querySelector(".fire");
  let fireId = null;
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); fireId = e.pointerId; try { fireBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } firing = true; fireBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, (e) => { if (e.pointerId !== fireId) return; fireId = null; firing = false; fireBtn.classList.remove("on"); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.12 ? 0 : sign(v) * Math.min(1, (a - 0.12) / 0.7); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);

      const gy = projY(0, z), step = Math.sin(o.t * 6) * 8 * s, w = 26 * s;
      ctx.fillStyle = o.flash > 0 ? "#fff" : "#4a4a6a";
      ctx.fillRect(X - w * 0.7 + step * 0.3, projY(30, z), w * 0.35, gy - projY(30, z) - Math.max(0, step));
      ctx.fillRect(X + w * 0.35 - step * 0.3, projY(30, z), w * 0.35, gy - projY(30, z) - Math.max(0, -step));
      ctx.fillStyle = o.flash > 0 ? "#fff" : "#6a6a9a"; ctx.beginPath(); ctx.ellipse(X, projY(44, z), w, w * 0.62, 0, 0, TAU); ctx.fill();
      const glow = o.cool < 0.5 && Math.floor(o.cool * 12) % 2 === 0;
      ctx.fillStyle = glow ? "#ffe04a" : "#ff3a3a"; ctx.beginPath(); ctx.arc(X, projY(48, z), w * 0.25, 0, TAU); ctx.fill();
      ctx.fillStyle = "#2a2a3a"; ctx.fillRect(X - w * 0.9, projY(52, z), w * 1.8, 4 * s);
    } else if (o.kind === "fireball") {
      shadow(o.x, z, 8);
      const r = Math.max(2, o.r * s), g = ctx.createRadialGradient(X, Y, 0, X, Y, r * 1.6);
      g.addColorStop(0, "#fffae0"); g.addColorStop(0.35, "#ffb43a"); g.addColorStop(0.7, "rgba(255,70,30,0.8)"); g.addColorStop(1, "rgba(255,40,20,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, r * 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawBoss() {
    const b = boss; if (!b) return;
    const segs = [];
    for (let i = 0; i < 9; i++) { const s = b.trail[i * SEG_GAP]; if (s) segs.push({ ...s, i }); }
    segs.sort((a, c) => c.z - a.z);
    const th = theme(), body = th.deco === "spire" ? "#3a8a3a" : th.deco === "cloud" ? "#8a4ad8" : th.deco === "crystal" ? "#e85a3a" : "#3a7ae8";
    for (const s of segs) {
      if (b.dead && Math.random() < 0.5) continue;
      const sc = scaleAt(s.z), X = projX(s.x, s.z), Y = projY(s.y, s.z), head = s.i === 0;
      shadow(s.x, s.z, head ? 30 : 20);
      const r = (head ? 34 : 24 - s.i) * sc;
      ctx.fillStyle = head && b.flash > 0 ? "#fff" : body; ctx.beginPath(); ctx.arc(X, Y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.arc(X - r * 0.3, Y - r * 0.35, r * 0.4, 0, TAU); ctx.fill();
      if (!head) { ctx.fillStyle = "#ffe04a"; ctx.beginPath(); ctx.moveTo(X - r * 0.3, Y - r * 0.9); ctx.lineTo(X, Y - r * 1.5); ctx.lineTo(X + r * 0.3, Y - r * 0.9); ctx.fill(); }
      else {
        // eyes, horns, a jaw that opens before it spits
        const open = b.cool < 0.5 ? (0.5 - b.cool) * 2 : 0;
        ctx.fillStyle = "#ffe04a"; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(X + d * r * 0.5, Y - r * 0.7); ctx.lineTo(X + d * r * 0.9, Y - r * 1.5); ctx.lineTo(X + d * r * 0.2, Y - r * 0.9); ctx.fill(); }
        ctx.fillStyle = "#fff"; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(X + d * r * 0.38, Y - r * 0.2, r * 0.2, 0, TAU); ctx.fill(); }
        ctx.fillStyle = "#1a1a1a"; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(X + d * r * 0.38, Y - r * 0.15, r * 0.1, 0, TAU); ctx.fill(); }
        ctx.fillStyle = "#8a0a1a"; ctx.beginPath(); ctx.ellipse(X, Y + r * 0.45, r * 0.55, r * (0.12 + open * 0.3), 0, 0, TAU); ctx.fill();
        if (open > 0.3) { ctx.fillStyle = "#ffb43a"; ctx.beginPath(); ctx.arc(X, Y + r * 0.45, r * 0.18 * open, 0, TAU); ctx.fill(); }
      }
    }
  }
  function drawHero() {
    if (state === "hit" || state === "menu" || state === "over") return;
    if (P.inv > 0 && Math.floor(P.inv * 10) % 2 === 0) return;
    const s = scaleAt(0), X = projX(P.x, 0), Y = projY(P.y, 0);
    shadow(P.x, 0, 12);
    ctx.save(); ctx.translate(X, Y); ctx.scale(s / 2.5, s / 2.5); ctx.rotate(P.tilt * 0.18);
    const run = P.y < 10;
    // jetpack flame
    if (!run) { const f = 10 + Math.sin(clock * 40) * 3; ctx.fillStyle = "#ffb43a"; ctx.beginPath(); ctx.moveTo(-5, 14); ctx.lineTo(5, 14); ctx.lineTo(0, 14 + f); ctx.fill(); ctx.fillStyle = "#fff4a0"; ctx.beginPath(); ctx.moveTo(-2.5, 14); ctx.lineTo(2.5, 14); ctx.lineTo(0, 14 + f * 0.6); ctx.fill(); }
    ctx.fillStyle = "#6a6a7a"; ctx.fillRect(-7, -6, 14, 20);
    // legs
    ctx.fillStyle = "#2a3a8a";
    const lg = run ? Math.sin(P.run) * 7 : 3;
    ctx.fillRect(-8, 10, 6, 14 + lg); ctx.fillRect(2, 10, 6, 14 - lg);
    // body and arms, the cannon under the right arm
    ctx.fillStyle = "#e83a3a"; ctx.fillRect(-10, -12, 20, 24);
    ctx.fillStyle = "#b8b8c8"; ctx.fillRect(4, -2, 22, 8); ctx.fillStyle = "#6a6a7a"; ctx.fillRect(22, -3, 6, 10);
    ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(0, -19, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.arc(0, -22, 8.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); ctx.fillRect(-9, -23, 4, 8);
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(18,6,30,0.55)"; ctx.fillRect(0, 0, W, 30);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#fff0fa"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 10, 11);
    ctx.fillStyle = "#c8a8d8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 10, 24);
    ctx.textAlign = "center"; ctx.fillStyle = "#ff5ac8"; ctx.font = "800 11px system-ui";
    ctx.fillText(`STAGE ${stage + 1} · ${theme().name.toUpperCase()}`, W / 2, 10);
    if (boss && !boss.dead) {
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(W / 2 - 90, 19, 180, 6);
      ctx.fillStyle = "#ff4a3a"; ctx.fillRect(W / 2 - 90, 19, 180 * boss.hp / boss.max, 6);
    } else if (state !== "menu") {
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(W / 2 - 90, 19, 180, 4);
      ctx.fillStyle = "#4ae8ff"; ctx.fillRect(W / 2 - 90, 19, 180 * clamp(stageT / STAGE_T, 0, 1), 4);
    }
    ctx.textAlign = "right"; ctx.fillStyle = "#ff5ac8"; ctx.font = "800 13px system-ui"; ctx.fillText(`♥×${Math.max(0, lives)}`, W - 10, 15);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu") { dist += 3; if (Math.random() < 0.05) spawnDeco(); for (const o of objs) o.z -= 3; objs = objs.filter((o) => o.z > -CAM + 25); }
    drawWorld();
    // far to near: everything in front of the hero is drawn after him
    const list = objs.filter((o) => o.kind !== "boss" && o.z >= 0).sort((a, b) => b.z - a.z);
    const bz = boss ? boss.z : -1;
    let bossDone = !boss;
    for (const o of list) { if (!bossDone && o.z < bz) { drawBoss(); bossDone = true; } drawObj(o); }
    if (!bossDone) drawBoss();
    // shots in flight
    for (const b of bullets) {
      const s = scaleAt(b.z), X = projX(b.x, b.z), Y = projY(b.y, b.z), r = Math.max(1.5, 5 * s);
      ctx.fillStyle = "rgba(74,232,255,0.4)"; ctx.beginPath(); ctx.arc(X, Y, r * 1.8, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e8fcff"; ctx.beginPath(); ctx.arc(X, Y, r, 0, TAU); ctx.fill();
    }
    for (const p of parts) {
      if (p.z < -CAM + 30) continue;
      const s = scaleAt(p.z); ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c;
      const r = Math.max(1, 3 * s); ctx.fillRect(projX(p.x, p.z) - r, projY(p.y, p.z) - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    drawHero();
    for (const o of objs.filter((q) => q.kind !== "boss" && q.z < 0).sort((a, b) => b.z - a.z)) drawObj(o);
    for (const p of popups) {
      if (p.z < -CAM + 30) continue;
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 12px system-ui";
      const X = projX(p.x, p.z), Y = projY(p.y, p.z);
      ctx.lineWidth = 3; ctx.strokeStyle = "#12061e"; ctx.strokeText(p.text, X, Y); ctx.fillStyle = p.color; ctx.fillText(p.text, X, Y);
    }
    ctx.globalAlpha = 1;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 30px system-ui";
      ctx.lineWidth = 6; ctx.strokeStyle = "#12061e"; ctx.strokeText(message.text, W / 2, 96); ctx.fillStyle = "#ff5ac8"; ctx.fillText(message.text, W / 2, 96);
      if (message.sub) { ctx.font = "800 13px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 118); ctx.fillStyle = "#fff0fa"; ctx.fillText(message.sub, W / 2, 118); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

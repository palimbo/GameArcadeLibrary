<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Il Cavaliere Temerario</title>
<style>
  :root {
    --bg: #0c0a14;
    --fg: #f4f6ee;
    --muted: #d0e0d8;
    --pink: #5ae8c8;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: push it the right way when the danger comes (up, down, left, right); SPADA strikes */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(90, 232, 200, 0.6); background: radial-gradient(circle, rgba(90,232,200,0.14), rgba(90,232,200,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(90, 232, 200, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(90, 232, 200, 0.9); background: rgba(90, 232, 200, 0.22); }
  #touch .jump.on { background: rgba(90, 232, 200, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 12, 20, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a2a, 0 0 22px rgba(90,232,200,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #022a22; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #1a8a72; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Spada">SPADA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const KX = W / 2, KY = 300;   // where the knight stands
  // a step of a scene: a danger, and the one move that saves the knight
  //   flames from a side (move away) · floor gives way (jump up to the ledge) · blade swings (duck down)
  //   boulder rolls in (jump up over it) · monster comes (SPADA) · exit opens on a side (run there) · rope over a gap (up)
  const DIR_OF = { flames: (s) => (s < 0 ? "right" : "left"), floor: () => "up", blade: () => "down", boulder: () => "up", monster: () => "sword", door: (s) => (s < 0 ? "left" : "right"), rope: () => "up" };
  const SCENES = [
    { name: "La sala delle torce", theme: 0, steps: [["flames", -1], ["monster", 1, "scheletro"], ["door", 1]] },
    { name: "Il ponte che crolla", theme: 1, steps: [["floor", 0], ["boulder", 1], ["door", -1]] },
    { name: "La cripta", theme: 2, steps: [["monster", -1, "scheletro"], ["blade", 0], ["monster", 1, "scheletro"], ["door", 1]] },
    { name: "La cucina del castello", theme: 3, steps: [["flames", 1], ["monster", -1, "goblin"], ["boulder", -1], ["door", 1]] },
    { name: "Il pozzo dei serpenti", theme: 4, steps: [["rope", 0], ["monster", 1, "serpente"], ["floor", 0], ["door", -1]] },
    { name: "La biblioteca stregata", theme: 5, steps: [["blade", 0], ["flames", -1], ["monster", 1, "pipistrello"], ["door", -1]] },
    { name: "Il fiume sotterraneo", theme: 6, steps: [["rope", 0], ["boulder", -1], ["monster", -1, "serpente"], ["door", 1]] },
    { name: "La sala del trono", theme: 7, steps: [["monster", 1, "goblin"], ["blade", 0], ["flames", 1], ["monster", -1, "scheletro"], ["door", 1]] },
  ];
  const LAIR = { name: "Il covo del drago", theme: 8, steps: [["flames", -1], ["flames", 1], ["boulder", 1], ["rope", 0], ["blade", 0], ["monster", 0, "drago"]], dragon: true };
  const THEMES = [
    { wall: "#3a3448", floor: "#2a2430", light: "#ffb03a" }, { wall: "#1a1a2a", floor: "#4a3a2a", light: "#8aa8ff" },
    { wall: "#2a3a34", floor: "#22302a", light: "#8affb0" }, { wall: "#4a3a2a", floor: "#3a2a1a", light: "#ff8a3a" },
    { wall: "#2a3a1a", floor: "#2a2a14", light: "#d8ff5a" }, { wall: "#3a2a4a", floor: "#2a1a34", light: "#c88aff" },
    { wall: "#1a2a3a", floor: "#14243a", light: "#5ad8ff" }, { wall: "#4a1a2a", floor: "#3a1420", light: "#ffd23a" },
    { wall: "#2a0a0a", floor: "#3a1a0a", light: "#ff5a2a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · sullo schermo compare la mossa da fare · più tempo per reagire", lives: 5, win: 1.15, arrow: true },
    normale:   { label: "NORMALE",   color: "#5ae8c8", desc: "4 vite · lampeggia il punto giusto: la mossa la capisci tu", lives: 4, win: 0.88, arrow: false },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · un lampo solo, e pochissimo tempo", lives: 3, win: 0.74, arrow: false },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "temerario-difficulty";
  const bestKey = (id) => `temerario-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    rumble: lim(() => beep(70, 0.5, "sawtooth", 0.04, -20)),
    flash: lim(() => beep(1320, 0.08, "square", 0.025)),
    ok: lim(() => arp([660, 990], 0.05, 0.08, "square", 0.035)),
    slash: lim(() => { beep(900, 0.08, "sawtooth", 0.03, -600); beep(200, 0.1, "square", 0.03, -80); }),
    fire: lim(() => beep(120, 0.6, "sawtooth", 0.04, 80)),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    roar: () => { beep(80, 0.8, "sawtooth", 0.07, 40); beep(55, 0.8, "square", 0.05); },
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 4, lap = 0, order = [], sceneN = 0, cleared = 0;
  let scene = null, stepI = 0, phase = "enter", phaseT = 0, step = null, message = null, popups = [], parts = [], deathKind = null;
  let cleanRun = 0, sceneDied = false, fastRun = 0;
  let actHeld = false, wasAct = false, lastDir = null;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const isPlaying = () => state === "play";
  const T = () => THEMES[scene.theme];
  const winT = () => diff.win / (1 + 0.2 * lap) * (scene && scene.dragon ? 0.85 : 1);

  // ---------- Flow ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function newLap() { order = shuffle(SCENES.map((_, i) => i)); sceneN = 0; }
  function startScene() {
    scene = sceneN < order.length ? SCENES[order[sceneN]] : LAIR;
    stepI = 0; sceneDied = false; step = null;
    message = { text: scene.dragon ? "IL COVO DEL DRAGO" : `${scene.name.toUpperCase()}`, sub: scene.dragon ? "la principessa Dafne è qui: attento al drago Brace!" : `stanza ${sceneN + 1} di ${SCENES.length + 1}${lap ? ` · giro ${lap + 1}` : ""}`, t: 0 };
    phase = "enter"; phaseT = 1.2;
    if (scene.dragon) sfx.roar();
  }
  function startStep() {
    const [kind, side, who] = scene.steps[stepI];
    step = { kind, side, who, dir: DIR_OF[kind](side), lead: rnd(0.9, 1.4), answered: false };
    phase = "build"; phaseT = 0;
    if (kind === "flames") sfx.fire(); else if (kind === "floor" || kind === "boulder") sfx.rumble();
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; lap = 0; cleared = 0; cleanRun = 0; fastRun = 0; popups = []; parts = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    newLap(); startScene();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, col = "#ffe8a0") {
    score += n; popups.push({ x: KX, y: KY - 90, text: `+${n.toLocaleString("it-IT")}`, col, t: 0 });
  }
  // the player's answer to the danger
  function answer(dir) {
    if (state !== "play") return;
    if (phase === "build") {
      // too early is fine only right before the moment; otherwise the knight jumps into trouble
      if (step.lead - phaseT > 0.3) return die(true);
    } else if (phase !== "window") return;
    if (step.answered) return;
    step.answered = true;
    if (dir !== step.dir) return die(false);
    const rt = phase === "window" ? phaseT : 0;
    const pts = Math.round((100 + 100 * clamp(1 - rt / winT(), 0, 1)) * (1 + 0.2 * sceneN) * (1 + 0.5 * lap));
    addScore(pts);
    if (rt < 0.4) { if (++fastRun === 5) impresa("fulmine"); } else fastRun = 0;
    if (step.kind === "monster") { sfx.slash(); burst(KX + step.side * 70, KY - 40, "#ffffff", 14); } else sfx.ok();
    phase = "success"; phaseT = 0;
  }
  function die(early) {
    deathKind = early ? "fumble" : step.kind;
    phase = "death"; phaseT = 0; sfx.die(); sceneDied = true; cleanRun = 0; fastRun = 0;
    message = { text: ["AHI!", "OH NO!", "ACCIDENTI!", "AIUTO!"][Math.floor(Math.random() * 4)], sub: early ? "troppo presto!" : !step.answered ? "troppo tardi!" : "mossa sbagliata!", t: 0 };
  }
  function burst(x, y, col, n = 10) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-140, 140), vy: rnd(-160, 40), t: 0, life: rnd(0.3, 0.7), col }); }
  function sceneClear() {
    cleared++;
    if (!sceneDied) { if (++cleanRun === 5) impresa("intatto"); }
    const bonus = Math.round(1000 * (sceneN + 1) * (1 + 0.5 * lap));
    if (scene.dragon) { impresa("drago"); addScore(10000 * (lap + 1), "#ffd23a"); lives++; sfx.oneup(); message = { text: "DAFNE È SALVA!", sub: "una vita in più · ma il drago Brace si risveglia... si ricomincia!", t: 0, long: true }; sfx.clear(); phase = "rescue"; phaseT = 0; return; }
    addScore(bonus);
    message = { text: "STANZA SUPERATA!", sub: `bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear(); phase = "clear"; phaseT = 0;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">IL CAVALIERE SI ARRENDE</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${cleared} ${cleared === 1 ? "stanza superata" : "stanze superate"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPROVA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>IL CAVALIERE TEMERARIO</h1>
       <p>Il drago Brace tiene prigioniera la principessa Dafne in fondo al castello. Il cavaliere Dario attraversa otto stanze piene di trappole e mostri, poi il covo del drago. In ogni stanza i pericoli arrivano uno dopo l'altro: quando qualcosa lampeggia, è il momento di agire. Una mossa sbagliata, troppo presto o troppo tardi, e si ricomincia la stanza.</p>
       <div class="pts">
         <span><b>Le mosse</b></span><span>levetta su (salta), giù (abbassati), a sinistra o a destra (scappa da quella parte) · SPADA contro i mostri</span>
         <span><b>Il lampo</b></span><span>lampeggia il punto giusto: l'uscita, il cornicione, la corda, il mostro, o il pavimento per abbassarsi ${diff.arrow ? "· a Facile compare anche la mossa" : ""}</span>
         <span><b>Punti</b></span><span>ogni pericolo superato 100-200 (di più se sei svelto) · stanza 1.000 × stanza · drago 10.000</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: una spinta nella direzione giusta · SPADA</p>`
         : `<p class="muted help">Frecce o WASD per le direzioni · SPAZIO o J spada · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>NEL CASTELLO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };

    drawHint();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); outlined(p.text, p.x, p.y, "900 13px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    ctx.textAlign = "center";
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3.2 : 2) - message.t) * 2);
      outlined(message.text, W / 2, 84, "italic 900 26px system-ui", "#5ae8c8", 6);
      if (message.sub) outlined(message.sub, W / 2, 106, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="temerario-best-" data-kind="score"></script>
</body>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Avventure Fresche</title>
<style>
  :root {
    --bg: #0e1a2e;
    --fg: #f4f8ff;
    --muted: #bcd4f0;
    --pink: #ffd23a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 248, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run, aim up, ground-pound down; the big SALTA jumps (held: Pinguì glides), NEVE throws, CAMBIA swaps hero */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(122, 216, 255, 0.6); background: radial-gradient(circle, rgba(122,216,255,0.14), rgba(122,216,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(122, 216, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,248,255,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
  #touch .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #touch .jump.snow { width: 66px; height: 66px; font-size: 10px; letter-spacing: 0; border-color: rgba(200, 240, 255, 0.95); background: rgba(200, 240, 255, 0.18); }
  #touch .jump.snow.on { background: rgba(200, 240, 255, 0.5); }
  #touch .jump.swap { width: 56px; height: 56px; font-size: 9px; letter-spacing: 0; border-color: rgba(255, 150, 200, 0.9); background: rgba(255, 150, 200, 0.16); }
  #touch .jump.swap.on { background: rgba(255, 150, 200, 0.5); }
  #touch.small .jump.snow { width: 56px; height: 56px; font-size: 9px; }
  #touch.small .jump.swap { width: 48px; height: 48px; font-size: 8px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 26, 46, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #1a4a8a, 0 0 22px rgba(122,216,255,0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 580px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,248,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2e2004; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8881a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <div class="col"><button type="button" class="jump swap" aria-label="Cambia personaggio">CAMBIA</button><button type="button" class="jump snow" aria-label="Palla di neve">NEVE</button></div>
    <button type="button" class="jump hop" aria-label="Salta">SALTA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

  "use strict";

    pingui: { name: "PINGUÌ", jump: 545, speed: 150, glide: true },

    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · 4 cuori · nemici lenti, restano congelati più a lungo", lives: 5, hearts: 4, tempo: 0.8, freeze: 7, boss: 0.8 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "3 vite · 3 cuori", lives: 3, hearts: 3, tempo: 1, freeze: 5, boss: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · 2 cuori · nemici e cattivi più veloci e più forti", lives: 3, hearts: 2, tempo: 1.2, freeze: 3.8, boss: 1.3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fresche-difficulty";
  const bestKey = (id) => `fresche-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  // the feats of shared/imprese.js: the game only announces them, the hall keeps them
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- The four worlds ----------
  // each level is built from a few strokes: G ground columns, R a block of tiles, PL a thin platform you can jump through,
  // E a thing (start, enemies, ingredients 1-6, hints, checkpoints, moving platforms, the boss door), DR a row of milk drops
  function LEVEL(w, build) {
    const g = Array.from({ length: ROWS }, () => Array(w).fill("."));
    const ents = [];
    const api = {
      G: (x0, x1, h) => { for (let x = x0; x <= x1; x++) for (let r = ROWS - h; r < ROWS; r++) g[r][x] = "#"; },
      R: (x, y, ww, hh, ch = "#") => { for (let c = x; c < x + ww; c++) for (let r = y; r < y + hh; r++) g[r][c] = ch; },
      PL: (x, y, ww) => { for (let c = x; c < x + ww; c++) g[y][c] = "="; },
      E: (kind, x, y, o) => ents.push({ kind, x, y, ...o }),
      DR: (x0, x1, y) => { for (let x = x0; x <= x1; x++) ents.push({ kind: "drop", x, y }); },
    };
    build(api);
    return { w, g, ents };
  }
  const WORLDS = [
    {
      id: "montagna", name: "LA MONTAGNA MISTERIOSA", boss: "iwan", bossName: "IWAN", bossDesc: "l'orso col colbacco",
      sky: ["#7ab8f0", "#d8ecff"], ground: "#6a7a90", top: "#ffffff", dark: "#4a5870", plank: "#b8e0f4",
      enemies: { walk: "marmotta", fly: "gufo", hop: "marmotta" },
      hints: [
        "Ciao, sono Paradiso! Corri con {MUOVI}, salta con {SALTA} e lancia palle di neve con {NEVE}. Ritrova i 6 ingredienti della ricetta!",
        "Salta i burroni! Se cadi giù perdi una vita.",
        "Quel muro di blocchi incrinati… Solo Fetta al Latte è abbastanza forte: premi {CAMBIA} per cambiare e spingili!",
        "Lassù c'è un ingrediente! Pinguì salta molto più in alto di Fetta al Latte.",
        "Un ingrediente chiuso in una grotta… chi sarà capace di aprirla?",
        "Con Pinguì tieni premuto {SALTA} mentre scendi: plana lontano!",
        "La porta si apre solo con tutti e 6 gli ingredienti. Dentro ti aspetta Iwan!",
      ],
      level: LEVEL(192, ({ G, R, PL, E, DR }) => {
        G(0, 20, 3); E("start", 3); E("hint", 6); DR(9, 17, 13); E("walk", 14, 14); E("hint", 18);
        G(24, 75, 3); R(30, 13, 11, 2); PL(32, 10, 5); E("ing", 34, 9, { n: 0 }); DR(25, 29, 13); E("walk", 38, 12);
        E("hint", 42); R(45, 3, 8, 9); R(45, 12, 1, 3, "C"); DR(47, 51, 14);
        E("chk", 56); E("fly", 61, 10); E("walk", 65, 14); E("hint", 67);
        R(70, 14, 2, 1); R(72, 10, 3, 1); E("ing", 73, 9, { n: 1 }); DR(77, 77, 10);
        G(79, 131, 3); R(84, 13, 3, 2); R(87, 11, 3, 4); R(90, 13, 3, 2); DR(85, 91, 9); E("walk", 88, 10);
        R(94, 14, 3, 1, "^"); E("hint", 99);
        R(102, 12, 4, 1); R(102, 13, 1, 2, "C"); E("ing", 104, 14, { n: 2 }); R(105, 13, 1, 2);
        E("fly", 110, 9); E("walk", 114, 14); E("chk", 118); E("walk", 122, 14); PL(125, 12, 3); E("ing", 126, 11, { n: 3 }); DR(119, 123, 13);
        G(135, 191, 3); E("hint", 136); R(138, 12, 2, 3); R(140, 9, 2, 6); PL(148, 9, 3); E("ing", 149, 8, { n: 4 }); DR(143, 146, 8);
        E("walk", 155, 14); E("fly", 160, 10); PL(165, 12, 4); E("ing", 167, 11, { n: 5 }); E("chk", 170); E("walk", 174, 14);
        DR(171, 176, 13); E("hint", 178); E("door", 182); R(189, 0, 3, 15);

      id: "valle", name: "LA VALLE MAGICA", boss: "octopus", bossName: "CAPITAN OCTOPUS", bossDesc: "il polpo pirata del lago",

      enemies: { walk: "riccio", fly: "ape", hop: "rana" },

      level: LEVEL(192, ({ G, R, PL, E, DR }) => {

        G(37, 95, 3); PL(40, 12, 4); E("ing", 42, 11, { n: 0 }); E("hop", 45, 14); R(48, 12, 6, 3); E("fly", 52, 8); DR(48, 53, 11);
        E("hint", 55); R(58, 2, 1, 10); R(58, 12, 1, 3, "C"); E("chk", 62); E("hint", 66);
        R(70, 15, 3, 1, "C"); R(70, 16, 3, 1, "."); E("ing", 71, 16, { n: 1 }); DR(74, 77, 13);

        G(99, 140, 3); R(104, 14, 3, 1, "^"); PL(110, 12, 3); E("ing", 111, 11, { n: 3 }); E("walk", 116, 14); E("hop", 122, 14);
        E("chk", 126); E("fly", 131, 9); DR(127, 139, 13);
        PL(143, 13, 2); PL(147, 12, 2); PL(150, 13, 2); PL(146, 8, 3); E("ing", 147, 7, { n: 4 });
        G(153, 191, 3); E("chk", 156); E("walk", 160, 14); E("hop", 166, 14); E("fly", 170, 9); PL(174, 12, 3); E("ing", 175, 11, { n: 5 });
        DR(157, 163, 13); E("hint", 178); E("door", 182); R(189, 0, 3, 15);
      }),
    },
    {
      id: "fabbrica", name: "LA FABBRICA SPAZIALE", boss: "titanius", bossName: "TITANIUS", bossDesc: "il robot gigante",
      sky: ["#120a2a", "#3a1a5a"], ground: "#5a6070", top: "#9aa4b8", dark: "#3a3e4a", plank: "#7a8aa8", space: true,
      enemies: { walk: "robot", fly: "drone", hop: "molla" },
      hints: [
        "La Fabbrica Spaziale! Occhio alle scariche elettriche sul pavimento.",
        "Il nastro volante ti porta oltre il pozzo.",
        "Lassù, in cima! È un salto per Pinguì.",

      ],

        G(0, 22, 3); E("start", 3); E("hint", 6); E("walk", 12, 14); R(16, 14, 3, 1, "^"); DR(15, 19, 11); E("hint", 21);
        E("mov", 24, 12, { w: 3, dx: 8 }); DR(26, 32, 10);
        G(35, 100, 3); PL(40, 12, 3); E("ing", 41, 11, { n: 0 }); E("hop", 46, 14); E("hint", 48); R(50, 12, 3, 3); R(53, 9, 3, 6);
        PL(57, 5, 3); E("ing", 58, 4, { n: 1 }); E("fly", 60, 8); E("hint", 61);
        R(64, 2, 1, 10); R(64, 12, 1, 3, "C"); E("ing", 66, 14, { n: 2 }); E("chk", 69); DR(67, 73, 13);
        E("walk", 75, 14); E("walk", 82, 14); E("hop", 88, 14); R(92, 14, 3, 1, "^");
        R(95, 15, 3, 1, "C"); R(95, 16, 3, 1, "."); E("ing", 96, 16, { n: 3 });
        G(104, 191, 3); E("hint", 105); E("mov", 108, 13, { w: 3, dy: -7 }); PL(112, 6, 4); E("ing", 114, 5, { n: 4 }); DR(112, 115, 4);
        E("fly", 120, 10); E("walk", 126, 14); E("chk", 128); E("walk", 132, 14);
        R(136, 13, 2, 2); R(138, 10, 2, 5); PL(146, 10, 3); E("ing", 147, 9, { n: 5 }); DR(141, 144, 9);
        E("walk", 155, 14); E("hop", 162, 14); E("fly", 168, 9); E("chk", 172); DR(164, 170, 13); E("hint", 178); E("door", 182); R(189, 0, 3, 15);
      }),

    {
      id: "giungla", name: "LA GIUNGLA TENEBROSA", boss: "dongo", bossName: "DONGO E PARROT", bossDesc: "il gorilla e il suo pappagallo",
      sky: ["#0a2a1a", "#2a4a2a"], ground: "#4a3a22", top: "#2a7a2a", dark: "#2a2214", plank: "#8a6a3a", water: true, dim: true,
      enemies: { walk: "scimmia", fly: "pappagallo", hop: "rospo" },
      hints: [
        "La Giungla Tenebrosa: Dongo e il pappagallo Parrot hanno l'ultimo pezzo della ricetta!",
        "Un ingrediente chiuso nella grotta: serve la forza di Fetta al Latte.",

      ],
      level: LEVEL(192, ({ G, R, PL, E, DR }) => {
        G(0, 20, 3); E("start", 3); E("hint", 6); E("walk", 11, 14); E("hop", 16, 14); DR(8, 18, 13);
        G(24, 55, 3); PL(28, 12, 3); E("ing", 29, 11, { n: 0 }); E("fly", 34, 9); R(38, 12, 4, 3); R(42, 9, 4, 6); E("walk", 43, 8); DR(42, 45, 7);
        E("hint", 46); R(48, 12, 4, 1); R(48, 13, 1, 2, "C"); E("ing", 50, 14, { n: 1 }); R(51, 13, 1, 2);
        G(59, 69, 3); E("chk", 61); E("hop", 66, 14); E("hint", 68); E("mov", 70, 12, { w: 3, dx: 11 }); PL(76, 8, 3); E("ing", 77, 7, { n: 2 }); DR(71, 81, 10);

        G(124, 191, 3); PL(128, 12, 3); E("ing", 129, 11, { n: 4 }); R(134, 13, 3, 2); R(137, 11, 3, 4); R(140, 9, 3, 6);
        PL(144, 5, 2); E("ing", 144, 4, { n: 5 }); E("walk", 150, 14); E("hop", 156, 14); E("fly", 162, 9); E("chk", 166); E("walk", 170, 14);
        DR(146, 160, 13); E("hint", 178); E("door", 182); R(189, 0, 3, 15);
      }),
    },
  ];
  const ARENAS = {
    iwan: LEVEL(32, ({ G, R, PL }) => { G(0, 31, 3); R(0, 0, 1, 15); R(31, 0, 1, 15); PL(5, 12, 4); PL(23, 12, 4); }),
    octopus: LEVEL(32, ({ G, R, PL }) => { G(0, 9, 3); G(22, 31, 3); R(0, 0, 1, 15); R(31, 0, 1, 15); PL(12, 12, 3); PL(17, 12, 3); }),
    titanius: LEVEL(32, ({ G, R, PL }) => { G(0, 31, 3); R(0, 0, 1, 15); R(31, 0, 1, 15); PL(4, 12, 4); PL(24, 12, 4); }),
    dongo: LEVEL(32, ({ G, R, PL }) => { G(0, 31, 3); R(0, 0, 1, 15); R(31, 0, 1, 15); R(24, 9, 7, 1); PL(6, 12, 4); PL(14, 9, 4); }),
  };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();

      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0e1a2e"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (world().dim) { const g = ctx.createRadialGradient(P ? P.x - camX : W / 2, P ? P.y - 14 : H / 2, 80, P ? P.x - camX : W / 2, P ? P.y - 14 : H / 2, 420); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,8,4,0.55)"); ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP); }
    if (state === "menu") return;
    if (activeHint && state === "play") drawBubble(activeHint.text);
    else if (state === "intro" && zone === "level" && stateT > 0.3) drawParadiso(P.x - camX - 40, P.y - 60, 1);
    drawHud();
    if (message) {
      const life = message.long ? 2.8 : 2.2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ffd23a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0e1a2e"; ctx.strokeText(message.text, W / 2, 80); ctx.fillText(message.text, W / 2, 80);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 99); ctx.fillText(message.sub, W / 2, 99); }
      ctx.globalAlpha = 1;
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(14,26,46,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 14px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#bcd4f0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 70, 9);
    ctx.fillStyle = "#7ad8ff"; ctx.font = "900 9px system-ui"; ctx.fillText(`MONDO ${worldIdx + 1}/4${round > 1 ? ` · GIRO ${round}` : ""}`, x0 + 70, 20);
    // the six ingredients of this world
    for (let i = 0; i < 6; i++) {
      const ix = x0 + 160 + i * 20;
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.arc(ix, 14, 8.5, 0, TAU); ctx.fill();
      if (got[i]) drawIngredient(i, ix, 14, 0.75);
      else { ctx.globalAlpha = 0.25; drawIngredient(i, ix, 14, 0.75); ctx.globalAlpha = 1; }
    }
    // hearts, lives and the hero in play
    const hx = x0 + 290;
    for (let i = 0; i < diff.hearts; i++) {
      const on = P && i < P.hearts; const x = hx + i * 13;
      ctx.fillStyle = on ? "#ff4a6a" : "rgba(255,255,255,0.2)";
      ctx.beginPath(); ctx.arc(x - 2.5, 12, 3.2, 0, TAU); ctx.arc(x + 2.5, 12, 3.2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 5.6, 13); ctx.lineTo(x, 19.5); ctx.lineTo(x + 5.6, 13); ctx.fill();
    }
    ctx.fillStyle = "#ffffff"; ctx.font = "800 10px system-ui"; ctx.fillText(`× ${Math.max(0, lives)}`, hx + diff.hearts * 13 + 2, 14);
    if (zone === "boss" && boss) {
      const bx = hx + diff.hearts * 13 + 34, bw = (touchMode ? W - 60 : W - 10) - bx;
      if (bw > 40) {
        ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 8, bw, 12);
        ctx.fillStyle = "#ff3a3a"; ctx.fillRect(bx, 8, bw * Math.max(0, boss.hp) / boss.max, 12);
        ctx.fillStyle = "#ffffff"; ctx.font = "900 8px system-ui"; ctx.fillText(world().bossName, bx + 4, 14);
      }
    } else if (P) {
      const px = touchMode ? W - 80 : W - 30;
      ctx.save(); ctx.beginPath(); ctx.rect(px - 18, 0, 36, TOP); ctx.clip();
      if (P.ch === "pingui") drawPingui(px, 27, 1, "idle"); else drawFetta(px - 2, 34, 1, "idle");
      ctx.restore();
      if (!touchMode) { ctx.fillStyle = "#bcd4f0"; ctx.font = "700 8px system-ui"; ctx.textAlign = "right"; ctx.fillText(HEROES[P.ch].name, px - 20, 14); ctx.textAlign = "left"; }
    }
    ctx.textBaseline = "alphabetic";
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  // test hooks: jump to a world or straight into its boss fight
  window.__fresche = { warp(i, toBoss) { worldIdx = i; got = got.map(() => true); if (toBoss) enterBoss(); else { buildZone("level"); } state = "play"; }, get: () => ({ P, boss, enemies, map, state, zone, got, score, items }) };
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="fresche-best-" data-kind="score"></script>
</body>

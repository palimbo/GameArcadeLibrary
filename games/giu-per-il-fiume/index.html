<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Giù per il Fiume</title>
<style>
  :root {
    --bg: #06202a;
    --fg: #f0fbff;
    --muted: #9ac4d0;
    --pink: #ff6ab0;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --aqua: #4ae0e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #0e3a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(240, 251, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to paddle in every direction, and a button to throw a can */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(74, 224, 232, 0.6); background: radial-gradient(circle, rgba(74,224,232,0.14), rgba(74,224,232,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(74, 224, 232, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(240,251,255,0.25); pointer-events: none; }
  #touch .throw { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 106, 176, 0.9); background: rgba(255, 106, 176, 0.22); }
  #touch .throw.on { background: rgba(255, 106, 176, 0.6); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .throw { width: 78px; height: 78px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 32, 42, 0.92);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #0e3a4a, 0 0 22px rgba(255,106,176,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--aqua); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(240,251,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0018; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #8a2a5a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="throw" aria-label="Lancia una lattina">LANCIA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 560, TAU = Math.PI * 2, HUD = 30, R = 15;

  const THEMES = [
    { name: "Il Canyon", water: ["#2a8ab0", "#1e6a90"], bank: "#c87a3a", bank2: "#a05a2a", deco: "cactus", mix: { rock: 4, branch: 2, log: 2, fisher: 2, gator: 1, pool: 1 } },
    { name: "La Palude", water: ["#3a7a5a", "#2a5a42"], bank: "#4a6a2a", bank2: "#34501e", deco: "reed", mix: { rock: 1, branch: 3, log: 3, fisher: 1, gator: 4, pool: 1 } },
    { name: "La Giungla", water: ["#2a8a8a", "#1a6a6a"], bank: "#2a7a2a", bank2: "#1a5a1a", deco: "palm", mix: { rock: 2, branch: 4, log: 2, fisher: 2, gator: 3, pool: 2 } },
    { name: "Il Fiume Ghiacciato", water: ["#4a9ad0", "#2a7ab0"], bank: "#e8f0f8", bank2: "#c0d0e0", deco: "pine", mix: { rock: 3, branch: 3, log: 3, fisher: 2, gator: 1, pool: 2 } },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 ciambelle · corrente lenta · meno pericoli", lives: 5, current: 0.85, density: 0.75, pace: 0.8 },
    normale:   { label: "NORMALE",   color: "#4ae0e8", desc: "3 ciambelle · l'esperienza classica", lives: 3, current: 1, density: 1, pace: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 ciambelle · corrente forte · alligatori affamati", lives: 3, current: 1.15, density: 1.3, pace: 1.25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fiume-difficulty";
  const bestKey = (id) => `fiume-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    paddle: lim(() => noise(0.08, 0.05, 900)),
    bump: lim(() => { beep(120, 0.1, "sine", 0.06, -40); noise(0.08, 0.06, 400); }),
    throw: lim(() => beep(500, 0.08, "triangle", 0.03, 300)),
    clonk: lim(() => beep(900, 0.06, "square", 0.03, -300)),
    splash: lim(() => noise(0.3, 0.12, 1200)),
    can: lim(() => arp([784, 988], 0.05, 0.08, "square", 0.03)),
    gate: lim(() => arp([659, 880, 1175], 0.05, 0.1, "square", 0.035)),
    gator: lim(() => { noise(0.12, 0.15, 500); beep(90, 0.15, "square", 0.04, -30); }),
    cast: lim(() => beep(1400, 0.35, "sine", 0.015, -1000)),
    pop: () => { noise(0.25, 0.35, 2500); arp([523, 415, 330, 262, 196], 0.08, 0.14, "triangle", 0.05); },
    treasure: () => arp([523, 659, 784, 1047, 1319], 0.06, 0.12),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.16),
    start: () => arp([392, 523, 659, 784, 659, 784, 1047], 0.09, 0.14),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, loop = 0, cans = 5, bestCache = 0, gatesRow = 0, nextLife = 25000, levelT = 0;
  let P = null, camY = 0, D = 7000, rp = [0, 0, 0], rapids = [], things = [], shots = [], parts = [], popups = [], ripples = [], message = null;
  let throwPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const theme = () => THEMES[level % THEMES.length];
  const pace = () => diff.pace * (1 + loop * 0.2 + (level % THEMES.length) * 0.06);

  // ---------- The river ----------
  const center = (y) => W / 2 + 52 * Math.sin(y * 0.0019 + rp[0]) + 26 * Math.sin(y * 0.0051 + rp[1]);
  const half = (y) => clamp(122 + 36 * Math.sin(y * 0.0031 + rp[2]) - (inRapids(y) ? 18 : 0), 78, 150);
  const inRapids = (y) => rapids.some((r) => y > r.y0 && y < r.y1);
  function flowAt(y) {
    const c = (78 + (level % THEMES.length) * 6 + loop * 10) * diff.current * (inRapids(y) ? 1.7 : 1);
    const d = (center(y + 4) - center(y - 4)) / 8;
    const n = Math.hypot(d, 1);
    return { x: c * d / n, y: c / n };
  }
  function buildLevel() {
    rp = [rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)];
    D = 7000 + (level % THEMES.length) * 700 + loop * 600;
    rapids = [];
    for (let y = 1600; y < D - 600; y += rnd(1400, 2200)) rapids.push({ y0: y, y1: y + rnd(260, 380) });
    things = []; shots = []; parts = []; popups = [];
    const th = theme(), mix = th.mix;
    const bag = [];
    for (const k in mix) for (let i = 0; i < mix[k]; i++) bag.push(k);
    let y = 700;
    while (y < D - 300) {
      y += rnd(120, 200) / (diff.density * (1 + loop * 0.15));
      const kind = bag[Math.floor(Math.random() * bag.length)];
      const c = center(y), hw = half(y);
      if (kind === "rock") { const r = rnd(12, 19); things.push({ kind, x: c + rnd(-hw + r + 10, hw - r - 10), y, r }); if (inRapids(y)) things.push({ kind, x: c + rnd(-hw + 30, hw - 30), y: y + 40, r: rnd(10, 15) }); }
      else if (kind === "branch") {
        const s = Math.random() < 0.5 ? -1 : 1, len = rnd(hw * 0.5, hw * 0.8), a = rnd(-0.35, 0.35);
        const bx = c + s * (hw + 6), by = y;
        things.push({ kind, x: bx, y: by, x2: bx - s * Math.cos(a) * len, y2: by + Math.sin(a) * len, side: s });
      }
      else if (kind === "log") things.push({ kind, x: c + rnd(-hw * 0.5, hw * 0.5), y, a: rnd(0, Math.PI), len: rnd(50, 76), vx: rnd(-20, 20), spin: rnd(-0.4, 0.4) });
      else if (kind === "gator") things.push({ kind, x: c + rnd(-hw * 0.6, hw * 0.6), y, vx: 0, vy: 0, hp: 2, sub: 0, subT: rnd(2, 5), a: Math.PI / 2, awake: false, flash: 0 });
      else if (kind === "fisher") { const s = Math.random() < 0.5 ? -1 : 1; things.push({ kind, side: s, y, x: c + s * (hw + 24), castT: rnd(0.5, 2), hook: null, hit: false }); }
      else if (kind === "pool") things.push({ kind, x: c + rnd(-hw * 0.3, hw * 0.3), y, r: rnd(46, 62) });
      // floating cans and, rarely, a treasure chest
      if (Math.random() < 0.3) things.push({ kind: "cans", x: c + rnd(-hw + 30, hw - 30), y: y + rnd(40, 80) });
      if (Math.random() < 0.035) things.push({ kind: "chest", x: c + rnd(-hw + 30, hw - 30), y: y + rnd(40, 80) });
    }
    // gates: two buoys to float between
    for (let gy = 900; gy < D - 400; gy += rnd(650, 950)) {
      const c = center(gy), hw = half(gy), gap = rnd(80, 110) / (1 + loop * 0.1), mid = c + rnd(-hw + gap / 2 + 20, hw - gap / 2 - 20);
      things.push({ kind: "gate", x: mid, y: gy, gap, passed: false, missed: false });
    }
    // no two things right on top of each other
    things.sort((a, b) => a.y - b.y);
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "pop", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; loop = 0; cans = 5; gatesRow = 0; nextLife = 25000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    P = { x: center(200), y: 200, vx: 0, vy: 0, spin: 0, rot: 0, inv: 1.5, paddle: 0, arm: 0 };
    camY = P.y - H * 0.3;
    levelT = 0;
    message = { text: `FIUME ${level + 1}`, sub: theme().name, t: 0 };
    state = "intro"; stateT = 2;
  }
  function addScore(n, x, y, color = "#f0fbff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 25000; if (lives < 9) { lives++; sfx.treasure(); popups.push({ x: P.x, y: P.y - 30, text: "CIAMBELLA EXTRA", color: "#ffe04a", t: 0 }); } }
  }
  function burst(x, y, c, n = 10, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function pop(why) {
    if (state !== "play" || P.inv > 0) return;
    lives--; gatesRow = 0;
    sfx.pop();
    burst(P.x, P.y, "#ff6ab0", 18, 150, 0.6);
    message = { text: "CIAMBELLA BUCATA!", sub: why + (lives > 0 ? ` · ne restano ${lives}` : ""), t: 0 };
    state = "pop"; stateT = 2.2;
  }
  function afterPop() {
    if (lives <= 0) { gameOver(); return; }
    // a new tube, a little further on, with the way ahead cleared
    const y = P.y + 40;
    things = things.filter((t) => !(t.y > y - 120 && t.y < y + 220 && ["gator", "log", "rock", "branch", "pool"].includes(t.kind)));
    for (const t of things) if (t.kind === "fisher") { t.hook = null; t.castT = Math.max(t.castT, 2.5); }
    P = { x: center(y), y, vx: 0, vy: 0, spin: 0, rot: 0, inv: 2, paddle: 0, arm: 0 };
    camY = Math.max(camY, P.y - H * 0.3);
    state = "play";
  }
  function levelClear() {
    const bonus = cans * 100 + Math.max(0, Math.round(180 - levelT)) * 20 + 2000 * (level + 1);
    addScore(bonus);
    message = { text: "ARRIVATO!", sub: `Bonus ${bonus.toLocaleString("it-IT")} (lattine e tempo)`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">FINE DELLA DISCESA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Fiume ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>GIÙ PER IL FIUME</h1>
       <p>Sdraiato su una ciambella, scendi quattro fiumi fino all'arrivo. Pagaia per schivare: le rocce e i tronchi ti fanno solo rimbalzare, ma i rami spinosi, i denti degli alligatori e gli ami dei pescatori bucano la ciambella!</p>
       <div class="pts">
         <span><b>Porte</b></span><span>passa tra le due boe: 500, poi 1.000, 1.500… se non ne manchi una</span>
         <span><b>Lattine</b></span><span>raccoglile e lanciale: alligatore 300 (due colpi), pescatore 500</span>
         <span><b>Forziere</b></span><span>1.000 · all'arrivo, 100 per ogni lattina rimasta e un bonus tempo</span>
         <span><b>Rapide e mulinelli</b></span><span>la corrente accelera o ti fa girare in tondo: pagaia per uscirne</span>
       </div>
       ${touchMode

  }

  // ---------- Input ----------

  // ---------- Geometry ----------
  function segDist(px, py, ax, ay, bx, by) {

  function bounceFrom(cx, cy, dist, minD) {
    // push the tube out and bounce it off a blunt obstacle

  }

  // ---------- Update ----------
  function updatePlayer(dt) {
    const ix = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);

    // whirlpools pull you round
    for (const t of things) if (t.kind === "pool") {
      const dx = t.x - P.x, dy = t.y - P.y, d = Math.hypot(dx, dy);

    if (P.x > c + hw - R) { P.x = c + hw - R; if (P.vx > 0) { P.vx = -P.vx * 0.5; sfx.bump(); } }
    // you cannot paddle back up out of sight
    if (P.y < camY + HUD + R + 4) { P.y = camY + HUD + R + 4; P.vy = Math.max(P.vy, 0); }

    if (throwPressed) {

      if (cans > 0) {
        let dx = ix, dy = iy;

        const n = Math.hypot(dx, dy);

  function updateThings(dt) {
    const sp = pace();

      if (t.kind === "rock") {
        const d = Math.hypot(P.x - t.x, P.y - t.y);

      } else if (t.kind === "branch") {

  function updateGator(t, dt, sp) {

  // ---------- Drawing ----------
  function drawRiver() {
    const th = theme();
    ctx.fillStyle = th.bank; ctx.fillRect(0, 0, W, H);
    // bank texture
    ctx.fillStyle = th.bank2;
    for (let k = 0; k < 30; k++) { const wy = Math.floor(camY / 40) * 40 + k * 40, h = (wy * 7919) % 97; ctx.fillRect((h * 3.7) % W, wy - camY + (h % 20), 8 + h % 12, 3); }
    // water: a polygon following both banks
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, th.water[1]); g.addColorStop(0.5, th.water[0]); g.addColorStop(1, th.water[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let sy = -10; sy <= H + 10; sy += 8) { const y = camY + sy; ctx.lineTo(center(y) - half(y), sy); }
    for (let sy = H + 10; sy >= -10; sy -= 8) { const y = camY + sy; ctx.lineTo(center(y) + half(y), sy); }
    ctx.fill();
    // sandy edge
    ctx.strokeStyle = "rgba(255,240,200,0.35)"; ctx.lineWidth = 3;
    for (const s of [-1, 1]) { ctx.beginPath(); for (let sy = -10; sy <= H + 10; sy += 8) { const y = camY + sy; ctx.lineTo(center(y) + s * half(y), sy); } ctx.stroke(); }
    // current streaks, moving with the water
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5;
    for (let k = 0; k < 26; k++) {
      const base = Math.floor(camY / 60) * 60 + k * 60;
      const y = base + ((clock * 80 + k * 23) % 60);
      const x = center(y) + ((k * 53) % 180 - 90) / 100 * half(y) * 0.9;
      const f = flowAt(y), n = Math.hypot(f.x, f.y), len = inRapids(y) ? 18 : 10;
      ctx.beginPath(); ctx.moveTo(x, y - camY); ctx.lineTo(x + f.x / n * len, y - camY + f.y / n * len); ctx.stroke();
    }
    // foam on the rapids
    for (const r of rapids) {
      if (r.y1 < camY || r.y0 > camY + H) continue;
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      for (let y = r.y0; y < r.y1; y += 14) { const x = center(y) + Math.sin(y * 0.3 + clock * 6) * half(y) * 0.8; ctx.beginPath(); ctx.ellipse(x, y - camY, 8, 3, 0, 0, TAU); ctx.fill(); }
      const yy = r.y0 - camY;
      if (yy > HUD && yy < H) { ctx.fillStyle = "#fff"; ctx.font = "900 11px system-ui"; ctx.textAlign = "center"; ctx.fillText("RAPIDE", center(r.y0), yy - 6); }
    }
    // decorations on the banks
    for (let k = 0; k < 16; k++) {
      const wy = Math.floor(camY / 90) * 90 + k * 90, h = (wy * 104729) % 1000;
      const s = h % 2 ? -1 : 1, x = center(wy) + s * (half(wy) + 26 + (h % 40)), y = wy - camY;
      if (x < -20 || x > W + 20) continue;
      drawDeco(th.deco, x, y);
    }
    // the finish line
    if (D - camY < H + 20) {
      const y = D - camY;
      for (let x = 0; x < W; x += 16) { ctx.fillStyle = ((x / 16) + Math.floor(y / 8)) % 2 ? "#fff" : "#1a1a1a"; ctx.fillRect(x, y - 8, 16, 8); ctx.fillStyle = ((x / 16) + 1) % 2 ? "#fff" : "#1a1a1a"; ctx.fillRect(x, y, 16, 8); }
      ctx.fillStyle = "#ff6ab0"; ctx.font = "900 16px system-ui"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#0e3a4a"; ctx.strokeText("ARRIVO", W / 2, y - 14); ctx.fillText("ARRIVO", W / 2, y - 14);
    }
  }
  function drawDeco(kind, x, y) {
    if (kind === "cactus") { ctx.fillStyle = "#3a8a3a"; ctx.fillRect(x - 3, y - 18, 6, 18); ctx.fillRect(x - 10, y - 12, 4, 8); ctx.fillRect(x - 10, y - 6, 8, 3); ctx.fillRect(x + 6, y - 16, 4, 8); ctx.fillRect(x + 3, y - 10, 7, 3); }
    else if (kind === "reed") { ctx.strokeStyle = "#6a8a2a"; ctx.lineWidth = 2; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * 3, y); ctx.lineTo(x + k * 5, y - 18); ctx.stroke(); } ctx.fillStyle = "#5a3a1a"; ctx.fillRect(x - 1, y - 22, 3, 7); }
    else if (kind === "palm") { ctx.fillStyle = "#6a4a2a"; ctx.fillRect(x - 2, y - 20, 4, 20); ctx.fillStyle = "#2aa02a"; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * 9, y - 22 + Math.sin(a) * 5, 10, 3, a, 0, TAU); ctx.fill(); } }
    else { ctx.fillStyle = "#2a5a3a"; ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x - 4, y - 16); ctx.lineTo(x + 4, y - 16); ctx.fill(); }
  }
  function drawThing(t) {
    const y = t.y - camY;
    if (y < -90 || y > H + 90) return;
    const x = t.x;
    if (t.kind === "rock") {
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.ellipse(x, y - t.r * 0.7, t.r * 1.1, t.r * 0.5, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = theme().deco === "pine" ? "#8a9aaa" : "#7a6a5a"; ctx.beginPath(); ctx.arc(x, y, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.beginPath(); ctx.arc(x - t.r * 0.3, y - t.r * 0.3, t.r * 0.45, 0, TAU); ctx.fill();
    } else if (t.kind === "branch") {
      const ice = theme().deco === "pine";
      ctx.strokeStyle = ice ? "#c8e8ff" : "#5a3a1a"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(t.x, t.y - camY); ctx.lineTo(t.x2, t.y2 - camY); ctx.stroke();
      // thorns
      ctx.strokeStyle = ice ? "#fff" : "#2a1a0a"; ctx.lineWidth = 2;
      const dx = t.x2 - t.x, dy = t.y2 - t.y, n = Math.hypot(dx, dy);
      for (let k = 0.15; k < 1; k += 0.14) { const px = t.x + dx * k, py = t.y + dy * k - camY, s = (k * 100) % 2 < 1 ? 1 : -1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - dy / n * 7 * s, py + dx / n * 7 * s); ctx.stroke(); }
      ctx.lineCap = "butt";
    } else if (t.kind === "log") {
      const [ax, ay, bx, by] = logEnds(t);
      const ice = theme().deco === "pine";
      ctx.strokeStyle = ice ? "#e0f0ff" : "#7a5a32"; ctx.lineWidth = ice ? 16 : 13; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ax, ay - camY); ctx.lineTo(bx, by - camY); ctx.stroke();
      ctx.strokeStyle = ice ? "#b0d0f0" : "#5a3a1a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay - camY); ctx.lineTo(bx, by - camY); ctx.stroke();
      ctx.lineCap = "butt";
    } else if (t.kind === "gator") {
      ctx.save(); ctx.translate(x, y); ctx.rotate(t.a);
      if (t.dead) ctx.globalAlpha = Math.max(0, 1 - t.dead);
      if (t.sub) {
        ctx.fillStyle = "rgba(40,80,40,0.5)"; ctx.beginPath(); ctx.ellipse(0, 0, 24, 8, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffe04a"; ctx.beginPath(); ctx.arc(10, -4, 2.5, 0, TAU); ctx.arc(10, 4, 2.5, 0, TAU); ctx.fill();
      } else {
        const open = t.phase === "jaws" ? 9 : t.phase === "lunge" ? 6 : Math.abs(Math.sin(clock * 5)) * 3;
        if (t.phase) { ctx.fillStyle = "#c8102a"; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(30, -4 - open); ctx.lineTo(30, 4 + open); ctx.fill(); }
        ctx.fillStyle = t.flash > 0 ? "#fff" : "#3a7a2a";
        ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-10, -9, 12, -7); ctx.lineTo(28, -4 - open); ctx.lineTo(24, -1); ctx.lineTo(12, 0); ctx.lineTo(24, 1); ctx.lineTo(28, 4 + open); ctx.lineTo(12, 7); ctx.quadraticCurveTo(-10, 9, -34, 0); ctx.fill();
        ctx.fillStyle = "#2a5a1a"; for (let k = -24; k < 8; k += 7) ctx.fillRect(k, -2, 4, 4);
        ctx.fillStyle = "#fff"; for (let k = 16; k < 28; k += 4) { ctx.fillRect(k, -5, 2, 2); ctx.fillRect(k, 3, 2, 2); }
        ctx.fillStyle = "#ffe04a"; ctx.beginPath(); ctx.arc(10, -6, 2.5, 0, TAU); ctx.arc(10, 6, 2.5, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#3a7a2a"; ctx.lineWidth = 3;
        const sw = Math.sin(clock * 8) * 4;
        for (const [lx, s] of [[4, 1], [4, -1], [-16, 1], [-16, -1]]) { ctx.beginPath(); ctx.moveTo(lx, s * 6); ctx.lineTo(lx - 4 + sw * s, s * 13); ctx.stroke(); }
      }
      ctx.restore();
    } else if (t.kind === "fisher") {
      const fx = t.x, fy = y;
      if (t.hit) {
        // knocked off the bank into the water
        ctx.globalAlpha = Math.max(0, 1 - (t.hitT || 0) / 1.5);
        ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(fx - t.side * 20, fy, 6, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        return;
      }
      ctx.fillStyle = "#3a5a8a"; ctx.fillRect(fx - 7, fy - 8, 14, 14);
      ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(fx, fy - 12, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#d8a040"; ctx.beginPath(); ctx.ellipse(fx, fy - 15, 9, 4, 0, 0, TAU); ctx.fill();
      // rod and line
      const tipX = fx - t.side * 22, tipY = fy - 22;
      ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, fy - 4); ctx.lineTo(tipX, tipY); ctx.stroke();
      if (t.hook) {
        const h = t.hook;
        // where the hook will land, while it is in the air
        if (h.phase === "fly") { ctx.strokeStyle = `rgba(255,74,58,${0.5 + 0.4 * Math.sin(clock * 20)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.tx, h.ty - camY, 12, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.moveTo(h.tx - 5, h.ty - camY); ctx.lineTo(h.tx + 5, h.ty - camY); ctx.moveTo(h.tx, h.ty - camY - 5); ctx.lineTo(h.tx, h.ty - camY + 5); ctx.stroke(); }
        ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(h.x, h.y - camY); ctx.stroke();
        ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y - camY, 4, 0, Math.PI * 1.5); ctx.stroke();
        if (h.phase === "water") { ctx.fillStyle = "#ff4a3a"; ctx.beginPath(); ctx.arc(h.x, h.y - camY - 6, 3, 0, TAU); ctx.fill(); }
      }
    } else if (t.kind === "pool") {
      ctx.save(); ctx.translate(x, y);
      for (let k = 0; k < 4; k++) {
        ctx.strokeStyle = `rgba(255,255,255,${0.12 + k * 0.05})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, t.r * (1 - k * 0.22), clock * 3 + k, clock * 3 + k + Math.PI * 1.3); ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,20,40,0.3)"; ctx.beginPath(); ctx.arc(0, 0, t.r * 0.2, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (t.kind === "cans") {
      for (let k = 0; k < 3; k++) { ctx.fillStyle = ["#e83a3a", "#3a8ae8", "#e8c83a"][k]; ctx.fillRect(x - 9 + k * 6, y - 6 + Math.sin(clock * 3 + k) * 1.5, 5, 10); ctx.fillStyle = "#ddd"; ctx.fillRect(x - 9 + k * 6, y - 6 + Math.sin(clock * 3 + k) * 1.5, 5, 2); }
    } else if (t.kind === "chest") {
      ctx.fillStyle = "#8a5a2a"; ctx.fillRect(x - 10, y - 7, 20, 14); ctx.fillStyle = "#ffe04a"; ctx.fillRect(x - 10, y - 2, 20, 3); ctx.fillRect(x - 2, y - 4, 4, 6);
    } else if (t.kind === "gate") {
      for (const s of [-1, 1]) {
        const bx = x + s * t.gap / 2, bob = Math.sin(clock * 3 + s) * 1.5;
        ctx.fillStyle = t.passed ? "#7ed87a" : t.missed ? "#8a8a8a" : "#ff6a2a";
        ctx.beginPath(); ctx.arc(bx, y + bob, 7, 0, TAU); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillRect(bx - 7, y + bob - 1.5, 14, 3);
      }
      if (!t.passed && !t.missed) { ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(x - t.gap / 2 + 8, y); ctx.lineTo(x + t.gap / 2 - 8, y); ctx.stroke(); ctx.setLineDash([]); }
    }
  }
  function drawTube() {
    if (!P) return;
    const x = P.x, y = P.y - camY;
    if (state === "pop") {
      const k = Math.min(1, (2.2 - stateT) * 2);
      ctx.fillStyle = "rgba(255,106,176,0.6)"; ctx.beginPath(); ctx.ellipse(x, y, R * (1 - k * 0.5), R * (1 - k * 0.8), 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(x, y - 3, 6, 0, TAU); ctx.fill();
      return;
    }
    if (P.inv > 0 && Math.floor(clock * 14) % 2 && state === "play") return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(P.rot);
    // a shadow and the ring
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.arc(3, 3, R + 2, 0, TAU); ctx.fill();
    ctx.lineWidth = 9; ctx.strokeStyle = "#ff6ab0"; ctx.beginPath(); ctx.arc(0, 0, R - 3, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.setLineDash([5, 7]); ctx.beginPath(); ctx.arc(0, 0, R - 3, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    // the swimmer: legs over the ring, arms paddling, sunglasses
    ctx.fillStyle = "#e8b890";
    ctx.fillRect(-5, 6, 4, 12); ctx.fillRect(1, 6, 4, 12);
    ctx.fillStyle = "#3a8ae8"; ctx.fillRect(-6, -2, 12, 10);
    const a1 = Math.sin(P.arm) * 0.6, a2 = Math.sin(P.arm + Math.PI) * 0.6;
    ctx.strokeStyle = "#e8b890"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(-6 - Math.cos(a1) * 14, -2 + Math.sin(a1) * 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(6 + Math.cos(a2) * 14, -2 + Math.sin(a2) * 10); ctx.stroke();
    ctx.lineCap = "butt";
    ctx.fillStyle = "#e8b890"; ctx.beginPath(); ctx.arc(0, -7, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#6a3a1a"; ctx.beginPath(); ctx.arc(0, -9, 6, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-5, -6, 4, 2.5); ctx.fillRect(1, -6, 4, 2.5);
    ctx.restore();
    // a wake behind
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, R + 5 + Math.sin(clock * 6) * 1.5, 0, TAU); ctx.stroke();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(6,32,42,0.88)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#f0fbff"; ctx.font = "900 14px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 8, 11);
    ctx.fillStyle = "#9ac4d0"; ctx.font = "700 8px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8, 23);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ae0e8"; ctx.font = "800 10px system-ui";
    ctx.fillText(`${theme().name.toUpperCase()}`, W / 2, 10);
    // how far to go
    if (P) { const k = clamp(P.y / D, 0, 1); ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(W / 2 - 60, 19, 120, 5); ctx.fillStyle = "#ff6ab0"; ctx.fillRect(W / 2 - 60, 19, 120 * k, 5); }
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui";
    ctx.fillStyle = "#ffe04a"; ctx.fillText(`🥫${cans}`, W - 8, 10);
    ctx.fillStyle = "#ff6ab0"; ctx.fillText(`◯×${Math.max(0, lives)}`, W - 8, 23);
    if (gatesRow >= 2) { ctx.textAlign = "right"; ctx.fillStyle = "#4ae0e8"; ctx.font = "800 9px system-ui"; ctx.fillText(`porte ×${gatesRow}`, W - 48, 23); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) { buildLevel(); P = { x: center(200), y: 200, vx: 0, vy: 0, spin: 0, rot: 0, inv: 0, paddle: 0, arm: 0 }; camY = P.y - H * 0.3; }
    if (state === "menu") camY += 0.4;
    drawRiver();
    for (const r of ripples) { ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - r.t / 0.8)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(r.x, r.y - camY, 4 + r.t * 24, 0, TAU); ctx.stroke(); }
    for (const t of things) if (t.kind === "pool" || t.kind === "gate" || t.kind === "cans" || t.kind === "chest") drawThing(t);
    for (const t of things) if (t.kind === "rock" || t.kind === "log" || t.kind === "branch" || t.kind === "gator") drawThing(t);
    if (state !== "menu") drawTube();
    for (const t of things) if (t.kind === "fisher") drawThing(t);
    for (const s of shots) { ctx.save(); ctx.translate(s.x, s.y - camY); ctx.rotate(s.spin); ctx.fillStyle = "#e83a3a"; ctx.fillRect(-3, -5, 6, 10); ctx.fillStyle = "#ddd"; ctx.fillRect(-3, -5, 6, 2); ctx.restore(); }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - camY - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#06202a"; ctx.strokeText(p.text, p.x, p.y - camY); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - camY);
    }
    ctx.globalAlpha = 1;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 26px system-ui";
      ctx.lineWidth = 5; ctx.strokeStyle = "#06202a"; ctx.strokeText(message.text, W / 2, 150); ctx.fillStyle = "#ff6ab0"; ctx.fillText(message.text, W / 2, 150);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 172); ctx.fillStyle = "#f0fbff"; ctx.fillText(message.sub, W / 2, 172); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="fiume-best-" data-kind="score"></script>

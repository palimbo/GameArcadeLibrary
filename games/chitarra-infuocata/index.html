<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chitarra Infuocata</title>
<style>
  :root {
    --bg: #120808;
    --fg: #f4f6ee;
    --muted: #f0c8b0;
    --pink: #ff6a2a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a1a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: hold the fret (left red, up green, right blue, the diagonals the two-note chords; flick it down to wail); the big PLETTRO strums */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 106, 42, 0.6); background: radial-gradient(circle, rgba(255,106,42,0.14), rgba(255,106,42,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 106, 42, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 106, 42, 0.9); background: rgba(255, 106, 42, 0.22); }
  #touch .jump.on { background: rgba(255, 106, 42, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 8, 8, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a0a0a, 0 0 22px rgba(255,90,40,0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0802; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a83a1a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Plettro">PLETTRO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the neck: three frets (red, green, blue); a note is one fret or two side by side (a chord)
  const LANE = 58, LX = 54, JY = 292, PX = 268, PY = 36, PW = 360, PH = 314;
  const FRET_COL = ["#ff3a3a", "#3ae85a", "#3a8aff"];
  // the five things the left hand can hold: R, R+G, G, G+B, B (one direction of the stick each)
  const SHAPES = [[0], [0, 1], [1], [1, 2], [2]];
  const SHAPE_NAME = ["←", "↖", "↑", "↗", "→"];
  const WIN = [0.045, 0.09, 0.14], JUDGE = [
    { name: "PERFETTO", pts: 300, life: 2, col: "#ffe84a" },
    { name: "OTTIMO", pts: 200, life: 1.2, col: "#5ae8ff" },
    { name: "BENE", pts: 100, life: 0.3, col: "#8aff8a" },
  ];
  const PENTA = [0, 3, 5, 7, 10];
  // the set list: one rock style after the other, then again faster
  const SONGS = [
    { name: "Strada Bollente", genre: "ROCK'N'ROLL", bpm: 132, root: 40, prog: [0, 0, 5, 7], style: 0, hue: 20 },
    { name: "Fulmine in Cantina", genre: "PUNK", bpm: 168, root: 45, prog: [0, 5, 7, 5], style: 1, hue: 340 },
    { name: "Onda Lunga", genre: "SURF", bpm: 144, root: 43, prog: [0, 5, 0, 7], style: 2, hue: 190 },
    { name: "Cuore di Pietra", genre: "HARD ROCK", bpm: 120, root: 40, prog: [0, 10, 5, 7], style: 3, hue: 30 },
    { name: "Notte d'Acciaio", genre: "METAL", bpm: 150, root: 38, prog: [0, 1, 0, 8], style: 4, hue: 0 },
    { name: "Ultimo Accordo", genre: "BALLATA ROCK", bpm: 96, root: 42, prog: [0, 7, 9, 5], style: 5, hue: 270 },
  ];
  const MEASURES = 28;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "canzoni più lente · meno note e accordi · un errore costa poco", tempo: 0.9, dense: 0.7, drain: 7 },
    normale:   { label: "NORMALE",   color: "#ff6a2a", desc: "il ritmo giusto", tempo: 1, dense: 1, drain: 13 },
    difficile: { label: "DIFFICILE", color: "#ff3a8a", desc: "canzoni più veloci · più note, accordi e cambi · un errore costa caro", tempo: 1.08, dense: 1.25, drain: 17 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "chitarra-difficulty";
  const bestKey = (id) => `chitarra-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };

  // ---------- Music ----------
  // drums and bass by themselves; the guitar is you: each strum plays the power chord of its note
  let master = null, dist = null, audioStart = 0, scheduled = 0;
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function tone(when, freq, dur, type, vol, slide = 0, out = master) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, when);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), when + dur);
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(out); o.start(when); o.stop(when + dur + 0.02);
  }
  let noiseBuf = null;
  function hiss(when, dur, vol, freq, type = "bandpass") {
    if (!noiseBuf) { noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f).connect(g).connect(master); s.start(when, Math.random() * 0.5, dur + 0.02);
  }
  function setupAudio() {
    master = audioCtx.createGain(); master.gain.value = 0.9; master.connect(audioCtx.destination);
    // a little fuzz box for the guitar
    dist = audioCtx.createWaveShaper(); const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / n * 2 - 1; curve[i] = Math.tanh(x * 4); }
    dist.curve = curve; const g = audioCtx.createGain(); g.gain.value = 0.5; dist.connect(g).connect(master);
  }
  const kick = (w, v = 0.25) => tone(w, 140, 0.16, "sine", v, -100);
  const snare = (w, v = 0.17) => { hiss(w, 0.15, v, 1700); tone(w, 200, 0.06, "triangle", v * 0.3); };
  const hat = (w, v = 0.05) => hiss(w, 0.035, v, 8500, "highpass");
  const crash = (w) => hiss(w, 0.9, 0.08, 6000, "highpass");
  function scheduleMusic() {
    if (!audioCtx || !song || state !== "play") return;
    const ahead = songT + 0.25, beat = 60 / song.bpm, sd = beat / 4;
    while (scheduled * sd < ahead && scheduled < song.steps) {
      const st = scheduled, when = audioStart + st * sd;
      if (when > audioCtx.currentTime - 0.01) {
        const s16 = st % 16, bar = Math.floor(st / 16), root = song.root + song.prog[bar % 4];
        const bass = (n, d, v = 0.13) => tone(when, hz(n), d, "sawtooth", v * 0.6), b8 = s16 % 2 === 0;
        switch (song.style) {
          case 0: if (s16 === 0 || s16 === 8 || s16 === 10) kick(when); if (s16 === 4 || s16 === 12) snare(when); if (b8) { hat(when); bass(root + (s16 % 8 === 4 ? 7 : s16 % 8 === 6 ? 9 : 0), sd * 1.8); } break;
          case 1: if (s16 % 4 === 0) kick(when, 0.27); if (s16 % 8 === 4) snare(when, 0.2); if (b8) { hat(when, 0.06); bass(root, sd * 1.6, 0.15); } break;
          case 2: if (s16 === 0 || s16 === 6 || s16 === 10) kick(when); if (s16 === 4 || s16 === 12) snare(when, 0.12); if (s16 % 2) tone(when, 160 + (s16 % 4) * 20, 0.12, "sine", 0.06, -40); if (b8) bass(root + (s16 % 8 === 4 ? 12 : 0), sd * 1.6); break;
          case 3: if (s16 === 0 || s16 === 6 || s16 === 8) kick(when, 0.28); if (s16 === 4 || s16 === 12) snare(when, 0.2); if (b8) hat(when, 0.05); if (s16 % 4 === 0) bass(root, beat * 0.9, 0.16); break;
          case 4: kick(when, s16 % 4 === 0 ? 0.26 : 0.16); if (s16 === 4 || s16 === 12) snare(when, 0.2); bass(root, sd * 0.9, 0.11); break;
          default: if (s16 === 0 || s16 === 10) kick(when, 0.22); if (s16 === 8) snare(when, 0.15); if (s16 % 4 === 0) hat(when, 0.04); if (s16 === 0) bass(root, beat * 3.5, 0.15); if (s16 === 0) for (const k of [12, 19, 24]) tone(when, hz(root + k), beat * 3.6, "triangle", 0.012);
        }
        if (s16 === 0 && bar % 4 === 0) crash(when);
      }
      scheduled++;
    }
  }
  // the guitar: a power chord (root, fifth, octave) through the fuzz
  function strumSound(pitch, ok) {
    if (!audioCtx) return;
    const w = audioCtx.currentTime;
    if (!ok) { hiss(w, 0.08, 0.12, 900); tone(w, 90, 0.08, "square", 0.04, 0, master); return; }
    for (const k of [0, 7, 12]) tone(w, hz(pitch + k), 0.32, "sawtooth", 0.09, 0, dist);
  }
  function wailSound() { if (audioCtx) for (const k of [0, 7]) tone(audioCtx.currentTime, hz(song.root + 36 + k), 0.6, "sawtooth", 0.08, 160, dist); }
  const sfx = {
    clear: () => { if (!audioCtx) return; [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(audioCtx.currentTime + i * 0.08, f, 0.14, "square", 0.04)); },
    fail: () => { if (!audioCtx) return; [523, 466, 415, 392, 330, 262].forEach((f, i) => tone(audioCtx.currentTime + i * 0.15, f, 0.24, "triangle", 0.05)); },
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, stage = 1, bestCache = 0, life = 60, combo = 0, maxCombo = 0, cleared = 0;
  let song = null, notes = [], wails = [], songT = 0, counts = [0, 0, 0, 0], judgeShow = null, message = null, sparks = [], strumFlash = 0, wailFlash = 0, wailsGot = 0;
  let actHeld = false, wasAct = false, downWas = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The left hand ----------
  // which shape the stick (or the arrows) is holding: -1 none, 0..4 = R, RG, G, GB, B; "down" is the wail
  function heldShape() {
    let x = stick.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), y = stick.y + (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (Math.hypot(x, y) < 0.4) return -1;
    const a = Math.atan2(-y, x) * 180 / Math.PI;   // 0 = right, 90 = up
    if (a < -30 && a > -150) return -2;            // down: the wail
    if (a >= -30 && a < 30) return 4;
    if (a >= 30 && a < 68) return 3;
    if (a >= 68 && a < 112) return 2;
    if (a >= 112 && a < 150) return 1;
    return 0;
  }

  // ---------- The chart ----------
  // the notes follow a riff on the pentatonic scale: higher notes go right on the neck
  function makeSong(n) {
    const base = SONGS[(n - 1) % SONGS.length], lap = Math.floor((n - 1) / SONGS.length);
    const bpm = Math.round(base.bpm * diff.tempo * (1 + 0.1 * lap));
    const lvl = Math.min(9, n - 1 + lap * 2);
    const beat = 60 / bpm, sd = beat / 4, measures = Math.round(MEASURES * bpm / 125);
    const s = { ...base, bpm, lvl, steps: (measures + 1) * 16 + 8 };
    const f = clamp(125 / bpm, 0.8, 1.25), dense = diff.dense;
    const pE = Math.min(0.6, (0.12 + 0.06 * lvl) * dense * f);
    const pChord = Math.min(0.45, (0.12 + 0.05 * lvl) * dense);
    const list = [], wl = [];
    let sh = 2, lastT = -9;
    const add = (t) => {
      // a step along the neck; a chord shape (odd index) only now and then
      let q;
      do { q = clamp(sh + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)], 0, 4); } while ((q % 2 === 1 && Math.random() > pChord) || (q === sh && t - lastT < 0.2));
      sh = q; lastT = t;
      const deg = q, oct = 0;
      list.push({ t, shape: q, pitch: s.root + 12 + PENTA[deg] + oct, hit: -1 });
    };
    for (let m = 1; m <= measures; m++) {
      const phraseEnd = m % 4 === 0, t0 = m * 16 * sd;
      for (let b = 0; b < 4; b++) {
        if (phraseEnd && b >= 2) continue;
        const tq = t0 + b * 4 * sd;
        if (Math.random() < 0.85) add(tq);
        if (Math.random() < pE) add(tq + 2 * sd);
      }
      // the end of a phrase: hold it up high and wail!
      if (phraseEnd) wl.push({ t: t0 + 8 * sd, len: 6 * sd, got: false, missed: false });
    }
    s.len = (measures + 1) * 16 * sd;
    return { s, list, wl };
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "clear", "fail"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; stage = 1; life = 70; combo = 0; maxCombo = 0; cleared = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginSong();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginSong() {
    const m = makeSong(stage);
    song = m.s; notes = m.list; wails = m.wl; songT = -1.4; scheduled = 0; counts = [0, 0, 0, 0]; wailsGot = 0;
    life = Math.max(life, 70);
    message = { text: `CANZONE ${stage} · ${song.genre}`, sub: `«${song.name}» · ${song.bpm} BPM · ${notes.length} note`, t: 0 };
    state = "intro"; stateT = 2;
  }
  function syncAudio() { if (audioCtx) audioStart = audioCtx.currentTime - songT; }
  function judge(n, j) {
    n.hit = j; counts[j]++;
    combo++; maxCombo = Math.max(maxCombo, combo);
    score += Math.round(JUDGE[j].pts * (1 + Math.min(combo, 100) / 100) * (1 + 0.15 * (stage - 1)));
    life = Math.min(100, life + JUDGE[j].life);
    judgeShow = { j, t: 0 };
    for (const k of SHAPES[n.shape]) for (let i = 0; i < 5; i++) sparks.push({ x: LX + k * LANE + LANE / 2, y: JY, vx: rnd(-80, 80), vy: rnd(-160, -40), t: 0, c: FRET_COL[k] });
  }
  function miss(n, why) {
    n.hit = 3; counts[3]++; combo = 0; judgeShow = { j: 3, t: 0, why };
    if (window.__miss) window.__miss++;

    if (combo >= 5) { ctx.textAlign = "center"; outlined(`${combo} DI FILA`, mid, 222, "900 13px system-ui", "#ffffff", 4); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!song && state === "menu") { const m = makeSong(1); song = m.s; notes = m.list; wails = m.wl; songT = 4; }
    drawNeck();
    drawNotes();
    drawStage();
    for (const s of sparks) { ctx.globalAlpha = Math.max(0, 1 - s.t / 0.5); ctx.fillStyle = s.c; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    const cx = PX + PW / 2;
    ctx.textAlign = "center";
    if (state === "intro" && stateT < 1.2) outlined(stateT > 0.6 ? "PRONTI?" : "VIA!", cx, 150, "italic 900 34px system-ui", "#ffffff", 6);
    if (wailFlash > 0) outlined("URLO!", cx, 150, "italic 900 34px system-ui", "#ffb03a", 6);
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2) - message.t) * 2);
      outlined(message.text, cx, 96, "italic 900 20px system-ui", state === "fail" ? "#ff5a5a" : "#ff6a2a");
      if (message.sub) { const parts = message.sub.split(" · "); const half = Math.ceil(parts.length / 2); outlined(parts.slice(0, half).join(" · "), cx, 114, "800 10px system-ui", "#ffffff", 4); if (parts.length > 1) outlined(parts.slice(half).join(" · "), cx, 128, "800 10px system-ui", "#ffffff", 4); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="chitarra-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Corsa al Gelato</title>
<style>
  :root {
    --bg: #2a1a12;
    --fg: #f4f6ee;
    --muted: #e0c0a8;
    --pink: #ff9a3a;
    --yellow: #7ae07a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #5a3a2a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run about the square; LANCIA throws the food you carry */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 154, 58, 0.6); background: radial-gradient(circle, rgba(255,154,58,0.14), rgba(255,154,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 154, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(42, 26, 18, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a2a0a, 0 0 22px rgba(255,154,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0e02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b85a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Lancia">LANCIA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the square: a paved field with a hedge around it
  const FX0 = 14, FX1 = W - 14, FY0 = TOP + 12, FY1 = H - 10;
  const PSPEED = 128, PR = 9, CR = 10, HOLE_R = 14, CONE_R = 14, GRAB = 3;
  const START = { x: 46, y: (FY0 + FY1) / 2 };
  const FOOD = {
    pomodoro: { name: "UN POMODORO", r: 5, v: 330, c: "#ff3a2a" },
    torta: { name: "UNA TORTA", r: 8, v: 260, c: "#fff0d0" },
    anguria: { name: "UN'ANGURIA", r: 9, v: 215, c: "#3ab84a", pierce: true },
    piselli: { name: "I PISELLI", r: 3.5, v: 340, c: "#8ae03a", spread: true },
  };
  const KINDS = Object.keys(FOOD);
  const CHEF_HUES = ["#ff5a5a", "#5ab8ff", "#ffd23a", "#c87aff", "#5ae0a0"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · cuochi lenti, pochi e con la mira scarsa · il gelato si scioglie piano", lives: 5, speed: 0.85, throwR: 1.1, melt: 46, chefs: 2, max: 4, need: 0, lead: 0.4, dodge: 0.3 },
    normale:   { label: "NORMALE",   color: "#ff9a3a", desc: "3 vite", lives: 3, speed: 1.05, throwR: 1.65, melt: 40, chefs: 3, max: 5, need: 1, lead: 0.8, dodge: 0.45 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · cuochi svelti e numerosi · il gelato si scioglie in fretta", lives: 3, speed: 1.25, throwR: 2.2, melt: 34, chefs: 3, max: 6, need: 2, lead: 1, dodge: 0.65 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "gelato-difficulty";
  const bestKey = (id) => `gelato-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    grab: lim(() => arp([660, 880], 0.04, 0.06, "square", 0.03)),
    throw: lim(() => { noise(0.08, 0.06, 1800); beep(500, 0.08, "triangle", 0.03, 300); }),
    splat: lim(() => { noise(0.18, 0.14, 600); beep(220, 0.12, "square", 0.03, -120); }),
    parry: lim(() => { noise(0.1, 0.1, 1200); beep(1200, 0.08, "sine", 0.04, -400); }),
    lid: lim(() => beep(180, 0.15, "triangle", 0.05, -60)),
    wind: lim(() => beep(700, 0.12, "sine", 0.025, 300)),
    tick: lim(() => beep(1400, 0.04, "sine", 0.025)),
    free: () => arp([784, 988, 1175, 1568], 0.06, 0.12, "sine", 0.05),
    cone: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.14, "square", 0.045),
    die: () => { noise(0.3, 0.18, 500); arp([523, 392, 311, 262], 0.1, 0.16, "triangle", 0.05); },
    melt: () => { for (let i = 0; i < 8; i++) beep(800 - i * 70, 0.12, "sine", 0.04, 0, i * 0.07); },
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 30000;
  let P = null, chefs = [], holes = [], piles = [], shots = [], parts = [], popups = [], splats = [], message = null;
  let cone = null, coneT = 0, coneMax = 26, need = 3, got = 0, lastBy = "", lastTick = 0, hits = 0;
  let throwPressed = false, trayT = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const stones = Array.from({ length: 60 }, (_, i) => ({ x: FX0 + ((i * 97) % (FX1 - FX0)), y: FY0 + ((i * 53) % (FY1 - FY0)), r: 2 + (i % 3) }));

  // ---------- The square ----------
  function farFrom(x, y, list, d) { return list.every((o) => Math.hypot(o.x - x, o.y - y) >= d); }
  function buildLevel() {
    cone = { x: rnd(560, 596), y: rnd(FY0 + 40, FY1 - 40) };
    holes = [];
    const nh = level === 1 ? 3 : 4;
    for (let k = 0; k < 400 && holes.length < nh; k++) {
      const x = rnd(170, 500), y = rnd(FY0 + 30, FY1 - 25);
      if (farFrom(x, y, holes, 95) && Math.hypot(x - cone.x, y - cone.y) > 90) holes.push({ x, y, open: 0 });
    }
    piles = [];
    const np = 6 + Math.min(3, Math.floor(level / 2));
    for (let k = 0; k < 600 && piles.length < np; k++) {
      const x = rnd(80, 530), y = rnd(FY0 + 22, FY1 - 18);
      if (farFrom(x, y, piles, 60) && farFrom(x, y, holes, 45) && Math.hypot(x - cone.x, y - cone.y) > 60 && Math.hypot(x - START.x, y - START.y) > 40) {
        const kind = piles.length < 2 ? "pomodoro" : pick(KINDS);
        piles.push({ x, y, kind, n: Math.round(rnd(6, 9)) });
      }
    }
  }
  const chefCount = () => Math.min(diff.max, diff.chefs + Math.floor(level / 2));
  function makeChefs() {
    chefs = [];
    for (let i = 0; i < chefCount(); i++) chefs.push({ i, x: 0, y: 0, vx: 0, vy: 0, state: "hole", t: 1.6 + i * 1.3, hole: null, carry: null, cd: rnd(1, 2), hue: CHEF_HUES[i % CHEF_HUES.length], walk: 0, ax: 0, ay: 0, off: rnd(0, TAU) });
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    splats = [];
    spawnPlayer();
    coneMax = Math.max(diff.melt * 0.7, diff.melt - (level - 1) * 0.8);
    need = Math.min(9, 2 + diff.need + level); got = 0;
    message = { text: `PIAZZA ${level}`, sub: `centra ${need} cuochi per liberare il gelato, poi corri a prenderlo!`, t: 0 };
    state = "intro"; stateT = 1.5;
  }
  function spawnPlayer() {
    P = { x: START.x, y: START.y, vx: 0, vy: 0, fx: 1, fy: 0, carry: null, ammo: 0, safe: 2, walk: 0 };
    shots = []; coneT = coneMax;
    for (const h of holes) h.open = 0;
    makeChefs();
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 30000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 70, text: "VITA EXTRA!", color: "#7ae07a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play" || P.safe > 0) return;
    lives--; lastBy = by;
    if (by === "melt") sfx.melt(); else { sfx.die(); burst(P.x, P.y, "#ffd0a0", 18, 120, 0.6); }
    state = "dead"; stateT = 2;
  }
  function levelDone() {
    const secs = Math.ceil(coneT), b = 1000 + secs * 50;
    addScore(b);
    message = { text: "GELATO!", sub: `1.000 + ${secs} secondi × 50 = ${b.toLocaleString("it-IT")}`, t: 0 };
    sfx.cone(); state = "clear"; stateT = 2.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · piazza ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>CORSA AL GELATO</h1>
       <p>In fondo alla piazza c'è un cono gelato che si sta sciogliendo: è sotto una campana di vetro che si alza solo quando hai centrato abbastanza cuochi, poi raggiungilo prima che sparisca! I cuochi escono dai tombini e ti inseguono tirandoti di tutto. Raccogli il cibo dai mucchi e rispondi al fuoco: torte in faccia, pomodori, angurie e piselli!</p>
       <div class="pts">
         <span><b>Cibo</b></span><span>passa su un mucchio per prenderne 3 colpi · pomodoro veloce · torta grossa · anguria trapassa · piselli a ventaglio</span>
         <span><b>Cuochi</b></span><span>100 a colpo (di più se ne prendi tanti di fila) · un cibo che ne colpisce un altro: 50</span>
         <span><b>Attento</b></span><span>al cuoco che alza il braccio, e ai tombini aperti</span>
         <span><b>Gelato</b></span><span>la campana si alza dopo ${2 + diff.need + 1} cuochi colpiti (uno in più a ogni piazza) · 1.000 + 50 per secondo rimasto · vita extra ogni 30.000</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per correre (e per mirare) · LANCIA per tirare il cibo che hai in mano</p>`
         : `<p class="muted help">Frecce o WASD per correre e mirare · SPAZIO, J o Z per lanciare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>VIA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if ((k === " " || k === "j" || k === "z" || k === "x") && !e.repeat) throwPressed = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });

    ctx.fillStyle = c.hue; ctx.fillRect(x - 6, y - 7, 12, 3);
    ctx.fillStyle = "#f0c098"; ctx.beginPath(); ctx.arc(x, y - 11, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2010"; ctx.fillRect(x - 4, y - 8, 8, 1.6);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 5, y - 21, 10, 7); ctx.beginPath(); ctx.arc(x - 3, y - 21, 3.5, 0, TAU); ctx.arc(x + 3, y - 21, 3.5, 0, TAU); ctx.arc(x, y - 23, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 3, y - 12, 1.6, 2); ctx.fillRect(x + 1.5, y - 12, 1.6, 2);
    if (c.state === "ko" && c.splat) { ctx.fillStyle = FOOD[c.splat].c; ctx.beginPath(); ctx.arc(x, y - 11, 7, 0, TAU); ctx.fill(); }
    if (c.state === "wind") {
      // arm up with the food: the throw is coming
      ctx.strokeStyle = "#f4f4f4"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 6, y - 4); ctx.lineTo(x + 10, y - 20); ctx.stroke();
      drawFoodIcon(c.carry, x + 10, y - 24, 0.9);
      ctx.strokeStyle = `rgba(255,60,40,${0.5 + 0.5 * Math.sin(clock * 30)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 6, 17, 0, TAU); ctx.stroke();
    } else if (c.carry && c.state === "walk") drawFoodIcon(c.carry, x + 9, y - 2, 0.7);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function drawHud() {
    ctx.fillStyle = "rgba(42,22,12,0.92)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e0c0a8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff9a3a"; ctx.font = "900 10px system-ui"; ctx.fillText(`PIAZZA ${level}`, x0 + 80, 21);
    // the cone's time
    const bx = x0 + 160, bw = 110, k = clamp(coneT / coneMax, 0, 1);
    ctx.fillStyle = "#4a2a1a"; ctx.fillRect(bx, 5, bw, 8); ctx.fillStyle = k < 0.25 ? "#ff4a4a" : "#ffb0d0"; ctx.fillRect(bx, 5, bw * k, 8);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 9px system-ui"; ctx.fillText(`GELATO ${Math.max(0, Math.ceil(coneT))}s`, bx + bw + 6, 9);
    // what's in hand
    ctx.fillStyle = got >= need ? "#7ae07a" : "#ffd23a"; ctx.font = "900 9px system-ui"; ctx.fillText(got >= need ? "LIBERO!" : `CUOCHI ${got}/${need}`, bx, 25);
    const hx = bx + bw + 82;
    if (P && P.carry) { drawFoodIcon(P.carry, hx, 14, 0.9); ctx.fillStyle = "#ffffff"; ctx.font = "900 10px system-ui"; ctx.fillText(`× ${P.ammo}`, hx + 10, 14); }
    else { ctx.fillStyle = "#a88a70"; ctx.font = "700 9px system-ui"; ctx.fillText("mani vuote", hx - 6, 14); }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const cx = lx - i * 14; ctx.fillStyle = "#ffd0a8"; ctx.beginPath(); ctx.arc(cx, 15, 4.5, 0, TAU); ctx.fill(); ctx.fillStyle = "#3ab84a"; ctx.beginPath(); ctx.arc(cx, 13.5, 4.5, Math.PI, TAU); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!cone) { buildLevel(); spawnPlayer(); P.x = 240; P.y = 200; P.carry = "torta"; P.ammo = 2; chefs[0].state = "walk"; chefs[0].x = 380; chefs[0].y = 150; chefs[1].state = "wind"; chefs[1].x = 420; chefs[1].y = 260; chefs[1].carry = "pomodoro"; }
    drawField();
    for (const h of holes) drawHole(h);
    for (const p of piles) drawPile(p);
    drawCone();
    const actors = chefs.filter((c) => c.state !== "hole").map((c) => ({ y: c.y, f: () => drawChef(c) }));
    if (state !== "dead" && state !== "menu") actors.push({ y: P.y, f: drawKid });
    if (state === "dead" && Math.floor(clock * 6) % 2) actors.push({ y: P.y, f: drawKid });
    actors.sort((a, b) => a.y - b.y).forEach((a) => a.f());
    for (const s of shots) {
      ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(s.x, s.y + 10, s.r, s.r * 0.4, 0, 0, TAU); ctx.fill();
      drawFoodIcon(s.kind, s.x, s.y, s.kind === "piselli" ? 0.55 : 1, s.spin);
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#2a1408"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(42,20,8,0.55)"; ctx.fillRect(0, 120, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ff9a3a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#2a1408"; ctx.strokeText(message.text, W / 2, 147); ctx.fillText(message.text, W / 2, 147);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(message.sub, W / 2, 166); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = lastBy === "melt" ? "IL GELATO SI È SCIOLTO!" : lastBy === "UN TOMBINO APERTO" ? "CADUTO IN UN TOMBINO!" : lastBy === "UN CUOCO" ? "PRESO DA UN CUOCO!" : `COLPITO DA ${lastBy}!`;
      ctx.strokeText(t, W / 2, 250); ctx.fillText(t, W / 2, 250);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="gelato-best-" data-kind="score"></script>

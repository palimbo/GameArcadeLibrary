<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Caccia su Strada</title>
<style>
  :root {
    --bg: #0c0f0a;
    --fg: #f2f0e6;
    --muted: #a8b09c;
    --lime: #b8f04a;
    --gold: #ffcc33;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a3322, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(242, 240, 230, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* analog thumb stick (sideways steers, up speeds up, down brakes), a fire button and the special weapon */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(184, 240, 74, 0.55); background: radial-gradient(circle, rgba(184,240,74,0.14), rgba(184,240,74,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(184, 240, 74, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick i { position: absolute; left: 50%; transform: translateX(-50%); font: 800 10px system-ui, sans-serif; font-style: normal; color: rgba(242,240,230,0.4); pointer-events: none; letter-spacing: 1px; }
  #touch .stick i.up { top: 6px; }
  #touch .stick i.down { bottom: 6px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 13px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .fire { width: 96px; height: 96px; border: 2px solid rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.2); }
  #touch .arm { width: 66px; height: 66px; font-size: 11px !important; border: 2px solid rgba(255, 204, 51, 0.9); background: rgba(255, 204, 51, 0.16); }
  #touch .btns button.on { background: rgba(255, 204, 51, 0.5); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #touch.small .arm { width: 56px; height: 56px; font-size: 10px !important; }
  #touch.small .btns { gap: 6px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 15, 10, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--lime); text-shadow: 0 3px 0 #3a5a10, 0 0 22px rgba(184,240,74,0.4); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(242,240,230,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--lime); color: #1a2a06; background: var(--lime); padding: 11px 30px; box-shadow: 0 4px 0 #3a5a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><i class="up">GAS</i><i class="down">FRENO</i><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="arm" aria-label="Arma speciale">ARMA</button>
    <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 480, HUD = 24, TAU = Math.PI * 2;
  const PY = 370;                 // the player's car sits here on screen
  const SEG = 260;                // road control points, one every SEG pixels of distance
  const CAR_W = 16, CAR_L = 28;
  const KINDS = {
    civ:    { pts: -250, hp: 1, mass: 1,   w: 16, l: 28 },
    blade:  { pts: 150,  hp: 1, mass: 1,   w: 16, l: 28 },   // the tyre-slasher
    limo:   { pts: 200,  hp: 3, mass: 1.3, w: 18, l: 38 },   // the gunman's limousine
    armor:  { pts: 300,  hp: 0, mass: 2.4, w: 20, l: 32 },   // bulletproof: push it off the road
    van:    { pts: 0,    hp: 0, mass: 3,   w: 22, l: 44 },   // the weapons van
  };
  const WEAPONS = {
    olio:    { name: "OLIO", uses: 8, col: "#3a3a3a", text: "OLIO: chi ti segue sbanda" },
    fumo:    { name: "FUMO", uses: 8, col: "#c8c8c8", text: "FUMO: chi ti segue non vede" },
    missili: { name: "MISSILI", uses: 6, col: "#ff4a3a", text: "MISSILI: abbatti l'elicottero" },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "90 s di auto di riserva · 4 auto · nemici lenti", grace: 90, lives: 4, pace: 0.75, fire: 0.6 },
    normale:   { label: "NORMALE",   color: "#b8f04a", desc: "60 s di auto di riserva · 3 auto · l'esperienza classica", grace: 60, lives: 3, pace: 1, fire: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "40 s di auto di riserva · 3 auto · strade strette e nemici feroci", grace: 40, lives: 3, pace: 1.25, fire: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "strada-difficulty";
  const bestKey = (id) => `strada-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(900, 0.04, "square", 0.015, -400)),
    ping: lim(() => beep(2200, 0.05, "triangle", 0.02, -600)),
    bump: lim(() => { noise(0.12, 0.2, 500); beep(90, 0.1, "square", 0.03, -30); }),
    boom: lim(() => { noise(0.45, 0.3, 1000); beep(150, 0.25, "sawtooth", 0.03, -100); }),
    oil: lim(() => { noise(0.25, 0.12, 300); beep(200, 0.2, "sine", 0.03, -120); }),
    smoke: lim(() => noise(0.5, 0.12, 2500)),
    missile: lim(() => { noise(0.4, 0.15, 3000); beep(400, 0.4, "sawtooth", 0.02, 800); }),
    skid: lim(() => beep(700, 0.35, "sawtooth", 0.015, -400)),
    load: () => arp([392, 523, 659, 784, 1047], 0.08, 0.14, "square", 0.04),
    van: () => arp([659, 659, 784], 0.12, 0.12, "triangle", 0.05),
    heli: lim(() => { for (let i = 0; i < 6; i++) beep(60, 0.05, "square", 0.03, 0, i * 0.08); }),
    bomb: lim(() => { beep(1200, 0.7, "sine", 0.02, -1000); }),
    die: () => { noise(1, 0.35, 700); arp([392, 311, 262, 196], 0.12, 0.2, "sawtooth", 0.035); },
    start: () => arp([262, 330, 392, 523, 392, 523, 659, 784], 0.1, 0.14),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
    civ: () => arp([330, 262], 0.14, 0.2, "triangle", 0.05),
  };
  function engineStart() {
    if (!audioCtx || engine) return;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    osc.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 400; g.gain.value = 0;
    osc.connect(f).connect(g).connect(audioCtx.destination); osc.start();
    engine = { osc, g };
  }
  function engineSet(on, speed) {
    if (!engine) return;
    const t = audioCtx.currentTime;
    engine.g.gain.setTargetAtTime(on ? 0.018 : 0, t, 0.05);
    engine.osc.frequency.setTargetAtTime(40 + speed * 0.22, t, 0.08);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, bestCache = 0, nextLife = 10000, playT = 0, distPts = 0;
  let P = null, cars = [], shots = [], eshots = [], slicks = [], clouds = [], missiles = [], bombs = [], craters = [], parts = [], popups = [], message = null;
  let heli = null, pts = [], weapon = null, ammo = 0;
  let civT = 0, bladeT = 0, limoT = 0, armorT = 0, vanT = 0, heliT = 0, sector = 0;
  let stick = [0, 0], fireHeld = false, armPressed = false;
  const keys = { left: false, right: false, up: false, down: false };

  const pace = () => diff.pace * (1 + Math.min(0.7, sector * 0.1));
  const graceLeft = () => Math.max(0, diff.grace - playT);

  // ---------- The road ----------
  // a control point every SEG pixels: centre, half width, half width of the central median, and the scenery
  function genPoints(upTo) {
    while (pts.length <= upTo + 2) {
      const i = pts.length, prev = pts[i - 1];
      if (!prev || i < 4) { pts.push({ cx: W / 2, hw: 110, mw: 0, water: false }); continue; }
      let { cx, hw, mw, water } = prev;
      const narrow = diff.pace > 1.1 ? 0.88 : 1;
      if (prev.run > 0) { pts.push({ ...prev, run: prev.run - 1 }); continue; }
      const r = Math.random();
      if (mw > 0 && r < 0.5) { mw = 0; hw = rnd(95, 120) * narrow; }                                        // the carriageways join again
      else if (mw === 0 && !water && r < 0.22 && i > 8) {
        // a central median splits the road: first the road widens, then the median's nose appears
        pts.push({ cx: clamp(cx, W / 2 - 16, W / 2 + 16), hw: 150, mw: 0, water: false, run: 0 });
        pts.push({ cx: clamp(cx, W / 2 - 16, W / 2 + 16), hw: 150, mw: rnd(16, 24), water: false, run: Math.floor(rnd(2, 5)) });
        continue;
      }
      else if (!water && mw === 0 && r < 0.36 && i > 8) { water = true; hw = rnd(70, 84) * narrow; }         // a bridge over the river
      else if (water && r < 0.6) { water = false; hw = rnd(95, 120) * narrow; }
      else if (mw === 0 && !water) hw = clamp(hw + rnd(-25, 25), 72 * narrow, 125 * narrow);
      const room = W / 2 - hw - 14;
      cx = clamp(cx + rnd(-50, 50), W / 2 - room, W / 2 + room);
      pts.push({ cx, hw, mw, water, run: Math.floor(rnd(1, 4)) });
    }
  }
  const smooth = (t) => t * t * (3 - 2 * t);
  function road(d) {
    const i = Math.max(0, Math.floor(d / SEG)), t = smooth((d - i * SEG) / SEG);
    genPoints(i + 1);
    const a = pts[i], b = pts[i + 1];
    return { cx: a.cx + (b.cx - a.cx) * t, hw: a.hw + (b.hw - a.hw) * t, mw: a.mw + (b.mw - a.mw) * t, water: t < 0.5 ? a.water : b.water };
  }
  // how far a car at x is from safe tarmac (0 or less means on the road)
  function offRoad(x, d, half = 5) {
    const r = road(d), dx = Math.abs(x - r.cx);
    return Math.max(dx + half - r.hw, r.mw > 4 ? r.mw - (dx - half) : -99);
  }
  // the nearest point where a car can drive, keeping a margin from the edges and the median
  function safeX(x, d, m = 14) {
    const r = road(d);
    let lo = r.cx - r.hw + m, hi = r.cx + r.hw - m;
    let v = clamp(x, lo, hi);
    if (r.mw > 2) {
      const ml = r.cx - r.mw - m, mh = r.cx + r.mw + m;
      if (v > ml && v < mh) v = x < r.cx ? ml : mh;
    }
    return v;
  }
  const screenY = (d) => PY - (d - P.d);

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead"].includes(state);
  function newCar() {
    const r = road(P ? P.d : 0);
    return { x: r.cx + (r.mw > 2 ? r.mw + 30 : 0), d: P ? P.d : 0, v: 200, vx: 0, cool: 0, inv: 2.5, dead: false, tilt: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    engineStart();
    score = 0; lives = diff.lives; nextLife = 10000; playT = 0; distPts = 0; sector = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    pts = []; P = null; P = newCar(); P.d = 0; P.x = W / 2;
    cars = []; shots = []; eshots = []; slicks = []; clouds = []; missiles = []; bombs = []; craters = []; heli = null;
    weapon = null; ammo = 0;
    civT = 1; bladeT = rnd(7, 10); limoT = 45; armorT = 30; vanT = 18; heliT = 85;
    message = { text: "PARTENZA!", sub: `Auto di riserva per ${diff.grace} secondi`, t: 0 };
    state = "intro"; stateT = 1.6;
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f2f0e6") {
    score = Math.max(0, score + n);
    if (x !== undefined) popups.push({ x, y, text: (n > 0 ? "" : "−") + Math.abs(n).toLocaleString("it-IT"), color: n < 0 ? "#ff4a3a" : color, t: 0 });
    if (n > 0 && score >= nextLife) {
      nextLife += 10000;
      if (graceLeft() <= 0 && lives < 9) { lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2 - 40, text: "AUTO EXTRA", color: "#ffcc33", t: 0, big: true }); }
    }
  }
  function burst(x, y, color, n = 12, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color });
    }
  }
  function explode(x, y) { burst(x, y, "#ff8a3a", 22, 130, 0.8); burst(x, y, "#ffcc33", 12, 80, 0.6); burst(x, y, "#555", 10, 60, 1); }
  function crash(why) {
    if (state !== "play" || P.dead || P.inv > 0) return;
    P.dead = true;
    explode(P.x, PY);
    craters.push({ x: P.x, d: P.d, t: 0 });
    sfx.die();
    const spare = graceLeft() > 0;
    if (!spare) lives--;
    message = { text: why, sub: spare ? "Arriva un'auto di riserva" : lives > 0 ? `Auto rimaste: ${lives}` : "", t: 0 };
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    const d = P.d;
    P = newCar(); P.d = d; P.x = safeX(road(d).cx + (road(d).mw > 2 ? road(d).mw + 30 : 0), d, 20);
    cars = cars.filter((c) => Math.abs(c.d - d) > 220);
    eshots = []; bombs = [];
    state = "play";
  }
  function gameOver() {
    state = "over";
    engineSet(false, 0);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const km = (P.d / 1000 * 0.05).toFixed(1), played = diff.label;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${km} km · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused"; engineSet(false, 0);
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }

        burst(b.x, y, "#ff8a3a", 18, 120, 0.6); burst(b.x, y, "#555", 8, 60, 0.8); sfx.boom();
        craters.push({ x: b.x, d: b.d, t: 0 });
        if (state === "play" && Math.abs(b.x - P.x) < 20 && Math.abs(b.d - P.d) < 24) crash("CENTRATO DA UNA BOMBA!");
        for (const c of cars) if (!c.dead && Math.abs(b.x - c.x) < 18 && Math.abs(b.d - c.d) < 22) killCar(c, "bomb");
      }
    }
    bombs = bombs.filter((b) => !b.done);
    if (!heli) return;
    const h = heli;
    h.t += dt;
    const leaving = h.t > 16;
    h.y += ((leaving ? -60 : 110 + Math.sin(h.t * 0.8) * 30) - h.y) * Math.min(1, dt * (leaving ? 0.8 : 1.2));
    h.x += clamp(P.x - h.x, -70 * dt, 70 * dt);
    h.cool -= dt;
    if (!leaving && h.cool <= 0 && state === "play" && h.t > 1.5) {
      // bombs aimed at where you will be
      h.cool = rnd(1.6, 2.4) / diff.fire;
      bombs.push({ x: P.x + P.vx * 0.3 + rnd(-10, 10), d: P.d + P.v * 1 + rnd(-10, 10), t: 0 });
      sfx.bomb();
    }
    if (leaving && h.y < -50) heli = null;
  }
  function killHeli() {
    burst(heli.x, heli.y, "#ff8a3a", 30, 150, 0.9); burst(heli.x, heli.y, "#ffffff", 10, 90, 0.5);
    sfx.boom();
    addScore(500, heli.x, heli.y - 16, "#ffcc33");
    heli = null;
  }

  // ---------- Drawing ----------
  let menuD = 0;
  function drawCar(x, y, kind, col, tilt = 0, hurt = false, blades = false, spin = 0) {
    const k = KINDS[kind] || { w: CAR_W, l: CAR_L };
    const w = k.w, l = k.l;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * 0.12 + spin);
    // shadow and wheels
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(-w / 2 + 2, -l / 2 + 3, w, l);
    ctx.fillStyle = "#111";
    ctx.fillRect(-w / 2 - 2, -l / 2 + 4, 3, 7); ctx.fillRect(w / 2 - 1, -l / 2 + 4, 3, 7);
    ctx.fillRect(-w / 2 - 2, l / 2 - 11, 3, 7); ctx.fillRect(w / 2 - 1, l / 2 - 11, 3, 7);
    if (blades) { ctx.fillStyle = "#e8e8e8"; for (const s of [-1, 1]) for (const yy of [-l / 2 + 7, l / 2 - 7]) { ctx.beginPath(); ctx.moveTo(s * (w / 2 + 1), yy - 3); ctx.lineTo(s * (w / 2 + 8), yy); ctx.lineTo(s * (w / 2 + 1), yy + 3); ctx.fill(); } }
    const body = hurt ? "#ffffff" : col;
    ctx.fillStyle = body;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-w / 2, -l / 2, w, l, 4); ctx.fill(); } else ctx.fillRect(-w / 2, -l / 2, w, l);
    if (kind === "van") {
      ctx.fillStyle = "#8a1a12"; ctx.fillRect(-w / 2 + 2, -l / 2 + 12, w - 4, l - 14);
      ctx.fillStyle = "#ffcc33"; ctx.font = "900 7px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.save(); ctx.rotate(-Math.PI / 2); ctx.fillText("ARMI", -4, 3); ctx.restore();
      ctx.fillStyle = "#1a2a3a"; ctx.fillRect(-w / 2 + 3, -l / 2 + 3, w - 6, 5);
      // the ramp at the back, open
      ctx.fillStyle = "#555"; ctx.fillRect(-7, l / 2 - 2, 14, 4);
    } else {
      ctx.fillStyle = "rgba(20,30,40,0.85)"; ctx.fillRect(-w / 2 + 3, -l / 2 + 7, w - 6, 5); ctx.fillRect(-w / 2 + 3, l / 2 - 9, w - 6, 3);
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(-w / 2 + 3, -l / 2 + 13, w - 6, l - 23);
      if (kind === "limo") { ctx.fillStyle = "rgba(20,30,40,0.85)"; ctx.fillRect(-w / 2 + 3, -2, w - 6, 3); }
      if (kind === "armor") { ctx.fillStyle = "#777"; ctx.fillRect(-w / 2 - 1, -l / 2 - 2, w + 2, 4); ctx.fillRect(-w / 2 - 1, l / 2 - 2, w + 2, 4); ctx.fillStyle = "#c8c8c8"; for (let i = -1; i <= 1; i++) ctx.fillRect(i * 5 - 1, -l / 2 + 15, 2, 2); }
      if (kind === "player") { ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-1.5, -l / 2 - 3, 3, 6); ctx.fillStyle = "#ff4a3a"; ctx.fillRect(-w / 2, l / 2 - 3, 4, 2); ctx.fillRect(w / 2 - 4, l / 2 - 3, 4, 2); ctx.fillStyle = "#b8f04a"; ctx.fillRect(-1, -l / 2 + 13, 2, l - 16); }
    }
    ctx.restore();
  }
  function drawRoad(D) {
    // grass, then the road strip by strip (4 px at a time)
    for (let y = HUD; y < H; y += 4) {
      const d = D + (PY - y), r = road(d);
      const band = Math.floor(d / 40) % 2;
      ctx.fillStyle = r.water ? (band ? "#1a5a9a" : "#1a62a4") : (band ? "#3a7a2a" : "#428a30");
      ctx.fillRect(0, y, W, 4);
      const L = r.cx - r.hw, R = r.cx + r.hw;
      ctx.fillStyle = r.water ? "#8a8a82" : (Math.floor(d / 16) % 2 ? "#e8e4d8" : "#d83a2a");
      ctx.fillRect(L - 4, y, 4, 4); ctx.fillRect(R, y, 4, 4);
      ctx.fillStyle = "#4a4c4e"; ctx.fillRect(L, y, R - L, 4);
      if (r.mw > 2) {
        ctx.fillStyle = "#e8e4d8"; ctx.fillRect(r.cx - r.mw - 2, y, r.mw * 2 + 4, 4);
        ctx.fillStyle = band ? "#3a7a2a" : "#428a30"; ctx.fillRect(r.cx - r.mw, y, r.mw * 2, 4);
      }
      // lane dashes
      if (Math.floor(d / 24) % 2) {
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        if (r.mw > 2) { const m1 = (r.mw + r.hw) / 2; ctx.fillRect(r.cx - m1 - 1, y, 2, 4); ctx.fillRect(r.cx + m1 - 1, y, 2, 4); }
        else ctx.fillRect(r.cx - 1, y, 2, 4);
      }
      if (r.water && Math.floor(d / 30) % 2) { ctx.fillStyle = "#6a6a62"; ctx.fillRect(L - 8, y, 3, 4); ctx.fillRect(R + 5, y, 3, 4); }
    }
    // roadside trees and river ripples
    for (let k = Math.floor((D - (H - PY)) / 90) - 1; k < (D + PY) / 90 + 1; k++) {
      const d = k * 90, y = PY - (d - D), r = road(d);
      const seed = Math.sin(k * 12.9898) * 43758.5453, f = seed - Math.floor(seed);
      for (const s of [-1, 1]) {
        const edge = r.cx + s * (r.hw + 20), x = s < 0 ? edge - f * (edge - 8) : edge + f * (W - 8 - edge);
        if (Math.abs(x - r.cx) < r.hw + 14) continue;
        if (r.water) { ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(x - 6, y, 12, 1.5); }
        else { ctx.fillStyle = "#1e4a18"; ctx.beginPath(); ctx.arc(x + 2, y + 3, 9, 0, TAU); ctx.fill(); ctx.fillStyle = "#2e6a22"; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill(); ctx.fillStyle = "#3e8a2e"; ctx.beginPath(); ctx.arc(x - 2, y - 2, 4, 0, TAU); ctx.fill(); }
      }
    }
  }
  function drawHeli(h) {
    ctx.save(); ctx.translate(h.x, h.y);
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(10, 60, 14, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a4a2a"; ctx.fillRect(-2, -30, 4, 22);
    ctx.fillRect(-6, -32, 12, 3);
    ctx.fillStyle = "#4a5a34"; ctx.beginPath(); ctx.ellipse(0, 0, 11, 15, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#8ac8ff"; ctx.beginPath(); ctx.ellipse(0, 7, 7, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(220,220,220,0.7)"; ctx.lineWidth = 2;
    const a = clock * 30;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 26, Math.sin(a) * 26); ctx.lineTo(-Math.cos(a) * 26, -Math.sin(a) * 26);
    ctx.moveTo(Math.cos(a + 1.57) * 26, Math.sin(a + 1.57) * 26); ctx.lineTo(-Math.cos(a + 1.57) * 26, -Math.sin(a + 1.57) * 26); ctx.stroke();
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const D = P && state !== "menu" ? P.d : menuD;
    if (!P || state === "menu") { if (!pts.length) genPoints(4); }
    drawRoad(D);
    if (state === "menu" || !P) return;
    for (const c of craters) { const y = screenY(c.d); ctx.fillStyle = "rgba(20,20,20,0.5)"; ctx.beginPath(); ctx.ellipse(c.x, y, 12, 9, 0, 0, TAU); ctx.fill(); }
    for (const s of slicks) { const y = screenY(s.d); ctx.fillStyle = "rgba(10,10,14,0.85)"; ctx.beginPath(); ctx.ellipse(s.x, y, 16, 12, 0, 0, TAU); ctx.fill(); ctx.fillStyle = "rgba(120,90,200,0.35)"; ctx.beginPath(); ctx.ellipse(s.x - 4, y - 3, 6, 3, 0.4, 0, TAU); ctx.fill(); }
    for (const b of bombs) {
      const y = screenY(b.d), k = b.t;
      ctx.strokeStyle = `rgba(255,74,58,${0.4 + 0.5 * k})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, y, 20 * (1 - k * 0.4), 0, TAU); ctx.stroke();
      ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(b.x, y - (1 - k) * 40, 3 + k * 2, 0, TAU); ctx.fill();
    }
    for (const c of cars) {
      const y = screenY(c.d);
      if (y < HUD - 40 || y > H + 40) continue;
      const col = c.kind === "civ" ? c.col : c.kind === "blade" ? "#2a5ad8" : c.kind === "limo" ? "#2a2a4a" : c.kind === "armor" ? "#3a3a3a" : "#d83a2a";
      drawCar(c.x, y, c.kind, col, c.vx / 150, c.hurt > 0, c.kind === "blade" && (c.blades || (c.warn && Math.floor(clock * 12) % 2)), c.spin > 0 ? c.t * 12 : 0);
      if (c.kind === "limo" && c.aim > 0) { ctx.fillStyle = "#e8c8a0"; ctx.beginPath(); ctx.arc(c.x - c.side * 9, y + 2, 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#222"; ctx.fillRect(c.side < 0 ? c.x + 6 : c.x - 16, y + 1, 10, 2); }
    }
    ctx.fillStyle = "#ffe89a";
    for (const b of shots) ctx.fillRect(b.x - 1, screenY(b.d) - 4, 2, 7);
    ctx.fillStyle = "#ff4a3a";
    for (const b of eshots) { ctx.beginPath(); ctx.arc(b.x, screenY(b.d), 2.5, 0, TAU); ctx.fill(); }
    if (!P.dead && !(P.inv > 0 && state === "play" && Math.floor(clock * 12) % 2)) drawCar(P.x, PY, "player", "#f2f0e6", P.tilt);
    for (const m of missiles) { ctx.fillStyle = "#e8e8e8"; ctx.fillRect(m.x - 1.5, m.y - 6, 3, 10); ctx.fillStyle = "#ff4a3a"; ctx.fillRect(m.x - 1.5, m.y - 7, 3, 3); ctx.fillStyle = "#ffcc33"; ctx.fillRect(m.x - 1, m.y + 4, 2, 4); }
    for (const s of clouds) {
      const y = screenY(s.d), g = Math.min(1, s.t * 3) * Math.min(1, (3.5 - s.t) * 1.5);
      ctx.fillStyle = `rgba(230,230,230,${0.75 * g})`;
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(s.x + Math.cos(i * 1.3 + s.t) * 16, y + Math.sin(i * 2.1) * 12, 16 + s.t * 5, 0, TAU); ctx.fill(); }
    }
    if (heli) drawHeli(heli);
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 18px system-ui, sans-serif" : "900 10px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status bar
    ctx.fillStyle = "rgba(12,15,10,0.9)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f2f0e6";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 12);
    ctx.textAlign = "center"; ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#ff4a3a";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, W / 2, 12);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui, sans-serif";
    const g = graceLeft();
    if (g > 0) { ctx.fillStyle = "#b8f04a"; ctx.fillText(`RISERVA ${Math.ceil(g)}s`, W - 8, 12); }
    else { ctx.fillStyle = "#b8f04a"; ctx.fillText(`${Math.round(P.v * 0.9)} km/h`, W - 8, 12); }
    ctx.textBaseline = "alphabetic";
    // spare cars, speed and the loaded weapon
    const spare = g > 0 ? 0 : lives - (state === "dead" ? 0 : 1);
    for (let i = 0; i < Math.min(spare, 6); i++) { ctx.save(); ctx.translate(12 + i * 14, H - 14); ctx.scale(0.45, 0.45); drawCar(0, 0, "player", "#f2f0e6"); ctx.restore(); }
    if (weapon) {
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(W - 96, H - 24, 90, 18);
      ctx.fillStyle = WEAPONS[weapon].col === "#3a3a3a" ? "#c8a2ff" : WEAPONS[weapon].col; ctx.font = "900 11px system-ui, sans-serif"; ctx.textAlign = "right";
      ctx.fillText(`${WEAPONS[weapon].name} ×${ammo}`, W - 10, H - 11);
    }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillStyle = "#b8f04a";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, 150); ctx.fillText(message.text, W / 2, 150);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#f2f0e6"; ctx.strokeText(message.sub, W / 2, 170); ctx.fillText(message.sub, W / 2, 170); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); if (!isPlaying() && engine && state !== "paused") engineSet(false, 0); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="strada-best-" data-kind="score"></script>

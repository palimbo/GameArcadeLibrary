<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pilota del Tempo</title>
<style>
  :root {
    --bg: #060814;
    --fg: #f4f6ff;
    --muted: #a0a8c8;
    --sky: #6ac8ff;
    --gold: #ffcf4a;
    --red: #ff4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1e2440, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to steer in any direction, one button to fire */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(106, 200, 255, 0.6); background: radial-gradient(circle, rgba(106,200,255,0.16), rgba(106,200,255,0.05)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(106, 200, 255, 0.5); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,255,0.25); pointer-events: none; }
  #touch .fire { width: 92px; height: 92px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px;
    border: 2px solid rgba(255, 90, 90, 0.9); background: rgba(255, 90, 90, 0.2); }
  #touch .fire.on { background: rgba(255, 207, 74, 0.5); border-color: var(--gold); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 76px; height: 76px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(6, 8, 20, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 58px); font-weight: 900; letter-spacing: 1px; color: var(--sky); text-shadow: 0 3px 0 #1a5a9a, 0 0 22px rgba(106,200,255,0.45); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--sky); color: #04203a; background: var(--sky); padding: 11px 30px; box-shadow: 0 4px 0 #1a5a9a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2, HUD = 26;
  // five eras; each has its sky, its enemy aircraft and a big "boss" that opens the time gate
  const ERAS = [
    { year: 1910, name: "Biplani della Grande Guerra", sky: ["#8ccaf0", "#5a9ad8"], cloud: "#ffffff", enemy: "biplane", ec: "#d8a040", speed: 92, turn: 1.55, shot: "bullet", boss: "blimp", bc: "#b8b0a0", para: true },
    { year: 1940, name: "Caccia a elica", sky: ["#7ab0e0", "#4a7ac0"], cloud: "#f0f4ff", enemy: "mono", ec: "#6a9a4a", speed: 112, turn: 1.45, shot: "bullet", boss: "bomber", bc: "#7a8a6a", para: true },
    { year: 1970, name: "Elicotteri d'assalto", sky: ["#6a90b8", "#3a5a88"], cloud: "#d8e0ec", enemy: "heli", ec: "#7a8a5a", speed: 88, turn: 2.2, shot: "missile", boss: "chinook", bc: "#5a6a4a", para: true },
    { year: 1983, name: "Jet supersonici", sky: ["#e08a6a", "#3a3a7a"], cloud: "#ffc8b0", enemy: "jet", ec: "#a0a8b8", speed: 138, turn: 1.2, shot: "missile", boss: "strato", bc: "#6a7080", para: true },
    { year: 2001, name: "Invasione dallo spazio", sky: ["#141438", "#04040e"], cloud: "#6a4aa8", enemy: "ufo", ec: "#b87aff", speed: 118, turn: 2.0, shot: "spread", boss: "mother", bc: "#8a7ab8", para: false },
  ];
  // each boss is hit-tested against a few ellipses in its own frame: [x, y, rx, ry]
  const BOSSES = {
    blimp: { len: 96, shapes: [[0, 0, 48, 17]] },
    bomber: { len: 70, shapes: [[0, 0, 36, 8], [4, 0, 11, 44], [-30, 0, 6, 16]] },
    chinook: { len: 92, shapes: [[0, 0, 44, 11], [30, 0, 22, 22], [-30, 0, 22, 22]] },
    strato: { len: 84, shapes: [[0, 0, 42, 7], [-4, 0, 14, 46]] },
    mother: { len: 100, shapes: [[0, 0, 50, 50]] },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · 28 nemici per epoca, spari lenti", lives: 5, need: 28, fire: 0.55, espeed: 0.9, crowd: 0.8 },
    normale:   { label: "NORMALE",   color: "#6ac8ff", desc: "3 vite · 40 nemici per epoca", lives: 3, need: 40, fire: 1, espeed: 1, crowd: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 vite · 50 nemici per epoca, cieli affollati", lives: 3, need: 50, fire: 1.4, espeed: 1.1, crowd: 1.25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pilota-difficulty";
  const bestKey = (id) => `pilota-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const wrapA = (a) => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
  function turnTo(a, target, max) { const d = wrapA(target - a); return a + Math.max(-max, Math.min(max, d)); }
  function hash(i, j, k) {
    let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------- Canvas ----------
  // the view is always at least 320 units on its short side and stretches up to 570 on the long one
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let W = 480, H = 360, pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 280) availW = window.innerWidth - 2 * side;
    }
    availW = Math.max(100, availW); availH = Math.max(100, availH);
    const asp = availW / availH;
    if (asp >= 1) { H = 320; W = Math.round(Math.min(570, 320 * asp)); }
    else { W = 320; H = Math.round(Math.min(570, 320 / asp)); }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1400, 0.04, "square", 0.018, -600)),
    boom: lim(() => { noise(0.35, 0.22, 900); beep(160, 0.2, "sawtooth", 0.025, -90); }),
    hit: lim(() => beep(220, 0.06, "square", 0.03, -60)),
    missile: lim(() => beep(500, 0.3, "sawtooth", 0.015, 500)),
    enemyShot: lim(() => beep(700, 0.06, "triangle", 0.02, -300)),
    para: lim(() => arp([988, 1319, 1568, 1976], 0.05, 0.08, "triangle", 0.05)),
    formation: () => arp([784, 988, 1175, 1568], 0.06, 0.1, "square", 0.035),
    boss: () => arp([196, 262, 196, 262], 0.16, 0.16, "sawtooth", 0.03),
    bossDown: () => { noise(1.2, 0.3, 600); arp([392, 523, 659, 784, 1047], 0.1, 0.18, "square", 0.04); },
    warp: () => { beep(200, 2.2, "sawtooth", 0.03, 1800); beep(300, 2.2, "triangle", 0.03, 2400, 0.1); },
    die: () => { noise(0.9, 0.3, 500); arp([659, 523, 392, 330, 262], 0.1, 0.15, "sawtooth", 0.035); },
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, era = 0, loop = 0, kills = 0, bestCache = 0, nextLife = 10000;
  let player = null, shots = [], foes = [], eshots = [], missiles = [], paras = [], boss = null, groups = {};
  let parts = [], trails = [], popups = [], message = null, shake = 0;
  let spawnT = 0, formT = 0, paraT = 0, paraN = 0, bossDownT = 0, groupId = 0, eraT = 0;
  let targetAng = null, fireHeld = false;
  const ctl = { up: false, down: false, left: false, right: false };

  const E = () => ERAS[era];
  const need = () => diff.need + loop * 6;
  const isPlaying = () => ["intro", "play", "dead", "warp"].includes(state);

  function newPlayer(x = 0, y = 0, ang = -Math.PI / 2) { return { x, y, ang, speed: 150, inv: 2, cool: 0, dead: false }; }
  function resetSky() {
    foes = []; eshots = []; missiles = []; paras = []; boss = null; groups = {}; shots = [];
    kills = 0; paraN = 0; spawnT = 1; formT = rnd(6, 9); paraT = rnd(7, 11); bossDownT = 0; eraT = 0;
  }

  // ---------- Flow ----------
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; era = 0; loop = 0; nextLife = 10000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    player = newPlayer();
    resetSky(); parts = []; trails = []; popups = [];
    beginEra();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginEra() {
    message = { text: `ANNO ${E().year}`, sub: E().name, t: 0 };
    state = "intro"; stateT = 1.8;
    player.inv = Math.max(player.inv, 2.5);
  }
  function addScore(n, x, y, color = "#f4f6ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) {
      nextLife += 40000; if (lives < 9) lives++; sfx.life();
      popups.push({ x: player.x, y: player.y - 30, text: "VITA EXTRA", color: "#ffcf4a", t: 0, big: true });
    }
  }
  function burst(x, y, color, n = 12, sp = 120, life = 0.6) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = sp * (0.2 + Math.random() * 0.9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * (0.5 + Math.random() * 0.8), c: color, r: 1.5 + Math.random() * 2 });
    }
  }
  function explode(x, y, big = false) {
    burst(x, y, "#ffcf4a", big ? 40 : 14, big ? 200 : 120, big ? 1 : 0.6);
    burst(x, y, "#ff6a3a", big ? 30 : 10, big ? 150 : 90, big ? 0.9 : 0.5);
    burst(x, y, "#5a5a6a", big ? 20 : 6, big ? 80 : 50, big ? 1.4 : 0.9);
    if (big) shake = 0.6;
  }
  function killPlayer() {
    if (state !== "play" || player.inv > 0) return;
    lives--; player.dead = true;
    sfx.die(); explode(player.x, player.y, true);
    state = "dead"; stateT = 2.2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // the sky around the respawn point is cleared; the era's progress is kept
    eshots = []; missiles = [];
    foes = foes.filter((f) => Math.hypot(f.x - player.x, f.y - player.y) > 320);
    for (const g in groups) groups[g].broken = true;
    if (boss && Math.hypot(boss.x - player.x, boss.y - player.y) < 260) placeBoss();
    player = newPlayer(player.x, player.y, player.ang);
    player.inv = 2.5;
    state = "play";
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, yr = E().year;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Anno ${yr}${loop ? ` (giro ${loop + 1})` : ""} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% - 20px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PILOTA DEL TEMPO</h1>
       <p>Il tuo jet vola libero in ogni direzione attraverso le epoche: dai biplani del 1910 agli UFO del 2001. Abbatti abbastanza nemici e comparirà il gigante dell'epoca: distruggilo per aprire il varco del tempo verso l'anno successivo.</p>
       <div class="pts">
         <span><b>Aereo nemico</b></span><span>100 · 50 in più a ogni epoca</span>
         <span><b>Missile abbattuto</b></span><span>150</span>
         <span><b>Squadriglia intera</b></span><span>1.000 di bonus</span>
         <span><b>Paracadutista salvato</b></span><span>500, 1.000, 1.500…</span>
         <span><b>Gigante dell'epoca</b></span><span>da 3.000 in su</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: spingi verso dove vuoi andare e l'aereo vira da solo · tieni premuto FUOCO per sparare</p>`
         : `<p class="muted help">Frecce o W A S D per virare (anche in diagonale) · SPAZIO o Z tenuti premuti per sparare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DECOLLA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  function keyAngle() {
    const dx = (ctl.right ? 1 : 0) - (ctl.left ? 1 : 0), dy = (ctl.down ? 1 : 0) - (ctl.up ? 1 : 0);
    targetAng = dx || dy ? Math.atan2(dy, dx) : null;
  }
  window.addEventListener("keydown", (e) => {

      ctx.beginPath(); ctx.ellipse(0, 0, 48, 17, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(0,0,0,0.18)"; for (let k = -36; k <= 36; k += 12) ctx.fillRect(k, -15, 1.5, 30);
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-54, -14); ctx.lineTo(-54, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#6a4a2a"; ctx.fillRect(-8, -4, 18, 8);
      ctx.fillStyle = "#c83a3a"; ctx.beginPath(); ctx.arc(20, 0, 5, 0, TAU); ctx.fill();
    } else if (b.kind === "bomber") {
      ctx.beginPath(); ctx.ellipse(0, 0, 36, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, -3); ctx.lineTo(0, -44); ctx.lineTo(-6, -44); ctx.lineTo(-4, 0); ctx.lineTo(-6, 44); ctx.lineTo(0, 44); ctx.lineTo(10, 3); ctx.fill(); ctx.stroke();
      ctx.fillRect(-34, -16, 7, 32); ctx.strokeRect(-34, -16, 7, 32);
      ctx.fillStyle = "#3a3a3a"; for (const y of [-30, -15, 15, 30]) ctx.fillRect(4, y - 2, 8, 4);
      ctx.fillStyle = "rgba(255,255,255,0.5)"; for (const y of [-30, -15, 15, 30]) ctx.fillRect(12, y - 5 + Math.sin(b.t * 50 + y) * 3, 1.5, 6);
      ctx.fillStyle = "#9ad0ff"; ctx.fillRect(28, -2, 6, 4);
    } else if (b.kind === "chinook") {
      ctx.beginPath(); ctx.ellipse(0, 0, 44, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#9ad0ff"; ctx.fillRect(34, -6, 6, 12);
      ctx.strokeStyle = "rgba(20,20,20,0.75)"; ctx.lineWidth = 2.5;
      for (const [ox, dir] of [[30, 1], [-30, -1]]) {
        const r = b.t * 20 * dir;
        for (let k = 0; k < 3; k++) { const a = r + k * TAU / 3; ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox + Math.cos(a) * 24, Math.sin(a) * 24); ctx.stroke(); }
        ctx.fillStyle = "rgba(20,20,20,0.12)"; ctx.beginPath(); ctx.arc(ox, 0, 24, 0, TAU); ctx.fill();
      }
    } else if (b.kind === "strato") {
      ctx.beginPath(); ctx.ellipse(0, 0, 42, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, -3); ctx.lineTo(-14, -46); ctx.lineTo(-20, -46); ctx.lineTo(-8, 0); ctx.lineTo(-20, 46); ctx.lineTo(-14, 46); ctx.lineTo(10, 3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-32, 0); ctx.lineTo(-42, -16); ctx.lineTo(-46, -16); ctx.lineTo(-40, 0); ctx.lineTo(-46, 16); ctx.lineTo(-42, 16); ctx.fill();
      ctx.fillStyle = "#3a3a44"; for (const y of [-34, -22, 22, 34]) ctx.fillRect(-10 - Math.abs(y) * 0.5, y - 1.5, 9, 3);
      ctx.fillStyle = "#ff8a3a"; for (const y of [-34, -22, 22, 34]) ctx.fillRect(-13 - Math.abs(y) * 0.5 - Math.random() * 3, y - 1, 3, 2);
    } else {
      ctx.rotate(-b.ang + b.t * 0.6);
      ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.fill();
      ctx.fillStyle = b.flash > 0 ? "#fff" : "#d8f0ff"; ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
      for (let k = 0; k < 12; k++) { const a = k * TAU / 12; ctx.fillStyle = Math.floor(b.t * 6 + k) % 3 === 0 ? "#fff" : "#ff5ae0"; ctx.beginPath(); ctx.arc(Math.cos(a) * 43, Math.sin(a) * 43, 2.5, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }
  function drawPara(q) {
    ctx.save(); ctx.translate(q.x, q.y);
    const sway = Math.sin(q.t * 1.3) * 0.15; ctx.rotate(sway);
    if (E().para) {
      ctx.fillStyle = Math.floor(q.t * 2) % 2 ? "#ffffff" : "#ff6a5a";
      ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(0, 5); ctx.lineTo(9, -6); ctx.moveTo(0, -6); ctx.lineTo(0, 5); ctx.stroke();
      ctx.fillStyle = "#2a2a3a"; ctx.fillRect(-1.5, 4, 3, 5);
    } else {
      // an astronaut floating in space
      ctx.fillStyle = "#f4f6ff"; ctx.beginPath(); ctx.arc(0, -3, 4, 0, TAU); ctx.fill(); ctx.fillRect(-3, 0, 6, 7);
      ctx.fillStyle = "#ffcf4a"; ctx.fillRect(-2, -4, 4, 2);
      ctx.strokeStyle = "#7dff9a"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 10 + Math.sin(q.t * 4) * 2, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  function edgeArrow(x, y, color, big) {
    // points at something outside the view
    const dx = x - player.x, dy = y - player.y;
    if (Math.abs(dx) < W / 2 - 4 && Math.abs(dy) < H / 2 - 4) return;
    const mx = W / 2 - 14, myTop = H / 2 - HUD - 12, myBot = H / 2 - 14;
    const my = dy < 0 ? myTop : myBot;
    const k = Math.min(mx / Math.abs(dx || 1e-6), my / Math.abs(dy || 1e-6));
    const sx = W / 2 + dx * k, sy = H / 2 + dy * k, a = Math.atan2(dy, dx), s = big ? 9 : 6;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
    ctx.globalAlpha = big ? 0.6 + 0.4 * Math.sin(clock * 8) : 0.8;
    ctx.fillStyle = color; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s, -s * 0.8); ctx.lineTo(-s * 0.4, 0); ctx.lineTo(-s, s * 0.8); ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function drawPlaneIcon(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2); ctx.scale(s, s);
    ctx.fillStyle = "#e8f0ff";
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-1, -11); ctx.lineTo(-5, -11); ctx.lineTo(-3, -3); ctx.lineTo(-12, -7); ctx.lineTo(-11, 0); ctx.lineTo(-12, 7); ctx.lineTo(-3, 3); ctx.lineTo(-5, 11); ctx.lineTo(-1, 11); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    const e = E();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, e.sky[0]); g.addColorStop(1, e.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (!player) return;
    const sx = shake > 0 ? rnd(-3, 3) * shake : 0, sy = shake > 0 ? rnd(-3, 3) * shake : 0;
    ctx.translate(sx, sy);
    drawClouds(1, 0.55, 0.35, false);
    drawClouds(2, 1, 0.6, false);
    ctx.save();
    ctx.translate(W / 2 - player.x, H / 2 - player.y);
    for (const q of trails) {
      ctx.globalAlpha = 0.5 * (1 - q.t / q.life);
      ctx.fillStyle = q.smoke ? "#d0d0d0" : "#ffffff";
      ctx.beginPath(); ctx.arc(q.x, q.y, (q.smoke ? 2 : 1.6) + q.t * 5, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const q of paras) drawPara(q);
    if (boss) drawBoss(boss);
    for (const f of foes) drawFoe(f);
    for (const m of missiles) {
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ang);
      ctx.fillStyle = "#f4f6ff"; ctx.fillRect(-5, -1.5, 10, 3); ctx.fillStyle = "#ff4a5a"; ctx.fillRect(3, -1.5, 3, 3);
      ctx.fillStyle = "#ffcf4a"; ctx.fillRect(-8 - Math.random() * 3, -1, 3, 2);
      ctx.restore();
    }
    ctx.fillStyle = "#ffe89a";
    for (const b of shots) { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, TAU); ctx.fill(); }
    for (const b of eshots) {
      ctx.fillStyle = "#ff3a4a"; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, 1.3, 0, TAU); ctx.fill();
    }
    if (!player.dead && state !== "warp" && !(player.inv > 0 && state === "play" && Math.floor(clock * 12) % 2)) drawPlayer(player);
    if (state === "warp") drawPlayer(player);
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "900 18px system-ui, sans-serif" : "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawClouds(3, 1.3, 0.45, true);
    if (state === "warp") {
      // the time gate: streaks rushing out from the centre
      const k = 1 - stateT / 2.6;
      ctx.strokeStyle = `rgba(255,255,255,${0.3 + k * 0.5})`; ctx.lineWidth = 1.5;
      for (let i = 0; i < 40; i++) {
        const a = hash(i, 7, 3) * TAU, d0 = ((hash(i, 8, 3) + clock * 1.5) % 1) * viewR(), d1 = d0 + 20 + k * 60;
        ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * d0, H / 2 + Math.sin(a) * d0); ctx.lineTo(W / 2 + Math.cos(a) * d1, H / 2 + Math.sin(a) * d1); ctx.stroke();
      }
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, k - 0.6) * 2.2})`; ctx.fillRect(0, 0, W, H);
    }
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (boss) edgeArrow(boss.x, boss.y, "#ff4a5a", true);
    for (const q of paras) edgeArrow(q.x, q.y, "#7dff9a", false);

    if (state === "menu") return;
    // status bar
    ctx.fillStyle = "rgba(6,8,20,0.72)"; ctx.fillRect(0, 0, W, HUD);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "900 14px system-ui, sans-serif"; ctx.fillStyle = "#f4f6ff";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 13);
    const sw = ctx.measureText(score.toLocaleString("it-IT")).width;
    ctx.font = "700 9px system-ui, sans-serif"; ctx.fillStyle = "#a0a8c8";
    ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8 + Math.max(58, sw + 10), 13);
    ctx.textAlign = "right"; ctx.font = "900 13px system-ui, sans-serif"; ctx.fillStyle = "#ffcf4a";
    ctx.fillText(`${e.year}`, W - 8, 13);
    // progress towards the giant
    const bw = Math.min(110, W * 0.26), bx = W - 48 - bw;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(bx, 9, bw, 8);
    const pr = boss || bossDownT > 0 ? 1 : Math.min(1, kills / need());
    ctx.fillStyle = boss ? (Math.floor(clock * 6) % 2 ? "#ff4a5a" : "#ffcf4a") : "#6ac8ff"; ctx.fillRect(bx, 9, bw * pr, 8);
    if (boss) { ctx.fillStyle = "#200"; ctx.fillRect(bx + 1, 10, (bw - 2) * (1 - boss.hp / boss.maxHp), 6); }
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, 9.5, bw - 1, 7);
    // spare planes, bottom left
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 8); i++) drawPlaneIcon(12 + i * 15, H - 12, 0.5);
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(6,8,20,0.7)"; ctx.fillRect(0, H / 2 - 62, W, message.sub ? 52 : 36);
      ctx.textAlign = "center"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillStyle = "#ffcf4a";
      ctx.fillText(message.text, W / 2, H / 2 - 36);
      if (message.sub) { ctx.font = "700 12px system-ui, sans-serif"; ctx.fillStyle = "#f4f6ff"; ctx.fillText(message.sub, W / 2, H / 2 - 17); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop_(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop_);
  }
  syncControls();
  // the title screen shows a quiet sky behind the menu
  player = newPlayer();
  showTitle();
  requestAnimationFrame(loop_);
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trappola Aliena</title>
<style>
  :root {
    --bg: #1a140a;
    --fg: #f4f6ee;
    --muted: #e0d8c0;
    --pink: #c87aff;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk the streets; hold SCAVA to dig a hole ahead, or to fill one with an alien inside */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(200, 122, 255, 0.9); background: rgba(200, 122, 255, 0.22); }
  #touch .jump.on { background: rgba(200, 122, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 20, 10, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a4a, 0 0 22px rgba(255,122,184,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #200230; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #7a2aa8; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Scava">SCAVA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the old capital is a grid: streets every 4 columns and every 3 rows, walled blocks in between
  const COLS = 29, ROWS = 13, CS = 22, X0 = (W - COLS * CS) / 2, Y0 = TOP + (H - TOP - ROWS * CS) / 2;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const START = { c: 14, r: 12 };
  const SPAWNS = [[0, 0], [28, 0], [12, 0], [16, 0], [0, 6], [28, 6], [4, 3], [24, 3], [8, 0], [20, 0]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "4 vite · alieni lenti e distratti · restano a lungo nella buca", lives: 4, speed: 2.4, chase: 0.4, trap: 4.2, dig: 0.45, avoid: 0.2, extra: 0 },
    normale:   { label: "NORMALE",   color: "#c87aff", desc: "3 vite", lives: 3, speed: 3.0, chase: 0.55, trap: 3, dig: 0.55, avoid: 0.45, extra: 0 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · un alieno in più · svelti e furbi · escono presto dalla buca", lives: 3, speed: 3.2, chase: 0.65, trap: 2.7, dig: 0.6, avoid: 0.55, extra: 1 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "trappola-difficulty";
  const bestKey = (id) => `trappola-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const street = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && (c % 4 === 0 || r % 3 === 0);
  const px = (c) => X0 + c * CS + CS / 2, py = (r) => Y0 + r * CS + CS / 2;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    dig: lim(() => beep(rnd(140, 200), 0.05, "sawtooth", 0.02, -60)),
    hole: lim(() => arp([330, 262], 0.05, 0.08, "triangle", 0.04)),
    fall: lim(() => beep(880, 0.35, "square", 0.035, -700)),
    climb: lim(() => arp([262, 330, 392], 0.06, 0.08, "square", 0.03)),
    bury: lim(() => arp([523, 659, 784, 1047], 0.05, 0.1, "square", 0.04)),
    die: () => arp([784, 659, 523, 392, 262], 0.09, 0.16, "triangle", 0.05),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.08, 0.14, "square", 0.045),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
    angry: () => arp([220, 233, 220, 233], 0.1, 0.12, "sawtooth", 0.03),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, lives = 3, level = 1, timeLeft = 100, angry = false, nextLife = 5000, buried = 0;
  let hero = null, aliens = [], holes = new Map(), parts = [], popups = [], message = null;
  let work = null, deadT = 0, clearT = 0, inv = 0;
  let digHeld = false, digLatch = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The streets ----------
  const key = (c, r) => c * 100 + r;
  const holeAt = (c, r) => holes.get(key(c, r));
  // the hero walks the streets but never into a hole
  const heroOpen = (c, r) => street(c, r) && !holeAt(c, r);
  const posOf = (e) => ({ x: e.c + (e.tc - e.c) * e.prog, y: e.r + (e.tr - e.r) * e.prog });
  function mover(c, r) { return { c, r, tc: c, tr: r, prog: 0 }; }
  function step(e, speed, dt) {
    // returns true when the walker reaches the cell it was heading for
    if (e.tc === e.c && e.tr === e.r) return false;
    e.prog += speed * dt;
    if (e.prog >= 1) { e.c = e.tc; e.r = e.tr; e.prog = 0; return true; }
    return false;
  }

  function spawnAliens() {
    aliens = [];
    const n = Math.min(10, 2 + level + diff.extra);
    const spots = SPAWNS.slice().sort(() => Math.random() - 0.5).slice(0, n);
    spots.forEach(([c, r], i) => {
      const boss = level >= 3 && i === 0;
      aliens.push({ ...mover(c, r), boss, mode: "walk", trapT: 0, wait: 0.6 + i * 0.35, dx: 0, dy: 0, wob: Math.random() * TAU });
    });
  }
  function alienSpeed(a) {
    let s = diff.speed + Math.min(1.4, (level - 1) * 0.15);
    if (a.boss) s += 0.35;
    if (angry) s *= 1.3;
    return s;
  }
  function trapTime(a) { return Math.max(1.8, diff.trap - (level - 1) * 0.2) * (a.boss ? 0.7 : 1); }
  function alienOpen(c, r) { if (!street(c, r)) return false; const h = holeAt(c, r); return !(h && h.alien); }
  function chooseDir(a) {
    const hp = posOf(hero);
    let opts = DIRS.filter(([dx, dy]) => alienOpen(a.c + dx, a.r + dy) && !(dx === -a.dx && dy === -a.dy && (a.dx || a.dy)));
    // a wary alien sees an open hole ahead and walks around it: dig it at the last moment, when it is already on its way
    const wary = Math.min(0.65, diff.avoid + (level - 1) * 0.03);
    const safe = opts.filter(([dx, dy]) => !holeAt(a.c + dx, a.r + dy) || Math.random() > wary);
    if (safe.length) opts = safe;
    if (!opts.length) opts = DIRS.filter(([dx, dy]) => alienOpen(a.c + dx, a.r + dy));
    if (!opts.length) return;
    let pick;
    if (Math.random() < (angry ? 0.9 : diff.chase)) {
      let best = 1e9;
      for (const o of opts) { const d = Math.hypot(a.c + o[0] - hp.x, a.r + o[1] - hp.y) + Math.random() * 0.3; if (d < best) { best = d; pick = o; } }
    } else pick = opts[Math.floor(Math.random() * opts.length)];
    a.dx = pick[0]; a.dy = pick[1]; a.tc = a.c + a.dx; a.tr = a.r + a.dy; a.prog = 0;
  }
  function updateAliens(dt) {
    for (const a of aliens) {
      a.wob += dt * 6;
      if (a.mode === "trap") {
        a.trapT -= dt;
        if (a.trapT <= 0) {
          // it claws its way out and the hole caves in behind it
          holes.delete(key(a.c, a.r));
          a.mode = "walk"; a.dx = -a.dx; a.dy = -a.dy;
          if (work && work.c === a.c && work.r === a.r) work = null;
          popups.push({ x: px(a.c), y: py(a.r) - 10, text: "SCAPPATO!", color: "#ff8a5a", t: 0 });
          sfx.climb();
        }
        continue;
      }
      if (a.wait > 0) { a.wait -= dt; continue; }
      if (a.tc === a.c && a.tr === a.r) { chooseDir(a); continue; }
      // a hole in the road ahead: the alien is past the middle of its step and drops in
      const h = holeAt(a.tc, a.tr);
      if (h && h.alien) { const c = a.c, r = a.r; a.c = a.tc; a.r = a.tr; a.tc = c; a.tr = r; a.prog = 1 - a.prog; a.dx = -a.dx; a.dy = -a.dy; }
      if (step(a, alienSpeed(a), dt)) {
        const hh = holeAt(a.c, a.r);
        if (hh && !hh.alien) { hh.alien = a; a.mode = "trap"; a.trapT = trapTime(a); a.tc = a.c; a.tr = a.r; sfx.fall(); popups.push({ x: px(a.c), y: py(a.r) - 10, text: "PRESO!", color: "#ffe14a", t: 0 }); }
        else chooseDir(a);
      }
    }
  }

  // ---------- Digging ----------
  // the hero digs the street cell in front of him; the same button fills a hole back in, burying whatever is inside
  function workTarget() {
    if (hero.tc !== hero.c || hero.tr !== hero.r) return null;
    const c = hero.c + hero.fx, r = hero.r + hero.fy;
    if (!street(c, r)) return null;
    const h = holeAt(c, r);
    return { c, r, kind: h ? (h.alien ? "bury" : "fill") : "dig" };
  }
  function updateWork(dt) {
    // once a job is done the button must be let go before the next one, so a fresh hole is never filled by mistake
    if (!digHeld) digLatch = false;
    const t = digHeld && !digLatch ? workTarget() : null;
    if (!t) { work = null; return; }
    if (!work || work.c !== t.c || work.r !== t.r || work.kind !== t.kind) work = { ...t, p: 0 };
    if (work.kind === "dig") {
      // no digging under an alien's feet
      if (aliens.some((a) => a.mode === "walk" && Math.hypot(posOf(a).x - t.c, posOf(a).y - t.r) < 0.55)) return;
      work.p += dt / diff.dig;
      if (Math.random() < dt * 14) { sfx.dig(); dirt(t.c, t.r, 2); }
      if (work.p >= 1) { holes.set(key(t.c, t.r), { c: t.c, r: t.r, alien: null }); sfx.hole(); dirt(t.c, t.r, 8); work = null; digLatch = true; }
    } else if (work.kind === "fill") {
      work.p += dt / (diff.dig * 0.7);
      if (Math.random() < dt * 14) sfx.dig();
      if (work.p >= 1) { holes.delete(key(t.c, t.r)); dirt(t.c, t.r, 6); work = null; digLatch = true; }
    } else {
      work.p += dt / 0.5;
      if (Math.random() < dt * 14) { sfx.dig(); dirt(t.c, t.r, 2); }
      if (work.p >= 1) {
        const h = holeAt(t.c, t.r), a = h.alien;
        holes.delete(key(t.c, t.r));
        aliens = aliens.filter((x) => x !== a);
        buried++;
        const pts = (a.boss ? 300 : 100) * level;
        addScore(pts);
        popups.push({ x: px(t.c), y: py(t.r) - 10, text: `+${pts}`, color: a.boss ? "#ff5a5a" : "#c87aff", t: 0 });
        dirt(t.c, t.r, 14); sfx.bury();
        work = null; digLatch = true;
      }
    }
  }
  function dirt(c, r, n) {
    for (let i = 0; i < n; i++) parts.push({ x: px(c) + rnd(-6, 6), y: py(r) + rnd(-4, 4), vx: rnd(-50, 50), vy: rnd(-90, -20), t: 0, life: rnd(0.3, 0.6), color: Math.random() < 0.5 ? "#8a6a3a" : "#b89a5a" });
  }
  function addScore(n) {
    score += n;
    if (score >= nextLife) { lives++; nextLife = nextLife < 40000 ? 40000 : Infinity; sfx.oneup(); popups.push({ x: px(hero.c), y: py(hero.r) - 20, text: "VITA EXTRA!", color: "#7ed87a", t: 0 }); }
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startLevel(fresh) {
    holes = new Map(); work = null; angry = false;
    timeLeft = 100;
    hero = { ...mover(START.c, START.r), fx: 0, fy: -1 };
    spawnAliens();
    inv = 1;
    if (fresh) message = { text: `QUARTIERE ${level}`, sub: `${aliens.length} alieni per le strade${level >= 3 ? " · il capo rosso esce prima!" : ""}`, t: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 10000; buried = 0; deadT = 0; clearT = 0; parts = []; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startLevel(true);
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function loseLife() {
    deadT = 1.6; work = null; sfx.die();
    for (let i = 0; i < 18; i++) parts.push({ x: px(hero.c), y: py(hero.r), vx: rnd(-90, 90), vy: rnd(-120, 20), t: 0, life: rnd(0.4, 0.9), color: Math.random() < 0.5 ? "#3a5ad8" : "#f4e0c8" });
  }
  function afterDeath() {
    lives--;
    if (lives <= 0) { gameOver(); return; }
    // the survivors go back to their corners; the holes are left as they were, trapped aliens included
    hero = { ...mover(START.c, START.r), fx: 0, fy: -1 };
    const walkers = aliens.filter((a) => a.mode === "walk");
    const spots = SPAWNS.slice().sort(() => Math.random() - 0.5);
    walkers.forEach((a, i) => { const [c, r] = spots[i % spots.length]; Object.assign(a, mover(c, r), { wait: 0.8 + i * 0.3, dx: 0, dy: 0 }); });
    inv = 1.5;
    message = { text: "FORZA!", sub: `${lives} ${lives === 1 ? "vita rimasta" : "vite rimaste"}`, t: 0 };
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">LA CITTÀ È CADUTA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · quartiere ${level} · ${buried} ${buried === 1 ? "alieno sepolto" : "alieni sepolti"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>DI NUOVO DI RONDA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>TRAPPOLA ALIENA</h1>
       <p>Gli alieni sono sbarcati nell'antica capitale e girano per le sue strade a scacchiera. Tu sei la guardia di ronda e hai solo una pala: scava una buca davanti a te, aspetta che un alieno ci cada dentro e ricoprila prima che riesca a uscire. Seppelliscili tutti per passare al quartiere successivo.</p>
       <div class="pts">
         <span><b>Buche</b></span><span>scava la strada davanti a te · su una buca vuota la ricopri · su un alieno intrappolato lo seppellisci</span>
         <span><b>Punti</b></span><span>alieno 100 × quartiere · capo rosso 300 × quartiere · bonus tempo a fine quartiere · vita extra a 10.000 e a 40.000</span>
         <span><b>Tempo</b></span><span>100 secondi per quartiere: poi gli alieni si arrabbiano e corrono di più</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta per camminare e per girarti · tieni premuto SCAVA</p>`
         : `<p class="muted help">Frecce o WASD per camminare e per girarti · tieni premuto SPAZIO (o J) per scavare · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA LA RONDA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const DIGKEYS = [" ", "j", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (DIGKEYS.includes(k)) digHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (DIGKEYS.includes(k)) digHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; digHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); digHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { digHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function wanted() {
    // the stronger axis first, the other one as a fallback so a diagonal still turns at the next corner
    const mx = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x, -1, 1);
    const my = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    const out = [];
    const h = mx ? [Math.sign(mx), 0] : null, v = my ? [0, Math.sign(my)] : null;
    if (Math.abs(mx) >= Math.abs(my)) { if (h) out.push(h); if (v) out.push(v); } else { if (v) out.push(v); if (h) out.push(h); }
    return out;
  }
  function updateHero(dt) {
    const want = wanted();
    const moving = hero.tc !== hero.c || hero.tr !== hero.r;
    if (moving) {
      const mdx = hero.tc - hero.c, mdy = hero.tr - hero.r;
      if (want.length && want[0][0] === -mdx && want[0][1] === -mdy) {
        const c = hero.c, r = hero.r; hero.c = hero.tc; hero.r = hero.tr; hero.tc = c; hero.tr = r; hero.prog = 1 - hero.prog; hero.fx = -mdx; hero.fy = -mdy;
      }
      if (!step(hero, 4.3, dt)) return;
    }
    if (!want.length) return;
    if (digHeld) { hero.fx = want[0][0]; hero.fy = want[0][1]; return; }
    for (const [dx, dy] of want) {
      if (heroOpen(hero.c + dx, hero.r + dy)) { hero.fx = dx; hero.fy = dy; hero.tc = hero.c + dx; hero.tr = hero.r + dy; hero.prog = 0; return; }
    }
    hero.fx = want[0][0]; hero.fy = want[0][1];
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    if (state !== "play") return;
    if (deadT > 0) { deadT -= dt; if (deadT <= 0) afterDeath(); return; }
    if (clearT > 0) {
      clearT -= dt;
      if (clearT <= 0) { level++; startLevel(true); }
      return;
    }
    if (inv > 0) inv -= dt;
    timeLeft -= dt;
    if (timeLeft <= 0 && !angry) { angry = true; timeLeft = 0; sfx.angry(); message = { text: "SI SONO ARRABBIATI!", sub: "gli alieni corrono di più", t: 0 }; }
    if (timeLeft < 0) timeLeft = 0;
    updateHero(dt);
    updateWork(dt);
    updateAliens(dt);
    const hp = posOf(hero);
    if (inv <= 0) for (const a of aliens) {
      if (a.mode !== "walk") continue;
      const p = posOf(a);
      if (Math.hypot(p.x - hp.x, p.y - hp.y) < 0.62) { loseLife(); return; }
    }
    if (!aliens.length) {
      const bonus = Math.ceil(timeLeft) * 10 * level;
      addScore(bonus);
      clearT = 2.6; sfx.clear();
      message = { text: "QUARTIERE LIBERATO!", sub: `bonus tempo +${bonus.toLocaleString("it-IT")}`, t: 0 };
    }
  }

  // ---------- Drawing ----------
  function drawCity() {
    ctx.fillStyle = "#1a140a"; ctx.fillRect(0, TOP, W, H - TOP);
    // the streets: packed sand
    ctx.fillStyle = "#d8c08a"; ctx.fillRect(X0, Y0, COLS * CS, ROWS * CS);
    // the walled blocks with their tiled roofs
    for (let bc = 0; bc < 7; bc++) for (let br = 0; br < 4; br++) {
      const x = X0 + (bc * 4 + 1) * CS, y = Y0 + (br * 3 + 1) * CS, w = 3 * CS, h = 2 * CS;
      ctx.fillStyle = "#f0e6d0"; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      ctx.fillStyle = "#a83a2a"; ctx.fillRect(x + 2, y + 2, w - 4, 3); ctx.fillRect(x + 2, y + h - 5, w - 4, 3);
      const hue = (bc + br) % 3;
      ctx.fillStyle = ["#3a4a6a", "#4a3a5a", "#2a4a4a"][hue];
      ctx.fillRect(x + 8, y + 9, w - 16, h - 18);
      ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + 8, y + 9 + i * (h - 18) / 5); ctx.lineTo(x + w - 8, y + 9 + i * (h - 18) / 5); ctx.stroke(); }
      ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x + 6, y + 7, w - 12, 3);
      if ((bc * 3 + br) % 4 === 0) { ctx.fillStyle = "#4a8a3a"; ctx.beginPath(); ctx.arc(x + w - 9, y + h - 9, 5, 0, TAU); ctx.fill(); }
    }
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.strokeRect(X0, Y0, COLS * CS, ROWS * CS);
  }
  function drawHole(h) {
    const x = px(h.c), y = py(h.r);
    ctx.fillStyle = "#8a6a3a"; ctx.beginPath(); ctx.ellipse(x, y, 10, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a0e04"; ctx.beginPath(); ctx.ellipse(x, y + 1, 8, 6, 0, 0, TAU); ctx.fill();
    if (h.alien) {
      const a = h.alien, f = a.trapT / trapTime(a);
      const shake = Math.sin(clock * (f < 0.3 ? 40 : 16)) * (f < 0.3 ? 2 : 1);
      ctx.save(); ctx.translate(x, y); ctx.scale(1.2, 1.2); ctx.translate(-x, -y);
      drawAlienBody(x + shake, y + 2, a.boss, true);
      ctx.restore();
      ctx.strokeStyle = f < 0.3 ? "#ff5a5a" : "#ffe14a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 12, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke();
    }
  }
  function drawAlienBody(x, y, boss, sunk) {
    const col = boss ? "#e83a3a" : "#5ad84a", dark = boss ? "#8a1a1a" : "#2a7a2a";
    ctx.save();
    if (sunk) { ctx.beginPath(); ctx.rect(x - 12, y - 16, 24, 18); ctx.clip(); }
    const s = boss ? 1.2 : 1;
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y - 1, 7 * s, 8 * s, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 3, y - 8 * s); ctx.lineTo(x - 5, y - 13 * s); ctx.moveTo(x + 3, y - 8 * s); ctx.lineTo(x + 5, y - 13 * s); ctx.stroke();
    ctx.fillStyle = "#ffe14a"; ctx.beginPath(); ctx.arc(x - 5, y - 13 * s, 1.6, 0, TAU); ctx.arc(x + 5, y - 13 * s, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x - 2.6, y - 3, 2.4, 0, TAU); ctx.arc(x + 2.6, y - 3, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a0a2a"; ctx.beginPath(); ctx.arc(x - 2.4, y - 2.6, 1.2, 0, TAU); ctx.arc(x + 2.8, y - 2.6, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawAlien(a) {
    const p = posOf(a), x = px(p.x), y = py(p.y) + Math.sin(a.wob) * 1.2;
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(x, py(p.y) + 7, 7, 2.5, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.scale(1.3, 1.3); ctx.translate(-x, -y);
    drawAlienBody(x, y, a.boss, false);
    const leg = Math.sin(a.wob * 1.5) * 2;
    ctx.strokeStyle = a.boss ? "#8a1a1a" : "#2a7a2a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 3, y + 6); ctx.lineTo(x - 4 - leg, y + 9); ctx.moveTo(x + 3, y + 6); ctx.lineTo(x + 4 + leg, y + 9); ctx.stroke();
    if (angry) { ctx.fillStyle = "#ff3a3a"; ctx.font = "900 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("!", x + 8, y - 8); }
    ctx.restore();
  }
  function drawHero() {
    const p = posOf(hero), x = px(p.x), y = py(p.y);
    if (inv > 0 && Math.floor(clock * 12) % 2) return;
    const walking = hero.tc !== hero.c || hero.tr !== hero.r, sw = walking ? Math.sin(clock * 18) * 2 : 0;
    ctx.save(); ctx.translate(x, y); ctx.scale(1.3, 1.3); ctx.translate(-x, -y);
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(x, y + 8, 7, 2.5, 0, 0, TAU); ctx.fill();
    // a guard of the old capital: blue robe, tall black hat, and a shovel
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - 4 + sw * 0.5, y + 3, 3, 6); ctx.fillRect(x + 1 - sw * 0.5, y + 3, 3, 6);
    ctx.fillStyle = "#3a5ad8"; ctx.beginPath(); ctx.moveTo(x - 7, y + 5); ctx.lineTo(x + 7, y + 5); ctx.lineTo(x + 5, y - 4); ctx.lineTo(x - 5, y - 4); ctx.fill();
    ctx.fillStyle = "#f4e0c8"; ctx.beginPath(); ctx.arc(x, y - 7, 4.2, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - 3, y - 15, 6, 6); ctx.beginPath(); ctx.ellipse(x, y - 10, 5, 1.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - 2 + hero.fx * 1.5, y - 8 + hero.fy, 1.3, 1.3); ctx.fillRect(x + 1 + hero.fx * 1.5, y - 8 + hero.fy, 1.3, 1.3);
    // the shovel points the way he faces, and bobs while he digs
    const dig = work ? Math.sin(clock * 30) * 3 : 0;
    const sx = x + hero.fx * (9 + dig), sy = y + hero.fy * (9 + dig) + 1;
    ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + hero.fx * 3, y + hero.fy * 3); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.fillStyle = "#c8c8d8"; ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(26,20,10,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#e0d8c0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#c87aff"; ctx.font = "900 10px system-ui"; ctx.fillText(`QUARTIERE ${level}`, x0 + 80, 21);
    ctx.textAlign = "center";
    ctx.fillStyle = angry ? "#ff5a5a" : timeLeft < 20 ? "#ffe14a" : "#ffffff"; ctx.font = "900 14px system-ui";
    ctx.fillText(angry ? "FURIA!" : `⏱ ${Math.ceil(timeLeft)}`, 400, 14);
    ctx.textAlign = "right";
    ctx.fillStyle = "#5ad84a"; ctx.font = "900 11px system-ui"; ctx.fillText(`ALIENI ${aliens.length}`, touchMode ? W - 60 : W - 90, 14);
    for (let i = 0; i < Math.min(6, lives); i++) {
      const x = (touchMode ? W - 52 : W - 80) + i * 11, y = 14;
      ctx.fillStyle = "#3a5ad8"; ctx.fillRect(x - 3, y, 6, 5); ctx.fillStyle = "#f4e0c8"; ctx.beginPath(); ctx.arc(x, y - 2, 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#1a1a2a"; ctx.fillRect(x - 2, y - 8, 4, 4);
    }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawCity();
    if (state === "menu" && !hero) { hero = { ...mover(START.c, START.r), fx: 0, fy: -1 }; spawnAliens(); for (const a of aliens) a.wait = 1e9; }
    for (const h of holes.values()) drawHole(h);
    // how far the dig has gone
    if (work) {
      const x = px(work.c), y = py(work.r);
      ctx.strokeStyle = work.kind === "dig" ? "#5a3a1a" : "#ffe14a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 9, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, work.p)); ctx.stroke();
    }
    for (const a of aliens) if (a.mode === "walk") drawAlien(a);
    if (deadT <= 0 && hero) drawHero();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1a140a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#c87aff";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a140a"; ctx.strokeText(message.text, W / 2, 150); ctx.fillText(message.text, W / 2, 150);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 168); ctx.fillText(message.sub, W / 2, 168); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="trappola-best-" data-kind="score"></script>
</body>

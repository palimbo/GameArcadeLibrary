<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Duello sulle Colline</title>
<style>
  :root {
    --bg: #0e1a14;
    --fg: #f4f6ee;
    --muted: #c8dcc0;
    --pink: #9ae05a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a2a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: left and right turn the barrel (up and down for fine aiming); hold FUOCO to load the shot and let go to fire */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(154, 224, 90, 0.6); background: radial-gradient(circle, rgba(154,224,90,0.14), rgba(154,224,90,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(154, 224, 90, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(154, 224, 90, 0.9); background: rgba(154, 224, 90, 0.22); }
  #touch .jump.on { background: rgba(154, 224, 90, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(14, 26, 20, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #1a4a1a, 0 0 22px rgba(154,224,90,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #0a2a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #4a8a2a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Fuoco">FUOCO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GRAV = 300, SPEED = 520, WINDK = 70, BOOM = 30;
  // the enemy generals, one per battle; from the 4th battle they come two at a time, then three
  const GENERALS = ["Capitano Cannone", "Colonnello Mortaio", "Generale Bombarda", "Maresciallo Gittata", "Ammiraglio Obice", "Barone Polvere", "Duca Fragore", "Conte Cratere"];
  const COLORS = ["#d84a3a", "#3a7ad8", "#d8a83a", "#a84ad8", "#3ad8c8", "#d85aa8"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "corazza più robusta · vento leggero · si vede l'inizio della traiettoria · i generali mirano male", hp: 160, wind: 0.6, aimSd: 1.5, learn: 0.35, guide: 0.35, trace: true },
    normale:   { label: "NORMALE",   color: "#9ae05a", desc: "si vede il tuo tiro precedente", hp: 115, wind: 1, aimSd: 1, learn: 0.5, guide: 0, trace: true },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "vento forte · nessun aiuto · i generali correggono il tiro in fretta", hp: 100, wind: 1.35, aimSd: 0.75, learn: 0.7, guide: 0, trace: false },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "colline-difficulty";
  const bestKey = (id) => `colline-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  let firstShot = true, hurtThisBattle = false, directs = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    turn: lim(() => beep(rnd(500, 560), 0.02, "square", 0.012)),
    charge: lim((p) => beep(200 + p * 6, 0.03, "triangle", 0.015)),
    fire: lim(() => { beep(120, 0.25, "sawtooth", 0.06, -60); beep(80, 0.3, "square", 0.04, -30); }),
    whistle: lim((f) => beep(f, 0.05, "sine", 0.008)),
    boom: lim((big) => { beep(70, big ? 0.7 : 0.45, "sawtooth", 0.08, -40); beep(110, 0.3, "square", 0.05, -80); }),
    hit: lim(() => arp([392, 523, 659], 0.05, 0.1, "square", 0.04)),
    ouch: lim(() => arp([392, 311, 262], 0.06, 0.12, "sawtooth", 0.035)),
    wreck: () => { beep(55, 1, "sawtooth", 0.08, -20); arp([880, 660, 440, 330], 0.08, 0.14, "square", 0.035); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    oneup: () => arp([1047, 1319, 1568, 2093], 0.06, 0.1, "square", 0.04),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, battle = 1, wrecks = 0;
  let ground = new Float32Array(W), tanks = [], turn = 0, phase = "aim", phaseT = 0, wind = 0, shell = null, trail = [], lastTrail = null;
  let parts = [], popups = [], message = null, booms = [], power = 0, charging = false, chargeDir = 1, clearT = 0, overT = 0;
  let actHeld = false, wasAct = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const me = () => tanks[0];

  // ---------- The hills ----------
  function makeHills() {
    const a = [rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)], f = [rnd(1.2, 2), rnd(2.5, 4), rnd(6, 9)], amp = [rnd(30, 55), rnd(15, 30), rnd(4, 9)];
    const base = rnd(250, 285);
    for (let x = 0; x < W; x++) {
      const t = x / W * TAU;
      ground[x] = base - (Math.sin(t * f[0] / 2 + a[0]) * amp[0] + Math.sin(t * f[1] / 2 + a[1]) * amp[1] + Math.sin(t * f[2] / 2 + a[2]) * amp[2]);
      ground[x] = clamp(ground[x], 130, H - 30);
    }
  }
  const groundAt = (x) => ground[clamp(Math.round(x), 0, W - 1)];
  // flattens a little pad under each tank so it sits level
  function padUnder(x) {
    const y = groundAt(x);
    for (let i = -14; i <= 14; i++) { const k = clamp(Math.round(x) + i, 0, W - 1); ground[k] = y; }
  }
  function crater(cx, cy, r) {
    for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.ceil(cx + r)); x++) {
      const dy = Math.sqrt(Math.max(0, r * r - (x - cx) * (x - cx)));
      if (ground[x] < cy + dy) ground[x] = Math.min(H - 6, Math.max(ground[x], cy + dy));
    }
  }

  // ---------- Battles ----------
  function startBattle() {
    makeHills();
    const n = Math.min(3, 1 + Math.floor((battle - 1) / 3));
    const hp = me() ? me().hp : diff.hp;
    tanks = [{ x: rnd(50, 110), y: 0, hp: Math.min(diff.hp, hp + (battle > 1 ? 35 : 0)), max: diff.hp, angle: 50, col: "#5ab84a", name: "TU", player: true, vy: 0 }];
    const slots = n === 1 ? [rnd(480, 590)] : n === 2 ? [rnd(330, 420), rnd(520, 600)] : [rnd(260, 320), rnd(410, 470), rnd(550, 605)];
    slots.forEach((x, i) => tanks.push({ x, y: 0, hp: 100, max: 100, angle: 130, col: COLORS[(battle + i) % COLORS.length], name: GENERALS[(battle - 1 + i * 3) % GENERALS.length], cpu: { memo: null, sd: Math.max(0.35, 1 - 0.07 * (battle - 1)) * diff.aimSd }, vy: 0 }));
    for (const t of tanks) { padUnder(t.x); t.y = groundAt(t.x); }
    turn = 0; firstShot = true; hurtThisBattle = false; directs = 0; lastTrail = null; shell = null; trail = [];
    newTurn(true);
    message = { text: `BATTAGLIA ${battle}`, sub: tanks.slice(1).map((t) => t.name).join(" · "), t: 0 };
  }
  function newTurn(first) {
    if (!first) do turn = (turn + 1) % tanks.length; while (tanks[turn].hp <= 0);
    wind = clamp(rnd(-1, 1) * diff.wind * (0.6 + 0.08 * Math.min(battle, 6)), -1.6, 1.6);
    phase = "aim"; phaseT = 0; power = 0; charging = false; wasAct = actHeld;
    const t = tanks[turn];
    if (t.cpu) planCpu(t);
  }

  // ---------- Ballistics ----------
  const barrelTip = (t) => { const a = t.angle * Math.PI / 180; return { x: t.x + Math.cos(a) * 16, y: t.y - 10 - Math.sin(a) * 16 }; };
  // where a shot lands (ignoring tanks), to aim with
  function simulate(t, angle, pw, w) {
    const a = angle * Math.PI / 180, tip = { x: t.x + Math.cos(a) * 16, y: t.y - 10 - Math.sin(a) * 16 };
    let x = tip.x, y = tip.y, vx = Math.cos(a) * SPEED * pw / 100, vy = -Math.sin(a) * SPEED * pw / 100;
    for (let i = 0; i < 1200; i++) {
      const dt = 1 / 60; vx += w * WINDK * dt; vy += GRAV * dt; x += vx * dt; y += vy * dt;
      if (x < -50 || x > W + 50) return x;
      if (x >= 0 && x < W && y >= groundAt(x)) return x;
    }
    return x;
  }
  // a general picks the power that would land on the target, then misses by some, and corrects on the next turns
  function planCpu(t) {
    const targets = tanks.filter((o) => o !== t && o.hp > 0);
    const tgt = targets.find((o) => o.player && Math.random() < 0.75) || targets[Math.floor(Math.random() * targets.length)];
    const left = tgt.x < t.x;
    // an angle that clears the hills in between (steeper if it has to), then the power by bisection on the landing point
    const solve = (angle) => { let lo = 10, hi = 100; for (let i = 0; i < 22; i++) { const mid = (lo + hi) / 2, xl = simulate(t, angle, mid, wind); if ((xl < tgt.x) === left) hi = mid; else lo = mid; } const pw = (lo + hi) / 2; return { pw, miss: Math.abs(simulate(t, angle, pw, wind) - tgt.x) }; };
    let angle = t.cpu.memo && t.cpu.memo.tgt === tgt ? t.cpu.memo.angle : left ? rnd(115, 145) : rnd(35, 65);
    let best = solve(angle);
    for (let k = 0; best.miss > 15 && k < 8; k++) { const a2 = left ? 180 - (40 + k * 6) : 40 + k * 6, s2 = solve(a2); if (s2.miss < best.miss) { best = s2; angle = a2; } }
    let pw = best.pw;
    const m = t.cpu.memo;
    let sd = 15 * t.cpu.sd;
    if (m && m.tgt === tgt) sd *= Math.max(0.25, 1 - diff.learn * Math.min(3, m.n) / 3);
    pw = clamp(pw + gauss() * sd, 8, 100);
    t.cpu.plan = { angle, pw, tgt };
    t.cpu.memo = { tgt, angle, n: m && m.tgt === tgt ? m.n + 1 : 1 };
  }
  function fire(t, pw) {
    const a = t.angle * Math.PI / 180, tip = barrelTip(t);
    shell = { x: tip.x, y: tip.y, vx: Math.cos(a) * SPEED * pw / 100, vy: -Math.sin(a) * SPEED * pw / 100, from: t, t: 0 };
    trail = [];
    phase = "fly"; sfx.fire();
    for (let i = 0; i < 8; i++) parts.push({ x: tip.x, y: tip.y, vx: Math.cos(a) * rnd(40, 120) + rnd(-30, 30), vy: -Math.sin(a) * rnd(40, 120) + rnd(-30, 30), t: 0, life: rnd(0.3, 0.6), col: "#d8d8c8" });
    if (t.player) t.lastPw = pw;
  }
  function explode(x, y, direct) {
    const shooter = shell.from;
    shell = null; phase = "boom"; phaseT = 0;
    if (shooter.player) lastTrail = trail.slice();
    crater(x, y, BOOM);
    booms.push({ x, y, t: 0, r: BOOM });
    sfx.boom(direct);
    for (let i = 0; i < 24; i++) parts.push({ x, y, vx: rnd(-160, 160), vy: rnd(-220, 20), t: 0, life: rnd(0.4, 1), col: Math.random() < 0.5 ? "#ffb03a" : "#7a5a3a" });
    let hitEnemy = false;
    for (const t of tanks) {
      if (t.hp <= 0) continue;
      const d = Math.hypot(t.x - x, t.y - 8 - y);
      let dmg = d < BOOM + 12 ? 36 * (1 - d / (BOOM + 12)) : 0;
      if (t === direct) dmg += 25;
      dmg = Math.round(dmg);
      if (dmg <= 0) continue;
      t.hp = Math.max(0, t.hp - dmg);
      popups.push({ x: t.x, y: t.y - 34, text: `-${dmg}`, col: t.player ? "#ff5a5a" : "#ffffff", t: 0 });
      if (t.player) { hurtThisBattle = true; sfx.ouch(); }
      else if (shooter.player) {
        hitEnemy = true; score += dmg * 10;
        if (t === direct) { score += 500; if (++directs === 3) impresa("centro"); popups.push({ x: t.x, y: t.y - 50, text: "IN PIENO! +500", col: "#ffd23a", t: 0 }); }
        sfx.hit();
      }
      if (t.hp <= 0) {
        sfx.wreck(); booms.push({ x: t.x, y: t.y - 6, t: 0, r: 40 });
        if (!t.player) { wrecks++; if (shooter.player) score += 1000 * battle; popups.push({ x: t.x, y: t.y - 60, text: "DISTRUTTO!", col: "#ffd23a", t: 0 }); }
      }
    }
    if (shooter.player) { if (firstShot && hitEnemy) impresa("primo"); firstShot = false; }
  }
  function updateShell(dt) {
    const s = shell;
    s.t += dt;
    s.vx += wind * WINDK * dt; s.vy += GRAV * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (Math.floor(s.t * 30) !== Math.floor((s.t - dt) * 30)) { trail.push({ x: s.x, y: s.y }); if (s.vy > 0) sfx.whistle(1400 - s.y * 2); }
    if (s.x < -60 || s.x > W + 60 || s.y > H + 20) { shell = null; phase = "boom"; phaseT = 0.6; if (s.from.player) { lastTrail = trail.slice(); firstShot = false; } return; }
    for (const t of tanks) if (t.hp > 0 && t !== s.from && Math.abs(s.x - t.x) < 13 && s.y > t.y - 16 && s.y < t.y + 2) { explode(s.x, s.y, t); return; }
    if (s.t > 0.15 && Math.abs(s.x - s.from.x) < 13 && s.y > s.from.y - 16 && s.y < s.from.y + 2) { explode(s.x, s.y, s.from); return; }
    if (s.x >= 0 && s.x < W && s.y >= groundAt(s.x)) explode(s.x, groundAt(s.x), null);
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; battle = 1; wrecks = 0; parts = []; popups = []; booms = []; tanks = []; clearT = 0; overT = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startBattle();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function battleWon() {
    if (!hurtThisBattle) impresa("illeso");
    const bonus = 500 * battle + me().hp * 10;
    score += bonus;
    clearT = 3; sfx.clear();
    message = { text: "BATTAGLIA VINTA!", sub: `bonus ${bonus.toLocaleString("it-IT")} · il carro viene riparato un po'`, t: 0 };
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">CARRO DISTRUTTO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · battaglia ${battle} · ${wrecks} ${wrecks === 1 ? "carro nemico distrutto" : "carri nemici distrutti"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>NUOVA BATTAGLIA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>DUELLO SULLE COLLINE</h1>
       <p>Il tuo carro armato verde contro i carri dei generali, appostati sulle colline. Si tira un colpo a testa: alza o abbassa la canna, carica il colpo e lascialo partire. Guarda la bandiera: il vento cambia a ogni turno e spinge i proiettili. Ogni esplosione scava le colline. Distruggi tutti i carri nemici per vincere la battaglia.</p>
       <div class="pts">
         <span><b>Mira</b></span><span>levetta a destra e a sinistra: gira la canna (su e giù per i ritocchi) · tieni premuto FUOCO per caricare, lascia per sparare</span>
         <span><b>Danni</b></span><span>più vicino scoppia, più fa male · un colpo in pieno sul carro fa molto di più</span>
         <span><b>Battaglie</b></span><span>dalla 4ª i generali sono due, dalla 7ª tre · dopo ogni vittoria il carro viene riparato un po'</span>
         <span><b>Punti</b></span><span>10 per ogni punto di danno · colpo in pieno 500 · carro distrutto 1.000 × battaglia · vittoria 500 × battaglia più 10 per punto di corazza rimasto</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: gira la canna · tieni premuto FUOCO e lascia</p>`
         : `<p class="muted help">Frecce sinistra e destra per la canna (su e giù di un grado) · tieni premuto SPAZIO o J e lascia · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>AL FRONTE!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const ACTKEYS = [" ", "j", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (ACTKEYS.includes(k)) actHeld = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; if (ACTKEYS.includes(k)) actHeld = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; actHeld = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  {
    const b = touchEl.querySelector(".hop");
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); actHeld = true; b.classList.add("on"); });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { actHeld = false; b.classList.remove("on"); });
  }
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.2 ? 0 : Math.sign(v) * Math.min(1, (a - 0.2) / 0.5); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);


  // ---------- Update ----------
  function update(dt) {
    clock += dt; sfxN = 0;
    if (window.__bot) window.__bot(dt);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 18 * dt; }
    popups = popups.filter((p) => p.t < 1.6);
    for (const b of booms) b.t += dt;
    booms = booms.filter((b) => b.t < 0.6);
    if (message) { message.t += dt; if (message.t > 2.6) message = null; }
    if (state !== "play") return;
    // tanks settle on the ground that's left under them
    for (const t of tanks) { const g = groundAt(t.x); if (t.y < g - 0.5) { t.vy += 400 * dt; t.y = Math.min(g, t.y + t.vy * dt); if (t.y >= g) { if (t.vy > 160 && t.hp > 0) { const d = Math.round((t.vy - 160) / 12); t.hp = Math.max(0, t.hp - d); if (t.player) hurtThisBattle = true; } t.vy = 0; } } else { t.y = g; t.vy = 0; } }
    if (clearT > 0) { clearT -= dt; if (clearT <= 0) { battle++; startBattle(); } return; }
    if (overT > 0) { overT -= dt; if (overT <= 0) gameOver(); return; }
    phaseT += dt;
    const t = tanks[turn];
    if (phase === "aim") {
      if (t.player) {
        const turnRate = 55 * (keys.left || keys.right ? 1 : Math.abs(stick.x));
        const dir = (keys.left ? 1 : 0) - (keys.right ? 1 : 0) + (stick.x < -0.15 ? 1 : stick.x > 0.15 ? -1 : 0);
        if (dir && !charging) { t.angle = clamp(t.angle + Math.sign(dir) * turnRate * dt, 0, 180); if (Math.random() < dt * 20) sfx.turn(); }
        // up and down: one degree at a time
        const fine = (keys.up || stick.y < -0.5) ? 1 : (keys.down || stick.y > 0.5) ? -1 : 0;
        if (fine && !t.fineHeld && !charging) { t.angle = clamp(t.angle + fine * (t.angle <= 90 ? 1 : -1), 0, 180); sfx.turn(); }
        t.fineHeld = !!fine;
        if (actHeld && !wasAct && phaseT > 0.3) { charging = true; power = 0; chargeDir = 1; }
        if (charging) {
          power += chargeDir * 62 * dt;
          if (power >= 100) { power = 100; chargeDir = -1; }
          if (power <= 0) { power = 0; chargeDir = 1; }
          if (Math.random() < dt * 25) sfx.charge(power);
          if (!actHeld) { charging = false; fire(t, Math.max(5, power)); }
        }
        wasAct = actHeld;
      } else {
        // the general turns the barrel, loads, and fires
        const p = t.cpu.plan;
        if (phaseT > 0.6) { const d = p.angle - t.angle; t.angle += clamp(d, -70 * dt, 70 * dt); }
        if (phaseT > 0.6 && Math.abs(p.angle - t.angle) < 0.5) { power = Math.min(p.pw, power + 62 * dt); if (power >= p.pw) fire(t, p.pw); }
      }
    } else if (phase === "fly") {
      for (let i = 0; i < 2 && shell; i++) updateShell(dt / 2);
    } else if (phase === "boom" && phaseT > 0.9) {
      if (me().hp <= 0) { overT = 1.4; message = { text: "IL TUO CARRO È DISTRUTTO", t: 0 }; return; }
      if (tanks.slice(1).every((o) => o.hp <= 0)) { battleWon(); return; }
      newTurn(false);
    }
  }

  // ---------- Drawing ----------
  function drawScene() {
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    const dusk = (battle - 1) % 3;
    const sky = [["#5ab0e8", "#c8e8f0"], ["#e8885a", "#f8d8a0"], ["#1a2a5a", "#5a6aa8"]][dusk];
    g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    if (dusk === 2) { ctx.fillStyle = "#ffffff"; for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, TOP + (i * 53) % 120, 1.5, 1.5); }
    ctx.fillStyle = dusk === 2 ? "#e8e8d0" : "#fff4c8"; ctx.beginPath(); ctx.arc(540, 70, 18, 0, TAU); ctx.fill();
    // far mountains
    ctx.fillStyle = dusk === 2 ? "#2a3a5a" : dusk === 1 ? "#a87a6a" : "#8aa8b8";
    ctx.beginPath(); ctx.moveTo(0, 230);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 190 - Math.abs(Math.sin(x * 0.011 + battle)) * 50 - Math.sin(x * 0.03) * 10);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    // clouds drifting with the wind
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    for (let i = 0; i < 4; i++) { const x = ((i * 190 + clock * wind * 25) % (W + 120) + W + 120) % (W + 120) - 60, y = TOP + 30 + i * 18; ctx.beginPath(); ctx.ellipse(x, y, 34, 9, 0, 0, TAU); ctx.ellipse(x + 20, y - 5, 20, 8, 0, 0, TAU); ctx.fill(); }
    // the hills, with grass on top
    ctx.fillStyle = "#6a4a2a"; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) ctx.lineTo(x, ground[x]);
    ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = "#5ab83a"; ctx.lineWidth = 4; ctx.beginPath();
    for (let x = 0; x < W; x++) (x ? ctx.lineTo(x, ground[x] + 2) : ctx.moveTo(x, ground[x] + 2));
    ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,0.12)"; for (let x = 0; x < W; x += 7) ctx.fillRect(x, ground[x] + 14 + (x * 13 % 9), 3, 3);
  }
  function drawTank(t) {
    if (t.hp <= 0) {
      ctx.fillStyle = "#3a3a3a"; ctx.fillRect(t.x - 13, t.y - 7, 26, 7);
      ctx.fillStyle = `rgba(80,80,80,${0.4 + 0.2 * Math.sin(clock * 3 + t.x)})`; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(t.x + Math.sin(clock + i) * 4, t.y - 14 - ((clock * 14 + i * 9) % 26), 4 + i, 0, TAU); ctx.fill(); }
      return;
    }
    const a = t.angle * Math.PI / 180;
    ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(t.x, t.y - 10); ctx.lineTo(t.x + Math.cos(a) * 17, t.y - 10 - Math.sin(a) * 17); ctx.stroke();
    ctx.fillStyle = "#2a2a2a"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(t.x - 14, t.y - 6, 28, 7, 3) : ctx.rect(t.x - 14, t.y - 6, 28, 7); ctx.fill();
    ctx.fillStyle = "#4a4a4a"; for (let i = -10; i <= 10; i += 5) { ctx.beginPath(); ctx.arc(t.x + i, t.y - 2.5, 2, 0, TAU); ctx.fill(); }
    ctx.fillStyle = t.col; ctx.fillRect(t.x - 12, t.y - 11, 24, 6);
    ctx.beginPath(); ctx.arc(t.x, t.y - 10, 7, Math.PI, 0); ctx.fill();
    // health bar and name
    const w = 30, frac = t.hp / t.max;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(t.x - w / 2, t.y - 30, w, 4);
    ctx.fillStyle = frac > 0.5 ? "#7aff7a" : frac > 0.25 ? "#ffd23a" : "#ff5a3a"; ctx.fillRect(t.x - w / 2, t.y - 30, w * frac, 4);
    if (tanks[turn] === t && state === "play" && phase === "aim") { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(t.x - 5, t.y - 44 + Math.sin(clock * 6) * 2); ctx.lineTo(t.x + 5, t.y - 44 + Math.sin(clock * 6) * 2); ctx.lineTo(t.x, t.y - 37 + Math.sin(clock * 6) * 2); ctx.fill(); }
  }
  function drawAim() {
    const t = tanks[turn];
    if (!t || !t.player || phase !== "aim" || state !== "play") return;
    // your previous shot, faded, and (on Facile) the start of the path
    if (lastTrail && diff.trace) { ctx.fillStyle = "rgba(255,255,255,0.35)"; for (const p of lastTrail) ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
    if (diff.guide > 0) {
      const a = t.angle * Math.PI / 180, tip = barrelTip(t), pw = charging ? Math.max(power, 10) : t.lastPw || 60;
      let x = tip.x, y = tip.y, vx = Math.cos(a) * SPEED * pw / 100, vy = -Math.sin(a) * SPEED * pw / 100;
      ctx.fillStyle = "rgba(255,255,120,0.8)";
      for (let i = 0; i < 60 * diff.guide * 2; i++) { const dt = 1 / 60; vx += wind * WINDK * dt; vy += GRAV * dt; x += vx * dt; y += vy * dt; if (i % 3 === 0) ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(14,26,20,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#c8dcc0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 76, 9);
    ctx.fillStyle = "#9ae05a"; ctx.font = "900 9px system-ui"; ctx.fillText(`BATTAGLIA ${battle}`, x0 + 76, 20);
    // the wind: a flag and an arrow
    const wx = W / 2 - 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("VENTO", wx, 8);
    const len = wind * 34;
    ctx.strokeStyle = Math.abs(wind) > 1 ? "#ff8a5a" : "#ffffff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(wx - len, 19); ctx.lineTo(wx + len, 19); ctx.stroke();
    if (Math.abs(len) > 2) { ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(wx + len + Math.sign(len) * 6, 19); ctx.lineTo(wx + len, 14); ctx.lineTo(wx + len, 24); ctx.fill(); }
    // angle and power of whoever is aiming
    const t = tanks[turn];
    if (t) {
      const px = touchMode ? W - 210 : W - 190;
      ctx.textAlign = "left"; ctx.fillStyle = "#ffffff"; ctx.font = "800 9px system-ui";
      const shown = t.angle > 90 ? 180 - t.angle : t.angle;
      ctx.fillText(`${t.player ? "TU" : t.name.toUpperCase()} · ALZO ${Math.round(shown)}°`, px, 8);
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(px, 15, 120, 8);
      const pw = phase === "aim" ? power : 0;
      const pg = ctx.createLinearGradient(px, 0, px + 120, 0); pg.addColorStop(0, "#7aff7a"); pg.addColorStop(0.6, "#ffd23a"); pg.addColorStop(1, "#ff5a3a");
      ctx.fillStyle = pg; ctx.fillRect(px, 15, 120 * pw / 100, 8);
      if (t.player && t.lastPw && diff.trace) { ctx.fillStyle = "#ffffff"; ctx.fillRect(px + 120 * t.lastPw / 100 - 1, 13, 2, 12); }
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, 15.5, 119, 7);
      ctx.fillStyle = "#ffffff"; ctx.fillText(`${Math.round(pw)}`, px + 124, 19);
    }
    ctx.textBaseline = "alphabetic";
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#0e1a14"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!tanks.length) { startBattle(); }
    drawScene();
    drawAim();
    for (const t of tanks) drawTank(t);
    if (shell) { ctx.fillStyle = "rgba(60,60,60,0.5)"; for (const p of trail.slice(-12)) ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(shell.x, shell.y, 3.5, 0, TAU); ctx.fill(); }
    for (const b of booms) { const k = b.t / 0.6; ctx.fillStyle = `rgba(255,${Math.round(200 - k * 150)},60,${1 - k})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.5 + k), 0, TAU); ctx.fill(); }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.6); outlined(p.text, p.x, p.y, "900 12px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (state === "play" && phase === "aim" && tanks[turn] && !tanks[turn].player && !message) { ctx.textAlign = "center"; outlined(`tocca a ${tanks[turn].name}`, W / 2, 60, "800 13px system-ui", "#ffffff", 4); }
    if (state === "play" && phase === "aim" && tanks[turn] && tanks[turn].player && phaseT < 1.5 && !message) { ctx.textAlign = "center"; outlined("TOCCA A TE!", W / 2, 60, "italic 900 18px system-ui", "#9ae05a", 5); }
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.6 - message.t) * 2);
      ctx.textAlign = "center"; outlined(message.text, W / 2, 110, "italic 900 26px system-ui", "#9ae05a", 6);
      if (message.sub) outlined(message.sub, W / 2, 132, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="colline-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tomba del Faraone</title>
<style>
  :root {
    --bg: #140c08;
    --fg: #f4f6ee;
    --muted: #b8a888;
    --pink: #ffc83a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a2a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: walk the corridors; FUOCO shoots left or right, LAMPO clears the screen */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(122, 228, 255, 0.9); background: rgba(122, 228, 255, 0.22); }
  #touch .jump.on { background: rgba(122, 228, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.flash { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.flash.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.flash { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(20, 12, 8, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a3a0a, 0 0 22px rgba(255,200,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1404; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump flash" aria-label="Lampo">LAMPO</button><button type="button" class="jump fire" aria-label="Fuoco">FUOCO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const T = 24, MH = 13, OY = TOP + 8;
  const PSPEED = 4.2, BOLT_V = 18, BOLT_EVERY = 0.22, BOLT_RANGE = 9, HIT = 0.55, CHECK_EVERY = 24;
  const KINDS = {
    cobra: { v: 2.5, pts: 100, chase: 0.75, name: "UN COBRA" },
    pipistrello: { v: 3.3, pts: 200, chase: 0.5, name: "UN PIPISTRELLO" },
    scorpione: { v: 2.1, pts: 150, chase: 0.9, name: "UNO SCORPIONE" },
  };
  const TREASURES = [
    { name: "coppa", pts: 500, c: "#ffd23a" },
    { name: "anello", pts: 800, c: "#7ae4ff" },
    { name: "scarabeo", pts: 1000, c: "#5ae07a" },
    { name: "corona", pts: 1500, c: "#ffb03a" },
    { name: "maschera", pts: 2000, c: "#ffe88a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · creature lente e rare · 2 lampi per vita · più tempo", lives: 5, speed: 0.8, spawn: 0.65, time: 1.3, flash: 2 },
    normale:   { label: "NORMALE",   color: "#ffc83a", desc: "3 vite · 1 lampo per vita", lives: 3, speed: 1, spawn: 1, time: 1, flash: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · creature svelte e numerose · meno tempo", lives: 3, speed: 1.15, spawn: 1.35, time: 0.85, flash: 1 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "tomba-difficulty";
  const bestKey = (id) => `tomba-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    zap: lim(() => beep(1500, 0.08, "sawtooth", 0.02, -900)),
    jam: lim(() => beep(120, 0.08, "square", 0.03)),
    kill: lim(() => { noise(0.12, 0.09, 1200); beep(700, 0.1, "square", 0.025, -400); }),
    treasure: lim(() => arp([784, 988, 1319, 1568], 0.05, 0.1, "triangle", 0.05)),
    key: lim(() => arp([659, 988, 1319, 1976], 0.06, 0.14, "triangle", 0.05)),
    locked: lim(() => beep(180, 0.15, "square", 0.03, -40)),
    flash: () => { noise(0.6, 0.2, 3000); beep(2000, 0.5, "sine", 0.05, -1800); },
    spawn: lim(() => beep(220, 0.12, "triangle", 0.02, 120)),
    check: lim(() => arp([523, 784], 0.06, 0.1, "triangle", 0.04)),
    tick: lim(() => beep(1000, 0.04, "square", 0.02)),
    die: () => { noise(0.5, 0.16, 500); arp([523, 415, 330, 262, 196], 0.1, 0.16, "sawtooth", 0.045); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.15),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 20000;
  let grid = [], MW = 0, P = null, creatures = [], bolts = [], items = [], nests = [], checks = [], parts = [], popups = [], message = null;
  let exitT = null, hasKey = false, timeLeft = 0, timeTotal = 0, flashes = 1, flashFx = 0, boltT = 0, camX = 0, spawnT = 0, lastBy = null, checkX = 1;
  let dist = null, distT = 0;
  let firePressed = false, flashPressed = false, fireHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The tomb ----------
  const wall = (x, y) => x < 0 || y < 0 || x >= MW || y >= MH || grid[y][x] === 1;
  const open = (x, y) => !wall(x, y) && !(grid[y][x] === 2 && !hasKey);
  function buildTomb() {
    const CX = Math.min(62, 40 + 4 * (level - 1)), CY = 6;
    MW = 2 * CX + 1;
    grid = Array.from({ length: MH }, () => new Array(MW).fill(1));
    const seen = Array.from({ length: CY }, () => new Array(CX).fill(false));
    const cell = (i, j) => { grid[2 * j + 1][2 * i + 1] = 0; };
    // a winding maze that leans left-to-right...
    const start = [0, 3], stack = [start]; seen[3][0] = true; cell(0, 3);
    while (stack.length) {
      const [i, j] = stack[stack.length - 1];
      const opts = [];
      for (const [di, dj] of DIRS) { const ni = i + di, nj = j + dj; if (ni >= 0 && nj >= 0 && ni < CX && nj < CY && !seen[nj][ni]) for (let k = 0; k < (di ? 2 : 1); k++) opts.push([ni, nj, di, dj]); }
      if (!opts.length) { stack.pop(); continue; }
      const [ni, nj, di, dj] = pick(opts);
      seen[nj][ni] = true; cell(ni, nj); grid[2 * j + 1 + dj][2 * i + 1 + di] = 0; stack.push([ni, nj]);
    }
    // ...with loops, so that there is always a way round a creature
    const deadEnds = [];
    for (let j = 0; j < CY; j++) for (let i = 0; i < CX; i++) {
      const x = 2 * i + 1, y = 2 * j + 1, n = DIRS.filter(([dx, dy]) => grid[y + dy][x + dx] === 0).length;
      if (n === 1) {
        if (Math.random() < 0.45) { const c = DIRS.filter(([dx, dy]) => grid[y + dy][x + dx] === 1 && x + 2 * dx > 0 && x + 2 * dx < MW - 1 && y + 2 * dy > 0 && y + 2 * dy < MH - 1); if (c.length) { const [dx, dy] = pick(c); grid[y + dy][x + dx] = 0; continue; } }
        deadEnds.push([x, y]);
      }
    }
    for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
      if (grid[y][x] !== 1 || Math.random() > 0.08) continue;
      if ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0)) grid[y][x] = 0;
    }
    // the way out: a locked door on the far wall
    const ey = 2 * Math.floor(rnd(1, CY - 1)) + 1;
    grid[ey][MW - 1] = 2; exitT = { x: MW - 1, y: ey };
    // the key waits in the last stretch of the tomb
    const far = deadEnds.filter(([x]) => x > MW * 0.55 && x < MW - 6);
    const kc = far.length ? pick(far) : [2 * Math.floor(CX * 0.75) + 1, 2 * Math.floor(rnd(0, CY)) + 1];
    items = [{ kind: "key", x: kc[0], y: kc[1] }];
    const free = deadEnds.filter(([x, y]) => x > 8 && !(x === kc[0] && y === kc[1]));
    for (let k = 0; k < 6 && free.length; k++) { const i = Math.floor(Math.random() * free.length), [x, y] = free.splice(i, 1)[0]; items.push({ kind: "treasure", x, y, t: TREASURES[Math.min(TREASURES.length - 1, Math.floor(Math.random() * (2 + level)))] }); }
    // creature nests along the way
    nests = [];
    for (let x = 14; x < MW - 6; x += Math.round(rnd(7, 11))) {
      const ys = [1, 3, 5, 7, 9, 11].filter((y) => grid[y][x | 1] === 0);
      if (ys.length) nests.push({ x: x | 1, y: pick(ys), cd: rnd(0, 3) });
    }
    checks = [];
    for (let x = CHECK_EVERY + 1; x < MW - 8; x += CHECK_EVERY) { const ys = [1, 3, 5, 7, 9, 11].filter((y) => grid[y][x] === 0); checks.push({ x, y: ys.length ? pick(ys) : 1, on: false }); }
    timeTotal = Math.round((90 + CX * 1.2) * diff.time); timeLeft = timeTotal;
  }
  function computeDist() {
    dist = Array.from({ length: MH }, () => new Array(MW).fill(999));
    const sx = Math.floor(P.x), sy = Math.floor(P.y), q = [[sx, sy]]; dist[sy][sx] = 0;
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (!wall(nx, ny) && grid[ny][nx] !== 2 && dist[ny][nx] === 999) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); } }
    }
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildTomb();
    hasKey = false; checkX = 1; creatures = []; bolts = []; parts = []; popups = [];
    spawnPlayer(1, 7);
    message = { text: `TOMBA ${level}`, sub: "trova la chiave e raggiungi la porta in fondo", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function spawnPlayer(x, y) {
    P = { x: x + 0.5, y: y + 0.5, dx: 0, dy: 0, face: 1, safe: 2, step: 0 };
    flashes = diff.flash; spawnT = 2.5;
    computeDist();
  }
  function addScore(n, x, y, color = "#f4eee0", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: camX + W / 2, y: 70, text: "VITA EXTRA!", color: "#ffc83a", t: 0, screen: true }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(c) {
    if (state !== "play") return;
    lives--; sfx.die(); lastBy = c.kind;
    burst(P.x * T, P.y * T, "#f4d8a8", 18, 120, 0.7);
    state = "dead"; stateT = 1.8;
  }
  function levelDone() {
    const tb = Math.max(0, Math.ceil(timeLeft)) * 10, lb = 1000 * level;
    addScore(tb + lb);
    message = { text: "TOMBA SUPERATA!", sub: `uscita ${lb.toLocaleString("it-IT")} · tempo avanzato ${tb.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 2.8;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · tomba ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }

      ctx.fillStyle = "#3aa83a"; for (let i = 3; i >= 0; i--) { ctx.beginPath(); ctx.arc(-i * 3.5, 5 + Math.sin(c.anim + i) * 1.5, 3.2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = "#5ad84a"; ctx.beginPath(); ctx.ellipse(3, -3, 5, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#2a7a2a"; ctx.fillRect(1, -1, 4, 6);
      ctx.fillStyle = "#ff3a3a"; ctx.fillRect(3, -7, 2, 2); ctx.fillRect(6, -7, 2, 2);
      if (Math.sin(c.anim * 1.5) > 0.3) { ctx.fillStyle = "#ff3a5a"; ctx.fillRect(8, -3, 4, 1); }
    } else if (c.kind === "pipistrello") {
      const f = Math.sin(c.anim * 2) * 5;
      ctx.fillStyle = "#6a3aa8"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-11, -4 - f); ctx.lineTo(-7, 2); ctx.lineTo(-4, 0); ctx.closePath(); ctx.moveTo(0, 0); ctx.lineTo(11, -4 - f); ctx.lineTo(7, 2); ctx.lineTo(4, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8a5ac8"; ctx.beginPath(); ctx.ellipse(0, 0, 4, 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffd23a"; ctx.fillRect(-2.5, -2, 2, 2); ctx.fillRect(0.5, -2, 2, 2);
    } else {
      ctx.fillStyle = "#c8682a"; ctx.beginPath(); ctx.ellipse(0, 2, 7, 4.5, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#c8682a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, 2); ctx.quadraticCurveTo(-12, -4, -6, -9); ctx.stroke();
      ctx.fillStyle = "#ff3a2a"; ctx.fillRect(-7, -11, 3, 3);
      ctx.strokeStyle = "#a8481a"; ctx.lineWidth = 1.5; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 3, 5); ctx.lineTo(i * 3 + Math.sin(c.anim + i) * 2, 9); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(6, 1); ctx.lineTo(10, -2); ctx.lineTo(11, 1); ctx.stroke();
    }
    ctx.restore();
  }
  function drawPlayer() {
    const px = P.x * T - camX, py = OY + P.y * T;
    ctx.save(); ctx.translate(px, py); ctx.scale(P.face, 1);
    const leg = (P.dx || P.dy) ? Math.sin(P.step) * 2.5 : 0;
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(-4, 4, 3, 6 + leg); ctx.fillRect(1, 4, 3, 6 - leg);
    ctx.fillStyle = "#c8b07a"; ctx.fillRect(-5, -4, 10, 9);
    ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(0, -7, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#e8dcb0"; ctx.beginPath(); ctx.ellipse(0, -10, 7, 2.5, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(0, -10, 4.5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(2, -8, 1.5, 1.5);
    ctx.fillStyle = "#5a5a68"; ctx.fillRect(3, -1, 8, 3); ctx.fillStyle = timeLeft > 0 ? "#7ae4ff" : "#8a4a3a"; ctx.fillRect(10, -1, 2, 3);
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(20,12,8,0.94)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#f4eee0"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#b8a888"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffc83a"; ctx.font = "900 10px system-ui"; ctx.fillText(`TOMBA ${level}`, x0 + 80, 21);
    // the time bar; when it runs out the gun jams
    const bx = x0 + 150, bw = 100;
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(bx, 6, bw, 6);
    ctx.fillStyle = timeLeft <= 10 ? "#ff5a3a" : "#ffc83a"; ctx.fillRect(bx, 6, bw * clamp(timeLeft / timeTotal, 0, 1), 6);
    // how far along the tomb
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(bx, 17, bw, 4);
    ctx.fillStyle = "#7ae4ff"; ctx.fillRect(bx + bw * clamp(P.x / MW, 0, 1) - 1.5, 15, 3, 8);
    ctx.fillStyle = hasKey ? "#5ae07a" : "#8a5a2a"; ctx.fillRect(bx + bw - 2, 15, 3, 8);
    ctx.fillStyle = "#f4eee0"; ctx.font = "800 9px system-ui"; ctx.fillText(timeLeft > 0 ? `${Math.ceil(timeLeft)}s` : "INCEPPATO", bx + bw + 6, 10);
    let ix = bx + bw + 6;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.fillText(`LAMPI ${flashes}`, ix, 21);
    if (hasKey) { ix += 52; ctx.strokeStyle = "#ffe88a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ix + 4, 20, 3, 0, TAU); ctx.moveTo(ix + 7, 20); ctx.lineTo(ix + 14, 20); ctx.stroke(); }
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) {
      const cx = lx - i * 14; ctx.fillStyle = "#e8dcb0"; ctx.beginPath(); ctx.ellipse(cx, 13, 6, 2.2, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(cx, 13, 3.8, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(cx, 17, 3, 0, TAU); ctx.fill();
    }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!grid.length) { level = 2; P = { x: 20.5, y: 7.5, face: 1 }; buildTomb(); level = 1; timeLeft = 1; }
    drawTomb();
    for (const it of items) if (!it.gone) drawItem(it);
    if (state !== "menu") {
      for (const c of creatures) drawCreature(c);
      ctx.fillStyle = "#7ae4ff";
      for (const b of bolts) { const px = b.x * T - camX, py = OY + b.y * T; ctx.fillStyle = "#e8faff"; ctx.fillRect(px - 7, py - 1.5, 14, 3); ctx.fillStyle = "rgba(122,228,255,0.5)"; ctx.fillRect(px - 10, py - 3, 20, 6); }
      if (!(state === "dead" && Math.floor(clock * 6) % 2 === 0) && !(P.safe > 0 && Math.floor(clock * 10) % 2)) drawPlayer();
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - camX - 1.5, OY + p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      const x = p.screen ? W / 2 : p.x - camX, y = p.screen ? p.y : OY + p.y;
      ctx.lineWidth = 3; ctx.strokeStyle = "#140c08"; ctx.strokeText(p.text, x, y); ctx.fillStyle = p.color; ctx.fillText(p.text, x, y);
    }
    ctx.globalAlpha = 1;
    if (flashFx > 0) { ctx.fillStyle = `rgba(255,255,240,${flashFx * 1.6})`; ctx.fillRect(0, TOP, W, H - TOP); }
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 150, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffc83a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#140c08"; ctx.strokeText(message.text, W / 2, 177); ctx.fillText(message.text, W / 2, 177);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f4eee0"; ctx.fillText(message.sub, W / 2, 196); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui"; ctx.fillStyle = "#ff5a5a"; ctx.lineWidth = 4; ctx.strokeStyle = "#140c08";
      const t = `MORSO DA ${KINDS[lastBy].name}!`;
      ctx.strokeText(t, W / 2, 240); ctx.fillText(t, W / 2, 240);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="tomba-best-" data-kind="score"></script>
</body>

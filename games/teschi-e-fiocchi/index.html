  function buildSong(S) {

    const lo = S.key + 7, hi = S.key + 24;

    const near = (m, set) => { let best = m, bd = 99; for (let o = lo; o <= hi; o++) { if (!set(o)) continue; const d = Math.abs(o - m) + rng() * 0.6; if (d < bd) { bd = d; best = o; } } return best; };
    const cache = {}, R = RHYTHMS[S.style];
    let bar = 0, last = S.key + 12;

          for (const [p, d] of rh) {

      if (state !== "play") return;
    }
    if (t > B.beats * B.spb + 0.8) endSong(true);
  }

  // ---------- Menus ----------
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => { const d = DIFFICULTIES[id]; return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`; }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  // ---------- Menus, one screen at a time like an arcade cabinet ----------
  let logoURL = null, screen = "title", charStep = 0, preview = null;
  const DESC = { capa: "Guida la squadra a passi decisi. Non sbaglia mai un tempo, dice lei.", cecchina: "Precisa al millesimo: dove punta il monocolo, arriva la freccia.", tecnica: "Ha programmato lei le luci della pista. E balla col cuore, letteralmente.", forzuta: "Sembra burbera, ma quando parte la musica non la ferma nessuno." };
  const levelCache = {};
  function level(si, d) { const k = si + d; if (!levelCache[k]) { const s = SONGS[si], b = buildSong(s), n = buildChart(s, b, d); levelCache[k] = { lv: clamp(Math.round(n.length / (b.beats * b.spb) * 2.6), 1, 10), secs: Math.round(b.beats * b.spb) }; } return levelCache[k]; }
  function stopPreview() { preview = null; if (master) master.gain.setTargetAtTime(0.75, audioCtx.currentTime, 0.05); }
  function startPreview(i) {
    startAudio(); if (!audioCtx) return;
    const b = buildSong(SONGS[i]), ch = b.sections.find((s) => s.type === "chorus") || b.sections[1], from = ch.start, to = from + 16;
    preview = { b, from, to, startAt: audioCtx.currentTime + 0.25 - from * b.spb, idx: b.ev.findIndex((e) => e.t >= from) };
    master.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.05);
  }
  setInterval(() => {
    if (!preview || !audioCtx || state !== "menu" || audioCtx.state !== "running") return;
    const p = preview, horizon = audioCtx.currentTime + 0.2;
    for (let guard = 0; guard < 400; guard++) {
      const e = p.b.ev[p.idx];
      if (!e || e.t >= p.to) { p.startAt += (p.to - p.from) * p.b.spb; p.idx = p.b.ev.findIndex((q) => q.t >= p.from); continue; }
      const at = p.startAt + e.t * p.b.spb; if (at > horizon) break;
      if (at >= audioCtx.currentTime - 0.05) playEvent(e, Math.max(audioCtx.currentTime, at), p.b.spb);
      p.idx++;
    }
  }, 25);
  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function showTitle() { go("title"); }
  function go(sc) {
    screen = sc; state = "menu"; players = []; layout();
    if (sc !== "song") stopPreview();
    if (!logoURL) logoURL = makeLogo();
    menu = () => go(screen);
    const back = `<button type="button" data-back>◀ INDIETRO</button>`;
    let html = "";
    if (sc === "title") {
      const best = Math.max(...DIFF_IDS.map((d) => parseInt(load(bestKey(d)), 10) || 0));
      html = `<img class="logo" src="${logoURL}" alt="Teschi &amp; Fiocchi"><p>Quattro ragazze, ${SONGS.length} canzoni a 8 bit, una pista da ballo tra le stelle.</p>
        <button class="start blink" data-next>PREMI START</button>${best ? `<p class="muted">Record: ${nf(best)}</p>` : ""}`;
    } else if (sc === "mode") {
      const M = [["solo", "DA SOLA", "balli tu, le altre fanno il tifo dietro"], ["cpu", "CONTRO LA CPU", "sfida una ragazza guidata dal computer"], ["duo", "IN DUE", touchMode ? "sullo stesso telefono, mezzo schermo a testa" : "sulla stessa tastiera: W A S D contro le frecce"]];
      html = `<h2>SCEGLI LA MODALITÀ</h2><div class="bigbtns">${M.map(([id, t, d]) => `<button type="button" class="big ${mode === id ? "on" : ""}" data-mode="${id}"><b>${t}</b><span>${d}</span></button>`).join("")}</div><div class="row">${back}</div>`;
    } else if (sc === "char") {
      const who = charStep === 0 ? (mode === "solo" ? "SCEGLI LA TUA RAGAZZA" : "G1: SCEGLI LA TUA RAGAZZA") : mode === "cpu" ? "SCEGLI L'AVVERSARIA" : "G2: SCEGLI LA TUA RAGAZZA";
      const ci = pick[charStep], c = CREW[ci];
      html = `<h2 style="color:${charStep ? "#3ab8ff" : "#ff3a4a"}">${who}</h2>
        <div class="sel"><button type="button" class="arr" data-ch="-1">◀</button><div class="selcard"><img src="${scaled(ci, c.win)}" alt=""><b style="color:${c.color}">${c.name}</b><span class="lab">${c.role.toUpperCase()}</span><p class="muted">${DESC[c.id]}</p></div><button type="button" class="arr" data-ch="1">▶</button></div>
        <div class="thumbs">${CREW.map((q, i) => `<button type="button" class="${i === ci ? "on" : ""}" data-pick="${i}"><img src="${scaled(i, q.moves[0])}" alt=""></button>`).join("")}</div>
        <div class="row">${back}<button class="start" data-next>CONFERMA</button></div>`;
    } else if (sc === "song") {
      const n = SONGS.length, s = SONGS[songIdx], L = level(songIdx, difficulty), best = parseInt(load(songKey(s.id, difficulty)), 10);
      const side = (k) => { const q = SONGS[(songIdx + k + n) % n]; return `<button type="button" class="side" data-ch="${k}"><b>${q.title}</b><span>${q.bpm} BPM</span></button>`; };
      html = `<h2>SCEGLI LA CANZONE</h2>
        <div class="sel">${side(-1)}<button type="button" class="arr" data-ch="-1">◀</button>
          <div class="selcard song"><span class="lab">${songIdx + 1} / ${n}</span><b>${s.title}</b><span>${s.mood} · ${s.bpm} BPM · ${mmss(L.secs)}</span>
          <span class="stars">${"★".repeat(L.lv)}<i>${"★".repeat(10 - L.lv)}</i></span><span class="muted">livello ${L.lv} a ${diff.label.toLowerCase()}${best ? ` · record ${nf(best)}` : ""}</span><span class="muted">♪ in ascolto</span></div>
          <button type="button" class="arr" data-ch="1">▶</button>${side(1)}</div>
        ${difficultyHTML()}
        <p class="muted help">${mode === "duo" ? (touchMode ? "Ognuna tocca le colonne della sua metà schermo." : "G1: W A S D · G2: le frecce.") : touchMode ? "Tocca le colonne delle frecce quando arrivano in cima." : "Frecce (o W A S D) quando le frecce arrivano in cima."} Le frecce verdi lunghe vanno tenute premute.</p>
        <button class="start" data-start>BALLIAMO!</button><div class="row">${back}</div>`;
      if (!preview || preview.b.ev !== undefined && preview.song !== songIdx) { startPreview(songIdx); if (preview) preview.song = songIdx; }
    }
    showOverlay(`<div class="screen">${html}</div>`); syncControls();
  }
  function menuNext() {
    startAudio(); sfx.ui();
    if (screen === "title") go("mode");
    else if (screen === "mode") { charStep = 0; go("char"); }
    else if (screen === "char") { if (mode !== "solo" && charStep === 0) { charStep = 1; go("char"); } else go("song"); }
    else if (screen === "song") startSong();
  }
  function menuBack() {
    sfx.ui();
    if (screen === "mode") go("title"); else if (screen === "char") { if (charStep === 1) { charStep = 0; go("char"); } else go("mode"); } else if (screen === "song") { charStep = mode === "solo" ? 0 : 1; go("char"); }
  }
  function menuMove(k) {
    sfx.ui();
    if (screen === "char") { pick[charStep] = (pick[charStep] + k + 4) % 4; store("teschi-p1", String(pick[0])); store("teschi-p2", String(pick[1])); go("char"); }
    else if (screen === "song") { songIdx = (songIdx + k + SONGS.length) % SONGS.length; store("teschi-song", String(songIdx)); go("song"); }
    else if (screen === "mode") { const ids = ["solo", "cpu", "duo"]; mode = ids[(ids.indexOf(mode) + k + 3) % 3]; store("teschi-mode", mode); go("mode"); }
  }
  function togglePause() {
    if (state === "play") { pausedFrom = state; state = "paused"; if (audioCtx) audioCtx.suspend().catch(() => {}); touches.clear(); for (const p of players) p.held = [null, null, null, null]; showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><button type="button" data-title>MENU</button><p class="muted">Premi P per continuare</p>`); }
    else if (state === "paused") { state = pausedFrom; overlay.classList.add("hidden"); if (audioCtx) audioCtx.resume().catch(() => {}); lastT = performance.now(); }
    syncControls();
  }
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); state = "play"; if (audioCtx) audioCtx.resume().catch(() => {}); endSong(false); });
  function syncControls() { pauseBtn.style.display = state === "play" && touchMode ? "block" : "none"; resize(); }
  pauseBtn.addEventListener("click", () => togglePause());
  overlay.addEventListener("click", (e) => {
    const q = (s) => e.target.closest(s); let el;
    if ((el = q("[data-diff]"))) { setDifficulty(el.dataset.diff); return; }
    if ((el = q("[data-mode]"))) { mode = el.dataset.mode; store("teschi-mode", mode); menuNext(); return; }
    if ((el = q("[data-pick]"))) { pick[charStep] = +el.dataset.pick; store("teschi-p1", String(pick[0])); store("teschi-p2", String(pick[1])); sfx.ui(); go("char"); return; }
    if ((el = q("[data-ch]"))) { menuMove(+el.dataset.ch); return; }
    if (q("[data-next]")) { menuNext(); return; }
    if (q("[data-back]")) { menuBack(); return; }
    if (q("[data-start]") || q("[data-retry]")) { startSong(); return; }
    if (q("[data-songs]")) { if (audioCtx) audioCtx.resume().catch(() => {}); go("song"); return; }
    if (q("[data-resume]")) { togglePause(); return; }
    if (q("[data-title]")) { if (audioCtx) audioCtx.resume().catch(() => {}); go("title"); return; }
  });
  // ---------- Input ----------
  const P1KEYS = { a: 0, s: 1, w: 2, d: 3 }, P2KEYS = { arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 }, ALTKEYS = { d: 0, f: 1, j: 2, k: 3 };
  function keyLane(k) {
    if (mode === "duo") { if (k in P1KEYS) return [0, P1KEYS[k]]; if (k in P2KEYS) return [1, P2KEYS[k]]; return null; }
    if (k in P2KEYS) return [0, P2KEYS[k]]; if (k in P1KEYS) return [0, P1KEYS[k]]; if (k in ALTKEYS) return [0, ALTKEYS[k]]; return null;
  }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu") { if (e.repeat) return; if (e.key === "Enter" || k === " ") menuNext(); else if (k === "escape" || k === "backspace") menuBack(); else if (k === "arrowleft" || k === "a") menuMove(-1); else if (k === "arrowright" || k === "d") menuMove(1); else if (screen === "song" && ["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]); return; }
    if (state === "results") { if (e.key === "Enter") startSong(); return; }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state !== "play" || e.repeat) return;
    const m = keyLane(k); if (m) press(m[0], m[1]);
  });
  window.addEventListener("keyup", (e) => { const m = keyLane(e.key.toLowerCase()); if (m) release(m[0], m[1]); });
  const touches = new Map();
  const toScreen = (e) => { const rc = canvas.getBoundingClientRect(); return { x: ((e.clientX - rc.left) / rc.width) * W, y: ((e.clientY - rc.top) / rc.height) * H }; };
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault(); if (state !== "play") return;
    const pt = toScreen(e);
    for (const p of players) { if (p.cpu) continue; const L = p.lanes; if (pt.x >= L.x - 6 && pt.x <= L.x + L.w + 6) { const lane = clamp(Math.floor((pt.x - L.x) / (L.w / 4)), 0, 3); touches.set(e.pointerId, [p.idx, lane]); try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ } press(p.idx, lane); return; } }
  });
  const lift = (e) => { const m = touches.get(e.pointerId); if (m) { release(m[0], m[1]); touches.delete(e.pointerId); } };
  canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);
  window.addEventListener("blur", () => { if (state === "play") togglePause(); });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state !== "paused") update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  resize(); showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="teschi-best-" data-kind="score"></script>

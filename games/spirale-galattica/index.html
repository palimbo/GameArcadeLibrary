<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spirale Galattica</title>
<style>
  :root {
    --bg: #04030e;
    --fg: #f4f0ff;
    --muted: #a8a0d0;
    --violet: #b86aff;
    --yellow: #ffe04a;
    --red: #ff4a4a;
    --cyan: #4ae8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1a4a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 240, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* point the thumb stick where you want the ship on the circle; hold FUOCO */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(184, 106, 255, 0.6); background: radial-gradient(circle, rgba(184,106,255,0.14), rgba(184,106,255,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(184, 106, 255, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,240,255,0.25); pointer-events: none; }
  #touch .fire { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 224, 74, 0.9); background: rgba(255, 224, 74, 0.2); }
  #touch .fire.on { background: rgba(255, 224, 74, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 3, 14, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; letter-spacing: 2px; color: var(--violet);
    text-shadow: 0 0 14px rgba(184,106,255,0.7), 0 0 34px rgba(184,106,255,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--cyan); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,240,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--violet); color: #1a0030; background: var(--violet); padding: 11px 30px; box-shadow: 0 0 18px rgba(184,106,255,0.55); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 400, H = 440, TAU = Math.PI * 2;
  const CX = 200, CY = 250, R = 165;          // the ship runs round this circle; the centre is far away
  const PLANETS = [
    { name: "Nettuno", c1: "#4a7aff", c2: "#1a2a8a" }, { name: "Urano", c1: "#6ae8e8", c2: "#1a7a8a" },
    { name: "Saturno", c1: "#e8c87a", c2: "#8a6a2a", ring: true }, { name: "Giove", c1: "#e8a86a", c2: "#8a4a2a", bands: true },
    { name: "Marte", c1: "#e85a3a", c2: "#7a1a0a" }, { name: "Terra", c1: "#3a9aff", c2: "#2a8a3a", earth: true },
  ];
  const KINDS = [["#ff4a6a", "#ffe04a"], ["#4ae8ff", "#ffffff"], ["#7ae84a", "#ffe04a"], ["#ffb43a", "#ff4a3a"], ["#c86aff", "#4ae8ff"]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 navicelle · nemici un po' più lenti", lives: 5, pace: 0.95, fire: 1, dive: 1 },
    normale:   { label: "NORMALE",   color: "#b86aff", desc: "3 navicelle · l'esperienza classica", lives: 3, pace: 1, fire: 1, dive: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4a4a", desc: "3 navicelle · picchiate e colpi fitti", lives: 3, pace: 1.15, fire: 1.35, dive: 1.35 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "spirale-difficulty";
  const bestKey = (id) => `spirale-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const wrapA = (a) => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
  const px = (a, r) => CX + Math.cos(a) * r, py = (a, r) => CY + Math.sin(a) * r;
  const scaleAt = (r) => 0.25 + 0.75 * clamp(r / R, 0, 1.3);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1300, 0.05, "square", 0.016, -800)),
    pop: lim(() => { noise(0.12, 0.12, 1500); beep(300, 0.08, "square", 0.02, -200); }),
    dive: lim(() => beep(900, 0.35, "sine", 0.02, -600)),
    enemyShot: lim(() => beep(260, 0.1, "sawtooth", 0.015, 120)),
    power: () => arp([523, 784, 1047, 1568, 2093], 0.05, 0.1),
    die: () => { noise(0.5, 0.3, 700); arp([523, 392, 311, 262, 196], 0.09, 0.15, "triangle", 0.05); },
    warp: () => beep(200, 1.4, "sawtooth", 0.02, 1400),
    planet: () => arp([392, 523, 659, 784, 1047, 1319], 0.1, 0.18),
    perfect: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.07, 0.14),
    life: () => arp([784, 988, 1175, 1568], 0.07, 0.12),
    start: () => arp([392, 523, 659, 784, 1047], 0.09, 0.14),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, planet = 0, warp = 0, loop = 0, bestCache = 0, nextLife = 30000;
  let P = { a: Math.PI / 2, inv: 0, cool: 0, double: false }, enemies = [], shots = [], bullets = [], sats = null, stars = [];
  let groupsLeft = 0, groupT = 0, waveT = 0, formRot = 0, chance = null, parts = [], popups = [], message = null;
  let firing = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const pace = () => diff.pace * (1 + Math.min(12, planet * 2 + warp + loop * 3) * 0.035);
  const WARPS = 2;

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "warp", "planet", "chance"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; planet = 0; warp = 0; loop = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = { a: Math.PI / 2, inv: 0, cool: 0, double: false };
    beginWave();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginWave() {
    enemies = []; bullets = []; shots = []; sats = null; chance = null;
    groupsLeft = 3; groupT = 0.4; waveT = 0; formRot = 0;
    const pl = PLANETS[planet % PLANETS.length], left = WARPS - warp;
    message = { text: `${left} WARP A ${pl.name.toUpperCase()}`, sub: loop ? `giro ${loop + 1} del sistema solare` : "", t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function addScore(n, x, y, color = "#f4f0ff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 60000; if (lives < 9) { lives++; sfx.life(); popups.push({ x: CX, y: CY, text: "NAVICELLA EXTRA", color: "#ffe04a", t: 0 }); } }
  }
  function burst(x, y, c, n = 10, sp = 110, life = 0.5) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(why) {
    if (P.inv > 0 || (state !== "play" && state !== "chance")) return;
    lives--; P.double = false;
    sfx.die();
    burst(px(P.a, R), py(P.a, R), "#ffe04a", 22, 160, 0.8); burst(px(P.a, R), py(P.a, R), "#ff4a4a", 14, 120, 0.6);
    message = { text: "COLPITO!", sub: lives > 0 ? `Ne restano ${lives}` : "", t: 0 };
    (window.__deaths = window.__deaths || []).push(why);
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    bullets = [];
    // the ones on their way down go back up
    for (const e of enemies) if (e.st === "dive") { e.st = "back"; e.t = 0; e.r = 10; }
    P.inv = 2.2;
    state = "play";
  }
  function waveCleared() {
    bullets = []; shots = [];
    warp++;
    if (warp >= WARPS) {
      const pl = PLANETS[planet % PLANETS.length], bonus = 1000 * (planet + 1 + loop * PLANETS.length);
      addScore(bonus);
      message = { text: `${pl.name.toUpperCase()}!`, sub: `Arrivo sul pianeta · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
      sfx.planet();
      state = "planet"; stateT = 3;
    } else {
      message = { text: "WARP!", sub: "", t: 0 };
      sfx.warp();
      state = "warp"; stateT = 1.8;
    }
  }
  function startChance() {
    enemies = []; bullets = []; shots = [];
    chance = { groups: 5, t: 1, kills: 0, total: 40 };
    message = { text: "FASE BONUS", sub: "abbattili tutti: non sparano", t: 0 };
    state = "chance";
  }
  function endChance() {
    const perfect = chance.kills >= chance.total, bonus = chance.kills * 100 + (perfect ? 10000 : 0);
    addScore(bonus);
    message = { text: perfect ? "PERFETTO!" : "FASE BONUS FINITA", sub: `${chance.kills}/${chance.total} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    if (perfect) sfx.perfect();
    planet++; warp = 0;
    if (planet >= PLANETS.length) { planet = 0; loop++; }
    chance = null;
    state = "warp"; stateT = 2.4;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, where = PLANETS[planet % PLANETS.length].name;
    menu = () => showOverlay(
      `<h2 class="lose">FINE DEL VIAGGIO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · verso ${where} · ${played}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SPIRALE GALATTICA</h1>
       <p>Viaggio da Nettuno fino alla Terra. La tua astronave gira lungo il bordo del cerchio e spara verso il centro, da dove arrivano gli stormi nemici a spirale. Dopo ogni pianeta, una fase bonus.</p>
       <div class="pts">
         <span><b>Nemici</b></span><span>100 in formazione · 150 mentre arrivano · 200 in picchiata</span>
         <span><b>Satelliti</b></span><span>300 · colpisci quello centrale che lampeggia: doppio colpo!</span>
         <span><b>Fase bonus</b></span><span>100 per nemico · 10.000 se li abbatti tutti e 40</span>
         <span><b>Attenzione</b></span><span>i colpi nemici viaggiano verso l'esterno: spostati di lato</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Punta la levetta dove vuoi l'astronave sul cerchio · FUOCO (tieni premuto)</p>`
         : `<p class="muted help">Frecce o WASD: l'astronave va verso il punto del cerchio che indichi (anche in diagonale) · SPAZIO, J o Z fuoco · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>DECOLLO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  const FIRE_KEYS = [" ", "j", "z", "x", "k"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (FIRE_KEYS.includes(k)) firing = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (FIRE_KEYS.includes(k)) firing = false;
    if (KEYMAP[k]) keys[KEYMAP[k]] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; firing = false; if (isPlaying()) togglePause(); });
  const fireBtn = touchEl.querySelector(".fire");
  let fireId = null;
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); fireId = e.pointerId; try { fireBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } firing = true; fireBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, (e) => { if (e.pointerId !== fireId) return; fireId = null; firing = false; fireBtn.classList.remove("on"); });

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cavaliere in Mutande</title>
<style>
  :root {
    --bg: #0a0c18;
    --fg: #eef0f8;
    --muted: #a0a4c0;
    --silver: #c8d0e8;
    --gold: #ffd24a;
    --red: #ff4a5a;
    --pink: #ff9ac8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #22264a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(238, 240, 248, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick (walk, down to crouch), a jump and a throw button */
  #touch .stick { position: relative; width: 132px; height: 132px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(200, 208, 232, 0.55); background: radial-gradient(circle, rgba(200,208,232,0.14), rgba(200,208,232,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(200, 208, 232, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(238,240,248,0.25); pointer-events: none; }
  #touch .btns { display: flex; gap: 10px; align-items: flex-end; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .jump { width: 80px; height: 80px; border: 2px solid rgba(255, 210, 74, 0.9); background: rgba(255, 210, 74, 0.18); margin-bottom: 44px; }
  #touch .fire { width: 90px; height: 90px; border: 2px solid rgba(255, 74, 90, 0.9); background: rgba(255, 74, 90, 0.2); }
  #touch .btns button.on { background: rgba(255, 210, 74, 0.5); }
  #touch.small .stick { width: 108px; height: 108px; }
  #touch.small .stick .knob { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
  #touch.small .jump { width: 64px; height: 64px; font-size: 10px; margin-bottom: 32px; }
  #touch.small .fire { width: 74px; height: 74px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 12, 24, 0.92);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(28px, 8vw, 54px); font-weight: 900; letter-spacing: 1px; color: var(--silver);
    text-shadow: 0 3px 0 #3a3e6a, 0 0 22px rgba(200,208,232,0.35); }
  #overlay h1 span { color: var(--pink); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--silver); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 600px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(238,240,248,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--silver); color: #14162a; background: var(--silver); padding: 11px 30px; box-shadow: 0 4px 0 #3a3e6a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="jump" aria-label="Salta">SALTA</button>
    <button type="button" class="fire" aria-label="Lancia">LANCIA</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  const GROUND = 300, GRAV = 1150, WALK = 130, JUMP = 460, HUD = 26;
  const PW = 18, PH = 32, PH_CROUCH = 20;

  const THEMES = [
    { name: "Il Cimitero", sky: ["#0c1230", "#28305a"], hill: "#141a38", ground: "#3a2e24", top: "#5a4a30", prop: "tomb", pit: "#000", boss: "#6a9a4a", enemies: ["zombie", "crow", "plant"] },
    { name: "La Foresta", sky: ["#08180e", "#1c3a26"], hill: "#0e2416", ground: "#2e2a1a", top: "#3a5a2a", prop: "stump", pit: "#1a3a6a", boss: "#8a6a3a", enemies: ["ghost", "plant", "crow"] },
    { name: "Il Villaggio Fantasma", sky: ["#180c2a", "#3a2050"], hill: "#1e1030", ground: "#302430", top: "#4a3a4a", prop: "barrel", pit: "#000", boss: "#8a4ab0", enemies: ["ghost", "zombie", "crow"] },
    { name: "Il Castello", sky: ["#200808", "#4a1a14"], hill: "#240c0a", ground: "#3a3030", top: "#5a4a48", prop: "pillar", pit: "#6a1a0a", boss: "#c83a2a", enemies: ["zombie", "ghost", "plant", "crow"] },
  ];
  const WEAPONS = {
    lancia: { name: "LANCIA", max: 2, cool: 0.3, speed: 380 },
    pugnale: { name: "PUGNALE", max: 3, cool: 0.17, speed: 540 },
    torcia: { name: "TORCIA", max: 2, cool: 0.42, speed: 220 },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · nemici lenti · più armature nelle giare", lives: 5, pace: 0.8, spawn: 0.7, armor: 0.45, demonHp: 2, time: 200 },
    normale:   { label: "NORMALE",   color: "#c8d0e8", desc: "3 vite · l'esperienza classica", lives: 3, pace: 1, spawn: 1, armor: 0.3, demonHp: 3, time: 170 },
    difficile: { label: "DIFFICILE", color: "#ff4a5a", desc: "3 vite · nemici veloci e numerosi, il diavoletto schiva di più", lives: 3, pace: 1.2, spawn: 1.35, armor: 0.2, demonHp: 4, time: 150 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "cavaliere-difficulty";
  const bestKey = (id) => `cavaliere-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    throw: lim(() => beep(700, 0.07, "square", 0.025, -300)),
    jump: lim(() => beep(300, 0.12, "square", 0.025, 300)),
    hit: lim(() => { noise(0.1, 0.12, 1500); beep(200, 0.08, "square", 0.03, -80); }),
    kill: lim(() => { noise(0.2, 0.15, 900); arp([523, 392], 0.05, 0.08, "square", 0.03); }),
    clink: lim(() => beep(1800, 0.05, "square", 0.02)),
    armor: () => { noise(0.4, 0.25, 2500); arp([392, 330, 262], 0.08, 0.12, "square", 0.04); },
    die: () => arp([392, 370, 349, 330, 311, 294, 262], 0.1, 0.16, "triangle", 0.05),
    pot: lim(() => { noise(0.15, 0.15, 1800); beep(900, 0.1, "square", 0.03, 400); }),
    item: () => arp([659, 784, 1047, 1319], 0.06, 0.1, "square", 0.04),
    spit: lim(() => beep(260, 0.1, "sawtooth", 0.02, 200)),
    boulder: lim(() => noise(0.3, 0.18, 400)),
    stomp: lim(() => { noise(0.4, 0.3, 200); beep(60, 0.3, "square", 0.05, -20); }),
    rise: lim(() => beep(120, 0.4, "sawtooth", 0.02, 60)),
    caw: lim(() => beep(900, 0.15, "sawtooth", 0.02, -400)),
    boss: () => arp([196, 185, 175, 165], 0.15, 0.25, "sawtooth", 0.04),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    start: () => arp([262, 311, 392, 523, 466, 392, 523], 0.11, 0.15, "square", 0.04),
    over: () => arp([392, 370, 349, 330, 294, 262, 196], 0.14, 0.22, "triangle", 0.05),
    tick: lim(() => beep(1200, 0.04, "square", 0.02)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, stage = 0, loop = 0, timeLeft = 0, bestCache = 0, kills = 0, nextLife = 30000;
  let P = null, cam = 0, L = 3000, solids = [], props = [], pits = [], spawners = [], enemies = [], shots = [], foes = [], pots = [], items = [], parts = [], popups = [];
  let checkpoint = 0, checkpointHit = false, arena = 0, bossOn = false, key = null, zombieT = 0, message = null, shake = 0;
  let jumpPressed = false, firePressed = false, fireHeld = false;
  const keys = { left: false, right: false, down: false };
  const stick = { x: 0, y: 0 };
  const theme = () => THEMES[stage % THEMES.length];
  const pace = () => diff.pace * (1 + loop * 0.2);
  const bossHp = () => 12 + (stage % THEMES.length) * 3 + loop * 6;

  // ---------- The stage ----------
  function buildStage() {
    const th = theme();
    L = 3200 + (stage % THEMES.length) * 250 + loop * 200;
    solids = []; props = []; pits = []; spawners = []; enemies = []; shots = []; foes = []; pots = []; items = []; parts = []; popups = [];
    arena = L - W;
    // ground with gaps you can jump
    let x = 0;
    while (x < L) {
      let len = rnd(380, 680);
      if (x + len > arena - 60 || x < 500) len = Math.max(len, x < 500 ? 560 - x : L - x);
      len = Math.min(len, L - x);
      solids.push({ x, y: GROUND, w: len, h: 200, ground: true });
      x += len;
      if (x < arena - 100) { const gap = rnd(44, 66); pits.push({ x, w: gap }); x += gap; }
    }
    const onGround = (px, margin) => solids.some((s) => s.ground && px - margin > s.x && px + margin < s.x + s.w);
    // tombstones, stumps, barrels or pillars: solid, they stop the lances
    for (let px = 360; px < arena - 80; px += rnd(170, 290)) {
      // never right before or after a gap: jumping over one must not drop you into the other
      if (!onGround(px, 110)) continue;
      const h = rnd(24, 34), w = 24;
      const s = { x: px - w / 2, y: GROUND - h, w, h, prop: th.prop };
      solids.push(s); props.push(s);
      if (th.enemies.includes("crow") && Math.random() < 0.35) spawners.push({ kind: "crow", x: px, y: GROUND - h });
    }
    // floating ledges
    for (let px = 700; px < arena - 200; px += rnd(520, 760)) {
      // only over solid ground, well clear of any gap
      if (!onGround(px + 48, 150)) continue;
      const s = { x: px, y: GROUND - rnd(78, 96), w: 96, h: 12, ledge: true };
      solids.push(s);
      if (Math.random() < 0.5) pots.push({ x: px + 48, y: s.y, vy: 0, open: false, sit: true });
    }
    // plants, ghosts and the red demon
    if (th.enemies.includes("plant")) for (let px = 900; px < arena - 200; px += rnd(620, 900)) if (onGround(px, 20) && !props.some((p) => Math.abs(p.x - px) < 40)) spawners.push({ kind: "plant", x: px, y: GROUND });
    if (th.enemies.includes("ghost")) for (let px = 600; px < arena - 100; px += rnd(380, 560) / diff.spawn) spawners.push({ kind: "ghost", x: px });
    spawners.push({ kind: "demon", x: Math.round(L * 0.55) });
    if (stage >= 2 || loop > 0) spawners.push({ kind: "demon", x: Math.round(L * 0.8) });
    checkpoint = Math.round(L * 0.5); checkpointHit = false;
    bossOn = false; key = null; zombieT = 2;
  }
  function groundTop(x) {
    // the highest thing to stand on at x, for walkers
    for (const s of solids) if (s.ground && x >= s.x && x <= s.x + s.w) return s.y;
    return null;
  }
  function newPlayer(x) {
    P = { x, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true, crouch: false, armor: true, inv: 2, walk: 0, throwT: 0, weapon: P ? P.weapon : "lancia", dead: 0 };
    cam = clamp(x - W * 0.35, 0, L - W);
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; stage = 0; loop = 0; kills = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = null;
    beginStage();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginStage() {
    buildStage();
    newPlayer(60);
    timeLeft = diff.time;
    message = { text: `LIVELLO ${stage + 1}`, sub: theme().name, t: 0 };
    state = "intro"; stateT = 2;
  }
  function addScore(n, x, y, color = "#eef0f8") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; if (lives < 9) { lives++; sfx.item(); popups.push({ x: P.x, y: P.y - 50, text: "VITA EXTRA", color: "#ffd24a", t: 0 }); } }
  }
  function burst(x, y, c, n = 10, sp = 120, life = 0.5, g = 400) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: life * rnd(0.6, 1.2), c, g }); }
  }
  function hurt(fromX) {
    if (state !== "play" || P.inv > 0 || P.dead) return;
    if (P.armor) {
      // the armour flies off, and you are left in your underwear
      P.armor = false; P.inv = 1.6;
      P.vx = sign(P.x - fromX) * 140; P.vy = -260; P.onGround = false;
      for (let k = 0; k < 8; k++) parts.push({ x: P.x, y: P.y - 20, vx: rnd(-160, 160), vy: rnd(-300, -120), t: 0, life: 1.2, c: "#c8d0e8", g: 900, big: true });
      sfx.armor();
      popups.push({ x: P.x, y: P.y - 50, text: "IN MUTANDE!", color: "#ff9ac8", t: 0 });
    } else die();
  }
  function die() {
    if (P.dead) return;
    P.dead = 0.001; lives--;
    sfx.die();
    message = { text: "SEI CADUTO", sub: lives > 0 ? `Vite rimaste: ${lives}` : "", t: 0 };
    state = "dead"; stateT = 2.4;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    enemies = []; foes = [];
    for (const s of spawners) if (s.kind !== "demon" && s.kind !== "crow") s.used = false;
    const start = checkpointHit ? checkpoint : 60;
    if (bossOn) { bossOn = false; }
    newPlayer(start);
    timeLeft = Math.max(timeLeft, 90);
    state = "play";
  }
  function stageClear() {
    const bonus = Math.ceil(timeLeft) * 10 + 2000 * (stage + 1);
    addScore(bonus);
    message = { text: "LIVELLO SUPERATO!", sub: `Bonus ${bonus.toLocaleString("it-IT")}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3.2;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    const played = diff.label, lv = stage + 1, k = kills;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       <p class="muted">Mostri sconfitti: ${k}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }

    if (!P) { stage = stage || 0; buildStage(); newPlayer(60); P.inv = 0; }
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-4, 4) * shake, rnd(-4, 4) * shake);
    drawBack();
    drawGround();
    // the checkpoint banner
    if (checkpoint > cam - 20 && checkpoint < cam + W + 20) {
      const x = checkpoint - cam;
      ctx.fillStyle = "#6a5a4a"; ctx.fillRect(x - 1, GROUND - 60, 2, 60);
      ctx.fillStyle = checkpointHit ? "#ffd24a" : "#8a8a9a"; ctx.beginPath(); ctx.moveTo(x + 1, GROUND - 60); ctx.lineTo(x + 20, GROUND - 53 + Math.sin(clock * 5) * 2); ctx.lineTo(x + 1, GROUND - 46); ctx.fill();
    }
    // the gate to the boss
    if (arena + 100 > cam - 20 && arena + 100 < cam + W + 20 && !bossOn && !key) {
      const x = arena + 100 - cam;
      ctx.fillStyle = "#2a2a3a"; ctx.fillRect(x - 30, GROUND - 90, 60, 90); ctx.fillStyle = "#0a0a14"; ctx.beginPath(); ctx.arc(x, GROUND - 50, 22, Math.PI, 0); ctx.fillRect(x - 22, GROUND - 50, 44, 50); ctx.fill();
    }
    for (const p of pots) if (!p.open && p.x > cam - 20 && p.x < cam + W + 20) drawPot(p, p.x - cam);
    for (const it of items) drawItem(it);
    if (key) { const x = key.x - cam, y = key.y; ctx.fillStyle = "#ffd24a"; ctx.beginPath(); ctx.arc(x - 6, y, 6, 0, TAU); ctx.fill(); ctx.fillRect(x - 2, y - 2, 16, 4); ctx.fillRect(x + 8, y, 3, 6); ctx.fillRect(x + 12, y, 3, 5); ctx.fillStyle = "rgba(255,210,74,0.2)"; ctx.beginPath(); ctx.arc(x, y, 18 + Math.sin(clock * 6) * 3, 0, TAU); ctx.fill(); }
    for (const e of enemies) drawEnemy(e);
    if (P) drawKnight();
    for (const s of shots) drawShot(s);
    for (const f of foes) drawFoe(f);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; const s = p.big ? 5 : 3; ctx.fillRect(p.x - cam - s / 2, p.y - s / 2, s, s); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(p.text, p.x - cam, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - cam, p.y);
    }
    ctx.globalAlpha = 1;
    // the boss's life bar
    const boss = enemies.find((e) => e.kind === "boss" && !e.dead);
    if (boss) { const max = bossHp(); ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(W / 2 - 100, HUD + 8, 200, 8); ctx.fillStyle = "#ff4a5a"; ctx.fillRect(W / 2 - 100, HUD + 8, 200 * boss.hp / max, 8); }
    ctx.restore();
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 26px system-ui, sans-serif";
      ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.strokeText(message.text, W / 2, 120); ctx.fillStyle = "#c8d0e8"; ctx.fillText(message.text, W / 2, 120);
      if (message.sub) { ctx.font = "800 13px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 142); ctx.fillStyle = "#ffd24a"; ctx.fillText(message.sub, W / 2, 142); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop_(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop_);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop_);
})();
</script>
<script src="../../shared/iniziali.js" data-record="cavaliere-best-" data-kind="score"></script>

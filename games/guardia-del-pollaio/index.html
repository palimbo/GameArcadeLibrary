<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>La Guardia del Pollaio</title>
<style>
  :root {
    --bg: #0a1a10;
    --fg: #f4f6ee;
    --muted: #d0f0c8;
    --pink: #ffc83a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a6a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 26, 16, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #0a3a10, 0 0 22px rgba(255,200,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #06200a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const COLS = 9, ROWS = 5, CS = 56, FX = 104, FY = 76;
  // who you can put in the yard: what it costs in eggs, how long before you can place another, how much it can take
  const UNITS = {
    gallina:  { name: "Gallina", cost: 50, wait: 5, hp: 70, from: 1, tip: "fa un uovo ogni 10 secondi" },
    oca:      { name: "Oca", cost: 100, wait: 6, hp: 80, from: 1, tip: "tira chicchi di mais lungo la corsia" },
    fieno:    { name: "Fieno", cost: 50, wait: 14, hp: 480, from: 1, tip: "una balla che sbarra la strada" },
    capra:    { name: "Capra", cost: 125, wait: 12, hp: 170, from: 3, tip: "incorna chi si avvicina e lo ributta indietro" },
    alveare:  { name: "Alveare", cost: 150, wait: 15, hp: 90, from: 5, tip: "le api rallentano e pungono per tre caselle" },
    tacchino: { name: "Tacchino", cost: 200, wait: 15, hp: 110, from: 7, tip: "tira su tre corsie insieme" },
  };
  const UNIT_IDS = Object.keys(UNITS);
  // who comes for the hens: toughness, speed in squares a second, bite, and how much of a wave it is worth
  const FOES = {
    volpe:     { name: "volpe", hp: 110, sp: 0.21, bite: 26, cost: 1, from: 1 },
    faina:     { name: "faina", hp: 62, sp: 0.42, bite: 20, cost: 1, from: 2 },
    lupo:      { name: "lupo", hp: 230, sp: 0.26, bite: 38, cost: 2.2, from: 3 },
    talpa:     { name: "talpa", hp: 95, sp: 0.24, bite: 22, cost: 1.5, from: 4 },
    cinghiale: { name: "cinghiale", hp: 400, sp: 0.17, bite: 60, cost: 3.5, from: 6 },
    orso:      { name: "orso", hp: 1400, sp: 0.12, bite: 120, cost: 10, from: 99 },
  };

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "più uova all'inizio e bestie meno numerose", eggs: 150, bud: 0.8, hp: 0.9 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "le notti di sempre", eggs: 100, bud: 1, hp: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "poche uova, branchi più grossi e più coriacei", eggs: 75, bud: 1.2, hp: 1.15 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pollaio-difficulty";
  const bestKey = (id) => `pollaio-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    touchEl.style.display = "none";
    wrapEl.style.paddingBottom = "0";
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, noiseBuf = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q = 1, delay = 0, slide = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 3) fn(...a); };
  const sfx = {
    place: () => { noise(0.08, 0.06, 500, 1); beep(330, 0.08, "triangle", 0.05, 120); },
    no: () => beep(160, 0.12, "square", 0.04, -40),
    pick: () => beep(700, 0.04, "square", 0.025),
    egg: lim(() => { beep(880, 0.06, "triangle", 0.035); beep(1175, 0.08, "triangle", 0.03, 0, 0.05); }),
    shot: lim(() => noise(0.04, 0.025, 2400, 2, 0, -900)),
    hit: lim(() => noise(0.04, 0.03, 900, 1.5)),
    ram: () => { noise(0.12, 0.09, 300, 0.8); beep(220, 0.12, "square", 0.05, -120); },
    bite: lim(() => noise(0.05, 0.03, 500, 2)),
    down: lim(() => { beep(500, 0.14, "square", 0.04, -350); noise(0.1, 0.04, 700, 1); }),
    lost: () => { beep(300, 0.25, "sawtooth", 0.05, -200); noise(0.2, 0.05, 400, 0.8); },
    dog: () => { beep(260, 0.09, "sawtooth", 0.07, 80); beep(240, 0.11, "sawtooth", 0.07, 100, 0.16); noise(0.3, 0.05, 600, 0.6, 0.05); },
    wave: () => arp([392, 392, 523], 0.14, 0.18, "square", 0.045),
    clear: () => arp([523, 659, 784, 1047], 0.08, 0.2, "triangle", 0.05),
    boss: () => { beep(90, 0.6, "sawtooth", 0.08, -30); noise(0.5, 0.06, 200, 0.5); },
    unlock: () => arp([659, 784, 988, 1319], 0.06, 0.16, "triangle", 0.05),
    end: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, eggs = 0, wave = 0, grid = [], foes = [], shots = [], flying = [], parts = [], popups = [], message = null, dogs = [], cards = {};
  let queue = [], waveT = 0, rest = 0, incomeT = 0, sel = null, cur = { r: 2, c: 2 }, hoverCell = null, kbOn = false, kills = 0, lostUnits = 0, waveLost = 0, ending = 0, shake = 0, placed = 0;
  const isPlaying = () => state === "play";
  const unlocked = (id) => wave + (rest > 0 || !wave ? 1 : 0) >= UNITS[id].from;
  const cx = (c) => FX + (c + 0.5) * CS, cy = (r) => FY + (r + 0.5) * CS;

  // ---------- Waves ----------
  function makeWave(n) {
    let budget = (5 + n * 3 + n * n * 0.2) * (1 + (diff.bud - 1) * Math.min(1, n / 4));
    const list = [], kinds = Object.keys(FOES).filter((k) => FOES[k].from <= n);
    if (n % 5 === 0) { for (let i = 0; i < Math.floor(n / 10) + 1; i++) list.push("orso"); budget -= 6; }
    while (budget > 0.5) { const pick = Math.random() < 0.4 ? "volpe" : kinds[Math.floor(Math.random() * kinds.length)]; list.push(pick); budget -= FOES[pick].cost; }
    // they trickle in, then the last third comes all together
    const dur = Math.min(46, 16 + n * 1.6), out = [];
    list.sort(() => Math.random() - 0.5).forEach((kind, i) => {
      const f = i / list.length, t = f < 0.65 ? f / 0.65 * dur * 0.75 : dur * 0.82 + (f - 0.65) / 0.35 * dur * 0.18;
      out.push({ t: t + rnd(0, 1.2), kind, r: Math.floor(Math.random() * ROWS) });
    });
    return out.sort((a, b) => a.t - b.t);
  }
  function startWave() {
    wave++; waveT = 0; waveLost = 0; queue = makeWave(wave);
    const boss = wave % 5 === 0;
    message = { text: `NOTTE ${wave}`, sub: boss ? "arriva l'orso!" : `${queue.length} bestie in arrivo`, t: 0 };
    (boss ? sfx.boss : sfx.wave)();
  }
  function spawn(q) {
    const F = FOES[q.kind], hp = F.hp * diff.hp * (1 + Math.max(0, wave - 8) * 0.06);
    foes.push({ kind: q.kind, r: q.r, x: COLS + 0.4, hp, max: hp, slow: 0, eat: 0, under: false, dug: false, kb: 0, t: rnd(0, 6), flash: 0 });
  }

  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; eggs = diff.eggs; wave = 0; foes = []; shots = []; flying = []; parts = []; popups = []; queue = []; waveT = 0; rest = 16; incomeT = 0; sel = null; kills = 0; lostUnits = 0; ending = 0; shake = 0; placed = 0;
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    dogs = Array.from({ length: ROWS }, () => ({ state: "ready", x: -0.75 }));
    cards = {}; for (const id of UNIT_IDS) cards[id] = 0;
    cur = { r: 2, c: 1 };
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    message = { text: "PREPARA LA DIFESA", sub: "prima le galline: fanno le uova che servono per tutto il resto", t: 0, long: true };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function burst(x, y, n, col, sp = 60) {
    for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(0.3, 1) * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, t: 0, life: rnd(0.3, 0.6), col, s: rnd(1.5, 3) }); }
  }
  function addEggs(n, x, y) { flying.push({ x, y, t: 0, n }); }

  // ---------- Placing ----------
  function canPlace(id) { return unlocked(id) && cards[id] <= 0 && eggs >= UNITS[id].cost; }
  function choose(id) {
    if (id !== "pala" && !unlocked(id)) { sfx.no(); return; }
    sel = sel === id ? null : id; sfx.pick();
  }
  function act(r, c) {
    if (!isPlaying() || ending || r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    if (sel === "pala") {
      const u = grid[r][c];
      if (!u) { sfx.no(); return false; }
      grid[r][c] = null; eggs += Math.floor(UNITS[u.type].cost * 0.25); burst(cx(c), cy(r), 8, "#c8a070"); sfx.down(); sel = null;
      return true;
    }
    if (!sel) return false;
    if (grid[r][c] || !canPlace(sel) || foes.some((f) => f.r === r && !f.under && Math.abs(f.x - (c + 0.5)) < 0.45)) { sfx.no(); return false; }
    const U = UNITS[sel];
    grid[r][c] = { type: sel, hp: U.hp, max: U.hp, t: sel === "gallina" ? 4 : 0, anim: 0, pop: 0.001, flash: 0 };
    eggs -= U.cost; cards[sel] = U.wait; placed++;
    sfx.place(); burst(cx(c), cy(r) + 14, 6, "#d8c890", 40);
    if (!canPlace(sel)) sel = null;
    return true;
  }

  // ---------- Update ----------
  function hurt(f, dmg) {
    f.hp -= dmg; f.flash = 0.12;
    if (f.hp > 0) return;
    f.dead = true; kills++; score += Math.round(FOES[f.kind].cost * 100);
    burst(cx(f.x - 0.5), cy(f.r), 10, "#d8a060"); sfx.down();
    if (f.kind === "orso") { popups.push({ text: "ORSO SCACCIATO! +1.000", t: 0, x: 320, y: 150, big: true }); impresa("orso"); }
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1.4);
    shake = Math.max(0, shake - dt);
    if (!isPlaying()) return;
    if (message) { message.t += dt; if (message.t > (message.long ? 4 : 2.4)) message = null; }
    if (ending) { ending += dt; if (ending > 1.8) gameOver(); return; }
    for (const id of UNIT_IDS) cards[id] = Math.max(0, cards[id] - dt);
    for (const e of flying) { e.t += dt; if (e.t >= 0.7 && !e.done) { e.done = true; eggs += e.n; sfx.egg(); } }
    flying = flying.filter((e) => !e.done);
    // a few eggs turn up on their own
    incomeT += dt; if (incomeT >= 11) { incomeT = 0; addEggs(25, rnd(200, 520), FY + rnd(20, 260)); }
    // the night
    if (rest > 0) { rest -= dt; if (rest <= 0) startWave(); }
    else {
      waveT += dt;
      while (queue.length && queue[0].t <= waveT) spawn(queue.shift());
      if (!queue.length && !foes.length) {
        const bonus = 300 * wave;
        score += bonus; rest = 9; sfx.clear();
        popups.push({ text: `NOTTE ${wave} SUPERATA  +${bonus.toLocaleString("it-IT")}`, t: 0, x: 320, y: 120, big: true });
        if (!waveLost && wave >= 3) impresa("intatta");
        if (wave === 10) impresa("dieci");
        for (const id of UNIT_IDS) if (UNITS[id].from === wave + 1) { sfx.unlock(); message = { text: `NUOVO: ${UNITS[id].name.toUpperCase()}`, sub: UNITS[id].tip, t: 0, long: true }; }
      }
    }
    // the yard
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const u = grid[r][c];
      if (!u) continue;
      u.anim = Math.max(0, u.anim - dt * 3); u.flash = Math.max(0, u.flash - dt); if (u.pop) { u.pop += dt * 5; if (u.pop >= 1) u.pop = 0; }
      if (u.hp <= 0) { grid[r][c] = null; lostUnits++; waveLost++; burst(cx(c), cy(r), 12, "#ffffff", 80); sfx.lost(); continue; }
      u.t += dt;
      const ahead = (lo, hi, row = r) => foes.find((f) => f.r === row && !f.under && !f.dead && f.x > c + lo && f.x < c + hi);
      if (u.type === "gallina") { if (u.t >= 10) { u.t = 0; u.anim = 1; addEggs(25, cx(c), cy(r)); } }
      else if (u.type === "oca") { if (u.t >= 1.4 && ahead(0.2, COLS + 0.6 - c)) { u.t = 0; u.anim = 1; shots.push({ r, x: c + 0.8, dmg: 20 }); sfx.shot(); } }
      else if (u.type === "tacchino") {
        if (u.t >= 1.5 && [r - 1, r, r + 1].some((row) => row >= 0 && row < ROWS && ahead(0.2, COLS + 0.6 - c, row))) {
          u.t = 0; u.anim = 1; sfx.shot();
          for (const row of [r - 1, r, r + 1]) if (row >= 0 && row < ROWS) shots.push({ r: row, x: c + 0.8, dmg: 16, from: r, y: 0 });
        }
      } else if (u.type === "capra") {
        const f = u.t >= 4.5 && ahead(0.3, 1.5);
        if (f) { u.t = 0; u.anim = 1; hurt(f, 45); f.kb = f.kind === "orso" ? 0.6 : f.kind === "cinghiale" ? 1.2 : 2.2; sfx.ram(); shake = Math.max(shake, 0.12); }
      } else if (u.type === "alveare") {
        for (const f of foes) if (f.r === r && !f.under && !f.dead && f.x > c && f.x < c + 3.6) { f.slow = 0.3; hurt(f, 7 * dt); f.flash = 0; }
      }
    }
    for (const s of shots) {
      s.x += 6.5 * dt;
      const f = foes.find((e) => e.r === s.r && !e.under && !e.dead && Math.abs(e.x - 0.5 - s.x + 0.5) < 0.32);
      if (f) { hurt(f, s.dmg); s.gone = true; sfx.hit(); burst(cx(s.x - 0.5), cy(s.r) - 4, 3, "#ffd23a", 40); }
    }
    shots = shots.filter((s) => !s.gone && s.x < COLS + 0.8);
    for (const f of foes) {
      if (f.dead) continue;
      const F = FOES[f.kind];
      f.t += dt; f.flash = Math.max(0, f.flash - dt); f.slow = Math.max(0, f.slow - dt);
      if (f.kb > 0) { const d = Math.min(f.kb, dt * 6); f.x = Math.min(COLS + 0.4, f.x + d); f.kb -= d; continue; }
      // the first defender in its way, if it is not passing underneath
      const c = Math.floor(f.x - 0.42), u = c >= 0 && c < COLS && f.x - (c + 0.5) < 0.62 ? grid[f.r][c] : null;
      if (u && f.kind === "talpa" && !f.dug) { f.under = true; f.dug = true; f.upAt = c - 0.2; }

      ctx.textAlign = "center"; ctx.fillStyle = "#3a2a1a"; ctx.font = "900 8px system-ui"; ctx.fillText(id === "pala" ? "PALA" : String(i + 1), x + CARD.w - 13, CARD.y + 10);
      if (U) { ctx.textAlign = "right"; ctx.fillStyle = eggs >= U.cost ? "#3a2a1a" : "#c82a1a"; ctx.font = "900 10px system-ui"; ctx.fillText(String(U.cost), x + CARD.w - 4, CARD.y + 30); drawEgg(x + CARD.w - 9 - ctx.measureText(String(U.cost)).width, CARD.y + 29, 0.62); ctx.textAlign = "center"; }
      if (U && cards[id] > 0) { ctx.fillStyle = "rgba(20,30,20,0.6)"; ctx.beginPath(); ctx.roundRect(x, CARD.y, CARD.w, CARD.h * cards[id] / U.wait, 6); ctx.fill(); }
    });
    ctx.textBaseline = "alphabetic";
  }
  function drawHud() {
    ctx.fillStyle = "rgba(10,26,16,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 10, 14);
    ctx.fillStyle = "#d0f0c8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 90, 9);
    ctx.fillStyle = "#ffc83a"; ctx.font = "900 9px system-ui"; ctx.fillText(diff.label, 90, 20);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffffff"; ctx.font = "800 12px system-ui";
    const left = queue.length + foes.length;
    ctx.fillText(rest > 0 ? (wave ? `Notte ${wave + 1} tra ${Math.ceil(rest)} s` : `Le bestie arrivano tra ${Math.ceil(rest)} s`) : `Notte ${wave} · ${left} ${left === 1 ? "bestia" : "bestie"}`, 330, 10);
    // how far the night has gone
    const total = rest > 0 ? 1 : queue.length ? clamp(waveT / (queue[queue.length - 1].t + 0.1), 0, 1) : 1;
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(260, 19, 140, 4); ctx.fillStyle = rest > 0 ? "#7ed87a" : "#ff8a5a"; ctx.fillRect(260, 19, 140 * (rest > 0 ? 1 - rest / (wave ? 9 : 16) : total), 4);
    ctx.textAlign = "right"; ctx.fillStyle = "#d0f0c8"; ctx.font = "700 9px system-ui"; ctx.fillText(`scacciate ${kills}`, touchMode ? 560 : 630, 14);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 8, rnd(-1, 1) * shake * 8);
    drawYard();
    if (state === "menu") { ctx.restore(); return; }
    // where the chosen card would go
    const cell = kbOn ? cur : hoverCell;
    if (sel && cell && !ending) {
      const free = sel === "pala" ? !!grid[cell.r][cell.c] : !grid[cell.r][cell.c] && canPlace(sel);
      ctx.fillStyle = free ? "rgba(255,255,255,0.3)" : "rgba(255,60,40,0.25)"; ctx.fillRect(FX + cell.c * CS, FY + cell.r * CS, CS, CS);
      if (free && sel !== "pala") { ctx.save(); ctx.translate(cx(cell.c), cy(cell.r)); ctx.globalAlpha = 0.5; drawUnit(sel, 0, 0); ctx.restore(); }
      if (sel === "alveare" && free) { ctx.fillStyle = "rgba(255,210,58,0.2)"; ctx.fillRect(FX + (cell.c + 1) * CS, FY + cell.r * CS, Math.min(3, COLS - cell.c - 1) * CS, CS); }
    } else if (kbOn) { ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2; ctx.strokeRect(FX + cur.c * CS + 2, FY + cur.r * CS + 2, CS - 4, CS - 4); }
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const u = grid[r][c];
        if (!u) continue;
        ctx.save(); ctx.translate(cx(c), cy(r));
        ell(0, 20, 16, 4, "rgba(0,0,0,0.2)");
        if (u.pop) { const s = 0.5 + Math.sin(u.pop * Math.PI * 0.5) * 0.6; ctx.scale(s, s); }
        if (u.flash > 0 && Math.floor(clock * 30) % 2) ctx.globalAlpha = 0.55;
        drawUnit(u.type, u.anim, clock + r + c);
        ctx.restore();
        if (u.hp < u.max) { ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(cx(c) - 16, cy(r) - 26, 32, 3.5); ctx.fillStyle = u.hp > u.max * 0.4 ? "#7ed87a" : "#ff5a4a"; ctx.fillRect(cx(c) - 16, cy(r) - 26, 32 * Math.max(0, u.hp / u.max), 3.5); }
      }
      for (const f of foes) {
        if (f.r !== r) continue;
        const x = cx(f.x - 0.5), y = cy(r);
        ctx.save(); ctx.translate(x, y);
        if (!f.under) ell(0, 20, 15, 4, "rgba(0,0,0,0.2)");
        drawFoe(f); ctx.restore();
        if (f.hp < f.max && !f.under) { const w = f.kind === "orso" ? 44 : 28; ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(x - w / 2, y - (f.kind === "orso" ? 40 : 25), w, 3); ctx.fillStyle = "#ff8a3a"; ctx.fillRect(x - w / 2, y - (f.kind === "orso" ? 40 : 25), w * Math.max(0, f.hp / f.max), 3); }
        if (f.slow > 0 && !f.under) for (let i = 0; i < 3; i++) ell(x + Math.cos(clock * 9 + i * 2) * 12, y - 6 + Math.sin(clock * 11 + i * 2) * 9, 1.8, 1.4, "#2a2a1a");
      }
      const d = dogs[r];
      if (d && d.state === "run") { ctx.save(); ctx.translate(cx(d.x), cy(r)); drawDog(1); ctx.restore(); }
    }
    for (const s of shots) { const y = cy(s.r) - 6; ell(cx(s.x - 0.5), y, 4, 3, "#ffd23a"); ell(cx(s.x - 0.5) - 1, y - 1, 1.5, 1, "#fff4b0"); }
    for (const e of flying) { const k = Math.min(1, e.t / 0.7), kk = k * k; drawEgg(e.x + (26 - e.x) * kk, e.y + (52 - e.y) * kk - Math.sin(k * Math.PI) * 30, 1); }
    for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ell(p.x, p.y, p.s, p.s, p.col); }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawCards();
    drawHud();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = clamp((1.4 - p.t) * 3, 0, 1); outlined(p.text, p.x, p.y - p.t * 16, p.big ? "900 15px system-ui" : "900 11px system-ui", p.big ? "#ffd23a" : "#ffffff", 4); }
    ctx.globalAlpha = 1;
    if (sel && sel !== "pala" && !ending) { ctx.fillStyle = "rgba(10,26,16,0.8)"; ctx.fillRect(FX, H - 15, COLS * CS, 15); ctx.fillStyle = "#ffffff"; ctx.font = "700 9px system-ui"; ctx.fillText(`${UNITS[sel].name}: ${UNITS[sel].tip}`, FX + COLS * CS / 2, H - 4.5); }
    if (message) {
      const life = message.long ? 4 : 2.4;
      ctx.globalAlpha = clamp((life - message.t) * 2, 0, 1);
      outlined(message.text, 356, 176, "italic 900 28px system-ui", "#ffc83a", 6);
      outlined(message.sub, 356, 197, "800 11px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="pollaio-best-" data-kind="score"></script>

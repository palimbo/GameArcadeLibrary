<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>L'Ultima Orda</title>
<style>
  :root {
    --bg: #080a06;
    --fg: #f4f6ee;
    --muted: #d0e8c0;
    --pink: #8aff3a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: moves you (and picks the cards); SCATTO dashes and confirms */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(138, 255, 58, 0.6); background: radial-gradient(circle, rgba(138,255,58,0.14), rgba(138,255,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(138, 255, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(138, 255, 58, 0.9); background: rgba(138, 255, 58, 0.22); }
  #touch .jump.on { background: rgba(138, 255, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(8, 10, 6, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a0a2a, 0 0 22px rgba(138,255,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #142a02; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #4a8a1a; }
  #overlay .kit { width: min(560px, 100%); display: grid; gap: 4px; text-align: left; font-size: 12px; color: var(--muted);
    background: rgba(138,255,58,0.06); border: 1px solid rgba(138,255,58,0.3); border-radius: 10px; padding: 8px 12px; }
  #overlay .kit .kit-t { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: var(--pink); margin: 0 0 2px; }
  #overlay .kit div { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  #overlay .kit b { color: var(--fg); }
  #overlay .kit i { font-style: normal; color: var(--pink); letter-spacing: 1px; }
  #overlay .kit small { flex: 1 1 220px; font-size: 11px; }
  @media (max-height: 430px) { #overlay .kit { grid-template-columns: repeat(2, 1fr); padding: 6px 10px; } #overlay .kit .kit-t { grid-column: 1 / -1; } #overlay .kit small { display: none; } }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump hop" aria-label="Scatto">SCATTO</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const WW = 1400, WH = 900;   // the arena of each chapter

  // ---------- The four places and their stories ----------
  const SETTINGS = [
    {
      id: "citta", name: "La Città", sub: "Marta, rider di pizze, deve arrivare al tetto del grattacielo", ground: "#3a3a40", line: "#5a5a60", skin: "#7aa86a", cloth: ["#5a5a8a", "#8a5a3a", "#4a6a4a"], obst: "car",
      hero: "Marta", saved: "la città è salva", fell: "è caduta",
      chapters: [
        { title: "La consegna", map: ["lastre", "#5a5752", ["auto", "panchina", "fioriera"], "scatter"], text: "Mezzanotte. Marta sta consegnando l'ultima pizza della serata quando la piazza si riempie di gente che cammina storta e ringhia. Lo scooter è a terra, il cellulare è senza linea. Dalla radio di un'auto una voce dice: «Chi è vivo vada al grattacielo Aurora, alle sei arriva un elicottero». Prima però bisogna uscire viva dalla piazza." },
        { title: "Il mercato coperto", map: ["piastrelle", "#7a6a58", ["banco"], "rows"], text: "Il mercato ha le serrande abbassate, ma una è rotta. Dentro, tra i banchi della frutta, ci sono altri che non respirano più. Marta trova una vecchia pistola da segnalazione e un giubbotto da motociclista. Fuori, l'orda la sta seguendo." },
        { title: "La metropolitana", map: ["binari", "#4a4a52", ["colonna"], "metro"], text: "Le scale mobili sono ferme e al buio. Dalla galleria arrivano passi trascinati, tanti. Il signor Bruno, il giornalaio, le grida da dietro una grata: «Corri verso la fermata Duomo, la galleria porta proprio sotto l'Aurora!»" },
        { title: "Il cantiere", map: ["terra", "#6a5034", ["impalcatura", "tubi", "cassa"], "scatter"], text: "La galleria sbuca in un cantiere a due isolati dal grattacielo. Le gru sono ferme, gli operai no: si sono svegliati tutti insieme. E c'è qualcosa di molto grosso che fa tremare le impalcature." },
        { title: "Il Gigante del Cantiere", map: ["asfalto", "#3a3a40", ["auto"], "scatter"], text: "Davanti all'ingresso dell'Aurora c'è lui: il capocantiere, alto due metri e mezzo, con il casco ancora in testa e la forza di un bulldozer. Quando abbassa la testa, carica. L'elicottero arriva tra poco: Marta deve passare." },
      ],
      ending: "Alle sei in punto l'elicottero si posa sul tetto. Marta sale per ultima, con la borsa termica ancora a tracolla. Dall'alto la città sembra tranquilla, quasi bella. «Ultima consegna della notte», dice al pilota, e gli passa la pizza. Fredda, ma intera.",
      boss: { name: "Il Gigante del Cantiere", kind: "charge", color: "#d8a02a" },
    },
    {
      id: "ospedale", name: "L'Ospedale", sub: "il dottor Elia cerca la cura nel laboratorio sotterraneo", ground: "#c8ccc4", line: "#a8aca4", skin: "#9ab8a0", cloth: ["#e8e8f0", "#7ab8c8", "#c8d8e8"], obst: "bed",
      hero: "Elia", saved: "l'ospedale è salvo", fell: "è caduto",
      chapters: [
        { title: "Il turno di notte", map: ["piastrelle", "#c8ccc4", ["letto"], "rows"], text: "Il dottor Elia sta finendo il turno al San Lazzaro quando i pazienti del reparto 4 si alzano tutti insieme. Non sono guariti. L'infermiera Rita lo chiama dal telefono interno: «Il professor Conti stava lavorando a un siero, nel laboratorio sotto la cappella. Se esiste una cura, è lì.»" },
        { title: "Il pronto soccorso", map: ["linoleum", "#a8b8b8", ["barella", "letto", "macchinario"], "scatter"], text: "Le barelle sono rovesciate e le porte a vetri si aprono e chiudono da sole. Elia raccoglie quello che trova: un defibrillatore che dà scosse fortissime, bende, un camice pulito. Le sirene fuori non smettono mai." },
        { title: "La mensa", map: ["scacchi", "#c8b898", ["tavolo"], "grid"], text: "Rita è chiusa nella cella frigorifera della mensa, con tre bambini del reparto pediatria. Elia deve tenere lontana l'orda finché non riescono a uscire dalla porta di servizio." },
        { title: "Il corridoio della radiologia", map: ["linoleum", "#8aa0a8", ["macchinario"], "scatter"], text: "Il corridoio che porta alla cappella è lungo e pieno. Le macchine dei raggi X ronzano ancora. Dalle scale che scendono al laboratorio arriva una voce gentile che chiama per nome: «Elia... vieni pure, ti stavo aspettando.»" },
        { title: "Il Primario", map: ["piastrelle", "#5a6a6a", ["bancone", "scaffale", "macchinario"], "scatter"], text: "Nel laboratorio c'è il professor Conti, il primario. O quello che ne resta: ha provato il siero su sé stesso. Sputa veleno e chiama a sé i pazienti. Dietro di lui, nel frigorifero, le fiale della cura brillano di verde." },
      ],
      ending: "Le fiale sono dodici. Rita le conta due volte, poi sorride per la prima volta in tutta la notte. All'alba i bambini dormono sulle barelle del furgone, e Elia guida verso la città con la radio accesa: «Qui San Lazzaro. Abbiamo la cura. Ripeto: abbiamo la cura.»",
      boss: { name: "Il Primario", kind: "spit", color: "#6ad87a" },
    },
    {
      id: "lunapark", name: "Il Luna Park", sub: "il piccolo Teo deve riaccendere le luci per guidare i soccorsi", ground: "#2a4a2a", line: "#3a5a3a", skin: "#a8b878", cloth: ["#d83a5a", "#3a8ad8", "#e8c83a"], obst: "stall",
      hero: "Teo", saved: "il luna park è salvo", fell: "è caduto",
      chapters: [
        { title: "Chiusura", map: ["erba", "#2a4a2a", ["bancarella"], "scatter"], text: "Teo ha dodici anni e il papà fa il custode del luna park. Questa sera sono rimasti soli a chiudere, ma i visitatori non se ne sono andati: girano tra le giostre spente, con lo zucchero filato ancora in mano e gli occhi bianchi. Il papà è rimasto chiuso nella cabina della ruota panoramica." },
        { title: "Il tiro a segno", map: ["terra", "#7a6040", ["bancarella", "barile"], "scatter"], text: "Al tiro a segno ci sono fucili a tappi e premi enormi. Teo scopre che i tappi, sparati bene, fanno male anche agli zombie. Il generatore delle luci è dall'altra parte del parco, vicino al trenino fantasma." },
        { title: "Le montagne russe", map: ["erba", "#2e4e2a", ["pilone"], "grid"], text: "Sotto le montagne russe è tutto buio e i carrelli si muovono da soli quando qualcuno ci urta. Dalla ruota panoramica il papà gli fa segno con la torcia: tre lampi, «sto bene, vai avanti»." },
        { title: "Il trenino fantasma", map: ["binari", "#2a1e34", ["colonna"], "metro"], text: "Il generatore è dentro il trenino fantasma, tra scheletri finti e zombie veri. Basta abbassare la leva per riaccendere tutto: così i soccorsi vedranno il parco da chilometri. Ma qualcuno, nel tendone del circo, ride." },
        { title: "Bubu il Clown", map: ["circo", "#a8885a", ["barile", "sgabello"], "scatter"], text: "Bubu faceva gli spettacoli per i bambini. Adesso salta da tutte le parti come una palla impazzita e chiama a sé i suoi amici. Tra lui e la leva del generatore c'è solo Teo." },
      ],
      ending: "Teo tira giù la leva e il luna park esplode di luci: la ruota gira, la musica riparte, il carosello si illumina. Dal cielo rispondono i fari di due elicotteri. Il papà scende dalla ruota e lo abbraccia così forte che a Teo cade il fucile a tappi. «Il custode sei tu, adesso», gli dice.",
      boss: { name: "Bubu il Clown", kind: "bounce", color: "#ff5a8a" },
    },
    {
      id: "porto", name: "Il Porto", sub: "la capitana Nadia deve portare la nave fuori dal porto", ground: "#6a5a48", line: "#7a6a58", skin: "#7a9a9a", cloth: ["#2a4a6a", "#e8a03a", "#5a5a5a"], obst: "crate",
      hero: "Nadia", saved: "il porto è salvo", fell: "è caduta",
      chapters: [
        { title: "La nebbia", map: ["assi", "#6a5a48", ["cassa", "bitta"], "scatter"], text: "La capitana Nadia è attraccata con la sua nave da carico, la Gabbiano, quando la nebbia sale dal mare. Dentro la nebbia ci sono i marinai del peschereccio accanto, e non sono più marinai. Il suo equipaggio è già a bordo: manca solo lei, e la nave non parte senza capitana." },
        { title: "I container", map: ["cemento", "#6a6a6a", ["container"], "rows"], text: "Il molo è un labirinto di container colorati. Nadia trova un lanciarazzi di segnalazione e una cassa di bottiglie di rum, che con uno straccio acceso diventano molto utili. La Gabbiano suona la sirena: è dall'altra parte del bacino." },
        { title: "La gru", map: ["cemento", "#5e5e60", ["container", "bitta", "cassa"], "scatter"], text: "Il ponte mobile è alzato: per abbassarlo bisogna arrivare alla cabina della gru. Gli scaricatori del turno di notte la circondano, e la nebbia ne porta sempre di più." },
        { title: "Il faro", map: ["roccia", "#4a4a46", ["scoglio"], "scatter"], text: "Il ponte è giù, ma la nebbia è troppo fitta per uscire dal porto senza il faro. Il guardiano non risponde. Nadia sale al faro con l'orda alle spalle, e dal mare arriva un rumore di catene." },
        { title: "Il Capitano Abissale", map: ["assi", "#5a4a3a", ["cassa", "barile"], "scatter"], text: "Dal fondo del bacino è risalito il capitano del peschereccio, con l'ancora ancora legata al polso. La fa roteare intorno a sé come una falce. Il faro è acceso, la Gabbiano aspetta: è l'ultimo passo." },
      ],
      ending: "La Gabbiano esce dal porto con il faro alle spalle e la nebbia che si apre davanti come una tenda. Il nostromo porta a Nadia un caffè bollente. «Dove andiamo, capitana?» Lei guarda il mare, finalmente vuoto. «Dove c'è il sole», risponde.",
      boss: { name: "Il Capitano Abissale", kind: "anchor", color: "#3a8ab8" },
    },
    {
      id: "scuola", name: "La Scuola", sub: "Giulia deve portare i compagni fino al pullman della gita", skin: "#9ab878", cloth: ["#3a5ab8", "#c83a3a", "#e8e8e8"], shirt: "#3a8ad8", hair: "#2a1a10",
      hero: "Giulia", saved: "la scuola è salva", fell: "è caduta",
      chapters: [
        { title: "La notte bianca", map: ["parquet", "#8a6a4a", ["banchetto"], "grid"], text: "È la notte bianca della scuola: film in aula magna, pizza e sacchi a pelo in palestra. Giulia è andata a prendere i giochi da tavolo in terza B quando sente le urla. I professori camminano per i corridoi con le braccia tese, e non per fare l'appello. Il pullman della gita di domani è già parcheggiato nel cortile: è l'unica via d'uscita." },
        { title: "Il corridoio degli armadietti", map: ["linoleum", "#5a7a98", ["armadietto", "panchina"], "edges"], text: "Gli armadietti sbattono da soli e il corridoio è pieno di gente che Giulia conosce bene: il prof di ginnastica, la segretaria, il ragazzo di quinta che fa sempre lo spiritoso. Nell'armadietto di Marco trova un estintore e una mazza da baseball. Dalla palestra, qualcuno chiama aiuto." },
        { title: "La palestra", map: ["palestra", "#b8884a", ["materassino", "sgabello"], "scatter"], text: "I compagni di classe sono saliti sulle spalliere, e sotto di loro c'è mezza scuola che ringhia. Giulia deve tenere lontana l'orda abbastanza a lungo da farli scendere e scappare dalla porta di sicurezza. Un pallone da basket rotola da solo sul parquet." },
        { title: "Il laboratorio di chimica", map: ["piastrelle", "#6a7a6a", ["bancone"], "rows"], text: "Le chiavi del pullman sono nella borsa della professoressa Bianchi, e la professoressa Bianchi è nel laboratorio di chimica. Non è più lei, ma la borsa ce l'ha ancora a tracolla. Tra provette e becchi Bunsen, ogni passo è pericoloso." },
        { title: "Il Bidello", map: ["cortile", "#4a4a50", ["albero", "panchina"], "scatter"], text: "Nel cortile, davanti al pullman, c'è il bidello: grande come un armadio, con il carrello delle pulizie che spinge a tutta velocità. Ha chiuso la scuola ogni sera per trent'anni, e stanotte non vuole far uscire nessuno. Giulia ha le chiavi in mano: deve solo passare." },
      ],
      ending: "Il motore del pullman tossisce, poi parte. Giulia non ha la patente, ma il signor Franco sì: l'autista della gita, che dormiva sul pullman e si sveglia con venti ragazzi che gli urlano «Parti!». Mentre il cancello si chiude alle loro spalle, qualcuno dal fondo chiede: «Ma domani la verifica c'è lo stesso?»",
      boss: { name: "Il Bidello", kind: "triple", color: "#5a7ac8" },
    },
    {
      id: "montagna", name: "La Montagna", sub: "il maestro di sci Luca deve portare tutti alla diga, dove arriva l'elicottero", skin: "#a8c0c8", cloth: ["#d83a3a", "#3a7ad8", "#2a2a2a"], shirt: "#d83a3a", hair: "#c8a050",
      hero: "Luca", saved: "la montagna è salva", fell: "è caduto",
      chapters: [
        { title: "L'ultima discesa", map: ["neve", "#e8eef4", ["abete", "roccia"], "scatter"], text: "L'ultima discesa della giornata, il sole che tramonta sulle cime, e una fila di sciatori fermi in mezzo alla pista. Fermi, finché Luca non si avvicina: allora si girano tutti insieme. La radio del soccorso alpino gracchia: «Elicottero alla diga del Lago Bianco, alle sette. Chi può ci arrivi.»" },
        { title: "La seggiovia", map: ["neve", "#dfe8f0", ["pilone", "abete"], "grid"], text: "La seggiovia è ferma e i seggiolini dondolano vuoti nel vento. Alla stazione di partenza gli addetti agli impianti hanno ancora la giacca rossa, e gli occhi bianchi. Luca trova un razzo di segnalazione e un paio di ramponi: la salita sarà lunga." },
        { title: "Il rifugio", map: ["parquet", "#6a4a2a", ["tavolo", "panchina"], "grid"], text: "Il rifugio Stella Alpina ha le luci accese e il camino che fuma. Dentro ci sono la signora Ida e i suoi nipoti, barricati in cucina. Fuori, la tormenta porta sempre più ombre che camminano nella neve." },
        { title: "Il bosco di abeti", map: ["neve", "#d8e2ea", ["abete"], "dense"], text: "Il sentiero per la diga attraversa il bosco, e tra gli alberi la neve è alta fino alle ginocchia. Si sentono passi pesanti, e un ruggito che non è di nessun animale conosciuto. I nipoti di Ida si tengono per mano." },
        { title: "Lo Yeti", map: ["ghiaccio", "#a8c8e0", ["roccia"], "scatter"], text: "Sulla diga ghiacciata li aspetta lui: alto tre metri, coperto di pelo bianco e brina, con gli occhi rossi. Nessuno ci credeva, allo Yeti. Adesso è uno zombie, e lancia blocchi di ghiaccio come fossero palle di neve. L'elicottero è già in cielo." },
      ],
      ending: "L'elicottero si posa sulla diga sollevando un turbine di neve. Ida sale per prima, con i nipoti stretti sotto il mantello; Luca per ultimo, gli sci ancora in spalla. Mentre si alzano vede le orme enormi dello Yeti sparire nel bosco. «L'anno prossimo», dice al pilota, «insegno a fare surf. Al mare.»",
      boss: { name: "Lo Yeti", kind: "throw", color: "#e8f0f8" },

    ctx.fillStyle = "#8aff3a"; ctx.fillRect(0, H - 5, W * clamp(xp / xpNeed, 0, 1), 5);
    // the kit
    let ix = 8;
    ctx.font = "13px system-ui"; ctx.textAlign = "left";
    for (const k in weapons) { ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(ix, H - 26, 30, 18); ctx.fillStyle = "#ffffff"; ctx.fillText(WEAPONS[k].icon, ix + 2, H - 12); ctx.font = "900 8px system-ui"; ctx.fillText(String(weapons[k]), ix + 22, H - 12); ctx.font = "13px system-ui"; ix += 33; }
    ix += 6;
    for (const k in passives) { ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(ix, H - 24, 26, 15); ctx.fillStyle = "#ffffff"; ctx.font = "10px system-ui"; ctx.fillText(PASSIVES[k].icon, ix + 2, H - 12); ctx.font = "900 7px system-ui"; ctx.fillText(String(passives[k]), ix + 19, H - 12); ix += 28; }
    // the boss bar
    if (boss) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(W / 2 - 150, TOP + 8, 300, 14);
      ctx.fillStyle = boss.color; ctx.fillRect(W / 2 - 150, TOP + 8, 300 * boss.hp / boss.maxHp, 14);
      ctx.fillStyle = "#ffffff"; ctx.font = "900 9px system-ui"; ctx.textAlign = "center"; ctx.fillText(boss.name.toUpperCase(), W / 2, TOP + 18);
    }
  }
  function drawCards() {
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; outlined("LIVELLO " + level + "!", W / 2, 70, "italic 900 26px system-ui", "#8aff3a", 6);
    ctx.fillStyle = "#d0e8c0"; ctx.font = "700 11px system-ui"; ctx.fillText("scegli un potenziamento", W / 2, 88);
    cards.forEach((c, i) => {
      const r = cardRect(i), on = i === cardSel;
      ctx.fillStyle = on ? "#1e2e14" : "#141a10"; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
      ctx.strokeStyle = on ? "#8aff3a" : "rgba(255,255,255,0.25)"; ctx.lineWidth = on ? 3 : 1.5; ctx.stroke();
      const def = c.kind === "w" ? WEAPONS[c.k] : c.kind === "p" ? PASSIVES[c.k] : { name: "Cura", icon: "❤️", desc: "recuperi 40 di salute" };
      ctx.font = "34px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(def.icon, r.x + r.w / 2, r.y + 46);
      ctx.font = "900 13px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(def.name, r.x + r.w / 2, r.y + 76);
      ctx.font = "800 10px system-ui"; ctx.fillStyle = c.kind === "w" && c.lv === 1 ? "#ffd23a" : "#8aff3a";
      ctx.fillText(c.kind === "w" ? (c.lv === 1 ? "ARMA NUOVA" : `LIVELLO ${c.lv}`) : c.kind === "p" ? `LIVELLO ${c.lv}` : "", r.x + r.w / 2, r.y + 94);
      ctx.font = "600 10px system-ui"; ctx.fillStyle = "#d0d8c8";
      wrap(c.kind === "w" ? def.desc[c.lv - 1] : def.desc, r.x + r.w / 2, r.y + 116, r.w - 20, 13);
    });
    ctx.fillStyle = "#d0e8c0"; ctx.font = "700 10px system-ui"; ctx.fillText(touchMode ? "tocca una carta" : "◀ ▶ per scegliere · SPAZIO per prendere", W / 2, 290);
  }
  function drawStory() {
    const s = S(), end = storyKind === "ending";
    ctx.fillStyle = "rgba(4,6,4,0.92)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    outlined(s.name.toUpperCase(), W / 2, 50, "900 12px system-ui", "#8aff3a", 3);
    outlined(end ? "EPILOGO" : `CAPITOLO ${wave + 1} · ${s.chapters[wave].title.toUpperCase()}`, W / 2, 80, "italic 900 22px system-ui", "#ffffff", 5);
    ctx.fillStyle = "#e0e8d8"; ctx.font = "500 13px system-ui"; ctx.textAlign = "left";
    wrap(end ? s.ending : s.chapters[wave].text, 70, 118, W - 140, 19);
    ctx.textAlign = "center";
    if (storyReady <= 0) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 5); outlined(touchMode ? "tocca per continuare" : "SPAZIO per continuare", W / 2, 320, "900 12px system-ui", "#8aff3a", 3); ctx.globalAlpha = 1; }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!obstacles.length) { obstacles = makeObstacles(); camX = WW / 2 - W / 2; camY = WH / 2 - H / 2; for (let i = 0; i < 40; i++) spawnZombie(pickType()); }
    drawGround();
    drawEffects();
    drawObstacles();
    const list = [...zombies].sort((a, b) => a.y - b.y);
    for (const z of list) drawZombie(z);
    if (boss) drawBoss();
    if (state !== "menu") drawPlayer();
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); ctx.textAlign = "center"; outlined(p.text, p.world ? wx(p.x) : p.x, p.world ? wy(p.y) : p.y, "900 11px system-ui", p.col, 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    if (phase === "story") { drawStory(); return; }
    // the night: darker away from the player
    const px = wx(P.x), py = wy(P.y), dk = ctx.createRadialGradient(px, py, 70, px, py, 340);
    dk.addColorStop(0, "rgba(0,0,10,0)"); dk.addColorStop(1, "rgba(0,0,10,0.62)");
    ctx.fillStyle = dk; ctx.fillRect(0, 0, W, H);
    // where the boss is, when it is off the screen
    if (boss) {
      const bx = wx(boss.x), by = wy(boss.y);
      if (bx < 0 || bx > W || by < TOP || by > H) {
        const a = Math.atan2(by - py, bx - px), ex = clamp(px + Math.cos(a) * 400, 20, W - 20), ey = clamp(py + Math.sin(a) * 400, TOP + 30, H - 30);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = boss.color; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 8);
        ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -9); ctx.lineTo(-6, 9); ctx.fill(); ctx.restore(); ctx.globalAlpha = 1;
      }
    }
    drawHud();
    ctx.textAlign = "center";
    if (message && phase !== "levelup" && phase !== "map") {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2.4) - message.t) * 2);
      outlined(message.text, W / 2, 84, "italic 900 22px system-ui", "#8aff3a", 6);
      if (message.sub) outlined(message.sub, W / 2, 104, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
    if (phase === "fight" || phase === "cleared") drawMap(miniRect(), false);
    if (phase === "levelup") drawCards();
    if (phase === "map") drawBigMap();
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="orda-best-" data-kind="score"></script>

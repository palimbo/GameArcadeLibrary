<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fenice Spaziale</title>
<style>
  :root {
    --bg: #0c0818;
    --fg: #f4f6ee;
    --muted: #a8b4a8;
    --pink: #ff6a3a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: left/right moves the ship, down raises the shield; FUOCO fires (hold it for a burst) */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 106, 58, 0.6); background: radial-gradient(circle, rgba(255,106,58,0.14), rgba(255,106,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 106, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 210, 58, 0.9); background: rgba(255, 210, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 210, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(12, 8, 24, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a1a0a, 0 0 22px rgba(255,106,58,0.4); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0a04; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8401a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TAU = Math.PI * 2;
  const PY = 540, SPEED = 170, SHOT_V = 520, SHIELD_T = 1.3, TOP = 40;
  const WAVES = [
    { kind: "small", name: "Lo stormo", color: "#ff7ac8", wing: "#7ad0ff" },
    { kind: "small", name: "Lo stormo rosso", color: "#ff5a3a", wing: "#ffd23a", fast: true },
    { kind: "big", name: "Le fenici", color: "#ff8a2a", wing: "#ffd23a" },
    { kind: "big", name: "Le fenici blu", color: "#4a9aff", wing: "#9ae0ff", fast: true },
    { kind: "mother", name: "L'astronave madre", color: "#9a5aff", wing: "#ff5ab8" },
  ];
  const COLS = 26, CELL = 10;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 navi · nemici lenti che sparano poco · scudo rapido", lives: 5, fire: 0.6, dive: 0.7, speed: 0.85, recharge: 3 },
    normale:   { label: "NORMALE",   color: "#ff6a3a", desc: "3 navi", lives: 3, fire: 1, dive: 1, speed: 1, recharge: 4 },
    difficile: { label: "DIFFICILE", color: "#ff3a6a", desc: "3 navi · nemici svelti e aggressivi · scudo lento a ricaricarsi", lives: 3, fire: 1.15, dive: 1.15, speed: 1.07, recharge: 5 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "fenice-difficulty";
  const bestKey = (id) => `fenice-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => beep(1400, 0.06, "square", 0.022, -900)),
    enemy: lim(() => beep(260, 0.07, "square", 0.018, -100)),
    pop: lim(() => { noise(0.18, 0.12, 900); beep(500, 0.1, "square", 0.03, -300); }),
    wing: lim(() => { noise(0.06, 0.08, 1500); }),
    chip: lim(() => beep(180, 0.04, "square", 0.02)),
    big: lim(() => { noise(0.4, 0.18, 400); arp([392, 523, 659], 0.05, 0.1, "square", 0.035); }),
    dive: lim(() => beep(900, 0.4, "triangle", 0.025, -600)),
    shield: lim(() => beep(300, 0.5, "sine", 0.05, 500)),
    mother: () => { noise(1.2, 0.25, 250); arp([523, 659, 784, 1047, 1319, 1568], 0.08, 0.16, "square", 0.045); },
    crash: () => { noise(0.8, 0.22, 250); beep(160, 0.6, "sawtooth", 0.05, -100); },
    wave: () => arp([392, 523, 659, 784], 0.1, 0.14),
    life: () => arp([523, 659, 784, 1047, 1319], 0.07, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, bestCache = 0, nextLife = 10000, waveN = 0, loop = 0;
  let P = null, shots = [], bombs = [], birds = [], mother = null, parts = [], popups = [], message = null, diveT = 0, fireCool = 0;
  let firing = false, shieldPressed = false;
  const keys = { left: false, right: false, down: false, fire: false };
  const stick = { x: 0, y: 0 };
  const stars = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * H, Math.random()]);

  const wave = () => WAVES[waveN];
  const lv = () => Math.min(loop, 4);
  const pace = () => diff.speed * (1 + lv() * 0.1) * (wave().fast ? 1.15 : 1);

  // ---------- Waves ----------
  function smallBird(x, y) { return { kind: "small", x, y, hx: x, hy: y, st: "form", t: rnd(0, 6), fireT: rnd(1, 3), vx: 0, vy: 0 }; }
  function buildWave() {
    birds = []; mother = null; bombs = []; shots = [];
    const w = wave();
    if (w.kind === "small") {
      for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) birds.push(smallBird(60 + c * 48 + (r % 2) * 16, 90 + r * 36));
    } else if (w.kind === "big") {
      for (let i = 0; i < 8; i++) {
        const b = { kind: "big", x: 40 + (i % 4) * 90, y: -40 - Math.floor(i / 4) * 70, st: "enter", t: rnd(0, 6), ph: rnd(0, TAU), fireT: rnd(1.5, 3.5), wings: [[1, 1, 1], [1, 1, 1]], regrow: [[0, 0, 0], [0, 0, 0]] };
        b.cx = b.x; b.cy = 110 + Math.floor(i / 4) * 80; birds.push(b);
      }
    } else {
      // the mothership: a hull to chip away, a turning belt, and the pilot on top
      const hull = [];
      for (let r = 0; r < 3; r++) { const a = [r * 2, r * 2 + 1, r * 3 + 2][r], row = []; for (let c = 0; c < COLS; c++) row.push(c >= a && c < COLS - a ? 1 : 0); hull.push(row); }
      mother = { x: W / 2, y: 50, hull, belt: Array(COLS).fill(1), beltT: 0, fireT: 2, dead: false };
      for (let i = 0; i < 4; i++) { const b = smallBird(60 + i * 80, 200); b.escort = true; birds.push(b); }
    }
    diveT = 2;
  }
  function beginWave() {
    buildWave();
    P = P || { x: W / 2 };
    P.x = W / 2; P.alive = true; P.shield = 0; P.charge = P.charge === undefined ? 1 : P.charge; P.safe = 1.5;
    message = { text: loop ? `${wave().name.toUpperCase()} · GIRO ${loop + 1}` : wave().name.toUpperCase(), sub: wave().kind === "mother" ? "sfonda lo scafo e il nastro, colpisci il pilota!" : wave().kind === "big" ? "colpisci il corpo: le ali ricrescono!" : "attenti alle picchiate!", t: 0 };
    state = "intro"; stateT = 1.6;
    sfx.wave();
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; nextLife = 10000; waveN = 0; loop = 0; P = null;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginWave();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f4f6ee") {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 10000; sfx.life(); popups.push({ x: W / 2, y: 140, text: "NAVE EXTRA!", color: "#ffd23a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 14, sp = 120, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function hitPlayer(why) {
    if (!P.alive || P.shield > 0 || P.safe > 0) return false;
    P.alive = false; P.why = why;
    burst(P.x, PY, "#ff6a3a", 26, 150, 0.9); burst(P.x, PY, "#ffffff", 12, 90, 0.6);
    sfx.crash();
    lives--;
    state = "dead"; stateT = 1.8;
    return true;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "NAVI FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ondata ${loop * WAVES.length + waveN + 1} · ${diff.label}</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>FENICE SPAZIALE</h1>
       <p>Stormi di uccelli alieni scendono in picchiata, le grandi fenici sbattono ali che ricrescono, e alla fine arriva l'astronave madre col suo pilota. Spara, schiva e, quando serve, alza lo scudo!</p>
       <div class="pts">
         <span><b>Uccellino</b></span><span>20 in formazione · 80 in picchiata</span>
         <span><b>Fenice</b></span><span>colpisci il corpo: 100–800, più vale quanto più è vicina</span>
         <span><b>Astronave madre</b></span><span>sfonda lo scafo e il nastro viola, colpisci il pilota: fino a 8.000</span>
         <span><b>Scudo</b></span><span>per un attimo ti protegge da tutto (ma resti fermo), poi si ricarica</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta: destra e sinistra per muoverti, giù per lo scudo · tieni premuto FUOCO per sparare</p>`
         : `<p class="muted help">← → muoviti · ↓ scudo · SPAZIO spara (tienilo premuto) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>AL COMBATTIMENTO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowdown: "down", s: "down", " ": "fire", j: "fire", z: "fire" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KEYMAP[k] === "down" && !e.repeat) shieldPressed = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; firing = false; if (isPlaying()) togglePause(); });
  const fireBtn = touchEl.querySelector(".jump");
  fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); firing = true; fireBtn.classList.add("on"); try { fireBtn.setPointerCapture(e.pointerId); } catch { /* ignore */ } });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, () => { firing = false; fireBtn.classList.remove("on"); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null, stickDown = false;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.15 ? 0 : sign(v) * Math.min(1, (a - 0.15) / 0.7); };
    stick.x = f(dx); stick.y = f(dy);
    // pulling the stick down raises the shield
    const down = stick.y > 0.65 && Math.abs(stick.x) < 0.6;
    if (down && !stickDown) shieldPressed = true;
    stickDown = down;
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; stickDown = false; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function updatePlayer(dt) {
    P.safe = Math.max(0, P.safe - dt);
    if (shieldPressed) { shieldPressed = false; if (P.charge >= 1 && P.shield <= 0) { P.shield = SHIELD_T; P.charge = 0; sfx.shield(); } }
    if (P.shield > 0) P.shield -= dt; else P.charge = Math.min(1, P.charge + dt / diff.recharge);
    // behind the shield the ship cannot move
    if (P.shield <= 0) { const ax = clamp(stick.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), -1, 1); P.x = clamp(P.x + ax * SPEED * dt, 14, W - 14); P.tilt = ax; }
    fireCool -= dt;
    if ((firing || keys.fire) && fireCool <= 0 && shots.length < 2 && P.shield <= 0) { shots.push({ x: P.x, y: PY - 14 }); fireCool = 0.18; sfx.shot(); }
  }
  function enemyFire(x, y, aim) {
    const v = 170 * (0.85 + 0.15 * pace());
    const vx = aim ? clamp((P.x - x) * 0.5, -60, 60) : 0;
    bombs.push({ x, y, vx, vy: v }); sfx.enemy();
  }
  function wingRects(b) {
    const flap = Math.sin(b.t * 7) * 6, out = [];
    for (let s = 0; s < 2; s++) for (let i = 0; i < 3; i++) {
      const dir = s ? 1 : -1;
      out.push({ s, i, x: b.x + dir * (13 + i * 10), y: b.y - 2 + flap * (i + 1) / 3 - i * 2, w: 10, h: 8 });
    }
    return out;
  }
  function updateBirds(dt) {
    const p = pace();
    // one bird at a time peels off and dives at the ship
    diveT -= dt;
    const diving = birds.filter((b) => b.st === "dive").length;
    if (diveT <= 0 && state === "play") {
      diveT = rnd(0.9, 1.8) / (diff.dive * (1 + lv() * 0.12));
      const idle = birds.filter((b) => b.st === "form" || b.st === "hover");
      if (idle.length && diving < 2 + Math.floor(lv() / 2) + (wave().fast ? 1 : 0)) { const b = idle[Math.floor(Math.random() * idle.length)]; b.st = "dive"; b.dt = 0; b.dx = P.x; sfx.dive(); }
    }
    for (const b of birds) {
      b.t += dt;
      if (b.kind === "small") {
        if (b.st === "form") {
          const sway = b.escort ? Math.sin(b.t * 0.8) * 120 : Math.sin(clock * 0.9) * 26;
          b.x += (b.hx + sway - b.x) * Math.min(1, dt * 4); b.y += (b.hy + Math.sin(b.t * 2) * 4 - b.y) * Math.min(1, dt * 4);
          if (b.escort && mother) b.hy = mother.y + 110;
        } else if (b.st === "dive") {
          // a weaving dive at where the ship was
          b.dt += dt;
          const vy = 150 * p, vx = clamp((b.dx - b.x) * 1.4, -110, 110) + Math.sin(b.dt * 5) * 60;
          b.x += vx * dt; b.y += vy * dt;
          if (b.dt > 0.5 && b.dt < 0.55) b.dx = P.x;
          b.fireT -= dt; if (b.fireT <= 0 && b.y < PY - 120) { b.fireT = rnd(0.8, 1.6) / diff.fire; enemyFire(b.x, b.y + 6, true); }
          if (b.y > H + 20) { b.y = -20; b.st = "back"; }
        } else if (b.st === "back") {
          b.x += (b.hx - b.x) * Math.min(1, dt * 2); b.y += (b.hy - b.y) * Math.min(1, dt * 2);
          if (Math.abs(b.y - b.hy) < 4) b.st = "form";
        }
        if (b.st === "form") { b.fireT -= dt; if (b.fireT <= 0) { b.fireT = rnd(2.5, 5) / diff.fire; if (Math.random() < 0.5) enemyFire(b.x, b.y + 6, false); } }
      } else {
        // the phoenixes glide about, and now and then swoop low
        if (b.st === "enter") { b.y += 80 * dt; if (b.y >= b.cy) b.st = "hover"; }
        else if (b.st === "hover") { b.x = clamp(b.cx + Math.sin(b.t * 0.7 * p + b.ph) * 70, 40, W - 40); b.y = b.cy + Math.sin(b.t * 1.1 * p + b.ph) * 30; }
        else if (b.st === "dive") {
          b.dt += dt;
          const k = Math.min(1, b.dt / 2.4), yy = b.cy + Math.sin(k * Math.PI) * (PY - 90 - b.cy);
          b.x += clamp((b.dx - b.x) * 1.2, -90, 90) * dt; b.y = yy;
          if (k >= 1) { b.st = "hover"; b.cx = clamp(b.x, 60, W - 60); b.t = 0; b.ph = 0; }
        }
        b.fireT -= dt; if (b.fireT <= 0 && b.st !== "enter") { b.fireT = rnd(1.5, 3) / diff.fire; enemyFire(b.x, b.y + 10, b.st === "dive"); }
        for (let s = 0; s < 2; s++) for (let i = 0; i < 3; i++) if (!b.wings[s][i]) { b.regrow[s][i] -= dt; if (b.regrow[s][i] <= 0) b.wings[s][i] = 1; }
      }
      // touching the ship
      if (P.alive && Math.abs(b.x - P.x) < (b.kind === "big" ? 16 : 13) && Math.abs(b.y - PY) < 12) {
        if (P.shield > 0) { killBird(b, true); } else if (P.safe <= 0) { b.dead = true; burst(b.x, b.y, wave().color, 10, 100, 0.5); hitPlayer("bird"); }
      }
    }
    birds = birds.filter((b) => !b.dead);
  }
  function killBird(b, byShield) {
    b.dead = true;
    let pts;
    if (b.kind === "small") pts = b.st === "form" ? 20 : 80;
    else pts = b.st === "dive" ? 800 : b.y > 260 ? 500 : b.y > 170 ? 200 : 100;
    addScore(pts, b.x, b.y - 14, b.kind === "big" ? "#ffd23a" : "#f4f6ee");
    burst(b.x, b.y, wave().color, b.kind === "big" ? 22 : 12, 130, 0.6); burst(b.x, b.y, wave().wing, 8, 90, 0.5);
    (b.kind === "big" ? sfx.big : sfx.pop)();
  }
  function updateMother(dt) {
    if (!mother || mother.dead) return;
    const m = mother;
    const bottom = m.y + 74;
    if (bottom < 420) m.y += 5 * diff.speed * (1 + lv() * 0.1) * dt;
    m.beltT += dt;
    if (m.beltT > 0.22) { m.beltT = 0; m.belt.push(m.belt.shift()); }
    m.fireT -= dt;
    if (m.fireT <= 0 && state === "play") { m.fireT = rnd(0.7, 1.4) / diff.fire; const c = Math.floor(rnd(4, COLS - 4)); enemyFire(m.x - COLS * CELL / 2 + (c + 0.5) * CELL, bottom, Math.random() < 0.4); }
    // the escort comes back when it is gone
    if (birds.length < 2 && Math.random() < dt * 0.3) { const b = smallBird(rnd(40, W - 40), -20); b.escort = true; b.hy = m.y + 110; b.st = "back"; birds.push(b); }
  }
  function updateShots(dt) {
    for (const s of shots) {
      s.y -= SHOT_V * dt;
      if (s.y < TOP) { s.gone = true; continue; }
      for (const b of birds) {
        if (b.dead) continue;
        if (b.kind === "small") { if (Math.abs(s.x - b.x) < 11 && Math.abs(s.y - b.y) < 9) { killBird(b); s.gone = true; break; } continue; }
        // the body kills a phoenix; a wing just loses a feather or two
        if (Math.abs(s.x - b.x) < 8 && Math.abs(s.y - b.y) < 10) { killBird(b); s.gone = true; break; }
        for (const r of wingRects(b)) if (b.wings[r.s][r.i] && Math.abs(s.x - r.x) < r.w / 2 + 1 && Math.abs(s.y - r.y) < r.h / 2 + 2) { b.wings[r.s][r.i] = 0; b.regrow[r.s][r.i] = 2.5; s.gone = true; sfx.wing(); burst(r.x, r.y, wave().wing, 5, 70, 0.4); break; }
        if (s.gone) break;
      }
      if (s.gone || !mother || mother.dead) continue;
      const m = mother, x0 = m.x - COLS * CELL / 2, c = Math.floor((s.x - x0) / CELL);
      if (c < 0 || c >= COLS) continue;
      // from below: the hull rows, then the belt, then the pilot
      for (let r = 2; r >= 0; r--) { const cy = m.y + 44 + r * CELL; if (m.hull[r][c] && s.y < cy + CELL && s.y > cy - 4) { m.hull[r][c] = 0; s.gone = true; addScore(10); burst(x0 + (c + 0.5) * CELL, cy + 5, "#c8a0ff", 4, 60, 0.3); sfx.chip(); break; } }
      if (s.gone) continue;
      if (m.belt[c] && s.y < m.y + 44 && s.y > m.y + 32) { m.belt[c] = 0; s.gone = true; addScore(10); burst(x0 + (c + 0.5) * CELL, m.y + 40, "#ff5ab8", 4, 60, 0.3); sfx.chip(); continue; }
      if (Math.abs(s.x - m.x) < 11 && s.y < m.y + 36 && s.y > m.y + 16) {
        s.gone = true; m.dead = true;
        const pts = [2000, 4000, 6000, 8000][Math.floor(Math.random() * 4)];
        addScore(pts, m.x, m.y + 10, "#ffd23a");
        for (let i = 0; i < 6; i++) burst(m.x + rnd(-120, 120), m.y + rnd(10, 70), i % 2 ? "#9a5aff" : "#ffd23a", 16, 160, 1);
        sfx.mother();
        for (const b of birds) b.dead = true;
      }
    }
    shots = shots.filter((s) => !s.gone);
  }
  function updateBombs(dt) {
    for (const b of bombs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 10) { b.gone = true; continue; }
      if (P.alive && Math.abs(b.x - P.x) < (P.shield > 0 ? 18 : 7) && Math.abs(b.y - PY) < (P.shield > 0 ? 18 : 9)) {
        b.gone = true;
        if (P.shield > 0) burst(b.x, b.y, "#7af0ff", 5, 60, 0.3); else hitPlayer("bomb");
      }
    }
    bombs = bombs.filter((b) => !b.gone);
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    for (const s of stars) { s[1] += (20 + s[2] * 50) * dt; if (s[1] > H) { s[1] = TOP; s[0] = Math.random() * W; } }
    if (message) { message.t += dt; if (message.t > 2.2) message = null; }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (state === "menu") { if (birds.length) for (const b of birds) { b.t += dt; if (b.kind === "small") { b.x = b.hx + Math.sin(clock * 0.9) * 26; b.y = b.hy + Math.sin(b.t * 2) * 4; } } return; }
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; if (stateT <= 0) state = "play"; }
    if (state === "dead") {
      stateT -= dt; updateBirds(dt); updateBombs(dt);
      if (stateT <= 0) {
        if (lives <= 0) { gameOver(); return; }
        // divers go home, and the ship comes back with a moment's grace
        for (const b of birds) if (b.st === "dive") { b.st = b.kind === "small" ? "back" : "hover"; }
        bombs = []; P.alive = true; P.x = W / 2; P.safe = 2; P.shield = 0; state = "play";
      }
      return;
    }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) { waveN++; if (waveN >= WAVES.length) { waveN = 0; loop++; } beginWave(); } return; }
    if (window.__bot) window.__bot(dt);
    updatePlayer(dt);
    updateBirds(dt);
    updateMother(dt);
    updateShots(dt);
    updateBombs(dt);
    if (state !== "play" && state !== "intro") return;
    const done = wave().kind === "mother" ? mother.dead : birds.length === 0;
    if (done && state === "play") {
      message = { text: "ONDATA SUPERATA!", sub: wave().kind === "mother" ? "l'astronave madre è distrutta!" : "", t: 0 };
      state = "clear"; stateT = wave().kind === "mother" ? 3 : 1.8;
    }
  }

  // ---------- Drawing ----------
  function drawSmall(b) {
    const w = wave(), f = Math.sin(b.t * 12 + b.x) > 0, dive = b.st === "dive";
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.fillStyle = w.wing;
    if (f) { ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-12, -8); ctx.lineTo(-10, 2); ctx.moveTo(2, 0); ctx.lineTo(12, -8); ctx.lineTo(10, 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-12, 7); ctx.lineTo(-8, -2); ctx.moveTo(2, 0); ctx.lineTo(12, 7); ctx.lineTo(8, -2); ctx.fill(); }
    ctx.fillStyle = w.color; ctx.beginPath(); ctx.ellipse(0, 0, 4, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-2, dive ? 1 : -3, 1.5, 1.5); ctx.fillRect(1, dive ? 1 : -3, 1.5, 1.5);
    ctx.restore();
  }
  function drawBig(b) {
    const w = wave();
    for (const r of wingRects(b)) {
      if (!b.wings[r.s][r.i]) continue;
      ctx.fillStyle = r.i === 2 ? w.wing : w.color;
      ctx.beginPath(); ctx.moveTo(r.x - r.w / 2, r.y - r.h / 2 + (r.s ? 0 : 2)); ctx.lineTo(r.x + r.w / 2, r.y - r.h / 2 + (r.s ? 2 : 0)); ctx.lineTo(r.x + r.w / 2 * (r.s ? 1 : 0.3), r.y + r.h / 2); ctx.lineTo(r.x - r.w / 2 * (r.s ? 0.3 : 1), r.y + r.h / 2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = w.color; ctx.beginPath(); ctx.ellipse(b.x, b.y, 8, 11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = w.wing; ctx.beginPath(); ctx.moveTo(b.x - 5, b.y + 9); ctx.lineTo(b.x, b.y + 20 + Math.sin(b.t * 9) * 2); ctx.lineTo(b.x + 5, b.y + 9); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(b.x - 4, b.y - 5, 3, 3); ctx.fillRect(b.x + 1, b.y - 5, 3, 3);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(b.x - 3, b.y - 4, 1.5, 1.5); ctx.fillRect(b.x + 2, b.y - 4, 1.5, 1.5);
    ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(b.x - 2, b.y - 1); ctx.lineTo(b.x + 2, b.y - 1); ctx.lineTo(b.x, b.y + 3); ctx.fill();
  }
  function drawMother() {
    const m = mother, x0 = m.x - COLS * CELL / 2;
    // the dome and the pilot
    ctx.fillStyle = "#3a1a6a"; ctx.beginPath(); ctx.ellipse(m.x, m.y + 30, 90, 22, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#6a3aaa"; ctx.fillRect(x0 + 20, m.y + 26, COLS * CELL - 40, 8);
    ctx.fillStyle = "rgba(160,240,255,0.5)"; ctx.beginPath(); ctx.arc(m.x, m.y + 26, 14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#6ae06a"; ctx.beginPath(); ctx.arc(m.x, m.y + 26, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(m.x - 4, m.y + 23, 2, 3); ctx.fillRect(m.x + 2, m.y + 23, 2, 3);
    ctx.fillStyle = "#6ae06a"; ctx.fillRect(m.x - 9, m.y + 28, 18, 8);
    // the turning belt
    for (let c = 0; c < COLS; c++) if (m.belt[c]) { ctx.fillStyle = c % 2 ? "#ff5ab8" : "#d83a98"; ctx.fillRect(x0 + c * CELL, m.y + 36, CELL - 1, 8); }
    // the hull
    for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++) if (m.hull[r][c]) { ctx.fillStyle = r === 2 ? "#6a4aaa" : r === 1 ? "#7a5aba" : "#8a6aca"; ctx.fillRect(x0 + c * CELL, m.y + 44 + r * CELL, CELL - 1, CELL - 1); }
    if (Math.floor(clock * 4) % 2) { ctx.fillStyle = "#ffd23a"; ctx.fillRect(x0 + 8, m.y + 18, 4, 4); ctx.fillRect(x0 + COLS * CELL - 12, m.y + 18, 4, 4); }
  }
  function drawShip() {
    const x = P.x, y = PY;
    ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x + 5, y - 2); ctx.lineTo(x + 13, y + 6); ctx.lineTo(x + 13, y + 10); ctx.lineTo(x - 13, y + 10); ctx.lineTo(x - 13, y + 6); ctx.lineTo(x - 5, y - 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff5a3a"; ctx.fillRect(x - 13, y + 4, 4, 6); ctx.fillRect(x + 9, y + 4, 4, 6); ctx.fillRect(x - 2, y - 8, 4, 6);
    if (Math.floor(clock * 20) % 2) { ctx.fillStyle = "#ffd23a"; ctx.fillRect(x - 3, y + 10, 6, 4); }
    if (P.shield > 0) {
      ctx.strokeStyle = `rgba(122,240,255,${0.5 + 0.4 * Math.sin(clock * 30)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y + 2, 20, 0, TAU); ctx.stroke();
      ctx.fillStyle = "rgba(122,240,255,0.15)"; ctx.fill();
    }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(12,8,24,0.92)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#f4f6ee"; ctx.font = "900 16px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), 10, 13);
    ctx.fillStyle = "#a8a0c0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 10, 29);
    ctx.fillStyle = "#ff6a3a"; ctx.font = "900 11px system-ui"; ctx.fillText(`ONDATA ${loop * WAVES.length + waveN + 1}`, 106, 13);
    // shield charge
    ctx.fillStyle = "#a8a0c0"; ctx.font = "800 8px system-ui"; ctx.fillText("SCUDO", 106, 29);
    ctx.fillStyle = "#2a2040"; ctx.fillRect(142, 25, 60, 7);
    ctx.fillStyle = P.charge >= 1 ? "#7af0ff" : "#4a7a9a"; ctx.fillRect(142, 25, 60 * P.charge, 7);
    if (P.charge >= 1) { ctx.fillStyle = "#7af0ff"; ctx.fillText("PRONTO", 206, 29); }
    const lx = touchMode ? W - 58 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const x = lx - i * 14; ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x + 6, 24); ctx.lineTo(x - 6, 24); ctx.closePath(); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) { P = { x: W / 2, alive: true, shield: 0, charge: 1, safe: 0 }; buildWave(); }
    ctx.fillStyle = "#0c0818"; ctx.fillRect(0, 0, W, H);
    for (const [x, y, b] of stars) { ctx.fillStyle = `rgba(255,255,255,${0.25 + b * 0.6})`; ctx.fillRect(x, y, 1.5, 1.5); }
    if (mother && !mother.dead) drawMother();
    for (const b of birds) (b.kind === "big" ? drawBig : drawSmall)(b);
    for (const s of shots) { ctx.fillStyle = "#fff4a0"; ctx.fillRect(s.x - 1.5, s.y - 6, 3, 10); }
    for (const b of bombs) { ctx.fillStyle = "#ff5a5a"; ctx.fillRect(b.x - 2, b.y - 5, 4, 8); ctx.fillStyle = "#ffd23a"; ctx.fillRect(b.x - 1, b.y - 3, 2, 3); }
    if (P.alive && !(P.safe > 0 && Math.floor(clock * 10) % 2)) drawShip();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 12px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0c0818"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.2 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 300, W, 60);
      ctx.textAlign = "center"; ctx.font = "italic 900 22px system-ui"; ctx.fillStyle = "#ff6a3a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0c0818"; ctx.strokeText(message.text, W / 2, 328); ctx.fillText(message.text, W / 2, 328);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#f4f6ee"; ctx.fillText(message.sub, W / 2, 348); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>

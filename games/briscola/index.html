<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Briscola</title>
<style>
  :root {
    --bg: #0a1a10;
    --fg: #f4f6ee;
    --muted: #d0f0c8;
    --pink: #ffd23a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a6a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 26, 16, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #0a3a10, 0 0 22px rgba(255,210,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #06200a; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8901a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const CW = 46, CH = 70, HANDS_TO_WIN = 2;
  // the Italian deck: four suits, ace to seven, then knave (8), knight (9) and king (10)
  const SUITS = [
    { name: "denari", col: "#d89a1a" },
    { name: "coppe", col: "#d83a3a" },
    { name: "spade", col: "#3a6ad8" },
    { name: "bastoni", col: "#3a8a4a" },
  ];
  // what each card is worth, and which beats which within a suit: ace, three, king, knight, knave, then 7 down to 2
  const PTS = { 1: 11, 3: 10, 10: 4, 9: 3, 8: 2, 7: 0, 6: 0, 5: 0, 4: 0, 2: 0 };
  const ORDER = [2, 4, 5, 6, 7, 8, 9, 10, 3, 1];
  const str = (c) => ORDER.indexOf(c.v);
  const VNAME = { 1: "asso", 8: "fante", 9: "cavallo", 10: "re" };
  const cardName = (c) => `${VNAME[c.v] || c.v} di ${SUITS[c.s].name}`;
  // the players of the club, one after the other: how well each of them plays
  const RIVALS = [
    { name: "Nonna Pina", skill: 0.2, col: "#e87ab8" },
    { name: "Zio Tano", skill: 0.38, col: "#7ab8e8" },
    { name: "il Barista", skill: 0.55, col: "#e8a84a" },
    { name: "Don Mimmo", skill: 0.7, col: "#9a9ab0" },
    { name: "la Maestra", skill: 0.84, col: "#7ad88a" },
    { name: "il Campione", skill: 0.96, col: "#ffd23a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "avversari distratti, il pulsante AIUTO e due rivincite", skill: -0.2, help: true, lives: 2 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "il circolo com'è, con una rivincita", skill: 0, help: false, lives: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "tutti contano le carte uscite e non c'è rivincita", skill: 0.2, help: false, lives: 0 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "briscola-difficulty";
  const bestKey = (id) => `briscola-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    touchEl.style.display = "none";
    wrapEl.style.paddingBottom = "0";
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, noiseBuf = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q = 1, delay = 0, slide = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    // a card sliding out of the hand and slapping the cloth
    card: () => { noise(0.09, 0.05, 2600, 0.8, 0, -1200); noise(0.05, 0.1, 500, 1.2, 0.08); beep(140, 0.05, "sine", 0.05, -40, 0.08); },
    take: () => { noise(0.14, 0.06, 2000, 0.7, 0, 900); noise(0.05, 0.08, 600, 1.2, 0.12); },
    deal: (n) => { for (let i = 0; i < n; i++) noise(0.06, 0.035, 2800, 1, i * 0.08, -1000); },
    shuffle: () => { for (let i = 0; i < 14; i++) noise(0.03, 0.03, 2200 + i * 60, 1.5, i * 0.035); noise(0.2, 0.04, 1200, 0.6, 0.5); },
    scopa: () => { arp([523, 659, 784, 1047], 0.07, 0.2, "triangle", 0.06); noise(0.3, 0.06, 3000, 0.6, 0, -2000); },
    ouch: () => arp([392, 330, 262], 0.1, 0.2, "triangle", 0.05),
    sette: () => arp([784, 988, 1319], 0.06, 0.16, "sine", 0.05),
    win: () => arp([523, 659, 784, 1047, 1319, 1568], 0.09, 0.26, "triangle", 0.06),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
    tick: () => beep(900, 0.03, "square", 0.02),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, rival = 0, wins = 0, lives = 0;
  let cards = [], deck = [], hands = [[], []], trick = [], piles = [[], []], got = [0, 0], mani = [0, 0], brisc = null, trump = 0, turn = 0, first = 0, phase = "idle", result = null, seen = new Set();
  let kb = 0, hover = null, hint = null, banner = null, popups = [], todo = null, fast = false, handN = 0, tricksWon = 0;
  const isPlaying = () => state === "play";
  const who = () => RIVALS[Math.min(rival, RIVALS.length - 1)];
  const rivalSkill = () => clamp(who().skill + diff.skill + (rival >= RIVALS.length ? 0.1 : 0), 0, 1);
  const myTurn = () => phase === "play" && turn === 0 && !todo && trick.length < 2;

  // one thing at a time: what happens next, and how long the table waits before it does
  function after(t, fn) {
    if (fast) { fn(); return; }
    todo = { t, fn };
  }

  // ---------- Rules ----------
  // does the second card take the trick from the first?
  const beats = (lead, c) => (c.s === lead.s ? str(c) > str(lead) : c.s === trump);
  const trumpCost = (c) => (c.s === trump ? 3 + str(c) * 0.7 : 0);
  // the last three tricks, with the deck gone: a good player knows what the other holds and plays them out exactly
  function endgame(mine, theirs, lead, mover) {
    // returns the best points difference for `mover`, and the card that gets it
    let best = null;
    const hand = mover === 0 ? mine : theirs;
    for (const c of hand) {
      const rest = hand.filter((x) => x !== c), a = mover === 0 ? rest : mine, b = mover === 0 ? theirs : rest;
      let v;
      if (!lead) v = -endgame(a, b, c, 1 - mover).v;
      else {
        const win = beats(lead, c), p = PTS[lead.v] + PTS[c.v];
        const nextMover = win ? mover : 1 - mover;
        const more = a.length || b.length ? endgame(a, b, null, nextMover).v : 0;
        v = (win ? p : -p) + (nextMover === mover ? more : -more);
      }
      if (!best || v > best.v) best = { v, card: c };
    }
    return best;
  }
  function bestMove(p, skill) {
    const hand = hands[p], lead = trick.length ? trick[0].card : null;
    if (!deck.length && skill >= 0.7 && hand.length <= 3) {
      const theirs = cards.filter((c) => !seen.has(c.id) && !hand.includes(c));
      if (theirs.length === hand.length - (lead ? 1 : 0)) return { card: endgame(hand, theirs, lead, 0).card };
    }
    let best = null;
    for (const c of hand) {
      let v = (Math.random() - 0.5) * (1 - skill) * 14;
      if (!lead) {
        // opening: a card worth nothing, and not a trump, unless there is little else
        v -= PTS[c.v] * 1.3 + trumpCost(c) * 1.4;
        // a card nobody can beat in its suit any more is a safer lead
        if (skill > 0.5 && c.s !== trump && !cards.some((o) => o.s === c.s && str(o) > str(c) && !seen.has(o.id) && !hand.includes(o))) v += PTS[c.v] * 0.5;
      } else {
        const win = beats(lead, c), p = PTS[lead.v] + PTS[c.v];
        v += win ? p - trumpCost(c) : -p - trumpCost(c) * 0.5;
        if (win && !p) v -= 0.6;                      // an empty trick is not worth the lead
        if (!win && !PTS[c.v] && c.s !== trump) v += 0.4;
      }
      if (!best || v > best.v) best = { card: c, v };
    }
    return best;
  }

  // ---------- The hand ----------
  function newMatch() {
    mani = [0, 0]; handN = 0; first = 0;
    newHand();
  }
  function newHand() {
    handN++;
    cards = [];
    for (let s = 0; s < 4; s++) for (let v = 1; v <= 10; v++) cards.push({ id: s * 10 + v, s, v, x: 52, y: 168, rot: 0, f: 0, zone: "deck", hold: 0, sc: 1 });
    for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
    deck = cards.slice(); hands = [[], []]; trick = []; piles = [[], []]; got = [0, 0]; seen = new Set(); result = null; hint = null; brisc = null; tricksWon = 0;
    sfx.shuffle();
    phase = "deal";
    after(0.9, () => {
      for (let i = 0; i < 3; i++) for (const p of [first, 1 - first]) { const c = deck.shift(); c.hold = (i * 2 + (p === first ? 0 : 1)) * 0.08; hands[p].push(c); }
      sfx.deal(6);
      after(0.7, () => {
        // the card turned up under the deck names the trump, and is the last one to be drawn
        brisc = deck.shift(); deck.push(brisc); trump = brisc.s; seen.add(brisc.id);
        sfx.card();
        banner = { text: `BRISCOLA: ${SUITS[trump].name.toUpperCase()}`, sub: cardName(brisc), t: 0, col: SUITS[trump].col };
        turn = first; kb = 0; phase = "play";
        after(1, () => { if (turn === 1) aiTurn(); });
      });
    });
  }
  function aiTurn() {
    after(fast ? 0 : rnd(0.5, 1), () => playCard(1, bestMove(1, rivalSkill()).card));
  }
  function playCard(p, card) {
    hands[p].splice(hands[p].indexOf(card), 1);
    trick.push({ p, card });
    seen.add(card.id);
    hint = null;
    sfx.card();
    turn = 1 - p;
    if (trick.length === 1) after(0.25, () => { if (turn === 1) aiTurn(); });
    else after(0.95, resolve);
  }
  function resolve() {
    const [a, b] = trick, w = beats(a.card, b.card) ? b.p : a.p, p = PTS[a.card.v] + PTS[b.card.v];
    piles[w].push(a.card, b.card); got[w] += p; trick = [];
    sfx.take();
    if (w === 0) tricksWon++;
    if (p) popups.push({ text: `+${p}`, t: 0, col: w === 0 ? "#ffd23a" : "#ff8a7a", y: w === 0 ? 236 : 104 });
    if (w === 0 && p >= 21) { popups.push({ text: "CHE PRESA!", t: 0, col: "#ffd23a", y: 130 }); sfx.sette(); }
    turn = w;
    after(0.45, () => {
      if (deck.length) {
        for (const q of [w, 1 - w]) { const c = deck.shift(); c.hold = q === w ? 0 : 0.12; hands[q].push(c); if (c === brisc) c.rot = 0; }
        sfx.deal(2);
        if (!deck.length) popups.push({ text: "ULTIME TRE MANI", t: 0, col: "#ffffff", y: 130 });
      }
      kb = Math.min(kb, Math.max(0, hands[0].length - 1));
      if (!hands[0].length && !hands[1].length) { endHand(); return; }
      after(0.45, () => { if (turn === 1) aiTurn(); });
    });
  }
  function endHand() {
    const won = got[0] > got[1] ? 0 : got[1] > got[0] ? 1 : -1;
    if (won >= 0) mani[won]++;
    score += got[0] * 10;
    if (got[0] >= 80) impresa("ottanta");
    const over = mani[0] >= HANDS_TO_WIN || mani[1] >= HANDS_TO_WIN, win = over && mani[0] > mani[1];
    let bonus = 0;
    if (win) { bonus = 1000 + (mani[1] === 0 ? 500 : 0); score += bonus; wins++; if (mani[1] === 0) impresa("netto"); if (rival === RIVALS.length - 1) impresa("campione"); }
    result = { won, over, win, bonus, t: 0 };
    after(0.7, () => { phase = "score"; if (over) (win ? sfx.win : sfx.lose)(); else if (won === 0) sfx.scopa(); else if (won === 1) sfx.ouch(); });
  }
  function proceed() {
    if (phase !== "score" || todo) return;
    sfx.tick();
    if (!result.over) { first = 1 - first; newHand(); return; }
    if (!result.win) {
      if (lives <= 0) { gameOver(); return; }
      lives--;
      banner = { text: "RIVINCITA", sub: `ancora contro ${who().name}`, t: 0, col: who().col };
      newMatch(); return;
    }
    rival++;
    banner = { text: who().name.toUpperCase(), sub: rival >= RIVALS.length ? "la rivincita del Campione" : `avversario ${rival + 1} di ${RIVALS.length}`, t: 0, col: who().col };
    newMatch();
  }

  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; rival = 0; wins = 0; lives = diff.lives; popups = []; todo = null; hover = null;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    banner = { text: who().name.toUpperCase(), sub: `avversario 1 di ${RIVALS.length} · vince chi prende ${HANDS_TO_WIN} mani`, t: 0, col: who().col };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    newMatch();
    syncControls();
    last = performance.now();
  }
  function choose(card) { if (myTurn() && hands[0].includes(card)) playCard(0, card); }
  function showHint() {
    if (!myTurn() || !diff.help) return;
    hint = { card: bestMove(0, 1).card, t: 0 };
    sfx.tick();
  }

  // ---------- Update ----------
  function place() {
    const n0 = hands[0].length, n1 = hands[1].length;
    hands[0].forEach((c, i) => { c.tx = 320 + (i - (n0 - 1) / 2) * 58; c.ty = 299 - (hint && hint.card === c ? 8 : 0) - (myTurn() && (c === hover || (kbOn && i === kb)) ? 5 : 0); c.ts = 1; c.tf = 1; c.trot = 0; });
    hands[1].forEach((c, i) => { c.tx = 320 + (i - (n1 - 1) / 2) * 34; c.ty = 56; c.ts = 0.6; c.tf = 0; c.trot = 0; });
    for (const t of trick) { const c = t.card; c.tx = t.p === 0 ? 336 : 304; c.ty = t.p === 0 ? 182 : 150; c.ts = 1; c.tf = 1; c.trot = t.p === 0 ? 0.08 : -0.1; }
    deck.forEach((c, i) => {
      if (c === brisc) { c.tx = 92; c.ty = 168; c.ts = 0.9; c.tf = 1; c.trot = Math.PI / 2; }
      else { c.tx = 52 - i * 0.15; c.ty = 168 - i * 0.25; c.ts = 0.9; c.tf = 0; c.trot = 0; }
    });
    for (const p of [0, 1]) piles[p].forEach((c, i) => { c.tx = 596 - i * 0.1; c.ty = (p === 0 ? 292 : 72) - i * 0.2; c.ts = 0.7; c.tf = 0; c.trot = 0; });
  }
  let kbOn = false;
  function update(dt) {
    clock += dt;
    if (state !== "play") return;
    place();
    for (const c of cards) {
      if (c.hold > 0) { c.hold -= dt; continue; }
      const k = Math.min(1, dt * 13);
      c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k; c.sc += ((c.ts || 1) - c.sc) * k; c.f += ((c.tf || 0) - c.f) * Math.min(1, dt * 9); c.rot += ((c.trot || 0) - c.rot) * k;
    }
    if (banner) { banner.t += dt; if (banner.t > 2) banner = null; }
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1.6);
    if (hint) hint.t += dt;
    if (result) result.t += dt;
    if (todo) { todo.t -= dt; if (todo.t <= 0) { const fn = todo.fn; todo = null; fn(); } }
  }

  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const lost = result && result.over && !result.win;
    menu = () => showOverlay(

    }
    drawSeats();
    const order = (brisc && deck.includes(brisc) ? [brisc] : []).concat([...deck].filter((c) => c !== brisc).reverse(), piles[1], piles[0], hands[1], trick.map((t) => t.card), hands[0]);
    const lead = trick.length === 1 ? trick[0].card : null;
    for (const c of order) {
      let glow = null;
      const mine = hands[0].includes(c) && Math.abs(c.y - c.ty) < 6;
      if (hint && hint.card === c) glow = "#7ed87a";
      else if (mine && myTurn() && (c === hover || (kbOn && hands[0][kb] === c))) glow = "#ffffff";
      else if (trick.length === 2 && c === (beats(trick[0].card, trick[1].card) ? trick[1].card : trick[0].card)) glow = "#ffd23a";
      drawCard(c, glow);
      if (mine && c.s === trump && brisc) {   // a little flag on the trumps you hold
        ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.roundRect(c.x - 9, c.y - CH / 2 - 7, 18, 6, 3); ctx.fill();
      }
      if (mine && lead && myTurn() && beats(lead, c)) { ctx.fillStyle = "#7ed87a"; ctx.beginPath(); ctx.arc(c.x + CW / 2 - 4, c.y + CH / 2 + 5, 2.5, 0, TAU); ctx.fill(); }
    }
    drawHud();
    ctx.textAlign = "center";
    popups.forEach((p) => { ctx.globalAlpha = clamp((1.6 - p.t) * 3, 0, 1); outlined(p.text, p.y === 130 ? 320 : 440, p.y - p.t * 12, p.y === 130 ? "900 14px system-ui" : "900 16px system-ui", p.col, 4); });
    ctx.globalAlpha = 1;
    if (banner) {
      ctx.globalAlpha = clamp(Math.min(banner.t * 8, (2 - banner.t) * 3), 0, 1);
      const s = 1 + Math.max(0, 0.25 - banner.t) * 2;
      ctx.save(); ctx.translate(320, 110); ctx.scale(s, s);
      outlined(banner.text, 0, 0, "italic 900 30px system-ui", banner.col, 8);
      outlined(banner.sub, 0, 20, "800 12px system-ui", "#ffffff", 4);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    if (phase === "score" && result) drawResult();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="briscola-best-" data-kind="score"></script>

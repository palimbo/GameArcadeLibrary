<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scimmione</title>
<style>
  :root {
    --bg: #000000;
    --fg: #fff4ec;
    --muted: #b8a8b0;
    --girder: #ff3d6a;
    --ladder: #3de0ff;
    --gold: #ffd34d;
    --bad: #ff4f6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px rgba(255, 61, 106, 0.3); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 244, 236, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 6px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch button {
    width: 58px; height: 58px; border-radius: 14px; touch-action: none;
    font: 700 22px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(61, 224, 255, 0.6); background: rgba(61, 224, 255, 0.08);
  }
  #touch button[data-a="jump"] { width: 86px; height: 86px; border-radius: 50%; border-color: rgba(255, 61, 106, 0.85); background: rgba(255, 61, 106, 0.14); font-size: 15px; letter-spacing: 1px; pointer-events: auto; }
  #touch.small .pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); }
  #touch.small button { width: 48px; height: 48px; font-size: 18px; }
  #touch.small button[data-a="jump"] { width: 70px; height: 70px; font-size: 13px; }
  #touch button.on { background: rgba(255, 244, 236, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(0, 0, 0, 0.86);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(38px, 10vw, 66px); letter-spacing: 4px; font-weight: 400; color: #ff8a3a; text-shadow: 3px 3px 0 #ff3d6a, 0 0 18px rgba(255,138,58,0.6); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 400; letter-spacing: 3px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.6; font-family: system-ui, sans-serif; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 20px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); font-weight: 400; }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,244,236,0.35); border-radius: 4px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: #ff8a3a; color: #000; background: #ff8a3a; padding: 10px 28px; box-shadow: 0 0 16px rgba(255,138,58,0.55); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Su">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="down" aria-label="Giù">▼</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
  </div>
  <button type="button" data-a="jump" aria-label="Salta">SALTA</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 448, H = 512;
  const WALK = 72, CLIMB = 52, JUMP_V = 195, GRAV = 640, FALL_DEATH = 40, BR = 7;

  // ---------- The two screens ----------
  // floors are sloped segments { fl, x0, x1, yL, yR, dir } (dir: where barrels roll)
  const STAGES = [
    {
      name: "LE TRAVI", height: "25 m",
      floors: [
        { fl: 0, x0: 0, x1: 448, yL: 496, yR: 482, dir: -1 },
        { fl: 1, x0: 0, x1: 416, yL: 414, yR: 440, dir: 1 },
        { fl: 2, x0: 32, x1: 448, yL: 364, yR: 338, dir: -1 },
        { fl: 3, x0: 0, x1: 416, yL: 262, yR: 288, dir: 1 },
        { fl: 4, x0: 32, x1: 448, yL: 212, yR: 186, dir: -1 },
        { fl: 5, x0: 0, x1: 416, yL: 116, yR: 130, dir: 1 },
        { fl: 6, x0: 176, x1: 272, yL: 62, yR: 62, dir: 0 },
      ],
      ladders: [
        { x: 88, lo: 0, hi: 1, broken: true }, { x: 368, lo: 0, hi: 1 },
        { x: 96, lo: 1, hi: 2 }, { x: 256, lo: 1, hi: 2, broken: true },
        { x: 72, lo: 2, hi: 3 }, { x: 184, lo: 2, hi: 3 }, { x: 368, lo: 2, hi: 3, broken: true },
        { x: 96, lo: 3, hi: 4, broken: true }, { x: 240, lo: 3, hi: 4 }, { x: 392, lo: 3, hi: 4 },
        { x: 176, lo: 4, hi: 5, broken: true }, { x: 336, lo: 4, hi: 5 },
        { x: 256, lo: 5, hi: 6 },
      ],
      hammers: [{ fl: 1, x: 44 }, { fl: 4, x: 400 }],
      start: { fl: 0, x: 60 }, dk: { x: 62, fl: 5 }, goalFl: 6,
    },
    {
      name: "I BULLONI", height: "100 m",
      floors: [
        { fl: 0, x0: 0, x1: 448, yL: 496, yR: 496 },
        { fl: 1, x0: 32, x1: 416, yL: 416, yR: 416 },
        { fl: 2, x0: 48, x1: 400, yL: 336, yR: 336 },
        { fl: 3, x0: 64, x1: 384, yL: 256, yR: 256 },
        { fl: 4, x0: 80, x1: 368, yL: 176, yR: 176 },
        { fl: 5, x0: 136, x1: 312, yL: 112, yR: 112 },
      ],
      ladders: [
        { x: 90, lo: 0, hi: 1 }, { x: 224, lo: 0, hi: 1 }, { x: 356, lo: 0, hi: 1 },
        { x: 96, lo: 1, hi: 2 }, { x: 352, lo: 1, hi: 2 },
        { x: 112, lo: 2, hi: 3 }, { x: 224, lo: 2, hi: 3 }, { x: 336, lo: 2, hi: 3 },
        { x: 128, lo: 3, hi: 4 }, { x: 320, lo: 3, hi: 4 },
      ],
      hammers: [{ fl: 1, x: 160 }, { fl: 3, x: 288 }],
      start: { fl: 0, x: 120 }, dk: { x: 224, fl: 5 },
      rivets: true,
    },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · barili lenti e lanciati più di rado · più tempo", lives: 5, speed: 0.85, throwMul: 1.3, fire: 2, time: 1.3 },
    normale:   { label: "NORMALE",   color: "#ff8a3a", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, throwMul: 1, fire: 3, time: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · barili veloci · più fuochi · meno tempo", lives: 3, speed: 1.18, throwMul: 0.78, fire: 4, time: 0.85 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "scimmione-difficulty";
  const bestKey = (id) => `scimmione-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(150px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 150;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 260) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    step: lim((hi) => beep(hi ? 220 : 180, 0.03, "square", 0.02)),
    jump: () => beep(300, 0.25, "square", 0.035, 500),
    over: () => arp([988, 1319], 0.06, 0.08),
    smash: lim(() => { noise(0.25, 0.35, 1800); beep(880, 0.1, "square", 0.04, -400); }),
    hammer: lim((hi) => beep(hi ? 523 : 392, 0.08, "square", 0.025)),
    throw: lim(() => noise(0.15, 0.2, 300)),
    pound: lim(() => { beep(80, 0.12, "square", 0.06); noise(0.1, 0.25, 250); }),
    rivet: lim(() => { beep(1200, 0.06, "square", 0.04); beep(1600, 0.08, "square", 0.04, 0, 0.06); }),
    fire: lim(() => noise(0.3, 0.2, 900)),
    die: () => { arp([988, 932, 880, 831, 784, 740, 698, 659], 0.09, 0.1, "square", 0.04); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    fall: () => { beep(200, 1.2, "sawtooth", 0.05, -150); noise(1.2, 0.3, 200); },
    gameover: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, stageI = 0, bestCache = 0, nextLife = 10000, bonus = 0, bonusT = 0;
  let floors = [], ladders = [], hammers = [], rivets = [], hero = null, barrels = [], fires = [], parts = [], popups = [];
  let dk = null, throwT = 0, fireT = 0, message = null, deathCause = "";
  const ctl = { left: false, right: false, up: false, down: false, jump: false };
  let jumpPressed = false;

  const stage = () => STAGES[stageI];
  const speedMul = () => diff.speed * (1 + 0.12 * level);
  const segY = (s, x) => s.yL + (s.yR - s.yL) * (x - s.x0) / (s.x1 - s.x0);
  function floorAt(fl, x) { return floors.find((s) => s.fl === fl && x >= s.x0 && x <= s.x1) || null; }
  function floorY(fl, x) { const s = floorAt(fl, x); return s ? segY(s, x) : null; }
  function ladderSpan(L) { return { top: floorY(L.hi, L.x), bottom: floorY(L.lo, L.x) }; }

  function buildStage() {
    const S = stage();
    floors = S.floors.map((f) => ({ ...f }));
    ladders = S.ladders.map((l) => ({ ...l }));
    hammers = S.hammers.map((h) => ({ ...h, taken: false }));
    rivets = [];
    if (S.rivets) for (const f of floors) if (f.fl >= 1 && f.fl <= 4) { rivets.push({ fl: f.fl, x: f.x0 + 26, out: false }, { fl: f.fl, x: f.x1 - 26, out: false }); }
    hero = { x: S.start.x, y: floorY(S.start.fl, S.start.x), fl: S.start.fl, vx: 0, vy: 0, air: false, ladder: null, face: 1, walk: 0, hammer: 0, peakY: 0, dead: false };
    dk = { x: S.dk.x, y: floorY(S.dk.fl, S.dk.x), anim: 0, throwing: 0, fall: 0 };
    barrels = []; fires = []; parts = []; popups = [];
    throwT = 1.4; fireT = 3;
    bonus = Math.min(8000, 5000 + level * 1000); bonusT = 2 * diff.time;
    message = { text: `${S.height} · ${S.name}`, sub: S.rivets ? "Cammina sui bulloni gialli per toglierli tutti!" : "Arriva in cima da Paolina!", t: 0 };
    state = "intro"; stateT = 1.8;
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; stageI = 0; nextLife = 10000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildStage();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#fff4ec") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 20000; lives++; arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05); popups.push({ x: W / 2, y: 150, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 10, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function die(cause) {
    if (state !== "play") return;
    hero.dead = true; deathCause = cause;
    lives--;
    if (cause === "fall") sfx.fall(); else sfx.die();
    state = "dead"; stateT = 2.2;
  }
  function stageCleared() {
    addScore(bonus, hero.x, hero.y - 30, "#ffd34d");
    message = stage().rivets
      ? { text: "LO SCIMMIONE È CADUTO!", sub: `Paolina è salva · bonus ${bonus}`, t: 0 }
      : { text: "LO SCIMMIONE È SCAPPATO!", sub: `Si è portato via Paolina… inseguilo! · bonus ${bonus}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 3.2;
    if (stage().rivets) dk.fall = 0.001;
  }
  function afterClear() {
    stageI++;
    if (stageI >= STAGES.length) { stageI = 0; level++; }
    buildStage();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1, where = stage().height;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv}, ${where} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.gameover();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(40px + env(safe-area-inset-bottom, 0px))", right: "auto", left: "calc(50% + 10px)" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>SCIMMIONE</h1>
       <p>Lo Scimmione ha rapito Paolina e l'ha portata in cima al cantiere! Sali lungo le travi e le scale saltando i barili che ti rotolano contro. Nel secondo schema, togli tutti gli otto bulloni per far crollare lo Scimmione. Occhio a non cadere da troppo in alto!</p>
       <div class="pts">
         <span><b>Barile saltato</b></span><span>100</span>
         <span><b>Col martello</b></span><span>barili 300 · 500 · 800, fuochi 500</span>
         <span><b>Bullone tolto</b></span><span>100</span>
         <span><b>Bonus tempo</b></span><span>quello che resta a fine schema</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Croce per camminare e salire le scale · SALTA per saltare</p>`
         : `<p class="muted help">← → cammina · ↑ ↓ sali e scendi le scale · SPAZIO salta · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------

    ctx.fillStyle = "#ff8ad8"; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-4, -14); ctx.lineTo(4, -14); ctx.lineTo(7, 0); ctx.fill();
    ctx.fillStyle = "#ffc890"; ctx.fillRect(-3, -21, 6, 7);
    ctx.fillStyle = "#ffb03a"; ctx.fillRect(-4, -23, 8, 3); ctx.fillRect(-5, -21, 2, 9);
    ctx.restore();
    if (S.rivets && !dk.fall) { ctx.fillStyle = "#3d7bff"; ctx.fillRect(176, 38, 96, 4); }
    if (state === "play" && Math.floor(clock / 2) % 3 === 0) {
      ctx.fillStyle = "#fff"; ctx.font = "700 11px ui-monospace, Menlo, monospace"; ctx.textAlign = "left";
      ctx.fillText("AIUTO!", x + 10, y - 20);
    }
    if (state === "clear" && S.rivets) { ctx.fillStyle = "#ff3d6a"; ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.fillText("♥", x + 18 * Math.sin(clock * 3), y - 28); }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    if (!floors.length) return;
    for (const L of ladders) drawLadder(L);
    for (const s of floors) drawGirder(s);
    // rivets
    for (const r of rivets) if (!r.out) { const y = floorY(r.fl, r.x); ctx.fillStyle = "#ffd34d"; ctx.fillRect(r.x - 4, y - 1, 8, 9); ctx.fillStyle = "#8a6a10"; ctx.fillRect(r.x - 1, y + 1, 2, 5); }
    // oil drum
    if (!stage().rivets) {
      ctx.fillStyle = "#3d7bff"; ctx.fillRect(8, 470, 24, 24);
      ctx.fillStyle = "#fff"; ctx.font = "700 8px ui-monospace, Menlo, monospace"; ctx.textAlign = "center"; ctx.fillText("OIL", 20, 486);
      const fl = Math.sin(clock * 18) * 2;
      ctx.fillStyle = "#ff8a1a"; ctx.beginPath(); ctx.moveTo(10, 470); ctx.quadraticCurveTo(14, 458 + fl, 20, 452 - fl); ctx.quadraticCurveTo(26, 460 + fl, 30, 470); ctx.fill();
      // the ape's barrel stack
      ctx.fillStyle = "#c8844a"; for (const [bx, by] of [[14, 96], [14, 108], [26, 96], [26, 108]]) { ctx.fillRect(bx - 5, by - 6, 10, 12); }
    }
    // hammers
    for (const hm of hammers) if (!hm.taken) {
      const y = floorY(hm.fl, hm.x) - 30;
      ctx.fillStyle = "#c8844a"; ctx.fillRect(hm.x - 1.5, y, 3, 12);
      ctx.fillStyle = "#8a8aa0"; ctx.fillRect(hm.x - 6, y - 5, 12, 6);
    }
    drawPaolina();
    drawApe();
    for (const f of fires) drawFire(f);
    for (const b of barrels) drawBarrel(b);
    if (state !== "menu") drawHero();
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / (q.big ? 1.6 : 0.9));
      ctx.textAlign = "center"; ctx.font = q.big ? "700 20px ui-monospace, Menlo, monospace" : "700 11px ui-monospace, Menlo, monospace";
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    // status
    ctx.font = "700 13px ui-monospace, Menlo, monospace"; ctx.textAlign = "left"; ctx.fillStyle = "#fff4ec";
    ctx.fillText(score.toLocaleString("it-IT"), 8, 18);
    ctx.fillStyle = "#b8a8b0"; ctx.font = "700 10px ui-monospace, Menlo, monospace";
    ctx.fillText(`RECORD ${Math.max(bestCache, score).toLocaleString("it-IT")}`, 8, 32);
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { ctx.fillStyle = "#ff3d3d"; ctx.fillRect(8 + i * 12, 38, 8, 4); ctx.fillStyle = "#ffc890"; ctx.fillRect(9 + i * 12, 42, 6, 4); }
    // bonus box
    ctx.strokeStyle = "#3de0ff"; ctx.lineWidth = 1.5; ctx.strokeRect(W - 84, 6, 76, 34);
    ctx.textAlign = "center"; ctx.fillStyle = "#3de0ff"; ctx.font = "700 9px ui-monospace, Menlo, monospace"; ctx.fillText(`L${level + 1} · BONUS`, W - 46, 18);
    ctx.fillStyle = bonus <= 1000 && Math.floor(clock * 4) % 2 ? "#ff4f6a" : "#fff4ec"; ctx.font = "700 14px ui-monospace, Menlo, monospace"; ctx.fillText(bonus, W - 46, 35);
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.6 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 226, W, message.sub ? 60 : 40);
      ctx.textAlign = "center"; ctx.font = "400 20px ui-monospace, Menlo, monospace"; ctx.fillStyle = "#ff8a3a";
      ctx.fillText(message.text, W / 2, 252);
      if (message.sub) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#fff4ec"; ctx.fillText(message.sub, W / 2, 274); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead" && deathCause === "time") { ctx.textAlign = "center"; ctx.fillStyle = "#ff4f6a"; ctx.font = "400 18px ui-monospace, Menlo, monospace"; ctx.fillText("TEMPO SCADUTO", W / 2, 250); }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildStage(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Isola della Frutta</title>
<style>
  :root {
    --bg: #0a1e32;
    --fg: #f4f6ee;
    --muted: #a8c8d8;
    --pink: #ffb03a;
    --yellow: #8ae05a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: run; SALTA jumps (hold it to jump higher), ASCIA throws the axe */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 200, 58, 0.6); background: radial-gradient(circle, rgba(255,200,58,0.14), rgba(255,200,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 200, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(122, 228, 255, 0.9); background: rgba(122, 228, 255, 0.22); }
  #touch .jump.on { background: rgba(122, 228, 255, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #touch .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #touch .jump.axe { width: 64px; height: 64px; font-size: 11px; border-color: rgba(255, 244, 200, 0.9); background: rgba(255, 244, 200, 0.16); }
  #touch .jump.axe.on { background: rgba(255, 244, 200, 0.5); }
  #touch.small .jump.axe { width: 54px; height: 54px; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 30, 50, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a3a0a, 0 0 22px rgba(255,200,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1404; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8801a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns"><button type="button" class="jump axe" aria-label="Ascia">ASCIA</button><button type="button" class="jump hop" aria-label="Salta">SALTA</button></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const G_ACC = 1700, JUMP_V = 560, RUN = 150, SKATE = 215, HW = 7, PH = 24;
  const AXE_EVERY = 0.35, VMAX = 100;
  const ENEMY = {
    lumaca: { pts: 100, r: 10, name: "UNA LUMACA" },
    rana: { pts: 200, r: 10, name: "UNA RANA" },
    ape: { pts: 100, r: 9, name: "UN'APE" },
    ragno: { pts: 150, r: 9, name: "UN RAGNO" },
    cobra: { pts: 150, r: 10, name: "UN COBRA" },
  };
  const FRUITS = [
    { name: "mela", c: "#e83a3a", pts: 50, vit: 12 },
    { name: "banana", c: "#ffd23a", pts: 100, vit: 14 },
    { name: "uva", c: "#8a4ad8", pts: 200, vit: 16 },
    { name: "anguria", c: "#3aa83a", pts: 500, vit: 24 },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · la vitalità cala piano · nemici lenti", lives: 5, drain: 2.2, speed: 0.8, dens: 0.75 },
    normale:   { label: "NORMALE",   color: "#ffb03a", desc: "3 vite", lives: 3, drain: 3, speed: 1, dens: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · la vitalità cala in fretta · più ostacoli", lives: 3, drain: 3.6, speed: 1.15, dens: 1.25 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "isola-difficulty";
  const bestKey = (id) => `isola-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    jump: lim(() => beep(330, 0.16, "square", 0.025, 330)),
    fruit: lim(() => arp([784, 1047], 0.04, 0.08, "triangle", 0.04)),
    axe: lim(() => beep(600, 0.12, "triangle", 0.025, -250)),
    kill: lim(() => { noise(0.12, 0.08, 1200); beep(700, 0.1, "square", 0.025, -400); }),
    stumble: lim(() => { noise(0.15, 0.1, 300); beep(200, 0.15, "square", 0.03, -80); }),
    egg: lim(() => { noise(0.1, 0.08, 2000); beep(1200, 0.08, "triangle", 0.03); }),
    power: lim(() => arp([523, 659, 784, 1047, 1319], 0.05, 0.1, "triangle", 0.05)),
    bad: lim(() => arp([392, 330, 262], 0.08, 0.14, "sawtooth", 0.035)),
    lostBoard: lim(() => { noise(0.2, 0.12, 800); beep(400, 0.2, "square", 0.03, -250); }),
    check: lim(() => arp([659, 988], 0.06, 0.1, "triangle", 0.04)),
    low: lim(() => beep(880, 0.06, "square", 0.02)),
    die: () => { noise(0.4, 0.14, 500); arp([659, 523, 392, 330, 262], 0.1, 0.16, "square", 0.04); },
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, 0.15),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 20000;
  let segs = [], plats = [], rocks = [], fires = [], enemies = [], fruits = [], eggs = [], axes = [], checks = [], parts = [], popups = [], message = null;
  let P = null, camX = 0, LEN = 0, vit = VMAX, axeT = 0, lastBy = "", lowT = 0, melT = 0, fairyT = 0;
  let jumpPressed = false, jumpHeld = false, axePressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };

  // ---------- The island ----------
  function buildLevel() {
    segs = []; plats = []; rocks = []; fires = []; enemies = []; fruits = []; eggs = []; axes = []; checks = [];
    LEN = Math.min(6200, 3400 + 350 * (level - 1));
    let x = 560, y = 300;
    segs.push({ x0: -300, x1: x, y });
    const kinds = ["lumaca"];
    if (level >= 1) kinds.push("ape");
    if (level >= 2) kinds.push("rana");
    if (level >= 3) kinds.push("ragno", "cobra");
    const dens = diff.dens * Math.min(1.6, 0.8 + level * 0.12);
    let sinceEgg = 0;
    for (const fx of [260, 330, 400]) fruits.push({ x: fx, y: y - 30, f: FRUITS[0] });
    while (x < LEN) {
      const ny = clamp(y + pick([-30, -20, 0, 0, 0, 20, 30]), 230, 320);
      if (Math.random() < 0.35 + Math.min(0.2, level * 0.03)) {
        // a gap to jump: narrower when the far side is higher
        const g = ny < y ? rnd(46, 64) : rnd(50, 70 + Math.min(16, level * 3));
        x += g;
      }
      const w = rnd(260, 520), seg = { x0: x, x1: x + w, y: ny };
      segs.push(seg);
      // things on this stretch, spaced so that there is always a place to land
      let px = x + rnd(70, 110);
      while (px < x + w - 70) {
        const r = Math.random();
        if (r < 0.16 * dens) rocks.push({ x: px, y: ny });
        else if (r < 0.24 * dens && level >= 2) fires.push({ x: px, y: ny });
        else if (r < 0.52 * dens) { const k = pick(kinds); enemies.push(makeEnemy(k, px, ny)); }
        else if (r < 0.75) { const n = 1 + Math.floor(Math.random() * 3), h = pick([30, 55, 80]); for (let i = 0; i < n; i++) fruits.push({ x: px + i * 22, y: ny - h, f: FRUITS[Math.min(FRUITS.length - 1, Math.floor(Math.random() * Math.min(4, 1 + level)))] }); }
        px += rnd(120, 190) / Math.min(1.3, dens);
      }
      sinceEgg += w;
      if (sinceEgg > 650 && x + w < LEN - 200) { sinceEgg = 0; eggs.push({ x: x + w / 2 + rnd(-40, 40), y: ny }); }
      // a floating platform with fruit on it now and then
      if (Math.random() < 0.3 && w > 320) { const pxp = x + rnd(80, w - 160); plats.push({ x0: pxp, x1: pxp + 90, y: ny - 70 }); for (let i = 0; i < 3; i++) fruits.push({ x: pxp + 20 + i * 25, y: ny - 95, f: FRUITS[Math.min(3, 1 + Math.floor(Math.random() * 3))] }); }
      x += w; y = ny;
    }
    segs.push({ x0: x, x1: x + 700, y, goal: true });
    LEN = x + 200;
    // remove hazards from the eggs' spots
    for (const e of eggs) { rocks = rocks.filter((r) => Math.abs(r.x - e.x) > 40); fires = fires.filter((f) => Math.abs(f.x - e.x) > 40); }
    for (const f of [LEN / 3, (2 * LEN) / 3]) {
      const s = segs.find((q) => q.x0 + 60 < f && q.x1 - 60 > f) || segs.find((q) => q.x0 > f && q.x1 - q.x0 > 140);
      if (s) { const cx = clamp(f, s.x0 + 60, s.x1 - 60); checks.push({ x: cx, y: s.y, on: false }); rocks = rocks.filter((r) => Math.abs(r.x - cx) > 70); fires = fires.filter((q) => Math.abs(q.x - cx) > 70); enemies = enemies.filter((q) => Math.abs(q.x - cx) > 90); }
    }
  }
  function makeEnemy(kind, x, gy) {
    const e = { kind, x, y: gy, gy, vx: 0, vy: 0, t: rnd(0, 3), x0: x, dead: false };
    if (kind === "ape") e.y = gy - rnd(40, 60);
    if (kind === "ragno") { e.top = gy - 140; e.y = gy - 120; }
    return e;
  }
  function groundAt(x, feet, falling) {
    // the highest surface under x that the feet are on or above
    let best = null;
    for (const s of segs) if (x >= s.x0 && x <= s.x1 && feet <= s.y + 1 && (!best || s.y < best)) best = s.y;
    if (falling) for (const p of plats) if (x >= p.x0 && x <= p.x1 && feet <= p.y + 1 && (!best || p.y < best)) best = p.y;
    return best;
  }
  const segAt = (x) => segs.find((s) => x >= s.x0 && x <= s.x1);

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    spawnPlayer(80, 300);
    message = { text: `ISOLA ${level}`, sub: "corri verso destra e mangia la frutta: la vitalità cala sempre!", t: 0 };
    state = "intro"; stateT = 1.4;
  }
  function spawnPlayer(x, y) {
    P = { x, y, vx: 0, vy: 0, ground: true, face: 1, axe: false, skate: false, stumble: 0, safe: 1.5, step: 0, jumpHold: 0 };
    vit = VMAX; melT = 0; fairyT = 0; axes = [];
    camX = Math.max(0, x - 200);
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: camX + W / 2, y: 70, text: "VITA EXTRA!", color: "#ffb03a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function die(by) {
    if (state !== "play") return;
    lives--; lastBy = by; sfx.die();
    burst(P.x, P.y - 12, "#ffd2a0", 16, 120, 0.7);
    state = "dead"; stateT = 2;
  }
  // an enemy or a fire touched the boy: the skateboard takes the blow if he has one
  function hurt(by) {
    if (fairyT > 0 || P.safe > 0 || state !== "play") return;
    if (P.skate) { P.skate = false; P.safe = 1.2; sfx.lostBoard(); popups.push({ x: P.x, y: P.y - 34, text: "SKATEBOARD PERSO", color: "#ff8a5a", t: 0 }); P.vy = -300; return; }
    die(by);
  }
  function levelDone() {
    const b = Math.round(vit) * 20 + 1000 * level;
    addScore(b);
    message = { text: "ISOLA SUPERATA!", sub: `vitalità ${Math.round(vit)} × 20 + ${(1000 * level).toLocaleString("it-IT")}`, t: 0 };
    sfx.clear(); state = "clear"; stateT = 2.8;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · isola ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);

    } else if (e.kind === "rana") {

      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(-5, -13, 3, 0, TAU); ctx.arc(3, -13, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-6, -14, 2, 2); ctx.fillRect(2, -14, 2, 2);
    } else if (e.kind === "ape") {
      ctx.fillStyle = "rgba(255,255,255,0.7)"; const f = Math.sin(clock * 40) * 3; ctx.beginPath(); ctx.ellipse(-2, -7 - f, 5, 3, -0.4, 0, TAU); ctx.ellipse(3, -7 - f, 5, 3, 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-3, -6, 2, 12); ctx.fillRect(2, -6, 2, 12); ctx.fillRect(-10, -1, 3, 2);
    } else if (e.kind === "ragno") {
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, e.top - e.y); ctx.stroke();
      ctx.strokeStyle = "#2a1a2a"; ctx.lineWidth = 1.5; for (let i = -1; i <= 1; i += 2) for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(i * 11, -4 + k * 5); ctx.stroke(); }
      ctx.fillStyle = "#3a2a3a"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill(); ctx.fillStyle = "#ff3a3a"; ctx.fillRect(-3, -2, 2, 2); ctx.fillRect(1, -2, 2, 2);
    } else {
      ctx.fillStyle = "#3a8a6a"; ctx.beginPath(); ctx.ellipse(0, -2, 10, 3, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-4, -12, 5, 9, 0, 0, TAU); ctx.fill(); ctx.fillStyle = "#ff3a3a"; ctx.fillRect(-7, -17, 2, 2); ctx.fillRect(-3, -17, 2, 2);
      if (Math.sin(clock * 6 + e.x) > 0.5) { ctx.fillStyle = "#ff3a5a"; ctx.fillRect(-12, -12, 4, 1); }
    }
    ctx.restore();
  }
  function drawBoy() {
    if (P.safe > 0 && Math.floor(clock * 12) % 2) return;
    const x = P.x - camX, y = P.y;
    ctx.save(); ctx.translate(x, y); ctx.scale(P.face, 1);
    if (P.skate) { ctx.fillStyle = "#e83a3a"; ctx.fillRect(-11, -4, 22, 3); ctx.fillStyle = "#3a3a3a"; ctx.beginPath(); ctx.arc(-7, -1, 2, 0, TAU); ctx.arc(7, -1, 2, 0, TAU); ctx.fill(); ctx.translate(0, -4); }
    const run = P.ground && !P.skate ? Math.sin(P.step) * 4 : 0;
    ctx.fillStyle = "#f0c8a0"; ctx.fillRect(-4, -9, 3, 8 + (P.ground ? 0 : -3)); ctx.fillRect(1, -9, 3, 8);
    ctx.save(); ctx.translate(-2.5, -9); ctx.rotate(run * 0.08); ctx.fillStyle = "#f0c8a0"; ctx.fillRect(-1.5, 0, 3, 9); ctx.restore();
    ctx.save(); ctx.translate(2.5, -9); ctx.rotate(-run * 0.08); ctx.fillStyle = "#f0c8a0"; ctx.fillRect(-1.5, 0, 3, 9); ctx.restore();
    ctx.fillStyle = "#3aa83a"; ctx.fillRect(-5, -12, 10, 5);
    ctx.fillStyle = "#f0c8a0"; ctx.fillRect(-4, -20, 8, 9);
    ctx.beginPath(); ctx.arc(1, -24, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.arc(1, -27, 6, Math.PI, 0); ctx.fill(); ctx.fillRect(-5, -28, 3, 5);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(4, -25, 1.5, 2);
    if (P.axe) { ctx.fillStyle = "#8a5a2a"; ctx.fillRect(4, -18, 2, 8); ctx.fillStyle = "#c8c8d8"; ctx.fillRect(3, -19, 5, 3); }
    ctx.restore();
    if (fairyT > 0) { const a = clock * 4; ctx.fillStyle = Math.floor(clock * 8) % 2 ? "#ff9ae8" : "#ffffff"; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 16, y - 20 + Math.sin(a) * 8, 3, 0, TAU); ctx.fill(); }
    if (melT > 0) { const mx = x + Math.sin(clock * 3) * 10, my = y - 46; ctx.fillStyle = "#7a3ab8"; ctx.beginPath(); ctx.ellipse(mx, my, 6, 9, 0.3, 0, TAU); ctx.fill(); ctx.fillStyle = "#3a8a2a"; ctx.fillRect(mx - 3, my - 11, 6, 3); }
  }
  function drawHud() {
    ctx.fillStyle = "rgba(10,30,50,0.85)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#a8c8d8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ffb03a"; ctx.font = "900 10px system-ui"; ctx.fillText(`ISOLA ${level}`, x0 + 80, 21);
    // vitality, in blocks like the old cabinets
    const bx = x0 + 145, n = 20, f = vit / VMAX;
    ctx.fillStyle = "#ffffff"; ctx.font = "800 8px system-ui"; ctx.fillText("VITALITÀ", bx, 7);
    for (let i = 0; i < n; i++) { ctx.fillStyle = i / n < f ? (f < 0.25 ? (Math.floor(clock * 6) % 2 ? "#ff3a3a" : "#ff8a5a") : melT > 0 ? "#b87ae8" : "#ffd23a") : "#2a3a4a"; ctx.fillRect(bx + i * 6, 13, 5, 9); }
    let ix = bx + n * 6 + 8;
    if (P.axe) { ctx.fillStyle = "#8a5a2a"; ctx.fillRect(ix + 4, 8, 2, 13); ctx.fillStyle = "#c8c8d8"; ctx.fillRect(ix, 8, 8, 4); ix += 16; }
    if (P.skate) { ctx.fillStyle = "#e83a3a"; ctx.fillRect(ix, 16, 16, 3); ctx.fillStyle = "#3a3a3a"; ctx.fillRect(ix + 2, 19, 3, 3); ctx.fillRect(ix + 11, 19, 3, 3); ix += 22; }
    // progress along the island
    ctx.fillStyle = "#2a3a4a"; ctx.fillRect(ix, 12, 60, 4); ctx.fillStyle = "#7ae4ff"; ctx.fillRect(ix + 60 * clamp(P.x / LEN, 0, 1) - 1.5, 9, 3, 10);
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const cx = lx - i * 14; ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(cx, 15, 5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.arc(cx, 13, 5, Math.PI, 0); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!segs.length) { level = 3; buildLevel(); level = 1; P = { x: 300, y: 300, face: 1, step: 0, ground: true, safe: 0 }; }
    drawBack();
    drawGround();
    for (const e of eggs) { if (e.gone) continue; const x = e.x - camX; if (x < -20 || x > W + 20) continue; ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x, e.y - 10, 8, 10, 0, 0, TAU); ctx.fill(); ctx.fillStyle = "#e83a8a"; ctx.beginPath(); ctx.arc(x - 3, e.y - 13, 2, 0, TAU); ctx.arc(x + 3, e.y - 7, 2, 0, TAU); ctx.arc(x + 2, e.y - 15, 1.5, 0, TAU); ctx.fill(); }
    for (const f of fruits) if (!f.gone) drawFruit(f);
    for (const e of enemies) drawEnemy(e);
    for (const a of axes) { ctx.save(); ctx.translate(a.x - camX, a.y); ctx.rotate(a.rot); ctx.fillStyle = "#8a5a2a"; ctx.fillRect(-1, -6, 2, 12); ctx.fillStyle = "#c8c8d8"; ctx.fillRect(-4, -7, 7, 4); ctx.restore(); }
    if (state !== "menu" && !(state === "dead" && Math.floor(clock * 6) % 2 === 0)) drawBoy();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - camX - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#0a1e32"; ctx.strokeText(p.text, p.x - camX, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - camX, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 120, W, 56);
      ctx.textAlign = "center"; ctx.font = "italic 900 24px system-ui"; ctx.fillStyle = "#ffb03a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0a1e32"; ctx.strokeText(message.text, W / 2, 147); ctx.fillText(message.text, W / 2, 147);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.fillText(message.sub, W / 2, 166); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 18px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = lastBy === "buca" ? "CADUTO NELLA BUCA!" : lastBy === "la fame" ? "SENZA FORZE: SERVIVA FRUTTA!" : `PRESO DA ${lastBy.toUpperCase()}!`;
      ctx.strokeText(t, W / 2, 210); ctx.fillText(t, W / 2, 210);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="isola-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ping Elettronico</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f4f6ee;
    --muted: #c8c8c8;
    --pink: #ffffff;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #3a3a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: up and down moves the paddle */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 210, 58, 0.6); background: radial-gradient(circle, rgba(255,210,58,0.14), rgba(255,210,58,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 210, 58, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(0, 0, 0, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 0 0 18px rgba(255,255,255,0.55); font-family: monospace; }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #000; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #888; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TOP = 28;
  const Y0 = TOP + 14, Y1 = H - 10, LX = 52, RX = 588, PW = 8, B = 8, TARGET = 7;
  // the machines of the tournament, each with its own twist
  const FOES = [
    { name: "PING 72", rule: "classica", desc: "le regole del 1972", speed: 0.82, react: 0.23, err: 17 },
    { name: "TELE-SPORT", rule: "veloce", desc: "la pallina parte più veloce", speed: 0.88, react: 0.2, err: 14 },
    { name: "ODISSEA", rule: "muro", desc: "un muro mobile in mezzo al campo", speed: 0.93, react: 0.18, err: 12 },
    { name: "VIDEO-DUO", rule: "doppia", desc: "due palline in gioco", speed: 0.97, react: 0.16, err: 10 },
    { name: "MINI-MAX", rule: "piccole", desc: "racchette più corte", speed: 1.02, react: 0.14, err: 8 },
    { name: "SUPREMO", rule: "tutto", desc: "tutto insieme!", speed: 1.06, react: 0.12, err: 7 },
  ];
  const DIGITS = ["1111110", "0110000", "1101101", "1111001", "0110011", "1011011", "1011111", "1110000", "1111111", "1111011"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "puoi perdere una partita · macchine più lente · pallina più calma", lives: 2, foe: 0.86, ball: 0.88 },
    normale:   { label: "NORMALE",   color: "#ffffff", desc: "alla prima partita persa il torneo finisce", lives: 1, foe: 1, ball: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "una sola partita · macchine più svelte e precise · pallina più veloce", lives: 1, foe: 1.12, ball: 1.12 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "ping-difficulty";
  const bestKey = (id) => `ping-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  // the three famous blips: paddle, wall, point
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.05, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t); gain.gain.setValueAtTime(vol, t + dur * 0.8); gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + dur + 0.02);
  }
  const sfx = {
    paddle: () => beep(459, 0.035),
    wall: () => beep(226, 0.017),
    point: () => beep(490, 0.26),
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, 0.1, "square", 0.04, i * 0.09)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.18, "square", 0.04, i * 0.15)),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 1, round = 1, bestCache = 0, pts = [0, 0], foe = null, won = false;
  let pads = [], balls = [], wall = null, message = null, popups = [], rally = 0, bestRally = 0;
  const keys = { up: false, down: false };
  const stick = { x: 0, y: 0 };
  const AI = { you: null, cpu: null };

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "point", "end"].includes(state);
  function foeFor(n) {
    const f = FOES[(n - 1) % FOES.length], lap = Math.floor((n - 1) / FOES.length), k = 1 + 0.08 * lap;
    return { ...f, speed: Math.min(1.15, f.speed * diff.foe * k), react: Math.max(0.08, f.react / diff.foe / k), err: f.err / diff.foe / k, lap };
  }
  const has = (r) => foe && (foe.rule === r || foe.rule === "tutto");
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; round = 1; bestRally = 0;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginMatch();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginMatch() {
    foe = foeFor(round);
    const ph = has("piccole") ? 30 : 46;
    pads = [{ x: LX, y: (Y0 + Y1) / 2, h: ph, v: 0 }, { x: RX, y: (Y0 + Y1) / 2, h: ph, v: 0 }];
    AI.cpu = mkAI(1, foe);
    pts = [0, 0]; balls = []; popups = []; rally = 0;
    wall = has("muro") ? { y: (Y0 + Y1) / 2, h: 54, v: 70 } : null;
    message = { text: `PARTITA ${round} · ${foe.name}`, sub: `${foe.desc} · si vince a ${TARGET}`, t: 0, long: true };
    state = "intro"; stateT = 2.4;
  }
  function serve(toward) {
    const sp = (has("veloce") ? 330 : 260) * diff.ball * (1 + 0.05 * foe.lap);
    const a = rnd(-0.5, 0.5);
    balls.push({ x: W / 2, y: rnd(Y0 + 60, Y1 - 60), vx: Math.cos(a) * sp * toward, vy: Math.sin(a) * sp, sp, wait: 0.7, trail: [] });
  }
  function startRally(toward) {
    balls = []; rally = 0;
    serve(toward);
    if (has("doppia")) { serve(-toward); balls[1].wait = 1.6; }
    state = "play";
  }
  function addScore(n, x, y, text) { score += n; if (x !== undefined) popups.push({ x, y, text: text || `+${n}`, t: 0 }); }
  // a ball got past a paddle: side w scores
  function pointTo(w, ball) {
    pts[w]++; sfx.point();
    if (window.__pts) window.__pts.push([round, w, rally]);
    if (w === 0) { const p = 100 * round, rb = Math.min(20, rally) * 10 * round; addScore(p + rb, W / 2 + 120, 120, rally >= 6 ? `+${p} · scambio da ${rally} +${rb}` : `+${p}`); }
    balls = balls.filter((b) => b !== ball);
    const [a, b] = pts;
    if (a >= TARGET || b >= TARGET) {
      won = a > b; state = "end"; stateT = 3;
      if (won) { const bonus = 1000 * round + 200 * (a - b) * round; score += bonus; message = { text: "PARTITA VINTA!", sub: `${a} a ${b} contro ${foe.name} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true }; sfx.win(); }
      else { lives--; message = { text: "PARTITA PERSA", sub: `${a} a ${b} · ${lives > 0 ? "hai un'altra possibilità" : "il torneo finisce qui"}`, t: 0, long: true }; sfx.lose(); }
      return;
    }
    // with two balls in play, the rally goes on until the last one is gone
    if (!balls.length) { state = "point"; stateT = 1; rally = 0; serveTo = w === 0 ? 1 : -1; }
  }
  let serveTo = 1;
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">TORNEO FINITO</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${round > 1 ? `${round - 1} ${round - 1 === 1 ? "partita vinta" : "partite vinte"}` : "nessuna partita vinta"} · scambio più lungo ${bestRally} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PING ELETTRONICO</h1>
       <p>Il gioco da cui sono nate le sale giochi: una racchetta, una pallina, un avversario. Ribatti la pallina e falla passare oltre la racchetta della macchina. Dove la colpisci decide l'angolo: al centro va dritta, sui bordi parte storta. A ogni colpo la pallina va più forte. Batti sei macchine, ognuna con il suo trucco!</p>
       <div class="pts">
         <span><b>Macchine</b></span><span>Ping 72 · Tele-Sport (veloce) · Odissea (muro in mezzo) · Video-Duo (due palline) · Mini-Max (racchette corte) · Supremo (tutto)</span>
         <span><b>Punti</b></span><span>punto 100 · scambi lunghi fino a 200 in più · partita vinta 1.000 e 200 per punto di scarto · dalla 2ª partita tutto vale di più</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta su e giù per muovere la racchetta</p>`
         : `<p class="muted help">Frecce ↑ ↓ o W S per muovere la racchetta · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>SERVIZIO!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const f = (v) => { const a = Math.abs(v) / max; return a < 0.12 ? 0 : Math.sign(v) * Math.min(1, (a - 0.12) / 0.6); };
    stick.x = f(dx); stick.y = f(dy);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- The machine ----------
  function mkAI(side, prm) { return { side, prm, t: 0, ty: (Y0 + Y1) / 2, off: 0 }; }
  // where a ball will cross the paddle's line, bouncing off the walls (the wall in the middle is ignored)
  function intercept(b, x) {
    if ((x - b.x) / b.vx < 0) return null;
    const t = (x - b.x) / b.vx, span = Y1 - Y0 - B;
    let y = b.y + b.vy * t - Y0 - B / 2;
    y = ((y % (2 * span)) + 2 * span) % (2 * span); if (y > span) y = 2 * span - y;
    return { y: y + Y0 + B / 2, t };
  }
  function think(ai, pad, dt) {
    ai.t -= dt;
    if (ai.t <= 0) {
      ai.t = ai.prm.react;
      let best = null;
      for (const b of balls) { if (b.wait > 0) continue; const ic = intercept(b, pad.x); if (ic && (!best || ic.t < best.t)) { best = ic; best.sp = b.sp; } }
      if (best) { if (!ai.aimed || Math.abs(best.y - ai.base) > 30) { ai.off = rnd(-1, 1) * ai.prm.err * Math.max(1, best.sp / 300); ai.base = best.y; ai.aimed = true; } ai.ty = best.y + ai.off; }
      else { ai.ty = (Y0 + Y1) / 2; ai.aimed = false; }
    }
    const d = ai.ty - pad.y;
    return Math.abs(d) < 3 ? 0 : clamp(d / 14, -1, 1) * ai.prm.speed;
  }

  // ---------- Update ----------
  function movePad(p, ctl, dt) {
    p.v = ctl * 320;
    p.y = clamp(p.y + p.v * dt, Y0 + p.h / 2, Y1 - p.h / 2);
  }
  function updateBall(b, dt) {
    if (b.wait > 0) { b.wait -= dt; return; }
    b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 5) b.trail.shift();
    const px = b.x;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < Y0 + B / 2) { b.y = Y0 + B / 2; b.vy = Math.abs(b.vy); sfx.wall(); }
    if (b.y > Y1 - B / 2) { b.y = Y1 - B / 2; b.vy = -Math.abs(b.vy); sfx.wall(); }
    // the moving wall in the middle
    if (wall && Math.abs(b.x - W / 2) < 5 + B / 2 && Math.abs(b.y - wall.y) < wall.h / 2 + B / 2 && Math.sign(b.vx) === Math.sign(b.x - px) && Math.abs(px - W / 2) >= 5 + B / 2 - 0.5) { b.vx = -b.vx; b.x = px; sfx.wall(); }
    // the paddles: the spot hit decides the angle, as on the original (eight segments)
    for (const [i, p] of pads.entries()) {
      const face = i === 0 ? p.x + PW / 2 : p.x - PW / 2, dir = i === 0 ? 1 : -1;
      if (Math.sign(b.vx) === -dir && ((dir > 0 && px - B / 2 >= face - 1 && b.x - B / 2 < face) || (dir < 0 && px + B / 2 <= face + 1 && b.x + B / 2 > face))) {
        const off = (b.y - p.y) / (p.h / 2 + B / 2);
        if (Math.abs(off) <= 1) {
          const seg = Math.min(3, Math.floor(Math.abs(off) * 4)) * Math.sign(off);
          const ang = seg * 0.3 + (seg === 0 ? rnd(-0.08, 0.08) : 0);
          b.sp = Math.min(820 * diff.ball, b.sp + 32);
          b.vx = Math.cos(ang) * b.sp * dir; b.vy = Math.sin(ang) * b.sp;
          b.x = face + dir * B / 2;
          rally++; bestRally = Math.max(bestRally, rally);
          sfx.paddle();
          if (i === 0) addScore(10);
        }
      }
    }
    if (b.x < -10) pointTo(1, b);
    else if (b.x > W + 10) pointTo(0, b);
  }
  function update(dt) {
    clock += dt;
    if (window.__bot) window.__bot(dt);
    for (const p of popups) { p.t += dt; p.y -= 16 * dt; }
    popups = popups.filter((p) => p.t < 1.4);
    if (message) { message.t += dt; if (message.t > (message.long ? 3 : 2)) message = null; }
    let you = clamp((keys.down ? 1 : 0) - (keys.up ? 1 : 0) + stick.y, -1, 1);
    if (window.__auto && AI.you) you = think(AI.you, pads[0], dt);
    if (state === "intro") { stateT -= dt; if (stateT <= 0) startRally(Math.random() < 0.5 ? -1 : 1); return; }
    if (state === "end") { stateT -= dt; if (stateT <= 0) { if (won) { round++; beginMatch(); } else if (lives > 0) beginMatch(); else gameOver(); } return; }
    if (state === "point") { stateT -= dt; movePad(pads[0], you, dt); if (stateT <= 0) startRally(serveTo); return; }
    if (state !== "play") return;
    movePad(pads[0], you, dt);
    movePad(pads[1], think(AI.cpu, pads[1], dt), dt);
    if (wall) { wall.y += wall.v * dt; if (wall.y < Y0 + 60 || wall.y > Y1 - 60) wall.v = -wall.v; }
    for (const b of [...balls]) { updateBall(b, dt); if (state !== "play") return; }
  }

  // ---------- Drawing ----------
  // the big blocky score digits, segment by segment
  function digit(n, x, y, s) {
    const seg = DIGITS[n], t = s * 0.22;
    const R = (a, b, w, h) => ctx.fillRect(x + a * s, y + b * s, w, h);
    if (seg[0] === "1") R(0, 0, s, t); if (seg[1] === "1") R(1, 0, -t, s); if (seg[2] === "1") R(1, 1, -t, s);
    if (seg[3] === "1") R(0, 2, s, -t); if (seg[4] === "1") R(0, 1, t, s); if (seg[5] === "1") R(0, 0, t, s); if (seg[6] === "1") R(0, 1, s, t * 0.5 + 1);
  }
  function number(v, x, y, s) { const str = String(v); str.split("").forEach((c, i) => digit(+c, x + i * s * 1.4 - (str.length - 1) * s * 0.7, y, s)); }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!pads.length) { foe = foeFor(1); pads = [{ x: LX, y: 170, h: 46, v: 0 }, { x: RX, y: 230, h: 46, v: 0 }]; balls = [{ x: 380, y: 200, vx: 1, vy: 0, wait: 0, trail: [] }]; }
    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff"; ctx.shadowColor = "rgba(255,255,255,0.7)"; ctx.shadowBlur = 6;
    // walls and the dashed net
    ctx.fillRect(20, Y0 - 6, W - 40, 6); ctx.fillRect(20, Y1, W - 40, 6);
    for (let y = Y0 + 4; y < Y1; y += 16) ctx.fillRect(W / 2 - 2, y, 4, 8);
    // the score
    number(pts[0], W / 2 - 70, Y0 + 12, 22); number(pts[1], W / 2 + 70 - 22, Y0 + 12, 22);
    for (const p of pads) ctx.fillRect(p.x - PW / 2, p.y - p.h / 2, PW, p.h);
    if (wall) ctx.fillRect(W / 2 - 5, wall.y - wall.h / 2, 10, wall.h);
    for (const b of balls) {
      if (b.wait > 0 && Math.floor(b.wait * 8) % 2) continue;
      ctx.globalAlpha = 0.25; for (const t of b.trail) ctx.fillRect(t.x - B / 2, t.y - B / 2, B, B); ctx.globalAlpha = 1;
      ctx.fillRect(b.x - B / 2, b.y - B / 2, B, B);
    }
    ctx.shadowBlur = 0;
    // the screen's scanlines
    ctx.fillStyle = "rgba(0,0,0,0.18)"; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4); ctx.textAlign = "center"; ctx.font = "700 11px monospace"; ctx.fillStyle = "#ffffff"; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    // the top bar
    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, W, TOP - 4);
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = "700 11px monospace"; ctx.fillStyle = "#ffffff";
    const x0 = touchMode ? 130 : 20;
    ctx.fillText(`PUNTI ${String(score).padStart(6, "0")}`, x0, 12);
    ctx.fillStyle = "#9a9a9a"; ctx.fillText(`REC ${String(Math.max(bestCache, score)).padStart(6, "0")}`, x0 + 140, 12);
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "right"; ctx.fillText(`${round}. ${foe ? foe.name : ""}${lives > 1 ? " ♥" : ""}`, touchMode ? W - 60 : W - 20, 12);
    ctx.textBaseline = "alphabetic";
    if (rally >= 5 && state === "play") { ctx.textAlign = "center"; ctx.font = "700 10px monospace"; ctx.fillStyle = "#9a9a9a"; ctx.fillText(`SCAMBIO ${rally}`, W / 2 + 90, H - 16); }
    if (message) {
      const life = message.long ? 3 : 2;
      ctx.globalAlpha = Math.min(1, (life - message.t) * 2);
      ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(W / 2 - 220, 150, 440, 56);
      ctx.textAlign = "center"; ctx.font = "900 20px monospace"; ctx.fillStyle = "#ffffff"; ctx.fillText(message.text, W / 2, 174);
      if (message.sub) { ctx.font = "700 11px monospace"; ctx.fillStyle = "#c8c8c8"; ctx.fillText(message.sub, W / 2, 194); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="ping-best-" data-kind="score"></script>

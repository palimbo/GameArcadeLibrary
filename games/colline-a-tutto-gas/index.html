<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Colline a Tutto Gas</title>
<style>
  :root {
    --bg: #0a1a10;
    --fg: #f4f6ee;
    --muted: #d0f0c8;
    --pink: #ff5a3a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a6a3a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 26, 16, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a1408, 0 0 22px rgba(255,90,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #fff4e8; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #a8301a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const S = 28;                 // pixels per metre
  const ZLEN = 400;             // metres per land
  // the lands, one after the other: gravity, grip, how tall the hills are and how rough the ground is
  const ZONES = [
    { name: "CAMPAGNA", g: 9.8, mu: 1, amp: 1, rough: 0.05, sky: [[110, 190, 250], [215, 240, 255]], ground: [122, 84, 50], top: [106, 190, 74], hill: [150, 205, 140], decor: "albero" },
    { name: "BOSCO", g: 9.8, mu: 0.95, amp: 1.2, rough: 0.16, sky: [[90, 160, 215], [200, 230, 220]], ground: [92, 66, 44], top: [56, 140, 62], hill: [84, 150, 100], decor: "pino" },
    { name: "DESERTO", g: 9.8, mu: 0.8, amp: 1.5, rough: 0.03, sky: [[250, 170, 90], [255, 228, 170]], ground: [200, 150, 84], top: [236, 196, 120], hill: [226, 170, 110], decor: "cactus" },
    { name: "NEVE", g: 9.8, mu: 0.5, amp: 1.05, rough: 0.06, sky: [[150, 190, 235], [232, 242, 255]], ground: [150, 170, 200], top: [248, 252, 255], hill: [200, 218, 240], decor: "abete" },
    { name: "LUNA", g: 3.6, mu: 0.9, amp: 1.8, rough: 0.12, sky: [[6, 6, 22], [30, 30, 60]], ground: [110, 110, 126], top: [176, 176, 192], hill: [70, 70, 92], decor: "roccia" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "il serbatoio dura di più e le taniche sono vicine", burn: 0.85, gap: 0.9, amp: 0.9 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "le colline di sempre", burn: 1, gap: 1, amp: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "colline più alte, benzina più rara", burn: 1.12, gap: 1.1, amp: 1.15 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "tuttogas-difficulty";
  const bestKey = (id) => `tuttogas-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    touchEl.style.display = "none";
    wrapEl.style.paddingBottom = "0";
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, noiseBuf = null, engine = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q = 1, delay = 0, slide = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  // the engine: one voice that follows the revs, quiet when the game is not running
  function engineSound(revs, on) {
    if (!audioCtx) return;
    if (!engine) {
      const o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      o.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g).connect(audioCtx.destination); o.start(); o2.start();
      engine = { o, o2, g };
    }
    const t = audioCtx.currentTime, hz = 46 + revs * 95;
    engine.o.frequency.setTargetAtTime(hz, t, 0.06); engine.o2.frequency.setTargetAtTime(hz * 0.5, t, 0.06);
    engine.g.gain.setTargetAtTime(on ? 0.022 + revs * 0.02 : 0, t, 0.08);
  }
  const sfx = {
    coin: (n) => { const f = 988 * Math.pow(1.06, Math.min(10, n)); beep(f, 0.06, "square", 0.03); beep(f * 1.5, 0.1, "square", 0.025, 0, 0.05); },
    fuel: () => { arp([392, 523, 659, 784], 0.06, 0.14, "triangle", 0.05); noise(0.35, 0.04, 900, 0.8, 0, 600); },
    land: (v) => { noise(0.12, Math.min(0.12, 0.03 + v * 0.012), 260, 0.7); beep(90, 0.1, "sine", Math.min(0.1, 0.03 + v * 0.01), -30); },
    flip: () => arp([659, 784, 988, 1319], 0.06, 0.16, "square", 0.045),
    air: () => beep(880, 0.12, "triangle", 0.04, 440),
    low: () => beep(520, 0.09, "square", 0.035),
    zone: () => arp([523, 659, 784, 1047], 0.08, 0.18, "triangle", 0.045),
    crash: () => { noise(0.5, 0.14, 500, 0.5, 0, -300); beep(110, 0.5, "sawtooth", 0.08, -70); },
    end: () => arp([392, 330, 262, 196], 0.16, 0.26, "triangle", 0.05),
  };

  // ---------- The land ----------
  let diff = null;
  const zoneAt = (x) => Math.max(0, Math.floor(x / ZLEN));
  // a value of the land under x, sliding into the next land over its last forty metres
  function blend(x, f) {
    const i = zoneAt(x), t = smooth((x - (i + 1) * ZLEN + 40) / 40);
    const a = f(ZONES[i % ZONES.length], i), b = f(ZONES[(i + 1) % ZONES.length], i + 1);
    return a + (b - a) * t;
  }
  const lapAmp = (i) => Math.min(1.6, 1 + 0.18 * Math.floor(i / ZONES.length));
  function ground(x) {
    if (x <= 0) return 0;
    const amp = blend(x, (z, i) => z.amp * lapAmp(i)) * diff.amp * smooth(x / 30) * Math.min(1, 0.45 + x / 500);
    const rough = blend(x, (z) => z.rough);
    return amp * (Math.sin(x * 0.11 + 1) * 1.2 + Math.sin(x * 0.047) * 2.2 + Math.sin(x * 0.19 + 2) * 0.55 + Math.sin(x * 0.021 + 4) * 1.6)
      + rough * (Math.sin(x * 1.7) + Math.sin(x * 2.9 + 1) * 0.6) * smooth(x / 30);
  }
  const slope = (x) => (ground(x + 0.06) - ground(x - 0.06)) / 0.12;

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, bonus = 0, coins = 0, coinRun = 0, coinT = 0, fuel = 100, items = [], parts = [], popups = [], message = null;
  let genX = 0, nextFuel = 0, maxX = 0, zone = 0, airT = 0, airRot = 0, flips = 0, stuckT = 0, ending = 0, endWhy = "", lowT = 0, camX = 0, camY = 0, shake = 0, wasAir = false;
  const car = { x: 3, y: 1, vx: 0, vy: 0, a: 0, w: 0, wheels: [{ lx: -0.86, comp: 0, spin: 0, on: false }, { lx: 0.86, comp: 0, spin: 0, on: false }], contacts: 0 };
  const input = { gas: false, brake: false };
  const touches = new Map();
  const isPlaying = () => state === "play";
  const metres = () => Math.max(0, Math.floor(maxX - 3));
  const total = () => metres() * 10 + bonus;
  const R = 0.4, LMAX = 0.42, LY = -0.18, K = 130, D = 13, INERTIA = 1.35, VMAX = 17, DRIVE = 6.2;
  const BODY = [[1.28, -0.12], [1.28, 0.28], [-1.28, 0.34], [-1.28, -0.12]], HEAD = [-0.18, 1.02];

  function populate() {
    while (genX < car.x + 60) {
      genX += rnd(26, 52);
      const n = 4 + Math.floor(Math.random() * 5), kind = Math.random() < 0.12 ? 100 : Math.random() < 0.3 ? 25 : 5;
      const arc = Math.random() < 0.3;
      for (let i = 0; i < n; i++) { const x = genX + i * 1.25; items.push({ x, y: ground(x) + 0.95 + (arc ? Math.sin(i / (n - 1) * Math.PI) * 1.8 : 0), kind: "moneta", val: kind }); }
      genX += n * 1.25;
    }
    while (nextFuel < car.x + 60) {
      items.push({ x: nextFuel, y: ground(nextFuel) + 0.75, kind: "tanica" });
      nextFuel += (120 + Math.min(140, nextFuel / 25)) * diff.gap * rnd(0.9, 1.1);
    }
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; bonus = 0; coins = 0; coinRun = 0; fuel = 100; items = []; parts = []; popups = []; genX = 14; nextFuel = 110 * diff.gap; maxX = 3; zone = 0; airT = 0; airRot = 0; flips = 0; stuckT = 0; ending = 0; lowT = 0; shake = 0; wasAir = false;
    Object.assign(car, { x: 3, y: ground(3) + 0.75, vx: 0, vy: 0, a: 0, w: 0, contacts: 0 });
    for (const wh of car.wheels) { wh.comp = 0; wh.spin = 0; }
    input.gas = input.brake = false; touches.clear();
    camX = car.x - 6; camY = car.y;
    populate();
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    message = { text: "A TUTTO GAS!", sub: "tieni le ruote per terra… o quasi", t: 0 };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function burst(x, y, n, col, sp = 3) {
    for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-1, 1) * sp, vy: rnd(0.2, 1.4) * sp, t: 0, life: rnd(0.3, 0.7), col, s: rnd(0.05, 0.12) });
  }
  function reward(text, pts, col = "#ffd23a") { bonus += pts; popups.push({ text: `${text} +${pts.toLocaleString("it-IT")}`, t: 0, col }); }

  // ---------- Physics ----------
  function physics(dt) {
    const zx = Math.max(0, car.x), g = blend(zx, (z) => z.g), mu = blend(zx, (z) => z.mu);
    const ca = Math.cos(car.a), sa = Math.sin(car.a);
    const gas = input.gas && fuel > 0, brake = input.brake;
    let fx = 0, fy = -g, tq = 0, contacts = 0, hard = false, headHit = false;
    // a force at a point of the car: it pushes, and it turns
    const push = (px, py, Fx, Fy) => { fx += Fx; fy += Fy; tq += (px - car.x) * Fy - (py - car.y) * Fx; };
    const velAt = (px, py) => [car.vx - car.w * (py - car.y), car.vy + car.w * (px - car.x)];
    for (const wh of car.wheels) {
      // the wheel hangs under its anchor: how far the ground pushes it back up is the spring
      const ax = car.x + ca * wh.lx - sa * LY, ay = car.y + sa * wh.lx + ca * LY;
      const wx = ax + sa * LMAX, wy = ay - ca * LMAX;
      const gh = ground(wx), pen = gh + R - wy;
      wh.on = pen > 0;
      wh.comp = clamp(pen, 0, LMAX + 0.12);
      if (!wh.on) { wh.spin += (gas ? 34 : brake ? -8 : wh.spin > 0 ? 0 : 0) * dt * (gas || brake ? 1 : 0) + 6 * dt; continue; }
      contacts++;
      const s = slope(wx), len = Math.hypot(1, s), nx = -s / len, ny = 1 / len, tx = 1 / len, ty = s / len;
      const [vx, vy] = velAt(wx, gh), vn = vx * nx + vy * ny, vt = vx * tx + vy * ty;
      const N = Math.max(0, K * pen - D * vn);
      let ft;
      if (gas) ft = Math.min(DRIVE, (VMAX - vt) * 5);
      else if (brake) ft = vt > 0.6 ? -DRIVE * 1.5 : Math.max(-DRIVE * 0.7, (-VMAX * 0.35 - vt) * 5);
      else ft = -vt * 0.35;
      ft = clamp(ft, -mu * N, mu * N);
      push(wx, gh, nx * N + tx * ft, ny * N + ty * ft);
      wh.spin += vt / R * dt + (gas && Math.abs(ft) >= mu * N - 0.01 ? 12 * dt : 0);
      if (gas && Math.abs(ft) >= mu * N - 0.01 && Math.random() < 0.3) parts.push({ x: wx - 0.3, y: gh + 0.05, vx: -rnd(1, 4), vy: rnd(0.5, 2.5), t: 0, life: 0.4, col: "ground", s: rnd(0.04, 0.09) });
    }
    // the body itself must not sink into the ground; the driver's head must not touch it at all
    for (const [lx, ly] of [...BODY, HEAD]) {
      const px = car.x + ca * lx - sa * ly, py = car.y + sa * lx + ca * ly, gh = ground(px), pen = gh - py;
      if (pen <= 0) continue;
      if (ly === HEAD[1]) { headHit = true; continue; }
      hard = true;
      const s = slope(px), len = Math.hypot(1, s), nx = -s / len, ny = 1 / len, tx = 1 / len, ty = s / len;
      const [vx, vy] = velAt(px, gh), vn = vx * nx + vy * ny, vt = vx * tx + vy * ty;
      const N = Math.max(0, 320 * pen - 22 * vn), ft = clamp(-vt * 6, -0.7 * N, 0.7 * N);
      push(px, gh, nx * N + tx * ft, ny * N + ty * ft);
    }
    if (!contacts && !hard) tq += (gas ? 5.2 : 0) - (brake ? 5.2 : 0);   // in the air the pedals tip the car
    car.vx += fx * dt; car.vy += fy * dt; car.w += tq / INERTIA * dt;
    car.vx *= 1 - 0.03 * dt; car.vy *= 1 - 0.03 * dt; car.w *= 1 - (contacts ? 2.2 : 0.5) * dt;
    car.w = clamp(car.w, -9, 9);
    car.x += car.vx * dt; car.y += car.vy * dt; car.a += car.w * dt;
    if (car.x < 1.3) { car.x = 1.3; car.vx = Math.max(0, car.vx); }
    car.contacts = contacts + (hard ? 1 : 0);
    return headHit;
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 9 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1.5);
    shake = Math.max(0, shake - dt);
    if (!isPlaying()) { engineSound(0, false); return; }
    if (message) { message.t += dt; if (message.t > 2.6) message = null; }
    if (ending) {
      ending += dt;
      if (endWhy === "benzina") physics(dt);
      engineSound(0, false);
      if (ending > 1.6) gameOver();
      return;
    }
    const vyBefore = car.vy;
    const headHit = physics(dt);
    const speed = Math.hypot(car.vx, car.vy);
    engineSound(clamp((input.gas && fuel > 0 ? 0.35 : 0) + speed / VMAX * 0.65, 0, 1), true);
    if (headHit) { ending = 0.001; endWhy = "testa"; shake = 0.7; sfx.crash(); burst(car.x, car.y + 0.6, 22, "#ffffff", 5); return; }
    // jumps and somersaults
    if (!car.contacts) { airT += dt; airRot += car.w * dt; wasAir = true; }
    else if (wasAir) {
      wasAir = false;
      if (airT > 0.25) sfx.land(Math.abs(vyBefore));
      const n = Math.floor((Math.abs(airRot) + 0.9) / TAU);
      if (n > 0) { flips += n; reward(n > 1 ? `${n} CAPRIOLE!` : airRot > 0 ? "CAPRIOLA ALL'INDIETRO!" : "CAPRIOLA IN AVANTI!", 1000 * n); sfx.flip(); impresa("capriola"); }
      else if (airT > 1.1) { reward("IN VOLO!", Math.floor(airT * 10) * 20, "#7ad8ff"); sfx.air(); }
      airT = 0; airRot = 0;
    }
    // petrol
    fuel = Math.max(0, fuel - (input.gas ? 3.1 : 1.5) * diff.burn * dt);
    if (fuel < 20 && fuel > 0) { lowT -= dt; if (lowT <= 0) { sfx.low(); lowT = fuel < 10 ? 0.4 : 0.8; } }

    for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col === "ground" ? dirt : p.col; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.s * S, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawHud();
    drawPedals();
    ctx.textAlign = "center";
    popups.forEach((p, i) => { ctx.globalAlpha = clamp((1.5 - p.t) * 3, 0, 1); outlined(p.text, W / 2, 128 - p.t * 20 + i * 0, "900 15px system-ui", p.col, 4); });
    ctx.globalAlpha = 1;
    if (fuel < 20 && fuel > 0 && !ending && Math.floor(clock * 3) % 2) outlined("POCA BENZINA!", W / 2, 58, "900 13px system-ui", "#ff5a4a", 4);
    if (fuel <= 0 && !ending) outlined("SERBATOIO VUOTO", W / 2, 58, "900 13px system-ui", "#ff5a4a", 4);
    if (message) {
      ctx.globalAlpha = clamp((2.6 - message.t) * 2, 0, 1);
      outlined(message.text, W / 2, 88, "italic 900 28px system-ui", "#ff6a4a", 6);
      outlined(message.sub, W / 2, 108, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
    if (ending) outlined(endWhy === "testa" ? "CAPPOTTATO!" : "SENZA BENZINA", W / 2, 160, "italic 900 36px system-ui", "#ff5a4a", 8);
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="tuttogas-best-" data-kind="score"></script>

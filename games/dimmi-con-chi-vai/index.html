<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dimmi con chi vai</title>
<style>
  :root {
    --bg: #0d0822;
    --fg: #f1eeff;
    --muted: #a9a3cf;
    --cyan: #5fe3d6;
    --yellow: #ffd66b;
    --red: #ff6b7d;
    --pink: #d0b3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a1f55, 0 10px 40px rgba(0,0,0,0.6); cursor: pointer; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(241, 238, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(13, 8, 34, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 54px); font-weight: 900; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #2a1f6a, 0 0 22px rgba(208,179,255,0.35); text-wrap: balance; }
  #overlay h2 { font-size: clamp(24px, 7vw, 40px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(241,238,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #1a0a33; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #8a6fc0; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 600, TOP = 56, TAU = Math.PI * 2;
  const ACC = "#d0b3ff";
  const CLS = ["#ff6b7d", "#5fe3d6", "#ffd66b"];
  const CNAME = ["rosso", "verde acqua", "giallo"];
  const AREA = { x: 14, y: 66, w: 332, h: 328 }, CELL = 4, GW = 83, GH = 82;
  const ORDER = ["piano", "disco", "fascia", "settori", "anello", "onda", "regioni", "isole", "scacchi"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ee0a0", desc: "obiettivo 85% · tante domande · 4 errori concessi", target: 0.85, k: 1.6, extra: 4, lives: 4 },
    normale:   { label: "NORMALE",   color: "#ffd66b", desc: "obiettivo 88% · domande contate · 3 errori concessi", target: 0.88, k: 1.35, extra: 2, lives: 3 },
    difficile: { label: "DIFFICILE", color: "#ff6b7d", desc: "obiettivo 91% · poche domande · 3 errori concessi", target: 0.91, k: 1.15, extra: 1, lives: 3 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "vicini-difficulty";
  const bestKey = (id) => `vicini-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => n.toLocaleString("it-IT");
  const pc = (v) => `${Math.floor(v * 100)}%`;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio: soft tones ----------
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.05, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type, vol) => notes.forEach((f, i) => beep(f, d, type, vol, i * gap));
  const sfx = {
    pick: () => beep(520, 0.06, "sine", 0.035),
    step: (v) => beep(392 * Math.pow(1.09, v), 0.09, "triangle", 0.04),
    edge: () => beep(150, 0.08, "sine", 0.045),
    row: () => beep(880, 0.1, "sine", 0.03, 0.05),
    win: () => arp([523, 659, 784, 1047], 0.09, 0.35),
    perfect: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.4),
    fail: () => arp([392, 330, 277], 0.14, 0.35, "triangle", 0.05),
    lose: () => arp([392, 330, 277, 220], 0.16, 0.4, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, level = 0, bestCache = 0, cleared = 0, perfects = 0, lives = 0;
  let ref = 0, kind = "piano", nCls = 2, truth = null, truthGrid = null, labels = [], pred = null, acc = 0, par = 0, budget = 0, target = 0.92, cur = { x: 180, y: 230 }, kbd = false;
  let popups = [], message = null;
  const isPlaying = () => ["play", "levelup", "fail"].includes(state);
  const mapC = document.createElement("canvas"); mapC.width = GW; mapC.height = GH;
  const mctx = mapC.getContext("2d");
  const truC = document.createElement("canvas"); truC.width = GW; truC.height = GH;
  const tctx = truC.getContext("2d");
  const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const RGB = CLS.map(rgb);

  // ---------- The hidden map ----------
  function makeTruth(k) {
    const ang = rnd(0, TAU), cx = rnd(0.38, 0.62), cy = rnd(0.38, 0.62), ca = Math.cos(ang), sa = Math.sin(ang);
    if (k === "piano") { const c = rnd(-0.12, 0.12); return [2, (u, v) => ((u - 0.5) * ca + (v - 0.5) * sa > c ? 1 : 0)]; }
    if (k === "disco") { const r = rnd(0.22, 0.3); return [2, (u, v) => (Math.hypot(u - cx, v - cy) < r ? 1 : 0)]; }
    if (k === "fascia") { const w = rnd(0.11, 0.16), c = rnd(-0.1, 0.1); return [2, (u, v) => (Math.abs((u - 0.5) * ca + (v - 0.5) * sa - c) < w ? 1 : 0)]; }
    if (k === "anello") { const r1 = rnd(0.13, 0.18), r2 = r1 + rnd(0.13, 0.17); return [2, (u, v) => { const d = Math.hypot(u - 0.5, v - 0.5); return d > r1 && d < r2 ? 1 : 0; }]; }
    if (k === "settori") { const a0 = rnd(0, TAU), b = [a0, a0 + rnd(1.6, 2.4), a0 + rnd(3.8, 4.6)]; return [3, (u, v) => { let a = Math.atan2(v - cy, u - cx) - a0; a = ((a % TAU) + TAU) % TAU; return a < b[1] - a0 ? 0 : a < b[2] - a0 ? 1 : 2; }]; }
    if (k === "onda") { const A = rnd(0.12, 0.2), f = rnd(1, 1.8), ph = rnd(0, TAU); return [2, (u, v) => (v - 0.5 > A * Math.sin(TAU * f * u + ph) ? 1 : 0)]; }
    if (k === "regioni") { const s = Array.from({ length: 6 }, (_, i) => ({ x: rnd(0.08, 0.92), y: rnd(0.08, 0.92), c: i % 3 })); return [3, (u, v) => { let b = s[0], bd = 9; for (const q of s) { const d = (q.x - u) ** 2 + (q.y - v) ** 2; if (d < bd) { bd = d; b = q; } } return b.c; }]; }
    if (k === "isole") { const I = [{ x: rnd(0.2, 0.4), y: rnd(0.2, 0.8), r: rnd(0.17, 0.23), c: 1 }, { x: rnd(0.6, 0.8), y: rnd(0.2, 0.8), r: rnd(0.17, 0.23), c: 2 }]; return [3, (u, v) => { for (const q of I) if (Math.hypot(u - q.x, v - q.y) < q.r) return q.c; return 0; }]; }
    const p = rnd(0.5, 0.62);   // scacchi: a tilted chequerboard of four big squares
    return [2, (u, v) => { const x = (u - 0.5) * ca + (v - 0.5) * sa, y = -(u - 0.5) * sa + (v - 0.5) * ca; return (Math.floor(x / p + 10) + Math.floor(y / p + 10)) % 2; }];
  }
  const cellXY = (i) => ({ x: AREA.x + ((i % GW) + 0.5) * CELL, y: AREA.y + (Math.floor(i / GW) + 0.5) * CELL });
  const truthAt = (x, y) => truth((x - AREA.x) / AREA.w, (y - AREA.y) / AREA.h);
  // the classifier: every spot takes the colour of the nearest known spot
  function predict(L, out) {
    let ok = 0;
    for (let i = 0; i < GW * GH; i++) {
      const p = cellXY(i); let b = -1, bd = 1e18;
      for (let j = 0; j < L.length; j++) { const d = (L[j].x - p.x) ** 2 + (L[j].y - p.y) ** 2; if (d < bd) { bd = d; b = L[j].c; } }
      if (out) out[i] = b;
      if (b === truthGrid[i]) ok++;
    }
    return ok / (GW * GH);
  }
  // how few questions a sharp-eyed player needs: each time, the spot that helps most (on a coarser grid)
  function oracle() {
    const E = [], C = [];
    for (let y = AREA.y + 4; y < AREA.y + AREA.h; y += 8) for (let x = AREA.x + 4; x < AREA.x + AREA.w; x += 8) E.push({ x, y, t: truthAt(x, y), d: 1e18, c: -1 });
    for (let y = AREA.y + 6; y < AREA.y + AREA.h; y += 12) for (let x = AREA.x + 6; x < AREA.x + AREA.w; x += 12) C.push({ x, y, t: truthAt(x, y) });
    let ok = 0, n = 0; const L = [];
    while (n < 60) {
      let best = null, bg = -1e9;
      for (const c of C) {
        let g = 0;
        for (const e of E) { const d = (e.x - c.x) ** 2 + (e.y - c.y) ** 2; if (d < e.d) g += (c.t === e.t ? 1 : 0) - (e.c === e.t ? 1 : 0); }
        if (g > bg) { bg = g; best = c; }
      }
      // when no single question helps at once, ask where the map is wrong, as far as possible from what is known
      if (bg <= 0) {
        let bd = -1;
        for (const c of C) {
          let d1 = 1e18, pc1 = -1;
          for (const l of L) { const d = (l.x - c.x) ** 2 + (l.y - c.y) ** 2; if (d < d1) { d1 = d; pc1 = l.t; } }
          if (pc1 !== c.t && d1 > bd) { bd = d1; best = c; }
        }
      }
      L.push(best);
      n++;
      for (const e of E) { const d = (e.x - best.x) ** 2 + (e.y - best.y) ** 2; if (d < e.d) { e.d = d; e.c = best.t; } }
      ok = E.filter((e) => e.c === e.t).length / E.length;
      if (ok >= target) break;
    }
    return n;
  }
  // a good player who cannot see the map: spread the first questions, then ask on the borders between colours
  function reference(noise = 0) {
    const E = [], C = [];
    for (let y = AREA.y + 4; y < AREA.y + AREA.h; y += 8) for (let x = AREA.x + 4; x < AREA.x + AREA.w; x += 8) E.push({ x, y, t: truthAt(x, y), d: 1e18, c: -1 });
    for (let y = AREA.y + 6; y < AREA.y + AREA.h; y += 12) for (let x = AREA.x + 6; x < AREA.x + AREA.w; x += 12) C.push({ x, y });
    const L = [];
    while (L.length < 70) {
      let best = null, bs = -1;
      const explore = L.length < 3 || L.length % 5 === 4;
      for (const c of C) {
        let d1 = 1e18, c1 = -1;
        for (const l of L) { const d = (l.x - c.x) ** 2 + (l.y - c.y) ** 2; if (d < d1) { d1 = d; c1 = l.t; } }
        let d2 = 1e18;
        for (const l of L) if (l.t !== c1) d2 = Math.min(d2, (l.x - c.x) ** 2 + (l.y - c.y) ** 2);
        const a = Math.sqrt(d1), b = Math.sqrt(d2);
        const sc = (explore ? a : b - a < 14 ? a : -1) + Math.random() * (1 + noise);
        if (sc > bs) { bs = sc; best = c; }
      }
      if (!best || bs < 0) { best = C[rint(0, C.length - 1)]; }
      const t = truthAt(best.x, best.y);
      L.push({ x: best.x, y: best.y, t });
      for (const e of E) { const d = (e.x - best.x) ** 2 + (e.y - best.y) ** 2; if (d < e.d) { e.d = d; e.c = t; } }
      if (E.filter((e) => e.c === e.t).length / E.length >= target) break;
    }
    return L.length;
  }
  function paint(ctx2, grid, alpha) {
    const img = ctx2.createImageData(GW, GH), d = img.data;
    for (let i = 0; i < GW * GH; i++) { const c = grid[i]; if (c < 0) { d[i * 4 + 3] = 0; continue; } const q = RGB[c]; d[i * 4] = q[0]; d[i * 4 + 1] = q[1]; d[i * 4 + 2] = q[2]; d[i * 4 + 3] = alpha; }
    ctx2.putImageData(img, 0, 0);
  }
  function buildLevel() {
    kind = level < ORDER.length ? ORDER[level] : ORDER[rint(3, ORDER.length - 1)];
    target = diff.target;
    for (let round = 0; round < 6; round++) {
    for (let tries = 0; tries < 40; tries++) {
      [nCls, truth] = makeTruth(kind);
      truthGrid = new Int8Array(GW * GH);
      const cnt = [0, 0, 0];
      for (let i = 0; i < GW * GH; i++) { const p = cellXY(i); truthGrid[i] = truthAt(p.x, p.y); cnt[truthGrid[i]]++; }
      // no colour may be so common that a single question nearly wins
      if (cnt.slice(0, nCls).every((k) => k > GW * GH * Math.max(0.14, 1 - target - 0.02) && k < GW * GH * 0.72)) break;
    }
    const refs = [reference(), reference(), reference()].sort((x, y) => x - y);
    ref = refs[1];
    if (ref <= 40) break;      // a map that even a good player needs ages for: draw another
    }
    paint(tctx, truthGrid, 255);
    par = Math.min(oracle(), ref);
    budget = Math.max(ref + 1, Math.min(56, Math.ceil(ref * Math.max(1.1, diff.k - level * 0.03)) + Math.max(0, diff.extra - Math.floor(level / 4))));
    labels = []; pred = new Int8Array(GW * GH).fill(-1); acc = 0;
    paint(mctx, pred, 150);
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; level = 0; cleared = 0; perfects = 0; lives = diff.lives; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    beginLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginLevel() {
    buildLevel();
    state = "play";
    message = { text: `LIVELLO ${level + 1}`, sub: `${nCls} colori nascosti · ${budget} domande per arrivare al ${pc(target)}`, t: 0 };
  }
  function addScore(k, y, color, label = "") { score += k; popups.push({ text: `${label}+${nf(k)}`, x: W / 2, y, t: 0, color }); }
  function ask(x, y) {
    if (state !== "play" || labels.length >= budget) return;
    x = clamp(x, AREA.x + 1, AREA.x + AREA.w - 1); y = clamp(y, AREA.y + 1, AREA.y + AREA.h - 1);
    if (labels.some((l) => Math.hypot(l.x - x, l.y - y) < 5)) { sfx.edge(); return; }
    const before = acc;
    labels.push({ x, y, c: truthAt(x, y), pop: 1 });
    acc = predict(labels, pred);
    paint(mctx, pred, 150);
    sfx.step(Math.round((acc - before) * 30));
    if (acc >= target) win();
    else if (labels.length >= budget) lose();
  }
  function win() {
    const left = budget - labels.length, perfect = labels.length <= par;
    state = "levelup"; stateT = 3; cleared++;
    addScore(200 * (level + 1), 330, ACC);
    if (left > 0) addScore(60 * left, 308, "#ffd66b", `${left} ${left === 1 ? "domanda avanzata" : "domande avanzate"} · `);
    if (perfect) { perfects++; addScore(300, 286, "#5fe3d6", "come l'oracolo · "); sfx.perfect(); } else sfx.win();
    message = { text: "LA MAPPA È GIUSTA", sub: `${pc(acc)} con ${labels.length} domande · all'oracolo ne bastavano ${par}`, t: 0 };
  }
  function lose() {
    lives--;
    state = "fail"; stateT = 3.4;
    (lives > 0 ? sfx.fail : sfx.lose)();
    message = { text: "DOMANDE FINITE", sub: `${pc(acc)} su ${pc(target)}: ecco la mappa vera`, t: 0, bad: true };
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">MAPPA SBAGLIATA</h2>
       <p>Punteggio: <b>${nf(score)}</b> · ${cleared} ${cleared === 1 ? "mappa ricostruita" : "mappe ricostruite"}${perfects ? ` · ${perfects} come l'oracolo` : ""} · ${diff.label}</p>
       <p class="muted">Etichettare i dati costa, e molto. Per questo si scelgono gli esempi giusti da far etichettare: quelli sul confine, dove il modello è ancora incerto. Si chiama apprendimento attivo.</p>
       ${record ? "<p style='color:var(--yellow)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>RIPROVA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${nf(best)}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (state === "menu") buildLevel(); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>DIMMI CON CHI VAI</h1>
       <p>Sotto questa mappa ci sono regioni colorate, e non le vedi. Ogni tocco è una domanda: «di che colore è qui?». Il resto lo indovina un classificatore molto semplice, che dà a ogni punto il colore del punto noto più vicino: dimmi con chi vai e ti dirò chi sei. Con poche domande, messe nei posti giusti, la mappa deve diventare quasi tutta giusta.</p>
       <div class="pts">
         <span><b>Domande</b></span><span>tocca un punto della mappa per scoprirne il colore: sono contate</span>
         <span><b>Precisione</b></span><span>quanta parte della mappa il classificatore colora giusta; il livello finisce appena arriva all'obiettivo</span>
         <span><b>Confini</b></span><span>le domande nel mezzo di una regione ormai insegnano poco: quelle utili sono sui confini</span>
         <span><b>Punti</b></span><span>200 × livello · 60 per ogni domanda avanzata · 300 se ne usi quante l'oracolo</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tocca la mappa per fare una domanda</p>`
         : `<p class="muted help">Clicca la mappa · oppure frecce per il mirino e Invio · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>PRIMA MAPPA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (state !== "play") return;
    const mv = { arrowright: [1, 0], arrowleft: [-1, 0], arrowdown: [0, 1], arrowup: [0, -1] }[k];
    if (mv) { kbd = true; const s = e.shiftKey ? 2 : 8; cur.x = clamp(cur.x + mv[0] * s, AREA.x, AREA.x + AREA.w); cur.y = clamp(cur.y + mv[1] * s, AREA.y, AREA.y + AREA.h); }
    else if ((k === "enter" || k === " ") && !e.repeat) { kbd = true; ask(cur.x, cur.y); }
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  const toWorld = (e) => { const rc = canvas.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * W, y: (e.clientY - rc.top) / rc.height * H }; };
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state !== "play") return;
    const p = toWorld(e); kbd = false;
    if (p.x >= AREA.x && p.x <= AREA.x + AREA.w && p.y >= AREA.y && p.y <= AREA.y + AREA.h) ask(p.x, p.y);
  });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const p of popups) { p.t += dt; p.y -= 14 * dt; }
    popups = popups.filter((p) => p.t < 1.8);
    for (const l of labels) l.pop = Math.max(0, l.pop - dt * 3);
    if (message) { message.t += dt; if (message.t > (state === "play" ? 2.2 : 3)) message = null; }
    if (state === "levelup") { stateT -= dt; if (stateT <= 0) { level++; beginLevel(); } }
    else if (state === "fail") { stateT -= dt; if (stateT <= 0) { if (lives <= 0) gameOver(); else beginLevel(); } }
  }

  // ---------- Drawing ----------
  function drawMap() {
    const A = AREA, done = state === "levelup" || state === "fail";
    ctx.fillStyle = "#120b2c"; ctx.beginPath(); ctx.roundRect(A.x - 6, A.y - 4, A.w + 12, A.h + 8, 12); ctx.fill();
    ctx.imageSmoothingEnabled = false;
    if (state === "menu") { ctx.globalAlpha = 0.2; ctx.drawImage(truC, A.x, A.y, A.w, A.h); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true; return; }
    if (done) {
      // the true map, and the classifier's guess drawn in stripes on top: where they differ you see both
      ctx.drawImage(truC, A.x, A.y, A.w, A.h);
      ctx.save(); ctx.beginPath(); for (let y = A.y; y < A.y + A.h; y += 6) ctx.rect(A.x, y, A.w, 3); ctx.clip();
      ctx.globalAlpha = 0.9; ctx.drawImage(mapC, A.x, A.y, A.w, A.h); ctx.restore(); ctx.globalAlpha = 1;
    } else {
      ctx.drawImage(mapC, A.x, A.y, A.w, A.h);
      if (!labels.length) { ctx.fillStyle = "#a9a3cf"; ctx.font = "800 13px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("tocca dove vuoi: prima domanda", W / 2, A.y + A.h / 2); ctx.textBaseline = "alphabetic"; }
    }
    ctx.imageSmoothingEnabled = true;
    for (const l of labels) {
      const r = 4.5 + l.pop * 5;
      ctx.fillStyle = CLS[l.c]; ctx.strokeStyle = "#0d0822"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(l.x, l.y, r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#f1eeff"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(l.x, l.y, r + 2, 0, TAU); ctx.stroke();
    }
    if (kbd && state === "play") { ctx.strokeStyle = "#f1eeff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cur.x, cur.y, 11, 0, TAU); ctx.moveTo(cur.x - 16, cur.y); ctx.lineTo(cur.x - 6, cur.y); ctx.moveTo(cur.x + 6, cur.y); ctx.lineTo(cur.x + 16, cur.y); ctx.moveTo(cur.x, cur.y - 16); ctx.lineTo(cur.x, cur.y - 6); ctx.moveTo(cur.x, cur.y + 6); ctx.lineTo(cur.x, cur.y + 16); ctx.stroke(); }
  }
  function drawPanel() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // the accuracy, against the goal
    const x0 = 24, w = W - 48, y = 428, ok = acc >= target;
    ctx.textAlign = "left"; ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText("PRECISIONE DELLA MAPPA", x0, y - 16);
    ctx.textAlign = "right"; ctx.fillStyle = ok ? "#7ee0a0" : "#f1eeff"; ctx.font = "900 15px system-ui"; ctx.fillText(labels.length ? pc(acc) : "–", x0 + w, y - 16);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(x0, y - 5, w, 10);
    ctx.fillStyle = ok ? "#7ee0a0" : ACC; ctx.fillRect(x0, y - 5, w * acc, 10);
    ctx.fillStyle = "#ffd66b"; ctx.fillRect(x0 + w * target - 1, y - 9, 2, 18);
    ctx.textAlign = "center"; ctx.font = "700 9px system-ui"; ctx.fillText(`obiettivo ${pc(target)}`, clamp(x0 + w * target, x0 + 30, x0 + w - 30), y + 17);
    // the questions left, as dots
    const n = budget, gap = Math.min(12, (W - 40) / n);
    for (let i = 0; i < n; i++) { const x = W / 2 + (i - (n - 1) / 2) * gap; ctx.fillStyle = i < budget - labels.length ? ACC : "rgba(255,255,255,0.1)"; ctx.beginPath(); ctx.arc(x, 476, Math.min(4, gap / 2 - 1), 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#f1eeff"; ctx.font = "800 12px system-ui";
    const left = budget - labels.length;
    if (state === "play") ctx.fillText(`${left} ${left === 1 ? "domanda" : "domande"} ancora`, W / 2, 496);
    // the colours in play
    ctx.font = "800 10px system-ui";
    const cw = 96, sx = W / 2 - (nCls * cw) / 2;
    for (let c = 0; c < nCls; c++) { const x = sx + c * cw + 14; ctx.fillStyle = CLS[c]; ctx.beginPath(); ctx.arc(x, 524, 5, 0, TAU); ctx.fill(); ctx.textAlign = "left"; ctx.fillStyle = "#a9a3cf"; ctx.fillText(CNAME[c], x + 9, 524.5); }
    ctx.textAlign = "center"; ctx.fillStyle = "#a9a3cf"; ctx.font = "700 10px system-ui";
    if (state === "play") ctx.fillText(labels.length < 3 ? "ogni punto prende il colore del punto noto più vicino" : "le domande utili stanno sui confini", W / 2, 556);
    else if (state === "levelup" || state === "fail") ctx.fillText("a strisce, l'ipotesi del classificatore sopra la mappa vera", W / 2, 556);
    ctx.textBaseline = "alphabetic";
  }
  function drawHud() {
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, TOP - 4);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#f1eeff"; ctx.font = "900 18px system-ui"; ctx.fillText(nf(score), 12, 16);
    ctx.fillStyle = "#a9a3cf"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${nf(Math.max(bestCache, score))}`, 12, 36);
    ctx.textAlign = "center"; ctx.fillStyle = ACC; ctx.font = "900 12px system-ui"; ctx.fillText(`LIVELLO ${level + 1}`, W / 2, 14);
    const left = budget - labels.length;
    ctx.fillStyle = left <= 2 ? "#ff6b7d" : "#ffd66b"; ctx.font = "800 11px system-ui"; ctx.fillText(`${left} ${left === 1 ? "domanda" : "domande"} · ${nCls} colori`, W / 2, 34);
    const ex = touchMode ? W - 62 : W - 12;
    for (let i = 0; i < diff.lives; i++) { ctx.fillStyle = i < lives ? "#ffd66b" : "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(ex - 6 - i * 13, 16, 4.5, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(0, TOP - 4, W, 4);
    ctx.fillStyle = left <= 2 ? "#ff6b7d" : "#ffd66b"; ctx.fillRect(0, TOP - 4, W * left / Math.max(1, budget), 4);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#0d0822"; ctx.fillRect(0, 0, W, H);
    drawMap();
    if (state === "menu") return;
    drawPanel();
    drawHud();
    for (const p of popups) {
      ctx.globalAlpha = clamp((1.8 - p.t) * 2, 0, 1);
      ctx.textAlign = "center"; ctx.font = "900 14px system-ui";
      ctx.lineWidth = 4; ctx.strokeStyle = "#0d0822"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = Math.min(1, ((state === "play" ? 2.2 : 3) - message.t) * 2);
      ctx.fillStyle = "rgba(13,8,34,0.92)"; ctx.fillRect(0, 340, W, 54);
      ctx.textAlign = "center"; ctx.font = "900 19px system-ui"; ctx.fillStyle = message.bad ? "#ff6b7d" : ACC;
      ctx.fillText(message.text, W / 2, 363);
      if (message.sub) { ctx.font = "800 11px system-ui"; ctx.fillStyle = "#f1eeff"; ctx.fillText(message.sub, W / 2, 383); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  buildLevel();
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="vicini-best-" data-kind="score"></script>

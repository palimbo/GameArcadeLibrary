<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Il Ladro di Salsicce</title>
<style>
  :root {
    --bg: #1a1208;
    --fg: #f4f6ee;
    --muted: #f0dcc0;
    --pink: #ff8a3a;
    --yellow: #7ad8ff;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { cursor: pointer; display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #6a4a2a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 18, 8, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #5a2a0a, 0 0 22px rgba(255,184,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .mode button { font-size: 12px; padding: 7px 12px; }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a1400; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b8501a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  // the camera: behind the dog, looking down the market street
  const CX = 320, HOR = 104, CAMH = 2.2, F = 384, ZP = 4, FAR = 58;
  const LANES = [-0.8, 0, 0.8], ROAD = 1.25, WALL = 2.15;
  const GRAV = 16, JUMP = 5.3, SLIDE = 0.6;
  // what stands in the way: how deep it is and how you get past it
  const KINDS = {
    cassa:      { depth: 0.5, pass: "salta" },     // a crate of fruit: jump it
    striscione: { depth: 0.2, pass: "scivola" },   // a low banner: slide under it
    carro:      { depth: 1.1, pass: "cambia" },    // a market cart: change lane
    bici:       { depth: 0.8, pass: "cambia" },    // the delivery boy, coming the other way
  };
  const BIKE_SP = 5;

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "il macellaio è lento: ti prende al terzo inciampo", lead: 2, regen: 10, v0: 7, vmax: 14, acc: 0.09 },
    normale:   { label: "NORMALE",   color: "#ffd23a", desc: "ti prende al secondo inciampo", lead: 1, regen: 14, v0: 8, vmax: 17, acc: 0.12 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "si corre di più e il macellaio non molla", lead: 1, regen: 26, v0: 9.5, vmax: 20, acc: 0.16 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "salsicce-difficulty";
  const bestKey = (id) => `salsicce-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    touchEl.style.display = "none";
    wrapEl.style.paddingBottom = "0";
    const availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null, noiseBuf = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q = 1, delay = 0, slide = 0) {
    if (!audioCtx) return;
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    jump: () => beep(380, 0.16, "square", 0.035, 420),
    slide: () => noise(0.25, 0.06, 1800, 0.8, 0, -1200),
    lane: () => noise(0.06, 0.03, 2600, 1.5),
    bone: (n) => { const f = 880 * Math.pow(1.06, Math.min(12, n)); beep(f, 0.07, "square", 0.03); beep(f * 1.5, 0.09, "square", 0.025, 0, 0.05); },
    power: () => arp([523, 659, 784, 1047, 1319], 0.05, 0.14, "triangle", 0.05),
    // the thud, and the yelp
    hit: () => { noise(0.2, 0.12, 300, 0.7); beep(160, 0.2, "square", 0.07, -90); beep(900, 0.12, "sawtooth", 0.04, 500, 0.08); beep(1300, 0.16, "sawtooth", 0.035, -700, 0.2); },
    crash: () => noise(0.3, 0.09, 900, 0.6, 0, -500),
    shield: () => { noise(0.25, 0.08, 1500, 0.8); beep(700, 0.2, "triangle", 0.05, -300); },
    bell: () => { beep(2100, 0.25, "sine", 0.05); beep(2100, 0.25, "sine", 0.05, 0, 0.16); },
    back: () => arp([392, 523, 659], 0.07, 0.12, "triangle", 0.04),
    caught: () => { arp([523, 415, 330, 262, 196], 0.13, 0.22, "triangle", 0.06); noise(0.4, 0.08, 400, 0.6); },
    step: () => noise(0.03, 0.012, 500, 1),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, dist = 0, speed = 8, lane = 1, px = 0, py = 0, vy = 0, slideT = 0, runT = 0, objs = [], coins = [], parts = [], popups = [], message = null;
  let lead = 1, leadT = 0, chase = 0, inv = 0, stumble = 0, magnetT = 0, doubleT = 0, shield = false, bones = 0, boneRun = 0, boneRunT = 0, genZ = 0, nextPower = 0, hits = 0, cleanFrom = 0, caught = 0, shake = 0, stepT = 0, camX = 0;
  let bSide = -1;
  const isPlaying = () => state === "play";
  const mult = () => (doubleT > 0 ? 2 : 1);

  // ---------- The street ahead ----------
  function genRow(wz) {
    const d = clamp(dist / 1500, 0, 1);
    const order = [0, 1, 2].sort(() => Math.random() - 0.5);
    const r = Math.random(), n = r < 0.4 - d * 0.2 ? 1 : r < 0.88 - d * 0.18 || dist < 150 ? 2 : 3;
    const row = [null, null, null];
    for (let i = 0; i < n; i++) { const t = Math.random(); row[order[i]] = t < 0.36 ? "carro" : t < 0.7 ? "cassa" : "striscione"; }
    if (row.every((k) => k === "carro")) row[order[0]] = "cassa";
    row.forEach((kind, l) => { if (kind) objs.push({ kind, lane: l, x: LANES[l], wz, hit: 0, id: Math.random() }); });
    // bones lead the way: along a free lane, or in an arc over a crate
    const free = [0, 1, 2].filter((l) => !row[l]), low = [0, 1, 2].filter((l) => row[l] === "cassa");
    if (dist + FAR > nextPower && free.length) {
      const l = free[Math.floor(Math.random() * free.length)];
      coins.push({ x: LANES[l], y: 0.45, wz, kind: ["calamita", "doppio", "scudo"][Math.floor(Math.random() * 3)] });
      nextPower = dist + FAR + rnd(240, 400);
    } else if (Math.random() < 0.75) {
      if (low.length && (Math.random() < 0.5 || !free.length)) {
        const l = low[Math.floor(Math.random() * low.length)], reach = speed * 0.33;
        for (let i = -2; i <= 2; i++) coins.push({ x: LANES[l], y: 0.3 + 0.75 * (1 - (i / 2.4) ** 2), wz: wz + i * reach * 0.42 });
      } else if (free.length) {
        const l = free[Math.floor(Math.random() * free.length)];
        for (let i = 0; i < 5; i++) coins.push({ x: LANES[l], y: 0.3, wz: wz - 1.6 + i * 0.8 });
      }
    }
    // the delivery boy on his bike comes down a lane, and meets you where no row stands
    if (dist > 250 && Math.random() < 0.1 + d * 0.16) {
      const meet = dist + (wz - dist) * speed / (speed + BIKE_SP), l = Math.floor(Math.random() * 3);
      if (!objs.some((o) => o.kind !== "bici" && Math.abs(o.wz - meet) < 4.5) && !objs.some((o) => o.kind === "bici" && Math.abs(o.wz - wz) < 30))
        objs.push({ kind: "bici", lane: l, x: LANES[l], wz: wz + 2, hit: 0, id: Math.random(), rung: false });
    }
  }
  function fill() {
    while (genZ < dist + FAR) { genRow(genZ); genZ += Math.max(7.5, speed * 0.82) * rnd(0.92, 1.3); }
  }

  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; dist = 0; speed = diff.v0; lane = 1; px = 0; py = 0; vy = 0; slideT = 0; runT = 0; objs = []; coins = []; parts = []; popups = [];
    lead = diff.lead; leadT = 0; chase = 1; inv = 0; stumble = 0; magnetT = 0; doubleT = 0; shield = false; bones = 0; boneRun = 0; boneRunT = 0; hits = 0; cleanFrom = 0; caught = 0; shake = 0; camX = 0;
    genZ = 26; nextPower = rnd(160, 260);
    fill();
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    message = { text: "SCAPPA!", sub: "il macellaio rivuole le sue salsicce", t: 0 };
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }

  // ---------- Moves ----------
  function move(d) { if (!isPlaying() || caught) return; const l = clamp(lane + d, 0, 2); if (l !== lane) { lane = l; sfx.lane(); } }
  function jump() { if (!isPlaying() || caught) return; if (py <= 0.001) { vy = JUMP; slideT = 0; sfx.jump(); } }
  function slide() { if (!isPlaying() || caught) return; if (py > 0.001) vy = Math.min(vy, -9); if (slideT <= 0) sfx.slide(); slideT = SLIDE; }

  function burst(x, y, wz, n, col, sp = 2) {
    for (let i = 0; i < n; i++) parts.push({ x, y, wz, vx: rnd(-1, 1) * sp, vy: rnd(0.5, 1.6) * sp, vz: rnd(-0.3, 1) * sp, t: 0, life: rnd(0.4, 0.8), col, s: rnd(0.03, 0.07) });
  }
  function crash(o) {
    o.hit = 0.001;
    if (shield) {   // the golden collar takes the blow
      shield = false; inv = 0.8; sfx.shield(); sfx.crash();
      burst(o.x, 0.5, o.wz, 14, "#ffd23a", 3);
      popups.push({ text: "COLLARE!", t: 0, col: "#ffd23a" });
      return;
    }
    hits++; cleanFrom = dist; lead--; leadT = 0; inv = 1.3; stumble = 0.6; shake = 0.4; speed = Math.max(diff.v0 * 0.8, speed * 0.72);
    sfx.hit(); sfx.crash();
    burst(o.x, 0.4, o.wz, 12, o.kind === "cassa" ? "#ff8a3a" : o.kind === "striscione" ? "#ff5a6a" : "#c8a070", 3);
    if (lead < 0) { caught = 0.001; sfx.caught(); }
    else popups.push({ text: lead === 0 ? "IL MACELLAIO TI È ADDOSSO!" : "AHI!", t: 0, col: "#ff5a4a" });
  }
  function take(c) {
    c.got = true;
    if (c.kind) {
      sfx.power();
      if (c.kind === "calamita") { magnetT = 9; popups.push({ text: "CALAMITA!", t: 0, col: "#ff5a6a" }); }
      else if (c.kind === "doppio") { doubleT = 10; popups.push({ text: "PUNTI DOPPI!", t: 0, col: "#7ad8ff" }); }
      else { shield = true; popups.push({ text: "COLLARE D'ORO!", t: 0, col: "#ffd23a" }); }
      score += 100 * mult();
      return;
    }
    bones++; boneRun = boneRunT > 0 ? boneRun + 1 : 0; boneRunT = 0.5;
    score += 10 * mult();
    sfx.bone(boneRun);
    if (bones === 150) impresa("ghiotto");
  }

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.wz += p.vz * dt; p.vy -= 9 * dt; }
    parts = parts.filter((p) => p.t < p.life && p.y > -0.1);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < 1.3);
    shake = Math.max(0, shake - dt);
    if (!isPlaying()) return;
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    if (caught) {
      caught += dt; speed = Math.max(0, speed - 30 * dt); chase += (0 - chase) * Math.min(1, dt * 8);
      dist += speed * dt;
      if (caught > 1.8) gameOver();
      return;
    }
    speed = Math.min(diff.vmax, speed + diff.acc * dt * (speed < diff.v0 ? 12 : 1));
    const before = dist;
    dist += speed * dt;
    score += (dist - before) * mult();
    if (before < 1000 && dist >= 1000) impresa("fuga");
    if (dist - cleanFrom >= 600 && before - cleanFrom < 600) impresa("intoccabile");
    runT += dt * (5 + speed * 0.55);
    stepT -= dt; if (stepT <= 0 && py <= 0 && slideT <= 0) { sfx.step(); stepT = 2.2 / (5 + speed * 0.55); }
    // the dog
    px += (LANES[lane] - px) * Math.min(1, dt * 16);
    camX += (px * 0.55 - camX) * Math.min(1, dt * 8);
    if (py > 0 || vy > 0) { vy -= GRAV * dt; py += vy * dt; if (py <= 0) { py = 0; vy = 0; } }
    slideT = Math.max(0, slideT - dt);
    inv = Math.max(0, inv - dt); stumble = Math.max(0, stumble - dt);
    magnetT = Math.max(0, magnetT - dt); doubleT = Math.max(0, doubleT - dt); boneRunT = Math.max(0, boneRunT - dt);
    // the butcher falls back if you run clean for a while
    if (lead < diff.lead) { leadT += dt; if (leadT >= diff.regen) { lead++; leadT = 0; sfx.back(); popups.push({ text: "IL MACELLAIO RESTA INDIETRO", t: 0, col: "#7ed87a" }); } }
    const want = lead >= diff.lead ? 1 : lead === 0 ? 0.12 : 0.5;
    chase += (want - chase) * Math.min(1, dt * 2.5);
    // what is in the way
    for (const o of objs) {
      if (o.kind === "bici") { o.wz -= BIKE_SP * dt; if (!o.rung && o.wz - dist < 24) { o.rung = true; sfx.bell(); } }
      if (o.hit) { o.hit += dt; continue; }
      const k = KINDS[o.kind];
      if (inv > 0 || Math.abs(o.wz - dist) > k.depth / 2 + 0.22 || Math.abs(o.x - px) > 0.42) continue;
      if (k.pass === "salta" && py > 0.38) continue;
      if (k.pass === "scivola" && slideT > 0 && py < 0.2) continue;
      crash(o);
    }
    objs = objs.filter((o) => o.wz > dist - ZP - 1 && !(o.hit > 1));
    for (const c of coins) {
      if (c.got) continue;
      const dz = c.wz - dist;
      if (magnetT > 0 && !c.kind && dz < 7 && dz > -1) { c.x += (px - c.x) * Math.min(1, dt * 9); c.y += (py + 0.4 - c.y) * Math.min(1, dt * 9); }
      if (Math.abs(dz) < 0.45 && Math.abs(c.x - px) < 0.45 && Math.abs(c.y - (py + (slideT > 0 ? 0.2 : 0.4))) < 0.62) take(c);
    }
    coins = coins.filter((c) => !c.got && c.wz > dist - ZP);
    fill();
  }

  function gameOver() {
    state = "over";
    const total = Math.floor(score);
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = total > prev;
    if (record) store(bestKey(difficulty), String(total));
    menu = () => showOverlay(
      `<h2 class="lose">PRESO!</h2>
       <p>Punteggio: <b>${total.toLocaleString("it-IT")}</b> · ${Math.floor(dist).toLocaleString("it-IT")} metri di fuga · ${bones} ${bones === 1 ? "osso" : "ossi"} · ${hits} ${hits === 1 ? "inciampo" : "inciampi"} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>SCAPPA DI NUOVO</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {

    ctx.fillStyle = "#fffaf0"; ctx.fillRect(-0.36, -0.95, 0.72, 0.06); ctx.beginPath(); ctx.arc(0, -0.92, 0.06, 0, TAU); ctx.fill();
    // the arm with the cleaver
    const sw = Math.sin(clock * 9) * 0.25;
    ctx.save(); ctx.translate(0.36, -1.2); ctx.rotate(-0.5 + sw);
    ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.roundRect(-0.07, -0.5, 0.14, 0.55, 0.06); ctx.fill();
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(-0.03, -0.66, 0.06, 0.2);
    ctx.fillStyle = "#d8e0e8"; ctx.beginPath(); ctx.roundRect(-0.05, -0.98, 0.3, 0.34, 0.03); ctx.fill(); ctx.fillStyle = "#f4f8ff"; ctx.fillRect(0.19, -0.98, 0.06, 0.34);
    ctx.restore();
    ctx.fillStyle = "#f0c8a0"; ctx.beginPath(); ctx.arc(0, -1.5, 0.19, 0, TAU); ctx.fill();
    ctx.fillStyle = "#6a4a2a"; ctx.beginPath(); ctx.arc(0, -1.5, 0.19, Math.PI * 0.1, Math.PI * 0.9); ctx.fill();
    ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.roundRect(-0.17, -1.82, 0.34, 0.24, 0.06); ctx.fill(); ctx.beginPath(); ctx.arc(-0.1, -1.83, 0.1, 0, TAU); ctx.arc(0.1, -1.83, 0.1, 0, TAU); ctx.arc(0, -1.87, 0.11, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(26,18,8,0.9)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(Math.floor(score).toLocaleString("it-IT"), 10, 14);
    ctx.fillStyle = "#f0dcc0"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, Math.floor(score)).toLocaleString("it-IT")}`, 84, 9);
    ctx.fillStyle = "#ff8a3a"; ctx.font = "900 9px system-ui"; ctx.fillText(diff.label, 84, 20);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 11px system-ui";
    ctx.fillText(`${Math.floor(dist).toLocaleString("it-IT")} m`, 176, 14);
    drawBone(258, 14, 60, 0); ctx.fillStyle = "#ffffff"; ctx.font = "800 11px system-ui"; ctx.fillText(String(bones), 276, 14);
    // how far behind the butcher is
    ctx.textAlign = "center";
    const x0 = touchMode ? 400 : 460;
    ctx.fillStyle = "#f0dcc0"; ctx.font = "700 8px system-ui"; ctx.fillText("MACELLAIO", x0 + 30, 8);
    for (let i = 0; i <= diff.lead; i++) { ctx.fillStyle = i <= lead ? "#7ed87a" : (Math.floor(clock * 6) % 2 ? "#ff5a4a" : "#8a2a1a"); ctx.beginPath(); ctx.roundRect(x0 + i * 22, 14, 18, 7, 3); ctx.fill(); }
    let x = 330;
    for (const [t, max, col, label] of [[magnetT, 9, "#ff5a6a", "U"], [doubleT, 10, "#7ad8ff", "×2"]]) {
      if (t <= 0) continue;
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x, 19, 30, 4); ctx.fillStyle = col; ctx.fillRect(x, 19, 30 * t / max, 4);
      ctx.font = "900 10px system-ui"; ctx.fillText(label, x + 15, 11); x += 38;
    }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (state === "menu") dist = clock * 5;
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 8, rnd(-1, 1) * shake * 8);
    drawStreet();
    const i0 = Math.floor((dist - ZP) / 4), i1 = Math.floor((dist + FAR) / 4);
    // far to near: houses, then everything standing in the street
    const haze = ctx.createLinearGradient(0, HOR, 0, HOR + 14);
    haze.addColorStop(0, "rgba(216,240,255,0.9)"); haze.addColorStop(1, "rgba(216,240,255,0)");
    ctx.fillStyle = haze; ctx.fillRect(0, HOR, W, 14);
    for (let i = i1; i >= i0; i--) { drawHouse(i, -1); drawHouse(i, 1); }
    if (state !== "menu") {
      const things = [...objs.map((o) => ({ z: o.wz, o })), ...coins.map((c) => ({ z: c.wz, c })), { z: dist, dog: true }].sort((a, b) => b.z - a.z);
      for (const t of things) { if (t.dog) drawDog(); else if (t.o) drawObstacle(t.o); else drawPickup(t.c); }
      for (const p of parts) { const [sx, sy, s] = P(p.x, p.y, p.wz); ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, p.s * s), 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
      drawButcher();
    }
    ctx.restore();
    if (state === "menu") return;
    drawHud();
    ctx.textAlign = "center";
    popups.forEach((p, i) => { ctx.globalAlpha = clamp((1.3 - p.t) * 3, 0, 1); outlined(p.text, CX, 150 - p.t * 18 - i * 0, "900 15px system-ui", p.col, 4); });
    ctx.globalAlpha = 1;
    if (message) {
      ctx.globalAlpha = clamp((2.4 - message.t) * 2, 0, 1);
      outlined(message.text, CX, 84, "italic 900 30px system-ui", "#ff8a3a", 6);
      outlined(message.sub, CX, 104, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
    if (caught) outlined("PRESO!", CX, 150, "italic 900 44px system-ui", "#ff5a4a", 8);
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="salsicce-best-" data-kind="score"></script>

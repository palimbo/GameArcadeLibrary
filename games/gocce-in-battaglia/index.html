<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gocce in Battaglia</title>
<style>
  :root {
    --bg: #0a1420;
    --fg: #f4f6ee;
    --muted: #c0d8f0;
    --cyan: #4ab8ff;
    --red: #ff3a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a4a6a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(10, 20, 32, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--cyan);
    text-shadow: 3px 3px 0 #8a1a2a, 0 0 22px rgba(74,184,255,0.45); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--cyan); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--cyan); color: #02142a; background: var(--cyan); padding: 11px 30px; box-shadow: 0 4px 0 #1a6aa8; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch"></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  // landscape: the board on the left, the match on the right; portrait (phones held upright): the board on top
  let W = 640, H = 360, portrait = false;
  const TAU = Math.PI * 2, TOP = 28, N = 7;
  let CS = 44, BX = 20, BY = TOP + 10, IX = 352, IY = TOP;
  function layout(p) {
    portrait = p;
    if (p) { W = 360; H = 640; CS = 48; BX = (W - N * CS) / 2; BY = TOP + 10; IX = 18; IY = BY + N * CS + 6; }
    else { W = 640; H = 360; CS = 44; BX = 20; BY = TOP + 10; IX = 352; IY = TOP; }
  }
  const ME = 1, CPU = 2;
  // the eight opponents: depth of thought, how often they slip up, and their face
  const RIVALS = [
    { name: "Goccia Pigra", depth: 1, slip: 0.55, col: "#ff8a8a", mood: "sleepy" },
    { name: "Goccia Golosa", depth: 1, slip: 0.3, col: "#ff7a5a", mood: "happy" },
    { name: "Bolla Furba", depth: 1, slip: 0.12, col: "#ff5a7a", mood: "sly" },
    { name: "Spruzzo", depth: 2, slip: 0.3, col: "#e84a5a", mood: "happy" },
    { name: "Pozza Scura", depth: 2, slip: 0.16, col: "#c83a6a", mood: "sly" },
    { name: "Onda Rossa", depth: 2, slip: 0.07, col: "#e82a2a", mood: "angry" },
    { name: "Tempesta", depth: 2, slip: 0.02, col: "#b81a3a", mood: "angry" },
    { name: "Il Gran Maestro", depth: 3, slip: 0.14, col: "#8a0a2a", mood: "master" },
  ];
  // blocked squares for each board (in one corner quarter; mirrored to the other three)
  const LAYOUTS = [[], [[3, 3]], [[1, 1]], [[2, 3], [3, 2]], [[1, 3], [3, 1]], [[2, 2], [3, 3]], [[0, 3], [1, 2]], [[2, 1], [1, 2], [3, 3]]];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "2 rivincite · 25 secondi per mossa · gli avversari sbagliano più spesso", retries: 2, time: 25, slip: 2.3 },
    normale:   { label: "NORMALE",   color: "#4ab8ff", desc: "1 rivincita · 18 secondi per mossa", retries: 1, time: 18, slip: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "nessuna rivincita · 12 secondi per mossa · avversari che sbagliano poco", retries: 0, time: 12, slip: 0.5 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "gocce-difficulty";
  const bestKey = (id) => `gocce-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const impresa = (id) => window.dispatchEvent(new CustomEvent("sala:impresa", { detail: id }));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    layout(window.innerHeight > window.innerWidth * 1.15);
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  const sfx = {
    pick: () => beep(660, 0.05, "triangle", 0.03),
    clone: () => beep(520, 0.12, "sine", 0.05, 300),
    jump: () => beep(300, 0.18, "triangle", 0.05, 500),
    flip: (n, i) => beep(700 + i * 90, 0.06, "square", 0.025, 0, 0.12 + i * 0.05),
    no: () => beep(160, 0.1, "sawtooth", 0.03),
    tick: () => beep(1400, 0.03, "square", 0.02),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 0.14, "square", 0.045),
    lose: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, clock = 0;
  let score = 0, bestCache = 0, level = 0, lap = 0, retries = 1, wins = 0;
  let board = [], turn = ME, sel = null, cursor = [3, 3], moveT = 0, thinkT = 0, phase = "play", phaseT = 0, message = null, lastMove = null, popups = [];
  const anim = []; // squares changing hands, for the little pop
  const R = () => RIVALS[level];

  // ---------- The board ----------
  const inside = (c, r) => c >= 0 && r >= 0 && c < N && r < N;
  function makeBoard() {
    board = Array.from({ length: N }, () => new Array(N).fill(0));
    for (const [c, r] of LAYOUTS[level % LAYOUTS.length]) for (const [x, y] of [[c, r], [N - 1 - c, r], [c, N - 1 - r], [N - 1 - c, N - 1 - r]]) board[y][x] = -1;
    board[0][0] = board[N - 1][N - 1] = ME; board[0][N - 1] = board[N - 1][0] = CPU;
  }
  // every move of a side: [from c, from r, to c, to r, jump?]; a clone from any of the pieces is the same move, so it is counted once
  function movesOf(b, who) {
    const out = [], seen = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (b[r][c] !== who) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        if (!dx && !dy) continue;
        const x = c + dx, y = r + dy;
        if (!inside(x, y) || b[y][x] !== 0) continue;
        const jump = Math.max(Math.abs(dx), Math.abs(dy)) === 2;
        if (!jump) { const k = y * N + x; if (seen.has(k)) continue; seen.add(k); }
        out.push([c, r, x, y, jump]);
      }
    }
    return out;
  }
  // plays a move on a board; returns the squares that changed colour
  function play(b, m, who) {
    const [c, r, x, y, jump] = m, foe = 3 - who, flipped = [];
    b[y][x] = who; if (jump) b[r][c] = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const a = x + dx, d = y + dy; if (inside(a, d) && b[d][a] === foe) { b[d][a] = who; flipped.push([a, d]); } }
    return flipped;
  }
  const count = (b, who) => b.reduce((n, row) => n + row.filter((v) => v === who).length, 0);
  const copy = (b) => b.map((row) => row.slice());
  // the computer: looks a few moves ahead (minimax on the piece difference), and sometimes slips
  function evalBoard(b, who) { const m = count(b, who), o = count(b, 3 - who); if (!o) return 999; if (!m) return -999; return m - o; }
  function search(b, who, depth, alpha, beta) {
    if (depth === 0) return evalBoard(b, who);
    let ms = movesOf(b, who);
    if (!ms.length) return evalBoard(b, who) - (movesOf(b, 3 - who).length ? 2 : 0);
    if (depth >= 2) { ms = ms.map((m) => { const t = copy(b); return { m, g: play(t, m, who).length + (m[4] ? 0 : 1) }; }).sort((p, q) => q.g - p.g).slice(0, 14).map((p) => p.m); }
    let best = -Infinity;
    for (const m of ms) {
      const t = copy(b); play(t, m, who);
      const v = -search(t, 3 - who, depth - 1, -beta, -alpha);
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function chooseMove(b, who, depth, slip) {
    const ms = movesOf(b, who);
    if (!ms.length) return null;
    const scored = ms.map((m) => { const t = copy(b); play(t, m, who); return { m, v: -search(t, 3 - who, depth - 1, -Infinity, Infinity) + (m[4] ? -0.3 : 0) + Math.random() * 0.2 }; }).sort((p, q) => q.v - p.v);
    // a slip: one of the lesser moves
    if (Math.random() < slip) return scored[Math.min(scored.length - 1, 1 + Math.floor(Math.random() * Math.min(6, scored.length - 1)))].m;
    return scored[0].m;
  }

  // ---------- Flow ----------
  const isPlaying = () => state === "play";
  function startLevel() {
    makeBoard(); turn = ME; sel = null; moveT = diff.time; thinkT = 0; phase = "intro"; phaseT = 2.2; lastMove = null;
    message = { text: `SFIDA ${level + 1} di ${RIVALS.length}${lap ? ` · giro ${lap + 1}` : ""}`, sub: `contro ${R().name}`, t: 0 };
  }
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; level = 0; lap = 0; wins = 0; retries = diff.retries; popups = [];
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    startLevel();
    state = "play";
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  const sx = (c) => BX + c * CS + CS / 2, sy = (r) => BY + r * CS + CS / 2;
  function doMove(m, who) {
    const flipped = play(board, m, who);
    lastMove = { m, who, t: 0 };
    (m[4] ? sfx.jump : sfx.clone)();
    flipped.forEach((f, i) => { anim.push({ c: f[0], r: f[1], t: -i * 0.05 }); sfx.flip(flipped.length, i); });
    anim.push({ c: m[2], r: m[3], t: 0, born: true });
    if (who === ME) {
      if (flipped.length) { const pts = flipped.length * flipped.length * 10 * (1 + 0.15 * level); score += Math.round(pts); popups.push({ x: sx(m[2]), y: sy(m[3]) - 20, text: `+${Math.round(pts)}`, t: 0 }); }
      if (flipped.length >= 8) impresa("otto");
    }
    sel = null;
    nextTurn(3 - who);
  }
  // whose turn now; a side with no moves passes, and the game ends when nobody can move
  function nextTurn(who) {
    const mineN = count(board, ME), cpuN = count(board, CPU);
    if (!mineN || !cpuN) return endLevel();
    if (movesOf(board, who).length) { turn = who; moveT = diff.time; thinkT = rnd(0.7, 1.3); return; }
    if (movesOf(board, 3 - who).length) {
      // the stuck side passes: the other one fills the board
      turn = 3 - who; moveT = diff.time; thinkT = 0.6;
      message = { text: who === ME ? "NON PUOI MUOVERE: PASSI" : `${R().name.toUpperCase()} PASSA`, t: 0 };
      return;
    }
    endLevel();
  }
  function endLevel() {
    const m = count(board, ME), o = count(board, CPU);
    phase = "end"; phaseT = 3.2;
    if (m > o) {
      const bonus = Math.round(1000 * (level + 1) * (1 + 0.25 * lap) + (m - o) * 100);
      score += bonus; wins++;
      if (!o && level >= 2) impresa("cappotto");
      if (level === RIVALS.length - 1) impresa("maestro");
      sfx.win();
      message = { text: o ? "HAI VINTO!" : "CAPPOTTO!", sub: `${m} a ${o} · bonus ${bonus.toLocaleString("it-IT")}`, t: 0, long: true };
      result = true;
    } else {
      sfx.lose();
      message = { text: m === o ? "PAREGGIO: NON BASTA" : "HAI PERSO", sub: `${m} a ${o}${retries > 0 ? " · c'è una rivincita" : ""}`, t: 0, long: true };
      result = false;
    }
  }
  let result = false;
  function afterLevel() {
    if (result) { level++; if (level >= RIVALS.length) { level = 0; lap++; } startLevel(); }
    else if (retries > 0) { retries--; startLevel(); }
    else gameOver();
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    menu = () => showOverlay(
      `<h2 class="lose">FINE DELLA SFIDA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${wins} ${wins === 1 ? "sfida vinta" : "sfide vinte"} · ultimo avversario ${R().name} · ${diff.label}</p>
       ${record ? "<p style='color:var(--cyan)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>UN'ALTRA SFIDA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>GOCCE IN BATTAGLIA</h1>
       <p>Le tue gocce blu contro le gocce rosse, su una griglia di 7 × 7. A ogni mossa una goccia si duplica nella casella accanto, oppure salta due caselle più in là (e lascia vuota quella da cui parte). Dove arriva, tutte le gocce rosse intorno diventano blu. Quando la griglia è piena vince chi ha più gocce. Otto avversari, sempre più furbi, fino al Gran Maestro.</p>
       <div class="pts">
         <span><b>Duplica</b></span><span>nelle 8 caselle intorno (in verde): la goccia resta dov'è e ne nasce una nuova</span>
         <span><b>Salta</b></span><span>nelle caselle a due passi (in giallo): arriva più lontano, ma la casella di partenza resta vuota</span>
         <span><b>Tempo</b></span><span>${diff.time} secondi per mossa: se scadono, la goccia muove da sola</span>
         <span><b>Punti</b></span><span>per ogni mossa le gocce conquistate al quadrato × 10 · vittoria 1.000 × sfida più 100 per goccia di vantaggio</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Tocca una tua goccia, poi la casella dove mandarla</p>`
         : `<p class="muted help">Clic su una tua goccia e poi sulla casella, oppure frecce per muovere il cursore e SPAZIO per scegliere (ESC annulla) · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>ALLA SFIDA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  // choosing: a piece of yours, then a free square one or two steps away
  function choose(c, r) {
    if (state !== "play" || phase !== "play" || turn !== ME) return;
    if (!inside(c, r)) return;
    cursor = [c, r];
    if (board[r][c] === ME) { sel = [c, r]; sfx.pick(); return; }
    if (!sel) return;
    const d = Math.max(Math.abs(c - sel[0]), Math.abs(r - sel[1]));
    if (board[r][c] !== 0 || d > 2) { sfx.no(); sel = null; return; }
    // a clone can come from any neighbour: use the selected one
    doMove([sel[0], sel[1], c, r, d === 2], ME);
  }
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const mv = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] }[k];
    if (mv) { cursor = [clamp(cursor[0] + mv[0], 0, N - 1), clamp(cursor[1] + mv[1], 0, N - 1)]; return; }
    if (k === " " || k === "j" || e.key === "Enter") choose(cursor[0], cursor[1]);
    if (k === "escape" || k === "x") sel = null;
  });
  window.addEventListener("blur", () => { if (isPlaying()) togglePause(); });
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); }
    if (!isPlaying()) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    choose(Math.floor((x - BX) / CS), Math.floor((y - BY) / CS));
  });
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  function update(dt) {
    clock += dt;
    if (window.__bot) window.__bot(dt);
    for (const a of anim) a.t += dt;
    for (let i = anim.length - 1; i >= 0; i--) if (anim[i].t > 0.4) anim.splice(i, 1);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.2);
    if (lastMove) lastMove.t += dt;
    if (message) { message.t += dt; if (message.t > (message.long ? 3 : 2)) message = null; }
    if (state !== "play") return;
    if (phase === "intro") { phaseT -= dt; if (phaseT <= 0) phase = "play"; return; }
    if (phase === "end") { phaseT -= dt; if (phaseT <= 0) afterLevel(); return; }
    if (turn === ME) {
      const before = Math.ceil(moveT);
      moveT -= dt;
      if (moveT <= 5 && Math.ceil(moveT) !== before) sfx.tick();
      if (moveT <= 0) { const m = chooseMove(board, ME, 1, 0.5); message = { text: "TEMPO SCADUTO", sub: "la goccia ha mosso da sola", t: 0 }; if (m) doMove(m, ME); else nextTurn(CPU); }
    } else {
      thinkT -= dt;
      if (thinkT <= 0) {
        const L = R(), depth = Math.min(3, L.depth + (lap > 0 && L.depth < 3 ? 1 : 0));
        const m = chooseMove(board, CPU, depth, Math.min(0.9, L.slip * diff.slip / (1 + 0.5 * lap)));
        if (m) doMove(m, CPU); else nextTurn(ME);
      }
    }
  }

  // ---------- Drawing ----------
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function drop(x, y, rad, col, face, scale = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    const g = ctx.createRadialGradient(-rad * 0.3, -rad * 0.4, 1, 0, 0, rad);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, col); g.addColorStop(1, shade(col));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -rad * 1.15); ctx.bezierCurveTo(rad * 0.9, -rad * 0.3, rad, rad * 0.9, 0, rad); ctx.bezierCurveTo(-rad, rad * 0.9, -rad * 0.9, -rad * 0.3, 0, -rad * 1.15); ctx.fill();
    if (face) { ctx.fillStyle = "#0a0a1a"; ctx.beginPath(); ctx.arc(-rad * 0.3, rad * 0.05, rad * 0.12, 0, TAU); ctx.arc(rad * 0.3, rad * 0.05, rad * 0.12, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  function shade(col) { const n = parseInt(col.slice(1), 16), f = 0.55; return `rgb(${Math.round((n >> 16) * f)},${Math.round(((n >> 8) & 255) * f)},${Math.round((n & 255) * f)})`; }
  const BLUE = "#3a9aff";
  function drawBoard() {
    const g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#0c1a2c"); g.addColorStop(1, "#14243a");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    ctx.fillStyle = "#1a2c44"; rrect(BX - 6, BY - 6, N * CS + 12, N * CS + 12, 10); ctx.fill();
    // where the selected drop can go: green for a clone, yellow for a jump
    const targets = new Map();
    if (sel && turn === ME && phase === "play") for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const x = sel[0] + dx, y = sel[1] + dy; if (inside(x, y) && board[y][x] === 0) targets.set(y * N + x, Math.max(Math.abs(dx), Math.abs(dy))); }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = BX + c * CS, y = BY + r * CS, v = board[r] ? board[r][c] : 0;
      if (v === -1) { ctx.fillStyle = "#0a1220"; rrect(x + 2, y + 2, CS - 4, CS - 4, 6); ctx.fill(); ctx.strokeStyle = "#2a3a50"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + CS - 10, y + CS - 10); ctx.moveTo(x + CS - 10, y + 10); ctx.lineTo(x + 10, y + CS - 10); ctx.stroke(); continue; }
      ctx.fillStyle = (r + c) % 2 ? "#24405e" : "#2a4a6a"; rrect(x + 2, y + 2, CS - 4, CS - 4, 6); ctx.fill();
      const t = targets.get(r * N + c);
      if (t) { ctx.fillStyle = t === 1 ? "rgba(90,255,120,0.35)" : "rgba(255,220,60,0.3)"; rrect(x + 2, y + 2, CS - 4, CS - 4, 6); ctx.fill(); }
      if (lastMove && lastMove.t < 1.2 && lastMove.m[2] === c && lastMove.m[3] === r) { ctx.strokeStyle = `rgba(255,255,255,${0.8 - lastMove.t * 0.6})`; ctx.lineWidth = 2; rrect(x + 3, y + 3, CS - 6, CS - 6, 6); ctx.stroke(); }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = board[r] ? board[r][c] : 0;
      if (v !== ME && v !== CPU) continue;
      const a = anim.find((q) => q.c === c && q.r === r), k = a ? (a.born ? Math.min(1, Math.max(0, a.t) / 0.25) : 1 + 0.35 * Math.sin(Math.max(0, a.t) / 0.4 * Math.PI)) : 1;
      const bob = Math.sin(clock * 3 + c + r * 2) * 1.2;
      drop(sx(c), sy(r) + bob, CS * 0.32, v === ME ? BLUE : R().col, true, k);
    }
    if (sel) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; rrect(BX + sel[0] * CS + 2, BY + sel[1] * CS + 2, CS - 4, CS - 4, 7); ctx.stroke(); }
    if (!touchMode && state === "play") { ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.setLineDash([4, 3]); ctx.lineWidth = 2; rrect(BX + cursor[0] * CS + 4, BY + cursor[1] * CS + 4, CS - 8, CS - 8, 6); ctx.stroke(); ctx.setLineDash([]); }
  }
  function face(x, y, rad, col, mood) {
    drop(x, y, rad, col, false);
    ctx.fillStyle = "#0a0a1a";
    const e = rad * 0.13;
    if (mood === "sleepy") { ctx.fillRect(x - rad * 0.42, y, rad * 0.25, 2.5); ctx.fillRect(x + rad * 0.17, y, rad * 0.25, 2.5); }
    else { ctx.beginPath(); ctx.arc(x - rad * 0.3, y, e, 0, TAU); ctx.arc(x + rad * 0.3, y, e, 0, TAU); ctx.fill(); }
    if (mood === "angry" || mood === "master") { ctx.strokeStyle = "#0a0a1a"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - rad * 0.5, y - rad * 0.3); ctx.lineTo(x - rad * 0.15, y - rad * 0.15); ctx.moveTo(x + rad * 0.5, y - rad * 0.3); ctx.lineTo(x + rad * 0.15, y - rad * 0.15); ctx.stroke(); }
    ctx.strokeStyle = "#0a0a1a"; ctx.lineWidth = 2.5; ctx.beginPath();
    if (mood === "happy") ctx.arc(x, y + rad * 0.25, rad * 0.25, 0.1 * Math.PI, 0.9 * Math.PI);
    else if (mood === "sly") { ctx.moveTo(x - rad * 0.2, y + rad * 0.4); ctx.quadraticCurveTo(x + rad * 0.1, y + rad * 0.5, x + rad * 0.3, y + rad * 0.3); }
    else ctx.moveTo(x - rad * 0.2, y + rad * 0.42), ctx.lineTo(x + rad * 0.2, y + rad * 0.42);
    ctx.stroke();
    if (mood === "master") { ctx.fillStyle = "#ffd23a"; ctx.beginPath(); ctx.moveTo(x - rad * 0.5, y - rad * 1.05); ctx.lineTo(x - rad * 0.3, y - rad * 1.45); ctx.lineTo(x, y - rad * 1.15); ctx.lineTo(x + rad * 0.3, y - rad * 1.45); ctx.lineTo(x + rad * 0.5, y - rad * 1.05); ctx.fill(); }
  }
  function drawInfo() {
    const x = IX, Y = IY, w = portrait ? W - 2 * IX : 270;
    ctx.textAlign = "left";
    // the two sides and their drops
    const m = count(board, ME), o = count(board, CPU);
    drop(x + 18, Y + 44, 16, BLUE, true);
    face(x + w - 18, Y + 46, 18, R().col, R().mood);
    ctx.fillStyle = "#ffffff"; ctx.font = "900 26px system-ui"; ctx.fillText(`${m}`, x + 42, Y + 54);
    ctx.textAlign = "right"; ctx.fillText(`${o}`, x + w - 44, Y + 54);
    ctx.textAlign = "center"; ctx.fillStyle = "#c0d8f0"; ctx.font = "800 10px system-ui"; ctx.fillText("contro", x + w / 2, Y + 50);
    ctx.textAlign = "right"; ctx.fillStyle = R().col; ctx.font = "900 11px system-ui"; ctx.fillText(R().name.toUpperCase(), x + w, Y + 84);
    ctx.textAlign = "left"; ctx.fillStyle = BLUE; ctx.fillText("TU", x, Y + 84);
    // share of the board
    const tot = Math.max(1, m + o), by = Y + 94;
    ctx.fillStyle = BLUE; ctx.fillRect(x, by, w * m / tot, 10); ctx.fillStyle = R().col; ctx.fillRect(x + w * m / tot, by, w * o / tot, 10);
    // whose turn and the move clock
    if (state === "play" && phase === "play") {
      ctx.font = "900 13px system-ui"; ctx.textAlign = "center";
      if (turn === ME) {
        ctx.fillStyle = "#7affa0"; ctx.fillText(sel ? "SCEGLI DOVE ANDARE" : "TOCCA A TE", x + w / 2, Y + 132);
        ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x, Y + 142, w, 6);
        ctx.fillStyle = moveT < 5 ? "#ff5a5a" : "#7affa0"; ctx.fillRect(x, Y + 142, w * clamp(moveT / diff.time, 0, 1), 6);
      } else { ctx.fillStyle = R().col; ctx.fillText(`${R().name} ci pensa${".".repeat(1 + Math.floor(clock * 3) % 3)}`, x + w / 2, Y + 132); }
    }
    ctx.textAlign = "left"; ctx.fillStyle = "#c0d8f0"; ctx.font = "800 9px system-ui";
    ctx.fillText(`SFIDA ${level + 1}/${RIVALS.length} · rivincite ${retries} · REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x, portrait ? H - 18 : H - 14);
  }
  function outlined(text, x, y, font, fill, lw = 5) {
    ctx.font = font; ctx.lineWidth = lw; ctx.strokeStyle = "#0a1420"; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function drawHud() {
    ctx.fillStyle = "rgba(10,20,32,0.96)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode && !portrait ? 130 : 12;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#4ab8ff"; ctx.font = "900 10px system-ui"; ctx.textAlign = "right"; ctx.fillText(`${diff.label}`, W - (touchMode && !portrait ? 80 : 12), 14);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!board.length) { makeBoard(); }
    drawBoard();
    drawInfo();
    ctx.textAlign = "center";
    for (const p of popups) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2); outlined(p.text, p.x, p.y, "900 12px system-ui", "#ffe84a", 3); }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, ((message.long ? 3 : 2) - message.t) * 2);
      const cx = BX + N * CS / 2, cy = BY + N * CS / 2;
      outlined(message.text, cx, cy - 6, "italic 900 24px system-ui", "#4ab8ff", 6);
      if (message.sub) outlined(message.sub, cx, cy + 16, "800 12px system-ui", "#ffffff", 4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="gocce-best-" data-kind="score"></script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zona di Battaglia</title>
<style>
  :root {
    --bg: #020604;
    --fg: #d8ffe0;
    --muted: #7aa888;
    --green: #3cff6e;
    --red: #ff3a3a;
    --gold: #ffd84a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #0e2a16, 0 0 40px rgba(60,255,110,0.12); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(60, 255, 110, 0.4);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: up and down drive, left and right turn the tank; one fire button */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(60, 255, 110, 0.55); background: radial-gradient(circle, rgba(60,255,110,0.14), rgba(60,255,110,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(60, 255, 110, 0.4); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(216,255,224,0.25); pointer-events: none; }
  #touch .fire { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 58, 58, 0.9); background: rgba(255, 58, 58, 0.2); }
  #touch .fire.on { background: rgba(255, 58, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .fire { width: 78px; height: 78px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(2, 6, 4, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(28px, 8vw, 54px); font-weight: 900; letter-spacing: 4px; color: var(--green); text-shadow: 0 0 10px rgba(60,255,110,0.7), 0 0 30px rgba(60,255,110,0.3); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 3px; color: var(--green); }
  #overlay h2.lose { color: var(--red); text-shadow: 0 0 12px rgba(255,58,58,0.5); }
  #overlay p { max-width: 560px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px "Courier New", monospace; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(216,255,224,0.3); border-radius: 6px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--green); color: #021a08; background: var(--green); padding: 11px 30px; box-shadow: 0 0 18px rgba(60,255,110,0.5); }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 28px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="fire" aria-label="Fuoco">FUOCO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2;
  const HOR = 206;                  // the horizon on screen
  const F = 400;                    // focal length: about 77° of view
  const CAM_H = 1.5, NEAR = 0.4, FAR = 170;
  const WORLD = 440;                // the plain wraps around every 440 metres
  const HALF_FOV = Math.atan(W / 2 / F);
  const GREEN = "60,255,110", RED = "255,58,58";

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7de0a0", desc: "5 carri · nemici lenti a mirare, colpi lenti", lives: 5, fire: 0.6, shell: 0.8, speed: 0.8, aim: 1.5 },
    normale:   { label: "NORMALE",   color: "#3cff6e", desc: "3 carri · l'esperienza classica", lives: 3, fire: 0.85, shell: 0.9, speed: 1, aim: 1.2 },
    difficile: { label: "DIFFICILE", color: "#ff3a3a", desc: "3 carri · fuoco rapido, missili frequenti", lives: 3, fire: 1.15, shell: 1.05, speed: 1.1, aim: 0.9 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "zona-difficulty";
  const bestKey = (id) => `zona-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);
  const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  const wrap = (v) => { v %= WORLD; if (v > WORLD / 2) v -= WORLD; if (v < -WORLD / 2) v += WORLD; return v; };

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    fire: lim(() => { noise(0.25, 0.2, 900); beep(140, 0.2, "sawtooth", 0.03, -80); }),
    enemyFire: lim(() => { noise(0.18, 0.1, 600); }),
    boom: lim(() => { noise(0.7, 0.3, 500); beep(70, 0.5, "square", 0.05, -30); }),
    thud: lim(() => noise(0.15, 0.12, 400)),
    blip: lim(() => beep(1200, 0.06, "sine", 0.03)),
    missile: lim(() => arp([1400, 1100, 1400, 1100], 0.08, 0.07, "square", 0.02)),
    saucer: lim(() => beep(600, 0.4, "sine", 0.02, 300)),
    hit: () => { noise(1.1, 0.35, 1500); arp([392, 330, 262, 196], 0.14, 0.2, "triangle", 0.05); },
    wave: () => arp([392, 523, 659, 784], 0.1, 0.14),
    start: () => arp([262, 392, 523, 392, 523, 659], 0.1, 0.14),
    life: () => arp([784, 1047, 1319, 1568], 0.08, 0.12),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
  };

  // ---------- Models (x right, y up, z forward) ----------
  function box(x0, x1, y0, y1, z0, z1, zf0 = z0, zf1 = z1) {
    // a box whose top face can be shorter than its bottom (a sloped hull)
    const v = [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [x0, y1, zf0], [x1, y1, zf0], [x1, y1, zf1], [x0, y1, zf1]];
    const e = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
    return { v, e };
  }
  function merge(...parts) {
    const v = [], e = [];
    for (const p of parts) { const o = v.length; v.push(...p.v); e.push(...p.e.map(([a, b]) => [a + o, b + o])); }
    return { v, e };
  }
  function line(a, b) { return { v: [a, b], e: [[0, 1]] }; }
  const MODELS = {
    tank: merge(
      box(-1.3, 1.3, 0, 0.7, -2, 2, -1.6, 2.4),
      box(-0.8, 0.8, 0.7, 1.4, -1, 0.8, -0.7, 0.5),
      box(-0.15, 0.15, 1.0, 1.2, 0.5, 3),
      line([0, 1.4, -0.6], [0, 2.2, -0.6]),
    ),
    super: merge(
      box(-1.2, 1.2, 0, 0.6, -2.4, 2.4, -2, 3),
      box(-0.7, 0.7, 0.6, 1.1, -1.4, 1.4, -1, 1.8),
      box(-0.12, 0.12, 0.8, 0.95, 1.4, 4),
    ),
    missile: merge(
      box(-0.3, 0.3, -0.3, 0.3, -1.6, 1, -1.6, 1),
      line([0, 0, 1], [0, 0, 2]), line([-0.3, 0.3, 1], [0, 0, 2]), line([0.3, 0.3, 1], [0, 0, 2]), line([-0.3, -0.3, 1], [0, 0, 2]), line([0.3, -0.3, 1], [0, 0, 2]),
      line([-0.3, 0, -1.4], [-1, -0.4, -1.8]), line([0.3, 0, -1.4], [1, -0.4, -1.8]), line([0, 0.3, -1.4], [0, 1, -1.8]),
    ),
    cube: box(-1.6, 1.6, 0, 3.2, -1.6, 1.6),
    low: box(-2.2, 2.2, 0, 1.6, -1.2, 1.2),
    pyramid: { v: [[-2, 0, -2], [2, 0, -2], [2, 0, 2], [-2, 0, 2], [0, 4, 0]], e: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [1, 4], [2, 4], [3, 4]] },
  };
  // the saucer: two rings joined, with a dome
  (() => {
    const v = [], e = [], n = 10;
    for (let i = 0; i < n; i++) { const a = i / n * TAU; v.push([Math.cos(a) * 2.2, 0, Math.sin(a) * 2.2]); }
    for (let i = 0; i < n; i++) { const a = i / n * TAU; v.push([Math.cos(a) * 1.2, 0.6, Math.sin(a) * 1.2]); }
    for (let i = 0; i < n; i++) { const a = i / n * TAU; v.push([Math.cos(a) * 1.2, -0.4, Math.sin(a) * 1.2]); }
    v.push([0, 1.2, 0]);
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; e.push([i, j], [n + i, n + j], [2 * n + i, 2 * n + j], [i, n + i], [i, 2 * n + i]); if (i % 2 === 0) e.push([n + i, 3 * n]); }
    MODELS.saucer = { v, e };
  })();

  // ---------- The plain (built once) ----------
  const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  const OBSTACLES = [];
  for (let i = 0; i < 44; i++) {
    const x = (hash(i + 1) - 0.5) * WORLD, z = (hash(i + 101) - 0.5) * WORLD;
    if (Math.hypot(x, z) < 20) continue;
    const kind = ["cube", "pyramid", "low", "pyramid"][i % 4];
    OBSTACLES.push({ x, z, a: hash(i + 7) * TAU, kind, r: kind === "low" ? 2.6 : 2.4 });
  }
  const SPECKS = Array.from({ length: 480 }, (_, i) => ({ x: (hash(i + 500) - 0.5) * WORLD, z: (hash(i + 900) - 0.5) * WORLD }));
  // the mountain skyline all around, as height by bearing
  const SKY = [];
  for (let i = 0; i <= 360; i++) {
    const a = i / 360 * TAU;
    let h = 14 + 22 * Math.abs(Math.sin(a * 3 + 0.4)) + 14 * Math.abs(Math.sin(a * 7 + 1.2)) + 7 * Math.abs(Math.sin(a * 13 + 0.7));
    const dv = angDiff(a, 1.1); if (Math.abs(dv) < 0.22) h = Math.max(h, 78 - Math.abs(dv) * 220);  // the volcano, with its flat crater
    SKY.push(h);
  }

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, wave = 0, kills = 0, need = 0, bestCache = 0, nextLife = 30000;
  let P = null, enemies = [], shells = [], debris = [], lava = [], message = null, cracks = [];
  let spawnT = 0, missileT = 0, saucerT = 0, saucer = null, pingT = 0, hintT = 0, shake = 0;
  let firePressed = false, fireHeld = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const maxAlive = () => Math.min(3, 1 + Math.floor(wave / 2));

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; wave = 0; nextLife = 30000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    P = { x: 0, z: 0, a: 0, v: 0, turn: 0, cool: 0, bob: 0 };
    beginWave();
    sfx.start();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function beginWave() {
    kills = 0; need = 4 + wave * 2;
    enemies = []; shells = [];
    spawnT = 1.5; missileT = rnd(18, 26) / diff.fire; saucerT = rnd(20, 35);
    message = { text: `ONDATA ${wave + 1}`, sub: `Distruggi ${need} nemici`, t: 0 };
    state = "intro"; stateT = 1.8;
    sfx.wave();
  }
  function addScore(n) {
    score += n;
    if (score >= nextLife) {
      nextLife += difficulty === "difficile" ? 50000 : 30000;
      if (lives < 9) { lives++; sfx.life(); message = { text: "CARRO EXTRA", sub: "", t: 0.8 }; }
    }
  }
  // world position relative to the player, the shortest way round the plain
  const rel = (o) => ({ x: wrap(o.x - P.x), z: wrap(o.z - P.z) });
  function blocked(x, z, r = 0) {
    for (const o of OBSTACLES) if (Math.hypot(wrap(o.x - x), wrap(o.z - z)) < o.r + r) return o;
    return null;
  }
  function clearLine(x, z, dx, dz, d) {
    for (let s = 3; s < d - 2; s += 1.5) if (blocked(x + dx / d * s, z + dz / d * s, 0.3)) return false;
    return true;
  }
  function spawnEnemy(kind) {
    // somewhere around, not too close; the first ones of a wave come from ahead
    for (let k = 0; k < 20; k++) {
      const a = P.a + (kills === 0 && enemies.length === 0 ? rnd(-0.6, 0.6) : rnd(-Math.PI, Math.PI));
      const d = kind === "missile" ? rnd(85, 100) : rnd(60, 100);
      const x = P.x + Math.sin(a) * d, z = P.z + Math.cos(a) * d;
      if (kind !== "missile" && blocked(x, z, 3)) continue;
      const e = { kind, x, z, a: Math.atan2(P.x - x, P.z - z) + rnd(-1, 1), fireT: rnd(2.5, 4) / diff.fire, off: rnd(-0.4, 0.4), offT: rnd(2, 4), detourT: 0, detour: 0, side: 1, los: true, t: 0, dead: false };
      if (kind === "missile") { e.a = Math.atan2(P.x - x, P.z - z); sfx.missile(); message = { text: "MISSILE IN ARRIVO!", sub: "", t: 1 }; }
      enemies.push(e);
      return;
    }
  }
  function killEnemy(e) {
    e.dead = true;
    const pts = { tank: 1000, super: 3000, missile: 2000 }[e.kind];
    addScore(pts);
    explode(e.x, e.z, e.kind === "missile" ? 0.6 : 0.8, MODELS[e.kind], e.a);
    popText(`${pts}`);
    sfx.boom();
    kills++;
    if (kills >= need && state === "play") waveClear();
  }
  let popup = null;
  function popText(t) { popup = { text: t, t: 0 }; }
  // wireframe debris: the model's edges fly apart
  function explode(x, z, y, model, a) {
    const ca = Math.cos(a), sa = Math.sin(a);
    for (const [i, j] of model.e) {
      const A = model.v[i], B = model.v[j];
      const mx = (A[0] + B[0]) / 2, mz = (A[2] + B[2]) / 2;
      const wx = mx * ca + mz * sa, wz = -mx * sa + mz * ca;
      debris.push({ x: x + wx, z: z + wz, y: (A[1] + B[1]) / 2 + y * 0.2,
        dx: (B[0] - A[0]) / 2, dy: (B[1] - A[1]) / 2, dz: (B[2] - A[2]) / 2,
        vx: wx * 2 + rnd(-3, 3), vz: wz * 2 + rnd(-3, 3), vy: rnd(4, 10), spin: rnd(-4, 4), t: 0, life: rnd(1.2, 2) });
    }
  }
  function playerHit() {
    if (state !== "play") return;
    lives--;
    sfx.hit();
    shake = 0.6;
    // the screen cracks from where the shot came in
    cracks = [];
    const cx = W / 2 + rnd(-80, 80), cy = HOR + rnd(-40, 30);
    for (let k = 0; k < 11; k++) {
      let x = cx, y = cy, a = k / 11 * TAU + rnd(-0.2, 0.2);
      const pts = [[x, y]];
      for (let s = 0; s < 6; s++) { x += Math.cos(a) * rnd(25, 60); y += Math.sin(a) * rnd(25, 60); a += rnd(-0.5, 0.5); pts.push([x, y]); }
      cracks.push(pts);
    }
    message = { text: "SEI STATO COLPITO", sub: lives > 0 ? `Carri rimasti: ${lives}` : "Nessun carro rimasto", t: 0 };

    for (const s of shells) {
      const p = project(s.x, s.mine ? 1.1 : 1.1, s.z);
      if (!p) continue;
      const r = clamp(30 / p[2], 1, 6);
      ctx.fillStyle = s.mine ? "#d8ffe0" : `rgb(${RED})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${GREEN},0.9)`; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const d of debris) {
      const k = d.t * d.spin, c = Math.cos(k), sn = Math.sin(k);
      const dx = d.dx * c - d.dz * sn, dz = d.dx * sn + d.dz * c;
      const r = { x: wrap(d.x - P.x), z: wrap(d.z - P.z) };
      seg(cam(r.x - dx, d.y - d.dy, r.z - dz), cam(r.x + dx, d.y + d.dy, r.z + dz));
    }
    ctx.stroke();
  }
  function onTarget() {
    for (const e of enemies.concat(saucer ? [saucer] : [])) {
      const r = rel(e), d = Math.hypot(r.x, r.z);
      if (d > 130) continue;
      const off = Math.abs(angDiff(Math.atan2(r.x, r.z), P.a));
      if (Math.sin(off) * d < 2.3 && off < Math.PI / 2) return true;
    }
    return false;
  }
  function drawHud() {
    // gunsight
    const hot = onTarget();
    const col = hot ? `rgba(${RED},1)` : `rgba(${GREEN},0.85)`;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    const cx = W / 2, cy = HOR - 6;
    ctx.beginPath();
    ctx.moveTo(cx - 34, cy - 18); ctx.lineTo(cx - 34, cy - 26); ctx.lineTo(cx - 12, cy - 26);
    ctx.moveTo(cx + 34, cy - 18); ctx.lineTo(cx + 34, cy - 26); ctx.lineTo(cx + 12, cy - 26);
    ctx.moveTo(cx - 34, cy + 18); ctx.lineTo(cx - 34, cy + 26); ctx.lineTo(cx - 12, cy + 26);
    ctx.moveTo(cx + 34, cy + 18); ctx.lineTo(cx + 34, cy + 26); ctx.lineTo(cx + 12, cy + 26);
    ctx.moveTo(cx, cy - 26); ctx.lineTo(cx, cy - 40); ctx.moveTo(cx, cy + 26); ctx.lineTo(cx, cy + 40);
    ctx.stroke();
    // radar
    const rx = W / 2, ry = 44, rr = 36;
    ctx.strokeStyle = `rgba(${RED},0.85)`; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(rx, ry, rr, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - Math.sin(HALF_FOV) * rr, ry - Math.cos(HALF_FOV) * rr); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.sin(HALF_FOV) * rr, ry - Math.cos(HALF_FOV) * rr); ctx.stroke();
    const sw = clock * 2.5;
    ctx.strokeStyle = `rgba(${RED},0.45)`; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(sw) * rr, ry + Math.sin(sw) * rr); ctx.stroke();
    ctx.fillStyle = `rgba(${RED},1)`;
    let nearest = null;
    for (const e of enemies) {
      const r = rel(e), d = Math.hypot(r.x, r.z);
      if (!nearest || d < nearest.d) nearest = { e, d, r };
      if (d > 100) continue;
      const b = angDiff(Math.atan2(r.x, r.z), P.a);
      const k = d / 100 * rr;
      ctx.fillRect(rx + Math.sin(b) * k - 1.5, ry - Math.cos(b) * k - 1.5, e.kind === "missile" ? 2 : 3, e.kind === "missile" ? 2 : 3);
    }
    ctx.fillRect(rx - 1, ry - 1, 2, 2);
    // score and tanks left
    ctx.textBaseline = "top";
    ctx.font = "700 14px 'Courier New', monospace"; ctx.textAlign = "left"; ctx.fillStyle = `rgba(${RED},1)`;
    ctx.fillText(`PUNTI ${score}`, 10, 10);
    ctx.font = "700 10px 'Courier New', monospace";
    ctx.fillText(`RECORD ${Math.max(bestCache, score)}`, 10, 28);
    ctx.fillText(`ONDATA ${wave + 1} · ${Math.max(0, need - kills)} DA ABBATTERE`, 10, 42);
    ctx.textAlign = "right"; ctx.font = "700 12px 'Courier New', monospace";
    ctx.fillText(`CARRI ${Math.max(0, lives)}`, W - 10, 10);
    // where is the enemy?
    if (state === "play" && nearest && nearest.e.kind !== "missile") {
      const b = angDiff(Math.atan2(nearest.r.x, nearest.r.z), P.a);
      let t = "";
      if (Math.abs(b) > 2.5) t = "NEMICO ALLE SPALLE";
      else if (b < -HALF_FOV) t = "NEMICO A SINISTRA";
      else if (b > HALF_FOV) t = "NEMICO A DESTRA";
      else if (nearest.d < 100) t = "NEMICO NEL RAGGIO";
      if (t && Math.floor(clock * 3) % 3) { ctx.textAlign = "right"; ctx.font = "700 11px 'Courier New', monospace"; ctx.fillText(t, W - 10, 28); }
    }
    if (popup) { ctx.textAlign = "center"; ctx.font = "900 16px 'Courier New', monospace"; ctx.fillStyle = `rgba(${GREEN},${1 - popup.t})`; ctx.fillText(popup.text, W / 2, HOR - 70 - popup.t * 20); }
    ctx.textBaseline = "alphabetic";
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "900 22px 'Courier New', monospace"; ctx.fillStyle = message.text.startsWith("SEI") || message.text.startsWith("MISSILE") ? `rgb(${RED})` : `rgb(${GREEN})`;
      ctx.fillText(message.text, W / 2, 120);
      if (message.sub) { ctx.font = "700 12px 'Courier New', monospace"; ctx.fillStyle = "#d8ffe0"; ctx.fillText(message.sub, W / 2, 140); }
      ctx.globalAlpha = 1;
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    ctx.fillStyle = "#020604"; ctx.fillRect(0, 0, W, H);
    if (!P) {
      // the title screen still shows the plain, turning slowly
      P = { x: 0, z: 0, a: clock * 0.1, v: 0, turn: 0, cool: 0, bob: 0 };
      drawWorld();
      P = null;
      return;
    }
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 10, rnd(-1, 1) * shake * 10);
    drawWorld();
    ctx.restore();
    drawHud();
    if (cracks.length) {
      ctx.strokeStyle = "rgba(216,255,224,0.9)"; ctx.lineWidth = 1.5; ctx.beginPath();
      for (const c of cracks) { ctx.moveTo(c[0][0], c[0][1]); for (const p of c) ctx.lineTo(p[0], p[1]); }
      ctx.stroke();
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
<script src="../../shared/iniziali.js" data-record="zona-best-" data-kind="score"></script>

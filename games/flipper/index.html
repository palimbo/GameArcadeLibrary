<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flipper</title>
<style>
  :root {
    --bg: #120a24;
    --fg: #fff6ea;
    --muted: #c3b3dc;
    --accent: #ff4fa3;
    --gold: #ffd34d;
    --bad: #ff5a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(18, 10, 36, 0.7); border: 1px solid rgba(255, 246, 234, 0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(18, 10, 36, 0.9);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 {
    font-size: clamp(36px, 9vw, 62px); line-height: 1.05; letter-spacing: 1px;
    background: linear-gradient(90deg, #ff4fa3, #ffd34d 50%, #5fd4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #3a1050);
  }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); }
  #overlay h2.over { color: var(--gold); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(255,246,234,0.3); border-radius: 8px; padding: 8px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { background: var(--accent); border-color: var(--accent); color: #2a0018; padding: 10px 28px; }
  @media (max-height: 580px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 32px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  // ---------- Shared geometry (lower playfield, shooter lane, flippers) ----------
  const W = 420, H = 720, R = 9;
  const LANE_X = 372, LANE_R = 400, LANE_TOP = 250, PLUNGE_Y = 690;
  const ARC_C = [210, 222], ARC_R = 190;
  const LP = [128, 652], RP = [292, 652], FL = 74, FR = 7; // flipper pivots, length, radius
  const LANES = [170, 210, 250];
  const TARGET_YS = [330, 372, 414];

  // ---------- The three tables ----------
  const TABLES = {
    luna: {
      name: "Luna Park", desc: "Tre respingenti, la buca e i bersagli a sinistra: il tavolo classico",
      logo: ["LUNA", "PARK"], color: "#ff4fa3",
      theme: { bg: ["#2a1450", "#3a1060", "#1a0a30"], outer: "#120a24", wall: "#c9a7ff", accent: "#ff4fa3", gold: "#ffd34d", text: "#c3b3dc", dark: "rgba(18,10,36,0.9)" },
      bumpers: [{ x: 150, y: 270, r: 24, c: "#5fd4ff" }, { x: 270, y: 270, r: 24, c: "#ff4fa3" }, { x: 210, y: 350, r: 24, c: "#ffd34d" }],
      targets: "L",
      saucer: { x: 330, y: 400, r: 13, eject: [-1, 1], name: "BUCA", guide: [308, 380, 352, 372] },
      multi: [[330, 370, -260, -200], [210, 420, 200, -350]],
    },
    abissi: {
      name: "Abissi Marini", desc: "Quattro meduse, il vortice che fa girare la pallina e la conchiglia a sinistra",
      logo: ["ABISSI", ""], color: "#3dd6c0",
      theme: { bg: ["#06335a", "#0a4a6a", "#041a30"], outer: "#03101f", wall: "#7fe3ff", accent: "#3dd6c0", gold: "#ffb86b", text: "#9fd0e0", dark: "rgba(3,16,31,0.9)" },
      bumpers: [{ x: 140, y: 290, r: 19, c: "#ff8ac2" }, { x: 210, y: 250, r: 19, c: "#b98cff" }, { x: 280, y: 290, r: 19, c: "#ff8ac2" }, { x: 210, y: 332, r: 19, c: "#b98cff" }],
      targets: "R",
      saucer: { x: 92, y: 405, r: 13, eject: [1, 1], name: "CONCHIGLIA", guide: [112, 385, 68, 377] },
      vortex: { x: 210, y: 440, r: 38 },
      multi: [[92, 375, 260, -200], [210, 420, -200, -350]],
    },
    galassia: {
      name: "Galassia", desc: "Pianeti, una cometa in movimento e il buco nero che teletrasporta la pallina",
      logo: ["GALASSIA", ""], color: "#b98cff",
      theme: { bg: ["#0a0a26", "#151040", "#05040f"], outer: "#020208", wall: "#9fe8ff", accent: "#b98cff", gold: "#ffb03a", text: "#a8aed0", dark: "rgba(2,2,8,0.9)" },
      bumpers: [{ x: 148, y: 300, r: 26, c: "#ffb03a", ring: true }, { x: 278, y: 336, r: 26, c: "#3de0ff", ring: true }, { x: 214, y: 395, r: 15, c: "#ff5a8a" }],
      targets: "L",
      warp: { x: 96, y: 438, r: 13, to: [322, 250], eject: [-220, -420], guide: [118, 416, 74, 408] },
      comet: { y: 232, x0: 120, x1: 300, r: 14, speed: 0.9 },
      multi: [[322, 250, -300, 80], [210, 420, 200, -350]],
    },
  };
  const TABLE_IDS = Object.keys(TABLES);

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 palline · salvapalla di 10 secondi · tavolo meno inclinato", balls: 5, save: 10, g: 780 },
    normale:   { label: "NORMALE",   color: "#ff4fa3", desc: "3 palline · salvapalla di 6 secondi", balls: 3, save: 6, g: 900 },
    difficile: { label: "DIFFICILE", color: "#ff5a6a", desc: "3 palline · salvapalla di 3 secondi · tavolo più ripido", balls: 3, save: 3, g: 1020 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "flipper-difficulty", TABLE_KEY = "flipper-table";
  // one record per table; flipper-best-<difficulty> keeps the best over all tables (shown in the Sala Giochi)
  const bestKey = (id) => `flipper-best-${id}`;
  const tableBestKey = (t, id) => `flipper-best-${t}-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function tableBest(t, id) {
    const v = parseInt(load(tableBestKey(t, id)), 10);
    if (v) return v;
    return t === "luna" ? parseInt(load(bestKey(id)), 10) || 0 : 0; // records made before there were more tables
  }

  let tableId = TABLES[load(TABLE_KEY)] ? load(TABLE_KEY) : "luna";
  let table = TABLES[tableId], th = table.theme;
  let targetX = 34, targetFace = 40; // drop target bank position (left or right side)

  // static wall segments
  let walls = [];
  const seg = (ax, ay, bx, by, kind = "wall") => walls.push({ ax, ay, bx, by, kind });
  function buildWalls() {
    walls = [];
    seg(20, 720, 20, ARC_C[1]);                        // left wall
    seg(LANE_R, 720, LANE_R, ARC_C[1]);                // right outer wall (shooter lane)
    const n = 28;                                      // top arch
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI + (i / n) * Math.PI, a1 = Math.PI + ((i + 1) / n) * Math.PI;
      seg(ARC_C[0] + Math.cos(a0) * ARC_R, ARC_C[1] + Math.sin(a0) * ARC_R, ARC_C[0] + Math.cos(a1) * ARC_R, ARC_C[1] + Math.sin(a1) * ARC_R);
    }
    seg(LANE_X, 720, LANE_X, LANE_TOP);                // shooter lane inner wall
    seg(LANE_X, LANE_TOP, LANE_R, LANE_TOP - 40, "gate"); // one-way gate at the top of the lane
    // lower funnels towards the flippers
    seg(20, 560, LP[0], LP[1] - FR - 3);
    seg(LANE_X, 560, RP[0], RP[1] - FR - 3);
    // slopes from the side walls onto the slingshots, so no pocket is left behind them
    seg(20, 468, 66, 500); seg(LANE_X, 468, LANE_X - 18, 500);
    // slingshots (the long face kicks)
    seg(66, 500, 66, 575); seg(66, 575, 108, 598); seg(66, 500, 108, 598, "sling");
    seg(LANE_X - 18, 500, LANE_X - 18, 575); seg(LANE_X - 18, 575, LANE_X - 60, 598); seg(LANE_X - 18, 500, LANE_X - 60, 598, "sling");
    // top lane guides
    for (const x of [150, 190, 230, 270]) seg(x, 150, x, 196);
    // drop target bank: on the left there is room behind the targets, so it is capped
    if (table.targets === "L") { targetX = 34; targetFace = 40; seg(20, 300, 42, 310); seg(20, 434, 42, 446); }
    else { targetX = LANE_X - 14; targetFace = LANE_X - 12; }
    const guide = (table.saucer && table.saucer.guide) || (table.warp && table.warp.guide);
    if (guide) seg(...guide);
  }
  buildWalls();
  function setTable(id) {
    if (!TABLES[id]) return;
    tableId = id; table = TABLES[id]; th = table.theme;
    store(TABLE_KEY, id);
    buildWalls();
    flash.bumper = table.bumpers.map(() => 0);
    if (menu) menu();
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const s = Math.max(0.2, Math.min((window.innerWidth - 8) / W, (window.innerHeight - 8) / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const arp = (notes, gap, d, type = "square", vol = 0.045) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 5) fn(...a); };
  const sfx = {
    flip: lim(() => beep(180, 0.05, "square", 0.035, -60)),
    bumper: lim((i) => beep([660, 784, 988, 880][i % 4], 0.08, "square", 0.045, 200)),
    sling: lim(() => beep(420, 0.06, "sawtooth", 0.035, 300)),
    wall: lim(() => beep(120, 0.03, "triangle", 0.03)),
    target: lim(() => beep(1046, 0.08, "triangle", 0.05, -300)),
    lane: lim(() => beep(880, 0.06, "sine", 0.05, 400)),
    saucer: () => arp([392, 523, 659, 784], 0.06, 0.1, "triangle", 0.05),
    swirl: lim(() => beep(300 + Math.random() * 300, 0.05, "sine", 0.02, 200)),
    comet: lim(() => beep(1500, 0.12, "triangle", 0.05, -900)),
    warp: () => { beep(200, 0.5, "sine", 0.05, 1600); beep(1800, 0.4, "triangle", 0.03, -1500, 0.45); },
    launch: () => beep(200, 0.3, "sawtooth", 0.04, 600),
    drain: () => arp([392, 330, 262, 196], 0.12, 0.2, "triangle", 0.05),
    save: () => arp([784, 988, 1175], 0.07, 0.1, "square", 0.04),
    multi: () => arp([523, 659, 784, 1047, 1319, 1568], 0.07, 0.14),
    bonus: lim(() => beep(1200, 0.04, "square", 0.025)),
    over: () => arp([523, 415, 330, 262], 0.16, 0.25),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0;
  let score = 0, bestCache = 0, ballNo = 1, mult = 1, bonus = 0, saveT = 0, clock = 0;
  let balls = [], plunge = 0, plunging = false, lanes = [false, false, false], targets = [true, true, true], targetSets = 0;
  let flash = { bumper: table.bumpers.map(() => 0), sling: [0, 0], saucer: 0, lanes: [0, 0, 0], comet: 0, vortex: 0 };
  let popups = [], tally = null, saucerHold = null, message = null, warps = 0, warpCool = 0;
  const flip = {
    L: { p: LP, a: 0.52, rest: 0.52, up: -0.45, w: 0, on: false, dir: 1 },
    Rt: { p: RP, a: Math.PI - 0.52, rest: Math.PI - 0.52, up: Math.PI + 0.45, w: 0, on: false, dir: -1 },
  };
  function cometPos() {
    const c = table.comet;
    const k = (Math.sin(clock * c.speed) + 1) / 2;
    return { x: c.x0 + (c.x1 - c.x0) * k, y: c.y, vx: Math.cos(clock * c.speed) * c.speed * (c.x1 - c.x0) / 2 };
  }

  const newBall = (x, y, vx = 0, vy = 0) => ({ x, y, vx, vy, trail: [], stillT: 0, warpT: 0, swirlT: 0 });
  function readyBall() {
    balls = [newBall((LANE_X + LANE_R) / 2, PLUNGE_Y)];
    plunge = 0; plunging = false;
    state = "ready";
  }

  // ---------- Flow ----------
  const isPlaying = () => ["ready", "play", "drain"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; ballNo = 1; targetSets = 0; warps = 0;
    bestCache = tableBest(tableId, difficulty);
    buildWalls();
    flash.bumper = table.bumpers.map(() => 0);
    startBall();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function startBall() {
    mult = 1; bonus = 0; warpCool = 0; lanes = [false, false, false]; targets = [true, true, true];
    saucerHold = null; tally = null;
    readyBall();
  }
  function addScore(n, x, y, color = th.gold) {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: `+${n}`, color, t: 0 });
  }
  function say(text, color = th.gold) { message = { text, color, t: 0 }; }
  function drained() {
    if (saveT > 0) {
      saveT = 0;
      say("SALVAPALLA!", "#7dff9a");
      sfx.save();
      readyBall();
      return;
    }
    sfx.drain();
    tally = { bonus, mult, total: bonus * mult, shown: 0, t: 0 };
    state = "drain"; stateT = 2.6;
  }
  function afterDrain() {
    score += tally.total;
    ballNo++;
    if (ballNo > diff.balls) { gameOver(); return; }
    startBall();
  }
  function gameOver() {
    state = "over";
    const prev = tableBest(tableId, difficulty);
    const record = score > prev;
    if (record) store(tableBestKey(tableId, difficulty), String(score));
    if (score > (parseInt(load(bestKey(difficulty)), 10) || 0)) store(bestKey(difficulty), String(score));
    const played = diff.label;
    menu = () => showOverlay(
      `<h2 class="over">PARTITA FINITA</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · ${table.name} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD DEL TAVOLO! ★</p>" : ""}
       ${tableHTML()}${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function tableHTML() {
    const buttons = TABLE_IDS.map((id) => `<button type="button" data-table="${id}" class="${id === tableId ? "on" : ""}" style="--c:${TABLES[id].color}">${TABLES[id].name.toUpperCase()}</button>`).join("");
    return `<div class="diff">${buttons}</div><p class="muted">${table.desc}</p>`;
  }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = tableBest(tableId, difficulty);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record su questo tavolo: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>FLIPPER</h1>
       <p>Lancia la pallina e tienila in gioco con le due palette! Colpisci i respingenti, abbatti i tre bersagli, accendi le corsie in alto per aumentare il moltiplicatore e centra la buca. Abbatti i bersagli due volte per la <b>MULTIBALL</b>! Scegli uno dei tre tavoli:</p>
       ${tableHTML()}
       ${touchMode
         ? `<p class="muted help">Tocca la metà sinistra o destra dello schermo per le palette · per lanciare tieni premuto sulla destra e lascia</p>`
         : `<p class="muted help">← o Z paletta sinistra · → o M paletta destra · tieni premuto SPAZIO o ↓ per caricare il lancio e lascia · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    const t = e.target.closest("[data-table]");
    if (t) { setTable(t.dataset.table); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  function setFlip(side, on) {
    const f = side === "L" ? flip.L : flip.Rt;
    if (on && !f.on) {
      sfx.flip();
      // pressing a flipper shifts the lit top lanes, to line them up
      if (lanes.some(Boolean) && !lanes.every(Boolean)) lanes = side === "L" ? [lanes[1], lanes[2], lanes[0]] : [lanes[2], lanes[0], lanes[1]];
    }
    f.on = on;
  }
  function setPlunger(on) {
    if (on) { if (state === "ready") plunging = true; return; }
    if (plunging && state === "ready") launch();
    plunging = false;
  }
  function launch() {
    const b = balls[0];
    if (!b) return;
    b.vy = -(650 + 1150 * plunge);
    plunge = 0;
    state = "play";
    saveT = Math.max(saveT, diff.save);
    sfx.launch();
  }
  const KEYS = { arrowleft: "L", z: "L", a: "L", shift: "L", arrowright: "R", m: "R", d: "R", "/": "R", " ": "P", arrowdown: "P", enter: "P" };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      else if (k === "arrowleft") setTable(TABLE_IDS[(TABLE_IDS.indexOf(tableId) + 2) % 3]);
      else if (k === "arrowright") setTable(TABLE_IDS[(TABLE_IDS.indexOf(tableId) + 1) % 3]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    const a = KEYS[k];

  // ---------- Physics ----------
  function hitSegment(b, s) {

  function update(dt) {

  // ---------- Drawing ----------

    if (table.comet) {
      const c = cometPos(), r = table.comet.r, dir = Math.sign(c.vx) || 1;
      const tail = ctx.createLinearGradient(c.x, c.y, c.x - dir * 60, c.y);
      tail.addColorStop(0, "rgba(255,176,58,0.7)"); tail.addColorStop(1, "rgba(255,176,58,0)");
      ctx.fillStyle = tail; ctx.beginPath(); ctx.moveTo(c.x, c.y - r); ctx.lineTo(c.x - dir * 60, c.y); ctx.lineTo(c.x, c.y + r); ctx.fill();
      ctx.fillStyle = flash.comet > 0 ? "#ffffff" : "#ffe0a0"; ctx.shadowColor = "#ffb03a"; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
    // drop targets
    TARGET_YS.forEach((ty, i) => {
      const left = table.targets === "L";
      if (targets[i]) { ctx.fillStyle = th.accent; ctx.fillRect(targetX, ty - 16, 8, 32); ctx.fillStyle = "#fff"; ctx.fillRect(left ? targetX + 5 : targetX + 1, ty - 14, 2, 28); }
      else { ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(left ? targetX : targetX + 5, ty - 16, 3, 32); }
    });
    // saucer / shell
    const sc = table.saucer;
    if (sc) {
      ctx.fillStyle = "#0a0414"; ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r + 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = flash.saucer > 0 && Math.floor(clock * 12) % 2 ? "#ffffff" : "#7dff9a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r + 3, 0, Math.PI * 2); ctx.stroke();
      if (tableId === "abissi") {
        ctx.strokeStyle = "#ffb86b"; ctx.lineWidth = 2;
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(sc.x, sc.y + sc.r + 4); ctx.lineTo(sc.x + k * 7, sc.y - sc.r - 6); ctx.stroke(); }
      }
      ctx.fillStyle = th.text; ctx.font = "800 8px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(sc.name, sc.x, sc.y + sc.r + 16);
    }
    // black hole and white hole
    const wp = table.warp;
    if (wp) {
      for (const [x, y, dark] of [[wp.x, wp.y, true], [wp.to[0], wp.to[1], false]]) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(clock * (dark ? 3 : -3));
        for (let k = 0; k < 3; k++) {
          ctx.strokeStyle = dark ? `rgba(185,140,255,${0.7 - k * 0.2})` : `rgba(159,232,255,${0.6 - k * 0.18})`; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, wp.r + 3 + k * 5, k, k + Math.PI * 1.3); ctx.stroke();
        }
        ctx.restore();
        if (dark && warpCool > 0) ctx.globalAlpha = 0.35;
        ctx.fillStyle = dark ? "#000" : "rgba(220,245,255,0.8)"; ctx.beginPath(); ctx.arc(x, y, dark ? wp.r : 6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = th.text; ctx.font = "800 8px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("BUCO NERO", wp.x, wp.y + wp.r + 20);
    }
    // flippers
    for (const f of [flip.L, flip.Rt]) {
      const [ex, ey] = flipperEnd(f);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = FR * 2 + 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(f.p[0], f.p[1]); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = th.accent; ctx.lineWidth = FR * 2 - 5;
      ctx.beginPath(); ctx.moveTo(f.p[0], f.p[1]); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = th.gold; ctx.beginPath(); ctx.arc(f.p[0], f.p[1], 4, 0, Math.PI * 2); ctx.fill();
    }
    // plunger
    const py = PLUNGE_Y + R + 2 + plunge * 18;
    ctx.fillStyle = th.wall; ctx.fillRect(LANE_X + 6, py, LANE_R - LANE_X - 12, 6);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    for (let y = py + 8; y < H; y += 6) ctx.fillRect(LANE_X + 9, y, LANE_R - LANE_X - 18, 3);
    if (state === "ready") {
      ctx.fillStyle = `rgba(255,211,77,${0.5 + 0.5 * Math.sin(clock * 6)})`; ctx.font = "800 10px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.save(); ctx.translate((LANE_X + LANE_R) / 2, 610); ctx.rotate(-Math.PI / 2); ctx.fillText("LANCIA ▶", 0, 4); ctx.restore();
    }
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    drawTable();
    for (const b of balls) {
      if (b.warpT > 0) continue;
      b.trail.forEach(([x, y], i) => { ctx.globalAlpha = (i + 1) / b.trail.length * 0.25; ctx.fillStyle = th.wall; ctx.beginPath(); ctx.arc(x, y, R * 0.8, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, R);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#d8d8e8"); g.addColorStop(1, "#7a7a90");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t;
      ctx.textAlign = "center"; ctx.font = "900 13px system-ui, sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = th.dark; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    // score panel inside the arch
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff6ea"; ctx.font = "900 26px system-ui, sans-serif";
    ctx.fillText(score.toLocaleString("it-IT"), 210, 64);
    ctx.fillStyle = th.text; ctx.font = "700 11px system-ui, sans-serif";
    ctx.fillText(state === "menu" ? table.name.toUpperCase() : `PALLA ${Math.min(ballNo, diff.balls)}/${diff.balls} · BONUS ×${mult} · RECORD ${Math.max(score, bestCache).toLocaleString("it-IT")}`, 210, 82);
    if (saveT > 0 && state === "play") { ctx.fillStyle = Math.floor(clock * 6) % 2 ? "#7dff9a" : "rgba(125,255,154,0.4)"; ctx.font = "800 11px system-ui, sans-serif"; ctx.fillText("SALVAPALLA ATTIVO", 210, 640); }
    if (message && message.text) {
      ctx.globalAlpha = Math.min(1, (1.8 - message.t) * 2);
      ctx.font = "900 28px system-ui, sans-serif"; ctx.lineWidth = 6; ctx.strokeStyle = th.dark;
      ctx.strokeText(message.text, 210, 440); ctx.fillStyle = message.color; ctx.fillText(message.text, 210, 440);
      ctx.globalAlpha = 1;
    }
    if (state === "drain" && tally) {
      ctx.fillStyle = th.dark; ctx.fillRect(40, 380, 340, 110);
      ctx.fillStyle = "#fff6ea"; ctx.font = "900 22px system-ui, sans-serif"; ctx.fillText("PALLA PERSA", 210, 414);
      ctx.font = "800 15px system-ui, sans-serif"; ctx.fillStyle = th.text; ctx.fillText(`bonus ${tally.bonus} × ${tally.mult}`, 210, 442);
      ctx.fillStyle = th.gold; ctx.font = "900 20px system-ui, sans-serif"; ctx.fillText(`+${tally.shown.toLocaleString("it-IT")}`, 210, 472);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

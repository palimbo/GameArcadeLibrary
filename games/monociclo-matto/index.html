<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Monociclo Matto</title>
<style>
  :root {
    --bg: #1a0a2a;
    --fg: #f4f6ee;
    --muted: #d8b8e8;
    --pink: #ff5a9a;
    --yellow: #ffd23a;
    --red: #ff4a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #4a2a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 246, 238, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick: ride left and right; CALCIO kicks a low balloon back up */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 90, 154, 0.6); background: radial-gradient(circle, rgba(255,90,154,0.14), rgba(255,90,154,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(255, 90, 154, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,246,238,0.25); pointer-events: none; }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg);
    font: 800 13px system-ui, sans-serif; letter-spacing: 1px; border: 2px solid rgba(255, 176, 58, 0.9); background: rgba(255, 176, 58, 0.22); }
  #touch .jump.on { background: rgba(255, 176, 58, 0.55); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .jump { width: 80px; height: 80px; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(26, 10, 42, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(32px, 10vw, 58px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--pink);
    text-shadow: 3px 3px 0 #6a1a3a, 0 0 22px rgba(255,90,154,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--pink); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,246,238,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--pink); color: #2a0418; background: var(--pink); padding: 11px 30px; box-shadow: 0 4px 0 #b82a6a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <button type="button" class="jump" aria-label="Calcio">CALCIO</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>


<script>
(() => {
  "use strict";

  const W = 640, H = 360, TAU = Math.PI * 2, TOP = 28;
  const GY = 336, X0 = 24, X1 = W - 24;           // the ring floor and its edges
  const HEAD = 62, BH = 15, BR = 9, MAXSTACK = 11;  // head height above floor, stack step, balloon radius
  const ACC = 1500, VMAX = 300, KICK_R = 44, KICK_LOW = 90;
  const COLS = ["#ff4a6a", "#ffd23a", "#4ad0ff", "#7ae05a", "#c87aff", "#ff9a3a"];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · palloncini lenti, pochi insieme · spilli rari", lives: 5, fall: 0.8, many: 0.7, pins: 0.5 },
    normale:   { label: "NORMALE",   color: "#ff5a9a", desc: "3 vite", lives: 3, fall: 1, many: 1, pins: 1 },
    difficile: { label: "DIFFICILE", color: "#ff5a5a", desc: "3 vite · palloncini svelti e numerosi · tanti spilli", lives: 3, fall: 1.2, many: 1.3, pins: 1.5 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "monociclo-difficulty";
  const bestKey = (id) => `monociclo-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    catch: lim((n) => beep(400 + n * 70, 0.1, "sine", 0.05, 200)),
    kick: lim(() => { noise(0.06, 0.08, 1200); beep(300, 0.12, "square", 0.04, 500); }),
    whiff: lim(() => noise(0.06, 0.03, 2500)),
    pop: lim(() => { noise(0.2, 0.2, 2000); beep(900, 0.08, "square", 0.03, -600); }),
    pin: lim(() => beep(1800, 0.1, "sine", 0.025, 600)),
    honk: () => arp([392, 330], 0.12, 0.14, "sawtooth", 0.04),
    round: () => arp([523, 659, 784, 659, 784, 1047], 0.08, 0.14, "square", 0.045),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 1, bestCache = 0, nextLife = 20000;
  let C = null, stack = [], falling = [], parts = [], popups = [], message = null;
  let toSpawn = 0, spawnT = 0, pinT = 0, lastBy = "", lean = 0, leanV = 0;
  let kickPressed = false;
  const keys = { left: false, right: false };
  const stick = { x: 0, y: 0 };
  const lights = Array.from({ length: 26 }, (_, i) => i);

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 1; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    C = { x: W / 2, vx: 0, kick: 0, face: 1, wheel: 0, hurt: 0 };
    beginRound();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  const fallSpeed = () => 46 * diff.fall * Math.min(1.9, 1 + 0.08 * (level - 1));
  const maxAtOnce = () => Math.min(5, Math.max(1, Math.round((1 + (level - 1) * 0.45) * diff.many)));
  function beginRound() {
    stack = []; falling = []; lean = 0; leanV = 0;
    toSpawn = 10 + level * 2; spawnT = 1; pinT = level >= 2 ? rnd(5, 8) / diff.pins : 1e9;
    message = { text: `NUMERO ${level}`, sub: `${toSpawn} palloncini · impilali sulla testa!`, t: 0 };
    state = "intro"; stateT = 1.6;
  }
  function addScore(n, x, y, color = "#ffffff", text) {
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; arp([523, 659, 784, 1047, 1319], 0.07, 0.12); popups.push({ x: W / 2, y: 80, text: "VITA EXTRA!", color: "#7ae05a", t: 0 }); }
    if (x !== undefined) popups.push({ x, y, text: text || String(n), color, t: 0 });
  }
  function burst(x, y, c, n = 12, sp = 110, life = 0.6) {
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, s = sp * rnd(0.3, 1); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: life * rnd(0.6, 1.2), c }); }
  }
  function loseLife(by) {
    if (state !== "play") return;
    if (window.__deaths) window.__deaths.push([level, by]);
    if (window.__god) return;
    lives--; lastBy = by; sfx.honk();
    state = "dead"; stateT = 1.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    sfx.over();
    menu = () => showOverlay(
      `<h2 class="lose">${lives <= 0 ? "VITE FINITE!" : "PARTITA FINITA"}</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · numero ${level} · ${diff.label}</p>
       ${record ? "<p style='color:var(--pink)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  // the pause menu can end the game (shared/iniziali.js): it ends here the usual way, saving the record
  window.addEventListener("sala:termina", () => { if (state !== "paused") return; state = pausedFrom; overlay.classList.add("hidden"); gameOver(); syncControls(); });
  function syncControls() {
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>MONOCICLO MATTO</h1>
       <p>Il clown del circo pedala sul monociclo e dall'alto piovono palloncini: prendili sulla testa e impilali uno sull'altro! Se uno ti sfugge, prima che tocchi terra puoi rilanciarlo in alto con un calcio. Attento agli spilli: bucano la pila.</p>
       <div class="pts">
         <span><b>Presa</b></span><span>10 × l'altezza della pila: più è alta, più vale (ma ondeggia quando corri)</span>
         <span><b>Calcio</b></span><span>30 · rimanda in alto un palloncino basso vicino ai piedi</span>
         <span><b>Fine numero</b></span><span>100 per ogni palloncino in pila × il numero</span>
         <span><b>Attento</b></span><span>un palloncino che tocca terra scoppia: perdi una vita</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Levetta a destra e sinistra per pedalare · CALCIO per rilanciare un palloncino basso</p>`
         : `<p class="muted help">Frecce o A D per pedalare · SPAZIO, J o Z per il calcio · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>IN PISTA!</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

  // ---------- Input ----------
  const KEYMAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  const KICKKEYS = [" ", "j", "z", "x", "arrowup", "w"];
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (state === "menu" || state === "over") {
      if (e.key === "Enter") startGame();
      else if (["1", "2", "3"].includes(k)) setDifficulty(DIFF_IDS[+k - 1]);
      return;
    }
    if (k === "p" || k === "escape") { if (!e.repeat) togglePause(); return; }
    if (state === "paused") { if (e.key === "Enter") togglePause(); return; }
    if (KICKKEYS.includes(k) && !e.repeat) kickPressed = true;
    if (KEYMAP[k]) keys[KEYMAP[k]] = true;
  });
  window.addEventListener("keyup", (e) => { const m = KEYMAP[e.key.toLowerCase()]; if (m) keys[m] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (isPlaying()) togglePause(); });
  const kickBtn = touchEl.querySelector(".jump");
  kickBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); kickPressed = true; kickBtn.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) kickBtn.addEventListener(ev, () => kickBtn.classList.remove("on"));
  const stickEl = touchEl.querySelector(".stick"), knob = stickEl.querySelector(".knob");
  let stickId = null;
  function stickAt(e) {
    const r = stickEl.getBoundingClientRect(), max = r.width / 2 - 14;
    let dx = clamp(e.clientX - (r.left + r.width / 2), -max, max);
    knob.style.transform = `translate(${dx}px, 0px)`;
    const m = Math.abs(dx) / max;
    stick.x = m < 0.12 ? 0 : Math.sign(dx) * Math.min(1, (m - 0.12) / 0.6);
  }
  const stickEnd = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; stick.x = stick.y = 0; };
  stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; try { stickEl.setPointerCapture(e.pointerId); } catch { /* ignore */ } stickAt(e); });
  stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickAt(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stickEl.addEventListener(ev, stickEnd);
  window.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" && !touchMode) { touchMode = true; syncControls(); if (menu) menu(); } }, true);

  // ---------- Update ----------
  // where the top of the pile is: it leans the other way when the clown speeds up
  const headY = () => GY - HEAD;
  const stackTopY = () => headY() - 10 - stack.length * BH;
  const stackX = (i) => C.x + lean * i * i * 0.08;
  function updateClown(dt) {
    const ix = clamp(stick.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), -1, 1);
    const ovx = C.vx;
    if (Math.abs(ix) > 0.05) { C.vx += ix * ACC * dt; C.face = Math.sign(ix); }
    else C.vx -= Math.sign(C.vx) * Math.min(Math.abs(C.vx), ACC * 0.8 * dt);
    const vm = VMAX * (1 - Math.min(0.35, stack.length * 0.025));
    C.vx = clamp(C.vx, -vm, vm);
    C.x += C.vx * dt;
    if (C.x < X0 + 12 || C.x > X1 - 12) { C.x = clamp(C.x, X0 + 12, X1 - 12); C.vx = 0; }
    C.wheel += C.vx * dt / 12;
    // the pile sways like a spring
    const accel = (C.vx - ovx) / dt;
    leanV += (-accel * 0.03 - lean * 30 - leanV * 6) * dt;
    lean = clamp(lean + leanV * dt, -3, 3);
    C.kick = Math.max(0, C.kick - dt); C.hurt = Math.max(0, C.hurt - dt);
    if (kickPressed && C.kick <= 0) {
      C.kick = 0.3;
      let hit = false;
      for (const b of falling) {
        if (b.pin || b.vy < 0 || Math.abs(b.x - C.x) > KICK_R || b.y < GY - KICK_LOW || b.y > GY) continue;
        b.vy = -rnd(400, 460); b.vx = (b.x - C.x) * 1.5 + rnd(-30, 30); b.kicked = true; hit = true;
        addScore(30, b.x, b.y - 16, "#ffd23a");
      }
      if (hit) sfx.kick(); else sfx.whiff();
    }
    kickPressed = false;
  }
  function spawnBalloon() {
    const x = rnd(X0 + 30, X1 - 30);
    falling.push({ x, y: TOP - 12, vx: rnd(-10, 10), vy: fallSpeed() * rnd(0.85, 1.15), c: pick(COLS), sway: rnd(0, TAU) });
  }
  function updateFalling(dt) {
    const fs = fallSpeed();
    if (toSpawn > 0) {
      spawnT -= dt;
      const inAir = falling.filter((b) => !b.pin).length;
      if (spawnT <= 0 && inAir < maxAtOnce()) { spawnBalloon(); toSpawn--; spawnT = rnd(1.4, 2.4) / (1 + (level - 1) * 0.06) / diff.many; }
    }
    pinT -= dt;
    if (pinT <= 0 && toSpawn > 0) {
      // a pin dropped right where the clown is heading
      falling.push({ x: clamp(C.x + C.vx * 0.8 + rnd(-60, 60), X0 + 20, X1 - 20), y: TOP - 10, vx: 0, vy: fs * 1.6, pin: true });
      pinT = rnd(6, 10) / diff.pins / (1 + (level - 2) * 0.08); sfx.pin();
    }
    const top = stackTopY();
    for (const b of falling) {
      if (b.vy < fs && !b.pin) b.vy = Math.min(fs, b.vy + 520 * dt);
      b.sway = (b.sway || 0) + dt * 2;
      b.x = clamp(b.x + (b.vx + (b.pin ? 0 : Math.sin(b.sway) * 14)) * dt, X0 + 10, X1 - 10);
      b.vx *= Math.pow(0.4, dt);
      const py = b.y; b.y += b.vy * dt;
      if (b.y < TOP - 30) { b.y = TOP - 30; b.vy = 0; }
      if (b.vy <= 0) continue;
      // landing on the top of the pile (or on the head)
      const tx = stackX(stack.length + 1), r = b.pin ? 4 : BR;
      if (py + r <= top + 2 && b.y + r >= top - 2 && Math.abs(b.x - tx) < 15) {
        b.gone = true;
        if (b.pin) {
          if (stack.length) { const c = stack.pop(); sfx.pop(); burst(tx, top + BH / 2, c, 14, 120, 0.5); popups.push({ x: tx, y: top - 10, text: "BUCATO!", color: "#ff4a4a", t: 0 }); }
          else { C.hurt = 1; burst(C.x, headY() - 6, "#ffffff", 10, 80, 0.4); loseLife("UNO SPILLO"); }
        } else if (stack.length < MAXSTACK) {
          stack.push(b.c); const n = stack.length;
          addScore(10 * n, tx, top - 14, "#ffffff"); sfx.catch(n);
        } else { addScore(100, tx, top - 14, "#ffd23a", "PILA PIENA +100"); sfx.catch(MAXSTACK); }
        continue;
      }
      if (b.y >= GY - (b.pin ? 2 : BR)) {
        b.gone = true;
        if (b.pin) { burst(b.x, GY - 2, "#c8c8d8", 4, 40, 0.3); continue; }
        sfx.pop(); burst(b.x, GY - 8, b.c, 16, 130, 0.5);
        loseLife("UN PALLONCINO SCOPPIATO");
      }
    }
    falling = falling.filter((b) => !b.gone);
  }
  function update(dt) {
    clock += dt; sfxN = 0;
    if (message) { message.t += dt; if (message.t > 2.4) message = null; }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 20 * dt; }
    popups = popups.filter((p) => p.t < 1.1);
    if (!isPlaying()) return;
    if (state === "intro") { stateT -= dt; updateClown(dt); if (stateT <= 0) state = "play"; return; }
    if (state === "dead") {
      stateT -= dt;
      if (stateT <= 0) {
        if (lives <= 0) { gameOver(); return; }
        // what was in the air is lost, the round goes on
        falling = []; spawnT = 1.2; state = "play";
      }
      return;
    }
    if (state === "clear") { stateT -= dt; if (stateT <= 0) { level++; beginRound(); } return; }
    if (window.__bot) window.__bot(dt);
    updateClown(dt);
    updateFalling(dt);
    if (state === "play" && toSpawn <= 0 && !falling.some((b) => !b.pin)) {
      const b = stack.length * 100 * level;
      addScore(b);
      message = { text: "BRAVO!", sub: `${stack.length} palloncini in pila × 100 × ${level} = ${b.toLocaleString("it-IT")}`, t: 0 };
      sfx.round(); state = "clear"; stateT = 2.4; falling = [];
    }
  }

  // ---------- Drawing ----------
  function drawRing() {
    const g = ctx.createLinearGradient(0, TOP, 0, GY);
    g.addColorStop(0, "#1a0a2a"); g.addColorStop(1, "#4a1a4a");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    // the big top: red and white stripes
    for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.06)" : "rgba(255,60,90,0.1)"; ctx.beginPath(); ctx.moveTo(W / 2, TOP - 60); ctx.lineTo(i * 44 - 30, H); ctx.lineTo(i * 44 + 14, H); ctx.closePath(); ctx.fill(); }
    // spotlights
    const sx = C ? C.x : W / 2;
    const sg = ctx.createRadialGradient(sx, GY, 10, sx, GY, 120); sg.addColorStop(0, "rgba(255,240,200,0.25)"); sg.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = sg; ctx.fillRect(sx - 130, GY - 140, 260, 160);
    // bunting lights along the top
    for (const i of lights) { const x = 12 + i * 24.4, y = TOP + 8 + Math.sin(i * 0.7) * 3; ctx.fillStyle = (i + Math.floor(clock * 4)) % 3 === 0 ? "#ffe85a" : "#8a5a2a"; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU); ctx.fill(); }
    // the ring floor
    ctx.fillStyle = "#c8343a"; ctx.fillRect(0, GY, W, H - GY);
    ctx.fillStyle = "#ffe85a"; for (let x = 0; x < W; x += 32) ctx.fillRect(x, GY, 16, 4);
    ctx.fillStyle = "#6a1a2a"; ctx.fillRect(0, GY + 4, W, 2);
    ctx.fillStyle = "#2a0a1a"; ctx.fillRect(0, TOP, X0 - 8, GY - TOP); ctx.fillRect(X1 + 8, TOP, W - X1 - 8, GY - TOP);
  }
  function drawBalloon(x, y, c, s = 1, string = true) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    if (string) { ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, BR); ctx.quadraticCurveTo(3, BR + 5, 0, BR + 10); ctx.stroke(); }
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, BR, BR * 1.08, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2, BR); ctx.lineTo(2, BR); ctx.lineTo(0, BR + 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.beginPath(); ctx.ellipse(-3, -4, 2.2, 3.2, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawPin(b) {
    ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(b.x, b.y - 12); ctx.lineTo(b.x, b.y + 5); ctx.stroke();
    ctx.fillStyle = "#ff3a3a"; ctx.beginPath(); ctx.arc(b.x, b.y - 13, 3.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,80,80,0.5)"; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(b.x, b.y + 8); ctx.lineTo(b.x, GY); ctx.stroke(); ctx.setLineDash([]);
  }
  function drawClown() {
    const x = C.x, gy = GY, hy = headY(), f = C.face;
    // wheel
    ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, gy - 11, 10, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) { const a = C.wheel + i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 10, gy - 11 + Math.sin(a) * 10); ctx.lineTo(x - Math.cos(a) * 10, gy - 11 - Math.sin(a) * 10); ctx.stroke(); }
    ctx.fillStyle = "#3a3a42"; ctx.fillRect(x - 1.5, gy - 30, 3, 19); ctx.fillRect(x - 6, gy - 32, 12, 3);
    // legs pedalling (or one kicking out)
    ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    const pa = C.wheel;
    if (C.kick > 0.1) { ctx.beginPath(); ctx.moveTo(x, gy - 33); ctx.lineTo(x + f * 22, gy - 16 - (0.3 - C.kick) * 30); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, gy - 33); ctx.lineTo(x - f * 2, gy - 11 + 6); ctx.stroke(); }
    else for (const s of [0, Math.PI]) { ctx.beginPath(); ctx.moveTo(x, gy - 33); ctx.lineTo(x + Math.cos(pa + s) * 6, gy - 11 + Math.sin(pa + s) * 6); ctx.stroke(); }
    ctx.lineCap = "butt";
    // body: baggy striped suit
    ctx.fillStyle = "#4ad0ff"; ctx.beginPath(); ctx.ellipse(x, hy + 18, 10, 13, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ff4a6a"; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + i * 5, hy + 16 + Math.abs(i) * 3, 2.2, 0, TAU); ctx.fill(); }
    // arms out for balance
    const tilt = clamp(-C.vx / 300, -0.6, 0.6);
    ctx.strokeStyle = "#4ad0ff"; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x - 8, hy + 12); ctx.lineTo(x - 18, hy + 6 + tilt * 10); ctx.moveTo(x + 8, hy + 12); ctx.lineTo(x + 18, hy + 6 - tilt * 10); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x - 19, hy + 6 + tilt * 10, 3, 0, TAU); ctx.arc(x + 19, hy + 6 - tilt * 10, 3, 0, TAU); ctx.fill();
    // ruff and head
    ctx.fillStyle = "#ffffff"; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(x + i * 4, hy + 6, 3.5, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#ffe8d8"; ctx.beginPath(); ctx.arc(x, hy - 2, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ff8a3a"; ctx.beginPath(); ctx.arc(x - 8, hy - 4, 4, 0, TAU); ctx.arc(x + 8, hy - 4, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ff2a3a"; ctx.beginPath(); ctx.arc(x + f * 2, hy - 1, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 4 + f, hy - 5, 1.8, 2.2); ctx.fillRect(x + 2 + f, hy - 5, 1.8, 2.2);
    ctx.strokeStyle = "#ff2a3a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + f, hy + 1, 3.5, 0.2, Math.PI - 0.2); ctx.stroke();
    if (C.hurt > 0) { ctx.fillStyle = "#ffd23a"; for (let i = 0; i < 3; i++) { const a = clock * 6 + i * 2.1; ctx.fillRect(x + Math.cos(a) * 11 - 1, hy - 12 + Math.sin(a) * 3, 2, 2); } }
    // the pile
    for (let i = 0; i < stack.length; i++) drawBalloon(stackX(i + 1), hy - 10 - i * BH - 8, stack[i], 0.95, false);
    // a faint guide above the pile: the catching spot
    const tx = stackX(stack.length + 1), ty = stackTopY();
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tx - 12, ty - 2); ctx.lineTo(tx + 12, ty - 2); ctx.stroke();
  }
  function drawHud() {
    ctx.fillStyle = "rgba(20,6,30,0.95)"; ctx.fillRect(0, 0, W, TOP);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const x0 = touchMode ? 130 : 10;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 15px system-ui"; ctx.fillText(score.toLocaleString("it-IT"), x0, 14);
    ctx.fillStyle = "#d8b8e8"; ctx.font = "700 9px system-ui"; ctx.fillText(`REC ${Math.max(bestCache, score).toLocaleString("it-IT")}`, x0 + 80, 9);
    ctx.fillStyle = "#ff5a9a"; ctx.font = "900 10px system-ui"; ctx.fillText(`NUMERO ${level}`, x0 + 80, 21);
    ctx.fillStyle = "#ffd23a"; ctx.font = "800 9px system-ui"; ctx.fillText(`PALLONCINI ${toSpawn + falling.filter((b) => !b.pin).length}`, x0 + 170, 9);
    ctx.fillStyle = "#4ad0ff"; ctx.fillText(`PILA ${stack.length}/${MAXSTACK}`, x0 + 170, 21);
    const lx = touchMode ? W - 60 : W - 12;
    for (let i = 0; i < Math.min(lives - (state === "dead" ? 0 : 1), 6); i++) { const cx = lx - i * 14; ctx.fillStyle = "#ffe8d8"; ctx.beginPath(); ctx.arc(cx, 14, 5, 0, TAU); ctx.fill(); ctx.fillStyle = "#ff2a3a"; ctx.beginPath(); ctx.arc(cx, 15, 1.8, 0, TAU); ctx.fill(); }
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!C) { C = { x: W / 2 - 60, vx: 0, kick: 0, face: 1, wheel: 0, hurt: 0 }; stack = ["#ff4a6a", "#ffd23a", "#4ad0ff", "#7ae05a"]; falling = [{ x: 420, y: 120, c: "#c87aff", vy: 50 }, { x: 250, y: 80, c: "#ff9a3a", vy: 50 }]; }
    drawRing();
    for (const b of falling) b.pin ? drawPin(b) : drawBalloon(b.x, b.y, b.c);
    drawClown();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#1a0a2a"; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (state === "menu") return;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 26px system-ui"; ctx.fillStyle = "#ff5a9a";
      ctx.lineWidth = 5; ctx.strokeStyle = "#1a0a2a"; ctx.strokeText(message.text, W / 2, 110); ctx.fillText(message.text, W / 2, 110);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.fillStyle = "#ffffff"; ctx.strokeText(message.sub, W / 2, 130); ctx.fillText(message.sub, W / 2, 130); }
      ctx.globalAlpha = 1;
    }
    if (state === "dead") {
      ctx.textAlign = "center"; ctx.font = "900 17px system-ui"; ctx.fillStyle = "#ff3a3a"; ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      const t = lastBy === "UNO SPILLO" ? "AHI! UNO SPILLO IN TESTA!" : "PALLONCINO SCOPPIATO!";
      ctx.strokeText(t, W / 2, 170); ctx.fillText(t, W / 2, 170);
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="monociclo-best-" data-kind="score"></script>

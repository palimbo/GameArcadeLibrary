<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pinguino di Ghiaccio</title>
<style>
  :root {
    --bg: #04101c;
    --fg: #f0fbff;
    --muted: #9ac0d8;
    --ice: #7fe3ff;
    --gold: #ffd34d;
    --bad: #ff4f6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #1a3a5a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(240, 251, 255, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; pointer-events: auto; }
  #touch .pad [data-a="up"] { grid-column: 2; grid-row: 1; }
  #touch .pad [data-a="left"] { grid-column: 1; grid-row: 2; }
  #touch .pad [data-a="right"] { grid-column: 3; grid-row: 2; }
  #touch .pad [data-a="down"] { grid-column: 2; grid-row: 3; }
  #touch button {
    width: 56px; height: 56px; border-radius: 14px; touch-action: none;
    font: 700 22px system-ui, sans-serif; color: var(--fg);
    border: 2px solid rgba(127, 227, 255, 0.6); background: rgba(127, 227, 255, 0.08);
  }
  #touch button[data-a="push"] { width: 92px; height: 92px; border-radius: 50%; border-color: rgba(255, 211, 77, 0.9); background: rgba(255, 211, 77, 0.14); font: 800 14px system-ui, sans-serif; letter-spacing: 1px; pointer-events: auto; }
  #touch.small .pad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  #touch.small button { width: 44px; height: 44px; font-size: 17px; }
  #touch.small button[data-a="push"] { width: 70px; height: 70px; font-size: 12px; }
  #touch button.on { background: rgba(240, 251, 255, 0.4); }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(4, 16, 28, 0.88);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(34px, 9vw, 58px); font-weight: 900; letter-spacing: 2px; color: var(--ice); text-shadow: 3px 3px 0 #1a5a8a, 0 0 18px rgba(127, 227, 255, 0.5); }
  #overlay h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 2px; }
  #overlay h2.lose { color: var(--bad); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(240,251,255,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--ice); color: #03202e; background: var(--ice); padding: 11px 30px; box-shadow: 0 4px 0 #1a6a8a; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="pad">
    <button type="button" data-a="up" aria-label="Su">▲</button>
    <button type="button" data-a="left" aria-label="Sinistra">◀</button>
    <button type="button" data-a="right" aria-label="Destra">▶</button>
    <button type="button" data-a="down" aria-label="Giù">▼</button>
  </div>
  <button type="button" data-a="push" aria-label="Spingi">SPINGI</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const COLS = 13, ROWS = 15, CELL = 32, OX = 12, OY = 48;
  const W = COLS * CELL + OX * 2, H = ROWS * CELL + OY + 12;
  const EMPTY = 0, ICE = 1, DIAMOND = 2;
  const PSPEED = 5.2, SLIDE = 13;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const CRUSH = [0, 400, 1600, 3200, 6400, 12800];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7dff9a", desc: "5 vite · api lente che rompono di rado il ghiaccio", lives: 5, speed: 0.8, chew: 0.5 },
    normale:   { label: "NORMALE",   color: "#7fe3ff", desc: "3 vite · l'esperienza classica", lives: 3, speed: 1, chew: 1 },
    difficile: { label: "DIFFICILE", color: "#ff4f6a", desc: "3 vite · api veloci che rompono spesso il ghiaccio", lives: 3, speed: 1.2, chew: 1.6 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "pinguino-difficulty";
  const bestKey = (id) => `pinguino-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const px = (c) => OX + c * CELL + CELL / 2, py = (r) => OY + r * CELL + CELL / 2;

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrap.style.paddingBottom = showTouch && portrait ? "calc(190px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 190;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 260) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 4) fn(...a); };
  const sfx = {
    push: lim(() => beep(300, 0.12, "triangle", 0.05, 300)),
    stop: lim(() => beep(180, 0.06, "square", 0.04)),
    shatter: lim(() => noise(0.3, 0.3, 2500)),
    crush: lim((n) => arp([523, 659, 784, 1047, 1319].slice(0, 2 + n), 0.05, 0.1)),
    wall: () => { beep(80, 0.4, "sawtooth", 0.05, 30); noise(0.3, 0.2, 400); },
    stunKill: lim(() => arp([784, 1047], 0.05, 0.08)),
    egg: lim(() => arp([1319, 1047], 0.06, 0.08, "triangle", 0.05)),
    hatch: () => arp([330, 440, 330], 0.08, 0.1, "square", 0.03),
    chew: lim(() => beep(120 + Math.random() * 60, 0.04, "square", 0.02)),
    diamonds: () => arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.08, 0.14, "triangle", 0.05),
    die: () => arp([784, 740, 698, 659, 622, 587, 554, 523], 0.08, 0.1),
    clear: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1, 0.16),
    over: () => arp([523, 415, 330, 262], 0.18, 0.25),
    life: () => arp([523, 784, 1047, 1319], 0.08, 0.12, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, bestCache = 0, nextLife = 20000, levelT = 0;
  let grid = [], eggs = new Set(), hero = null, bees = [], sliding = [], hatching = [], parts = [], popups = [], wallShake = null, message = null, diamondsDone = false;
  const ctl = { up: false, down: false, left: false, right: false, push: false };
  let pushPressed = false, lastDir = null;

  const key = (c, r) => r * COLS + c;
  const inside = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
  const cell = (c, r) => (inside(c, r) ? grid[r][c] : -1);
  const beeSpeed = () => 2.7 * diff.speed * (1 + Math.min(0.5, level * 0.06)) * (levelT > 60 ? 1.3 : 1);

  function buildLevel() {
    // a maze carved out of solid ice
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(ICE));
    const seen = new Set();
    const stack = [[6, 6]];
    grid[6][6] = EMPTY; seen.add(key(6, 6));
    while (stack.length) {
      const [c, r] = stack[stack.length - 1];
      const opts = [[2, 0], [-2, 0], [0, 2], [0, -2]].filter(([dx, dy]) => inside(c + dx, r + dy) && !seen.has(key(c + dx, r + dy)));
      if (!opts.length) { stack.pop(); continue; }
      const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
      grid[r + dy / 2][c + dx / 2] = EMPTY; grid[r + dy][c + dx] = EMPTY;
      seen.add(key(c + dx, r + dy)); stack.push([c + dx, r + dy]);
    }
    // knock out some extra blocks so there are loops
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] === ICE && Math.random() < 0.1) grid[r][c] = EMPTY;
    // three diamond blocks, away from the edges
    const iceCells = [];
    for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) if (grid[r][c] === ICE) iceCells.push([c, r]);
    for (let k = 0; k < 3 && iceCells.length; k++) {
      const i = Math.floor(Math.random() * iceCells.length);
      const [c, r] = iceCells.splice(i, 1)[0];
      grid[r][c] = DIAMOND;
    }
    // the hero in the middle
    hero = { c: 6, r: 6, tc: 6, tr: 6, x: px(6), y: py(6), face: "down", walk: 0, pushT: 0, inv: 0, dead: false };
    grid[6][6] = EMPTY;
    // Sno-Bees: some awake, the rest waiting inside eggs in the ice
    const active = Math.min(5, 3 + Math.floor(level / 2)), nEggs = Math.min(8, 3 + level);
    bees = []; eggs = new Set(); sliding = []; hatching = [];
    const free = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] === EMPTY && Math.abs(c - 6) + Math.abs(r - 6) >= 6) free.push([c, r]);
    for (let k = 0; k < active && free.length; k++) { const [c, r] = free.splice(Math.floor(Math.random() * free.length), 1)[0]; bees.push(newBee(c, r)); }
    const eggCells = iceCells.filter(([c, r]) => grid[r][c] === ICE && Math.abs(c - 6) + Math.abs(r - 6) >= 3);
    for (let k = 0; k < nEggs && eggCells.length; k++) { const [c, r] = eggCells.splice(Math.floor(Math.random() * eggCells.length), 1)[0]; eggs.add(key(c, r)); }
    levelT = 0; diamondsDone = false; wallShake = null;
    message = { text: `LIVELLO ${level + 1}`, sub: `Api delle nevi: ${bees.length + eggs.size} · le uova lampeggiano nel ghiaccio`, t: 0 };
    state = "intro"; stateT = 2.2;
  }
  function newBee(c, r) { return { c, r, tc: c, tr: r, x: px(c), y: py(r), dir: [0, 1], stun: 0, chew: 0, chewAt: null, dead: false, think: 0, face: 1 }; }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; lives = diff.lives; level = 0; nextLife = 20000;
    bestCache = parseInt(load(bestKey(difficulty)), 10) || 0;
    buildLevel();
    menu = null;
    overlay.classList.add("hidden");
    syncControls();
    last = performance.now();
  }
  function addScore(n, x, y, color = "#f0fbff") {
    score += n;
    if (x !== undefined) popups.push({ x, y, text: String(n), color, t: 0 });
    if (score >= nextLife) { nextLife += 30000; lives++; sfx.life(); popups.push({ x: W / 2, y: H / 2, text: "VITA EXTRA", color: "#ffd34d", t: 0, big: true }); }
  }
  function burst(x, y, color, n = 12, sp = 120) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.3 + Math.random() * 0.4, c: color });
    }
  }
  function killHero() {
    if (state !== "play" || hero.inv > 0) return;
    lives--; hero.dead = true;
    sfx.die();
    state = "dead"; stateT = 2;
  }
  function afterDeath() {
    if (lives <= 0) { gameOver(); return; }
    // back in the middle, with the bees pushed away from it
    const start = findFree(6, 6);
    Object.assign(hero, { c: start[0], r: start[1], tc: start[0], tr: start[1], x: px(start[0]), y: py(start[1]), dead: false, inv: 2 });
    for (const b of bees) if (Math.abs(b.c - hero.c) + Math.abs(b.r - hero.r) < 4) { const f = findFree(b.c < 6 ? 0 : 12, b.r < 7 ? 0 : 14); Object.assign(b, { c: f[0], r: f[1], tc: f[0], tr: f[1], x: px(f[0]), y: py(f[1]) }); }
    state = "play";
  }
  function findFree(c0, r0) {
    let best = [c0, r0], bd = 1e9;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] === EMPTY) { const d = Math.abs(c - c0) + Math.abs(r - r0); if (d < bd) { bd = d; best = [c, r]; } }
    return best;
  }
  function checkCleared() {
    if (bees.some((b) => !b.dead) || eggs.size || hatching.length) return;
    // the faster, the bigger the bonus
    const t = levelT;
    const bonus = t < 20 ? 5000 : t < 30 ? 2000 : t < 40 ? 1000 : t < 50 ? 500 : t < 60 ? 10 : 0;
    if (bonus) addScore(bonus);
    message = { text: "LIVELLO COMPLETATO!", sub: `${Math.round(t)} secondi${bonus ? ` · bonus ${bonus.toLocaleString("it-IT")}` : ""}`, t: 0 };
    sfx.clear();
    state = "clear"; stateT = 2.6;
  }
  function gameOver() {
    state = "over";
    const prev = parseInt(load(bestKey(difficulty)), 10) || 0;
    const record = score > prev;
    if (record) store(bestKey(difficulty), String(score));
    const played = diff.label, lv = level + 1;
    menu = () => showOverlay(
      `<h2 class="lose">GAME OVER</h2>
       <p>Punteggio: <b>${score.toLocaleString("it-IT")}</b> · Livello ${lv} · ${played}</p>
       ${record ? "<p style='color:var(--gold)'>★ NUOVO RECORD! ★</p>" : ""}
       ${difficultyHTML()}
       <button class="start" data-start>GIOCA ANCORA</button>`
    );
    menu();
    sfx.over();
    syncControls();
  }
  function togglePause() {
    if (isPlaying()) {
      pausedFrom = state; state = "paused";
      showOverlay(`<h2>PAUSA</h2><button class="start" data-resume>CONTINUA</button><p class="muted">Premi P per continuare</p>`);
    } else if (state === "paused") {
      state = pausedFrom; overlay.classList.add("hidden"); last = performance.now();
    }
    syncControls();
  }
  function syncControls() {
    const portrait = window.innerHeight > window.innerWidth;
    pauseBtn.style.display = isPlaying() && touchMode ? "block" : "none";
    Object.assign(pauseBtn.style, portrait
      ? { top: "auto", bottom: "calc(130px + env(safe-area-inset-bottom, 0px))", right: "30px", left: "auto" }
      : { top: "calc(10px + env(safe-area-inset-top, 0px))", bottom: "auto", right: "10px", left: "auto" });
    resize();
  }
  pauseBtn.addEventListener("click", () => togglePause());
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove("hidden"); }
  function difficultyHTML() {
    const buttons = DIFF_IDS.map((id) => {
      const d = DIFFICULTIES[id];
      return `<button type="button" data-diff="${id}" class="${id === difficulty ? "on" : ""}" style="--c:${d.color}">${d.label}</button>`;
    }).join("");
    const best = parseInt(load(bestKey(difficulty)), 10);
    return `<div class="diff">${buttons}</div><p class="muted">${diff.desc}${best ? ` · Record: ${best.toLocaleString("it-IT")}` : ""}</p>`;
  }
  function setDifficulty(id) { if (!DIFFICULTIES[id]) return; difficulty = id; diff = DIFFICULTIES[id]; store(DIFF_KEY, id); if (menu) menu(); }
  function showTitle() {
    menu = showTitle;
    showOverlay(
      `<h1>PINGUINO DI GHIACCIO</h1>
       <p>Le api delle nevi hanno invaso il labirinto di ghiaccio! Spingi i blocchi: scivolano finché non urtano qualcosa e schiacciano le api sul loro cammino. Un blocco bloccato si frantuma. Spingi il bordo del recinto per stordire le api che lo toccano, e metti in fila i tre blocchi di diamante per un bonus enorme.</p>
       <div class="pts">
         <span><b>Api schiacciate</b></span><span>400 · 1600 · 3200 · 6400 in un colpo</span>
         <span><b>Ape stordita</b></span><span>100 toccandola</span>
         <span><b>Uovo distrutto</b></span><span>500 rompendo il suo blocco</span>
         <span><b>Tre diamanti in fila</b></span><span>10.000 (5.000 contro il bordo)</span>
       </div>
       ${touchMode
         ? `<p class="muted help">Croce per muoverti · SPINGI per spingere il blocco davanti a te</p>`
         : `<p class="muted help">Frecce o W A S D per muoverti · SPAZIO per spingere · P pausa</p>`}
       ${difficultyHTML()}
       <button class="start" data-start>INIZIA</button>`
    );
  }
  overlay.addEventListener("click", (e) => {
    const d = e.target.closest("[data-diff]");
    if (d) { setDifficulty(d.dataset.diff); return; }
    if (e.target.closest("[data-start]")) startGame();
    if (e.target.closest("[data-resume]")) togglePause();
  });

      ctx.fillText(message.text, W / 2, H / 2 - 10);
      if (message.sub) { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#f0fbff"; ctx.fillText(message.sub, W / 2, H / 2 + 16); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(loop);
  }
  syncControls();
  buildLevel(); state = "menu"; message = null;
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sergente di Ferro</title>
<style>
  :root {
    --bg: #11160c;
    --fg: #f4f0e0;
    --muted: #b8b89a;
    --khaki: #ffb43a;
    --yellow: #ffe04a;
    --red: #ff4a3a;
    --green: #8ad84a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 2px #2a3a1a, 0 10px 40px rgba(0,0,0,0.6); }
  #pauseBtn {
    position: fixed; z-index: 3; display: none; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    font: 700 13px system-ui, sans-serif; color: var(--fg);
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(244, 240, 224, 0.35);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  #touch {
    position: fixed; z-index: 2; display: none; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  /* thumb stick to walk and aim, a button to fire and one to throw a grenade */
  #touch .stick { position: relative; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(138, 216, 74, 0.6); background: radial-gradient(circle, rgba(138,216,74,0.14), rgba(138,216,74,0.04)); }
  #touch .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: rgba(138, 216, 74, 0.45); border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }
  #touch .stick .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(244,240,224,0.25); pointer-events: none; }
  #touch .btns { display: flex; align-items: flex-end; gap: 10px; }
  #touch .btns button { border-radius: 50%; pointer-events: auto; touch-action: none; color: var(--fg); font: 800 12px system-ui, sans-serif; letter-spacing: 1px; }
  #touch .fire { width: 96px; height: 96px; border: 2px solid rgba(255, 180, 58, 0.9); background: rgba(255, 180, 58, 0.22); }
  #touch .bomb { width: 70px; height: 70px; margin-bottom: 60px; border: 2px solid rgba(255, 74, 58, 0.9); background: rgba(255, 74, 58, 0.22); }
  #touch .fire.on { background: rgba(255, 180, 58, 0.6); }
  #touch .bomb.on { background: rgba(255, 74, 58, 0.6); }
  #touch.small .stick { width: 112px; height: 112px; }
  #touch.small .stick .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch.small .btns { flex-direction: column-reverse; align-items: center; }
  #touch.small .fire { width: 80px; height: 80px; font-size: 11px; }
  #touch.small .bomb { width: 60px; height: 60px; margin-bottom: 0; font-size: 10px; }
  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; text-align: center; overflow-y: auto;
    background: rgba(17, 22, 12, 0.93);
  }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  #homeLink {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 6;
    font: 600 13px/1 system-ui, sans-serif; color: #fff; text-decoration: none;
    padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
  }
  #homeLink:hover { background: rgba(0,0,0,.8); }
  #overlay.hidden ~ #homeLink { display: none; }
  @media (max-width: 700px) { #overlay { padding-top: calc(52px + env(safe-area-inset-top, 0px)); } }
  #overlay h1 { font-size: clamp(30px, 9vw, 56px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: var(--khaki);
    text-shadow: 3px 3px 0 #3a2a0a, 0 0 22px rgba(255,180,58,0.35); }
  #overlay h2 { font-size: clamp(26px, 7vw, 42px); font-weight: 900; letter-spacing: 2px; color: var(--green); }
  #overlay h2.lose { color: var(--red); }
  #overlay p { max-width: 540px; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.55; }
  #overlay p.muted { color: var(--muted); }
  #overlay .pts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; font-size: 13px; color: var(--muted); text-align: left; max-width: 560px; }
  #overlay .pts b { color: var(--fg); }
  #overlay .diff { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font: 800 15px system-ui, sans-serif; letter-spacing: 1.5px; color: var(--fg);
    background: transparent; cursor: pointer;
    border: 2px solid rgba(244,240,224,0.3); border-radius: 10px; padding: 9px 16px;
  }
  #overlay .diff button.on { border-color: var(--c); color: var(--c); box-shadow: 0 0 12px var(--c); }
  #overlay button.start { border-color: var(--khaki); color: #2a1a00; background: var(--khaki); padding: 11px 30px; box-shadow: 0 4px 0 #8a5a10; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; }
    #overlay h1 { font-size: 30px; }
    #overlay p { font-size: 13px; line-height: 1.4; }
    #overlay .help, #overlay .pts { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="stick" aria-label="Levetta"><div class="ring"></div><div class="knob"></div></div>
  <div class="btns">
    <button type="button" class="bomb" aria-label="Lancia una granata">BOMBA</button>
    <button type="button" class="fire" aria-label="Spara">FUOCO</button>
  </div>
</div>
<button id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
<div id="overlay"></div>
<a id="homeLink" href="../../index.html">← Sala Giochi</a>

<script>
(() => {
  "use strict";

  const W = 360, H = 560, TAU = Math.PI * 2, HUD = 30;
  const T = 24, COLS = 15, ROWS = 170, D = ROWS * T, PR = 7;
  // tiles: floor, obstacle, water, sandbags, road, bridge, bunker, fort wall, fort gate
  const FLOOR = 0, ROCK = 1, WATER = 2, BAGS = 3, ROAD = 4, BRIDGE = 5, BUNKER = 6, WALL = 7, GATE = 8;
  const blocksMove = (t) => t === ROCK || t === WATER || t === BAGS || t === BUNKER || t === WALL || t === GATE;
  const blocksShot = (t) => t === ROCK || t === BUNKER || t === WALL || t === GATE;
  const walkable = (t) => t === FLOOR || t === ROAD || t === BRIDGE;

  const THEMES = [
    { name: "La Giungla", ground: "#4a7a34", ground2: "#467630", tuft: "#5a8a3a", rock: "tree", water: "#2a7ab0", water2: "#4a9ad0", road: "#8a6a44", enemy: "#5a6a8a", helm: "#3a4a6a" },
    { name: "Il Deserto", ground: "#d8b474", ground2: "#d2ae6e", tuft: "#b89a5a", rock: "stone", water: "#3a9ac0", water2: "#6ac0e0", road: "#9a8a6a", enemy: "#3a4a7a", helm: "#1e2a4e" },
    { name: "La Città in Rovina", ground: "#7a7a80", ground2: "#76767c", tuft: "#8a8a90", rock: "rubble", water: "#3a5a7a", water2: "#5a7a9a", road: "#4a4a50", enemy: "#4a5a4a", helm: "#2a3a2a" },
    { name: "La Valle Innevata", ground: "#e4ecf2", ground2: "#dfe8ef", tuft: "#c8d4e0", rock: "pine", water: "#5aa0d0", water2: "#9ad0f0", road: "#a0a8b4", enemy: "#6a4a6a", helm: "#4a2a4a" },
  ];

  const DIFFICULTIES = {
    facile:    { label: "FACILE",    color: "#7ed87a", desc: "5 vite · nemici lenti, colpi radi", lives: 5, pace: 0.9, bullet: 140, cool: 1.9, density: 1.1 },
    normale:   { label: "NORMALE",   color: "#ffb43a", desc: "3 vite · l'esperienza classica", lives: 3, pace: 1.05, bullet: 155, cool: 1.75, density: 1.2 },
    difficile: { label: "DIFFICILE", color: "#ff4a3a", desc: "3 vite · nemici numerosi e rapidi di mira", lives: 3, pace: 1.2, bullet: 175, cool: 1.5, density: 1.4 },
  };
  const DIFF_IDS = Object.keys(DIFFICULTIES);
  const DIFF_KEY = "sergente-difficulty";
  const bestKey = (id) => `sergente-best-${id}`;
  function store(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const irnd = (a, b) => Math.floor(rnd(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sign = (v) => (v < 0 ? -1 : 1);

  // ---------- Canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrapEl = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const touchEl = document.getElementById("touch");
  const pauseBtn = document.getElementById("pauseBtn");
  let pxRatio = 1, touchMode = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  function resize() {
    const portrait = window.innerHeight > window.innerWidth;
    const showTouch = touchMode && isPlaying();
    touchEl.style.display = showTouch ? "flex" : "none";
    touchEl.classList.toggle("small", !portrait && window.innerHeight < 480);
    wrapEl.style.paddingBottom = showTouch && portrait ? "calc(170px + env(safe-area-inset-bottom, 0px))" : "0";
    let availW = window.innerWidth - 8, availH = window.innerHeight - 8;
    if (showTouch && portrait) availH -= 170;
    if (showTouch && !portrait) {
      const side = Math.max(...[...touchEl.children].map((el) => el.offsetWidth)) + 20;
      if (window.innerWidth - 2 * side > 200) availW = window.innerWidth - 2 * side;
    }
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    pxRatio = Math.min(3, s * (window.devicePixelRatio || 1));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
    canvas.width = Math.round(W * pxRatio);
    canvas.height = Math.round(H * pxRatio);
  }
  window.addEventListener("resize", () => syncControls());

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }
  const arp = (notes, gap, d, type = "square", vol = 0.04) => notes.forEach((f, i) => beep(f, d, type, vol, 0, i * gap));
  let sfxN = 0;
  const lim = (fn) => (...a) => { if (sfxN++ < 6) fn(...a); };
  const sfx = {
    shot: lim(() => noise(0.05, 0.06, 2600)),
    enemyShot: lim(() => noise(0.06, 0.05, 1400)),
    hit: lim(() => beep(180, 0.08, "square", 0.04, -80)),
    clang: lim(() => beep(700, 0.05, "square", 0.025, -300)),
    throw: lim(() => beep(420, 0.12, "triangle", 0.03, 260)),
    boom: lim(() => { noise(0.4, 0.3, 300); beep(70, 0.3, "sine", 0.08, -40); }),
    jeep: lim(() => beep(110, 0.5, "sawtooth", 0.02, 40)),
    warn: lim(() => arp([880, 660], 0.08, 0.07, "square", 0.025)),
    pick: lim(() => arp([659, 988], 0.05, 0.08, "square", 0.03)),
    free: () => arp([523, 659, 784, 1047, 1319], 0.06, 0.12),
    die: () => { noise(0.3, 0.3, 900); arp([440, 370, 311, 262, 196], 0.08, 0.14, "triangle", 0.05); },
    clear: () => arp([392, 523, 659, 784, 659, 784, 1047, 1319], 0.1, 0.16),
    start: () => arp([392, 392, 523, 392, 523, 659, 784], 0.1, 0.12),
    over: () => arp([523, 466, 415, 392, 330, 262], 0.15, 0.24, "triangle", 0.05),
  };

  // ---------- State ----------
  let difficulty = DIFFICULTIES[load(DIFF_KEY)] ? load(DIFF_KEY) : "normale";
  let diff = DIFFICULTIES[difficulty];
  let state = "menu", menu = null, pausedFrom = null, stateT = 0, clock = 0;
  let score = 0, lives = 3, level = 0, loop = 0, bombs = 5, bestCache = 0, nextLife = 20000, freed = 0;
  let grid = new Uint8Array(ROWS * COLS), P = null, camY = D - H, spawnT = 0, wave = null, gateT = 0;
  let soldiers = [], pending = [], bunkers = [], roads = [], jeeps = [], prisoners = [], crates = [], rubble = [];
  let bullets = [], shots = [], grenades = [], blasts = [], parts = [], popups = [], message = null;
  let firing = false, bombPressed = false;
  const keys = { left: false, right: false, up: false, down: false };
  const stick = { x: 0, y: 0 };
  const theme = () => THEMES[level % THEMES.length];
  const pace = () => diff.pace * (1 + loop * 0.2 + (level % THEMES.length) * 0.05);

  // ---------- The battlefield ----------
  const tile = (r, c) => (r < 0 ? WALL : r >= ROWS ? FLOOR : grid[r * COLS + clamp(c, 0, COLS - 1)]);
  const setTile = (r, c, t) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) grid[r * COLS + c] = t; };
  const tileAt = (x, y) => tile(Math.floor(y / T), Math.floor(x / T));
  function blockedBox(x, y, h) {
    for (let r = Math.floor((y - h) / T); r <= Math.floor((y + h - 0.01) / T); r++)
      for (let c = Math.floor((x - h) / T); c <= Math.floor((x + h - 0.01) / T); c++) if (blocksMove(tile(r, c))) return true;
    return false;
  }
  function lineClear(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 6);
    for (let i = 1; i < n; i++) if (blocksShot(tileAt(ax + (bx - ax) * i / n, ay + (by - ay) * i / n))) return false;
    return true;
  }
  function buildLevel() {
    grid = new Uint8Array(ROWS * COLS);
    soldiers = []; pending = []; bunkers = []; roads = []; jeeps = []; prisoners = []; crates = []; rubble = [];
    bullets = []; shots = []; grenades = []; blasts = []; parts = []; popups = []; wave = null; gateT = 0;
    // the fort at the top: a wall with its gate
    for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++) setTile(r, c, WALL);
    for (let c = 0; c < COLS; c++) setTile(3, c, c >= 6 && c <= 8 ? GATE : WALL);
    // the yard in front of the fort: a little cover, nothing more
    for (const c of [1, 2, 12, 13]) setTile(11, c, BAGS);
    for (const c of [5, 6, 8, 9]) setTile(17, c, BAGS);
    setTile(8, 0, ROCK); setTile(8, 14, ROCK); setTile(14, 3, ROCK); setTile(14, 11, ROCK);
    // the way there, from the bottom up
    const clump = (r, c) => { const w = irnd(1, 2), h = irnd(1, 2); for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) setTile(r - i, c + j, ROCK); };
    let r = ROWS - 12;
    const top = 28, lv = level % THEMES.length;
    while (r > top) {
      const prog = 1 - (r - top) / (ROWS - 12 - top);
      const opts = [["trees", 3], ["bags", 2.2], ["road", 1], ["bunker", 0.7 + lv * 0.25 + prog * 0.6], ["prisoner", 0.6]];
      if (prog > 0.15) opts.push(["river", 0.9]);
      let pick = Math.random() * opts.reduce((a, o) => a + o[1], 0), f = opts[0][0];
      for (const [k, w] of opts) { if ((pick -= w) < 0) { f = k; break; } }
      let h = 1;
      if (f === "trees") {
        h = 5; const n = irnd(4, 7);
        for (let i = 0; i < n; i++) clump(r - irnd(0, 3), irnd(0, COLS - 2));
      } else if (f === "bags") {
        // a line of sandbags with gaps, and soldiers waiting behind it
        let c = irnd(0, 3);
        while (c < COLS - 2) {
          const len = irnd(2, 4);
          for (let j = 0; j < len && c + j < COLS; j++) setTile(r, c + j, BAGS);
          if (Math.random() < 0.6) pending.push({ x: (c + len / 2) * T, y: (r - 0.5) * T, type: Math.random() < 0.3 ? "gren" : "rifle" });
          c += len + irnd(2, 4);
        }
      } else if (f === "river") {
        h = irnd(2, 3);
        for (let i = 0; i < h; i++) for (let c = 0; c < COLS; c++) setTile(r - i, c, WATER);
        const nb = Math.random() < 0.5 ? 1 : 2;
        for (let b = 0; b < nb; b++) { const c0 = nb === 1 ? irnd(3, 9) : b === 0 ? irnd(1, 4) : irnd(8, 11); for (let i = 0; i < h; i++) for (let j = 0; j < 3; j++) setTile(r - i, c0 + j, BRIDGE); }
        if (Math.random() < 0.6) pending.push({ x: rnd(40, W - 40), y: (r - h - 1) * T, type: "rifle" });
      } else if (f === "road") {
        h = 2;
        for (let i = 0; i < 2; i++) for (let c = 0; c < COLS; c++) setTile(r - i, c, ROAD);
        roads.push({ y: r * T, t: rnd(0.5, 2), warn: 0, dir: 1 });
      } else if (f === "bunker") {
        h = 2; const c = irnd(2, 11);
        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) setTile(r - i, c + j, BUNKER);
        bunkers.push({ x: (c + 1) * T, y: r * T, c, r, hp: 8, cool: rnd(1, 2), aimT: 0, aim: 0, flash: 0 });
        if (Math.random() < 0.5) { setTile(r, c - 1, BAGS); setTile(r, c + 2, BAGS); }
      } else if (f === "prisoner") {
        const c = irnd(2, 12);
        prisoners.push({ x: (c + 0.5) * T, y: (r + 0.5) * T, free: false, t: 0 });
        pending.push({ x: (c - 1) * T, y: (r - 1.5) * T, type: "rifle" }, { x: (c + 2) * T, y: (r - 1.5) * T, type: Math.random() < 0.5 ? "gren" : "rifle" });
      }
      r -= h;
      // open ground in between, with the odd tree and a crate now and then
      const gap = irnd(3, 5);
      for (let i = 0; i < gap; i++) if (Math.random() < 0.35) setTile(r - i, irnd(0, COLS - 1), ROCK);
      if (Math.random() < 0.18) crates.push({ x: (irnd(1, 13) + 0.5) * T, y: (r - irnd(0, gap - 1) + 0.5) * T });
      r -= gap;
    }
    makePassable();
    crates = crates.filter((k) => walkable(tileAt(k.x, k.y)));
    prisoners = prisoners.filter((k) => walkable(tileAt(k.x, k.y)));
    pending = pending.filter((k) => walkable(tileAt(k.x, k.y))).sort((a, b) => b.y - a.y);
  }
  // Every open tile must lead to the fort without ever stepping back down (the screen never
  // scrolls back): carve a way where a row is shut, and fill the dead-end pockets.
  function makePassable() {
    const good = new Uint8Array(ROWS * COLS);
    for (let c = 0; c < COLS; c++) good[4 * COLS + c] = walkable(tile(4, c)) ? 1 : 0;
    for (let r = 5; r < ROWS; r++) {
      for (let pass = 0; pass < 2; pass++) {
        let any = false, c = 0;
        while (c < COLS) {
          if (!walkable(tile(r, c))) { good[r * COLS + c] = 0; c++; continue; }
          let e = c, ok = false;
          while (e < COLS && walkable(tile(r, e))) { if (good[(r - 1) * COLS + e]) ok = true; e++; }
          for (let k = c; k < e; k++) good[r * COLS + k] = ok ? 1 : 0;
          if (ok) any = true;
          c = e;
        }
        if (any) break;
        // shut: open a way under a good tile above (never through a bunker)
        const cand = [];
        for (let k = 0; k < COLS; k++) if (good[(r - 1) * COLS + k] && tile(r, k) !== BUNKER) cand.push(k);
        const k = cand[Math.floor(Math.random() * cand.length)] ?? 7;
        for (const q of [k, k + (good[(r - 1) * COLS + k + 1] ? 1 : -1)]) if (q >= 0 && q < COLS && tile(r, q) !== BUNKER) setTile(r, q, tile(r, q) === WATER ? BRIDGE : FLOOR);
      }
    }
    for (let r = 5; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = tile(r, c);
      if (walkable(t) && !good[r * COLS + c]) setTile(r, c, t === BRIDGE ? WATER : t === ROAD ? ROAD : ROCK);
    }
  }

  // ---------- Flow ----------
  const isPlaying = () => ["intro", "play", "dead", "clear"].includes(state);
  function startGame() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }

    ctx.fillText(`ZONA ${level + 1} · ${theme().name.toUpperCase()}`, W / 2, 10);
    const k = clamp(1 - camY / (D - H), 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(W / 2 - 60, 19, 120, 5); ctx.fillStyle = "#8ad84a"; ctx.fillRect(W / 2 - 60, 19, 120 * k, 5);
    ctx.textAlign = "right"; ctx.font = "800 11px system-ui";
    ctx.fillStyle = "#ffb43a"; ctx.fillText(`💣${bombs}`, W - 8, 10);
    ctx.fillStyle = "#e03a2a"; ctx.fillText(`♥×${Math.max(0, lives)}`, W - 8, 23);
    ctx.textBaseline = "alphabetic";
  }
  function draw() {
    ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
    if (!P) { buildLevel(); P = { x: W / 2, y: D - 3.5 * T, face: -Math.PI / 2, inv: 0, cool: 0, bombCool: 0, walk: 0 }; camY = D - H; }
    if (state === "menu") camY = Math.max(0, camY - 0.4);
    drawGround();
    for (const k of crates) if (!k.taken) {
      const x = k.x, y = sy(k.y);
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(x - 6, y - 3, 14, 11);
      ctx.fillStyle = "#6a5a2a"; ctx.fillRect(x - 8, y - 6, 16, 12); ctx.fillStyle = "#8a7a3a"; ctx.fillRect(x - 8, y - 6, 16, 3);
      ctx.fillStyle = "#ffe04a"; ctx.font = "900 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("G", x, y + 4);
    }
    for (const q of prisoners) if (onScreen(q.x, q.y, 30)) drawPrisoner(q);
    for (const b of bunkers) if (!b.dead && onScreen(b.x, b.y, 40)) drawBunker(b);
    for (const s of soldiers) drawSoldier(s);
    if (state !== "menu") drawPlayer();
    for (const j of jeeps) drawJeep(j);
    drawSolids();
    for (const g of grenades) drawGrenade(g);
    for (const b of bullets) { ctx.fillStyle = "#3a2a0a"; ctx.beginPath(); ctx.arc(b.x, sy(b.y), 3, 0, TAU); ctx.fill(); ctx.fillStyle = "#fff4a0"; ctx.beginPath(); ctx.arc(b.x, sy(b.y), 1.8, 0, TAU); ctx.fill(); }
    for (const s of shots) {
      ctx.fillStyle = "rgba(255,90,40,0.35)"; ctx.beginPath(); ctx.arc(s.x, sy(s.y), 5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff8a3a"; ctx.beginPath(); ctx.arc(s.x, sy(s.y), 2.6, 0, TAU); ctx.fill();
    }
    for (const b of blasts) {
      const k = b.t / 0.45;
      ctx.fillStyle = `rgba(255,${Math.round(200 - k * 140)},60,${0.7 * (1 - k)})`; ctx.beginPath(); ctx.arc(b.x, sy(b.y), b.r * (0.5 + k * 0.6), 0, TAU); ctx.fill();
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, sy(p.y) - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
      ctx.textAlign = "center"; ctx.font = "900 11px system-ui";
      ctx.lineWidth = 3; ctx.strokeStyle = "#11160c"; ctx.strokeText(p.text, p.x, sy(p.y)); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, sy(p.y));
    }
    ctx.globalAlpha = 1;
    drawHud();
    if (message) {
      ctx.globalAlpha = Math.min(1, (2.4 - message.t) * 2);
      ctx.textAlign = "center"; ctx.font = "italic 900 26px system-ui";
      ctx.lineWidth = 5; ctx.strokeStyle = "#11160c"; ctx.strokeText(message.text, W / 2, 190); ctx.fillStyle = "#ffb43a"; ctx.fillText(message.text, W / 2, 190);
      if (message.sub) { ctx.font = "800 12px system-ui"; ctx.lineWidth = 4; ctx.strokeText(message.sub, W / 2, 212); ctx.fillStyle = "#f4f0e0"; ctx.fillText(message.sub, W / 2, 212); }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (isPlaying()) {
      acc += dt;
      while (acc >= STEP && isPlaying()) { update(STEP); acc -= STEP; }
    } else { acc = 0; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  syncControls();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
<script src="../../shared/iniziali.js" data-record="sergente-best-" data-kind="score"></script>
